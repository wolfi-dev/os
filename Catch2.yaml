package:
  name: Catch2
  version: "3.15.3"
  epoch: 1 # add test coverage
  description: "A modern, C++-native, test framework"
  copyright:
    - license: 'BSL-1.0'
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/catchorg/Catch2
      tag: v${{package.version}}
      expected-commit: 8b08d4d79514f45f7e4ce2a607ac9c94e920d1bb

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: Catch2-static
    description: "A modern, C++-native, test framework - static libraries"
    pipeline:
      - uses: split/static
    test:
      pipeline:
        - uses: test/tw/staticpackage

  - name: Catch2-dev
    description: "A modern, C++-native, test framework - development headers"
    pipeline:
      - uses: split/dev
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share
          mv "${{targets.destdir}}"/usr/share/Catch2 "${{targets.subpkgdir}}"/usr/share/
    test:
      pipeline:
        - uses: test/pkgconf

test:
  environment:
    contents:
      packages:
        - Catch2-dev
        - Catch2-static
        - build-base
  pipeline:
    - uses: test/tw/ldd-check
    - name: Compile and run a Catch2 test program
      runs: |
        cat > /tmp/test_catch2.cpp << 'EOF'
        #define CATCH_CONFIG_MAIN
        #include <catch2/catch_all.hpp>

        TEST_CASE("basic arithmetic", "[math]") {
            REQUIRE(1 + 1 == 2);
            REQUIRE(10 - 3 == 7);
        }

        TEST_CASE("string operations", "[string]") {
            std::string s = "hello";
            REQUIRE(s.size() == 5);
            REQUIRE(s == "hello");
        }
        EOF
        c++ -std=c++14 /tmp/test_catch2.cpp \
          $(pkg-config --cflags catch2-with-main) \
          $(pkg-config --libs catch2-with-main) \
          -o /tmp/test_catch2
        /tmp/test_catch2

update:
  enabled: true
  github:
    identifier: catchorg/Catch2
    strip-prefix: v
