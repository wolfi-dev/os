package:
  name: R-classInt
  version: 0.4.11
  epoch: 4 # go/wolfi-rsc/R-classInt
  description: Choose Univariate Class Intervals
  copyright:
    - license: GPL-2.0-only OR GPL-3.0-only
  dependencies:
    runtime:
      - R
      - R-e1071
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - R
      - R-dev
      - R-e1071
      - busybox

var-transforms:
  - from: ${{package.version}}
    match: ^(.+)\.(\d+)$
    replace: $1-$2
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cran/classInt
      tag: ${{vars.mangled-package-version}}
      expected-commit: 2a32e081c52b28deae75158884cc9a7bc817145d

  - uses: R/build
    with:
      package: classInt
      version: ${{vars.mangled-package-version}}

  - uses: strip

test:
  pipeline:
    - runs: |
        Rscript -e '
          library(classInt)

          # Test classIntervals with fixed style
          x <- c(1, 5, 10, 15, 20, 25, 30)
          ci <- classIntervals(x, n = 3, style = "fixed", fixedBreaks = c(0, 10, 20, 30))
          stopifnot(inherits(ci, "classIntervals"))
          stopifnot(length(ci$brks) == 4)

          # Test classIntervals with quantile style
          ci2 <- classIntervals(x, n = 3, style = "quantile")
          stopifnot(inherits(ci2, "classIntervals"))

          # Test findInterval functionality
          vals <- c(3, 12, 22)
          result <- findCols(classIntervals(vals, n = 2, style = "equal"))
          stopifnot(length(result) == length(vals))

          cat("classInt functional tests passed\n")
        '
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/usr/lib/R/lib/"

update:
  enabled: true
  ignore-regex-patterns:
    - 'R-.*'
  version-transform:
    - match: ^(.+)\-(\d+)$
      replace: $1.$2
  github:
    identifier: cran/classInt
    use-tag: true
