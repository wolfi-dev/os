package:
  name: R-proxy
  version: "0.4.29"
  epoch: 1
  description: Distance and similarity measures
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - R

environment:
  contents:
    packages:
      - R
      - R-dev
      - busybox
      - glibc-2.43-dev

var-transforms:
  - from: ${{package.version}}
    match: ^(.+)\.(\d+)$
    replace: $1-$2
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cran/proxy
      tag: ${{vars.mangled-package-version}}
      expected-commit: 1ff509455460062fbfc6ee289106710b00aa14f1

  - uses: R/build
    with:
      package: proxy
      version: ${{vars.mangled-package-version}}

  - uses: strip

test:
  pipeline:
    - name: Test proxy distance and similarity measures
      runs: |
        cat > /tmp/test-proxy.R <<'REOF'
        library(proxy)

        # Verify registered distance measures are available
        measures <- summary(pr_DB)
        if (length(measures) == 0) stop("No distance measures registered")

        # Compute Euclidean distance between two vectors
        # Use matrix(, nrow=1) so each vector is treated as a single observation
        x <- c(1, 2, 3)
        y <- c(4, 5, 6)
        d <- dist(matrix(x, nrow = 1), matrix(y, nrow = 1), method = "Euclidean")
        expected <- sqrt(27)
        if (abs(as.numeric(d) - expected) > 1e-10) {
          stop(paste("Euclidean distance mismatch: got", d, "expected", expected))
        }

        # Compute cosine similarity between two vectors
        s <- simil(rbind(x, y), method = "cosine")
        if (any(is.na(s))) stop("Cosine similarity returned NA")

        cat("proxy distance and similarity measures work correctly\n")
        REOF
        Rscript /tmp/test-proxy.R
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/usr/lib/R/lib/"

update:
  enabled: true
  ignore-regex-patterns:
    - 'R-.*'
  version-transform:
    - match: ^(.+)\-(\d+)$
      replace: $1.$2
  github:
    identifier: cran/proxy
    use-tag: true
