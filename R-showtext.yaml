package:
  name: R-showtext
  version: "0.9.8"
  epoch: 1 # enhanced test coverage
  description: Using Fonts More Easily in R Graphs
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - R
      - R-showtextdb
      - R-sysfonts
      - freetype
      - libpng
      - zlib
  resources:
    cpu: "2"
    memory: 2Gi

environment:
  contents:
    packages:
      - R
      - R-dev
      - R-showtextdb
      - R-sysfonts
      - busybox
      - freetype-dev
      - libpng-dev
      - zlib-dev

var-transforms:
  - from: ${{package.version}}
    match: ^(.+)\.(\d+)$
    replace: $1-$2
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cran/showtext
      tag: ${{vars.mangled-package-version}}
      expected-commit: 887cc2e654bf0e797a683bc36b3f95140e3ecbe6

  - uses: R/build
    with:
      package: showtext
      version: ${{package.version}}

  - uses: strip

test:
  pipeline:
    - runs: |
        Rscript -e '
          library(showtext)

          # Verify core functions are available
          stopifnot(is.function(showtext_auto))
          stopifnot(is.function(showtext_begin))
          stopifnot(is.function(showtext_end))
          stopifnot(is.function(showtext_opts))
          cat("showtext core functions verified\n")

          # Set and verify DPI option
          showtext_opts(dpi = 96)
          opts <- showtext_opts()
          stopifnot(opts$dpi == 96)
          cat("showtext_opts dpi:", opts$dpi, "\n")

          # Render text to a PNG file using showtext_begin/end
          png_file <- tempfile(fileext = ".png")
          png(png_file, width = 600, height = 400)
          showtext_begin()
          plot(1, type = "n", main = "showtext test", xlab = "", ylab = "")
          text(1, 1, "Hello showtext", family = "sans")
          showtext_end()
          dev.off()

          # Verify the PNG was created and is non-empty
          stopifnot(file.exists(png_file))
          stopifnot(file.info(png_file)$size > 0)
          cat("PNG rendered successfully, size:", file.info(png_file)$size, "bytes\n")

          cat("showtext functional test passed\n")
        '
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/usr/lib/R/lib/"

update:
  enabled: true
  ignore-regex-patterns:
    - 'R-.*'
  version-transform:
    - match: ^(.+)\-(\d+)$
      replace: $1.$2
  github:
    identifier: cran/showtext
    use-tag: true
