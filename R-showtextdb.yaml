package:
  name: R-showtextdb
  version: 3.0
  epoch: 3 # fix test: use system.file() to access font data
  description: Providing font files that can be used by the showtext package
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - R
      - R-sysfonts
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - R
      - R-dev
      - R-sysfonts
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cran/showtextdb
      tag: ${{package.version}}
      expected-commit: b1e4f2d1da68de68c1ade7d550d5334dcb62f510

  - uses: R/build
    with:
      package: showtextdb
      version: ${{package.version}}

  - uses: strip

test:
  pipeline:
    - runs: |
        Rscript -e '
          library(showtextdb)

          # Verify the package data directory exists and contains font files
          dir <- system.file(package = "showtextdb")
          stopifnot(nchar(dir) > 0)
          cat("showtextdb dir:", dir, "\n")

          # Verify the directory exists
          stopifnot(file.exists(dir))

          # Verify the directory contains files
          files <- list.files(dir, recursive = TRUE)
          stopifnot(length(files) > 0)
          cat("Files found:", length(files), "\n")

          cat("showtextdb functional test passed\n")
        '

update:
  enabled: true
  ignore-regex-patterns:
    - 'R-.*'
  github:
    identifier: cran/showtextdb
    use-tag: true
