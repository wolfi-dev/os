package:
  name: R-units
  version: "1.0.1"
  epoch: 1
  description: Measurement Units for R Vectors
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - R
      - Rcpp
      - udunits
  resources:
    cpu: "2"
    memory: 7Gi

environment:
  contents:
    packages:
      - R
      - R-dev
      - Rcpp
      - busybox
      - udunits-dev

var-transforms:
  - from: ${{package.version}}
    match: ^(.+)\.(\d+)$
    replace: $1-$2
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cran/units
      tag: ${{vars.mangled-package-version}}
      expected-commit: fc7a7389b65ae0552a77b63bfb264ebb09b597de

  - uses: R/build
    with:
      package: units
      version: ${{vars.mangled-package-version}}

  - uses: strip

test:
  pipeline:
    - name: Test units core functionality
      runs: |
        Rscript -e "
          library(units)

          # Test creating a quantity with units
          x <- set_units(1, 'm')
          stopifnot(inherits(x, 'units'))

          # Test unit conversion: 1 metre -> centimetres
          y <- set_units(x, 'cm')
          stopifnot(as.numeric(y) == 100)

          # Test arithmetic: 1 m + 200 cm = 3 m
          a <- set_units(1, 'm')
          b <- set_units(200, 'cm')
          result <- a + b
          stopifnot(as.numeric(set_units(result, 'm')) == 3)

          # Test unit label is preserved
          stopifnot(as.character(units(x)) == 'm')

          cat('units package functional tests passed\n')
        "
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/usr/lib/R/lib/"

update:
  enabled: true
  ignore-regex-patterns:
    - 'R-.*'
  version-transform:
    - match: ^(.+)\-(\d+)$
      replace: $1.$2
  github:
    identifier: cran/units
    use-tag: true
