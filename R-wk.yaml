package:
  name: R-wk
  version: "0.9.5"
  epoch: 2 # go/wolfi-rsc/R-wk
  description: Lightweight Well-Known Geometry Parsing
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - R
  resources:
    cpu: "2"
    memory: 2Gi

environment:
  contents:
    packages:
      - R
      - R-dev
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cran/wk
      tag: ${{package.version}}
      expected-commit: eefab896360fc5c56a93269dbb44e9c358a625be

  - uses: R/build
    with:
      package: wk
      version: ${{package.version}}

  - uses: strip

test:
  pipeline:
    - runs: |
        Rscript -e 'library(wk); stopifnot(is.function(wkt))'
        Rscript -e 'library(wk); stopifnot(is.function(wkb))'
        Rscript -e 'library(wk); stopifnot(is.function(xy))'
        Rscript -e 'library(wk); x <- xy(1, 2); stopifnot(inherits(x, "wk_xy"))'
        Rscript -e 'library(wk); x <- wkt("POINT (0 1)"); stopifnot(inherits(x, "wk_wkt"))'
        Rscript -e 'library(wk); x <- wkt("POINT (3 4)"); coords <- wk_coords(x); stopifnot(coords$x == 3, coords$y == 4)'
        Rscript -e 'library(wk); b <- wk_bbox(wkt("LINESTRING (1 2, 3 4)")); ub <- unclass(b); stopifnot(ub[["xmin"]] == 1, ub[["ymin"]] == 2, ub[["xmax"]] == 3, ub[["ymax"]] == 4)'
        echo "wk functional tests passed"
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/usr/lib/R/lib/"

update:
  enabled: true
  ignore-regex-patterns:
    - 'R-.*'
  github:
    identifier: cran/wk
    use-tag: true
