package:
  name: abi-dumper
  version: "1.4"
  epoch: 0
  description: Dump ABI of an ELF object containing DWARF debug info
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    runtime:
      - binutils
      - elfutils
      - universal-ctags
      - vtable-dumper

environment:
  contents:
    packages:
      - busybox
      - make
      - perl

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/lvc/abi-dumper
      tag: ${{package.version}}
      expected-commit: 9ed641529d411ca0f824175489c1f67ec924edae

  # The Makefile.pl installer requires DESTDIR + prefix to exist first.
  - runs: mkdir -p "${{targets.destdir}}/usr"

  - uses: autoconf/make-install

update:
  enabled: true
  github:
    identifier: lvc/abi-dumper

test:
  environment:
    contents:
      packages:
        - build-base
  pipeline:
    - name: Dump the ABI of a shared library with DWARF debug info
      runs: |
        cat > lib.c <<'EOF'
        int compute_sum(int a, int b) { return a + b; }
        double scale_value(double x) { return x * 2.0; }
        EOF
        gcc -g -Og -shared -fPIC -o liba.so lib.c
        abi-dumper liba.so -o ABI.dump -lver 1
        # The dump must record the exported symbols and their types
        grep -q "compute_sum" ABI.dump
        grep -q "scale_value" ABI.dump
        grep -q "SymbolInfo" ABI.dump
