package:
  name: act
  version: "0.2.92"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.3
  description: Run your GitHub Actions locally
  copyright:
    - license: MIT
  dependencies: {}
  checks: {}
  cpe: {}

capabilities: {}

environment:
  contents:
    packages:
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0dca768b2cb48b82487c5db2e55184c58815bbd9
      repository: https://github.com/nektos/act
      tag: v${{package.version}}

  - uses: bump
    with:
      deps: |-
        github.com/go-git/go-git/v5@v5.19.2
        chainguard.dev/apko@v1.4.5
        github.com/spf13/cobra@v1.10.2
        github.com/stretchr/testify@v1.12.1
        github.com/moby/sys/user@v0.4.1
      language: go

  - uses: go/build
    with:
      output: act
      packages: .
      go-package: go-1.27

  - uses: strip

update:
  enabled: true
  github:
    identifier: nektos/act
    strip-prefix: v

test:
  environment: {}
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: act
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: act
