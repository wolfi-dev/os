package:
  name: act
  version: "0.2.97"
  epoch: 0 # remove bogus apko pin
  description: Run your GitHub Actions locally
  copyright:
    - license: MIT
  dependencies: {}
  checks: {}
  cpe: {}

capabilities: {}

environment:
  contents:
    packages:
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2540ba6c49dfbafe167d655e4044921cd2ed19e7
      repository: https://github.com/nektos/act
      tag: v${{package.version}}

  - uses: auth/go

  - uses: bump
    with:
      deps: |-
        github.com/spf13/cobra@v1.10.2
        github.com/stretchr/testify@v1.12.1
      language: go

  - uses: go/build
    with:
      output: act
      packages: .
      go-package: go-1.27

  - uses: strip

update:
  enabled: true
  github:
    identifier: nektos/act
    strip-prefix: v

test:
  environment: {}
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: act
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: act
