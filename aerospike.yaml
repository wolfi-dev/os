package:
  name: aerospike
  version: "6.4.0.34"
  epoch: 1
  description: Aerospike Database Server - flash-optimized, in-memory, nosql database
  copyright:
    - license: AGPL-3.0-only
  resources:
    cpu: "7"
    memory: 10Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - coreutils
      - gmp-dev
      - libtool
      - openssl-hardened-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aerospike/aerospike-server
      tag: ${{package.version}}
      expected-commit: 00ad293d6492e3f4e863649ba41ee174d0049ffd

  - runs: git submodule update --init

  - runs: |
      # There's some OS detection that doesn't know about wolfi and gets the wrong path
      sed -i 's|ABSL_LIB_DIR = $(ABSL)/installation/lib$|ABSL_LIB_DIR = $(ABSL)/installation/lib64|g' make_in/Makefile.vars

      # Fix some warnings
      sed -i 's|COMMON_CFLAGS += -Wno-address-of-packed-member|COMMON_CFLAGS += -Wno-address-of-packed-member -Wno-use-after-free|g' make_in/Makefile.in

      git diff

  - runs: |
      export CFLAGS="-Wno-address-of-packed-member -Wno-use-after-free"
      export CXXFLAGS="$CFLAGS"
      export CPPFLAGS="$CFLAGS"
      make -j$(nproc)
      make tar

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin ${{targets.destdir}}/usr/share
      tar -C ${{targets.destdir}}/usr/share -xf pkg/packages/aerospike-server-community-${{package.version}}.tar.gz

      ln -sf /usr/share/aerospike-server/bin/asd ${{targets.destdir}}/usr/bin/asd
      ln -sf /usr/share/aerospike-server/bin/aerospike ${{targets.destdir}}/usr/bin/aerospike

  - uses: strip

update:
  enabled: true
  github:
    identifier: aerospike/aerospike-server
    tag-filter: 6.4.

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify binary symlinks and installation structure
      runs: |
        # Verify symlinks exist and point to the correct targets
        test -L /usr/bin/asd
        test -L /usr/bin/aerospike
        readlink /usr/bin/asd | grep -F "aerospike-server/bin/asd"
        readlink /usr/bin/aerospike | grep -F "aerospike-server/bin/aerospike"
        # Verify the actual binaries exist and are executable
        test -x /usr/share/aerospike-server/bin/asd
        test -x /usr/share/aerospike-server/bin/aerospike
        # Verify the share directory has expected content
        test -d /usr/share/aerospike-server
        echo "Installation structure verified"
    - name: Verify version output
      runs: |
        asd --version 2>&1 | grep -iE "aerospike|version|asd"
