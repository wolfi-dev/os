package:
  name: age
  version: "1.3.1"
  epoch: 16 # toolchain rebuild for  go-1.26-1.26.7
  description: A simple, modern and secure encryption tool (and Go library) with small explicit keys, no config options, and UNIX-style composability.
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  go-version: "1.26"

environment:
  contents:
    packages:
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/FiloSottile/age.git
      tag: v${{package.version}}
      expected-commit: b8564adb6d58329b8a3e267360ca2b0abc4efe1d

  - uses: bump
    with:
      deps: |-
        filippo.io/edwards25519@v1.1.1
        golang.org/x/crypto@v0.52.0
        golang.org/x/sys@v0.45.0
        golang.org/x/term@v0.43.0

  - uses: go/build/v2
    with:
      packages: ./cmd/age/
      output: age
      ldflags: |
        -X main.Version=${{package.version}}

  - uses: go/build/v2
    with:
      packages: ./cmd/age-keygen/
      output: age-keygen
      ldflags: |
        -X main.Version=${{package.version}}

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: "Encrypt and decrypt a secret"
      runs: |
        echo "Hello, World!" > data.txt
        age-keygen -o key.txt
        age -r $(grep 'public key' key.txt | awk '{ print $4 }') -o data.txt.age data.txt
        age -d -i key.txt data.txt.age > data_extracted.txt
        diff data.txt data_extracted.txt
        age --version
        age --help
        age-keygen --version
        age-keygen --help

update:
  enabled: true
  github:
    identifier: FiloSottile/age
    strip-prefix: v
