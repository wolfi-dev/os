package:
  name: amass
  version: "5.1.2"
  epoch: 0 # upstream-tests/go-test
  description: "attack surfaces and external asset discovery tools set"
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - go-1.27
      - libpostal-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/owasp-amass/amass
      tag: v${{package.version}}
      expected-commit: 0584fd6ba1327134ccca77b544d944be5c968935

  - uses: bump
    with:
      deps: |-
        filippo.io/edwards25519@v1.1.1
        github.com/jackc/pgx/v5@v5.9.2
        golang.org/x/net@v0.60.0
        google.golang.org/grpc@v1.83.2
        golang.org/x/text@v0.39.0
      language: go

  - name: Fix upstream hardcoded version constant
    runs: |
      # Upstream's afmt.Version is a const (cannot be set via -ldflags -X) and
      # was not updated for v5.1.2 (still "v5.1.1").
      sed -i 's|^\(\s*Version = \)"v[0-9][^"]*"|\1"v${{package.version}}"|' internal/afmt/print.go
      grep -q 'Version = "v${{package.version}}"' internal/afmt/print.go

  - uses: go/build
    with:
      packages: ./cmd/amass
      modroot: .
      output: amass
      ldflags: -X main.version=${{package.version}} -X main.commit=$(git rev-parse HEAD) -X main.date=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")
      go-package: go-1.27

  - uses: upstream-tests/go-test

  - uses: strip

update:
  enabled: true
  github:
    strip-prefix: v
    identifier: owasp-amass/amass

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: amass
    - uses: test/tw/help-check
      with:
        bins: amass
