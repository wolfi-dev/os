package:
  name: apko
  version: "1.4.12"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.3
  description: Build OCI images using APK directly without Dockerfile
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "1"
    memory: 7Gi

environment:
  contents:
    packages:
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/apko
      tag: v${{package.version}}
      expected-commit: 0c659afba7f7842a3b18cdd5108675455339912b

  - uses: bump
    with:
      language: go
      deps: chainguard.dev/sdk@v0.1.355

  - uses: go/build
    with:
      go-package: go-1.27
      output: apko
      packages: .
      ldflags: |
        -buildid= \
        -X sigs.k8s.io/release-utils/version.gitVersion=$(git describe --dirty --tags --always) \
        -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD) \
        -X sigs.k8s.io/release-utils/version.gitTreeState=$(shell git diff --quiet >/dev/null 2>&1 || echo "dirty" || echo "clean") \
        -X sigs.k8s.io/release-utils/version.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ')

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: apko
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: apko
    - runs: |
        cat <<'EOF' >> /tmp/wolfi-base.yaml
        contents:
          repositories:
            - https://apk.cgr.dev/chainguard
          packages:
            - wolfi-base

        cmd: /bin/sh -l

        archs:
        - x86_64
        - aarch64
        EOF

        apko build  /tmp/wolfi-base.yaml test test.tar

update:
  enabled: true
  github:
    identifier: chainguard-dev/apko
    strip-prefix: v
    use-tag: true
