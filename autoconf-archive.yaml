# Generated from https://git.alpinelinux.org/aports/plain/main/autoconf-archive/APKBUILD
package:
  name: autoconf-archive
  version: "2026.11.11"
  epoch: 0
  description: Collection of re-usable GNU Autoconf macros
  copyright:
    - license: GPL-3.0-or-later

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      expected-sha256: 2c18f15e2b3bb79e09622b27391df07d8608ce9f07fbfc7c1143fa683891ab26
      uri: https://ftp.gnu.org/gnu/autoconf-archive/autoconf-archive-${{package.version}}.tar.xz

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: autoconf-archive-doc
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
    description: autoconf-archive documentation
    # test added by a robot (doc)
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 142

test:
  pipeline:
    - uses: test/no-docs
    - name: Verify .m4 macro files are installed
      uses: test/tw/contains-files
      with:
        dir: /usr/share/aclocal/
        name: "*.m4"
