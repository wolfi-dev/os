package:
  name: aws-c-auth
  version: "1.0.1"
  epoch: 1 # openssl: 3.6->4.0
  description: "C99 library implementation of AWS client-side authentication: standard credentials providers and signing"
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - aws-c-cal-dev
      - aws-c-common-dev
      - aws-c-compression-dev
      - aws-c-http-dev
      - aws-c-io-dev
      - aws-c-sdkutils-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-2.44-dev
      - openssl-hardened-${{vars.openssl-version}}-dev
      - s2n-tls-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 05810b36e4731ec52432f050ed20851ba59f3df5
      repository: https://github.com/awslabs/aws-c-auth
      tag: v${{package.version}}

  # AWS_GET_VERSION_MODULE presets the module upstream locates with find_file()
  # before project(). -DCMAKE_PREFIX_PATH=/usr would do it too, but it puts
  # /usr/bin ahead of PATH when CMake picks the compiler, skipping the
  # /usr/local/bin wrappers (the eco-2.28 oldglibc gcc-wrapper, openssf).
  - uses: cmake/configure
    with:
      opts: |
        -DAWS_GET_VERSION_MODULE=/usr/lib/cmake/aws-c-common/modules/AwsGetVersion.cmake \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-auth-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-auth
    description: aws-c-auth dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-auth
    strip-prefix: v
    use-tag: true
