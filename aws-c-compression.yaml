package:
  name: aws-c-compression
  version: "0.3.2"
  epoch: 2
  description: C99 implementation of huffman encoding/decoding
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - aws-c-common-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - samurai

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d8264e64f698341eb03039b96b4f44702a9b3f83
      repository: https://github.com/awslabs/aws-c-compression
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-compression-dev
    pipeline:
      - uses: split/dev
    description: aws-c-compression dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - aws-c-compression-dev
        - aws-c-common-dev
        - build-base
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - name: Compile and run aws-c-compression test program
      runs: |
        cat > /tmp/test_compression.c << 'EOF'
        #include <aws/compression/compression.h>
        #include <aws/common/allocator.h>
        #include <stdio.h>

        int main(void) {
            struct aws_allocator *allocator = aws_default_allocator();
            aws_compression_library_init(allocator);
            printf("aws-c-compression initialized successfully\n");
            aws_compression_library_clean_up();
            return 0;
        }
        EOF
        cc /tmp/test_compression.c -o /tmp/test_compression \
          $(pkg-config --cflags --libs aws-c-compression) \
          && /tmp/test_compression

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-compression
    strip-prefix: v
    use-tag: true
