package:
  name: aws-c-compression
  version: "1.0.0"
  epoch: 2 # eco-2.28: drop CMAKE_PREFIX_PATH
  description: C99 implementation of huffman encoding/decoding
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - aws-c-common-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-2.44-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 891312c058e69a4d55f569f79dde1ee221982532
      repository: https://github.com/awslabs/aws-c-compression
      tag: v${{package.version}}

  # AWS_GET_VERSION_MODULE presets the module upstream locates with find_file()
  # before project(). -DCMAKE_PREFIX_PATH=/usr would do it too, but it puts
  # /usr/bin ahead of PATH when CMake picks the compiler, skipping the
  # /usr/local/bin wrappers (the eco-2.28 oldglibc gcc-wrapper, openssf).
  - uses: cmake/configure
    with:
      opts: |
        -DAWS_GET_VERSION_MODULE=/usr/lib/cmake/aws-c-common/modules/AwsGetVersion.cmake \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-compression-dev
    pipeline:
      - uses: split/dev
    description: aws-c-compression dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - aws-c-compression-dev
        - aws-c-common-dev
        - build-base
  pipeline:
    - uses: test/tw/ldd-check
    - name: Compile and run aws-c-compression test program
      runs: |
        cat > /tmp/test_compression.c << 'EOF'
        #include <aws/compression/compression.h>
        #include <aws/common/allocator.h>
        #include <stdio.h>

        int main(void) {
            struct aws_allocator *allocator = aws_default_allocator();
            aws_compression_library_init(allocator);
            printf("aws-c-compression initialized successfully\n");
            aws_compression_library_clean_up();
            return 0;
        }
        EOF
        # upstream ships no pkg-config file
        cc /tmp/test_compression.c -o /tmp/test_compression \
          -laws-c-compression -laws-c-common
        /tmp/test_compression

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-compression
    strip-prefix: v
    use-tag: true
