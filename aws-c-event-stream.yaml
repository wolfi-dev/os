package:
  name: aws-c-event-stream
  version: "1.0.0"
  epoch: 0 # add functional and devpackage tests
  description: "AWS C99 implementation of the vnd.amazon.eventstream content-type"
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - aws-c-cal-dev
      - aws-c-common-dev
      - aws-c-io-dev
      - aws-checksums-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-2.43-dev
      - openssl-hardened-dev
      - s2n-tls-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/awslabs/aws-c-event-stream
      tag: v${{package.version}}
      expected-commit: d32600bfecc6616cab0c478f96ea5a779f03e05e

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_PREFIX_PATH=/usr \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING="OFF" \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-event-stream-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-event-stream
    description: aws-c-event-stream dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - aws-c-event-stream-dev
        - aws-c-common-dev
        - build-base
  pipeline:
    - uses: test/tw/ldd-check
    - name: Compile and run aws-c-event-stream functional test
      runs: |
        tee test_event_stream.c <<'EOF'
        #include <aws/event-stream/event_stream.h>
        #include <aws/common/common.h>
        #include <stdio.h>

        int main(void) {
            struct aws_allocator *allocator = aws_default_allocator();
            aws_event_stream_library_init(allocator);
            printf("aws-c-event-stream library initialized successfully\n");
            aws_event_stream_library_clean_up();
            return 0;
        }
        EOF

        gcc test_event_stream.c -o test_event_stream \
            -laws-c-event-stream -laws-c-common \
            -I/usr/include -L/usr/lib

        ./test_event_stream | grep -F "aws-c-event-stream library initialized successfully"

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-event-stream
    strip-prefix: v
    use-tag: true
