package:
  name: aws-c-mqtt
  version: "1.1.2"
  epoch: 0 # raise provider-priority over aws-c-mqtt-fips
  description: AWS C99 implementation of the MQTT 3.1.1 specification
  copyright:
    - license: Apache-2.0
  dependencies:
    # aws-c-mqtt-fips provides the same so: name. Without a higher priority
    # the solver falls back to the higher release, which can be the FIPS
    # build, and that pulls s2n-tls-fips in alongside s2n-tls.
    provider-priority: 10
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - aws-c-cal-dev
      - aws-c-common-dev
      - aws-c-compression-dev
      - aws-c-http-dev
      - aws-c-io-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-2.44-dev
      - openssl-hardened-${{vars.openssl-version}}-dev
      - s2n-tls-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 96af751fa58d4d6704881463a4d6895b107268ed
      repository: https://github.com/awslabs/aws-c-mqtt
      tag: v${{package.version}}

  # AWS_GET_VERSION_MODULE presets the module upstream locates with find_file()
  # before project(). -DCMAKE_PREFIX_PATH=/usr would do it too, but it puts
  # /usr/bin ahead of PATH when CMake picks the compiler, skipping the
  # /usr/local/bin wrappers (the eco-2.28 oldglibc gcc-wrapper, openssf).
  - uses: cmake/configure
    with:
      opts: |
        -DAWS_GET_VERSION_MODULE=/usr/lib/cmake/aws-c-common/modules/AwsGetVersion.cmake \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-mqtt-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-mqtt
    description: aws-c-mqtt dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-mqtt
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - aws-c-cal-dev
        - aws-c-common-dev
        - aws-c-http-dev
        - aws-c-io-dev
        - build-base
        - gcc
        - aws-c-mqtt-dev
  pipeline:
    - uses: test/tw/ldd-check
    - name: "Compile simple MQTT test program"
      runs: |
        cat << 'EOF' > test.c
        #include <aws/mqtt/mqtt.h>
        #include <aws/common/common.h>

        int main() {
            struct aws_allocator *allocator = aws_default_allocator();
            aws_mqtt_library_init(allocator);
            aws_mqtt_library_clean_up();
            return 0;
        }
        EOF
        gcc -o test test.c -laws-c-mqtt -laws-c-common -laws-c-io -laws-c-cal
        ./test
