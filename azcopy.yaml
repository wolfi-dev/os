package:
  name: azcopy
  version: "10.34.1"
  epoch: 0 # CVE-2026-78659
  description: The new Azure Storage data transfer utility
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Azure/azure-storage-azcopy
      tag: v${{package.version}}
      expected-commit: 39083e963e007a879b5ce096f62083af4f209c0c

  - uses: bump
    with:
      language: go
      deps: |-
        golang.org/x/net@v0.60.0
        golang.org/x/sys@v0.48.0

  - uses: go/build
    with:
      packages: .
      output: azcopy
      go-package: go-1.27

  - uses: strip

update:
  enabled: true
  github:
    identifier: Azure/azure-storage-azcopy
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: azcopy
    - uses: test/tw/help-check
      with:
        bins: azcopy
        expect-contains: copy sync list bench
    - name: Verify env subcommand
      runs: |
        # azcopy env lists supported environment variables
        azcopy env 2>&1 | grep -Fi "AZCOPY"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - go-1.27
