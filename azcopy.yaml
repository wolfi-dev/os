package:
  name: azcopy
  version: "10.32.7"
  epoch: 2 # toolchain rebuild for  go-1.26-1.26.7
  description: The new Azure Storage data transfer utility
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Azure/azure-storage-azcopy
      tag: v${{package.version}}
      expected-commit: 96a83216c1e34f291ee93fbaca614ed010c90b23

  - uses: bump
    with:
      deps: |-
        google.golang.org/grpc@v1.82.1

  - uses: go/build
    with:
      packages: .
      output: azcopy
      go-package: go-1.26

  - uses: strip

update:
  enabled: true
  github:
    identifier: Azure/azure-storage-azcopy
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: azcopy
    - uses: test/tw/help-check
      with:
        bins: azcopy
        expect-contains: copy sync list bench
    - name: Verify env subcommand
      runs: |
        # azcopy env lists supported environment variables
        azcopy env 2>&1 | grep -Fi "AZCOPY"

environment:
  contents:
    packages:
      - go-1.26
