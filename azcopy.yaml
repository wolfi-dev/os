package:
  name: azcopy
  version: "10.34.2"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.4
  description: The new Azure Storage data transfer utility
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Azure/azure-storage-azcopy
      tag: v${{package.version}}
      expected-commit: c3ca337678889b4c58b1e588eda4d15db0ddaf72

  - uses: go/build
    with:
      packages: .
      output: azcopy
      go-package: go-1.27

  - uses: strip

update:
  enabled: true
  github:
    identifier: Azure/azure-storage-azcopy
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: azcopy
    - uses: test/tw/help-check
      with:
        bins: azcopy
        expect-contains: copy sync list bench
    - name: Verify env subcommand
      runs: |
        # azcopy env lists supported environment variables
        azcopy env 2>&1 | grep -Fi "AZCOPY"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - go-1.27
