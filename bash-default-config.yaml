package:
  name: bash-default-config
  version: 1.0.0
  epoch: 4 # rebuild to publish bash-default-config-source
  description: "Bash default configuration"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - bash
  resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - runs: |
      mkdir -p "${{targets.destdir}}"/etc
      cp bashrc "${{targets.contextdir}}"/etc/bash.bashrc

update:
  enabled: false
  exclude-reason: "This package contains a static configuration file, no updates are needed."

test:
  pipeline:
    - runs: |
        # Syntax check it
        bash -n /etc/bash.bashrc
        # Source it
        bash -c '. /etc/bash.bashrc'
