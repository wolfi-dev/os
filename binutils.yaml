#nolint:git-checkout-must-use-github-updates
package:
  name: binutils
  version: "2.47"
  epoch: 4 # install libiberty for static libbfd consumers
  cpe:
    vendor: "gnu"
    product: "binutils"
  description: "GNU binutils"
  copyright:
    - license: GPL-2.0
  resources:
    cpu: 16
    memory: 16Gi

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - flex
      - glibc-2.44-dev
      - isl
      - posix-libc-utils
      - texinfo
      - wolfi-baselayout
      - zlib-dev
      - zstd-dev

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: _
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/gnutools/binutils-gdb.git
      tag: binutils-${{vars.mangled-package-version}}
      expected-commit: 6ce87bbc521cf46eaee9a1f7ef61cee2cdfb3e32

  - name: 'Configure binutils'
    runs: |
      ./configure \
        --prefix=/usr \
        --build=$(./config.guess) \
        --host=${{host.triplet.gnu}} \
        --target=${{host.triplet.gnu}} \
        --disable-nls \
        --disable-werror \
        --disable-multilib \
        --disable-gprofng \
        --disable-gdb \
        --disable-gdbserver \
        --disable-sim \
        --enable-deterministic-archives \
        --enable-ld=default \
        --enable-gold \
        --enable-plugins \
        --enable-install-libiberty \
        --enable-default-execstack=no \
        --enable-default-hash-style=gnu \
        --enable-textrel-check=error \
        --with-system-zlib

  - uses: autoconf/make

  - uses: autoconf/make-install

  # libiberty installs into the compiler's multi-OS directory (../lib64); usr/lib64
  # is a symlink owned by wolfi-baselayout, so packages must not create it.
  - name: 'Move libiberty to usr/lib'
    runs: |
      if [ -d "${{targets.destdir}}"/usr/lib64 ]; then
        mv "${{targets.destdir}}"/usr/lib64/* "${{targets.destdir}}"/usr/lib/
        rmdir "${{targets.destdir}}"/usr/lib64
      fi
      test -f "${{targets.destdir}}"/usr/lib/libiberty.a

  - name: 'Clean up documentation'
    runs: |
      rm -rf ${{targets.destdir}}/usr/share/info

  - uses: strip

subpackages:
  - name: "binutils-dev"
    description: "binutils development headers"
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - build-base
            - zlib-dev
            - zstd-dev
      pipeline:
        - uses: test/tw/devpackage
        # libbfd.a references libiberty (hashtab, objalloc, lrealpath, ...).
        - name: Static libbfd links with libiberty
          runs: |
            cat > bfdtest.c <<'EOF'
            /* bfd.h #errors unless PACKAGE or PACKAGE_VERSION is defined (PR 14072). */
            #define PACKAGE "bfdtest"
            #define PACKAGE_VERSION "0"
            #include <bfd.h>
            #include <stdio.h>

            int main(int argc, char **argv) {
              bfd_init();
              bfd *abfd = bfd_openr(argv[0], NULL);
              if (abfd == NULL || !bfd_check_format(abfd, bfd_object))
                return 1;
              printf("%s\n", bfd_get_target(abfd));
              return bfd_close(abfd) ? 0 : 1;
            }
            EOF
            gcc bfdtest.c -o bfdtest -l:libbfd.a -l:libsframe.a -l:libiberty.a -lz -lzstd -ldl
            ./bfdtest | grep -E '^elf(32|64)-'

  - name: "binutils-gold"
    description: "binutils (gold linker)"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/ld.gold "${{targets.subpkgdir}}"/usr/bin/
    test:
      pipeline:
        - runs: |
            ld.gold --version
            ld.gold --help

  - name: binutils-doc
    description: binutils documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  version-transform:
    - match: _
      replace: .
  git:
    tag-filter-prefix: binutils-
    strip-prefix: binutils-

test:
  pipeline:
    - name: Verify no gdb or gdbserver
      runs: |
        set +x
        fails=""
        for p in gdb gdbserver; do
          if ! out=$(command -v "$p"); then
            echo "PASS: package does not contain '$p'"
            continue
          fi
          echo "FAIL: package contains $p:  $out"
          fails="$fails $out"
        done
        [ -z "$fails" ] || exit 1
    - uses: test/tw/ver-check
      with:
        bins: |
          addr2line
          ar
          as
          c++filt
          dwp
          elfedit
          gprof
          ld
          ld.bfd
          nm
          objcopy
          objdump
          ranlib
          readelf
          size
          strings
          strip
    - uses: test/tw/help-check
      with:
        bins: |
          addr2line
          ar
          as
          c++filt
          dwp
          elfedit
          gprof
          ld
          ld.bfd
          nm
          objcopy
          objdump
          ranlib
          readelf
          size
          strings
          strip
    - uses: test/tw/ldd-check
    - name: Verify zlib is linked from the system, not bundled
      runs: |
        readelf --dynamic /usr/bin/ld | grep NEEDED | grep 'libz\.so'
    # Assemble (as) and link (ld) a hello program with the binutils under
    # test; howdy-yall 2.6+ uses GNU as on both x86_64 and aarch64.
    - uses: test/compiler/howdy
      with:
        lang: asm
