package:
  name: bmake
  version: "20260714"
  epoch: 0 # glibc: 2.43->2.44
  description: Portable version of the NetBSD make build tool
  copyright:
    - license: BSD-2-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - tzdata

pipeline:
  - uses: fetch
    with:
      uri: https://www.crufty.net/ftp/pub/sjg/bmake-${{package.version}}.tar.gz
      expected-sha256: 0810781d24ad6efe010a8ce91c5c529dc8dd95a561d6c93b30e56b8d679cce65
      strip-components: 0

  - runs: |
      ./bmake/boot-strap \
        --prefix=/usr \
        --install-destdir=${{targets.destdir}} \
        --install

  - uses: strip

subpackages:
  - name: bmake-doc
    pipeline:
      - uses: split/manpages
    description: bmake manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    # sjg20/bmake is not a real GitHub repo; track the crufty.net source via Anitya.
    identifier: 208

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        # bmake uses '-V VARIABLE' to print variable values; MAKE_VERSION holds the version string
        bmake -r -f /dev/null -V MAKE_VERSION | grep -F "${{package.version}}"
    - name: build a simple Makefile with bmake
      runs: |
        mkdir -p /tmp/bmake-test
        printf 'MSG = hello from bmake\n\nall:\n\t@echo ${MSG}\n' > /tmp/bmake-test/Makefile
        out=$(bmake -C /tmp/bmake-test all)
        echo "bmake output: $out"
        echo "$out" | grep -F "hello from bmake"
    - uses: test/no-docs
