package:
  name: bpftool
  version: "7.7.0"
  epoch: 5 # glibc: 2.43->2.44
  description: A collection of tool to inspect and manipulate eBPF programs
  copyright:
    - license: BSD-3-Clause OR GPL-2.0-only
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - clang-${{vars.llvm-version}}
      - elfutils-dev
      - git
      - glibc-2.44-dev
      - linux-headers
      - openssl-hardened-dev
      - zlib-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/libbpf/bpftool
      tag: v${{package.version}}
      expected-commit: 4222ef1c8cdb0a1ea03c7a8c650ec334b782902d
      recurse-submodules: true

  - runs: |
      cd src
      make
      DESTDIR=${{targets.destdir}} prefix=/usr make install
      mkdir -p ${{targets.destdir}}/usr/bin
      mv ${{targets.destdir}}/usr/sbin/* ${{targets.destdir}}/usr/bin
      rmdir ${{targets.destdir}}/usr/sbin

  - uses: strip

update:
  enabled: true
  github:
    identifier: libbpf/bpftool
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        bpftool --version
        bpftool --help
    - name: Test BTF dump from ELF file
      runs: |
        # bpftool can dump BTF type information from ELF files without
        # kernel access. Use the bpftool binary itself as a test subject.
        # Capture combined stdout+stderr; the binary may or may not have embedded BTF.
        bpftool btf dump file /usr/bin/bpftool format raw 2>&1 > /tmp/btf_raw.txt || true
        bpftool btf dump file /usr/bin/bpftool 2>&1 >> /tmp/btf_raw.txt || true
        if ! grep -iE "^(int|ptr|array|struct|union|enum|fwd|typedef|volatile|const|restrict|func|func_proto|var|datasec|float|decl_tag|type_tag|enum64)|\[|BTF|type" /tmp/btf_raw.txt; then
          echo "BTF dump produced no recognisable output; binary may not have embedded BTF"
          echo "--- captured output ---"
          cat /tmp/btf_raw.txt
        fi
    - name: Test feature probe output
      runs: |
        # bpftool feature probe produces structured output about BPF capabilities.
        # Even in a container, it should enumerate syscall and helper availability.
        # Capture combined stdout+stderr; the subcommand may vary by kernel version.
        bpftool feature probe 2>&1 > /tmp/feature.txt || true
        bpftool feature 2>&1 >> /tmp/feature.txt || true
        grep -iE "(bpf_syscall|helper|map_type|prog_type|eBPF|bpf|feature|probe|kernel)" /tmp/feature.txt

vars:
  llvm-version: 22
