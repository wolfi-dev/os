package:
  name: brunsli
  version: 0.1
  epoch: 8 # CVE-2026-111497
  description: Practical JPEG Repacker
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - brotli-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake-3
      - glibc-2.44-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google/brunsli
      tag: v${{package.version}}
      expected-commit: 8a0e9b8ca2e3e089731c95a1da7ce8a3180e667c
      recurse-submodules: true

  # third_party/brotli is google/brotli 35ef5c55 (2019), affected by
  # CVE-2026-111497. Link Wolfi's fixed system Brotli instead, and delete the
  # submodule so the build cannot fall back to it.
  - uses: patch
    with:
      patches: system-brotli.patch

  - runs: rm -rf third_party/brotli

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: brunsli-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage

update:
  enabled: true
  github:
    identifier: google/brunsli
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - binutils
  pipeline:
    - uses: test/tw/ldd-check
    - name: Links the system Brotli
      runs: |
        readelf -d /usr/lib/libbrunslidec-c.so | grep -q 'NEEDED.*\[libbrotlidec\.so\.1\]'
        readelf -d /usr/lib/libbrunslienc-c.so | grep -q 'NEEDED.*\[libbrotlienc\.so\.1\]'
