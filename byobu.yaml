package:
  name: byobu
  version: "7.17"
  epoch: 0
  description: "open source text-based window manager and terminal multiplexer"
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - gawk
      - iproute2
      - openssl
      - posix-libc-utils
      - py${{vars.python-version}}-cryptography
      - py${{vars.python-version}}-tornado
      - python-${{vars.python-version}}
      - qrencode
      - tmux

vars:
  python-version: '3.13'

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dustinkirkland/byobu
      expected-commit: cd6dfa0e4918573e03d9881c7750640693c2d15f
      tag: ${{package.version}}

  - runs: autoreconf -vif

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - name: edit shbang for python
    runs: |
      d=${{targets.destdir}}
      set -- \
         usr/bin/trustmux usr/bin/trustmuxd usr/lib/byobu/include/config.py \
         usr/lib/byobu/include/select-session.py usr/lib/trustmux/trustmux/_daemon.py
      for p in "$@"; do
         sed -i -e '1s,^#!.*python3$,#!/usr/bin/python${{vars.python-version}},' "$d/$p"
      done

  - uses: strip

update:
  enabled: true
  github:
    identifier: dustinkirkland/byobu
    use-tag: true

test:
  environment:
    contents:
      packages:
        - check-shbang
        - curl
        - man-db
        - ${{package.name}}-doc
  pipeline:
    - runs: |
        byobu-enable
        byobu-disable
        byobu-janitor -f
    - runs: |
        cd /
        check-shbang python${{vars.python-version}} \
         usr/bin/trustmux usr/bin/trustmuxd usr/lib/byobu/include/config.py \
         usr/lib/byobu/include/select-session.py usr/lib/trustmux/trustmux/_daemon.py
    # --self-signed exercises trustmuxd's cryptography import, which a --help
    # style test does not reach.
    - name: trustmuxd serves https with a self-signed cert
      uses: test/daemon-check-output
      with:
        start: /usr/bin/trustmuxd --host=127.0.0.1 --port=7432 --self-signed
        expected_output: |
          Trustmux daemon on https://
        post: |
          wait-for-it 127.0.0.1:7432 -t 10
          # cert is self-signed, so -k; /ping answers 401 when unpaired.
          curl -sk https://127.0.0.1:7432/ping | grep -F '"auth"'
    - uses: test/no-docs

subpackages:
  - name: byobu-doc
    description: byobu documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/tw/docs
