package:
  name: cargo-audit
  version: "0.22.2"
  epoch: 3 # GHSA-4w2j-m93h-cj5j
  description: Audit your dependencies for crates with security vulnerabilities reported to the RustSec Advisory Database.
  copyright:
    - license: MIT OR Apache-2.0

vars:
  rust-version: "1.94"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cargo-auditable
      - glibc-2.43-dev
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rustsec/rustsec
      tag: cargo-audit/v${{package.version}}
      expected-commit: 281452c35cf0870969042374110f099a411bc185

  - uses: bump
    with:
      deps: |-
        rustls@0.23.18
        hashbrown@0.15.0=0.15.1
        url@2.5.4
        ring@0.17.13
        tokio@1.43.1
        crossbeam-channel@0.5.15
        tracing-subscriber@0.3.20
        bytes@1.11.1
        time@0.3.47
        aws-lc-rs@1.16.2
        quinn-proto@0.11.15
        rustls-webpki@0.103.13
        rand@0.9.3

  - runs: |
      cd cargo-audit
      cargo auditable build --release
       # Install cargo-audit
      install -Dm755 ../target/release/cargo-audit -t "${{targets.destdir}}"/usr/bin/

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - 'rustsec'
    - 'platform'
  github:
    identifier: rustsec/rustsec
    use-tag: true
    strip-prefix: cargo-audit/v
    tag-filter-prefix: "cargo-audit/v"

test:
  pipeline:
    - name: Cargo audit binary check
      runs: |
        cargo-audit --version || exit 1
        cargo-audit --help
    - uses: test/no-docs
