package:
  name: cargo-fuzz
  version: "0.13.2"
  epoch: 0
  description: A cargo subcommand for fuzzing with libFuzzer
  copyright:
    - license: MIT OR Apache-2.0

vars:
  rust-version: "1.99"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cargo-auditable
      - glibc-2.44-dev
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rust-fuzz/cargo-fuzz
      tag: ${{package.version}}
      expected-commit: 984c861c8dfea28055254c5f1d2659ab2cd63f76

  - uses: cargo/build
    with:
      output: cargo-fuzz

  - uses: strip

update:
  enabled: true
  github:
    identifier: rust-fuzz/cargo-fuzz

test:
  environment:
    contents:
      packages:
        - rust-${{vars.rust-version}}
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: cargo-fuzz
    - uses: test/tw/ver-check
      with:
        bins: cargo-fuzz
    - name: Verify cargo finds the fuzz subcommand
      runs: |
        cargo fuzz --version | grep -F "cargo-fuzz ${{package.version}}"
        cargo fuzz --help | grep -F "init"
    - name: Initialize a fuzz directory and manage fuzz targets
      runs: |
        cd "$(mktemp -d)"
        cargo new --lib --vcs none demo
        cd demo
        cargo fuzz init --target first
        test -f fuzz/Cargo.toml
        test -f fuzz/fuzz_targets/first.rs
        grep -F "libfuzzer-sys" fuzz/Cargo.toml
        grep -F "fuzz_target!" fuzz/fuzz_targets/first.rs

        cargo fuzz add second
        test -f fuzz/fuzz_targets/second.rs
        grep -F 'name = "second"' fuzz/Cargo.toml

        cargo fuzz list > targets.txt
        cat targets.txt
        grep -x first targets.txt
        grep -x second targets.txt
        test "$(wc -l < targets.txt)" -eq 2

        # Adding a target that already exists must fail.
        if cargo fuzz add first; then
          echo "cargo fuzz add accepted a duplicate target" >&2
          exit 1
        fi
