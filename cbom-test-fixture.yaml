package:
  name: cbom-test-fixture
  version: "1"
  epoch: 0
  description: "Test CBOM for exercising CycloneDX CBOM merging into image SBOMs; describes no real cryptography."
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      mkdir -p "${{targets.contextdir}}"/var/lib/db/cbom
      cat > "${{targets.contextdir}}"/var/lib/db/cbom/${{package.name}}.cdx.json <<EOF
      {
        "\$schema": "http://cyclonedx.org/schema/bom-1.7.schema.json",
        "bomFormat": "CycloneDX",
        "specVersion": "1.7",
        "version": 1,
        "metadata": {
          "tools": {
            "components": [
              {
                "type": "application",
                "name": "cbom-test-fixture",
                "description": "Hand-written test CBOM; describes no real cryptography."
              }
            ]
          },
          "component": {
            "bom-ref": "pkg:apk/wolfi/cbom-test-fixture@${{package.full-version}}",
            "type": "application",
            "name": "cbom-test-fixture",
            "version": "${{package.full-version}}",
            "purl": "pkg:apk/wolfi/cbom-test-fixture@${{package.full-version}}"
          }
        },
        "components": [
          {
            "bom-ref": "library/cbom-test-fixture/provider@1",
            "type": "library",
            "name": "CBOM Test Fixture Provider",
            "version": "1",
            "description": "Test cryptographic module; implements nothing."
          },
          {
            "bom-ref": "crypto/algorithm/sha-256@2.16.840.1.101.3.4.2.1@cbom-test-fixture",
            "type": "cryptographic-asset",
            "name": "SHA-256",
            "cryptoProperties": {
              "assetType": "algorithm",
              "oid": "2.16.840.1.101.3.4.2.1",
              "algorithmProperties": {
                "primitive": "hash",
                "algorithmFamily": "SHA-2",
                "parameterSetIdentifier": "256",
                "cryptoFunctions": ["digest"]
              }
            }
          }
        ],
        "dependencies": [
          {
            "ref": "pkg:apk/wolfi/cbom-test-fixture@${{package.full-version}}",
            "dependsOn": ["library/cbom-test-fixture/provider@1"]
          },
          {
            "ref": "library/cbom-test-fixture/provider@1",
            "provides": ["crypto/algorithm/sha-256@2.16.840.1.101.3.4.2.1@cbom-test-fixture"]
          }
        ]
      }
      EOF

update:
  enabled: false
  exclude-reason: "This is a static, hand-written test fixture CBOM used to exercise CycloneDX CBOM merging in e2e tests; it does not track any upstream project."

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - runs: |
        test -f /var/lib/db/cbom/cbom-test-fixture.cdx.json

        jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.7"' /var/lib/db/cbom/cbom-test-fixture.cdx.json

        purl="$(jq -r '.metadata.component.purl' /var/lib/db/cbom/cbom-test-fixture.cdx.json)"
        expected="pkg:apk/wolfi/cbom-test-fixture@${{package.full-version}}"
        if [ "$purl" != "$expected" ]; then
          echo "unexpected purl: $purl (expected $expected)"
          exit 1
        fi

        jq -e '[.components[] | select(.type == "cryptographic-asset")] | length == 1' /var/lib/db/cbom/cbom-test-fixture.cdx.json

        jq -e '[.components[] | select(.type == "library") | select(has("purl") or has("cpe"))] | length == 0' /var/lib/db/cbom/cbom-test-fixture.cdx.json
