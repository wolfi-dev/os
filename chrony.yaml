package:
  name: chrony
  version: "4.9"
  epoch: 2 # add chrony-dhcp
  description: NTP client and server programs
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    provider-priority: 5
    provides:
      - time-daemon
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 4Gi

environment:
  contents:
    packages:
      - asciidoctor
      - bash
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libcap-dev
      - libseccomp-dev
      - systemd
      - texinfo
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mlichvar/chrony
      tag: ${{package.version}}
      expected-commit: 8df4f1263e206585e6c4e61352d042c2dd12916a

  - uses: patch
    with:
      patches: 0001-util-cap-stdio-read-buffer-for-dev-urandom-at-256-by.patch

  - runs: |
      echo "${{package.version}}" > version.txt
      CPPFLAGS="$CPPFLAGS -I./pps-tools/" \
      CFLAGS="$CFLAGS -flto=auto" \
      ./configure \
      	--prefix=/usr \
      	--mandir=/usr/share/man \
      	--sysconfdir=/etc/chrony \
      	--chronyrundir=/run/chrony \
      	--disable-readline \
      	--with-user=chrony \
      	--with-sendmail=/usr/bin/sendmail \
      	--enable-scfilter \
        --sbindir=/usr/bin
      make all docs

  - runs: |
      make DESTDIR="${{targets.destdir}}" install
      install -Dm644 examples/chrony.logrotate ${{targets.destdir}}/etc/logrotate.d/chrony
      install -Dm644 examples/chronyd.service ${{targets.destdir}}/usr/lib/systemd/system/chronyd.service
      install -Dm644 examples/chrony-wait.service ${{targets.destdir}}/usr/lib/systemd/system/chrony-wait.service
      install -Dm644 ./chrony.conf ${{targets.destdir}}/etc/chrony/chrony.conf
      install -Dm644 ./sysusers.d/chrony.conf ${{targets.destdir}}/usr/lib/sysusers.d/chrony.conf
      install -Dm644 ./50-chronyd.list ${{targets.destdir}}/usr/lib/systemd/ntp-units.d/50-chronyd.list

      install -Dm644 ./chrony-wait.service.d/10-use-unix-domain-sockets.conf \
                     ${{targets.destdir}}/usr/lib/systemd/system/chrony-wait.service.d/10-use-unix-domain-sockets.conf

  - uses: strip

subpackages:
  - name: "${{package.name}}-doc"
    description: "${{package.name}} documentation"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

  - name: "${{package.name}}-aws"
    description: "${{package.name}} configuration for AWS"
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          install -Dm644 ./sources.d/aws.sources ${{targets.contextdir}}/etc/chrony/sources.d/aws.sources
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: "${{package.name}}-azure"
    description: "${{package.name}} configuration for Azure"
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-usrsbin
        - wolfi-baselayout
        - ${{package.name}}-hyperv
    pipeline:
      - runs: |
          install -Dm644 ./sources.d/azure.sources ${{targets.contextdir}}/etc/chrony/sources.d/azure.sources
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: "${{package.name}}-gcp"
    description: "${{package.name}} configuration for GCP"
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          install -Dm644 ./sources.d/gcp.sources ${{targets.contextdir}}/etc/chrony/sources.d/gcp.sources
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: "${{package.name}}-hyperv"
    description: "${{package.name}} configuration for Hyper-V"
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          install -Dm644 ./conf.d/hyperv.conf ${{targets.contextdir}}/etc/chrony/conf.d/hyperv.conf
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: "${{package.name}}-dhcp"
    description: "${{package.name}} NTP sources from DHCP-provided servers"
    dependencies:
      runtime:
        - ${{package.name}}
        - jq
        - systemd
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - name: Install DHCP NTP-sources script
        runs: |
          install -Dm755 ./write-dhcp-sources "${{targets.subpkgdir}}/usr/lib/chrony-dhcp/write-dhcp-sources"
      - name: Install chrony-dhcp.service
        runs: |
          install -Dm644 /dev/stdin "${{targets.subpkgdir}}/usr/lib/systemd/system/chrony-dhcp.service" <<'UNIT'
          [Unit]
          Description=Write chrony NTP sources from DHCP-provided servers
          # Ordering only; nothing here pulls wait-online in. Where the host
          # enables it, the first write already carries the lease. Where it
          # does not, chronyd is not held up, and chrony-dhcp.path (armed
          # before this runs) picks the lease up when it lands.
          After=systemd-networkd-wait-online.service network-online.target
          Before=chronyd.service
          # chrony-dhcp.path retriggers this on every networkd state change.
          # With no Restart= that trigger is the only thing that starts it,
          # so the rate is bounded by networkd's writes, while hitting any
          # start limit (default 5 per 10s) fails the .path unit and ends
          # the watch for the rest of the boot.
          StartLimitIntervalSec=0

          [Service]
          # No RemainAfterExit=yes deliberately: it would leave this unit
          # "active (exited)" for the rest of the boot, and both the things
          # that refresh the sources -- chronyd.service.d's Wants= and
          # chrony-dhcp.path's trigger -- issue a start job, which does
          # nothing for an already-active unit.
          Type=oneshot
          ExecStart=/usr/lib/chrony-dhcp/write-dhcp-sources
          UNIT
      - name: Install chrony-dhcp.path
        runs: |
          install -Dm644 /dev/stdin "${{targets.subpkgdir}}/usr/lib/systemd/system/chrony-dhcp.path" <<'UNIT'
          [Unit]
          Description=Watch for changes to DHCP-provided NTP servers
          # Only useful while chronyd runs: there is nothing to reload
          # otherwise, and this stops the watch along with chronyd.
          PartOf=chronyd.service

          [Path]
          # systemd-networkd rewrites this file, including its NTP= line, on
          # every state change, so a lease renewal that changes NTP servers
          # shows up here. PathChanged does not fire for a file that already
          # exists when the watch starts, so the initial write is still done
          # by chronyd.service.d's Wants= on chrony-dhcp.service.
          PathChanged=/run/systemd/netif/state
          Unit=chrony-dhcp.service
          UNIT
      - name: Install chronyd.service ordering drop-in
        runs: |
          install -Dm644 /dev/stdin \
              "${{targets.subpkgdir}}/usr/lib/systemd/system/chronyd.service.d/10-wait-for-dhcp-sources.conf" <<'UNIT'
          [Unit]
          # Soft dependency (Wants=, not Requires=) deliberately: if the DHCP
          # script fails for any reason, chronyd should still start rather
          # than being blocked by it. Pulling in chrony-dhcp.path here, rather
          # than shipping an [Install] section, means the watch needs no
          # separate systemctl enable.
          Wants=chrony-dhcp.service chrony-dhcp.path
          After=chrony-dhcp.service
          UNIT
    test:
      environment:
        contents:
          packages:
            - jq
            - systemd-init
      pipeline:
        - uses: test/tw/contains-files
          with:
            files: |
              /usr/lib/chrony-dhcp/write-dhcp-sources
              /usr/lib/systemd/system/chrony-dhcp.service
              /usr/lib/systemd/system/chrony-dhcp.path
              /usr/lib/systemd/system/chronyd.service.d/10-wait-for-dhcp-sources.conf
        - name: Script parses cleanly
          runs: sh -n /usr/lib/chrony-dhcp/write-dhcp-sources
        - name: Validate systemd units
          runs: |
            [ -z "$(systemd-analyze verify /usr/lib/systemd/system/chrony-dhcp.service 2>&1)" ]
            [ -z "$(systemd-analyze verify /usr/lib/systemd/system/chrony-dhcp.path 2>&1)" ]
        - name: Unit does not stay active and block its own refresh
          runs: |
            # RemainAfterExit=yes would leave the service active (exited), and
            # both the .path trigger and chronyd's Wants= issue a start job,
            # which does nothing for an already-active unit.
            if grep -q "^RemainAfterExit" \
                /usr/lib/systemd/system/chrony-dhcp.service; then
              echo "FAIL: RemainAfterExit makes refreshes a no-op" >&2
              exit 1
            fi
            grep -qx "PathChanged=/run/systemd/netif/state" \
                /usr/lib/systemd/system/chrony-dhcp.path
            grep -qx "StartLimitIntervalSec=0" \
                /usr/lib/systemd/system/chrony-dhcp.service
        - name: Script writes deduplicated sources from fake DHCP-provided NTP servers
          runs: |
            mkdir -p /tmp/fakebin
            cat > /tmp/fakebin/networkctl <<'EOF'
            #!/bin/sh
            cat <<'JSON'
            {"Interfaces":[{"Name":"eth0","NTP":[{"AddressString":"192.0.2.1"}]},{"Name":"eth1","NTP":[{"AddressString":"192.0.2.2"},{"AddressString":"192.0.2.1"}]}]}
            JSON
            EOF
            chmod +x /tmp/fakebin/networkctl
            rm -f /run/chrony.d/dhcp.sources
            PATH="/tmp/fakebin:$PATH" /usr/lib/chrony-dhcp/write-dhcp-sources
            [ -f /run/chrony.d/dhcp.sources ] || { echo "FAIL: dhcp.sources not written" >&2; exit 1; }
            grep -qxF "server 192.0.2.1 iburst" /run/chrony.d/dhcp.sources
            grep -qxF "server 192.0.2.2 iburst" /run/chrony.d/dhcp.sources
            [ "$(wc -l < /run/chrony.d/dhcp.sources)" -eq 2 ] || {
              echo "FAIL: expected exactly 2 deduplicated lines" >&2
              cat /run/chrony.d/dhcp.sources >&2
              exit 1
            }
            # chronyd has dropped to the chrony user by the time a reload
            # re-reads this, so mktemp's 0600 must not survive to here.
            mode=$(stat -c %a /run/chrony.d/dhcp.sources)
            [ "$mode" = 644 ] || {
              echo "FAIL: dhcp.sources is mode $mode, chronyd cannot read it after dropping privileges" >&2
              exit 1
            }
        - name: Script accepts DHCPv6 NTP names and rejects anything that is not an address or hostname
          runs: |
            mkdir -p /tmp/fakebin
            # networkd reports the DHCPv6 NTP FQDN suboption as "Server"
            # rather than "AddressString". The last two entries are what a
            # hostile lease could try: a chrony directive smuggled in after
            # a newline, and a name no resolver would accept.
            cat > /tmp/fakebin/networkctl <<'EOF'
            #!/bin/sh
            cat <<'JSON'
            {"Interfaces":[{"Name":"eth0","NTP":[{"Server":"ntp.example.net","ConfigSource":"DHCPv6"},{"AddressString":"2001:db8::1","ConfigSource":"DHCPv6"},{"Server":"ntp.example.net\nallow 0.0.0.0/0","ConfigSource":"DHCPv6"},{"Server":"-evil.example","ConfigSource":"DHCPv6"}]}]}
            JSON
            EOF
            chmod +x /tmp/fakebin/networkctl
            rm -f /run/chrony.d/dhcp.sources
            PATH="/tmp/fakebin:$PATH" /usr/lib/chrony-dhcp/write-dhcp-sources
            printf 'server 2001:db8::1 iburst\nserver ntp.example.net iburst\n' > /tmp/expected.sources
            cmp -s /tmp/expected.sources /run/chrony.d/dhcp.sources || {
              echo "FAIL: expected the address and the FQDN only, got:" >&2
              cat /run/chrony.d/dhcp.sources >&2
              exit 1
            }
        - name: Script removes stale sources when DHCP has no NTP servers
          runs: |
            mkdir -p /tmp/fakebin
            cat > /tmp/fakebin/networkctl <<'EOF'
            #!/bin/sh
            echo '{"Interfaces":[{"Name":"eth0"}]}'
            EOF
            chmod +x /tmp/fakebin/networkctl
            mkdir -p /run/chrony.d
            echo "server 203.0.113.1 iburst" > /run/chrony.d/dhcp.sources
            PATH="/tmp/fakebin:$PATH" /usr/lib/chrony-dhcp/write-dhcp-sources
            [ ! -e /run/chrony.d/dhcp.sources ] || {
              echo "FAIL: stale dhcp.sources not removed" >&2
              exit 1
            }
        - name: Script only picks NTP addresses, not DNS or interface addresses
          runs: |
            mkdir -p /tmp/fakebin
            cat > /tmp/fakebin/networkctl <<'EOF'
            #!/bin/sh
            cat <<'JSON'
            {"Interfaces":[{"Name":"eth0","Addresses":[{"AddressString":"10.0.0.5"}],"DNS":[{"AddressString":"10.0.0.1"}],"NTP":[{"AddressString":"192.0.2.1"}]}]}
            JSON
            EOF
            chmod +x /tmp/fakebin/networkctl
            rm -f /run/chrony.d/dhcp.sources
            PATH="/tmp/fakebin:$PATH" /usr/lib/chrony-dhcp/write-dhcp-sources
            [ "$(cat /run/chrony.d/dhcp.sources)" = "server 192.0.2.1 iburst" ] || {
              echo "FAIL: expected only the NTP address, got:" >&2
              cat /run/chrony.d/dhcp.sources >&2
              exit 1
            }
        - name: Script aborts, leaves existing sources alone, and reports why when networkctl fails
          runs: |
            mkdir -p /tmp/fakebin
            cat > /tmp/fakebin/networkctl <<'EOF'
            #!/bin/sh
            exit 1
            EOF
            chmod +x /tmp/fakebin/networkctl
            mkdir -p /run/chrony.d
            echo "server 203.0.113.1 iburst" > /run/chrony.d/dhcp.sources
            errmsg=$(PATH="/tmp/fakebin:$PATH" /usr/lib/chrony-dhcp/write-dhcp-sources 2>&1 1>/dev/null) && {
              echo "FAIL: script should have failed when networkctl failed" >&2
              exit 1
            }
            grep -qxF "server 203.0.113.1 iburst" /run/chrony.d/dhcp.sources || {
              echo "FAIL: existing dhcp.sources was clobbered on networkctl failure" >&2
              exit 1
            }
            case "$errmsg" in
              write-dhcp-sources:*networkctl*) ;;
              *) echo "FAIL: expected an error message naming networkctl, got: $errmsg" >&2; exit 1 ;;
            esac
        - name: Script rejects networkctl output of an unexpected shape rather than emptying the sources
          runs: |
            mkdir -p /tmp/fakebin
            cat > /tmp/fakebin/networkctl <<'EOF'
            #!/bin/sh
            echo '{"Links":[]}'
            EOF
            chmod +x /tmp/fakebin/networkctl
            mkdir -p /run/chrony.d
            echo "server 203.0.113.1 iburst" > /run/chrony.d/dhcp.sources
            errmsg=$(PATH="/tmp/fakebin:$PATH" /usr/lib/chrony-dhcp/write-dhcp-sources 2>&1 1>/dev/null) && {
              echo "FAIL: script should have failed on output with no Interfaces array" >&2
              exit 1
            }
            grep -qxF "server 203.0.113.1 iburst" /run/chrony.d/dhcp.sources || {
              echo "FAIL: existing dhcp.sources was clobbered by unexpected networkctl output" >&2
              exit 1
            }
            case "$errmsg" in
              *Interfaces*) ;;
              *) echo "FAIL: expected an error naming Interfaces, got: $errmsg" >&2; exit 1 ;;
            esac
        - name: Script only picks up interfaces that report NTP servers
          runs: |
            mkdir -p /tmp/fakebin
            cat > /tmp/fakebin/networkctl <<'EOF'
            #!/bin/sh
            cat <<'JSON'
            {"Interfaces":[{"Name":"eth0"},{"Name":"eth1","NTP":[{"AddressString":"192.0.2.9"}]}]}
            JSON
            EOF
            chmod +x /tmp/fakebin/networkctl
            rm -f /run/chrony.d/dhcp.sources
            PATH="/tmp/fakebin:$PATH" /usr/lib/chrony-dhcp/write-dhcp-sources
            [ "$(cat /run/chrony.d/dhcp.sources)" = "server 192.0.2.9 iburst" ] || {
              echo "FAIL: expected the one NTP address from eth1, got:" >&2
              cat /run/chrony.d/dhcp.sources >&2
              exit 1
            }
        # Kept last: it leaves a chronyd running until the final shutdown,
        # and the steps above assume the reload is skipped for want of a
        # command socket.
        - name: Already-running chronyd picks up new sources without a restart
          runs: |
            # The shipped config must agree with where the script writes,
            # otherwise chronyd never reads the file at startup.
            grep -qx "sourcedir /run/chrony.d" /etc/chrony/chrony.conf

            # /run/chrony is deliberately left for chronyd to create: it
            # refuses to open the command socket unless that directory is
            # 0770 and owned by the user it runs as, so pre-creating it with
            # a default umask silently disables the socket.
            mkdir -p /run/chrony.d /var/lib/chrony
            rm -f /run/chrony.d/dhcp.sources

            # Run chronyd as the shipped chrony user, the way chronyd.service
            # does, so the reload happens after the privilege drop and a
            # dhcp.sources that only root may read would fail this test.
            systemd-sysusers /usr/lib/sysusers.d/chrony.conf
            chown chrony:chrony /var/lib/chrony

            # No bindcmdaddress, so chronyd uses its built-in socket path and
            # this also pins the path the script hardcodes for the reload.
            install -Dm644 /dev/stdin /tmp/chronyd-test.conf <<'CONF'
            sourcedir /run/chrony.d
            driftfile /var/lib/chrony/drift
            port 0
            cmdport 0
            CONF
            # -d keeps it in the foreground so a startup failure lands in the
            # log below rather than in a syslog the test cannot read.
            chronyd -x -u chrony -d -f /tmp/chronyd-test.conf \
                > /tmp/chronyd-test.log 2>&1 &

            i=0
            while [ ! -S /run/chrony/chronyd.sock ] && [ "$i" -lt 10 ]; do
              sleep 1
              i=$((i + 1))
            done
            if [ ! -S /run/chrony/chronyd.sock ]; then
              echo "FAIL: chronyd did not create /run/chrony/chronyd.sock" >&2
              cat /tmp/chronyd-test.log >&2
              exit 1
            fi

            # Started with an empty sourcedir, so a hit here afterwards can
            # only have come from the reload, not from chronyd's own startup.
            if chronyc -h /run/chrony/chronyd.sock -n sources | grep -q 192.0.2.7
            then
              echo "FAIL: 192.0.2.7 configured before the script ran" >&2
              exit 1
            fi

            mkdir -p /tmp/fakebin
            cat > /tmp/fakebin/networkctl <<'EOF'
            #!/bin/sh
            echo '{"Interfaces":[{"Name":"eth0","NTP":[{"AddressString":"192.0.2.7"}]}]}'
            EOF
            chmod +x /tmp/fakebin/networkctl
            PATH="/tmp/fakebin:$PATH" /usr/lib/chrony-dhcp/write-dhcp-sources

            if ! chronyc -h /run/chrony/chronyd.sock -n sources \
                | grep -q 192.0.2.7; then
              echo "FAIL: running chronyd did not load the DHCP source" >&2
              chronyc -h /run/chrony/chronyd.sock -n sources >&2
              exit 1
            fi

            # Losing the DHCP-provided servers has to drop them from a running
            # chronyd too, not just remove the file.
            cat > /tmp/fakebin/networkctl <<'EOF'
            #!/bin/sh
            echo '{"Interfaces":[{"Name":"eth0"}]}'
            EOF
            PATH="/tmp/fakebin:$PATH" /usr/lib/chrony-dhcp/write-dhcp-sources

            if chronyc -h /run/chrony/chronyd.sock -n sources | grep -q 192.0.2.7
            then
              echo "FAIL: stale source still configured after removal" >&2
              exit 1
            fi

            chronyc -h /run/chrony/chronyd.sock shutdown

update:
  enabled: true
  github:
    identifier: mlichvar/chrony
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/verify-service
    - uses: test/tw/ver-check
      with:
        bins: |
          chronyd
          chronyc
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: |
          chronyd
          chronyc
    - uses: test/no-docs
    - name: Test chronyd config parsing
      runs: |
        # chronyd -p prints the parsed configuration and exits
        # Use a known config with a pool directive so grep is reliable
        cat > /tmp/chrony-parse-test.conf << 'EOF'
        pool pool.ntp.org iburst maxsources 4
        driftfile /tmp/chrony-drift
        EOF
        chronyd -p -f /tmp/chrony-parse-test.conf 2>&1 | grep -F "pool"
    - name: Test chronyd and chronyc interaction
      runs: |
        # Create a minimal chrony config for testing
        mkdir -p /tmp/chrony-test/run /tmp/chrony-test/log
        cat > /tmp/chrony-test/chrony.conf << 'EOF'
        pool pool.ntp.org iburst maxsources 1
        driftfile /tmp/chrony-test/drift
        logdir /tmp/chrony-test/log
        bindcmdaddress 127.0.0.1
        cmdport 32323
        EOF

        # Start chronyd in background with test config
        # Use -u root to avoid privilege drop to 'chrony' user (not present in test env)
        chronyd -f /tmp/chrony-test/chrony.conf -x -d -u root &
        CHRONY_PID=$!

        # Give chronyd a moment to start
        sleep 2

        # Use chronyc to query the running daemon
        chronyc -h 127.0.0.1 -p 32323 tracking | grep -F "Reference ID"
        chronyc -h 127.0.0.1 -p 32323 sources
        chronyc -h 127.0.0.1 -p 32323 activity | grep -F "sources"

        # Clean up
        kill "$CHRONY_PID"
