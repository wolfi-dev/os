# cinc-auditor is a free distribution of the open source Chef Software
# Inc. inspec tool. See https://cinc.sh/start/auditor/
#nolint:valid-pipeline-git-checkout-tag
package:
  name: cinc-auditor
  version: "7.1.7"
  epoch: 9 # CVE-2026-111943
  description: cinc-auditor is an OSS tool for applying inspec profiles
  copyright:
    - license: Apache-2.0
    - license: LicenseRef-Third-Party
      license-path: NOTICE.TXT
  dependencies:
    runtime:
      # needed for the shell wrapper script in /usr/bin
      - busybox
      # the vendored gem CA bundles are linked to the system bundle below
      - ca-certificates-bundle
      # both kubernetes transport (train-) plugins need kubectl installed
      - kubectl
      # additional gem dependencies added in the upstream cinc-auditor
      # habitat/plan.sh script that can't be listed as part of the Gemfile
      # for some reason
      - ruby${{vars.ruby-version}}-bcrypt_pbkdf
      - ruby${{vars.ruby-version}}-ed25519
  resources:
    cpu: "2"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  ruby-version: 3.4

environment:
  contents:
    packages:
      - bash
      - busybox
      - gcc
      - glibc-2.44-dev
      - make
      - ruby${{vars.ruby-version}}-bcrypt_pbkdf
      - ruby${{vars.ruby-version}}-ed25519
      - ruby-${{vars.ruby-version}}
      - ruby-${{vars.ruby-version}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: b85c55586db857ea17258995936e893cb6ca8602
      repository: https://gitlab.com/cinc-project/upstream/inspec/
      branch: stable/cinc-v${{package.version}}

  - name: build inspec gem
    uses: ruby/build
    with:
      gem: inspec

  - name: build inspec-core gem
    uses: ruby/build
    with:
      gem: inspec-core

  - name: build cinc-auditor-bin gem
    uses: ruby/build
    with:
      dir: inspec-bin
      gem: cinc-auditor-bin

  # cinc-auditor needs around 260 gems as dependencies, which is too
  # much to package. Instead, vender the needed gems under
  # /usr/lib/cinc-auditor/gems/
  - name: install inspec gems
    runs: |
      INSTALLED_BIN_DIR="/usr/lib/cinc-auditor/bin"
      INSTALLED_GEMS_DIR="$(ruby -e 'puts Gem.default_dir.sub("\/ruby\/", "\/cinc-auditor\/")')/"
      TARGET_DIR_BIN="${{targets.contextdir}}${INSTALLED_BIN_DIR}"
      TARGET_DIR_INSTALL="${{targets.contextdir}}${INSTALLED_GEMS_DIR}"
      mkdir -p "${TARGET_DIR_BIN}"
      mkdir -p "${TARGET_DIR_INSTALL}"
      mkdir -p "${{targets.contextdir}}/usr/bin"

      export GEM_PATH="$(ruby -e 'puts Gem.default_dir')"

      gem install inspec*.gem \
        --install-dir "${TARGET_DIR_INSTALL}"  \
        --bindir "${TARGET_DIR_BIN}" \
        --no-document

      (cd inspec-bin && gem install cinc-auditor-bin-${{package.version}}.gem \
        --install-dir "${TARGET_DIR_INSTALL}"  \
        --bindir "${TARGET_DIR_BIN}" \
        --no-document )

      # this is an additional plugin useful for querying containers in k8s.
      gem install train-k8s-container-mitre \
        --install-dir "${TARGET_DIR_INSTALL}"  \
        --bindir "${TARGET_DIR_BIN}" \
        --no-document

      # The cache only holds the downloaded .gem archives (needed for
      # reinstall/gem pristine, not at runtime), and the copies of the gem CA
      # bundles inside them can't be linked to the system bundle.
      rm -rf "${TARGET_DIR_INSTALL}/cache"

      # create a wrapper script around cinc-auditor that sets the
      # gem path correctly for the vendered dependencies
      cat <<EOF > "cinc-auditor"
      #!/bin/sh
      set -e

      # Set Ruby paths defined from 'do_setup_environment()'
      export GEM_HOME="${INSTALLED_GEMS_DIR}"
      export GEM_PATH="$(ruby -e 'puts Gem.default_dir'):\$GEM_HOME"

      exec /usr/bin/ruby "${INSTALLED_BIN_DIR}/cinc-auditor" "\$@"
      EOF
      install -m755 cinc-auditor -t "${{targets.contextdir}}/usr/bin/"

      # Pre-populate Chef UUID to suppress runtime warning from Cinc Auditor
      mkdir -p "${{targets.contextdir}}/etc/chef"
      echo "00000000-0000-0000-0000-000000000000" > "${{targets.contextdir}}/etc/chef/chef_guid"

  # CVE-2026-111943: aws-sdk-core, httpclient and ms_rest ship their own CA
  # bundles, which still carry AAA Certificate Services. Link them to the
  # system bundle so they follow ca-certificates instead of staying frozen at
  # build time.
  - uses: ca-certificates/use-system-bundle
    with:
      files: |
        ${{targets.contextdir}}/usr/lib/cinc-auditor/gems/*/gems/aws-sdk-core-*/ca-bundle.crt
        ${{targets.contextdir}}/usr/lib/cinc-auditor/gems/*/gems/httpclient-*/lib/httpclient/cacert.pem
        ${{targets.contextdir}}/usr/lib/cinc-auditor/gems/*/gems/httpclient-*/lib/httpclient/cacert1024.pem
        ${{targets.contextdir}}/usr/lib/cinc-auditor/gems/*/gems/ms_rest-*/ca-cert.pem

update:
  enabled: false
  # The cinc-auditor source is published only via version-named GitLab
  # branches (stable/cinc-v<version>) with no git tags. No melange update
  # monitor can enumerate branch names (the git/github pollers list tags),
  # so updates are handled manually: bump package.version AND the
  # git-checkout expected-commit together. Find the new commit with:
  #   git ls-remote https://gitlab.com/cinc-project/upstream/inspec.git \
  #     refs/heads/stable/cinc-v<version>
  exclude-reason: "Upstream publishes via version-named GitLab branches (stable/cinc-v<version>) with no git tags; no update monitor can track branch names. Bumped manually (version + expected-commit together)."

test:
  pipeline:
    - runs: |
        set -euo pipefail
        cinc-auditor --help
        cinc-auditor version
        cinc-auditor shell --backend local -c 'describe file("/etc/passwd") do it { should exist } end'
        cinc-auditor shell --backend local -c \
           'describe passwd("/etc/passwd") do its("count") { should_not eq 0 } ; its("users") { should_not be_empty } end'

        # Ensure the k8s-container transport plugin can be found.
        # The cinc-auditor command will fail because it doesn't have a
        # valid kube configuration configuration, hence the complex test
        # check.
        if cinc-auditor detect -t k8s-container:// > k8s-test-output 2>&1 ; then
            echo "cinc-auditor suceeded when it should have failed" > /dev/stderr
            cat k8s-test-output
            exit 1
        fi
        if ! grep 'Missing Parameter `pod`' k8s-test-output ; then
            cat k8s-test-output
            exit 1
        fi

        # both k8s train backends need kubectl installed
        kubectl version --client

        # the gem cache is removed at build time
        if ls -d /usr/lib/cinc-auditor/gems/*/cache 2>/dev/null; then
          echo "gem cache still shipped" > /dev/stderr
          exit 1
        fi
    - uses: test/uses-system-ca-bundle
      with:
        files: |
          /usr/lib/cinc-auditor/gems/*/gems/aws-sdk-core-*/ca-bundle.crt
          /usr/lib/cinc-auditor/gems/*/gems/httpclient-*/lib/httpclient/cacert.pem
          /usr/lib/cinc-auditor/gems/*/gems/httpclient-*/lib/httpclient/cacert1024.pem
          /usr/lib/cinc-auditor/gems/*/gems/ms_rest-*/ca-cert.pem
