package:
  name: cjose
  version: "0.8.1"
  epoch: 1 # openssl-hardened: 3.6->4.0
  description: "C library implementing the Javascript Object Signing and Encryption (JOSE) standard"
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 6Gi

vars:
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - build-base
      - glibc-2.44-dev
      - jansson-dev
      - openssl-hardened-${{vars.openssl-version}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openidc/cjose
      tag: ${{package.version}}
      expected-commit: 6fdb5fe75a86acb9cd34ca2eb13d9e090a6df588

  - uses: autoconf/configure
    with:
      opts: --enable-shared

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

test:
  environment:
    contents:
      packages:
        - build-base
        - cjose-dev
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        cat > test_cjose.c << 'EOF'
        #include <cjose/cjose.h>
        #include <stdio.h>

        int main() {
            cjose_err err;

            // Create a simple JWK
            cjose_jwk_t *jwk = cjose_jwk_create_oct_spec((const uint8_t*)"test-secret-key", 15, &err);
            if (!jwk) {
                printf("Failed to create JWK\n");
                return 1;
            }

            printf("CJOSE library test passed\n");
            cjose_jwk_release(jwk);
            return 0;
        }
        EOF

        gcc -o test_cjose test_cjose.c $(pkg-config --cflags --libs cjose)
        ./test_cjose

subpackages:
  - name: cjose-static
    description: cjose static
    pipeline:
      - uses: split/static
    test:
      pipeline:
        - uses: test/tw/staticpackage

  - name: cjose-dev
    description: cjose dev
    dependencies:
      runtime:
        - openssl-${{vars.openssl-version}}-dev
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - pkgconf
            - cjose-dev
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - runs: |
            pkg-config --modversion cjose |grep "${{package.version}}"

update:
  enabled: true
  github:
    identifier: openidc/cjose
    use-tag: true
  ignore-regex-patterns:
    - ^latest$
