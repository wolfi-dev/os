package:
  name: clblast
  version: "1.7.0"
  epoch: 5 # shared library naming: split libclblast${{vars.soversion}}
  description: Tuned OpenCL BLAS
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi
  dependencies:
    runtime:
      - libclblast${{vars.soversion}}=${{package.full-version}}

vars:
  soversion: "1"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-2.44-dev
      - opencl-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/CNugteren/CLBlast
      tag: ${{package.version}}
      expected-commit: ca2fc3cb09d4917cc72d4ca661d30296865a4afc

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: libclblast${{vars.soversion}}
    description: "clblast shared library"
    pipeline:
      - uses: split/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: ${{package.name}}-dev
    dependencies:
      runtime:
        - libclblast${{vars.soversion}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: CNugteren/CLBlast

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        # Verify tuner binaries exist and are executable
        for bin in clblast_tuner_copy_fast clblast_tuner_xgemm clblast_tuner_xgemv clblast_tuner_xaxpy; do
          stat /usr/bin/$bin
        done
    - uses: test/tw/ldd-check
