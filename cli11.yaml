package:
  name: cli11
  version: "2.7.1"
  epoch: 0 # add -dev subpackage and improved tests
  description: command line parser for C++11
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "13"
    memory: 25Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - make

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9cac680352e3a9a7a000e5fdebf8cd25b7a5fb34
      repository: https://github.com/CLIUtils/CLI11
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DBUILD_SHARED_LIBS=True \

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: Development files for ${{package.name}}
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: CLIUtils/CLI11
    strip-prefix: v
    tag-filter-prefix: v

test:
  environment:
    contents:
      packages:
        - build-base
        - cli11-dev
  pipeline:
    - uses: test/tw/ldd-check
    - name: Compile and run a program using the CLI11 API
      runs: |
        cat > /tmp/test_cli11.cpp << 'EOF'
        #include <CLI/CLI.hpp>
        #include <string>
        #include <cassert>
        int main(int argc, char **argv) {
            CLI::App app{"CLI11 functional test"};
            std::string name = "world";
            int count = 1;
            app.add_option("--name", name, "Name to greet");
            app.add_option("--count", count, "Number of greetings");
            CLI11_PARSE(app, argc, argv);
            assert(name == "tester");
            assert(count == 3);
            return 0;
        }
        EOF
        c++ -std=c++11 -o /tmp/test_cli11 /tmp/test_cli11.cpp $(pkg-config --cflags CLI11)
        /tmp/test_cli11 --name tester --count 3
