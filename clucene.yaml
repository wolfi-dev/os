# Generated from https://git.alpinelinux.org/aports/plain/main/clucene/APKBUILD
package:
  name: clucene
  version: 2.3.3.4
  epoch: 10 # shared library naming: split soname-versioned libs
  description: A C++ port of Lucene
  copyright:
    - license: LGPL-2.0-or-later OR Apache-2.0
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi
  dependencies:
    runtime:
      - libclucene-core${{vars.soversion}}=${{package.full-version}}
      - libclucene-shared${{vars.soversion}}=${{package.full-version}}

vars:
  soversion: "1"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - boost-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake-3
      - glibc-2.44-dev
      - samurai
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.code.sf.net/p/clucene/code
      tag: clucene-src-${{package.version}}
      expected-commit: a834f87bad3543b2a0331cef7202c15ded4245be

  - uses: patch
    with:
      patches: ctime.patch

  - uses: cmake/configure
    with:
      opts: |
        -DLIB_DESTINATION=/usr/lib \
        -DLUCENE_SYS_INCLUDES=/usr/lib

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: libclucene-core${{vars.soversion}}
    description: "libclucene-core shared library"
    pipeline:
      - uses: split/lib
        with:
          patterns: clucene-core
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: libclucene-shared${{vars.soversion}}
    description: "libclucene-shared shared library"
    pipeline:
      - uses: split/lib
        with:
          patterns: clucene-shared
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: clucene-dev
    dependencies:
      runtime:
        - libclucene-core${{vars.soversion}}=${{package.full-version}}
        - libclucene-shared${{vars.soversion}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
      - runs: |
          rm -r "${{targets.destdir}}"/usr/lib/CLuceneConfig.cmake
    description: clucene dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  git:
    strip-prefix: clucene-src-
    tag-filter-prefix: clucene-src-
