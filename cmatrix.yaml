package:
  name: cmatrix
  version: "2.0"
  epoch: 3 # glibc: 2.43->2.44
  description: "terminal-based Matrix-style scrolling animation"
  copyright:
    - license: GPL-3.0-only

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-2.44-dev
      - ncurses-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/abishekvashok/cmatrix
      tag: v${{package.version}}
      expected-commit: adfdf1656f23e5ab3b52c7d7edf91249a4477e8d

  # Patch cmake_minimum_required for CMake 4.x compatibility
  - runs: |
      sed -i 's/cmake_minimum_required(VERSION 2.8)/cmake_minimum_required(VERSION 3.5)/' CMakeLists.txt

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

update:
  enabled: true
  github:
    identifier: abishekvashok/cmatrix
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: cmatrix
    - uses: test/tw/ver-check
      with:
        bins: cmatrix
        version: ${{package.version}}
    - name: Functional test - verify help output lists expected flags
      runs: |
        # cmatrix is an ncurses animation; initialising ncurses fails in a
        # headless environment.  The -h flag prints usage without opening the
        # terminal, so we can assert on its content to prove the binary was
        # compiled and linked correctly.
        help_out=$(cmatrix -h 2>&1 || true)
        echo "$help_out" | grep -F -- "-C"
        echo "$help_out" | grep -F -- "-u"
        echo "$help_out" | grep -F -- "-s"
        echo "$help_out" | grep -F -- "-b"
    - name: Functional test - verify version output contains package version
      runs: |
        cmatrix -V 2>&1 | grep -F "${{package.version}}"
    - name: Functional test - invalid color flag is rejected
      runs: |
        # A recognized color (e.g. "red") should not produce an
        # "invalid color" / "unrecognized" error message.  An unknown color
        # string should trigger an error and exit non-zero.
        ret=0
        TERM=xterm cmatrix -C thisisnotacolor 2>/tmp/cmatrix_err.txt || ret=$?
        if [ "$ret" -eq 126 ] || [ "$ret" -eq 127 ]; then
          echo "ERROR: cmatrix binary not found or not executable"
          exit 1
        fi
        # The binary must have printed an error about the bad color name.
        grep -iF "color" /tmp/cmatrix_err.txt
