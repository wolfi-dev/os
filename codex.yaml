package:
  name: codex
  version: "0.162.0"
  epoch: 0 # rust: 1.98->1.99
  description: OpenAI Codex CLI - a lightweight coding agent that runs in your terminal
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # codex uses bwrap and rg from PATH; see daemon-system-rg-bwrap.patch.
      - bubblewrap
      - ca-certificates-bundle
      - git
      - openssh-client
      # The app-server daemon runs `ps -p PID -o lstart=`; busybox ps lacks both.
      - procps
      - ripgrep
  resources:
    # codex-rs is a large (60+ crate) Cargo workspace that links against a
    # prebuilt V8 static library (rusty_v8); the final link step is
    # memory-heavy. Successive reductions (36Gi -> 24Gi -> 32Gi) kept failing
    # at this step, so the allocation was raised to match the deno package
    # (cpu 22 / memory 36Gi), which links the same rusty_v8 crate. That was
    # still not enough: the aarch64 leg of the 0.157.0 build was OOM-killed
    # ("rustc was terminated by a deadly signal") while compiling the final
    # codex-cli binary, even though x86_64 succeeded at the same allocation.
    # codex's workspace is larger than deno's, so bump memory further.
    cpu: "22"
    memory: 48Gi
  test-resources:
    cpu: "1"
    # The app-server daemon test is OOM-killed at 1Gi while it copies the
    # ~460M package into CODEX_HOME.
    memory: 4Gi

vars:
  rust-version: 1.99
  rusty-v8-version: 150.4.0
  llvm-version: 23
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - clang-${{vars.llvm-version}}
      - cmake
      - curl
      - glibc-2.44-dev
      - libcap-dev
      - openssl-${{vars.openssl-version}}-dev
      - pkgconf
      - posix-libc-utils
      # python3 is required by the transitive rusty_v8 (v8 crate) build.rs,
      # which shells out to python to download its prebuilt static library.
      # Without it the build.rs panics with Os NotFound when spawning the
      # downloader. This mirrors the working deno package's environment.
      - python3
      - rust-${{vars.rust-version}}
      - wolfi-base
  environment:
    # Populated by the "Fetch rusty_v8" step below.
    RUSTY_V8_ARCHIVE: /home/build/rusty_v8/librusty_v8.a.gz
    RUSTY_V8_SRC_BINDING_PATH: /home/build/rusty_v8/src_binding.rs

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openai/codex
      tag: rust-v${{package.version}}
      expected-commit: c1382380de69521303b416720a52f42d51af6248

  # The app-server daemon only runs from a package tree that bundles rg and
  # bwrap. Use the ripgrep and bubblewrap packages from PATH instead, so
  # their updates reach codex.
  - uses: patch
    with:
      patches: daemon-system-rg-bwrap.patch

  - uses: bump
    with:
      # The Cargo workspace (Cargo.toml / Cargo.lock) lives in codex-rs/, not
      # the repo root (which is a Bazel + pnpm monorepo with no Cargo.lock).
      # omnibump must run cargo update --precise inside the workspace, so point
      # modroot at codex-rs to match the cargo/build step below. Without this
      # the bump runs at the root and silently no-ops, leaving the vulnerable
      # crate versions pinned in codex-rs/Cargo.lock.
      modroot: codex-rs
      # actix-http@3.12.1 - GHSA-xhj4-vrgc-hr34
      # cmov@0.5.4 - CVE-2026-50185 / GHSA-3rjw-m598-pq24
      # NOTE: the gix family (gix@0.83.0, gix-fs@0.21.1, gix-pack@0.69.0) and
      # jsonwebtoken@10.3.0 are pinned by the runs step below rather than here.
      # omnibump verifies a bump by building the whole workspace, which compiles
      # the v8 150.4.0 build.rs. It wants a librusty_v8_ptrcomp_sandbox_release
      # prebuilt that denoland does not publish (HTTP 404); the openai-published
      # one is fetched by the "Fetch rusty_v8" step, which runs after this one.
      # Every attempted pin therefore failed verification and omnibump's
      # bisection blamed whichever crate it was pinning.
      # NOTE: hickory-proto (GHSA-q2qq-hmj6-3wpp fixed in 0.26.1, and
      # GHSA-3v94-mw7p-v465 which has NO published fix) is intentionally NOT
      # bumped. Only one hickory-proto (0.25.2) is in the graph and it is pulled
      # transitively by hickory-resolver 0.25.2, which requires hickory-proto
      # "^0.25". cargo update -p hickory-proto --precise 0.26.1 fails with a
      # version-selection conflict against that "^0.25" bound. Reaching 0.26.1
      # would require also bumping hickory-resolver to 0.26, a major API break
      # (Message/ResolverConfig/NameServerConfig APIs all changed) that needs a
      # source port of the transitive consumers — out of scope for an automated
      # crate bump (see rust-cve-remedy). GHSA-3v94-mw7p-v465 has no fixed
      # release at all. Reported as a diagnostic.
      # NOTE: lru (GHSA-rhfx-m35p-ff5j, Low, fixed in 0.16.3) is intentionally
      # NOT bumped. The workspace already pins lru 0.16.3 directly; the flagged
      # lru 0.12.5 is a *second*, transitive entry pulled by a consumer that
      # requires lru "^0.12". Because 0.x minor bumps are SemVer-breaking,
      # cargo update -p lru@0.12.5 --precise 0.16.3 fails the "^0.12" bound, and
      # a plain lru@0.16.3 floor is already satisfied by the direct dep so it
      # never touches the 0.12.5 entry. Remediating requires the consumer to be
      # ported to lru 0.16 upstream — out of scope for a crate bump. Reported as
      # a diagnostic.
      # openssl@0.10.80 - CVE-2026-41678 / CVE-2026-41681 / CVE-2026-41898 / CVE-2026-45784 / CVE-2026-41676 / CVE-2026-41677 / CVE-2026-42327 / CVE-2026-44662
      # NOTE: opentelemetry_sdk (CVE-2026-48504 / GHSA-w9wp-h8wv-79jx) is
      # intentionally NOT bumped. The only fixed release is opentelemetry_sdk
      # 0.32.x, which pulls the opentelemetry 0.32 core into a graph where codex's
      # own `codex-otel` crate is still written against the 0.31 API
      # (TraceContextPropagator::inject_context/extract, HttpClient trait). The
      # mixed 0.31/0.32 graph fails to compile (E0599/E0277 in codex-otel), and
      # no patched release exists in the 0.31 series. Remediating this requires an
      # upstream source port to the 0.32 API and is out of scope for an automated
      # crate bump; including it aborts the entire omnibump run and drops every
      # other (working) bump below.
      # quinn-proto@0.11.15 - GHSA-4w2j-m93h-cj5j
      # serde_with@3.21.0 - GHSA-7gcf-g7xr-8hxj
      # tar@0.4.46 - GHSA-3pv8-6f4r-ffg2
      deps: |-
        actix-http@3.12.1
        cmov@0.5.4
        openssl@0.10.80
        quinn-proto@0.11.15
        serde_with@3.21.0
        tar@0.4.46

  # gix is pinned "0.81.0" and ^0.81.0 excludes the fixed 0.83.0, so the
  # requirement has to move before cargo can select it. 0.82.0 carries the same
  # fixes but is yanked.
  - uses: sed
    with:
      path: codex-rs/Cargo.toml
      pattern: '^gix = \{ version = "0\.81\.0"'
      replacement: 'gix = { version = "0.83.0"'

  # Likewise jsonwebtoken "9.3.1": ^9 excludes the fixed 10.3.0. The 10.x break
  # does not reach this consumer — decode/decode_header widened from &str to
  # impl AsRef<[u8]>, and every other symbol used here (DecodingKey,
  # EncodingKey::from_rsa_pem, Validation::new, Header::new, Algorithm::HS256
  # and RS256, jwk::JwkSet) is unchanged.
  - uses: sed
    with:
      path: codex-rs/Cargo.toml
      pattern: '^jsonwebtoken = "9\.3\.1"'
      replacement: 'jsonwebtoken = "10.3.0"'

  # Lands the gix-family CVE pins that omnibump cannot verify (see the NOTE in
  # the bump step above). Fetching rusty_v8 before bump may let these move
  # back into bump deps; that is untested.
  - runs: |
      set -euo pipefail
      cd codex-rs

      # 0.83.0 requires gix-fs ^0.21.0 and gix-pack ^0.70.0, so one pin clears
      # the family.
      cargo update -p gix --precise 0.83.0
      cargo update -p jsonwebtoken --precise 10.3.0

      # Fail loudly if any of these did not clear its fixed floor, rather than
      # shipping a package that still carries the detections.
      for spec in gix:0.83.0 gix-fs:0.21.1 gix-pack:0.69.0 jsonwebtoken:10.3.0; do
        name="${spec%%:*}"; min="${spec##*:}"
        have=$(awk -v n="name = \"${name}\"" '$0==n{getline; gsub(/version = |"/,""); print; exit}' Cargo.lock)
        if [ -z "${have}" ]; then echo "${name}: not present in Cargo.lock"; exit 1; fi
        if [ "$(printf '%s\n%s\n' "${min}" "${have}" | sort -V | head -1)" != "${min}" ]; then
          echo "${name}: ${have} is below the required ${min}"; exit 1
        fi
        echo "${name}: ${have} (>= ${min})"
      done

  # codex-code-mode-host links V8 with v8_enable_sandbox. denoland does not
  # publish that prebuilt, so use the one openai publishes, verified against
  # the checksums in upstream's third_party/v8/rusty_v8_*_manifests.sha256.
  - name: Fetch rusty_v8
    runs: |
      set -euo pipefail
      case "${{build.arch}}" in
        x86_64)
          archive_sha=a35c75d1f26e6a983885a45b33490a4ebe54f05050568b32b89cfb421b30b583
          binding_sha=7727826ae479bdb645e807239fb12d1f8e2e23de7a6cf16f5ee592690d1d8506
          ;;
        aarch64)
          archive_sha=d1517eed405468537029b005d5fe997ec74d5c8d351f916b3a6df20b7d2811ba
          binding_sha=7727826ae479bdb645e807239fb12d1f8e2e23de7a6cf16f5ee592690d1d8506
          ;;
        *) echo "no rusty_v8 checksum for ${{build.arch}}"; exit 1 ;;
      esac
      base=https://github.com/openai/codex/releases/download/rusty-v8-v${{vars.rusty-v8-version}}
      target=${{build.arch}}-unknown-linux-gnu
      mkdir -p "$(dirname "${RUSTY_V8_ARCHIVE}")"
      curl -fsSL -o "${RUSTY_V8_ARCHIVE}" "${base}/librusty_v8_ptrcomp_sandbox_release_${target}.a.gz"
      curl -fsSL -o "${RUSTY_V8_SRC_BINDING_PATH}" "${base}/src_binding_ptrcomp_sandbox_release_${target}.rs"
      printf '%s  %s\n%s  %s\n' \
        "${archive_sha}" "${RUSTY_V8_ARCHIVE}" \
        "${binding_sha}" "${RUSTY_V8_SRC_BINDING_PATH}" | sha256sum -c -

  - uses: cargo/build
    with:
      modroot: codex-rs
      output: codex
      opts: --release --bin codex --bin codex-code-mode-host

  # Install in upstream's package layout (scripts/codex_package/layout.py).
  # The app-server daemon, started by default, refuses to run unless codex
  # is inside a complete package, which it copies into CODEX_HOME.
  # The +chainguard build metadata makes the daemon treat this as a local
  # build: a plain version would start its updater, which replaces the
  # daemon with upstream's release by piping install.sh into sh.
  - runs: |
      set -euo pipefail
      pkg="${{targets.contextdir}}/usr/lib/codex"
      mkdir -p "${pkg}/bin"
      mv "${{targets.contextdir}}/usr/bin/codex" "${pkg}/bin/codex"
      install -m755 codex-rs/target/release/codex-code-mode-host "${pkg}/bin/"
      cat > "${pkg}/codex-package.json" <<EOF
      {
        "layoutVersion": 1,
        "version": "${{package.version}}+chainguard",
        "target": "${{build.arch}}-unknown-linux-gnu",
        "variant": "codex",
        "entrypoint": "bin/codex"
      }
      EOF
      ln -s ../lib/codex/bin/codex "${{targets.contextdir}}/usr/bin/codex"

  # The default (-g) keeps the symbol table, ~90M of bin/codex. Match
  # upstream's release strip flags.
  - uses: strip
    with:
      opts: --strip-debug --strip-unneeded

test:
  environment:
    environment:
      # codex is an agentic CLI that resolves a config/home dir on startup.
      # Point HOME and CODEX_HOME at a writable temp path for EVERY test step
      # (including the pipeline-based smoke checks below, which cannot set env
      # inline) so no invocation depends on the sandbox's default home.
      HOME: /tmp/codex-home
      CODEX_HOME: /tmp/codex-home/.codex
  pipeline:
    # Ensure the writable home dir exists before any codex invocation.
    - name: Prepare writable home
      runs: |
        set -euo pipefail
        mkdir -p "${CODEX_HOME}"
    - uses: test/tw/ldd-check
    # NOTE: xcover coverage profiling is intentionally omitted. codex is a Rust
    # binary (coverage is not mandated for non-Go packages) and, more
    # importantly, xcover cannot instrument it: the `strip` pipeline removes the
    # symbol table, so xcover has no function names to match and falls back to
    # tracing the whole ELF. Because codex statically links a prebuilt V8
    # (rusty_v8) with an enormous symbol set, attaching uprobes across all of it
    # overruns the profiler and `xcover wait` times out before readiness. The
    # functional completion tests below exercise the installed binary directly.
    # Smoke: `codex --version` launches the binary and prints a version.
    - uses: test/tw/ver-check
      with:
        bins: codex
        version: ${{package.version}}
    # Smoke: `codex --help` confirms the binary starts and enters the CLI.
    - uses: test/tw/help-check
      with:
        bins: codex
    - name: Code mode host is installed
      runs: |
        set -euo pipefail
        /usr/lib/codex/bin/codex-code-mode-host --help
    # codex starts this daemon by default; it refuses to run unless codex is
    # installed as a complete package. It must not start its self-updater.
    - name: App-server daemon starts without auto-update
      runs: |
        set -euo pipefail
        codex app-server daemon start
        codex app-server daemon version | grep -F '"status":"running"'
        sleep 2
        # [p] keeps pgrep from matching this script.
        if pgrep -af 'pid-update-loo[p]'; then
          echo "daemon started its self-updater"
          exit 1
        fi
        marker="${CODEX_HOME}/packages/app-server-daemon/auto-update-version"
        if [ -e "${marker}" ]; then
          echo "daemon wrote ${marker}"
          exit 1
        fi
        codex app-server daemon stop
    # Functional: generate a bash completion script and verify real output. This
    # exercises the CLI's clap command tree end to end via the `completion`
    # subcommand and proves it emits a non-trivial, codex-specific completion
    # script. We assert both the binary name and the dialect's completion
    # registration construct so the test fails if the generator regresses.
    - name: Generate bash shell completions
      runs: |
        set -euo pipefail
        codex completion bash > /tmp/codex.bash
        # A real bash completion script must be non-empty, reference the binary
        # name, and register a completion via the bash `complete` builtin.
        test -s /tmp/codex.bash
        grep -F "codex" /tmp/codex.bash
        grep -F "complete" /tmp/codex.bash
    # Functional: the generator must also handle other shell dialects, proving
    # each backend produces distinct, non-empty, codex-specific output.
    - name: Generate zsh shell completions
      runs: |
        set -euo pipefail
        codex completion zsh > /tmp/_codex
        # clap_complete emits a `#compdef <bin>` directive and a `_codex` fn.
        test -s /tmp/_codex
        grep -F "#compdef" /tmp/_codex
        grep -F "_codex" /tmp/_codex
    - name: Generate fish shell completions
      runs: |
        set -euo pipefail
        codex completion fish > /tmp/codex.fish
        # fish completions are registered with `complete -c codex ...`.
        test -s /tmp/codex.fish
        grep -F "complete -c codex" /tmp/codex.fish

update:
  enabled: true
  github:
    identifier: openai/codex
    use-tag: true
    tag-filter-prefix: rust-v
    strip-prefix: rust-v
  ignore-regex-patterns:
    - '-alpha'
    - '-beta'
    - '-rc'
