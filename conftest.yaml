package:
  name: conftest
  version: "0.71.1"
  epoch: 2 # CVE-2026-78659
  description: Write tests against structured configuration data using the Open Policy Agent Rego query language
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # conftest shells out to git for `conftest pull` over git-based policy
      # sources; upstream's image installs it for the same reason.
      - git

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8f7ac015cb51d81992f2ffbe2b0c1451fd05d1c5
      repository: https://github.com/open-policy-agent/conftest
      tag: v${{package.version}}

  - uses: bump
    with:
      language: go
      deps: golang.org/x/net@v0.60.0

  - uses: go/build
    with:
      ldflags: -X github.com/open-policy-agent/conftest/internal/version.Version=${{package.version}}
      modroot: .
      output: conftest
      packages: .
      go-package: go-${{vars.go-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility symlinks placing conftest at the upstream image paths (/conftest and /usr/local/bin/conftest)
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      # Upstream's image ships the binary at /conftest (the ENTRYPOINT) and
      # symlinks it onto PATH at /usr/local/bin/conftest. Our binary lives at
      # /usr/bin/conftest, so recreate both upstream paths as symlinks to it.
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/local/bin"
          ln -sf ./usr/bin/conftest "${{targets.contextdir}}/conftest"
          ln -sf ../../bin/conftest "${{targets.contextdir}}/usr/local/bin/conftest"
    test:
      pipeline:
        - uses: test/tw/symlink-check
        - uses: test/tw/contains-files
          with:
            files: |
              /conftest
              /usr/local/bin/conftest

update:
  enabled: true
  github:
    identifier: open-policy-agent/conftest
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: conftest
    - uses: test/tw/ver-check
      with:
        bins: conftest
    - name: Deny policy rejects a non-conforming document
      runs: |
        mkdir -p policy
        cat > policy/deny.rego <<'EOF'
        package main
        deny contains msg if {
          input.kind != "Deployment"
          msg := "only Deployment is allowed"
        }
        EOF
        echo '{"kind":"Deployment"}' > pass.json
        echo '{"kind":"Service"}' > fail.json
        conftest test --policy policy pass.json
        ! conftest test --policy policy fail.json > out.txt 2>&1
        grep -F "only Deployment is allowed" out.txt
        # conftest parses CUE via the embedded cuelang library, so a .cue input
        # works without the standalone cue binary (dropped as a runtime dep).
        echo 'kind: "Deployment"' > config.cue
        conftest test --policy policy config.cue
