package:
  name: conjur-cli
  description: Conjur command line interface
  version: "9.3.1"
  epoch: 4 # CVE-2026-116587
  resources:
    memory: 4Gi

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7207d6a4a2005130978e10d03d7f6b55ab0216d6
      repository: https://github.com/cyberark/conjur-cli-go
      tag: v${{package.version}}

  - runs: |
      # GO-2026-5970: bump golang.org/x/text to v0.39.0
      # omnibump cannot parse this project's go.mod because it contains replace directives
      # with "latest" as the version (e.g. replace github.com/cyberark/conjur-api-go latest)
      # which are invalid per Go module spec. Use go get directly instead.
      # Running this before the bump step also lets the go tool rewrite the
      # "latest" replace to a canonical version so omnibump can parse go.mod.
      go get golang.org/x/text@v0.39.0
      go mod tidy

  - uses: bump
    with:
      language: go
      deps: |-
        golang.org/x/net@v0.60.0
        github.com/go-jose/go-jose/v4@v4.1.6
      replaces: golang.org/x/net=golang.org/x/net@v0.60.0

  - uses: go/build
    with:
      packages: ./cmd/conjur
      output: conjur
      tidy: true
      ldflags: |
        -X "github.com/cyberark/conjur-cli-go/pkg/version.Tag=$(git rev-parse --short HEAD)"
        -X "github.com/cyberark/conjur-cli-go/pkg/version.Version=${{package.version}}"
      go-package: go-1.27

update:
  enabled: true
  github:
    identifier: cyberark/conjur-cli-go
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  pipeline:
    - runs: |
        conjur -v | grep ${{package.version}}
        conjur -h
