package:
  name: conmon
  version: "2.2.1"
  epoch: 1 # add ldd-check and functional tests
  description: OCI container runtime monitor
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - automake
      - build-base
      - busybox
      - glib-dev
      - go-md2man
      - libseccomp-dev
      - systemd-dev # adds support for journald if libsystemd is detected by make

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/containers/conmon
      expected-commit: c8cc2c4db27531bd4e084ce7857f73cd21ee639d
      tag: v${{package.version}}

  - uses: autoconf/make

  - runs: |
      make install GOMD2MAN=$(which go-md2man) PREFIX=/usr DESTDIR="${{targets.destdir}}"

  - uses: strip

subpackages:
  - name: conmon-doc
    pipeline:
      - uses: split/manpages
    description: conmon manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: containers/conmon
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify conmon version output
      runs: |
        # Verify version output contains the version string
        conmon --version 2>&1 | grep -i "2.2.1"
    - name: Verify conmon rejects invocation without required arguments
      runs: |
        # conmon requires --cid, --cuuid, --runtime, --bundle flags;
        # invoking without them must exit non-zero with a usage error
        if conmon --socket-dir-path /tmp 2>/dev/null; then
          echo "ERROR: conmon should have exited non-zero without required args"
          exit 1
        fi
    - uses: test/no-docs
