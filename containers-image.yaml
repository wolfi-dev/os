package:
  name: containers-image
  version: "5.41.2"
  epoch: 0
  description: "Registry configuration for container tools"
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/containers/container-libs
      tag: image/v${{package.version}}
      expected-commit: b5becb3ba69affb5026fbbefe41cb4199a186482

  - runs: |
      # Set unqualified-search-registries
      sed -E 's/# (unqualified-search-registries =).*/\1 ["docker.io"]/' -i image/registries.conf

      # Create necessary directories
      mkdir -p "${{targets.destdir}}/etc/containers"
      mkdir -p "${{targets.destdir}}/usr/share/containers"

      # Install registries configuration
      install -m 644 image/registries.conf "${{targets.destdir}}/etc/containers/registries.conf"

# Note: This package should be updated in coordination with containers-common
# to maintain version synchronization across the container ecosystem
update:
  enabled: false
  manual: true
  exclude-reason: Package updates are coordinated with containers-common to maintain ecosystem synchronization

test:
  pipeline:
    - name: Verify registries configuration
      runs: |-
        # Verify the configuration file exists
        stat /etc/containers/registries.conf

        # Verify the key setting is present (set by the build pipeline via sed)
        grep -F 'unqualified-search-registries' /etc/containers/registries.conf

        # Verify docker.io is configured as a search registry
        grep -F 'docker.io' /etc/containers/registries.conf
