#nolint:valid-pipeline-git-checkout-tag
package:
  name: containers-shortnames
  version: 0_git20250724
  epoch: 3 # go/wolfi-rsc/containers-shortnames
  description: "Registry shortnames configuration for container tools"
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/containers/shortnames
      branch: main
      expected-commit: e893043ee00c29ac1083b2151d4fb287d939a9fc

  - runs: |
      # Create necessary directories
      mkdir -p "${{targets.destdir}}/etc/containers/registries.conf.d"

      # Install shortnames configuration as 000-shortnames.conf to match Fedora
      install -m 644 shortnames.conf "${{targets.destdir}}/etc/containers/registries.conf.d/000-shortnames.conf"

# Note: This package should be updated in coordination with containers-common
# to maintain version synchronization across the container ecosystem
update:
  enabled: false
  manual: true
  exclude-reason: Package updates are coordinated with containers-common to maintain ecosystem synchronization

test:
  pipeline:
    - uses: test/tw/contains-files
      with:
        files: /etc/containers/registries.conf.d/000-shortnames.conf
    - name: Verify shortnames configuration content
      runs: |
        set -euo pipefail
        conf=/etc/containers/registries.conf.d/000-shortnames.conf
        # File must be non-empty
        [ -s "$conf" ]
        # Must contain at least one shortname alias entry (key = "value" pattern)
        grep -q '^\s*"[^"]*"\s*=' "$conf"
        # Spot-check a well-known shortname that should always be present
        grep -q '"docker.io/library/alpine"' "$conf"
        echo "containers-shortnames configuration validated"
