package:
  name: containers-storage
  version: "1.64.1"
  epoch: 0
  description: "Storage configuration for container tools"
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/containers/container-libs
      tag: storage/v${{package.version}}
      expected-commit: 6eac452fac5c9d9ad8f86b6fd6109f8f32659f77

  - runs: |
      # Set the default storage driver to overlay
      sed -E 's/^# (driver = "overlay")$/\1/' -i storage/storage.conf

      # Create necessary directories
      mkdir -p "${{targets.destdir}}/etc/containers"
      mkdir -p "${{targets.destdir}}/usr/share/containers"

      # Install storage configuration
      install -m 644 storage/storage.conf "${{targets.destdir}}/etc/containers/storage.conf"
      install -m 644 storage/storage.conf "${{targets.destdir}}/usr/share/containers/storage.conf"

# Note: This package should be updated in coordination with containers-common
# to maintain version synchronization across the container ecosystem
update:
  enabled: false
  manual: true
  exclude-reason: Package updates are coordinated with containers-common to maintain ecosystem synchronization

test:
  pipeline:
    - name: Verify storage configuration
      runs: |-
        stat /etc/containers/storage.conf
        stat /usr/share/containers/storage.conf
        grep -Fx 'driver = "overlay"' /etc/containers/storage.conf
        if grep -E '^(graphroot|runroot)[[:space:]]*=' /etc/containers/storage.conf; then
          echo "graphroot/runroot must not be set in the main storage.conf"
          exit 1
        fi
        echo "containers-storage configuration verified"
