package:
  name: controller-gen
  version: "0.23.0"
  epoch: 0 # set bump language
  description: Tools to use with the controller-runtime libraries
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/controller-tools
      tag: v${{package.version}}
      expected-commit: def1e80f37df79392a4b233e49ddd2df1652fb34

  - uses: bump
    with:
      language: go
      modroot: |-
        pkg/applyconfiguration/testdata/cronjob
        .
        pkg/crd/testdata
        pkg/deepcopy/testdata
        pkg/schemapatcher/testdata
      deps: |-
        golang.org/x/text@v0.39.0
        golang.org/x/tools@v0.47.0

  - uses: go/build
    with:
      packages: ./cmd/controller-gen
      modroot: .
      output: controller-gen
      ldflags: -X main.version=${{package.version}} -X main.commit=$(git rev-parse HEAD) -X main.date=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")
      go-package: go-1.27

  - uses: strip

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/controller-tools
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  pipeline:
    - runs: |
        controller-gen --version
        controller-gen --help
