package:
  name: coreutils
  version: "9.12"
  epoch: 1 # glibc: 2.43->2.44
  description: "GNU core utilities"
  copyright:
    - license: GPL-3.0-or-later
  scriptlets:
    post-deinstall: |
      #!/usr/bin/busybox sh
      /usr/bin/busybox --install -s
  dependencies:
    runtime:
      - merged-bin
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "2"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - acl-dev
      - attr-dev
      - autoconf
      - automake
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - gettext-dev
      - glibc-2.44-dev
      - gperf
      - libselinux-dev
      - openssl-hardened-dev
      - patch
      - python3
      - texinfo
      - wget # for gnulib translations
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.savannah.gnu.org/git/coreutils.git
      tag: v${{package.version}}
      expected-commit: c0f8514d989184921d9b12a4d103a7b23abc5af8

  # coreutils 9.12 changed the quoting behavior of env and printenv.
  # Temporarily reverting this, and the related features that build upon
  # it (just to be safe) while we assess the impact:
  #  See: https://github.com/coreutils/coreutils/issues/355
  - uses: patch
    with:
      patches: |
        0001-Revert-tests-printenv-fix-a-false-failure-on-GNU-Hur.patch
        0002-Revert-tests-env-fix-a-false-failure-on-GNU-Hurd.patch
        0003-Revert-printenv-don-t-quote-output-when-given-argume.patch
        0004-Revert-env-translate-v-messages.patch
        0005-Revert-env-ensure-all-v-messages-are-quoted.patch
        0006-Revert-env-use-more-abstract-v-messages.patch
        0007-Revert-tests-provide-a-cmd_exe-helper-to-find-a-prog.patch
        0008-Revert-tests-env-avoid-false-failure-on-FreeBSD.patch
        0009-Revert-maint-avoid-Werror-maybe-uninitialized-with-g.patch
        0010-Revert-tests-env-fix-false-failure-in-recent-env0-fr.patch
        0011-Revert-env-use-argz-for-NUL-delimited-parsing.patch
        0012-Revert-env-allow-bare-env0-from-to-round-trip.patch
        0013-Revert-env-improve-performance-of-merging-environmen.patch
        0014-Revert-env-implement-full-round-tripping-for-i-env0-.patch
        0015-Revert-env-support-env0-from-to-read-NUL-separated-v.patch
        0016-Revert-env-printenv-with-null-avoid-CRLF-translation.patch
        0017-Revert-tests-env-printenv-fix-test-failures-on-macOS.patch
        0018-Revert-printenv-env-quote-problematic-variables.patch

  - uses: git/gnulib-bootstrap
    with:
      gnulib-git-repo-url: https://github.com/coreutils/gnulib.git

  - runs: |
      env FORCE_UNSAFE_CONFIGURE=1 ./configure \
         --prefix=/usr \
         --libdir=/lib \
         --libexecdir=/usr/libexec \
         --sysconfdir=/etc \
         --mandir=/usr/share/man \
         --infodir=/usr/share/info \
         --disable-nls \
         --enable-no-install-program=hostname,su,kill,uptime,groups \
         --with-openssl=auto-gpl-compat \
         --with-selinux \
         --enable-single-binary=symlinks

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

  - runs: |
      cd "${{targets.destdir}}"

      rm -rf usr/lib/charset.alias
      rmdir -p usr/lib 2>/dev/null || true

      # shouldn't be here, but you never know...
      rm -f usr/bin/groups

subpackages:
  - name: "coreutils-doc"
    description: "documentation for GNU coreutils"
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
    test:
      pipeline:
        - uses: test/tw/docs
    dependencies:
      runtime:
        - merged-bin
        - merged-usrsbin
        - wolfi-baselayout

  - name: "coreutils-legacy"
    description: "legacy GNU coreutils"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/md5sum "${{targets.subpkgdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/sha1sum "${{targets.subpkgdir}}"/usr/bin
    dependencies:
      runtime:
        - merged-bin
        - merged-usrsbin
        - wolfi-baselayout
    test:
      environment:
        contents:
          packages:
            - coreutils
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: |
              md5sum
              sha1sum
            expect-contains: checksums
        - runs: |
            echo "hello" | md5sum | grep -E "^[0-9a-f]{32}"
            echo "hello" | sha1sum | grep -E "^[0-9a-f]{40}"

