    - name: env and printenv do not quote redirected output
      runs: |
        export SPACED="a b -Dc=d"
        /usr/bin/env | grep -qx 'SPACED=a b -Dc=d'
        /usr/bin/printenv | grep -qx 'SPACED=a b -Dc=d'
        /usr/bin/printenv SPACED | grep -qx 'a b -Dc=d'
    - uses: test/tw/ldd-check
    - uses: test/no-docs
