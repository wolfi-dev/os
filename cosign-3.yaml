vars:
  go-version: "1.27"

var-transforms:
  - from: ${{package.name}}
    match: cosign-(\d+)
    replace: $1
    to: major-version

package:
  name: cosign-3
  version: "3.1.3"
  epoch: 3 # go: 1.26->1.27
  description: Container Signing (v${{vars.major-version}})
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - cosign=${{package.full-version}}
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-${{vars.go-version}}
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 11926fa5bbbbde47e88fc006b625a17769b743b2
      repository: https://github.com/sigstore/cosign
      tag: v${{package.version}}

  - uses: bump
    with:
      deps: |-
        google.golang.org/grpc@v1.82.1
        golang.org/x/text@v0.39.0

  - uses: go/build
    with:
      output: cosign
      packages: ./cmd/cosign
      go-package: go-${{vars.go-version}}
      ldflags: |
        -X sigs.k8s.io/release-utils/version.gitVersion=v${{package.version}}
        -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/release-utils/version.gitTreeState=$(git diff --quiet && echo clean || echo dirty)
        -X sigs.k8s.io/release-utils/version.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: cosign
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: cosign
    - name: Get an attestation and test
      runs: |
        set -euo pipefail
        arch=$(uname -m | sed -e "s/x86_64/amd64/" -e "s/aarch64/arm64/")
        cosign download attestation --platform=linux/$arch \
        --predicate-type=https://spdx.dev/Document \
        chainguard/curl | jq -r .payload | base64 -d | jq .predicate

update:
  enabled: true
  github:
    identifier: sigstore/cosign
    strip-prefix: v
    tag-filter-prefix: v3.
