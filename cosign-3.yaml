vars:
  go-version: "1.27"

var-transforms:
  - from: ${{package.name}}
    match: cosign-(\d+)
    replace: $1
    to: major-version

package:
  name: cosign-3
  version: "3.1.4"
  epoch: 2 # CVE-2026-114437
  description: Container Signing (v${{vars.major-version}})
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - cosign=${{package.full-version}}
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-${{vars.go-version}}
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0e48502cf5ef34e2e60bbd3617aa19945712f705
      repository: https://github.com/sigstore/cosign
      tag: v${{package.version}}

  - uses: bump
    with:
      deps: |-
        github.com/buildkite/agent/v3@v3.138.0
        golang.org/x/term@v0.47.0
        google.golang.org/protobuf@v1.36.12
        golang.org/x/crypto@v0.58.0
        github.com/sigstore/rekor@v1.5.5
      language: go

  - uses: go/build
    with:
      output: cosign
      packages: ./cmd/cosign
      go-package: go-${{vars.go-version}}
      ldflags: |
        -X sigs.k8s.io/release-utils/version.gitVersion=v${{package.version}}
        -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/release-utils/version.gitTreeState=$(git diff --quiet && echo clean || echo dirty)
        -X sigs.k8s.io/release-utils/version.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

  - uses: upstream-tests/go-test

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: cosign
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: cosign
    - name: Get an attestation and test
      runs: |
        set -euo pipefail
        arch=$(uname -m | sed -e "s/x86_64/amd64/" -e "s/aarch64/arm64/")
        cosign download attestation --platform=linux/$arch \
        --predicate-type=https://spdx.dev/Document \
        chainguard/curl | jq -r .payload | base64 -d | jq .predicate

update:
  enabled: true
  github:
    identifier: sigstore/cosign
    strip-prefix: v
    tag-filter-prefix: v3.
