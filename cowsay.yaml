package:
  name: cowsay
  version: 3.8.4
  epoch: 0
  description: Configurable talking cow (and a few other creatures)
  copyright:
    - license: GPL-3.0
  dependencies:
    runtime:
      - perl

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - make
      - perl

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cowsay-org/cowsay
      expected-commit: 027c9268ac8571408e153214b9cf1a5e6fab0cfc
      tag: v${{package.version}}

  - name: "Add custom Linky cow"
    runs: |
      mv linky.cow share/cowsay/cows/

  - runs: |
      # With prefix=/usr the cowsay script reads drop-in cowpath config from
      # /etc/cowsay/cowpath.d, so install the config dir there (not /usr/etc).
      make DESTDIR=${{targets.destdir}} prefix=/usr sysconfdir=/etc install

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - initial-import
  github:
    use-tag: true
    identifier: cowsay-org/cowsay
    strip-prefix: v
    tag-filter: v3

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        cowsay --version
        cowthink --version
        cowsay --help
        cowthink --help
        echo "The safe source for open source" | cowsay -f linky | grep -F "The safe source for open source"
