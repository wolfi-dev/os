package:
  name: crc32c
  version: 1.1.2
  epoch: 6
  description: CRC32C implementation with support for CPU-specific acceleration instructions
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake-3

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 02e65f4fd3065d27b2e29324800ca6d04df16126
      repository: https://github.com/google/crc32c
      tag: ${{package.version}}

  - uses: patch
    with:
      patches: 10-third-party.patch

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_SHARED_LIBS=True \
        -DCRC32C_BUILD_TESTS="OFF" \
        -DCRC32C_BUILD_BENCHMARKS="OFF" \
        -DCRC32C_USE_GLOG="OFF" \
        -DCRC32C_INSTALL="ON"

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: crc32c-dev
    pipeline:
      - uses: split/dev
    description: crc32c dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: google/crc32c
    use-tag: true

test:
  environment:
    contents:
      packages:
        - crc32c-dev
        - build-base
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test CRC32C library compilation and functionality
      runs: |
        cat > test.cpp << 'EOF'
        #include <crc32c/crc32c.h>
        #include <cstdint>
        #include <cstring>
        #include <cassert>
        int main() {
            const char* data = "hello world";
            uint32_t crc = crc32c::Crc32c(data, strlen(data));
            // Known CRC32C of "hello world" is 0xc99465aa
            assert(crc == 0xc99465aaU);
            return 0;
        }
        EOF
        g++ test.cpp -o test -lcrc32c
        ./test
