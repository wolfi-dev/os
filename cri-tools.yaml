package:
  name: cri-tools
  version: "1.37.0"
  epoch: 7 # toolchain rebuild for  go-1.27-1.27.4
  description: CLI and validation tools for Kubelet Container Runtime Interface (CRI) .
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 13496db06e3f6636a0855977dd86344698dfc501
      repository: https://github.com/kubernetes-sigs/cri-tools
      tag: v${{package.version}}

  - uses: bump
    with:
      deps: |-
        google.golang.org/grpc@v1.82.1
        go.opentelemetry.io/otel@v1.44.0
        go.opentelemetry.io/otel/sdk@v1.43.0
        go.opentelemetry.io/otel/trace@v1.44.0
        golang.org/x/text@v0.42.0
        golang.org/x/net@v0.60.0
        golang.org/x/sys@v0.48.0
        golang.org/x/term@v0.46.0
      language: go
      modroot: |-
        hack/tools
        .
      tidy: false

  - uses: bump
    with:
      language: go
      packages: |-
        go.opentelemetry.io/otel/sdk@v1.44.0
        google.golang.org/grpc@v1.82.1
        go.opentelemetry.io/otel@v1.44.0
        go.opentelemetry.io/otel/trace@v1.44.0
        golang.org/x/text@v0.42.0
        golang.org/x/net@v0.60.0
        golang.org/x/sys@v0.48.0
        golang.org/x/term@v0.46.0
      modroot: hack/tools

  - uses: go/build
    with:
      ldflags: -X sigs.k8s.io/cri-tools/pkg/version.Version=${{package.version}}
      output: crictl
      packages: ./cmd/crictl
      go-package: go-1.27

  - runs: |
      make critest
      install -Dm755 build/bin/linux/**/critest "${{targets.destdir}}"/usr/bin/critest

  # cmd/critest runs the CRI validation suite against a live container runtime and test/e2e drives crictl against one; the build sandbox has no CRI runtime.
  # TODO(upstream-tests): remove once upstream gates these behind -short.
  - uses: upstream-tests/go-test
    with:
      exclude-packages: ./cmd/critest/... ./test/...

  - uses: strip

subpackages:
  - name: "crictl"
    description: "CLI for kubelet CRI"
    pipeline:
      - runs: |
          install -Dm755 ${{targets.destdir}}/usr/bin/crictl ${{targets.subpkgdir}}/usr/bin/crictl
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: crictl

  - name: "critest"
    description: "validation test suites for kubelet CRI"
    pipeline:
      - runs: |
          install -Dm755 ${{targets.destdir}}/usr/bin/critest ${{targets.subpkgdir}}/usr/bin/critest
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: critest

  # crictl in /bin to match rancher/rke2-runtime, for the rke2-runtime -static
  # image, which RKE2 extracts to /var/lib/rancher/rke2/data and runs on the
  # host. go/build's netgo,osusergo tags and no cgo deps keep crictl static;
  # the test guards that.
  - name: crictl-static
    description: Statically linked crictl in /bin, for running outside the image
    options:
      no-commands: true
    checks:
      disabled:
        - usrmerge
    pipeline:
      - runs: |
          install -Dm755 ${{targets.destdir}}/usr/bin/crictl ${{targets.subpkgdir}}/bin/crictl
    test:
      environment:
        contents:
          packages:
            - binutils
      pipeline:
        - name: crictl is static (no ELF interpreter, no shared library dependencies)
          runs: |
            readelf -lW /bin/crictl > /tmp/phdr
            readelf -dW /bin/crictl > /tmp/dyn
            if grep -F 'Requesting program interpreter' /tmp/phdr; then exit 1; fi
            if grep -F '(NEEDED)' /tmp/dyn; then exit 1; fi
        - uses: test/tw/ver-check
          with:
            bins: crictl

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/cri-tools
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: crictl critest
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: crictl critest
