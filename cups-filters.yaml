package:
  name: cups-filters
  version: "2.0.1"
  epoch: 0
  description: OpenPrinting CUPS filters, backends and driverless PPD generator for IPP Everywhere and AirPrint printing
  copyright:
    # Upstream COPYING grants Apache-2.0 with an extra exception permitting
    # combination with GPL-2.0/LGPL-2.0 code; SPDX has no id for it.
    - license: Apache-2.0
  dependencies:
    runtime:
      - cups
      - ghostscript
      - poppler-utils

vars:
  glibc-version: "2.44"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - cups-dev
      - gettext
      - gettext-dev
      - glibc-${{vars.glibc-version}}-dev
      - libcupsfilters-dev
      - libppd-dev
      - libtool
      - pkgconf
      - pkgconf-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/OpenPrinting/cups-filters
      tag: ${{package.version}}
      expected-commit: 5a73330fbd0cde494d984141f9add1565aef8171

  # AM_GNU_GETTEXT_VERSION pins gettext 0.18.3, so autopoint copies 2013-era
  # macros into m4/; aclocal --install replaces them with gettext-dev's copies.
  - runs: |
      export ACLOCAL_PATH=/usr/share/gettext/m4:/usr/share/aclocal
      ACLOCAL_FLAGS=--install ./autogen.sh

  # pstops and rastertopwg stay at their upstream default (off) because cups
  # already ships both filters. mupdf is not packaged, so mutool is disabled.
  # foomatic-rip is the legacy PPD-driver path (CVE-2024-47177 chain) and is
  # not needed for driverless printing.
  - uses: autoconf/configure
    with:
      opts: |
        --disable-static \
        --disable-mutool \
        --disable-foomatic \
        --with-gs-path=/usr/bin/gs \
        --with-ippfind-path=/usr/bin/ippfind

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    description: Documentation for ${{package.name}}
    pipeline:
      - uses: split/alldocs
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: OpenPrinting/cups-filters
    use-tag: true

test:
  environment:
    contents:
      packages:
        - avahi
        - busybox
        - cups
        - dbus
        - ghostscript
        - poppler-utils
        - ttf-dejavu
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/contains-files
      with:
        files: /usr/lib/cups/filter/universal /usr/lib/cups/driver/driverless /usr/lib/cups/backend/beh /usr/share/cups/mime/cupsfilters-universal.convs
    - name: Filters are executable and foomatic-rip is not shipped
      runs: |
        test -x /usr/lib/cups/filter/universal
        test -x /usr/lib/cups/driver/driverless
        test -x /usr/lib/cups/backend/beh
        if [ -e /usr/lib/cups/filter/foomatic-rip ]; then
          echo "ERROR: foomatic-rip must not be shipped (built with --disable-foomatic)"
          exit 1
        fi
    - name: Generate PDF, PostScript, text and PNG fixtures
      runs: |
        mkdir -p /tmp/cf
        cd /tmp/cf || exit 1
        tee seed.ps <<'EOF'
        %!PS
        /Helvetica findfont 24 scalefont setfont
        72 700 moveto (cups-filters test page) show
        newpath 72 72 moveto 300 300 lineto stroke
        showpage
        EOF
        gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -sOutputFile=seed.pdf - < seed.ps
        [ "$(head -c 5 seed.pdf)" = "%PDF-" ]
        gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=png16m -r72 -sOutputFile=seed.png seed.ps
        [ "$(head -c 4 seed.png | tail -c 3)" = "PNG" ]
        printf 'Hello from cups-filters\nsecond line of plain text\n' > seed.txt
    # This build keeps the upstream default of only the universal filter, so
    # each upstream per-filter autopkgtest is driven through universal with the
    # CONTENT_TYPE -> FINAL_CONTENT_TYPE pair that selects the same conversion.
    - name: pdftopdf conversion (PDF to PDF)
      working-directory: /tmp/cf
      runs: |
        CONTENT_TYPE=application/pdf FINAL_CONTENT_TYPE=application/vnd.cups-pdf \
          /usr/lib/cups/filter/universal 1 tester autopkgtest 1 "" < seed.pdf > out_pdftopdf.pdf
        [ "$(head -c 5 out_pdftopdf.pdf)" = "%PDF-" ]
        pdfinfo out_pdftopdf.pdf | grep -E "^Pages: +1$"
    - name: pdftops conversion (PDF to PostScript)
      working-directory: /tmp/cf
      runs: |
        CONTENT_TYPE=application/pdf FINAL_CONTENT_TYPE=application/vnd.cups-postscript \
          /usr/lib/cups/filter/universal 1 tester autopkgtest 1 "" < seed.pdf > out_pdftops.ps
        [ "$(head -c 4 out_pdftops.ps)" = "%!PS" ]
        # Re-interpreting the PostScript proves it is valid and still one page,
        # whichever renderer (poppler or Ghostscript) libcupsfilters picked.
        gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -sOutputFile=roundtrip.pdf out_pdftops.ps
        pdfinfo roundtrip.pdf | grep -E "^Pages: +1$"
    - name: texttopdf conversion (plain text to PDF)
      working-directory: /tmp/cf
      runs: |
        CONTENT_TYPE=text/plain FINAL_CONTENT_TYPE=application/vnd.cups-pdf \
          /usr/lib/cups/filter/universal 1 tester autopkgtest 1 "" < seed.txt > out_texttopdf.pdf
        [ "$(head -c 5 out_texttopdf.pdf)" = "%PDF-" ]
        pdfinfo out_texttopdf.pdf | grep -E "^Pages: +1$"
    - name: gstopdf conversion (PostScript to PDF via Ghostscript)
      working-directory: /tmp/cf
      runs: |
        CONTENT_TYPE=application/postscript FINAL_CONTENT_TYPE=application/vnd.cups-pdf \
          /usr/lib/cups/filter/universal 1 tester autopkgtest 1 "" < seed.ps > out_gstopdf.pdf
        [ "$(head -c 5 out_gstopdf.pdf)" = "%PDF-" ]
        pdfinfo out_gstopdf.pdf | grep -E "^Pages: +1$"
    - name: imagetopdf conversion (PNG to PDF)
      working-directory: /tmp/cf
      runs: |
        CONTENT_TYPE=image/png FINAL_CONTENT_TYPE=application/vnd.cups-pdf \
          /usr/lib/cups/filter/universal 1 tester autopkgtest 1 "" < seed.png > out_imagetopdf.pdf
        [ "$(head -c 5 out_imagetopdf.pdf)" = "%PDF-" ]
        pdfinfo out_imagetopdf.pdf | grep -E "^Pages: +1$"
    - name: driverless generates a PPD from an IPP Everywhere printer
      working-directory: /tmp/cf
      runs: |
        # cups is built with DNS-SD, so ippeveprinter connects to avahi at
        # startup even with -r off (no registration); start dbus + avahi first.
        grep -q '^avahi:' /etc/passwd || { addgroup -S avahi; adduser -S -D -H -G avahi avahi; }
        # The system bus normally drops to the messagebus user, which a
        # rootless sandbox can't do; run it as root from a copy of the config.
        mkdir -p /run/dbus
        sed '/<user>/d' /usr/share/dbus-1/system.conf > /usr/share/dbus-1/system-root.conf
        dbus-daemon --config-file=/usr/share/dbus-1/system-root.conf --fork
        avahi-daemon -D --no-rlimits --no-drop-root
        sleep 2

        # ippeveprinter (from cups) emulates an IPP Everywhere printer on
        # loopback. Like many real printers (e.g. HP OfficeJet Pro 9010) it
        # takes PWG raster and JPEG but not PDF, so driverless must emit a
        # raster cupsFilter2 rather than a PDF passthrough.
        mkdir -p /tmp/cf/spool
        ippeveprinter -n localhost -p 8631 -r off -d /tmp/cf/spool \
          -f image/pwg-raster,image/jpeg "Test Printer" > ippeve.log 2>&1 &
        ippeve_pid=$!

        ok=0
        for _ in $(seq 1 30); do
          if /usr/lib/cups/driver/driverless ipp://localhost:8631/ipp/print > printer.ppd 2> driverless.err; then
            ok=1
            break
          fi
          sleep 1
        done
        kill "$ippeve_pid" || true
        if [ "$ok" != 1 ]; then
          cat driverless.err ippeve.log
          exit 1
        fi
        head -n 1 printer.ppd | grep -F "*PPD-Adobe"
        grep -F "image/pwg-raster" printer.ppd
    - name: universal renders PWG and CUPS raster with the driverless PPD
      working-directory: /tmp/cf
      runs: |
        PPD=/tmp/cf/printer.ppd CONTENT_TYPE=application/pdf FINAL_CONTENT_TYPE=image/pwg-raster \
          /usr/lib/cups/filter/universal 1 tester autopkgtest 1 "" < seed.pdf > out.pwg
        [ "$(head -c 4 out.pwg)" = "RaS2" ]
        [ "$(head -c 13 out.pwg | tail -c 9)" = "PwgRaster" ]

        # gstoraster equivalent: CUPS raster v2 (compressed) or v3.
        PPD=/tmp/cf/printer.ppd CONTENT_TYPE=application/pdf FINAL_CONTENT_TYPE=application/vnd.cups-raster \
          /usr/lib/cups/filter/universal 1 tester autopkgtest 1 "" < seed.pdf > out_gstoraster.ras
        [ -s out_gstoraster.ras ]
        # The sync word is written in native byte order: RaS2/RaS3 big-endian,
        # 2SaR/3SaR little-endian.
        head -c 4 out_gstoraster.ras | grep -E "^(RaS[23]|[23]SaR)$"
    - name: beh backend reports itself in device discovery
      runs: |
        /usr/lib/cups/backend/beh | grep -F "network beh"
