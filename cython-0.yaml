package:
  name: cython-0
  version: 0.29.37.1
  epoch: 4
  description: Cython is an optimising static compiler for both the Python & the extended Cython programming languages.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - cython=${{package.version}}-r${{package.epoch}}

vars:
  python-version: 3.12

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 598be7f9fd253c9e44f051f2235abedc66c022c1
      repository: https://github.com/cython/cython
      tag: ${{package.version}}

  - uses: py/pip-build-install

  - uses: strip

update:
  enabled: true
  github:
    identifier: cython/cython
    use-tag: true
    tag-filter: 0.

test:
  environment:
    contents:
      packages:
        - python-3.12
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test cython compilation
      runs: |
        cat > /tmp/hello.pyx << 'EOF'
        def say_hello(name):
            return f"Hello, {name}!"
        EOF
        cython --version
        cython /tmp/hello.pyx
        ls /tmp/hello.c
