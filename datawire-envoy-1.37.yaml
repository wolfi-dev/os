package:
  name: datawire-envoy-1.37
  version: "1.37.5"
  epoch: 0
  description: Ambassador fork of Envoy Proxy.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "33"
    memory: 50Gi
  dependencies:
    provides:
      - datawire-envoy=${{package.full-version}}

environment:
  contents:
    packages:
      - bash
      - bazel-7
      - binutils
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-${{vars.llvm-version}}
      - cmake
      - coreutils
      - git
      - libcap-utils
      - libcxx1-${{vars.llvm-version}}-dev
      - libtool
      - lld-${{vars.llvm-version}}
      - llvm-${{vars.llvm-version}}-dev
      - openjdk-21-default-jdk
      - patch
      - python3-dev
      - samurai
      - wolfi-baselayout

vars:
  llvm-version: 18

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/datawire/envoy
      tag: v${{package.version}}
      expected-commit: 15028393219ddec071b7234c24187b793412031b
      destination: envoy

  - working-directory: envoy
    uses: patch
    with:
      patches: |
        ../0001-Patch-toolchains_llvm-to-support-wolfi.patch

  - runs: |
      export CARGO_BAZEL_REPIN=true
      mkdir -p .cache/bazel/_bazel_root
      # Create symlinks for LLVM tools since the build expects version-suffixed names
      ln -sf /usr/bin/llvm-ar /usr/bin/llvm-ar-${{vars.llvm-version}}
      ln -sf /usr/bin/lld /usr/bin/ld.lld-${{vars.llvm-version}}
      ln -sf /usr/bin/lld /usr/lib/llvm-${{vars.llvm-version}}/bin/ld.lld-${{vars.llvm-version}}

      cd envoy
      # The Python interpreter complains about being run as root, there's a flag to pass to disable that warning.

      sed -i 's/envoy_dependencies_extra()/envoy_dependencies_extra(ignore_root_user_error=True)/g' WORKSPACE

      # liburing is built without builtins and fails to link with -ftrivial-auto-var-init=zero
      bazel build --verbose_failures \
        --config=clang-local \
        --action_env=LIBURING_CFLAGS="-ftrivial-auto-var-init=uninitialized" \
        --repo_env=BAZEL_LLVM_PATH=/usr/lib/llvm-${{vars.llvm-version}} \
        -c opt envoy

      mkdir -p ${{targets.destdir}}/usr/bin/
      mv bazel-bin/source/exe/envoy-static ${{targets.destdir}}/usr/bin/envoy

      # We no longer need this cache dir, which has some writable files.
      rm -rf ../.cache/bazel/_bazel_root

  - uses: strip

subpackages:
  - name: ${{package.name}}-privileged
    # See https://github.com/emissary-ingress/emissary/blob/ac2dc64c6621cd8ec5617f3328544364bdd3fb01/build-aux/Dockerfile#L129-L132
    description: Envoy binary with privileged capabilities enabled, required for downstream Ambassador usage.
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          cp -p ${{targets.destdir}}/usr/bin/envoy ${{targets.subpkgdir}}/usr/bin/envoy
          setcap cap_net_bind_service=ei ${{targets.subpkgdir}}/usr/bin/envoy
    dependencies:
      provides:
        - datawire-envoy-privileged=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: datawire-envoy-privileged
            real-pkg-name: ${{subpkg.name}}

update:
  enabled: true
  github:
    identifier: datawire/envoy
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v1.37

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        envoy --version
        envoy --help
