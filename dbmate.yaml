package:
  name: dbmate
  version: "2.35.1"
  epoch: 3 # CVE-2026-84304
  description: A lightweight, framework-agnostic database migration tool.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - mariadb-${{vars.mariadb-version}}-client
      - postgresql-${{vars.pg-version}}-client
      - sqlite
      - tzdata

vars:
  # Upstream Dockerfile (https://github.com/amacneil/dbmate/blob/v2.35.0/Dockerfile#L30-L34)
  # uses Alpine's unpinned `postgresql-client` / `mariadb-client` virtuals;
  # `apk info -v` on ghcr.io/amacneil/dbmate:latest resolves them to
  # postgresql18-client 18.4-r0 and mariadb-client 11.8.8-r0. Wolfi has no
  # such virtual, so pin the same majors here.
  mariadb-version: "11.8"
  pg-version: "18"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - sqlite-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/amacneil/dbmate
      tag: v${{package.version}}
      expected-commit: b735560813732661b34e1743cda76ec81ceb02bf

  - name: Drift check for upstream Alpine base
    runs: |
      # https://github.com/amacneil/dbmate/blob/v${{package.version}}/Dockerfile
      # If upstream bumps the Alpine base, re-verify vars.pg-version and
      # vars.mariadb-version against `apk info -v` on the new image.
      grep -F "FROM alpine:3.24.1 as release" Dockerfile || {
        echo "ERROR: Upstream Alpine base changed; re-verify pg-version and mariadb-version"; exit 1
      }

  - uses: bump
    with:
      deps: |-
        go.opentelemetry.io/otel@v1.44.0
        go.opentelemetry.io/otel/metric@v1.44.0
        go.opentelemetry.io/otel/trace@v1.44.0
        golang.org/x/text@v0.39.0
        google.golang.org/grpc@v1.83.1

  - uses: go/build
    with:
      packages: ./
      output: dbmate
      go-package: go-1.27
      # libsqlite3 replaces upstream's vendored amalgamation (Makefile:
      # https://github.com/amacneil/dbmate/blob/v2.35.1/Makefile#L12)
      # with Wolfi's shared libsqlite3 from sqlite-dev.
      tags: libsqlite3,sqlite_omit_load_extension

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package to place binaries in location expected by upstream Docker image
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/local/bin"
          # Relative symlink: from /usr/local/bin/ up 2 levels to /usr/ then into bin/
          ln -sf ../../bin/dbmate "${{targets.contextdir}}/usr/local/bin/dbmate"
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  github:
    identifier: amacneil/dbmate
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: dbmate
    - uses: test/tw/help-check
      with:
        bins: dbmate
    - name: Test migration file creation
      runs: |
        # Create a new migration using dbmate new
        dbmate new test_migration

        # Verify the migration file was created in the default db/migrations directory
        ls db/migrations/ | grep -F "test_migration" || {
          echo "FAIL: Migration file not found"
          exit 1
        }

        # Verify the migration file contains expected SQL markers
        migration_file=$(ls db/migrations/*test_migration*)
        grep -F "migrate:up" "$migration_file" || {
          echo "FAIL: Migration file missing 'migrate:up' marker"
          exit 1
        }
        grep -F "migrate:down" "$migration_file" || {
          echo "FAIL: Migration file missing 'migrate:down' marker"
          exit 1
        }

        echo "SUCCESS: Migration file created and validated"
