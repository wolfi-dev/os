package:
  name: dbus-glib
  version: "0.114"
  epoch: 5 # go/wolfi-rsc/dbus-glib
  description: GLib bindings for DBUS
  copyright:
    - license: AFL-2.1 OR GPL-2.0-or-later
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - dbus-dev
      - expat-dev
      - gettext-dev
      - glib-dev
      - glibc-2.43-dev
      - gtk-doc
      - libtool
      - pkgconf-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/dbus/dbus-glib
      tag: dbus-glib-${{package.version}}
      expected-commit: 623a4f3386a675060335e20afd810c6e10ae2cc8

  - runs: NOCONFIGURE=1 ./autogen.sh

  - uses: autoconf/configure
    with:
      opts: |
        --enable-gtk-doc

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: dbus-glib-dev
    pipeline:
      - uses: split/dev
    description: dbus-glib dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: dbus-glib-doc
    pipeline:
      - uses: split/manpages
    description: dbus-glib manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 1979

test:
  environment:
    contents:
      packages:
        - glib-dev
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: dbus-binding-tool
    - uses: test/tw/help-check
      with:
        bins: dbus-binding-tool
    - uses: test/tw/ldd-check
    - uses: test/no-docs
    - name: Test dbus-binding-tool code generation
      runs: |
        # Write a D-Bus XML interface definition via base64 to avoid
        # shell-quoting issues when sent over SSH into the QEMU runner.
        # Pre-encoded content of:
        #   <node>
        #     <interface name="org.example.TestIface">
        #       <method name="HelloWorld">
        #         <arg type="s" name="greeting" direction="in"/>
        #         <arg type="s" name="response" direction="out"/>
        #       </method>
        #     </interface>
        #   </node>
        printf '%s'  | base64 -d > /tmp/test-iface.xml

        # Generate server-side GLib bindings and verify output contains prefix
        dbus-binding-tool --prefix=test_iface --mode=glib-server /tmp/test-iface.xml > /tmp/test-server.h
        grep -F "test_iface" /tmp/test-server.h
