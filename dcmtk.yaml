package:
  name: dcmtk
  version: "3.7.0"
  epoch: 8 # openssl: 3.6->4.0, backport OpenSSL 4 support
  description: "DCMTK is a collection of libraries and applications implementing large parts the DICOM standard."
  copyright:
    - license: "MIT"
  resources:
    cpu: "24"
    memory: 14Gi

vars:
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - build-base
      - glibc-2.44-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libxml2-dev
      - openssl-${{vars.openssl-version}}-dev # FTBFS with openssl-hardened-dev due to missing OPENSSL_no_config, SSL_library_init, SSL_load_error_strings, OpenSSL_add_all_algorithms
      - tiff-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/DCMTK/dcmtk
      tag: DCMTK-${{package.version}}
      expected-commit: ccfd10b84ff3c9a40b7b331698aedf06d421fc43

  # OpenSSL 4.0 makes ASN1_STRING opaque and constifies X509_EXTENSION getters.
  - uses: patch
    with:
      patches: 0001-Adapted-DCMTK-for-use-with-OpenSSL-4.0.0.patch

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DBUILD_SHARED_LIBS=ON \
        -DDCMTK_WITH_PNG=ON \
        -DDCMTK_WITH_TIFF=ON \
        -DDCMTK_WITH_XML=ON \
        -DDCMTK_WITH_ZLIB=ON

  - uses: cmake/build

  - uses: cmake/install

  - runs: |
      # Create compatibility symlink for software expecting /usr/share/dcmtk
      ln -sf dcmtk-${{package.version}} ${{targets.destdir}}/usr/share/dcmtk

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: Development files for DCMTK
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - dcmtk
        - openssl-${{vars.openssl-version}}-dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/devpackage
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: ${{package.name}} manpages
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-dev
        - gcc
        - openssl-${{vars.openssl-version}}
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: |
          dcmdump
          dcmconv
          storescu
          storescp
          dcm2pnm
          img2dcm
    - uses: test/tw/help-check
      with:
        bins: |
          dcmdump
          dcmconv
          storescu
          storescp
          dcm2pnm
          img2dcm
    - name: Test basic DICOM functionality
      runs: |
        cat > /tmp/test_dcmtk.cpp << 'EOF'
        #include <dcmtk/dcmdata/dctk.h>
        #include <dcmtk/dcmdata/dcfilefo.h>
        #include <iostream>

        int main() {
            // Test basic DCMTK initialization
            DcmFileFormat fileformat;
            DcmDataset *dataset = fileformat.getDataset();

            if (!dataset) {
                std::cerr << "Failed to create DCMTK dataset" << std::endl;
                return 1;
            }

            // Test adding a basic DICOM element
            OFCondition status = dataset->putAndInsertString(DCM_PatientName, "Test^Patient");
            if (status.bad()) {
                std::cerr << "Failed to add DICOM element: " << status.text() << std::endl;
                return 1;
            }

            // Test reading the element back
            OFString patientName;
            status = dataset->findAndGetOFString(DCM_PatientName, patientName);
            if (status.bad()) {
                std::cerr << "Failed to read DICOM element: " << status.text() << std::endl;
                return 1;
            }

            if (patientName != "Test^Patient") {
                std::cerr << "Expected 'Test^Patient', got '" << patientName << "'" << std::endl;
                return 1;
            }

            std::cout << "DCMTK basic functionality test passed!" << std::endl;
            std::cout << "Patient name: " << patientName << std::endl;

            return 0;
        }
        EOF

        # Compile and run the test
        g++ -o /tmp/test_dcmtk /tmp/test_dcmtk.cpp \
            -I/usr/include/dcmtk \
            -ldcmdata -lofstd -loflog \
            -lpthread

        /tmp/test_dcmtk
        echo "DCMTK C++ functionality test completed successfully!"
    - name: Sign and verify with dcmsign (certificate validity and timestamp query)
      runs: |
        set -eu
        cd "$(mktemp -d)"
        cat > in.dump <<'EOF'
        (0008,0016) UI =SecondaryCaptureImageStorage
        (0008,0018) UI [1.2.826.0.1.3680043.2.1125.99.1]
        (0010,0010) PN [Test^Patient]
        (0010,0020) LO [12345]
        EOF
        dump2dcm in.dump in.dcm

        mkcert() {
          name=$1
          shift
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -subj "/CN=dcmsign $name/" \
            -keyout "$name.key" -out "$name.crt" "$@" 2>/dev/null
        }
        # dcmsign treats a signature made in the same second as notBefore as
        # "not yet valid" (strict comparison), so start validity in the past
        mkcert valid -not_before 20200101000000Z -not_after 20991231000000Z
        mkcert expired -not_before 20200101000000Z -not_after 20200102000000Z
        mkcert future -not_before 20450101000000Z -not_after 20451231000000Z

        # run LOG CMD...: keep output in LOG, show it, and pass the exit status on
        run() {
          log=$1
          shift
          rc=0
          "$@" > "$log" 2>&1 || rc=$?
          cat "$log"
          return "$rc"
        }

        # Valid certificate: no validity warnings at signing
        # (isCertExpiredNow/isCertNotYetValidNow), and the timestamp query
        # built by create_ts_query() must be a well-formed TSQ with a nonce.
        # dcmsign's default RIPEMD-160 MAC fails in EVP_DigestInit_ex() here
        # (also with the OpenSSL 3.6 build), so sign with SHA-256
        run sign-valid.log dcmsign --mac-sha256 --sign valid.key valid.crt \
          --timestamp-file query.tsq query.uid in.dcm valid.dcm
        if grep -E "has expired|not yet valid" sign-valid.log; then
          echo "FAIL: validity warning for a currently valid certificate"
          exit 1
        fi
        openssl ts -query -in query.tsq -text > tsq.txt
        cat tsq.txt
        grep -E "Hash Algorithm: sha256" tsq.txt
        grep -E "Nonce: 0x[0-9A-Fa-f]+" tsq.txt

        # Verification compares the signature date with notBefore/notAfter
        # through convertGeneralizedTime()
        run verify-valid.log dcmsign --verify --add-cert-file valid.crt valid.dcm
        grep -E "Signature Verification +: OK" verify-valid.log

        # Expired certificate: warning at signing, verification must fail
        run sign-expired.log dcmsign --mac-sha256 --sign expired.key expired.crt in.dcm expired.dcm
        grep -F "Certificate has expired" sign-expired.log
        run verify-expired.log dcmsign --verify --add-cert-file expired.crt expired.dcm || true
        if grep -E "Signature Verification +: OK" verify-expired.log; then
          echo "FAIL: signature from an expired certificate verified"
          exit 1
        fi
        grep -F "certificate was expired at signature creation date" verify-expired.log

        # Not-yet-valid certificate: warning at signing, verification must fail
        run sign-future.log dcmsign --mac-sha256 --sign future.key future.crt in.dcm future.dcm
        grep -F "Certificate is not yet valid" sign-future.log
        run verify-future.log dcmsign --verify --add-cert-file future.crt future.dcm || true
        if grep -E "Signature Verification +: OK" verify-future.log; then
          echo "FAIL: signature from a not-yet-valid certificate verified"
          exit 1
        fi
        grep -F "certificate was not yet valid at signature creation date" verify-future.log

update:
  enabled: true
  ignore-regex-patterns:
    - "_[0-9]{8}$"
  github:
    identifier: DCMTK/dcmtk
    use-tag: true
    strip-prefix: DCMTK-
    tag-filter-prefix: DCMTK-
