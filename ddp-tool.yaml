#nolint:valid-pipeline-git-checkout-tag
package:
  name: ddp-tool
  version: "1.0.34.0_git20260910"
  epoch: 0 # go/wolfi-rsc/ddp-tool
  description: Intel Dynamic Device Personalization Tool
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gcc
      - gcc-14-default
      - glibc-2.44-dev
      - make

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e61f694e8e73e3d529f919f40d2d96aaf6121367
      repository: https://github.com/intel/ddp-tool/
      branch: master

  - runs: |
      export CFLAGS=${CFLAGS/-Wp,-D_FORTIFY_SOURCE=3/}
      export CPPFLAGS="$CFLAGS"
      export CXXFLAGS="$CFLAGS"
      mkdir -p "${{targets.contextdir}}"/usr/bin
      make ddptool
      install -Dm755 ddptool "${{targets.contextdir}}"/usr/bin/ddptool

  - uses: strip

update:
  enabled: true
  git: {}
  schedule:
    period: daily
    reason: Upstream does not maintain tags or releases

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        ddptool -j > /tmp/ddptool-out.txt 2>&1 || grep -F "No driver available" /tmp/ddptool-out.txt
