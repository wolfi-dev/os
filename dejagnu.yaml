package:
  name: dejagnu
  version: "1.6.3"
  epoch: 0
  description: GNU framework for testing other programs, providing the runtest driver
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - expect
      # commands/report-card.awk uses printf "%*s" dynamic field widths,
      # which busybox awk rejects ("%*x formats are not supported").
      - gawk
      - tcl

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - expect
      - gawk
      - glibc-2.44-dev
      - tcl
      - texinfo

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.savannah.gnu.org/git/dejagnu.git
      tag: dejagnu-${{package.version}}-release
      expected-commit: d51e3f9f8188a735a64e7b2348e8fb7084f1d666

  # Tcl 9 compatibility fixes backported from upstream master (PR80674,
  # PR81083), ChangeLog hunks dropped; the same set Fedora carries as
  # tcl9.patch. Drop when a release after 1.6.3 includes them.
  #   0001 3d1fa86a0801e982d817c2d15f34bce61c8e21c3 qemu.exp: case -> switch
  #   0002 6f18e7a98ccd6e2f634ab56dbf965c94d7df73b2 diff: -translation binary
  #   0003 90ffbb7db86494641f9578e953575befb8dadca6 runtest: LC_ALL=C
  #   0004 f8737d9707b00069f35565d65b156a6567ab50a5 load $HOME/.dejagnurc
  #   0005 df37452fa640af0479c1533fd81c7235a92da2ff guard unset HOME
  - uses: patch
    with:
      patches: |
        0001-Convert-Tcl-case-to-switch-in-baseboards-qemu.exp.patch
        0002-Change-use-of-fconfigure-n-to-accommodate-Tcl-9.patch
        0003-Ensure-that-testsuites-run-in-the-POSIX-locale.patch
        0004-Remove-use-of-tilde-expansion-to-accommodate-Tcl-9.patch
        0005-Avoid-error-if-HOME-is-not-set-in-the-environment.patch

  # The release tag commits the generated configure and Makefile.in, so no
  # autoreconf is needed.
  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  # DejaGnu prints "# of expected passes" summaries, which make-check does
  # not parse; runtest exits non-zero on any FAIL/UNRESOLVED/ERROR, and make
  # check propagates that (exit 2), so gate on the exit status.
  - uses: upstream-tests/make-check
    with:
      harness: custom

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    description: Man pages and info manual for ${{package.name}}
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  git:
    tag-filter-prefix: dejagnu-
    tag-filter-contains: -release
    strip-prefix: dejagnu-
    strip-suffix: -release

test:
  pipeline:
    - name: runtest reports the packaged DejaGnu version
      runs: |
        runtest --version
        runtest --version | grep -E "DejaGnu version[[:space:]]+${{package.version}}$"
    - name: dejagnu launcher reports the packaged version
      runs: |
        dejagnu --version
        dejagnu --version | grep -F "${{package.version}}"
    - name: Run a minimal DejaGnu testsuite through runtest and expect
      runs: |
        mkdir -p /tmp/dg/testsuite/hello.tests
        cat > /tmp/dg/testsuite/hello.tests/hello.exp <<'EOF'
        pass "hello world"
        set timeout 10
        spawn echo greetings-from-expect
        expect {
          "greetings-from-expect" { pass "spawned program output matched" }
          timeout { fail "spawned program output matched" }
        }
        EOF
        cd /tmp/dg
        runtest --tool hello --srcdir testsuite
        cat hello.sum
        grep -Fx "PASS: hello world" hello.sum
        grep -Fx "PASS: spawned program output matched" hello.sum
        grep -E "^# of expected passes[[:space:]]+2$" hello.sum
        if grep -E "^(FAIL|UNRESOLVED|ERROR):" hello.sum; then
          exit 1
        fi
    - name: A failing test is recorded as FAIL and runtest exits non-zero
      runs: |
        mkdir -p /tmp/dgf/testsuite/broken.tests
        cat > /tmp/dgf/testsuite/broken.tests/broken.exp <<'EOF'
        pass "this one passes"
        fail "this one fails"
        EOF
        cd /tmp/dgf
        rc=0
        runtest --tool broken --srcdir testsuite || rc=$?
        cat broken.sum
        echo "runtest exit status: $rc"
        [ "$rc" -ne 0 ]
        grep -Fx "FAIL: this one fails" broken.sum
        grep -E "^# of unexpected failures[[:space:]]+1$" broken.sum
