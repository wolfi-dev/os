package:
  name: delta
  version: "0.22.0"
  epoch: 0 # rust: 1.99->1.100
  description: Syntax-highlighting pager for git and diff output
  copyright:
    - license: MIT
  resources:
    cpu: "5"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  rust-version: "1.100"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dandavison/delta
      tag: ${{package.version}}
      expected-commit: 6fb34c9c51ec82888a9da7024c6fdec7511271e6

  - uses: bump
    with:
      language: rust

  - runs: |
      cargo build --release
      install -Dm755 target/release/delta "${{targets.destdir}}"/usr/bin/delta

  - uses: upstream-tests/cargo-test

  - uses: strip

test:
  pipeline:
    - runs: |
        delta --version
        delta --help

update:
  enabled: true
  github:
    identifier: dandavison/delta
