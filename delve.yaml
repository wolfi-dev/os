package:
  name: delve
  version: "1.27.2"
  epoch: 3 # toolchain rebuild for  go-1.27-1.27.3
  description: Delve is a debugger for the Go programming language.
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/go-delve/delve
      tag: v${{package.version}}
      expected-commit: d116177dd925e085ba5dd340f8c644f4a1501a3b

  - runs: |
      make build
      mkdir -p ${{targets.destdir}}/usr/bin/
      mv dlv ${{targets.destdir}}/usr/bin/

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility symlink placing dlv at the filesystem root (/dlv)
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          # Upstream chaos-mesh images/chaos-dlv/Dockerfile does
          #   COPY --from=build-env /go/bin/dlv /
          #   CMD ["sh", "-c", "/dlv attach ... --listen=:8000 ..."]
          # so the binary must be reachable at the absolute path /dlv.
          # Use a relative link so the symlink stays relocatable.
          mkdir -p "${{targets.contextdir}}"
          ln -sf usr/bin/dlv "${{targets.contextdir}}/dlv"
    test:
      pipeline:
        - uses: test/tw/symlink-check
        # Regression test: the root-level compat path must exist, resolve to the
        # packaged binary, and be executable, matching the upstream chaos-dlv
        # launch contract `sh -c "/dlv attach ..."`.
        - name: Root-level /dlv compat path works
          runs: |
            test -L /dlv
            [ "$(readlink -f /dlv)" = "/usr/bin/dlv" ]
            test -x /dlv
            /dlv version
            /dlv help attach

update:
  enabled: true
  github:
    identifier: go-delve/delve
    strip-prefix: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        dlv --version
        dlv --help
