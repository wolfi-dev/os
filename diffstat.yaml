package:
  name: diffstat
  version: "1.69"
  epoch: 0
  description: "Histogramm-Generator für diff-Ausgaben"
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox
      - build-base
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      uri: https://invisible-island.net/archives/${{package.name}}/${{package.name}}-${{package.version}}.tgz
      expected-sha256: bb02464072f769dd9832fd999526734c90eb4d66fb56d5351540a750c88a77f6

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 434