package:
  name: dnsmasq
  version: "2.93"
  epoch: 2 # add dnsmasq-utils
  description: dnsmasq provides Domain Name System caching, a Dynamic Host Configuration Protocol server, router advertisement and network boot features
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - patch

pipeline:
  - uses: git-checkout
    with:
      repository: https://thekelleys.org.uk/git/dnsmasq.git
      tag: v${{package.version}}
      expected-commit: 3ff66da573a77c8783deca10ec8c6bba07cd85e6

  - uses: patch
    with:
      patches: config-defaults.patch

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      mv ${{targets.destdir}}/usr/local/sbin ${{targets.destdir}}/usr/sbin
      mv ${{targets.destdir}}/usr/local/share ${{targets.destdir}}/usr/share
      rmdir ${{targets.destdir}}/usr/local
      mkdir -p ${{targets.destdir}}/usr/bin
      mv ${{targets.destdir}}/usr/sbin/* ${{targets.destdir}}/usr/bin
      rmdir ${{targets.destdir}}/usr/sbin

  # contrib/lease-tools: dhcp_release, dhcp_release6, dhcp_lease_time.
  - runs: |
      make -C contrib/lease-tools
      for _m in dhcp_release dhcp_release6 dhcp_lease_time; do
        install -Dm644 contrib/lease-tools/${_m}.1 \
          ${{targets.destdir}}/usr/share/man/man1/${_m}.1
      done

  - uses: strip

subpackages:
  - name: dnsmasq-utils
    description: dnsmasq lease tools (dhcp_release, dhcp_release6, dhcp_lease_time)
    pipeline:
      - runs: |
          for _b in dhcp_release dhcp_release6 dhcp_lease_time; do
            install -Dm755 contrib/lease-tools/${_b} \
              ${{targets.contextdir}}/usr/bin/${_b}
          done
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - dnsmasq
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/help-check
          with:
            bins: dhcp_release6
            expect-contains: Usage
        - name: dhcp_release6 builds a release packet without sending it
          runs: |
            dhcp_release6 --ip 2001:db8::10 --iface lo --server-id 0001 \
              --client-id 0002 --iaid 1 --dry-run > /tmp/pkt
            cat /tmp/pkt
            # First byte is the DHCPv6 RELEASE message type (8).
            grep -q '^8' /tmp/pkt
        - name: dhcp_lease_time and dhcp_release against a dnsmasq DHCP server on lo
          uses: test/daemon-check-output
          with:
            setup: |
              echo "$(($(date +%s) + 3600)) 52:54:00:12:34:56 127.0.0.50 * *" > /tmp/leases
            start: >-
              dnsmasq --no-daemon --port=0 --user=root --interface=lo --bind-interfaces --dhcp-range=127.0.0.50,127.0.0.60,1h --dhcp-leasefile=/tmp/leases --log-facility=-
            expected_output: DHCP, IP range 127.0.0.50
            post: |
              dhcp_lease_time 127.0.0.50
              dhcp_release lo 127.0.0.50 52:54:00:12:34:56
              sleep 1
              if dhcp_lease_time 127.0.0.50; then
                echo "lease was not released"
                exit 1
              fi

  - name: dnsmasq-doc
    description: dnsmasq documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v
  ignore-regex-patterns:
    - rc
    - test

test:
  pipeline:
    - runs: |
        dnsmasq -v
        dnsmasq --version
        dnsmasq --help
    - uses: test/no-docs
