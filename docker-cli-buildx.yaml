package:
  name: docker-cli-buildx
  version: "0.36.1"
  epoch: 3 # toolchain rebuild for  go-1.27-1.27.1
  description: buildx is a Docker CLI plugin for extended build capabilities with BuildKit.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 9Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27
  # this explicit environment is required else we run into build failures.
  environment:
    CGO_ENABLED: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/docker/buildx
      tag: v${{package.version}}
      expected-commit: 1d8dde89b8aba914e05e45366770736fea1fd690

  - uses: bump
    with:
      deps: github.com/moby/go-archive@v0.3.0

  - uses: go/build
    with:
      go-package: go-1.27
      packages: ./cmd/buildx
      install-dir: libexec/docker/cli-plugins/
      output: docker-buildx
      ldflags: -X github.com/docker/buildx/version.Version=${{package.version}}

test:
  pipeline:
    - runs: |
        set -euo pipefail
        /usr/libexec/docker/cli-plugins/docker-buildx version | grep -F "${{package.version}}"

update:
  enabled: true
  github:
    identifier: docker/buildx
    strip-prefix: v
    tag-filter: v
