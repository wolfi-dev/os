package:
  name: docker-compose
  version: "5.7.1"
  epoch: 1 # CVE-2026-128085
  description: Define and run multi-container applications with Docker
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - btrfs-progs-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - containerd
      - coreutils
      - findutils # upstream-tests/go-test: pkg/watch tests count inotify fds with find -printf (GNU findutils)
      - glibc-2.44-dev
      - go-1.27
      - libseccomp-dev
      - libtool
      - linux-headers
      - lvm2-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/docker/compose
      tag: v${{package.version}}
      expected-commit: fb1fd129f86828359335477f82821525201d4a8c

  - uses: bump
    with:
      language: go
      deps: |-
        github.com/klauspost/compress@v1.20.2
        go.opentelemetry.io/otel/sdk@v1.47.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.47.0
        go.opentelemetry.io/otel/metric@v1.47.0
        go.opentelemetry.io/otel/trace@v1.47.0
        go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.47.0
        go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.47.0
        go.opentelemetry.io/otel/sdk/metric@v1.47.0
        go.opentelemetry.io/otel@v1.47.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.47.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.47.0

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      DESTDIR=${{targets.destdir}}/usr/bin/ make build

      # Create CLI plugin symlink so 'docker compose' works
      mkdir -p ${{targets.destdir}}/usr/libexec/docker/cli-plugins
      ln -sf ../../../bin/docker-compose ${{targets.destdir}}/usr/libexec/docker/cli-plugins/docker-compose

  - uses: upstream-tests/go-test

test:
  environment:
    contents:
      packages:
        - docker-cli
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: docker-compose
    - uses: test/tw/ver-check
      with:
        bins: docker-compose
        version: ${{package.version}}
    # Verify CLI plugin symlink exists
    - runs: |
        test -L /usr/libexec/docker/cli-plugins/docker-compose
        readlink /usr/libexec/docker/cli-plugins/docker-compose | grep -F "bin/docker-compose"
    # Verify docker compose subcommand works
    - runs: |
        docker compose version
        docker compose version | grep -F "${{package.version}}"

update:
  enabled: true
  github:
    identifier: docker/compose
    strip-prefix: v
    tag-filter: v
