package:
  name: docker-credential-acr-env
  version: 0.7.0
  epoch: 43 # GO-2026-6225: build the patched copy carried in chainguard-forks/kaniko
  description: ACR Docker Credential Helper
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

# Upstream github.com/chrismellard/docker-credential-acr-env has been
# unmaintained since March 2023 and has no fix for GO-2026-6225: its ACR
# hostname regex is unanchored, so a lookalike registry such as
# evil.azurecr.io.attacker.com was handed the Azure AD (ARM) token.
#
# The EmeritOSS kaniko fork carries a patched copy of the helper as ordinary
# packages of its own module (third_party/docker-credential-acr-env, see
# PATCHES.md there) and links it in-process. Build the standalone binary from
# that same source so the executor and the helper ship the same fix. The copy
# is upstream master at 82a0ddb (0.7.0 plus the GHSA-w73w-5m7g-f7qc jwt bump
# and federated-token support) plus the hostname fix, so the cherry-pick and
# dependency bumps the previous recipe carried are already included.
vars:
  kaniko-version: "1.25.20"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-forks/kaniko
      tag: v${{vars.kaniko-version}}
      expected-commit: 96c054c1ad599d10a6bab32bc2b3f2e1b6b8396e

  - uses: go/build
    with:
      packages: ./third_party/docker-credential-acr-env
      output: docker-credential-acr-env

  - name: Run the helper's unit tests (host-check table and not-found contract)
    runs: |
      go test ./third_party/docker-credential-acr-env/...

  - uses: strip

update:
  enabled: false
  exclude-reason: |
    Upstream chrismellard/docker-credential-acr-env is archived (last commit
    2023-03-04). The source is the patched copy in chainguard-forks/kaniko;
    bump vars.kaniko-version by hand when that fork releases.

test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: docker-credential-acr-env
    - name: GO-2026-6225 regression - lookalike ACR host is refused before any token request
      runs: |
        set -euo pipefail
        bin=/usr/bin/docker-credential-acr-env

        # The reserved .invalid TLD plus a non-existent AZURE_ENVIRONMENT mean
        # that even an unpatched helper would fail before any network or
        # token request. The patched helper must refuse the host outright.
        out="$(printf 'evil.azurecr.io.example.invalid' | env -i HOME=/tmp AZURE_ENVIRONMENT=no-such-cloud "$bin" get 2>&1 || true)"
        echo "lookalike: $out"
        case "$out" in
          *"credentials not found"*) echo "PASS: lookalike ACR host refused" ;;
          *) echo "FAIL: lookalike ACR host was not refused (GO-2026-6225)"; exit 1 ;;
        esac

        # A genuine ACR host must still take the normal path: with no Azure
        # settings it fails while acquiring the service-principal token,
        # not with "credentials not found".
        out="$(printf 'foo.azurecr.io' | env -i HOME=/tmp AZURE_ENVIRONMENT=no-such-cloud "$bin" get 2>&1 || true)"
        echo "genuine: $out"
        case "$out" in
          *"credentials not found"*) echo "FAIL: genuine ACR host was refused"; exit 1 ;;
          *"failed to acquire sp token"*) echo "PASS: genuine ACR host reaches token acquisition" ;;
          *) echo "FAIL: unexpected output for a genuine ACR host"; exit 1 ;;
        esac

        # 'list' is unimplemented upstream and must keep failing.
        if "$bin" list 2>/dev/null; then
          echo "FAIL: expected 'list' to fail"; exit 1
        fi
        echo "PASS: list fails as expected"
