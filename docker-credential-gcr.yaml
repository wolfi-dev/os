package:
  name: docker-credential-gcr
  version: "2.2.1"
  epoch: 7 # upstream-tests/go-test
  description: A Docker credential helper for GCR users
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GoogleCloudPlatform/docker-credential-gcr
      tag: v${{package.version}}
      expected-commit: bdb02de47220ee2a7577d7cd9d02db134b4c8460

  - uses: go/build
    with:
      packages: .
      output: docker-credential-gcr
      ldflags: -X github.com/GoogleCloudPlatform/docker-credential-gcr/config.Version=${{package.version}}

  # test/ is an end-to-end package that execs a ../docker-credential-gcr binary built in the source root (upstream make), not the go/build output.
  # TODO(upstream-tests): remove once upstream gates these behind -short.
  - uses: upstream-tests/go-test
    with:
      exclude-packages: ./test

update:
  enabled: true
  github:
    identifier: GoogleCloudPlatform/docker-credential-gcr
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        docker-credential-gcr --help
        docker-credential-gcr version
