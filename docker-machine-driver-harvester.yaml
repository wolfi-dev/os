package:
  name: docker-machine-driver-harvester
  version: "1.1.2"
  epoch: 0 # CVE-2026-128085
  description: The Harvester machine driver for Docker.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ac2955256f3afbfee5f0835ea4573e1d23cc9a26
      repository: https://github.com/harvester/docker-machine-driver-harvester
      tag: v${{package.version}}

  - uses: bump
    with:
      language: go
      replaces: |-
        github.com/golang/glog=github.com/golang/glog@v1.2.4 github.com/opencontainers/runc=github.com/opencontainers/runc@v1.3.6 github.com/cyphar/filepath-securejoin=github.com/cyphar/filepath-securejoin@v0.6.0

  - uses: go/build
    with:
      go-package: go-1.27
      ldflags: -X main.VERSION={{package.version}}
      output: docker-machine-driver-harvester
      packages: .

  - uses: upstream-tests/go-test

test:
  environment:
    contents:
      packages:
        - rancher-machine
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        # This is a negative test to check if the driver is working. We can't have a proper test
        # because the driver requires a harvesterhci.io cluster to be up and running.
        output=$(rancher-machine create --driver harvester --harvester-image-name=rancher/harvester:latest --harvester-disk-size=1 --harvester-network-name=test TEST 2>&1 || true)
        echo "$output" | grep -q "connect: connection refused"

update:
  enabled: true
  github:
    identifier: harvester/docker-machine-driver-harvester
    strip-prefix: v
    use-tag: true

environment:
  contents:
    packages:
      - go-1.27
