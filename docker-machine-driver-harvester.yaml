package:
  name: docker-machine-driver-harvester
  version: "1.1.0"
  epoch: 2 # CVE-2026-78659
  description: The Harvester machine driver for Docker.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1efbcae18a74f85cdd63a03db6f49ad4f9bd155d
      repository: https://github.com/harvester/docker-machine-driver-harvester
      tag: v${{package.version}}

  - uses: bump
    with:
      language: go
      packages: |-
        go.opentelemetry.io/otel@v1.45.0
        go.opentelemetry.io/otel/trace@v1.45.0
        github.com/opencontainers/runc@v1.3.6
        kubevirt.io/kubevirt@v1.9.0
        kubevirt.io/api@v1.9.0
        kubevirt.io/client-go@v1.9.0
        golang.org/x/net@v0.60.0
      replaces: |-
        github.com/golang/glog=github.com/golang/glog@v1.2.4
        github.com/opencontainers/runc=github.com/opencontainers/runc@v1.3.6
        github.com/cyphar/filepath-securejoin=github.com/cyphar/filepath-securejoin@v0.6.0

  - uses: go/build
    with:
      go-package: go-1.27
      ldflags: -X main.VERSION={{package.version}}
      output: docker-machine-driver-harvester
      packages: .

test:
  environment:
    contents:
      packages:
        - rancher-machine
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        # This is a negative test to check if the driver is working. We can't have a proper test
        # because the driver requires a harvesterhci.io cluster to be up and running.
        output=$(rancher-machine create --driver harvester --harvester-image-name=rancher/harvester:latest --harvester-disk-size=1 --harvester-network-name=test TEST 2>&1 || true)
        echo "$output" | grep -q "connect: connection refused"

update:
  enabled: true
  github:
    identifier: harvester/docker-machine-driver-harvester
    strip-prefix: v
    use-tag: true

environment:
  contents:
    packages:
      - go-1.27
