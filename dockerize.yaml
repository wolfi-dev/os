package:
  name: dockerize
  version: "0.15.2"
  epoch: 1 # toolchain rebuild for  go-1.27-1.27.3
  description: Utility to simplify running applications in docker containers
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jwilder/dockerize
      tag: v${{package.version}}
      expected-commit: d9fd48f6f3dcaac54a7f7db4a2107dccab604f4a

  - uses: go/build
    with:
      packages: .
      output: dockerize
      go-package: go-1.27

update:
  enabled: true
  github:
    identifier: jwilder/dockerize
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        dockerize --version
        dockerize --help
