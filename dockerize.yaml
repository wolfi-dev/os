package:
  name: dockerize
  version: "0.15.1"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.1
  description: Utility to simplify running applications in docker containers
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jwilder/dockerize
      tag: v${{package.version}}
      expected-commit: 13586b16baa3724254e1b0f4c86b8b72e0071b41

  - uses: go/build
    with:
      packages: .
      output: dockerize
      go-package: go-1.27

update:
  enabled: true
  github:
    identifier: jwilder/dockerize
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        dockerize --version
        dockerize --help
