package:
  name: dotnet-11
  version: "11.0.100"
  epoch: 2
  description: ".NET ${{vars.major-version}} host"
  copyright:
    - license: MIT
  resources:
    cpu: "17"
    memory: 64Gi
  dependencies:
    runtime:
      - icu
    # The newest .NET host runs every older runtime and SDK, so the runtime
    # packages depend on the virtual `dotnet` and apk picks the host with the
    # highest major version; that keeps the .NET versions co-installable.
    provider-priority: ${{vars.major-version}}
    provides:
      - dotnet=${{package.full-version}}
  test-resources:
    cpu: "1"
    memory: 5Gi

vars:
  bootstrap: 'true'
  llvm-version: '23'
  openssl-version: "4.0"

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+.*$
    replace: "$1"
    to: major-version

environment:
  environment:
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
    # To support automatic discovery of source code in debug symbols
    # packaged in dotnet-11-dbg, build with file-prefix-map (the native
    # build already passes -g). Also see "Create dbg sourcecode" and
    # split/debug.
    CFLAGS: "-Wno-error=used-but-marked-unused -ffile-prefix-map=/home/build=/usr/src/${{package.name}}"
    CXXFLAGS: "-ffile-prefix-map=/home/build=/usr/src/${{package.name}}"
  contents:
    packages:
      - bash
      - brotli-dev
      - busybox
      - clang-${{vars.llvm-version}}
      - cmake
      - curl
      - file
      - glibc-2.44-dev
      - gnutar # GNU tar: the VMR's packaging scripts use --owner/--group, unsupported by busybox tar
      - icu-dev
      - krb5-dev
      - libunwind-dev
      - lttng-ust-dev
      - make
      - openssl-hardened-${{vars.openssl-version}}-dev
      - python3
      - rapidjson-dev
      - samurai # ninja: the 11.0 runtime build requires it (build-runtime.sh prerequisites)
      - zlib-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dotnet/dotnet
      tag: v${{package.version}}
      expected-commit: 297acf930fb0f5c07fd4e51d78e521b4ad2e5d1f

  # The release manifest dotnet/dotnet publishes with each tag. Its
  # officialBuildId is the id Microsoft built this tag with; build.sh needs it
  # to stamp real versions instead of the -dev / 42.42.42.42424 placeholders
  # (csc -version would print 5.0.0-dev). The package updater refreshes this
  # checksum on every version bump, like any other fetch.
  - uses: fetch # blocked-extract-false: release metadata (release.json), not source
    with:
      uri: https://github.com/dotnet/dotnet/releases/download/v${{package.version}}/release.json
      expected-sha256: 007b0ad9b0cf567e35fab4db99fd01310e906e8566f57b437141ca314edc30cd
      extract: false

  - name: Check release.json describes this checkout
    runs: |
      python3 - "v${{package.version}}" "$(git rev-parse HEAD)" <<'EOF'
      import json, sys
      tag, head = sys.argv[1:]
      m = json.load(open("release.json"))
      if (m["tag"], m["sourceVersion"]) != (tag, head):
          sys.exit(f"release.json is for {m['tag']} at {m['sourceVersion']}, not {tag} at {head}")
      EOF

  # The OpenSSL 4.0 backports dotnet-10 carries are upstream in the 11.0
  # runtime. What remains is Chainguard's: prefer libssl.so.4 over .so.3 in
  # the portable OpenSSL shim, the DistroAgnosticOpenSsl switch that makes
  # the source-built runtime load OpenSSL through that shim (dlopen) instead
  # of linking a libssl soname, and a default PKCS#12 export with AES-256
  # instead of Triple DES, which Chainguard's OpenSSL does not offer by
  # default ("Chainguard Hardening" in the dotnet image README).
  - runs: |
      git -c "user.name=Melange Build" -c "user.email=melange-build@cgr.dev" am *.patch

  - runs: |
      # The runtime keeps the lock files of named mutexes (the MSBuild server,
      # the Roslyn compiler server) in $XDG_RUNTIME_DIR, or under $HOME/.dotnet
      # when it is unset. HOME is the repository root here, and the VMR's binary
      # scan (eng/init-detect-binaries.proj) opens every file under that root
      # exclusively, so a live lock fails the build. Give the runtime its own
      # runtime directory instead. Set it before prep-source-build.sh: that
      # script already runs the bootstrap SDK and the same scan.
      export XDG_RUNTIME_DIR=/tmp/xdg-runtime
      mkdir -m 0700 -p "$XDG_RUNTIME_DIR"

      # Setup bootstrap .NET SDK
      if [ ${{vars.bootstrap}} = "true" ]; then
        ./prep-source-build.sh
      fi

      if [ ${{build.arch}} = "aarch64" ]; then
        # Dotnet does not have support for PAC/BTI which Axion uses
        # See: https://github.com/dotnet/runtime/pull/110472
        # EXTRA_${FLAG} is supposed to work, but it doesn't
        # so directly override the values which is supposedly a no-no
        # See also: https://github.com/dotnet/runtime/issues/61859
        export CFLAGS="$CFLAGS -mbranch-protection=none"
        export CXXFLAGS="$CXXFLAGS -mbranch-protection=none"
      fi

      # Create dbg sourcecode: ship the native sources referenced by the
      # debug symbols, after patching and before building.
      mkdir -p ${{targets.destdir}}-dbg/usr/src/${{package.name}}/src/runtime/src
      cp -r src/runtime/src/native src/runtime/src/coreclr \
        ${{targets.destdir}}-dbg/usr/src/${{package.name}}/src/runtime/src/
      rm -rf ${{targets.destdir}}-dbg/usr/src/${{package.name}}/src/runtime/src/native/external/brotli
      rm -rf ${{targets.destdir}}-dbg/usr/src/${{package.name}}/src/runtime/src/native/external/zstd

      # The .NET runtime is built with O0 so we cannot enable FORTIFY_SOURCE
      sed -i 's/-D_FORTIFY_SOURCE=3//g' /etc/clang-${{vars.llvm-version}}/common.cfg

      # Build .NET. build.sh refuses --release-manifest in a git checkout, so
      # pass the official build id from release.json itself. System libraries
      # replace every compression library the runtime vendors (zstd is new in
      # .NET 11), so a CVE in one of them is fixed by rebuilding, not patching.
      official_build_id=$(python3 -c 'import json; print(json.load(open("release.json"))["officialBuildId"])')
      ./build.sh \
        --clean-while-building \
        --source-only \
        --official-build-id "$official_build_id" \
        -- \
        /v:minimal \
        /p:LogVerbosity=minimal \
        /p:ContinueOnPrebuiltBaselineError=true \
        /p:MinimalConsoleLogOutput=true \
        /p:SkipPortableRuntimeBuild=true \
        /p:UseSystemLibs=+brotli+rapidjson+zlib+libunwind+zstd \
        /p:DistroAgnosticOpenSsl=true

      # Install .NET
      mkdir -p ${{targets.contextdir}}/usr/share/dotnet
      cp -R artifacts/obj/extracted-dotnet-sdk/* ${{targets.contextdir}}/usr/share/dotnet

      # Symlink .NET host to path
      mkdir -p ${{targets.contextdir}}/usr/bin
      ln -s /usr/share/dotnet/dotnet ${{targets.contextdir}}/usr/bin/dotnet

      # strip omitted: because we use split/debug to ship debug symbols

subpackages:
  # Must be first, so split/debug sees all binaries before other
  # subpackages move them out of destdir.
  - name: "${{package.name}}-dbg"
    description: ".NET ${{vars.major-version}} debug symbols"
    dependencies:
      runtime:
        # Debug symbols only match the exact build they were split from
        - ${{package.name}}=${{package.full-version}}
        - dotnet-${{vars.major-version}}-runtime=${{package.full-version}}
    pipeline:
      - uses: split/debug
    test:
      environment:
        contents:
          packages:
            - dotnet-${{vars.major-version}}-runtime=${{package.full-version}}
      pipeline:
        - uses: test/tw/debugpackage

  - name: dotnet-${{vars.major-version}}-sdk
    description: ".NET ${{vars.major-version}} SDK"
    dependencies:
      runtime:
        - aspnet-${{vars.major-version}}-runtime=${{package.full-version}}
        - aspnet-${{vars.major-version}}-targeting-pack=${{package.full-version}}
        - dotnet-${{vars.major-version}}-runtime=${{package.full-version}}
        - dotnet-${{vars.major-version}}-targeting-pack=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/dotnet
          for i in sdk sdk-manifests templates; do
            mv ${{targets.destdir}}/usr/share/dotnet/$i \
               ${{targets.contextdir}}/usr/share/dotnet/
          done
      - uses: dotnet/remove-trusted-roots
        with:
          dir: ${{targets.contextdir}}/usr/share/dotnet
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - name: Verify SDK is functional
          runs: dotnet --list-sdks | grep -F "${{package.version}}"

  - name: dotnet-${{vars.major-version}}-runtime
    description: "The .NET ${{vars.major-version}} Core Runtime"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/dotnet/shared
          mv ${{targets.destdir}}/usr/share/dotnet/shared/Microsoft.NETCore.App ${{targets.contextdir}}/usr/share/dotnet/shared/
    dependencies:
      runtime:
        - dotnet
        - icu # dlopen: System.Globalization.Native
        - so:libssl.so.4 # dlopen: opensslshim (DistroAgnosticOpenSsl)
        - so:libgssapi_krb5.so.2 # dlopen: System.Net.Security.Native (Kerberos/Negotiate)
        - ca-certificates-bundle # TLS trust store
        - tzdata # TimeZoneInfo
        - libexpat1
        - libbrotlidec1
        - libzstd1
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/tw/ldd-check
        - name: System.IO.Compression.Native links the system brotli and zstd
          runs: |
            lib=$(echo /usr/share/dotnet/shared/Microsoft.NETCore.App/*/libSystem.IO.Compression.Native.so)
            grep -q libbrotlidec.so.1 "$lib"
            grep -q libbrotlienc.so.1 "$lib"
            grep -q libzstd.so.1 "$lib"
            if grep -aq _ERROR_FORMAT_EXUBERANT_NIBBLE "$lib"; then
              echo "$lib still bundles a Brotli decoder" >&2
              exit 1
            fi

  - name: aspnet-${{vars.major-version}}-runtime
    description: "The ASP.NET ${{vars.major-version}} Core Runtime"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/dotnet/shared
          mv ${{targets.destdir}}/usr/share/dotnet/shared/Microsoft.AspNetCore.App ${{targets.contextdir}}/usr/share/dotnet/shared/
    dependencies:
      runtime:
        - dotnet-${{vars.major-version}}-runtime=${{package.full-version}}
    test:
      environment:
        contents:
          packages:
            - dotnet-${{vars.major-version}}-sdk=${{package.full-version}}
      pipeline:
        - uses: test/tw/ldd-check
        - name: Build and run an application on the ASP.NET shared framework
          runs: |
            # The package is managed code only, so ldd-check above tests
            # nothing. Building resolves Microsoft.AspNetCore.App.Ref from
            # aspnet-${{vars.major-version}}-targeting-pack; running an app
            # that instantiates a type from the shared framework loads this
            # package's Microsoft.AspNetCore.App at run time.
            dotnet new web -o WebApp --force
            cat <<'EOF' > WebApp/Program.cs
            WebApplication.CreateBuilder(args).Build();
            System.Console.WriteLine("aspnet framework: " + typeof(WebApplication).Assembly.Location);
            EOF
            dotnet run --project WebApp | grep -F "aspnet framework: /usr/share/dotnet/shared/Microsoft.AspNetCore.App/"

  - name: dotnet-${{vars.major-version}}-targeting-pack
    description: "The .NET ${{vars.major-version}} Core targeting pack"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/dotnet/packs
          mv ${{targets.destdir}}/usr/share/dotnet/packs/Microsoft.NETCore.App.* ${{targets.contextdir}}/usr/share/dotnet/packs/
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: /usr/share/dotnet/packs
            name: "Microsoft.NETCore.App.*"
            type: "d"
        - name: Apphost and NativeAOT packs use the system brotli and zstd
          runs: |
            packs=/usr/share/dotnet/packs
            for f in $packs/Microsoft.NETCore.App.Host.*/*/runtimes/*/native/singlefilehost \
                     $packs/Microsoft.NETCore.App.Runtime.NativeAOT.*/*/runtimes/*/native/libSystem.IO.Compression.Native.so; do
              grep -q libbrotlidec.so.1 "$f"
              grep -q libzstd.so.1 "$f"
              if grep -aq _ERROR_FORMAT_EXUBERANT_NIBBLE "$f"; then
                echo "$f still bundles a Brotli decoder" >&2
                exit 1
              fi
            done
            for a in $packs/Microsoft.NETCore.App.Runtime.NativeAOT.*/*/runtimes/*/native/libbrotli*.a \
                     $packs/Microsoft.NETCore.App.Runtime.NativeAOT.*/*/runtimes/*/native/libzstd*.a; do
              if [ -e "$a" ]; then
                echo "$a is a vendored compression library" >&2
                exit 1
              fi
            done

  - name: aspnet-${{vars.major-version}}-targeting-pack
    description: "The ASP.NET ${{vars.major-version}} targeting pack"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/dotnet/packs
          mv ${{targets.destdir}}/usr/share/dotnet/packs/Microsoft.AspNetCore.App.* ${{targets.contextdir}}/usr/share/dotnet/packs/
    dependencies:
      runtime:
        - dotnet-${{vars.major-version}}-targeting-pack
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: /usr/share/dotnet/packs
            name: "Microsoft.AspNetCore.App.*"
            type: "d"

  - name: dotnet-${{vars.major-version}}-aot
    description: "Ahead-of-Time (AOT) support for the .NET ${{vars.major-version}} SDK"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/dotnet/packs
          mv ${{targets.destdir}}/usr/share/dotnet/packs/runtime.*.Microsoft.DotNet.ILCompiler ${{targets.contextdir}}/usr/share/dotnet/packs/
    dependencies:
      runtime:
        - dotnet-${{vars.major-version}}-targeting-pack=${{package.full-version}}
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: /usr/share/dotnet/packs
            name: "runtime.*.Microsoft.DotNet.ILCompiler"
            type: "d"

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: "v11.0.1"

test:
  environment:
    contents:
      packages:
        - dotnet-${{vars.major-version}}-sdk=${{package.full-version}}
        - openssl-${{vars.openssl-version}} # the openssl CLI reads the PKCS#12 files back
  pipeline:
    - name: Basic .NET command test
      runs: |
        dotnet --info
    - name: Compile and run a simple .NET application
      runs: |
        cat <<'EOF' > HelloWorld.cs
        using System;
        using System.Security.Cryptography;
        using System.Text;

        class Program
        {
            static void Main()
            {
                string message = "Hello, World!";
                Console.WriteLine(message);
                // SHA256 is backed by OpenSSL on Linux, exercise it
                byte[] hash = SHA256.HashData(Encoding.UTF8.GetBytes(message));
                Console.WriteLine("SHA256: " + Convert.ToHexString(hash).ToLowerInvariant());
            }
        }
        EOF
        dotnet new console -o HelloWorldApp --force
        mv HelloWorld.cs HelloWorldApp/Program.cs
        dotnet run --project HelloWorldApp > output.txt
        cat output.txt
        grep -q "Hello, World!" output.txt
        grep -q "SHA256: dffd6021bb2bd5b0af676290809ec3a53191dd81c7f70a4b28688a362182986f" output.txt
    - name: Compile and run a .NET application with arguments
      runs: |
        cat <<'EOF' > ArgumentEcho.cs
        using System;

        class Program
        {
            static void Main(string[] args)
            {
                Console.WriteLine("Arguments: " + String.Join(", ", args));
            }
        }
        EOF
        dotnet new console -o ArgumentEchoApp --force
        mv ArgumentEcho.cs ArgumentEchoApp/Program.cs
        dotnet run --project ArgumentEchoApp -- arg1 arg2 arg3
    - name: The default PKCS#12 export uses AES-256, and Triple DES needs CHAINGUARD_LEGACY_ENABLE_DES=1
      runs: |
        dotnet new console -o PfxApp --force
        cat <<'EOF' > PfxApp/Program.cs
        // Writes a self-signed certificate and its key as PKCS#12, or loads such a file.
        using System;
        using System.IO;
        using System.Security.Cryptography;
        using System.Security.Cryptography.X509Certificates;

        switch (args[0])
        {
            case "export":
                using (X509Certificate2 cert = CreateCertificate())
                {
                    // X509ContentType.Pkcs12 is the same value as Pfx.
                    File.WriteAllBytes("cert.pfx", cert.Export(X509ContentType.Pfx, "pw"));
                    File.WriteAllBytes("collection.pfx", new X509Certificate2Collection(cert).Export(X509ContentType.Pfx, "pw")!);
                }
                break;
            case "export-3des":
                using (X509Certificate2 cert = CreateCertificate())
                {
                    File.WriteAllBytes("3des.pfx", cert.ExportPkcs12(Pkcs12ExportPbeParameters.Pkcs12TripleDesSha1, "pw"));
                }
                break;
            case "load":
                using (X509Certificate2 cert = X509CertificateLoader.LoadPkcs12FromFile(args[1], "pw"))
                using (RSA key = cert.GetRSAPrivateKey() ?? throw new CryptographicException(args[1] + " has no private key"))
                using (RSA publicKey = cert.GetRSAPublicKey()!)
                {
                    // The key must sign, and the certificate must verify the signature.
                    byte[] data = { 1, 2, 3 };
                    byte[] signature = key.SignData(data, HashAlgorithmName.SHA256, RSASignaturePadding.Pkcs1);
                    if (!publicKey.VerifyData(data, signature, HashAlgorithmName.SHA256, RSASignaturePadding.Pkcs1))
                    {
                        throw new CryptographicException("the key in " + args[1] + " does not match its certificate");
                    }
                    Console.WriteLine(args[1] + ": " + cert.Subject + ", its key signs");
                }
                break;
            default:
                throw new ArgumentException("unknown mode " + args[0]);
        }

        static X509Certificate2 CreateCertificate()
        {
            using RSA rsa = RSA.Create(2048);
            var request = new CertificateRequest("CN=localhost", rsa, HashAlgorithmName.SHA256, RSASignaturePadding.Pkcs1);
            return request.CreateSelfSigned(DateTimeOffset.UtcNow.AddDays(-1), DateTimeOffset.UtcNow.AddDays(1));
        }
        EOF
        dotnet build PfxApp -o pfxapp

        # 0003-*.patch: X509Certificate2.Export and X509Certificate2Collection.Export
        # with X509ContentType.Pfx write PBES2 (PBKDF2 with HMAC-SHA256,
        # AES-256-CBC) and a SHA-256 MAC, the parameters of
        # Pkcs12ExportPbeParameters.Default, instead of 3DES and a SHA-1 MAC.
        dotnet pfxapp/PfxApp.dll export
        for f in cert.pfx collection.pfx; do
          openssl pkcs12 -info -noout -in "$f" -passin pass:pw > "$f.txt" 2>&1
          cat "$f.txt"
          grep -F 'MAC: sha256, Iteration 2000' "$f.txt"
          grep -F 'PKCS7 Encrypted data: PBES2, PBKDF2, AES-256-CBC, Iteration 2000, PRF hmacWithSHA256' "$f.txt"
          grep -F 'Shrouded Keybag: PBES2, PBKDF2, AES-256-CBC, Iteration 2000, PRF hmacWithSHA256' "$f.txt"
          dotnet pfxapp/PfxApp.dll load "$f"
        done

        # Chainguard's OpenSSL leaves Triple DES out of its default provider, and
        # the legacy-allowed provider offers it only with
        # CHAINGUARD_LEGACY_ENABLE_DES=1: writing a 3DES file on request, and
        # reading one, work only with the variable set. The failures without it
        # also show that the export above ran without Triple DES.
        if dotnet pfxapp/PfxApp.dll export-3des > export-3des.out 2>&1; then
          echo "ERROR: a 3DES PKCS#12 export worked without CHAINGUARD_LEGACY_ENABLE_DES=1" >&2
          exit 1
        fi
        grep -F 'error:0308010C' export-3des.out
        CHAINGUARD_LEGACY_ENABLE_DES=1 dotnet pfxapp/PfxApp.dll export-3des
        CHAINGUARD_LEGACY_ENABLE_DES=1 openssl pkcs12 -info -noout -in 3des.pfx -passin pass:pw > 3des.txt 2>&1
        cat 3des.txt
        grep -F 'Shrouded Keybag: pbeWithSHA1And3-KeyTripleDES-CBC, Iteration 2000' 3des.txt
        if dotnet pfxapp/PfxApp.dll load 3des.pfx > load-3des.out 2>&1; then
          echo "ERROR: a 3DES PKCS#12 file loaded without CHAINGUARD_LEGACY_ENABLE_DES=1" >&2
          exit 1
        fi
        grep -F 'error:0308010C' load-3des.out
        CHAINGUARD_LEGACY_ENABLE_DES=1 dotnet pfxapp/PfxApp.dll load 3des.pfx
    - name: dotnet dev-certs https saves, checks and exports its certificate
      runs: |
        # dev-certs saves a new certificate by exporting it with
        # X509ContentType.Pkcs12 and loading the result into the X509Store, and
        # -ep exports it the same way. With the 3DES default both failed with
        # error:0308010C (unsupported). The SDK's first run, in the steps above,
        # may already have created a certificate: remove it, so that dev-certs
        # creates and saves one here.
        dotnet dev-certs https --clean
        if ! dotnet dev-certs https --verbose > dev-certs.txt 2>&1; then
          cat dev-certs.txt
          exit 1
        fi
        cat dev-certs.txt
        grep -F 'Finished saving certificate to the store.' dev-certs.txt
        dotnet dev-certs https --check
        dotnet dev-certs https -ep dev.pfx -p pw
        openssl pkcs12 -info -noout -in dev.pfx -passin pass:pw > dev.txt 2>&1
        cat dev.txt
        grep -F 'Shrouded Keybag: PBES2, PBKDF2, AES-256-CBC, Iteration 2000, PRF hmacWithSHA256' dev.txt
    - uses: test/tw/ldd-check
