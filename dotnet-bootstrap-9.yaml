package:
  name: dotnet-bootstrap-9
  version: "9.0.122"
  epoch: 1 # CVE-2026-111497
  description: ".NET 9 SDK Bootstrap"
  copyright:
    - license: MIT
  resources:
    cpu: 2
    memory: 32Gi
  options:
    # Necessary dependencies are provided at build
    # time for .NET
    no-depends: true
    # We never want this to ever be used anywhere
    # other than to build .NET so there isn't a
    # reason to generate any provides
    no-provides: true

environment:
  environment:
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
  contents:
    packages:
      - bash
      - brotli-dev
      - busybox
      - clang-23
      - cmake
      - curl
      - file
      - glibc-2.44-dev
      - icu
      - icu-dev
      - krb5-dev
      # prep-source-build.sh runs Microsoft's portable bootstrap SDK, whose
      # crypto shim only binds libssl.so.3/1.1; needed at build time only.
      - libssl3
      - make
      - openssl-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dotnet/dotnet
      tag: v${{package.version}}
      expected-commit: b5d519a74f674c2a57f3e064b45742e5e4e1117d

  - runs: |
      # Fetch SDK and create bootstrap archive
      ./prep-source-build.sh

      # Install .NET SDK and bootstrap archive
      mkdir -p ${{targets.contextdir}}/usr/share/dotnet-bootstrap
      cp -a .dotnet ${{targets.contextdir}}/usr/share/dotnet-bootstrap/dotnet
      cp prereqs/packages/archive/Private.SourceBuilt.Artifacts.Bootstrap.tar.gz \
        ${{targets.contextdir}}/usr/share/dotnet-bootstrap/Private.SourceBuilt.Artifacts.Bootstrap.tar.gz

  - name: Build System.IO.Compression.Native against the system brotli
    runs: |
      # CVE-2026-111497: Microsoft's portable runtime compiles Brotli into
      # libSystem.IO.Compression.Native.so and singlefilehost. Rebuild the
      # library from this tag's src/runtime against the system libbrotlidec and
      # libbrotlienc and ship it instead. Configuring the native libraries
      # needs icu-dev, krb5-dev and openssl-dev; only this one target is built.
      ./src/runtime/src/native/libs/build-native.sh -release -configureonly \
        -cmakeargs -DCLR_CMAKE_USE_SYSTEM_BROTLI=true
      make -C src/runtime/artifacts/obj/native/linux-*-Release -j$(nproc) System.IO.Compression.Native
      lib=$(echo src/runtime/artifacts/obj/native/linux-*-Release/System.IO.Compression.Native/libSystem.IO.Compression.Native.so)
      grep -q libbrotlidec.so.1 "$lib"
      dotnet=${{targets.contextdir}}/usr/share/dotnet-bootstrap/dotnet
      for f in "$dotnet"/shared/Microsoft.NETCore.App/*/libSystem.IO.Compression.Native.so; do
        install -m755 "$lib" "$f"
      done
      # dotnet-9's source build compiles ilc and crossgen2 with NativeAOT and
      # never publishes a self-contained single-file app with this host pack.
      rm "$dotnet"/packs/Microsoft.NETCore.App.Host.linux-*/*/runtimes/linux-*/native/singlefilehost

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - 9\.0\.101
  git:
    strip-prefix: v
    tag-filter-prefix: "v9"

test:
  environment:
    contents:
      packages:
        - icu
        - libbrotlidec1
        - libbrotlienc1
        - libgcc
        - libssl3
        - libstdc++
        - zlib
  pipeline:
    - runs: |
        # Extract .Net bootstrap archive
        tar -xzvf /usr/share/dotnet-bootstrap/Private.SourceBuilt.Artifacts.Bootstrap.tar.gz
        stat PackageVersions.props
    - name: Bootstrap runtime links the system brotli
      runs: |
        d=/usr/share/dotnet-bootstrap/dotnet
        lib=$(echo $d/shared/Microsoft.NETCore.App/*/libSystem.IO.Compression.Native.so)
        grep -q libbrotlidec.so.1 "$lib"
        grep -q libbrotlienc.so.1 "$lib"
        hits=$(grep -rlaF _ERROR_FORMAT_EXUBERANT_NIBBLE "$d" || true)
        if [ -n "$hits" ]; then
          echo "bundled Brotli decoder found in: $hits" >&2
          exit 1
        fi
        for f in $d/packs/Microsoft.NETCore.App.Host.*/*/runtimes/*/native/singlefilehost; do
          if [ -e "$f" ]; then
            echo "$f is still shipped" >&2
            exit 1
          fi
        done
    - name: Bootstrap SDK builds and runs an app that uses Brotli and zlib
      runs: |
        export DOTNET_ROOT=/usr/share/dotnet-bootstrap/dotnet
        export PATH="$DOTNET_ROOT:$PATH"
        export DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1
        # No package sources: the bootstrap SDK must build this app offline.
        cat > nuget.config <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
          </packageSources>
        </configuration>
        EOF
        dotnet --info
        dotnet new console -o BrotliCheck
        cat > BrotliCheck/Program.cs <<'EOF'
        using System.IO.Compression;
        using System.Text;

        var data = Encoding.UTF8.GetBytes(string.Concat(Enumerable.Repeat("Howdy, Brotli! ", 4096)));

        var packed = new MemoryStream();
        using (var s = new BrotliStream(packed, CompressionLevel.Optimal, leaveOpen: true))
            s.Write(data);
        packed.Position = 0;
        var unpacked = new MemoryStream();
        using (var s = new BrotliStream(packed, CompressionMode.Decompress))
            s.CopyTo(unpacked);
        if (!unpacked.ToArray().AsSpan().SequenceEqual(data))
            throw new Exception("BrotliStream round trip failed");

        var buf = new byte[BrotliEncoder.GetMaxCompressedLength(data.Length)];
        if (!BrotliEncoder.TryCompress(data, buf, out int written))
            throw new Exception("BrotliEncoder.TryCompress failed");
        var back = new byte[data.Length];
        if (!BrotliDecoder.TryDecompress(buf.AsSpan(0, written), back, out int read) || read != data.Length)
            throw new Exception("BrotliDecoder.TryDecompress failed");

        var gz = new MemoryStream();
        using (var s = new GZipStream(gz, CompressionLevel.Optimal, leaveOpen: true))
            s.Write(data);
        var gzLength = gz.Length;
        gz.Position = 0;
        var gunz = new MemoryStream();
        using (var s = new GZipStream(gz, CompressionMode.Decompress))
            s.CopyTo(gunz);
        if (!gunz.ToArray().AsSpan().SequenceEqual(data))
            throw new Exception("GZipStream round trip failed");

        Console.WriteLine($"brotli ok ({written} bytes), gzip ok ({gzLength} bytes)");
        EOF
        dotnet run --project BrotliCheck | grep -F "brotli ok"
