package:
  name: dotnet-sdk-10.0.1
  version: "10.0.113"
  epoch: 2 # remove compromised emSign roots from the NuGet trust bundles, pin bootstrap
  description: ".NET SDK ${{package.version}}"
  copyright:
    - license: MIT
  resources:
    cpu: "16"
    memory: 66Gi
  dependencies:
    runtime:
      - aspnet-${{vars.major-version}}-runtime
      - aspnet-${{vars.major-version}}-targeting-pack
      - dotnet-${{vars.major-version}}
      - dotnet-${{vars.major-version}}-runtime
      - dotnet-${{vars.major-version}}-targeting-pack
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # Bootstrap revisions pinned exactly. On x86_64, builds bootstrapped on later
  # revisions (dotnet-sdk-10.0.1 10.0.113-r1 with dotnet-10 10.0.113-r3 or
  # 10.0.114) abort in the bootstrap's JIT: exit 134 in fsc, Internal CLR error
  # 0x80131506 in crossgen2. These revisions still vendor Brotli
  # (CVE-2026-111497), but only run at build time; this package's runtime packs
  # link the system brotli.
  bootstrap-runtime-version: "10.0.113-r2"
  bootstrap-sdk-version: "10.0.113-r0"
  llvm-version: '23'
  openssl-version: "4.0"
  prefix: 'usr/share/dotnet'

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+$
    replace: "$1"
    to: major-version

environment:
  environment:
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
    CFLAGS: "-Wno-error=used-but-marked-unused"
    # Disable AVX2 to prevent Internal CLR error (0x80131506) crashes during
    # Crossgen2/ReadyToRun compilation on x86_64. AVX2 JIT paths can trigger
    # assertion failures in the bootstrap SDK's crossgen2 compiler.
    COMPlus_EnableAVX2: "0"
    DOTNET_EnableAVX2: "0"
  contents:
    packages:
      # Every bootstrap package is pinned (vars.bootstrap-*-version):
      # source-build takes the bootstrap's runtime as
      # BundledNETCoreAppPackageVersion, and the bootstrap's own deps on the
      # runtime packages are unversioned, so any one left floating pulls the
      # newest 10.0.x runtime in.
      - ${{package.name}}-artifacts=${{vars.bootstrap-sdk-version}}
      - ${{package.name}}=${{vars.bootstrap-sdk-version}}
      - aspnet-${{vars.major-version}}-runtime=${{vars.bootstrap-runtime-version}}
      - aspnet-${{vars.major-version}}-targeting-pack=${{vars.bootstrap-runtime-version}}
      - bash
      - brotli-dev
      - busybox
      - clang-${{vars.llvm-version}}
      - cmake
      - curl
      - dotnet-${{vars.major-version}}-runtime=${{vars.bootstrap-runtime-version}}
      - dotnet-${{vars.major-version}}-targeting-pack=${{vars.bootstrap-runtime-version}}
      - dotnet-${{vars.major-version}}=${{vars.bootstrap-runtime-version}}
      - file
      - glibc-2.44-dev
      - icu-dev
      - krb5-dev
      - libunwind-dev
      - lttng-ust-dev
      - make
      - openssl-${{vars.openssl-version}}-dev
      - python3
      - rapidjson-dev
      - so:libssl.so.3 # bootstrap runtimes (e.g. ilasm) currently only support .so.3
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dotnet/dotnet
      tag: v${{package.version}}
      expected-commit: 4099f83977f4d29604a9aeb971fb0a7bc1d5f699

  - working-directory: src/runtime
    uses: patch
    with:
      patches: |
        0001-Fix-build-compilation-with-OpenSSL-4.0-dev.patch
        0002-Remove-OpenSSL-1.0.2-and-1.1.0-support.patch
        0003-Enable-the-crypto-shim-to-build-against-OpenSSL-4.0-.patch
        0004-Allow-binding-to-OpenSSL-4-from-portable-builds.patch
        0005-Remove-deprecated-OpenSSL-RSA-APIs-126034.patch
        0006-Prefer-using-non-deprecated-EC-OSSL-APIs-where-possi.patch
        0007-Fix-if-that-should-have-been-an-ifdef-on-non-portabl.patch
        0008-Remove-SafeEcKeyHandle.patch
        0009-Shim-CRYPTO_zalloc-for-OPENSSL_zalloc-callers.patch

  - runs: |
      if [ ${{build.arch}} = "aarch64" ]; then
        # Dotnet does not have support for PAC/BTI which Axion uses
        # See: https://github.com/dotnet/runtime/pull/110472
        # EXTRA_${FLAG} is supposed to work, but it doesn't
        # so directly override the values which is supposedly a no-no
        # See also: https://github.com/dotnet/runtime/issues/61859
        export CFLAGS="$CFLAGS -mbranch-protection=none"
        export CXXFLAGS="-mbranch-protection=none"
      fi

      # The .NET runtime is built with O0 so we cannot enable FORTIFY_SOURCE
      sed -i 's/-D_FORTIFY_SOURCE=3//g' /etc/clang-${{vars.llvm-version}}/common.cfg

      # Many scripts in the VMR are not executable
      find . -name '*.sh' -exec chmod +x {} +

      # Build .NET
      ./build.sh \
        --with-sdk /${{vars.prefix}} \
        --clean-while-building --source-only \
        --with-packages /${{vars.prefix}}/artifacts \
        -- \
        /v:minimal \
        /p:LogVerbosity=minimal \
        /p:ContinueOnPrebuiltBaselineError=true \
        /p:MinimalConsoleLogOutput=true \
        /p:SkipPortableRuntimeBuild=true \
        /p:UseSystemLibs=+brotli+rapidjson+zlib+libunwind \
        /p:PublishReadyToRunCrossgen2ExtraArgs="--parallelism=1 --instruction-set=base"

      mkdir -p ${{targets.contextdir}}/${{vars.prefix}}

      # Install SDK
      tar xf ./artifacts/assets/Release/dotnet-sdk-${{vars.major-version}}*.tar.gz \
          -C ${{targets.contextdir}}/${{vars.prefix}}/ \
          ./sdk \
          ./sdk-manifests \
          ./templates

  - uses: dotnet/remove-trusted-roots
    with:
      dir: ${{targets.destdir}}/${{vars.prefix}}

  - uses: strip

subpackages:
  - name: "${{package.name}}-symbols"
    description: ".NET SDK ${{package.version}} symbols"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.prefix}}
          tar xf ./artifacts/assets/Release/dotnet-symbols-sdk-${{vars.major-version}}*.tar.gz \
                -C ${{targets.contextdir}}/${{vars.prefix}}/
    test:
      pipeline:
        - runs: |
            symbols="$(find /${{vars.prefix}} -name '*.pdb')"
            if [ -z "${symbols}" ]; then
              echo "No SDK debug symbols found!"
              exit 1
            fi
            echo "Found SDK debug symbols"

  - name: "${{package.name}}-artifacts"
    description: ".NET SDK ${{package.version}} build artifacts"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.prefix}}/artifacts
          tar xf ./artifacts/assets/Release/Private.SourceBuilt.Artifacts.*.tar.gz \
              -C ${{targets.contextdir}}/${{vars.prefix}}/artifacts
    test:
      environment:
        contents:
          packages:
            - busybox
            - unzip
      pipeline:
        - runs: |
            artifacts="$(find /${{vars.prefix}} -name '*.tar.gz')"
            if [ -z "${artifacts}" ]; then
              echo "No SDK artifacts found!"
              exit 1
            fi
            echo "Found SDK artifacts"
        - name: Runtime packs in the artifacts use the system brotli
          runs: |
            a=/${{vars.prefix}}/artifacts
            check() {
              rm -rf nupkg-check
              mkdir nupkg-check
              unzip -q -o "$1" "runtimes/*/native/$2" -d nupkg-check
              f=$(echo nupkg-check/runtimes/*/native/"$2")
              grep -q libbrotlidec.so.1 "$f"
              if grep -aq _ERROR_FORMAT_EXUBERANT_NIBBLE "$f"; then
                echo "$1: $2 still bundles a Brotli decoder" >&2
                exit 1
              fi
            }
            check $a/Microsoft.NETCore.App.Runtime.wolfi.*[0-9].nupkg libSystem.IO.Compression.Native.so
            check $a/Microsoft.NETCore.App.Runtime.NativeAOT.wolfi.*[0-9].nupkg libSystem.IO.Compression.Native.so
            check $a/Microsoft.NETCore.App.Host.wolfi.*[0-9].nupkg singlefilehost
            check $a/runtime.wolfi.*.Microsoft.NETCore.DotNetAppHost.*[0-9].nupkg singlefilehost
            unzip -l $a/Microsoft.NETCore.App.Runtime.NativeAOT.wolfi.*[0-9].nupkg > nupkg-check.list
            if grep -q 'native/libbrotli' nupkg-check.list; then
              echo "the NativeAOT runtime pack still ships the vendored libbrotli*.a" >&2
              exit 1
            fi
            rm -rf nupkg-check nupkg-check.list

test:
  environment:
    contents:
      packages:
        # Pin to the runtime this SDK bundles. The package's own runtime deps are
        # unversioned, so without this the test installs the newest 10.0.x host
        # pack.
        - aspnet-${{vars.major-version}}-runtime=${{vars.bootstrap-runtime-version}}
        - aspnet-${{vars.major-version}}-targeting-pack=${{vars.bootstrap-runtime-version}}
        - dotnet-${{vars.major-version}}=${{vars.bootstrap-runtime-version}}
        - dotnet-${{vars.major-version}}-runtime=${{vars.bootstrap-runtime-version}}
        - dotnet-${{vars.major-version}}-targeting-pack=${{vars.bootstrap-runtime-version}}
  pipeline:
    - uses: test/tw/ldd-check
    - runs: dotnet tool install -g Microsoft.Web.LibraryManager.Cli
    - name: Compile and run a simple .NET application
      runs: |
        cat <<'EOF' > HelloWorld.cs
        using System;

        class Program
        {
            static void Main()
            {
                Console.WriteLine("Hello, World!");
            }
        }
        EOF
        dotnet new console -o HelloWorldApp --force
        mv HelloWorld.cs HelloWorldApp/Program.cs
        dotnet run --project HelloWorldApp
    - name: Compile and run a .NET application with arguments
      runs: |
        cat <<'EOF' > ArgumentEcho.cs
        using System;

        class Program
        {
            static void Main(string[] args)
            {
                Console.WriteLine("Arguments: " + String.Join(", ", args));
            }
        }
        EOF
        dotnet new console -o ArgumentEchoApp --force
        mv ArgumentEcho.cs ArgumentEchoApp/Program.cs
        dotnet run --project ArgumentEchoApp -- arg1 arg2 arg3

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: "v10.0.1"
