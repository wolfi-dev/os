package:
  name: dotnet-sdk-11.0.1
  version: "11.0.100"
  epoch: 3
  description: ".NET SDK ${{package.version}}"
  copyright:
    - license: MIT
  resources:
    cpu: "16"
    memory: 66Gi
  dependencies:
    runtime:
      - aspnet-${{vars.major-version}}-runtime
      - aspnet-${{vars.major-version}}-targeting-pack
      - dotnet-${{vars.major-version}}
      - dotnet-${{vars.major-version}}-runtime
      - dotnet-${{vars.major-version}}-targeting-pack
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # Bootstrap revisions, pinned exactly. bootstrap-sdk-version is a previous
  # build of this package (11.0.100-r0 is the one dotnet-sdk-stage0-11
  # seeded) and bootstrap-runtime-version the dotnet-11 packages it runs on.
  # Nothing moves them: do it by hand, to published revisions, and build
  # x86_64 when you do. dotnet-sdk-10.0.1 records bootstrap revisions whose
  # JIT aborted there (exit 134 in fsc, Internal CLR error 0x80131506 in
  # crossgen2).
  bootstrap-runtime-version: "11.0.100-r0"
  bootstrap-sdk-version: "11.0.100-r0"
  llvm-version: '23'
  openssl-version: "4.0"
  prefix: 'usr/share/dotnet'

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+.*$
    replace: "$1"
    to: major-version

environment:
  environment:
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
    CFLAGS: "-Wno-error=used-but-marked-unused"
    # Inherited from dotnet-sdk-10.0.1: AVX2 JIT paths in the bootstrap's
    # crossgen2 trigger Internal CLR error 0x80131506 on x86_64.
    COMPlus_EnableAVX2: "0"
    DOTNET_EnableAVX2: "0"
  contents:
    packages:
      # The bootstrap is a previous build of this package, as in
      # dotnet-sdk-10.0.1: the SDK under /usr/share/dotnet and, from its
      # -artifacts subpackage, the previously source-built packages under
      # /usr/share/dotnet/artifacts, which --with-sdk and --with-packages
      # consume. The dotnet-11 packages supply the host, the runtimes and the
      # targeting packs that SDK runs on. Their runtime and host packs of the
      # version being built would reach the product, so the build step
      # removes them (see there). Every one is pinned (vars.bootstrap-*-version):
      # the SDK's own dependencies on them are unversioned, so any one left
      # floating pulls the newest 11.0.x runtime in.
      - ${{package.name}}-artifacts=${{vars.bootstrap-sdk-version}}
      - ${{package.name}}=${{vars.bootstrap-sdk-version}}
      - aspnet-${{vars.major-version}}-runtime=${{vars.bootstrap-runtime-version}}
      - aspnet-${{vars.major-version}}-targeting-pack=${{vars.bootstrap-runtime-version}}
      - bash
      - brotli-dev
      - busybox
      - clang-${{vars.llvm-version}}
      - cmake
      - curl
      - dotnet-${{vars.major-version}}-runtime=${{vars.bootstrap-runtime-version}}
      - dotnet-${{vars.major-version}}-targeting-pack=${{vars.bootstrap-runtime-version}}
      - dotnet-${{vars.major-version}}=${{vars.bootstrap-runtime-version}}
      - file
      - glibc-2.44-dev
      - gnutar
      - icu-dev
      - krb5-dev
      - libunwind-dev
      - lttng-ust-dev
      - make
      - openssl-hardened-${{vars.openssl-version}}-dev
      - python3
      - rapidjson-dev
      - samurai # ninja: the 11.0 runtime build requires it (build-runtime.sh prerequisites)
      - zlib-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dotnet/dotnet
      tag: v${{package.version}}
      expected-commit: 297acf930fb0f5c07fd4e51d78e521b4ad2e5d1f

  # The release manifest dotnet/dotnet publishes with each tag; its
  # officialBuildId stamps real versions instead of -dev placeholders (see
  # dotnet-11). The package updater refreshes this checksum on every bump.
  - uses: fetch # blocked-extract-false: release metadata (release.json), not source
    with:
      uri: https://github.com/dotnet/dotnet/releases/download/v${{package.version}}/release.json
      expected-sha256: 007b0ad9b0cf567e35fab4db99fd01310e906e8566f57b437141ca314edc30cd
      extract: false

  - name: Check release.json describes this checkout
    runs: |
      python3 - "v${{package.version}}" "$(git rev-parse HEAD)" <<'EOF'
      import json, sys
      tag, head = sys.argv[1:]
      m = json.load(open("release.json"))
      if (m["tag"], m["sourceVersion"]) != (tag, head):
          sys.exit(f"release.json is for {m['tag']} at {m['sourceVersion']}, not {tag} at {head}")
      EOF

  # dotnet-11's patches, copied from os/dotnet-11/ unchanged: keep the two
  # copies identical. The SDK's two NativeAOT tools are linked against the
  # NativeAOT runtime pack this build makes, so they carry this build's
  # runtime code, and a patch that only dotnet-11 has does not reach them.
  # With 0001, 0002 and DistroAgnosticOpenSsl (below), that pack loads OpenSSL
  # the way the dotnet-11 runtime does: through the dlopen shim, which prefers
  # libssl.so.4 and honours DOTNET_OPENSSL_VERSION_OVERRIDE (the -ossl35
  # images document it). With 0003, its default PKCS#12 export uses AES-256
  # instead of Triple DES, which Chainguard's OpenSSL does not offer by
  # default: `dotnet dev-certs https` (in libaspnetcoretools.so) saves its
  # certificate through that export. Not git am, as in dotnet-11: the SDK
  # records the commit it is built from (sdk/.version, every assembly's
  # informational version), and a commit made here exists nowhere upstream
  # and changes with every build.
  - uses: patch
    with:
      patches: |
        0001-Prefer-OpenSSL-4-over-OpenSSL-3-in-the-portable-Open.patch
        0002-Add-DistroAgnosticOpenSsl-option-to-build-the-runtim.patch
        0003-Export-PKCS-12-with-AES-256-instead-of-3DES-by-defau.patch

  - runs: |
      if [ ${{build.arch}} = "aarch64" ]; then
        # Dotnet does not have support for PAC/BTI which Axion uses
        # See: https://github.com/dotnet/runtime/pull/110472
        # EXTRA_${FLAG} is supposed to work, but it doesn't
        # so directly override the values which is supposedly a no-no
        # See also: https://github.com/dotnet/runtime/issues/61859
        export CFLAGS="$CFLAGS -mbranch-protection=none"
        export CXXFLAGS="-mbranch-protection=none"
      fi

      # The .NET runtime is built with O0 so we cannot enable FORTIFY_SOURCE
      sed -i 's/-D_FORTIFY_SOURCE=3//g' /etc/clang-${{vars.llvm-version}}/common.cfg

      # Many scripts in the VMR are not executable
      find . -name '*.sh' -exec chmod +x {} +

      # The runtime keeps the lock files of named mutexes (the MSBuild server,
      # the Roslyn compiler server) in $XDG_RUNTIME_DIR, or under $HOME/.dotnet
      # when it is unset. HOME is the repository root here, and the VMR's binary
      # scan (eng/init-detect-binaries.proj) opens every file under that root
      # exclusively, so a live lock fails the build. Give the runtime its own
      # runtime directory instead.
      export XDG_RUNTIME_DIR=/tmp/xdg-runtime
      mkdir -m 0700 -p "$XDG_RUNTIME_DIR"

      # The pinned dotnet-11-targeting-pack and aspnet-11-targeting-pack
      # install the bootstrap runtime's packs under /${{vars.prefix}}/packs,
      # and the SDK takes a pack from there when it has the version asked
      # for. So whenever the bootstrap carries the version this tree builds
      # (every rebuild at the same version, and every build after the pins
      # move to the tree's version), the SDK's NativeAOT tools
      # (libdotnet-aot.so, libaspnetcoretools.so) would be linked against
      # dotnet-11's NativeAOT runtime pack instead of the one this build
      # makes, and this recipe's patches would not reach them. Remove the
      # runtime and host packs of the versions this tag builds (release.json,
      # checked above, names them): the SDK then restores them, and the VMR
      # takes a package this build makes from this build's output only. The
      # reference packs stay: they carry reference assemblies, not the
      # runtime's code, and the bootstrap SDK reads the prune package data of
      # its own runtime version from them (it fails with NETSDK1226
      # without). Packs of other versions stay too.
      runtime_version=$(python3 -c 'import json; print(json.load(open("release.json"))["runtimeVersion"])')
      aspnetcore_version=$(python3 -c 'import json; print(json.load(open("release.json"))["aspNetCoreVersion"])')
      for d in /${{vars.prefix}}/packs/Microsoft.NETCore.App.Runtime.*/"$runtime_version" \
          /${{vars.prefix}}/packs/Microsoft.NETCore.App.Host.*/"$runtime_version" \
          /${{vars.prefix}}/packs/Microsoft.AspNetCore.App.Runtime.*/"$aspnetcore_version"; do
        if [ -d "$d" ]; then
          echo "Removing the bootstrap's $d: this build makes that version"
          rm -rf "$d"
        fi
      done

      # Build .NET from the bootstrap SDK and its artifacts, with the tag's
      # official build id (build.sh refuses --release-manifest in a git
      # checkout). System libraries replace every compression library the
      # runtime vendors (zstd is new in .NET 11). For DistroAgnosticOpenSsl,
      # see the patch step above.
      official_build_id=$(python3 -c 'import json; print(json.load(open("release.json"))["officialBuildId"])')
      ./build.sh \
        --with-sdk /${{vars.prefix}} \
        --clean-while-building --source-only \
        --with-packages /${{vars.prefix}}/artifacts \
        --official-build-id "$official_build_id" \
        -- \
        /v:minimal \
        /p:LogVerbosity=minimal \
        /p:ContinueOnPrebuiltBaselineError=true \
        /p:MinimalConsoleLogOutput=true \
        /p:SkipPortableRuntimeBuild=true \
        /p:UseSystemLibs=+brotli+rapidjson+zlib+libunwind+zstd \
        /p:DistroAgnosticOpenSsl=true \
        /p:PublishReadyToRunCrossgen2ExtraArgs="--parallelism=1 --instruction-set=base"

      mkdir -p ${{targets.contextdir}}/${{vars.prefix}}

      # Install SDK
      tar xf ./artifacts/assets/Release/dotnet-sdk-${{vars.major-version}}*.tar.gz \
          -C ${{targets.contextdir}}/${{vars.prefix}}/ \
          ./sdk \
          ./sdk-manifests \
          ./templates

  - uses: dotnet/remove-trusted-roots
    with:
      dir: ${{targets.destdir}}/${{vars.prefix}}

  - uses: strip

subpackages:
  - name: "${{package.name}}-symbols"
    description: ".NET SDK ${{package.version}} symbols"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.prefix}}
          tar xf ./artifacts/assets/Release/dotnet-symbols-sdk-${{vars.major-version}}*.tar.gz \
                -C ${{targets.contextdir}}/${{vars.prefix}}/
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: /${{vars.prefix}}
            name: "*.pdb"

  - name: "${{package.name}}-artifacts"
    description: ".NET SDK ${{package.version}} build artifacts"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.prefix}}/artifacts
          tar xf ./artifacts/assets/Release/Private.SourceBuilt.Artifacts.*.tar.gz \
              -C ${{targets.contextdir}}/${{vars.prefix}}/artifacts
    test:
      environment:
        contents:
          packages:
            - busybox
            - unzip
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: /${{vars.prefix}}
            name: "*.tar.gz"
        - name: Runtime packs in the artifacts use the system brotli and zstd
          runs: |
            a=/${{vars.prefix}}/artifacts
            check() {
              rm -rf nupkg-check
              mkdir nupkg-check
              unzip -q -o "$1" "runtimes/*/native/*" -d nupkg-check
              f=$(echo nupkg-check/runtimes/*/native/"$2")
              grep -q libbrotlidec.so.1 "$f"
              grep -q libzstd.so.1 "$f"
              if grep -aq _ERROR_FORMAT_EXUBERANT_NIBBLE "$f"; then
                echo "$1: $2 still bundles a Brotli decoder" >&2
                exit 1
              fi
              for g in nupkg-check/runtimes/*/native/libbrotli*.a nupkg-check/runtimes/*/native/libzstd*.a; do
                if [ -e "$g" ]; then
                  echo "$1 ships the vendored ${g##*/}" >&2
                  exit 1
                fi
              done
            }
            check $a/Microsoft.NETCore.App.Runtime.wolfi.*[0-9].nupkg libSystem.IO.Compression.Native.so
            check $a/Microsoft.NETCore.App.Runtime.NativeAOT.wolfi.*[0-9].nupkg libSystem.IO.Compression.Native.so
            check $a/Microsoft.NETCore.App.Host.wolfi.*[0-9].nupkg singlefilehost
            check $a/runtime.wolfi.*.Microsoft.NETCore.DotNetAppHost.*[0-9].nupkg singlefilehost
            rm -rf nupkg-check

test:
  environment:
    contents:
      packages:
        - binutils # readelf, for the NativeAOT tools' OpenSSL binding
        # The host by name, as dotnet-sdk-10.0.4 does: a test environment that
        # reaches `dotnet` only through the runtime subpackages stops resolving
        # once a newer host is in the index (dotnet-sdk-10.0.1's did when
        # dotnet-11 appeared, SUB3-27).
        - dotnet-${{vars.major-version}}
        # OpenSSL 3 next to OpenSSL 4, as in the -ossl35 images, for the
        # DOTNET_OPENSSL_VERSION_OVERRIDE step.
        - libssl3
        - openssl-${{vars.openssl-version}} # the openssl CLI reads dev-certs' PKCS#12 export back
  pipeline:
    - uses: test/tw/ldd-check
    - name: Bootstrap-bundled host pack alignment
      runs: |
        # The SDK's apphost generation looks the host pack up at
        # /usr/share/dotnet/packs/Microsoft.NETCore.App.Host.<rid>/<bundled>/,
        # provided by dotnet-${{vars.major-version}}-targeting-pack. <bundled>
        # is the SDK's BundledNETCoreAppPackageVersion: the runtime version of
        # the tree this package was built from, since the VMR builds the
        # runtime in the same build. The bootstrap's runtime does not change
        # it (dotnet-sdk-10.0.1 10.0.114-r0, bootstrapped on runtime 10.0.13,
        # is bundled to 10.0.14). If the installed pack's runtime version
        # drifts from the bundled one, the lookup misses and `dotnet publish` /
        # `dotnet run` fail with NU1101. Fail loudly with that diagnosis
        # instead.
        case "$(uname -m)" in
          x86_64)  rid="wolfi.20230201-x64" ;;
          aarch64) rid="wolfi.20230201-arm64" ;;
          *)       echo "unexpected uname -m: $(uname -m)"; exit 1 ;;
        esac

        sdk_props="/usr/share/dotnet/sdk/${{package.version}}/Microsoft.NETCoreSdk.BundledVersions.props"
        bundled=$(sed -n 's:.*<BundledNETCoreAppPackageVersion>\([^<]*\)</BundledNETCoreAppPackageVersion>.*:\1:p' \
          "$sdk_props" | head -1)
        [ -n "$bundled" ] || { echo "could not parse BundledNETCoreAppPackageVersion from $sdk_props"; exit 1; }

        pack_dir="/usr/share/dotnet/packs/Microsoft.NETCore.App.Host.${rid}/${bundled}"
        if [ -d "$pack_dir" ]; then
          echo "ok: SDK bundled runtime ${bundled} is covered by host pack at ${pack_dir}"
          exit 0
        fi

        installed_versions=""
        pack_root="/usr/share/dotnet/packs/Microsoft.NETCore.App.Host.${rid}"
        if [ -d "$pack_root" ]; then installed_versions=$(ls "$pack_root" | tr '\n' ' '); fi
        cat <<EOF
        ERROR: bootstrap-bundled host pack drift detected

          ${{package.name}} was built bundled to runtime ${bundled}, but no host
          pack at /packs/Microsoft.NETCore.App.Host.${rid}/${bundled}/ is
          installed alongside it.

          installed host pack version(s) for ${rid}: ${installed_versions:-(none)}

          Fix: bump this package and dotnet-${{vars.major-version}} from the
          same dotnet/dotnet tag, so that the
          dotnet-${{vars.major-version}}-targeting-pack installed with it
          carries runtime ${bundled}.
        EOF
        exit 1
    - name: Install and verify a global .NET tool
      runs: |
        dotnet tool install -g Microsoft.Web.LibraryManager.Cli
        dotnet tool list -g | grep -Fi librarymanager
    - name: Compile and run a simple .NET application
      runs: |
        cat <<'EOF' > HelloWorld.cs
        using System;

        class Program
        {
            static void Main()
            {
                Console.WriteLine("Hello, World!");
            }
        }
        EOF
        dotnet new console -o HelloWorldApp --force
        mv HelloWorld.cs HelloWorldApp/Program.cs
        dotnet run --project HelloWorldApp | grep -F "Hello, World!"
    - name: Compile and run a .NET application with arguments
      runs: |
        cat <<'EOF' > ArgumentEcho.cs
        using System;

        class Program
        {
            static void Main(string[] args)
            {
                Console.WriteLine("Arguments: " + String.Join(", ", args));
            }
        }
        EOF
        dotnet new console -o ArgumentEchoApp --force
        mv ArgumentEcho.cs ArgumentEchoApp/Program.cs
        dotnet run --project ArgumentEchoApp -- arg1 arg2 arg3 | grep -F "Arguments: arg1, arg2, arg3"
    - name: Build and run an ASP.NET application
      runs: |
        # The build resolves the Microsoft.AspNetCore.App.Ref targeting pack
        # (aspnet-${{vars.major-version}}-targeting-pack); running an app that
        # instantiates a type from the ASP.NET shared framework loads
        # aspnet-${{vars.major-version}}-runtime at run time.
        dotnet new web -o WebApp --force
        cat <<'EOF' > WebApp/Program.cs
        WebApplication.CreateBuilder(args).Build();
        System.Console.WriteLine("aspnet framework: " + typeof(WebApplication).Assembly.Location);
        EOF
        dotnet run --project WebApp | grep -F "aspnet framework: /usr/share/dotnet/shared/Microsoft.AspNetCore.App/"
    - name: Sign a token with the NativeAOT-compiled user-jwts tool
      runs: |
        # dotnet-user-jwts is one of the SDK's ahead-of-time compiled tools
        # (libaspnetcoretools.so; the CLI's libdotnet-aot.so is the other).
        # Every dotnet command loads libdotnet-aot.so; the tools of
        # libaspnetcoretools.so run only here, in the dev-certs step and in
        # the libssl step below.
        # Signing a token (HMAC-SHA256) takes it through OpenSSL. grep's output
        # is discarded: the token must stay out of the log, where the build
        # system's scrubber redacts a JWT as a secret and reports the live log
        # as degraded.
        dotnet new web -o JwtApp --force
        dotnet user-jwts create --project JwtApp -o token |
          grep -E '^eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$' >/dev/null
    - name: dotnet dev-certs https saves, checks and exports its certificate
      runs: |
        # dotnet-dev-certs is another tool of libaspnetcoretools.so. It saves
        # a new certificate by exporting it with X509ContentType.Pkcs12 and
        # loading the result into the X509Store, and -ep exports it the same
        # way. That export is runtime code compiled into the tool, so the
        # installed dotnet-${{vars.major-version}} runtime does not decide
        # what it writes: this recipe's patch 0003 does. With the upstream
        # default, Triple DES, both commands fail with error:0308010C
        # (unsupported) unless CHAINGUARD_LEGACY_ENABLE_DES=1, so the variable
        # must not be set here. The SDK's first run, in the steps above, may
        # already have created a certificate: remove it, so that dev-certs
        # creates and saves one here. The same step is in dotnet-11, for the
        # tool that dotnet-11-sdk ships.
        unset CHAINGUARD_LEGACY_ENABLE_DES
        dotnet dev-certs https --clean
        if ! dotnet dev-certs https --verbose > dev-certs.txt 2>&1; then
          cat dev-certs.txt
          exit 1
        fi
        cat dev-certs.txt
        grep -F 'Finished saving certificate to the store.' dev-certs.txt
        dotnet dev-certs https --check
        dotnet dev-certs https -ep dev.pfx -p pw
        openssl pkcs12 -info -noout -in dev.pfx -passin pass:pw > dev.txt 2>&1
        cat dev.txt
        grep -F 'Shrouded Keybag: PBES2, PBKDF2, AES-256-CBC, Iteration 2000, PRF hmacWithSHA256' dev.txt
    - name: The NativeAOT tools carry this recipe's OpenSSL shim
      runs: |
        # Each NativeAOT-compiled file carries the crypto shim of the
        # NativeAOT runtime pack it was linked against. The build removes the
        # bootstrap's runtime packs of the version it makes and builds its own
        # with DistroAgnosticOpenSsl, so each file must load OpenSSL through
        # the dlopen shim (no DT_NEEDED on libssl or libcrypto), and its shim
        # must have been compiled by this recipe (source paths under
        # /home/build), not by dotnet-${{vars.major-version}}'s (under
        # /usr/src/dotnet-${{vars.major-version}}, its -ffile-prefix-map). The
        # paths do not tell this build from an earlier build of this package:
        # once the pins name a revision built with the shim, the bootstrap's
        # -artifacts pack has the same marks. What keeps that pack out is the
        # VMR, which takes a package this build makes from this build's output
        # only.
        sdk=/usr/share/dotnet/sdk/${{package.version}}
        for f in "$sdk"/libdotnet-aot.so "$sdk"/DotnetTools/aspnetcoretools/*/tools/any/*/libaspnetcoretools.so; do
          if [ ! -f "$f" ]; then
            echo "missing: $f"
            exit 1
          fi
          echo "$f:"
          readelf -d "$f" > dynamic.txt
          if ! grep -F '(NEEDED)' dynamic.txt; then
            echo "readelf found no DT_NEEDED entries in $f"
            exit 1
          fi
          if grep -E '\[lib(ssl|crypto)\.so' dynamic.txt; then
            echo "$f links OpenSSL instead of loading it through the shim"
            exit 1
          fi
          if ! n=$(grep -cF /home/build/src/runtime/src/native/libs/System.Security.Cryptography.Native/ "$f"); then
            echo "$f carries no crypto shim compiled by this recipe"
            exit 1
          fi
          echo "crypto shim source paths under /home/build: $n"
          if grep -qF /usr/src/dotnet-${{vars.major-version}}/ "$f"; then
            echo "$f carries dotnet-${{vars.major-version}}'s crypto shim, not this build's"
            exit 1
          fi
        done
    - name: The NativeAOT tools choose libssl as the runtime does
      runs: |
        # The shim in the NativeAOT tools picks libssl the way the
        # dotnet-${{vars.major-version}} runtime's does. libssl3 is installed
        # next to OpenSSL 4 here, as in the -ossl35 images. With
        # DOTNET_OPENSSL_VERSION_OVERRIDE=3 or 4, which those images document,
        # the processes that `dotnet user-jwts create` runs must load that
        # libssl and never the other. Without the variable they must load
        # libssl.so.4: dotnet-${{vars.major-version}}'s patch 0001 (upstream
        # 11.0 prefers libssl.so.3). LD_DEBUG=libs lists the libraries each
        # process initialises; each check asks for at least one process with
        # the expected libssl, and none with the other. The token stays out of
        # the log, as in the token step above: grep -c prints only a count.
        dotnet new web -o OverrideApp --force
        # check <the variable's value, empty to leave it unset> <N of the
        # libssl.so.N that must load> <N of the one that must not>
        check() {
          if [ -n "$1" ]; then
            export DOTNET_OPENSSL_VERSION_OVERRIDE="$1"
          else
            unset DOTNET_OPENSSL_VERSION_OVERRIDE
          fi
          what="DOTNET_OPENSSL_VERSION_OVERRIDE=${1:-(unset)}"
          if ! LD_DEBUG=libs dotnet user-jwts create --project OverrideApp -o token > token.txt 2> ld.txt; then
            sed -n '/^ *[0-9][0-9]*:/!p' ld.txt
            echo "$what: dotnet user-jwts create failed"
            exit 1
          fi
          if ! grep -cE '^eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$' token.txt; then
            echo "$what: no token from dotnet user-jwts create"
            exit 1
          fi
          if ! grep -E "calling init: .*/libssl\.so\.$2\$" ld.txt; then
            echo "$what: no process loaded libssl.so.$2"
            exit 1
          fi
          if grep -E "calling init: .*/libssl\.so\.$3\$" ld.txt; then
            echo "$what: a process loaded libssl.so.$3"
            exit 1
          fi
        }
        check 3 3 4
        check 4 4 3
        check "" 4 3

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: "v11.0.1"
