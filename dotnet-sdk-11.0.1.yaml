package:
  name: dotnet-sdk-11.0.1
  version: "11.0.100"
  epoch: 0
  description: ".NET SDK ${{package.version}}"
  copyright:
    - license: MIT
  resources:
    cpu: "16"
    memory: 66Gi
  dependencies:
    runtime:
      - aspnet-${{vars.major-version}}-runtime
      - aspnet-${{vars.major-version}}-targeting-pack
      - dotnet-${{vars.major-version}}
      - dotnet-${{vars.major-version}}-runtime
      - dotnet-${{vars.major-version}}-targeting-pack
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  llvm-version: '23'
  openssl-version: "4.0"
  prefix: 'usr/share/dotnet'

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+.*$
    replace: "$1"
    to: major-version

environment:
  environment:
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
    CFLAGS: "-Wno-error=used-but-marked-unused"
    # Inherited from dotnet-sdk-10.0.1: AVX2 JIT paths in the bootstrap's
    # crossgen2 trigger Internal CLR error 0x80131506 on x86_64.
    COMPlus_EnableAVX2: "0"
    DOTNET_EnableAVX2: "0"
  contents:
    packages:
      - bash
      - brotli-dev
      - busybox
      - clang-${{vars.llvm-version}}
      - cmake
      - curl
      # Bootstrapped from the stage0 SDK of the same release: it installs the
      # SDK under /usr/share/dotnet and the previously source-built artifacts
      # under /usr/share/dotnet/artifacts, which --with-sdk and --with-packages
      # consume. dotnet-sdk-10.0.1 started the same way and switched to its
      # own previous build once one existed.
      - dotnet-sdk-stage0-${{vars.major-version}}~${{package.version}}
      - file
      - glibc-2.44-dev
      - gnutar
      - icu-dev
      - krb5-dev
      - libunwind-dev
      - lttng-ust-dev
      - make
      - openssl-hardened-${{vars.openssl-version}}-dev
      - python3
      - rapidjson-dev
      - samurai # ninja: the 11.0 runtime build requires it (build-runtime.sh prerequisites)
      - zlib-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dotnet/dotnet
      tag: v${{package.version}}
      expected-commit: 297acf930fb0f5c07fd4e51d78e521b4ad2e5d1f

  # The release manifest dotnet/dotnet publishes with each tag; its
  # officialBuildId stamps real versions instead of -dev placeholders (see
  # dotnet-11). The package updater refreshes this checksum on every bump.
  - uses: fetch # blocked-extract-false: release metadata (release.json), not source
    with:
      uri: https://github.com/dotnet/dotnet/releases/download/v${{package.version}}/release.json
      expected-sha256: 007b0ad9b0cf567e35fab4db99fd01310e906e8566f57b437141ca314edc30cd
      extract: false

  - name: Check release.json describes this checkout
    runs: |
      python3 - "v${{package.version}}" "$(git rev-parse HEAD)" <<'EOF'
      import json, sys
      tag, head = sys.argv[1:]
      m = json.load(open("release.json"))
      if (m["tag"], m["sourceVersion"]) != (tag, head):
          sys.exit(f"release.json is for {m['tag']} at {m['sourceVersion']}, not {tag} at {head}")
      EOF

  - runs: |
      if [ ${{build.arch}} = "aarch64" ]; then
        # Dotnet does not have support for PAC/BTI which Axion uses
        # See: https://github.com/dotnet/runtime/pull/110472
        # EXTRA_${FLAG} is supposed to work, but it doesn't
        # so directly override the values which is supposedly a no-no
        # See also: https://github.com/dotnet/runtime/issues/61859
        export CFLAGS="$CFLAGS -mbranch-protection=none"
        export CXXFLAGS="-mbranch-protection=none"
      fi

      # The .NET runtime is built with O0 so we cannot enable FORTIFY_SOURCE
      sed -i 's/-D_FORTIFY_SOURCE=3//g' /etc/clang-${{vars.llvm-version}}/common.cfg

      # Many scripts in the VMR are not executable
      find . -name '*.sh' -exec chmod +x {} +

      # The runtime keeps the lock files of named mutexes (the MSBuild server,
      # the Roslyn compiler server) in $XDG_RUNTIME_DIR, or under $HOME/.dotnet
      # when it is unset. HOME is the repository root here, and the VMR's binary
      # scan (eng/init-detect-binaries.proj) opens every file under that root
      # exclusively, so a live lock fails the build. Give the runtime its own
      # runtime directory instead.
      export XDG_RUNTIME_DIR=/tmp/xdg-runtime
      mkdir -m 0700 -p "$XDG_RUNTIME_DIR"

      # Build .NET from the stage0 SDK and its artifacts, with the tag's
      # official build id (build.sh refuses --release-manifest in a git
      # checkout). System libraries replace every compression library the
      # runtime vendors (zstd is new in .NET 11).
      official_build_id=$(python3 -c 'import json; print(json.load(open("release.json"))["officialBuildId"])')
      ./build.sh \
        --with-sdk /${{vars.prefix}} \
        --clean-while-building --source-only \
        --with-packages /${{vars.prefix}}/artifacts \
        --official-build-id "$official_build_id" \
        -- \
        /v:minimal \
        /p:LogVerbosity=minimal \
        /p:ContinueOnPrebuiltBaselineError=true \
        /p:MinimalConsoleLogOutput=true \
        /p:SkipPortableRuntimeBuild=true \
        /p:UseSystemLibs=+brotli+rapidjson+zlib+libunwind+zstd \
        /p:PublishReadyToRunCrossgen2ExtraArgs="--parallelism=1 --instruction-set=base"

      mkdir -p ${{targets.contextdir}}/${{vars.prefix}}

      # Install SDK
      tar xf ./artifacts/assets/Release/dotnet-sdk-${{vars.major-version}}*.tar.gz \
          -C ${{targets.contextdir}}/${{vars.prefix}}/ \
          ./sdk \
          ./sdk-manifests \
          ./templates

  - uses: dotnet/remove-trusted-roots
    with:
      dir: ${{targets.destdir}}/${{vars.prefix}}

  - uses: strip

subpackages:
  - name: "${{package.name}}-symbols"
    description: ".NET SDK ${{package.version}} symbols"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.prefix}}
          tar xf ./artifacts/assets/Release/dotnet-symbols-sdk-${{vars.major-version}}*.tar.gz \
                -C ${{targets.contextdir}}/${{vars.prefix}}/
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: /${{vars.prefix}}
            name: "*.pdb"

  - name: "${{package.name}}-artifacts"
    description: ".NET SDK ${{package.version}} build artifacts"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.prefix}}/artifacts
          tar xf ./artifacts/assets/Release/Private.SourceBuilt.Artifacts.*.tar.gz \
              -C ${{targets.contextdir}}/${{vars.prefix}}/artifacts
    test:
      environment:
        contents:
          packages:
            - busybox
            - unzip
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: /${{vars.prefix}}
            name: "*.tar.gz"
        - name: Runtime packs in the artifacts use the system brotli and zstd
          runs: |
            a=/${{vars.prefix}}/artifacts
            check() {
              rm -rf nupkg-check
              mkdir nupkg-check
              unzip -q -o "$1" "runtimes/*/native/*" -d nupkg-check
              f=$(echo nupkg-check/runtimes/*/native/"$2")
              grep -q libbrotlidec.so.1 "$f"
              grep -q libzstd.so.1 "$f"
              if grep -aq _ERROR_FORMAT_EXUBERANT_NIBBLE "$f"; then
                echo "$1: $2 still bundles a Brotli decoder" >&2
                exit 1
              fi
              for g in nupkg-check/runtimes/*/native/libbrotli*.a nupkg-check/runtimes/*/native/libzstd*.a; do
                if [ -e "$g" ]; then
                  echo "$1 ships the vendored ${g##*/}" >&2
                  exit 1
                fi
              done
            }
            check $a/Microsoft.NETCore.App.Runtime.wolfi.*[0-9].nupkg libSystem.IO.Compression.Native.so
            check $a/Microsoft.NETCore.App.Runtime.NativeAOT.wolfi.*[0-9].nupkg libSystem.IO.Compression.Native.so
            check $a/Microsoft.NETCore.App.Host.wolfi.*[0-9].nupkg singlefilehost
            check $a/runtime.wolfi.*.Microsoft.NETCore.DotNetAppHost.*[0-9].nupkg singlefilehost
            rm -rf nupkg-check

test:
  environment:
    contents:
      packages:
        # The host by name, as dotnet-sdk-10.0.4 does: a test environment that
        # reaches `dotnet` only through the runtime subpackages stops resolving
        # once a newer host is in the index (dotnet-sdk-10.0.1's did when
        # dotnet-11 appeared, SUB3-27).
        - dotnet-${{vars.major-version}}
  pipeline:
    - uses: test/tw/ldd-check
    - name: Bootstrap-bundled host pack alignment
      runs: |
        # Source-build's BundledNETCoreAppPackageVersion follows the bootstrap
        # input runtime (here the stage0 SDK of the same release), not the
        # source tree. The SDK's apphost generation looks the host pack up at
        # /usr/share/dotnet/packs/Microsoft.NETCore.App.Host.<rid>/<bundled>/,
        # provided by dotnet-${{vars.major-version}}-targeting-pack. If that
        # pack's runtime version drifts from the bundled one, the lookup misses
        # and `dotnet publish` / `dotnet run` fail with NU1101. Fail loudly with
        # that diagnosis instead.
        case "$(uname -m)" in
          x86_64)  rid="wolfi.20230201-x64" ;;
          aarch64) rid="wolfi.20230201-arm64" ;;
          *)       echo "unexpected uname -m: $(uname -m)"; exit 1 ;;
        esac

        sdk_props="/usr/share/dotnet/sdk/${{package.version}}/Microsoft.NETCoreSdk.BundledVersions.props"
        bundled=$(sed -n 's:.*<BundledNETCoreAppPackageVersion>\([^<]*\)</BundledNETCoreAppPackageVersion>.*:\1:p' \
          "$sdk_props" | head -1)
        [ -n "$bundled" ] || { echo "could not parse BundledNETCoreAppPackageVersion from $sdk_props"; exit 1; }

        pack_dir="/usr/share/dotnet/packs/Microsoft.NETCore.App.Host.${rid}/${bundled}"
        if [ -d "$pack_dir" ]; then
          echo "ok: SDK bundled runtime ${bundled} is covered by host pack at ${pack_dir}"
          exit 0
        fi

        installed_versions=""
        pack_root="/usr/share/dotnet/packs/Microsoft.NETCore.App.Host.${rid}"
        if [ -d "$pack_root" ]; then installed_versions=$(ls "$pack_root" | tr '\n' ' '); fi
        cat <<EOF
        ERROR: bootstrap-bundled host pack drift detected

          ${{package.name}} was built bundled to runtime ${bundled}, but no host
          pack at /packs/Microsoft.NETCore.App.Host.${rid}/${bundled}/ is
          installed alongside it.

          installed host pack version(s) for ${rid}: ${installed_versions:-(none)}

          Fix: rebuild this package on a bootstrap whose runtime matches the
          dotnet-${{vars.major-version}}-targeting-pack it is installed with
          (epoch bump), or bump both from the same dotnet/dotnet tag.
        EOF
        exit 1
    - name: Install and verify a global .NET tool
      runs: |
        dotnet tool install -g Microsoft.Web.LibraryManager.Cli
        dotnet tool list -g | grep -Fi librarymanager
    - name: Compile and run a simple .NET application
      runs: |
        cat <<'EOF' > HelloWorld.cs
        using System;

        class Program
        {
            static void Main()
            {
                Console.WriteLine("Hello, World!");
            }
        }
        EOF
        dotnet new console -o HelloWorldApp --force
        mv HelloWorld.cs HelloWorldApp/Program.cs
        dotnet run --project HelloWorldApp | grep -F "Hello, World!"
    - name: Compile and run a .NET application with arguments
      runs: |
        cat <<'EOF' > ArgumentEcho.cs
        using System;

        class Program
        {
            static void Main(string[] args)
            {
                Console.WriteLine("Arguments: " + String.Join(", ", args));
            }
        }
        EOF
        dotnet new console -o ArgumentEchoApp --force
        mv ArgumentEcho.cs ArgumentEchoApp/Program.cs
        dotnet run --project ArgumentEchoApp -- arg1 arg2 arg3 | grep -F "Arguments: arg1, arg2, arg3"
    - name: Build and run an ASP.NET application
      runs: |
        # The build resolves the Microsoft.AspNetCore.App.Ref targeting pack
        # (aspnet-${{vars.major-version}}-targeting-pack); running an app that
        # instantiates a type from the ASP.NET shared framework loads
        # aspnet-${{vars.major-version}}-runtime at run time.
        dotnet new web -o WebApp --force
        cat <<'EOF' > WebApp/Program.cs
        WebApplication.CreateBuilder(args).Build();
        System.Console.WriteLine("aspnet framework: " + typeof(WebApplication).Assembly.Location);
        EOF
        dotnet run --project WebApp | grep -F "aspnet framework: /usr/share/dotnet/shared/Microsoft.AspNetCore.App/"

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: "v11.0.1"
