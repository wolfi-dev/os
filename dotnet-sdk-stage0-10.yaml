package:
  name: dotnet-sdk-stage0-10
  version: "10.0.113"
  epoch: 1 # CVE-2026-111497
  description: ".NET SDK ${{vars.major-version}} stage0"
  copyright:
    - license: MIT
  resources:
    cpu: "16"
    memory: 64Gi
  dependencies:
    runtime:
      - icu
  test-resources:
    cpu: "1"
    memory: 5Gi

vars:
  llvm-version: '23'
  openssl-version: "4.0"
  prefix: 'usr/share/dotnet'

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+$
    replace: "$1"
    to: major-version

environment:
  environment:
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
    CFLAGS: "-Wno-error=used-but-marked-unused"
  contents:
    packages:
      - bash
      - brotli-dev
      - busybox
      - clang-${{vars.llvm-version}}
      - cmake
      - curl
      - file
      - glibc-2.44-dev
      - icu-dev
      - krb5-dev
      # prep-source-build.sh runs Microsoft's portable bootstrap SDK, whose crypto
      # shim only binds libssl.so.3/1.1; needed at build time only.
      - libssl3
      - libunwind-dev
      - lttng-ust-dev
      - make
      - openssl-hardened-${{vars.openssl-version}}-dev
      - python3
      - rapidjson-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dotnet/dotnet
      tag: v${{package.version}}
      expected-commit: 4099f83977f4d29604a9aeb971fb0a7bc1d5f699

  # OpenSSL 4.0 backports for the System.Security.Cryptography.Native shim,
  # shared with dotnet-10 (same upstream tag); drop once upstream ships them.
  - working-directory: src/runtime
    uses: patch
    with:
      patches: |
        0001-Fix-build-compilation-with-OpenSSL-4.0-dev.patch
        0002-Remove-OpenSSL-1.0.2-and-1.1.0-support.patch
        0003-Enable-the-crypto-shim-to-build-against-OpenSSL-4.0-.patch
        0004-Allow-binding-to-OpenSSL-4-from-portable-builds.patch
        0005-Remove-deprecated-OpenSSL-RSA-APIs-126034.patch
        0006-Prefer-using-non-deprecated-EC-OSSL-APIs-where-possi.patch
        0007-Fix-if-that-should-have-been-an-ifdef-on-non-portabl.patch
        0008-Remove-SafeEcKeyHandle.patch
        0009-Shim-CRYPTO_zalloc-for-OPENSSL_zalloc-callers.patch

  - runs: |
      # Setup bootstrap .NET SDK
      ./prep-source-build.sh

      if [ ${{build.arch}} = "aarch64" ]; then
        # Dotnet does not have support for PAC/BTI which Axion uses
        # See: https://github.com/dotnet/runtime/pull/110472
        # EXTRA_${FLAG} is supposed to work, but it doesn't
        # so directly override the values which is supposedly a no-no
        # See also: https://github.com/dotnet/runtime/issues/61859
        export CFLAGS="$CFLAGS -mbranch-protection=none"
        export CXXFLAGS="-mbranch-protection=none"
      fi

      # The .NET runtime is built with O0 so we cannot enable FORTIFY_SOURCE
      sed -i 's/-D_FORTIFY_SOURCE=3//g' /etc/clang-${{vars.llvm-version}}/common.cfg

      # Build .NET
      ./build.sh \
        --clean-while-building \
        --source-only \
        -- \
        /v:minimal \
        /p:LogVerbosity=minimal \
        /p:ContinueOnPrebuiltBaselineError=true \
        /p:MinimalConsoleLogOutput=true \
        /p:SkipPortableRuntimeBuild=true \
        /p:UseSystemLibs=+brotli+rapidjson+zlib+libunwind \
        /p:OfficialBuilder=Chainguard

      mkdir -p ${{targets.contextdir}}/${{vars.prefix}}/artifacts

      # Install SDK
      tar xf ./artifacts/assets/Release/dotnet-sdk-${{vars.major-version}}*.tar.gz \
          -C ${{targets.contextdir}}/${{vars.prefix}}/

      # Install SDK symbols
      tar xf ./artifacts/assets/Release/dotnet-symbols-sdk-${{vars.major-version}}*.tar.gz \
            -C ${{targets.contextdir}}/${{vars.prefix}}/

      # Install artifacts
      tar xf ./artifacts/assets/Release/Private.SourceBuilt.Artifacts.*.tar.gz \
          -C ${{targets.contextdir}}/${{vars.prefix}}/artifacts

      # Provide host in path
      mkdir -p ${{targets.contextdir}}/usr/bin
      ln -s ../share/dotnet/dotnet ${{targets.contextdir}}/usr/bin/dotnet

  - uses: strip

test:
  environment:
    contents:
      packages:
        - busybox
        - unzip
  pipeline:
    - name: Basic .NET command test
      runs: |
        dotnet --info
    - name: Compile and run a simple .NET application
      runs: |
        cat <<'EOF' > HelloWorld.cs
        using System;

        class Program
        {
            static void Main()
            {
                Console.WriteLine("Hello, World!");
            }
        }
        EOF
        dotnet new console -o HelloWorldApp --force
        mv HelloWorld.cs HelloWorldApp/Program.cs
        dotnet run --project HelloWorldApp | grep -F "Hello, World!"
    - name: Compile and run a .NET application with arguments
      runs: |
        cat <<'EOF' > ArgumentEcho.cs
        using System;

        class Program
        {
            static void Main(string[] args)
            {
                Console.WriteLine("Arguments: " + String.Join(", ", args));
            }
        }
        EOF
        dotnet new console -o ArgumentEchoApp --force
        mv ArgumentEcho.cs ArgumentEchoApp/Program.cs
        dotnet run --project ArgumentEchoApp -- arg1 arg2 arg3 | grep -F "Arguments: arg1, arg2, arg3"
    - uses: test/tw/ldd-check
    - name: Installed runtime and packs use the system brotli
      runs: |
        d=/${{vars.prefix}}
        for f in $d/shared/Microsoft.NETCore.App/*/libSystem.IO.Compression.Native.so \
                 $d/packs/Microsoft.NETCore.App.Host.*/*/runtimes/*/native/singlefilehost \
                 $d/packs/Microsoft.NETCore.App.Runtime.NativeAOT.*/*/runtimes/*/native/libSystem.IO.Compression.Native.so; do
          grep -q libbrotlidec.so.1 "$f"
          if grep -aq _ERROR_FORMAT_EXUBERANT_NIBBLE "$f"; then
            echo "$f still bundles a Brotli decoder" >&2
            exit 1
          fi
        done
        for a in $d/packs/Microsoft.NETCore.App.Runtime.NativeAOT.*/*/runtimes/*/native/libbrotli*.a; do
          if [ -e "$a" ]; then
            echo "$a is the vendored Brotli" >&2
            exit 1
          fi
        done
    - name: Runtime packs in the artifacts use the system brotli
      runs: |
        a=/${{vars.prefix}}/artifacts
        check() {
          rm -rf nupkg-check
          mkdir nupkg-check
          unzip -q -o "$1" "runtimes/*/native/$2" -d nupkg-check
          f=$(echo nupkg-check/runtimes/*/native/"$2")
          grep -q libbrotlidec.so.1 "$f"
          if grep -aq _ERROR_FORMAT_EXUBERANT_NIBBLE "$f"; then
            echo "$1: $2 still bundles a Brotli decoder" >&2
            exit 1
          fi
        }
        check $a/Microsoft.NETCore.App.Runtime.wolfi.*[0-9].nupkg libSystem.IO.Compression.Native.so
        check $a/Microsoft.NETCore.App.Runtime.NativeAOT.wolfi.*[0-9].nupkg libSystem.IO.Compression.Native.so
        check $a/Microsoft.NETCore.App.Host.wolfi.*[0-9].nupkg singlefilehost
        check $a/runtime.wolfi.*.Microsoft.NETCore.DotNetAppHost.*[0-9].nupkg singlefilehost
        unzip -l $a/Microsoft.NETCore.App.Runtime.NativeAOT.wolfi.*[0-9].nupkg > nupkg-check.list
        if grep -q 'native/libbrotli' nupkg-check.list; then
          echo "the NativeAOT runtime pack still ships the vendored libbrotli*.a" >&2
          exit 1
        fi
        rm -rf nupkg-check nupkg-check.list

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: "v10.0.1"
