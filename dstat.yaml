package:
  name: dstat
  version: 1.3.8
  epoch: 0
  description: A versatile resource statistics tool (dool, the maintained dstat fork)
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - python3

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/scottchiefbaker/dool
      tag: v${{package.version}}
      expected-commit: b74503e2dfbca8ef01c284d40aa77dc82be308b9

  - runs: |
      make DESTDIR=${{targets.destdir}} install

  # dstat compatibility: dool ships a dstat compatibility mode (--dstat) that
  # restores the classic dstat defaults and output formatting.
  - runs: |
      cat > dstat-wrapper <<'EOF'
      #!/bin/sh
      exec /usr/bin/dool --dstat "$@"
      EOF
      install -Dm755 dstat-wrapper ${{targets.destdir}}/usr/bin/dstat

  - uses: strip

subpackages:
  - name: dstat-doc
    description: dstat manpages
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: scottchiefbaker/dool
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/no-docs
    - runs: |
        dool --version
        dstat --version
        dstat 1 1
