package:
  name: dua
  version: "2.46.0"
  epoch: 0 # rust: 1.98->1.99
  description: "View disk space usage and delete unwanted data, fast."
  copyright:
    - license: MIT

vars:
  rust-version: "1.99"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - rust-${{vars.rust-version}}
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Byron/dua-cli
      expected-commit: 45a2649a6100afd71c33eaad3ed49f36833ee8c5
      tag: v${{package.version}}

  - name: Configure and build
    runs: |
      cargo build --release --no-default-features --features tui-crossplatform
      mkdir -p ${{targets.destdir}}/usr/bin/
      mv target/release/dua ${{targets.destdir}}/usr/bin/dua

  - uses: strip

update:
  enabled: true
  github:
    identifier: Byron/dua-cli
    strip-prefix: v

test:
  pipeline:
    - runs: |
        dua -V
        dua --version
        dua --help
