package:
  name: dua
  version: "3.0.3"
  epoch: 1 # rust: 1.99->1.100
  description: "View disk space usage and delete unwanted data, fast."
  copyright:
    - license: MIT

vars:
  rust-version: "1.100"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - rust-${{vars.rust-version}}
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Byron/dua-cli
      expected-commit: aa40d1990e80c811b80cc29b129ad0f02d4fda18
      tag: v${{package.version}}

  - name: Configure and build
    runs: |
      cargo build --release --no-default-features --features tui-crossplatform
      mkdir -p ${{targets.destdir}}/usr/bin/
      mv target/release/dua ${{targets.destdir}}/usr/bin/dua

  - uses: upstream-tests/cargo-test
    with:
      args: --no-default-features --features tui-crossplatform

  - uses: strip

update:
  enabled: true
  github:
    identifier: Byron/dua-cli
    strip-prefix: v

test:
  pipeline:
    - runs: |
        dua -V
        dua --version
        dua --help
