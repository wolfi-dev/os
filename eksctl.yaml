package:
  name: eksctl
  version: "0.232.0"
  epoch: 0 # CVE-2026-128085
  description:
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 11Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/weaveworks/eksctl
      expected-commit: 69bb49fc68dbd532398c78abcfca27ed43df85cb
      tag: v${{package.version}}

  - uses: bump
    with:
      deps: |-
        github.com/google/go-containerregistry@v0.22.1
        github.com/klauspost/compress@v1.20.2
      language: go

  - uses: go/build
    with:
      packages: ./cmd/eksctl
      output: eksctl
      go-package: go-1.27
      ldflags: |
        -X github.com/weaveworks/eksctl/pkg/version.gitCommit=$(git rev-parse --short HEAD)
        -X github.com/weaveworks/eksctl/pkg/version.buildDate=$(date -d@$SOURCE_DATE_EPOCH +%Y-%m-%dT%H:%M:%SZ)

update:
  enabled: true
  github:
    identifier: weaveworks/eksctl
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: eksctl
    - uses: test/tw/ver-check
      with:
        bins: eksctl
    - name: Verify eksctl generates shell completion scripts
      runs: |
        set -euo pipefail
        eksctl completion bash > /tmp/eksctl_completion.sh
        grep -F "eksctl" /tmp/eksctl_completion.sh
