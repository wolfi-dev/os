package:
  name: emissary
  version: "4.2.0"
  epoch: 2 # rust: 1.99->1.100
  description: "open source Kubernetes-native API gateway for microservices built on the Envoy Proxy"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - datawire-envoy-privileged
      - git
      - py${{vars.python-version}}-ambassador
  resources:
    cpu: "3"
    memory: 12Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  py-pkg: ambassador
  # v4 hard-pins requires-python to ==3.13.5 in pyproject.toml
  python-version: "3.13"
  rust-version: "1.100"

environment:
  contents:
    packages:
      # Upstream's build-aux/init-configure-make-itself.mk sets SHELL = bash,
      # so every make recipe and $(shell ...) call needs bash. This used to
      # arrive transitively via go-1.26, but go-1.27 dropped that dependency,
      # which left VERSION empty and failed Makefile:35. Declare it directly.
      - bash
      - glibc-2.44-dev
      - go-1.27
      - iproute2
      - libcap-utils
      - py3-supported-pip
      - python-${{vars.python-version}}
      - rust-${{vars.rust-version}}
      - uv
  accounts:
    # Need to run with privilege to be able to do setcap
    run-as: root

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/emissary-ingress/emissary
      tag: v${{package.version}}
      expected-commit: 7e5c0d492f143bce6609708e6dd0392d59b1a33f
      depth: -1 # Full history is required for version determination

  - name: Patch Python version constraint
    runs: |
      # Upstream pins requires-python to ==3.13.5 exactly, but Wolfi's
      # python-3.13 ships a different patch level. Loosen to the 3.13
      # series so uv build can use the system interpreter.
      sed -i 's/^requires-python = "==3\.13\.5"$/requires-python = ">=3.13,<3.14"/' pyproject.toml

  - name: Patch workspace member readme paths
    runs: |
      # hatchling 1.32.0 rejects project.readme paths that resolve outside
      # the project directory, and both workspace members declare
      # readme = "../README.md". Upstream leaves [build-system] requires
      # unpinned, so uv picks up the new hatchling and the wheel build dies
      # with "Readme path must be within the project directory". Copy the
      # readme in and make the path local, which keeps the long_description
      # metadata that simply dropping the field would lose.
      for member in python/ambassador python/ambassador-diag; do
        cp python/README.md "${member}/README.md"
        sed -i 's|^readme = "\.\./README\.md"$|readme = "README.md"|' "${member}/pyproject.toml"
      done

  - uses: bump
    with:
      language: python
      packages: |-
        orjson==3.11.6
        requests==2.33.0

  # Go dependency pins. Upstream 4.2.0 already requires k8s.io/* v0.37.2
  # (past the v1alpha1 removals that forced the old v0.32.10 replaces in
  # 4.1.0), so those replace directives are no longer needed and would
  # downgrade. These pins are aligned with the versions in upstream's
  # 4.2.0 go.mod so that a future upstream regression is not possible
  # via an older resolution.
  - uses: bump
    with:
      language: go
      deps: |-
        k8s.io/kubernetes@v1.37.2
        sigs.k8s.io/controller-runtime@v0.25.2
        google.golang.org/grpc@v1.85.0
        go.opentelemetry.io/otel@v1.47.0
        github.com/moby/spdystream@v0.5.1
        golang.org/x/net@v0.62.0
        golang.org/x/sys@v0.49.0
        github.com/stretchr/testify@v1.12.1
        github.com/envoyproxy/go-control-plane@v0.14.0
        golang.org/x/sync@v0.24.0
        google.golang.org/genproto/googleapis/rpc@v0.0.0-20261026165753-2ffab32bce7e
        google.golang.org/protobuf@v1.36.12

  - uses: go/build
    with:
      packages: ./cmd/busyambassador
      output: busyambassador
      go-package: go-1.27

  - uses: go/build
    with:
      packages: ./cmd/capabilities_wrapper
      output: wrapper
      go-package: go-1.27

  - name: wrapper-setcap
    # See https://github.com/emissary-ingress/emissary/blob/ac2dc64c6621cd8ec5617f3328544364bdd3fb01/build-aux/Dockerfile#L129-L137
    runs: |
      setcap cap_net_bind_service=p ${{targets.contextdir}}/usr/bin/wrapper

  - uses: go/build
    with:
      packages: ./cmd/kubestatus
      output: kubestatus
      go-package: go-1.27

  - uses: auth/uv
    with:
      allow-fallback-indexes: true

subpackages:
  - name: py${{vars.python-version}}-${{vars.py-pkg}}
    description: python${{vars.python-version}} version of emissary
    dependencies:
      runtime:
        - ca-certificates-bundle
    pipeline:
      - name: "Build wheels and install Python packages"
        runs: |
          # v4 reorganized python into a uv workspace: build the workspace
          # member wheels, then install them along with pinned runtime deps.
          # See docker/emissary/Dockerfile in upstream for the reference flow.
          # Upstream pins python-preference=only-managed, but we need uv to
          # use Wolfi's python; override to only-system for the wheel builds.
          (cd python/ambassador && uv build --wheel --python-preference=only-system --python python${{vars.python-version}} --out-dir /tmp/wheels)
          (cd python/ambassador-diag && uv build --wheel --python-preference=only-system --python python${{vars.python-version}} --out-dir /tmp/wheels)

          # cd /tmp before installing for two reasons:
          #   1. uv pip walks up from cwd looking for a pyproject.toml and
          #      applies any [tool.uv.pip] config it finds. The repo's root
          #      pyproject.toml sets require-hashes=true, which would reject
          #      our hash-less install. From /tmp the walk hits / with no
          #      pyproject.toml in between and the setting never applies.
          #   2. Versions for these deps live in the root pyproject.toml's
          #      [dependency-groups] runtime table, but uv pip install (vs
          #      uv sync) does not consult dependency groups. The wheels'
          #      own pyprojects declare deps as bare strings (no pins), so
          #      we mirror the runtime group pins explicitly here and layer
          #      the security override on top (werkzeug 3.1.9). The pins
          #      match upstream v4.2.0's runtime group; diagd imports
          #      pythonjsonlogger.json, which needs python-json-logger 3+.
          cd /tmp
          uv pip install --no-cache --python python${{vars.python-version}} --prefix=${{targets.contextdir}}/usr \
            click==8.5.0 \
            durationpy==0.11 \
            expiringdict==1.2.2 \
            flask==3.1.3 \
            gunicorn==26.2.0 \
            jsonpatch==1.42 \
            orjson==3.13.0 \
            prometheus-client==0.26.0 \
            python-json-logger==4.2.0 \
            pyyaml==6.0.3 \
            requests==2.34.2 \
            semantic-version==2.10.0 \
            werkzeug==3.1.9 \
            /tmp/wheels/*.whl
          chmod 644 ${{targets.contextdir}}/usr/.lock
      - runs: |
          # Generate version file. v4's VERSION.py reads from a hardcoded
          # /buildroot/ambassador/python/ambassador.version (see
          # python/ambassador/src/ambassador/VERSION.py), so install it there
          # rather than into site-packages.
          make python/ambassador.version
          install -Dm644 python/ambassador.version \
            ${{targets.contextdir}}/buildroot/ambassador/python/ambassador.version

          # Templates are bundled into the ambassador-diag wheel via
          # hatch.build.targets.sdist; no manual copy is needed.
      # certifi ignores SSL_CERT_FILE, so point its bundled cacert.pem at the system bundle.
      - uses: ca-certificates/use-system-bundle
        with:
          files: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/certifi/cacert.pem
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{vars.python-version}}
            imports: from ambassador import Version
        - uses: test/uses-system-ca-bundle
          with:
            files: /usr/lib/python${{vars.python-version}}/site-packages/certifi/cacert.pem
            package: py${{vars.python-version}}-${{vars.py-pkg}}
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-oci-entrypoint
    description: Entrypoint for ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin/
          cp -p python/entrypoint.sh ${{targets.contextdir}}/usr/bin/entrypoint.sh
          chmod +x ${{targets.contextdir}}/usr/bin/entrypoint.sh
    test:
      pipeline:
        - runs: stat /usr/bin/entrypoint.sh

  - name: ${{package.name}}-apiext
    description: Emissary-ingress apiext webhook conversion server
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/apiext
          output: apiext
          go-package: go-1.27
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: apiext
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: emissary-ingress/emissary
    strip-prefix: v
    use-tag: true
  ignore-regex-patterns:
    - -rc.*
    - -dev.*
    - ^chart/
    - -reltest.*

test:
  environment:
    contents:
      packages:
        - curl
        - emissary-oci-entrypoint
        - kwok
        - kwokctl
        - kubernetes
        - etcd
        - libcap-utils
    environment:
      SCOUT_DISABLE: true
  pipeline:
    - name: "Test entrypoint"
      uses: test/daemon-check-output
      with:
        # The default kwok pipeline doesn't run in bubblewrap, so we need to spawn it ourselves in the same pipeline step.
        setup: |
          kwokctl create cluster --runtime binary \
            --kube-apiserver-binary="/usr/bin/kube-apiserver" \
            --kube-controller-manager-binary="/usr/bin/kube-controller-manager" \
            --kube-scheduler-binary="/usr/bin/kube-scheduler" \
            --kwok-controller-binary="/usr/bin/kwok" \
            --etcd-binary="/usr/bin/etcd"

          kwokctl scale node --replicas 1
          kubectl wait --for=condition=Ready nodes --all
          kubectl cluster-info
        start: /usr/bin/entrypoint.sh
        timeout: "30"
        expected_output: "started command"
        # Can't use default error string set because logs will print error messages complaining it's not running in a pod.
        error_strings: |
          FAIL
          FATAL
        post: |
          # As of 4.2.0 diagd listens only on a Unix-domain socket; the health
          # checks are answered by the entrypoint on the admin port (8877).
          sleep 10
          curl -i http://127.0.0.1:8877/ambassador/v0/check_alive
          curl -i http://127.0.0.1:8877/ambassador/v0/check_ready
    - name: Test file capabilities
      runs: |
        getcap /usr/bin/wrapper | cut -d ' ' -f2 | grep -q -E '^cap_net_bind_service=p$'
