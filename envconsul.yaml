package:
  name: envconsul
  version: "0.14.1"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.3
  description: "Launch a subprocess with environment variables using data from @hashicorp Consul and Vault."
  copyright:
    - license: MPL-2.0
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/envconsul.git
      tag: v${{package.version}}
      expected-commit: 294f187c97d3a0b38e967635a6130c339e6c3f92

  - uses: bump
    with:
      deps: |-
        golang.org/x/text@v0.39.0
        golang.org/x/net@v0.60.0
      language: go

  - uses: go/build
    with:
      packages: .
      ldflags: -X github.com/hashicorp/envconsul/version.Name=${{package.name}}
      output: envconsul
      go-package: go-1.27

update:
  enabled: true
  github:
    identifier: hashicorp/envconsul
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify version output
      runs: |
        envconsul --version
    - name: Verify help output
      runs: |
        envconsul --help 2>&1 | grep -iE "usage|envconsul"
