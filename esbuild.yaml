package:
  name: esbuild
  version: "0.28.2"
  epoch: 6 # use our binary in esbuild-node subpackage
  description: An extremely fast bundler for the web
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - go-1.27
      - nodejs-26
      - npm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/evanw/esbuild
      tag: v${{package.version}}
      expected-commit: 609683d892977362a0f99026cb74b96263d728a9

  - runs: |
      node scripts/esbuild.js --update-version-go

  - uses: go/build
    with:
      packages: ./cmd/esbuild
      output: esbuild
      go-package: go-1.27

  - name: Build the platform-neutral Node.js module
    runs: |
      # Upstream's `make platform-neutral`, minus the cross-platform binaries we
      # do not ship: stamp npm/esbuild/package.json with the release version,
      # then let the binary we just built bundle its own JS client into
      # npm/esbuild/lib. The client refuses to talk to a binary whose version
      # differs from its own, so both halves have to come from this build.
      node scripts/esbuild.js npm/esbuild/package.json --version
      node scripts/esbuild.js "${{targets.destdir}}/usr/bin/esbuild" --neutral

subpackages:
  - name: esbuild-node
    description: esbuild Node.js API module
    dependencies:
      runtime:
        - esbuild
    pipeline:
      - runs: |
          npm install -g ${{package.name}}@${{package.version}} -prefix ${{targets.contextdir}}/usr
          rm -rf ${{targets.contextdir}}/usr/bin
          bin_path=$(ls ${{targets.contextdir}}/usr/lib/node_modules/esbuild/node_modules/@esbuild/linux-*/bin/esbuild)
          rm $bin_path
          ln -s /usr/bin/esbuild $bin_path
    test:
      environment:
        contents:
          packages:
            - nodejs
      pipeline:
        - name: Bundle through the Node.js API
          runs: |
            set -euo pipefail

            cd "$(mktemp -d)"
            echo 'export const greeting = "hello from the node api"' > dep.js
            echo 'import {greeting} from "./dep.js"; console.log(greeting)' > entry.js

            # Exercises the client/binary handshake: a version skew between
            # /usr/lib/node_modules/esbuild and /usr/bin/esbuild fails here.
            node -e '
              const esbuild = require("/usr/lib/node_modules/esbuild");
              esbuild.buildSync({
                entryPoints: ["entry.js"],
                bundle: true,
                outfile: "bundle.js",
              });
            '

            grep -F 'hello from the node api' bundle.js
            node bundle.js | grep -F 'hello from the node api'

update:
  enabled: true
  github:
    identifier: evanw/esbuild
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: esbuild
    - uses: test/tw/help-check
      with:
        bins: esbuild
    - name: Test JavaScript bundling
      runs: |
        set -euo pipefail

        # Create a simple JS file to bundle
        echo 'console.log("hello")' > /tmp/input.js
        esbuild /tmp/input.js --bundle --outfile=/tmp/output.js

        # Verify the output file was created and contains expected content
        stat /tmp/output.js
        grep -F 'hello' /tmp/output.js
    - name: Test JavaScript minification
      runs: |
        set -euo pipefail

        # Create a JS file with some content that can be minified
        echo 'const   x   =   1;   console.log(  x  )' > /tmp/minify-input.js
        esbuild /tmp/minify-input.js --minify --outfile=/tmp/minify-output.js

        # Verify the minified output is smaller than the input
        input_size=$(wc -c < /tmp/minify-input.js)
        output_size=$(wc -c < /tmp/minify-output.js)
        if [ "$output_size" -ge "$input_size" ]; then
          echo "FAIL: Minified output ($output_size bytes) should be smaller than input ($input_size bytes)"
          exit 1
        fi
        echo "SUCCESS: Minified from $input_size to $output_size bytes"
    - name: Test TypeScript transformation
      runs: |
        set -euo pipefail

        # Create a TypeScript file with type annotations
        echo 'const x: number = 1; console.log(x)' > /tmp/input.ts
        esbuild /tmp/input.ts --outfile=/tmp/ts-output.js

        # Verify the output contains the JS code without type annotations
        grep -F 'console.log' /tmp/ts-output.js

        # Verify type annotation was stripped
        if grep -F ': number' /tmp/ts-output.js; then
          echo "FAIL: TypeScript type annotation was not stripped"
          exit 1
        fi
        echo "SUCCESS: TypeScript transformed to JavaScript"
