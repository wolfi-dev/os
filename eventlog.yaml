# Generated from https://git.alpinelinux.org/aports/plain/main/eventlog/APKBUILD
package:
  name: eventlog
  version: 0.2.13
  epoch: 5 # glibc: 2.43->2.44
  description: API to format and send structured log messages
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libtool

pipeline:
  - uses: fetch
    with:
      expected-sha256: 7cb4e6f316daede4fa54547371d5c986395177c12dbdec74a66298e684ac8b85
      uri: https://src.fedoraproject.org/lookaside/extras/eventlog/eventlog_${{package.version}}.tar.gz/68ec8d1ea3b98fa35002bb756227c315/eventlog_${{package.version}}.tar.gz

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: eventlog-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - eventlog
    description: eventlog dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  release-monitor:
    identifier: 14684

test:
  environment:
    contents:
      packages:
        - build-base
        - eventlog-dev
  pipeline:
    - name: compile and link against libevtlog
      runs: |
        cat > /tmp/test_evtlog.c << 'EOF'
        #include <eventlog/evtlog.h>
        #include <stdio.h>
        #include <stdlib.h>
        int main(void) {
          EVTCONTEXT *ctx;
          EVTREC *rec;
          char *msg;
          ctx = evt_ctx_init("test-app", EVT_FAC_USER);
          if (!ctx) {
            fprintf(stderr, "evt_ctx_init failed\n");
            return 1;
          }
          rec = evt_rec_init(ctx, EVT_PRI_INFO, "hello from eventlog");
          if (!rec) {
            fprintf(stderr, "evt_rec_init failed\n");
            evt_ctx_free(ctx);
            return 1;
          }
          msg = evt_format(rec);
          if (!msg) {
            fprintf(stderr, "evt_format failed\n");
            evt_rec_free(rec);
            evt_ctx_free(ctx);
            return 1;
          }
          printf("formatted message: %s\n", msg);
          free(msg);
          evt_rec_free(rec);
          evt_ctx_free(ctx);
          return 0;
        }
        EOF
        gcc /tmp/test_evtlog.c -o /tmp/test_evtlog -levtlog
        /tmp/test_evtlog
    - uses: test/tw/ldd-check
