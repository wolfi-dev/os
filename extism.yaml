package:
  name: extism
  version: "1.6.3"
  epoch: 21 # toolchain rebuild for  go-1.26-1.26.6
  description: The extism CLI is used to manage Extism installations
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  go-version: "1.26"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/extism/cli
      tag: v${{package.version}}
      expected-commit: ad81e44233f11f1adcd3ff35d5747802490e97b0

  - uses: bump
    with:
      deps: |-
        github.com/cloudflare/circl@v1.6.3
        github.com/ebitengine/purego@v0.8.2
        golang.org/x/crypto@v0.52.0
        golang.org/x/sys@v0.45.0

  - uses: go/build/v2
    with:
      packages: ./extism/main.go
      output: extism

update:
  enabled: true
  github:
    identifier: extism/cli
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        extism -v
        extism lib install
        extism lib versions
        extism --version
        extism --help

environment:
  contents:
    packages:
      - go-${{vars.go-version}}
