package:
  name: fastfetch
  version: "2.67.1"
  epoch: 0 # add ldd-check test
  description: A maintained, feature-rich and performance oriented, neofetch like system information tool.
  copyright:
    - license: MIT
  resources:
    memory: 7Gi

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fastfetch-cli/fastfetch
      tag: ${{package.version}}
      expected-commit: 4dd2f2d34bf80f3e66b26d3869467de88ee1ca52

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

update:
  enabled: true
  github:
    identifier: fastfetch-cli/fastfetch
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        fastfetch --help
        fastfetch --version | grep ${{package.version}}
        fastfetch
