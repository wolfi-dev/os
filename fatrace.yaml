  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: fatrace-doc
    pipeline:
      - uses: split/manpages
    description: fatrace docs
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: martinpitt/fatrace

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        fatrace --help
    - uses: test/no-docs
