package:
  name: feaxlib
  version: "0.3"
  epoch: 0
  description: SIL's preprocessor for feax, an extended OpenType feature-file syntax (provides makefea)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # The staged venv's bin/python symlinks back to the system interpreter,
      # which SCA does not follow.
      - python-${{vars.python-version}}-base
  options:
    # The staged venv bundles fonttools, ufoLib2 and attrs; do not advertise
    # them as providers that could shadow the system py3.* packages.
    no-provides: true

vars:
  # Upstream requires Python >=3.8 (pyproject.toml requires-python); 3.13 is
  # Wolfi's default python3, matching os/fontmake.yaml.
  python-version: "3.13"
  venv-home: /opt/chainguard/feaxlib

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - python-${{vars.python-version}}-dev
      - uv

# What makefea does, from upstream's own description: feax adds do/forlet/let
# and if loops, calculations, feaclass() lookups and computed anchors to Adobe
# fea syntax, extending fontTools.feaLib's parser. makefea opens a UFO with
# ufoLib2, reads anchors, advances and bounding boxes, builds mark, base,
# ligature and cursive positioning from them, merges a feax input, and writes
# plain fea that fontTools.feaLib or psfbuildfea can compile. SIL's smith
# requires it at configure time for any font built with opentype=fea(...),
# which is why font-padauk and font-abyssinica need it (OS-3498).
pipeline:
  # Upstream publishes no tags or releases; pin the main branch head.
  - uses: git-checkout
    with:
      repository: https://github.com/silnrsi/feax
      branch: main
      expected-commit: 06743ddeaf03a4880e41715c08c0da8a9c68cd81

  - uses: auth/uv
    with:
      allow-fallback-indexes: true

  - uses: uv/venv
    with:
      venv: ${{vars.venv-home}}
      python: ${{vars.python-version}}

  # uv/install cannot install from the local checkout, so resolve the
  # dependency set from pyproject.toml, install it, then install feaxlib
  # itself from source with --no-deps.
  - name: Install dependencies, then feaxlib from the checkout
    runs: |
      export VIRTUAL_ENV="${{vars.venv-home}}"
      uv pip compile --no-header --no-annotate -o /tmp/deps.txt pyproject.toml
      # --only-binary :all: is what uv/install applies by default and what the
      # other hand-rolled venvs keep (os/fontmake.yaml, os/gftools.yaml).
      # Without it uv falls back to building a dependency from an sdist when
      # no Chainguard Libraries wheel exists, so a provenance gap would pass
      # the build silently instead of failing here.
      uv pip install --no-deps --only-binary :all: -r /tmp/deps.txt
      uv pip install --no-deps .
      uv pip uninstall pip virtualenv
      uv pip check
      chmod 644 "${{vars.venv-home}}/.lock"
      mkdir -p "$(dirname "${{targets.contextdir}}${{vars.venv-home}}")"
      mv "${{vars.venv-home}}" "${{targets.contextdir}}${{vars.venv-home}}"

  - name: Verify the installed version and expose the CLI
    runs: |
      staged="${{targets.contextdir}}${{vars.venv-home}}"
      "$staged/bin/python" -c "
      from importlib.metadata import version
      v = version('feaxlib')
      assert v == '${{package.version}}', f'Expected feaxlib==${{package.version}}, got {v}'
      "
      mkdir -p "${{targets.contextdir}}/usr/bin"
      ln -sf "${{vars.venv-home}}/bin/makefea" "${{targets.contextdir}}/usr/bin/makefea"

  - uses: strip

test:
  pipeline:
    # The venv bundles fontTools, whose cp313 wheels carry compiled Cython
    # extensions (cu2qu, qu2cu, misc/bezierTools, varLib/iup, pens/momentsPen
    # and feaLib/lexer), so the apk does ship dynamically linked objects.
    - uses: test/tw/ldd-check
    - uses: test/tw/pip-check
      with:
        python: ${{vars.venv-home}}/bin/python${{vars.python-version}}
    - name: makefea expands feax over a UFO into fea that fontTools.feaLib parses
      runs: |
        mkdir -p /tmp/feax
        cd /tmp/feax || exit 1
        # Minimal UFO: bases a/b/c carry a "top" anchor and acutecomb carries
        # the matching "_top" mark anchor, so makefea has attachment data to
        # turn into mark classes.
        "${{vars.venv-home}}/bin/python" - <<'EOF'
        import ufoLib2
        from ufoLib2.objects import Anchor

        font = ufoLib2.Font()
        font.info.familyName = "FeaxTest"
        font.info.styleName = "Regular"
        font.info.unitsPerEm = 1000
        font.info.ascender = 800
        font.info.descender = -200
        font.info.xHeight = 400
        font.info.capHeight = 700

        def box(glyph, x0, y0, x1, y1):
            pen = glyph.getPen()
            pen.moveTo((x0, y0))
            pen.lineTo((x0, y1))
            pen.lineTo((x1, y1))
            pen.lineTo((x1, y0))
            pen.closePath()

        notdef = font.newGlyph(".notdef")
        notdef.width = 500
        box(notdef, 50, 0, 450, 700)
        for name, uni in (("a", 0x61), ("b", 0x62), ("c", 0x63)):
            g = font.newGlyph(name)
            g.width = 500
            g.unicodes = [uni]
            box(g, 50, 0, 450, 400)
            g.anchors.append(Anchor(x=250, y=600, name="top"))
        mark = font.newGlyph("acutecomb")
        mark.width = 0
        mark.unicodes = [0x0301]
        box(mark, -50, 450, 50, 600)
        mark.anchors.append(Anchor(x=0, y=450, name="_top"))
        font.glyphOrder = [".notdef", "a", "b", "c", "acutecomb"]
        font.save("/tmp/feax/Test.ufo", overwrite=True)
        EOF
        stat /tmp/feax/Test.ufo/glyphs/contents.plist

        # The do-for loop is feax-only syntax; makefea must unroll it into one
        # plain substitution per glyph of the class.
        cat > /tmp/feax/test.feax <<'EOF'
        @bases = [a b];

        lookup feaxloop {
            do for g = @bases; {
                sub $g by c;
            }
        } feaxloop;

        feature ccmp {
            lookup feaxloop;
        } ccmp;
        EOF

        makefea /tmp/feax/Test.ufo -i /tmp/feax/test.feax -o /tmp/feax/out.fea
        cat /tmp/feax/out.fea

        grep -F "acutecomb" /tmp/feax/out.fea
        grep -E "sub a by c;" /tmp/feax/out.fea
        grep -E "sub b by c;" /tmp/feax/out.fea
        if grep -F '$g' /tmp/feax/out.fea; then
          echo "ERROR: feax loop variable left unexpanded in out.fea"
          exit 1
        fi

        "${{vars.venv-home}}/bin/python" - /tmp/feax/out.fea <<'EOF'
        import sys
        from fontTools.feaLib import ast
        from fontTools.feaLib.parser import Parser

        doc = Parser(sys.argv[1], glyphNames={".notdef", "a", "b", "c", "acutecomb"}).parse()

        def walk(block):
            for st in block.statements:
                yield st
                if hasattr(st, "statements"):
                    yield from walk(st)

        subs = [st for st in walk(doc) if isinstance(st, ast.SingleSubstStatement)]
        pairs = sorted((st.glyphs[0].asFea(), st.replacements[0].asFea()) for st in subs)
        assert pairs == [("a", "c"), ("b", "c")], pairs
        lookups = [st.name for st in walk(doc) if isinstance(st, ast.LookupBlock)]
        assert "feaxloop" in lookups, lookups
        print("parsed", len(doc.statements), "top-level statements; substitutions:", pairs)
        EOF

update:
  enabled: false
  exclude-reason: upstream publishes no tags or releases; version tracks pyproject.toml on the main branch
