#nolint:update-disabled-reason
# Generated from https://git.alpinelinux.org/aports/plain/main/fftw/APKBUILD
package:
  name: fftw
  version: 3.3.11
  epoch: 5 # generate the codelets once, with a bytecode genfft
  description: Discrete Fourier transform (DFT) library
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "2"
    memory: 6Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - fig2dev
      - gfortran
      - glibc-2.44-dev
      - libtool
      - ocaml
      - ocaml-num
      - ocamlbuild
      - ocamlfind
      - texinfo

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/FFTW/fftw3
      tag: fftw-${{package.version}}
      expected-commit: d69d34f078baee4fa38a035634017404cce3e09a

  - name: generate codelets
    runs: |
      # genfft only runs during the build, so it is built as OCaml bytecode:
      # bytecode links without the C linker. A native genfft links OCaml's
      # static runtime against the target libc, which fails in eco-2.28
      # because apko resolves ocaml from chainguard rather than
      # chainguard-2.28 (chainguard-dev/apko#2559).
      git clone . gen
      cd gen
      ./bootstrap.sh --build=$CBUILD --host=$CHOST
      (cd genfft && ocamlbuild -classic-display -pkgs num $(ls gen_*.ml | sed 's/\.ml$/.byte/'))
      for f in genfft/gen_*.byte; do
        ln -sf "$(basename "$f")" "${f%.byte}.native"
      done
      make -j$(nproc) OCAMLBUILD=:
      git ls-files --others -z -- 'dft/*.c' 'rdft/*.c' | xargs -0 grep -l 'Generated by' > ../codelets.list

  - runs: |
      # The codelets do not depend on precision, so each precision is seeded
      # with the ones genfft wrote in gen, and GENFFTDIR points its codelet
      # rules at gen's bytecode generators. tar -m gives the codelets fresh
      # mtimes, newer than the generators, so make keeps them; were one
      # regenerated, the bytecode genfft would write the same file. Everything
      # else, including codlist.c, the SIMD stubs and FFTW3Config.cmake, is
      # built per precision.

      _precision="single double long-double"
      basedir=$(pwd)
      for i in $_precision; do
        git clone . $basedir/$i
      done

      _openmp=
      for i in $_precision; do
        case "$i" in
          single) _cf="--enable-single";;
          double) _cf="";;
          long-double) _cf="--enable-long-double";;
        esac

        case "$i--$CARCH" in
          single--x86_64 | double--x86_64)
            _cf="$_cf --enable-sse2 --enable-avx";;
          single--arm* | single--aarch64)
            _cf="$_cf --enable-neon";;
        esac

        echo "Building for $i precision ($_cf)"
        cd "$basedir"/$i
        ./bootstrap.sh \
          --build=$CBUILD \
          --host=$CHOST \
          --prefix=/usr \
          --sysconfdir=/etc \
          --mandir=/usr/share/man \
          --infodir=/usr/share/info \
          --enable-shared \
          --enable-threads \
          $_openmp \
          $_cf
        tar -C "$basedir"/gen -cf - -T "$basedir"/codelets.list | tar -xmf -
        make OCAMLBUILD=: GENFFTDIR="$basedir"/gen/genfft
      done

      for i in $_precision; do
        cd "$basedir"/$i
        make OCAMLBUILD=: GENFFTDIR="$basedir"/gen/genfft DESTDIR="${{targets.destdir}}" install
      done

  - name: remove libtool .la files
    runs: find "${{targets.destdir}}" -name '*.la' -delete

  - uses: strip

subpackages:
  - name: fftw-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - fftw
    description: fftw dev
    test:
      environment:
        contents:
          packages:
            - gcc
            - glibc-dev
            - pkgconf
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
        - uses: test/tw/header-check
          with:
            files: "fftw3.h"

  - name: fftw-doc
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
    description: fftw manpages
    test:
      pipeline:
        - uses: test/docs

  - name: fftw-single-libs
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libfftw3f*.so* "${{targets.subpkgdir}}"/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: fftw-long-double-libs
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libfftw3l*.so* "${{targets.subpkgdir}}"/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: fftw-double-libs
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libfftw3*.so* "${{targets.subpkgdir}}"/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check

update:
  github:
    identifier: FFTW/fftw3
    use-tag: true
    tag-filter-prefix: fftw-
    strip-prefix: fftw-

test:
  environment:
    contents:
      packages:
        - gcc
        - glibc-dev
        - fftw-dev
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: |
          fftw-wisdom
          fftw-wisdom-to-conf
          fftwf-wisdom
          fftwl-wisdom
    - uses: test/tw/help-check
      with:
        bins: |
          fftw-wisdom
          fftw-wisdom-to-conf
          fftwf-wisdom
          fftwl-wisdom
    - uses: test/tw/ldd-check
    - name: Functional DFT test
      runs: |
        # Create a small C program that computes a DFT and verifies the result
        tee /tmp/test_fftw.c <<'EOF'
        #include <fftw3.h>
        #include <math.h>
        #include <stdio.h>
        #include <stdlib.h>

        int main() {
            int N = 8;
            fftw_complex *in, *out;
            fftw_plan p;
            double energy_time = 0.0, energy_freq = 0.0;

            in = (fftw_complex*) fftw_malloc(sizeof(fftw_complex) * N);
            out = (fftw_complex*) fftw_malloc(sizeof(fftw_complex) * N);

            if (!in || !out) {
                fprintf(stderr, "FAIL: fftw_malloc returned NULL\n");
                return 1;
            }

            /* Set up a simple input signal */
            for (int i = 0; i < N; i++) {
                in[i][0] = (double)i;  /* real part */
                in[i][1] = 0.0;       /* imaginary part */
                energy_time += in[i][0] * in[i][0] + in[i][1] * in[i][1];
            }

            /* Create plan and execute DFT */
            p = fftw_plan_dft_1d(N, in, out, FFTW_FORWARD, FFTW_ESTIMATE);
            if (!p) {
                fprintf(stderr, "FAIL: fftw_plan_dft_1d returned NULL\n");
                return 1;
            }

            fftw_execute(p);

            /* Verify Parseval's theorem: sum|x|^2 = (1/N)*sum|X|^2 */
            for (int i = 0; i < N; i++) {
                energy_freq += out[i][0] * out[i][0] + out[i][1] * out[i][1];
            }
            energy_freq /= (double)N;

            if (fabs(energy_time - energy_freq) > 1e-10) {
                fprintf(stderr, "FAIL: Parseval's theorem violated: time=%.6f freq=%.6f\n",
                        energy_time, energy_freq);
                return 1;
            }

            printf("SUCCESS: DFT computed correctly (energy_time=%.6f, energy_freq=%.6f)\n",
                   energy_time, energy_freq);

            fftw_destroy_plan(p);
            fftw_free(in);
            fftw_free(out);

            return 0;
        }
        EOF

        # Compile and run the test
        gcc /tmp/test_fftw.c -lfftw3 -lm -o /tmp/test_fftw
        /tmp/test_fftw
    - name: Numerical check of every precision against a naive DFT
      runs: |
        cat > fftw-check.c <<'EOF'
        /* Checks one FFTW precision against a naive DFT computed in long double.
         * Build with -DPREC_F (single), -DPREC_L (long double) or neither (double). */
        #include <fftw3.h>
        #include <float.h>
        #include <math.h>
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>

        #if defined(PREC_F)
        typedef float R;
        #define X(n) fftwf_##n
        #define EPS FLT_EPSILON
        #elif defined(PREC_L)
        typedef long double R;
        #define X(n) fftwl_##n
        #define EPS LDBL_EPSILON
        #else
        typedef double R;
        #define X(n) fftw_##n
        #define EPS DBL_EPSILON
        #endif
        typedef long double LD;

        static int failures;
        static LD TWO_PI; /* 2*acosl(-1), set in main: a literal falls short of aarch64's 128-bit long double */

        static void check(const char *what, int n, LD err, LD norm) {
          LD rel = norm > 0 ? sqrtl(err / norm) : sqrtl(err);
          /* A wrong or missing codelet gives an O(1) error; rounding stays far below. */
          if (!(rel < 1000 * EPS)) {
            printf("FAIL %s n=%d rel_err=%Lg\n", what, n, rel);
            failures++;
          }
        }

        static unsigned long long rng = 0x9e3779b97f4a7c15ULL;
        static R rnd(void) {
          rng = rng * 6364136223846793005ULL + 1442695040888963407ULL;
          return (R)((LD)(rng >> 11) / (LD)(1ULL << 53) - 0.5L);
        }

        /* out[k] = sum_j in[j] * exp(sign*2*pi*i*j*k/n), with exact index reduction. */
        static void naive_dft(int n, int sign, const LD *in, LD *out) {
          LD *c = malloc(sizeof(LD) * n), *s = malloc(sizeof(LD) * n);
          for (int m = 0; m < n; m++) { c[m] = cosl(TWO_PI * m / n); s[m] = sign * sinl(TWO_PI * m / n); }
          for (int k = 0; k < n; k++) {
            LD re = 0, im = 0;
            for (int j = 0; j < n; j++) {
              int m = (int)(((long long)j * k) % n);
              re += in[2*j] * c[m] - in[2*j+1] * s[m];
              im += in[2*j] * s[m] + in[2*j+1] * c[m];
            }
            out[2*k] = re; out[2*k+1] = im;
          }
          free(c); free(s);
        }

        static void test_c2c(int n, int sign) {
          X(complex) *a = X(malloc)(sizeof(X(complex)) * n), *b = X(malloc)(sizeof(X(complex)) * n);
          LD *in = malloc(sizeof(LD) * 2 * n), *ref = malloc(sizeof(LD) * 2 * n);
          X(plan) p = X(plan_dft_1d)(n, a, b, sign, FFTW_ESTIMATE);
          for (int j = 0; j < n; j++) { a[j][0] = rnd(); a[j][1] = rnd(); in[2*j] = a[j][0]; in[2*j+1] = a[j][1]; }
          X(execute)(p);
          naive_dft(n, sign, in, ref);
          LD err = 0, norm = 0;
          for (int k = 0; k < n; k++) {
            LD dr = b[k][0] - ref[2*k], di = b[k][1] - ref[2*k+1];
            err += dr*dr + di*di; norm += ref[2*k]*ref[2*k] + ref[2*k+1]*ref[2*k+1];
          }
          check(sign == FFTW_FORWARD ? "c2c-forward" : "c2c-backward", n, err, norm);
          X(destroy_plan)(p); X(free)(a); X(free)(b); free(in); free(ref);
        }

        static void test_r2c_c2r(int n) {
          int nc = n / 2 + 1;
          R *x = X(malloc)(sizeof(R) * n), *y = X(malloc)(sizeof(R) * n);
          X(complex) *z = X(malloc)(sizeof(X(complex)) * nc);
          LD *in = malloc(sizeof(LD) * 2 * n), *ref = malloc(sizeof(LD) * 2 * n);
          X(plan) f = X(plan_dft_r2c_1d)(n, x, z, FFTW_ESTIMATE);
          X(plan) b = X(plan_dft_c2r_1d)(n, z, y, FFTW_ESTIMATE);
          for (int j = 0; j < n; j++) { x[j] = rnd(); in[2*j] = x[j]; in[2*j+1] = 0; }
          X(execute)(f);
          naive_dft(n, FFTW_FORWARD, in, ref);
          LD err = 0, norm = 0;
          for (int k = 0; k < nc; k++) {
            LD dr = z[k][0] - ref[2*k], di = z[k][1] - ref[2*k+1];
            err += dr*dr + di*di; norm += ref[2*k]*ref[2*k] + ref[2*k+1]*ref[2*k+1];
          }
          check("r2c", n, err, norm);
          X(execute)(b); /* c2r destroys z, so it runs after the r2c check */
          err = 0; norm = 0;
          for (int j = 0; j < n; j++) { LD d = y[j] / (LD)n - in[2*j]; err += d*d; norm += in[2*j]*in[2*j]; }
          check("c2r-roundtrip", n, err, norm);
          X(destroy_plan)(f); X(destroy_plan)(b); X(free)(x); X(free)(y); X(free)(z); free(in); free(ref);
        }

        /* DCT-II against its definition, then DCT-III to invert it (scale 2n). */
        static void test_r2r(int n) {
          R *x = X(malloc)(sizeof(R) * n), *y = X(malloc)(sizeof(R) * n), *w = X(malloc)(sizeof(R) * n);
          X(plan) f = X(plan_r2r_1d)(n, x, y, FFTW_REDFT10, FFTW_ESTIMATE);
          X(plan) b = X(plan_r2r_1d)(n, y, w, FFTW_REDFT01, FFTW_ESTIMATE);
          for (int j = 0; j < n; j++) x[j] = rnd();
          X(execute)(f);
          LD err = 0, norm = 0, *c = malloc(sizeof(LD) * 4 * n);
          for (int m = 0; m < 4 * n; m++) c[m] = cosl(TWO_PI * m / (4 * n));
          for (int k = 0; k < n; k++) {
            LD s = 0;
            for (int j = 0; j < n; j++) s += 2 * x[j] * c[((long long)(2 * j + 1) * k) % (4 * n)];
            err += (y[k] - s) * (y[k] - s); norm += s * s;
          }
          free(c);
          check("r2r-redft10", n, err, norm);
          X(execute)(b);
          err = 0; norm = 0;
          for (int j = 0; j < n; j++) { LD d = w[j] / (2.0L * n) - x[j]; err += d*d; norm += (LD)x[j]*x[j]; }
          check("r2r-redft01-roundtrip", n, err, norm);
          X(destroy_plan)(f); X(destroy_plan)(b); X(free)(x); X(free)(y); X(free)(w);
        }

        /* Multi-dimensional c2c against the direct sum, and r2c against the c2c result. */
        static void test_nd(int rank, const int *dims, int nthreads) {
          int n = 1, last = dims[rank-1];
          for (int d = 0; d < rank; d++) n *= dims[d];
          int nc = n / last * (last / 2 + 1);
          X(complex) *a = X(malloc)(sizeof(X(complex)) * n), *b = X(malloc)(sizeof(X(complex)) * n);
          X(complex) *z = X(malloc)(sizeof(X(complex)) * nc);
          R *x = X(malloc)(sizeof(R) * n);
          X(plan_with_nthreads)(nthreads);
          X(plan) p = X(plan_dft)(rank, dims, a, b, FFTW_FORWARD, FFTW_ESTIMATE);
          X(plan) r = X(plan_dft_r2c)(rank, dims, x, z, FFTW_ESTIMATE);
          X(plan_with_nthreads)(1);
          if (nthreads > 1) {
            /* Which solver the planner picks is its choice, not a result:
             * report it, and let the numeric comparison below decide. */
            char *s = X(sprint_plan)(p);
            if (!strstr(s, "-thr-")) printf("note: threaded plan uses no threaded solver: %s\n", s);
            free(s);
          }
          for (int j = 0; j < n; j++) { x[j] = rnd(); a[j][0] = x[j]; a[j][1] = 0; }
          X(execute)(p);
          X(execute)(r);
          LD err = 0, norm = 0;
          if (n <= 1024) {
            for (int k = 0; k < n; k++) {
              LD re = 0, im = 0;
              for (int j = 0; j < n; j++) {
                LD frac = 0;
                for (int d = rank - 1, jj = j, kk = k; d >= 0; d--) {
                  frac += (LD)(((long long)(jj % dims[d]) * (kk % dims[d])) % dims[d]) / dims[d];
                  jj /= dims[d]; kk /= dims[d];
                }
                re += x[j] * cosl(TWO_PI * frac); im -= x[j] * sinl(TWO_PI * frac);
              }
              err += (b[k][0]-re)*(b[k][0]-re) + (b[k][1]-im)*(b[k][1]-im); norm += re*re + im*im;
            }
            check(rank == 2 ? "c2c-2d" : "c2c-3d", n, err, norm);
          }
          err = 0; norm = 0;
          for (int i = 0; i < n / last; i++)
            for (int k = 0; k < last / 2 + 1; k++) {
              R *u = b[i*last + k], *v = z[i*(last/2+1) + k];
              err += (LD)(u[0]-v[0])*(u[0]-v[0]) + (LD)(u[1]-v[1])*(u[1]-v[1]); norm += (LD)u[0]*u[0] + (LD)u[1]*u[1];
            }
          check(nthreads > 1 ? "r2c-nd-vs-c2c-threads" : "r2c-nd-vs-c2c", n, err, norm);
          X(destroy_plan)(p); X(destroy_plan)(r); X(free)(a); X(free)(b); X(free)(z); X(free)(x);
        }

        int main(void) {
          static const int extra[] = {101, 128, 243, 256, 343, 512, 625, 1000, 1024, 1155, 2048, 4096};
          TWO_PI = 2 * acosl(-1.0L);
          if (!X(init_threads)()) { puts("FAIL init_threads"); return 1; }
          for (int n = 1; n <= 100; n++) { test_c2c(n, FFTW_FORWARD); test_c2c(n, FFTW_BACKWARD); test_r2c_c2r(n); test_r2r(n); }
          for (size_t i = 0; i < sizeof extra / sizeof *extra; i++) {
            test_c2c(extra[i], FFTW_FORWARD); test_c2c(extra[i], FFTW_BACKWARD); test_r2c_c2r(extra[i]); test_r2r(extra[i]);
          }
          static const int d2a[] = {16, 16}, d2b[] = {12, 15}, d2c[] = {7, 22}, d3a[] = {4, 6, 5}, d3b[] = {8, 8, 8}, d3c[] = {64, 48, 40};
          test_nd(2, d2a, 1); test_nd(2, d2b, 1); test_nd(2, d2c, 1);
          test_nd(3, d3a, 1); test_nd(3, d3b, 1);
          test_nd(3, d3c, 4);
          X(cleanup_threads)();
          if (failures) { printf("%d failures\n", failures); return 1; }
          puts("ok");
          return 0;
        }
        EOF
        for p in F D L; do
          case $p in F) l=f;; D) l=;; L) l=l;; esac
          gcc -O2 -DPREC_$p fftw-check.c -lfftw3${l}_threads -lfftw3$l -lm -o fftw-check-$p
          ./fftw-check-$p
        done
    - name: No genfft or OCaml files ship
      runs: |
        # genfft only runs during the build; none of it may reach a package.
        for p in $(apk info -q | grep '^fftw'); do apk info -qL "$p"; done > files.txt
        if grep -E 'genfft|ocaml|\.(byte|native|cm[aiotx]|cmxa|mli?)$' files.txt; then exit 1; fi
        if apk info -qR $(apk info -q | grep '^fftw') | grep -i ocaml; then exit 1; fi
