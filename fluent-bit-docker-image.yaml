#nolint:valid-pipeline-git-checkout-tag
package:
  name: fluent-bit-docker-image
  version: 20260814
  epoch: 0 # go/wolfi-rsc/fluent-bit-docker-image
  description: Fluent Bit container parsers configuration files
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 4Gi

environment:
  contents:
    packages:
      - busybox

vars:
  FLB_VERSION: "5.1.1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fluent/fluent-bit
      tag: v${{vars.FLB_VERSION}}
      expected-commit: 6315162a8d4b1ef42b038834e639697f8cb44912

  - runs: |
      mkdir -p ${{targets.destdir}}/fluent-bit-docker-image/conf
      cp conf/parsers*.conf ${{targets.destdir}}/fluent-bit-docker-image/conf/

update:
  enabled: false
  exclude-reason: |
    frozen snapshot of the Fluent Bit parsers*.conf files consumed by
    aws-for-fluent-bit; the date-based version cannot track fluent/fluent-bit
    tags, bump FLB_VERSION (and the version date) manually

test:
  pipeline:
    - name: "verify the package has the expected parsers files"
      runs: |
        stat /fluent-bit-docker-image/conf/parsers.conf
        stat /fluent-bit-docker-image/conf/parsers_extra.conf
