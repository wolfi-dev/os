package:
  name: fluent-plugin-multi-format-parser
  version: 1.1.0
  epoch: 4
  description: Multi format parser for Fluentd
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - ruby3.2-fluent-plugin-multi-format-parser=${{package.full-version}}
    runtime:
      - ruby3.2-fluentd
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - ruby-3.2
      - ruby-3.2-dev

vars:
  gem: fluent-plugin-multi-format-parser

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5e65da57cef94a423ca8b23abd21020c98fc3e83
      repository: https://github.com/repeatedly/fluent-plugin-multi-format-parser
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

test:
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: fluent/plugin/parser_multi_format

update:
  enabled: true
  github:
    identifier: repeatedly/fluent-plugin-multi-format-parser
    strip-prefix: v
    use-tag: true
