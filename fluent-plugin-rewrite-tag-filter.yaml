package:
  name: fluent-plugin-rewrite-tag-filter
  version: 2.4.0
  epoch: 7
  description: Fluentd Output filter plugin to rewrite tags that matches specified attribute.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - ruby3.2-fluent-plugin-rewrite-tag-filter=${{package.full-version}}
    runtime:
      - ruby3.2-fluent-config-regexp-type
      - ruby3.2-fluentd

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-3.2
      - ruby-3.2-dev

vars:
  gem: fluent-plugin-rewrite-tag-filter

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a19c7f488aeb7ddc5941b7280c74ac799d12ca3b
      repository: https://github.com/fluent/fluent-plugin-rewrite-tag-filter
      tag: v${{package.version}}

  - uses: ruby/unlock-spec

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

update:
  enabled: true
  github:
    identifier: fluent/fluent-plugin-rewrite-tag-filter
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ruby3.2-fluentd
  pipeline:
    - name: Test rewrite tag filter plugin class loading
      runs: |
        ruby <<'EOF'
        require 'fluent/plugin/out_rewrite_tag_filter'

        # Verify the output plugin class exists and is a Fluentd Output
        klass = Fluent::Plugin::RewriteTagFilterOutput
        raise 'RewriteTagFilterOutput class not defined' unless defined?(klass)
        raise 'Not a Fluent::Plugin::Output subclass' unless klass < Fluent::Plugin::Output

        puts 'fluent-plugin-rewrite-tag-filter: OK'
        EOF
