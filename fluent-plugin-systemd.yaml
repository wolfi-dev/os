package:
  name: fluent-plugin-systemd
  version: "1.1.2"
  epoch: 0 # go/wolfi-rsc/fluent-plugin-systemd
  description: This is a fluentd input plugin. It reads logs from the systemd journal.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - ruby3.2-fluent-plugin-systemd=${{package.full-version}}
    runtime:
      - ruby3.2-fluentd
      - ruby3.2-systemd-journal
  resources:
    cpu: "1"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - ruby-3.2
      - ruby-3.2-dev
      - systemd-dev

vars:
  gem: fluent-plugin-systemd

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 38bac8bd51eb8d2a8a570b1a6dd9cdbdbb62454c
      repository: https://github.com/fluent-plugins-nursery/fluent-plugin-systemd
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        ruby -e "require 'fluent/plugin/in_systemd'"
        ruby -e "require 'fluent/plugin/filter_systemd_entry'"
        ruby -e "require 'fluent/plugin/systemd/entry_mutator'"

update:
  enabled: true
  github:
    identifier: fluent-plugins-nursery/fluent-plugin-systemd
    strip-prefix: v
    use-tag: true
