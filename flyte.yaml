package:
  name: flyte
  version: "1.16.9"
  epoch: 0 # CVE-2026-81870
  description: Scalable and flexible workflow orchestration platform that seamlessly unifies data, ML and analytics stacks.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - go-1.27
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/flyteorg/flyte
      tag: v${{package.version}}
      expected-commit: b2be54c1a045c7244d8d7f2b27ab5c3aacd9bf72

  # Pin otelgrpc at v0.60.0 BEFORE the otel v1.45.0 bump pulls it to v0.61.0.
  # otelgrpc v0.61.0 removed UnaryClientInterceptor and UnaryServerInterceptor which
  # flyte v1.16.8 still calls; the replace directive must be in go.mod before the
  # otel bump so omnibump validates against v0.60.0 rather than the post-bump v0.61.0.
  - uses: bump
    with:
      modroot: |-
        boilerplate/flyte/golang_support_tools
        datacatalog
        docker/sandbox-bundled/bootstrap
        flyteadmin
        flytecopilot
        flytectl
        flyteidl
        flyteplugins
        flytepropeller
        flytestdlib
        .
      replaces: go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc=go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.60.0

  - uses: bump
    with:
      modroot: |-
        boilerplate/flyte/golang_support_tools
        datacatalog
        docker/sandbox-bundled/bootstrap
        flyteadmin
        flytecopilot
        flytectl
        flyteidl
        flyteplugins
        flytepropeller
        flytestdlib
        .
      deps: |-
        go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.60.0
        go.opentelemetry.io/otel@v1.45.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
        go.opentelemetry.io/otel/exporters/stdout/stdouttrace@v1.45.0
        go.opentelemetry.io/otel/metric@v1.45.0
        go.opentelemetry.io/otel/sdk@v1.45.0
        go.opentelemetry.io/otel/sdk/metric@v1.45.0
        go.opentelemetry.io/otel/trace@v1.45.0
        golang.org/x/crypto@v0.54.0
        golang.org/x/net@v0.57.0
        google.golang.org/grpc@v1.83.0
        golang.org/x/text@v0.40.0
      # upstream calls otelgrpc.UnaryServerInterceptor and otelgrpc.UnaryClientInterceptor
      # (removed in v0.61.0); hold the last version that has them
      replaces: go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc=go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.60.0

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd
      output: flyte
      go-package: go-1.27

update:
  enabled: true
  github:
    identifier: flyteorg/flyte
    strip-prefix: v
  ignore-regex-patterns:
    - flytectl/.* # Not relevant tags
    # v2 is a different product branch that may need to be package separately
    - ^2

test:
  pipeline:
    - runs: |
        flyte --help
