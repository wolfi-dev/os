package:
  name: font-abyssinica
  version: "2.300"
  epoch: 3 # go/wolfi-rsc/font-abyssinica
  description: A font for the Ethiopic script
  copyright:
    - license: OFL-1.0
  resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      # SIL's own build toolchain. smith drives the whole build and resolves
      # the rest from PATH: psf* from pysilfont, makefea from feaxlib,
      # ttftable and typetuner from perl-font-ttf-scripts, the fonttools CLI
      # from py3.13-fonttools-bin, and grcompiler through its own dependency.
      - feaxlib
      - fontmake
      - gftools
      - perl-font-ttf-scripts
      - py3.13-fonttools-bin
      - pysilfont
      - smith
      - ttfautohint

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/silnrsi/font-abyssinica
      expected-commit: 037d134469bc989367aac8fd1bea7216e1a3326b
      tag: v${{package.version}}

  # Built from the UFO masters under source/ rather than installing the
  # prebuilt references/*.ttf the repository carries. Those references are
  # Abyssinica 2.201, so until now this package declared 2.300 and shipped
  # 2.201.
  #
  # --release, not -r. smith's getversion() treats both as a release build and
  # returns an empty build label for either, but -r is also a wscript option
  # that font projects claim through preprocess_args to mean something of
  # their own, so passing it can change which instances get built. --release
  # is never consumed there. Without one of them the name table reads
  # "Version 2.300; dev-037d13" instead of "Version 2.300".
  #
  # The result is byte-for-byte identical to AbyssinicaSIL-2.300.zip, which
  # SIL publishes for this tag, in every table; the file as a whole differs
  # only in the head checksum and timestamp and in 30 four-byte UI metadata
  # fields, where current feaLib writes 0xFFFF for an absent cvXX tooltip or
  # sample-text name ID and the older one wrote 0.
  #
  # No Graphite tables: this font's wscript has no graphite stanza, only an
  # archived source/archive/graphite/main.gdl, and SIL's own 2.300 release
  # carries no Silf/Glat/Gloc/Feat/Sill either. The references/*.ttf do, being
  # 2.201.
  - name: Build the font from source with smith
    runs: |
      smith configure --release
      smith build --release

  - name: Install the built font
    runs: |
      install -D -m644 results/AbyssinicaSIL-Regular.ttf \
        "${{targets.destdir}}"/usr/share/fonts/abyssinica/AbyssinicaSIL-Regular.ttf

update:
  enabled: true
  github:
    identifier: silnrsi/font-abyssinica
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - harfbuzz-utils
        - py3.13-fonttools-bin
        - python-3.13
  pipeline:
    - uses: test/fonts
    - name: The installed font is the one we built, not a reference binary
      runs: |
        ttf=/usr/share/fonts/abyssinica/AbyssinicaSIL-Regular.ttf
        test -s "$ttf"
        python3.13 - "$ttf" <<'EOF'
        import sys
        from fontTools.ttLib import TTFont

        font = TTFont(sys.argv[1])
        name = font["name"].getDebugName(5)
        print("version:", name)
        # A build label here means the recipe lost --release and the font no
        # longer matches what SIL publishes for this tag.
        assert name == "Version 2.300", name

        # The 2.201 references/ binaries carry Graphite and 1054 glyphs; the
        # 2.300 sources produce 1074 and no Graphite. Both halves have to hold
        # or we are installing the wrong file.
        assert font["maxp"].numGlyphs == 1074, font["maxp"].numGlyphs
        graphite = [t for t in ("Silf", "Glat", "Gloc", "Feat", "Sill") if t in font]
        assert graphite == [], graphite

        tables = set(font.keys()) - {"GlyphOrder"}
        for required in ("GDEF", "GPOS", "GSUB", "cmap", "glyf", "head", "name"):
            assert required in tables, sorted(tables)

        cmap = font.getBestCmap()
        assert len(cmap) == 862, len(cmap)
        # Ethiopic coverage is the whole point of the font.
        for codepoint in (0x1200, 0x1208, 0x12A0, 0x1380, 0x2D80):
            assert codepoint in cmap, hex(codepoint)

        gsub = {r.FeatureTag for r in font["GSUB"].table.FeatureList.FeatureRecord}
        gpos = {r.FeatureTag for r in font["GPOS"].table.FeatureList.FeatureRecord}
        print("GSUB", len(gsub), "GPOS", sorted(gpos))
        assert len(gsub) == 32, sorted(gsub)
        assert {"mark", "mkmk"} <= gpos, sorted(gpos)
        EOF
    # Codepoints rather than literal text: the shell mangles Ethiopic in a
    # $'...' literal, which silently turns these into tests of U+0024.
    - name: HarfBuzz shapes Ethiopic with mark positioning
      runs: |
        ttf=/usr/share/fonts/abyssinica/AbyssinicaSIL-Regular.ttf

        # A plain base syllable is one glyph with a real advance.
        out=$(hb-shape --unicodes 1208 "$ttf")
        echo "base: $out"
        test "$out" = "[uni1208=0+1159]"

        # U+1208 U+135F. The combining gemination mark carries no advance and
        # GPOS has to place it; without the mark feature it would come back
        # at @0,0.
        out=$(hb-shape --unicodes 1208,135F "$ttf")
        echo "base + gemination mark: $out"
        test "$out" = "[uni1208=0+1159|uni135F=0@-73,-54+0]"
