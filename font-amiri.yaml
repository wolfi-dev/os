package:
  name: font-amiri
  version: "1.003"
  epoch: 2
  description: Amiri (أميري) is a body text Naskh typeface
  copyright:
    - license: OFL-1.1
  resources:
    cpu: "4"
    memory: 4Gi

vars:
  python-version: "3.13"
  venv: /home/build/venv

environment:
  contents:
    packages:
      - build-base
      - busybox
      - make
      - python-${{vars.python-version}}
      - python-${{vars.python-version}}-dev
      - uv

# Built from the Glyphs/UFO sources with upstream's Makefile and scripts
# (glyphs2ufo, scripts/build.py on ufo2ft, scripts/mkquran.py) instead of
# installing the prebuilt fonts/*.ttf. The build needs the fontmake stack plus
# pcpp (feature-file preprocessing), glyphsets 0.6 (the last release with the
# GFGlyphData API build.py imports) and skia-pathops (build.py selects the
# pathops overlap backend), so it uses its own venv from Chainguard Libraries.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aliftype/amiri
      expected-commit: 480bb746e99ea700bb0d6b4dbf96302d58192103
      tag: ${{package.version}}

  - uses: auth/uv
    with:
      allow-fallback-indexes: true

  - uses: uv/venv
    with:
      venv: ${{vars.venv}}
      python: ${{vars.python-version}}

  - name: Install the font build tools
    runs: |
      . ${{vars.venv}}/bin/activate
      # The Makefile calls glyphs2ufo (glyphsLib) and scripts/build.py (ufo2ft,
      # ufoLib2, pcpp, glyphsets); fontmake itself is not used. Pin the
      # output-defining packages to the versions that reproduce upstream's
      # fonts bit for bit (upstream's own requirements.txt pins a 2023 stack
      # that no longer installs on Python 3.13), resolve the rest, and drop
      # cffsubr: ufo2ft only needs it for CFF output, and its wheel bundles a
      # prebuilt AFDKO tx. Everything installs as a Libraries-built wheel
      # except ufo2ft (pure Python, only on the fallback index; built from its
      # sdist like os/fontmake.yaml does) and skia-pathops, which has no wheel
      # there and is built from its sdist (it bundles the Skia path-ops
      # sources). skia-pathops' build_skia.py fetches
      # a prebuilt `gn` for the host architecture from Chromium's CIPD and
      # pip-installs a ninja wheel into an inner virtualenv; both are build
      # tools only, the path-ops library and the fonts are compiled here.
      cat > /tmp/requirements.in <<'REQ'
      glyphsLib==6.15.0
      ufo2ft==3.9.0
      ufoLib2==0.18.1
      fonttools[lxml,ufo,unicode]==4.66.0
      pcpp==1.30
      glyphsets==0.6.4
      skia-pathops==0.9.2
      REQ
      uv pip compile --no-header --no-annotate -o /tmp/deps.txt /tmp/requirements.in
      grep -v '^cffsubr==' /tmp/deps.txt > /tmp/deps-rest.txt
      uv pip install --no-deps --only-binary :all: --no-binary skia-pathops --no-binary ufo2ft -r /tmp/deps-rest.txt
      uv pip list

  - name: Build the six faces
    runs: |
      . ${{vars.venv}}/bin/activate
      # The Makefile takes the version from `git describe`; the checkout has
      # the tag, but say it explicitly so a shallow clone cannot change it.
      rm -f fonts/*.ttf
      make ttf PY=python VERSION=${{package.version}} TAG=${{package.version}}
      test "$(ls fonts/*.ttf | wc -l)" -eq 6

  - runs: |
      pkgname=${{package.name}}
      install -D -m644 fonts/*.ttf -t "${{targets.destdir}}"/usr/share/fonts/${pkgname#font-}

update:
  enabled: true
  github:
    identifier: aliftype/amiri

test:
  environment:
    contents:
      packages:
        - fontconfig
        - harfbuzz-utils
        - py${{vars.python-version}}-fonttools
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/fonts
    - name: The six faces match upstream's build and shape Arabic
      runs: |
        set -u
        cd /usr/share/fonts/amiri
        python${{vars.python-version}} - <<'EOF'
        import subprocess

        from fontTools.ttLib import TTFont

        # (glyph count, family) of upstream's own build of this tag
        faces = {
            "Amiri-Regular": (6710, "Amiri"), "Amiri-Bold": (6551, "Amiri"),
            "Amiri-Italic": (6705, "Amiri"), "Amiri-BoldItalic": (6555, "Amiri"),
            "AmiriQuran": (1446, "Amiri Quran"), "AmiriQuranColored": (1981, "Amiri Quran Colored"),
        }

        def shape(path, text):
            out = subprocess.run(["hb-shape", "--no-glyph-names", "--no-positions", "--no-clusters", path, text],
                                 check=True, capture_output=True, text=True).stdout.strip()
            return [tok for tok in out.strip("[]").split("|") if tok]

        for name, (count, family) in faces.items():
            path = name + ".ttf"
            f = TTFont(path)
            assert f["maxp"].numGlyphs == count, (path, f["maxp"].numGlyphs, count)
            assert f["name"].getDebugName(1) == family, (path, f["name"].getDebugName(1))
            assert f["name"].getDebugName(5) == "Version ${{package.version}}", (path, f["name"].getDebugName(5))
            gsub = {r.FeatureTag for r in f["GSUB"].table.FeatureList.FeatureRecord}
            gpos = {r.FeatureTag for r in f["GPOS"].table.FeatureList.FeatureRecord}
            assert {"init", "medi", "fina", "rlig", "ccmp"} <= gsub, (path, gsub)
            assert {"mark", "mkmk", "curs", "kern"} <= gpos, (path, gpos)
            # Naskh: the letters of بسم take initial/medial/final forms, so the
            # shaped glyphs differ from the isolated forms, and none is .notdef.
            joined = shape(path, "بسم")
            isolated = [shape(path, ch)[0] for ch in "بسم"]
            assert "0" not in joined and len(joined) == 3 and joined != isolated, (path, joined, isolated)
            unmapped = next(chr(cp) for cp in range(0xE000, 0xF900) if cp not in f.getBestCmap())
            assert shape(path, unmapped) == ["0"], (path, "the .notdef check cannot fail", shape(path, unmapped))
        for name in ("Amiri-Regular", "Amiri-Bold", "Amiri-Italic", "Amiri-BoldItalic"):
            assert "0" not in shape(name + ".ttf", "The quick brown fox"), name
        # the Quran faces carry the coloured pause marks (COLR/CPAL) in the Colored variant only
        assert "COLR" in TTFont("AmiriQuranColored.ttf") and "COLR" not in TTFont("AmiriQuran.ttf")
        print("6 faces: upstream glyph counts, Arabic shaping, marks and colour tables as expected")
        EOF
        fc-cache -f
        fc-list | grep -F "Amiri Quran Colored"
