# license doubt
package:
  name: font-bitstream-vera
  version: 1.10
  epoch: 3
  description: bitstream-vera fonts
  copyright:
    - license: OFL-1.1
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: fetch
    with:
      expected-sha256: db5b27df7bbb318036ebdb75acd3e98f1bd6eb6608fb70a67d478cd243d178dc
      uri: https://download.gnome.org/sources/ttf-bitstream-vera/${{package.version}}/ttf-bitstream-vera-${{package.version}}.tar.bz2

  - runs: |
      pkgname=${{package.name}}
      destfontdir="${{targets.destdir}}/usr/share/fonts/${pkgname#font-}"
      mkdir -p "$destfontdir"
      install -Dm644 ./*.ttf "$destfontdir/"

update:
  enabled: false
  exclude-reason: No releases or tags; upstream tarball from download.gnome.org has not been updated in over a decade.

test:
  pipeline:
    - uses: test/fonts
