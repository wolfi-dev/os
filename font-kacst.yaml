package:
  name: font-kacst
  version: 2.01
  epoch: 3 # go/wolfi-rsc/font-kacst
  description: KACST fonts
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    provides:
      - fonts-kacst=${{package.full-version}}
  resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: fetch
    with:
      expected-sha256: 6f2899ce9622314ea426cf8d48849f1cf17302726d73cb683486d5fdf2a23338
      uri: https://ftp.debian.org/debian/pool/main/f/fonts-kacst/fonts-kacst_${{package.version}}+mry.orig.tar.bz2

  - runs: |
      for f in ./kacst/*.ttf; do
        install -Dm644 "$f" "${{targets.destdir}}/usr/share/fonts/truetype/kacst/$(basename "$f")"
      done

update:
  enabled: false
  exclude-reason: No releases or tags; upstream distributes only via Debian source tarballs

test:
  pipeline:
    - uses: test/fonts
