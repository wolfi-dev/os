# Generated from https://git.alpinelinux.org/aports/plain/main/font-liberation/APKBUILD
package:
  name: font-liberation
  version: 2.1.5
  epoch: 6
  description: Fonts to replace commonly used Microsoft Windows fonts
  copyright:
    - license: OFL-1.1
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  python-version: "3.13"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - fontconfig
      - fontforge
      - py${{vars.python-version}}-fonttools
      - python-${{vars.python-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/liberationfonts/liberation-fonts
      tag: ${{package.version}}
      expected-commit: 4b0192046158094654e865245832c66d2104219e

  - uses: autoconf/make

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/fonts/${{package.name}} \
        ${{targets.destdir}}/etc/fonts/conf.avail \
        ${{targets.destdir}}/etc/fonts/conf.d

      install -D -m644 liberation-fonts-ttf-${{package.version}}/*.ttf -t ${{targets.destdir}}/usr/share/fonts/${{package.name}}/

      for i in $(find . -name '*.conf'); do
        install -D -m644 "$i" -t ${{targets.destdir}}/etc/fonts/conf.avail/
        name=$(basename "$i")
        ln -sf /etc/fonts/conf.avail/$name ${{targets.destdir}}/etc/fonts/conf.d/$name
      done

  - uses: strip

update:
  enabled: true
  github:
    identifier: liberationfonts/liberation-fonts

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-fonttools
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/fonts
    - name: LiberationMono keeps its monospace cell and zero-width marks
      runs: |
        set -u
        cd /usr/share/fonts/font-liberation
        python${{vars.python-version}} - <<'EOF'
        from fontTools.ttLib import TTFont

        # LiberationMono is fixed-pitch: every drawn glyph advances 1229 units
        # and every combining mark 0. FontForge 20251009 without the #5702 fix
        # wrote a four-entry hmtx for such a font, and every mark then advanced
        # 1229 with it; r5 shipped exactly that. Each of the four Mono sources
        # at upstream tag 2.1.5 has 267 "Width: 0" glyphs, and the upstream
        # release ttfs have 267 advance-0 glyphs, so this is what matching
        # upstream looks like.
        #
        # hmtx is read directly because HarfBuzz zeroes the advance of a GDEF
        # mark after positioning whatever hmtx said, so shaping cannot see this
        # bug; only renderers that read hmtx themselves can.
        for name in ("Regular", "Bold", "Italic", "BoldItalic"):
            path = f"LiberationMono-{name}.ttf"
            font = TTFont(path)
            metrics = font["hmtx"].metrics
            cmap = font.getBestCmap()
            # The broken build collapsed hmtx to four entries.
            assert font["hhea"].numberOfHMetrics > 4, (path, font["hhea"].numberOfHMetrics)
            zero = sum(1 for g in metrics if metrics[g][0] == 0)
            assert zero == 267, (path, "zero-advance glyphs", zero)
            assert metrics[cmap[0x41]][0] == 1229, (path, "A", metrics[cmap[0x41]])
            for cp in (0xFE20, 0x0301):
                assert metrics[cmap[cp]][0] == 0, (path, hex(cp), metrics[cmap[cp]])
        print("LiberationMono: 4 faces, 267 zero-advance marks each, cell 1229")
        EOF
