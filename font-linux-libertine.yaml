package:
  name: font-linux-libertine
  version: 5.3.0
  epoch: 3
  description: Serif (Libertine) and Sans Serif (Biolinum) OpenType fonts with large Unicode coverage
  copyright:
    - license: GPL-2.0-or-later WITH Font-exception-2.0 AND OFL-1.0
  resources:
    cpu: "2"
    memory: 2Gi

vars:
  python-version: "3.13"

environment:
  contents:
    packages:
      - busybox
      - fontforge
      - ttfautohint

# Built from the FontForge sources (LinLibertineSRC, the .sfd files) instead
# of installing the LinLibertineTTF release archive. The sources are the
# OpenType-flavoured masters ("Linux Libertine O", 1000 units/em); upstream's
# TTF release (whose build script is not part of the source archive) renames
# the faces to the "Linux Libertine" family, scales them to 2048 units/em,
# generates TrueType and runs ttfautohint (the "ah" file-name suffix), except
# for the Initials face, which stays unhinted. The names below are the ones
# the 5.3.0 release ships, including its LinLibertineI PostScript name shared
# by the Italic and the Initials.
pipeline:
  - uses: fetch
    with:
      expected-sha256: 1bec4360a26f1cf333c2792d920f5ca4d4eff44f5de501600e345eb8a1f9ec74
      uri: https://downloads.sourceforge.net/project/linuxlibertine/linuxlibertine/${{package.version}}/LinLibertineSRC_${{package.version}}_2012_07_02.tgz
      strip-components: 0

  - name: Generate and autohint the 13 TrueType faces
    runs: |
      mkdir -p raw ttf
      while IFS='|' read -r sfd fontname family fullname out; do
        fontforge -lang=ff -c 'Open($1); SetFontNames($2, $3, $4); ScaleToEm(2048); Generate($5)' \
          "$sfd.sfd" "$fontname" "$family" "$fullname" "raw/$out.ttf"
        case "$out" in
          *ah) ttfautohint "raw/$out.ttf" "ttf/$out.ttf" ;;
          *) cp "raw/$out.ttf" "ttf/$out.ttf" ;;
        esac
      done <<'TABLE'
      LinBiolinum_K|LinBiolinumK|Linux Biolinum Keyboard|Linux Biolinum Keyboard|LinBiolinum_Kah
      LinBiolinum_R|LinBiolinum|Linux Biolinum|Linux Biolinum|LinBiolinum_Rah
      LinBiolinum_RB|LinBiolinumB|Linux Biolinum|Linux Biolinum Bold|LinBiolinum_RBah
      LinBiolinum_RI|LinBiolinumI|Linux Biolinum|Linux Biolinum Italic|LinBiolinum_RIah
      LinLibertine_DR|LinLibertineDisplay|Linux Libertine Display|Linux Libertine Display|LinLibertine_DRah
      LinLibertine_I|LinLibertineI|Linux Libertine Initials|Linux Libertine Initials|LinLibertine_I
      LinLibertine_M|LinLibertine_M|Linux Libertine Mono|Linux Libertine Mono|LinLibertine_Mah
      LinLibertine_R|LinLibertine|Linux Libertine|Linux Libertine|LinLibertine_Rah
      LinLibertine_RB|LinLibertineB|Linux Libertine|Linux Libertine Bold|LinLibertine_RBah
      LinLibertine_RBI|LinLibertineBI|Linux Libertine|Linux Libertine Bold Italic|LinLibertine_RBIah
      LinLibertine_RI|LinLibertineI|Linux Libertine|Linux Libertine Italic|LinLibertine_RIah
      LinLibertine_RZ|LinLibertineZ|Linux Libertine|Linux Libertine Semibold|LinLibertine_RZah
      LinLibertine_RZI|LinLibertineZI|Linux Libertine|Linux Libertine Semibold Italic|LinLibertine_RZIah
      TABLE
      test "$(ls ttf/*.ttf | wc -l)" -eq 13

  - runs: |
      pkgname=${{package.name}}
      install -Dm644 ttf/*.ttf -t "${{targets.destdir}}"/usr/share/fonts/${pkgname#font-}

# couldn't find it in release-monitoring.org
update:
  enabled: true
  release-monitor:
    identifier: 1826

test:
  environment:
    contents:
      packages:
        - fontconfig
        - harfbuzz-utils
        - py${{vars.python-version}}-fonttools
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/fonts
    - name: The 13 faces match the 5.3.0 release in names, metrics and coverage
      runs: |
        set -u
        cd /usr/share/fonts/linux-libertine
        python${{vars.python-version}} - <<'EOF'
        import glob
        import subprocess

        from fontTools.ttLib import TTFont

        # (glyph count, family, PostScript name, hinted) of the 5.3.0 release.
        faces = {
            "LinBiolinum_Kah": (687, "Linux Biolinum Keyboard", "LinBiolinumK", True),
            "LinBiolinum_Rah": (2403, "Linux Biolinum", "LinBiolinum", True),
            "LinBiolinum_RBah": (2543, "Linux Biolinum", "LinBiolinumB", True),
            "LinBiolinum_RIah": (2424, "Linux Biolinum", "LinBiolinumI", True),
            "LinLibertine_DRah": (2242, "Linux Libertine Display", "LinLibertineDisplay", True),
            "LinLibertine_I": (280, "Linux Libertine Initials", "LinLibertineI", False),
            "LinLibertine_Mah": (1021, "Linux Libertine Mono", "LinLibertine_M", True),
            "LinLibertine_Rah": (2676, "Linux Libertine", "LinLibertine", True),
            "LinLibertine_RBah": (2394, "Linux Libertine", "LinLibertineB", True),
            "LinLibertine_RBIah": (1713, "Linux Libertine", "LinLibertineBI", True),
            "LinLibertine_RIah": (2345, "Linux Libertine", "LinLibertineI", True),
            "LinLibertine_RZah": (2299, "Linux Libertine", "LinLibertineZ", True),
            "LinLibertine_RZIah": (2317, "Linux Libertine", "LinLibertineZI", True),
        }
        assert sorted(glob.glob("*.ttf")) == sorted(n + ".ttf" for n in faces), sorted(glob.glob("*.ttf"))

        def notdef(path, text):
            out = subprocess.run(["hb-shape", "--no-glyph-names", "--no-positions", "--no-clusters", path, text],
                                 check=True, capture_output=True, text=True).stdout.strip()
            return out, any(tok in ("0", "gid0") for tok in out.replace("[", "|").replace("]", "|").split("|"))

        for name, (count, family, psname, hinted) in faces.items():
            path = name + ".ttf"
            f = TTFont(path)
            assert f["maxp"].numGlyphs == count, (path, f["maxp"].numGlyphs, count)
            assert f["name"].getDebugName(1) == family, (path, f["name"].getDebugName(1))
            assert f["name"].getDebugName(6) == psname, (path, f["name"].getDebugName(6))
            # The release is scaled to 2048 units/em (the sources are 1000).
            assert f["head"].unitsPerEm == 2048, (path, f["head"].unitsPerEm)
            for table in ("glyf", "GSUB", "GPOS"):
                assert table in f, (path, table)
            # ttfautohint leaves its mark in the version string (the Initials
            # are the one face the release did not autohint).
            assert ("ttfautohint" in f["name"].getDebugName(5)) == hinted, (path, f["name"].getDebugName(5))
            assert "fpgm" in f, (path, "no TrueType instructions")
            # Coverage differs per face: the Initials are capitals only, the
            # Keyboard and Mono faces are Latin only, Bold Italic has no Cyrillic.
            samples = {"LinLibertine_I": ("ABC",), "LinBiolinum_Kah": ("The quick brown fox",),
                       "LinLibertine_Mah": ("The quick brown fox",),
                       "LinLibertine_RBIah": ("The quick brown fox", "Ταχίστη αλώπηξ")}.get(
                name, ("The quick brown fox", "Ταχίστη αλώπηξ", "Съешь ещё"))
            for text in samples:
                out, hit = notdef(path, text)
                assert not hit, (path, text, out)
            unmapped = next(chr(cp) for cp in range(0xE000, 0xF900) if cp not in f.getBestCmap())
            out, hit = notdef(path, unmapped)
            assert hit, (path, "the .notdef check cannot fail", out)
        # Libertine Regular carries the MATH table and the ligatures the family is known for.
        f = TTFont("LinLibertine_Rah.ttf")
        assert "MATH" in f
        assert "liga" in {r.FeatureTag for r in f["GSUB"].table.FeatureList.FeatureRecord}
        out, _ = notdef("LinLibertine_Rah.ttf", "ffi")
        assert out.count("|") == 0, ("ffi did not form a ligature", out)
        print(f"{len(faces)} faces: release names, glyph counts, em size, hinting and coverage as expected")
        EOF
        fc-cache -f
        fc-list | grep -F "Linux Libertine:style=Semibold Italic"
        fc-list | grep -F "Linux Biolinum Keyboard"
