package:
  name: font-lklug
  version: 0.6.4
  epoch: 5
  description: fonts-lklug
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"

var-transforms:
  - from: ${{package.version}}
    match: \.(\d+)$
    replace: -$1
    to: mangled-package-version

vars:
  python-version: "3.13"

environment:
  contents:
    packages:
      - busybox
      - fontforge

# Built from lklug.sfd with upstream's own convert.ff, the way Fedora builds
# it. The repository also carries a lklug.ttf generated by FontForge in 2005;
# it is newer than the .sfd, so `make` would keep it, and it claims
# lsb == xMin in its head flags while 411 of its 511 glyphs disagree (by up
# to 48 units), which shifts those glyphs when a renderer trusts the flag. The
# .sfd build has the same outlines and advances and consistent sidebearings.
pipeline:
  - uses: git-checkout
    with:
      repository: https://salsa.debian.org/fonts-team/fonts-lklug-sinhala
      tag: debian/${{vars.mangled-package-version}}
      expected-commit: e059baf13cf556c98d83aeadd209083492fc5e8e

  - name: Build lklug.ttf from the FontForge source
    runs: |
      rm -f lklug.ttf
      fontforge -lang=ff -script convert.ff lklug
      test -s lklug.ttf

  - runs: |
      install -D -m644 lklug.ttf "${{targets.destdir}}"/usr/share/fonts/lklug.ttf

update:
  enabled: false
  exclude-reason: No source to watch for the new versions

test:
  environment:
    contents:
      packages:
        - harfbuzz-utils
        - py${{vars.python-version}}-fonttools
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/fonts
    - name: The font is the 0.6 Sinhala design with consistent metrics
      runs: |
        set -u
        python${{vars.python-version}} - <<'EOF'
        import subprocess

        from fontTools.ttLib import TTFont

        path = "/usr/share/fonts/lklug.ttf"
        f = TTFont(path)
        assert f["name"].getDebugName(5).startswith("Version 0.6"), f["name"].getDebugName(5)
        cmap = f.getBestCmap()
        assert 0x0D85 in cmap and 0x0DA9 in cmap, "Sinhala letters not mapped"
        # A FontForge build sets head flag 1 (lsb == xMin) and honours it;
        # the 2005 binary this replaces did not.
        assert f["head"].flags & 2
        glyf = f["glyf"]
        for name in f.getGlyphOrder():
            g = glyf[name]
            if g.numberOfContours:
                g.recalcBounds(glyf)
                assert f["hmtx"][name][1] == g.xMin, (name, f["hmtx"][name][1], g.xMin)
        def notdef(text):
            out = subprocess.run(["hb-shape", "--no-glyph-names", "--no-positions", "--no-clusters", path, text],
                                 check=True, capture_output=True, text=True).stdout.strip()
            return out, any(tok in ("0", "gid0") for tok in out.replace("[", "|").replace("]", "|").split("|"))
        unmapped = next(chr(cp) for cp in range(0xE000, 0xF900) if cp not in cmap)
        out, hit = notdef(unmapped)
        assert hit, ("the .notdef check cannot fail", out)
        out, hit = notdef("ශ්‍රී ලංකා")
        assert not hit, ("Sinhala sample shapes to .notdef", out)
        print(f"{path}: {f['maxp'].numGlyphs} glyphs, sidebearings consistent, Sinhala shapes")
        EOF
