package:
  name: font-lohit-beng-bengali
  version: 2.91.5
  epoch: 3 # pin the source checkout instead of fetching a moving master.zip
  description: This package provides Lohit TrueType font for Bengali language which is primarily used in Indian state of Bengal.
  copyright:
    - license: OFL-1.1

vars:
  python-version: "3.13"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-fontforge
      - ttfautohint

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pravins/lohit
      # Upstream never tagged this Bengali-script release; pin the master
      # commit the fonts are generated from (they are built from the .sfd
      # sources below, not taken prebuilt).
      branch: master
      expected-commit: 7a8b554983e6c41d4104bd9f8f7e423e8bfe31fa

  - uses: patch
    with:
      # The patches were written against the master.zip layout (lohit-master/…).
      strip-components: 2
      patches: |
        fix-appstream-metainfo.patch
        fix-devanagari-family-name.patch

  - runs: |
      make ttf

  - runs: |
      pkgname=${{package.name}}
      mkdir -p ${{targets.destdir}}/usr/share/fonts/${pkgname#font-}/
      install -Dm644 bengali/Lohit-Bengali.ttf -t ${{targets.destdir}}/usr/share/fonts/${pkgname#font-}

      mkdir -p ${{targets.destdir}}/etc/fonts/conf.avail
      install -Dm644 bengali/66-lohit-bengali.conf -t ${{targets.destdir}}/etc/fonts/conf.avail

update:
  enabled: false
  exclude-reason: The project seems to be inactive

test:
  pipeline:
    - uses: test/fonts
