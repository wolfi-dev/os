package:
  name: font-lohit-beng-extra
  version: 3.6.0
  epoch: 0
  description: This package provides TrueType fonts for Bengali language which is primarily spoken in the Indian state of West Bengal, Assam, Tripura and in the country Bangladesh.
  copyright:
    - license: GPL-2.0-or-later AND GPL-2.0-or-later WITH Font-exception-2.0 AND GPL-3.0-or-later WITH Font-exception-2.0

environment:
  contents:
    packages:
      - busybox
      - fontforge

vars:
  REVISION: 1

# Every font is built from its FontForge .sfd source with upstream's
# generate.pe, the way Debian's packaging does. 3.3.1 carried Jamrul and
# Likhan only as prebuilt TTFs; 3.6.0 adds their sources (and the Akaash and
# Mukti Italic / Bold Italic fonts), so nothing here is installed prebuilt
# any more. The Jamrul and Likhan fonts generated from 3.6.0's sources render
# identically to the TTFs 3.3.1 shipped.
pipeline:
  - uses: git-checkout
    with:
      repository: https://salsa.debian.org/fonts-team/fonts-beng-extra
      tag: debian/${{package.version}}-${{vars.REVISION}}
      expected-commit: 125a23757c1b3c06a542e308791b569dbfaa5be0

  - name: Build the fonts from their .sfd sources
    runs: |
      # FontForge takes the head and FFTM timestamps from the source's
      # mtime; pin it so the build is reproducible.
      touch -d "@${SOURCE_DATE_EPOCH:-0}" ./*.sfd
      fontforge -lang=ff -script generate.pe ./*.sfd
      test "$(ls ./*.ttf | wc -l)" -eq 9

  - runs: |
      # Same file names and set as Debian's fonts-beng-extra 3.6.0
      # (debian/install), under /usr/share/fonts/<name>/ like the other font
      # packages. The old location must not be reused: 3.3.1 installed each
      # font with `install -t <dir>/<Name>.ttf`, which created *directories*
      # named JamrulNormal.ttf, LikhanNormal.ttf, ... with the font inside, and
      # apk cannot replace a directory with a file on upgrade. A fresh
      # directory lets apk drop the old tree cleanly.
      pkgname=${{package.name}}
      install -Dm644 ./*.ttf -t ${{targets.destdir}}/usr/share/fonts/${pkgname#font-}/

      mkdir -p ${{targets.destdir}}/etc/fonts/conf.d
      install -Dm644 debian/65-0-fonts-beng-extra.conf -t ${{targets.destdir}}/etc/fonts/conf.avail/
      for f in "${{targets.destdir}}/etc/fonts/conf.avail/"*.conf; do
        name=$(basename "$f")
        ln -sf /etc/fonts/conf.avail/$name ${{targets.destdir}}/etc/fonts/conf.d/$name
      done

update:
  enabled: false
  exclude-reason: No releases or tags

test:
  environment:
    contents:
      packages:
        - fontconfig
  pipeline:
    - uses: test/fonts
    - name: The nine fonts are installed and fontconfig sees every family
      runs: |
        test "$(ls /usr/share/fonts/lohit-beng-extra/*.ttf | wc -l)" -eq 9
        test ! -e /usr/share/fonts/truetype/lohit-beng-extra
        fc-cache -f
        for family in Akaash Ani Jamrul Likhan Mitra Mukti; do
          fc-list | grep -F "$family" || { echo "FAIL: $family not found by fontconfig"; exit 1; }
        done
        fc-conflist | grep -F 65-0-fonts-beng-extra.conf
