#nolint:valid-pipeline-git-checkout-tag
package:
  name: font-lohit-extras
  version: 2.4.3
  epoch: 3 # go/wolfi-rsc/font-lohit-extras
  description: Lohit fonts family project to supporting Indian scripts.
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - busybox
      - fontforge

pipeline:
  - runs: true # Dummy step to make this a valid pipeline, so Melange can process subpackages.

# These four families are not in the pravins/lohit git tree; their last
# release (2.4.3, 2017) exists only as tarballs on pagure, one with the
# FontForge .sfd source and generate.pe, one with the prebuilt TTF. Build from
# the source tarball; the generated fonts render identically to the released
# TTFs (unhinted raster comparison of every mapped code point).
data:
  - name: fonts-extra
    items:
      kashmiri: 8cdfd81aa5d7f45d60b08e51161f0f702b12cfd32ccb732ec1b4af26e95792765e8a5fedad8d601654fdcfd7b9208043c331ff985e6344272e3b2f63abe9fca9
      maithili: 72b02f6bd22677957038cfcc7f0e2afa7ff2bc7d641747c9f3040d884350200ab20c9c0b72fdf882b562466ea25fe1c168a63a56cb41e2a9c0d82f08d7fd3a67
      konkani: 25b871816369bb51d1ade2379fdc14ea8a07b93b63c330a63a1153f35f5920739518de31689829fed92215f93767cb0939505dde88eb3d25df8f47505ff42c8c
      sindhi: 22e355e87f12ecef83ad6de88bd175a9511e3c57b51f4cd9a6587a7d64ceb167c5913b2913ccbeffc5dbde0e13931dc70db2c0bcf500a88216b2e20163cf08d2

subpackages:
  - range: fonts-extra
    name: font-lohit-${{range.key}} # font-lohit-extras in the package name is just a placeholder, we need to use `font-lohit-${{range.key}}` to match the original font-lohit package naming convention.
    description: "${{range.key}} font"
    pipeline:
      # Every subpackage shares one workspace, so each family is unpacked into
      # its own directory. The previous recipe extracted into the workspace
      # root and installed `*.ttf` and `*.conf`, so each later subpackage also
      # shipped the fonts and fontconfig snippets of the ones built before it
      # (font-lohit-sindhi carried all four families).
      - runs: mkdir -p lohit-${{range.key}}
      - uses: fetch
        with:
          uri: https://releases.pagure.org/lohit/lohit-${{range.key}}-${{package.version}}.tar.gz
          expected-sha512: ${{range.value}}
          directory: lohit-${{range.key}}
      - name: Build the font from its .sfd source
        runs: |
          cd lohit-${{range.key}}
          # FontForge takes the head and FFTM timestamps from the source's
          # mtime; pin it so the build is reproducible.
          touch -d "@${SOURCE_DATE_EPOCH:-0}" ./*.sfd
          fontforge -lang=ff -script generate.pe ./*.sfd
          test "$(ls ./*.ttf | wc -l)" -eq 1

          mkdir -p "${{targets.subpkgdir}}/usr/share/fonts/lohit-${{range.key}}" \
                  "${{targets.subpkgdir}}/etc/fonts/conf.avail" \
                  "${{targets.subpkgdir}}/etc/fonts/conf.d"

          install -Dm644 ./*.ttf "${{targets.subpkgdir}}/usr/share/fonts/lohit-${{range.key}}/"

          for conf in *.conf; do
              install -Dm644 "$conf" "${{targets.subpkgdir}}/etc/fonts/conf.avail/$conf"
              ln -sf ../conf.avail/"$conf" "${{targets.subpkgdir}}/etc/fonts/conf.d/$conf"
          done
    test:
      environment:
        contents:
          packages:
            - fontconfig
      pipeline:
        - uses: test/fonts
        - name: fontconfig sees the family
          runs: |
            fc-cache -f
            fc-list | grep -i -F "lohit ${{range.key}}"

update:
  enabled: false
  exclude-reason: No releases or tags since 2017, see https://pagure.io/lohit

test:
  pipeline:
    - uses: test/emptypackage
