# Generated from https://git.alpinelinux.org/aports/plain/main/font-misc-cyrillic/APKBUILD
package:
  name: font-misc-cyrillic
  version: 1.0.4
  epoch: 6 # add deps/strip font indices
  description: X.org misc cyrillic fonts
  copyright:
    - license: LicenseRef-xorg-font-misc-cyrillic
      license-path: COPYING
  dependencies:
    provides:
      - fonts-xorg-misccyrillic=${{package.full-version}}
    runtime:
      - font-xorg-dirs
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bdftopcf
      - build-base
      - busybox
      - ca-certificates-bundle
      - encodings
      - font-alias
      - font-util-dev
      - fontconfig
      - mkfontscale
      - util-macros-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/xorg/font/misc-cyrillic
      tag: font-misc-cyrillic-${{package.version}}
      expected-commit: b34e4d82fecde316384876ae9315380f32234f87

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - name: Strip font indices since it conflicts with other font-xorg packages
    runs: |
      find "${{targets.destdir}}/usr/share/fonts/X11" \
           -type f \( -name 'fonts.dir' \
                    -o -name 'fonts.scale' \
                    -o -name 'fonts.alias' \) -delete

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 17220

test:
  pipeline:
    - uses: test/fonts
