package:
  name: font-noto-music-family
  version: "2.003"
  epoch: 0
  description: Noto Music, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
#
# Named with the -family suffix because font-noto-music is the existing
# per-script subpackage of font-noto (which now depends on this package). A
# name already published with font-noto's date-based version can never be
# taken over by a family-versioned package: apk would keep preferring it.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/music
      tag: NotoMusic-v${{package.version}}
      expected-commit: bd4f6fd84b1558d319052482ecd483f88d08d538

  # The source has one master, placed at Width 5, while its instances sit at
  # the default Width 100. glyphsLib 6.14 writes a designspace whose Width
  # axis spans 5..5, fontmake then finds no instance inside it and produces
  # nothing (upstream built the release with an older toolchain). With one
  # master its coordinate is arbitrary: move it to the instances' 100.
  - uses: patch
    with:
      patches: single-master-width.patch

  - uses: fonts/gftools-build
    with:
      config: sources/config-music.yaml
      family: NotoMusic
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/music
    strip-prefix: NotoMusic-v
    tag-filter-prefix: NotoMusic-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoMusic
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x1D11E"
        text: "\U0001D05F\U0001D0C6\U0001D139\U0001D1C6"
