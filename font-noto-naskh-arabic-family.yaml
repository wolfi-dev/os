package:
  name: font-noto-naskh-arabic-family
  version: "2.021"
  epoch: 0
  description: Noto Naskh Arabic, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
#
# Named with the -family suffix because font-noto-naskh-arabic is the existing
# per-script subpackage of font-noto (which now depends on this package). A
# name already published with font-noto's date-based version can never be
# taken over by a family-versioned package: apk would keep preferring it.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/arabic
      tag: NotoNaskhArabic-v${{package.version}}
      expected-commit: 59f5a3fd985bf24858915c3dddfc51a537640965

  - uses: fonts/gftools-build
    with:
      config: sources/config-naskh-arabic.yaml
      family: NotoNaskhArabic
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/arabic
    strip-prefix: NotoNaskhArabic-v
    tag-filter-prefix: NotoNaskhArabic-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoNaskhArabic
        version: ${{package.version}}
        count: "4"
        codepoint: "0x0627"
        text: "بسم الله الرحمن الرحيم"
