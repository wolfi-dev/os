package:
  name: font-noto-naskh-arabic-ui
  version: "2.017"
  epoch: 1
  description: Noto Naskh Arabic UI, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/arabic
      tag: NotoNaskhArabicUI-v${{package.version}}
      expected-commit: a7b84a0bbd6178940b8c473b89968c8378ab8ee0

  - uses: fonts/gftools-build
    with:
      config: sources/config-naskh-arabic-ui.yaml
      family: NotoNaskhArabicUI
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/arabic
    strip-prefix: NotoNaskhArabicUI-v
    tag-filter-prefix: NotoNaskhArabicUI-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoNaskhArabicUI
        version: ${{package.version}}
        count: "4"
        codepoint: "0x0627"
        text: "بسم الله الرحمن الرحيم"
