package:
  name: font-noto-rashi-hebrew-family
  version: "1.007"
  epoch: 1
  description: Noto Rashi Hebrew, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. The
# pipeline refuses fonts whose name table does not carry this version, so a
# checkout that is not the release fails the build. Repository HEADs carry
# unreleased edits under the same version string, hence the tag.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/hebrew
      tag: NotoRashiHebrew-v${{package.version}}
      expected-commit: b61ad874a1c14b3a4a057a3a12e9963097650496

  - uses: fonts/gftools-build
    with:
      config: sources/config-rashi-hebrew.yaml
      family: NotoRashiHebrew
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

# Named with the -family suffix because font-noto-rashi-hebrew is the
# existing per-script subpackage of font-noto (which now depends on this
# package). A family package must not reuse a name that has already been
# published with a date-based version: apk would keep preferring the old
# 2026.09.01 subpackage over 1.007.
update:
  enabled: true
  github:
    identifier: notofonts/hebrew
    strip-prefix: NotoRashiHebrew-v
    tag-filter-prefix: NotoRashiHebrew-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoRashiHebrew
        version: ${{package.version}}
        count: "9"
        codepoint: "0x05D0"
        text: "שלום עולם"
