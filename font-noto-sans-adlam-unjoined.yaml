package:
  name: font-noto-sans-adlam-unjoined
  version: "3.003"
  epoch: 0
  description: Noto Sans Adlam Unjoined, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/adlam
      tag: NotoSansAdlamUnjoined-v${{package.version}}
      expected-commit: 66c3f0126b2a54f51f6a902d5a33106a833c91d8

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-adlam-unjoined.yaml
      family: NotoSansAdlamUnjoined
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/adlam
    strip-prefix: NotoSansAdlamUnjoined-v
    tag-filter-prefix: NotoSansAdlamUnjoined-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansAdlamUnjoined
        version: ${{package.version}}
        count: "2"
        codepoint: "0x1E900"
        text: "\U0001E90D\U0001E91B\U0001E928\U0001E936"
