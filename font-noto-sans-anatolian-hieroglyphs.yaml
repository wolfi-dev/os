package:
  name: font-noto-sans-anatolian-hieroglyphs
  version: "2.001"
  epoch: 0
  description: Noto Sans Anatolian Hieroglyphs, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/anatolian-hieroglyphs
      tag: NotoSansAnatolianHieroglyphs-v${{package.version}}
      expected-commit: 8f0efa1ec659f22aad544e04aaa6590ee2299323

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-anatolian-hieroglyphs.yaml
      family: NotoSansAnatolianHieroglyphs
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/anatolian-hieroglyphs
    strip-prefix: NotoSansAnatolianHieroglyphs-v
    tag-filter-prefix: NotoSansAnatolianHieroglyphs-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansAnatolianHieroglyphs
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x14400"
        text: "\U00014474\U000144E9\U0001455D\U000145D2"
