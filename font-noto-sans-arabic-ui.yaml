package:
  name: font-noto-sans-arabic-ui
  version: "2.011"
  epoch: 0
  description: Noto Sans Arabic UI, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/arabic
      tag: NotoSansArabicUI-v${{package.version}}
      expected-commit: f0342ad85af8324e0c61bbdcdfe127a956992959

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-arabic-ui.yaml
      family: NotoSansArabicUI
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/arabic
    strip-prefix: NotoSansArabicUI-v
    tag-filter-prefix: NotoSansArabicUI-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansArabicUI
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0627"
        text: "بسم الله الرحمن الرحيم"
