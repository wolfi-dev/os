package:
  name: font-noto-sans-armenian
  version: "2.008"
  epoch: 0
  description: Noto Sans Armenian, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/armenian
      tag: NotoSansArmenian-v${{package.version}}
      expected-commit: 6eda0736b79b405c7151fd558c83ecec1c9c534c

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-armenian.yaml
      family: NotoSansArmenian
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/armenian
    strip-prefix: NotoSansArmenian-v
    tag-filter-prefix: NotoSansArmenian-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansArmenian
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0531"
        text: "ՁՒլս"
