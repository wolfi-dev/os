package:
  name: font-noto-sans-avestan
  version: "2.003"
  epoch: 0
  description: Noto Sans Avestan, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/avestan
      tag: NotoSansAvestan-v${{package.version}}
      expected-commit: d9d0f7842afc5ca4739792268b51a7a630945c82

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-avestan.yaml
      family: NotoSansAvestan
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/avestan
    strip-prefix: NotoSansAvestan-v
    tag-filter-prefix: NotoSansAvestan-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansAvestan
        version: ${{package.version}}
        count: "1"
        codepoint: "0x10B00"
        text: "\U00010B0A\U00010B15\U00010B20\U00010B2B"
