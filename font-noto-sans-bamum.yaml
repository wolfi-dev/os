package:
  name: font-noto-sans-bamum
  version: "2.002"
  epoch: 1
  description: Noto Sans Bamum, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/bamum
      tag: NotoSansBamum-v${{package.version}}
      expected-commit: 449f713fdd3ed0770aaeb17b26cebc1ce3e90169

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-bamum.yaml
      family: NotoSansBamum
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/bamum
    strip-prefix: NotoSansBamum-v
    tag-filter-prefix: NotoSansBamum-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansBamum
        version: ${{package.version}}
        count: "4"
        codepoint: "0xA6A0"
        text: "\U00016839\U000168B9\U00016939\U000169B9"
