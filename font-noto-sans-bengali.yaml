package:
  name: font-noto-sans-bengali
  version: "3.011"
  epoch: 0
  description: Noto Sans Bengali, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto
      # font-noto's per-script subpackage carried these files under
      # /usr/share/fonts/noto/ while the rest of the script was already built
      # from source; it must hand them over as well.
      - font-noto-bengali
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
#
# This family needs the glyphsLib fix carried in os/gftools.yaml
# (googlefonts/glyphsLib#1177): 22 of its glyphs declare a smart-component
# axis without pole layers, which glyphsLib 6.13.0 through 6.15.0 reject.
# With it, the 36 faces match Google's released files: same glyph counts,
# cmaps, table sets and feature lists, and every rendered glyph the same shape.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/bengali
      tag: NotoSansBengali-v${{package.version}}
      expected-commit: 85d80394cbbbb798ca0a41c983902e6cf77be3a3

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-bengali.yaml
      family: NotoSansBengali
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/bengali
    strip-prefix: NotoSansBengali-v
    tag-filter-prefix: NotoSansBengali-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansBengali
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0980"
        text: "ওটবড়"
