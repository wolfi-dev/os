package:
  name: font-noto-sans-buhid
  version: "2.001"
  epoch: 0
  description: Noto Sans Buhid, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/buhid
      tag: NotoSansBuhid-v${{package.version}}
      expected-commit: c73c8eb5bb21112cf43021f0e131a96f58c3022d

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-buhid.yaml
      family: NotoSansBuhid
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/buhid
    strip-prefix: NotoSansBuhid-v
    tag-filter-prefix: NotoSansBuhid-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansBuhid
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint failed on the script then);
        # the current ttfautohint hints it, so the rebuild is hinted.
        hinted: "true"
        codepoint: "0x1740"
        text: "ᝃᝇᝊᝎ"
