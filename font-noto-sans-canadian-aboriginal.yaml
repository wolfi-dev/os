package:
  name: font-noto-sans-canadian-aboriginal
  version: "2.004"
  epoch: 0
  description: Noto Sans Canadian Aboriginal, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/canadian-aboriginal
      tag: NotoSansCanadianAboriginal-v${{package.version}}
      expected-commit: e6534381170dd84806cea9a0bd1401923b12c965

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-canadian-aboriginal.yaml
      family: NotoSansCanadianAboriginal
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/canadian-aboriginal
    strip-prefix: NotoSansCanadianAboriginal-v
    tag-filter-prefix: NotoSansCanadianAboriginal-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansCanadianAboriginal
        version: ${{package.version}}
        count: "9"
        codepoint: "0x1401"
        text: "ᒑᔢᖲᙃ"
