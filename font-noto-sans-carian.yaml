package:
  name: font-noto-sans-carian
  version: "2.002"
  epoch: 0
  description: Noto Sans Carian, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/carian
      tag: NotoSansCarian-v${{package.version}}
      expected-commit: 5bf5c9f293ebb39fac5f0a35d22140c32b45658e

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-carian.yaml
      family: NotoSansCarian
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/carian
    strip-prefix: NotoSansCarian-v
    tag-filter-prefix: NotoSansCarian-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansCarian
        version: ${{package.version}}
        count: "1"
        codepoint: "0x102A0"
        text: "\U000102A9\U000102B3\U000102BD\U000102C7"
