package:
  name: font-noto-sans-chakma
  version: "2.003"
  epoch: 0
  description: Noto Sans Chakma, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/chakma
      tag: NotoSansChakma-v${{package.version}}
      expected-commit: 0133998f3007da7c16277439e1a311e280d61cd4

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-chakma.yaml
      family: NotoSansChakma
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/chakma
    strip-prefix: NotoSansChakma-v
    tag-filter-prefix: NotoSansChakma-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansChakma
        version: ${{package.version}}
        count: "1"
        codepoint: "0x11103"
        text: "\U0001110A\U00011112\U00011119\U00011121"
