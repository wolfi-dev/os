package:
  name: font-noto-sans-cham
  version: "2.005"
  epoch: 0
  description: Noto Sans Cham, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/cham
      tag: NotoSansCham-v${{package.version}}
      expected-commit: 1688bf8b8c53fbc07d363c5ab31610a1a65f16f9

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-cham.yaml
      family: NotoSansCham
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/cham
    strip-prefix: NotoSansCham-v
    tag-filter-prefix: NotoSansCham-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansCham
        version: ${{package.version}}
        count: "9"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0xAA00"
        text: "ꨊꨔꨟꩀ"
