package:
  name: font-noto-sans-cherokee
  version: "2.001"
  epoch: 1
  description: Noto Sans Cherokee, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/cherokee
      tag: NotoSansCherokee-v${{package.version}}
      expected-commit: 02c260d1ce1944084702faaa0452244324758fbd

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-cherokee.yaml
      family: NotoSansCherokee
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/cherokee
    strip-prefix: NotoSansCherokee-v
    tag-filter-prefix: NotoSansCherokee-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansCherokee
        version: ${{package.version}}
        count: "9"
        codepoint: "0x13A0"
        text: "ᏂᏤꭻꮝ"
