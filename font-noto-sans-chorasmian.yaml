package:
  name: font-noto-sans-chorasmian
  version: "1.004"
  epoch: 0
  description: Noto Sans Chorasmian, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/chorasmian
      tag: NotoSansChorasmian-v${{package.version}}
      expected-commit: 0c416e9dc996bb57a81171f19025a6c73c8aa52e

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-chorasmian.yaml
      family: NotoSansChorasmian
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/chorasmian
    strip-prefix: NotoSansChorasmian-v
    tag-filter-prefix: NotoSansChorasmian-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansChorasmian
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x10FB0"
        text: "\U00010FB4\U00010FB8\U00010FBC\U00010FC0"
