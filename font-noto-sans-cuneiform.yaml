package:
  name: font-noto-sans-cuneiform
  version: "2.001"
  epoch: 0
  description: Noto Sans Cuneiform, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/cuneiform
      tag: NotoSansCuneiform-v${{package.version}}
      expected-commit: 5691cb1648cb2fdcaddfb8a468127d5ca99ea551

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-cuneiform.yaml
      family: NotoSansCuneiform
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/cuneiform
    strip-prefix: NotoSansCuneiform-v
    tag-filter-prefix: NotoSansCuneiform-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansCuneiform
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x12000"
        text: "\U000120DF\U000121BF\U0001229E\U0001237E"
