package:
  name: font-noto-sans-cypriot
  version: "2.002"
  epoch: 0
  description: Noto Sans Cypriot, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/cypriot
      tag: NotoSansCypriot-v${{package.version}}
      expected-commit: ec911728791d7706637552f9dbd51c37d4b42e60

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-cypriot.yaml
      family: NotoSansCypriot
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/cypriot
    strip-prefix: NotoSansCypriot-v
    tag-filter-prefix: NotoSansCypriot-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansCypriot
        version: ${{package.version}}
        count: "1"
        codepoint: "0x10800"
        text: "\U0001080E\U00010819\U00010824\U0001082F"
