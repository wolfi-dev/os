package:
  name: font-noto-sans-cypro-minoan
  version: "1.503"
  epoch: 0
  description: Noto Sans Cypro Minoan, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/cypro-minoan
      tag: NotoSansCyproMinoan-v${{package.version}}
      expected-commit: 6f286af2a61d13987a3adf1bf5f6083cec0ba356

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-cypro-minoan.yaml
      family: NotoSansCyproMinoan
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/cypro-minoan
    strip-prefix: NotoSansCyproMinoan-v
    tag-filter-prefix: NotoSansCyproMinoan-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansCyproMinoan
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x12F90"
        text: "\U00012FA3\U00012FB6\U00012FCA\U00012FDD"
