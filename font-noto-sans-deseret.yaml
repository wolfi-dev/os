package:
  name: font-noto-sans-deseret
  version: "2.001"
  epoch: 0
  description: Noto Sans Deseret, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/deseret
      tag: NotoSansDeseret-v${{package.version}}
      expected-commit: ea3eb3708411752fedcef31aa404edf21a714ba4

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-deseret.yaml
      family: NotoSansDeseret
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/deseret
    strip-prefix: NotoSansDeseret-v
    tag-filter-prefix: NotoSansDeseret-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansDeseret
        version: ${{package.version}}
        count: "1"
        codepoint: "0x10400"
        text: "\U00010410\U00010420\U00010430\U00010440"
