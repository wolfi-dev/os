package:
  name: font-noto-sans-devanagari
  version: "2.007"
  epoch: 0
  description: Noto Sans Devanagari, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/devanagari
      tag: NotoSansDevanagari-v${{package.version}}
      expected-commit: e123d230c160ebe949d731cc19017cdb354180d1

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-devanagari.yaml
      family: NotoSansDevanagari
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/devanagari
    strip-prefix: NotoSansDevanagari-v
    tag-filter-prefix: NotoSansDevanagari-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansDevanagari
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0915"
        text: "नमस्ते दुनिया क्षत्रिय"
