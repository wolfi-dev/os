package:
  name: font-noto-sans-duployan
  version: "3.002"
  epoch: 0
  description: Noto Sans Duployan, generated from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs the
    # new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

vars:
  python-version: "3.13"

environment:
  contents:
    packages:
      - busybox
      - py${{vars.python-version}}-fontforge
      - py${{vars.python-version}}-fonttools
      - python-${{vars.python-version}}

# Noto Sans Duployan has no drawn source: every glyph is generated by
# sources/build.py, a Python program that draws the Duployan shorthand
# strokes with FontForge, expands them, and compiles the layout tables with
# fontTools. It is run here as upstream's Makefile at the release tag runs
# it, once per weight, and the two resulting fonts are installed under the
# names the notofonts release repository publishes them as.
#
# Upstream still builds with a FontForge of November 2019 compiled from
# source in CI (FONTFORGE_COMMIT in the upstream workflow); the patch below
# makes the generator produce the same fonts with the FontForge we package,
# see its header for the four FontForge behaviours it works around.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/duployan
      tag: NotoSansDuployan-v${{package.version}}
      expected-commit: dcec488da5e9c16d48051fe8d20b1b615bf8c9be

  - uses: patch
    with:
      patches: fontforge-20251009.patch

  # The patch runs every FontForge stroke in a forked child so that a
  # FontForge crash (fontforge/fontforge#5357) costs one attempt instead of
  # the build. CI exercises that path rarely (never on x86_64, once per
  # weight on aarch64), so prove the failure handling here with stand-ins:
  # a Python exception in the child must surface, a dead child must yield
  # None, a stroke that dies on every attempt must fail the build, and a
  # crash in overlap removal must reach the retry ladder.
  - name: Self-check the FontForge crash guard
    working-directory: sources
    runs: |
      python3 - <<'EOF'
      import os
      import sys
      sys.path.insert(0, os.getcwd())
      import fontforge
      import shapes

      empty = fontforge.layer()
      try:
          shapes._guarded(lambda layer: (_ for _ in ()).throw(ValueError("generator bug")), empty)
      except RuntimeError as e:
          assert "ValueError: generator bug" in str(e), e
      else:
          raise SystemExit("FAIL: a Python exception in the child did not surface")
      assert shapes._guarded(lambda layer: os.kill(os.getpid(), 11), empty) is None, "FAIL: a dead child did not yield None"

      line = fontforge.layer()
      contour = fontforge.contour()
      contour.moveTo(0, 0)
      contour.lineTo(100, 0)
      line += contour
      real_stroke = shapes._stroke_guarded
      shapes._stroke_guarded = lambda layer, args, kwargs: None
      try:
          shapes._stroke_layer(line, ("circular", 70, "round"), {})
      except RuntimeError as e:
          assert "on every attempt" in str(e), e
      else:
          raise SystemExit("FAIL: a stroke that crashed on every attempt did not fail the build")
      finally:
          shapes._stroke_guarded = real_stroke

      calls = []
      real_remove = shapes._remove_overlap_guarded
      def crash_once(layer):
          calls.append(1)
          return None if len(calls) == 1 else real_remove(layer)
      shapes._remove_overlap_guarded = crash_once
      font = fontforge.font()
      glyph = font.createChar(-1, "square")
      square = fontforge.layer()
      contour = fontforge.contour()
      for x, y in ((0, 0), (100, 0), (100, 100), (0, 100)):
          contour.lineTo(x, y) if len(contour) else contour.moveTo(x, y)
      contour.closed = True
      square += contour
      glyph.foreground = square
      shapes._remove_overlap_closed(glyph)
      shapes._remove_overlap_guarded = real_remove
      assert len(calls) == 2, f"FAIL: a crash in overlap removal did not reach the retry ladder ({len(calls)} guarded calls)"
      assert len(glyph.foreground) == 1, "FAIL: the retried overlap removal lost the contour"
      print("crash guard: exception surfaces, dead child yields None, all-crash fails, overlap crash retries")
      EOF

  - name: Generate the two weights
    runs: |
      # upstream Makefile: python sources/build.py [--bold] --fea sources/Duployan.fea --noto --output ... --release --version 3.002
      for weight in Regular Bold; do
        bold=""
        [ "$weight" = Bold ] && bold="--bold"
        python3 sources/build.py $bold --fea sources/Duployan.fea --noto \
          --output "fonts/NotoSansDuployan-$weight.otf" --release --version ${{package.version}}
      done

  # The release repository's hinted/ttf/NotoSansDuployan-*.ttf files, which
  # font-noto has always shipped under this directory, are these CFF fonts
  # with a .ttf extension (upstream's Makefile copies unhinted/otf there);
  # keep the file names so nothing that looks for them changes.
  - runs: |
      install -D -m644 fonts/NotoSansDuployan-Regular.otf "${{targets.destdir}}/usr/share/fonts/noto/NotoSansDuployan-Regular.ttf"
      install -D -m644 fonts/NotoSansDuployan-Bold.otf "${{targets.destdir}}/usr/share/fonts/noto/NotoSansDuployan-Bold.ttf"

update:
  enabled: true
  github:
    identifier: notofonts/duployan
    strip-prefix: NotoSansDuployan-v
    tag-filter-prefix: NotoSansDuployan-v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - fontconfig
        - harfbuzz-utils
        - py${{vars.python-version}}-fonttools
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansDuployan
        version: ${{package.version}}
        count: "2"
        # CFF outlines, no TrueType hinting, as in the release repository.
        hinted: "false"
        codepoint: "0x1BC00"
        text: "\U0001BC02\U0001BC41\U0001BC1A \U0001BC03\U0001BC44\U0001BC19\U0001BC41 \U0001BC1C\U0001BC46\U0001BC03\U0001BC41\U0001BC1B"
    - name: The generator's output survived the FontForge workarounds
      runs: |
        set -euo pipefail
        cd /usr/share/fonts/noto
        python${{vars.python-version}} - <<'EOF'
        from fontTools.pens.boundsPen import BoundsPen
        from fontTools.pens.recordingPen import RecordingPen
        from fontTools.ttLib import TTFont

        # Glyph counts of this build; the 3.002 release has 10240 and 10355,
        # the difference being the width-system spacer glyphs (_.Space.*),
        # whose names encode measured bounding boxes.
        #
        # Architecture note: FontForge's stroker and overlap removal are not
        # bit-reproducible between x86_64 and aarch64, so the two builds are
        # not byte-identical. Compared at 3.002-r0 (presubmit APKs of both
        # architectures): glyph order and count, cmap, GSUB, GDEF, OS/2, hhea,
        # name, post and maxp identical; 1,593 (Regular) and 3,790 (Bold)
        # CFF charstrings differ below one unit with every bounding box
        # identical; two Regular advances and 6/11 left side bearings differ
        # by one unit; the Bold GPOS differs in two anchor coordinates by one
        # unit; HarfBuzz shapes 714 test strings identically on both; the
        # unhinted raster of every code point is the same shape. The counts
        # asserted here hold on both architectures.
        for weight, glyphs in (("Regular", 10227), ("Bold", 10335)):
            f = TTFont(f"NotoSansDuployan-{weight}.ttf")
            assert "CFF " in f and "glyf" not in f, (weight, sorted(f.keys()))
            assert f["maxp"].numGlyphs == glyphs, (weight, f["maxp"].numGlyphs)
            gs, cmap = f.getGlyphSet(), f.getBestCmap()

            def drawn(cp):
                pen = BoundsPen(gs)
                gs[cmap[cp]].draw(pen)
                return pen.bounds is not None

            def contours(cp):
                pen = RecordingPen()
                gs[cmap[cp]].draw(pen)
                return sum(1 for op, _ in pen.value if op == "closePath")

            # Dots: the generator draws them as zero-length strokes, which
            # FontForge 20200314 and later expand to nothing; the patch draws
            # them as circles. Period, colon, dot above, DUPLOYAN LETTER H
            # (U+1BC00 is a dot), the high and low dots.
            for cp in (0x2E, 0x3A, 0x307, 0x1BC00, 0x1BC84, 0x1BC94):
                assert drawn(cp), (weight, hex(cp), "empty")
            # The stenographic period, four round-capped strokes through one
            # point, is the glyph FontForge's overlap removal returned open
            # (and the generator then deleted); it must be one closed contour.
            assert contours(0x2E3C) == 1, (weight, "U+2E3C", contours(0x2E3C))
            # Overlap removal must have merged a letter's strokes: P, T and F
            # are one contour each, the circle vowel A an outer and an inner one.
            for cp, want in ((0x1BC02, 1), (0x1BC03, 1), (0x1BC04, 1), (0x1BC41, 2)):
                assert contours(cp) == want, (weight, hex(cp), contours(cp), want)
            print(weight, "ok:", f["maxp"].numGlyphs, "glyphs,", len(cmap), "code points")
        EOF
        fc-cache -f
        fc-match -f '%{family} %{file|basename}\n' "Noto Sans Duployan" | grep -F "NotoSansDuployan-Regular.ttf"
        fc-match -f '%{family} %{file|basename}\n' "Noto Sans Duployan:bold" | grep -F "NotoSansDuployan-Bold.ttf"
