package:
  name: font-noto-sans-egyptian-hieroglyphs
  version: "2.002"
  epoch: 0
  description: Noto Sans Egyptian Hieroglyphs, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/egyptian-hieroglyphs
      tag: NotoSansEgyptianHieroglyphs-v${{package.version}}
      expected-commit: 08dec90190624040743ebb4e28d5552ae3d60862

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-egyptian-hieroglyphs.yaml
      family: NotoSansEgyptianHieroglyphs
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/egyptian-hieroglyphs
    strip-prefix: NotoSansEgyptianHieroglyphs-v
    tag-filter-prefix: NotoSansEgyptianHieroglyphs-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansEgyptianHieroglyphs
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x13000"
        text: "\U000130D7\U000131AF\U00013286\U0001335E"
