package:
  name: font-noto-sans-elbasan
  version: "2.004"
  epoch: 0
  description: Noto Sans Elbasan, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/elbasan
      tag: NotoSansElbasan-v${{package.version}}
      expected-commit: 79d28ae8df1e592ca362be6285da54f2a3cdfc39

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-elbasan.yaml
      family: NotoSansElbasan
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/elbasan
    strip-prefix: NotoSansElbasan-v
    tag-filter-prefix: NotoSansElbasan-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansElbasan
        version: ${{package.version}}
        count: "1"
        codepoint: "0x10500"
        text: "\U00010508\U00010510\U00010518\U00010520"
