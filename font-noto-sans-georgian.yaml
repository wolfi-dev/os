package:
  name: font-noto-sans-georgian
  version: "2.005"
  epoch: 0
  description: Noto Sans Georgian, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/georgian
      tag: NotoSansGeorgian-v${{package.version}}
      expected-commit: c02e5483c2dd63c5cf223845010ebd6e6dc56aec

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-georgian.yaml
      family: NotoSansGeorgian
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/georgian
    strip-prefix: NotoSansGeorgian-v
    tag-filter-prefix: NotoSansGeorgian-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansGeorgian
        version: ${{package.version}}
        count: "36"
        codepoint: "0x10A0"
        text: "ჂწᲡⴅ"
