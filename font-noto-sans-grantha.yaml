package:
  name: font-noto-sans-grantha
  version: "2.005"
  epoch: 0
  description: Noto Sans Grantha, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/grantha
      tag: NotoSansGrantha-v${{package.version}}
      expected-commit: 6bb911fa061ee18766c677ffcbd844ac1041eb81

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-grantha.yaml
      family: NotoSansGrantha
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/grantha
    strip-prefix: NotoSansGrantha-v
    tag-filter-prefix: NotoSansGrantha-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansGrantha
        version: ${{package.version}}
        count: "1"
        codepoint: "0x0BAA"
        text: "\U0001130C\U0001131B\U00011327\U00011335"
