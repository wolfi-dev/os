package:
  name: font-noto-sans-gunjala-gondi
  version: "1.004"
  epoch: 0
  description: Noto Sans Gunjala Gondi, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/gunjala-gondi
      tag: NotoSansGunjalaGondi-v${{package.version}}
      expected-commit: 4c782d16fd1c2284abfb153572893b1db03ece0f

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-gunjala-gondi.yaml
      family: NotoSansGunjalaGondi
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/gunjala-gondi
    strip-prefix: NotoSansGunjalaGondi-v
    tag-filter-prefix: NotoSansGunjalaGondi-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansGunjalaGondi
        version: ${{package.version}}
        count: "4"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x11D60"
        text: "\U00011D6A\U00011D72\U00011D7A\U00011D82"
