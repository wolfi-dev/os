package:
  name: font-noto-sans-gurmukhi
  version: "2.004"
  epoch: 1
  description: Noto Sans Gurmukhi, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
#
# The same release also defines the Noto Sans Gurmukhi UI
# family; those instances are built and installed here as well.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/gurmukhi
      tag: NotoSansGurmukhi-v${{package.version}}
      expected-commit: 231c5c6e9c622c4ef3792ead7a91045af0ee610a

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-gurmukhi.yaml
      family: NotoSansGurmukhi
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/gurmukhi
    strip-prefix: NotoSansGurmukhi-v
    tag-filter-prefix: NotoSansGurmukhi-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansGurmukhi
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0A05"
        text: "ਕਟਪਸ਼"
