package:
  name: font-noto-sans-hanifi-rohingya
  version: "2.102"
  epoch: 0
  description: Noto Sans Hanifi Rohingya, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/hanifi-rohingya
      tag: NotoSansHanifiRohingya-v${{package.version}}
      expected-commit: 1318e5389fca06662bb6594e3cf0f4569ddd66a3

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-hanifi-rohingya.yaml
      family: NotoSansHanifiRohingya
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/hanifi-rohingya
    strip-prefix: NotoSansHanifiRohingya-v
    tag-filter-prefix: NotoSansHanifiRohingya-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansHanifiRohingya
        version: ${{package.version}}
        count: "4"
        codepoint: "0x10D00"
        text: "\U00010D07\U00010D0E\U00010D15\U00010D1C"
