package:
  name: font-noto-sans-hebrew
  version: "3.001"
  epoch: 0
  description: Noto Sans Hebrew, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. The
# pipeline refuses fonts whose name table does not carry this version, so a
# checkout that is not the release fails the build. Repository HEADs carry
# unreleased edits under the same version string, hence the tag.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/hebrew
      tag: NotoSansHebrew-v${{package.version}}
      expected-commit: 036f3206f67caac235cf8546a7751d3440771a7e

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-hebrew.yaml
      family: NotoSansHebrew
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/hebrew
    strip-prefix: NotoSansHebrew-v
    tag-filter-prefix: NotoSansHebrew-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansHebrew
        version: ${{package.version}}
        count: "36"
        codepoint: "0x05D0"
        text: "שלום עולם"
