package:
  name: font-noto-sans-inscriptional-pahlavi
  version: "2.004"
  epoch: 0
  description: Noto Sans Inscriptional Pahlavi, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/inscriptional-pahlavi
      tag: NotoSansInscriptionalPahlavi-v${{package.version}}
      expected-commit: ccf6d043ac12c7817b7934f8fb98d217b8081762

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-inscriptional-pahlavi.yaml
      family: NotoSansInscriptionalPahlavi
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/inscriptional-pahlavi
    strip-prefix: NotoSansInscriptionalPahlavi-v
    tag-filter-prefix: NotoSansInscriptionalPahlavi-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansInscriptionalPahlavi
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x10B60"
        text: "\U00010B63\U00010B67\U00010B6B\U00010B6F"
