package:
  name: font-noto-sans-inscriptional-parthian
  version: "2.004"
  epoch: 0
  description: Noto Sans Inscriptional Parthian, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/inscriptional-parthian
      tag: NotoSansInscriptionalParthian-v${{package.version}}
      expected-commit: 893003503fb689e1b2a3d8810b7ee67d8ab98bf7

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-inscriptional-parthian.yaml
      family: NotoSansInscriptionalParthian
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/inscriptional-parthian
    strip-prefix: NotoSansInscriptionalParthian-v
    tag-filter-prefix: NotoSansInscriptionalParthian-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansInscriptionalParthian
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x10B40"
        text: "\U00010B44\U00010B48\U00010B4D\U00010B51"
