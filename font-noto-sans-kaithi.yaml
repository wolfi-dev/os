package:
  name: font-noto-sans-kaithi
  version: "2.006"
  epoch: 0
  description: Noto Sans Kaithi, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/kaithi
      tag: NotoSansKaithi-v${{package.version}}
      expected-commit: a439d16c5fd54cce21f4a46ee6cb18813c3d5112

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-kaithi.yaml
      family: NotoSansKaithi
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/kaithi
    strip-prefix: NotoSansKaithi-v
    tag-filter-prefix: NotoSansKaithi-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansKaithi
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x11083"
        text: "\U0001108C\U00011095\U0001109E\U000110A7"
