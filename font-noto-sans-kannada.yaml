package:
  name: font-noto-sans-kannada
  version: "2.006"
  epoch: 1
  description: Noto Sans Kannada, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
#
# The same release also defines the Noto Sans Kannada UI
# family; those instances are built and installed here as well.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/kannada
      tag: NotoSansKannada-v${{package.version}}
      expected-commit: 7eeac8993f890e3d8568ba909ae67f554113ea92

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-kannada.yaml
      family: NotoSansKannada
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/kannada
    strip-prefix: NotoSansKannada-v
    tag-filter-prefix: NotoSansKannada-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansKannada
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0C80"
        text: "ಐಝಪಷ"
