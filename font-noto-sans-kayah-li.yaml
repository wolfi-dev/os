package:
  name: font-noto-sans-kayah-li
  version: "2.002"
  epoch: 0
  description: Noto Sans Kayah Li, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/kayah-li
      tag: NotoSansKayahLi-v${{package.version}}
      expected-commit: 27fffb85001506757e327800841ea956ffd33ab7

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-kayah-li.yaml
      family: NotoSansKayahLi
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/kayah-li
    strip-prefix: NotoSansKayahLi-v
    tag-filter-prefix: NotoSansKayahLi-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansKayahLi
        version: ${{package.version}}
        count: "4"
        codepoint: "0xA90A"
        text: "ꤏꤕꤚꤠ"
