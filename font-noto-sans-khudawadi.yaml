package:
  name: font-noto-sans-khudawadi
  version: "2.004"
  epoch: 0
  description: Noto Sans Khudawadi, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/khudawadi
      tag: NotoSansKhudawadi-v${{package.version}}
      expected-commit: 77a425be0b41864390f3b973dbd41c9ad47922b9

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-khudawadi.yaml
      family: NotoSansKhudawadi
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/khudawadi
    strip-prefix: NotoSansKhudawadi-v
    tag-filter-prefix: NotoSansKhudawadi-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansKhudawadi
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x112B0"
        text: "\U000112B9\U000112C2\U000112CC\U000112D5"
