package:
  name: font-noto-sans-lao-looped
  version: "1.002"
  epoch: 0
  description: Noto Sans Lao Looped, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/lao
      tag: NotoSansLaoLooped-v${{package.version}}
      expected-commit: ab77daf4d8d6d9564da2dae84ae31bd9c971090f

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-lao-looped.yaml
      family: NotoSansLaoLooped
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/lao
    strip-prefix: NotoSansLaoLooped-v
    tag-filter-prefix: NotoSansLaoLooped-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansLaoLooped
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0E81"
        text: "ຏບວຳ"
