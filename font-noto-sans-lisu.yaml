package:
  name: font-noto-sans-lisu
  version: "2.102"
  epoch: 0
  description: Noto Sans Lisu, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/lisu
      tag: NotoSansLisu-v${{package.version}}
      expected-commit: 72b32c3cb24c196485d9f18b5b0bce56a5071083

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-lisu.yaml
      family: NotoSansLisu
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/lisu
    strip-prefix: NotoSansLisu-v
    tag-filter-prefix: NotoSansLisu-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansLisu
        version: ${{package.version}}
        count: "4"
        codepoint: "0xA4D0"
        text: "ꓘꓠꓨꓰ"
