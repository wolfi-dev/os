package:
  name: font-noto-sans-malayalam
  version: "2.104"
  epoch: 1
  description: Noto Sans Malayalam, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
#
# The same release also defines the Noto Sans Malayalam UI
# family; those instances are built and installed here as well.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/malayalam
      tag: NotoSansMalayalam-v${{package.version}}
      expected-commit: 0fd65e553a6af3dc1c09ed39dfe8933e01c17b32

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-malayalam.yaml
      family: NotoSansMalayalam
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/malayalam
    strip-prefix: NotoSansMalayalam-v
    tag-filter-prefix: NotoSansMalayalam-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansMalayalam
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0D04"
        text: "ഓഠമഽ"
