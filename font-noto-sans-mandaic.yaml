package:
  name: font-noto-sans-mandaic
  version: "2.003"
  epoch: 0
  description: Noto Sans Mandaic, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/mandaic
      tag: NotoSansMandaic-v${{package.version}}
      expected-commit: ef8c8ef95fd08c51ffc93aa7f930cd0086d761b9

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-mandaic.yaml
      family: NotoSansMandaic
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/mandaic
    strip-prefix: NotoSansMandaic-v
    tag-filter-prefix: NotoSansMandaic-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansMandaic
        version: ${{package.version}}
        count: "1"
        codepoint: "0x0840"
        text: "ࡅࡊࡏࡔ"
