package:
  name: font-noto-sans-manichaean
  version: "2.005"
  epoch: 0
  description: Noto Sans Manichaean, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/manichaean
      tag: NotoSansManichaean-v${{package.version}}
      expected-commit: c36a3b56cf76bc6c9f57ba1cd0c3b72d3ca819f1

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-manichaean.yaml
      family: NotoSansManichaean
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/manichaean
    strip-prefix: NotoSansManichaean-v
    tag-filter-prefix: NotoSansManichaean-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansManichaean
        version: ${{package.version}}
        count: "1"
        codepoint: "0x10AC0"
        text: "\U00010AC7\U00010ACF\U00010AD6\U00010ADD"
