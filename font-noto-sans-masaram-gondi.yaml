package:
  name: font-noto-sans-masaram-gondi
  version: "1.005"
  epoch: 0
  description: Noto Sans Masaram Gondi, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/masaram-gondi
      tag: NotoSansMasaramGondi-v${{package.version}}
      expected-commit: ce1d61955ea2cdc3da93cdc8dc0786aebd4a8667

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-masaram-gondi.yaml
      family: NotoSansMasaramGondi
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/masaram-gondi
    strip-prefix: NotoSansMasaramGondi-v
    tag-filter-prefix: NotoSansMasaramGondi-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansMasaramGondi
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x11D00"
        text: "\U00011D0B\U00011D15\U00011D1E\U00011D28"
