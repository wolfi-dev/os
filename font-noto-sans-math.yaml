package:
  name: font-noto-sans-math
  version: "3.000"
  epoch: 0
  description: Noto Sans Math, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/math
      tag: NotoSansMath-v${{package.version}}
      expected-commit: 00e9941d95b2a355399a66f3990ffde6e4985676

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-math.yaml
      family: NotoSansMath
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/math
    strip-prefix: NotoSansMath-v
    tag-filter-prefix: NotoSansMath-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansMath
        version: ${{package.version}}
        count: "1"
        codepoint: "0x2200"
        text: "∀x∈ℝ: x²≥0 ∫∑√"
