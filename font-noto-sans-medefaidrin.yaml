package:
  name: font-noto-sans-medefaidrin
  version: "1.002"
  epoch: 0
  description: Noto Sans Medefaidrin, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/medefaidrin
      tag: NotoSansMedefaidrin-v${{package.version}}
      expected-commit: 96ff0a87d0e366a96b45cb507076d6e6cc547e94

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-medefaidrin.yaml
      family: NotoSansMedefaidrin
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/medefaidrin
    strip-prefix: NotoSansMedefaidrin-v
    tag-filter-prefix: NotoSansMedefaidrin-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansMedefaidrin
        version: ${{package.version}}
        count: "4"
        codepoint: "0x16E40"
        text: "\U00016E4C\U00016E59\U00016E66\U00016E73"
