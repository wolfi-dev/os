package:
  name: font-noto-sans-meetei-mayek
  version: "2.002"
  epoch: 0
  description: Noto Sans Meetei Mayek, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/meetei-mayek
      tag: NotoSansMeeteiMayek-v${{package.version}}
      expected-commit: fa5b63ae71878a01db5008daa25649c35a6488f1

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-meetei-mayek.yaml
      family: NotoSansMeeteiMayek
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/meetei-mayek
    strip-prefix: NotoSansMeeteiMayek-v
    tag-filter-prefix: NotoSansMeeteiMayek-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansMeeteiMayek
        version: ${{package.version}}
        count: "9"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0xAAE0"
        text: "ꫩꯆꯐꯙ"
