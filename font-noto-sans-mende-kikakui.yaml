package:
  name: font-noto-sans-mende-kikakui
  version: "2.003"
  epoch: 0
  description: Noto Sans Mende Kikakui, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/mende-kikakui
      tag: NotoSansMendeKikakui-v${{package.version}}
      expected-commit: ae03c97feeddfd57e97fb5c61ce5814f6925043c

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-mende-kikakui.yaml
      family: NotoSansMendeKikakui
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/mende-kikakui
    strip-prefix: NotoSansMendeKikakui-v
    tag-filter-prefix: NotoSansMendeKikakui-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansMendeKikakui
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x1E800"
        text: "\U0001E827\U0001E84E\U0001E876\U0001E89D"
