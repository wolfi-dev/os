package:
  name: font-noto-sans-mono
  version: "2.014"
  epoch: 1
  description: Noto Sans Mono, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. The
# pipeline refuses fonts whose name table does not carry this version, so a
# checkout that is not the release fails the build. Repository HEADs carry
# unreleased edits under the same version string, hence the tag.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/latin-greek-cyrillic
      tag: NotoSansMono-v${{package.version}}
      expected-commit: 9b7310b8f99fcd2583c49606e6aefca13a391350

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-mono.yaml
      family: NotoSansMono
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/latin-greek-cyrillic
    strip-prefix: NotoSansMono-v
    tag-filter-prefix: NotoSansMono-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansMono
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0041"
        text: "The quick brown fox Ταχίστη Съешь"
