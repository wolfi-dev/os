package:
  name: font-noto-sans-mono
  version: "2.014"
  epoch: 3 # rebuild to publish font-noto-sans-mono-variable
  description: Noto Sans Mono, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. The
# pipeline refuses fonts whose name table does not carry this version, so a
# checkout that is not the release fails the build. Repository HEADs carry
# unreleased edits under the same version string, hence the tag.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/latin-greek-cyrillic
      tag: NotoSansMono-v${{package.version}}
      expected-commit: 9b7310b8f99fcd2583c49606e6aefca13a391350

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-mono.yaml
      family: NotoSansMono
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto
      outputs: unhinted/variable-ttf hinted/ttf

subpackages:
  - name: ${{package.name}}-variable
    description: Noto Sans Mono variable fonts
    dependencies:
      runtime:
        - font-noto-common
        - fontconfig
    pipeline:
      - name: Move the variable fonts
        runs: |
          dir=usr/share/fonts/noto
          mkdir -p "${{targets.contextdir}}/$dir"
          for f in "${{targets.destdir}}/$dir"/*\[*.ttf; do
            mv "$f" "${{targets.contextdir}}/$dir/"
          done
    test:
      pipeline:
        - uses: test/fonts
        - uses: test/font-family
          with:
            family: NotoSansMono
            version: ${{package.version}}
            pattern: "{family}[[]*.ttf"
            count: "1"
            hinted: "false"
            codepoint: "0x0041"
            text: "The quick brown fox Ταχίστη Съешь"
        - name: The installed fonts are variable
          runs: |
            fc-cache -f
            fc-query /usr/share/fonts/noto/NotoSansMono\[*.ttf | grep -F "variable: True"
            fc-match -f '%{file}\n' "Noto Sans Mono:weight=700" | grep -F 'NotoSansMono['

update:
  enabled: true
  github:
    identifier: notofonts/latin-greek-cyrillic
    strip-prefix: NotoSansMono-v
    tag-filter-prefix: NotoSansMono-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansMono
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0041"
        text: "The quick brown fox Ταχίστη Съешь"
    - name: No variable fonts are installed
      runs: |
        if ls /usr/share/fonts/noto/*\[*.ttf; then exit 1; fi
