package:
  name: font-noto-sans-multani
  version: "2.002"
  epoch: 0
  description: Noto Sans Multani, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/multani
      tag: NotoSansMultani-v${{package.version}}
      expected-commit: 2e9eb4390548ba559bbd1690f112ba94df87ae15

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-multani.yaml
      family: NotoSansMultani
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/multani
    strip-prefix: NotoSansMultani-v
    tag-filter-prefix: NotoSansMultani-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansMultani
        version: ${{package.version}}
        count: "1"
        codepoint: "0x11280"
        text: "\U00011288\U00011291\U00011299\U000112A1"
