package:
  name: font-noto-sans-nandinagari
  version: "1.003"
  epoch: 0
  description: Noto Sans Nandinagari, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/nandinagari
      tag: NotoSansNandinagari-v${{package.version}}
      expected-commit: c75145633ab708aedddef32f5141e8a19a0ece99

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-nandinagari.yaml
      family: NotoSansNandinagari
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/nandinagari
    strip-prefix: NotoSansNandinagari-v
    tag-filter-prefix: NotoSansNandinagari-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansNandinagari
        version: ${{package.version}}
        count: "1"
        codepoint: "0x1CE9"
        text: "\U000119A7\U000119B3\U000119BE\U000119C8"
