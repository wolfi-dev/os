package:
  name: font-noto-sans-new-tai-lue
  version: "2.004"
  epoch: 0
  description: Noto Sans New Tai Lue, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/new-tai-lue
      tag: NotoSansNewTaiLue-v${{package.version}}
      expected-commit: 3a9c4cba4edca9671a74afebaf3bd8102f986e91

  - uses: fonts/gftools-build
    with:
      config: sources/config.yaml
      family: NotoSansNewTaiLue
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/new-tai-lue
    strip-prefix: NotoSansNewTaiLue-v
    tag-filter-prefix: NotoSansNewTaiLue-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansNewTaiLue
        version: ${{package.version}}
        count: "4"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x1980"
        text: "ᦎᦜᦪᦼ"
