package:
  name: font-noto-sans-ol-chiki
  version: "2.003"
  epoch: 0
  description: Noto Sans Ol Chiki, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/ol-chiki
      tag: NotoSansOlChiki-v${{package.version}}
      expected-commit: c9811b41ff0d7502a9ad0818bc195793df60f8fa

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-ol-chiki.yaml
      family: NotoSansOlChiki
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/ol-chiki
    strip-prefix: NotoSansOlChiki-v
    tag-filter-prefix: NotoSansOlChiki-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansOlChiki
        version: ${{package.version}}
        count: "4"
        codepoint: "0x1C5A"
        text: "ᱠᱦᱬᱲ"
