package:
  name: font-noto-sans-old-italic
  version: "2.004"
  epoch: 0
  description: Noto Sans Old Italic, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/old-italic
      tag: NotoSansOldItalic-v${{package.version}}
      expected-commit: bafcf079b6d991ba281b048b1e7ae779b283128e

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-old.yaml
      family: NotoSansOldItalic
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/old-italic
    strip-prefix: NotoSansOldItalic-v
    tag-filter-prefix: NotoSansOldItalic-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansOldItalic
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x10300"
        text: "\U00010307\U0001030E\U00010315\U0001031C"
