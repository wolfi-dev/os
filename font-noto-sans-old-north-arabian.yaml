package:
  name: font-noto-sans-old-north-arabian
  version: "2.001"
  epoch: 0
  description: Noto Sans Old North Arabian, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/old-north-arabian
      tag: NotoSansOldNorthArabian-v${{package.version}}
      expected-commit: 2a29b5e6fef62d08fb5495b91faf06d3ba9c4d05

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-old-north-arabian.yaml
      family: NotoSansOldNorthArabian
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/old-north-arabian
    strip-prefix: NotoSansOldNorthArabian-v
    tag-filter-prefix: NotoSansOldNorthArabian-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansOldNorthArabian
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x10A80"
        text: "\U00010A85\U00010A8B\U00010A91\U00010A97"
