package:
  name: font-noto-sans-old-permic
  version: "2.001"
  epoch: 0
  description: Noto Sans Old Permic, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/old-permic
      tag: NotoSansOldPermic-v${{package.version}}
      expected-commit: 0fb8194830cbfa9df75d1bd23a83d6a5bdeda46e

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-old-permic.yaml
      family: NotoSansOldPermic
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/old-permic
    strip-prefix: NotoSansOldPermic-v
    tag-filter-prefix: NotoSansOldPermic-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansOldPermic
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x10350"
        text: "\U00010357\U0001035F\U00010366\U0001036E"
