package:
  name: font-noto-sans-old-persian
  version: "2.001"
  epoch: 0
  description: Noto Sans Old Persian, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/old-persian
      tag: NotoSansOldPersian-v${{package.version}}
      expected-commit: 81cc54aa8bb8d25e58e2d62d63e89c4f1a1702d8

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-old-persian.yaml
      family: NotoSansOldPersian
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/old-persian
    strip-prefix: NotoSansOldPersian-v
    tag-filter-prefix: NotoSansOldPersian-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansOldPersian
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x103A0"
        text: "\U000103A8\U000103B1\U000103BA\U000103C3"
