package:
  name: font-noto-sans-old-sogdian
  version: "2.003"
  epoch: 0
  description: Noto Sans Old Sogdian, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/old-sogdian
      tag: NotoSansOldSogdian-v${{package.version}}
      expected-commit: 63f94079fe9323c00a4bb1c4e4d5477008c76130

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-old-sogdian.yaml
      family: NotoSansOldSogdian
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/old-sogdian
    strip-prefix: NotoSansOldSogdian-v
    tag-filter-prefix: NotoSansOldSogdian-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansOldSogdian
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x10F00"
        text: "\U00010F06\U00010F0C\U00010F12\U00010F18"
