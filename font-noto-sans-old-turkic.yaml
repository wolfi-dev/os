package:
  name: font-noto-sans-old-turkic
  version: "2.004"
  epoch: 0
  description: Noto Sans Old Turkic, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/old-turkic
      tag: NotoSansOldTurkic-v${{package.version}}
      expected-commit: b9616aba12e777d230e9fd4e52a049477c862e59

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-old-turkic.yaml
      family: NotoSansOldTurkic
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/old-turkic
    strip-prefix: NotoSansOldTurkic-v
    tag-filter-prefix: NotoSansOldTurkic-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansOldTurkic
        version: ${{package.version}}
        count: "1"
        codepoint: "0x10C00"
        text: "\U00010C0E\U00010C1D\U00010C2B\U00010C3A"
