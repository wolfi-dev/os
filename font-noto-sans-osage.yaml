package:
  name: font-noto-sans-osage
  version: "2.002"
  epoch: 0
  description: Noto Sans Osage, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/osage
      tag: NotoSansOsage-v${{package.version}}
      expected-commit: 6c8b4a4dd1af29e70e3adf7177f397e6ac8cc83e

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-osage.yaml
      family: NotoSansOsage
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/osage
    strip-prefix: NotoSansOsage-v
    tag-filter-prefix: NotoSansOsage-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansOsage
        version: ${{package.version}}
        count: "1"
        codepoint: "0x104B0"
        text: "\U000104BE\U000104CC\U000104DF\U000104ED"
