package:
  name: font-noto-sans-osmanya
  version: "2.001"
  epoch: 0
  description: Noto Sans Osmanya, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/osmanya
      tag: NotoSansOsmanya-v${{package.version}}
      expected-commit: dc466ed17f0fcb19dd11acafcd1b209dfacc513b

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-osmanya.yaml
      family: NotoSansOsmanya
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/osmanya
    strip-prefix: NotoSansOsmanya-v
    tag-filter-prefix: NotoSansOsmanya-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansOsmanya
        version: ${{package.version}}
        count: "1"
        codepoint: "0x10480"
        text: "\U00010486\U0001048C\U00010492\U00010498"
