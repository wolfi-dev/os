package:
  name: font-noto-sans-pahawh-hmong
  version: "2.001"
  epoch: 0
  description: Noto Sans Pahawh Hmong, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/pahawh-hmong
      tag: NotoSansPahawhHmong-v${{package.version}}
      expected-commit: a6028997965dd1ecb16707b18e82eb81a321f235

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-pahawh-hmong.yaml
      family: NotoSansPahawhHmong
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/pahawh-hmong
    strip-prefix: NotoSansPahawhHmong-v
    tag-filter-prefix: NotoSansPahawhHmong-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansPahawhHmong
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x16B00"
        text: "\U00016B11\U00016B23\U00016B67\U00016B7E"
