package:
  name: font-noto-sans-phoenician
  version: "2.001"
  epoch: 0
  description: Noto Sans Phoenician, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/phoenician
      tag: NotoSansPhoenician-v${{package.version}}
      expected-commit: 7ccf4ec134065a02da77c43294d5a5f98af48308

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-phoenician.yaml
      family: NotoSansPhoenician
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/phoenician
    strip-prefix: NotoSansPhoenician-v
    tag-filter-prefix: NotoSansPhoenician-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansPhoenician
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x10900"
        text: "\U00010904\U00010908\U0001090D\U00010911"
