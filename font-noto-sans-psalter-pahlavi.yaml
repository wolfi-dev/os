package:
  name: font-noto-sans-psalter-pahlavi
  version: "2.003"
  epoch: 0
  description: Noto Sans Psalter Pahlavi, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/psalter-pahlavi
      tag: NotoSansPsalterPahlavi-v${{package.version}}
      expected-commit: 67ed6002f772c9b7cea9c8d56c28e2fe65bd114d

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-psalter-pahlavi.yaml
      family: NotoSansPsalterPahlavi
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/psalter-pahlavi
    strip-prefix: NotoSansPsalterPahlavi-v
    tag-filter-prefix: NotoSansPsalterPahlavi-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansPsalterPahlavi
        version: ${{package.version}}
        count: "1"
        codepoint: "0x10B80"
        text: "\U00010B83\U00010B87\U00010B8A\U00010B8E"
