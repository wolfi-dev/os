package:
  name: font-noto-sans-rejang
  version: "2.003"
  epoch: 0
  description: Noto Sans Rejang, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/rejang
      tag: NotoSansRejang-v${{package.version}}
      expected-commit: f8a0b6d6e937ca8893d86c4a3e3dabd3ffa3ccd9

  # Upstream commit fc321863 ("Just one version specifier, not three",
  # notofonts/rejang#6), which landed right after the tag: the tagged source
  # still carries stale openTypeNameVersion / versionString custom parameters
  # and builds as "Version 2.002", while the released 2.003 fonts say 2.003.
  - uses: patch
    with:
      patches: one-version-specifier.patch

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-rejang.yaml
      family: NotoSansRejang
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/rejang
    strip-prefix: NotoSansRejang-v
    tag-filter-prefix: NotoSansRejang-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansRejang
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0xA930"
        text: "ꤴꤹꤽꥂ"
