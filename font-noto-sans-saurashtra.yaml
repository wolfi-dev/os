package:
  name: font-noto-sans-saurashtra
  version: "2.002"
  epoch: 0
  description: Noto Sans Saurashtra, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/saurashtra
      tag: NotoSansSaurashtra-v${{package.version}}
      expected-commit: b6e0d03717c985bb4e289155c9bd3cd37953578f

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-saurashtra.yaml
      family: NotoSansSaurashtra
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/saurashtra
    strip-prefix: NotoSansSaurashtra-v
    tag-filter-prefix: NotoSansSaurashtra-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansSaurashtra
        version: ${{package.version}}
        count: "1"
        codepoint: "0xA882"
        text: "ꢌꢖꢠꢪ"
