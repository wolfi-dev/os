package:
  name: font-noto-sans-shavian
  version: "2.001"
  epoch: 0
  description: Noto Sans Shavian, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/shavian
      tag: NotoSansShavian-v${{package.version}}
      expected-commit: 58ab9c9ac522a6f235254da92dd1e2b11f5d9e07

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-shavian.yaml
      family: NotoSansShavian
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/shavian
    strip-prefix: NotoSansShavian-v
    tag-filter-prefix: NotoSansShavian-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansShavian
        version: ${{package.version}}
        count: "1"
        codepoint: "0x10450"
        text: "\U00010459\U00010463\U0001046C\U00010476"
