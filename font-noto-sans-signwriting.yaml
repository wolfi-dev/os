package:
  name: font-noto-sans-signwriting
  version: "2.005"
  epoch: 0
  description: Noto Sans SignWriting, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/sign-writing
      tag: NotoSansSignWriting-v${{package.version}}
      expected-commit: 793d27831f88d8f3653afca559cb961d5ea8edfa

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-sign-writing.yaml
      family: NotoSansSignWriting
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/sign-writing
    strip-prefix: NotoSansSignWriting-v
    tag-filter-prefix: NotoSansSignWriting-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansSignWriting
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x25CC"
        text: "\U0001D86B\U0001D8D7\U0001D943\U0001D9AF"
