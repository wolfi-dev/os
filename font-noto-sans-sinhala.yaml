package:
  name: font-noto-sans-sinhala
  version: "3.000"
  epoch: 0
  description: Noto Sans Sinhala, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/sinhala
      tag: NotoSansSinhala-v${{package.version}}
      expected-commit: 032355e96de5bac83fd996535af3d13b1fbfeccf

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-sinhala.yaml
      family: NotoSansSinhala
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/sinhala
    strip-prefix: NotoSansSinhala-v
    tag-filter-prefix: NotoSansSinhala-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansSinhala
        version: ${{package.version}}
        count: "12"
        codepoint: "0x0D85"
        text: "ඐඟණම"
