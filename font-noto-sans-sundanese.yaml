package:
  name: font-noto-sans-sundanese
  version: "2.005"
  epoch: 0
  description: Noto Sans Sundanese, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/sundanese
      tag: NotoSansSundanese-v${{package.version}}
      expected-commit: a0e5832eeda649d53cd1058ed11a125afdc6fd86

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-sundanese.yaml
      family: NotoSansSundanese
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/sundanese
    strip-prefix: NotoSansSundanese-v
    tag-filter-prefix: NotoSansSundanese-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansSundanese
        version: ${{package.version}}
        count: "4"
        codepoint: "0x1B83"
        text: "ᮊᮒᮙᮮ"
