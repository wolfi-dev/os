package:
  name: font-noto-sans-symbols2
  version: "2.008"
  epoch: 0
  description: Noto Sans Symbols 2, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. The
# pipeline refuses fonts whose name table does not carry this version, so a
# checkout that is not the release fails the build. Repository HEADs carry
# unreleased edits under the same version string, hence the tag.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/symbols
      tag: NotoSansSymbols2-v${{package.version}}
      expected-commit: 25b00f0d3f40873a005287514ba2a48558655314

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-symbols2.yaml
      family: NotoSansSymbols2
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/symbols
    strip-prefix: NotoSansSymbols2-v
    tag-filter-prefix: NotoSansSymbols2-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansSymbols2
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream: ttfautohint has no standard character
        # to derive its widths from and the recipe runs it --fail-ok.
        hinted: "false"
        codepoint: "0x2600"
        text: "☀☂⬜"
