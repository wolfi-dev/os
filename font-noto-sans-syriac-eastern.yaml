package:
  name: font-noto-sans-syriac-eastern
  version: "3.001"
  epoch: 0
  description: Noto Sans Syriac Eastern, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/syriac
      tag: NotoSansSyriacEastern-v${{package.version}}
      expected-commit: 11c7d5208e347bf59e1064253d3ec5916c1c2314

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-syriac-eastern.yaml
      family: NotoSansSyriacEastern
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/syriac
    strip-prefix: NotoSansSyriacEastern-v
    tag-filter-prefix: NotoSansSyriacEastern-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansSyriacEastern
        version: ${{package.version}}
        count: "3"
        codepoint: "0x0621"
        text: "ܗܞܥܬ"
