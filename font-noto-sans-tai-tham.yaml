package:
  name: font-noto-sans-tai-tham
  version: "2.002"
  epoch: 1
  description: Noto Sans Tai Tham, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/tai-tham
      tag: NotoSansTaiTham-v${{package.version}}
      expected-commit: d5c44eebb222f4ae9f6a056a80aa28d055ea6e8c

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-tai-tham.yaml
      family: NotoSansTaiTham
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/tai-tham
    strip-prefix: NotoSansTaiTham-v
    tag-filter-prefix: NotoSansTaiTham-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansTaiTham
        version: ${{package.version}}
        count: "4"
        codepoint: "0x1A20"
        text: "ᨪᨵᨿᩊ"
