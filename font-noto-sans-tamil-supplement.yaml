package:
  name: font-noto-sans-tamil-supplement
  version: "2.001"
  epoch: 0
  description: Noto Sans Tamil Supplement, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto
      # font-noto's per-script subpackage carried these files under
      # /usr/share/fonts/noto/ while the rest of the script was already built
      # from source; it must hand them over as well.
      - font-noto-tamil

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/tamil
      tag: NotoSansTamilSupplement-v${{package.version}}
      expected-commit: 27af016af77aed49475014b9cfe2a46b8fe71966

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-tamil-supplement.yaml
      family: NotoSansTamilSupplement
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/tamil
    strip-prefix: NotoSansTamilSupplement-v
    tag-filter-prefix: NotoSansTamilSupplement-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansTamilSupplement
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x11FC0"
        text: "\U00011FCA\U00011FD4\U00011FDE\U00011FE8"
