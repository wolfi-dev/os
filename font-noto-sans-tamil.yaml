package:
  name: font-noto-sans-tamil
  version: "2.004"
  epoch: 0
  description: Noto Sans Tamil, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
#
# The same release also defines the Noto Sans Tamil UI
# family; those instances are built and installed here as well.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/tamil
      tag: NotoSansTamil-v${{package.version}}
      expected-commit: f34a08d1ae3fa810581f63410296d971bdcd62dc

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-tamil.yaml
      family: NotoSansTamil
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/tamil
    strip-prefix: NotoSansTamil-v
    tag-filter-prefix: NotoSansTamil-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansTamil
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0B83"
        text: "எசனழ"
