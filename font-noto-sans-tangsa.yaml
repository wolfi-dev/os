package:
  name: font-noto-sans-tangsa
  version: "1.506"
  epoch: 0
  description: Noto Sans Tangsa, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/tangsa
      tag: NotoSansTangsa-v${{package.version}}
      expected-commit: a6939ee66e9e2dc12807c120e25e4f14564925f7

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-tangsa.yaml
      family: NotoSansTangsa
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/tangsa
    strip-prefix: NotoSansTangsa-v
    tag-filter-prefix: NotoSansTangsa-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansTangsa
        version: ${{package.version}}
        count: "4"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x16A70"
        text: "\U00016A7F\U00016A8F\U00016A9F\U00016AAF"
