package:
  name: font-noto-sans-thai-looped
  version: "2.000"
  epoch: 0
  description: Noto Sans Thai Looped, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. The
# pipeline refuses fonts whose name table does not carry this version, so a
# checkout that is not the release fails the build. Repository HEADs carry
# unreleased edits under the same version string, hence the tag.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/thai
      tag: NotoSansThaiLooped-v${{package.version}}
      expected-commit: c62000b1b2328aa5e08470c1924ac9987fdb83b9

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-thai-looped.yaml
      family: NotoSansThaiLooped
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/thai
    strip-prefix: NotoSansThaiLooped-v
    tag-filter-prefix: NotoSansThaiLooped-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansThaiLooped
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0E01"
        text: "สวัสดีชาวโลก"
