package:
  name: font-noto-sans-tifinagh
  version: "2.006"
  epoch: 0
  description: Noto Sans Tifinagh, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
#
# The same release also defines the Noto Sans Tifinagh APT, Noto Sans Tifinagh
# Adrar, Noto Sans Tifinagh Agraw Imazighen, Noto Sans Tifinagh Ahaggar, Noto
# Sans Tifinagh Air, Noto Sans Tifinagh Azawagh, Noto Sans Tifinagh Ghat, Noto
# Sans Tifinagh Hawad, Noto Sans Tifinagh Rhissa Ixa, Noto Sans Tifinagh SIL
# and Noto Sans Tifinagh Tawellemmet families; those instances are built and
# installed here as well.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/tifinagh
      tag: NotoSansTifinagh-v${{package.version}}
      expected-commit: 67f23306df1cbb93ce51e6404fca13bf2e810ec9

  # The source has one master, placed at Width 5, while its instances sit at
  # the default Width 100. glyphsLib 6.14 writes a designspace whose Width
  # axis spans 5..5, fontmake then finds no instance inside it and produces
  # nothing (upstream built the release with an older toolchain). With one
  # master its coordinate is arbitrary: move it to the instances' 100.
  - uses: patch
    with:
      patches: single-master-width.patch

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-tifinagh.yaml
      family: NotoSansTifinagh
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/tifinagh
    strip-prefix: NotoSansTifinagh-v
    tag-filter-prefix: NotoSansTifinagh-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansTifinagh
        version: ${{package.version}}
        count: "1"
        codepoint: "0x2D30"
        text: "ⴻⵆⵑⵜ"
