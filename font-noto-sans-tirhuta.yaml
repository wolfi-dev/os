package:
  name: font-noto-sans-tirhuta
  version: "2.003"
  epoch: 0
  description: Noto Sans Tirhuta, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/tirhuta
      tag: NotoSansTirhuta-v${{package.version}}
      expected-commit: f0ce3f49ab31911509a831833d6ffe32b063c19e

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-tirhuta.yaml
      family: NotoSansTirhuta
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/tirhuta
    strip-prefix: NotoSansTirhuta-v
    tag-filter-prefix: NotoSansTirhuta-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansTirhuta
        version: ${{package.version}}
        count: "1"
        codepoint: "0x1CF2"
        text: "\U00011489\U00011493\U0001149E\U000114A8"
