package:
  name: font-noto-sans-warang-citi
  version: "3.002"
  epoch: 0
  description: Noto Sans Warang Citi, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/warang-citi
      tag: NotoSansWarangCiti-v${{package.version}}
      expected-commit: a66de5a267bb8231f5fc1cc6c2741b355b2b9def

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-warang-citi.yaml
      family: NotoSansWarangCiti
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/warang-citi
    strip-prefix: NotoSansWarangCiti-v
    tag-filter-prefix: NotoSansWarangCiti-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansWarangCiti
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x118A0"
        text: "\U000118AD\U000118BA\U000118C7\U000118D4"
