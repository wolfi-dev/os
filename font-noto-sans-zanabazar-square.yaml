package:
  name: font-noto-sans-zanabazar-square
  version: "2.006"
  epoch: 0
  description: Noto Sans Zanabazar Square, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/zanabazar-square
      tag: NotoSansZanabazarSquare-v${{package.version}}
      expected-commit: 0b9fd1328cee98056e999e6061a048c9248acedf

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans-zanabazar-square.yaml
      family: NotoSansZanabazarSquare
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/zanabazar-square
    strip-prefix: NotoSansZanabazarSquare-v
    tag-filter-prefix: NotoSansZanabazarSquare-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSansZanabazarSquare
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x11A00"
        text: "\U00011A12\U00011A1A\U00011A23\U00011A2B"
