package:
  name: font-noto-sans
  version: "2.015"
  epoch: 0
  description: Noto Sans, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. The
# pipeline refuses fonts whose name table does not carry this version, so a
# checkout that is not the release fails the build. Repository HEADs carry
# unreleased edits under the same version string, hence the tag.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/latin-greek-cyrillic
      tag: NotoSans-v${{package.version}}
      expected-commit: c4a321e123e4d4ff315f57f4e0adf294fe3a95be

  - uses: fonts/gftools-build
    with:
      config: sources/config-sans.yaml
      family: NotoSans
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/latin-greek-cyrillic
    strip-prefix: NotoSans-v
    tag-filter-prefix: NotoSans-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSans
        version: ${{package.version}}
        count: "72"
        codepoint: "0x0041"
        text: "The quick brown fox Ταχίστη Съешь"
