package:
  name: font-noto-serif-devanagari
  version: "2.006"
  epoch: 1
  description: Noto Serif Devanagari, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/devanagari
      tag: NotoSerifDevanagari-v${{package.version}}
      expected-commit: be5ef8059c59578f3e74cf0bb534b3db2fa889e7

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-devanagari.yaml
      family: NotoSerifDevanagari
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/devanagari
    strip-prefix: NotoSerifDevanagari-v
    tag-filter-prefix: NotoSerifDevanagari-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifDevanagari
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0915"
        text: "नमस्ते दुनिया क्षत्रिय"
