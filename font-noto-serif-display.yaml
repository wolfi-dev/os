package:
  name: font-noto-serif-display
  version: "2.009"
  epoch: 1
  description: Noto Serif Display, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/latin-greek-cyrillic
      tag: NotoSerifDisplay-v${{package.version}}
      expected-commit: 49825864b0ad92d6d045154fc67a43ba8703ead8

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-display.yaml
      family: NotoSerifDisplay
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/latin-greek-cyrillic
    strip-prefix: NotoSerifDisplay-v
    tag-filter-prefix: NotoSerifDisplay-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifDisplay
        version: ${{package.version}}
        count: "72"
        codepoint: "0x0250"
        text: "ḉỖῖꜻ"
