package:
  name: font-noto-serif-ethiopic
  version: "2.102"
  epoch: 0
  description: Noto Serif Ethiopic, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/ethiopic
      tag: NotoSerifEthiopic-v${{package.version}}
      expected-commit: 1cc6933c58b7c42bbade15d6c7173897c24759e3

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-ethiopic.yaml
      family: NotoSerifEthiopic
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/ethiopic
    strip-prefix: NotoSerifEthiopic-v
    tag-filter-prefix: NotoSerifEthiopic-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifEthiopic
        version: ${{package.version}}
        count: "36"
        codepoint: "0x1200"
        text: "ቧዑጵⶵ"
