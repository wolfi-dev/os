package:
  name: font-noto-serif-georgian
  version: "2.003"
  epoch: 0
  description: Noto Serif Georgian, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/georgian
      tag: NotoSerifGeorgian-v${{package.version}}
      expected-commit: 6f879fd92b33e47dfc4c5f65fce80b0589fa5391

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-georgian.yaml
      family: NotoSerifGeorgian
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/georgian
    strip-prefix: NotoSerifGeorgian-v
    tag-filter-prefix: NotoSerifGeorgian-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifGeorgian
        version: ${{package.version}}
        count: "36"
        codepoint: "0x10A0"
        text: "ჂწᲡⴅ"
