package:
  name: font-noto-serif-gujarati
  version: "2.106"
  epoch: 2
  description: Noto Serif Gujarati, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto
      # font-noto's per-script subpackage carried these files under
      # /usr/share/fonts/noto/ while the rest of the script was already built
      # from source; it must hand them over as well.
      - font-noto-gujarati

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/gujarati
      tag: NotoSerifGujarati-v${{package.version}}
      expected-commit: addd668547c44504a5ebc40523d3533883f09f1d

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-gujarati.yaml
      family: NotoSerifGujarati
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/gujarati
    strip-prefix: NotoSerifGujarati-v
    tag-filter-prefix: NotoSerifGujarati-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifGujarati
        version: ${{package.version}}
        count: "9"
        codepoint: "0x0A85"
        text: "ઐજદળ"
