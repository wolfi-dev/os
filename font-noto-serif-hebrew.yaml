package:
  name: font-noto-serif-hebrew
  version: "2.004"
  epoch: 0
  description: Noto Serif Hebrew, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. The
# pipeline refuses fonts whose name table does not carry this version, so a
# checkout that is not the release fails the build. Repository HEADs carry
# unreleased edits under the same version string, hence the tag.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/hebrew
      tag: NotoSerifHebrew-v${{package.version}}
      expected-commit: b61ad874a1c14b3a4a057a3a12e9963097650496

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-hebrew.yaml
      family: NotoSerifHebrew
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/hebrew
    strip-prefix: NotoSerifHebrew-v
    tag-filter-prefix: NotoSerifHebrew-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifHebrew
        version: ${{package.version}}
        count: "36"
        codepoint: "0x05D0"
        text: "שלום עולם"
