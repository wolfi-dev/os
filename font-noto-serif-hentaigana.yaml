package:
  name: font-noto-serif-hentaigana
  version: "1.000"
  epoch: 1
  description: Noto Serif Hentaigana, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/hentaigana
      tag: NotoSerifHentaigana-v${{package.version}}
      expected-commit: 1f4ad429a7cbf851e5e887085d9342b5525af2ce

  - uses: fonts/gftools-build
    with:
      config: sources/config.yaml
      family: NotoSerifHentaigana
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/hentaigana
    strip-prefix: NotoSerifHentaigana-v
    tag-filter-prefix: NotoSerifHentaigana-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifHentaigana
        version: ${{package.version}}
        count: "7"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x1B000"
        text: "\U0001B03A\U0001B074\U0001B0AE\U0001B0E8"
