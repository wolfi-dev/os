package:
  name: font-noto-serif-khitan-small-script
  version: "1.000"
  epoch: 0
  description: Noto Serif Khitan Small Script, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/khitan-small-script
      tag: NotoSerifKhitanSmallScript-v${{package.version}}
      expected-commit: c659d517071caaa442218626c6b59db52c785c76

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif.yaml
      family: NotoSerifKhitanSmallScript
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/khitan-small-script
    strip-prefix: NotoSerifKhitanSmallScript-v
    tag-filter-prefix: NotoSerifKhitanSmallScript-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifKhitanSmallScript
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x4E39"
        text: "\U00018B56\U00018BB6\U00018C16\U00018C76"
