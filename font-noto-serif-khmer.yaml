package:
  name: font-noto-serif-khmer
  version: "2.004"
  epoch: 0
  description: Noto Serif Khmer, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/khmer
      tag: NotoSerifKhmer-v${{package.version}}
      expected-commit: 5d2251a4e32635c6657967a157759aac7a662fc9

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-khmer.yaml
      family: NotoSerifKhmer
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/khmer
    strip-prefix: NotoSerifKhmer-v
    tag-filter-prefix: NotoSerifKhmer-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifKhmer
        version: ${{package.version}}
        count: "36"
        codepoint: "0x1780"
        text: "ដផសឪ"
