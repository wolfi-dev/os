package:
  name: font-noto-serif-khojki
  version: "2.005"
  epoch: 0
  description: Noto Serif Khojki, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/khojki
      tag: NotoSerifKhojki-v${{package.version}}
      expected-commit: 02e25bf94664812076be4fa7dd1d688641e4bf8a

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-khojki.yaml
      family: NotoSerifKhojki
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/khojki
    strip-prefix: NotoSerifKhojki-v
    tag-filter-prefix: NotoSerifKhojki-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifKhojki
        version: ${{package.version}}
        count: "2"
        codepoint: "0x11200"
        text: "\U00011209\U00011213\U0001121C\U00011225"
