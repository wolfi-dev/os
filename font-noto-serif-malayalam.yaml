package:
  name: font-noto-serif-malayalam
  version: "2.104"
  epoch: 0
  description: Noto Serif Malayalam, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/malayalam
      tag: NotoSerifMalayalam-v${{package.version}}
      expected-commit: 0fd65e553a6af3dc1c09ed39dfe8933e01c17b32

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-malayalam.yaml
      family: NotoSerifMalayalam
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/malayalam
    strip-prefix: NotoSerifMalayalam-v
    tag-filter-prefix: NotoSerifMalayalam-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifMalayalam
        version: ${{package.version}}
        count: "9"
        codepoint: "0x0D04"
        text: "ഓഠമഽ"
