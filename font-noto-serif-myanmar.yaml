package:
  name: font-noto-serif-myanmar
  version: "2.106"
  epoch: 0
  description: Noto Serif Myanmar, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto
      # font-noto's per-script subpackage carried these files under
      # /usr/share/fonts/noto/ while the rest of the script was already built
      # from source; it must hand them over as well.
      - font-noto-myanmar
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
#
# Known difference from the 2022 release binaries, on purpose: U+1072 MYANMAR
# VOWEL SIGN GEBA KAREN I (glyph oe_kyh) attaches above the base here, as its
# own `_t._i` anchor, Unicode's positional category (Top) and Noto Sans
# Myanmar all say. The release attached it 1141 units below the base through
# a `_b._vocL_skt` anchor that the glyphsLib of the time propagated from the
# glyph's nga.sub component; current glyphsLib, like Glyphs.app, does not
# propagate component anchors into a glyph that defines its own. The release
# also had its mark lookups under `abvm`; Myanmar left ufo2ft's abvm script
# list in 2023, so they are under `mark` now, which HarfBuzz's Myanmar shaper
# applies identically. Everything else renders pixel-identical.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/myanmar
      tag: NotoSerifMyanmar-v${{package.version}}
      expected-commit: 57be35a771cf5da0271db8521c48a1cfdc4d2126

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-myanmar.yaml
      family: NotoSerifMyanmar
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/myanmar
    strip-prefix: NotoSerifMyanmar-v
    tag-filter-prefix: NotoSerifMyanmar-v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - harfbuzz-utils
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifMyanmar
        version: ${{package.version}}
        count: "36"
        codepoint: "0x1000"
        text: "ဗၓၿꩡ"
    - name: U+1072 attaches above its base (see the note in the recipe)
      runs: |
        set -u
        cd /usr/share/fonts/noto
        # ka + GEBA KAREN I: the vowel sign is a mark whose top anchor
        # coincides with ka's, so a correct attachment leaves it at offset 0.
        # The 2022 release binaries placed it 1141 units below the base.
        out="$(hb-shape --no-glyph-names --no-clusters NotoSerifMyanmar-Regular.ttf "ကၲ")"
        echo "$out"
        case "$out" in
          *"|"*"@0,-1141"*) echo "FAIL: U+1072 attached below the base like the 2022 release"; exit 1 ;;
          *"|"*"@"*) echo "FAIL: U+1072 carries a mark offset instead of sitting at its designed position"; exit 1 ;;
          *"|"*"+0]") ;;
          *) echo "FAIL: unexpected shaping for ka + U+1072"; exit 1 ;;
        esac
        # negative control: an unmapped private-use code point shapes to .notdef
        hb-shape --no-glyph-names --no-clusters NotoSerifMyanmar-Regular.ttf "$(printf '\356\200\200')" | grep -qE '^\[0[+@]' || { echo "FAIL: the .notdef control cannot fail"; exit 1; }
