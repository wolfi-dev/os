package:
  name: font-noto-serif-np-hmong
  version: "1.001"
  epoch: 0
  description: Noto Serif NP Hmong, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/nyiakeng-puachue-hmong
      tag: NotoSerifNPHmong-v${{package.version}}
      expected-commit: 2c945bb9c314d607d45c3120fcb35701349d9c87

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-nyiakeng-puachue-hmong.yaml
      family: NotoSerifNPHmong
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/nyiakeng-puachue-hmong
    strip-prefix: NotoSerifNPHmong-v
    tag-filter-prefix: NotoSerifNPHmong-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifNPHmong
        version: ${{package.version}}
        count: "4"
        codepoint: "0x1E100"
        text: "\U0001E109\U0001E112\U0001E11B\U0001E124"
