package:
  name: font-noto-serif-old-uyghur
  version: "1.005"
  epoch: 0
  description: Noto Serif Old Uyghur, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/old-uyghur
      tag: NotoSerifOldUyghur-v${{package.version}}
      expected-commit: 2660a2e53f4c2f59a8540b4e74634341266584e3

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-old-uyghur.yaml
      family: NotoSerifOldUyghur
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/old-uyghur
    strip-prefix: NotoSerifOldUyghur-v
    tag-filter-prefix: NotoSerifOldUyghur-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifOldUyghur
        version: ${{package.version}}
        count: "1"
        codepoint: "0x10F70"
        text: "\U00010F73\U00010F77\U00010F7A\U00010F7E"
