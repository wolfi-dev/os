package:
  name: font-noto-serif-ottoman-siyaq
  version: "1.006"
  epoch: 0
  description: Noto Serif Ottoman Siyaq, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/ottoman-siyaq-numbers
      tag: NotoSerifOttomanSiyaq-v${{package.version}}
      expected-commit: bdeea782313311565aed0a8847986818d286ff6f

  - uses: fonts/gftools-build
    with:
      config: sources/config.yaml
      family: NotoSerifOttomanSiyaq
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/ottoman-siyaq-numbers
    strip-prefix: NotoSerifOttomanSiyaq-v
    tag-filter-prefix: NotoSerifOttomanSiyaq-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifOttomanSiyaq
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x1ED01"
        text: "\U0001ED0D\U0001ED19\U0001ED25\U0001ED31"
