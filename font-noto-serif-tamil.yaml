package:
  name: font-noto-serif-tamil
  version: "2.004"
  epoch: 1
  description: Noto Serif Tamil, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/tamil
      tag: NotoSerifTamil-v${{package.version}}
      expected-commit: 626575fa0c68c81dee17a0342003c08c0ab8375e

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-tamil.yaml
      family: NotoSerifTamil
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/tamil
    strip-prefix: NotoSerifTamil-v
    tag-filter-prefix: NotoSerifTamil-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifTamil
        # The release's 36 italic instances carry 2.003 (upstream did not bump
        # the italic designspace for this release); the rebuild reproduces that.
        version: "${{package.version}} 2.003"
        count: "72"
        codepoint: "0x0B83"
        text: "எசனழ"
