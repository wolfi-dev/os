package:
  name: font-noto-serif-telugu
  version: "2.005"
  epoch: 1
  description: Noto Serif Telugu, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/telugu
      tag: NotoSerifTelugu-v${{package.version}}
      expected-commit: e97c3409a8347d68cccd06a82a68b418c315ee0c

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-telugu.yaml
      family: NotoSerifTelugu
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/telugu
    strip-prefix: NotoSerifTelugu-v
    tag-filter-prefix: NotoSerifTelugu-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifTelugu
        version: ${{package.version}}
        count: "9"
        codepoint: "0x0C05"
        text: "ఒఞపశ"
