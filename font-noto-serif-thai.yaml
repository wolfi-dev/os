package:
  name: font-noto-serif-thai
  version: "2.002"
  epoch: 1
  description: Noto Serif Thai, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. The
# pipeline refuses fonts whose name table does not carry this version, so a
# checkout that is not the release fails the build. Repository HEADs carry
# unreleased edits under the same version string, hence the tag.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/thai
      tag: NotoSerifThai-v${{package.version}}
      expected-commit: f8b482c158650260bba5d5edba9da3e8bb7185b4

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-thai.yaml
      family: NotoSerifThai
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/thai
    strip-prefix: NotoSerifThai-v
    tag-filter-prefix: NotoSerifThai-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifThai
        version: ${{package.version}}
        count: "36"
        codepoint: "0x0E01"
        text: "สวัสดีชาวโลก"
