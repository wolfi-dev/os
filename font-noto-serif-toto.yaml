package:
  name: font-noto-serif-toto
  version: "2.003"
  epoch: 0
  description: Noto Serif Toto, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/toto
      tag: NotoSerifToto-v${{package.version}}
      expected-commit: 042c58bb4b55535aa3329aff3f1aabec7bae447c

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-toto.yaml
      family: NotoSerifToto
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/toto
    strip-prefix: NotoSerifToto-v
    tag-filter-prefix: NotoSerifToto-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifToto
        version: ${{package.version}}
        count: "4"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x1E290"
        text: "\U0001E296\U0001E29C\U0001E2A2\U0001E2A8"
