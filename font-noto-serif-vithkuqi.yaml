package:
  name: font-noto-serif-vithkuqi
  version: "1.005"
  epoch: 1
  description: Noto Serif Vithkuqi, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/vithkuqi
      tag: NotoSerifVithkuqi-v${{package.version}}
      expected-commit: 5e5ead439149bd40848f65e8c7f1e6547fb1d473

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-vithkuqi.yaml
      family: NotoSerifVithkuqi
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/vithkuqi
    strip-prefix: NotoSerifVithkuqi-v
    tag-filter-prefix: NotoSerifVithkuqi-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifVithkuqi
        version: ${{package.version}}
        count: "4"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x10570"
        text: "\U0001057F\U0001058E\U0001059E\U000105AD"
