package:
  name: font-noto-serif-yezidi
  version: "1.001"
  epoch: 0
  description: Noto Serif Yezidi, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/yezidi
      tag: NotoSerifYezidi-v${{package.version}}
      expected-commit: 0706f1dea37fec18334a0149fa34c050ab0b324b

  - uses: fonts/gftools-build
    with:
      config: sources/config-serif-yezidi.yaml
      family: NotoSerifYezidi
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/yezidi
    strip-prefix: NotoSerifYezidi-v
    tag-filter-prefix: NotoSerifYezidi-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoSerifYezidi
        version: ${{package.version}}
        count: "4"
        codepoint: "0x10E80"
        text: "\U00010E88\U00010E91\U00010E9A\U00010EA3"
