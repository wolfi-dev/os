package:
  name: font-noto-traditional-nushu
  version: "2.003"
  epoch: 0
  description: Noto Traditional Nushu, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/nushu
      tag: NotoTraditionalNushu-v${{package.version}}
      expected-commit: 933f7be1e6083e9ead39e560fa0b526d491bec4b

  - uses: fonts/gftools-build
    with:
      config: sources/config-traditional-nushu.yaml
      family: NotoTraditionalNushu
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

update:
  enabled: true
  github:
    identifier: notofonts/nushu
    strip-prefix: NotoTraditionalNushu-v
    tag-filter-prefix: NotoTraditionalNushu-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoTraditionalNushu
        version: ${{package.version}}
        count: "3"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x34B5"
        text: "\U0001B1AC\U0001B200\U0001B254\U0001B2A8"
