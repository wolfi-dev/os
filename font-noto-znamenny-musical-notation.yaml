package:
  name: font-noto-znamenny-musical-notation
  version: "1.003"
  epoch: 0
  description: Noto Znamenny Musical Notation, built from the notofonts sources
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - font-noto-common
      - fontconfig
    # font-noto shipped these files itself before this package existed; let
    # apk hand them over when a system is upgraded in place (apk installs
    # the new dependency before it upgrades font-noto, so without this the
    # install is refused and the fonts are lost).
    replaces:
      - font-noto

environment:
  contents:
    packages:
      - busybox

# Built with upstream's own recipe (gftools-builder, as notofonts' notobuilder
# runs it) from the family repository at the family's release tag. Repository
# HEADs carry unreleased edits under the same version string, hence the tag;
# the test/font-family check refuses fonts whose name table does not carry
# this version.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/notofonts/znamenny
      tag: NotoZnamennyMusicalNotation-v${{package.version}}
      expected-commit: a434300c418aa7d7587b295095c8f52ad009a4d5

  - uses: fonts/gftools-build
    with:
      config: sources/config-znamenny.yaml
      family: NotoZnamennyMusicalNotation
      destination: ${{targets.destdir}}/usr/share/fonts/noto
      recipe-provider: noto

  # Upstream's Makefile rubricates after notobuilder (scripts/rubricate.sh):
  # it merges a COLR/CPAL pair into every built font so the neumes' red
  # (cinnabar) marks render in colour. Do the same to the installed fonts.
  - name: Rubricate the fonts as upstream's Makefile does
    runs: |
      set -euo pipefail
      # shellcheck disable=SC1091
      . /opt/chainguard/gftools/bin/activate
      for font in "${{targets.destdir}}"/usr/share/fonts/noto/NotoZnamennyMusicalNotation-*.ttf; do
        python -m fontTools.ttx -q -o "$font" -m "$font" scripts/rubrication.ttx
      done

update:
  enabled: true
  github:
    identifier: notofonts/znamenny
    strip-prefix: NotoZnamennyMusicalNotation-v
    tag-filter-prefix: NotoZnamennyMusicalNotation-v
    use-tag: true

test:
  pipeline:
    - uses: test/fonts
    - uses: test/font-family
      with:
        family: NotoZnamennyMusicalNotation
        version: ${{package.version}}
        count: "1"
        # Released unhinted upstream (ttfautohint --fail-ok in the recipe).
        hinted: "false"
        codepoint: "0x1CF00"
        text: "\U0001CF66\U0001CF7D\U0001CF95\U0001CFAC"
