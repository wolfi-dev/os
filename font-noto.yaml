          mkdir -p "${{targets.contextdir}}/usr/share/fonts/noto"
          cp "${{targets.destdir}}/usr/share/fonts/noto/"NotoSansBengali-*.ttf "${{targets.contextdir}}/usr/share/fonts/noto/"
          cp "${{targets.destdir}}/usr/share/fonts/noto/"NotoSansBengaliUI-*.ttf "${{targets.contextdir}}/usr/share/fonts/noto/"
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.d" "${{targets.contextdir}}/etc/fonts/conf.avail"
          for f in "${{targets.destdir}}/etc/fonts/conf.avail/"*-noto-bengali.conf; do
            cp "$f" "${{targets.contextdir}}/etc/fonts/conf.avail/"
            ln -s "/etc/fonts/conf.avail/$(basename "$f")" "${{targets.contextdir}}/etc/fonts/conf.d/$(basename "$f")"
          done
    test:
      pipeline:
        - uses: test/fonts
        - name: The family packages are pulled in and fontconfig sees them
          runs: |
            fc-cache -f
            fc-list | grep -F "Noto Sans Bengali"
            fc-list | grep -F "Noto Sans Bengali UI"
            fc-list | grep -F "Noto Serif Bengali"
            fc-conflist | grep -F -- "-noto-bengali.conf"

