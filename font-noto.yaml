    description: symbols font package
    dependencies:
      runtime:
        - ${{package.name}}-common
        - font-noto-sans-symbols
        - font-noto-sans-symbols2
        - fontconfig
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.d" "${{targets.contextdir}}/etc/fonts/conf.avail"
          for f in "${{targets.destdir}}/etc/fonts/conf.avail/"*-noto-symbols.conf; do
            cp "$f" "${{targets.contextdir}}/etc/fonts/conf.avail/"
            ln -s "/etc/fonts/conf.avail/$(basename "$f")" "${{targets.contextdir}}/etc/fonts/conf.d/$(basename "$f")"
          done
    test:
      pipeline:
        - name: The family packages are pulled in and fontconfig sees them
          runs: |
            fc-cache -f
            fc-list | grep -F "Noto Sans Symbols"
            fc-list | grep -F "Noto Sans Symbols 2"
            fc-conflist | grep -F -- "-noto-symbols.conf"

  # Every family of this script is built from source in its own package;
  # this subpackage keeps the name images depend on and the fontconfig
  # snippet, and pulls the family packages in.
  - name: ${{package.name}}-rashi-hebrew
    description: rashi-hebrew font package
