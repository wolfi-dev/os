            ln -s "/etc/fonts/conf.avail/$(basename "$f")" "${{targets.contextdir}}/etc/fonts/conf.d/$(basename "$f")"
          done
    test:
      pipeline:
        - name: The family packages are pulled in and fontconfig sees them
          runs: |
            fc-cache -f
            fc-list | grep -F "Noto Sans Armenian"
            fc-list | grep -F "Noto Serif Armenian"
            fc-conflist | grep -F -- "-noto-armenian.conf"

  # Built from source in their own packages: Noto Serif Bengali.
  # Still prebuilt here: Noto Sans Bengali (does not build with the current glyphsLib); Noto Sans Bengali UI (no upstream release tag).
  - name: ${{package.name}}-bengali
    description: bengali font package
    dependencies:
      runtime:
        - ${{package.name}}-common
        - font-noto-serif-bengali
        - fontconfig
    pipeline:
