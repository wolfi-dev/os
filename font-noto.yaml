            fc-conflist | grep -F -- "-noto-math.conf"

  # Noto Sans and Noto Serif Devanagari are built from source in their own
  # packages; Noto Sans Devanagari UI has no release tag upstream (the
  # sources at the Sans tag carry version 2.003, the release ships 2.004), so
  # it stays prebuilt here until notofonts tags it.
  - name: ${{package.name}}-devanagari
    description: devanagari font package
    dependencies:
