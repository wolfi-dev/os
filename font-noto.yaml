environment:
  contents:
    packages:
      - busybox
      - jq
      - ruby

data:
  - name: subpkgs
    items:
      duployan:

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 76fff9eee60dcef8381bfcae8d0b4311e2186e67
      repository: https://github.com/notofonts/notofonts.github.io
      tag: noto-monthly-release-${{package.version}}

  - runs: |
      mkdir -p conf.d
      ./noto-meta gen-font-confs conf.d/
      mkdir -p ${{targets.contextdir}}/etc/fonts/conf.avail/
      mkdir -p ${{targets.contextdir}}/usr/share/fonts/noto/
      cp fonts/*/hinted/ttf/*.ttf ${{targets.contextdir}}/usr/share/fonts/noto/
      cp conf.d/*.conf ${{targets.contextdir}}/etc/fonts/conf.avail/
      mkdir -p ${{targets.contextdir}}/etc/fonts/conf.d
      for f in "${{targets.destdir}}/etc/fonts/conf.avail/"*.conf; do
        full_filename=$(basename "$f")
        ln -s /etc/fonts/conf.avail/$full_filename ${{targets.contextdir}}/etc/fonts/conf.d/$full_filename
      done

  # Families built from source live in their own packages, one per notofonts
  # family repository release (font-noto-sans, font-noto-sans-hebrew, ...),
  # each tracking its own upstream tag; this package depends on them and no
  # longer ships the release repository's prebuilt copies of those files.
  # Naming: font-noto-<family>, except when that name is already one of the
  # per-script subpackages below (font-noto-rashi-hebrew): then the family
  # package takes a -family suffix, because a name that has been published
  # with this package's date-based version can never be taken over by a
  # family-versioned package (apk would keep preferring 2026.09.01 to 1.007).
  # The remaining families stay prebuilt until they are converted the same
  # way (OS-3334).
  - runs: |
      cd ${{targets.contextdir}}/usr/share/fonts/noto
      for family in NotoRashiHebrew NotoSans NotoSansHebrew NotoSansMono NotoSansSymbols \
                    NotoSansSymbols2 NotoSansThai NotoSansThaiLooped NotoSerif NotoSerifHebrew \
                    NotoSerifThai NotoKufiArabic NotoNaskhArabic NotoNaskhArabicUI NotoSansArabic \
                    NotoSansArabicUI NotoSansDevanagari NotoSerifDevanagari NotoSansMath \
                    NotoSansArmenian NotoSansEthiopic NotoSansGeorgian NotoSansGujarati \
                    NotoSansGurmukhi NotoSansKannada NotoSansKhmer NotoSansLao NotoSansLaoLooped \
                    NotoSansMalayalam NotoSansMyanmar NotoSansTamil NotoSansTelugu NotoSerifArmenian \
                    NotoSerifBengali NotoSerifDisplay NotoSerifEthiopic NotoSerifGeorgian \
                    NotoSerifKhmer NotoSerifLao NotoSerifSinhala NotoSerifTamil NotoSansGujaratiUI \
                    NotoSansGurmukhiUI NotoSansKannadaUI NotoSansMalayalamUI NotoSansTamilUI \
                    NotoSansTeluguUI NotoSansBalinese NotoSansBamum NotoSansBassaVah \
                    NotoSansCanadianAboriginal NotoSansCham NotoSansCherokee NotoSansGunjalaGondi \
                    NotoSansHanifiRohingya NotoSansKayahLi NotoSansLisu NotoSansMedefaidrin \
                    NotoSansMeeteiMayek NotoSansNewTaiLue NotoSansOlChiki NotoSansOriya \
                    NotoSansSoraSompeng NotoSansSundanese NotoSansTaiTham NotoSansTangsa \
                    NotoSansThaana NotoSansVithkuqi NotoSerifGujarati NotoSerifGurmukhi \
                    NotoSerifHentaigana NotoSerifKannada NotoSerifMalayalam NotoSerifNPHmong \
                    NotoSerifOriya NotoSerifTelugu NotoSerifTibetan NotoSerifToto NotoSerifVithkuqi \
                    NotoSerifYezidi NotoFangsongKSSRotated NotoFangsongKSSVertical NotoMusic \
                    NotoNastaliqUrdu NotoSansAdlam NotoSansAdlamUnjoined \
                    NotoSansAnatolianHieroglyphs NotoSansAvestan NotoSansBatak NotoSansBhaiksuki \
                    NotoSansBrahmi NotoSansBuginese NotoSansBuhid NotoSansCarian \
                    NotoSansCaucasianAlbanian NotoSansChakma NotoSansChorasmian NotoSansCoptic \
                    NotoSansCuneiform NotoSansCypriot NotoSansCyproMinoan NotoSansDeseret \
                    NotoSansEgyptianHieroglyphs NotoSansElbasan NotoSansElymaic NotoSansGlagolitic \
                    NotoSansGothic NotoSansGrantha NotoSansHanunoo NotoSansHatran \
                    NotoSansImperialAramaic NotoSansIndicSiyaqNumbers NotoSansInscriptionalPahlavi \
                    NotoSansInscriptionalParthian NotoSansJavanese NotoSansKaithi NotoSansKawi \
                    NotoSansKharoshthi NotoSansKhojki NotoSansKhudawadi NotoSansLepcha NotoSansLimbu \
                    NotoSansLinearA NotoSansLinearB NotoSansLycian NotoSansLydian NotoSansMahajani \
                    NotoSansMandaic NotoSansManichaean NotoSansMarchen NotoSansMasaramGondi \
                    NotoSansMayanNumerals NotoSansMendeKikakui NotoSansMeroitic NotoSansMiao \
                    NotoSansModi NotoSansMongolian NotoSansMro NotoSansMultani NotoSansNKo \
                    NotoSansNKoUnjoined NotoSansNabataean NotoSansNagMundari NotoSansNandinagari \
                    NotoSansNewa NotoSansNushu NotoSansOgham NotoSansOldHungarian NotoSansOldItalic \
                    NotoSansOldNorthArabian NotoSansOldPermic NotoSansOldPersian NotoSansOldSogdian \
                    NotoSansOldSouthArabian NotoSansOldTurkic NotoSansOsage NotoSansOsmanya \
                    NotoSansPahawhHmong NotoSansPalmyrene NotoSansPauCinHau NotoSansPhagsPa \
                    NotoSansPhoenician NotoSansPsalterPahlavi NotoSansRejang NotoSansRunic \
                    NotoSansSamaritan NotoSansSaurashtra NotoSansSharada NotoSansShavian \
                    NotoSansSiddham NotoSansSignWriting NotoSansSogdian NotoSansSoyombo \
                    NotoSansSunuwar NotoSansSylotiNagri NotoSansSyriac NotoSansSyriacEastern \
                    NotoSansSyriacWestern NotoSansTagalog NotoSansTagbanwa NotoSansTaiLe \
                    NotoSansTaiViet NotoSansTakri NotoSansTamilSupplement NotoSansTest \
                    NotoSansTifinagh NotoSansTirhuta NotoSansUgaritic NotoSansVai NotoSansWancho \
                    NotoSansWarangCiti NotoSansYi NotoSansZanabazarSquare NotoSerifAhom \
                    NotoSerifBalinese NotoSerifDivesAkuru NotoSerifDogra NotoSerifGrantha \
                    NotoSerifKhitanSmallScript NotoSerifKhojki NotoSerifMakasar NotoSerifOldUyghur \
                    NotoSerifOttomanSiyaq NotoSerifTangut NotoSerifTest NotoSerifTodhri \
                    NotoTraditionalNushu NotoZnamennyMusicalNotation NotoSansTifinaghAPT \
                    NotoSansTifinaghAdrar NotoSansTifinaghAgrawImazighen NotoSansTifinaghAhaggar \
                    NotoSansTifinaghAir NotoSansTifinaghAzawagh NotoSansTifinaghGhat \
                    NotoSansTifinaghHawad NotoSansTifinaghRhissaIxa NotoSansTifinaghSIL \
                    NotoSansTifinaghTawellemmet; do
        n=$(ls "$family"-*.ttf | wc -l)
        [ "$n" -gt 0 ] || { echo "no release files for $family; is it still in the release?"; exit 1; }
        rm "$family"-*.ttf
        echo "$family: dropped $n prebuilt files, built from source in its own package"
      done
      # Noto Sans Sinhala: the current release (3.000) has 12 files, but the release
      # repository still carries 26 files of an older version of the family
      # (different width instances). Drop only what the family package rebuilds; the
      # stale files stay until upstream removes them.
      rm NotoSansSinhala-Black.ttf NotoSansSinhala-BlackCondensed.ttf NotoSansSinhala-Bold.ttf NotoSansSinhala-Condensed.ttf \
         NotoSansSinhala-ExtraBold.ttf NotoSansSinhala-ExtraLight.ttf NotoSansSinhala-Light.ttf NotoSansSinhala-Medium.ttf \
         NotoSansSinhala-Regular.ttf NotoSansSinhala-SemiBold.ttf NotoSansSinhala-Thin.ttf NotoSansSinhala-ThinCondensed.ttf

subpackages:
  - name: ${{package.name}}-common
    description: Common files for Noto font families
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/etc/fonts/conf.avail
          mkdir -p ${{targets.contextdir}}/etc/fonts/conf.d
          cp conf.d/58-noto.conf ${{targets.contextdir}}/etc/fonts/conf.avail/58-noto.conf
          cp conf.d/58-noto.conf ${{targets.contextdir}}/etc/fonts/conf.d/58-noto.conf
          ln -sf /etc/fonts/conf.avail/58-noto.conf ${{targets.contextdir}}/etc/fonts/conf.d/58-noto.conf
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            files: |
              /etc/fonts/conf.avail/58-noto.conf
              /etc/fonts/conf.d/58-noto.conf
        - name: Verify fontconfig symlink
          runs: |
            # Verify the conf.d entry is a symlink pointing to conf.avail
            target=$(readlink /etc/fonts/conf.d/58-noto.conf)
            if [ "$target" != "/etc/fonts/conf.avail/58-noto.conf" ]; then
              echo "FAIL: Expected symlink to /etc/fonts/conf.avail/58-noto.conf, got $target"
              exit 1
            fi
            echo "PASS: fontconfig symlink is correct"

  # Every family of this script is built from source in its own package;
  # this subpackage keeps the name images depend on and the fontconfig
  # snippet, and pulls the family packages in.
  - name: ${{package.name}}-hebrew
    description: hebrew font package
    dependencies:
      runtime:
        - ${{package.name}}-common
        - font-noto-sans-hebrew
        - font-noto-serif-hebrew
        - fontconfig
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.d" "${{targets.contextdir}}/etc/fonts/conf.avail"
          for f in "${{targets.destdir}}/etc/fonts/conf.avail/"*-noto-hebrew.conf; do
            cp "$f" "${{targets.contextdir}}/etc/fonts/conf.avail/"
            ln -s "/etc/fonts/conf.avail/$(basename "$f")" "${{targets.contextdir}}/etc/fonts/conf.d/$(basename "$f")"
          done
    test:
      pipeline:
        - name: The family packages are pulled in and fontconfig sees them
          runs: |
            fc-cache -f
            fc-list | grep -F "Noto Sans Hebrew"
            fc-list | grep -F "Noto Serif Hebrew"
            fc-conflist | grep -F -- "-noto-hebrew.conf"

  # Every family of this script is built from source in its own package;
  # this subpackage keeps the name images depend on and the fontconfig
  # snippet, and pulls the family packages in.
  - name: ${{package.name}}-thai
    description: thai font package
    dependencies:
      runtime:
        - ${{package.name}}-common
        - font-noto-sans-thai
        - font-noto-sans-thai-looped
        - font-noto-serif-thai
        - fontconfig
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.d" "${{targets.contextdir}}/etc/fonts/conf.avail"
          for f in "${{targets.destdir}}/etc/fonts/conf.avail/"*-noto-thai.conf; do
            cp "$f" "${{targets.contextdir}}/etc/fonts/conf.avail/"
            ln -s "/etc/fonts/conf.avail/$(basename "$f")" "${{targets.contextdir}}/etc/fonts/conf.d/$(basename "$f")"
          done
    test:
      pipeline:
        - name: The family packages are pulled in and fontconfig sees them
          runs: |
            fc-cache -f
            fc-list | grep -F "Noto Sans Thai"
            fc-list | grep -F "Noto Sans Thai Looped"
            fc-list | grep -F "Noto Serif Thai"
            fc-conflist | grep -F -- "-noto-thai.conf"

  # Every family of this script is built from source in its own package;
  # this subpackage keeps the name images depend on and the fontconfig
  # snippet, and pulls the family packages in.
  - name: ${{package.name}}-symbols
    description: symbols font package
    dependencies:
      runtime:
        - ${{package.name}}-common
        - font-noto-sans-symbols
        - font-noto-sans-symbols2
        - fontconfig
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.d" "${{targets.contextdir}}/etc/fonts/conf.avail"
          for f in "${{targets.destdir}}/etc/fonts/conf.avail/"*-noto-symbols.conf; do
            cp "$f" "${{targets.contextdir}}/etc/fonts/conf.avail/"
            ln -s "/etc/fonts/conf.avail/$(basename "$f")" "${{targets.contextdir}}/etc/fonts/conf.d/$(basename "$f")"
          done
    test:
      pipeline:
        - name: The family packages are pulled in and fontconfig sees them
          runs: |
            fc-cache -f
            fc-list | grep -F "Noto Sans Symbols"
            fc-list | grep -F "Noto Sans Symbols 2"
            fc-conflist | grep -F -- "-noto-symbols.conf"

  # Every family of this script is built from source in its own package;
  # this subpackage keeps the name images depend on and the fontconfig
  # snippet, and pulls the family packages in.
  - name: ${{package.name}}-rashi-hebrew
    description: rashi-hebrew font package
    dependencies:
      runtime:
        - ${{package.name}}-common
        - font-noto-rashi-hebrew-family
        - fontconfig
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.d" "${{targets.contextdir}}/etc/fonts/conf.avail"
          for f in "${{targets.destdir}}/etc/fonts/conf.avail/"*-noto-rashi-hebrew.conf; do
            cp "$f" "${{targets.contextdir}}/etc/fonts/conf.avail/"
            ln -s "/etc/fonts/conf.avail/$(basename "$f")" "${{targets.contextdir}}/etc/fonts/conf.d/$(basename "$f")"
          done
    test:
      pipeline:
        - name: The family package is pulled in and fontconfig sees it
          runs: |
            fc-cache -f
            fc-list | grep -F "Noto Rashi Hebrew"
            fc-conflist | grep -F -- "-noto-rashi-hebrew.conf"

  # Every family of this script is built from source in its own package;
  # this subpackage keeps the name images depend on and the fontconfig
  # snippet, and pulls the family packages in.
  - name: ${{package.name}}-arabic
    description: arabic font package
    dependencies:
      runtime:
        - ${{package.name}}-common
        - font-noto-sans-arabic
        - font-noto-sans-arabic-ui
        - fontconfig
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.d" "${{targets.contextdir}}/etc/fonts/conf.avail"
          for f in "${{targets.destdir}}/etc/fonts/conf.avail/"*-noto-arabic.conf; do
            cp "$f" "${{targets.contextdir}}/etc/fonts/conf.avail/"
            ln -s "/etc/fonts/conf.avail/$(basename "$f")" "${{targets.contextdir}}/etc/fonts/conf.d/$(basename "$f")"
          done
    test:
