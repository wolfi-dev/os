package:
  name: font-noto
  version: "2026.09.01"
  epoch: 2 # go/wolfi-rsc/font-noto
  description: Noto fonts
  dependencies:
    runtime:
      - font-noto-common
      - font-noto-kufi-arabic-family
      - font-noto-math
      - font-noto-naskh-arabic-family
      - font-noto-naskh-arabic-ui
      # Families built from source in their own packages (see below).
      - font-noto-rashi-hebrew-family
      - font-noto-sans
      - font-noto-sans-arabic
      - font-noto-sans-arabic-ui
      - font-noto-sans-devanagari
      - font-noto-sans-hebrew
      - font-noto-sans-math
      - font-noto-sans-mono
      - font-noto-sans-symbols
      - font-noto-sans-symbols2
      - font-noto-sans-thai
      - font-noto-sans-thai-looped
      - font-noto-serif
      - font-noto-serif-devanagari
      - font-noto-serif-hebrew
      - font-noto-serif-thai
      - font-noto-symbols
      - fontconfig
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 10Gi
  test-resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    packages:
      - busybox
      - jq
      - ruby

