            fc-conflist | grep -F -- "-noto-telugu.conf"

  - range: subpkgs
    name: ${{package.name}}-${{range.key}}
    dependencies:
      runtime:
        - ${{package.name}}-common
        - fontconfig
    description: ${{range.key}} font package
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/fonts/noto

          for font in $(./noto-meta font-basenames "${{range.key}}"); do
            find "${{targets.destdir}}/usr/share/fonts/" -name "$font-*.ttf" -exec cp {} "${{targets.contextdir}}/usr/share/fonts/" \;
          done

          # Create directories for font configuration
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.d/"
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.avail/"

          # Process the configuration files
          for f in "${{targets.destdir}}/etc/fonts/conf.avail/"*.conf; do
              full_filename=$(basename "$f")
              font_name=$(echo "$full_filename" | sed -E 's/^[^-]+-[^-]+-([^.]+)\.conf/\1/')

              # Only continue if the font name matches the basename
              if [ "${{range.key}}" != "$font_name" ]; then
                  continue
              fi

              # Copy the config file to the context directory
              cp "${{targets.destdir}}/etc/fonts/conf.avail/$full_filename" "${{targets.contextdir}}/etc/fonts/conf.avail/$full_filename"

              # Create a symbolic link for the config file
              ln -s "/etc/fonts/conf.avail/$full_filename" "${{targets.contextdir}}/etc/fonts/conf.d/$full_filename"
          done
    test:
      pipeline:
        - uses: test/fonts

update:
  enabled: true
  github:
    identifier: notofonts/notofonts.github.io
    strip-prefix: noto-monthly-release-
    use-tag: true
    tag-filter: noto-monthly-release-

test:
  pipeline:
    - uses: test/fonts
    - name: The source-built families arrive through their own packages
      runs: |
        cd /usr/share/fonts/noto
        for family in NotoRashiHebrew NotoSans NotoSansHebrew NotoSansMono NotoSansSymbols \
                      NotoSansSymbols2 NotoSansThai NotoSansThaiLooped NotoSerif NotoSerifHebrew \
                      NotoSerifThai NotoKufiArabic NotoNaskhArabic NotoNaskhArabicUI NotoSansArabic \
                      NotoSansArabicUI NotoSansDevanagari NotoSerifDevanagari NotoSansMath \
                      NotoSansArmenian NotoSansEthiopic NotoSansGeorgian NotoSansGujarati \
                      NotoSansGurmukhi NotoSansKannada NotoSansKhmer NotoSansLao NotoSansLaoLooped \
                      NotoSansMalayalam NotoSansMyanmar NotoSansSinhala NotoSansTamil NotoSansTelugu \
                      NotoSerifArmenian NotoSerifBengali NotoSerifDisplay NotoSerifEthiopic \
                      NotoSerifGeorgian NotoSerifKhmer NotoSerifLao NotoSerifSinhala NotoSerifTamil \
                      NotoSansGujaratiUI NotoSansGurmukhiUI NotoSansKannadaUI NotoSansMalayalamUI \
                      NotoSansTamilUI NotoSansTeluguUI; do
          test -f "$family-Regular.ttf" || { echo "FAIL: $family-Regular.ttf missing"; exit 1; }
        done
        fc-cache -f
        fc-list | grep -F "Noto Sans Hebrew"
