            fc-cache -f
            fc-list | grep -F "Noto Sans Ethiopic"
            fc-list | grep -F "Noto Serif Ethiopic"
            fc-conflist | grep -F -- "-noto-ethiopic.conf"

  # Every family of this script is built from source in its own package;
  # this subpackage keeps the name images depend on and the fontconfig
  # snippet, and pulls the family packages in.
  - name: ${{package.name}}-georgian
    description: georgian font package
    dependencies:
      runtime:
        - ${{package.name}}-common
        - font-noto-sans-georgian
        - font-noto-serif-georgian
        - fontconfig
    pipeline:
      - runs: |
