#nolint:valid-pipeline-git-checkout-tag
package:
  name: font-samyak
  version: 0_git20240220
  epoch: 3
  description: Samyak font family
  copyright:
    - license: GPL-3.0-or-later

environment:
  contents:
    packages:
      - busybox
      - fontforge

# Built from the FontForge .sfd sources with upstream's own generate.pe (the
# same script Debian's packaging runs) instead of installing the TTFs
# committed next to them. The generated fonts render identically to the
# committed ones (unhinted raster comparison of every mapped code point).
pipeline:
  - uses: git-checkout
    with:
      repository: https://salsa.debian.org/fonts-team/fonts-samyak
      branch: master
      expected-commit: 8a6cbfb1e6d6b2abb4b700d9fce6ea05754f80d5

data:
  - name: fonts
    items:
      devanagari: Samyak Devanagari
      gujarati: Samyak Gujarati
      malayalam: Samyak Malayalam
      oriya: Samyak Oriya
      tamil: Samyak Tamil

subpackages:
  - range: fonts
    name: ${{package.name}}-${{range.key}}
    description: "${{range.key}} font"
    pipeline:
      - name: Build the font from its .sfd source
        runs: |
          cd ${{range.key}}
          # FontForge takes the head and FFTM timestamps from the source's
          # mtime; pin it so the build is reproducible.
          touch -d "@${SOURCE_DATE_EPOCH:-0}" ./*.sfd
          rm -f ./*.ttf
          mkdir -p TTFfiles
          fontforge -lang=ff -script ../generate.pe Samyak_*.sfd
          test "$(ls TTFfiles/*.ttf | wc -l)" -eq 1
          mkdir -p "${{targets.subpkgdir}}"/usr/share/fonts/samyak
          install -D -m644 TTFfiles/*.ttf -t "${{targets.subpkgdir}}"/usr/share/fonts/samyak
    test:
      environment:
        contents:
          packages:
            - fontconfig
      pipeline:
        - uses: test/fonts
        - name: fontconfig sees the family
          runs: |
            fc-cache -f
            fc-list | grep -F "${{range.value}}"

update:
  enabled: false
  exclude-reason: No releases or tags

test:
  pipeline:
    - uses: test/emptypackage
