# 2.13b171 is the latest version in github releases: https://github.com/stipub/stixfonts/releases
package:
  name: font-stix-otf-arm
  version: 2.13
  epoch: 2
  description: stix-otf fonts
  copyright:
    - license: OFL-1.1
  target-architecture:
    - aarch64
  dependencies:
    provides:
      - font-stix-otf=${{package.full-version}}

vars:
  tag-suffix: b171

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/stipub/stixfonts
      tag: v${{package.version}}${{vars.tag-suffix}}
      expected-commit: 744a22a4dd626cd14d75728aef34fc8ad7c85db0

  - runs: |
      pkgname=${{package.name}}
      destfontdir="${{targets.destdir}}/usr/share/fonts/${pkgname#font-}"
      mkdir -p "$destfontdir"
      install -Dm644 ./fonts/static_otf/*.otf "$destfontdir/"

update:
  enabled: false
  exclude-reason: We're currently fetching from the latest release, 2.13 b171, which appears to be a one-off build. We should keep an eye out for any similar builds in the future.
  github:
    identifier: stipub/stixfonts

test:
  pipeline:
    - uses: test/fonts
