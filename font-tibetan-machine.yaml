package:
  name: font-tibetan-machine
  version: 0.1.0
  epoch: 3
  description: tibetan fonts
  copyright:
    - license: GPL-1.0-or-later
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: fetch
    with:
      expected-sha256: 5990eefcb1ffe53d58414e3d5f97e467c67c04bb8866f2b407a9e0e4e2c080b0
      uri: https://ftp.debian.org/debian/pool/main/f/fonts-tibetan-machine/fonts-tibetan-machine_1.901b-5.1_all.deb
      extract: false

  - runs: |
      ar x fonts-tibetan-machine_1.901b-5.1_all.deb
      tar -xf data.tar.*
      pkgname=${{package.name}}
      destfontdir="${{targets.destdir}}/usr/share/fonts/${pkgname#font-}"
      mkdir -p "$destfontdir"
      install -Dm644 ./usr/share/fonts/truetype/tibetan-machine/*.ttf "$destfontdir/"

update:
  enabled: false
  exclude-reason: No releases or tags; upstream distributes only via Debian archive

test:
  pipeline:
    - uses: test/fonts
