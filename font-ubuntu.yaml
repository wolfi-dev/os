package:
  name: font-ubuntu
  version: "1.001"
  epoch: 1
  description: Ubuntu font family (Ubuntu, Ubuntu Mono, Ubuntu Sans and Ubuntu Sans Mono variable fonts), built from the UFO sources
  copyright:
    - license: Ubuntu-font-1.0
  resources:
    # gftools-builder compiles the instances in parallel with ninja.
    cpu: "16"
    memory: 16Gi

vars:
  # Ubuntu Mono lives in its own repository with its own release numbers;
  # v1.002 is the last tag whose family is still called "Ubuntu Mono".
  mono-version: "1.002"
  # The renamed families from the same two repositories: "Ubuntu Sans"
  # (canonical/Ubuntu-Sans-fonts v1.006) and "Ubuntu Sans Mono"
  # (canonical/Ubuntu-Sans-Mono-fonts v1.100), shipped alongside the old ones.
  sans-version: "1.006"
  sans-mono-version: "1.100"

environment:
  contents:
    packages:
      - busybox

# Built from Canonical's design sources (UFO + designspace, one repository
# per family) with upstream's own recipe, `gftools builder sources/config.yaml`,
# instead of installing the variable TTFs from Ubuntu's fonts-ubuntu source
# tarball. Only the variable fonts are installed: the four files the tarball
# shipped plus the four Ubuntu Sans / Ubuntu Sans Mono files; the statics and
# the CFF flavour upstream also builds are not.
#
# Tag choice: canonical/Ubuntu-Sans-fonts v.1001 (family "Ubuntu" 1.001) and
# canonical/Ubuntu-Sans-Mono-fonts v1.002 (family "Ubuntu Mono" 1.002) are
# the last releases under these family names; from v1.004 upstream renamed
# the families to "Ubuntu Sans" and "Ubuntu Sans Mono", and the first
# repository itself from canonical/Ubuntu-fonts to canonical/Ubuntu-Sans-fonts
# (GitHub redirects the old name; the checkouts use the current one so the
# fetch does not depend on the redirect). The 0.869 / 0.862
# binaries this package used to install were a pre-1.0 drop Canonical gave
# to Ubuntu in June 2023 that has no git tag, so this is a version bump, not
# a byte-for-byte rebuild; the differences from those binaries are the
# changes upstream made between the two (see the test and the PR).
#
# The renamed families are shipped as well, from the later tags of the same
# repositories, the way Ubuntu's own fonts-ubuntu package does since noble:
# "Ubuntu Sans" has the same glyphs, widths and coverage as "Ubuntu" but a
# taller line (ascender 940 / descender -260 instead of 932 / -189, about
# 7% more), which is why Canonical renamed it, and "Ubuntu Sans Mono" adds
# 397 code points (box drawing, braille, IPA, symbols) to "Ubuntu Mono".
# Keeping the old families under their old names means nothing that asks
# fontconfig for "Ubuntu" reflows; the new names are there for whoever asks
# for them. Both new builds are pixel-identical to the binaries Canonical
# commits at those tags (every glyph, unhinted raster); the Sans family
# needs the same named-instance override as Ubuntu, the Mono family does not.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/canonical/Ubuntu-Sans-fonts
      # Upstream spelled this tag "v.1001" (the only tag of that shape); the
      # fonts it builds carry version 1.001.
      tag: v.1001
      expected-commit: 46885e4a97f5e85d7695de46317ec4368780e3b2
      destination: ubuntu

  - uses: git-checkout
    with:
      repository: https://github.com/canonical/Ubuntu-Sans-Mono-fonts
      tag: v${{vars.mono-version}}
      expected-commit: d86bd1ea014e6cac71959b00cc1518450c9a3443
      destination: ubuntu-mono

  - uses: git-checkout
    with:
      repository: https://github.com/canonical/Ubuntu-Sans-fonts
      tag: v${{vars.sans-version}}
      expected-commit: 9554af00fb9d438a12c916df8451c10dcedc9b7e
      destination: ubuntu-sans

  - uses: git-checkout
    with:
      repository: https://github.com/canonical/Ubuntu-Sans-Mono-fonts
      tag: v${{vars.sans-mono-version}}
      expected-commit: c57353c1772eb8aaab9c539e3d42c971a03a5fcd
      destination: ubuntu-sans-mono

  # gftools' post-processing rewrites a variable font's named instances to
  # the Google Fonts convention (weights along the default width only), which
  # would leave the two Ubuntu fonts with 8 named instances. Upstream's own
  # 1.001 binaries carry 16 (the eight weights at Normal and at Condensed
  # width), so list them explicitly; the result matches upstream's files
  # instance for instance.
  - uses: fonts/gftools-build
    with:
      working-directory: ubuntu
      config: sources/config.yaml
      family: Ubuntu
      output-layout: flat
      outputs: variable
      destination: ${{targets.destdir}}/usr/share/fonts/ubuntu
      extra-config: |
        fvarInstances:
          "Ubuntu[wdth,wght].ttf":
            - {name: Thin, coordinates: {wdth: 100, wght: 100}}
            - {name: ExtraLight, coordinates: {wdth: 100, wght: 200}}
            - {name: Light, coordinates: {wdth: 100, wght: 300}}
            - {name: Regular, coordinates: {wdth: 100, wght: 400}}
            - {name: Medium, coordinates: {wdth: 100, wght: 500}}
            - {name: SemiBold, coordinates: {wdth: 100, wght: 600}}
            - {name: Bold, coordinates: {wdth: 100, wght: 700}}
            - {name: ExtraBold, coordinates: {wdth: 100, wght: 800}}
            - {name: Condensed Thin, coordinates: {wdth: 75, wght: 100}}
            - {name: Condensed ExtraLight, coordinates: {wdth: 75, wght: 200}}
            - {name: Condensed Light, coordinates: {wdth: 75, wght: 300}}
            - {name: Condensed Regular, coordinates: {wdth: 75, wght: 400}}
            - {name: Condensed Medium, coordinates: {wdth: 75, wght: 500}}
            - {name: Condensed SemiBold, coordinates: {wdth: 75, wght: 600}}
            - {name: Condensed Bold, coordinates: {wdth: 75, wght: 700}}
            - {name: Condensed ExtraBold, coordinates: {wdth: 75, wght: 800}}
          "Ubuntu-Italic[wdth,wght].ttf":
            - {name: Thin Italic, coordinates: {wdth: 100, wght: 100}}
            - {name: ExtraLight Italic, coordinates: {wdth: 100, wght: 200}}
            - {name: Light Italic, coordinates: {wdth: 100, wght: 300}}
            - {name: Italic, coordinates: {wdth: 100, wght: 400}}
            - {name: Medium Italic, coordinates: {wdth: 100, wght: 500}}
            - {name: SemiBold Italic, coordinates: {wdth: 100, wght: 600}}
            - {name: Bold Italic, coordinates: {wdth: 100, wght: 700}}
            - {name: ExtraBold Italic, coordinates: {wdth: 100, wght: 800}}
            - {name: Condensed Thin Italic, coordinates: {wdth: 75, wght: 100}}
            - {name: Condensed ExtraLight Italic, coordinates: {wdth: 75, wght: 200}}
            - {name: Condensed Light Italic, coordinates: {wdth: 75, wght: 300}}
            - {name: Condensed Italic, coordinates: {wdth: 75, wght: 400}}
            - {name: Condensed Medium Italic, coordinates: {wdth: 75, wght: 500}}
            - {name: Condensed SemiBold Italic, coordinates: {wdth: 75, wght: 600}}
            - {name: Condensed Bold Italic, coordinates: {wdth: 75, wght: 700}}
            - {name: Condensed ExtraBold Italic, coordinates: {wdth: 75, wght: 800}}

  - uses: fonts/gftools-build
    with:
      working-directory: ubuntu-mono
      config: sources/config.yaml
      family: UbuntuMono
      output-layout: flat
      outputs: variable
      destination: ${{targets.destdir}}/usr/share/fonts/ubuntu

  # Same named-instance override as for Ubuntu above: Canonical's v1.006
  # binaries carry the eight weights at both widths (16 instances), gftools'
  # post-processing would leave 8.
  - uses: fonts/gftools-build
    with:
      working-directory: ubuntu-sans
      config: sources/config.yaml
      family: UbuntuSans
      output-layout: flat
      outputs: variable
      destination: ${{targets.destdir}}/usr/share/fonts/ubuntu
      extra-config: |
        fvarInstances:
          "UbuntuSans[wdth,wght].ttf":
            - {name: Thin, coordinates: {wdth: 100, wght: 100}}
            - {name: ExtraLight, coordinates: {wdth: 100, wght: 200}}
            - {name: Light, coordinates: {wdth: 100, wght: 300}}
            - {name: Regular, coordinates: {wdth: 100, wght: 400}}
            - {name: Medium, coordinates: {wdth: 100, wght: 500}}
            - {name: SemiBold, coordinates: {wdth: 100, wght: 600}}
            - {name: Bold, coordinates: {wdth: 100, wght: 700}}
            - {name: ExtraBold, coordinates: {wdth: 100, wght: 800}}
            - {name: Condensed Thin, coordinates: {wdth: 75, wght: 100}}
            - {name: Condensed ExtraLight, coordinates: {wdth: 75, wght: 200}}
            - {name: Condensed Light, coordinates: {wdth: 75, wght: 300}}
            - {name: Condensed Regular, coordinates: {wdth: 75, wght: 400}}
            - {name: Condensed Medium, coordinates: {wdth: 75, wght: 500}}
            - {name: Condensed SemiBold, coordinates: {wdth: 75, wght: 600}}
            - {name: Condensed Bold, coordinates: {wdth: 75, wght: 700}}
            - {name: Condensed ExtraBold, coordinates: {wdth: 75, wght: 800}}
          "UbuntuSans-Italic[wdth,wght].ttf":
            - {name: Thin Italic, coordinates: {wdth: 100, wght: 100}}
            - {name: ExtraLight Italic, coordinates: {wdth: 100, wght: 200}}
            - {name: Light Italic, coordinates: {wdth: 100, wght: 300}}
            - {name: Italic, coordinates: {wdth: 100, wght: 400}}
            - {name: Medium Italic, coordinates: {wdth: 100, wght: 500}}
            - {name: SemiBold Italic, coordinates: {wdth: 100, wght: 600}}
            - {name: Bold Italic, coordinates: {wdth: 100, wght: 700}}
            - {name: ExtraBold Italic, coordinates: {wdth: 100, wght: 800}}
            - {name: Condensed Thin Italic, coordinates: {wdth: 75, wght: 100}}
            - {name: Condensed ExtraLight Italic, coordinates: {wdth: 75, wght: 200}}
            - {name: Condensed Light Italic, coordinates: {wdth: 75, wght: 300}}
            - {name: Condensed Italic, coordinates: {wdth: 75, wght: 400}}
            - {name: Condensed Medium Italic, coordinates: {wdth: 75, wght: 500}}
            - {name: Condensed SemiBold Italic, coordinates: {wdth: 75, wght: 600}}
            - {name: Condensed Bold Italic, coordinates: {wdth: 75, wght: 700}}
            - {name: Condensed ExtraBold Italic, coordinates: {wdth: 75, wght: 800}}

  - uses: fonts/gftools-build
    with:
      working-directory: ubuntu-sans-mono
      config: sources/config.yaml
      family: UbuntuSansMono
      output-layout: flat
      outputs: variable
      destination: ${{targets.destdir}}/usr/share/fonts/ubuntu

  - runs: |
      # The Ubuntu config also emits a small-caps family, "Ubuntu SC", which
      # neither Ubuntu's fonts-ubuntu package nor the previous version of this
      # one shipped; keep the file set as it was.
      rm -v "${{targets.destdir}}/usr/share/fonts/ubuntu/UbuntuSC"*.ttf
      # The v1.006 config emits the renamed small-caps family, "Ubuntu Sans
      # SC", in the same way; Ubuntu's fonts-ubuntu does not ship it either.
      rm -v "${{targets.destdir}}/usr/share/fonts/ubuntu/UbuntuSansSC"*.ttf
      # The fontconfig snippet from Ubuntu's fonts-ubuntu tarball (2011 style
      # fixes for Qt against the static fonts), carried here because the
      # sources repository does not have it. As in the previous version of this
      # package it is installed to conf.avail only and nothing links it into
      # /etc/fonts/conf.d, so it ships inactive; Ubuntu's own packaging does not
      # activate it either (its debian/*.install lists only 71-ubuntulegacy.conf).
      install -Dm644 "${{package.srcdir}}/81-ubuntu.conf" -t "${{targets.destdir}}/usr/share/fontconfig/conf.avail/"
      install -Dm644 ubuntu/LICENCE.txt "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENCE"

update:
  enabled: false
  exclude-reason: >
    Four tags from two repositories: the last "Ubuntu" / "Ubuntu Mono" tags are frozen upstream, and the "Ubuntu Sans" / "Ubuntu Sans Mono" tags are tracked by hand in vars (sans-version, sans-mono-version) since one package version cannot follow two release series.


test:
  environment:
    contents:
      packages:
        - fontconfig
        - harfbuzz-utils
        - py3.13-fonttools
        - python-3.13
  pipeline:
    - uses: test/fonts
    - name: The eight variable fonts, their families, axes, instances and versions
      runs: |
        set -u
        cd /usr/share/fonts/ubuntu
        for f in "Ubuntu[wdth,wght].ttf" "Ubuntu-Italic[wdth,wght].ttf" "UbuntuMono[wght].ttf" "UbuntuMono-Italic[wght].ttf" \
                 "UbuntuSans[wdth,wght].ttf" "UbuntuSans-Italic[wdth,wght].ttf" "UbuntuSansMono[wght].ttf" "UbuntuSansMono-Italic[wght].ttf"; do
          test -s "$f"
        done
        test "$(ls *.ttf | wc -l)" -eq 8
        python3.13 - <<'EOF'
        from fontTools.ttLib import TTFont
        # (family, version, axes, named instances as in Canonical's own binaries)
        expect = {
            "Ubuntu[wdth,wght].ttf": ("Ubuntu", "1.001", ["wdth", "wght"], 16),
            "Ubuntu-Italic[wdth,wght].ttf": ("Ubuntu", "1.001", ["wdth", "wght"], 16),
            "UbuntuMono[wght].ttf": ("Ubuntu Mono", "1.002", ["wght"], None),
            "UbuntuMono-Italic[wght].ttf": ("Ubuntu Mono", "1.002", ["wght"], None),
            "UbuntuSans[wdth,wght].ttf": ("Ubuntu Sans", "1.006", ["wdth", "wght"], 16),
            "UbuntuSans-Italic[wdth,wght].ttf": ("Ubuntu Sans", "1.006", ["wdth", "wght"], 16),
            "UbuntuSansMono[wght].ttf": ("Ubuntu Sans Mono", "1.100", ["wght"], 7),
            "UbuntuSansMono-Italic[wght].ttf": ("Ubuntu Sans Mono", "1.100", ["wght"], 4),
        }
        for path, (family, version, axes, instances) in expect.items():
            f = TTFont(path)
            name = f["name"]
            assert name.getDebugName(1) == family, (path, name.getDebugName(1))
            assert name.getDebugName(5).startswith("Version " + version), (path, name.getDebugName(5))
            assert [a.axisTag for a in f["fvar"].axes] == axes, (path, [a.axisTag for a in f["fvar"].axes])
            assert f["fvar"].instances, (path, "no named instances")
            if instances is not None:
                assert len(f["fvar"].instances) == instances, (path, len(f["fvar"].instances), instances)
            for table in ("glyf", "gvar", "GSUB", "GPOS", "cmap"):
                assert table in f, (path, table)
            # Coverage the family is used for: Latin, Greek, Cyrillic.
            cmap = f.getBestCmap()
            for cp in (0x41, 0x3A9, 0x416, 0x20AC):
                assert cp in cmap, (path, hex(cp))
        # The rename is about vertical metrics: "Ubuntu" keeps the line height
        # existing documents were laid out with, "Ubuntu Sans" has the taller
        # one upstream introduced; the old family must not have moved.
        old, new = TTFont("Ubuntu[wdth,wght].ttf")["hhea"], TTFont("UbuntuSans[wdth,wght].ttf")["hhea"]
        assert (old.ascent, old.descent) == (932, -189), (old.ascent, old.descent)
        assert (new.ascent, new.descent) == (940, -260), (new.ascent, new.descent)
        # Ubuntu Sans Mono's additional coverage over Ubuntu Mono: box drawing, braille, IPA.
        mono_new = TTFont("UbuntuSansMono[wght].ttf").getBestCmap()
        mono_old = TTFont("UbuntuMono[wght].ttf").getBestCmap()
        for cp in (0x2500, 0x2800, 0x0283):
            assert cp in mono_new, hex(cp)
        assert len(mono_new) > len(mono_old), (len(mono_new), len(mono_old))
        print("8 variable fonts: families, versions, axes, instances, metrics and coverage as expected")
        EOF
        # Shaping sanity, with a .notdef control per font.
        for f in "Ubuntu[wdth,wght].ttf" "UbuntuMono[wght].ttf" "UbuntuSans[wdth,wght].ttf" "UbuntuSansMono[wght].ttf"; do
          out="$(hb-shape --no-glyph-names --no-positions --no-clusters "$f" "Ubuntu Ωж")"
          case "$out" in *"|0|"*|"[0|"*|*"|0]") echo "FAIL: $f shapes a sample to .notdef: $out"; exit 1 ;; esac
          hb-shape --no-glyph-names --no-positions --no-clusters "$f" "$(printf '\356\200\200')" | grep -qE '^\[0\]' || { echo "FAIL: the .notdef control cannot fail on $f"; exit 1; }
        done
        fc-cache -f
        fc-match -f '%{family} %{file|basename}\n' "Ubuntu" | grep -F "Ubuntu[wdth,wght].ttf"
        fc-match -f '%{family} %{file|basename}\n' "Ubuntu:italic" | grep -F "Ubuntu-Italic[wdth,wght].ttf"
        fc-match -f '%{family} %{file|basename}\n' "Ubuntu Mono" | grep -F "UbuntuMono[wght].ttf"
        fc-match -f '%{family} %{file|basename}\n' "Ubuntu Sans" | grep -F "UbuntuSans[wdth,wght].ttf"
        fc-match -f '%{family} %{file|basename}\n' "Ubuntu Sans:italic" | grep -F "UbuntuSans-Italic[wdth,wght].ttf"
        fc-match -f '%{family} %{file|basename}\n' "Ubuntu Sans Mono" | grep -F "UbuntuSansMono[wght].ttf"
        test -s /usr/share/fontconfig/conf.avail/81-ubuntu.conf
