package:
  name: font-xproto
  version: 7.0.31
  epoch: 9 # add strip, ldd-check, and functional header test
  description: X.org font xproto
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 4Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - pkgconf-dev
      - util-macros-dev

pipeline:
  - uses: git-checkout
    with:
      # TODO: This repository is deprecated and archived - can we drop this package?
      repository: https://gitlab.freedesktop.org/xorg/proto/xproto
      tag: xproto-${{package.version}}
      expected-commit: f3b7b856777500113cee524dbd295fcbbce11fab

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: font-xproto-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf

test:
  environment:
    contents:
      packages:
        - build-base
        - font-xproto-dev
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/xml-syntax-check
    - runs: |
        # Verify the xproto headers are usable by compiling a small program
        cat > /tmp/test_xproto.c << 'EOF'
        #include <X11/Xproto.h>
        #include <X11/X.h>
        int main(void) {
          xConnSetup setup;
          (void)setup;
          return 0;
        }
        EOF
        gcc -o /tmp/test_xproto /tmp/test_xproto.c $(pkgconf --cflags xproto)
        echo "xproto header compile test passed"

update:
  enabled: true
  release-monitor:
    identifier: 13650
