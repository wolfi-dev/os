#nolint:depends-on-unversioned-py-provides
package:
  name: fontforge
  version: "20251009"
  epoch: 7
  description: Free (libre) font editor
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - gnu-libiconv-dev
      - libspiro
      # fontforge types an image file with glib's g_content_type_guess
      # (GFileMimeType in gutils/fsys.c). Without the shared mime database
      # that guess is uncertain, so it falls back to its own extension
      # table, which covers png, gif, jpeg, xbm and xpm but not bmp or
      # tiff; importing either of those raises "Could not load image file".
      #
      # potrace is deliberately NOT a runtime dependency, though autoTrace()
      # shells out to it. With potrace installed, autoTrace() on a freshly
      # imported bitmap segfaults in the apk-built binary, reliably in a
      # clean working directory; without it the call silently produces no
      # contours. Not upstream's bug as far as we can tell: in the same
      # container and with the same script, a plain cmake Release build of
      # this exact source completes it, so does one with our -flto=auto
      # flags, and so does upstream master. The cause is not isolated.
      # Declaring potrace would turn a quiet no-op into a crash, so it stays
      # out until it is.
      - py3-setuptools
      - shared-mime-info
      - woff2-dev
  resources:
    cpu: "7"
    memory: 12Gi

vars:
  import: fontforge

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - freetype-dev
      - giflib-dev
      - glibc-2.44-dev
      - gnu-libiconv-dev
      - gtk-3-dev
      - libspiro-dev
      - libxml2-dev
      - pango-dev
      - potrace
      - py3-supported-build-base-dev
      - python3-dev
      - readline-dev
      - samurai
      - tiff-dev
      - woff2-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fontforge/fontforge
      expected-commit: c41bdb922285f35defd1e1385adfd13bde1ab32a
      tag: ${{package.version}}

  # 20251009 writes only four hmtx entries for a fixed-pitch font, so every
  # glyph after the fourth inherits its advance: zero-width marks in a
  # monospace font come out one cell wide. Affected here: culmus's Miriam
  # Mono CLM (now) and FreeMono in font-freefont (on its next rebuild; its
  # sources have 199 zero-width glyphs, its 2012 release binaries had them
  # at 600). Not affected: DejaVu Sans Mono, Mitra Mono and Symbols Nerd
  # Font Mono, whose inputs have no zero-width glyphs. Upstream fix, merged
  # 2025-12-08 (nerd-fonts' font-patcher warns about exactly this build and
  # asks for a FontForge after that commit); drop with the next release.
  - uses: patch
    with:
      patches: 5702-fixed-pitch-hmtx.patch

  # The December 2025 ZDI batch against FontForge (CVE-2025-15269 through
  # CVE-2025-15280, all in the SFD/PFB/image parsers) postdates the 20251009
  # release; upstream has fixed four of the twelve on master as of
  # 2026-10-01 and these are those commits, unchanged: #5722 (15269,
  # use-after-free in SFD ligature parsing), #5743 (15270, kern class array
  # index), #5721 (15275, SFD image size), #5720 + #5723 (15279, BMP RLE
  # decompression). The other eight (15271-15274, 15276-15278, 15280) have no
  # upstream fix yet (fontforge/fontforge#5706 is the tracking issue).
  - uses: patch
    with:
      patches: CVE-2025-15269.patch CVE-2025-15270.patch CVE-2025-15275.patch CVE-2025-15279.patch

  # The two commits above bound only the 8-bit branch of the BMP RLE reader.
  # The 4-bit branch of the same function overflows the same buffer, and
  # CVE-2025-15279's report is not specific enough to say which depth it
  # hit (ZDI's PoC is not public). Bound the 4-bit branch the same way, so
  # the advisory event for 15279 can say fixed for the function as a whole;
  # this also covers fontforge/fontforge#5808, which upstream closed
  # unfixed. Local, no upstream commit to track.
  - uses: patch
    with:
      patches: 5808-bmp-rle4-bounds.patch

  # Upstream #5681 (merged 2026-02-06, after 20251009): enum ps_flags and
  # enum ttf_flags share one flag word and overlapped, so generate() with
  # 'no-hints' (ps_flag_nohints == ttf_flag_no_outlines) wrote a font with
  # no CFF or glyf table at all (fontforge/fontforge#5678); font-freefont
  # and the Noto Sans Duployan generator both had to drop the flag to work
  # around it. Backported by hand because 20251009 still has
  # ttf_flag_fake_map (see the patch header); drop with the next release.
  - uses: patch
    with:
      patches: 5681-ps-ttf-flag-collision.patch

  - runs: |
      mkdir -p build
      export CFLAGS="$CFLAGS -flto=auto -I/usr/include/gnu-libiconv"
      export CXXFLAGS="$CXXFLAGS -flto=auto -I/usr/include/gnu-libiconv"
      cd build
      cmake \
      	-DCMAKE_BUILD_TYPE=Release \
      	-DCMAKE_INSTALL_PREFIX=/usr \
      	-DENABLE_MAINTAINER_TOOLS=TRUE \
      	-DENABLE_FONTFORGE_EXTRAS=TRUE \
        -DENABLE_GUI=OFF \
        -DENABLE_LIBSPIRO=ON \
        -DENABLE_LIBREADLINE=ON \
        -DENABLE_WOFF2=ON \
        -DENABLE_DOCS=OFF \
      	-DUNIX=TRUE \
      	..
      make

      make DESTDIR="${{targets.destdir}}" install

  - uses: strip

subpackages:
  - name: fontforge-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - fontforge
    description: fontforge dev
    # test added by a robot. The APK was empty when it was checked,
    # which may not be true forever. If this test fails in the future, please
    # replace it with a more accurate test.
    test:
      pipeline:
        - uses: test/emptypackage

  - range: py-versions
    name: py${{range.key}}-fontforge
    description: Python ${{range.key}} bindings for fontforge
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-fontforge
    pipeline:
      - runs: |
          PYVER="${{range.key}}"
          # See
          # https://github.com/wolfi-dev/os/issues/41647#issuecomment-2655627111
          # for an explanation on why this is done.
          cd build
          cmake \
            -DPython3_EXECUTABLE=/usr/bin/python${PYVER} \
            -DPYHOOK_INSTALL_DIR=lib/python${PYVER}/site-packages . || true
          # The first invocation of cmake can fail, but calling it
          # again works
          cmake \
            -DPython3_EXECUTABLE=/usr/bin/python${PYVER} \
            -DPYHOOK_INSTALL_DIR=lib/python${PYVER}/site-packages .
          make
          make DESTDIR="${{targets.destdir}}" install
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/python${PYVER}/site-packages
          mkdir -p "${{targets.subpkgdir}}"/usr/share/fontforge/python
          # use find and exec to move them to the right place
          find ${{targets.destdir}}/usr/lib/python${PYVER}/site-packages -name "fontforge.so" -exec mv {} "${{targets.subpkgdir}}"/usr/lib/python${PYVER}/site-packages \;
          find ${{targets.destdir}}/usr/lib/python${PYVER}/site-packages -name "psMat.so" -exec mv {} "${{targets.subpkgdir}}"/usr/lib/python${PYVER}/site-packages \;
          mv ${{targets.destdir}}/usr/share/fontforge/python "${{targets.subpkgdir}}"/usr/share/fontforge/python
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: fontforge-doc
    pipeline:
      - uses: split/manpages
    description: fontforge manpages
    test:
      pipeline:
        - uses: test/docs

  - name: py3-supported-fontforge
    description: meta package providing fontforge bindings for supported Python versions
    dependencies:
      runtime:
        - py3.10-fontforge
        - py3.11-fontforge
        - py3.12-fontforge
        - py3.13-fontforge
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  github:
    identifier: fontforge/fontforge

test:
  # shared-mime-info is a runtime dependency of the package now, so the test
  # environment gets it from there rather than declaring it; the bitmap test
  # below fails if that declaration is dropped.
  pipeline:
    # AUTOGENERATED
    - runs: |
        acorn2sfd --version
        dewoff --version
        fontforge --version
        fontimage --version
        fontlint --help
        pcl2ttf --version
        pfadecrypt --version
        sfddiff --version
        woff --version
        acorn2sfd --help
        dewoff --help
        fontforge --help
        fontimage --help
        pcl2ttf --help
        pfadecrypt --help
        sfddiff --help
        woff --help
    - uses: test/tw/ldd-check
    # Regression check for 5702-fixed-pitch-hmtx.patch: a fixed-pitch font
    # with a zero-width mark must keep the mark at zero advance after a
    # TrueType round trip. Unpatched 20251009 wrote only four hmtx entries
    # and reported 600 here.
    - name: Fixed-pitch fonts keep zero-width marks after generate()
      runs: |
        cd "$(mktemp -d)"
        fontforge -lang=py -script - <<'EOF'
        import fontforge
        font = fontforge.font()
        font.encoding = "UnicodeFull"
        font.em = 1000
        for cp in (0x41, 0x42, 0x43, 0x44, 0x45, 0x46):
            g = font.createChar(cp)
            pen = g.glyphPen()
            pen.moveTo((50, 0)); pen.lineTo((50, 500)); pen.lineTo((550, 500)); pen.lineTo((550, 0)); pen.closePath()
            g.width = 600
        mark = font.createChar(0x0301)  # combining acute: drawn, zero advance
        pen = mark.glyphPen()
        pen.moveTo((-300, 600)); pen.lineTo((-250, 700)); pen.lineTo((-200, 600)); pen.closePath()
        mark.width = 0
        font.generate("fixed.ttf")
        back = fontforge.open("fixed.ttf")
        widths = {g.glyphname: g.width for g in back.glyphs()}
        assert widths["A"] == 600, widths
        assert widths["acutecomb"] == 0, widths
        print("fixed-pitch round trip keeps the zero-width mark:", widths)
        EOF
    # Regression checks for the five parser patches. Each fixture is one the
    # guard rejects: a kern class whose name length is negative
    # (CVE-2025-15270), an SFD image with a 300-entry clut (CVE-2025-15275),
    # and 8-bit and 4-bit RLE bitmaps whose first run claims 255 pixels in a
    # 16-pixel buffer (CVE-2025-15279 and 5808-bmp-rle4-bounds.patch).
    # Unpatched 20251009 segfaults on all four, so these are crash
    # regressions as well as guard checks; the two well-formed bitmaps must
    # still import, which is what pins the bound to the right value.
    - name: The SFD and BMP parsers reject the CVE fixtures
      runs: |
        cd "$(mktemp -d)"

        cat > gen.py <<'EOF'
        import struct
        import fontforge

        font = fontforge.font()
        font.encoding = "UnicodeFull"
        glyph = font.createChar(0x41)
        pen = glyph.glyphPen()
        pen.moveTo((50, 0)); pen.lineTo((50, 500)); pen.lineTo((450, 500)); pen.lineTo((450, 0)); pen.closePath()
        pen = None
        glyph.width = 500
        font.save("base.sfd")
        base = open("base.sfd").read().splitlines(True)

        # Old-style (version 2) kern class, first class-name length -1. Read in
        # SFD_GetFontMetaData, so it goes at font level; a missing subtable only
        # logs and continues, the length read still happens.
        with open("kernclass-neg.sfd", "w") as out:
            for line in base:
                if line.startswith("BeginChars:"):
                    out.write('KernClass2: 2 2 "nosuchsubtable" -1 x\n')
                out.write(line)

        # Glyph-level image claiming a 300-entry colour table (256 is the max).
        with open("clut300.sfd", "w") as out:
            for line in base:
                if line.rstrip("\n") == "EndChar":
                    out.write("Image: 4 4 1 4 300 ffffffff 0 4 1 1\n")
                    out.write("!" * 180 + "\n")
                out.write(line)

        def bmp(path, bpp, compression, pixels, colors=2):
            width = height = 4
            clut = b"".join(bytes([i * 40 % 256, i * 80 % 256, i * 120 % 256, 0]) for i in range(colors))
            header = struct.pack("<IiiHHIIiiII", 40, width, -height, 1, bpp, compression,
                                 len(pixels), 0, 0, colors, colors)
            offset = 14 + len(header) + len(clut)
            with open(path, "wb") as out:
                out.write(b"BM" + struct.pack("<IHHI", offset + len(pixels), 0, 0, offset))
                out.write(header + clut + pixels)

        # 4x4 is a 16-pixel buffer; a run of 255 overruns it.
        bmp("rle8-overflow.bmp", 8, 1, bytes([0xFF, 0x41, 0x00, 0x01]))
        bmp("rle4-overflow.bmp", 4, 2, bytes([0xFF, 0x41, 0x00, 0x01]))
        # Pins the (cnt & 1) term of the 4-bit bound: a delta to pixel 1
        # leaves the write index odd, then a 15-nibble run ends one nibble
        # past the buffer. Upstream's plain "index + count" bound accepts
        # this file and overflows; verified by building both forms.
        bmp("rle4-odd-boundary.bmp", 4, 2, bytes([0x00, 0x02, 0x01, 0x00, 0x0F, 0x11, 0x00, 0x01]))
        # Well-formed: one full-width run per row, then end of bitmap.
        bmp("rle8-ok.bmp", 8, 1, bytes([0x04, 0x01] * 4 + [0x00, 0x01]))
        bmp("rle4-ok.bmp", 4, 2, bytes([0x04, 0x11] * 4 + [0x00, 0x01]))
        print("fixtures written")
        EOF

        cat > load.py <<'EOF'
        import sys
        import fontforge

        path = sys.argv[-1]
        if path.endswith(".sfd"):
            font = fontforge.open(path)
            print("RESULT opened %d glyphs" % len(list(font.glyphs())))
        else:
            font = fontforge.font()
            font.encoding = "UnicodeFull"
            font.createChar(0x41).importOutlines(path)
            print("RESULT imported")
        EOF

        fontforge -lang=py -script gen.py

        # Each guard logs a fixed string and keeps going; a dropped patch
        # crashes instead, which fails on the missing string either way.
        for probe in "kernclass-neg.sfd:Invalid kern class name length -1" \
                     "clut300.sfd:Invalid clut length 300"; do
          fixture="${probe%%:*}"
          expected="${probe#*:}"
          fontforge -lang=py -script load.py "$fixture" > "$fixture.log" 2>&1 || true
          cat "$fixture.log"
          if grep -qF "$expected" "$fixture.log"; then
            echo "PASS: $fixture logged the guard"
          else
            echo "FAIL: $fixture did not log: $expected"
            exit 1
          fi
        done

        # The bitmap guards make the import fail rather than overflow.
        for fixture in rle8-overflow.bmp rle4-overflow.bmp rle4-odd-boundary.bmp; do
          fontforge -lang=py -script load.py "$fixture" > "$fixture.log" 2>&1 || true
          cat "$fixture.log"
          if grep -qF "Could not load image file" "$fixture.log"; then
            echo "PASS: $fixture was rejected"
          else
            echo "FAIL: $fixture was not rejected"
            exit 1
          fi
        done

        # Negative control: the bound must not reject well-formed bitmaps.
        for fixture in rle8-ok.bmp rle4-ok.bmp; do
          fontforge -lang=py -script load.py "$fixture" > "$fixture.log" 2>&1 || true
          cat "$fixture.log"
          if grep -qF "RESULT imported" "$fixture.log"; then
            echo "PASS: $fixture still imports"
          else
            echo "FAIL: $fixture no longer imports"
            exit 1
          fi
        done
    # Regression check for 5681-ps-ttf-flag-collision.patch: generate() with
    # the 'no-hints' flag must still write the outlines. Unpatched 20251009
    # produced an OTF without a CFF table and a TTF without glyf here.
    - name: generate() with no-hints keeps the outline tables
      runs: |
        cd "$(mktemp -d)"
        fontforge -lang=py -script - <<'EOF'
        import fontforge
        font = fontforge.font()
        font.encoding = "UnicodeFull"
        g = font.createChar(0x41)
        pen = g.glyphPen()
        pen.moveTo((50, 0)); pen.lineTo((50, 700)); pen.lineTo((450, 700)); pen.lineTo((450, 0)); pen.closePath()
        g.width = 500
        font.generate("nohints.otf", flags=("no-hints", "omit-instructions", "opentype"))
        font.generate("nohints.ttf", flags=("no-hints", "opentype"))
        for path, table in (("nohints.otf", "CFF "), ("nohints.ttf", "glyf")):
            with open(path, "rb") as f:
                data = f.read()
            assert table.encode() in data[:4096], (path, "no " + table + " table in the directory")
            back = fontforge.open(path)
            assert back["A"].boundingBox() == (50.0, 0.0, 450.0, 700.0), (path, back["A"].boundingBox())
        print("no-hints keeps CFF and glyf")
        EOF
    # Regression check for the shared-mime-info dependency. The fixture is a
    # BMP on purpose: fontforge's fallback extension table maps png, gif,
    # jpeg, xbm and xpm, so only bmp and tiff actually need the mime
    # database, and a PNG here would pass with shared-mime-info removed.
    # The trace half of this path is not exercised: with potrace present,
    # autoTrace() segfaults in this build (see the runtime block above).
    - name: Importing a bitmap into a glyph works
      runs: |
        cd "$(mktemp -d)"

        # Written to a file rather than piped on stdin, matching the step
        # above.
        cat > import.py <<'EOF'
        import struct

        import fontforge

        def bmp(path, width, height):
            """Writes an uncompressed 8-bit BMP whose left half is black."""
            palette = b"".join(bytes([i, i, i, 0]) for i in range(256))
            header = struct.pack("<IiiHHIIiiII", 40, width, -height, 1, 8, 0,
                                 width * height, 0, 0, 256, 256)
            offset = 14 + len(header) + len(palette)
            rows = b"".join(
                bytes(0 if x < width // 2 else 255 for x in range(width))
                for _ in range(height)
            )
            with open(path, "wb") as out:
                out.write(b"BM" + struct.pack("<IHHI", offset + len(rows), 0, 0, offset))
                out.write(header + palette + rows)

        # 32 is a multiple of 4, so each row needs no padding.
        bmp("block.bmp", 32, 32)

        font = fontforge.font()
        font.encoding = "UnicodeFull"
        glyph = font.createChar(0x41)

        # Without the mime database this raises OSError, "Could not load
        # image file", because bmp is the one case fontforge's fallback
        # extension table does not cover.
        glyph.importOutlines("block.bmp")

        # The bitmap lands in the glyph's background, so the foreground stays
        # empty; this asserts the import did not fail quietly in some other
        # way than the exception above.
        assert len(glyph.foreground) == 0, len(glyph.foreground)
        print("imported block.bmp", flush=True)
        EOF

        fontforge -lang=py -script import.py
