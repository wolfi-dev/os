#nolint:depends-on-unversioned-py-provides
package:
  name: fontforge
  version: "20251009"
  epoch: 5
  description: Free (libre) font editor
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - gnu-libiconv-dev
      - libspiro
      - py3-setuptools
      - woff2-dev
  resources:
    cpu: "7"
    memory: 12Gi

vars:
  import: fontforge

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - freetype-dev
      - giflib-dev
      - glibc-2.44-dev
      - gnu-libiconv-dev
      - gtk-3-dev
      - libspiro-dev
      - libxml2-dev
      - pango-dev
      - potrace
      - py3-supported-build-base-dev
      - python3-dev
      - readline-dev
      - samurai
      - tiff-dev
      - woff2-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fontforge/fontforge
      expected-commit: c41bdb922285f35defd1e1385adfd13bde1ab32a
      tag: ${{package.version}}

  # 20251009 writes only four hmtx entries for a fixed-pitch font, so every
  # glyph after the fourth inherits its advance: zero-width marks in a
  # monospace font come out one cell wide. Affected here: culmus's Miriam
  # Mono CLM (now) and FreeMono in font-freefont (on its next rebuild; its
  # sources have 199 zero-width glyphs, its 2012 release binaries had them
  # at 600). Not affected: DejaVu Sans Mono, Mitra Mono and Symbols Nerd
  # Font Mono, whose inputs have no zero-width glyphs. Upstream fix, merged
  # 2025-12-08 (nerd-fonts' font-patcher warns about exactly this build and
  # asks for a FontForge after that commit); drop with the next release.
  - uses: patch
    with:
      patches: 5702-fixed-pitch-hmtx.patch

  - runs: |
      mkdir -p build
      export CFLAGS="$CFLAGS -flto=auto -I/usr/include/gnu-libiconv"
      export CXXFLAGS="$CXXFLAGS -flto=auto -I/usr/include/gnu-libiconv"
      cd build
      cmake \
      	-DCMAKE_BUILD_TYPE=Release \
      	-DCMAKE_INSTALL_PREFIX=/usr \
      	-DENABLE_MAINTAINER_TOOLS=TRUE \
      	-DENABLE_FONTFORGE_EXTRAS=TRUE \
        -DENABLE_GUI=OFF \
        -DENABLE_LIBSPIRO=ON \
        -DENABLE_LIBREADLINE=ON \
        -DENABLE_WOFF2=ON \
        -DENABLE_DOCS=OFF \
      	-DUNIX=TRUE \
      	..
      make

      make DESTDIR="${{targets.destdir}}" install

  - uses: strip

subpackages:
  - name: fontforge-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - fontforge
    description: fontforge dev
    # test added by a robot. The APK was empty when it was checked,
    # which may not be true forever. If this test fails in the future, please
    # replace it with a more accurate test.
    test:
      pipeline:
        - uses: test/emptypackage

  - range: py-versions
    name: py${{range.key}}-fontforge
    description: Python ${{range.key}} bindings for fontforge
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-fontforge
    pipeline:
      - runs: |
          PYVER="${{range.key}}"
          # See
          # https://github.com/wolfi-dev/os/issues/41647#issuecomment-2655627111
          # for an explanation on why this is done.
          cd build
          cmake \
            -DPython3_EXECUTABLE=/usr/bin/python${PYVER} \
            -DPYHOOK_INSTALL_DIR=lib/python${PYVER}/site-packages . || true
          # The first invocation of cmake can fail, but calling it
          # again works
          cmake \
            -DPython3_EXECUTABLE=/usr/bin/python${PYVER} \
            -DPYHOOK_INSTALL_DIR=lib/python${PYVER}/site-packages .
          make
          make DESTDIR="${{targets.destdir}}" install
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/python${PYVER}/site-packages
          mkdir -p "${{targets.subpkgdir}}"/usr/share/fontforge/python
          # use find and exec to move them to the right place
          find ${{targets.destdir}}/usr/lib/python${PYVER}/site-packages -name "fontforge.so" -exec mv {} "${{targets.subpkgdir}}"/usr/lib/python${PYVER}/site-packages \;
          find ${{targets.destdir}}/usr/lib/python${PYVER}/site-packages -name "psMat.so" -exec mv {} "${{targets.subpkgdir}}"/usr/lib/python${PYVER}/site-packages \;
          mv ${{targets.destdir}}/usr/share/fontforge/python "${{targets.subpkgdir}}"/usr/share/fontforge/python
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: fontforge-doc
    pipeline:
      - uses: split/manpages
    description: fontforge manpages
    test:
      pipeline:
        - uses: test/docs

  - name: py3-supported-fontforge
    description: meta package providing fontforge bindings for supported Python versions
    dependencies:
      runtime:
        - py3.10-fontforge
        - py3.11-fontforge
        - py3.12-fontforge
        - py3.13-fontforge
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  github:
    identifier: fontforge/fontforge

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        acorn2sfd --version
        dewoff --version
        fontforge --version
        fontimage --version
        fontlint --help
        pcl2ttf --version
        pfadecrypt --version
        sfddiff --version
        woff --version
        acorn2sfd --help
        dewoff --help
        fontforge --help
        fontimage --help
        pcl2ttf --help
        pfadecrypt --help
        sfddiff --help
        woff --help
    - uses: test/tw/ldd-check
    # Regression check for 5702-fixed-pitch-hmtx.patch: a fixed-pitch font
    # with a zero-width mark must keep the mark at zero advance after a
    # TrueType round trip. Unpatched 20251009 wrote only four hmtx entries
    # and reported 600 here.
    - name: Fixed-pitch fonts keep zero-width marks after generate()
      runs: |
        cd "$(mktemp -d)"
        fontforge -lang=py -script - <<'EOF'
        import fontforge
        font = fontforge.font()
        font.encoding = "UnicodeFull"
        font.em = 1000
        for cp in (0x41, 0x42, 0x43, 0x44, 0x45, 0x46):
            g = font.createChar(cp)
            pen = g.glyphPen()
            pen.moveTo((50, 0)); pen.lineTo((50, 500)); pen.lineTo((550, 500)); pen.lineTo((550, 0)); pen.closePath()
            g.width = 600
        mark = font.createChar(0x0301)  # combining acute: drawn, zero advance
        pen = mark.glyphPen()
        pen.moveTo((-300, 600)); pen.lineTo((-250, 700)); pen.lineTo((-200, 600)); pen.closePath()
        mark.width = 0
        font.generate("fixed.ttf")
        back = fontforge.open("fixed.ttf")
        widths = {g.glyphname: g.width for g in back.glyphs()}
        assert widths["A"] == 600, widths
        assert widths["acutecomb"] == 0, widths
        print("fixed-pitch round trip keeps the zero-width mark:", widths)
        EOF
