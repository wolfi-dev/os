package:
  name: fontsproto
  version: 2.1.3
  epoch: 7
  description: X.org fontsproto
  copyright:
    - license: MIT-open-group
  resources:
    cpu: "1"
    memory: 4Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - pkgconf-dev
      - util-macros-dev

pipeline:
  - uses: git-checkout
    with:
      # TODO: This repository is deprecated and archived - can we drop this package?
      repository: https://gitlab.freedesktop.org/xorg/proto/fontsproto
      tag: fontsproto-${{package.version}}
      expected-commit: df8c05f7c0253a36589d96efa52938215eff9d4d

  - uses: autoconf/configure
    with:
      opts: |
        --mandir=/usr/share/man

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: fontsproto-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf

test:
  environment:
    contents:
      packages:
        - fontsproto-dev
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify fontsproto headers are installed
      runs: |
        for hdr in font.h fontproto.h fontstruct.h FS.h fsmasks.h FSproto.h; do
          if ! [ -f "/usr/include/X11/fonts/${hdr}" ]; then
            echo "ERROR: missing header /usr/include/X11/fonts/${hdr}"
            exit 1
          fi
        done
        echo "all fontsproto headers present"

update:
  enabled: true
  release-monitor:
    identifier: 13472
