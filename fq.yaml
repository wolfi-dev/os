package:
  name: fq
  version: "0.18.0"
  epoch: 6 # CVE-2026-78661
  description: "jq for binary formats - tool, language and decoders for working with binary and text formats"
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wader/fq
      tag: v${{package.version}}
      expected-commit: 6f01e5ba28957801ba6154458c0e89d1eb7e8941

  - uses: bump
    with:
      language: go
      deps: |-
        github.com/gomarkdown/markdown@v0.0.0-20260724235538-61af6e1e6971
        golang.org/x/net@v0.62.0
        golang.org/x/term@v0.47.0
        golang.org/x/text@v0.43.0
        golang.org/x/crypto@v0.58.0

  - uses: go/build
    with:
      packages: ./
      modroot: .
      output: fq
      ldflags: -X main.version=${{package.version}} -X main.commit=$(git rev-parse HEAD) -X main.date=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")
      go-package: go-1.27

  - uses: upstream-tests/go-test

  - uses: strip

update:
  enabled: true
  github:
    identifier: wader/fq
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: fq
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: fq
    - name: "Test basic JSON parsing"
      runs: |
        set -euo pipefail
        echo '{"key": "value"}' | fq .
    - name: "Test basic query operations"
      runs: |
        set -euo pipefail
        echo '{"numbers": [1,2,3,4,5]}' | fq '.numbers[]'

environment:
  contents:
    packages:
      - go-1.27
