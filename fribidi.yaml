package:
  name: fribidi
  version: "1.0.18"
  epoch: 2
  description: Free Implementation of the Unicode Bidirectional Algorithm
  copyright:
    - license: LGPL-2.1
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - meson
      - python3 # upstream-tests: test runner scripts

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fribidi/fribidi
      tag: v${{package.version}}
      expected-commit: 15393e4937aa95bcf865d92143735746aeb654fa

  - uses: meson/configure
    with:
      opts: -Db_lto=true -Dc_args=-ffat-lto-objects --buildtype=plain -Ddefault_library=both -Ddocs=false

  - uses: meson/compile

  - uses: meson/install

  - uses: upstream-tests/meson-test

  - uses: strip

subpackages:
  - name: fribidi-static
    pipeline:
      - uses: split/static
      # The fat LTO objects carry GCC bytecode next to the machine code; ship only the machine code.
      - uses: strip-lto-bytecode
    test:
      pipeline:
        - uses: test/tw/staticpackage
        - uses: test/lto-bytecode-check
    description: fribidi static

  - name: fribidi-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - fribidi
    description: fribidi dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: fribidi/fribidi
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: fribidi
    - uses: test/tw/help-check
      with:
        bins: fribidi
    - name: Test BiDi text processing
      runs: |
        # Test that fribidi processes LTR text correctly
        output=$(echo "hello world" | fribidi)
        echo "$output" | grep -F "hello world" || { echo "FAIL: LTR text not processed correctly"; exit 1; }

        # Test processing from a file
        echo "test input" > /tmp/bidi_test.txt
        fribidi /tmp/bidi_test.txt | grep -F "test input" || { echo "FAIL: File processing failed"; exit 1; }

        echo "SUCCESS: BiDi processing works correctly"
    - uses: test/tw/ldd-check
