package:
  name: fscrypt
  version: "0.3.7"
  epoch: 1 # CVE-2026-56854
  description: Go tool for managing Linux filesystem encryption
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  environment:
    BINDIR: /usr/bin
  contents:
    packages:
      - build-base
      - busybox
      - findutils
      - glibc-2.43-dev
      - go-1.27
      - linux-pam-dev
      - m4

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google/fscrypt
      tag: v${{package.version}}
      expected-commit: ddb28dae679bfe4df707959dc37211d7c9142e74

  - uses: bump
    with:
      deps: |-
        golang.org/x/crypto@v0.55.0
        golang.org/x/sys@v0.47.0
        golang.org/x/term@v0.45.0

  - runs: make BINDIR="${{targets.destdir}}/usr/bin" PREFIX="${{targets.destdir}}/usr" DESTDIR=""

  - runs: make BINDIR="${{targets.destdir}}/usr/bin" PREFIX="${{targets.destdir}}/usr" DESTDIR="" install

  - uses: strip

update:
  enabled: true
  github:
    identifier: google/fscrypt
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - runs: |
        fscrypt --version | grep ${{package.version}}

        # Make sure there are no encrypted volumes
        set +e
        fscrypt status | grep Yes
        if [ $? -eq 0 ]; then
         echo "output should have been empty, got: "
         fscrypt status
         exit 1
        fi
        set -e
        # Encrypt a volume
        fscrypt setup --force

        # Now make sure there is an encrypted volume
        fscrypt status | grep Yes
        fscrypt --help
    - uses: test/tw/ldd-check
