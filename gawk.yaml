package:
  name: gawk
  version: "5.4.1"
  epoch: 3
  description: "GNU awk pattern-matching language"
  copyright:
    - license: GPL-3.0-or-later

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      # upstream test suite uses flags only GNU's ls provides
      - coreutils
      - gettext-dev
      - glibc-2.44-dev
      # upstream test suite requires additional locales as well as localedef and posix-libc-utils
      - glibc-locale-en
      - glibc-locale-extra
      - glibc-locale-fr
      - glibc-locales
      - libtool
      - localedef
      - posix-libc-utils
      - setpriv
      - texinfo

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.savannah.gnu.org/git/gawk.git
      tag: gawk-${{package.version}}
      expected-commit: 52af7f12758da12db0ddbdb117a84e0685cd2f72

  # Upstream gawk-5.4-stable commit bf85f8a3 (awk.h hunk only; the ChangeLog
  # hunk conflicts with the 5.4.1 tag). Without it, builds without MPFR/GMP
  # have a broken NODE struct layout: untyped values stringify as "0", which
  # corrupts e.g. gcc's awk-generated options.cc.
  - uses: patch
    with:
      patches: bf85f8a3-node-alignment-without-mpfr.patch

  # git checkouts write files in index order, leaving aclocal.m4 older than
  # configure.ac, so make fires the regeneration rule and looks for
  # aclocal-1.16, which is not available. Regenerate the build system with
  # the installed autotools instead.
  - runs: |
      autoreconf -vif

  - name: Configure
    runs: |
      ./configure \
         --host=${{host.triplet.gnu}} \
         --target=${{host.triplet.gnu}} \
         --prefix=/usr \
         --datadir=/usr/share

  - uses: autoconf/make

  - name: Run the upstream test suite
    runs: |
      # The suite runs its charset tests only if locale(1) reports all of
      # en_US.UTF-8, fr_FR.UTF-8, ru_RU.UTF-8, ja_JP.UTF-8 and
      # el_GR.iso88597@euro. glibc installs the Greek one under its bare
      # name, el_GR@euro, so compile it again under the name the suite
      # expects rather than let it skip the tests. This lands in the build
      # environment's own /usr/lib/locale, outside the destdir melange
      # packages from, so it cannot leak into the apk.
      localedef -c -i el_GR@euro -f ISO-8859-7 el_GR.iso88597@euro
      locale -a | grep -Fx 'el_GR.iso88597@euro'

      # The suite has to run unprivileged: gawk refuses to use persistent
      # memory as root, so the PMA tests fail outright otherwise. Melange
      # runs pipeline steps as root, but it does provision an unprivileged
      # "build" account in the environment that nothing else uses, so borrow
      # that. chown hands it the tree first, because the suite writes as it
      # runs -- it compiles makepmafile, the fts test mkdirs below test/, and
      # every failing test leaves a _<name> file behind -- none of which it
      # could do while the checkout is still owned by root.
      chown -R build:build .
      setpriv --reuid=build --regid=build --clear-groups \
        make check

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/docs

  - name: ${{package.name}}-lang
    pipeline:
      - uses: split/locales
    description: ${{package.name}} locales
    test:
      pipeline:
        - uses: test/tw/langpackage

update:
  enabled: true
  git:
    tag-filter-prefix: gawk-
    strip-prefix: gawk-

test:
  pipeline:
    - runs: |
        awk --version
        gawk --version
        gawk-${{package.version}} --version
        gawkbug --version
        awk --help
        gawk --help
        gawk-${{package.version}} --help
        gawkbug --help
    - name: Test basic text processing
      runs: |
        set -euo pipefail

        # Test field extraction from whitespace-delimited input
        echo "hello world" | gawk '{print $2}' | grep -F "world"

        # Test with multiple fields
        echo "one two three four" | gawk '{print $3}' | grep -F "three"
    - name: Test field splitting with custom delimiter
      runs: |
        set -euo pipefail

        # Test colon-delimited field splitting
        echo "1:2:3" | gawk -F: '{print $2}' | grep -F "2"

        # Test comma-delimited field splitting
        printf "alice,30,engineer\nbob,25,designer\n" | gawk -F, '{print $1}' | grep -F "alice"
        printf "alice,30,engineer\nbob,25,designer\n" | gawk -F, '{print $1}' | grep -F "bob"
    - name: Test pattern matching
      runs: |
        set -euo pipefail

        # Test regex pattern matching - should match lines containing "ba"
        result=$(printf "foo\nbar\nbaz\n" | gawk '/ba/')
        echo "$result" | grep -F "bar"
        echo "$result" | grep -F "baz"
        count=$(printf "foo\nbar\nbaz\n" | gawk '/ba/' | wc -l)
        [ "$count" -eq 2 ] || { echo "FAIL: Expected 2 matches, got $count"; exit 1; }

        # Test BEGIN/END blocks
        result=$(printf "1\n2\n3\n" | gawk 'BEGIN{sum=0} {sum+=$1} END{print sum}')
        [ "$result" -eq 6 ] || { echo "FAIL: Expected sum=6, got $result"; exit 1; }
    - uses: test/tw/ldd-check
