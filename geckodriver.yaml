package:
  name: geckodriver
  version: "0.37.1"
  epoch: 8 # rust: 1.99->1.100
  description: A tool for exploring each layer in a docker image
  copyright:
    - license: MPL-2.0
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  rust-version: "1.100"

environment:
  contents:
    packages:
      - build-base
      - glibc-2.44-dev
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mozilla/geckodriver
      tag: v${{package.version}}
      expected-commit: 3ae7e7879ac7eb3ee6c3bde6c63959b874948d9a

  # zip 9 renamed the flate2 feature to deflate-flate2, so the manifest feature list
  # has to change together with the version. The exact pin keeps the resolved version
  # reproducible; a plain ^9 requirement makes cargo float to the newest 9.x.
  - uses: sed
    with:
      path: Cargo.toml
      pattern: '^zip = \{ version = "2\.1\.2", default-features = false, features = \["deflate-flate2", "flate2"\] \}$'
      replacement: 'zip = { version = "=9.0.0", default-features = false, features = ["deflate-flate2"] }'

  # zip 9 changed ZipFile::name() from &str to ZipResult<Cow<str>>; the only two callers
  # format it into error messages in unzip_buffer.
  - uses: sed
    with:
      path: src/capabilities.rs
      pattern: 'file\.name\(\)'
      replacement: 'file.name().as_deref().unwrap_or("<invalid>")'

  - name: Bump zip to 9.0.0 for CVE-2026-115909 and CVE-2026-115906
    runs: |
      cargo update -p zip --precise 9.0.0
      awk '/^name = "zip"$/{getline; print}' Cargo.lock | grep -qx 'version = "9.0.0"'

  - name: Configure and Build
    uses: cargo/build
    with:
      modroot: .
      output: geckodriver

  - uses: upstream-tests/cargo-test

  - uses: strip

update:
  enabled: true
  github:
    identifier: mozilla/geckodriver
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - py3-pip
        - python3
        - firefox
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: geckodriver
    - uses: test/tw/ver-check
      with:
        bins: geckodriver
    - name: Run Selenium test
      runs: |
        test -x /usr/bin/firefox
        pip3 install selenium

        python3 ./test-geckodriver.py
