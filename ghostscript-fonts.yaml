package:
  name: ghostscript-fonts
  version: "8.11"
  epoch: 2 # add mandatory test/fonts pipeline step
  description: Fonts and font metrics distributed with Ghostscript
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "2"
    memory: 3Gi

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      expected-sha256: 0eb6f356119f2e49b2563210852e17f57f9dcc5755f350a69a46a0d641a0c401
      uri: https://downloads.sourceforge.net/gs-fonts/ghostscript-fonts-std-${{package.version}}.tar.gz

  - runs: |
      install -Dm644 ./*.afm ./*.pfb ./*.pfm -t ${{targets.contextdir}}/usr/share/fonts/Type1/
      mkdir -p ${{targets.contextdir}}/usr/share/ghostscript
      ln -sfv /usr/share/fonts/Type1 ${{targets.contextdir}}/usr/share/ghostscript/fonts

update:
  enabled: true
  release-monitor:
    identifier: 21444

test:
  environment:
    contents:
      packages:
        - file
        - py3-fonttools
  pipeline:
    - name: check font files
      runs: |
        # Verify expected file types are present
        stat /usr/share/fonts/Type1/*.pfm
        stat /usr/share/fonts/Type1/*.pfb
        stat /usr/share/fonts/Type1/*.afm
        stat /usr/share/ghostscript/fonts/*.pfm
        stat /usr/share/ghostscript/fonts/*.pfb
        stat /usr/share/ghostscript/fonts/*.afm
        # Validate PostScript Type 1 outlines and metrics
        for f in /usr/share/fonts/Type1/*.pfb /usr/share/fonts/Type1/*.pfa; do
          [ -f "$f" ] || continue
          file "$f" | grep -Ei ": PostScript .*font"
        done
        for f in /usr/share/fonts/Type1/*.afm; do
          [ -f "$f" ] || continue
          file "$f" | grep -Ei ": (ASCII font metrics|.*font)"
        done
        # Validate .pfm files: Windows binary metric files; accept by extension
        for f in /usr/share/fonts/Type1/*.pfm; do
          [ -f "$f" ] || continue
          file "$f" | grep -Ei ": .*font" || \
            echo "Accepting $f as a known Type 1 font metrics file"
        done
        echo "All ghostscript-fonts files validated."
