package:
  name: git-credential-oauth
  version: "0.18.0"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.3
  description: "A Git credential helper that securely authenticates to GitHub, GitLab and BitBucket using OAuth"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - git
  resources:
    cpu: "1"
    memory: 4Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hickford/git-credential-oauth
      tag: v${{package.version}}
      expected-commit: 8d57f6a92acc2bb1215efdd22ede0d2f8809fc72

  - uses: go/build
    with:
      ldflags: |
        -X main.version=v${{package.version}}
      output: git-credential-oauth
      packages: .
      go-package: go-1.27

update:
  enabled: true
  github:
    identifier: hickford/git-credential-oauth
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - runs: |
        output=$(git-credential-oauth -verbose 2>&1 || true)
        echo "$output" | grep ${{package.version}}

environment:
  contents:
    packages:
      - go-1.27
