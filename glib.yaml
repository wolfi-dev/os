#nolint:unused-var-transform
package:
  name: glib
  version: "2.90.1"
  epoch: 2
  description: Common C routines used by Gtk+ and other libs
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    runtime:
      # dlopen()ed by GChecksum/GHmac, so not picked up as a so: dependency
      - openssl-${{vars.openssl-version}}-libcrypto
  resources:
    cpu: "2"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # build uses rst2man from py3-docutils and also invokes 'python3'
  # installed /usr/bin/gtester-report gets correct shbang (/usr/bin/python3.XX)
  python-version: 3.13
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - bzip2-dev
      - ca-certificates-bundle
      - docbook-xml
      - gettext-dev
      - glibc-2.44-dev
      - libffi-dev
      - libmount
      - libxml2-utils
      - libxslt
      - libxslt-dev
      - meson
      - openssl-${{vars.openssl-version}}-dev
      - pcre2-dev
      - py${{vars.python-version}}-docutils-bin
      - python-${{vars.python-version}}
      - util-linux-dev
      - zlib-dev

# creates a new var that contains only the major and minor version to be used in the fetch URL
# e.g. 2.74.3 will create a new var mangled-package-version=2.74
var-transforms:
  - from: ${{package.version}}
    match: (\d+\.\d+)\.\d+
    replace: $1
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.gnome.org/GNOME/glib.git
      tag: ${{package.version}}
      expected-commit: e05063ccc6c8f222465a1080927f4c14349f3de6

  # Route GChecksum/GHmac through libcrypto so they honour the OpenSSL config
  # (FIPS provider in FIPS images); enabled with -Dopenssl=true below.
  - uses: patch
    with:
      patches: 0001-Add-an-OpenSSL-backend-for-GChecksum-and-GHmac.patch
      fuzz: "0"

  - uses: meson/configure
    with:
      opts: |
        -Db_lto=true \
        -Dc_args=-ffat-lto-objects \
        --default-library=shared \
        -Dman=true \
        -Dopenssl=true \
        -Dtests=false

  - uses: meson/compile

  - name: Run upstream checksum and hmac tests against the OpenSSL backend
    runs: |
      # -Dtests=true would LTO-link every glib test; build only these two.
      for t in checksum hmac; do
        cc -o output/test-$t glib/tests/$t.c -I. -Iglib -Ioutput -Ioutput/glib \
          -Loutput/glib -lglib-2.0
        LD_LIBRARY_PATH=output/glib ./output/test-$t
      done

  - uses: meson/install

  # Static archives keep GLib's built-in GChecksum/GHmac: statically linked
  # programs can't use the OpenSSL FIPS provider either way.
  - uses: meson/configure
    with:
      output-dir: output-static
      opts: |
        -Db_lto=true \
        -Dc_args=-ffat-lto-objects \
        --default-library=static \
        -Dman=false \
        -Dtests=false

  - uses: meson/compile
    with:
      output-dir: output-static

  - name: Install the static archives
    runs: |
      for lib in glib gobject gio gmodule gthread girepository; do
        install -Dm644 output-static/$lib/lib$lib-2.0.a \
          "${{targets.destdir}}"/usr/lib/lib$lib-2.0.a
      done

  - name: update shbang
    runs: |
      # replace usr/bin/env python3
      d=${{targets.destdir}}/usr/bin
      # change '/usr/bin/env python3' or '/usr/bin/python3' to /usr/bin/python3.XX
      op='1s,^#!/usr/bin/\(env python3\|python3\)$,#!/usr/bin/python${{vars.python-version}},'
      for f in "$d"/*; do
         [ -f "$f" ] || continue
         sed -i -e "$op" "$f";
      done

  - uses: strip

subpackages:
  - name: glib-doc
    description: glib docs
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

  - name: glib-static
    pipeline:
      - uses: split/static
      # The fat LTO objects carry GCC bytecode next to the machine code; ship only the machine code.
      - uses: strip-lto-bytecode
    test:
      environment:
        contents:
          packages:
            - binutils
            - build-base
            - glib-dev
            - pkgconf
      pipeline:
        - uses: test/tw/staticpackage
        - uses: test/lto-bytecode-check
        - name: Static libglib keeps the built-in GChecksum/GHmac
          runs: |
            # libcrypto is not linked, so static linkers must not be told to link it
            if pkg-config --print-requires-private glib-2.0 | grep libcrypto; then exit 1; fi
            if nm /usr/lib/libglib-2.0.a 2>/dev/null | grep -E " U (EVP_|dlopen)"; then exit 1; fi
            # Fully static, hashing from GLib threads, under an OpenSSL config
            # that offers nothing: only the built-in code passes
            cc -static-pie -fPIE -DGLIB_STATIC_COMPILATION -DNO_LIBCRYPTO \
              -o static-test checksum-openssl-test.c $(pkg-config --cflags glib-2.0) \
              /usr/lib/libglib-2.0.a -lpcre2-8 -latomic -lm -pthread
            if readelf -d static-test | grep NEEDED; then exit 1; fi
            ./static-test default
            OPENSSL_CONF=restricted-openssl.cnf ./static-test default
    dependencies:
      runtime:
        - gettext-static
        - zlib-static
    description: glib static

  - name: glib-dev
    pipeline:
      - uses: split/dev
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mkdir -p ${{targets.subpkgdir}}/usr/share
          find ${{targets.destdir}}/usr/bin ! -name "glib-compile-schemas" -a \( \
              -name "gdbus-codegen" -o \
              -name "gobject-query" -o \
              -name "gresource" -o \
              -name "gtester*" -o \
              -name "glib-*" \) \
              -exec mv {} ${{targets.subpkgdir}}/usr/bin \;
          mv ${{targets.destdir}}/usr/share/gdb ${{targets.subpkgdir}}/usr/share/
          mv ${{targets.destdir}}/usr/share/glib-2.0 ${{targets.subpkgdir}}/usr/share/
    dependencies:
      runtime:
        - glib
        - bzip2-dev
        - gettext-dev
        - libxml2-utils
        - libxslt
        - libffi-dev # needed by gobject-2.0 when building gobject-introspection
        - pcre2-dev # needed by glib-2.0 when building gobject-introspection
        - util-linux-dev # needed by gio-2.0 when building gobject-introspection
        - docbook-xml
      provides:
        - gio=${{package.full-version}}
        - gobject=${{package.full-version}}
        - gthread=${{package.full-version}}
    description: glib dev
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: |
              gdbus-codegen
              glib-compile-resources
              glib-genmarshal
              glib-gettextize
              glib-mkenums
              gobject-query
              gresource
              gtester
              gtester-report
        - uses: test/tw/ver-check
          with:
            bins: |
              glib-compile-resources
              glib-genmarshal
              glib-gettextize
              glib-mkenums
              gobject-query
              gtester
              gtester-report
            version: ${{package.version}}
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}

  - name: glib-lang
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share
          mv ${{targets.destdir}}/usr/share/locale ${{targets.subpkgdir}}/usr/share/
    description: glib lang
    test:
      pipeline:
        - uses: test/tw/langpackage

update:
  enabled: true
  git: {}
  ignore-regex-patterns:
    - GLIB.* # Not relevant tags
    - ^FOR_GNOME_.*
    - ^gobject_.*
    - ^glib-.*-branchpoint$
    - ^glib-2\.25\.7$
    - ^GTK_.*
    - ^start$
    - ^EAZEL-.*
    - ^R_.*_core$
    - ^GOBJECT_.*
    - ^GNOME_PRINT_.*

test:
  environment:
    contents:
      packages:
        - build-base
        - glib-dev
        - openssl-${{vars.openssl-version}}-dev
        - pkgconf
        - posix-libc-utils
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: |
          gapplication
          gdbus
          gi-compile-repository
          gi-decompile-typelib
          gi-inspect-typelib
          gio
          gio-querymodules
          glib-compile-schemas
    - uses: test/tw/ver-check
      with:
        bins: |
          gapplication
          gi-compile-repository
          gi-decompile-typelib
          gio
          glib-compile-schemas
        version: ${{package.version}}
    - uses: test/tw/ldd-check
    - name: GChecksum and GHmac are backed by libcrypto
      runs: |
        # dlopen()ed, not linked
        grep -F 'libcrypto.so.4' /usr/lib/libglib-2.0.so.0
        if ldd /usr/lib/libglib-2.0.so.0 | grep libcrypto; then exit 1; fi
        cc -o checksum-openssl-test checksum-openssl-test.c \
          $(pkg-config --cflags --libs glib-2.0) -lcrypto
        ./checksum-openssl-test default
        OPENSSL_CONF=/dev/null ./checksum-openssl-test default
        # Providers offering nothing: every constructor must fail, so no
        # built-in fallback exists
        OPENSSL_CONF=restricted-openssl.cnf ./checksum-openssl-test restricted
