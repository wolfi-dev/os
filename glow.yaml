package:
  name: glow
  version: "3.0.0"
  epoch: 0 # GO-2026-5970
  description: Render markdown on the CLI, with pizzazz!
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 4Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/charmbracelet/glow
      tag: v${{package.version}}
      expected-commit: add5e7a1f63cf0b1de4dfb457c147986e1b1d1fb

  - uses: go/build
    with:
      packages: .
      ldflags: |
        -X main.Version=${{package.version}}
        -X main.CommitSHA=$(git rev-parse HEAD)
        -X main.CommitDate=$(date -u -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")
      output: glow
      go-package: go-1.26

update:
  enabled: true
  github:
    identifier: charmbracelet/glow
    strip-prefix: v

test:
  pipeline:
    - runs: |
        glow --version
        glow --help

environment:
  contents:
    packages:
      - go-1.26
