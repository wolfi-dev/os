# Generated from https://git.alpinelinux.org/aports/plain/main/glslang/APKBUILD
package:
  name: glslang
  version: 1.4.357.0
  epoch: 0
  description: Khronos reference front-end for GLSL, ESSL, and sample SPIR-V generator
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - spirv-tools
  resources:
    cpu: "1"
    memory: 6Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - gcc-14-default
      - glibc-2.44-dev
      - python3
      - samurai
      - spirv-tools
      - spirv-tools-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 168d452a4f460d24b588fed08477a81c44ee27a1
      repository: https://github.com/KhronosGroup/glslang
      tag: vulkan-sdk-${{package.version}}

  - runs: |
      cmake -B build-shared -G Ninja \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_BUILD_TYPE=MinSizeRel \
        -DBUILD_SHARED_LIBS=ON \
        -DENABLE_CTEST=ON \
        -DALLOW_EXTERNAL_SPIRV_TOOLS=ON
      cmake --build build-shared

      sed -i '/add_library(glslang-default-resource-limits/ s/$/ STATIC/' StandAlone/CMakeLists.txt
      cmake -B build-static -G Ninja \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_BUILD_TYPE=MinSizeRel \
        -DBUILD_SHARED_LIBS=OFF \
        -DENABLE_CTEST=ON \
        -DALLOW_EXTERNAL_SPIRV_TOOLS=ON
      cmake --build build-static

      DESTDIR="${{targets.destdir}}" cmake --install build-static
      DESTDIR="${{targets.destdir}}" cmake --install build-shared

  - uses: strip

subpackages:
  - name: glslang-static
    pipeline:
      - uses: split/static
    description: glslang static
    test:
      pipeline:
        - uses: test/tw/staticpackage

  - name: glslang-libs
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          find ${{targets.destdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib/libglslang.so* ${{targets.subpkgdir}}/usr/lib/
    dependencies:
      runtime:
        - spirv-tools
    test:
      pipeline:
        - uses: test/tw/ldd-check
    description: aom libs

  - name: glslang-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - glslang
    description: glslang dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/tw/ldd-check

update:
  enabled: true
  ignore-regex-patterns:
    - candidate
  github:
    identifier: KhronosGroup/glslang
    use-tag: true
    strip-prefix: vulkan-sdk-
    tag-filter-prefix: vulkan-sdk-

test:
  pipeline:
    # spirv-remap was removed upstream in 1.4.357.0 and ported to SPIRV-Tools
    # as `spirv-opt --canonicalize-ids` (KhronosGroup/glslang#4040). Coverage
    # for it now lives in os/spirv-tools.yaml.
    - runs: |
        glslang --version
        glslangValidator --version
    - name: Test GLSL to SPIR-V compilation
      runs: |
        # Create a minimal GLSL vertex shader
        cat > /tmp/test.vert <<'EOF'
        #version 450
        void main() {}
        EOF

        # Compile the shader to SPIR-V
        glslang -V /tmp/test.vert -o /tmp/test.spv

        # Verify the SPIR-V binary was created and is non-empty
        test -s /tmp/test.spv
    - uses: test/tw/ldd-check
