package:
  name: glycin-2
  version: "2.1.5"
  epoch: 4 # split libglycin-gtk4 into glycin-2-gtk4
  description: Glycin allows to decode, edit, and create images and read metadata.
  copyright:
    - license: MPL-2.0 OR LGPL-2.1-or-later
  resources:
    cpu: "2"
    memory: 10Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  rust-version: "1.97"

environment:
  contents:
    packages:
      - aom-libs
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cairo-dev
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - gtk-4-dev
      - lcms2-dev
      - libbz2-1
      - libheif-dev
      - libjxl-dev
      - librsvg-dev
      - libseccomp-dev
      - meson
      - pkgconf-dev
      - rust-${{vars.rust-version}}
      - shared-mime-info
      - vala

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.gnome.org/GNOME/glycin.git
      tag: ${{package.version}}
      expected-commit: 62c5096eaac2c92dab84c2eb896936d8da3dd9c1

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  # Must precede glycin-2-libs so the generic split/lib below does not
  # capture libglycin-gtk4 and drag gtk-4 into every gdk-pixbuf consumer.
  - name: glycin-2-gtk4
    description: GTK 4 integration library for glycin-2
    pipeline:
      - uses: split/lib
        with:
          patterns: glycin-gtk4-2
      - runs: |
          # Keep the GlyGtk4 typelib next to the library it binds
          mkdir -p "${{targets.contextdir}}"/usr/lib/girepository-1.0
          mv "${{targets.destdir}}"/usr/lib/girepository-1.0/GlyGtk4-2.typelib "${{targets.contextdir}}"/usr/lib/girepository-1.0/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: glycin-2-libs
    description: Shared libraries for glycin-2
    pipeline:
      - uses: split/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check

  # Must precede glycin-2-dev so its .pc (the only one requiring gtk4)
  # does not force gtk-4-dev into build envs that need only core glycin.
  - name: glycin-2-gtk4-dev
    description: glycin-2 GTK 4 integration dev
    dependencies:
      runtime:
        - glycin-2-gtk4
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/include "${{targets.contextdir}}"/usr/lib/pkgconfig "${{targets.contextdir}}"/usr/share/gir-1.0 "${{targets.contextdir}}"/usr/share/vala/vapi
          mv "${{targets.destdir}}"/usr/include/glycin-gtk4-2 "${{targets.contextdir}}"/usr/include
          mv "${{targets.destdir}}"/usr/lib/libglycin-gtk4-2.so "${{targets.contextdir}}"/usr/lib/
          mv "${{targets.destdir}}"/usr/lib/pkgconfig/glycin-gtk4-2.pc "${{targets.contextdir}}"/usr/lib/pkgconfig/
          mv "${{targets.destdir}}"/usr/share/gir-1.0/GlyGtk4-2.gir "${{targets.contextdir}}"/usr/share/gir-1.0/
          mv "${{targets.destdir}}"/usr/share/vala/vapi/glycin-gtk4-2.vapi "${{targets.destdir}}"/usr/share/vala/vapi/glycin-gtk4-2.deps "${{targets.contextdir}}"/usr/share/vala/vapi/
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
        - uses: test/tw/devpackage

  - name: glycin-2-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - glycin-2
    description: glycin-2 dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
        - uses: test/tw/devpackage

update:
  enabled: true
  git:
    tag-filter-prefix: 2.

test:
  environment:
    contents:
      packages:
        - glycin-2-dev
        - build-base
        - glib-dev
        - cairo-dev
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/no-docs
    - name: Compile and link against glycin-2
      runs: |
        tee test.c <<'EOF'
        #include <glycin.h>
        int main() {
            /* Verify glycin type system is accessible */
            GType type = gly_image_get_type();
            if (type == 0) {
                return 1;
            }
            return 0;
        }
        EOF

        gcc $(pkg-config --cflags glycin-2) test.c -o test $(pkg-config --libs glycin-2)
        ./test
