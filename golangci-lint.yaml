package:
  name: golangci-lint
  version: "2.15.0"
  epoch: 2 # upstream-tests/go-test
  description: Fast linters Runner for Go
  copyright:
    - license: GPL-3.0
  dependencies:
    runtime:
      - diffutils
  resources:
    cpu: "3"
    memory: 6Gi
  test-resources:
    memory: 1Gi
    cpu: "1"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/golangci/golangci-lint
      tag: v${{package.version}}
      expected-commit: 25c5369a93aacb8cccea0d46e1569ca4a194564d

  - runs: |
      make build
      mkdir -p ${{targets.destdir}}/usr/bin/
      cp ./golangci-lint ${{targets.destdir}}/usr/bin/golangci-lint

  # These linters' testdata import third-party modules (zerolog, otel, ginkgo, ...) that go test cannot fetch with GOPROXY=off ("module lookup disabled").
  # TODO(upstream-tests): remove once upstream gates these behind -short.
  - uses: upstream-tests/go-test
    with:
      exclude-packages: ./pkg/golinters/arangolint ./pkg/golinters/clickhouselint ./pkg/golinters/exptostd ./pkg/golinters/ginkgolinter ./pkg/golinters/loggercheck ./pkg/golinters/protogetter ./pkg/golinters/spancheck ./pkg/golinters/zerologlint

update:
  enabled: true
  github:
    identifier: golangci/golangci-lint
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - bash
        - go-1.26
        - git
  pipeline:
    - uses: test/tw/ldd-check
    - name: "Verify basic commands and version"
      runs: |
        golangci-lint --version
        golangci-lint --help
    - name: "Test linting identifies issues (expected failure)"
      runs: |
        mkdir test-project
        cd test-project
        go mod init example.com/test

        # Create test file with intentional issues
        cat > main.go << 'EOF'
        package main

        func main() {
            var unused string  // Intentional unused variable
            println("Hello")
        }
        EOF

        # Run linter - should exit with non-zero code
        if golangci-lint run; then
          echo "Expected linter to fail due to unused variable"
          exit 1
        fi
    - name: "Test linting passes on clean code"
      runs: |
        cd test-project
        # Create clean test file
        cat > clean.go << 'EOF'
        package main

        func main() {
            println("Hello")
        }
        EOF

        # Should pass
        golangci-lint run clean.go
    - name: "Test specific linter enablement with expected issues"
      runs: |
        cd test-project
        # Should fail due to unused variable, but only if unused linter is enabled
        if golangci-lint run --disable-all --enable=unused main.go; then
          echo "Expected linter to fail with unused variable"
          exit 1
        fi
