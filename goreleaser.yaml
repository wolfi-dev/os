package:
  name: goreleaser
  version: "2.18.2"
  epoch: 1 # CVE-2026-81870
  description: Deliver Go binaries as fast and easily as possible
  copyright:
    - license: MIT
  resources:
    cpu: "5"
    memory: 6Gi

environment:
  environment:
    GOTOOLCHAIN: local+auto
  contents:
    packages:
      - git
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/goreleaser/goreleaser
      tag: v${{package.version}}
      expected-commit: 25a52e520f9c993711b93ea1111ed90c024e0528

  - uses: bump
    with:
      deps: |-
        go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0
        go.opentelemetry.io/otel/log@v0.21.0
        go.opentelemetry.io/otel/sdk/log@v0.21.0
        go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.21.0
        go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0
        go.opentelemetry.io/otel/sdk@v1.45.0
        go.opentelemetry.io/otel/exporters/stdout/stdoutmetric@v1.45.0
        go.opentelemetry.io/otel@v1.45.0
        go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.45.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
        go.opentelemetry.io/otel/exporters/stdout/stdouttrace@v1.45.0
        go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.45.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
        go.opentelemetry.io/otel/sdk/metric@v1.45.0
        go.opentelemetry.io/otel/trace@v1.45.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
        go.opentelemetry.io/otel/exporters/prometheus@v0.67.0
        go.opentelemetry.io/otel/metric@v1.45.0

  - uses: go/build
    with:
      packages: .
      modroot: .
      output: goreleaser
      go-package: go-1.27
      ldflags: -X main.version=${{package.version}} -X main.commit=$(git rev-parse HEAD) -X main.date=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")

update:
  enabled: true
  github:
    identifier: goreleaser/goreleaser
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - git
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: goreleaser
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: goreleaser
    - name: Test init command creates a valid config
      runs: |
        set -euo pipefail
        mkdir -p /tmp/goreleaser-test
        cd /tmp/goreleaser-test
        # Initialize a sample .goreleaser.yaml config
        goreleaser init
        # Verify the config file was created
        test -f .goreleaser.yaml
        grep -F "builds:" .goreleaser.yaml
    - name: Test check command validates config
      runs: |
        set -euo pipefail
        cd /tmp/goreleaser-test
        # Initialize a git repo so goreleaser check passes git validation
        git init
        git config user.email "test@example.com"
        git config user.name "Test"
        git remote add origin https://github.com/example/example.git
        git add .goreleaser.yaml
        git commit -m "init"
        git tag v0.0.1
        # goreleaser check validates the config file syntax and structure
        goreleaser check
    - name: Test completion generation
      runs: |
        set -euo pipefail
        # Generate shell completions and verify they are non-empty
        goreleaser completion bash > /tmp/goreleaser-bash-completion.sh
        test -s /tmp/goreleaser-bash-completion.sh
        grep -F "goreleaser" /tmp/goreleaser-bash-completion.sh

        goreleaser completion zsh > /tmp/goreleaser-zsh-completion.sh
        test -s /tmp/goreleaser-zsh-completion.sh

        goreleaser completion fish > /tmp/goreleaser-fish-completion.sh
        test -s /tmp/goreleaser-fish-completion.sh
