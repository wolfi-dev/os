package:
  name: gosu
  version: "1.20"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.3
  description: Simple Go-based setuid+setgid+setgroups+exec
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tianon/gosu
      tag: ${{package.version}}
      expected-commit: 29b939aa5bd4dc588af765b8248f6e39150d2565

  - uses: bump
    with:
      language: go
      deps: github.com/moby/sys/user@v0.4.1

  - uses: go/build
    with:
      packages: .
      output: gosu
      go-package: go-1.27

update:
  enabled: true
  github:
    identifier: tianon/gosu
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    # AUTOGENERATED
    - runs: |
        gosu --version
        gosu --help
    - name: Test user switching
      runs: |
        set -euo pipefail

        # Verify gosu can switch to nobody user and execute a command
        gosu nobody id | grep -q "uid=65534"
    - name: Test group switching
      runs: |
        set -euo pipefail

        # Verify gosu preserves group membership with user:group syntax
        gosu nobody:nobody id | grep -q "gid=65534"
    - name: Test command execution as different user
      runs: |
        set -euo pipefail

        # Verify gosu executes whoami as nobody
        gosu nobody whoami | grep -q "nobody"
