package:
  name: gradle-9
  version: "9.8.2"
  # For version upgrades check whether patches are still needed.
  # Upstream changes are being tracked in https://github.com/gradle/gradle/issues/25945
  epoch: 3 # bouncycastle 1.86
  description: A Java project management and project comprehension tool.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - gradle=${{ package.full-version }}
  resources:
    cpu: "7"
    memory: 22Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - libudev
      # note: the comment below is not the case while we evaluate the right way to build gradle we have swapped from
      # using the boostrap gradle to gradlewrapper.
      #
      # The first time this is built, it depends on gradle-stage0.yaml being built first,
      # using pre-built gradle binaries, which `provides` a gradle package at an earlier version.
      # Afterwards it depends on previous versions of this package built from source.
      - openjdk-21
      - patch
      - tini
      - zip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gradle/gradle
      tag: v${{package.version}}
      expected-commit: 8de7bcf76e785507ad92f0741ab9235a430c95e6

  - uses: bump
    with:
      packages: |-
        org.jsoup@jsoup@1.23.2
        com.fasterxml.jackson.core@jackson-databind@2.22.3
        com.fasterxml.jackson.core@jackson-core@2.22.3
      language: java
      # guava (CVE-2026-102554) and jspecify are raised through the version
      # refs in distribution.versions.toml: listing guava under packages makes
      # omnibump abort on a docs snippet (library('guava', 'g:a:v')) with
      # "conflicting edit: span ... overlaps".
      properties: properties.yaml

  - uses: patch
    with:
      patches: |
        upgrade-deps.patch
        ignore-deprecation-warnings.patch
        guava-33.7-longs-hashcode.patch
        bouncycastle-1.86.patch

  - name: "Address GHSA-rmj7-2vxq-3g9f 1/2"
    runs: |
      # Gradle 9.7.0 ships jackson-bom >= 2.18.9 (currently 2.22.0).
      # Verify the fix is present; sed is no longer needed.
      grep -E 'jackson-bom.*version.*2\.(1[89]|[2-9][0-9])' gradle/dependency-management/build.versions.toml

  - name: "Address GHSA-rmj7-2vxq-3g9f 2/2"
    runs: |
      # Gradle 9.7.0 ships jackson >= 2.18.9 (currently 2.22.0).
      # Verify the fix is present; sed is no longer needed.
      grep -E 'jackson=2\.(1[89]|[2-9][0-9])' gradle/dependency-management/shared-versions.properties

  - name: "Address GHSA-9pwp-9qqc-pr26, GHSA-ghgq-7g74-28wp, GHSA-j295-77c3-9frf"
    runs: |
      # Gradle 9.7.1 ships bouncycastle >= 1.85.
      # Verify the fix is present; sed is no longer needed.
      grep -E 'bouncycastle = "1\.(8[5-9]|9[0-9])' gradle/dependency-management/distribution.versions.toml

  - runs: |
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk

      # Per https://docs.gradle.org/current/userguide/gradle_daemon.html#sec:daemon_jvm_criteria,
      # the Daemon JVM criteria in gradle/gradle-daemon-jvm.properties take precedence over
      # JAVA_HOME.  We want to use the only available JDK, in JAVA_HOME, so we remove the file.
      rm gradle/gradle-daemon-jvm.properties

      # Do not use the gradle wrapper, ensure we're using the bootstrap version.
      ./gradlew :distributions-full:binDistributionZip

      unzip packaging/distributions-full/build/distributions/gradle-*-bin.zip
      cd gradle-*
      mkdir -p ${{targets.destdir}}/usr/share/java/gradle
      mkdir -p ${{targets.destdir}}/usr/share/java/gradle/bin
      mkdir -p ${{targets.destdir}}/usr/share/java/gradle/lib

      mv lib/* ${{targets.destdir}}/usr/share/java/gradle/lib
      mv bin/* ${{targets.destdir}}/usr/share/java/gradle/bin

      mkdir -p ${{targets.destdir}}/usr/bin
      ln -sf /usr/share/java/gradle/bin/gradle ${{targets.destdir}}/usr/bin/gradle

  # CVE-2026-111943: gradle pins google-api-client 1.34.0, whose bundled
  # google.jks and google.p12 contain AAA Certificate Services. Replace both
  # with the stores from 2.9.2, the first release that drops it; 1.34.0 loads
  # them by the same resource names.
  - uses: git-checkout
    with:
      repository: https://github.com/googleapis/google-api-java-client
      tag: v2.9.2
      expected-commit: fcc45f670379e3a1d87182f2e7d5e351b9fb2a9f
      destination: google-api-java-client

  - runs: |
      jar="${{targets.destdir}}/usr/share/java/gradle/lib/plugins/google-api-client-1.34.0.jar"
      test -f "$jar"
      cd google-api-java-client/google-api-client/src/main/resources
      /usr/lib/jvm/java-21-openjdk/bin/jar uf "$jar" \
        com/google/api/client/googleapis/google.jks \
        com/google/api/client/googleapis/google.p12

update:
  enabled: true
  ignore-regex-patterns:
    - -M*
    - -RC*
  github:
    identifier: gradle/gradle
    strip-prefix: v
    use-tag: true
    tag-filter: "v9."

test:
  environment:
    contents:
      packages:
        - openjdk-17-default-jdk
        - openjdk-17-default-jvm
        - unzip
  pipeline:
    - name: Bundled Google trust stores do not contain AAA Certificate Services (CVE-2026-111943)
      runs: |
        keytool="$(ls /usr/lib/jvm/*/bin/keytool | head -n1)"
        cd "$(mktemp -d)"
        unzip -q /usr/share/java/gradle/lib/plugins/google-api-client-1.34.0.jar 'com/google/api/client/googleapis/google.*'
        for ks in com/google/api/client/googleapis/google.jks com/google/api/client/googleapis/google.p12; do
          test -s "$ks"
          "$keytool" -list -v -keystore "$ks" -storepass notasecret > list.txt
          grep -q '^Owner:' list.txt
          if grep -q 'CN=AAA Certificate Services' list.txt; then
            echo "AAA Certificate Services is in $ks"
            exit 1
          fi
        done
    - name: Verify gradle installation
      runs: |
        gradle --version || exit 1
    - name: Basic Gradle project build
      runs: |
        cat << 'EOF' > settings.gradle
        rootProject.name = 'demo'
        EOF

        cat << 'EOF' > build.gradle
        println "gradle works!"
        EOF

        gradle build --no-daemon | grep -q 'gradle works!'
        gradle build --no-daemon | grep -q 'gradle works!'
