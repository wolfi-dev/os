package:
  name: grafana-operator
  version: "5.26.0"
  epoch: 2 # add crds subpackage
  description: An operator for Grafana that installs and manages Grafana instances, Dashboards and Datasources through Kubernetes/OpenShift CRs
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "2"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana-operator/grafana-operator
      tag: v${{package.version}}
      expected-commit: 4f0097ff5dc58a0652931b4f932bfc527b2b03c2

  - uses: go/build/v2
    with:
      modroot: .
      packages: .
      output: grafana-operator

  - uses: upstream-tests/go-test

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    description: "compat package for the iamguarded grafana-operator image"
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/opt/iamguarded/grafana-operator/bin"
          chmod g+rwX "${{targets.contextdir}}/opt/iamguarded"
          ln -sf ../../../../usr/bin/grafana-operator "${{targets.contextdir}}/opt/iamguarded/grafana-operator/bin/grafana-operator"
    test:
      pipeline:
        - uses: test/tw/symlink-check
        - uses: test/tw/contains-files
          with:
            files: /opt/iamguarded/grafana-operator/bin/grafana-operator
        - uses: test/tw/help-check
          with:
            bins: /opt/iamguarded/grafana-operator/bin/grafana-operator
            expect-contains: metrics-bind-address health-probe-bind-address leader-elect

  - name: ${{package.name}}-crds
    description: Upstream CRDs for ${{package.name}} sourced from grafana/grafana-operator v${{package.version}}
    pipeline:
      - runs: |
          install -d "${{targets.contextdir}}/charts/crds"
          install -m 0644 config/crd/bases/*.yaml "${{targets.contextdir}}/charts/crds/"
    test:
      environment:
        contents:
          packages:
            - yq
      pipeline:
        - uses: test/tw/contains-files
          with:
            files: |
              /charts/crds/grafana.integreatly.org_grafanas.yaml
              /charts/crds/grafana.integreatly.org_grafanadashboards.yaml
              /charts/crds/grafana.integreatly.org_grafanadatasources.yaml
              /charts/crds/grafana.integreatly.org_grafanaserviceaccounts.yaml
        - name: Every file is a grafana.integreatly.org CRD
          runs: |
            set -- /charts/crds/*.yaml
            [ -e "$1" ] || { echo "no CRDs installed"; exit 1; }
            for f in "$@"; do
              yq -e '.kind == "CustomResourceDefinition" and .spec.group == "grafana.integreatly.org"' "$f" >/dev/null
            done
            echo "$# CRDs"

update:
  enabled: true
  github:
    identifier: grafana-operator/grafana-operator
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - bash
        - curl
        - jq
        - git
        - kubectl
        - kustomize
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: grafana-operator
    - uses: test/kwok/cluster
    - name: "Start and verify operator"
      uses: test/daemon-check-output
      with:
        setup: |
          git clone --depth=1 --branch v${{package.version}} https://github.com/grafana-operator/grafana-operator.git
          kubectl create -f grafana-operator/deploy/kustomize/base/crds.yaml
          kubectl wait --for condition=established --timeout=120s -f grafana-operator/deploy/kustomize/base/crds.yaml
          # operator 5.23+ resolves the Grafana CRD via discovery at startup; wait for it to be discoverable
          for i in $(seq 1 60); do
            kubectl get grafanas -A > /dev/null 2>&1 && break
            sleep 1
          done
          kubectl get grafanas -A
          kubectl create namespace grafana-operator-system
        start: |
          grafana-operator \
            --metrics-bind-address=:8080 \
            --health-probe-bind-address=:8081 \
            --leader-elect=false
        timeout: 30
        expected_output: |
          starting server
          Starting Controller
          Starting workers
        post: |
          curl --silent --fail http://localhost:8080/metrics
          curl --silent --fail http://localhost:8081/healthz
