package:
  name: groff
  version: "1.25.0"
  epoch: 1 # runtime-depend on glibc-iconv-common (F-217)
  description: GNU troff text-formatting system
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - groff-base
  resources:
    cpu: "4"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - glibc-2.44-dev
      - libuuid
      - perl
      - pkgconf-dev
      - sed
      - texinfo
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.savannah.gnu.org/git/groff.git
      tag: ${{package.version}}
      expected-commit: cc834ee9283cfc4873f7c3bd63d05925a4a8a1a6

  - name: git.savannah.gnu.org is flaky
    runs: git submodule set-url gnulib https://github.com/coreutils/gnulib.git

  # Building this requires netpbm, which isn't currently packaged, and the
  # pixmap hasn't changed since 2002.  We just ship a copy of the file found
  # in the 1.23.0 distribution tarball.
  - runs: cp gnu.eps doc/gnu.eps

  # Since 1.25.0 the HTML manual build copies doc/gnu.png and
  # doc/line-layout.png, which are generated files that exist only in the
  # release tarball.  Generating them needs netpbm and ImageMagick, so we
  # ship copies of the files found in the 1.25.0 distribution tarball.
  - runs: cp gnu.png line-layout.png doc/

  # Avoid git-version-gen describing the version as "dirty".
  - runs: echo "${{package.version}}" >.tarball-version

  - runs: ./bootstrap

  - uses: autoconf/configure
    with:
      opts: |
        --without-x \
        --disable-rpath

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: upstream-tests/make-check
    with:
      args: PATH=$(pwd):$PATH

  - runs: |
      rm -rf ${{targets.destdir}}/usr/lib/charset.alias
      rmdir -p ${{targets.destdir}}/usr/lib 2>/dev/null || true

      # Prevent conflict with mandoc-doc
      rm -f ${{targets.destdir}}/usr/share/man/man1/soelim.1 \
        ${{targets.destdir}}/usr/share/man/man7/roff.7
      # Remove the Swedish translation of a man page
      # https://github.com/wolfi-dev/os/issues/43212
      rm -f ${{targets.destdir}}/usr/share/man/man7/groff_mmse.7

  - uses: strip

subpackages:
  - name: groff-base
    dependencies:
      runtime:
        - glibc-iconv-common # calls iconv_open for non-UTF-8 charsets; glibc builds in only UTF-8/UCS/ASCII
    pipeline:
      - runs: |
          # contents of groff-base copied from debian (1.23.0) has these bins
          # wolfi 1.23 did not have binaries geqn gpic or gtbl, so they are removed from the list.
          # 'grog' is shipped by debian, but it is a perl script and I want to avoid the perl dep.
          ver=${{package.version}}
          moves="
          usr/bin/eqn
          usr/bin/groff
          usr/bin/grops
          usr/bin/grotty
          usr/bin/neqn
          usr/bin/nroff
          usr/bin/pic
          usr/bin/preconv
          usr/bin/soelim
          usr/bin/tbl
          usr/bin/troff
          usr/lib/groff/site-tmac
          usr/share/groff/$ver/eign
          usr/share/groff/$ver/font/devascii
          usr/share/groff/$ver/font/devlatin1
          usr/share/groff/$ver/font/devps
          usr/share/groff/$ver/font/devutf8
          usr/share/groff/current
          usr/share/groff/site-tmac"

          src=${{targets.destdir}}
          dest=${{targets.contextdir}}
          for move in ${moves}; do
            d=${move%/*}
            [ -d "$dest/$d" ] || mkdir -p "$dest/$d" || exit 1
            echo "mv <destdir>/$move -> <contextdir>/$d"
            mv "$src/$move" "$dest/$d"
          done
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: eqn groff grops grotty neqn nroff pic preconv soelim tbl troff
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: eqn groff grops grotty neqn nroff pic preconv soelim tbl troff
        - name: "preconv reads ISO-8859-2 input (glibc-iconv-common)"
          runs: |
            # Without glibc-iconv-common this conversion fails (glibc builds in only UTF-8, UCS-2/4 and ASCII).
            [ ! -e /usr/lib/gconv/gconv-modules.d/gconv-modules-extra.conf ] || { echo "FAIL: full glibc-iconv is in the test environment, so this test cannot catch a missing glibc-iconv-common dependency"; exit 1; }
            # The test tooling (help-check pulls man-db and groff) brings glibc-iconv-common into most test environments, so also check the dependency itself.
            apk info -R groff-base | grep -qx glibc-iconv-common || { echo "FAIL: groff-base does not runtime-depend on glibc-iconv-common"; exit 1; }
            printf '\xbf\xf3\xb3w\n' > /tmp/l2
            out=$(preconv -e ISO-8859-2 /tmp/l2 | tail -1)
            case "$out" in *u017C*) ;; *) echo "FAIL: preconv gave $out"; exit 1 ;; esac

  - name: groff-doc
    pipeline:
      - uses: split/manpages
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share
          mv ${{targets.destdir}}/usr/share/doc ${{targets.contextdir}}/usr/share/
    description: groff manpages and doc
    test:
      pipeline:
        - uses: test/docs

  - name: groff-info
    pipeline:
      - uses: split/infodir
    description: groff info
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: addftinfo afmtodit chem eqn2graph gdiffmk gperl gpinyin grap2graph grn grodvi grolbp grolj4 gropdf hpftodit indxbib lkbib lookbib mmroff pdfmom pfbtops pic2graph post-grohtml pre-grohtml refer tfmtodit
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: addftinfo afmtodit chem eqn2graph gperl gpinyin grap2graph grn grodvi grog grolbp grolj4 gropdf hpftodit indxbib lkbib lookbib mmroff pdfmom pfbtops pic2graph post-grohtml pre-grohtml refer tfmtodit
