#nolint:depends-on-unversioned-py-provides
package:
  name: grpc-1.66
  version: 1.66.2
  epoch: 19 # add shared test/grpc-tls pipeline
  description: The C based gRPC
  copyright:
    - license: Apache-2.0 AND BSD-3-Clause AND MIT
  resources:
    cpu: "24"
    memory: 24Gi
  dependencies:
    provides:
      - grpc=${{package.full-version}}

vars:
  openssl-version: "4.0"

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - abseil-cpp-20250127-dev
      - autoconf
      - automake
      - benchmark-dev
      - build-base
      - busybox
      - c-ares-dev
      - ca-certificates-bundle
      - chrpath
      - cmake
      - curl
      - cython
      - glibc-2.43-dev
      - glibc-2.44
      - icu-dev
      - libstdc++-dev
      - libsystemd
      - libtool
      - linux-headers
      - openssl-${{vars.openssl-version}}-dev # FTBFS with openssl-hardened-4.0-dev: OPENSSL_NO_DEPRECATED removes the SSL_get_peer_certificate macro used in src/core/tsi/ssl_transport_security.cc
      - protobuf-29.5-dev
      - py3-setuptools
      - python3
      - python3-dev
      - re2-dev
      - samurai
      - systemd-dev
      - wolfi-base
      - xxhash-dev
      - yaml-dev
      - zlib-dev
  environment:
    # https://github.com/wolfi-dev/os/issues/34568
    GCC_SPEC_FILE: no-hardening.spec

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grpc/grpc
      tag: v${{package.version}}
      expected-commit: f686ffe7e703fb1440dabea419579e566a8becc3

  - uses: patch
    with:
      patches: openssl4.patch ssl-ctx-null-check.patch

  - runs: |
      cd third_party
      git submodule update --init --recursive

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/share/doc/grpc
      cmake -B _build -G Ninja \
      	-DCMAKE_BUILD_TYPE=None \
      	-DCMAKE_INSTALL_PREFIX=/usr \
      	-DCMAKE_CXX_STANDARD=17 \
      	-DBUILD_SHARED_LIBS=True \
      	-DgRPC_INSTALL=ON \
      	-DgRPC_CARES_PROVIDER=package \
      	-DgRPC_SSL_PROVIDER=package \
      	-DgRPC_ZLIB_PROVIDER=package \
        -DgRPC_PROTOBUF_PROVIDER=package \
      	-DgRPC_ABSL_PROVIDER=package \
        -DgRPC_RE2_PROVIDER=package \
      	-DgRPC_BENCHMARK_PROVIDER=package \
      	-DgRPC_BACKWARDS_COMPATIBILITY_MODE=OFF \
      	-DgRPC_BUILD_TESTS=OFF
      cmake --build _build

      GRPC_PYTHON_CFLAGS="-std=c++17" \
      GRPC_PYTHON_DISABLE_LIBC_COMPATIBILITY=1 \
      GRPC_PYTHON_BUILD_SYSTEM_CARES=1 \
      GRPC_PYTHON_BUILD_SYSTEM_OPENSSL=1 \
      GRPC_PYTHON_BUILD_SYSTEM_ZLIB=1 \
      GRPC_PYTHON_BUILD_SYSTEM_RE2=1 \
      GRPC_PYTHON_BUILD_SYSTEM_ABSL=1 \
      python3 setup.py build

      # grpcio-tools
      cd tools/distrib/python
      python3 make_grpcio_tools.py

  - runs: |
      DESTDIR="${{targets.destdir}}" cmake --install _build
      # Upstream installs this .pc even with gRPC_BUILD_GRPCPP_OTEL_PLUGIN off,
      # so it names a library that is never built and requires opentelemetry_api.
      rm "${{targets.destdir}}"/usr/lib/pkgconfig/grpcpp_otel_plugin.pc
      python3 setup.py install --skip-build --root="${{targets.destdir}}"
      cd doc
      find ./ -type f -print -exec install -Dm644 {} "${{targets.destdir}}"/usr/share/doc/grpc/{} \;
      rm "${{targets.destdir}}"/usr/share/doc/grpc/.gitignore
      find "${{targets.destdir}}" -type f -name roots.pem -exec \
      sh -c 'rm $0 && ln -s /etc/ssl/certs/ca-certificates.crt $0' "{}" \;

  - uses: strip

subpackages:
  - name: py3-grpcio-${{vars.major-minor-version}}
    description: "gRPC Python HTTP/2-based RPC framework"
    dependencies:
      runtime:
        - py3-six
      provides:
        - py3-grpcio=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          mv ${{targets.destdir}}/usr/lib/python3* ${{targets.subpkgdir}}/usr/lib/
    test:
      environment:
        contents:
          packages:
            - openssl-${{vars.openssl-version}}
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: py3-grpcio
            real-pkg-name: ${{subpkg.name}}
        - uses: test/grpc-tls
          with:
            # py3-grpcio-1.66 is built for, and depends on, python-3.13-base
            python: python3.13
            label: py3-grpcio-${{vars.major-minor-version}}

  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}
    dependencies:
      runtime:
        - abseil-cpp-20250127-dev
        - openssl-${{vars.openssl-version}}-dev
        - ${{package.name}}
        - re2-dev
      provides:
        - grpc-dev=${{package.full-version}}
    description: grpc dev

update:
  enabled: true
  github:
    identifier: grpc/grpc
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v1.66.

test:
  environment:
    contents:
      packages:
        - protobuf-29.5-protoc
  pipeline:
    - uses: test/tw/ldd-check
    - name: Generate C++ gRPC stubs with grpc_cpp_plugin
      runs: |
        # grpc_cpp_plugin has no --version flag; drive it through protoc instead.
        cat > greeter.proto <<'EOF'
        syntax = "proto3";
        package greeter;
        service Greeter {
          rpc SayHello (HelloRequest) returns (HelloReply);
        }
        message HelloRequest { string name = 1; }
        message HelloReply { string message = 1; }
        EOF
        protoc --plugin=protoc-gen-grpc="$(command -v grpc_cpp_plugin)" --grpc_out=. greeter.proto
        grep -q 'class Greeter' greeter.grpc.pb.h
        test -s greeter.grpc.pb.cc
