package:
  name: grpc-1.81
  version: "1.81.1"
  epoch: 8 # add TLS loopback test against system OpenSSL
  description: The C based gRPC
  copyright:
    - license: Apache-2.0 AND BSD-3-Clause AND MIT
  resources:
    cpu: "36"
    memory: 48Gi
  dependencies:
    provides:
      - grpc=${{package.full-version}}
  test-resources:
    cpu: "1"
    memory: 3Gi

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

vars:
  openssl-version: "4.0"
  pypi-package: grpcio
  import: grpc

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - abseil-cpp-dev
      - autoconf
      - automake
      - benchmark-dev
      - build-base
      - busybox
      - c-ares-dev
      - ca-certificates-bundle
      - chrpath
      - cmake
      - curl
      - glibc-2.44-dev
      - icu-dev
      - libstdc++-dev
      - libsystemd
      - libtool
      - linux-headers
      - openssl-${{vars.openssl-version}}-dev
      - protobuf-dev
      - protobuf-static
      - py3-supported-build-base
      - py3-supported-cython
      - py3-supported-python-dev
      - python3
      - re2
      - re2-dev
      - samurai
      - systemd-dev
      - wolfi-base
      - xxhash-dev
      - yaml-dev
      - zlib-dev
  environment:
    # https://github.com/wolfi-dev/os/issues/34568
    GCC_SPEC_FILE: no-hardening.spec
    # Drop OpenSSL ENGINE support (deprecated, removed in OpenSSL 4.0)
    CFLAGS: -DOPENSSL_NO_ENGINE
    CXXFLAGS: -DOPENSSL_NO_ENGINE
    # https://gcc.gnu.org/bugzilla/show_bug.cgi?id=117739
    GRPC_PYTHON_CFLAGS: "-std=c++17 -DOPENSSL_NO_ENGINE"
    GRPC_PYTHON_BUILD_SYSTEM_CARES: "True"
    GRPC_PYTHON_BUILD_SYSTEM_OPENSSL: "True"
    GRPC_PYTHON_BUILD_SYSTEM_ZLIB: "True"
    GRPC_PYTHON_BUILD_SYSTEM_RE2: "True"
    GRPC_PYTHON_BUILD_SYSTEM_ABSL: "True"
    GRPC_PYTHON_BUILD_SYSTEM_CYTHON: "True"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grpc/grpc
      tag: v${{package.version}}
      expected-commit: e84a8a2f04095f2772ba42a4abccde4f9243e75b

  - uses: patch
    with:
      patches: system-absl-log-initialize.patch openssl4.patch ssl-ctx-null-check.patch

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/share/doc/grpc
      cmake -B _build -G Ninja \
          -DCMAKE_BUILD_TYPE=None \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_CXX_STANDARD=17 \
          -DBUILD_SHARED_LIBS=ON \
          -DgRPC_INSTALL=ON \
          -DgRPC_CARES_PROVIDER=package \
          -DgRPC_SSL_PROVIDER=package \
          -DgRPC_ZLIB_PROVIDER=package \
          -DgRPC_PROTOBUF_PROVIDER=package \
          -DgRPC_ABSL_PROVIDER=package \
          -DgRPC_RE2_PROVIDER=package \
          -DgRPC_BENCHMARK_PROVIDER=package \
          -DgRPC_BACKWARDS_COMPATIBILITY_MODE=OFF \
          -DgRPC_BUILD_TESTS=OFF \
          -DgRPC_BUILD_CODEGEN=ON \
          -DCMAKE_C_FLAGS="-DOPENSSL_NO_ENGINE" \
          -DCMAKE_CXX_FLAGS="-DOPENSSL_NO_ENGINE"
      cmake --build _build

  - runs: |
      DESTDIR="${{targets.destdir}}" cmake --install _build
      cd doc
      find ./ -type f -print -exec install -Dm644 {} "${{targets.destdir}}"/usr/share/doc/grpc/{} \;
      rm "${{targets.destdir}}"/usr/share/doc/grpc/.gitignore
      find "${{targets.destdir}}" -type f -name roots.pem -exec \
      sh -c 'rm $0 && ln -s /etc/ssl/certs/ca-certificates.crt $0' "{}" \;

subpackages:
  - range: py-versions
    name: py${{range.key}}-grpcio-${{vars.major-minor-version}}
    description: python${{range.key}} version of grpcio
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-grpcio-${{vars.major-minor-version}}
        - py3-grpcio
        - py${{range.key}}-grpcio
      runtime:
        - py${{range.key}}-typing-extensions
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - openssl-${{vars.openssl-version}}
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}
        - name: TLS unary round-trip with ssl_{server,channel}_credentials
          runs: |
            ut_start=$(date +%s)
            d=$(mktemp -d)
            cd "$d"
            # Throwaway trusted CA, an untrusted CA, and a server cert for
            # 127.0.0.1/localhost signed by the trusted CA.
            for ca in ca bad-ca; do
              openssl req -x509 -new -nodes -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
                -keyout $ca.key -out $ca.crt -days 1 -subj "/CN=$ca" \
                -addext basicConstraints=critical,CA:TRUE \
                -addext keyUsage=critical,keyCertSign,cRLSign
            done
            openssl req -new -nodes -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
              -keyout server.key -out server.csr -subj "/CN=localhost"
            printf '%s\n' 'basicConstraints=CA:FALSE' \
              'keyUsage=critical,digitalSignature' 'extendedKeyUsage=serverAuth' \
              'subjectAltName=IP:127.0.0.1,DNS:localhost' > server.ext
            openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
              -days 1 -extfile server.ext -out server.crt
            openssl verify -CAfile ca.crt server.crt
            cat > tls_test.py <<'PYEOF'
            import sys
            from concurrent import futures

            import grpc

            def rd(name):
                with open(name, "rb") as f:
                    return f.read()

            def ping(request, context):
                return b"pong:" + request

            server = grpc.server(futures.ThreadPoolExecutor(max_workers=2))
            server.add_generic_rpc_handlers((grpc.method_handlers_generic_handler(
                "sniff.Echo", {"Ping": grpc.unary_unary_rpc_method_handler(ping)}),))
            port = server.add_secure_port(
                "127.0.0.1:0",
                grpc.ssl_server_credentials([(rd("server.key"), rd("server.crt"))]))
            assert port, "add_secure_port failed"
            server.start()
            target = "127.0.0.1:%d" % port
            npass = nfail = 0

            def check(name, ok, detail=""):
                global npass, nfail
                print("CHECK %s %s %s" % ("PASS" if ok else "FAIL", name, detail))
                if ok:
                    npass += 1
                else:
                    nfail += 1

            with grpc.secure_channel(target, grpc.ssl_channel_credentials(rd("ca.crt"))) as ch:
                try:
                    resp = ch.unary_unary("/sniff.Echo/Ping")(b"ping", timeout=15)
                    check("trusted-ca-unary", resp == b"pong:ping", repr(resp))
                except grpc.RpcError as e:
                    check("trusted-ca-unary", False, "%s %s" % (e.code(), e.details()))

            with grpc.secure_channel(target, grpc.ssl_channel_credentials(rd("bad-ca.crt"))) as ch:
                try:
                    resp = ch.unary_unary("/sniff.Echo/Ping")(b"ping", timeout=15)
                    check("untrusted-ca-rejected", False, "unexpected success %r" % resp)
                except grpc.RpcError as e:
                    check("untrusted-ca-rejected", e.code() == grpc.StatusCode.UNAVAILABLE,
                          "%s %s" % (e.code(), e.details()))

            server.stop(None)
            print("RESULT pass=%d fail=%d" % (npass, nfail))
            sys.exit(1 if nfail else 0)
            PYEOF
            ut_rc=0
            python${{range.key}} tls_test.py > tls_test.log 2>&1 || ut_rc=$?
            cat tls_test.log
            ut_end=$(date +%s)
            result=$(grep -E '^RESULT pass=[0-9]+ fail=[0-9]+$' tls_test.log | tail -1)
            if [ -n "$result" ]; then
              ut_pass=$(echo "$result" | sed -E 's/.*pass=([0-9]+).*/\1/')
              ut_fail=$(echo "$result" | sed -E 's/.*fail=([0-9]+).*/\1/')
            else
              ut_pass=unknown ut_fail=unknown
            fi
            echo "UPSTREAM-TESTS py${{range.key}}-grpcio-${{vars.major-minor-version}}: pass=${ut_pass} fail=${ut_fail} skip=0"
            echo "UPSTREAM-TESTS py${{range.key}}-grpcio-${{vars.major-minor-version}}: duration=$((ut_end - ut_start))s"
            exit $ut_rc

  - name: py3-supported-grpcio-${{vars.major-minor-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-grpcio-${{vars.major-minor-version}}
        - py3.11-grpcio-${{vars.major-minor-version}}
        - py3.12-grpcio-${{vars.major-minor-version}}
        - py3.13-grpcio-${{vars.major-minor-version}}
    test:
      pipeline:
        - uses: test/metapackage

  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
        - openssl-${{vars.openssl-version}}-dev
      provides:
        - grpc-dev=${{package.full-version}}
    description: grpc dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}

update:
  enabled: true
  github:
    identifier: grpc/grpc
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v1.81.

test:
  pipeline:
    - uses: test/tw/ldd-check
