package:
  name: grpcurl
  version: "1.9.4"
  epoch: 0 # go: 1.26->1.27
  description: CLI tool to interact with gRPC servers
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

pipeline:
  - uses: git-checkout
    with:
      expected-commit: cf21d4aca5e9b69c06ecfa42d78e9fb942b980e8
      repository: https://github.com/fullstorydev/grpcurl
      tag: v${{package.version}}

  - uses: go/build
    with:
      packages: ./cmd/grpcurl
      output: grpcurl
      go-package: go-1.27
      ldflags: -X main.version=v${{package.version}}

update:
  enabled: true
  github:
    identifier: fullstorydev/grpcurl
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - openfga
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        /usr/bin/grpcurl --help
        grpcurl --version 2>&1 | grep ${{package.version}}
    - name: test grpcurl
      uses: test/daemon-check-output
      with:
        start: /usr/bin/openfga run
        expected_output: |
          starting openfga service...
          starting gRPC server
          starting HTTP server
        post: |
          grpcurl -plaintext localhost:8081 list
          grpcurl -plaintext localhost:8081 describe grpc.health.v1.Health

environment:
  contents:
    packages:
      - go-1.27
