package:
  name: gst-libav
  version: "1.29.2"
  epoch: 1 # go/wolfi-rsc/gst-libav
  description: GStreamer plugin for using the encoders, decoders, muxers, and demuxers provided by FFmpeg.
  copyright:
    - license: LGPL-2.0-or-later
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  glibc-version: "2.44"

environment:
  contents:
    packages:
      - build-base
      - busybox
      # Pinned rather than the ffmpeg-dev virtual: both ffmpeg-7 and ffmpeg-9.0
      # provide it, and ffmpeg-7.patch is conditional on LIBAVCODEC_VERSION_MAJOR.
      - ffmpeg-9.0-dev
      - glibc-${{vars.glibc-version}}-dev
      - gst-plugins-base-dev
      - gstreamer-dev
      - meson
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GStreamer/gstreamer
      tag: ${{package.version}}
      expected-commit: badd9563b2ac3117ea2a99348bbe46298d6992ec

  - uses: patch
    with:
      patches: |
        ffmpeg-7.patch

  - working-directory: subprojects/gst-libav
    pipeline:
      - uses: meson/configure
        with:
          opts: |
            -Db_lto=true
          output-dir: output
      - uses: meson/compile
      - uses: meson/install

  - uses: strip

update:
  enabled: true
  github:
    identifier: GStreamer/gstreamer
    use-tag: true

test:
  environment:
    contents:
      packages:
        # videotestsrc, for media the round trip below generates itself.
        - gst-plugins-base
        - gstreamer
  pipeline:
    - uses: test/tw/ldd-check
    - name: libav plugin is registered
      runs: |
        gst-inspect-1.0 libav
        gst-inspect-1.0 libav | grep -i ffmpeg
        gst-inspect-1.0 libav | grep -F avdemux_ape
        gst-inspect-1.0 libav | grep -F avdec_h264
    - name: Encode and decode through libav
      runs: |
        # Exercises the plugin rather than just its registration. The source
        # generates its own frames, so this needs no network egress: the
        # sandbox has none, which is why the upstream test files this
        # previously cloned are unavailable.
        gst-launch-1.0 videotestsrc num-buffers=10 ! avenc_mpeg4 ! avdec_mpeg4 ! fakesink
