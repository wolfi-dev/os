package:
  name: gst-plugins-bad-1.28
  version: "1.28.8"
  epoch: 1 # enable aom and x265 plugins
  description: GStreamer streaming media framework bad plug-ins
  copyright:
    - license: LGPL-2.1
    # x265 plugin (-x265 subpackage) links GPL libx265
    - license: GPL-2.0-or-later
  dependencies:
    provides:
      - gst-plugins-bad=${{package.full-version}}
    runtime:
      - gst-plugins-base-${{vars.major-minor-version}}
      - gstreamer-${{vars.major-minor-version}}
  resources:
    cpu: "1"
    memory: 10Gi

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - alsa-lib-dev
      - aom-dev # needed for av1enc/av1dec plugins
      - build-base
      - busybox
      - ca-certificates-bundle
      - cdparanoia-dev
      - cmake
      - expat-dev
      - gdk-pixbuf
      - glib-dev
      - glib-gir
      - glibc-2.44-dev
      - gobject-introspection-dev
      - graphene-dev
      - gst-plugins-base-${{vars.major-minor-version}}-dev
      - gstreamer-${{vars.major-minor-version}}
      - gstreamer-${{vars.major-minor-version}}-dev
      - gtk-3-dev
      - libdrm-dev
      - libice-dev
      - libogg-dev
      - libsm-dev
      - libsrt # needed for srt plugin; ships headers and srt.pc (no -dev split)
      - libtheora-dev
      - libvorbis-dev
      - libxv-dev
      - mesa-dev
      - mesa-gbm
      - mesa-glx
      - mesa-libgallium
      - meson
      - openh264-dev # needed for openh264enc plugin
      - opus-dev
      - orc-compiler
      - orc-dev
      - perl
      - python3
      - x265-dev # needed for x265enc plugin

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GStreamer/gstreamer
      tag: ${{package.version}}
      expected-commit: 1b2a95a1b72787cda146b46df9605b168e5b683b

  - working-directory: subprojects/gst-plugins-bad
    pipeline:
      - uses: meson/configure
        with:
          opts: |
            -Db_lto=true \
            -Dpackage-origin="https://github.com/wolfi-dev" \
            -Dpackage-name="GStreamer bad plug-ins (Wolfi-Linux)" \
            -Dintrospection=enabled \
            -Dsctp=enabled \
            -Dsrt=enabled \
            -Daom=enabled \
            -Dgpl=enabled \
            -Dx265=enabled \
            -Ddts=disabled \
            -Dfaad=disabled \
            -Diqa=disabled \
            -Dmpeg2enc=disabled \
            -Dmplex=disabled \
            -Dresindvd=disabled \
      - uses: meson/compile
      - uses: meson/install
      - uses: strip

subpackages:
  - name: ${{package.name}}-x265
    description: GStreamer x265 HEVC encoder plug-in
    dependencies:
      runtime:
        - ${{package.name}}
      provides:
        - gst-plugins-bad-x265=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib/gstreamer-1.0
          mv ${{targets.destdir}}/usr/lib/gstreamer-1.0/libgstx265.so \
            ${{targets.contextdir}}/usr/lib/gstreamer-1.0/
    test:
      pipeline:
        - name: Encode raw video to an HEVC elementary stream
          runs: |
            gst-inspect-1.0 x265enc | grep -F "H265 Encoder"
            gst-launch-1.0 -e \
              videotestsrc num-buffers=30 \
              ! video/x-raw,format=I420,width=320,height=240,framerate=30/1 \
              ! x265enc speed-preset=ultrafast \
              ! h265parse ! video/x-h265,stream-format=byte-stream \
              ! filesink location=/tmp/out.h265
            test -s /tmp/out.h265
            # Annex B stream must carry VPS (type 32) and SPS (type 33) NAL units
            head -c 64 /tmp/out.h265 | od -An -tx1 | tr -d ' \n' > /tmp/hdr.hex
            grep -F 000000014001 /tmp/hdr.hex
            grep -F 000000014201 /tmp/hdr.hex
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}

  - name: ${{package.name}}-dev
    dependencies:
      runtime:
        - ${{package.name}}
      provides:
        - gst-plugins-bad-dev=${{package.full-version}}
    pipeline:
      - uses: split/dev
    description: ${{package.name}} dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}

update:
  enabled: true
  github:
    identifier: GStreamer/gstreamer
    use-tag: true
    tag-filter-prefix: "1.28."

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        gst-transcoder-1.0 --help
        playout --help
    - runs: |
        # Verify the OpenH264 encoder plugin is present
        gst-inspect-1.0 openh264enc > /tmp/openh264enc.txt
        grep -F "OpenH264 encoder/decoder plugin" /tmp/openh264enc.txt
    - name: Verify the SRT plugin provides srtsrc and srtsink
      runs: |
        gst-inspect-1.0 srt | tee /tmp/srt.txt
        grep -E "^\s+srtsrc:" /tmp/srt.txt
        grep -E "^\s+srtsink:" /tmp/srt.txt
        gst-inspect-1.0 srtsrc | grep -F "srt://"
        gst-inspect-1.0 srtsink | grep -F "srt://"
    - name: Transfer data over a loopback SRT connection
      runs: |
        # Payloads must not exceed SRT's live-mode packet size (1316 bytes)
        head -c 131600 /dev/urandom > /tmp/srt-in.bin
        # Live mode drops packets still held in the receiver's latency buffer
        # when the sender disconnects, so trail the payload with padding to
        # keep the connection up until the real data has been delivered.
        cp /tmp/srt-in.bin /tmp/srt-send.bin
        head -c 131600 /dev/zero >> /tmp/srt-send.bin

        # srtsrc emits EOS when the caller disconnects; timeout is a backstop
        timeout -s INT 60 gst-launch-1.0 -e \
          srtsrc uri="srt://:7001?mode=listener" latency=50 \
          ! filesink location=/tmp/srt-out.bin > /tmp/srt-rx.log 2>&1 &
        RX_PID=$!
        sleep 2

        # Pace the sender at 10ms per packet to stay within live-mode rates
        gst-launch-1.0 \
          filesrc location=/tmp/srt-send.bin blocksize=1316 \
          ! identity sleep-time=10000 \
          ! srtsink uri="srt://127.0.0.1:7001?mode=caller" latency=50
        wait "$RX_PID" || true
        cat /tmp/srt-rx.log

        ls -l /tmp/srt-in.bin /tmp/srt-out.bin
        # Every byte of the real payload must arrive intact and in order
        cmp -n 131600 /tmp/srt-in.bin /tmp/srt-out.bin
    - name: Verify the x265 encoder is only in the -x265 subpackage
      runs: |
        if gst-inspect-1.0 x265enc; then
          echo "x265enc must ship in ${{package.name}}-x265"
          exit 1
        fi
    - name: Round-trip video through the AV1 encoder and decoder
      runs: |
        gst-inspect-1.0 aom | grep -E "^\s+av1enc:"
        gst-inspect-1.0 aom | grep -E "^\s+av1dec:"
        gst-launch-1.0 -e \
          videotestsrc num-buffers=10 \
          ! video/x-raw,format=I420,width=64,height=64,framerate=30/1 \
          ! av1enc cpu-used=8 usage-profile=realtime \
          ! av1dec ! video/x-raw,format=I420,width=64,height=64 \
          ! filesink location=/tmp/av1-out.yuv
        # 10 decoded 64x64 I420 frames are 6144 bytes each
        test "$(wc -c < /tmp/av1-out.yuv)" -eq 61440
    - uses: test/tw/ldd-check
