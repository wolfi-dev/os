package:
  name: gst-plugins-good-1.28
  version: "1.28.8"
  epoch: 0
  description: GStreamer streaming media framework good plug-ins
  copyright:
    - license: LGPL-2.1
  dependencies:
    provides:
      - gst-plugins-good=${{package.full-version}}
    runtime:
      - gst-plugins-base-${{vars.major-minor-version}}
      - gstreamer-${{vars.major-minor-version}}
  resources:
    cpu: "2"
    memory: 5Gi
  test-resources:
    memory: 1Gi

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - alsa-lib-dev
      - build-base
      - busybox
      - bzip2-dev
      - ca-certificates-bundle
      - cdparanoia-dev
      - cmake
      - curl-dev
      - expat-dev
      - flac-dev
      - glib-dev
      - glib-gir
      - glibc-2.44-dev
      - gobject-introspection-dev
      - gst-plugins-base-${{vars.major-minor-version}}-dev
      - gstreamer-${{vars.major-minor-version}}-dev
      - libjpeg-turbo-dev
      - libogg-dev
      - libpng-dev
      - libtheora-dev
      - libvorbis-dev
      - meson
      - nasm
      - opencore-amr-dev
      - opus-dev
      - orc-compiler
      - orc-dev
      - pulseaudio-dev
      - python3
      - samba-dev
      - speex-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GStreamer/gstreamer
      tag: ${{package.version}}
      expected-commit: 1b2a95a1b72787cda146b46df9605b168e5b683b

  - working-directory: subprojects/gst-plugins-good
    pipeline:
      - runs: |
          export CFLAGS="$CFLAGS -O2 -DMPG123_NO_LARGENAME"
          export CXXFLAGS="$CXXFLAGS -O2 -DMPG123_NO_LARGENAME"
          export CPPFLAGS="$CPPFLAGS -O2 -DMPG123_NO_LARGENAME"
      - uses: meson/configure
        with:
          opts: |
            -Db_lto=true \
            -Dpackage-origin="https://wolfi.dev" \
            -Dpackage-name="GStreamer good plug-ins (Wolfi-Linux)" \
            -Dtests=disabled \
            -Damrnb=enabled \
            -Damrwbdec=enabled \
            -Dqt-x11=disabled \
            -Dqt6=disabled \
            -Dgtk3=disabled \
            -Djack=disabled \
            -Dpulse=enabled \
            -Dsoup=disabled \
            -Dspeex=enabled \
            -Dtaglib=disabled \
            -Dv4l2=disabled \
            -Dvpx=disabled \
            -Dwavpack=disabled
      - uses: meson/compile
      - uses: meson/install
      - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    dependencies:
      runtime:
        - ${{package.name}}
      provides:
        - gst-plugins-good-dev=${{package.full-version}}
    pipeline:
      - uses: split/dev
    description: ${{package.name}} dev
    test:
      pipeline:
        - uses: test/tw/emptypackage

update:
  enabled: true
  github:
    identifier: GStreamer/gstreamer
    use-tag: true
    tag-filter-prefix: "1.28."

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        echo "Testing gst-plugins-good..."
        for plugin in jpegdec pngdec autodetect udp audioconvert; do gst-inspect-1.0 $plugin && echo "✓ $plugin found"; done
        gst-launch-1.0 videotestsrc num-buffers=1 ! videoconvert ! jpegenc ! jpegdec ! fakesink && echo "✓ JPEG pipeline works"
        gst-launch-1.0 audiotestsrc num-buffers=1 ! audioconvert ! fakesink && echo "✓ Audio pipeline works"
        echo "✓ gst-plugins-good test passed"
    - runs: |
        echo "Testing pulseaudio plugin elements available..."
        for element in pulsesrc pulsesink; do
          gst-inspect-1.0 "$element"
          echo "✓ $element found"
        done
        echo "✓ gst-plugins-good pulseaudio test passed"
    - uses: test/tw/ldd-check
