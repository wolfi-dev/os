# Generated from https://git.alpinelinux.org/aports/plain/main/gstreamer/APKBUILD
package:
  name: gstreamer-1.28
  version: "1.28.8"
  epoch: 0
  description: GStreamer streaming media framework
  copyright:
    - license: LGPL-2.1
  dependencies:
    provides:
      - gstreamer=${{package.full-version}}

environment:
  contents:
    packages:
      - alsa-lib-dev
      - autoconf
      - automake
      - bison
      - build-base
      - busybox
      - bzip2-dev
      - ca-certificates-bundle
      - cdparanoia-dev
      - cmake
      - curl-dev
      - expat-dev
      - flac-dev
      - flex
      - glib-dev
      - glib-gir
      - glibc-2.44-dev
      - gobject-introspection-dev
      - graphene-dev
      - libatomic
      - libcap-dev
      - libcap-utils
      - libdrm-dev
      - libjpeg-turbo-dev
      - libogg-dev
      - libpng-dev
      - libtheora-dev
      - libvorbis-dev
      - libxml2-dev
      - linux-headers
      - mesa-dev
      - mesa-gbm
      - mesa-glx
      - mesa-libgallium
      - meson
      - nasm
      - opencore-amr-dev
      - opus-dev
      - orc-compiler
      - orc-dev
      - perl
      - pulseaudio-dev
      - python3
      - samba-dev
      - speex-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GStreamer/gstreamer
      tag: ${{package.version}}
      expected-commit: 1b2a95a1b72787cda146b46df9605b168e5b683b

  - runs: |
      cd subprojects/gstreamer
      CFLAGS="$CFLAGS -O2" \
      CXXFLAGS="$CXXFLAGS -O2" \
      CPPFLAGS="$CPPFLAGS -O2" \
      meson \
        -Db_lto=true \
        -Dintrospection=enabled \
        -Dbash-completion=disabled \
        -Dptp-helper-permissions=capabilities \
        -Dpackage-name="GStreamer (Wolfi)" \
        -Dpackage-origin="https://wolfi.dev" \
        --prefix=/usr \
        . output
      meson compile -C output

  - uses: upstream-tests/meson-test
    with:
      dir: subprojects/gstreamer/output

  - runs: |
      cd subprojects/gstreamer
      DESTDIR="${{targets.destdir}}" meson install --no-rebuild -C output

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      provides:
        - gstreamer-dev=${{package.full-version}}
    description: gstreamer dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    dependencies:
      provides:
        - gstreamer-doc=${{package.full-version}}
    description: gstreamer manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: GStreamer/gstreamer
    use-tag: true
    tag-filter-prefix: "1.28."

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        gst-inspect-1.0 --version
        gst-launch-1.0 --version
        gst-stats-1.0 --version
        gst-tester-1.0 --version
        gst-typefind-1.0 --version
        gst-inspect-1.0 --help
        gst-launch-1.0 --help
        gst-stats-1.0 --help
        gst-tester-1.0 --help
        gst-typefind-1.0 --help
    - name: Test gst-inspect-1.0 inspects core elements
      runs: |
        # Inspect a core element and verify it returns element details
        gst-inspect-1.0 fakesrc | grep -i "fakesrc"
        gst-inspect-1.0 fakesink | grep -i "fakesink"
        gst-inspect-1.0 identity | grep -i "identity"
    - name: Test gst-launch-1.0 runs a basic pipeline
      runs: |
        # Run a minimal GStreamer pipeline using core elements only
        gst-launch-1.0 fakesrc num-buffers=5 ! fakesink
    - uses: test/tw/ldd-check
