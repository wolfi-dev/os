package:
  name: heimdal
  version: 7.8.0
  epoch: 55 # LMDB HDB backend; detect the resolver on glibc 2.28
  description: "Implementation of Kerberos 5"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "3"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - flex
      - gawk
      - gdbm-dev
      - glibc-2.44-dev
      - libtool
      - lmdb-dev # HDB backend for the default (prefix-less) database
      - ncurses-dev
      - perl
      - perl-json
      - python3
      - readline-dev
      - sqlite-dev
      - texinfo

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/heimdal/heimdal
      tag: heimdal-${{package.version}}
      expected-commit: a6cf94577c0d1e5bca5304342e4ddffb18255afe
      cherry-picks: |
        master/1b57b62d82a478c1fade350f0fb1d57031a8734e: cf/largefile.m4: Fix build with autoconf-2.72
        master/7510cc5ba27d5e6c01ad09692b8aa62f9dd0eab9: cf/largefile.m4: improve compatibility with autoconf 2.72
        # needed for GCC > 13
        master/323d555c82f16f8ace3dce45c91cc8a2d25ea0aa: cf: Do not use headers and argument lists in AC_FIND_FUNC_NO_LIBS2

  # The GCC > 13 cherry-pick above makes AC_FIND_FUNC link without headers,
  # so on glibc < 2.34 (the eco-2-28 toolchain), where res_search,
  # res_nsearch and dn_expand exist only as <resolv.h> macros for __res_*,
  # configure missed the resolver and roken built its stub (no DNS KDC
  # discovery, and parse_reply-test cannot link). The patch probes through
  # <resolv.h>; no change on newer glibc.
  - uses: patch
    with:
      patches: |
        CVE-2022-45142.patch
        resolv-glibc-2.28.patch

  # LMDB is the HDB backend for database names without a "type:" prefix,
  # including the default /var/heimdal/heimdal that kadmin and the KDC open;
  # without one they fail with "No database support". sqlite stays available
  # as "sqlite:<path>". OTP stays disabled as before: with a db type set,
  # configure would enable it, and libotp needs an NDBM/DB1/DB3 library.
  - uses: autoconf/configure
    with:
      opts: |
        --prefix=/usr \
        --enable-shared=yes \
        --without-x \
        --without-berkeley-db \
        --with-readline-lib=/usr/lib \
        --with-readline-include=/usr/include/readline \
        --with-sqlite3=/usr \
        --without-openssl \
        --with-db-type-preference=lmdb \
        --disable-otp \
        --sbindir=/usr/bin

  - uses: autoconf/make

  - uses: autoconf/make-install

  # Run the upstream suite after make-install, so nothing `make check`
  # rebuilds or relinks in the build tree can reach the installed files
  # (libtool relinks in the build tree are picked up by a later install).
  - uses: upstream-tests/make-check
    with:
      # The tests in each directory share one database (current-db) and
      # are not safe to run in parallel; upstream CI runs `make check`
      # serially too.
      jobs: 1

  - uses: strip

subpackages:
  - name: "heimdal-dev"
    description: "headers for heimdal"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - heimdal
        - merged-usrsbin
        - wolfi-baselayout
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/tw/ver-check
          with:
            bins: krb5-config
        - uses: test/tw/help-check
          with:
            bins: krb5-config
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}

  - name: "heimdal-libs"
    description: "libraries shipped by heimdal"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib/*.so.* ${{targets.contextdir}}/usr/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

  - name: "heimdal-su"
    description: "Kerberos su from heimdal"
    checks:
      disabled:
        - setuidgid
    options:
      # Kept out of cmd:su: util-linux-login depends on cmd:su, and this
      # su's higher version would win it over util-linux-su and sudo-rs.
      no-commands: true
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/su ${{targets.contextdir}}/usr/bin/
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    test:
      pipeline:
        - runs: |
            test -u /usr/bin/su
            su --version
            su --help

  - name: "heimdal-doc"
    description: "heimdal manpages"
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
    test:
      pipeline:
        - uses: test/tw/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

update:
  enabled: true
  github:
    identifier: heimdal/heimdal
    strip-prefix: heimdal-

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: |
          afslog
          bsearch
          gsstool
          heimtools
          hxtool
          idn-lookup
          kadmin
          kdestroy
          kf
          kgetcred
          kinit
          klist
          kpasswd
          ktutil
          pagsh
          string2key
          verify_krb5_conf
          iprop-log
          kstash
    - uses: test/tw/help-check
      with:
        bins: |
          afslog
          bsearch
          gsstool
          heimtools
          hxtool
          idn-lookup
          kadmin
          kdestroy
          kf
          kgetcred
          kinit
          klist
          kpasswd
          kswitch
          ktutil
          pagsh
          string2key
          verify_krb5_conf
          iprop-log
          kstash
    - name: Test string2key key derivation
      runs: |
        # string2key converts a password to a Kerberos key - verify it runs
        string2key --help 2>&1 | grep -iF "key"
    - name: kadmin can create and use the default database
      runs: |
        # dbname not set, so kadmin -l uses the default HDB_DEFAULT_DB
        # (/var/heimdal/heimdal), which needs a compiled-in default backend.
        mkdir -p /var/heimdal
        printf '[libdefaults]\n\tdefault_realm = EXAMPLE.COM\n' > krb5.conf
        export KRB5_CONFIG=$PWD/krb5.conf
        kadmin -l init --realm-max-ticket-life=1d --realm-max-renewable-life=1w EXAMPLE.COM
        kadmin -l add --random-key --use-defaults host/test.example.com
        kadmin -l list '*' | grep -F host/test.example.com
    - name: Test hxtool certificate operations
      runs: |
        # Generate a self-signed certificate using hxtool
        hxtool issue-certificate \
          --self-signed \
          --issue-ca \
          --generate-key=rsa \
          --subject="CN=Test CA,DC=test,DC=example" \
          --certificate="FILE:/tmp/test-ca.pem" 2>&1
        test -f /tmp/test-ca.pem
        # Print the certificate to verify it was created correctly
        hxtool print --content "FILE:/tmp/test-ca.pem" 2>&1 | grep -iF "issuer"
