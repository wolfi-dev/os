package:
  name: helm-4
  version: "4.2.4"
  epoch: 1 # toolchain rebuild for  go-1.26-1.26.7
  description: The Kubernetes Package Manager
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - helm=${{package.full-version}}
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "2"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

capabilities:
  add:
    - CAP_SYS_ADMIN

vars:
  go-version: "1.26"

environment:
  contents:
    packages:
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/helm/helm
      tag: v${{package.version}}
      expected-commit: 3900f434fd3ef2b84065dc04508df48f288dba00

  - uses: bump
    with:
      deps: |-
        oras.land/oras-go/v2@v2.6.2

  - uses: go/build/v2
    with:
      packages: ./cmd/helm
      output: helm
      ldflags: |
        -X helm.sh/helm/v4/internal/version.version=v${{package.version}}
        -X helm.sh/helm/v4/internal/version.metadata=""
        -X helm.sh/helm/v4/internal/version.gitCommit=$(git rev-parse HEAD)
        -X helm.sh/helm/v4/internal/version.gitTreeState=$(test -n "`git status --porcelain`" && echo "dirty" || echo "clean")

test:
  pipeline:
    - uses: xcover/profile
      with:
        executable-path: /usr/bin/helm
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: helm
        version: ^v${{package.version}}\+\S+
        version-flag: 'version --short'
        match-type: regex
    - uses: test/tw/help-check
      with:
        bins: helm
    - runs: |
        helm create test
    - uses: xcover/stop
    - uses: xcover/ensure
      with:
        min-coverage: 5

update:
  enabled: true
  github:
    identifier: helm/helm
    tag-filter-prefix: v4
    strip-prefix: v
