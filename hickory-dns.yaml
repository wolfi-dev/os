package:
  name: hickory-dns
  version: "0.26.3"
  epoch: 0 # rust: 1.97->1.98
  description: "A Rust based DNS client, server, and resolver"
  copyright:
    - license: MIT
    - license: Apache-2.0
  resources:
    cpu: "8"
    memory: 4Gi

vars:
  rust-version: "1.98"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - openssl-hardened-dev
      - rust-${{vars.rust-version}}
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hickory-dns/hickory-dns
      tag: v${{package.version}}
      expected-commit: bd37cafbdd86112a6da32878f8c9bab22e14377e

  - name: Configure and build
    runs: |
      cargo build --release -p hickory-dns --all-features
      mkdir -p ${{targets.destdir}}/usr/bin/
      mv target/release/hickory-dns ${{targets.destdir}}/usr/bin/

  - uses: strip

update:
  enabled: true
  github:
    identifier: hickory-dns/hickory-dns
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        hickory-dns --version
        hickory-dns --help
