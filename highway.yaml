package:
  name: highway
  version: "1.4.0"
  epoch: 3 # shared library naming: rename lib subpackages to soname-versioned names
  description: Performance-portable, length-agnostic SIMD with runtime dispatch
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  soversion: "1"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - gtest-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google/highway
      tag: ${{package.version}}
      expected-commit: 2607d3b5b0113992fe84d3848859eae13b3b52c1

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_SHARED_LIBS=ON \
        -DBUILD_TESTING=OFF \
        -DHWY_SYSTEM_GTEST=ON \
        -DHWY_ENABLE_EXAMPLES=OFF

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: libhwy${{vars.soversion}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libhwy.so.* "${{targets.contextdir}}"/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: libhwy
    description: "compatibility package for libhwy1"
    dependencies:
      runtime:
        - libhwy${{vars.soversion}}=${{package.full-version}}
    test:
      pipeline:
        - uses: test/emptypackage

  - name: libhwy-contrib${{vars.soversion}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libhwy_contrib.so.* "${{targets.contextdir}}"/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: libhwy_contrib
    description: "compatibility package for libhwy-contrib1"
    dependencies:
      runtime:
        - libhwy-contrib${{vars.soversion}}=${{package.full-version}}
    test:
      pipeline:
        - uses: test/emptypackage

  - name: libhwy-test${{vars.soversion}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libhwy_test.so.* "${{targets.contextdir}}"/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: libhwy_test
    description: "compatibility package for libhwy-test1"
    dependencies:
      runtime:
        - libhwy-test${{vars.soversion}}=${{package.full-version}}
    test:
      pipeline:
        - uses: test/emptypackage

  - name: highway-dev
    pipeline:
      - uses: split/dev
    description: highway dev
    dependencies:
      runtime:
        - libhwy${{vars.soversion}}=${{package.full-version}}
        - libhwy-contrib${{vars.soversion}}=${{package.full-version}}
        - libhwy-test${{vars.soversion}}=${{package.full-version}}
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: google/highway

test:
  pipeline:
    - uses: test/tw/ldd-check
