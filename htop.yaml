package:
  name: htop
  version: "3.5.3"
  epoch: 1 # glibc: 2.43->2.44
  description: "A cross-platform interactive process viewer."
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - glibc-2.44-dev
      - libcap-dev
      - libnl3-dev
      - linux-headers
      - ncurses-dev
      - ncurses-static
      - pkgconf-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/htop-dev/htop
      expected-commit: 20882b8ef8271fb49ea0eb74bbfd484e9b0a11d8
      tag: ${{package.version}}

  - runs: ./autogen.sh

  - uses: autoconf/configure
    with:
      opts: |
        --prefix="/usr" \
        --sysconfdir="/etc" \
        --mandir="/usr/share/man" \
        --localstatedir="/var" \
        --enable-cgroup \
        --enable-capabilities \
        --enable-delayacct \
        --enable-taskstats

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: htop-doc
    description: htop docs
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: htop-dev/htop

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify htop version output
      runs: htop --version
    - name: Verify htop help output
      runs: htop --help || true
