package:
  name: httpie
  version: 3.2.4
  epoch: 15 # glibc: 2.43->2.44
  description: "HTTPie for Terminal — modern, user-friendly command-line HTTP client for the API era. JSON support, colors, sessions, downloads, plugins & more."
  copyright:
    - license: BSD-3-Clause
  options:
    # Don't resolve libraries installed in virtual environment as providers
    no-provides: true
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  python-version: "3.13"
  venv-home: "/opt/chainguard/httpie"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44
      - glibc-2.44-dev
      - python-${{vars.python-version}}-dev
      - uv
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/httpie/httpie
      tag: ${{package.version}}
      expected-commit: 2105caa49bae87c5809c274e407619a0de2639d1

  - uses: auth/uv
    with:
      allow-fallback-indexes: true

  - runs: |
      # Create venv at final install path with explicit python version
      uv venv "${{vars.venv-home}}" --python python${{vars.python-version}}

      # Install httpie from Libraries
      uv pip install --no-compile --python "${{vars.venv-home}}/bin/python" \
        "httpie==${{package.version}}"

      # Verify installed version
      "${{vars.venv-home}}/bin/python" -c "
      from importlib.metadata import version
      v = version('httpie')
      assert v == '${{package.version}}', f'Expected httpie==${{package.version}}, got {v}'
      print(f'httpie=={v} installed correctly')
      "

      # Fix uv lock file permissions (created world-writable by uv)
      chmod 644 "${{vars.venv-home}}/.lock"

      # Install virtual environment to package
      mkdir -p "${{targets.destdir}}/opt/chainguard"
      cp -a "${{vars.venv-home}}" "${{targets.destdir}}/opt/chainguard/"

      # Symlink binaries to /usr/bin
      mkdir -p "${{targets.destdir}}/usr/bin"
      for bin in http httpie https; do
        ln -sf "${{vars.venv-home}}/bin/$bin" "${{targets.destdir}}/usr/bin/$bin"
      done

  - uses: uv/bump
    with:
      venv: ${{targets.destdir}}${{vars.venv-home}}
      packages: |
        urllib3==2.7.0  # GHSA-mf9v-mfxr-j63j
        # setuptools is deliberately NOT pinned here. GHSA-h35f-9h28-mq5c
        # is patched in 83.0.0 and the venv now resolves 84.0.0 on its own,
        # so a pin adds nothing -- and because uv/bump refuses downgrades,
        # ==83.0.0 became a hard build failure once upstream moved past it.
        # Only re-add a pin if the resolved version drops below 83.0.0.

  - runs: |
      # Remove pip after uv/bump has completed its pip check
      uv pip uninstall pip virtualenv --python "${{targets.destdir}}${{vars.venv-home}}/bin/python"

  - uses: strip

  - name: Move the manual pages out of the venv
    runs: |
      # The venv is copied wholesale into /opt/chainguard, so its manual
      # pages land at opt/chainguard/httpie/share/man -- a path man(1) does
      # not search and one split/manpages does not handle. httpie shipped
      # http.1, httpie.1 and https.1 under usr/share/man until 3.2.4-r8;
      # they were lost when the venv packaging landed, which is why
      # httpie-doc has been stuck at r8 ever since.
      mkdir -p "${{targets.destdir}}"/usr/share/man
      mv "${{targets.destdir}}${{vars.venv-home}}"/share/man/* "${{targets.destdir}}"/usr/share/man/
      rmdir "${{targets.destdir}}${{vars.venv-home}}"/share/man

update:
  enabled: true
  github:
    identifier: httpie/httpie
    use-tag: true

subpackages:
  - name: ${{package.name}}-doc
    description: ${{package.name}} manpages
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: http httpie https
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: http httpie https
    - name: Verify httpie version and Libraries provenance
      runs: |
        set -euo pipefail
        INSTALLED=$("${{vars.venv-home}}/bin/python" -c "from importlib.metadata import version; print(version('httpie'))")
        if [ "$INSTALLED" != "${{package.version}}" ]; then
          echo "FAIL: Expected httpie==${{package.version}}, got $INSTALLED"
          exit 1
        fi
        echo "PASS: httpie==$INSTALLED"
        DIST_DIR="$("${{vars.venv-home}}/bin/python" -c "from importlib.metadata import distribution; print(distribution('httpie')._path)")"
        SBOM="${DIST_DIR}/sboms/sbom.spdx.json"
        if [ ! -f "$SBOM" ]; then
          echo "FAIL: No SBOM found — httpie must come from Chainguard Libraries"
          exit 1
        fi
        if grep -q '"Organization: Chainguard, Inc"' "$SBOM"; then
          echo "PASS: Chainguard Libraries provenance confirmed via SBOM"
        else
          echo "FAIL: SBOM exists but not from Chainguard Libraries"
          exit 1
        fi
    - name: "Test offline functionality"
      runs: |
        set -euo pipefail
        # Verify urllib3 version meets CVE fix requirement (GHSA-mf9v-mfxr-j63j)
        "${{vars.venv-home}}/bin/python" -c "
        from importlib.metadata import version
        v = version('urllib3')
        parts = [int(x) for x in v.split('.')]
        assert parts >= [2, 7, 0], f'urllib3 {v} is below required 2.7.0 (GHSA-mf9v-mfxr-j63j)'
        print(f'PASS: urllib3=={v} meets CVE fix requirement')
        "
        # Verify httpie can print help and version without network
        http --help > /dev/null
        http --version
    - uses: test/libraries-coverage
      with:
        path: ${{vars.venv-home}}
    - uses: test/tw/ldd-check
