package:
  name: hubble
  version: "1.20.2"
  epoch: 0
  description: hubble is a command to list and diagnose Go processes currently running on your system.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 1Gi
    disk: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - git
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cilium/hubble
      tag: v${{package.version}}
      expected-commit: 90adec13bd28db3eb2671dd0629116640e21b26f

  - uses: bump
    with:
      deps: |-
        golang.org/x/net@v0.60.0
        go.mongodb.org/mongo-driver@v1.17.7
        go.opentelemetry.io/otel@v1.46.0
        go.opentelemetry.io/otel/metric@v1.46.0
        go.opentelemetry.io/otel/trace@v1.46.0
        github.com/cilium/cilium@v1.20.2
        google.golang.org/grpc@v1.83.2
        golang.org/x/text@v0.42.0
        github.com/google/cel-go@v0.30.0
        github.com/cilium/ebpf@v0.22.0
        go.etcd.io/etcd/client/pkg/v3@v3.6.14
        go.etcd.io/etcd/api/v3@v3.6.14
        go.etcd.io/etcd/client/v3@v3.6.14
        sigs.k8s.io/structured-merge-diff/v6@v6.4.2
        github.com/go-logr/logr@v1.4.4
        github.com/go-openapi/analysis@v0.25.5
        github.com/go-openapi/jsonpointer@v1.0.0
        github.com/go-openapi/jsonreference@v1.0.0
        github.com/go-openapi/loads@v0.25.0
        github.com/go-openapi/runtime@v0.33.0
        github.com/go-openapi/spec@v0.22.9
        github.com/go-openapi/strfmt@v0.27.0
        github.com/go-openapi/swag@v0.28.0
        github.com/go-openapi/validate@v0.26.1
        github.com/grpc-ecosystem/go-grpc-middleware/v2@v2.3.4
        github.com/grpc-ecosystem/grpc-gateway/v2@v2.30.0
        github.com/mattn/go-colorable@v0.1.15
        github.com/mattn/go-isatty@v0.0.24
        github.com/pelletier/go-toml/v2@v2.4.3
        github.com/prometheus/client_golang@v1.24.1
        github.com/prometheus/client_model@v0.6.3
        github.com/prometheus/common@v0.70.1
        github.com/prometheus/procfs@v0.21.1
        go.yaml.in/yaml/v3@v3.0.5
        golang.org/x/oauth2@v0.37.0
        golang.org/x/time@v0.16.0
        golang.org/x/tools@v0.50.0
      language: go
      tidy: false

  - runs: |
      DESTDIR=${{targets.destdir}} BINDIR=/usr/bin make install

subpackages:
  - name: hubble-compat
    description: Compatibility package for hubble
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -sf ../../bin/hubble ${{targets.subpkgdir}}/usr/local/bin/hubble
    # test added by a robot (compat)
    test:
      pipeline:
        - runs: |
            readlink -v /usr/local/bin/hubble

update:
  enabled: true
  github:
    identifier: cilium/hubble
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    # AUTOGENERATED
    - runs: |
        hubble --version
        hubble --help
    - name: Test shell completion generation
      runs: |
        set -euo pipefail

        # Test bash completion generation
        hubble completion bash > /tmp/bash_completion.sh
        grep -F "hubble" /tmp/bash_completion.sh

        # Test zsh completion generation
        hubble completion zsh > /tmp/zsh_completion.sh
        grep -F "hubble" /tmp/zsh_completion.sh

        # Test fish completion generation
        hubble completion fish > /tmp/fish_completion.fish
        grep -F "hubble" /tmp/fish_completion.fish
