package:
  name: hugo-extended
  version: "0.168.0"
  epoch: 2 # upstream-tests/go-test
  description: The world's fastest framework for building websites.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libstdc++
  resources:
    cpu: "4"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - glibc-2.44-dev
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gohugoio/hugo
      tag: v${{package.version}}
      expected-commit: e27a6760c5547237f87d353aebe0580feadb20f4

  - uses: bump
    with:
      deps: |-
        golang.org/x/image@v0.45.0
        golang.org/x/text@v0.41.0
        github.com/getkin/kin-openapi@v0.149.0
      language: go

  - uses: go/build
    with:
      packages: .
      output: hugo
      tags: extended
      go-package: go-1.27

  # codegen TestMethods finds the Hugo source root from the checkout path; the build checks out into /home/build.
  # TODO(upstream-tests): drop once upstream gates these tests or the build environment provides what they need.
  - uses: upstream-tests/go-test
    with:
      tags: extended
      ignore: TestMethods

  - uses: strip

update:
  enabled: true
  github:
    identifier: gohugoio/hugo
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: hugo
        version: ${{package.version}}
    - name: Create a new Hugo site
      runs: |
        hugo new site test-site
        [ -d "test-site" ] # Check if the directory was created
    - name: Build the Hugo site
      runs: |
        cd test-site
        hugo
        [ -d "public" ] # Check if the public directory was created
