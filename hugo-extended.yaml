package:
  name: hugo-extended
  version: "0.165.0"
  epoch: 0 # GHSA-r277-6w6q-xmqw
  description: The world's fastest framework for building websites.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libstdc++
  resources:
    cpu: "4"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gohugoio/hugo
      tag: v${{package.version}}
      expected-commit: 76a5e1880ab46688155b02e99bab9be2a6134492

  - uses: bump
    with:
      deps: |-
        golang.org/x/image@v0.43.0
        golang.org/x/text@v0.39.0
        github.com/getkin/kin-openapi@v0.144.0

  - uses: go/build
    with:
      packages: .
      output: hugo
      tags: extended
      go-package: go-1.26

  - uses: strip

update:
  enabled: true
  github:
    identifier: gohugoio/hugo
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: hugo
        version: ${{package.version}}
    - name: Create a new Hugo site
      runs: |
        hugo new site test-site
        [ -d "test-site" ] # Check if the directory was created
    - name: Build the Hugo site
      runs: |
        cd test-site
        hugo
        [ -d "public" ] # Check if the public directory was created
