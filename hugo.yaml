package:
  name: hugo
  version: "0.170.0"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.4
  description: The world's fastest framework for building websites.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 5Gi
  test-resources:
    memory: 1Gi
    cpu: "1"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - glibc-2.44-dev
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gohugoio/hugo
      tag: v${{package.version}}
      expected-commit: f7aa05f0f521611aa960b2da56e1870ea04f57b2

  - uses: go/build
    with:
      packages: .
      output: hugo
      tags: extended
      go-package: go-1.27

  # codegen TestMethods finds the Hugo source root from the checkout path; the build checks out into /home/build.
  # TODO(upstream-tests): drop once upstream gates these tests or the build environment provides what they need.
  - uses: upstream-tests/go-test
    with:
      tags: extended
      ignore: TestMethods

update:
  enabled: true
  github:
    identifier: gohugoio/hugo
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - git
        - bash
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: hugo
    - uses: test/tw/ver-check
      with:
        bins: hugo
    - name: Create a new Hugo site
      runs: |
        hugo new site test-site
    - uses: test/daemon-check-output
      working-directory: test-site
      with:
        start: /usr/bin/hugo serve
        expected_output: "Web Server is available at"
        timeout: 10
