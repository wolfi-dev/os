package:
  name: hunspell
  dependencies:
    runtime:
      - glibc-iconv-common # calls iconv_open for non-UTF-8 charsets; glibc builds in only UTF-8/UCS/ASCII
  version: "1.7.6"
  epoch: 2 # runtime-depend on glibc-iconv-common (F-217)
  description: Spell checker and morphological analyzer library and program
  copyright:
    - license: GPL-2.0-or-later OR LGPL-2.1-or-later OR MPL-1.1
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash # upstream-tests: tests/test.sh is a bash script
      - build-base
      - busybox
      - ca-certificates-bundle
      - gettext-dev
      - glibc-2.44-dev
      - libtool
      - ncurses-dev
      - readline-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hunspell/hunspell
      tag: v${{package.version}}
      expected-commit: 15faca15532b34db3106d50f162e5edc2503d6d6

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: upstream-tests/make-check

  - uses: strip

subpackages:
  - name: libhunspell
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libhunspell-*.so.* "${{targets.contextdir}}"/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: hunspell-dev
    pipeline:
      - uses: split/dev
    description: hunspell dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: hunspell-doc
    pipeline:
      - uses: split/manpages
    description: hunspell manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: hunspell/hunspell
    strip-prefix: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        affixcompress --version
        hunspell --version
        hunzip --version
        ispellaff2myspell --version
        makealias --version
        affixcompress --help
        hunspell --help
        hunzip --help
        ispellaff2myspell --help
        makealias --help
    - uses: test/no-docs
    - name: "-i ISO-8859-2 input recoding (glibc-iconv-common)"
      runs: |
        # Without glibc-iconv-common this conversion fails (glibc builds in only UTF-8, UCS-2/4 and ASCII).
        [ ! -e /usr/lib/gconv/gconv-modules.d/gconv-modules-extra.conf ] || { echo "FAIL: full glibc-iconv is in the test environment, so this test cannot catch a missing glibc-iconv-common dependency"; exit 1; }
        # The test tooling (help-check pulls man-db and groff) brings glibc-iconv-common into most test environments, so also check the dependency itself.
        apk info -R hunspell | grep -qx glibc-iconv-common || { echo "FAIL: hunspell does not runtime-depend on glibc-iconv-common"; exit 1; }
        mkdir -p /tmp/h
        printf 'SET UTF-8\n' > /tmp/h/pl.aff
        printf '1\n\xc5\xbc\xc3\xb3\xc5\x82w\n' > /tmp/h/pl.dic
        out=$(printf '\xbf\xf3\xb3w\n' | hunspell -i ISO-8859-2 -d /tmp/h/pl -l 2>&1)
        [ -z "$out" ] || { echo "FAIL: hunspell reported: $out"; exit 1; }
