# Generated from https://git.alpinelinux.org/aports/plain/main/hwdata/APKBUILD
package:
  name: hwdata
  version: "0.413"
  epoch: 2 # upstream-tests/make-check
  description: Hardware identification and configuration data
  copyright:
    - license: GPL-2.0-or-later OR XFree86-1.1

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-iconv # upstream-tests: make check validates the ids files with iconv -f UTF-8
      - pciutils # upstream-tests: make check runs lspci -A dump against pci.ids
      - python3 # upstream-tests: make check runs check-pci-ids.py

# transform melange version to contain "+" rather than third "." so we can use a var in the fetch URL
var-transforms:
  - from: ${{package.version}}
    match: (\d+\.\d+)\.(\d+)
    replace: $1-$2
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/vcrhonek/hwdata
      tag: v${{vars.mangled-package-version}}
      expected-commit: 1cf7032160ad57e2eaad36c4f23eede1edd8203b

  - uses: autoconf/configure
    with:
      opts: |
        --prefix=/usr \
        --sysconfdir=/etc \
        --datadir=/usr/share \
        --disable-blacklist

  - uses: autoconf/make

  - uses: autoconf/make-install

  # check-usb-ids.sh lists USB devices inside a podman container; the build
  # sandbox has no container runtime, so use upstream's NO_DOCKER switch.
  # TODO(upstream-tests): drop NO_DOCKER once a container runtime is available.
  # The UTF-8 check runs iconv -f UTF-8 to the locale charset, so it needs a
  # UTF-8 locale; the build runs in C (ASCII), where any non-ASCII byte fails.
  # The check rule prints OK/FAILURE lines, not a test summary, and exits 1 on
  # the first failure.
  - uses: upstream-tests/make-check
    with:
      args: NO_DOCKER=1 LC_ALL=C.UTF-8
      harness: custom

  - uses: strip

subpackages:
  - name: hwdata-dev
    pipeline:
      - uses: split/dev
    description: hwdata dev
    test:
      pipeline:
        - uses: test/pkgconf

  - name: hwdata-usb
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share/hwdata
          mv ${{targets.destdir}}/usr/share/hwdata/usb.ids ${{targets.subpkgdir}}/usr/share/hwdata
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            files: /usr/share/hwdata/usb.ids

  - name: hwdata-pci
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share/hwdata
          mv ${{targets.destdir}}/usr/share/hwdata/pci.ids ${{targets.subpkgdir}}/usr/share/hwdata
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            files: /usr/share/hwdata/pci.ids

  - name: hwdata-pnp
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share/hwdata
          mv ${{targets.destdir}}/usr/share/hwdata/pnp.ids ${{targets.subpkgdir}}/usr/share/hwdata
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            files: /usr/share/hwdata/pnp.ids

  - name: hwdata-net
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share/hwdata
          mv ${{targets.destdir}}/usr/share/hwdata/oui.txt ${{targets.subpkgdir}}/usr/share/hwdata
          mv ${{targets.destdir}}/usr/share/hwdata/iab.txt ${{targets.subpkgdir}}/usr/share/hwdata
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            files: /usr/share/hwdata/oui.txt

update:
  enabled: true
  version-transform:
    - match: "-"
      replace: .
  github:
    identifier: vcrhonek/hwdata
    strip-prefix: v

# test added by a robot. The APK was empty when it was checked,
# which may not be true forever. If this test fails in the future, please
# replace it with a more accurate test.
test:
  pipeline:
    - uses: test/emptypackage
