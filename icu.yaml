#nolint:unused-var-transform
package:
  name: icu
  version: "78.3"
  epoch: 4 # update time zone data to 2026d
  description: "International Components for Unicode library"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libicu${{vars.major-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - python3

vars:
  # ICU releases lag behind IANA tzdb releases. The ICU project publishes
  # updated time zone sources for existing ICU versions in unicode-org/icu-data,
  # so build those in instead of the copy shipped in the ICU release tag.
  tz-version: "2026d"

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: '-'
    to: dash-package-version
  - from: ${{package.version}}
    match: \.
    replace: _
    to: underscore-package-version
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/unicode-org/icu
      tag: release-${{package.version}}
      expected-commit: 21d1eb0f306e1141c10931e914dfc038c06121da

  - uses: git-checkout
    with:
      repository: https://github.com/unicode-org/icu-data
      destination: icu-data
      branch: main
      expected-commit: c5aeb38e05607d094b783f0665bd66219b038ca9
      sparse-paths: |
        tzdata/icunew/${{vars.tz-version}}/44

  - name: Update time zone data to ${{vars.tz-version}}
    runs: |
      for f in zoneinfo64 metaZones timezoneTypes windowsZones; do
        cp icu-data/tzdata/icunew/${{vars.tz-version}}/44/$f.txt icu4c/source/data/misc/$f.txt
      done
      grep -F 'TZVersion { "${{vars.tz-version}}" }' icu4c/source/data/misc/zoneinfo64.txt
      rm -rf icu-data

  - uses: autoconf/configure
    with:
      dir: icu4c/source
      opts: |
        --sysconfdir=/etc \
        --with-data-packaging=archive \
        --disable-samples \
        --enable-static \
        --mandir=/usr/share/man \
        --sbindir=/usr/bin

  - uses: autoconf/make
    with:
      dir: icu4c/source

  - uses: autoconf/make-install
    with:
      dir: icu4c/source

  - uses: strip

subpackages:
  - name: icu-dev
    description: icu development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - icu
    test:
      pipeline:
        - runs: |
            icu-config --version
            icu-config --help
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
        - uses: test/tw/devpackage

  - name: libicu${{vars.major-version}}
    description: International Components for Unicode library (libs)
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib
          for ll in 'libicudata' 'libicui18n' 'libicuio' 'libicuuc'; do
            mv ${{targets.destdir}}/usr/lib/"$ll".so.* ${{targets.contextdir}}/usr/lib/
          done
    dependencies:
      runtime:
        - icu${{vars.major-version}}-data-full
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: icu${{vars.major-version}}-data-full
    description: Full ICU data
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/icu/${{package.version}}
          mv ${{targets.destdir}}/usr/share/icu/${{package.version}}/icudt${{vars.major-version}}l.dat ${{targets.contextdir}}/usr/share/icu/${{package.version}}/
    test:
      pipeline:
        - name: "make sure some .dat files are present"
          runs: |
            find /usr/share -name "*.dat" | grep -F ".dat" || { echo "FAIL: no .dat files found"; exit 1; }

  - name: icu-doc
    description: icu docs
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs
        - uses: test/tw/docs

update:
  enabled: true
  manual: true # ICU updates contain ABI breaking changes which require manual intervention
  ignore-regex-patterns:
    - "^release-.*-[alpha|beta|rc]$"
  github:
    identifier: unicode-org/icu
    strip-prefix: release-
    tag-filter-prefix: release-

# test:
#   pipeline:
#     # AUTOGENERATED
test:
  environment:
    contents:
      packages:
        - bash
        - build-base
        - coreutils
        - icu-dev
        - pkgconf
  pipeline:
    - runs: |
        derb --version
        genbrk --help
        gencfu --help
        gencnval --help
        gendict --help
        icuexportdata --version
        icuinfo --version
        makeconv --version
        uconv --version
        genccode --version
        gencmn version
        gensprep --help
        icupkg --help
        derb --help
        icuexportdata --help
        icuinfo --help
        uconv --help
        genccode --help
        gencmn help
        gensprep version
    - uses: test/tw/ldd-check
    - name: "Test basic character conversion"
      runs: |
        # Test UTF-8 to ASCII conversion with skip callback
        echo "Hello" | uconv -f UTF-8 -t ASCII
        # Test round-trip conversion
        echo "Test" | uconv -f UTF-8 -t UTF-16LE | uconv -f UTF-16LE -t UTF-8
    - name: "Test ICU resource bundle compilation"
      runs: |
        cat > test.txt << 'EOF'
        root:table{
          hello { "Hello!" }
        }
        EOF
        genrb -d . test.txt
    - name: "Test transliteration rules"
      runs: |
        # Test basic Latin transliteration
        echo "Hello" | uconv -x any-latin
    - name: "Verify default locale and encoding"
      runs: |
        icuinfo | grep -F "locale.default"
        icuinfo | grep -F "converter.default" | grep -F "UTF-8"
    - name: "Verify time zone data version"
      runs: |
        icuinfo | grep -F '<param name="tz.version">${{vars.tz-version}}</param>'
    - name: "Verify UTC offsets from updated time zone rules"
      runs: |
        cat > tzoffset.c << 'EOF'
        #include <stdio.h>
        #include <stdlib.h>
        #include <unicode/ucal.h>
        #include <unicode/ustring.h>

        /* Print the UTC offset in minutes for zone argv[1] at Unix time argv[2]. */
        int main(int argc, char **argv) {
          UErrorCode err = U_ZERO_ERROR;
          UChar zone[64];
          if (argc != 3) return 2;
          u_uastrcpy(zone, argv[1]);
          UCalendar *cal = ucal_open(zone, -1, "en_US", UCAL_GREGORIAN, &err);
          ucal_setMillis(cal, strtod(argv[2], NULL) * 1000.0, &err);
          int32_t offset = ucal_get(cal, UCAL_ZONE_OFFSET, &err) + ucal_get(cal, UCAL_DST_OFFSET, &err);
          if (U_FAILURE(err)) {
            fprintf(stderr, "%s\n", u_errorName(err));
            return 1;
          }
          printf("%d\n", offset / 60000);
          ucal_close(cal);
          return 0;
        }
        EOF
        gcc tzoffset.c -o tzoffset $(pkg-config --cflags --libs icu-i18n icu-uc)

        # 2026-12-01T12:00:00Z
        t=1796126400
        check() {
          got=$(./tzoffset "$1" "$t")
          if [ "$got" != "$2" ]; then
            echo "FAIL: $1 offset is $got minutes, expected $2"
            exit 1
          fi
          echo "$1: $got"
        }
        # British Columbia moved to permanent -07 (tzdb 2026b).
        check America/Vancouver -420
        # Alberta moved to permanent -06 (tzdb 2026c).
        check America/Edmonton -360
        # Morocco moved to permanent +00 (tzdb 2026c).
        check Africa/Casablanca 0
        # Northwest Territories moved to permanent -06 (tzdb 2026d).
        check America/Yellowknife -360
        # Zones without changes.
        check America/New_York -300
        check Europe/London 0
    - uses: test/tw/no-docs
