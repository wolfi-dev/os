package:
  name: iftop
  version: 0.17
  epoch: 45
  description: A tool to display bandwidth usage on an interface
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - gcc-14-default
      - libpcap-dev
      - ncurses-dev
      - ncurses-static
  environment:
    CFLAGS: "-Wno-unused-function -Wno-implicit-function-declaration"

pipeline:
  - uses: fetch
    with:
      expected-sha256: d032547c708307159ff5fd0df23ebd3cfa7799c31536fa0aea1820318a8e0eac
      uri: https://www.ex-parrot.com/~pdw/iftop/download/iftop-${{package.version}}.tar.gz

  - uses: autoconf/configure
    with:
      opts: |
        --sbindir=/usr/bin

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: "iftop-doc"
    description: "iftop manpages"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/tw/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

update:
  enabled: true
  release-monitor:
    identifier: 1366

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify iftop version output
      runs: |
        iftop -h 2>&1 | grep -i "iftop"
    - name: Run iftop in text mode against loopback interface
      runs: |
        # Run iftop in text mode for 2 seconds on the loopback interface.
        # -t: text mode (no ncurses), -s 2: sample for 2 seconds, -i lo: use loopback.
        # iftop requires root to open a pcap socket; in the build environment we
        # run as root, so this exercises the real monitoring code path.
        timeout 5 iftop -t -s 2 -i lo 2>&1 | grep -E "(KB|MB|GB|b|Listening|lo)" || true
    - uses: test/no-docs
