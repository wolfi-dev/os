package:
  name: iptables-wrappers
  version: "3"
  epoch: 10 # toolchain rebuild for  go-1.27-1.27.2
  description: Wrapper scripts for using iptables in containers
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - iptables
    replaces:
      - iptables
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    memory: 2Gi
    cpu: "1"

vars:
  wrapped-commands: |
    iptables  iptables-restore  iptables-save \
    ip6tables ip6tables-restore ip6tables-save

environment:
  contents:
    packages:
      - busybox
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/iptables-wrappers
      tag: v${{package.version}}
      expected-commit: bfef9e5087a198b50a4124bb9ce9d2c7c99025dd

  - uses: patch
    with:
      patches: |
        0001-Fix-invocation-of-iptables-if-redirection-fails.patch
        0002-Ignore-redirection-error-if-target-already-exists.patch
        0003-Pass-stdin-through-to-the-iptables-binary.patch

  # This package is used in FIPS context
  - uses: go/assert-no-crypto

  - uses: go/build
    with:
      packages: .
      output: ${{context.name}}
      go-package: go-1.27

  - name: Rename go binary to use upstream name
    working-directory: ${{targets.contextdir}}
    runs: |
      mv usr/bin/iptables-wrappers usr/bin/iptables-wrapper

  - working-directory: ${{targets.contextdir}}
    runs: |
      wrapped_cmds="${{vars.wrapped-commands}}"
      for cmd in $wrapped_cmds; do
        ln -s iptables-wrapper "usr/bin/$cmd"
      done

test:
  environment:
    contents:
      packages:
        # mount and unshare, for the netns/mountns restore test.
        - mount
        - util-linux-misc
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        set -euo pipefail
        check_target() {
          local cmd="$1"
          local symlinks_point_to="$2"
          local target="$(readlink /usr/bin/$cmd)"

          case "$symlinks_point_to" in
            "wrapper")
              [ "$target" = "iptables-wrapper" ]
              ;;
            "detected")
              # wrapper will point to binaries in /usr/sbin, which
              # relies on our usrmerge sbin->bin compat symlinks. We should
              # submit a fix upstream.
              target="$(echo $target | sed 's,^/usr/sbin/,,')"
              [ "$target" = "xtables-nft-multi" ] || \
                [ "$target" = "xtables-legacy-multi" ]
              ;;
            *)
              echo "ERROR: Invalid parameter: [$2]" 1>&2
              exit 1
              ;;
          esac
          test -x "/usr/bin/$target"
        }

        wrapped_cmds="${{vars.wrapped-commands}}"
        # on a fresh install, the symlink should point to the wrapper
        symlinks_point_to="wrapper"
        for cmd in $wrapped_cmds; do
          check_target "$cmd" "$symlinks_point_to"
          # when invoked, the wrapper will detect the in-use variant
          # (legacy | nft) and call its command instead. then, as an
          # optimization, it will update the symlink to point directly
          # to that command, bypassing the wrapper in subsequent calls
          case "$cmd" in
            ip*tables|ip*tables-restore)
              for arg in "--help" "--version"; do
                "$cmd" "$arg" || "$cmd" "$arg" 2>&1 | \
                  grep "Protocol not supported"
              done
              ;;
            ip*tables-save)
              # has no help/version, but run it to trigger the wrapper's
              # symlink replacement as a side-effect; it may fail with
              # "Permission denied" (not root) or "Protocol not supported"
              out=$("$cmd" 2>&1) || \
                echo "$out" | grep -qE \
                  "Protocol not supported|Permission denied"
              ;;
            *)
              echo "ERROR: Unknown command $cmd" 1>&2
              exit 1
          esac
          # Once the wrapper has been called once, all symlinks should
          # point to the detected variant
          symlinks_point_to="detected"
          check_target "$cmd" "$symlinks_point_to"
        done
    - name: restore through the wrapper lands in the host's backend
      runs: |
        set -euo pipefail
        wrapped_cmds="${{vars.wrapped-commands}}"
        for cmd in $wrapped_cmds; do
          ln -sf iptables-wrapper "/usr/bin/$cmd"
        done
        # Per backend: a fresh netns marked with kubelet's hint chain, and a
        # read-only /usr/bin so the wrapper cannot redirect its symlinks and
        # takes the fallback path read-only containers hit. The restored
        # chain must reach that backend and only that one.
        for mode in nft legacy; do
          other=legacy
          [ "$mode" = legacy ] && other=nft
          unshare -n -m sh -euc '
            mount --bind /usr/bin /usr/bin
            mount -o remount,bind,ro /usr/bin
            "iptables-$1" -t mangle -N KUBE-IPTABLES-HINT
            printf "*filter\n:STDIN-TEST - [0:0]\nCOMMIT\n" | iptables-restore -n
            test "$(readlink /usr/bin/iptables-restore)" = iptables-wrapper
            "iptables-$1-save" -t filter | grep -F ":STDIN-TEST"
            ! "iptables-$2-save" -t filter 2>/dev/null | grep -F ":STDIN-TEST"
          ' sh "$mode" "$other"
        done

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/iptables-wrappers
    use-tag: true
    strip-prefix: v
