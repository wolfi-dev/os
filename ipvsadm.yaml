package:
  name: ipvsadm
  version: "1.31"
  epoch: 47 # glibc: 2.43->2.44
  description: The IP Virtual Server administration utility
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 4Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libnl3-dev
      - linux-headers
      - popt-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://kernel.googlesource.com/pub/scm/utils/kernel/ipvsadm/ipvsadm.git
      tag: v${{package.version}}
      expected-commit: a0e3834fbe85754dd221bc0d1c0c1eb46e12aa51

  - runs: |
      make libs && make BUILD_ROOT="${{targets.destdir}}" \
        MANDIR=usr/share/man \
        SBIN="${{targets.destdir}}/usr/bin" \
        INIT="${{targets.destdir}}/etc/init.d"

      make -j1 BUILD_ROOT="${{targets.destdir}}" \
        MANDIR=usr/share/man \
        SBIN="${{targets.destdir}}/usr/bin" \
        INIT="${{targets.destdir}}/etc/init.d" \
        install

  - uses: strip

subpackages:
  - name: ipvsadm-doc
    description: ipvsadm docs
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 1398

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test ipvsadm list and save operations
      runs: |
        # List and save operations require the ip_vs kernel module;
        # skip gracefully if the module is not available in this environment
        if [ -f /proc/net/ip_vs ]; then
          ipvsadm --list --numeric
          ipvsadm --save --numeric
        else
          echo "IPVS kernel module not loaded; skipping runtime tests"
        fi
    - uses: test/no-docs
