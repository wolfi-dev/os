#nolint:valid-pipeline-git-checkout-tag
package:
  name: isla-snapshots
  # isla-snapshots tags only v0.1.0 (2021); its models change by commit.
  version: 0_git20260602
  epoch: 0
  description: Arm Sail ISA models compiled for the Isla symbolic executor
  copyright:
    # The Arm models (sail-arm).
    - license: BSD-3-Clause-Clear
    # Sail's library (prelude and the other lib/*.sail), compiled into
    # every model.
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - ${{package.name}}-armv8p5
      - ${{package.name}}-armv9p3
      - ${{package.name}}-armv9p4
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  # The licence texts, which the snapshot repository does not carry: each
  # model's from sail-arm, and Sail's.
  sail-arm-commit: 7d0581642d0e3aaca367bbc5650aca7c53057543
  sail-commit: 3df54034910b31a1e00d948ee965b2e9603d68e0

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rems-project/isla-snapshots
      branch: master
      expected-commit: d8b31014643035a3b11071e56ef30001de3f52ab

  - uses: fetch
    with:
      uri: https://raw.githubusercontent.com/rems-project/sail-arm/${{vars.sail-arm-commit}}/arm-v8.5-a/LICENSE
      expected-sha256: b4429bace59c652d31a7c91dae871bf1526de6269d6dfcecfcbe7006e5291c8e
      extract: false

  - runs: mv LICENSE LICENSE.armv8p5

  - uses: fetch
    with:
      uri: https://raw.githubusercontent.com/rems-project/sail-arm/${{vars.sail-arm-commit}}/arm-v9.3-a/LICENSE
      expected-sha256: 2459a033b7d182285d5d302c5211eb729d6b9340543a9a757cb34d76ac10a993
      extract: false

  - runs: mv LICENSE LICENSE.armv9p3

  - uses: fetch
    with:
      uri: https://raw.githubusercontent.com/rems-project/sail-arm/${{vars.sail-arm-commit}}/arm-v9.4-a/LICENSE
      expected-sha256: 121df4677b246ccb78e33f257c131ee6164067a52c01235bd3d272c82e44dcc4
      extract: false

  - runs: mv LICENSE LICENSE.armv9p4

  - uses: fetch
    with:
      uri: https://raw.githubusercontent.com/rems-project/sail/${{vars.sail-commit}}/LICENSE
      expected-sha256: cc5133e58dd523cb772ac7b2c3047845b54667fe856165aef651f059ca51b2fe
      extract: false

  - runs: |
      mv LICENSE LICENSE.sail
      d="${{targets.contextdir}}/usr/share/licenses/${{package.name}}"
      mkdir -p "$d"
      install -m644 README.md LICENSE.sail "$d"/

# One subpackage per Arm model, so a user installs only the models it runs;
# the RISC-V and Morello models in the repository are not packaged. The
# 9.x models stay gzipped as upstream ships them (156 MB unpacked for 9.4).
# Isla reads plain or serialized (.irx) models only, so they are unpacked
# before use.
subpackages:
  - name: ${{package.name}}-armv8p5
    description: Armv8.5-A Sail model (sail-arm arm-v8.5-a) for Isla
    pipeline:
      - runs: |
          install -Dm644 armv8p5.ir "${{targets.contextdir}}"/usr/share/isla-snapshots/armv8p5.ir
          install -Dm644 LICENSE.armv8p5 "${{targets.contextdir}}"/usr/share/licenses/${{subpkg.name}}/LICENSE
    test:
      pipeline:
        - runs: |
            # The text IR starts with Sail's primitive declarations, and
            # carries Isla's footprint entry point.
            sed -n 1p /usr/share/isla-snapshots/armv8p5.ir | grep -F 'val zz5izDzKz5i64'
            grep -q '^fn zisla_footprint(' /usr/share/isla-snapshots/armv8p5.ir
            grep -F 'BSD 3-clause Clear' /usr/share/licenses/isla-snapshots-armv8p5/LICENSE

  - name: ${{package.name}}-armv9p3
    description: Armv9.3-A Sail model (sail-arm arm-v9.3-a) for Isla, gzipped
    pipeline:
      - runs: |
          install -Dm644 armv9p3.ir.gz "${{targets.contextdir}}"/usr/share/isla-snapshots/armv9p3.ir.gz
          install -Dm644 LICENSE.armv9p3 "${{targets.contextdir}}"/usr/share/licenses/${{subpkg.name}}/LICENSE
    test:
      pipeline:
        - runs: |
            gzip -t /usr/share/isla-snapshots/armv9p3.ir.gz
            test "$(gunzip -c /usr/share/isla-snapshots/armv9p3.ir.gz | grep -c '^fn zisla_footprint(')" -gt 0

  - name: ${{package.name}}-armv9p4
    description: Armv9.4-A Sail model (sail-arm arm-v9.4-a) for Isla, gzipped
    pipeline:
      - runs: |
          install -Dm644 armv9p4.ir.gz "${{targets.contextdir}}"/usr/share/isla-snapshots/armv9p4.ir.gz
          install -Dm644 LICENSE.armv9p4 "${{targets.contextdir}}"/usr/share/licenses/${{subpkg.name}}/LICENSE
    test:
      pipeline:
        - runs: |
            gzip -t /usr/share/isla-snapshots/armv9p4.ir.gz
            # The 9.4 model's footprint function starts with the reset
            # sequence; the _no_init variant skips it.
            test "$(gunzip -c /usr/share/isla-snapshots/armv9p4.ir.gz | grep -c '^fn zisla_footprint_no_init(')" -gt 0

update:
  enabled: true
  git: {}
  schedule:
    period: monthly
    reason: Upstream publishes models by commit, not by tag.

test:
  pipeline:
    - runs: |
        test -s /usr/share/licenses/isla-snapshots/LICENSE.sail
        test -s /usr/share/isla-snapshots/armv8p5.ir
        test -s /usr/share/isla-snapshots/armv9p3.ir.gz
        test -s /usr/share/isla-snapshots/armv9p4.ir.gz
