package:
  name: jasper
  version: "4.2.9"
  epoch: 2 # glibc: 2.43->2.44
  description: "Official Repository for the JasPer Image Coding Toolkit"
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-2.44-dev
      - libtool
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jasper-software/jasper/
      tag: version-${{package.version}}
      expected-commit: 63e106c80eb72af9fd4fa28772499ab0138b9994

  - uses: cmake/configure
    with:
      opts: |
        -DALLOW_IN_SOURCE_BUILD=ON

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: "jasper-dev"
    description: "headers for jasper"
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: "jasper-doc"
    description: "documentation for jasper"
    pipeline:
      - uses: split/manpages
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share
          mv "${{targets.destdir}}"/usr/share/doc "${{targets.subpkgdir}}"/usr/share/
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: jasper-software/jasper
    strip-prefix: version-

test:
  pipeline:
    - runs: |
        jasper --version | grep ${{package.version}}
        imgcmp --version | grep ${{package.version}}
        imginfo --version | grep ${{package.version}}
    - name: Test image format conversion (PGM to BMP)
      runs: |
        # Create a minimal 4x4 grayscale PGM image (ASCII format)
        printf "P2\n4 4\n255\n0 64 128 255\n64 128 192 255\n128 192 224 255\n192 224 240 255\n" > /tmp/test.pgm

        # Convert PGM to BMP using jasper
        jasper --input /tmp/test.pgm --output /tmp/test.bmp --output-format bmp

        # Verify the output file was created and is non-empty
        [ -s /tmp/test.bmp ] || { echo "BMP output file is empty or missing"; exit 1; }

        # Convert BMP back to PGM to verify round-trip
        jasper --input /tmp/test.bmp --output /tmp/test_rt.pgm --output-format pgx
        [ -s /tmp/test_rt.pgm ] || { echo "Round-trip output file is empty or missing"; exit 1; }
    - name: Test imginfo reports image metadata
      runs: |
        # Create a minimal 2x3 grayscale PGM image
        printf "P2\n2 3\n255\n10 20\n30 40\n50 60\n" > /tmp/info_test.pgm

        # Verify imginfo can successfully parse a PGM image (exit 0 = success)
        imginfo -f /tmp/info_test.pgm
    - name: Test imgcmp compares identical images
      runs: |
        # Create a minimal PGM image
        printf "P2\n2 2\n255\n0 128\n64 255\n" > /tmp/cmp_a.pgm
        cp /tmp/cmp_a.pgm /tmp/cmp_b.pgm

        # Verify imgcmp successfully compares two identical images (exit 0 = success)
        imgcmp -f /tmp/cmp_a.pgm -F /tmp/cmp_b.pgm
    - uses: test/tw/ldd-check
    - uses: test/no-docs
