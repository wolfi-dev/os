package:
  name: jed
  version: 0.99.19
  epoch: 8 # upstream-tests/make-check
  description: Powerful editor for programmers
  copyright:
    - license: GPL-2.0
  dependencies:
    runtime:
      - gtk-3
      - s-lang
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - expat-dev
      - fontconfig-dev
      - glibc-2.44-dev
      - gtk-3-dev
      - libxft-dev
      - ncurses-dev
      - ncurses-terminfo
      - s-lang-dev

pipeline:
  - uses: git-checkout
    with:
      repository: git://git.jedsoft.org/git/jed.git
      tag: v${{package.version}}
      expected-commit: 3ae695916eb1bffa996c166227e8f4de476edc6a

  - uses: autoconf/configure

  - uses: autoconf/make

  # This suite reports only through make check's exit status (no automake/TAP/autotest summary).
  - uses: upstream-tests/make-check
    with:
      target: runtests
      dir: src
      harness: custom

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    description: ${{package.name}} manpages
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        jed --version
        jed-script --version
        jed --help
        jed-script --help
