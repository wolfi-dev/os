package:
  name: jitterentropy-rngd
  version: "1.3.2"
  epoch: 0 # go/wolfi-rsc/jitterentropy-rngd
  description: Jitterentropy RNGd
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.43-dev
      - jitterentropy-library-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/smuellerDD/jitterentropy-rngd
      expected-commit: 58f60b76ff10f6ece15f0c83fda89717f7424efa
      tag: v${{package.version}}

  - runs: |
      # Remove embedded copy of jitterentropy-library
      rm -rf lib/*
      rm -rf jitterentropy.h jitterentropy-base-user.h
      # Link against public static libjitter-entoropy
      sed '/^LIBRARIES/s/$/ :libjitterentropy.a/' -i Makefile
      # Install into /usr
      sed '/^PREFIX/s|/usr/local|/usr|' -i Makefile

  - uses: autoconf/make-install

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/bin
      mv "${{targets.destdir}}"/usr/sbin/* "${{targets.destdir}}"/usr/bin
      rmdir "${{targets.destdir}}"/usr/sbin

  - uses: strip

update:
  enabled: true
  github:
    identifier: smuellerDD/jitterentropy-rngd
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - name: Test daemon startup
      uses: test/daemon-check-output
      with:
        start: /usr/bin/jitterentropy-rngd -f
        expected_output: "."
        timeout: "10"
        error_strings: ""
    - uses: test/no-docs

subpackages:
  - name: jitterentropy-rngd-doc
    description: jitterentropy-rngd documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/tw/docs
