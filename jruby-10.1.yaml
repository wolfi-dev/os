package:
  name: jruby-10.1
  version: "10.1.1.0"
  epoch: 3 # ship the bin/ dotfiles the launcher reads
  description: JRuby, an implementation of Ruby on the JVM
  copyright:
    - license: LGPL-2.0-or-later
  dependencies:
    runtime:
      - wolfi-baselayout

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.43-dev
      - maven
      - openjdk-${{vars.java-version}}
      - openjdk-${{vars.java-version}}-default-jdk

vars:
  java-version: "21"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jruby/jruby
      tag: ${{package.version}}
      expected-commit: ac4faa95b4e9e48f2e768f386d3225f5936fa344

  # JRuby uses polyglot-maven-plugin (.mvn/extensions.xml) so Maven reads
  # lib/pom.rb directly — lib/pom.xml is generated and ignored as input.
  - name: bump jruby-openssl to pull in Bouncy Castle 1.84 (GHSA-p93r-85wp-75v3)
    runs: |
      sed -i "s|\\['jruby-openssl', '0.15.6'\\]|['jruby-openssl', '0.16.0']|" lib/pom.rb

  - uses: patch
    # cves-json+net-imap.patch fixes the following CVEs in json and net-imap:
    #
    # - CVE-2026-33210 GHSA-3m6g-2423-7cp3
    # - CVE-2026-42245 GHSA-q2mw-fvj9-vvcw
    # - CVE-2026-42246 GHSA-vcgp-9326-pqcp
    # - CVE-2026-42256 GHSA-87pf-fpwv-p7m7
    # - CVE-2026-42257 GHSA-hm49-wcqc-g2xg
    # - CVE-2026-42258 GHSA-75xq-5h9v-w6px
    # - CVE-2026-47240 GHSA-8p34-64r3-mwg8
    # - CVE-2026-47241 GHSA-c4fp-cxrr-mj66
    # - CVE-2026-47242 GHSA-46q3-7gv7-qmgg
    # - CVE-2026-54696 GHSA-x2f5-4prf-w687
    with:
      patches: |
        cves-json+net-imap.patch

  - runs: |
      mvn install

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      mkdir -p ${{targets.contextdir}}/usr/share/jruby
      mkdir -p ${{targets.contextdir}}/usr/share/jruby/bin

      rm -rf lib/jni/*Darwin*
      rm -rf lib/jni/*-SunOS*
      rm -rf lib/jni/*-Windows*
      rm -rf lib/jni/*-AIX*
      rm -rf lib/jni/*-*BSD*
      rm -rf lib/target
      mv lib "${{targets.contextdir}}"/usr/share/jruby

      rm -rf bin/*.bat
      rm -rf bin/*.dll
      rm -rf bin/*.exe
      # cp -a bin/. rather than mv bin/*, which skips the bin/ dotfiles the
      # launcher reads at startup.
      cp -a bin/. "${{targets.contextdir}}"/usr/share/jruby/bin/

      for binary in jgem jirb jruby jrubyc; do
        ln -sf "/usr/share/jruby/bin/${binary}" "${{targets.contextdir}}/usr/bin/${binary}"
      done

  - name: Upgrade net-imap to fix GHSA-87pf-fpwv-p7m7
    runs: |
      home="${{targets.contextdir}}/usr/share/jruby"
      gemdir="$home/lib/ruby/gems/shared"
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
      export PATH="$home/bin:$PATH"
      # Install the patched net-imap 0.6.4.1 (fixes GHSA-87pf-fpwv-p7m7 and related CVEs).
      # --ignore-dependencies avoids downloading transitive deps (e.g. timeout) from
      # rubygems.org; all required runtime deps are already bundled with JRuby.
      gem install net-imap \
        --install-dir "$gemdir" \
        --no-document \
        --ignore-dependencies \
        --version "0.6.4.1"
      # Remove the pre-bundled vulnerable net-imap 0.6.2.
      gem uninstall net-imap \
        --install-dir "$gemdir" \
        --version "0.6.2" \
        --ignore-dependencies --executables --force
      # Fail the build if the fixed version is not present.
      test -e "$gemdir"/specifications/net-imap-0.6.4.1.gemspec

subpackages:
  - name: ${{package.name}}-default-ruby
    description: Set the ruby interpreter to jruby implementation
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mkdir -p ${{targets.contextdir}}/usr/share/jruby/bin
          for binary in gem irb ruby rake bundle bundler; do
            ln -sf "/usr/share/jruby/bin/${binary}" "${{targets.contextdir}}/usr/bin/${binary}"
          done
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/symlink-check
      with:
        allow-absolute: true
    - name: The launcher reads these bin/ dotfiles
      runs: |
        for f in .dev_mode.java_opts .jruby.java_opts .jruby.module_opts \
                 .jruby.release; do
          test -r "/usr/share/jruby/bin/$f"
        done
        # Missing JRUBY_MAIN sends jruby.sh down its legacy 9.4 fallback.
        grep -q '^JRUBY_MAIN=' /usr/share/jruby/bin/.jruby.release
        # Missing these loses JRuby's --add-opens on modular JVMs.
        grep -q '^--add-opens ' /usr/share/jruby/bin/.jruby.module_opts

update:
  enabled: true
  github:
    identifier: jruby/jruby
    use-tag: true
    tag-filter-prefix: 10.1.
