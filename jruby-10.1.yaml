package:
  name: jruby-10.1
  version: "10.1.1.0"
  epoch: 1 # GHSA-p93r-85wp-75v3 GHSA-87pf-fpwv-p7m7
  description: JRuby, an implementation of Ruby on the JVM
  copyright:
    - license: LGPL-2.0-or-later
  dependencies:
    runtime:
      - wolfi-baselayout

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.43-dev
      - maven
      - openjdk-${{vars.java-version}}
      - openjdk-${{vars.java-version}}-default-jdk

vars:
  java-version: "21"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jruby/jruby
      tag: ${{package.version}}
      expected-commit: ac4faa95b4e9e48f2e768f386d3225f5936fa344

  # JRuby uses polyglot-maven-plugin (.mvn/extensions.xml) so Maven reads
  # lib/pom.rb directly — lib/pom.xml is generated and ignored as input.
  - name: bump jruby-openssl to pull in Bouncy Castle 1.84 (GHSA-p93r-85wp-75v3)
    runs: |
      sed -i "s|\\['jruby-openssl', '0.15.6'\\]|['jruby-openssl', '0.16.0']|" lib/pom.rb

  - runs: |
      mvn install

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      mkdir -p ${{targets.contextdir}}/usr/share/jruby
      mkdir -p ${{targets.contextdir}}/usr/share/jruby/bin

      rm -rf lib/jni/*Darwin*
      rm -rf lib/jni/*-SunOS*
      rm -rf lib/jni/*-Windows*
      rm -rf lib/jni/*-AIX*
      rm -rf lib/jni/*-*BSD*
      rm -rf lib/target
      mv lib "${{targets.contextdir}}"/usr/share/jruby

      rm -rf bin/*.bat
      rm -rf bin/*.dll
      rm -rf bin/*.exe
      mv bin/* "${{targets.contextdir}}"/usr/share/jruby/bin/

      for binary in jgem jirb jruby jrubyc; do
        ln -sf "/usr/share/jruby/bin/${binary}" "${{targets.contextdir}}/usr/bin/${binary}"
      done

  - name: Upgrade net-imap to fix GHSA-87pf-fpwv-p7m7
    runs: |
      home="${{targets.contextdir}}/usr/share/jruby"
      gemdir="$home/lib/ruby/gems/shared"
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
      export PATH="$home/bin:$PATH"
      # Install the patched net-imap 0.6.4.1 (fixes GHSA-87pf-fpwv-p7m7 and related CVEs).
      # --ignore-dependencies avoids downloading transitive deps (e.g. timeout) from
      # rubygems.org; all required runtime deps are already bundled with JRuby.
      gem install net-imap \
        --install-dir "$gemdir" \
        --no-document \
        --ignore-dependencies \
        --version "0.6.4.1"
      # Remove the pre-bundled vulnerable net-imap 0.6.2.
      gem uninstall net-imap \
        --install-dir "$gemdir" \
        --version "0.6.2" \
        --ignore-dependencies --executables --force
      # Fail the build if the fixed version is not present.
      test -e "$gemdir"/specifications/net-imap-0.6.4.1.gemspec

subpackages:
  - name: ${{package.name}}-default-ruby
    description: Set the ruby interpreter to jruby implementation
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mkdir -p ${{targets.contextdir}}/usr/share/jruby/bin
          for binary in gem irb ruby rake bundle bundler; do
            ln -sf "/usr/share/jruby/bin/${binary}" "${{targets.contextdir}}/usr/bin/${binary}"
          done
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/symlink-check
      with:
        allow-absolute: true

update:
  enabled: true
  github:
    identifier: jruby/jruby
    use-tag: true
    tag-filter-prefix: 10.1.
