package:
  name: jruby-9.4
  version: "9.4.16.0"
  epoch: 0 # rebuild to publish jruby-9.4-source
  description: JRuby, an implementation of Ruby on the JVM
  copyright:
    - license: LGPL-2.0-or-later
  dependencies:
    provides:
      - jruby=${{package.full-version}}

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - maven
      - openjdk-8
      - openjdk-8-default-jdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jruby/jruby
      tag: ${{package.version}}
      expected-commit: 946cd0de3280fea70eadfdd2732536b0dfeaf511

  # JRuby uses polyglot-maven-plugin (.mvn/extensions.xml) so Maven reads
  # lib/pom.rb directly — lib/pom.xml is generated and ignored as input.
  # jruby-openssl vendors Bouncy Castle, so its version is the only lever on the
  # bcprov/bcpkix/bctls/bcutil jars that land in lib/ruby/stdlib. 0.16.2+ vendors
  # 1.85 or later, which closes the 28 July 2026 coordinated Bouncy Castle
  # release (GHSA-p93r-85wp-75v3). Stay on the 0.16 line: 0.19.x relocates the
  # jars from lib/ to vendor/ inside the gem, which breaks jar-dependencies'
  # literal versioned-path resolution.
  #
  # As of 9.4.16.0 upstream ships jruby-openssl 0.16.3 (Bouncy Castle 1.86),
  # uri 0.12.5 (CVE-2025-61594) and net-imap 0.6.7 itself, so the earlier sed
  # bumps are no longer needed. This guard replaces them: it fails the build
  # when upstream's lib/pom.rb drifts away from the fixed versions, so a future
  # bump breaks loudly instead of silently shipping a vulnerable gem.
  - name: verify fixed jruby-openssl, uri and net-imap versions are pinned upstream
    runs: |
      grep -F "['jruby-openssl', '0.16.3']" lib/pom.rb
      grep -F "['uri', '0.12.5']" lib/pom.rb
      grep -F "['net-imap', '0.6.7']" lib/pom.rb

  - runs: |
      export JAVA_HOME=/usr/lib/jvm/java-1.8-openjdk

      mvn install

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      mkdir -p ${{targets.contextdir}}/usr/share/jruby
      mkdir -p ${{targets.contextdir}}/usr/share/jruby/bin

      rm -rf lib/jni/*Darwin*
      rm -rf lib/jni/*-SunOS*
      rm -rf lib/jni/*-Windows*
      rm -rf lib/jni/*-AIX*
      rm -rf lib/jni/*-*BSD*
      rm -rf lib/target
      mv lib "${{targets.contextdir}}"/usr/share/jruby

      rm -rf bin/*.bat
      rm -rf bin/*.dll
      rm -rf bin/*.exe
      # cp -a bin/. rather than mv bin/*, which skips the bin/ dotfiles the
      # launcher reads at startup.
      cp -a bin/. "${{targets.contextdir}}"/usr/share/jruby/bin/

      for binary in jgem jirb jruby jrubyc; do
        ln -sf "/usr/share/jruby/bin/${binary}" "${{targets.contextdir}}/usr/bin/${binary}"
      done

  - name: Verify net-imap is past GHSA-46q3-7gv7-qmgg, GHSA-8p34-64r3-mwg8, GHSA-c4fp-cxrr-mj66
    runs: |
      # Upstream 9.4.16.0 bundles net-imap 0.6.7, which is newer than the
      # 0.5.15 fix for these advisories. Fail the build if the vulnerable
      # 0.2.5 copy (shipped by older jruby dists) is present, or if the
      # fixed version is not.
      home="${{targets.contextdir}}/usr/share/jruby"
      if [ -n "$(find "$home" -name 'net-imap-0.2.5*' | head -n1)" ]; then
        echo "vulnerable net-imap 0.2.5 is still present" >&2
        exit 1
      fi
      test -n "$(find "$home" -name 'net-imap-0.6.7*' | head -n1)"

subpackages:
  - name: ${{package.name}}-default-ruby
    description: Set the ruby interpreter to jruby implementation
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mkdir -p ${{targets.contextdir}}/usr/share/jruby/bin
          for binary in gem irb ruby rake bundle bundler; do
            ln -sf "/usr/share/jruby/bin/${binary}" "${{targets.contextdir}}/usr/bin/${binary}"
          done
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

update:
  enabled: true
  github:
    identifier: jruby/jruby
    use-tag: true
    tag-filter-prefix: 9.4.

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/symlink-check
      with:
        allow-absolute: true
    - name: The launcher reads these bin/ dotfiles
      runs: |
        for f in .dev_mode.java_opts .jruby.java_opts .jruby.module_opts \
                 .jruby.release; do
          test -r "/usr/share/jruby/bin/$f"
        done
        # Missing JRUBY_MAIN sends jruby.sh down its legacy 9.4 fallback.
        grep -q '^JRUBY_MAIN=' /usr/share/jruby/bin/.jruby.release
        # Missing these loses JRuby's --add-opens on modular JVMs.
        grep -q '^--add-opens ' /usr/share/jruby/bin/.jruby.module_opts
