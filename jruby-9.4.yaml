package:
  name: jruby-9.4
  version: "9.4.15.0"
  epoch: 6 # ship the bin/ dotfiles the launcher reads
  description: JRuby, an implementation of Ruby on the JVM
  copyright:
    - license: LGPL-2.0-or-later
  dependencies:
    provides:
      - jruby=${{package.full-version}}

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - maven
      - openjdk-8
      - openjdk-8-default-jdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jruby/jruby
      tag: ${{package.version}}
      expected-commit: 6114208a317732f8ad54d6cd3a06a46fcde03a08

  # JRuby uses polyglot-maven-plugin (.mvn/extensions.xml) so Maven reads
  # lib/pom.rb directly — lib/pom.xml is generated and ignored as input.
  - name: bump jruby-openssl to pull in Bouncy Castle 1.84 (GHSA-p93r-85wp-75v3)
    runs: |
      sed -i "s|\\['jruby-openssl', '0.15.4'\\]|['jruby-openssl', '0.16.0']|" lib/pom.rb

  # uri is a default gem, so its spec lives in specifications/default/. A
  # `gem install` would add a second, non-default spec and leave the vulnerable
  # uri-0.12.4.gemspec in place, so the default_gems entry is edited instead.
  - name: bump uri to 0.12.5 to fix CVE-2025-61594
    uses: sed
    with:
      path: lib/pom.rb
      pattern: |-
        \['uri', '0\.12\.4'\]
      replacement: |-
        ['uri', '0.12.5']

  - runs: |
      export JAVA_HOME=/usr/lib/jvm/java-1.8-openjdk

      mvn install

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      mkdir -p ${{targets.contextdir}}/usr/share/jruby
      mkdir -p ${{targets.contextdir}}/usr/share/jruby/bin

      rm -rf lib/jni/*Darwin*
      rm -rf lib/jni/*-SunOS*
      rm -rf lib/jni/*-Windows*
      rm -rf lib/jni/*-AIX*
      rm -rf lib/jni/*-*BSD*
      rm -rf lib/target
      mv lib "${{targets.contextdir}}"/usr/share/jruby

      rm -rf bin/*.bat
      rm -rf bin/*.dll
      rm -rf bin/*.exe
      # cp -a bin/. rather than mv bin/*, which skips the bin/ dotfiles the
      # launcher reads at startup.
      cp -a bin/. "${{targets.contextdir}}"/usr/share/jruby/bin/

      for binary in jgem jirb jruby jrubyc; do
        ln -sf "/usr/share/jruby/bin/${binary}" "${{targets.contextdir}}/usr/bin/${binary}"
      done

  - name: Upgrade net-imap to fix GHSA-46q3-7gv7-qmgg, GHSA-8p34-64r3-mwg8, GHSA-c4fp-cxrr-mj66
    runs: |
      home="${{targets.contextdir}}/usr/share/jruby"
      gemdir="$home/lib/ruby/gems/shared"
      export JAVA_HOME=/usr/lib/jvm/java-1.8-openjdk
      export PATH="$home/bin:$PATH"
      # Install the patched net-imap 0.5.15 (fixes GHSA-46q3-7gv7-qmgg,
      # GHSA-8p34-64r3-mwg8, GHSA-c4fp-cxrr-mj66; requires ruby >= 3.1,
      # satisfied by jruby 9.4's ruby 3.1.x compatibility).
      gem install net-imap \
        --install-dir "$gemdir" \
        --no-document \
        --version "0.5.15"
      # Remove the pre-bundled vulnerable net-imap 0.2.5 (the only copy
      # shipped by the jruby dist; earlier patched versions never exist in
      # a fresh build context).
      gem uninstall net-imap \
        --install-dir "$gemdir" \
        --version "0.2.5" \
        --ignore-dependencies --executables --force
      # Fail the build if the fixed version is not present.
      test -e "$gemdir"/specifications/net-imap-0.5.15.gemspec

subpackages:
  - name: ${{package.name}}-default-ruby
    description: Set the ruby interpreter to jruby implementation
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mkdir -p ${{targets.contextdir}}/usr/share/jruby/bin
          for binary in gem irb ruby rake bundle bundler; do
            ln -sf "/usr/share/jruby/bin/${binary}" "${{targets.contextdir}}/usr/bin/${binary}"
          done
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

update:
  enabled: true
  github:
    identifier: jruby/jruby
    use-tag: true
    tag-filter-prefix: 9.4.

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/symlink-check
      with:
        allow-absolute: true
    - name: The launcher reads these bin/ dotfiles
      runs: |
        for f in .dev_mode.java_opts .jruby.java_opts .jruby.module_opts \
                 .jruby.release; do
          test -r "/usr/share/jruby/bin/$f"
        done
        # Missing JRUBY_MAIN sends jruby.sh down its legacy 9.4 fallback.
        grep -q '^JRUBY_MAIN=' /usr/share/jruby/bin/.jruby.release
        # Missing these loses JRuby's --add-opens on modular JVMs.
        grep -q '^--add-opens ' /usr/share/jruby/bin/.jruby.module_opts
