package:
  name: kbld
  version: "0.49.2"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.1
  description: kbld seamlessly incorporates image building and image pushing into your development and deployment workflows
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  go-version: "1.27"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 81e932f200ff9d195d120ebdf55f539085182b36
      repository: https://github.com/carvel-dev/kbld
      tag: v${{package.version}}

  - uses: bump
    with:
      deps: |-
        golang.org/x/net@v0.55.0

  - uses: go/build/v2
    with:
      packages: ./cmd/kbld
      output: kbld
      ldflags: -X carvel.dev/kbld/pkg/kbld/version.Version=v${{package.version}}

update:
  enabled: true
  github:
    identifier: carvel-dev/kbld
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: kbld
    - uses: test/tw/help-check
      with:
        bins: kbld
    - name: write config
      runs: |
        cat <<EOF > build.yml
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: test
        spec:
          selector:
            matchLabels:
              app: test
          template:
            metadata:
              labels:
                app: test
            spec:
              containers:
              - name: my-app
                image: cgr.dev/chainguard/static
        EOF
    - name: run kbld
      # We do a very simple resolve here based on https://carvel.dev/kbld/docs/v0.44.x/resolving/
      # We don't do a full resolve+build, since this requires a Docker daemon.
      runs: |
        kbld -f build.yml | grep -F "cgr.dev/chainguard/static@sha256:"

environment:
  contents:
    packages:
      - go-${{vars.go-version}}
