package:
  name: kind
  version: "0.33.0"
  epoch: 0 # go: 1.26->1.27
  description: Kubernetes IN Docker - local clusters for testing Kubernetes
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 5Gi

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/kind
      tag: v${{package.version}}
      expected-commit: 407a9675e6d9af1200b5f57f9ca52ec6cdacce74

  - uses: go/build/v2
    with:
      packages: ./cmd/kind
      ldflags: -X sigs.k8s.io/kind/pkg/version.Version=${{package.version}}
      output: ./kind

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/kind
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: kind
    - uses: test/tw/ver-check
      with:
        bins: kind
        version: ${{package.version}}
    - runs: |
        set -euo pipefail
        kind completion bash | grep -F "kind"
        kind completion zsh | grep -F "kind"
