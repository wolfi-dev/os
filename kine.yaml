package:
  name: kine
  version: "0.17.0"
  epoch: 0 # go: 1.26->1.27
  description: Run Kubernetes on MySQL, Postgres, sqlite, dqlite, not etcd.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6fb95f5504de608d96dec5732eee3496f4976d7a
      repository: https://github.com/k3s-io/kine
      tag: v${{package.version}}

  - runs: |
      export CGO_CFLAGS="-Wno-error=braces-around-scalar-init"
      ./scripts/build
      install -Dm755 ./bin/kine "${{targets.destdir}}/usr/bin/kine"

update:
  enabled: true
  github:
    identifier: k3s-io/kine
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - sqlite
        - curl
  pipeline:
    - uses: test/tw/ldd-check
    - name: "Check kine version"
      runs: |
        kine --version
        kine --help
    - name: "Test kine with SQLite backend"
      uses: test/daemon-check-output
      with:
        start: |
          kine --endpoint sqlite://kine.db
        timeout: 60
        expected_output: |
          Kine available at http://127.0.0.1:2379
        post: |
          set -euo pipefail
          wait-for-it localhost:2379 -t 30

          # Check metrics endpoint
          metrics=$(curl -s http://localhost:8080/metrics)
          echo "$metrics" | grep -q "kine_"
