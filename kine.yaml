package:
  name: kine
  version: "0.17.5"
  epoch: 1 # toolchain rebuild for  go-1.27-1.27.4
  description: Run Kubernetes on MySQL, Postgres, sqlite, dqlite, not etcd.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f82bd25164a393b333815f41746ef89de0d5ae20
      repository: https://github.com/k3s-io/kine
      tag: v${{package.version}}

  - uses: bump
    with:
      language: go
      deps: golang.org/x/net@v0.62.0

  - runs: |
      DIRTY="" TAG="v${{package.version}}" ./scripts/build
      install -Dm755 ./bin/kine "${{targets.destdir}}/usr/bin/kine"

update:
  enabled: true
  github:
    identifier: k3s-io/kine
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - sqlite
        - curl
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: kine
        version: kine version v${{package.version}}
        version-flag: --version
    - uses: test/tw/help-check
      with:
        bins: kine
    - name: "Test kine with SQLite backend"
      uses: test/daemon-check-output
      with:
        start: |
          kine --endpoint sqlite://kine.db
        timeout: 60
        expected_output: |
          Kine available at http://127.0.0.1:2379
        post: |
          set -euo pipefail
          wait-for-it localhost:2379 -t 30

          # Check metrics endpoint
          metrics=$(curl -s http://localhost:8080/metrics)
          echo "$metrics" | grep -q "kine_"
