package:
  name: kine
  version: "0.16.4"
  epoch: 1 # GO-2026-6107
  description: Run Kubernetes on MySQL, Postgres, sqlite, dqlite, not etcd.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26

pipeline:
  - uses: git-checkout
    with:
      expected-commit: caf32704a06bacda37aec4db49ec432eda567241
      repository: https://github.com/k3s-io/kine
      tag: v${{package.version}}

  - uses: bump
    with:
      deps: |-
        go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.44.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.44.0
        go.etcd.io/etcd/client/pkg/v3@v3.6.14
        go.etcd.io/etcd/client/v3@v3.6.14
        go.etcd.io/etcd/server/v3@v3.6.14
        go.etcd.io/etcd/pkg/v3@v3.6.14
        go.etcd.io/etcd/api/v3@v3.6.14

  - runs: |
      export CGO_CFLAGS="-Wno-error=braces-around-scalar-init"
      ./scripts/build
      install -Dm755 ./bin/kine "${{targets.destdir}}/usr/bin/kine"

update:
  enabled: true
  github:
    identifier: k3s-io/kine
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - sqlite
        - curl
  pipeline:
    - uses: test/tw/ldd-check
    - name: "Check kine version"
      runs: |
        kine --version
        kine --help
    - name: "Test kine with SQLite backend"
      uses: test/daemon-check-output
      with:
        start: |
          kine --endpoint sqlite://kine.db
        timeout: 60
        expected_output: |
          Kine available at http://127.0.0.1:2379
        post: |
          set -euo pipefail
          wait-for-it localhost:2379 -t 30

          # Check metrics endpoint
          metrics=$(curl -s http://localhost:8080/metrics)
          echo "$metrics" | grep -q "kine_"
