package:
  name: kissat
  version: "4.0.4"
  epoch: 0
  description: Kissat SAT solver
  copyright:
    - license: MIT
  resources:
    cpu: "4"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/arminbiere/kissat
      tag: rel-${{package.version}}
      expected-commit: 8af8e56f174b778aef3aa45af9f739b2a5f492c2

  # --safe disables writing through popen, as Kani's own build of kissat
  # (scripts/setup/install_kissat.sh) does.
  - runs: |
      ./configure --safe
      make -j$(nproc) kissat
      install -Dm755 build/kissat ${{targets.destdir}}/usr/bin/kissat

  - uses: strip

update:
  enabled: true
  github:
    identifier: arminbiere/kissat
    use-tag: true
    tag-filter-prefix: rel-
    strip-prefix: rel-

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: version
      runs: |
        kissat --version | grep -Fx "${{package.version}}"
    - name: decide a satisfiable and an unsatisfiable formula
      runs: |
        # kissat exits 10 for satisfiable and 20 for unsatisfiable.
        printf 'p cnf 2 2\n1 2 0\n-1 0\n' > sat.cnf
        rc=0; kissat sat.cnf > sat.log || rc=$?
        [ "$rc" -eq 10 ] || { cat sat.log; exit 1; }
        grep -Fx 's SATISFIABLE' sat.log
        printf 'p cnf 1 2\n1 0\n-1 0\n' > unsat.cnf
        rc=0; kissat unsat.cnf > unsat.log || rc=$?
        [ "$rc" -eq 20 ] || { cat unsat.log; exit 1; }
        grep -Fx 's UNSATISFIABLE' unsat.log
