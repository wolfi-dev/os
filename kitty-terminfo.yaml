package:
  name: kitty-terminfo
  version: "0.49.2"
  epoch: 0 # go/wolfi-rsc/kitty-terminfo
  description: Terminfo for the kitty terminal emulator
  copyright:
    - license: GPL-3.0-only
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - ncurses

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kovidgoyal/kitty
      tag: v${{package.version}}
      expected-commit: b2cb871254fbdac19a085188813c8dfb258b95cd

  - runs: |
      mkdir -p "${{targets.destdir}}/etc/terminfo"
      tic -x -o "${{targets.destdir}}/etc/terminfo" terminfo/kitty.terminfo

update:
  enabled: true
  github:
    identifier: kovidgoyal/kitty
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/contains-files
      with:
        dir: /etc/terminfo/x/
        name: xterm-kitty
