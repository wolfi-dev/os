package:
  name: kitty
  version: "0.48.1"
  epoch: 0
  description: GPU-based cross-platform, fast, feature-rich terminal emulator
  copyright:
    - license: GPL-3.0-only
  resources:
    cpu: "8"
    memory: 8Gi
  dependencies:
    runtime:
      - kitty-terminfo
      - nerd-fonts-symbols

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cairo-dev
      - dbus-dev
      - fontconfig
      - fontconfig-dev
      - freetype-dev
      - go-1.26
      - harfbuzz-dev
      - lcms2-dev
      - libglvnd-dev
      - libpng-dev
      - libx11-dev
      - libxcursor-dev
      - libxi-dev
      - libxinerama-dev
      - libxkbcommon-dev
      - libxrandr-dev
      - mesa-dev
      - nerd-fonts-symbols
      - openssl-dev
      - pixman-dev
      - pkgconf
      - python-3.13
      - python-3.13-dev
      - simde-dev
      - systemd-dev
      - wayland-dev
      - wayland-protocols-dev
      - xxhash-dev
      - zlib-dev
  environment:
    GOPATH: /tmp/go
    GOCACHE: /tmp/go-cache
    HOME: /tmp

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kovidgoyal/kitty
      tag: v${{package.version}}
      expected-commit: 4f2f6a076b2baa9310d54cbf4d8191f7dbaffd20

  - name: Build kitty
    runs: |
      set -euo pipefail

      # add_builtin_fonts() in setup.py checks whether
      # fonts/SymbolsNerdFontMono-Regular.ttf already exists, and if so skips
      # the fc-list lookup entirely (setup.py "if os.path.exists(dest): continue").
      # nerd-fonts-symbols installs it at /usr/share/fonts/nerd-fonts-symbols/.
      mkdir -p fonts
      cp /usr/share/fonts/nerd-fonts-symbols/SymbolsNerdFontMono-Regular.ttf fonts/

      # Skip the sphinx-based docs build. setup.py's create_linux_bundle_gunk
      # only runs `make docs` if docs/_build/html does not exist; and
      # copy_man_pages / copy_html_docs only require the source directories
      # to exist (they glob-copy contents). Pre-creating both as empty
      # directories bypasses the docs build entirely, avoiding four unpinned
      # PyPI installs (sphinx_copybutton, sphinx_inline_tabs, sphinxext-opengraph,
      # furo). Kitty ships without man pages / html docs — an acceptable trade
      # off for supply-chain hygiene until those extensions are packaged.
      mkdir -p docs/_build/man docs/_build/html

      # Disable Go's VCS stamping — git refuses to inspect /home/build
      # under dubious-ownership rules in the melange build sandbox.
      export GOFLAGS="-buildvcs=false"

      # Build kitty using its setup.py. Default --prefix is ./linux-package;
      # do NOT pass --prefix=/usr, which would send files into the real /usr/
      # inside the build container and never populate linux-package/.
      python3 setup.py linux-package \
        --libdir-name=lib \
        --verbose

      # Install into destdir
      mkdir -p "${{targets.destdir}}"/usr
      cp -r linux-package/bin "${{targets.destdir}}"/usr/
      cp -r linux-package/lib "${{targets.destdir}}"/usr/
      cp -r linux-package/share "${{targets.destdir}}"/usr/

  - uses: strip

subpackages:
  - name: kitty-shell-integration
    description: Shell integration scripts for the kitty terminal emulator
    pipeline:
      - runs: |
          set -euo pipefail
          mkdir -p "${{targets.contextdir}}"/usr/lib/kitty/shell-integration
          cp -r "${{targets.destdir}}"/usr/lib/kitty/shell-integration/. \
            "${{targets.contextdir}}"/usr/lib/kitty/shell-integration/
          rm -rf "${{targets.destdir}}"/usr/lib/kitty/shell-integration
    test:
      pipeline:
        - name: Verify shell integration files are installed
          runs: |
            set -euo pipefail
            test -d /usr/lib/kitty/shell-integration
            ls /usr/lib/kitty/shell-integration

update:
  enabled: true
  github:
    identifier: kovidgoyal/kitty
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify kitty and kitten binaries are present and executable
      runs: |
        set -euo pipefail
        test -x /usr/bin/kitty
        test -x /usr/bin/kitten
    - uses: test/tw/ver-check
      with:
        bins: |
          kitty
          kitten
        version: ${{package.version}}
    - name: Test kitty version output
      runs: |
        set -euo pipefail
        kitty --version 2>&1 | grep -F "${{package.version}}"
        kitten --version 2>&1 | grep -F "${{package.version}}"
    - name: Verify kitty assets are installed
      runs: |
        set -euo pipefail
        test -d /usr/lib/kitty
        test -f /usr/share/applications/kitty.desktop
        test -f /usr/share/icons/hicolor/scalable/apps/kitty.svg
