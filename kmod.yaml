package:
  name: kmod
  version: "34.2"
  epoch: 47
  description: Linux kernel module management utilities
  copyright:
    - license: LGPL-2.1
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - gtk-doc
      - libtool
      - libxslt
      - openssl-hardened-dev
      - pkgconf-dev
      - scdoc
      - sed
      - tree
      - xz-dev
      - zlib-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://kernel.googlesource.com/pub/scm/utils/kernel/kmod/kmod.git
      tag: v${{package.version}}
      expected-commit: 13330c958deef15c227a9c83d8ba72106152fd7f

  - runs: |
      ./autogen.sh

  - uses: autoconf/configure
    with:
      opts: |
        --host=${{host.triplet.gnu}} \
        --build=${{host.triplet.gnu}} \
        --target=${{host.triplet.gnu}} \
        --prefix=/usr \
        --with-zlib \
        --with-xz \
        --with-zstd \
        --with-openssl \
        --sbindir=/usr/bin

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      for i in lsmod rmmod insmod modinfo modprobe depmod; do
        ln -sf kmod ${{targets.destdir}}/usr/bin/$i
      done

  - uses: strip

subpackages:
  - name: kmod-doc
    description: kmod manpages
    pipeline:
      - uses: split/manpages
      - name: "remove faulty artifact"
        runs: rm ${{targets.subpkgdir}}/usr/share/man/man5/modules.dep.bin.5
    test:
      pipeline:
        - uses: test/docs

  - name: kmod-libs
    description: kmod libs
    pipeline:
      - runs: tree ${{targets.destdir}}
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib/libkmod.so* ${{targets.subpkgdir}}/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

  - name: kmod-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - kmod-libs
        - merged-usrsbin
        - wolfi-baselayout
    description: kmod dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf

  - name: kmod-bash-completion
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share
          mv ${{targets.destdir}}/usr/share/bash-completion ${{targets.subpkgdir}}/usr/share/
    description: kmod bash completion
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    test:
      pipeline:
        - uses: test/tw/shell-syntax-check

update:
  enabled: true
  release-monitor:
    identifier: 1517

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify kmod list subcommand works
      runs: |
        # kmod list is the functional equivalent of lsmod; it lists loaded modules
        kmod list
    - name: Verify lsmod symlink works
      runs: |
        # lsmod is a symlink to kmod; verify it runs and produces output
        lsmod
    - name: Verify depmod dry-run mode
      runs: |
        # depmod -n prints what would be written without modifying the filesystem.
        # Use a temporary base directory to avoid requiring /lib/modules/<kver>.
        kver=$(uname -r)
        tmpbase=$(mktemp -d)
        mkdir -p "$tmpbase/lib/modules/$kver"
        depmod -n -b "$tmpbase"
        rm -rf "$tmpbase"
    - name: Verify kmod static-nodes
      runs: |
        # kmod static-nodes lists static device nodes from modules.devname
        kmod static-nodes
    - uses: test/no-docs
