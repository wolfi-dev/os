package:
  name: kube-logging-operator-custom-runner
  version: "1.0.0"
  epoch: 1 # toolchain rebuild for  go-1.26-1.26.7
  description: Logging operator for Kubernetes - go custom runner
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kube-logging/custom-runner
      tag: v${{package.version}}
      expected-commit: c023f6e3d6765bfab33ee8925d1f871aa6e0626e

  - uses: go/build
    with:
      packages: ./cmd
      output: logging-operator-custom-runner
      go-package: go-1.26

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package for ${{package.name}}"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/
          ln -s ../usr/bin/logging-operator-custom-runner ${{targets.subpkgdir}}/runner
    dependencies:
      provides:
        - ${{package.name}}-entrypoint=${{package.full-version}}
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
        - uses: test/tw/help-check
          with:
            bins: /runner

update:
  enabled: true
  github:
    identifier: kube-logging/custom-runner
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/daemon-check-output
      with:
        start: |
          /usr/bin/logging-operator-custom-runner -cfgjson '{"events": {"onStart": [{"exec": {"command": "echo ONSTART"}}]}}'
        timeout: 60
        expected_output: |
          "msg":"command api listening"
          ONSTART

environment:
  contents:
    packages:
      - go-1.26
