package:
  name: kubescape
  version: "4.0.20"
  epoch: 1 # CVE-2026-116591
  description: Kubescape is an open-source Kubernetes security platform for your IDE, CI/CD pipelines, and clusters. It includes risk analysis, security, compliance, and misconfiguration scanning, saving Kubernetes users and administrators precious time, effort, and resources.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "17"
    memory: 19Gi

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ec65d3184f6bab7d1ad6e5db9d970d452316d253
      recurse-submodules: "true"
      repository: https://github.com/kubescape/kubescape
      tag: v${{package.version}}

  - uses: bump
    with:
      language: go
      packages: |-
        golang.org/x/image@v0.45.0
        github.com/sigstore/cosign/v3@v3.1.4
        github.com/google/go-containerregistry@v0.22.1
        golang.org/x/crypto@v0.58.0
        golang.org/x/sync@v0.24.0
        google.golang.org/api@v0.301.0
        github.com/andybalholm/brotli@v1.2.7
        github.com/klauspost/compress@v1.20.2

  - uses: go/build
    with:
      packages: .
      output: kubescape
      ldflags: -X main.version=${{package.version}} -X main.commit=$(git rev-parse HEAD) -X main.date=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")
      go-package: go-1.27

update:
  enabled: true
  github:
    identifier: kubescape/kubescape
    strip-prefix: v
  ignore-regex-patterns:
    - ".*rc.*"

test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: kubescape
    - uses: test/tw/ver-check
      with:
        bins: kubescape
    - uses: test/kwok/cluster
    - name: Verify kubescape scan
      runs: |
        kubescape scan framework NSA | grep -qi "Compliance Score"
