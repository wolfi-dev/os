package:
  name: kubescape
  version: "4.0.16"
  epoch: 2 # CVE-2026-114437
  description: Kubescape is an open-source Kubernetes security platform for your IDE, CI/CD pipelines, and clusters. It includes risk analysis, security, compliance, and misconfiguration scanning, saving Kubernetes users and administrators precious time, effort, and resources.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "17"
    memory: 19Gi

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d0ea07bcd9d7ab1640dcd6527d0e68a34f10da0e
      recurse-submodules: "true"
      repository: https://github.com/kubescape/kubescape
      tag: v${{package.version}}

  - uses: bump
    with:
      language: go
      packages: |-
        github.com/anchore/grype@v0.104.1
        github.com/anchore/syft@v1.42.3
        github.com/in-toto/in-toto-golang@v0.11.0
        github.com/go-git/go-git/v5@v5.19.2
        github.com/sigstore/cosign/v3@v3.0.6
        go.mongodb.org/mongo-driver@v1.17.7
        github.com/sigstore/fulcio@v1.8.6
        golang.org/x/image@v0.45.0
        github.com/cilium/ebpf@v0.22.0
        github.com/moby/go-archive@v0.3.0
        golang.org/x/crypto@v0.57.0
        github.com/cilium/cilium@v1.19.5
        github.com/aquasecurity/trivy@v0.72.0
        github.com/aws/aws-sdk-go-v2/service/ecr@v1.57.2
        golang.org/x/net@v0.60.0
        github.com/go-chi/chi/v5@v5.4.0

  - uses: go/build
    with:
      packages: .
      output: kubescape
      ldflags: -X main.version=${{package.version}} -X main.commit=$(git rev-parse HEAD) -X main.date=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")
      go-package: go-1.27

update:
  enabled: true
  github:
    identifier: kubescape/kubescape
    strip-prefix: v
  ignore-regex-patterns:
    - ".*rc.*"

test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: kubescape
    - uses: test/tw/ver-check
      with:
        bins: kubescape
    - uses: test/kwok/cluster
    - name: Verify kubescape scan
      runs: |
        kubescape scan framework NSA | grep -qi "Compliance Score"
