package:
  name: kubescape
  version: "4.0.21"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.4
  description: Kubescape is an open-source Kubernetes security platform for your IDE, CI/CD pipelines, and clusters. It includes risk analysis, security, compliance, and misconfiguration scanning, saving Kubernetes users and administrators precious time, effort, and resources.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "17"
    memory: 19Gi

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 42df4e161a97a8a0f4e656d45bba3d60cffb08f7
      recurse-submodules: "true"
      repository: https://github.com/kubescape/kubescape
      tag: v${{package.version}}

  - uses: bump
    with:
      language: go
      packages: |-
        github.com/sigstore/cosign/v3@v3.1.4
        github.com/hashicorp/go-getter@v1.8.10

  - uses: go/build
    with:
      packages: .
      output: kubescape
      ldflags: -X main.version=${{package.version}} -X main.commit=$(git rev-parse HEAD) -X main.date=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")
      go-package: go-1.27

update:
  enabled: true
  github:
    identifier: kubescape/kubescape
    strip-prefix: v
  ignore-regex-patterns:
    - ".*rc.*"

test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: kubescape
    - uses: test/tw/ver-check
      with:
        bins: kubescape
    - uses: test/kwok/cluster
    - name: Verify kubescape scan
      runs: |
        kubescape scan framework NSA | grep -qi "Compliance Score"
