package:
  name: lcms2
  version: "2.20"
  epoch: 1 # shared library naming: split liblcms2-${{vars.soversion}}
  description: "Color Management Engine"
  copyright:
    - license: MIT AND GPL-3.0-only
  dependencies:
    runtime:
      - liblcms2-${{vars.soversion}}=${{package.full-version}}
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  soversion: "2"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libjpeg-turbo-dev
      - libtool
      - wolfi-base
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mm2/Little-CMS.git
      tag: lcms${{package.version}}
      expected-commit: 7717fce0d85447ef3b2df0cca2e99207c15eeecd

  - runs: |
      ./autogen.sh

  - uses: autoconf/configure
    with:
      opts: |
        --with-jpeg \
        --with-tiff \
        --with-zlib \
        --with-threads

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: upstream-tests/make-check
    with:
      harness: custom

  - uses: strip

subpackages:
  - name: liblcms2-${{vars.soversion}}
    description: "Little CMS color management library"
    pipeline:
      - uses: split/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: "lcms2-dev"
    description: "headers for lcms2"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - liblcms2-${{vars.soversion}}=${{package.full-version}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: "lcms2-doc"
    description: "lcms2 documentation"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

  - name: "lcms2-utils"
    description: "Utility applications for lcms2"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/* "${{targets.subpkgdir}}"/usr/bin
    test:
      pipeline:
        - runs: |
            jpgicc version
            jpgicc --help
            linkicc version
            linkicc --help
            psicc version
            psicc --help
            transicc --help

update:
  enabled: true
  github:
    identifier: mm2/Little-CMS
    strip-prefix: lcms

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/no-docs
