package:
  name: ldns
  version: "1.9.2"
  epoch: 4 # shared library naming: split libldns${{vars.soversion}}
  description: Lowlevel DNS(SEC) library
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 4Gi
  dependencies:
    runtime:
      - libldns${{vars.soversion}}=${{package.full-version}}

vars:
  soversion: "3"
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libpcap-dev
      - libtool
      - openssl-hardened-${{vars.openssl-version}}-dev
      - perl

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NLnetLabs/ldns.git
      tag: ${{package.version}}
      expected-commit: 06466f0a20dc298a9dd6f444c15fa568398fff3c

  - runs: |
      autoreconf -vfi
      cp drill/install-sh .

  - uses: autoconf/configure
    with:
      opts: |
        --build=$CBUILD \
        --host=$CHOST \
        --prefix=/usr \
        --sysconfdir=/etc \
        --mandir=/usr/share/man \
        --infodir=/usr/share/info \
        --localstatedir=/var \
        --with-drill \
        --disable-dane-verify

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libldns${{vars.soversion}}
    description: "ldns shared library"
    pipeline:
      - uses: split/lib
        with:
          patterns: ldns
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: ldns-dev
    description: ldns development files
    dependencies:
      runtime:
        - libldns${{vars.soversion}}=${{package.full-version}}
        - openssl-${{vars.openssl-version}}-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - runs: |
            ldns-config --version
            ldns-config --help

  - name: "drill"
    description: "DNS(SEC) query tool ala dig"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/drill "${{targets.subpkgdir}}"/usr/bin/
    test:
      pipeline:
        - runs: |
            drill version
            drill help

  - name: ldns-doc
    description: ldns docs
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  ignore-regex-patterns:
    - "^testns.*"
    - "^release.*"
    - "^ldns.*"
  github:
    identifier: NLnetLabs/ldns
    use-tag: true

test:
  pipeline:
    # AUTOGENERATED
    - uses: test/tw/ldd-check
    - uses: test/no-docs
