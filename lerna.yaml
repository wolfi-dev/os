package:
  name: lerna
  version: "9.0.7"
  epoch: 18 # GHSA-5p4m-2wfm-xmqj
  description: "Lerna is a fast, modern build system for managing and publishing multiple JavaScript/TypeScript packages from the same repository."
  copyright:
    - license: MIT
  checks:
    disabled:
      - usrlocal
  dependencies:
    runtime:
      - nodejs
  resources:
    cpu: "2"
    memory: 8Gi

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - nodejs-26
      - npm

pipeline:
  - name: npm install
    runs: |
      npm install -g ${{package.name}}@${{package.version}} -prefix ${{targets.destdir}}/usr/local/

      # GHSA-5j98-mcp5-4vw2
      npm install glob@11.1.0 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/

      # GHSA-35jp-ww65-95wh, AIKIDO-2026-10823
      npm install axios@1.18.0 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/

      # GHSA-v2v4-37r5-5v8g GHSA-22jq-vg5j-6vgg GHSA-4xrf-jv44-h6hh GHSA-mwp4-54f8-5fhr
      npm install ip-address@10.3.1 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/

      # CVE GHSA-3xgq-45jj-v275
      npm install cross-spawn@7.0.5 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/

      # Fix tmp CVE GHSA-52f5-9888-hmc6, GHSA-ph9p-34f9-6g65, GHSA-7c78-jf6q-g5cm
      npm install tmp@0.2.7 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/

      # GHSA-mh29-5h37-fv8m, GHSA-h67p-54hq-rp68, GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj
      npm install js-yaml@4.3.1 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/

      # Bump tar to remediate GHSA-83g3-92jg-28cx GHSA-qffp-2rhf-9h96 GHSA-9ppj-qmqm-q256 GHSA-vmf3-w455-68vh
      # GHSA-23hp-3jrh-7fpw GHSA-8x88-c5mf-7j5w GHSA-gvwx-54wh-qm9j GHSA-w8wr-v893-vjvp GHSA-r292-9mhp-454m
      npm install tar@7.5.21 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/

      # Bump minimatch to remediate GHSA-23c5-xmqv-rm74 GHSA-7r86-cg39-jmmj
      npm install minimatch@3.1.4 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/

      # GHSA-7h2j-956f-4vf2 - must come before sub-package minimatch@10.x fixes to avoid clobbering
      npm install @isaacs/brace-expansion@5.0.1 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/

      # GHSA-2w6w-674q-4c4q
      npm install handlebars@4.7.9 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/

      # Sub-package fixes below - must come after all top-level lerna/ installs to avoid being clobbered

      # GHSA-mh29-5h37-fv8m, GHSA-h67p-54hq-rp68, GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj
      npm install js-yaml@4.3.1 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@lerna/create/

      # Bump minimatch to remediate GHSA-23c5-xmqv-rm74 GHSA-7r86-cg39-jmmj
      npm install minimatch@5.1.8 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/filelist/
      npm install minimatch@10.2.3 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@nx/devkit/
      npm install minimatch@10.2.3 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/nx/
      npm install minimatch@10.2.3 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@nx/devkit/node_modules/nx/
      npm install minimatch@3.1.4 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@lerna/create/

      # Bump tmp to remediate GHSA-ph9p-34f9-6g65, GHSA-7c78-jf6q-g5cm (nested nx/@nx copies)
      npm install tmp@0.2.7 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/nx/
      npm install tmp@0.2.7 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@nx/devkit/
      npm install tmp@0.2.7 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@nx/devkit/node_modules/nx/

      # Bump follow-redirects to remediate GHSA-r4q5-vmmm-2653
      npm install follow-redirects@1.16.0 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/
      npm install follow-redirects@1.16.0 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/nx/
      npm install follow-redirects@1.16.0 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@nx/devkit/
      npm install follow-redirects@1.16.0 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@nx/devkit/node_modules/nx/

      # nx declares an exact "brace-expansion": "5.0.6", so these two copies do
      # not follow the transitive re-resolution that clears the rest of the tree.
      # GHSA-3jxr-9vmj-r5cp GHSA-mh99-v99m-4gvg GHSA-rgw5-rvv9-x895
      npm install brace-expansion@5.0.9 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/nx/
      npm install brace-expansion@5.0.9 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@nx/devkit/node_modules/nx/

      # axios must be the LAST install at each of these prefixes: a later
      # npm install at the same prefix re-resolves the tree and reverts it
      # to 1.16.0.
      # GHSA-5c9x-8gcm-mpgx GHSA-35jp-ww65-95wh AIKIDO-2026-10823 GHSA-gcfj-64vw-6mp9
      # GHSA-42h9-826w-cgv3 GHSA-7q8q-rj6j-mhjq GHSA-f4gw-2p7v-4548 GHSA-hcpx-6fm6-wx23
      # GHSA-jqh4-m9w3-8hp9 GHSA-mmx7-hfxf-jppx GHSA-mwf2-3pr3-8698 GHSA-pmv8-rq9r-6j72
      # GHSA-xj6q-8x83-jv6g
      npm install axios@1.18.0 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/nx/
      npm install axios@1.18.0 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@nx/devkit/
      npm install axios@1.18.0 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@nx/devkit/node_modules/nx/

      # Bump tar to remediate GHSA-83g3-92jg-28cx GHSA-qffp-2rhf-9h96 GHSA-9ppj-qmqm-q256 GHSA-vmf3-w455-68vh
      # GHSA-23hp-3jrh-7fpw GHSA-8x88-c5mf-7j5w GHSA-gvwx-54wh-qm9j GHSA-w8wr-v893-vjvp GHSA-r292-9mhp-454m
      npm install tar@7.5.21 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@lerna/create/

      # Fix minimatch@10.x in @lerna/create sub-packages - must come after tar fix to avoid being clobbered
      npm install minimatch@10.2.3 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@lerna/create/node_modules/@nx/devkit/
      npm install minimatch@10.2.3 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@lerna/create/node_modules/@nx/devkit/node_modules/nx/
      npm install minimatch@10.2.3 -prefix ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/@lerna/create/node_modules/nx/

      # https://github.com/browserify/resolve/issues/288
      sed -i 's/monorepo-symlink-test/false-positive/g' ${{targets.destdir}}/usr/local/lib/node_modules/lerna/node_modules/resolve/test/resolver/multirepo/package.json

  - name: Remove musl related files
    runs: |
      # remove musl deps that end up polluting our SCA-generated dependencies with unresolveable deps.
      find ${{targets.contextdir}} -type d -name '*musl*' -print -exec rm -rf {} + 2>/dev/null || true

update:
  enabled: true
  github:
    identifier: lerna/lerna
    use-tag: true
    tag-filter: v
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - npm
        - git
  pipeline:
    - name: Check Lerna version
      runs: |
        # Verify that Lerna is installed and the version command works
        lerna --version
        lerna --help
    - name: Initialize a Lerna repository
      runs: |
        # Initialize a new Lerna repository and check for success message
        lerna init --independent
    - uses: test/tw/ldd-check
