package:
  name: libXxf86misc
  version: 1.0.4
  epoch: 3 # glibc: 2.43->2.44
  description: X.Org X11 XFree86 miscellaneous extensions library
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 6Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - glibc-2.44-dev
      - libtool
      - libx11-dev
      - libxext-dev
      - pkgconf-dev
      - util-macros-dev
      - xorgproto

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/xorg/lib/libxxf86misc
      tag: libXxf86misc-${{package.version}}
      expected-commit: 388f29f98dd264059cc7ee5342e2ca32463de2d3

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: headers for ${{package.name}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: libXxf86misc-dev
    dependencies:
      runtime:
        - libXxf86misc

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/docs

test:
  environment:
    contents:
      packages:
        - build-base
        - libXxf86misc-dev
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - name: Compile and link against libXxf86misc
      runs: |
        cat > test.c << 'EOF'
        #include <X11/Xlib.h>
        #include <X11/extensions/xf86misc.h>
        int main(void) {
            /* Verify the library header is usable and types are defined */
            XF86MiscMouseSettings mouse;
            XF86MiscKbdSettings kbd;
            (void)mouse;
            (void)kbd;
            return 0;
        }
        EOF
        gcc $(pkg-config --cflags xxf86misc) test.c -o test $(pkg-config --libs xxf86misc)
        echo "libXxf86misc compile-and-link test passed"

update:
  enabled: true
  git:
    strip-prefix: libXxf86misc-
  ignore-regex-patterns:
    - ^XORG-.*
    - ^CYGWIN-.*
    - ^lg3d-.*
    - ^XACE-.*
    - ^XEVIE-.*
    - ^DAMAGE-.*
    - ^COMPOSITE-.*
    - ^XFIXES-.*
    - ^sco_port_update-.*
    - ^MODULAR_COPY$
    - ^xf86-.*
    - ^rel-.*
    - ^IPv6-.*
    - ^XPRINT.*
    - ^before_.*
    - ^xo-.*
    - ^1_0_1
  schedule:
    period: monthly
    reason: This project doesn't do releases frequently
