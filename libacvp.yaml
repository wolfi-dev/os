package:
  name: libacvp
  version: "2.3.1"
  epoch: 3 # fix functional API test: use explicit flags instead of pkg-config
  description: "client-side implementation of the draft ACVP protocol "
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - bash-binsh
      - build-base
      - busybox
      - curl-dev
      - file

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cisco/libacvp
      tag: v${{package.version}}
      expected-commit: 91a49ff512d14ffba6cc1ef52d8185c9e1f3735e

  - uses: autoconf/configure
    with:
      opts: --with-libcurl-dir=/usr --with-ssl-dir=/usr

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - build-base
        - curl-dev
        - libacvp-dev
        - openssl-dev
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: acvp_app
        version: libacvp_oss-${{package.version}}
    - runs: |
        # Always exits 1, see https://github.com/cisco/libacvp/issues/872
        ! acvp_app --version >version.output
        grep -F 'Unable to detect FIPS provider version' version.output
    - name: Test libacvp API - create and free session context
      runs: |
        cat >test_acvp.c <<'EOF'
        #include <stdio.h>
        #include <stdlib.h>
        #include <acvp/acvp.h>

        static ACVP_RESULT progress(char *msg, ACVP_LOG_LVL level) {
            (void)msg; (void)level;
            return ACVP_SUCCESS;
        }

        int main(void) {
            ACVP_CTX *ctx = NULL;
            ACVP_RESULT rv;

            rv = acvp_create_test_session(&ctx, progress, ACVP_LOG_LVL_NONE);
            if (rv != ACVP_SUCCESS) {
                fprintf(stderr, "acvp_create_test_session failed: %d\n", rv);
                return 1;
            }
            printf("ACVP context created successfully\n");

            acvp_free_test_session(ctx);
            printf("ACVP context freed successfully\n");
            return 0;
        }
        EOF
        gcc test_acvp.c -o test_acvp \
            -I/usr/include \
            -lacvp -lcurl
        ./test_acvp
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: cisco/libacvp
    strip-prefix: v
