package:
  name: libapr
  version: "1.7.6"
  epoch: 5 # glibc: 2.43->2.44
  description: "Apache Portable Runtime Library (APR)"
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - elfutils-dev
      - glibc-2.44-dev
      - libtool
      - linux-headers
      - python3
      - wolfi-base
      - zlib-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/apr
      tag: ${{package.version}}
      expected-commit: 5c18df51a91bcb3807f78eb36841d4d2ccf5563d

  - uses: patch
    with:
      patches: apr-1.7.2-autoconf-2.72.patch

  - runs: |
      ./buildconf

  - uses: autoconf/configure
    with:
      opts: |
        --prefix=/usr \
        --libdir=/usr/lib \
        --with-installbuilddir=/usr/share/apr-1/build

  - uses: autoconf/make

  - uses: autoconf/make-install

  # These files are needed for building other packages like tomcat-native.
  # Those packages expect a `/build` to exist under the apr root.
  - runs: |
      for file in find_apr.m4 apr_common.m4 install.sh gen-build.py get-version.sh config.guess config.sub PrintPath; do
        install build/$file -t ${{targets.destdir}}/usr/share/apr-1/build
      done

  - uses: strip

subpackages:
  - name: "libapr-dev"
    description: "headers for libapr"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libapr
    test:
      pipeline:
        - uses: test/tw/devpackage
        - runs: |
            apr-1-config --version
            apr-1-config --help
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  ignore-regex-patterns:
    - '.*x-.*'
    - APACHE*
    - APR*
    - STRIKER*
  github:
    identifier: apache/apr
    use-tag: true

test:
  environment:
    contents:
      packages:
        - libapr-dev
        - build-base
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test APR library functionality
      runs: |
        tee test_apr.c <<'EOF'
        #include <apr_general.h>
        #include <apr_pools.h>
        #include <apr_strings.h>
        #include <stdio.h>
        int main(void) {
            apr_pool_t *pool;
            const char *str;
            if (apr_initialize() != APR_SUCCESS) return 1;
            if (apr_pool_create(&pool, NULL) != APR_SUCCESS) return 1;
            str = apr_pstrdup(pool, "hello from APR");
            if (!str) return 1;
            printf("%s\n", str);
            apr_pool_destroy(pool);
            apr_terminate();
            return 0;
        }
        EOF
        gcc $(apr-1-config --includes --cflags) test_apr.c -o test_apr $(apr-1-config --link-ld)
        ./test_apr
