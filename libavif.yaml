package:
  name: libavif
  version: "1.4.2"
  epoch: 1 # add functional encode/decode test
  description: Library for encoding and decoding .avif files
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - aom-dev
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - dav1d-dev
      - glibc-2.43-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - samurai
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/AOMediaCodec/libavif.git
      tag: v${{package.version}}
      expected-commit: c5240fc79fe5c2407e10afd35f5505ef6333ea49

  - uses: cmake/configure
    with:
      opts: |
        -DAVIF_BUILD_APPS=ON \
        -DAVIF_BUILD_TESTS=OFF \
        -DAVIF_CODEC_AOM=SYSTEM \
        -DAVIF_CODEC_DAV1D=SYSTEM \
        -DAVIF_LIBYUV=OFF

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: libavif-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libavif
    description: libavif dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: libavif-apps
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/* ${{targets.subpkgdir}}/usr/bin/
    description: libavif apps
    test:
      environment:
        contents:
          packages:
            - python3
      pipeline:
        - name: Encode PNG to AVIF and decode back
          runs: |
            # Create a minimal 1x1 red pixel PNG using Python3
            python3 << 'EOF'
            import struct, zlib

            def make_png(width, height, r, g, b):
                def chunk(name, data):
                    c = struct.pack('>I', len(data)) + name + data
                    return c + struct.pack('>I', zlib.crc32(name + data) & 0xffffffff)
                sig = b'\x89PNG\r\n\x1a\n'
                ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
                raw = b'\x00' + bytes([r, g, b] * width)
                idat = chunk(b'IDAT', zlib.compress(raw * height))
                iend = chunk(b'IEND', b'')
                return sig + ihdr + idat + iend

            with open('/tmp/test.png', 'wb') as f:
                f.write(make_png(8, 8, 255, 0, 0))
            EOF

            # Encode PNG to AVIF
            avifenc /tmp/test.png /tmp/test.avif
            test -s /tmp/test.avif

            # Decode AVIF back to PNG
            avifdec /tmp/test.avif /tmp/decoded.png
            test -s /tmp/decoded.png

update:
  enabled: true
  github:
    identifier: AOMediaCodec/libavif
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
