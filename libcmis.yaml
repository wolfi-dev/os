package:
  name: libcmis
  version: "0.6.3"
  epoch: 2
  description: C/C++ CMIS client library
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "2"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - boost-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl-dev
      - libtool
      - libxml2-dev
      - m4
      - pkgconf-dev
  environment:
    CXXFLAGS: -Wno-error=unused-but-set-variable

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tdf/libcmis
      expected-commit: 9221b621398213c988f00c3feb15d5a0601d5ec4
      tag: v${{package.version}}

  - runs: |
      autoreconf -fiv

  - uses: autoconf/configure
    with:
      # bulding docs requires docbook2x which we don't have
      opts: |
        --disable-tests \
        --without-man

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libcmis-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: tdf/libcmis
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - boost-dev
        - build-base
        - libcmis-dev
        - libxml2-dev
        - pkgconf
  pipeline:
    - name: Test library compilation and API
      runs: |
        # Compile a program that exercises the libcmis C++ API
        cat > /tmp/test_libcmis.cpp << 'EOF'
        #include <libcmis/libcmis.hxx>
        #include <libcmis/exception.hxx>
        #include <string>
        #include <iostream>

        int main() {
            // Exercise the libcmis exception API (no network needed)
            try {
                throw libcmis::Exception( "test error", "constraint" );
            } catch ( const libcmis::Exception& e ) {
                std::string msg = e.what();
                std::string type = e.getType();
                if ( msg.empty() ) {
                    std::cerr << "ERROR: exception message is empty" << std::endl;
                    return 1;
                }
                if ( type != "constraint" ) {
                    std::cerr << "ERROR: unexpected exception type: " << type << std::endl;
                    return 1;
                }
                std::cout << "libcmis exception API works: msg=" << msg
                          << " type=" << type << std::endl;
            }
            return 0;
        }
        EOF
        g++ $(pkg-config --cflags libcmis-0.6) /tmp/test_libcmis.cpp \
            -o /tmp/test_libcmis \
            $(pkg-config --libs libcmis-0.6)
        /tmp/test_libcmis | grep -F "libcmis exception API works"
    - uses: test/tw/ldd-check
    - uses: test/no-docs
