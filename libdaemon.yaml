package:
  name: libdaemon
  version: 0.14
  epoch: 7 # glibc: 2.43->2.44
  description: A lightweight C library which eases the writing of UNIX daemons
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44
      - glibc-2.44-dev
      - libtool
      - lynx

pipeline:
  - uses: fetch # blocked-no-git-repo: git.0pointer.net is gone (bad TLS cert, http redirects to the homepage)
    with:
      uri: https://0pointer.de/lennart/projects/libdaemon/libdaemon-${{package.version}}.tar.gz
      expected-sha256: fd23eb5f6f986dcc7e708307355ba3289abe03cc381fc47a80bca4a50aa6b834

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libdaemon-doc
    pipeline:
      - name: "relocate docs"
        runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share
          mv "${{targets.destdir}}"/usr/share/doc "${{targets.subpkgdir}}"/usr/share
    test:
      pipeline:
        - uses: test/docs

  - name: libdaemon-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  release-monitor:
    identifier: 13299

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/no-docs
