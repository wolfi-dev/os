package:
  name: libde265
  version: "1.1.1"
  epoch: 2 # glibc: 2.43->2.44
  description: Open h.265 video codec implementation
  copyright:
    - license: LGPL-3.0-or-later
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - build-base
      - cmake
      - glibc-2.44-dev
      - libsdl2-dev
      - pkgconf-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/strukturag/libde265.git
      tag: v${{package.version}}
      expected-commit: 4dd701fffac01632ffd5cabc5ef10deb56accba1

  - uses: cmake/configure
    with:
      opts: -DENABLE_SHERLOCK265=OFF

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

update:
  enabled: true
  github:
    identifier: strukturag/libde265
    strip-prefix: v

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development libraries and headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/pkgconf

test:
  environment:
    contents:
      packages:
        - build-base
        - libde265-dev
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test libde265 API
      runs: |
        cat > test_de265.c << 'EOF'
        #include <libde265/de265.h>
        #include <stdio.h>
        #include <stdlib.h>
        int main() {
            const char *version = de265_get_version();
            printf("libde265 version: %s\n", version);
            if (!version || version[0] == '\0') {
                fprintf(stderr, "de265_get_version() returned empty string\n");
                return 1;
            }
            de265_decoder_context *ctx = de265_new_decoder();
            if (!ctx) {
                fprintf(stderr, "de265_new_decoder() returned NULL\n");
                return 1;
            }
            de265_free_decoder(ctx);
            printf("libde265 API test passed\n");
            return 0;
        }
        EOF
        gcc $(pkg-config --cflags libde265) test_de265.c -o test_de265 $(pkg-config --libs libde265)
        ./test_de265
