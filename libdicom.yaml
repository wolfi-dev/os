package:
  name: libdicom
  version: "1.3.0"
  epoch: 0
  description: C library for reading DICOM files, with a focus on whole slide imaging
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - meson
      - uthash

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ImagingDataCommons/libdicom
      tag: v${{package.version}}
      expected-commit: 8c84fdbef433395619f3b099e939d36877a9d48f

  - uses: meson/configure
    with:
      opts: -Dtests=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libdicom-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libdicom
    description: libdicom dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/header-check

  - name: libdicom-doc
    pipeline:
      - uses: split/manpages
    description: libdicom manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: ImagingDataCommons/libdicom
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - build-base
        - libdicom-dev
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - name: Check the tools report the package version
      runs: |
        dcm-dump -V | grep -Fx "${{package.version}}"
        dcm-dump -h
        dcm-getframe -h
    - name: Compile, link and query the library version
      runs: |
        tee test_libdicom.c <<'EOT'
        #include <dicom/dicom.h>
        #include <stdio.h>
        #include <string.h>

        int main(void) {
            const char *version = dcm_get_version();
            printf("libdicom %s\n", version);
            if (strcmp(version, "${{package.version}}") != 0) {
                fprintf(stderr, "FAIL: expected ${{package.version}}\n");
                return 1;
            }
            if (!dcm_is_valid_vr("UI") || dcm_is_valid_vr("ZZ")) {
                fprintf(stderr, "FAIL: VR validation\n");
                return 1;
            }
            return 0;
        }
        EOT
        gcc test_libdicom.c -o test_libdicom $(pkg-config --cflags --libs libdicom)
        ./test_libdicom
