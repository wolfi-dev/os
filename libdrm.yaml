# Generated from https://git.alpinelinux.org/aports/plain/main/libdrm/APKBUILD
package:
  name: libdrm
  version: "2.4.134"
  epoch: 1 # go/wolfi-rsc/libdrm
  description: Userspace interface to kernel DRM services
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - glibc-2.43-dev
      - libpciaccess-dev
      - linux-headers
      - meson
      - systemd-dev
      - xmlto
  environment:
    CFLAGS: "-O2"

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/mesa/libdrm
      tag: libdrm-${{package.version}}
      expected-commit: e984d448b8b17aab853369e6c203e53719f46de1

  - runs: |
      meson \
        -Db_lto=true \
        -Dfreedreno=enabled \
        -Dtegra=enabled \
        -Domap=enabled \
        -Dexynos=enabled \
        -Dvc4=enabled \
        -Detnaviv=enabled \
        -Dudev=true \
        -Dinstall-test-programs=true \
        -Dtests=true \
        --prefix=/usr \
        . output
      meson compile --verbose -C output
      DESTDIR="${{targets.destdir}}" meson install --no-rebuild -C output

  - uses: strip

subpackages:
  - name: libdrm-libs
    pipeline:
      - uses: split/lib
    description: libdrm shared libraries
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: libdrm-dev
    pipeline:
      - uses: split/dev
    description: libdrm dev
    dependencies:
      runtime:
        - libdrm-libs
    test:
      environment:
        contents:
          packages:
            - build-base
            - libdrm-libs
            - pkgconf
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
        - name: Compile and link test against libdrm
          runs: |
            set -euo pipefail

            tee test.c <<'EOF'
            #include <xf86drm.h>
            int main() {
                int available = drmAvailable();
                return 0;
            }
            EOF

            gcc $(pkg-config --cflags libdrm) test.c -o test $(pkg-config --libs libdrm)
            ./test

update:
  enabled: true
  release-monitor:
    identifier: 1596

test:
  environment:
    contents:
      packages:
        - build-base
        - libdrm-dev
        - pkgconf
  pipeline:
    # AUTOGENERATED
    - runs: |
        etnaviv_cmd_stream_test --version
        exynos_fimg2d_event --version
        exynos_fimg2d_perf --version
        exynos_fimg2d_test --version
        modetest --version
        vbltest --version
        etnaviv_cmd_stream_test --help
        exynos_fimg2d_event --help
        exynos_fimg2d_perf --help
        exynos_fimg2d_test --help
        modetest --help
        vbltest --help
    - uses: test/tw/ldd-check
    - name: Test DRM library API via drmAvailable
      runs: |
        set -euo pipefail

        tee test_drm.c <<'EOF'
        #include <xf86drm.h>
        #include <stdio.h>
        int main() {
            /* drmAvailable() probes the DRM kernel interface;
               returns 1 if available, 0 if not (e.g. in a container).
               Either result is valid — we just verify the library links
               and the call completes without crashing. */
            int avail = drmAvailable();
            printf("drmAvailable() = %d\n", avail);
            return 0;
        }
        EOF

        gcc $(pkg-config --cflags libdrm) test_drm.c -o test_drm $(pkg-config --libs libdrm)
        ./test_drm
