package:
  name: libdwarf
  version: "2.3.2"
  epoch: 0 # go/wolfi-rsc/libdwarf
  description: Parsing library for DWARF2 and later debugging file format
  copyright:
    - license: LGPL-2.1-only
  resources:
    cpu: "2"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - elfutils-dev
      - libtool
      - meson
      - pkgconf-dev
      - zlib-dev
      - zstd-dev

pipeline:
  - name: Checkout libdwarf
    uses: git-checkout
    with:
      repository: https://github.com/davea42/libdwarf-code
      tag: v${{package.version}}
      expected-commit: af7b278c6aa2ae9daad94fb7f8bffdc0e9980993

  - name: Configure libdwarf
    uses: meson/configure
    with:
      opts: |
        -Db_lto=true \
        -Ddwarfgen=true

  - name: Compile libdwarf
    uses: meson/compile

  - name: Test libdwarf
    runs: meson test --no-rebuild --print-errorlogs -C output

  - name: Install libdwarf
    uses: meson/install

  - name: Strip libdwarf
    uses: strip

subpackages:
  - name: libdwarfp
    pipeline:
      - name: Split libdwarfp
        runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib/libdwarfp.so* ${{targets.contextdir}}/usr/lib
    description: DWARF debug symbols producer library
    test:
      pipeline:
        - runs: stat /usr/lib/libdwarfp.so.${{package.version}}
        - uses: test/tw/ldd-check

  - name: libdwarf-dev
    pipeline:
      - name: Split libdwarf dev files
        uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
    dependencies:
      runtime:
        - libdwarf
    description: Development files for libdwarf

  - name: dwarf-tools
    pipeline:
      - name: Split DWARF tools
        runs: |
          mkdir -p ${{targets.contextdir}}/usr/share
          # Do not change the target directory
          # This is where dwarfdump configuration is expected, and where tools are placed
          mv ${{targets.destdir}}/usr/bin ${{targets.contextdir}}/usr/share/dwarfdump
    description: Tools for interacting with DWARF2 and later debugging files
    test:
      pipeline:
        - runs: |
            /usr/share/dwarfdump/dwarfdump -V | grep ${{package.version}}
            /usr/share/dwarfdump/dwarfdump -h
            /usr/share/dwarfdump/dwarfdump /bin/sh

  - name: dwarf-tools-doc
    pipeline:
      - name: Split docs for DWARF tools
        uses: split/manpages
    description: Documentation for DWARF tools
    test:
      pipeline:
        - uses: test/tw/docs

test:
  environment:
    contents:
      packages:
        - libdwarf-dev
        - build-base
        - pkgconf
  pipeline:
    - runs: stat /usr/lib/libdwarf.so.${{package.version}}
    - uses: test/tw/ldd-check
    - uses: test/no-docs
    - name: Test libdwarf API usage
      runs: |
        cat > test_dwarf.c << 'EOF'
        #include <libdwarf-0/libdwarf.h>
        #include <stdio.h>
        #include <stdlib.h>

        int main(void) {
            Dwarf_Debug dbg;
            Dwarf_Error err;
            int res;

            /* Try to open an ELF binary; it may or may not have DWARF info */
            res = dwarf_init_path("/bin/sh", NULL, 0,
                DW_GROUPNUMBER_ANY, NULL, NULL, &dbg, &err);
            if (res == DW_DLV_ERROR) {
                dwarf_dealloc_error(dbg, err);
                fprintf(stderr, "dwarf_init_path returned DW_DLV_ERROR\n");
                return 1;
            }
            if (res == DW_DLV_OK) {
                dwarf_finish(dbg);
            }
            printf("libdwarf API call succeeded\n");
            return 0;
        }
        EOF
        gcc $(pkg-config --cflags libdwarf) test_dwarf.c -o test_dwarf $(pkg-config --libs libdwarf)
        ./test_dwarf

update:
  enabled: true
  github:
    identifier: davea42/libdwarf-code
    tag-filter: v
    strip-prefix: v
    use-tag: true
