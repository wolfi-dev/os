package:
  name: libeconf
  version: "0.8.6"
  epoch: 3
  description: Enhanced Config File Parser
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash # upstream-tests: test runner scripts
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - meson

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9f43b3480209272e4f4992129cca7a40b3e496e9
      repository: https://github.com/openSUSE/libeconf
      tag: v${{package.version}}

  - uses: meson/configure
    with:
      opts: -Db_lto=true
      output-dir: build

  - runs: ninja -C build

  - runs: DESTDIR="${{targets.destdir}}" ninja -C build install

  - uses: upstream-tests/meson-test
    with:
      dir: build

  - uses: strip

subpackages:
  - name: libeconf-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libeconf
    description: libeconf dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: ${{package.name}} manpages
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: openSUSE/libeconf
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: "Verify econftool availability"
      runs: |
        econftool --help
    - name: "Test basic configuration file handling"
      runs: |
        # Create test configuration
        cat > /etc/test.conf <<EOF
        key1=value1
        key2=value2
        EOF

        # Test showing configuration
        econftool show test.conf
    - name: "Test configuration syntax checking"
      runs: |
        # Create valid configuration
        cat > /etc/syntax-test.conf <<EOF
        valid_key=valid_value
        EOF

        # Test syntax check
        econftool syntax syntax-test.conf
    - name: "Test configuration file cat functionality"
      runs: |
        # Create test file
        cat > /etc/cat-test.conf <<EOF
        setting1=value1
        setting2=value2
        EOF

        # Test cat command
        econftool cat cat-test.conf
