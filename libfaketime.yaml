package:
  name: libfaketime
  version: "0.9.13"
  epoch: 0 # glibc: 2.43->2.44
  description: "libfaketime modifies the system time for a single application"
  copyright:
    - license: GPL-2.0
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  environment:
    CFLAGS: -DFAKE_RANDOM -Wno-discarded-qualifiers
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 86b37fde2fed7336ea2d0c17928e3015a55d9b4a
      repository: https://github.com/wolfcw/libfaketime
      tag: v${{package.version}}

  - uses: autoconf/make-install
    with:
      opts: |
        PREFIX=/usr FAKETIME_COMPILE_CFLAGS="-DFAKE_RANDOM -Wno-discarded-qualifiers"

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: Development files for ${{package.name}}
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        faketime '2023-02-01' date +%Y-%m-%d | grep -F 2023-02-01

update:
  enabled: true
  github:
    identifier: wolfcw/libfaketime
    strip-prefix: v
