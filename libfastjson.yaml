package:
  name: libfastjson
  version: "1.2609.0"
  epoch: 0 # glibc: 2.43->2.44
  description: a fast json library for C
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libtool

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c2329f89006600703711271c6c39fe5181286264
      repository: https://github.com/rsyslog/libfastjson
      tag: v${{package.version}}

  - uses: autoconf/configure
    with:
      # configure's isnan() probe misses -lm, so modf is left unlinked; force it.
      opts: LIBS=-lm

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      make check

  - uses: strip

subpackages:
  - name: libfastjson-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libfastjson
    description: libfastjson dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: rsyslog/libfastjson
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
