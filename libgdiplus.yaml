package:
  name: libgdiplus
  version: 6.2
  epoch: 7 # upstream-tests/make-check
  description: "Open Source Implementation of the GDI+ API"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libgdiplus${{vars.soversion}}=${{package.full-version}}

vars:
  soversion: "0"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cairo-dev
      - cmake
      - expat-dev
      - fontconfig # upstream-tests: text and font tests look fonts up through fontconfig
      - fribidi-dev
      - giflib-dev
      - glib-dev
      - glib-static
      - glibc-2.44-dev
      - harfbuzz-dev
      - libexif-dev
      - libtool
      - libxft-dev
      - pango-dev
      - pkgconf-dev
      - tiff-dev
      - ttf-dejavu # upstream-tests: text and font tests need an installed TrueType font

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.winehq.org/mono/libgdiplus
      tag: ${{package.version}}
      expected-commit: 5a6d5d7990a7a4955b4c856f89edaf4a366484ba

  - uses: autoconf/configure
    with:
      opts: |
        --prefix=/usr \
        --sysconfdir=/etc \
        --mandir=/usr/share/man \
        --infodir=/usr/share/info \
        --localstatedir=/var \
        --disable-dependency-tracking \
        --with-pango

  - uses: autoconf/make

  - uses: autoconf/make-install

  # testfont checks for Microsoft core font families (Courier New etc.), which
  # are not packaged. TODO(upstream-tests): drop this once the test skips missing families.
  - uses: upstream-tests/make-check
    with:
      ignore: testfont

  - uses: strip

subpackages:
  - name: libgdiplus${{vars.soversion}}
    description: "libgdiplus shared library"
    pipeline:
      - uses: split/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: libgdiplus-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libgdiplus${{vars.soversion}}=${{package.full-version}}
    description: libgdiplus dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  git: {}
  ignore-regex-patterns:
    - ^mono-.*
    - ^LIBGDIPLUS_.*
    - ^libgdiplus-.*
    - ^XSP_.*

test:
  environment:
    contents:
      packages:
        - libgdiplus-dev
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test libgdiplus pkg-config
      runs: |
        pkg-config --exists libgdiplus
        pkg-config --modversion libgdiplus
        test -f /usr/lib/libgdiplus.so
