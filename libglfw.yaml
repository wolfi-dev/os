package:
  name: libglfw
  version: "3.5.1"
  epoch: 3 # shared library naming: split libglfw${{vars.soversion}}
  description: A multi-platform library for OpenGL, OpenGL ES, Vulkan, window and input
  copyright:
    - license: Zlib
  resources:
    cpu: "1"
    memory: 4Gi
  dependencies:
    runtime:
      - libglfw${{vars.soversion}}=${{package.full-version}}

vars:
  soversion: "3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - doxygen
      - glibc-2.44-dev
      - libglvnd-dev
      - libx11-dev
      - libxcursor-dev
      - libxi-dev
      - libxinerama-dev
      - libxrandr-dev
      - libxrender-dev
      - pkgconf
      - pkgconf-dev
      - xorg-server-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/glfw/glfw
      tag: ${{package.version}}
      expected-commit: d9d6f0f1f967807ffade6598ea9a631ebaf37a56

  - uses: cmake/configure
    with:
      opts: |
        -DGLFW_BUILD_WAYLAND=0 -DGLFW_LIBRARY_TYPE=SHARED

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: libglfw${{vars.soversion}}
    description: "libglfw shared library"
    pipeline:
      - uses: split/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: "libglfw-doc"
    description: "libglfw documentation"
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share/doc
          mv "${{targets.destdir}}"/usr/share/doc/GLFW "${{targets.subpkgdir}}"/usr/share/doc/
    test:
      pipeline:
        - uses: test/docs

  - name: "libglfw-dev"
    description: "glfw development headers"
    dependencies:
      runtime:
        - libglfw${{vars.soversion}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: glfw/glfw

test:
  pipeline:
    - uses: test/tw/ldd-check
