package:
  name: libkrunfw
  version: "5.5.0"
  epoch: 5 # -microvm eBPF observability (kprobes + BTF in the config fragment)
  description: Dynamic library bundling a Linux kernel for use by libkrun
  copyright:
    - license: GPL-2.0-only AND LGPL-2.1-only
  dependencies:
    # Outrank ${{package.name}}-microvm, which provides this same name at the
    # same version. Without this, apk has no rule preferring the package
    # actually named libkrunfw over one that merely provides it, and `apk add
    # libkrunfw` resolves arbitrarily.
    provider-priority: 10
  resources:
    cpu: "6"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  # IMPORTANT: kernel-version MUST match the value of KERNEL_VERSION in
  # libkrunfw's upstream Makefile for the tag we're building. Each libkrunfw
  # release pins exactly one kernel version (libkrunfw's job is to bake that
  # kernel into a .so). When bumping `package.version`, you MUST also:
  #   1. Read `KERNEL_VERSION = linux-X.Y.Z` from the upstream Makefile.
  #   2. Set kernel-version below to "X.Y.Z".
  #   3. Update expected-sha256 in the `fetch` step from
  #      https://cdn.kernel.org/pub/linux/kernel/v<major>.x/sha256sums.asc
  # A build-time assertion below catches forgotten updates.
  kernel-version: "6.12.91"
  python-version: "3.13"

# Derive the kernel.org URL major-version segment (e.g. "6" from "6.12.87") so
# the `fetch` URI updates automatically if kernel-version ever crosses a major.
var-transforms:
  - from: ${{vars.kernel-version}}
    match: ^(\d+)\..*
    replace: $1
    to: kernel-major

environment:
  contents:
    packages:
      - bc
      - bison
      - build-base
      - busybox
      - coreutils
      - curl
      - diffutils
      - elfutils
      - elfutils-dev
      - findutils
      - flex
      - gawk
      # gcc-15 (instead of the default gcc, which is currently gcc-16) for the
      # kernel compile: gcc-16's aarch64 auto-vectorizer ICEs on parts of
      # linux-6.12 (zstd_opt.c, cfi_cmdset_0002.c) when tuning for Neoverse V2.
      # gcc-15 builds cleanly. The shared-library link step also uses gcc-15
      # for consistency, which is fine.
      - gcc-15-default
      - gmp
      - gmp-dev
      - gnutar
      - mpc
      - mpc-dev
      - mpfr
      - mpfr-dev
      - openssl
      - openssl-hardened-dev
      # pahole, for the -microvm subpackage's CONFIG_DEBUG_INFO_BTF build
      # (same pair the kernel/build pipeline uses).
      - pahole
      - pahole-dev
      - patch
      - perl
      - py${{vars.python-version}}-pyelftools
      - python-${{vars.python-version}}
      - wolfi-base
      - xz
      - zstd

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/containers/libkrunfw
      tag: v${{package.version}}
      expected-commit: ec4b297964877d83432f9ccda6dad8ff6e9de3e4

  - uses: fetch # blocked-bootstrap-complex: libkrunfw needs a specific kernel version, expects tarball.
    with:
      uri: https://cdn.kernel.org/pub/linux/kernel/v${{vars.kernel-major}}.x/linux-${{vars.kernel-version}}.tar.xz
      expected-sha256: 0ff2ab9e169f9f1948557471fbb450d3018f8c5b77caf288e1a3982582597969
      extract: false
      delete: false

  - name: Stage pre-fetched kernel tarball
    runs: |
      # Assert our pinned kernel-version matches what upstream's Makefile
      # expects. If they diverge, fail loudly here instead of in the kernel
      # build (where the error would be a sandboxed curl failure).
      expected="linux-${{vars.kernel-version}}"
      actual=$(awk -F'= *' '/^KERNEL_VERSION/{print $2; exit}' Makefile)
      if [ "$expected" != "$actual" ]; then
        new_ver=${actual#linux-}
        new_major=${new_ver%%.*}
        tarball_url="https://cdn.kernel.org/pub/linux/kernel/v${new_major}.x/${actual}.tar.xz"
        shasums_url="https://cdn.kernel.org/pub/linux/kernel/v${new_major}.x/sha256sums.asc"
        # Look up the new sha256 directly from kernel.org if we can reach it.
        # melange's bubblewrap runs: steps DO have network, so this usually
        # works; if it doesn't (offline build, transient failure), we fall
        # back to printing the command for the user to run themselves.
        new_sha=$(curl --max-time 5 -sSL "$shasums_url" 2>/dev/null \
                  | awk -v f="${actual}.tar.xz" '$2 == f {print $1; exit}')
        {
          echo "ERROR: kernel version drift between libkrunfw.yaml and upstream Makefile"
          echo "  libkrunfw.yaml vars.kernel-version => $expected"
          echo "  upstream Makefile KERNEL_VERSION   => $actual"
          echo ""
          echo "To fix, set vars.kernel-version: \"${new_ver}\" in libkrunfw.yaml"
          echo "(the kernel.org URL major segment is derived via var-transforms)."
          echo ""
          if [ -n "$new_sha" ]; then
            echo "Then set the fetch step's expected-sha256 to:"
            echo "  ${new_sha}"
            echo "(looked up from ${shasums_url})"
          else
            echo "Then update the fetch step's expected-sha256, sha256 from:"
            echo "  curl -sSL ${shasums_url} | grep -F ${actual}.tar.xz"
            echo "(tarball: ${tarball_url})"
          fi
        } >&2
        exit 1
      fi
      mkdir -p tarballs
      mv linux-${{vars.kernel-version}}.tar.xz tarballs/

  - name: Build the stock (upstream-config) libkrunfw library
    runs: |
      # The upstream `all` target drives the whole chain: extract the tarball,
      # apply libkrunfw's patches, copy the per-arch base config to .config,
      # run olddefconfig, build the kernel, bundle it via bin2cbundle.py, and
      # link libkrunfw.so. We deliberately build the kernel with the config
      # exactly as upstream ships it - no fragments layered on top. The
      # ${{package.name}}-microvm subpackage rebuilds with our extra config
      # (9p + in-guest Docker networking).
      make -j$(nproc) PREFIX=/usr LIBDIR_Linux=lib

  - runs: |
      make PREFIX=/usr LIBDIR_Linux=lib DESTDIR="${{targets.destdir}}" install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: Development files for ${{package.name}}
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    test:
      pipeline:
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}

  # A rebuild of the bundled kernel specifically to target mono/microvm's needs.
  # same SONAME and file path as the stock package, but with extra kernel
  # config compiled in. This is a drop-in alternative to ${{package.name}} (it
  # provides + replaces it), so an image installs EITHER ${{package.name}} OR
  # ${{package.name}}-microvm, never both. libkrun loads libkrunfw.so.5 by
  # SONAME at runtime, so swapping in this package changes the guest kernel
  # without rebuilding libkrun.
  #
  # provider-priority is deliberately below ${{package.name}}'s, so this is an
  # acceptable provider of ${{package.name}} but never the default one: asking
  # for ${{package.name}} must not hand you this kernel.
  #
  # The extra config covers:
  #   * 9p over vsock (host<->guest filesystem sharing) + IKCONFIG
  #     introspection - the options we previously baked into the stock build.
  #   * the legacy-iptables/xtables layer (the base config already has the
  #     netfilter core and nftables) that dockerd needs to program docker0's
  #     NAT rules and k3s's kube-proxy needs for service NAT, so the guest can
  #     run in-guest Docker and k3s (those conformance groups).
  #   * magic-sysrq, so the conformance suite can kill the guest from inside
  #     to exercise its transport-death contract.
  #   * the eBPF observability plane (kprobes, the tracing BPF program
  #     types, BTF), so falco/tetragon/cilium-class workloads can load and
  #     attach against this kernel like they do against the qemu and
  #     firecracker flavors.
  - name: ${{package.name}}-microvm
    description: ${{package.name}} with support for microvm's needs (9p + iptables/netfilter + sysrq + eBPF observability)
    dependencies:
      provides:
        - ${{package.name}}=${{package.full-version}}
      provider-priority: 5
      replaces:
        - ${{package.name}}
    pipeline:
      - name: Rebuild the bundled kernel with the microvm config fragment
        runs: |
          # The stock build already ran in this workspace; its files were
          # captured into the main package's destdir. Clean the in-tree build
          # artifacts (the linux-${{vars.kernel-version}} source tree,
          # kernel.c, and the stock libkrunfw.so) so we get a fresh kernel
          # tree to reconfigure. `make clean` keeps the staged tarball under
          # tarballs/, so the re-extract below does not re-download anything.
          make clean

          # config fragment, layered on top of libkrunfw's per-arch base
          # config via merge_config.sh below. Everything is =y because the
          # libkrunfw kernel has no loadable-module support.
          #
          # CONFIG_LOCALVERSION - makes `uname -r` in the guest read
          #   ${{vars.kernel-version}}-r${{package.epoch}}-microvm rather than
          #   plain ${{vars.kernel-version}}, so a stock kernel and this one
          #   are told apart from inside the VM, and the epoch says which
          #   build of the package it came from. LOCALVERSION_AUTO off keeps
          #   the string exactly that (it would otherwise append scm info).
          #
          # 9p + introspection:
          #   CONFIG_NETWORK_FILESYSTEMS - parent menu under fs/Kconfig; the
          #     base config has it off, so fs/9p/Kconfig is never sourced and
          #     CONFIG_9P_FS isn't visible to olddefconfig without this.
          #   CONFIG_NET_9P*  - 9p protocol + fd transport (host<->guest share).
          #   CONFIG_9P_FS    - the 9p filesystem driver.
          #   CONFIG_9P_FS_POSIX_ACL - intentionally left off.
          #   CONFIG_IKCONFIG* - exposes the in-kernel config at /proc/config.gz.
          #
          # In-guest Docker and k3s networking: dockerd programs docker0's NAT
          # rules, and k3s's kube-proxy programs service NAT rules, via either
          # legacy iptables or nftables. The base config already has the
          # netfilter core, nftables and conntrack/NAT; what it lacks is the
          # legacy xtables/iptables layer (and NFT_CHAIN_NAT), which is what
          # both daemons actually reach for first -- dockerd reports
          # "can't initialize iptables table `nat'" and kube-proxy exits,
          # taking the k3s control plane down with it. Enable both paths plus
          # bridge/veth. Note there is no CONFIG_NFT_CHAIN_NAT to set: the
          # symbol is gone in 6.x and nft_chain_nat.o is built by NFT_NAT.
          #
          # All four IPv4 tables are needed, not just filter+nat: dockerd
          # programs `raw` (its DIRECT ACCESS FILTERING drop rules) and
          # `mangle`, and a missing table is fatal rather than degraded
          # ("can't initialize iptables table `raw'"). The xt matches are the
          # ones dockerd and k3s's kube-proxy actually emit -- comment and
          # statistic in particular, which kube-proxy puts on essentially
          # every service rule.
          #
          # k3s additionally needs VXLAN and ipset. Flannel's default backend
          # is vxlan, and creating that device is not optional: flannel exits
          # ("failed to create vxlan device: operation not supported"), which
          # makes k3s shut the whole control plane down a few seconds after it
          # came up. ipset backs k3s's network-policy controller, which
          # otherwise skips itself with "ipset save failed".
          #
          # CONFIG_MAGIC_SYSRQ - /proc/sysrq-trigger. Without it there is no
          # in-guest way to power the VM off abruptly, so the cross-backend
          # conformance suite cannot exercise its transport-death contract
          # against this kernel (Robustness/GuestTransportDeath self-skips).
          # DEFAULT_ENABLE=0x1 turns on all sysrq functions, including 'o'
          # (poweroff), which is the one the suite uses.
          #
          # eBPF observability (falco/tetragon/cilium-class workloads):
          #   CONFIG_BPF* - the syscall itself; unprivileged BPF stays off.
          #   CONFIG_PERF_EVENTS + CONFIG_KPROBES + CONFIG_FTRACE +
          #     CONFIG_KPROBE_EVENTS - kprobe attach rides the perf_kprobe
          #     PMU; KPROBE_EVENTS lives under the FTRACE menu, so FTRACE
          #     must be on for olddefconfig to keep it.
          #   CONFIG_UPROBE_EVENTS - userspace probes, same PMU plane.
          #   CONFIG_BPF_EVENTS - the kprobe/tracepoint/perf_event BPF
          #     program types those tools load.
          #   CONFIG_DEBUG_KERNEL - pure visibility gate for the debug-info
          #     choice below, no code of its own. Upstream's x86_64 base
          #     config carries it, the aarch64 one does not, and without it
          #     olddefconfig silently drops the two DWARF/BTF options on
          #     arm64 (which the verbatim check below turns into a loud
          #     build failure).
          #   CONFIG_DEBUG_INFO_BTF (+ the DWARF toolchain default it
          #     needs) - CO-RE relocation reads /sys/kernel/btf/vmlinux.
          #     Needs pahole in the build environment. The DWARF
          #     byproduct is stripped from the bundled x86_64 vmlinux after
          #     the build (see the strip step below); .BTF is an allocated
          #     section and survives the strip.
          cat > microvm.cfg <<'EOF'
          CONFIG_LOCALVERSION="-r${{package.epoch}}-microvm"
          # CONFIG_LOCALVERSION_AUTO is not set
          CONFIG_NETWORK_FILESYSTEMS=y
          CONFIG_NET_9P=y
          CONFIG_NET_9P_FD=y
          CONFIG_9P_FS=y
          # CONFIG_9P_FS_POSIX_ACL is not set
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_STATISTIC=y
          CONFIG_NETFILTER_XT_MATCH_PHYSDEV=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_NAT=y
          CONFIG_NETFILTER_XT_TARGET_CT=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_MANGLE=y
          CONFIG_IP_NF_RAW=y
          CONFIG_NF_TABLES=y
          CONFIG_NF_TABLES_IPV4=y
          CONFIG_NFT_NAT=y
          CONFIG_NFT_MASQ=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_VETH=y
          CONFIG_VXLAN=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_MAGIC_SYSRQ=y
          CONFIG_MAGIC_SYSRQ_DEFAULT_ENABLE=0x1
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_UNPRIV_DEFAULT_OFF=y
          CONFIG_PERF_EVENTS=y
          CONFIG_KPROBES=y
          CONFIG_FTRACE=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_UPROBE_EVENTS=y
          CONFIG_BPF_EVENTS=y
          CONFIG_DEBUG_KERNEL=y
          CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y
          CONFIG_DEBUG_INFO_BTF=y
          EOF

          # Re-extract+patch+base-config+olddefconfig (upstream KERNEL_SOURCES
          # rule), then merge our fragment with olddefconfig semantics:
          # preserve all of the base config's decisions and only fill defaults
          # for symbols newly made visible by our fragment.
          make -j$(nproc) linux-${{vars.kernel-version}}
          KSRC=linux-${{vars.kernel-version}}
          (cd "$KSRC" && ./scripts/kconfig/merge_config.sh -m .config ../microvm.cfg)
          (cd "$KSRC" && make olddefconfig)

          # Verify every fragment line landed verbatim in .config. This turns
          # "olddefconfig dropped it because a dependency wasn't satisfied"
          # into a loud *build* failure rather than a runtime surprise.
          fail=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if ! grep -qxF "$line" "$KSRC/.config"; then
              echo "ERROR: requested kernel config not in final .config: $line" >&2
              sym=${line%%=*}; sym=${sym#\# }; sym=${sym%% *}
              grep -E "^(${sym}=|# ${sym} )" "$KSRC/.config" >&2 || \
                echo "  (symbol ${sym} entirely absent from .config)" >&2
              fail=1
            fi
          done < microvm.cfg
          if [ "$fail" -ne 0 ]; then
            echo "" >&2
            echo "olddefconfig dropped one or more requested options." >&2
            echo "Most common cause: a parent menu/dependency isn't enabled." >&2
            echo "Inspect $KSRC/.config and the Kconfig graph for the missing symbol." >&2
            exit 1
          fi

          make -j$(nproc) PREFIX=/usr LIBDIR_Linux=lib
      - name: Strip DWARF from the bundled x86_64 kernel, keeping BTF
        runs: |
          # DEBUG_INFO_BTF drags full DWARF into the x86_64 vmlinux, and
          # bin2cbundle.py embeds that file verbatim into libkrunfw.so —
          # hundreds of MB of dead weight. .BTF is an allocated section the
          # guest serves at /sys/kernel/btf/vmlinux, DWARF is build-time-only
          # pahole input: strip it, then remove the bundle artifacts and
          # re-run make so the library is relinked around the stripped
          # kernel (the kernel tree itself is up to date and not rebuilt).
          # aarch64 bundles arch/arm64/boot/Image, a binary objcopy that
          # never carried DWARF, so there is nothing to strip there.
          if [ "${{build.arch}}" = "x86_64" ]; then
            objcopy --strip-debug "linux-${{vars.kernel-version}}/vmlinux"
            rm -f kernel.c libkrunfw.so*
            make -j$(nproc) PREFIX=/usr LIBDIR_Linux=lib
          fi
      - name: Install the microvm library into the subpackage
        runs: |
          make PREFIX=/usr LIBDIR_Linux=lib DESTDIR="${{targets.subpkgdir}}" install
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - build-base
      pipeline:
        - uses: test/tw/ldd-check
        - name: Verify SONAME and symlinks
          runs: |
            test -f /usr/lib/libkrunfw.so.${{package.version}}
            test -L /usr/lib/libkrunfw.so.5
            readlink /usr/lib/libkrunfw.so.5 | grep -F libkrunfw.so.${{package.version}}
        - name: Verify the bundled kernel is the microvm one
          runs: |
            # bin2cbundle.py embeds the kernel image in the .so as a plain
            # (uncompressed) byte array, so the kernel's version banner is
            # greppable here. That banner carries UTS_RELEASE, which is what
            # `uname -r` reports in a guest booted on this library -- so this
            # asserts a guest can tell this kernel from the stock one.
            rel="${{vars.kernel-version}}-r${{package.epoch}}-microvm"
            if ! grep -qF "Linux version ${rel} " /usr/lib/libkrunfw.so.5; then
              echo "bundled kernel is not ${rel}:" >&2
              strings /usr/lib/libkrunfw.so.5 | grep -m1 "^Linux version " >&2
              exit 1
            fi
        - name: Verify exported symbols
          runs: |
            for sym in krunfw_get_kernel krunfw_get_version; do
              if ! nm -D --defined-only /usr/lib/libkrunfw.so.5 | grep -qw "$sym"; then
                echo "Missing symbol: $sym"
                nm -D --defined-only /usr/lib/libkrunfw.so.5 || true
                exit 1
              fi
            done
        - name: Functional test - load kernel data via libkrunfw
          runs: |
            cat > /tmp/krunfw_test.c <<'EOF'
            #include <stddef.h>
            #include <stdio.h>

            extern char *krunfw_get_kernel(size_t *load_addr, size_t *entry_addr, size_t *size);
            extern int krunfw_get_version(void);

            int main(void) {
                size_t load_addr = 0, entry_addr = 0, size = 0;
                char *kernel = krunfw_get_kernel(&load_addr, &entry_addr, &size);
                if (kernel == NULL) {
                    fprintf(stderr, "krunfw_get_kernel returned NULL\n");
                    return 1;
                }
                if (size == 0) {
                    fprintf(stderr, "krunfw_get_kernel returned size 0\n");
                    return 1;
                }
                printf("krunfw kernel size=%zu load=0x%zx entry=0x%zx abi=%d\n",
                       size, load_addr, entry_addr, krunfw_get_version());
                return 0;
            }
            EOF
            cc -o /tmp/krunfw_test /tmp/krunfw_test.c /usr/lib/libkrunfw.so.5
            /tmp/krunfw_test

  # The reconfigured kernel image, shipped as plain data so a host that cannot
  # compile a Linux kernel can still assemble its own libkrunfw around it.
  #
  # macOS is the motivating consumer. libkrun there drives
  # Hypervisor.framework and dlopen()s libkrunfw.5.dylib by name, resolving a
  # single symbol (krunfw_get_kernel) -- so replacing the guest kernel never
  # means rebuilding libkrun. But Homebrew ships stock libkrunfw, so every
  # feature needing the config above fails on a Mac. Upstream cannot help
  # directly: its Makefile's darwin path shells out to ./build_on_krunvm.sh,
  # i.e. it needs a libkrun VM in order to build the kernel for libkrun.
  #
  # The split that does work is the one upstream already has. Building the
  # kernel is Linux work, which we do here, reproducibly. Wrapping it is
  # native work over a byte array (bin2cbundle.py, then one cc -shared).
  # Publishing the image lets a Mac fetch our kernel and assemble the library
  # locally instead of trusting a prebuilt binary of unknown provenance. See
  # microvm/libkrun/README-mac-libkrunfw.md in the mono repo.
  #
  # The resolved .config ships alongside it because otherwise there is no way
  # to answer "which options does this kernel actually carry" without booting
  # it.
  #
  # ORDERING: this must stay after ${{package.name}}-microvm. That
  # subpackage's pipeline is what leaves the reconfigured kernel tree in the
  # workspace, and it opens with `make clean` -- so any subpackage cleaning or
  # rebuilding in between would leave this shipping the wrong kernel, or none.
  - name: ${{package.name}}-microvm-image
    description: Kernel image and resolved config from ${{package.name}}-microvm, for assembling libkrunfw on hosts that cannot build a Linux kernel
    pipeline:
      - name: Install the microvm kernel image and its resolved config
        runs: |
          ksrc="linux-${{vars.kernel-version}}"
          # Upstream keeps the kernel under a different name and format per
          # arch. Install it under one fixed name so a consumer never has to
          # know its own architecture to find the file, and record the format
          # separately in bundle-type -- that token is exactly what
          # bin2cbundle.py's -t flag wants, so a consumer can pass it through
          # without an arch case of its own.
          case "${{build.arch}}" in
            aarch64) img="${ksrc}/arch/arm64/boot/Image" ; ktype="Image" ;;
            x86_64) img="${ksrc}/vmlinux" ; ktype="vmlinux" ;;
            *) echo "no known kernel image path for ${{build.arch}}" >&2 ; exit 1 ;;
          esac
          [ -f "$img" ] || { echo "$img - not a file"; exit 1; }
          [ -s "$img" ] || { echo "$img - is zero length"; exit 1; }
          dest="${{targets.subpkgdir}}/usr/share/${{subpkg.name}}"
          install -Dm644 "${img}" "${dest}/kernel.image"
          install -Dm644 "${ksrc}/.config" "${dest}/config"
          printf '%s\n' "${ktype}" >"${dest}/bundle-type"
          chmod 0644 "${dest}/bundle-type"
    test:
      pipeline:
        - name: Image and config are present, and are the microvm kernel's
          runs: |
            d="/usr/share/${{subpkg.name}}"
            # Fixed names on every arch: a consumer needs no arch logic.
            for f in "$d/kernel.image" "$d/config"; do
              [ -f "$f" ] ||{ echo "$f - not a file"; exit 1; }
              [ -s "$f" ] ||{ echo "$f - empty file"; exit 1; }
            done

            # bundle-type must be a token bin2cbundle.py's -t accepts, since
            # consumers pass it straight through.
            case "$(cat "${d}/bundle-type")" in
              Image | vmlinux) ;;
              *) echo "unexpected bundle-type: $(cat "${d}/bundle-type")" >&2 ; exit 1 ;;
            esac
            # Assert provenance, not just presence: these four are exactly
            # what the -microvm rebuild adds on top of upstream's config, one
            # per reason that rebuild exists (9p, legacy xtables, sysrq, eBPF
            # observability). A stock kernel that somehow reached this
            # subpackage fails here rather than shipping quietly and failing
            # inside a guest later.
            for opt in CONFIG_9P_FS=y CONFIG_IP_NF_RAW=y CONFIG_MAGIC_SYSRQ=y CONFIG_DEBUG_INFO_BTF=y ; do
              grep -qxF "${opt}" "${d}/config" ||
                  { echo "$d/config - does not contain $opt"; exit 1; }
            done

            # The kernel names itself, so a consumer that assembles a
            # libkrunfw around this image gets a guest whose `uname -r` says
            # where the kernel came from. Both the config and the image
            # itself have to agree on it.
            rel="${{vars.kernel-version}}-r${{package.epoch}}-microvm"
            grep -qxF "CONFIG_LOCALVERSION=\"-r${{package.epoch}}-microvm\"" "${d}/config" ||
                { echo "$d/config - wrong CONFIG_LOCALVERSION for ${rel}"; exit 1; }
            # kernel.image is uncompressed on both arches (arm64 Image, x86_64
            # vmlinux), so the version banner is greppable.
            grep -qF "Linux version ${rel} " "${d}/kernel.image" ||
                { echo "$d/kernel.image - is not the ${rel} kernel"; exit 1; }

update:
  enabled: true
  github:
    identifier: containers/libkrunfw
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - build-base
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify SONAME and symlinks
      runs: |
        test -f /usr/lib/libkrunfw.so.${{package.version}}
        test -L /usr/lib/libkrunfw.so.5
        readlink /usr/lib/libkrunfw.so.5 | grep -F libkrunfw.so.${{package.version}}
    - name: Verify exported symbols
      runs: |
        for sym in krunfw_get_kernel krunfw_get_version; do
          if ! nm -D --defined-only /usr/lib/libkrunfw.so.5 | grep -F "$sym"; then
            echo "Missing symbol: $sym"
            nm -D --defined-only /usr/lib/libkrunfw.so.5
            exit 1
          fi
        done
    - name: Functional test - load kernel data via libkrunfw
      runs: |
        cat > /tmp/krunfw_test.c <<'EOF'
        #include <stddef.h>
        #include <stdio.h>

        extern char *krunfw_get_kernel(size_t *load_addr, size_t *entry_addr, size_t *size);
        extern int krunfw_get_version(void);

        int main(void) {
            size_t load_addr = 0, entry_addr = 0, size = 0;
            char *kernel = krunfw_get_kernel(&load_addr, &entry_addr, &size);
            if (kernel == NULL) {
                fprintf(stderr, "krunfw_get_kernel returned NULL\n");
                return 1;
            }
            if (size == 0) {
                fprintf(stderr, "krunfw_get_kernel returned size 0\n");
                return 1;
            }
            printf("krunfw kernel size=%zu load=0x%zx entry=0x%zx abi=%d\n",
                   size, load_addr, entry_addr, krunfw_get_version());
            return 0;
        }
        EOF
        cc -o /tmp/krunfw_test /tmp/krunfw_test.c /usr/lib/libkrunfw.so.5
        /tmp/krunfw_test
