package:
  name: libmaxminddb
  version: "1.13.3"
  epoch: 1 # add ldd-check and functional test for mmdblookup
  description: Maxmind GeoIP2 database library
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - libtool

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/maxmind/libmaxminddb
      tag: ${{package.version}}
      expected-commit: 09a0540fea89a16e5c6a9e21e93ee9aece6639e3

  - uses: autoconf/configure
    with:
      # Disable test compilation: the test suite depends on libtap, which is
      # bundled as a git submodule (t/libtap) and included in release tarballs
      # but not fetched by git-checkout. libtap is not packaged in wolfi, and
      # fetching submodules would also pull in large test-data repos we don't
      # need (maxmind-db). Tests are enabled by default in configure.ac.
      opts: --disable-tests

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libmaxminddb-static
    pipeline:
      - uses: split/static
    description: libmaxminddb static
    test:
      pipeline:
        - uses: test/tw/staticpackage

  - name: libmaxminddb-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libmaxminddb
        - curl
    description: libmaxminddb dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: libmaxminddb-libs
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib/libmaxminddb.so.* ${{targets.subpkgdir}}/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check
    description: libmaxminddb libs

update:
  enabled: true
  github:
    identifier: maxmind/libmaxminddb

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Functional test - mmdblookup rejects missing file
      runs: |
        # Verify mmdblookup is installed and exercised through libmaxminddb.
        # A lookup against a nonexistent file should exit non-zero (error
        # path exercises MMDB_open() in libmaxminddb).
        if mmdblookup --file /tmp/nonexistent.mmdb --ip 1.2.3.4 2>/tmp/mmdb_err; then
          echo "ERROR: expected mmdblookup to fail on missing file"
          exit 1
        fi
        grep -F "No such file or directory" /tmp/mmdb_err || \
          grep -iF "error" /tmp/mmdb_err || \
          grep -iF "open" /tmp/mmdb_err
        echo "mmdblookup correctly handles missing MMDB file"
