package:
  name: libnetfilter_log
  version: "1.0.2"
  epoch: 2
  description: programming interface (API) to the in-kernel connection tracking state table
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - autoconf
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - libmnl-dev
      - libnetfilter_conntrack-dev
      - libnfnetlink-dev
      - libtool
      - pkgconf-dev

pipeline:
  - uses: git-checkout
    with:
      repository: git://git.netfilter.org/libnetfilter_log
      tag: libnetfilter_log-${{package.version}}
      expected-commit: b0e4be94c0b8f68d4e912402b93a130063c34e17

  - runs: |
      ./autogen.sh

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libnetfilter_log-dev
    description: libnetfilter_log development files
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - libmnl-dev
            - libnfnetlink-dev
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
        - uses: test/tw/header-check

update:
  enabled: true
  release-monitor:
    identifier: 1678

test:
  environment:
    contents:
      packages:
        - libnetfilter_log-dev
        - build-base
        - pkgconf
        - libmnl-dev
        - libnfnetlink-dev
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test library compilation and linkage
      runs: |
        cat > test.c << 'EOF'
        #include <libnetfilter_log/libnetfilter_log.h>
        #include <stdio.h>

        int main(void) {
            struct nflog_handle *h;

            /* Open a netfilter log handle */
            h = nflog_open();
            if (!h) {
                /* Expected to fail without CAP_NET_ADMIN, but the
                   library loaded and the symbol resolved correctly */
                fprintf(stderr, "nflog_open failed (expected without CAP_NET_ADMIN)\n");
                return 0;
            }
            nflog_close(h);
            return 0;
        }
        EOF
        gcc $(pkg-config --cflags libnetfilter_log) test.c -o test $(pkg-config --libs libnetfilter_log)
        ./test
