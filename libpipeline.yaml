# Generated from https://git.alpinelinux.org/aports/plain/community/libpipeline/APKBUILD
package:
  name: libpipeline
  version: 1.5.8
  epoch: 7 # go/wolfi-rsc/libpipeline
  description: C pipeline manipulation library
  copyright:
    - license: GPL-3.0-or-later
  resources:
    cpu: "2"
    memory: 6Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libtool
      - pkgconf-dev
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/libpipeline/libpipeline
      tag: ${{package.version}}
      expected-commit: dd37cf76496b4b999509bd133657c1fc021e3a5f

  - uses: git/gnulib-bootstrap

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libpipeline-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libpipeline
    description: libpipeline dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: libpipeline-doc
    pipeline:
      - uses: split/manpages
    description: libpipeline manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  release-monitor:
    identifier: 1704

test:
  environment:
    contents:
      packages:
        - libpipeline-dev
        - build-base
  pipeline:
    - uses: test/tw/ldd-check
    - name: Compile and run a program that calls the libpipeline API
      runs: |
        cat > /tmp/test_pipeline.c << 'EOF'
        #include <pipeline.h>
        #include <stdio.h>
        #include <stdlib.h>
        int main(void) {
            pipeline *p;
            int status;
            /* Create a pipeline: echo "hello" | cat */
            p = pipeline_new();
            pipeline_command_args(p, "echo", "hello", NULL);
            pipeline_command_args(p, "cat", NULL);
            pipeline_start(p);
            status = pipeline_wait(p);
            pipeline_free(p);
            if (status != 0) {
                fprintf(stderr, "pipeline failed with status %d\n", status);
                return 1;
            }
            return 0;
        }
        EOF
        cc -o /tmp/test_pipeline /tmp/test_pipeline.c $(pkg-config --cflags --libs libpipeline)
        /tmp/test_pipeline
