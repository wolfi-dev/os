package:
  name: libpulsar
  version: "4.2.0"
  epoch: 5 # openssl-hardened: 3.6->4.0
  description: Optimizer and compiler/toolchain library for WebAssembly
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 8Gi
  test-resources:
    cpu: "2"
    memory: 4Gi

vars:
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - abseil-cpp-dev
      - autoconf
      - automake
      - boost-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - curl-dev
      - glibc-2.44-dev
      - gmock
      - gtest-dev
      - openssl-hardened-${{vars.openssl-version}}-dev
      - protobuf-dev
      - python3
      - samurai
      - snappy-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/pulsar-client-cpp
      tag: v${{package.version}}
      expected-commit: 30eb473177fb6f7769d5177b96bdba8c26e78b61

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_CXX_STANDARD=17 \
        -DBUILD_TESTS=OFF \
        -DCMAKE_CXX_FLAGS="-Wno-array-bounds -Wno-unused-result"

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: libpulsar-dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
    dependencies:
      runtime:
        - ${{package.name}}==${{package.full-version}}
    pipeline:
      - uses: split/dev
    description: libpulsar dev

update:
  enabled: true
  github:
    identifier: apache/pulsar-client-cpp
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - py3.10-pulsar-client
        - py3.13-pulsar-client
        - libpulsar-dev
        - build-base
        - pkgconf
        - apache-pulsar-4.2
    environment:
      JAVA_HOME: /usr/lib/jvm/default-jvm
      PULSAR_MEM: -Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g
      PULSAR_PID_DIR: /usr/share/java/pulsar/logs
  pipeline:
    - uses: test/tw/ldd-check
    # They python library dynamically links against this package,
    # check that we haven't obviously broken something.
    - uses: python/import
      with:
        python: python3.10
        import: pulsar
    - uses: python/import
      with:
        python: python3.13
        import: pulsar
    - name: Test C++ library compilation and linking
      runs: |
        tee test.cpp <<'EOF'
        #include <pulsar/Client.h>
        int main() {
            // Verify the Pulsar client API is available and linkable
            pulsar::ClientConfiguration config;
            return 0;
        }
        EOF

        g++ test.cpp -o test -lpulsar
        ./test
    # Upstream CMake silently disables a codec when it can't find the
    # library, so assert the optional compression libraries are linked.
    - name: Verify zstd and snappy are linked
      runs: |
        readelf -d /usr/lib/libpulsar.so | grep -F 'libzstd.so'
        readelf -d /usr/lib/libpulsar.so | grep -F 'libsnappy.so'
    - name: Produce and consume compressed messages against a standalone broker
      uses: test/daemon-check-output
      with:
        start: /usr/share/java/pulsar/bin/pulsar-daemon start standalone --no-functions-worker --no-stream-storage
        timeout: 180
        expected_output: |
          starting standalone, logging to
        post: |
          wait-for-it -t 180 localhost:6650 || { tail -n 80 /usr/share/java/pulsar/logs/pulsar-standalone-*.log; exit 1; }
          wait-for-it -t 60 localhost:8080
          tee compression_test.py <<'EOF'
          import time
          import pulsar
          from pulsar import CompressionType

          payload = ("chainguard " * 1000).encode()
          client = pulsar.Client("pulsar://localhost:6650")
          for name in ("ZSTD", "SNAPPY", "LZ4", "ZLib"):
              topic = f"persistent://public/default/compression-{name.lower()}"
              # The broker accepts connections before it can serve topics.
              for attempt in range(30):
                  try:
                      consumer = client.subscribe(topic, "test-sub")
                      break
                  except Exception:
                      time.sleep(2)
              else:
                  raise SystemExit(f"broker never became ready for {topic}")
              producer = client.create_producer(
                  topic,
                  compression_type=getattr(CompressionType, name),
                  batching_enabled=False,
              )
              producer.send(payload)
              msg = consumer.receive(timeout_millis=30000)
              assert msg.data() == payload, f"{name}: payload mismatch"
              consumer.acknowledge(msg)
              producer.close()
              consumer.close()
              print(f"{name}: produce/consume OK")
          client.close()
          EOF
          python3.13 compression_test.py
