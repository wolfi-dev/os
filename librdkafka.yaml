package:
  name: librdkafka
  version: "2.15.1"
  epoch: 1 # enable SASL SCRAM/OAUTHBEARER
  description: "The Apache Kafka C/C++ library"
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "2"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - curl-dev
      - glibc-2.44-dev
      - linux-headers
      - lz4-dev
      - openssl-hardened-dev
      - rapidjson
      - samurai
      - zlib-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c58bbed850ebe1cc493259d11e4de6ca930d5120
      repository: https://github.com/confluentinc/librdkafka
      tag: v${{package.version}}

  # WITH_SASL only defaults ON when cyrus libsasl2 is found, and SCRAM and
  # OAUTHBEARER hang off it, so without this they are silently compiled out
  # (builtin.features still advertises them).
  - runs: |
      CFLAGS="$CFLAGS -flto=auto" \
      CXXFLAGS="$CXXFLAGS -flto=auto" \
      cmake -B build -G Ninja \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_LIBDIR=/usr/lib \
      -DCMAKE_BUILD_TYPE=RelWithDebinfo \
      -DRDKAFKA_BUILD_EXAMPLES=OFF \
      -DRDKAFKA_BUILD_TESTS="OFF" \
      -DWITH_SSL=ON \
      -DWITH_SASL=ON
      cmake --build build

  - runs: |
      DESTDIR="${{targets.destdir}}" cmake --install build

  - uses: strip

subpackages:
  - name: librdkafka-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - lz4-dev
        - openssl-dev
        - zlib-dev
    description: librdkafka dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  ignore-regex-patterns:
    - full-integration-tests
    - ^debian/.*
    - ^confluent-debian-.*
    - ^rpm_.*
    - ^ar_test_.*
    - ^test-.*
    - -DEV.$
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - librdkafka-dev
        - build-base
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test library compilation and linking
      runs: |
        tee test.c <<'EOF'
        #include <librdkafka/rdkafka.h>
        int main() {
            const char *ver = rd_kafka_version_str();
            if (ver == NULL || ver[0] == '\0') {
                return 1;
            }
            return 0;
        }
        EOF

        gcc $(pkg-config --cflags rdkafka) test.c -o test $(pkg-config --libs rdkafka)
        ./test
    - name: Test API functionality
      runs: |
        tee test_api.c <<'EOF'
        #include <stdio.h>
        #include <string.h>
        #include <librdkafka/rdkafka.h>

        int main() {
            /* Test rd_kafka_version_str returns a non-empty string */
            const char *ver_str = rd_kafka_version_str();
            if (ver_str == NULL || strlen(ver_str) == 0) {
                fprintf(stderr, "FAIL: rd_kafka_version_str() returned empty\n");
                return 1;
            }
            printf("librdkafka version string: %s\n", ver_str);

            /* Test rd_kafka_version returns a positive integer */
            int ver = rd_kafka_version();
            if (ver <= 0) {
                fprintf(stderr, "FAIL: rd_kafka_version() returned %d\n", ver);
                return 1;
            }
            printf("librdkafka version int: 0x%08x\n", ver);

            /* Test error code to string conversion */
            const char *err_str = rd_kafka_err2str(RD_KAFKA_RESP_ERR_NO_ERROR);
            if (err_str == NULL || strlen(err_str) == 0) {
                fprintf(stderr, "FAIL: rd_kafka_err2str() returned empty\n");
                return 1;
            }
            printf("No error string: %s\n", err_str);

            printf("SUCCESS: All API tests passed\n");
            return 0;
        }
        EOF

        gcc $(pkg-config --cflags rdkafka) test_api.c -o test_api $(pkg-config --libs rdkafka)
        ./test_api
    - name: Test SASL mechanisms have providers
      runs: |
        # builtin.features claims every mechanism whenever OpenSSL is present,
        # so only rd_kafka_new() proves the provider was compiled in.
        tee test_sasl.c <<'EOF'
        #include <stdio.h>
        #include <librdkafka/rdkafka.h>

        int main() {
            const char *mechs[] = {"PLAIN", "SCRAM-SHA-256", "SCRAM-SHA-512",
                                   "OAUTHBEARER", NULL};
            char errstr[512];
            int failed = 0;

            for (int i = 0; mechs[i]; i++) {
                rd_kafka_conf_t *conf = rd_kafka_conf_new();
                rd_kafka_conf_set(conf, "security.protocol", "SASL_PLAINTEXT",
                                  errstr, sizeof(errstr));
                rd_kafka_conf_set(conf, "sasl.mechanisms", mechs[i],
                                  errstr, sizeof(errstr));
                rd_kafka_conf_set(conf, "sasl.username", "user",
                                  errstr, sizeof(errstr));
                rd_kafka_conf_set(conf, "sasl.password", "pass",
                                  errstr, sizeof(errstr));
                rd_kafka_t *rk = rd_kafka_new(RD_KAFKA_PRODUCER, conf,
                                              errstr, sizeof(errstr));
                if (!rk) {
                    fprintf(stderr, "FAIL: %s: %s\n", mechs[i], errstr);
                    failed = 1;
                    continue;
                }
                printf("OK: %s\n", mechs[i]);
                rd_kafka_destroy(rk);
            }
            return failed;
        }
        EOF

        gcc $(pkg-config --cflags rdkafka) test_sasl.c -o test_sasl $(pkg-config --libs rdkafka)
        ./test_sasl
