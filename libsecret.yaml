package:
  name: libsecret
  version: "0.21.8"
  epoch: 0 # glibc: 2.43->2.44
  description: Library for storing and retrieving passwords and other secrets
  copyright:
    - license: LGPL-2.1
  dependencies:
    provider-priority: 10
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  python-version: "3.13"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - dbus
      - glib-dev
      - glib-gir
      - glibc-2.44-dev
      - gobject-introspection-dev
      - libgcrypt-dev
      # - intltool TODO this has dependencies on a lot of perl packages so skipping for now
      - libxslt-dev
      - meson
      - posix-libc-utils
      - py${{vars.python-version}}-packaging
      - vala

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.gnome.org/GNOME/libsecret
      tag: ${{package.version}}
      expected-commit: 257547ed7a541fc63400f91578216d3b53721c57

  - uses: meson/configure
    with:
      opts: |
        -Dgtk_doc=false \
        -Dmanpage=false

  - uses: meson/compile

  - uses: meson/install

  - name: Install static library
    runs: |
      # In 0.21.8, upstream changed to static_library() without install: true
      # for the test-only static library. We install it manually so the
      # libsecret-static subpackage remains non-empty.
      mkdir -p "${{targets.destdir}}"/usr/lib
      cp output/libsecret/libsecret-1.a "${{targets.destdir}}"/usr/lib/

  - uses: strip

subpackages:
  - name: libsecret-static
    pipeline:
      - uses: split/static
    test:
      pipeline:
        - uses: test/tw/staticpackage
    dependencies:
      provider-priority: 10
      runtime:
        - glib-static
    description: libsecret static

  - name: libsecret-dev
    pipeline:
      - uses: split/dev
    dependencies:
      provider-priority: 10
      runtime:
        - libsecret
        - libsecret-lang
    description: libsecret dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: libsecret-lang
    pipeline:
      - uses: split/locales
    dependencies:
      provider-priority: 10
    description: libsecret locales
    test:
      pipeline:
        - uses: test/tw/langpackage

update:
  enabled: true
  release-monitor:
    identifier: 13150

test:
  environment:
    contents:
      packages:
        - libsecret-dev
        - build-base
        - pkgconf
        - glib-dev
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test libsecret compile and link
      runs: |
        set -euo pipefail

        tee test.c <<'EOF'
        #include <libsecret/secret.h>
        int main() {
            GType type = secret_service_get_type();
            return (type == 0) ? 1 : 0;
        }
        EOF

        gcc $(pkg-config --cflags libsecret-1) test.c -o test $(pkg-config --libs libsecret-1)
        ./test
