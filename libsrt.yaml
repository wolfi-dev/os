package:
  name: libsrt
  version: "1.5.7"
  epoch: 6
  description: "Secure Reliable Transport (SRT)"
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - libsrt${{vars.soversion}}=${{package.full-version}}

vars:
  openssl-version: "4.0"

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\..*$
    replace: ${1}
    to: soversion

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake-3
      - glibc-2.44-dev
      - openssl
      - openssl-hardened-${{vars.openssl-version}}-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Haivision/srt
      tag: v${{package.version}}
      expected-commit: 899348d8318eb9a3c5a5b6ec43c4a1114288773a

  - uses: cmake/configure
    with:
      opts: |
        -DUSE_ENCLIB=openssl-evp \
        -DENABLE_STATIC=OFF

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: libsrt${{vars.soversion}}
    description: Secure Reliable Transport (SRT) shared library
    dependencies:
      # libsrt <= 1.5.7-r5 also provides so:libsrt.so.1.5; win that tie so
      # consumers don't pull the headers and openssl-dev back in.
      provider-priority: 10
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libsrt.so.* "${{targets.subpkgdir}}"/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - name: No pc or cmd:bash dependencies
          runs: |
            deps=$(apk info -R libsrt${{vars.soversion}})
            echo "$deps"
            echo "$deps" | grep -q 'depends on'
            if echo "$deps" | grep -E '^(pc:|cmd:bash)'; then
              echo "unexpected pc:/cmd:bash dependency"
              exit 1
            fi

update:
  enabled: true
  github:
    identifier: Haivision/srt
    strip-prefix: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        srt-file-transmit --version
        srt-live-transmit --version
        srt-file-transmit --help
        srt-live-transmit --help
    - uses: test/pkgconf
    - uses: test/tw/ldd-check
