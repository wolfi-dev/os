package:
  name: libvips
  version: "8.18.5"
  epoch: 1 # go/wolfi-rsc/libvips
  description: "A fast image processing library with low memory needs"
  copyright:
    - license: LGPL-2.1-or-later
  resources:
    cpu: "2"
    memory: 6Gi
  test-resources:
    cpu: "2"
    memory: 1Gi

environment:
  contents:
    packages:
      - bubblewrap
      - build-base
      - busybox
      - cmake
      - expat-dev
      - freetype-dev
      - glib-dev
      - libexif-dev
      - libjpeg-turbo-dev
      - librsvg-dev
      - meson

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/libvips/libvips
      expected-commit: 7c28da9c2b8b5b8defe54f2ae92ee474c0e2d6e4
      tag: v${{package.version}}

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libvips-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: libvips-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  ignore-regex-patterns:
    - ".*-beta"
    - ".*-rc\\d+$"
  github:
    identifier: libvips/libvips
    strip-prefix: v

test:
  pipeline:
    - runs: |
        vips --version
        vipsheader --version
        vipsthumbnail --version
    - uses: test/tw/ldd-check
    - name: Create a test PNG image
      runs: |
        # Create a 100x100 black PNG image using the vips CLI
        vips black /tmp/test.png 100 100
        test -f /tmp/test.png
    - name: Read image metadata with vipsheader
      runs: |
        vipsheader -a /tmp/test.png | grep -F "width: 100"
        vipsheader -a /tmp/test.png | grep -F "height: 100"
    - name: Convert PNG to JPEG
      runs: |
        vips jpegsave /tmp/test.png /tmp/test.jpg
        test -f /tmp/test.jpg
        vipsheader -a /tmp/test.jpg | grep -F "width: 100"
    - name: Resize image with vipsthumbnail
      runs: |
        vipsthumbnail /tmp/test.png --size 50x50 -o /tmp/thumb.png
        test -f /tmp/thumb.png
        vipsheader -f width /tmp/thumb.png | grep -F "50"
    - name: Crop image with vips extract_area
      runs: |
        vips extract_area /tmp/test.png /tmp/crop.png 0 0 40 40
        test -f /tmp/crop.png
        vipsheader -f width /tmp/crop.png | grep -F "40"
        vipsheader -f height /tmp/crop.png | grep -F "40"
    - name: Invert image colours
      runs: |
        vips invert /tmp/test.png /tmp/inverted.png
        test -f /tmp/inverted.png
