package:
  name: libvips
  version: "8.18.7"
  epoch: 1
  description: "A fast image processing library with low memory needs"
  copyright:
    - license: LGPL-2.1-or-later
  resources:
    cpu: "2"
    memory: 6Gi
  test-resources:
    cpu: "2"
    memory: 1Gi

environment:
  contents:
    packages:
      - bubblewrap
      - build-base
      - busybox
      - cmake
      - expat-dev
      - freetype-dev
      - glib-dev
      - glibc-2.44-dev
      - libexif-dev
      - libheif-dev
      - libjpeg-turbo-dev
      - librsvg-dev
      - meson

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/libvips/libvips
      expected-commit: 24ad4d042940e6bf99a68871ba886ca8847c9c82
      tag: v${{package.version}}

  - uses: meson/configure
    with:
      opts: -Dheif=enabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libvips-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: libvips-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  ignore-regex-patterns:
    - ".*-beta"
    - ".*-rc\\d+$"
  github:
    identifier: libvips/libvips
    strip-prefix: v

test:
  pipeline:
    - runs: |
        vips --version
        vipsheader --version
        vipsthumbnail --version
    - uses: test/tw/ldd-check
    - name: Create a test PNG image
      runs: |
        # Create a 100x100 black PNG image using the vips CLI
        vips black /tmp/test.png 100 100
        test -f /tmp/test.png
    - name: Read image metadata with vipsheader
      runs: |
        vipsheader -a /tmp/test.png | grep -F "width: 100"
        vipsheader -a /tmp/test.png | grep -F "height: 100"
    - name: Convert PNG to JPEG
      runs: |
        vips jpegsave /tmp/test.png /tmp/test.jpg
        test -f /tmp/test.jpg
        vipsheader -a /tmp/test.jpg | grep -F "width: 100"
    - name: Resize image with vipsthumbnail
      runs: |
        vipsthumbnail /tmp/test.png --size 50x50 -o /tmp/thumb.png
        test -f /tmp/thumb.png
        vipsheader -f width /tmp/thumb.png | grep -F "50"
    - name: Crop image with vips extract_area
      runs: |
        vips extract_area /tmp/test.png /tmp/crop.png 0 0 40 40
        test -f /tmp/crop.png
        vipsheader -f width /tmp/crop.png | grep -F "40"
        vipsheader -f height /tmp/crop.png | grep -F "40"
    - name: Invert image colours
      runs: |
        vips invert /tmp/test.png /tmp/inverted.png
        test -f /tmp/inverted.png
    - name: Check that HEIF support is built in
      runs: |
        vips --vips-config | grep -F "HEIC/AVIF load/save with libheif: true"
        vips -l | grep -F heifload
        vips -l | grep -F heifsave
    - name: Encode and decode HEIC and AVIF images
      runs: |
        vips black /tmp/heif-source.png 64 48 --bands 3
        vips heifsave /tmp/heif-source.png /tmp/test.heic --compression hevc --effort 0
        vips heifsave /tmp/heif-source.png /tmp/test.avif --compression av1 --effort 0
        for format in heic avif; do
          test -s /tmp/test.${format}
          vips heifload /tmp/test.${format} /tmp/decoded-${format}.png
          test "$(vipsheader -f width /tmp/decoded-${format}.png)" = 64
          test "$(vipsheader -f height /tmp/decoded-${format}.png)" = 48
        done
