package:
  name: libvpx
  version: "1.17.0"
  epoch: 2
  description: Library for the vp8/vp9 codecs
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "14"
    memory: 9Gi

environment:
  contents:
    packages:
      - bash
      - coreutils
      - curl # for tests
      - diffutils
      - gcc
      - glibc-2.44-dev
      - nasm
      - perl

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/webmproject/libvpx
      tag: v${{package.version}}
      expected-commit: 6df3ec34557879fff673706f4a1d9fbd0f3a6f0e

  # This package's configure doesn't support the default flags
  # passed by autoconf/configure
  - runs: |
      ./configure \
      --prefix=/usr \
      --disable-install-srcs \
      --disable-static \
      --enable-libs \
      --enable-multithread \
      --enable-pic \
      --enable-postproc \
      --enable-runtime-cpu-detect \
      --enable-shared \
      --enable-temporal-denoising \
      --enable-unit-tests \
      --enable-vp8 \
      --enable-vp9 \
      --enable-vp9-highbitdepth \
      --enable-vp9-postproc \
      --enable-vp9-temporal-denoising

  - uses: autoconf/make

  # Tests take a very long time (1h+)
  - name: Test the built library
    runs: |
      # These tests need too much memory, skip it
      GTEST_FILTER=-EncodeAPI.ConfigLargeTargetBitrateVp9
      GTEST_FILTER="$GTEST_FILTER:VP9/RealtimeTest.IntegerOverflowLarge*"
      export GTEST_FILTER
      LD_LIBRARY_PATH=$(pwd) make test -j"$(nproc)"

  - uses: autoconf/make-install

subpackages:
  - name: "libvpx-dev"
    description: "headers for libvpx"
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    use-tag: true
    identifier: webmproject/libvpx
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
