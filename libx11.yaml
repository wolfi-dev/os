package:
  name: libx11
  version: "1.8.14"
  epoch: 4 # shared library naming: split libx11-${{vars.soversion}}, libx11-xcb${{vars.xcb-soversion}}, libx11-data
  description: X11 client-side library
  copyright:
    - license: XFree86-1.1
  dependencies:
    runtime:
      - libx11-${{vars.soversion}}=${{package.full-version}}
      - libx11-data=${{package.full-version}}
      - libx11-xcb${{vars.xcb-soversion}}=${{package.full-version}}
  resources:
    memory: 2Gi

vars:
  soversion: "6"
  xcb-soversion: "1"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44
      - glibc-2.44-dev
      - gtk-doc
      - intltool
      - libtool
      - libxcb-dev
      - pkgconf-dev
      - util-macros-dev
      - xmlto
      - xorgproto
      - xtrans
      - xtrans-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/xorg/lib/libx11.git
      tag: libX11-${{package.version}}
      expected-commit: b8d5a7046a98a244ee8ca3c9c07fd617c800dde2

  - runs: ./autogen.sh

  - uses: autoconf/configure
    with:
      opts: |
        --with-xcb \
        --disable-thread-safety-constructor

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: upstream-tests/make-check

  - name: Drop headers that are now provided by xorgproto (legacy=true)
    runs: |
      for h in XKBgeom.h XKBsrv.h XKBstr.h; do
        rm -rf "${{targets.destdir}}/usr/include/X11/extensions/$h"
      done

  - uses: strip

subpackages:
  - name: libx11-${{vars.soversion}}
    description: X11 client-side library
    dependencies:
      runtime:
        - libx11-data
    pipeline:
      - uses: split/lib
        with:
          patterns: X11
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: libx11-xcb${{vars.xcb-soversion}}
    description: Xlib/XCB interface library
    pipeline:
      - uses: split/lib
        with:
          patterns: X11-xcb
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: libx11-data
    description: X11 client-side library locale and error database data
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share
          mv "${{targets.destdir}}"/usr/share/X11 "${{targets.subpkgdir}}"/usr/share/
    test:
      pipeline:
        - runs: |
            test -f /usr/share/X11/XErrorDB
            test -f /usr/share/X11/locale/locale.dir
            test -f /usr/share/X11/locale/en_US.UTF-8/XLC_LOCALE

  - name: libx11-static
    description: libx11 static library
    dependencies:
      runtime:
        - libxcb-static
    pipeline:
      - uses: split/static
    test:
      pipeline:
        - uses: test/tw/staticpackage

  - name: libx11-doc
    pipeline:
      - uses: split/alldocs
    description: Documentation for ${{package.name}}
    test:
      pipeline:
        - uses: test/tw/docs

  - name: libx11-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libx11-${{vars.soversion}}=${{package.full-version}}
        - libx11-xcb${{vars.xcb-soversion}}=${{package.full-version}}
        - libxcb-dev
        - xtrans
    description: libx11 dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - libx11-dev
        - build-base
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test library compilation
      runs: |
        tee test.c <<'EOF'
        #include <X11/Xlib.h>
        #include <stdio.h>

        int main() {
            /* Attempt to open display - will return NULL without a display server,
               but this proves the library links and the function is callable */
            Display *dpy = XOpenDisplay(NULL);
            if (dpy != NULL) {
                XCloseDisplay(dpy);
            }
            printf("libX11 compile and link test passed\n");
            return 0;
        }
        EOF

        gcc $(pkg-config --cflags x11) test.c -o test $(pkg-config --libs x11)
        ./test

update:
  enabled: true
  release-monitor:
    identifier: 1764
