package:
  name: libxext
  version: "1.3.7"
  epoch: 5 # shared library naming: split libxext${{vars.soversion}}
  description: X11 miscellaneous extensions library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libxext${{vars.soversion}}=${{package.full-version}}
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  soversion: "6"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libtool
      - libx11-dev
      - libxau-dev
      - pkgconf-dev
      - util-macros-dev
      - xmlto
      - xorgproto

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/xorg/lib/libxext.git
      tag: libXext-${{package.version}}
      expected-commit: 2a694ba264ccdb205909909abfe8b136f9156ebe

  - runs: ./autogen.sh

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libxext${{vars.soversion}}
    description: "X11 miscellaneous extensions library"
    pipeline:
      - uses: split/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: libxext-doc
    pipeline:
      - uses: split/manpages
    description: libxext manpages
    test:
      pipeline:
        - uses: test/docs

  - name: libxext-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libxext${{vars.soversion}}=${{package.full-version}}
        - libxau-dev
        - libx11-dev
    description: libxext dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  release-monitor:
    identifier: 1774

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/no-docs
