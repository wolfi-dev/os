package:
  name: libxslt
  version: "1.1.45"
  epoch: 8 # CVE regression tests
  description: XML stylesheet transformation library
  copyright:
    - license: MIT
  cpe:
    product: libxslt
    vendor: xmlsoft
  resources:
    cpu: "2"
    memory: 2Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libgcrypt-dev
      - libgpg-error-dev
      - libtool
      - libxml2-dev
      - pkgconf-dev
  environment:
    CFLAGS: -fPIC

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.gnome.org/GNOME/libxslt.git
      tag: v${{package.version}}
      expected-commit: 35323d6a15f6e63c9919ddbc0abe64c90a0dd88a

  - uses: patch
    with:
      # Chromium's libxslt security fixes (chromium/src
      # third_party/libxslt/chromium/0004-0008), in Chromium's order; none are
      # in an upstream release yet. Each file's Patch-Source names its commit.
      # TODO: remove each once an upstream release has the fix.
      patches: |
        CVE-2025-10911.patch
        CVE-2026-9947.patch
        CVE-2026-11196.patch
        CVE-2026-87636.patch
        CVE-2026-125350.patch

  - runs: ./autogen.sh

  - uses: autoconf/configure
    with:
      opts: |
        --with-python=no \
        --enable-shared=yes \
        --enable-static=yes

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libxslt-static
    pipeline:
      - uses: split/static
    dependencies:
      runtime:
        - libxml2-static
        - libxslt-dev=${{package.full-version}}
    description: libxslt static libraries (libxslt.a, libexslt.a)
    test:
      environment:
        contents:
          packages:
            - binutils # readelf
            - build-base
            - posix-libc-utils # ldd
      pipeline:
        - uses: test/tw/staticpackage
        - name: validate that static libraries have been built with -fPIC on x86
          if: ${{build.arch}} == 'x86_64'
          runs: |
            for lib in /usr/lib/libxslt.a /usr/lib/libexslt.a; do
              if readelf -a -W "$lib" | \
                grep -E 'R_X86_64_PC32\s+0+\sstderr\s'; then
                echo "ERROR: $lib uses unsupported relocations for dynamic linking against glibc" 1>&2
                exit 1
              fi
            done
        - name: validate that static linking works
          runs: |
            cat <<'EOF' > test.c
            #include <libxslt/xslt.h>
            int main(void) { xsltInit(); xsltCleanupGlobals(); return 0; }
            EOF
            gcc -c test.c $(xslt-config --cflags)
            gcc test.o /usr/lib/libxslt.a /usr/lib/libxml2.a \
              $(xslt-config --libs) $(xml2-config --libs) -o test
            # Should not be dynamically linked against libxslt/libxml2
            if ldd test | grep -E 'libxslt|libxml2'; then
              exit 1
            fi
            ./test || exit 1

  - name: libxslt-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libxslt
    description: libxslt dev
    test:
      pipeline:
        - runs: |
            xslt-config --version
            xslt-config --help
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: libxslt-doc
    pipeline:
      - uses: split/manpages
    description: libxslt manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 13301

test:
  environment:
    contents:
      packages:
        - build-base
        - libxml2-dev
        - libxslt-dev
  pipeline:
    # AUTOGENERATED
    - runs: |
        xsltproc --version
    - uses: test/tw/ldd-check
    # Chromium's own tests for the Chromium patches we carry, kept in test-data/.
    # Each test's main file says where it came from and what it checks.
    - name: "CVE-2026-9947: long xsl:attribute text is not freed twice"
      runs: |
        cd test-data/CVE-2026-9947
        xsltproc xslt-attribute-double-free.xsl xslt-attribute-double-free.xml
    - name: "CVE-2026-11196: a DTD in a simplified stylesheet does not crash"
      runs: |
        cd test-data/CVE-2026-11196
        # Rejecting the stylesheet is fine; crashing on it (exit 128 and up) is the bug.
        rc=0
        xsltproc xslt-type-confusion.xsl xslt-type-confusion.xml || rc=$?
        if [ "$rc" -ge 128 ]; then
          echo "ERROR: xsltproc crashed (exit $rc)"
          exit 1
        fi
    - name: "CVE-2026-87636: document('') with an invalid base URI is empty"
      runs: |
        gcc test-data/CVE-2026-87636/document-function.c $(xslt-config --cflags --libs) -o document-function
        ./document-function
    - name: "CVE-2026-125350: nested xsl:number does not reuse a freed node-set"
      runs: |
        cd test-data/CVE-2026-125350
        xsltproc xslt-number-reentrancy-union.xsl xslt-number-reentrancy-union.xml | grep -F '<html><body>1</body></html>'
        xsltproc xslt-number-reentrancy-import.xsl xslt-number-reentrancy-import.xml | grep -F '<html><body>P11</body></html>'
