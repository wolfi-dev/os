package:
  name: linenoise
  version: "2.0"
  epoch: 3 # add functional API test and improve test coverage
  description: "minimal alternative to GNU readline"
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/antirez/linenoise
      tag: ${{package.version}}
      expected-commit: dc83cc373ac2058030eb3cf5e404959a26fef112

  - uses: patch
    with:
      patches: build-shared-lib.patch

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: "linenoise-dev"
    description: "linenoise headers"
    pipeline:
      - uses: split/dev
      - name: Ensure linker symlink is present
        runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          ln -sf liblinenoise.so.0.0.0 "${{targets.subpkgdir}}"/usr/lib/liblinenoise.so
    dependencies:
      runtime:
        - linenoise
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
        - uses: test/tw/header-check

update:
  enabled: true
  github:
    identifier: antirez/linenoise
    use-tag: true

test:
  environment:
    contents:
      packages:
        - linenoise-dev
        - build-base
  pipeline:
    - uses: test/tw/ldd-check
    - name: Compile and run a program using the linenoise API
      runs: |
        cat > test_linenoise.c << 'EOF'
        #include <linenoise.h>
        #include <stdio.h>
        #include <string.h>

        int main(void) {
            /* Test history API (does not require a TTY) */
            linenoiseHistorySetMaxLen(10);
            linenoiseHistoryAdd("first entry");
            linenoiseHistoryAdd("second entry");

            /* Save history to a temp file and reload it */
            linenoiseHistorySave("/tmp/linenoise_test_history.txt");
            linenoiseHistoryLoad("/tmp/linenoise_test_history.txt");

            printf("linenoise API functional test passed\n");
            return 0;
        }
        EOF
        gcc test_linenoise.c -o test_linenoise -llinenoise
        ./test_linenoise
