package:
  name: lua-5.5
  version: "5.5.1"
  epoch: 0 # Lua 5.5
  description: Powerful light-weight programming language
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 5Gi

var-transforms:
  - from: ${{package.version}}
    match: (\d+\.\d+).\d
    replace: "$1"
    to: luaMM

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libtool
      - readline-dev

pipeline:
  - uses: fetch
    with:
      expected-sha256: 1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce
      uri: https://www.lua.org/ftp/lua-${{package.version}}.tar.gz

  - uses: patch
    with:
      patches: |
        lua-5.5-module_paths.patch
        lua-5.5-make.patch
        extern-c-for-cpp.patch

  - runs: |
      cat >configure.ac <<-EOF
        top_builddir=.

        AC_INIT(src/luaconf.h)
        AC_PROG_LIBTOOL
        AC_OUTPUT()
      EOF
      libtoolize --force --install
      aclocal
      autoconf

  - uses: autoconf/configure

  - runs: |
      make -C src V=${{vars.luaMM}} \
        CFLAGS="$CFLAGS -DLUA_USE_LINUX -DLUA_USE_READLINE $compat" \
        SYSLDFLAGS="$LDFLAGS" \
        RPATH="/usr/lib" \
        LIB_LIBS="-lpthread -lm -ldl -lreadline" \
        alpine_all

  - runs: |
      make V=${{vars.luaMM}} \
        INSTALL_TOP="${{targets.destdir}}"/usr \
        INSTALL_INC="${{targets.destdir}}"/usr/include/lua-${{vars.luaMM}} \
        INSTALL_LIB="${{targets.destdir}}"/usr/lib/lua-${{vars.luaMM}} \
        alpine_install
      chmod 755 "${{targets.destdir}}"/usr/lib/lua-${{vars.luaMM}}/*.so*

  - runs: |
      for i in "${{targets.destdir}}"/usr/bin/* ; do
        mv "$i" "$i"-${{vars.luaMM}}
      done
      for i in "${{targets.destdir}}"/usr/lib/lua-${{vars.luaMM}}/*.so.*; do
        ln -s lua-${{vars.luaMM}}/${i##*/} "${{targets.destdir}}"/usr/lib/${i##*/}
      done
      for i in lua luac; do
        install -D -m 644 doc/$i.1 "${{targets.destdir}}"/usr/share/man/man1/"$i""$_luaver".1
      done

      rm ${{targets.destdir}}/usr/lib/lua-${{vars.luaMM}}/liblua.la \

      install -d "${{targets.destdir}}"/usr/lib/pkgconfig
      cat > "${{targets.destdir}}"/usr/lib/pkgconfig/lua-${{vars.luaMM}}.pc <<-EOF
      # lua.pc -- pkg-config data for Lua
      V=${{vars.luaMM}}
      R=${{package.version}}
      prefix=/usr
      INSTALL_BIN=\${prefix}/bin
      INSTALL_INC=\${prefix}/include
      INSTALL_LIB=\${prefix}/lib
      INSTALL_MAN=\${prefix}/man/man1
      INSTALL_LMOD=\${prefix}/share/lua/\${V}
      INSTALL_CMOD=\${prefix}/lib/lua/\${V}
      exec_prefix=\${prefix}
      libdir=\${exec_prefix}/lib/${{package.name}}
      includedir=\${exec_prefix}/include/${{package.name}}
      Name: Lua
      Description: An extensible extension language
      Version: ${{package.version}}
      Requires:
      Libs: -L\${libdir} -llua -lm
      Cflags: -I\${includedir}
      EOF

  - uses: strip

subpackages:
  - name: lua-${{vars.luaMM}}-dev
    description: lua-${{vars.luaMM}} dev
    dependencies:
      runtime:
        - lua-${{vars.luaMM}}
        - lua-${{vars.luaMM}}-libs
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf

  - name: lua-${{vars.luaMM}}-libs
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib
          mv -v ${{targets.destdir}}/usr/lib/lib*.so.* \
            ${{targets.contextdir}}/usr/lib/

          mkdir -p ${{targets.contextdir}}/usr/lib/lua-${{vars.luaMM}}
          mv -v ${{targets.destdir}}/usr/lib/lua-${{vars.luaMM}}/lib*.so.* \
            ${{targets.contextdir}}/usr/lib/lua-${{vars.luaMM}}/
    test:
      environment:
        contents:
          packages:
            - apk-tools
      pipeline:
        - uses: test/tw/ldd-check
        - runs: |
            set +x
            mm=${{vars.luaMM}}
            pkg="lua-${mm}-libs"
            soname="liblua-$mm.so.0"
            pout=$(apk info --provides "$pkg") ||
              { echo "ERROR: 'apk info --provides $pkg' exited $?"; exit 1; }
            if out=$(echo "$pout" | grep "so:$soname="); then
              echo "PASS: $pkg provides $soname. [$out]"
            else
              echo "FAIL: $pkg did not provide so:$soname"
              echo "$ apk info --provides $pkg"
              echo "$pout"
              exit 1
            fi

  - name: lua-${{vars.luaMM}}-doc
    description: lua-${{vars.luaMM}} manpages
    pipeline:
      - uses: split/manpages
    # test added by a robot (doc)
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  release-monitor:
    identifier: 328514

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        set +x
        mm=${{vars.luaMM}}
        fail() { echo "FAIL:" "$@" 1>&2; exit 1; }
        v="${{package.version}}"
        for p in lua luac ; do
          prog="$p-$mm" # lua-5.X
          out=$($prog -v) || fail "$prog -v - exited $?"
          echo "$out" | grep -F "$v" ||
            fail "output of '$prog -v' did not contain '$v'. output: $out"
            echo "PASS: $prog -v output contained expected '$v': $out"
        done
    - name: Test Lua interpreter executes code
      runs: |
        mm=${{vars.luaMM}}

        # Test basic code execution
        output=$(lua-${mm} -e 'print("hello")')
        echo "$output" | grep -F "hello"

        # Test arithmetic and assertions
        lua-${mm} -e 'assert(1+1 == 2, "math failed")'

        # Test string operations
        output=$(lua-${mm} -e 'print(string.upper("test"))')
        echo "$output" | grep -F "TEST"

        echo "PASS: lua-${mm} interpreter executes code correctly"
    - name: Test luac compiler and execution of compiled code
      runs: |
        mm=${{vars.luaMM}}

        # Create a Lua source file
        tee /tmp/test.lua <<'EOF'
        print("compiled-output")
        local x = 40 + 2
        print(x)
        EOF

        # Compile with luac
        luac-${mm} -o /tmp/test.luac /tmp/test.lua
        stat /tmp/test.luac

        # Execute the compiled bytecode
        output=$(lua-${mm} /tmp/test.luac)
        echo "$output" | grep -F "compiled-output"
        echo "$output" | grep -F "42"

        echo "PASS: luac-${mm} compiles and lua-${mm} executes compiled code"
    - uses: test/no-docs
