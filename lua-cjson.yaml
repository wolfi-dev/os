package:
  name: lua-cjson
  version: 2.1.0.12
  epoch: 9
  description: "Lua CJSON is a fast JSON encoding/parsing module for Lua"
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - luajit
      - luajit-dev
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openresty/lua-cjson
      tag: ${{package.version}}
      expected-commit: 881accc8fadca5ec02aa34d364df2a1aa25cd2f9

  - name: "Configure"
    runs: |
      export LUAJIT_LIB=/usr/lib
      export LUA_LIB_DIR="$LUAJIT_LIB/lua"
      export LUAJIT_INC=/usr/include/luajit-2.1
      export LUA_INCLUDE_DIR=/usr/include/luajit-2.1

      make all

      make DESTDIR="${{targets.destdir}}" PREFIX=/usr install

  - uses: strip

update:
  enabled: true
  github:
    identifier: openresty/lua-cjson
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - luajit
  pipeline:
    - uses: test/tw/ldd-check
    - name: Functional JSON encode/decode test
      runs: |
        cat > /tmp/test_cjson.lua << 'EOF'
        local cjson = require("cjson")

        -- Test encoding a Lua table to JSON
        local data = {name = "lua-cjson", version = "2.1", active = true, count = 42}
        local encoded = cjson.encode(data)
        assert(type(encoded) == "string", "encode should return a string")
        assert(encoded:find("lua%-cjson"), "encoded JSON should contain the name field")

        -- Test decoding JSON back to a Lua table
        local json_str = '{"hello":"world","num":123,"flag":false}'
        local decoded = cjson.decode(json_str)
        assert(decoded.hello == "world", "decoded hello field should be world")
        assert(decoded.num == 123, "decoded num field should be 123")
        assert(decoded.flag == false, "decoded flag field should be false")

        -- Test round-trip encode/decode
        local original = {key = "value", arr = {1, 2, 3}}
        local roundtrip = cjson.decode(cjson.encode(original))
        assert(roundtrip.key == "value", "round-trip key should match")
        assert(#roundtrip.arr == 3, "round-trip array length should be 3")

        print("All lua-cjson functional tests passed")
        EOF
        luajit /tmp/test_cjson.lua
