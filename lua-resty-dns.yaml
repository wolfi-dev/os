package:
  name: lua-resty-dns
  version: "0.23"
  epoch: 8
  description: "lua-resty-lrucache - Lua-land LRU cache based on the LuaJIT FFI."
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - wolfi-base
  environment:
    PREFIX: /usr

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openresty/lua-resty-dns
      tag: v${{package.version}}
      expected-commit: 273db4f348d4676f554c5319a902e7b836153192

  - uses: autoconf/make-install

test:
  environment:
    contents:
      packages:
        - luajit
  pipeline:
    - uses: test/tw/lua-syntax-check
    - name: Verify dns resolver module is installed
      uses: test/tw/contains-files
      with:
        dir: /usr/lib/lua/
        name: "resolver.lua"
    - name: Verify module structure and exported interface
      runs: |
        # Verify the module file exists in the expected resty directory structure
        stat /usr/lib/lua/resty/dns/resolver.lua

        # Use LuaJIT to load and inspect the module structure.
        # The module requires ngx cosocket at runtime, so we can't fully
        # instantiate it, but we can verify it parses correctly and inspect
        # its exported interface.
        luajit -e '
          -- Verify the file can be loaded as a Lua chunk
          local fn, err = loadfile("/usr/lib/lua/resty/dns/resolver.lua")
          if not fn then
            error("Failed to load resolver.lua: " .. tostring(err))
          end
          print("PASS: resolver.lua loads as valid Lua chunk")

          -- Verify the file contains expected module components
          local f = io.open("/usr/lib/lua/resty/dns/resolver.lua", "r")
          local content = f:read("*a")
          f:close()

          -- Check for key module components
          assert(content:find("_VERSION"), "Missing _VERSION in module")
          assert(content:find("new"), "Missing new constructor in module")
          assert(content:find("query"), "Missing query method in module")
          assert(content:find("tcp_query"), "Missing tcp_query method in module")
          assert(content:find("set_timeout"), "Missing set_timeout method in module")
          assert(content:find("TYPE_A"), "Missing TYPE_A constant in module")
          assert(content:find("TYPE_AAAA"), "Missing TYPE_AAAA constant in module")
          assert(content:find("TYPE_MX"), "Missing TYPE_MX constant in module")
          assert(content:find("TYPE_TXT"), "Missing TYPE_TXT constant in module")
          assert(content:find("CLASS_IN"), "Missing CLASS_IN constant in module")
          print("PASS: module contains expected DNS resolver interface")
        '

update:
  enabled: true
  github:
    identifier: openresty/lua-resty-dns
    strip-prefix: v
    use-tag: true
