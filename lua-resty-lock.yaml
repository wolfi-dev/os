package:
  name: lua-resty-lock
  version: "0.10"
  epoch: 0 # go/wolfi-rsc/lua-resty-lock
  description: "Simple nonblocking lock API for ngx_lua based on shared memory dictionaries"
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - wolfi-base
  environment:
    PREFIX: /usr

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openresty/lua-resty-lock
      tag: v${{package.version}}
      expected-commit: c99d6d785da18cc3ed62477a652b459599d17ed6

  - uses: autoconf/make-install

test:
  pipeline:
    - uses: test/tw/lua-syntax-check

update:
  enabled: true
  github:
    identifier: openresty/lua-resty-lock
    strip-prefix: v
    use-tag: true
