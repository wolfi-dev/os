package:
  name: lua-resty-string
  version: "0.19"
  epoch: 0
  description: "String utilities and common hash functions for ngx_lua and LuaJIT"
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - wolfi-base
  environment:
    PREFIX: /usr

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openresty/lua-resty-string
      tag: v${{package.version}}
      expected-commit: 282590f58d4c927226492e0211b974d72b759329

  - uses: autoconf/make-install

test:
  pipeline:
    - uses: test/tw/lua-syntax-check

update:
  enabled: true
  github:
    identifier: openresty/lua-resty-string
    strip-prefix: v
    use-tag: true
