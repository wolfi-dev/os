package:
  name: luarocks
  version: "3.13.0"
  epoch: 2 # go/wolfi-rsc/luarocks
  description: "Package manager for Lua modules"
  copyright:
    - license: MIT
  options:
    no-depends: true
  dependencies:
    runtime:
      - curl
      - gcc
      - git
      - luajit
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - luajit-dev
      - openssl-${{vars.openssl-version}}-dev
      - zlib-dev

vars:
  openssl-version: "4.0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/luarocks/luarocks
      tag: v${{package.version}}
      expected-commit: 3421bedc2ce2b64e79530bb97497531b014899a8

  - runs: ./configure --prefix=/usr --with-lua=/usr

  - uses: autoconf/make

  - uses: autoconf/make-install

update:
  enabled: true
  github:
    identifier: luarocks/luarocks
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - luajit-dev
        - glibc-dev
        - openresty
        - curl
        - wget
        - bash
        - zlib-dev
        - python3
  pipeline:
    - runs: |
        # install lzlib rock
        luarocks --version
        curl -LO https://luarocks.org/manifests/hisham/lzlib-0.4.1.53-4.rockspec
        luarocks install lzlib-0.4.1.53-4.rockspec ZLIB_INCDIR=/usr/include

        # start openresty
        cp default.conf /etc/nginx/conf.d/default.conf

        # openresty's packaging ships no init script to pre-create its
        # runtime directories (e.g. nginx-client-body), so without this
        # mkdir, nginx aborts at startup with "mkdir() ... failed (2: No
        # such file or directory)" and the readiness loop below times out
        # waiting for a server that never came up.
        mkdir -p /var/run/openresty
        openresty -g "daemon off;" > /dev/null 2>&1 &
        OPENRESTY_PID=$!

        # Wait for openresty to start accepting connections instead of a
        # fixed sleep, to avoid flaky races under slow test VMs.
        for i in $(seq 1 30); do
          if curl -s -o /dev/null http://127.0.0.1:80/; then
            break
          fi
          sleep 0.5
        done

        # Generate zlib-compressed data
        echo -n "Hello from lzlib!" | \
        python3 -c 'import sys,zlib; sys.stdout.buffer.write(zlib.compress(sys.stdin.buffer.read()))' \
        > /tmp/compressed_data.bin

        # 3) Send the POST request to localhost
        #
        # Retry on connection-refused: even after the readiness loop above
        # observes a successful GET, openresty's Lua VM can take a moment
        # longer to settle under slow/loaded test VMs.
        curl -i -X POST --retry 10 --retry-delay 1 --retry-connrefused \
          --data-binary @/tmp/compressed_data.bin http://127.0.0.1:80/

        # 5) Check the error log for our success message
        if grep -q "Successfully decompressed: Hello from lzlib!" /var/log/openresty/all_error.log; then
          echo "Test PASSED: ✔ Found decompressed message."
          kill $OPENRESTY_PID
          exit 0
        else
          echo "Test FAILED: ✗ Message not decompressed!"
          # Show the last few lines of error log to help debug
          echo "Log tail:"
          tail -n 20 /var/log/openresty/all_error.log
          kill $OPENRESTY_PID
          exit 1
        fi
