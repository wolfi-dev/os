# Generated from https://git.alpinelinux.org/aports/plain/community/man-db/APKBUILD
package:
  name: man-db
  version: "2.13.3"
  epoch: 1 # runtime-depend on glibc-iconv-common (F-217)
  description: The man command and related utilities for examining on-line help files
  copyright:
    - license: GPL-3.0
  dependencies:
    runtime:
      - glibc-iconv-common # calls iconv_open for non-UTF-8 charsets; glibc builds in only UTF-8/UCS/ASCII
      - groff
      - merged-lib
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - flex
      - gdbm-dev
      - gettext-dev
      - glibc-2.44-dev
      - groff
      - libpipeline-dev
      - libseccomp-dev
      - libtool
      - pkgconf-dev
      - python3
      - wget # for gnulib translations
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/man-db/man-db
      tag: ${{package.version}}
      expected-commit: 74f9ff6116b4855ae4d2bc446ac3449e890f35dc

  - uses: git/gnulib-bootstrap

  - uses: autoconf/configure
    with:
      opts: |
        --sbindir=/usr/bin --disable-setuid \
        --with-systemdsystemunitdir=/usr/lib/systemd/system

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: upstream-tests/make-check

  - uses: strip

subpackages:
  - name: man-db-doc
    pipeline:
      - uses: split/manpages
    description: man-db manpages
    test:
      pipeline:
        - uses: test/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - merged-lib
        - wolfi-baselayout

update:
  enabled: true
  release-monitor:
    identifier: 1882

# Test the man command, by installing the man-db-doc manpages, and running man on many of them,
# rendering them to stdout in dvi format (dumped to /dev/null), but ensuring that every
# invocation at least exits 0.
test:
  environment:
    contents:
      packages:
        - man-db-doc
  pipeline:
    - name: Ensure that setuid bits are not set
      runs: |
        set -x
        for bin in "/bin/man" "/bin/mandb" "/usr/bin/man" "/usr/bin/mandb"; do
          if [ -u "$bin" ]; then exit 1; fi
        done
    - runs: |
        find /usr/share/man/ -type f -name "*.[0-9]" | xargs -i man -Tdvi -l {} >/dev/null
        apropos --version
        apropos --help
        catman --version
        catman --help
        lexgrog --version
        lexgrog --help
        man --version
        man --help
        man-recode --version
        man-recode --help
        mandb --version
        mandb --help
        manpath --version
        manpath --help
        whatis --version
        whatis --help
        accessdb --version
        accessdb --help
    - uses: test/tw/ldd-check
    - name: "manconv recodes ISO-8859-2 (glibc-iconv-common)"
      runs: |
        # Without glibc-iconv-common this conversion fails (glibc builds in only UTF-8, UCS-2/4 and ASCII).
        [ ! -e /usr/lib/gconv/gconv-modules.d/gconv-modules-extra.conf ] || { echo "FAIL: full glibc-iconv is in the test environment, so this test cannot catch a missing glibc-iconv-common dependency"; exit 1; }
        # The test tooling (help-check pulls man-db and groff) brings glibc-iconv-common into most test environments, so also check the dependency itself.
        apk info -R man-db | grep -qx glibc-iconv-common || { echo "FAIL: man-db does not runtime-depend on glibc-iconv-common"; exit 1; }
        printf '\xbf\xf3\xb3w\n' > /tmp/l2
        out=$(/usr/libexec/man-db/manconv -f ISO-8859-2 -t UTF-8 < /tmp/l2 | od -An -tx1 | tr -d ' \n')
        case "$out" in c5bcc3b3c58277*) ;; *) echo "FAIL: manconv gave $out"; exit 1 ;; esac
