package:
  name: mariadb-connector-c
  version: "3.4.10"
  epoch: 0 # glibc: 2.43->2.44
  description: The MariaDB Native Client library (C driver)
  copyright:
    - license: LGPL-2.1-or-later
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-2.44-dev
      - mariadb-dev
      - openssl-dev
      - samurai
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mariadb-corporation/mariadb-connector-c/
      tag: v${{package.version}}
      expected-commit: 8153da40fe720b1d25db12aa3f993918da15bd3b

  - runs: |
      # INSTALL_LIBDIR and INSTALL_INCLUDEDIR are relative to CMAKE_INSTALL_PREFIX.
      cmake -B build -G Ninja \
        -DCMAKE_BUILD_TYPE=MinSizeRel \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DBUILD_SHARED_LIBS=True \
        -DINSTALL_LIBDIR=lib \
        -DINSTALL_INCLUDEDIR=include/mysql \
        -DMARIADB_PORT=3306 \
        -DMARIADB_UNIX_ADDR=/run/mysqld/mysqld.sock \
        -DWITH_EXTERNAL_ZLIB=YES \
        -DWITH_MYSQLCOMPAT=ON \
        -DWITH_SSL=OPENSSL \
        $CMAKE_CROSSOPTS
      cmake --build build

  - runs: |
      DESTDIR="${{targets.destdir}}" cmake --install build

      # purge static libs
      rm "${{targets.destdir}}"/usr/lib/*.a

      # Docs conflict with mariadb-doc
      rm -r "${{targets.destdir}}"/usr/man

      # compat symlinks
      ln -s mariadb_config "${{targets.destdir}}"/usr/bin/mysql_config
      ln -s mariadb_version.h "${{targets.destdir}}"/usr/include/mysql/mysql_version.h

      # This conflicts with the one in mariadb-dev.
      rm "${{targets.destdir}}/usr/include/mysql/mariadb_rpl.h"

  - uses: strip

subpackages:
  - name: mariadb-connector-c-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - mariadb-dev
    description: mariadb-connector-c dev
    test:
      environment:
        contents:
          packages:
            - build-base
            - mariadb-connector-c-dev
            - pkgconf
      pipeline:
        - runs: |
            mariadb_config --version
            mariadb_config --help
            mysql_config --version
            mysql_config --help
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
        - name: Compile and link against mariadb-connector-c using pkg-config
          runs: |
            cat > /tmp/test_mariadb.c << 'EOF'
            #include <mysql.h>
            int main(void) {
                MYSQL *conn = mysql_init(NULL);
                if (conn == NULL) {
                    return 1;
                }
                mysql_close(conn);
                mysql_library_end();
                return 0;
            }
            EOF
            gcc $(pkg-config --cflags libmariadb) /tmp/test_mariadb.c -o /tmp/test_mariadb $(pkg-config --libs libmariadb)
            /tmp/test_mariadb

update:
  enabled: true
  git:
    strip-prefix: v
  ignore-regex-patterns:
    - ^py_.*
    - ^add$

test:
  environment:
    contents:
      packages:
        - build-base
        - mariadb-connector-c-dev
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - name: Compile and link against mariadb-connector-c
      runs: |
        cat > /tmp/test_mariadb.c << 'EOF'
        #include <mysql.h>
        int main(void) {
            MYSQL *conn = mysql_init(NULL);
            if (conn == NULL) {
                return 1;
            }
            mysql_close(conn);
            mysql_library_end();
            return 0;
        }
        EOF
        gcc $(pkg-config --cflags libmariadb) /tmp/test_mariadb.c -o /tmp/test_mariadb $(pkg-config --libs libmariadb)
        /tmp/test_mariadb
