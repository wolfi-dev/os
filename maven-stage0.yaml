package:
  name: maven-stage0
  version: 3.9.16
  epoch: 2 # CVE-2026-102554
  description: A Java project management and project comprehension tool.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - maven=3.9.16
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  - uses: fetch
    with:
      expected-sha256: 80ffca22aed9e8b9713a232f3394fd81d7f20322df75efdb2b047dbd3e3a23bb
      uri: https://archive.apache.org/dist/maven/maven-3/${{package.version}}/binaries/apache-maven-${{package.version}}-bin.tar.gz

  - uses: auth/libraries

  - name: Replace vulnerable plexus-utils with fixed version (GHSA-6fmv-xxpf-w3cw)
    runs: |
      curl --netrc --fail -sSLo /tmp/plexus-utils-3.6.1.jar https://libraries.cgr.dev/java-upstream/org/codehaus/plexus/plexus-utils/3.6.1/plexus-utils-3.6.1.jar
      echo "05a63effd67e2d6b9d610cc82e2bd7473289d34802e57a529b28110f28af5679  /tmp/plexus-utils-3.6.1.jar" | sha256sum -c
      rm lib/plexus-utils-*.jar
      mv /tmp/plexus-utils-3.6.1.jar lib/plexus-utils-3.6.1.jar

  - name: Replace vulnerable guava with 33.8.0-jre (CVE-2026-102554)
    runs: |
      curl --netrc --fail -sSLo /tmp/guava-33.8.0-jre.jar https://libraries.cgr.dev/java-upstream/com/google/guava/guava/33.8.0-jre/guava-33.8.0-jre.jar
      echo "97b79ec3f2c0a6313a0c2df51ce1abdf8907e6531803467b81efcaaf99b35161  /tmp/guava-33.8.0-jre.jar" | sha256sum -c
      rm lib/guava-*.jar
      mv /tmp/guava-33.8.0-jre.jar lib/guava-33.8.0-jre.jar
      rm -f /root/.netrc /home/build/.netrc

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/java/maven
      mkdir -p ${{targets.destdir}}/usr/share/java/maven/bin
      mkdir -p ${{targets.destdir}}/usr/share/java/maven/boot
      mkdir -p ${{targets.destdir}}/usr/share/java/maven/lib

      install -m644 -Dt ${{targets.destdir}}/usr/share/java/maven/bin ./bin/*.conf
      install -m644 -Dt ${{targets.destdir}}/usr/share/java/maven/boot ./boot/*.jar
      install -m644 -Dt ${{targets.destdir}}/usr/share/java/maven/lib ./lib/*.jar
      cp -Rp ./conf ${{targets.destdir}}/usr/share/java/maven/

      mkdir -p ${{targets.destdir}}/usr/bin

      install -m755 -Dt ${{targets.destdir}}/usr/share/java/maven/bin ./bin/mvn
      ln -sf /usr/share/java/maven/bin/mvn ${{targets.destdir}}/usr/bin/mvn

      install -m755 -Dt ${{targets.destdir}}/usr/share/java/maven/bin ./bin/mvnDebug
      ln -sf /usr/share/java/maven/bin/mvnDebug ${{targets.destdir}}/usr/bin/mvnDebug

      install -m755 -Dt ${{targets.destdir}}/usr/share/java/maven/bin ./bin/mvnyjp
      ln -sf /usr/share/java/maven/bin/mvnyjp ${{targets.destdir}}/usr/bin/mvnyjp

update:
  enabled: false
  exclude-reason: don't auto update stage 0 packages

test:
  pipeline:
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: maven
        real-pkg-name: ${{package.name}}
