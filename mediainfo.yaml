package:
  name: mediainfo
  version: "26.05"
  epoch: 2 # add strip step and enhance tests
  description: "Utility for displaying technical and tag data for media files"
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.43-dev
      - libtool
      - mediainfolib-dev
      - pkgconf
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/MediaArea/MediaInfo.git
      tag: "v${{package.version}}"
      expected-commit: 4728f24b666117a19d36515d95b9367fbb37aaf6

  - uses: autoconf/configure
    with:
      opts: --prefix=/usr
    working-directory: Project/GNU/CLI

  - uses: autoconf/make
    working-directory: Project/GNU/CLI

  - uses: autoconf/make-install
    with:
      opts: |
        DESTDIR="${{targets.destdir}}" install
    working-directory: Project/GNU/CLI

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test mediainfo version
      runs: |
        mediainfo --version
    - name: Test mediainfo analyzes a real media file
      runs: |
        # Create a minimal valid WAV file (PCM, 1 channel, 8000 Hz, 8-bit, 0 samples)
        printf 'RIFF$\x00\x00\x00WAVEfmt \x10\x00\x00\x00\x01\x00\x01\x00@\x1f\x00\x00@\x1f\x00\x00\x01\x00\x08\x00data\x00\x00\x00\x00' > /tmp/test.wav
        mediainfo /tmp/test.wav | grep -i "Audio"
        mediainfo /tmp/test.wav | grep -i "Format"

update:
  enabled: true
  github:
    identifier: MediaArea/MediaInfo
    strip-prefix: v
