package:
  name: mediainfolib
  version: "26.05"
  epoch: 1 # add strip step and functional API test
  description: "Utility for displaying technical and tag data for media files"
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "15"
    memory: 16Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.43-dev
      - libtool
      - libzen-dev
      - pkgconf
      - pkgconf-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/MediaArea/MediaInfoLib.git
      tag: "v${{package.version}}"
      expected-commit: f23e69ce89581343f3b7a42e06828a5331e290d5

  - uses: autoconf/configure
    with:
      opts: --prefix=/usr
    working-directory: Project/GNU/Library

  - uses: autoconf/make
    working-directory: Project/GNU/Library

  - uses: autoconf/make-install
    with:
      opts: |
        DESTDIR="${{targets.destdir}}" install
    working-directory: Project/GNU/Library

  - uses: strip

subpackages:
  - name: mediainfolib-dev
    description: "Development headers for mediainfolib"
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: MediaArea/MediaInfoLib
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - build-base
        - libzen-dev
        - mediainfolib-dev
        - pkgconf
        - zlib-dev
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test MediaInfoLib API
      runs: |
        cat > test_mediainfo.cpp << 'EOF'
        #include <MediaInfo/MediaInfo.h>
        #include <string>
        #include <cassert>
        using namespace MediaInfoLib;
        int main() {
            MediaInfo mi;
            // Open with an empty string (no file) - should return 0
            size_t result = mi.Open(__T(""));
            // Get library version info
            String version = mi.Option(__T("Info_Version"));
            assert(!version.empty());
            mi.Close();
            return 0;
        }
        EOF
        g++ $(pkg-config --cflags libmediainfo) test_mediainfo.cpp -o test_mediainfo $(pkg-config --libs libmediainfo)
        ./test_mediainfo
