# Generated from https://git.alpinelinux.org/aports/plain/testing/mitmproxy/APKBUILD
package:
  name: mitmproxy
  version: "12.3.0"
  epoch: 1 # CVE-2026-111497
  description: Interactive TLS-capable intercepting HTTP proxy
  copyright:
    - license: MIT
  options:
    # Don't resolve libraries installed in virtual environment as providers
    no-provides: true
  resources:
    cpu: "2"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  openssl-version: "4.0"
  python-version: "3.13"
  venv-home: '/opt/chainguard/mitmproxy'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libffi-dev
      - openssl-${{vars.openssl-version}}-dev
      - python-${{vars.python-version}}-dev
      - uv
      - wolfi-base
  environment:
    CFLAGS: -DOPENSSL_NO_ENGINE

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ac4f4cf7eab63effeb4b53b6bc09b5143aa42ae4
      repository: https://github.com/mitmproxy/mitmproxy
      tag: v${{package.version}}

  - uses: auth/uv
    with:
      allow-fallback-indexes: true

  - runs: |
      # Create venv at final install path with explicit python version
      uv venv "${{vars.venv-home}}" --python python${{vars.python-version}}
      source "${{vars.venv-home}}/bin/activate"

      # Install mitmproxy and its dependencies into the venv
      uv pip install --no-compile .

      # Upgrade msgpack to patched version for GHSA-6v7p-g79w-8964
      # mitmproxy 12.2.3 constrains msgpack<=1.1.2 in its metadata, but the
      # fix requires >=1.2.1; install with --no-deps to bypass the resolver.
      uv pip install --no-compile --no-deps "msgpack==1.2.1"

      # Upgrade tornado to patched version for GHSA-pw6j-qg29-8w7f, CVE-2026-82397,
      # GHSA-c2m8-h5v5-343r, GHSA-chx6-46f5-w4vp, GHSA-3hv7-mjh2-fv65
      # mitmproxy 12.2.3 constrains tornado<=6.5.5 in its metadata, but the
      # fix requires >=6.5.9; install with --no-deps to bypass the resolver.
      uv pip install --no-compile --no-deps "tornado==6.5.9"

      # Upgrade cryptography to patched version for GHSA-8ppf-4f7h-5ppj, GHSA-g6cj-pr64-35w5
      # install with --no-deps to bypass the resolver.
      uv pip install --no-compile --no-deps "cryptography==50.0.0"

      # Upgrade h2 to patched version for GHSA-6hr6-w5qg-qmwg
      # mitmproxy 12.2.3 constrains h2>=4,<5 which includes 4.4.1, but
      # install with --no-deps to be consistent with other CVE upgrades.
      uv pip install --no-compile --no-deps "h2==4.4.1"

      # Upgrade Brotli to patched version for CVE-2026-111497
      # mitmproxy 12.3.0 constrains Brotli<=1.2.0 in its metadata, but the
      # fix requires 1.2.1; install with --no-deps to bypass the resolver.
      uv pip install --no-compile --no-deps "brotli==1.2.1"

      # Remove pip and virtualenv
      uv pip uninstall pip virtualenv

      # Remove uv lock file (world-writable, not needed at runtime)
      rm -f "${{vars.venv-home}}/.lock"

      # Install virtual environment to package
      mkdir -p "${{targets.destdir}}/opt/chainguard"
      cp -a "${{vars.venv-home}}" "${{targets.destdir}}/opt/chainguard/"

      # Symlink binaries to /usr/bin
      mkdir -p "${{targets.destdir}}/usr/bin"
      for bin in mitmdump mitmproxy mitmweb; do
        ln -sf "${{vars.venv-home}}/bin/$bin" "${{targets.destdir}}/usr/bin/$bin"
      done

  - uses: strip

update:
  enabled: true
  github:
    identifier: mitmproxy/mitmproxy
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: mitmdump mitmproxy mitmweb
    - name: Brotli bindings carry the CVE-2026-111497 fix
      runs: |
        ${{vars.venv-home}}/bin/python -c 'import sys, _brotli; d = open(_brotli.__file__, "rb").read(); sys.exit(0 if b"_ERROR_FORMAT_BLOCK_SWITCH" in d else "unfixed Brotli decoder: " + _brotli.__file__)'
