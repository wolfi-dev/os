package:
  name: mods
  version: "1.8.1"
  epoch: 17 # GO-2026-5970
  description: AI on the command line!
  copyright:
    - license: MIT

vars:
  go-version: "1.26"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-${{vars.go-version}}
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/charmbracelet/mods
      tag: v${{package.version}}
      expected-commit: 9b36cf882989cf6807ec82f8afbc56d418ba9264

  - uses: bump
    with:
      deps: |-
        golang.org/x/crypto@v0.52.0
        golang.org/x/net@v0.55.0
        github.com/ollama/ollama@v0.17.1
        github.com/charmbracelet/bubbletea@v1.3.10
        github.com/yuin/goldmark@v1.7.17
        golang.org/x/text@v0.39.0

  - uses: go/build/v2
    with:
      packages: .
      ldflags: |
        -X main.Version=${{package.version}}
        -X main.CommitSHA=$(git rev-parse HEAD)
        -X main.CommitDate=$(date -u -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")
      output: mods

update:
  enabled: true
  github:
    identifier: charmbracelet/mods
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        mods --version
        mods man --help
