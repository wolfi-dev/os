package:
  name: mongo-tools
  version: "100.19.1"
  epoch: 2 # CVE-2026-78659
  description: Tools for MongoDB
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - go-1.27
      - krb5-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mongodb/mongo-tools
      tag: ${{package.version}}
      expected-commit: 9348e032419d906e40966f477278cce647b9b1eb

  - uses: bump
    with:
      language: go
      deps: golang.org/x/net@v0.60.0

  - uses: patch
    with:
      patches: release-platform.patch

  - runs: |
      ./make build
      mkdir -p ${{targets.destdir}}/usr/bin
      mv bin/* ${{targets.destdir}}/usr/bin

update:
  enabled: true
  github:
    identifier: mongodb/mongo-tools
    strip-prefix: v
    use-tag: true
    tag-filter: "100"

test:
  pipeline:
    - uses: test/tw/ldd-check
    # AUTOGENERATED
    - runs: |
        bsondump --version
        mongodump --version
        mongoexport --version
        mongofiles --version
        mongoimport --version
        mongorestore --version
        mongostat --version
        mongotop --version
        bsondump --help
        mongodump --help
        mongoexport --help
        mongofiles --help
        mongoimport --help
        mongorestore --help
        mongostat --help
        mongotop --help
    - name: Test bsondump converts BSON to JSON
      runs: |
        set -euo pipefail

        # Create a minimal valid BSON document: {"hello": "world"}
        # BSON format: int32 size + type(0x02=string) + key + null + int32 strlen + value + null + doc null
        # Total size: 22 bytes (0x16)
        printf '\x16\x00\x00\x00\x02hello\x00\x06\x00\x00\x00world\x00\x00' > /tmp/test.bson

        # Run bsondump to convert BSON to JSON
        output=$(bsondump /tmp/test.bson 2>/tmp/bsondump_stderr.txt)

        # Verify the output contains the key and value from our BSON document
        echo "$output" | grep -F "hello"
        echo "$output" | grep -F "world"
