package:
  name: msmtp
  version: "1.8.34"
  epoch: 2 # Enable GnuTLS support
  description: msmtp is an SMTP client with a sendmail interface
  copyright:
    - attestation: |
        Copyright (C) 2018, 2019, 2020, 2021, 2022
        Martin Lambers <marlam@marlam.de>

          This program is free software; you can redistribute it and/or modify
          it under the terms of the GNU General Public License as published by
          the Free Software Foundation; either version 3 of the License, or
          (at your option) any later version.

          This program is distributed in the hope that it will be useful,
          but WITHOUT ANY WARRANTY; without even the implied warranty of
          MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
          GNU General Public License for more details.

          You should have received a copy of the GNU General Public License
          along with this program.  If not, see <http://www.gnu.org/licenses/>.
      license: GPL-3.0-or-later
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - gettext-dev
      - glibc-2.44
      - glibc-2.44-dev
      - glibc-locale-en # upstream-tests/make-check: test-header-handling.sh
      - gnutls-dev
      - pkgconf-dev
      - texinfo

pipeline:
  - uses: git-checkout
    with:
      # git.marlam.de serves 403 to the build farm. The author's GitHub mirror
      # carries the same tags and commits, and expected-commit pins the source.
      repository: https://github.com/marlam/msmtp
      tag: msmtp-${{package.version}}
      expected-commit: 755df9f0d3acae5fbf981642587be3d0fa631eac

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: upstream-tests/make-check

  - uses: strip

  - runs: |
      mkdir -p ${{targets.destdir}}/etc/conf.d
      echo '# defaut config' > ${{targets.destdir}}/etc/conf.d/msmtp.confd
      echo '#MSMTP_INTERFACE="127.0.0.1"' >> ${{targets.destdir}}/etc/conf.d/msmtp.confd
      echo '#MSMTP_PORT="25"' >> ${{targets.destdir}}/etc/conf.d/msmtp.confd
      echo '#MSMTP_COMMAND="/usr/bin/msmtp -f %F"' >> ${{targets.destdir}}/etc/conf.d/msmtp.confd

subpackages:
  - name: msmtp-doc
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
    description: msmtp documentation
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  git:
    tag-filter-prefix: msmtp-
    strip-prefix: msmtp-

test:
  environment:
    contents:
      packages:
        - mkcert
        - socat
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: |
          msmtp
          msmtpd
    - uses: test/tw/ver-check
      with:
        bins: |
          msmtp
          msmtpd
    - runs: |
        msmtp --version | grep -F 'TLS/SSL library: GnuTLS'
    - uses: test/tw/ldd-check
    - name: Verify TLS delivery and reject invalid server certificates
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p tls
          for ca in trusted untrusted; do
            mkdir -p "tls/$ca"
            CAROOT="$PWD/tls/$ca" mkcert \
              -cert-file "tls/$ca.crt" -key-file "tls/$ca.key" localhost 127.0.0.1
          done

          # Like the upstream mail tests, capture messages delivered by msmtpd.
          cat > tls/smtp-server.sh <<'EOF'
          #!/bin/sh
          exec msmtpd --inetd --command="cat > tls/delivered.eml; printf '%s\n' > tls/recipients"
          EOF
          chmod +x tls/smtp-server.sh
          cat > tls/message.eml <<'EOF'
          Subject: TLS delivery test

          Message delivered over verified TLS.
          EOF
        # msmtpd speaks SMTP; socat supplies the implicit TLS listener.
        start: /usr/bin/socat -d -d OPENSSL-LISTEN:1465,bind=127.0.0.1,reuseaddr,fork,cert=tls/trusted.crt,key=tls/trusted.key,verify=0 EXEC:./tls/smtp-server.sh
        expected_output: listening on
        error_strings: Address already in use
        post: |
          wait-for-it 127.0.0.1:1465 -t 10
          export LC_ALL=C
          msmtp_tls() {
            msmtp --host=127.0.0.1 --port=1465 --timeout=10 \
              --tls=on --tls-starttls=off --tls-certcheck=on "$@"
          }

          msmtp_tls --tls-trust-file=tls/trusted/rootCA.pem --auth=off \
            --from=sender@example.com recipient@example.com < tls/message.eml
          grep -F 'Message delivered over verified TLS.' tls/delivered.eml
          grep -Fx 'recipient@example.com' tls/recipients

          if msmtp_tls --tls-trust-file=tls/untrusted/rootCA.pem --serverinfo > tls/untrusted.log 2>&1; then
            echo 'ERROR: accepted a certificate from an untrusted issuer'
            exit 1
          fi
          grep -F 'TLS certificate verification failed' tls/untrusted.log

          if msmtp_tls --tls-trust-file=tls/trusted/rootCA.pem --tls-host-override=wrong.invalid \
            --serverinfo > tls/hostname.log 2>&1; then
            echo 'ERROR: accepted a certificate for the wrong hostname'
            exit 1
          fi
          grep -F 'TLS certificate verification failed' tls/hostname.log
    - uses: test/no-docs
