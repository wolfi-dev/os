package:
  name: mtools
  version: "4.0.49"
  epoch: 5 # add functional tests and ldd-check
  description: collection of utilities to access MS-DOS disks from Unix without mounting them
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - merged-sbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 6Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - gawk
      - util-linux-dev

pipeline:
  - uses: fetch
    with:
      uri: https://ftp.gnu.org/gnu/mtools/mtools-${{package.version}}.tar.gz
      expected-sha256: 10cd1111da87bf2400a380c1639a6cba8bfb937a24f9c51f5f88d393ae5f6f76

  - uses: autoconf/configure
    with:
      opts: |
        --host=${{host.triplet.gnu}} \
        --build=${{host.triplet.gnu}} \
        --mandir=/usr/share/man \
        --enable-elf-shlibs \
        --enable-lto \
        --enable-symlink-install \
        --infodir=/usr/share/info \
        --prefix='/usr' \
        --with-root-prefix='' \
        --sbindir="/usr/bin" \
        --without-x

  - uses: autoconf/make

  - runs: |
      make -j1 MKDIR_P="install -d"  DESTDIR=${{targets.destdir}} install

  - uses: strip

subpackages:
  - name: "mtools-doc"
    description: "mtools documentation"
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 2028

test:
  environment:
    contents:
      packages:
        - glibc-iconv
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        mtools --version
    - name: Create and use a FAT disk image
      runs: |
        # Create a blank disk image (1.44MB floppy)
        dd if=/dev/zero of=/tmp/test.img bs=512 count=2880
        # Format it as FAT12
        mformat -i /tmp/test.img -f 1440 ::
        # Create a test file and copy it into the image
        echo "hello mtools" > /tmp/hello.txt
        mcopy -i /tmp/test.img /tmp/hello.txt ::hello.txt
        # List directory contents and verify the file is there
        mdir -i /tmp/test.img :: | grep -i "HELLO"
        # Read the file back and verify its content
        mtype -i /tmp/test.img ::hello.txt | grep "hello mtools"
    - name: Test minfo on disk image
      runs: |
        dd if=/dev/zero of=/tmp/info.img bs=512 count=2880
        mformat -i /tmp/info.img -f 1440 ::
        minfo -i /tmp/info.img :: | grep -i "sectors"
    - uses: test/no-docs
