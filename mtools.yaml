package:
  name: mtools
  version: "4.0.50"
  epoch: 2 # runtime-depend on glibc-iconv-common (F-217)
  description: collection of utilities to access MS-DOS disks from Unix without mounting them
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - glibc-iconv-common # calls iconv_open for non-UTF-8 charsets; glibc builds in only UTF-8/UCS/ASCII
      - merged-sbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 6Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - gawk
      - glibc-2.44-dev
      - util-linux-dev

pipeline:
  - uses: fetch
    with:
      uri: https://ftp.gnu.org/gnu/mtools/mtools-${{package.version}}.tar.gz
      expected-sha256: 7f078accae7551c6b3a316ccd8296357329f7bbbc09583dcd1a2bbaeb081a7a4

  # mtools' configure knows no --enable-lto (nor --enable-elf-shlibs,
  # --enable-symlink-install or --with-root-prefix: they come from e2fsprogs'
  # recipe and were silently ignored), so LTO goes in through the flags.
  - uses: autoconf/configure
    with:
      opts: |
        --host=${{host.triplet.gnu}} \
        --build=${{host.triplet.gnu}} \
        --mandir=/usr/share/man \
        --infodir=/usr/share/info \
        --prefix='/usr' \
        --sbindir="/usr/bin" \
        --without-x \
        CFLAGS="$CFLAGS -flto=auto" \
        LDFLAGS="$LDFLAGS -flto=auto"

  - uses: autoconf/make

  - runs: |
      make -j1 MKDIR_P="install -d"  DESTDIR=${{targets.destdir}} install

  - uses: strip

subpackages:
  - name: "mtools-doc"
    description: "mtools documentation"
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 2028

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        mtools --version
    - name: Create and use a FAT disk image
      runs: |
        # Create a blank disk image (1.44MB floppy)
        dd if=/dev/zero of=/tmp/test.img bs=512 count=2880
        # Format it as FAT12
        mformat -i /tmp/test.img -f 1440 ::
        # Create a test file and copy it into the image
        echo "hello mtools" > /tmp/hello.txt
        mcopy -i /tmp/test.img /tmp/hello.txt ::hello.txt
        # List directory contents and verify the file is there
        mdir -i /tmp/test.img :: | grep -i "HELLO"
        # Read the file back and verify its content
        mtype -i /tmp/test.img ::hello.txt | grep "hello mtools"
    - name: Test minfo on disk image
      runs: |
        dd if=/dev/zero of=/tmp/info.img bs=512 count=2880
        mformat -i /tmp/info.img -f 1440 ::
        minfo -i /tmp/info.img :: | grep -i "sectors"
    - uses: test/no-docs
    - name: "Default codepage 850 works (glibc-iconv-common)"
      runs: |
        # Without glibc-iconv-common this conversion fails (glibc builds in only UTF-8, UCS-2/4 and ASCII).
        [ ! -e /usr/lib/gconv/gconv-modules.d/gconv-modules-extra.conf ] || { echo "FAIL: full glibc-iconv is in the test environment, so this test cannot catch a missing glibc-iconv-common dependency"; exit 1; }
        # The test tooling (help-check pulls man-db and groff) brings glibc-iconv-common into most test environments, so also check the dependency itself.
        apk info -R mtools | grep -qx glibc-iconv-common || { echo "FAIL: mtools does not runtime-depend on glibc-iconv-common"; exit 1; }
        rm -f /tmp/f.img
        printf 'drive x: file="/tmp/f.img"\nmtools_skip_check=1\n' > /tmp/mt.rc
        export MTOOLSRC=/tmp/mt.rc LC_ALL=C.UTF-8
        mformat -C -f 1440 x:
        echo hi > /tmp/a.txt
        mcopy /tmp/a.txt x:
        mdir -b x: | grep -q 'X:/a.txt' || { echo "FAIL: file not on the image"; exit 1; }
