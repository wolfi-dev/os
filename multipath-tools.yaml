package:
  name: multipath-tools
  version: "0.15.1"
  epoch: 1 # read config and state from /etc, not /usr/etc
  description: Device Mapper Multipathing Driver
  copyright:
    - license: LGPL-2.0-only
  dependencies:
    runtime:
      - merged-lib
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - device-mapper
      - glibc-2.44-dev
      - json-c-dev
      - libaio-dev
      - lvm2-dev
      - ncurses-dev
      - perl
      - readline-dev
      - systemd-dev
      - userspace-rcu-dev
      - util-linux-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/opensvc/multipath-tools
      expected-commit: d53932bdbee02f440518ea384e63d7c4d3f66685
      tag: ${{package.version}}

  - uses: autoconf/make
    with:
      opts: prefix=/usr bindir=/usr/bin LIB=/lib etc_prefix= # LIB is actually prefix/LIB, empty etc_prefix gives /etc

  - uses: autoconf/make-install
    with:
      opts: prefix=/usr bindir=/usr/bin LIB=/lib etc_prefix= # LIB is actually prefix/LIB, empty etc_prefix gives /etc

  - uses: strip

subpackages:
  - name: multipath-tools-doc
    pipeline:
      - uses: split/manpages
    description: multipath-tools manpages
    test:
      pipeline:
        - uses: test/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - merged-lib
        - wolfi-baselayout

update:
  enabled: true
  github:
    identifier: opensvc/multipath-tools
    use-tag: true

test:
  pipeline:
    - runs: |
        # very basic tests to ensure it built and installed
        # note that functional tests would take much more complexity
        multipath -h
        mpathpersist -h
        [ -x /usr/bin/kpartx ]
    - name: Config in /etc/multipath.conf is used
      runs: |
        # multipath -t parses the config file and dumps the resulting
        # configuration. It does not need device-mapper or any devices.

        # Without a config file, find_multipaths has its built-in default.
        multipath -t > default.out
        grep -Ex '[[:space:]]*find_multipaths "strict"' default.out

        # The same setting from /etc/multipath.conf must win.
        cat > /etc/multipath.conf <<'EOF'
        defaults {
          find_multipaths "on"
        }
        EOF
        multipath -t > etc.out
        grep -Ex '[[:space:]]*find_multipaths "on"' etc.out
    - uses: test/pkgconf
    - uses: test/tw/ldd-check
