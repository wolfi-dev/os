package:
  name: mycli
  version: "2.13.1"
  epoch: 0 # GHSA-537c-gmf6-5ccf
  description: "A Terminal Client for MySQL with AutoCompletion and Syntax Highlighting"
  copyright:
    - license: BSD-3-Clause
  options:
    # Don't resolve libraries installed in virtual environment as providers
    no-provides: true
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  python-version: '3.13'
  venv-home: '/opt/chainguard/mycli'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - libffi-dev
      - openssl-dev
      - python-${{vars.python-version}}-dev
      - uv
      - wolfi-base
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dbcli/mycli.git
      tag: v${{package.version}}
      expected-commit: cd0aab2489d312967f74f213ed69582aeff79488

  - runs: |
      # CVE remediation
      sed -i 's/"Pygments ~= 2.19.2",/"Pygments ~= 2.20.0",/' pyproject.toml

  - uses: auth/uv
    with:
      allow-fallback-indexes: true

  - runs: |
      # mycli 2.7.0 requires sqlglotc>=30.12.0,<30.13.dev0 but the build
      # system's exclude-newer filter may block sqlglotc 30.12.0 (uploaded
      # after the package release cutoff). Override the cutoff for sqlglot
      # and sqlglotc by adding them to the exclude-newer-package entry.
      if grep -q 'exclude-newer-package' pyproject.toml; then
        sed -i 's/exclude-newer-package = {/exclude-newer-package = { sqlglot = false, sqlglotc = false, jaraco-functools = false, click = false,/' pyproject.toml
      else
        printf '\n[tool.uv]\nexclude-newer-package = { sqlglot = false, sqlglotc = false, jaraco-functools = false, click = false }\n' >> pyproject.toml
      fi

  - runs: |
      # Create venv at final install path with explicit python version
      uv venv "${{vars.venv-home}}" --python python${{vars.python-version}}
      source "${{vars.venv-home}}/bin/activate"

      # Install mycli and its dependencies into the venv
      uv pip install --no-compile .

      # GHSA-537c-gmf6-5ccf: transitive cryptography resolves to 46.0.7; force the fixed wheel
      uv pip install --no-compile --upgrade "cryptography>=48.0.1"

      # jaraco-functools (transitive dep via keyring) resolved to 4.5.0 in
      # the 2.7.0 build vs 4.6.0 in the 2.6.1 baseline; pin to avoid regression
      uv pip install --no-compile --upgrade "jaraco-functools>=4.6.0"

      # click resolved to 8.3.3 in the 2.12.0 build vs 8.4.2 in the 2.11.0
      # baseline due to exclude-newer cutoff; pin to avoid regression
      uv pip install --no-compile --upgrade "click>=8.4.2"

      # Remove pip and virtualenv
      uv pip uninstall pip virtualenv

      # Fix uv lock file permissions (created world-writable by uv)
      chmod 644 "${{vars.venv-home}}/.lock"

      # Install virtual environment to package
      mkdir -p "${{targets.destdir}}/opt/chainguard"
      cp -a "${{vars.venv-home}}" "${{targets.destdir}}/opt/chainguard/"

      # Symlink mycli to /usr/bin
      mkdir -p "${{targets.destdir}}/usr/bin"
      ln -sf "${{vars.venv-home}}/bin/mycli" "${{targets.destdir}}/usr/bin/mycli"

  - uses: strip

update:
  enabled: true
  github:
    identifier: dbcli/mycli
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: mycli
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: mycli
    - name: Test mycli functionality
      runs: |
        "${{vars.venv-home}}/bin/python" <<'EOF'
        from mycli import __version__
        from unittest.mock import Mock, patch, PropertyMock
        import pymysql

        # Test core mycli functionality
        from mycli.packages.special import iocommands
        assert hasattr(iocommands, 'write_tee')
        print("Core functionality test passed")

        # Test connection and query functionality
        from mycli.sqlexecute import SQLExecute
        with patch('pymysql.connect') as mock_connect:
            mock_conn = Mock()
            mock_cursor = Mock()

            type(mock_conn).server_version = PropertyMock(return_value='5.7.0-MySQL')
            mock_conn.get_server_info.return_value = '5.7.0-MySQL'
            mock_connect.return_value = mock_conn
            mock_conn.cursor.return_value = mock_cursor

            mock_cursor.fetchall.return_value = [("mycli",)]
            mock_cursor.description = [("Database",)]

            sql = SQLExecute(
                database='test',
                user='test',
                password='test',
                host='localhost',
                port=3306,
                socket=None,
                character_set='utf8mb4',
                local_infile=False,
                ssl=None,
            )
            print("Connection test passed")

            result = sql.run("SHOW DATABASES")
            assert result is not None
            print("Query test passed")

        print("All tests passed")
        EOF
