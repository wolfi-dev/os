package:
  name: nerdctl
  version: "2.3.5"
  epoch: 10 # toolchain rebuild for  go-1.27-1.27.1
  description: Docker-compatible CLI for containerd, with support for Compose, Rootless, eStargz, OCIcrypt, IPFS, ...
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 6Gi
  test-resources:
    memory: 1Gi
    cpu: "1"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/containerd/nerdctl
      tag: v${{package.version}}
      expected-commit: 347782c28efe1753d5cc9652f6304752ed431221

  - uses: bump
    with:
      deps: |-
        google.golang.org/grpc@v1.82.1
        golang.org/x/text@v0.39.0
        github.com/klauspost/compress@v1.18.7
        golang.org/x/mod@v0.40.0
        github.com/cilium/ebpf@v0.22.0
        golang.org/x/crypto@v0.55.0
        golang.org/x/net@v0.57.0
        golang.org/x/sys@v0.47.0
        golang.org/x/term@v0.45.0
      modroot: |-
        .
        mod/tigron

  - runs: |
      make
      install -Dm755 ./_output/nerdctl ${{targets.destdir}}/usr/bin/nerdctl

  - uses: strip

update:
  enabled: true
  github:
    identifier: containerd/nerdctl
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - containerd
        - iptables-nft
        - curl
        - coreutils
  pipeline:
    - name: "Start containerd and verify nerdctl"
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /etc/containerd
          cat > /etc/containerd/config.toml << EOF
          version = 2
          [plugins."io.containerd.grpc.v1.cri"]
            snapshotter = ""
          EOF
        start: containerd
        timeout: 30
        expected_output: |
          containerd successfully booted
        post: |
          nerdctl info
          # don't unpack, we're using a fake containerd
          nerdctl pull --unpack=false cgr.dev/chainguard/wolfi-base:latest
