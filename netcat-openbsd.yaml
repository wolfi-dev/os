package:
  name: netcat-openbsd
  version: "1.238"
  epoch: 0 # go/wolfi-rsc/netcat-openbsd
  description: The TCP/IP swiss army knife. OpenBSD variant from debian.
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  # Debian revision of the packaging tarball. This is independent of
  # package.version and must be checked against the Debian pool on every
  # version bump -- Debian only keeps versions referenced by a live suite,
  # so a stale pairing 404s.
  debian-revision: "1"

environment:
  contents:
    packages:
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.43-dev
      - libbsd-dev
      - libmd-dev
      - patch

pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/n/netcat-openbsd/netcat-openbsd_${{package.version}}.orig.tar.gz
      expected-sha512: 8413d303acea411f09af94078a80b655722c82294dfe4bd346793e4bf333f3b6b0fcde8f90f455cb759875d5ee9819877b73138d488a7a9fde820c0198d46d4b

  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/n/netcat-openbsd/netcat-openbsd_${{package.version}}-${{vars.debian-revision}}.debian.tar.xz
      expected-sha512: f5623d7138cd84a18759c81d4cfeda3f8986a92196951abd986c27f66ff421995eb48d11e0338d021c10fbbd21e74df57362d3a9b0d82da31df3277959662850
      extract: false
      delete: false

  - runs: |
      mkdir -p debian
      tar -x '--strip-components=1' -f "netcat-openbsd_${{package.version}}-${{vars.debian-revision}}.debian.tar.xz" -C debian
      while read -r patch; do
        patch -Np1 < ./debian/patches/"$patch"
      done < ./debian/patches/series

      # linux port requires b64_ntop. include in in SRCS (Makefile)
      # we also want this to link with libmd as well because it uses sha512update...
      sed -i Makefile -e "/SRCS=/s;\(.*\);& base64.c;"
      sed -i Makefile -e "s/\libbsd\b/& libmd/"

  - runs: |
      make CFLAGS="$CFLAGS -DDEBIAN_VERSION=\"\\\"${{package.version}}\\\"\""

  - runs: |
      install -Dm755 nc "${{targets.destdir}}"/usr/bin/nc
      install -Dm644 nc.1 "${{targets.destdir}}"/usr/share/man/man1/nc.openbsd.1

  - uses: strip

subpackages:
  - name: netcat-openbsd-doc
    description: netcat-openbsd docs
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 21534

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Basic command verification
      runs: |
        test -f /usr/bin/nc
        test -x /usr/bin/nc
        nc -h
    - name: Basic functionality tests
      runs: |
        # Create test directory
        mkdir -p /tmp/nc-test

        # Start listener and capture its PID
        timeout 5 nc -l 12345 > /tmp/nc-test/received.txt 2>&1 &
        LISTENER_PID=$!
        sleep 1

        # Send data to the listener and check result
        echo "test" | nc -N localhost 12345
        SEND_STATUS=$?
        if [ $SEND_STATUS -ne 0 ]; then
            echo "Failed to send data: $SEND_STATUS"
            exit 1
        fi

        # Check listener received the data
        wait $LISTENER_PID
        if ! grep -q "test" /tmp/nc-test/received.txt; then
            echo "Data not received correctly"
            exit 1
        fi

        # Test UDP mode
        timeout 5 nc -u -l 12346 > /tmp/nc-test/udp_received.txt 2>&1 &
        UDP_LISTENER_PID=$!
        sleep 1

        echo "udp test" | nc -u localhost 12346
        UDP_SEND_STATUS=$?
        if [ $UDP_SEND_STATUS -ne 0 ]; then
            echo "Failed to send UDP data: $UDP_SEND_STATUS"
            exit 1
        fi
