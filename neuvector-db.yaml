#nolint:valid-pipeline-git-checkout-tag
package:
  name: neuvector-db
  version: "0.0.0_git20261124"
  epoch: 0
  description: NeuVector vulnerability database for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - crane

pipeline:
  - uses: git-checkout
    with:
      # Unused, here to just have an auto-bumped reference. Upstream commits
      # "chore: bump VULNDB_VERSION" to main with every CVE database release.
      repository: https://github.com/neuvector/scanner
      branch: main
      expected-commit: d74ee5ebef59982d46e2f389b23c79243c95656a
      destination: unused

  - runs: |
      # The database itself is only published in the upstream scanner image.
      # Every published release has a "<VULNDB_VERSION>-b" tag on Docker Hub
      # (plain version tags are sometimes missing), and it lands about an hour
      # after the VULNDB_VERSION commit on main. Pin to that tag so the DB
      # matches the package version and rebuilds are reproducible. If the tag
      # is not published yet (or never is), fail so the bump is retried
      # instead of shipping a stale DB under a new version.
      upstream_vulndb=$(sed -n 's/^ARG VULNDB_VERSION=//p' unused/package/Dockerfile)
      rm -r unused
      if [ -z "$upstream_vulndb" ]; then
        echo "ERROR: could not read VULNDB_VERSION from upstream package/Dockerfile"
        exit 1
      fi

      crane export neuvector/scanner:${upstream_vulndb}-b scanner.tar
      mkdir -p scanner
      tar xf scanner.tar -C scanner

      # The cvedb file starts with a JSON header: {"Version":"4.327","UpdateTime":...
      # The image labels are not reliable (4.318-b carries DB 4.319), so check
      # the header itself.
      db_version=$(head -c 200 scanner/etc/neuvector/db/cvedb | grep -ao '"Version":"[^"]*"' | cut -d'"' -f4 || true)
      if [ "$db_version" != "$upstream_vulndb" ]; then
        echo "ERROR: neuvector/scanner:${upstream_vulndb}-b carries CVE database '${db_version}', upstream main expects ${upstream_vulndb}"
        exit 1
      fi
      echo "CVE database version ${db_version}"

      mkdir -p ${{targets.contextdir}}/etc/neuvector/db
      cp scanner/etc/neuvector/db/cvedb ${{targets.contextdir}}/etc/neuvector/db/cvedb

test:
  pipeline:
    - name: CVE database has a valid version header
      runs: |
        test -s /etc/neuvector/db/cvedb
        # The cvedb file starts with a JSON header: {"Version":"4.327","UpdateTime":...
        db_version=$(head -c 200 /etc/neuvector/db/cvedb | grep -ao '"Version":"[^"]*"' | cut -d'"' -f4 || true)
        if [ -z "$db_version" ]; then
          echo "CVE database version not found in cvedb header"
          exit 1
        fi
        echo "CVE database version ${db_version}"

update:
  enabled: true
  git: {}
  schedule:
    period: daily
    reason: Upstream publishes a new CVE database with each scanner release, refresh it on every upstream main commit
