package:
  name: neuvector-sigstore-interface
  version: "4.326"
  epoch: 1 # CVE-2026-128085
  description: NeuVector sigstore interface for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neuvector/scanner
      tag: v${{package.version}}
      expected-commit: 843254d6f48b7221cb13c831c0a06d74e9befdef

  - uses: bump
    with:
      deps: |-
        github.com/sigstore/rekor@v1.5.5
        github.com/sigstore/sigstore@v1.11.1
        go.opentelemetry.io/otel/trace@v1.47.0
        go.opentelemetry.io/otel/metric@v1.47.0
        go.opentelemetry.io/otel@v1.47.0
      language: go

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/sigstore-interface
      output: sigstore-interface
      prefix: usr/local
      vendor: true
      go-package: go-1.27

  - uses: strip

test:
  pipeline:
    - runs: |
        sigstore-interface --help

update:
  enabled: true
  github:
    identifier: neuvector/scanner
    strip-prefix: v
    use-tag: true
