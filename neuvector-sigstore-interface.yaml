package:
  name: neuvector-sigstore-interface
  version: "4.274"
  epoch: 1 # CVE-2026-84445
  description: NeuVector sigstore interface for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neuvector/scanner
      tag: v${{package.version}}
      expected-commit: 0f2e3c4a5b5b66340774862f552e0e8575c158a5

  - uses: bump
    with:
      deps: google.golang.org/grpc@v1.83.2

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/sigstore-interface
      output: sigstore-interface
      prefix: usr/local
      vendor: true
      go-package: go-1.27

  - uses: strip

test:
  pipeline:
    - runs: |
        sigstore-interface --help

update:
  enabled: true
  github:
    identifier: neuvector/scanner
    strip-prefix: v
    use-tag: true
