package:
  name: neuvector-sigstore-interface
  version: "4.268"
  epoch: 0
  description: NeuVector sigstore interface for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neuvector/scanner
      tag: v${{package.version}}
      expected-commit: 008dfa495ce5a3b932e1797db9db4d3e083cf061

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/sigstore-interface
      output: sigstore-interface
      prefix: usr/local
      vendor: true
      go-package: go-1.27

  - uses: strip

test:
  pipeline:
    - runs: |
        sigstore-interface --help

update:
  enabled: true
  github:
    identifier: neuvector/scanner
    strip-prefix: v
    use-tag: true
