package:
  name: neuvector-sigstore-interface
  version: "4.301"
  epoch: 1 # CVE-2026-78659
  description: NeuVector sigstore interface for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neuvector/scanner
      tag: v${{package.version}}
      expected-commit: 7d5283c9f9636da58f4ef1d254f385644e03acc1

  - uses: bump
    with:
      deps: |-
        chainguard.dev/apko@v1.4.5
        github.com/google/go-containerregistry@v0.22.1
        github.com/stretchr/testify@v1.12.1
        golang.org/x/net@v0.60.0

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/sigstore-interface
      output: sigstore-interface
      prefix: usr/local
      vendor: true
      go-package: go-1.27

  - uses: strip

test:
  pipeline:
    - runs: |
        sigstore-interface --help

update:
  enabled: true
  github:
    identifier: neuvector/scanner
    strip-prefix: v
    use-tag: true
