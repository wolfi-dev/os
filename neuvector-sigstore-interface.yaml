package:
  name: neuvector-sigstore-interface
  version: "4.314"
  epoch: 0 # CVE-2026-114437
  description: NeuVector sigstore interface for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neuvector/scanner
      tag: v${{package.version}}
      expected-commit: 67eb5ff0bde8aadd56658d3a94ba1e4c15b17993

  - uses: bump
    with:
      deps: |-
        chainguard.dev/apko@v1.4.5
        github.com/google/go-containerregistry@v0.22.1
        github.com/stretchr/testify@v1.12.1
        golang.org/x/net@v0.60.0
        github.com/sigstore/rekor@v1.5.5
        github.com/sigstore/sigstore@v1.11.1
        google.golang.org/grpc@v1.84.0
      language: go

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/sigstore-interface
      output: sigstore-interface
      prefix: usr/local
      vendor: true
      go-package: go-1.27

  - uses: strip

test:
  pipeline:
    - runs: |
        sigstore-interface --help

update:
  enabled: true
  github:
    identifier: neuvector/scanner
    strip-prefix: v
    use-tag: true
