package:
  name: nfs-ganesha
  version: "15.12"
  epoch: 0 # shared library naming: split soname-versioned libs
  description: NFS-Ganesha is an NFSv3,v4,v4.1 fileserver that runs in user mode on most UNIX/Linux systems
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - libganesha-nfsd${{vars.soversion}}=${{package.full-version}}
      - libntirpc${{vars.ntirpc-soversion}}=${{package.full-version}}
      - libntirpcmonitoring${{vars.ntirpc-soversion}}=${{package.full-version}}

vars:
  openssl-version: "4.0"
  soversion: "15.12"
  # bundled libntirpc is versioned independently (SONAME libntirpc.so.15.11)
  ntirpc-soversion: "15.11"

environment:
  contents:
    packages:
      - acl-dev
      - autoconf
      - automake
      - bind-tools
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - ceph-dev
      - dbus-dev
      - flex
      - gcc-12-default
      - glibc-2.44-dev
      - jemalloc-dev
      - krb5-dev
      - libnsl
      - libnsl-dev
      - libtirpc
      - libtirpc-dev
      - openssl-${{vars.openssl-version}}-dev
      - userspace-rcu-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f7a6811d936f776261bce0fd08570e214fe0b061
      repository: https://github.com/nfs-ganesha/nfs-ganesha
      tag: V${{package.version}}
      recurse-submodules: true

  - working-directory: src
    pipeline:
      - uses: cmake/configure
        with:
          opts: >
            -DLIB_INSTALL_DIR="/usr/lib"

      - uses: cmake/build
      - uses: cmake/install
      - uses: strip

subpackages:
  - name: libganesha-nfsd${{vars.soversion}}
    description: "libganesha_nfsd shared library"
    pipeline:
      - uses: split/lib
        with:
          patterns: ganesha_nfsd
    test:
      environment:
        contents:
          packages:
            # libganesha_nfsd links libganesha_monitoring.so, which stays in the main package
            - nfs-ganesha
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: libntirpc${{vars.ntirpc-soversion}}
    description: "libntirpc shared library"
    pipeline:
      - uses: split/lib
        with:
          patterns: ntirpc
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: libntirpcmonitoring${{vars.ntirpc-soversion}}
    description: "libntirpcmonitoring shared library"
    pipeline:
      - uses: split/lib
        with:
          patterns: ntirpcmonitoring
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: nfs-ganesha-dev
    dependencies:
      runtime:
        - libganesha-nfsd${{vars.soversion}}=${{package.full-version}}
        - libntirpc${{vars.ntirpc-soversion}}=${{package.full-version}}
        - libntirpcmonitoring${{vars.ntirpc-soversion}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            # libganesha_nfsd links libganesha_monitoring.so, which stays in the main package
            - nfs-ganesha
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: nfs-ganesha/nfs-ganesha
    strip-prefix: V
    tag-filter-prefix: V

test:
  environment:
    contents:
      packages:
        - iproute2
        - rpcbind
        - wait-for-it
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/daemon-check-output
      with:
        setup: |
          ulimit -n 65536
          mkdir -p /var/run/ganesha
          mkdir -p /var/lib/nfs/ganesha
          rpcbind
          cat > /tmp/test.conf << 'EOF'
          NFS_CORE_PARAM {
              Allow_Set_IO_Flusher_Fail = true;
              NFS_Protocols = 4;
              Disable_UDP_Listener = true;
              Enable_RQUOTA = false;
          }

          # STDERR is already the default log facility. Redeclaring it in a
          # facility block makes 15.12's create_log_facility() free() the
          # stderr FILE* ("already exists" path), which crashes randomly.
          LOG {
              default_log_level = EVENT;
          }
          EOF
        start: /usr/sbin/ganesha.nfsd -F -f /tmp/test.conf
        timeout: 30
        expected_output: "."
        post: |
          wait-for-it localhost:2049 -t 30
        error_strings: ""
