package:
  name: nfs-utils
  version: "2.9.2"
  epoch: 2 # split client/server subpackages
  description: kernel-mode NFS
  copyright:
    - license: GPL-2.0-only
  checks:
    disabled:
      - setuidgid
  dependencies:
    runtime:
      - busybox
      - merged-sbin
      - merged-usrsbin
      # nfs-utils keeps no binaries or libraries of its own; it is a
      # metapackage over the client and server halves, so every existing
      # consumer of "nfs-utils" keeps the same file closure at the same paths.
      - nfs-utils-client
      - nfs-utils-server
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - keyutils-dev
      - libcap-dev
      - libevent-dev
      - libnl3-dev
      - libseccomp-dev
      - libtirpc-dev
      - libxml2-dev
      - lvm2-dev
      - ncurses-dev
      - openldap-dev
      - pkgconf-dev
      - readline-dev
      - sqlite-dev
      - util-linux-dev

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: "-"
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: git://git.linux-nfs.org/projects/steved/nfs-utils.git
      tag: nfs-utils-${{vars.mangled-package-version}}
      expected-commit: 81e08ab1c5d4c895e72803281de05f4ba853b6e2

  - uses: autoconf/configure
    with:
      opts: |
        --sbindir=/usr/bin \
        --without-tcp-wrappers \
        --with-rpcgen=internal \
        --enable-ipv6 \
        --enable-nfsv4 \
        --enable-uuid \
        --enable-gss \
        --enable-svcgss \
        --enable-libmount-mount

  - uses: autoconf/make

  - uses: autoconf/make-install
    with:
      opts: sbindir=/usr/bin

  - uses: strip

subpackages:
  - name: ${{package.name}}-static
    description: "${{package.name}} static library"
    pipeline:
      - uses: split/static
    dependencies:
      runtime:
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    test:
      pipeline:
        - uses: test/tw/staticpackage

  - name: ${{package.name}}-dev
    description: "headers for ${{package.name}}"
    dependencies:
      runtime:
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: nfs-utils-dev

  - name: ${{package.name}}-doc
    description: "${{package.name}} manpages"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs
    dependencies:
      runtime:
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout

  - name: ${{package.name}}-dbg
    description: "${{package.name}} debug symbols"
    pipeline:
      - uses: split/debug
    dependencies:
      runtime:
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    test:
      pipeline:
        - uses: test/tw/debugpackage

  - name: ${{package.name}}-stats
    description: "NFS I/O statistics tools (mountstats and nfsiostat)"
    # mountstats and nfsiostat are Python scripts; split them out so the main
    # nfs-utils package has no python dep and can coexist with images that pin
    # a specific Python version (e.g. cephcsi with python-3.12 via ceph).
    dependencies:
      runtime:
        - merged-sbin
        - merged-usrsbin
        - python3
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/mountstats "${{targets.contextdir}}"/usr/bin/
          mv "${{targets.destdir}}"/usr/bin/nfsiostat "${{targets.contextdir}}"/usr/bin/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: |
              mountstats
              nfsiostat

  - name: rpcgen
    description: Remote Procedure Call (RPC) protocol compiler
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/rpcgen "${{targets.contextdir}}"/usr/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: rpcgen
        - uses: test/tw/help-check
          with:
            bins: rpcgen
    dependencies:
      runtime:
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout

  # Client/server split. The boundary is the one the openSUSE-based upstream
  # longhorn images draw, checked with crane export: longhornio/longhorn-manager,
  # longhorn-instance-manager and backing-image-manager all carry the same 17 NFS
  # binaries, and longhorn-share-manager, the component that exports shares, adds
  # exactly seven (exportfs, fsidd, nfsdclddb, nfsdclnts, nfsref, rpc.mountd,
  # rpc.nfsd). nfsdctl is new in nfs-utils 2.9.x, has no upstream counterpart and
  # controls nfsd, so it joins those seven.
  #
  # Two of the client binaries run on an NFS server by their own man pages:
  # nfsdcld tracks NFSv4 clients for nfsd, and rpc.svcgssd is the server-side
  # rpcsec_gss daemon. Both openSUSE's nfs-client and Debian's nfs-common ship
  # them, and the client-only longhorn images carry them, so moving them here
  # would break parity for no STIG gain: the rule matches package names, not
  # binaries. rpcctl and rpcdebug are kernel RPC diagnostics rather than daemons
  # and are likewise present in the client-only images.
  #
  # Images that only mount NFS should not carry a server they never run. The
  # DISA GPOS STIG No_Remote_Access rule (SV-263652r982557) also flags any image
  # whose apk database records a remote-access service, nfs-utils among them.
  #
  # Declared server-first so the client pipeline can claim what is left over and
  # then assert /usr/bin is empty: a binary added by a future upstream release
  # fails the build here instead of silently landing in the client package.
  - name: ${{package.name}}-server
    description: "NFS server: export management and the nfsd/mountd daemons"
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/bin
          for bin in exportfs fsidd nfsdclddb nfsdclnts nfsdctl nfsref \
                     rpc.mountd rpc.nfsd; do
            mv "${{targets.destdir}}"/usr/bin/"$bin" "${{targets.contextdir}}"/usr/bin/
          done

          # etab and rmtab are the export and remote-mount tables, both written
          # only by the server side.
          mkdir -p "${{targets.contextdir}}"/var/lib/nfs
          mv "${{targets.destdir}}"/var/lib/nfs/etab "${{targets.contextdir}}"/var/lib/nfs/
          mv "${{targets.destdir}}"/var/lib/nfs/rmtab "${{targets.contextdir}}"/var/lib/nfs/
    dependencies:
      runtime:
        - merged-sbin
        - merged-usrsbin
        # openSUSE's nfs-kernel-server requires nfs-client likewise: the server
        # daemons share libnfsidmap and rpc.statd with the client half.
        - ${{package.name}}-client
        - wolfi-baselayout
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/ver-check
          with:
            bins: rpc.mountd
        - uses: test/tw/help-check
          with:
            bins: |
              exportfs
              rpc.mountd

  - name: ${{package.name}}-client
    description: "NFS client: mount helpers, statd, idmapd and gssd"
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/bin
          for bin in mount.nfs mount.nfs4 umount.nfs umount.nfs4 \
                     nfsconf nfsdcld nfsidmap nfsstat showmount sm-notify \
                     start-statd rpc.gssd rpc.idmapd rpc.statd rpc.svcgssd \
                     rpcctl rpcdebug; do
            mv "${{targets.destdir}}"/usr/bin/"$bin" "${{targets.contextdir}}"/usr/bin/
          done

          # Everything else has been claimed by an earlier subpackage, so an
          # unrecognised binary left here means upstream grew one and it needs
          # classifying as client or server rather than defaulting to client.
          rmdir "${{targets.destdir}}"/usr/bin

          # nfsrahead is invoked by 99-nfs.rules to set per-mount readahead.
          mkdir -p "${{targets.contextdir}}"/usr/libexec
          mv "${{targets.destdir}}"/usr/libexec/nfsrahead "${{targets.contextdir}}"/usr/libexec/
          mkdir -p "${{targets.contextdir}}"/usr/lib/udev/rules.d
          mv "${{targets.destdir}}"/usr/lib/udev/rules.d/99-nfs.rules "${{targets.contextdir}}"/usr/lib/udev/rules.d/

          # libnfsidmap backs nfsidmap and rpc.idmapd, which both live here; the
          # server half picks it up through its dependency on this package.
          mv "${{targets.destdir}}"/usr/lib/libnfsidmap.so.* "${{targets.contextdir}}"/usr/lib/
          mv "${{targets.destdir}}"/usr/lib/libnfsidmap "${{targets.contextdir}}"/usr/lib/

          # sm, sm.bak and state are rpc.statd's lock-recovery state.
          mkdir -p "${{targets.contextdir}}"/var/lib/nfs
          mv "${{targets.destdir}}"/var/lib/nfs/sm "${{targets.contextdir}}"/var/lib/nfs/
          mv "${{targets.destdir}}"/var/lib/nfs/sm.bak "${{targets.contextdir}}"/var/lib/nfs/
          mv "${{targets.destdir}}"/var/lib/nfs/state "${{targets.contextdir}}"/var/lib/nfs/
    dependencies:
      runtime:
        - busybox
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/ver-check
          with:
            bins: |
              mount.nfs
              mount.nfs4
              nfsstat
              rpc.statd
              showmount
        - uses: test/tw/help-check
          with:
            bins: |
              nfsdcld
              nfsidmap
              nfsstat
              rpc.idmapd
              rpc.statd
              rpcdebug
              showmount
        - name: Test nfsidmap domain lookup
          runs: |
            # nfsidmap -d prints the configured NFS domain name (from
            # /etc/idmapd.conf or derived from the DNS domain). This exercises
            # real ID-mapping functionality without requiring a running NFS server.
            nfsidmap -d
        - name: Test nfsstat statistics output
          runs: |
            # nfsstat reads NFS statistics from /proc/net/rpc/nfs (client) and
            # /proc/net/rpc/nfsd (server). The NFS kernel module may not be loaded
            # in the test environment, so /proc/net/rpc/nfs may not exist. Accept
            # either a successful parse with "Client" output or the expected error
            # message indicating the proc file is absent.
            if [ -f /proc/net/rpc/nfs ]; then
              nfsstat -c | grep -F "Client"
            else
              out=$(nfsstat -c 2>&1 || true)
              echo "$out" | grep -F "No Client Stats"
            fi

update:
  enabled: true
  version-transform:
    - match: "-"
      replace: .
  git:
    tag-filter-prefix: nfs-utils-
    strip-prefix: nfs-utils-

# nfs-utils ships no files of its own; this asserts the metapackage still pulls
# both halves, so existing consumers keep the same binaries at the same paths.
test:
  pipeline:
    - uses: test/tw/ldd-check
      with:
        packages: nfs-utils-client nfs-utils-server
    - uses: test/tw/ver-check
      with:
        bins: |
          mount.nfs
          mount.nfs4
          nfsstat
          rpc.mountd
          rpc.statd
          showmount
    - uses: test/tw/help-check
      with:
        bins: |
          exportfs
          nfsdcld
          nfsidmap
          nfsstat
          rpc.idmapd
          rpc.mountd
          rpc.statd
          rpcdebug
          showmount
