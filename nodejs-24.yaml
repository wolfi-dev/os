package:
  name: nodejs-24
  version: "24.22.3" # On update, please check if -fdelete-null-pointer-checks is still required
  epoch: 2 # bundled CA roots regenerated from ca-certificates-bundle
  description: "JavaScript runtime built on V8 engine"
  dependencies:
    provides:
      - nodejs=${{package.full-version}}
    runtime:
      - ca-certificates-bundle
  copyright:
    - license: MIT
  annotations:
    toolchain-stream: true
  resources:
    cpu: 40
    memory: 68Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # SHA256 of docker-entrypoint.sh from nodejs/docker-node
  docker-entrypoint-hash: a15ac9589c04baf9da95b08e0e79b5cf1d75ab8dc64e06a5e68e4ceb0ad7c8ea
  # configure.py flags shared by the node, -minimal and -libnode builds.
  # No --enable-lto yet: a 24.22.1 LTO attempt aborted in V8's
  # gen-regexp-special-case with "Check failed: ch <= 0xffff", but that
  # abort comes from ICU 79, hits non-LTO builds too, and is fixed by
  # v8-regexp-special-case-icu79.patch. LTO has not been retried since.
  # https://linear.app/chainguard/issue/OS-5265
  configure-flags: >-
    --prefix=/usr --shared-brotli --shared-zlib --shared-openssl --shared-cares --shared-nghttp2 --shared-libuv --ninja --openssl-use-def-ca-store --with-icu-default-data-dir=$(icu-config --icudatadir) --with-intl=system-icu --openssl-conf-name=openssl_conf
  openssl-version: "4.0"
  python-version: 3.13
  # NODE_MODULE_VERSION of the 24.x line; libnode.so soname version
  soversion: "137"

environment:
  contents:
    packages:
      - brotli-dev
      - build-base
      - busybox
      - c-ares-dev
      - ca-certificates-bundle
      - glibc-2.44-dev
      - icu-dev
      - libuv-dev
      - linux-headers
      - nghttp2-dev
      - openssl-${{vars.openssl-version}}-dev # FTBFS with openssl-hardened-dev due to missing RSA_set0_factors, HMAC_CTX_new, EC_KEY, DSA, EVP_MD_CTX_md
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}-base
      - samurai
      - wolfi-base
      - zlib-dev
  environment:
    # https://github.com/wolfi-dev/os/issues/34075
    CFLAGS: -DOPENSSL_NO_ENGINE
    CXXFLAGS: -fdelete-null-pointer-checks -DOPENSSL_NO_ENGINE

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nodejs/node.git
      tag: v${{package.version}}
      expected-commit: e63cab040c09d43ceef8cb35508c40044614e906

  # Keep PBKDF2 matching Chainguard's PKCS5_PBKDF2_HMAC() under OpenSSL 4:
  # pass pkcs5=1 so non-approved parameters still work under FIPS
  - uses: patch
    with:
      patches: ncrypto-pbkdf2-pkcs5.patch

  # Backport of V8 f607706154ea for ICU 79, which adds U+1DF95 to the case
  # closure of U+00DF/U+1E9E: fixes the "Check failed: ch <= 0xffff" abort in
  # gen-regexp-special-case and makes U+00DF/U+1E9E match U+1DF95 under /iu
  # and /iv. Drop once deps/v8 contains that commit.
  - uses: patch
    with:
      patches: v8-regexp-special-case-icu79.patch

  # This build uses OpenSSL's CA store by default (--openssl-use-def-ca-store).
  # In a root filesystem with no CA location at all, for example the node that
  # actions-runner mounts into a customer's job container, that store is empty
  # and every TLS handshake fails. Add the bundled Mozilla roots only in that
  # case; an existing or explicitly configured store is used as is, and an
  # explicit --use-openssl-ca keeps its documented meaning.
  - uses: patch
    with:
      patches: openssl-ca-bundled-fallback.patch

  # The compiled-in root list (src/node_root_certs.h) is upstream's copy of
  # Mozilla's roots at the time of the node release. Regenerate it from the
  # ca-certificates-bundle in the build environment, so --use-bundled-ca and
  # the fallback added by openssl-ca-bundled-fallback.patch use our bundle,
  # and a ca-certificates change plus an epoch bump here propagates a
  # revocation without waiting for a node release.
  - name: Regenerate the bundled CA roots from ca-certificates-bundle
    runs: |
      bundle=/etc/ssl/certs/ca-certificates.crt
      n=$(grep -c 'BEGIN CERTIFICATE' "$bundle")
      [ "$n" -gt 100 ] || { echo "unexpected certificate count in $bundle: $n" >&2; exit 1; }
      {
        echo '#if defined(NODE_WANT_INTERNALS) && NODE_WANT_INTERNALS'
        echo
        echo "/* $n root certificates from ca-certificates-bundle */"
        awk '
          /^-----BEGIN CERTIFICATE-----/ { inpem=1 }
          inpem && /^-----END CERTIFICATE-----/ { printf "\"%s\",\n\n", $0; inpem=0; next }
          inpem { printf "\"%s\\n\"\n", $0 }
        ' "$bundle"
        echo '#endif  // defined(NODE_WANT_INTERNALS) && NODE_WANT_INTERNALS'
      } > src/node_root_certs.h
      echo "bundled $n root certificates"

  - name: Configure and build
    runs: |
      # Add defines recommended in libuv readme.
      case "${{build.arch}}" in
      "aarch64")
         common_flags="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
         ;;
      "x86_64")
         common_flags="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
         ;;
      esac

      # Compiling with O2 instead of Os increases binary size by ~10%
      # (53.1 MiB -> 58.6 MiB), but also increases performance by ~20%
      # according to v8/web-tooling-benchmark. Node.js is quite huge anyway;
      # there are better options for size constrained environments.
      export CFLAGS="${CFLAGS/-Os/-O2} $common_flags"
      export CXXFLAGS="${CXXFLAGS/-Os/-O2} $common_flags"
      export CPPFLAGS="${CPPFLAGS/-Os/-O2} $common_flags"
      python${{vars.python-version}} configure.py ${{vars.configure-flags}} \
        --without-corepack

        make BUILDTYPE=Release -j$(nproc)

  - uses: autoconf/make-install

  - runs: |
      make DESTDIR="$${{targets.destdir}}" install

  - uses: strip

  # Get rid of the bundled npm, we don't need it.
  - runs: |
      rm -rf "${{targets.destdir}}"/usr/lib/node_modules
      rm "${{targets.destdir}}"/usr/bin/npm
      rm "${{targets.destdir}}"/usr/bin/npx

update:
  enabled: true
  github:
    identifier: nodejs/node
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v24.

test:
  environment:
    contents:
      packages:
        - openssl
  pipeline:
    - name: Verify Node.js Installation
      runs: |
        node --version || exit 1
        node --help
    - name: Execute Basic JavaScript
      runs: |
        cat <<'EOF' > test.js
        console.log('Hello, World!');
        EOF
        node test.js | grep 'Hello, World!' || exit 1
    - name: Test International Number Formatting
      runs: |
        cat <<'EOF' > testIntl.js
        console.log(new Intl.NumberFormat('en-EN').format(1234.56));
        console.log(new Intl.NumberFormat('de-DE').format(1234.56));
        EOF
        node testIntl.js | grep '1,234.56' && node testIntl.js | grep '1.234,56' || exit 1
    - name: Regexp case equivalents of U+1DF95 (v8-regexp-special-case-icu79.patch)
      runs: |
        cat <<'EOF' > testCaseFold.js
        const assert = require('node:assert');
        const S = '\u{1DF95}';
        // Fails if the system ICU lacks Unicode 18 case data, which would
        // make the checks below vacuous.
        assert.strictEqual(S.toUpperCase(), 'SS');
        assert.ok(/^\u00df$/iu.test(S));
        assert.ok(/^\u1e9e$/iu.test(S));
        assert.ok(new RegExp('^' + S + '$', 'iu').test('\u00df'));
        assert.ok(/^[\u00df]$/iu.test(S));
        assert.ok(/^\u00df$/iu.test('\u1e9e'));
        // /i compares UTF-16 code units: no supplementary matches, and
        // U+00DF/U+1E9E and U+017F/s stay distinct (generated IgnoreSet).
        assert.ok(!/^\u00df$/i.test(S));
        assert.ok(!/^\u00df$/i.test('\u1e9e'));
        assert.ok(!/^s$/i.test('\u017f'));
        EOF
        node testCaseFold.js
    - name: Bundled CA roots are the ca-certificates-bundle
      runs: |
        # Same certificates, compared by SHA-256 fingerprint, in both orders.
        bundle=/etc/ssl/certs/ca-certificates.crt
        split=$(mktemp -d ./ca-split.XXXXXX)
        awk '/BEGIN CERT/{p=1} p{print} /END CERT/{p=0; print ""}' "$bundle" | awk -v dir="$split" 'BEGIN{RS=""} {f=dir "/" NR ".pem"; print > f; close(f)}'
        want=$(for f in "$split"/*.pem; do openssl x509 -in "$f" -noout -fingerprint -sha256; done | sort)
        rm -rf "$split"
        got=$(node -e 'for (const c of require("node:tls").getCACertificates("bundled")) console.log(new (require("node:crypto").X509Certificate)(c).fingerprint256)' | sed 's/^/sha256 Fingerprint=/' | sort)
        [ -n "$want" ] && [ "$want" = "$got" ] || { echo "bundled roots differ from $bundle"; echo "$want" | wc -l; echo "$got" | wc -l; exit 1; }
    - name: CA store selection (openssl-ca-bundled-fallback.patch)
      runs: |
        set -e
        d=$(mktemp -d)
        chmod 755 "$d"
        cd "$d"
        # Restore the system store on any exit; rows below move and edit it.
        cp /etc/ssl/certs/ca-certificates.crt bundle.orig
        restore() {
          [ -d /etc/ssl.off ] && mv /etc/ssl.off /etc/ssl
          chmod 755 /etc/ssl
          cp bundle.orig /etc/ssl/certs/ca-certificates.crt
          [ -n "$server" ] && kill "$server" 2>/dev/null
          return 0
        }
        trap restore EXIT
        openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 2 -subj '/CN=nodejs-24 test CA' 2>/dev/null
        openssl req -newkey rsa:2048 -nodes -keyout srv.key -out srv.csr -subj '/CN=localhost' 2>/dev/null
        printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=CA:FALSE\n' > ext.cnf
        openssl x509 -req -in srv.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out srv.pem -days 2 -extfile ext.cnf 2>/dev/null
        cat <<'EOF' > server.js
        const https = require('node:https');
        const fs = require('node:fs');
        https.createServer({ key: fs.readFileSync('srv.key'), cert: fs.readFileSync('srv.pem') },
          (req, res) => res.end('ok')).listen(8443, '127.0.0.1');
        EOF
        cat <<'EOF' > client.js
        require('node:https').get('https://localhost:8443/', (res) => { console.log('OK', res.statusCode); process.exit(0); })
          .on('error', (e) => { console.log('ERR', e.code || e.message); process.exit(1); });
        EOF
        node server.js &
        server=$!
        sleep 1
        fallback='using the bundled CA store'
        # check <label> <expected OK|ERR> <expected fallback yes|no> <stdout> <stderr file>
        check() {
          case "$4" in "$2"*) ;; *) echo "$1: expected $2, got: $4"; cat "$5"; exit 1;; esac
          if grep -q "$fallback" "$5"; then got=yes; else got=no; fi
          [ "$got" = "$3" ] || { echo "$1: expected fallback=$3, got $got"; cat "$5"; exit 1; }
        }
        # probe <label> <expected OK|ERR> <expected fallback yes|no> [node args...]
        probe() {
          label=$1; want=$2; fb=$3; shift 3
          if out=$(NODE_DEBUG_NATIVE=crypto node "$@" client.js 2>err.txt); then :; fi
          check "$label" "$want" "$fb" "$out" err.txt
        }
        # System store holding the test CA: used as is, no fallback.
        cat ca.pem >> /etc/ssl/certs/ca-certificates.crt
        probe system-store OK no
        cp bundle.orig /etc/ssl/certs/ca-certificates.crt
        # Hashed directory only, via SSL_CERT_DIR: configured, no fallback.
        mkdir hashed && cp ca.pem hashed/ && openssl rehash hashed 2>/dev/null
        export SSL_CERT_FILE=/nonexistent SSL_CERT_DIR="$d/hashed"
        probe hashed-dir OK no
        # Broken explicit override: configured, fails closed, no fallback.
        export SSL_CERT_DIR=/nonexistent
        probe broken-override ERR no
        unset SSL_CERT_FILE SSL_CERT_DIR
        # Existing store that the process cannot search: present, no fallback.
        # Needs a non-root user, which the test environment does not ship.
        # OPENSSL_CONF=/dev/null keeps OpenSSL from aborting on the unreadable
        # openssl.cnf, so the root store code is reached.
        grep -q '^catest:' /etc/passwd || adduser -D -H -s /bin/sh catest
        chmod 000 /etc/ssl
        if out=$(su catest -s /bin/sh -c "cd '$d' && OPENSSL_CONF=/dev/null NODE_DEBUG_NATIVE=crypto node client.js 2>/tmp/catest-err.txt"); then :; fi
        check unsearchable-store ERR no "$out" /tmp/catest-err.txt
        chmod 755 /etc/ssl
        # No CA location at all: bundled roots are added, the test CA is not among them.
        mv /etc/ssl /etc/ssl.off
        probe no-store ERR yes
        # Explicit --use-openssl-ca and the opt-out keep the empty store.
        probe explicit-openssl-ca ERR no --use-openssl-ca
        probe opt-out ERR no --no-openssl-ca-bundled-fallback
        mv /etc/ssl.off /etc/ssl
        # Default store back in place: no fallback.
        probe restored ERR no

subpackages:
  - name: ${{package.name}}-minimal
    description: Minimal ${{package.name}} without inspector, npm, or corepack
    pipeline:
      - runs: |
          # Build minimal variant with debugging tools removed
          cd /home/build

          # Clean previous build
          make clean || true
          rm -rf out || true

          # Reconfigure with minimal flags
          case "${{build.arch}}" in
          "aarch64")
             common_flags="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
             ;;
          "x86_64")
             common_flags="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
             ;;
          esac

          export CFLAGS="${CFLAGS/-Os/-O2} $common_flags"
          export CXXFLAGS="${CXXFLAGS/-Os/-O2} $common_flags"
          export CPPFLAGS="${CPPFLAGS/-Os/-O2} $common_flags"

          python${{vars.python-version}} configure.py ${{vars.configure-flags}} \
            --without-inspector \
            --without-npm \
            --without-corepack

          make BUILDTYPE=Release -j$(nproc)
          make DESTDIR="${{targets.subpkgdir}}" install
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: node
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: node
        - name: Execute Basic JavaScript
          runs: |
            cat <<'EOF' > test.js
            console.log('Hello, World!');
            EOF
            node test.js | grep 'Hello, World!'
        - name: Verify inspector is disabled
          runs: |
            set +e
            OUTPUT=$(/usr/bin/node --inspect 2>&1)
            EXIT_CODE=$?
            set -e
            echo "$OUTPUT"
            if [ $EXIT_CODE -eq 0 ]; then
              echo "ERROR: Inspector command should fail when disabled"
              exit 1
            fi
            if ! echo "$OUTPUT" | grep -F "bad option"; then
              echo "ERROR: Expected 'bad option' error message"
              exit 1
            fi
            echo "SUCCESS: Inspector is disabled as expected"
        - name: Verify npm and npx are not included
          runs: |
            if stat /usr/bin/npm 2>/dev/null; then
              echo "ERROR: npm should not be included"
              exit 1
            fi
            if stat /usr/bin/npx 2>/dev/null; then
              echo "ERROR: npx should not be included"
              exit 1
            fi
            echo "SUCCESS: npm and npx are not included"

  - name: ${{package.name}}-minimal-compat
    description: Compatibility symlinks for ${{package.name}}-minimal in /usr/local/bin
    dependencies:
      runtime:
        - ${{package.name}}-minimal
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -sf ../../bin/node "${{targets.subpkgdir}}"/usr/local/bin/node
    test:
      pipeline:
        - uses: test/tw/symlink-check

  - name: libnode${{vars.soversion}}
    description: Node.js ${{package.version}} as a shared library for embedders
    pipeline:
      - runs: |
          # Separate --shared build so the node binary stays self-contained.
          cd /home/build
          make clean || true
          rm -rf out || true

          common_flags="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
          export CFLAGS="${CFLAGS/-Os/-O2} $common_flags"
          export CXXFLAGS="${CXXFLAGS/-Os/-O2} $common_flags"
          export CPPFLAGS="${CPPFLAGS/-Os/-O2} $common_flags"

          python${{vars.python-version}} configure.py ${{vars.configure-flags}} \
            --shared \
            --without-npm \
            --without-corepack

          ninja -C out/Release -j"$(nproc)" libnode

          abi=$(awk '/^#define NODE_MODULE_VERSION [0-9]+/ {print $3}' src/node_version.h)
          if [ "$abi" != "${{vars.soversion}}" ]; then
            echo "NODE_MODULE_VERSION is $abi, update vars.soversion" >&2
            exit 1
          fi
          install -Dm755 out/Release/lib/libnode.so.${{vars.soversion}} \
            "${{targets.contextdir}}"/usr/lib/libnode.so.${{vars.soversion}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - build-base
            - libuv-dev
            - ${{package.name}}
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check
        - name: Embed libnode and run JavaScript
          runs: |
            cat > embed.cc <<'EOF'
            #include <node.h>
            int main(int argc, char **argv) { return node::Start(argc, argv); }
            EOF
            g++ -std=c++20 -I/usr/include/node embed.cc \
              /usr/lib/libnode.so.${{vars.soversion}} -o embed
            ./embed -e 'console.log(process.versions.node, 6 * 7)' | grep -Fx "${{package.version}} 42"

  - name: ${{package.name}}-oci-entrypoint-compat
    description: Docker Hub-compatible entrypoint for Node.js
    dependencies:
      provides:
        - nodejs-oci-entrypoint-compat=${{package.full-version}}
    pipeline:
      - uses: fetch # blocked-extract-false: vendors a single upstream entrypoint script (not an archive)
        with:
          uri: https://raw.githubusercontent.com/nodejs/docker-node/31a343bbe3f1/docker-entrypoint.sh
          expected-sha256: ${{vars.docker-entrypoint-hash}}
          extract: false
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/bin
          cp docker-entrypoint.sh ${{targets.contextdir}}/usr/local/bin/docker-entrypoint.sh
          chmod +x ${{targets.contextdir}}/usr/local/bin/docker-entrypoint.sh
    test:
      pipeline:
        - runs: |
            test -x /usr/local/bin/docker-entrypoint.sh

  - name: ${{package.name}}-doc
    description: ${{package.name}} documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

  - name: ${{package.name}}-minimal-doc
    description: ${{package.name}}-minimal manpages
    pipeline:
      - uses: split/manpages
        with:
          package: ${{package.name}}-minimal
    test:
      pipeline:
        - uses: test/docs
