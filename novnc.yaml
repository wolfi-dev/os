package:
  name: novnc
  version: "1.7.0"
  epoch: 2 # split web assets into novnc-web
  description: VNC client using HTML5 (WebSockets, Canvas) with encryption (wss://) support
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - ${{package.name}}-web
      - net-tools
      - websockify
  resources:
    cpu: "5"
    memory: 8Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/novnc/noVNC
      tag: v${{package.version}}
      expected-commit: 63107bd06d9e1f6136ff21aeda8cd62cbf0d433e

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/webapps/novnc
      install -Dm644 LICENSE.txt ${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE
      install -Dm644 vendor/pako/LICENSE ${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE.MIT
      install -Dm644 docs/LICENSE.* ${{targets.destdir}}/usr/share/licenses/${{package.name}}/

      install -Dm644 docs/* -t "${{targets.destdir}}"/usr/share/doc/${{package.name}}
      install -Dm644 README.md -t "${{targets.destdir}}"/usr/share/doc/${{package.name}}/

      install -D -m 755 utils/novnc_proxy "${{targets.destdir}}"/usr/bin/novnc_server

      for i in app core po vendor vnc.html defaults.json mandatory.json karma.conf.cjs package.json vnc_lite.html; do
        cp -a "$i" ${{targets.destdir}}/usr/share/webapps/novnc
      done

  - uses: strip

subpackages:
  # Static web client only: for consumers that bring their own websockify
  # (e.g. nova-novncproxy) and need no novnc_server.
  - name: ${{package.name}}-web
    description: noVNC HTML5 web client assets, without the novnc_server launcher
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share/webapps
          mv "${{targets.destdir}}"/usr/share/webapps/novnc "${{targets.subpkgdir}}"/usr/share/webapps/
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            files: /usr/share/webapps/novnc/vnc.html /usr/share/webapps/novnc/vnc_lite.html /usr/share/webapps/novnc/core/rfb.js
        - name: No websockify or novnc_server pulled in
          runs: |
            test ! -e /usr/bin/websockify
            test ! -e /usr/bin/novnc_server

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share
          mv "${{targets.destdir}}"/usr/share/doc/${{package.name}} "${{targets.subpkgdir}}"/usr/share
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: novnc/noVNC
    strip-prefix: v

test:
  pipeline:
    - runs: |
        cd /usr/share/webapps/novnc
        output=$(novnc_server --timeout 1 2>&1)
        echo "$output" | grep -F "WebSocket"
