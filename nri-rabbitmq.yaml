package:
  name: nri-rabbitmq
  version: "2.17.3"
  epoch: 1
  description: New Relic Infrastructure RabbitMQ Integration
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 4Gi

vars:
  go-version: "1.26"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-rabbitmq
      expected-commit: dbe614afee2c08cf260c34905fbc0895545de902
      tag: v${{package.version}}

  - uses: go/build/v2
    with:
      modroot: .
      packages: ./src/
      output: nri-rabbitmq

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf ../../../../../usr/bin/${{package.name}} ${{targets.subpkgdir}}/var/db/newrelic-infra/newrelic-integrations/bin/${{package.name}}
          install -Dm644 legacy/rabbitmq-definition.yml ${{targets.subpkgdir}}/var/db/newrelic-infra/newrelic-integrations/rabbitmq-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  github:
    identifier: newrelic/nri-rabbitmq
    strip-prefix: v

environment:
  contents:
    packages:
      - go-${{vars.go-version}}

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: nri-rabbitmq
    - name: Test integration produces structured output
      runs: |
        # Run nri-rabbitmq against a non-existent RabbitMQ instance.
        # It should fail (non-zero exit) but produce output; capture it without
        # masking errors from the rest of the script.
        output=$(nri-rabbitmq --hostname 127.0.0.1 --port 15672 --username guest --password guest 2>&1) || true

        # Verify the binary produced some output (not silent failure)
        if [ -z "$output" ]; then
          echo "FAIL: nri-rabbitmq produced no output"
          exit 1
        fi

        echo "nri-rabbitmq produced output"
        echo "$output"

        # When no server is available, expect a connection error
        if echo "$output" | jq -e . > /tmp/nri-rabbitmq-parsed.json; then
          echo "Output is valid JSON"
          if jq -e '.name' /tmp/nri-rabbitmq-parsed.json; then
            echo "Found 'name' field in JSON output"
          fi
        else
          echo "Output is not pure JSON, verifying error output from connection attempt"
          if ! echo "$output" | grep -qE "(connection refused|ERR|error|Error)"; then
            echo "ERROR: unexpected output from nri-rabbitmq"
            exit 1
          fi
          echo "PASS: binary produced expected error output when no server available"
        fi
