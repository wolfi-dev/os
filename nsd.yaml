package:
  name: nsd
  version: "4.15.2"
  epoch: 0 # glibc: 2.43->2.44
  description: "The NLnet Labs Name Server Daemon (NSD) is an authoritative, RFC compliant DNS nameserver."
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - flex
      - fstrm-dev
      - glibc-2.44-dev
      - libevent-dev
      - openssl-dev # FTBFS with openssl-hardened-dev due to missing SHA_CTX, SHA1_Init, SHA1_Update, SHA1_Final
      - protobuf-c-dev
      - wolfi-base

var-transforms:
  - from: ${{package.version}}_REL
    match: \.
    replace: _
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NLnetLabs/nsd
      expected-commit: 6b0d95b44f987ab6ed408006629080f743c7f60e
      tag: NSD_${{vars.mangled-package-version}}

  - runs: |
      git submodule update --init

  - uses: autoconf/configure
    with:
      opts: |
        --sbindir=/usr/bin

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: nsd-doc
    description: nsd manpages
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

# tag/release names on github look like NSD_4_8_0_REL
update:
  enabled: true
  github:
    identifier: NLnetLabs/nsd
    use-tag: true
    strip-suffix: _REL
    strip-prefix: NSD_
    tag-filter-prefix: NSD_4
  version-separator: "_"

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: nsd
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: nsd nsd-checkzone
    - name: Validate zone file with nsd-checkzone
      runs: |
        # Create a minimal valid zone file and validate it with nsd-checkzone
        cat > /tmp/test.zone <<'EOF'
        $ORIGIN example.com.
        $TTL 3600
        @  IN  SOA  ns1.example.com.  hostmaster.example.com. (
                    2024010101  ; serial
                    3600        ; refresh
                    900         ; retry
                    604800      ; expire
                    300 )       ; minimum TTL
        @  IN  NS   ns1.example.com.
        ns1  IN  A  192.0.2.1
        www  IN  A  192.0.2.2
        EOF
        nsd-checkzone example.com /tmp/test.zone
    - name: Validate nsd configuration with nsd-checkconf
      runs: |
        # Create a minimal valid nsd config and validate it
        mkdir -p /tmp/nsd
        cat > /tmp/nsd/nsd.conf <<'EOF'
        server:
          ip-address: 127.0.0.1
          port: 5353
          database: /tmp/nsd/nsd.db
          pidfile: /tmp/nsd/nsd.pid
          logfile: /tmp/nsd/nsd.log
          zonesdir: /tmp/nsd
        EOF
        nsd-checkconf /tmp/nsd/nsd.conf
