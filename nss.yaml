package:
  name: nss
  version: "3.128"
  epoch: 1 # glibc: 2.43->2.44
  description: "Network Security Services (NSS) is a set of libraries designed to support cross-platform development of security-enabled client and server applications."
  copyright:
    - license: MPL-2.0
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  python-version: "3.13"

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - glibc-2.44-dev
      - libnspr
      - libnspr-dev
      - mercurial
      - perl
      - py${{vars.python-version}}-gyp-next-bin
      - samurai
      - sqlite-dev
      - zlib-dev
  environment:
    # NSS builds with -Werror; suppress warnings not yet fixed upstream:
    # - discarded-qualifiers: genload.c assigns strrchr() to non-const ptr (3.120.1+)
    # Not sure if its bug but couldn't find any reference in the Bugzilla.
    CFLAGS: -Wno-error=format-truncation= -Wno-error=discarded-qualifiers

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: _
    to: nss-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mozilla/nss
      tag: NSS_${{vars.nss-package-version}}_RTM
      expected-commit: 02a2746db5e758e2722a1c679fe2662cf8df16a7

  - runs: |
      ./build.sh -c --disable-tests --opt --system-nspr --system-sqlite --enable-fips

      mkdir -p "${{targets.destdir}}"/usr/lib
      mkdir -p "${{targets.destdir}}"/usr/bin
      mkdir -p "${{targets.destdir}}"/usr/include/nss

      mv ../dist/Release/lib/*.so "${{targets.destdir}}"/usr/lib
      mv ../dist/Release/lib/*.chk "${{targets.destdir}}"/usr/lib
      mv ../dist/Release/bin/* "${{targets.destdir}}"/usr/bin
      mv ../dist/public/nss/* "${{targets.destdir}}"/usr/include/nss

      NSS_VMAJOR=`awk '/#define.*NSS_VMAJOR/ {print $3}' lib/nss/nss.h `
      NSS_VMINOR=`awk '/#define.*NSS_VMINOR/ {print $3}' lib/nss/nss.h`
      NSS_VPATCH=`awk '/#define.*NSS_VPATCH/ {print $3}' lib/nss/nss.h`

      # pkgconfig files
      mkdir -p ${{targets.destdir}}/usr/lib/pkgconfig
      sed ./pkg/pkg-config/nss.pc.in \
        -e "s,%libdir%,/usr/lib,g" \
        -e "s,%prefix%,/usr,g" \
        -e "s,%exec_prefix%,/usr/bin,g" \
        -e "s,%includedir%,/usr/include/nss,g" \
        -e "s,%NSPR_VERSION%,${{package.version}},g" \
        -e "s,%NSS_VERSION%,${{package.version}},g" \
        -e "s,%NSSUTIL_VERSION%,${{package.version}},g" \
        > "${{targets.destdir}}"/usr/lib/pkgconfig/nss.pc

  - uses: strip

  - name: Recompute checksums after strip
    runs: |
      export LD_LIBRARY_PATH="${{targets.destdir}}"/usr/lib
      export PATH="${{targets.destdir}}"/usr/bin:$PATH
      cd "${{targets.destdir}}"/usr/lib
      shlibsign -v -i libsoftokn3.so
      shlibsign -v -i libfreebl3.so
      shlibsign -v -i libfreeblpriv3.so

subpackages:
  - name: libnss
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/*.so "${{targets.subpkgdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/*.chk "${{targets.subpkgdir}}"/usr/lib
    dependencies:
      runtime:
        - libnspr
    test:
      environment:
        contents:
          packages:
            - build-base
            - libnss-dev
            - pkgconf
      pipeline:
        - uses: test/tw/ldd-check
        - name: Compile and run a program that calls core NSS APIs
          runs: |
            cat > /tmp/nss_test.c << 'EOF'
            #include <nss.h>
            #include <stdio.h>

            int main(void) {
                SECStatus rv;
                rv = NSS_NoDB_Init(NULL);
                if (rv != SECSuccess) {
                    fprintf(stderr, "NSS_NoDB_Init failed\n");
                    return 1;
                }
                printf("NSS initialized successfully\n");
                rv = NSS_Shutdown();
                if (rv != SECSuccess) {
                    fprintf(stderr, "NSS_Shutdown failed\n");
                    return 1;
                }
                printf("NSS shutdown successfully\n");
                return 0;
            }
            EOF
            gcc $(pkg-config --cflags nss) /tmp/nss_test.c -o /tmp/nss_test $(pkg-config --libs nss)
            /tmp/nss_test

  - name: libnss-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libnss
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf

  - name: libnss-tools
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/* "${{targets.subpkgdir}}"/usr/bin
    dependencies:
      runtime:
        - libnss
    test:
      pipeline:
        - name: Test certutil can create and list an NSS certificate database
          runs: |
            mkdir -p /tmp/nssdb-tools
            certutil -N -d /tmp/nssdb-tools --empty-password
            certutil -L -d /tmp/nssdb-tools
        - name: Test modutil can list PKCS11 modules in an NSS database
          runs: |
            mkdir -p /tmp/nssdb-modutil
            certutil -N -d /tmp/nssdb-modutil --empty-password
            modutil -dbdir /tmp/nssdb-modutil -list

test:
  environment:
    contents:
      packages:
        - libnss-tools
  pipeline:
    - uses: test/tw/ldd-check
    - name: Check one can create nssdb in various modes
      runs: |
        mkdir -p /tmp/nssdb
        modutil -dbdir /tmp/nssdb -create < /dev/null
        modutil -dbdir /tmp/nssdb -fips true < /dev/null

update:
  enabled: true
  version-transform:
    - match: _
      replace: .
  github:
    identifier: mozilla/nss
    use-tag: true
    tag-filter-prefix: NSS_
    tag-filter-contains: _RTM
    strip-prefix: NSS_
    strip-suffix: _RTM
