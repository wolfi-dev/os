package:
  name: nushell
  version: "0.115.1"
  epoch: 3 # remove unnecessary build step
  description: A new type of shell
  copyright:
    - license: MIT
  resources:
    # https://go/wolfi-rsc/nushell
    cpu: 30
    memory: 20Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  openssl-version: "3.6"
  rust-version: 1.95

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - glibc-2.44-dev
      - libgit2-dev
      - libssh2-dev
      - openssl-hardened-${{vars.openssl-version}}-dev
      - rust-${{vars.rust-version}}
      - sqlite-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nushell/nushell
      tag: ${{package.version}}
      expected-commit: 798c55d19505fd52f205d7eb32a571b9d06ec9e6

  - name: "bump some rust dependencies before running cargobump"
    runs: |
      sed -i 's/lru = "0\.12"/lru = "0.16.3"/' Cargo.toml

  - uses: bump

  - uses: cargo/build
    with:
      opts: --workspace --release
      output: nu

  - runs: |
      find target/release \
        -maxdepth 1 \
        -executable \
        -type f \
        -name "nu_plugin_*" \
        -exec install -vDm755 -t "${{targets.destdir}}/usr/bin" "{}" +

  - uses: strip

subpackages:
  - name: nushell-plugins
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin/
          mv ${{targets.destdir}}/usr/bin/nu_plugin_* ${{targets.contextdir}}/usr/bin/
    description: nushell plugins
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: nu
    - uses: test/tw/ver-check
      with:
        bins: nu
    - name: version and command test
      runs: |
        nu --version || exit 1
        nu -c 'echo "hello"'

update:
  enabled: true
  github:
    identifier: nushell/nushell
