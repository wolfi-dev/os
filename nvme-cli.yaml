package:
  name: nvme-cli
  version: "3.1"
  epoch: 1 # openssl: 3.6->4.0
  description: NVM-Express user space tooling for Linux
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  openssl-version: "4.0"

# nvme-cli 3.x bundles libnvme3 and links openssl, json-c and keyutils directly.
environment:
  contents:
    packages:
      - bash
      - build-base
      - glibc-2.44-dev
      - json-c-dev
      - keyutils-dev
      - meson
      - openssl-${{vars.openssl-version}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f73ecd53751cd74bc8e46b60c973ea63edf41403
      repository: https://github.com/linux-nvme/nvme-cli
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: fix-missing-man5-pages.patch

  - uses: meson/configure
    with:
      opts: |
        -Ddocs=man \
        -Dopenssl=enabled \
        -Dudevrulesdir=/usr/lib/udev/rules.d/ \
        -Dsbindir=/usr/bin

  - uses: meson/compile

  - uses: meson/install

  - runs: |
      rm -rf ${{targets.destdir}}/usr/lib/systemd
      rm -rf ${{targets.destdir}}/usr/lib/udev
      rm -rf ${{targets.destdir}}/usr/share/bash-completion
      rm -rf ${{targets.destdir}}/usr/share/zsh

  - uses: strip

subpackages:
  - name: nvme-cli-doc
    pipeline:
      - uses: split/manpages
    description: nvme-cli manpages
    test:
      pipeline:
        - uses: test/tw/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

update:
  enabled: true
  manual: false
  github:
    identifier: linux-nvme/nvme-cli
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: version test
      runs: nvme --version | grep ${{package.version}}
    - name: more tests
      runs: |
        nvme list
        nvme help | grep discover
    - name: TLS PSK generation and identity derivation
      runs: |
        key=$(nvme gen-tls-key --hmac 1)
        echo "$key" | grep -q '^NVMeTLSkey-1:01:'
        # the keyring lookup after the derivation fails in the sandbox, check the identity line only
        nvme check-tls-key --keydata "$key" --identity 1 \
          --hostnqn nqn.2026-10.dev.chainguard:host \
          --subsysnqn nqn.2026-10.dev.chainguard:subsys \
          2>&1 | grep -q '^NVMe1R01 '
