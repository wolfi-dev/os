package:
  name: nvme-cli
  version: "3.0"
  epoch: 0 # glibc: 2.43->2.44
  description: NVM-Express user space tooling for Linux
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - bash
      - build-base
      - glibc-2.44-dev
      - libnvme-dev
      - meson

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 72dddd9a21b9bafbe1832b536f3abb32cc3ee38b
      repository: https://github.com/linux-nvme/nvme-cli
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: fix-missing-man5-pages.patch

  - uses: meson/configure
    with:
      opts: |
        -Ddocs=man \
        -Dudevrulesdir=/usr/lib/udev/rules.d/ \
        -Dsbindir=/usr/bin

  - uses: meson/compile

  - uses: meson/install

  - runs: |
      rm -rf ${{targets.destdir}}/usr/lib/systemd
      rm -rf ${{targets.destdir}}/usr/lib/udev
      rm -rf ${{targets.destdir}}/usr/share/bash-completion
      rm -rf ${{targets.destdir}}/usr/share/zsh

  - uses: strip

subpackages:
  - name: nvme-cli-doc
    pipeline:
      - uses: split/manpages
    description: nvme-cli manpages
    test:
      pipeline:
        - uses: test/tw/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

update:
  enabled: true
  manual: false
  github:
    identifier: linux-nvme/nvme-cli
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: version test
      runs: nvme --version | grep ${{package.version}}
    - name: more tests
      runs: |
        nvme list
        nvme help | grep discover
        nvme gen-tls-key
