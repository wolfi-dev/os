#nolint:update-disabled-reason
package:
  name: ocaml-findlib
  version: "1.9.8"
  epoch: 4 # keep the bytes package
  description: "OCaml library manager"
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 4Gi
  dependencies:
    runtime:
      - ocaml

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - ocaml
      - ocaml-compiler-libs

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml/ocamlfind
      tag: findlib-${{package.version}}
      expected-commit: bd9aad183f0d1c2caf3ec29e4f52bc69361f266d

  # This doesn't accept all of autoconf's standard options, so we can't use
  # the autoconf/configure pipeline.
  - runs: |
      ./configure \
        -config /etc/ocamlfind.conf \
        -bindir /usr/bin \
        -mandir /usr/share/man \
        -sitelib "$(ocamlc -where)" \
        -with-toolbox \
        -no-camlp4

  - uses: autoconf/make
    with:
      opts: all

  - uses: autoconf/make
    with:
      opts: opt

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ocamlfind
    dependencies:
      runtime:
        - ocaml-findlib
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        # No --version flag or equivalent.
        - uses: test/tw/help-check
          with:
            bins: ocamlfind
            help-flag: ocamlc --help
        - uses: test/tw/ldd-check
        - uses: test/no-docs
        - name: Functional test
          runs: |
            ocamlfind list
            stdlib_path="$(ocamlfind query stdlib)"
            if [ "$stdlib_path" = /usr/lib/ocaml ]; then
              echo "PASS: 'ocamlfind query stdlib' produced sensible output"
            else
              echo "FAIL: 'ocamlfind query stdlib' produced '$stdlib_path', not '/usr/lib/ocaml'" >&2
              exit 1
            fi

test:
  environment:
    contents:
      packages:
        - gcc
        - ocamlfind
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/no-docs
    - name: Code written for older OCaml still finds the bytes package
      runs: |
        # the Bytes module is in the standard library; findlib's bytes package
        # is the empty one that code still requires (ocplib-endian, ...)
        ocamlfind query bytes
        printf 'let () = print_string (Bytes.to_string (Bytes.of_string "ok"))\n' > /tmp/t.ml
        ocamlfind ocamlopt -package bytes -linkpkg /tmp/t.ml -o /tmp/t
        /tmp/t | grep -qx ok
