package:
  name: ocaml-zarith
  version: "1.14"
  epoch: 0
  description: "Arbitrary-precision integers and rationals for OCaml, backed by GMP"
  copyright:
    - license: LGPL-2.0-only WITH OCaml-LGPL-linking-exception
  resources:
    cpu: "2"
    memory: 4Gi
  dependencies:
    runtime:
      # Programs that link zarith natively need -lgmp, so libgmp.so.
      - gmp-dev
      - ocaml

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - gmp-dev
      - ocaml
      - ocaml-compiler-libs
      - ocamlfind

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml/Zarith
      tag: release-${{package.version}}
      expected-commit: 667d742948914aa1f80d5ad5abb98bc412335e51

  # configure is not autoconf, so the autoconf/configure pipeline does not
  # apply.
  - runs: |
      ./configure

  - uses: autoconf/make

  # make install runs `ocamlfind install -destdir <INSTALLDIR>`; INSTALLDIR
  # defaults to `ocamlfind printconf destdir`.
  - runs: |
      destdir="$(ocamlfind printconf destdir)"
      mkdir -p "${{targets.contextdir}}$destdir/stublibs"
      OCAMLFIND_LDCONF=ignore make install INSTALLDIR="${{targets.contextdir}}$destdir"

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/no-docs
    - name: Functional test
      pipeline:
        - needs:
            packages:
              - build-base
              - ocaml
              - ocamlfind
          runs: |
            cat > test_z.ml <<'EOF'
            let () =
              let f = ref Z.one in
              for i = 1 to 30 do f := Z.mul !f (Z.of_int i) done;
              assert (Z.to_string !f = "265252859812191058636308480000000");
              let q = Q.of_string "6/8" in
              assert (Q.to_string q = "3/4")
            EOF
            ocamlfind ocamlopt -package zarith -linkpkg -o test_z.opt test_z.ml
            ./test_z.opt
            ocamlfind ocamlc -package zarith -linkpkg -o test_z.byte test_z.ml
            ./test_z.byte

update:
  enabled: true
  github:
    identifier: ocaml/Zarith
    tag-filter-prefix: release-
    strip-prefix: release-
