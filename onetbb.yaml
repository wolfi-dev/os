#nolint:depends-on-unversioned-py-provides
package:
  name: onetbb
  version: "2023.2.0"
  epoch: 1 # tbbmalloc: build without _GLIBCXX_ASSERTIONS (undefined libstdc++ symbol)
  description: oneAPI Threading Building Blocks
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-2.44-dev
      - hwloc-dev
      - linux-headers
      - py3-setuptools
      - python3-dev
      - samurai
      - swig

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 41158a44ab3fb7ac5df7f99ef82626c87607447f
      repository: https://github.com/oneapi-src/oneTBB
      tag: v${{package.version}}

  - uses: patch
    with:
      # Our toolchain's -fhardened defines _GLIBCXX_ASSERTIONS, which left
      # libtbbmalloc.so.2 (linked as C, without libstdc++) with an undefined
      # std::__glibcxx_assert_fail. Final diff of upstream
      # https://github.com/uxlfoundation/oneTBB/pull/2239 (approved); drop on
      # the first release that contains it.
      patches: tbbmalloc-no-glibcxx-assertions.patch

  # TODO(upstream-tests): gate on upstream-tests/ctest (TBB_TEST=ON, after
  # cmake/install) once the eco-2.28 build's exception-test aborts are
  # understood (findings register F-143), with test_limiter_node ignored for
  # its known aarch64 hang (uxlfoundation/oneTBB#342).
  - uses: cmake/configure
    with:
      opts: |
        -DTBB4PY_BUILD=OFF \
        -DCMAKE_BUILD_TYPE=MinSizeRel \
        -DTBB_STRICT=OFF \
        -DTBB_TEST=OFF

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: libtbb
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/* "${{targets.subpkgdir}}"/usr/lib/
    description: "oneAPI Threading Building Blocks"
    test:
      environment:
        contents:
          packages:
            - gcc
            - glibc-dev
            - libtbb-dev
      pipeline:
        - name: Compile and run basic threading test
          runs: |
            cat <<'EOF' > threading_test.cpp
            #include <tbb/tbb.h>
            #include <iostream>
            int main() {
                tbb::parallel_for(0, 10, [](int i) { std::cout << i << " "; });
                std::cout << std::endl;
                return 0;
            }
            EOF
            g++ threading_test.cpp -o threading_test -ltbb
            ./threading_test
        - name: Link and run a pure C program against libtbbmalloc
          runs: |
            # libtbbmalloc is linked as C and must not need libstdc++.
            cat <<'EOF' > malloc_test.c
            #include <tbb/scalable_allocator.h>
            #include <stdio.h>
            #include <string.h>
            int main(void) {
                char *p = scalable_malloc(4096);
                if (!p) return 1;
                memset(p, 0x5a, 4096);
                p = scalable_realloc(p, 1 << 20);
                if (!p || p[4095] != 0x5a) return 1;
                scalable_free(p);
                puts("tbbmalloc pure C test passed");
                return 0;
            }
            EOF
            gcc malloc_test.c -o malloc_test -ltbbmalloc
            ./malloc_test
            if nm -D --undefined-only /usr/lib/libtbbmalloc.so.2 | grep -F __glibcxx_assert_fail; then
              echo "libtbbmalloc.so.2 references a libstdc++ symbol"; exit 1
            fi
        - uses: test/tw/ldd-check

  - name: libtbb-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libtbb
        - linux-headers
    description: libtbb dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: onetbb-doc
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share/doc/TBB
          mv "${{targets.destdir}}"/usr/share/doc/TBB/README.md "${{targets.subpkgdir}}"/usr/share/doc/TBB/README.md
    description: onetbb readme
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  ignore-regex-patterns:
    - -rc
  github:
    identifier: oneapi-src/oneTBB
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/emptypackage
    - uses: test/tw/ldd-check
