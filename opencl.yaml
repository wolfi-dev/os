package:
  name: opencl
  version: "2026.05.29"
  epoch: 3 # split/manpages, man path fix
  description: OpenCL SDK
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-2.44-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/KhronosGroup/OpenCL-SDK
      tag: v${{package.version}}
      expected-commit: e26922bdf54eaa9fcc31fe1f91d21b8d2bd6970f
      recurse-submodules: true

  - uses: cmake/configure
    with:
      opts: |
        -DOPENCL_SDK_BUILD_SAMPLES=OFF \
        -DCMAKE_INSTALL_DATADIR=lib

  - uses: cmake/build

  - uses: cmake/install

  - name: Move the manual page out of usr/lib
    runs: |
      # -DCMAKE_INSTALL_DATADIR=lib above redirects everything the SDK
      # installs under CMake's datadir into usr/lib, and upstream
      # installs clinfo.1 relative to it. usr/lib/man is not a manual
      # path: man(1) does not search it, so the page shipped somewhere
      # nothing would ever read it. The libraries are unaffected — they
      # go to usr/lib via libdir, not datadir.
      mkdir -p "${{targets.destdir}}"/usr/share/man
      mv "${{targets.destdir}}"/usr/lib/man/* "${{targets.destdir}}"/usr/share/man/
      rmdir "${{targets.destdir}}"/usr/lib/man

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: opencl-dev

  - name: ${{package.name}}-doc
    description: ${{package.name}} manpages
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: KhronosGroup/OpenCL-SDK
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - opencl-dev
        - build-base
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    # AUTOGENERATED
    - runs: |
        cllayerinfo --version
        cllayerinfo --help
    - name: Test OpenCL library compilation
      runs: |
        tee test.c <<'EOF'
        #include <CL/cl.h>
        #include <stdio.h>
        int main() {
            cl_uint num_platforms = 0;
            cl_int ret = clGetPlatformIDs(0, NULL, &num_platforms);
            printf("clGetPlatformIDs returned: %d, platforms: %u\n", ret, num_platforms);
            return 0;
        }
        EOF

        gcc $(pkg-config --cflags OpenCL) test.c -o test $(pkg-config --libs OpenCL)
        ./test
