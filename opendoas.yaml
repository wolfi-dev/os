package:
  name: opendoas
  version: 6.8.2
  epoch: 7
  description: A portable fork of the OpenBSD `doas` command
  copyright:
    - license: MIT
  checks:
    disabled:
      - setuidgid

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7f0205fe2f06221d76243342d299851f48c2b83c
      repository: https://github.com/Duncaen/OpenDoas
      tag: v${{package.version}}

  - runs: ./configure --prefix=${{targets.destdir}}/usr

  - uses: autoconf/make

  - runs: make install

  - uses: strip

subpackages:
  - name: "opendoas-doc"
    description: "opendoas documentation"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/tw/docs

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test doas configuration file parsing
      runs: |
        # Create a valid doas configuration file
        tee /tmp/doas.conf <<'EOF'
        permit nopass root
        EOF

        # Verify doas accepts a valid configuration file (must exit 0)
        doas -C /tmp/doas.conf id

        # Verify doas rejects an invalid configuration file (must exit non-zero)
        echo "badline !!!" > /tmp/doas-invalid.conf
        if doas -C /tmp/doas-invalid.conf id 2>/dev/null; then
          echo "ERROR: doas accepted an invalid config"
          exit 1
        fi

update:
  enabled: true
  github:
    identifier: Duncaen/OpenDoas
    strip-prefix: v
