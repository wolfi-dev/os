package:
  name: openh264
  version: "2.7.0"
  epoch: 0 # glibc: 2.43->2.44
  description: OpenH264 is a codec library which supports H.264 encoding and decoding
  copyright:
    - license: BSD-2-Clause

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - nasm

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1bca62311e447fd9c39fc93de2c4b96cd5ce971c
      repository: https://github.com/cisco/openh264
      tag: v${{package.version}}

  - runs: |
      make ARCH="${{build.arch}}" BUILDTYPE=Release USE_ASM=Yes ENABLEPIC=Yes HAVE_AVX2=No

  - runs: |
      make DESTDIR="${{targets.destdir}}" PREFIX="/usr" install

  - uses: strip

subpackages:
  - name: openh264-dev
    pipeline:
      - uses: split/dev
    description: openh264 dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - openh264-dev
        - build-base
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test openh264 compile and link
      runs: |
        set -euo pipefail

        tee test.c <<'EOF'
        #include <wels/codec_api.h>
        #include <stdio.h>

        int main() {
            ISVCDecoder *decoder = NULL;
            int rc = WelsCreateDecoder(&decoder);
            if (rc != 0 || decoder == NULL) {
                fprintf(stderr, "FAIL: WelsCreateDecoder returned %d\n", rc);
                return 1;
            }
            printf("SUCCESS: WelsCreateDecoder created decoder\n");
            WelsDestroyDecoder(decoder);
            return 0;
        }
        EOF

        gcc $(pkg-config --cflags openh264) test.c -o test $(pkg-config --libs openh264)
        ./test

update:
  enabled: true
  github:
    identifier: cisco/openh264
    strip-prefix: v
