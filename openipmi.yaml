package:
  name: openipmi
  version: "2.0.38"
  epoch: 1 # man pages for ipmicmd, ipmish
  description: IPMI (Intelligent Platform Management Interface) library and tools
  copyright:
    - license: LGPL-2.0-or-later AND GPL-2.0-or-later OR BSD-3-Clause
  resources:
    cpu: "2"
    memory: 2Gi

vars:
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glib-dev
      - glibc-2.44-dev
      - libedit-dev
      - libtool
      - linux-headers
      - ncurses-dev
      - net-snmp-dev
      - openssl-hardened-${{vars.openssl-version}}-dev
      - popt-dev
      - readline-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cminyard/openipmi
      tag: v${{package.version}}
      expected-commit: 7fad860a277da4a077e32174734e1cb8a3dbd83f

  # Upstream 2.0.38 no longer ships ChangeLog but Makefile.am still requires it
  # (automake strict mode), so autoreconf fails without it.
  - runs: touch ChangeLog

  - uses: autoconf/configure
    with:
      opts: |
        --disable-static \
        --with-ucdsnmp \
        --without-python

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: upstream-tests/make-check

  - uses: strip

subpackages:
  - name: openipmi-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - openipmi
        - ncurses-dev
    description: openipmi dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: openipmi-doc
    pipeline:
      - uses: split/manpages
      - runs: |
          # ipmicmd and ipmish are documented by the openipmicmd and openipmish man pages
          ln -s openipmicmd.1 "${{targets.subpkgdir}}"/usr/share/man/man1/ipmicmd.1
          ln -s openipmish.1 "${{targets.subpkgdir}}"/usr/share/man/man1/ipmish.1
    description: openipmi manpages
    test:
      pipeline:
        - uses: test/docs
        - name: ipmicmd resolves to the openipmicmd man page
          runs: man -w ipmicmd
        - name: ipmish resolves to the openipmish man page
          runs: man -w ipmish

  - name: openipmi-lanserv
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          mv "${{targets.destdir}}"/etc "${{targets.subpkgdir}}"/
          mv "${{targets.destdir}}"/usr/lib/libIPMIlanserv.so.* "${{targets.subpkgdir}}"/usr/lib/
          mv "${{targets.destdir}}"/usr/bin/ipmilan \
          	"${{targets.destdir}}"/usr/bin/ipmi_sim \
          	"${{targets.destdir}}"/usr/bin/sdrcomp \
          	"${{targets.subpkgdir}}"/usr/bin/
    description: Emulates an IPMI network listener
    test:
      pipeline:
        - name: Test sdrcomp compiles an empty SDR file
          runs: |
            # sdrcomp compiles SDR definition files to binary format.
            # An empty input file should produce an output file (with zero records).
            touch /tmp/empty.sdr
            sdrcomp -o /tmp/empty.sdr.bin /tmp/empty.sdr
            # Verify the output file was created
            test -f /tmp/empty.sdr.bin
        - name: Test sdrcomp rejects missing input file
          runs: |
            # sdrcomp should exit non-zero when the input file does not exist
            if sdrcomp -o /tmp/bad.bin /nonexistent/file.sdr 2>/dev/null; then
              echo "ERROR: sdrcomp should fail on missing input file"
              exit 1
            fi
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: cminyard/openipmi
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

test:
  pipeline:
    - name: Test openipmicmd binary is installed and runs
      runs: |
        # Verify openipmicmd is installed and the binary executes without
        # crashing. Without IPMI hardware it exits non-zero, but must not
        # segfault (exit code 139). Redirect stdin from /dev/null to prevent
        # the binary from blocking on interactive input.
        openipmicmd </dev/null 2>&1 || rc=$?
        test "${rc:-0}" -ne 139
    - uses: test/tw/ldd-check
