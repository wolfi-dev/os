# Generated from https://git.alpinelinux.org/aports/plain/community/openlibm/APKBUILD
package:
  name: openlibm
  version: "0.8.8"
  epoch: 3 # shared library naming: split libopenlibm${{vars.soversion}}
  description: High quality system independent, portable, open source libm implementation
  copyright:
    - license: MIT AND BSD-2-Clause AND ISC AND LGPL-2.1-or-later
  resources:
    cpu: "1"
    memory: 2Gi
  dependencies:
    runtime:
      - libopenlibm${{vars.soversion}}=${{package.full-version}}

vars:
  soversion: "4"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - gmp-dev
      - mpfr-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5fe399749f9276eaa0b8403e507470da05cbbb3f
      repository: https://github.com/JuliaLang/openlibm
      tag: v${{package.version}}

  - uses: autoconf/make

  - runs: |
      make VERSION=${{package.version}} DESTDIR="${{targets.destdir}}" prefix=/usr install
      rm -f "${{targets.destdir}}"/usr/lib/*.a

  # This suite reports only through make check's exit status (no automake/TAP/autotest summary).
  - uses: upstream-tests/make-check
    with:
      harness: custom

  - uses: strip

subpackages:
  - name: libopenlibm${{vars.soversion}}
    description: "openlibm shared library"
    pipeline:
      - uses: split/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: openlibm-dev
    pipeline:
      - uses: split/dev
    description: openlibm dev
    dependencies:
      runtime:
        - libopenlibm${{vars.soversion}}=${{package.full-version}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}

update:
  enabled: true
  github:
    identifier: JuliaLang/openlibm
    strip-prefix: v
    tag-filter: v
