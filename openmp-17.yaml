package:
  name: openmp-17
  version: 17.0.6
  epoch: 12
  description: "LLVM OpenMP library"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libLLVM-17
  annotations:
    # Component of the llvm-17 release; must be built from llvm-17 source.
    toolchain-stream-reconcile-optout: true

vars:
  llvm-version: "17"

environment:
  contents:
    packages:
      - binutils-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - gcc-14-default
      - glibc-2.43-dev
      - help2man
      - libffi-dev
      - libxml2-dev
      - llvm-17-dev
      - llvm-cmake-17
      - pkgconf
      - python3
      - samurai
      - wolfi-base
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/llvm/llvm-project
      tag: llvmorg-${{package.version}}
      expected-commit: 6009708b4367171ccdbf4b5905cb6a803753fe18
      sparse-paths: |
        openmp

  - working-directory: openmp
    pipeline:
      - runs: |
          cmake -B build -G Ninja -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DLLVM_COMMON_CMAKE_UTILS="/usr/lib/llvm-17/share/cmake" \
            -DCMAKE_MODULE_PATH="/usr/lib/llvm-17/share/cmake/Modules" \
            -DLLVM_CONFIG=/usr/lib/llvm-17/bin/llvm-config \
            -DLIBOMPTARGET_LLVM_INCLUDE_DIRS=/usr/lib/llvm-17/include \
            -DLLVM_INCLUDE_DIRS=/usr/lib/llvm-17/include \
            -DLIBOMP_CPPFLAGS="-I/usr/lib/llvm-17/include" \
            -DLIBOMP_INSTALL_ALIASES=OFF
      - runs: |
          cmake --build build
      - runs: |
          DESTDIR="${{targets.destdir}}" cmake --install build

  - uses: strip

subpackages:
  - name: "openmp-17-dev"
    description: "headers for openmp-17"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - openmp-17
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - openmp-17-dev
        - build-base
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test OpenMP library compilation and runtime
      runs: |
        set -euo pipefail

        tee test.c <<'EOF'
        #include <omp.h>
        #include <stdio.h>
        int main() {
            int n = omp_get_max_threads();
            printf("Max threads: %d\n", n);
            if (n <= 0) {
                printf("FAIL: omp_get_max_threads returned %d\n", n);
                return 1;
            }
            printf("SUCCESS: OpenMP runtime is functional\n");
            return 0;
        }
        EOF

        gcc -fopenmp test.c -o test
        ./test

update:
  enabled: true
  github:
    identifier: llvm/llvm-project
    strip-prefix: llvmorg-
    tag-filter: llvmorg-17
    use-tag: true
