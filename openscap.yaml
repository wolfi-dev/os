package:
  name: openscap
  version: "1.4.6"
  epoch: 0 # enable rpm probes
  description: NIST Certified SCAP 1.2 toolkit
  copyright:
    - license: LGPL-2.1-or-later
  resources:
    cpu: "1"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  openssl-version: "4.0"
  python-version: 3.13

environment:
  contents:
    packages:
      - acl-dev
      - asciidoc
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - curl-dev
      - dbus-dev
      - doxygen
      - glib-dev
      - glibc-2.44-dev
      - graphviz
      - graphviz-dev
      - libbz2-1
      - libcap-dev
      - libgcrypt-dev
      - libproc-2-0
      - libxml2-dev
      - libxslt-dev
      - openldap-dev
      - openssl-hardened-${{vars.openssl-version}}-dev
      - perl-dev
      - perl-xml-parser
      - popt-dev
      - procps
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}-dev
      - rpm-dev
      # TODO: Needed for rpm/apt scanning
      # - perl-xml-xpath
      # - opendbx-dev
      # - apt-dev
      # - libselinux
      - samurai
      - swig
      - systemd-dev
      - util-linux-dev
      - xmlsec-dev
      - xmlsec-openssl
      - yaml-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/OpenSCAP/openscap
      expected-commit: af8cd99abf97f9f2c3b44378e144e88df634f56d
      tag: ${{package.version}}

  # In offline mode (OSCAP_PROBE_ROOT) the RPM probes call chroot(), which needs
  # CAP_SYS_CHROOT. Without it the probe fails and the whole scan aborts. The
  # patch reports the RPM objects as not supported (unknown) with a warning instead.
  - uses: patch
    with:
      patches: openscap-rpm-offline-needs-sys-chroot.patch

  # Keep the pipeline's default CMAKE_BUILD_TYPE=Release: without NDEBUG,
  # OpenSCAP's SEXP_VALIDATE debug assertion re-walks the whole collected-item
  # list on every item append, making recursive file_object probes quadratic
  # (a 20k-file /usr/lib tree scans in ~10min instead of ~1s).
  - uses: cmake/configure
    with:
      opts: |
        -DENABLE_PERL=OFF \
        -DENABLE_TESTS=OFF \
        -DWITH_PCRE2=True \
        -DWITH_CRYPTO=gcrypt

  - uses: cmake/build

  - uses: cmake/install

  - name: fix python shbang
    runs: |
      # change /usr/bin/python3 to /usr/bin/python3.XX
      for f in ${{targets.destdir}}/usr/bin/*; do
        [ -f "$f" ] || continue
        sed -i '1s,^#!/usr/bin/python3$,#!/usr/bin/python${{vars.python-version}},' "$f"
        sed -i '1s,^#!/usr/sbin/python3$,#!/usr/sbin/python${{vars.python-version}},' "$f"
      done

  - uses: strip

subpackages:
  - name: ${{package.name}}-docker
    description: "A virtual with all the oscap-docker dependencies present"
    dependencies:
      runtime:
        - openscap
        - py${{vars.python-version}}-docker
        - docker-cli
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{vars.python-version}}
            imports: |
              import openscap_py
              import oscap_docker_python
        - runs: |
            oscap-docker --help

  - name: ${{package.name}}-doc
    description: ${{package.name}} manpages
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: OpenSCAP/openscap

test:
  environment:
    contents:
      packages:
        - rpm
        - setpriv
  pipeline:
    # AUTOGENERATED
    - runs: |
        oscap --version
        oscap --help
    - uses: test/pkgconf
    - uses: test/tw/ldd-check
    - name: rpminfo probe is enabled
      runs: |
        oscap --version | grep -q probe_rpminfo
    - name: rpminfo probe evaluates against an offline rpmdb
      runs: |
        # Without the RPM probe, oscap reports "rpminfo_object is not supported"
        # and the definition evaluates to unknown instead of true.
        mkdir -p /tmp/rpmroot
        rpm --root /tmp/rpmroot --initdb
        chmod -R a+rX /tmp/rpmroot
        cat > /tmp/rpm-absent.oval.xml <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <oval_definitions xmlns="http://oval.mitre.org/XMLSchema/oval-definitions-5" xmlns:oval="http://oval.mitre.org/XMLSchema/oval-common-5" xmlns:linux-def="http://oval.mitre.org/XMLSchema/oval-definitions-5#linux">
          <generator><oval:schema_version>5.11</oval:schema_version><oval:timestamp>2026-01-01T00:00:00</oval:timestamp></generator>
          <definitions>
            <definition id="oval:test:def:1" version="1" class="compliance">
              <metadata><title>package absent</title><description>rpminfo probe test</description></metadata>
              <criteria><criterion test_ref="oval:test:tst:1"/></criteria>
            </definition>
          </definitions>
          <tests>
            <linux-def:rpminfo_test id="oval:test:tst:1" version="1" check="all" check_existence="none_exist" comment="absent">
              <linux-def:object object_ref="oval:test:obj:1"/>
            </linux-def:rpminfo_test>
          </tests>
          <objects>
            <linux-def:rpminfo_object id="oval:test:obj:1" version="1"><linux-def:name>no-such-package</linux-def:name></linux-def:rpminfo_object>
          </objects>
        </oval_definitions>
        EOF
        OSCAP_PROBE_ROOT=/tmp/rpmroot oscap oval eval /tmp/rpm-absent.oval.xml | tee /tmp/rpm-absent.out
        grep -q "Definition oval:test:def:1: true" /tmp/rpm-absent.out
    - name: offline rpm scan without CAP_SYS_CHROOT reports unknown with a warning and does not abort
      runs: |
        # The RPM probes need chroot() in offline mode. Without CAP_SYS_CHROOT
        # the scan must finish with unknown and say why, not abort.
        OSCAP_PROBE_ROOT=/tmp/rpmroot setpriv --reuid=65532 --regid=65532 --clear-groups \
          oscap oval eval /tmp/rpm-absent.oval.xml 2>&1 | tee /tmp/rpm-nocap.out
        grep -q "needs the CAP_SYS_CHROOT capability" /tmp/rpm-nocap.out
        grep -q "Definition oval:test:def:1: unknown" /tmp/rpm-nocap.out
