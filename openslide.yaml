package:
  name: openslide
  version: "4.0.1"
  epoch: 0
  description: C library for reading whole slide images used in digital pathology
  copyright:
    - license: LGPL-2.1-only
  resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cairo-dev
      - glib-dev
      - libdicom-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libxml2-dev
      - meson
      - openjpeg-dev
      - sqlite-dev
      - tiff-dev
      - zlib-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openslide/openslide
      tag: v${{package.version}}
      expected-commit: fe79a9713bef2bfd64bbfefd15704060764b1274

  - uses: meson/configure
    with:
      opts: -Dtest=disabled -Ddoc=disabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: openslide-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - openslide
    description: openslide dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/header-check

  - name: openslide-doc
    pipeline:
      - uses: split/manpages
    description: openslide manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: openslide/openslide
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - build-base
        - openslide-dev
        - pkgconf
        - tiff
  pipeline:
    - uses: test/tw/ldd-check
    - name: Check the tools run
      runs: |
        slidetool --version 2>&1 | grep -F "${{package.version}}"
        slidetool --help
        openslide-show-properties --help
        openslide-quickhash1sum --help
        openslide-write-png --help
    - name: Read a generated tiled TIFF as a generic-tiff slide
      runs: |
        # A 64x64 RGB image, tiled 16x16, is the smallest slide OpenSlide accepts.
        { printf 'P6\n64 64\n255\n'; head -c 12288 /dev/zero | tr '\0' '\200'; } > slide.ppm
        ppm2tiff slide.ppm strips.tif
        tiffcp -t -w 16 -l 16 strips.tif slide.tif
        slidetool prop list slide.tif | tee props.txt
        grep -F "openslide.vendor: 'generic-tiff'" props.txt
        grep -F "openslide.level[0].width: '64'" props.txt
        slidetool region read slide.tif 0 0 0 32 32 region.png
        test -s region.png
    - name: Compile, link and query the library version
      runs: |
        tee test_openslide.c <<'EOT'
        #include <openslide.h>
        #include <stdio.h>
        #include <string.h>

        int main(void) {
            const char *version = openslide_get_version();
            printf("openslide %s\n", version);
            if (strcmp(version, "${{package.version}}") != 0) {
                fprintf(stderr, "FAIL: expected ${{package.version}}\n");
                return 1;
            }
            if (openslide_detect_vendor("/nonexistent") != NULL) {
                fprintf(stderr, "FAIL: detected a vendor for a missing file\n");
                return 1;
            }
            return 0;
        }
        EOT
        gcc test_openslide.c -o test_openslide $(pkg-config --cflags --libs openslide)
        ./test_openslide
