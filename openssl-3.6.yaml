package:
  name: openssl-3.6
  version: "3.6.5"
  epoch: 1
  description: "meta package to switch to version stream"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openssl~3.6
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi
  annotations:
    toolchain-stream: true
    toolchain-stream-pkgs: ${{package.name}}-dev

subpackages:
  - name: openssl-3.6-dev
    description: "meta package for toolchain stream reconciler"
    dependencies:
      runtime:
        - openssl-dev~3.6
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/metapackage

update:
  enabled: false
  exclude-reason: "transitional meta-package"
