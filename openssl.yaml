package:
  name: openssl
  # NOTE: IF YOU UPDATE OPENSSL, DO REVERSE DEPENDENCY TESTS TO ENSURE THERE ARE
  #       NO REGRESSIONS BEFORE YOU MERGE A NEW VERSION. INSTRUCTIONS HERE:
  #
  #       https://chainguard.engineering/docs/packages/playbooks/core-components/openssl-updates/
  version: "3.6.4"
  epoch: 3
  description: "the OpenSSL cryptography suite"
  copyright:
    - license: Apache-2.0
  dependencies:
    # For apk upgrades
    replaces:
      - openssl-config<3.4.0
    replaces-priority: 5
  resources:
    cpu: "10"
    memory: 7Gi
  test-resources:
    cpu: "3"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - jitterentropy-library-dev
      - perl
  environment:
    # To support automatic discovery of source code in debug symbols
    # packaged in openssl-dbg, build with debug symbols &
    # file-prefix-map. Also see "Create dbg sourcecode" and
    # split/debug.
    CFLAGS: "-g -ffile-prefix-map=/home/build=/usr/src/${{package.name}}"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openssl/openssl
      tag: openssl-${{package.version}}
      expected-commit: d3c1b1169b3569ff3069e5b399f47b2b28e03d79

  - uses: patch
    with:
      patches: |
        0001-baseprovider-add-MD5-and-SHA1.patch
        0001-fips-block-HMAC-calculation-with-unapproved-digests.patch
        0001-fips-retain-FIPS-140-2-TLSv1.2-connectivity.patch

  - name: Perform throw-away canary tests of jitter and non-validated fips
    runs: |
      if [ -d /usr/lib/oldglibc ]; then
        # all the jitter stuff assumes glibc 2.34+
        exit 0
      fi
      mkdir -p build-jitter-fips-tests/
      cd build-jitter-fips-tests/
      ../Configure --with-rand-seed=none enable-jitter enable-fips-jitter enable-fips -DOPENSSL_DEFAULT_SEED_SRC=JITTER --debug
      make -s -j$(nproc)
      make tests HARNESS_JOBS=10
      cd ../
      rm -rf build-jitter-fips-tests/

  - name: Configure and build
    runs: |
      perl ./Configure \
         linux-${{build.arch}} \
         --prefix=/usr \
         --libdir=lib \
         --openssldir=/etc/ssl \
         enable-ktls \
         shared \
         enable-pie \
         no-zlib \
         no-async \
         no-comp \
         no-idea \
         no-mdc2 \
         no-rc5 \
         no-ec2m \
         no-sm2 \
         no-sm4 \
         no-ssl3 \
         no-seed \
         no-weak-ssl-ciphers \
         -Wa,--noexecstack
      perl configdata.pm --dump

      # Create generated .c from .c.in
      make build_all_generated

      # Create debug sources after creating all the generated .c from .c.in
      SRCDIR=$(mktemp -d)
      cp -r . $SRCDIR/
      mkdir -p ${{targets.destdir}}-dbg/usr/src/
      mv $SRCDIR ${{targets.destdir}}-dbg/usr/src/${{package.name}}
      # Note that mktemp -d created it as 700, whilst the contents
      # inside is 644 for files and 755 for dirs, without this gdb
      # doesn't work for non-root user, fix this up.
      chmod 755 ${{targets.destdir}}-dbg/usr/src/${{package.name}}

      # Continue building everything
      make -j$(nproc)
      make tests HARNESS_JOBS=10

  - name: Fix compatibility with AWS, whilst we fix openssl.cnf config location
    uses: patch
    with:
      patches: |
        0001-Remove-pre-share-from-default-TLS-groups.patch

  - runs: |
      # Finish the build
      make -j$(nproc)

  - uses: autoconf/make-install

  - runs: |
      rm ${{targets.destdir}}/usr/bin/c_rehash
      # Effectively no-op config file, which matches fallback behaviour
      # The CA cert generation options are not fit for any certs
      rm ${{targets.destdir}}/etc/ssl/openssl.cnf
      # Second identical copy of the above
      rm ${{targets.destdir}}/etc/ssl/openssl.cnf.dist
      # Empty CT log
      rm ${{targets.destdir}}/etc/ssl/ct_log_list.cnf
      # Second copy of CT log
      rm ${{targets.destdir}}/etc/ssl/ct_log_list.cnf.dist
      # Remove engines, deprecated and will be removed in OpenSSL 4
      rm -r "${{targets.destdir}}"/usr/lib/engines-3
      # Keeping etc/ssl/misc CA.pl & tsget perl scripts
      # without depending on perl, here in openssl package
      # This now makes openssl-config empty package, remove it
      # This also removes the need to have things coupled with
      # openssl-config-fipshardened going forward.

      # strip omitted: because we use split/debug to ship debug symbols for certification

subpackages:
  - name: "openssl-dbg"
    description: "OpenSSL debug symbols"
    pipeline:
      - uses: split/debug
    test:
      environment:
        contents:
          packages:
            - openssl
            - gdb
      pipeline:
        - uses: test/tw/debugpackage
        - name: Test gdb usage
          runs: |
            # Possibly python gdb would be easier to read
            cat <<EOF >openssl.gdb
            set pagination off
            set logging file gdb.log
            set logging enabled on
            set width 0
            set height 0
            set verbose on
            set breakpoint pending on
            break syscall_random
            commands 1
              continue
            end
            run rand -hex 8
            EOF
            gdb --batch --command ./openssl.gdb openssl
            # Assert that breakpoint worked
            grep -q 'Breakpoint 1,' gdb.log || exit 1

  - name: "openssl-doc"
    description: "OpenSSL documentation"
    pipeline:
      - uses: split/manpages
      - runs: |
          mv "${{targets.destdir}}"/usr/share/doc "${{targets.subpkgdir}}"/usr/share
    test:
      pipeline:
        - uses: test/tw/docs

  - name: "libcrypto3"
    description: "OpenSSL libcrypto library"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libcrypto.so.3 "${{targets.subpkgdir}}"/usr/lib
          # Provide our hardened configuration for ca & req apps
          mkdir -p "${{targets.subpkgdir}}"/etc/ssl
          cp openssl.cnf ca.cnf ${{targets.subpkgdir}}/etc/ssl/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: "libssl3"
    description: "OpenSSL libssl library"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libssl.so.3 "${{targets.subpkgdir}}"/usr/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: "openssl-dev"
    description: "OpenSSL headers"
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: "openssl-provider-legacy"
    description: "OpenSSL legacy provider"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/ossl-modules
          mv "${{targets.destdir}}"/usr/lib/ossl-modules/legacy.so "${{targets.subpkgdir}}"/usr/lib/ossl-modules/
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - binutils # nm for is-eco-build
        - curl
        - gdb
        - git
        - openssl-dbg
        - wget
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/hardening-check
      with:
        package-match: "^openssl$\\|libssl3"
    - uses: test/hardening-check
      with:
        # jitterentropy is without CF protection so far
        args: "--nocfprotection"
        package-match: "^libcrypto3$"
    - runs: |
        openssl --version
        openssl --help
    - name: Measure the size of the first ClientHello
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /tmp/clienthello
          openssl req -x509 -newkey rsa:2048 -noenc -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout /tmp/clienthello/server.key \
            -out /tmp/clienthello/server.crt
        start: /usr/bin/openssl s_server -accept 127.0.0.1:4433 -naccept 10 -www -cert /tmp/clienthello/server.crt -key /tmp/clienthello/server.key
        # s_server prints this once the listening socket is bound.
        expected_output: ACCEPT
        post: |
          # A ClientHello that does not fit into a single TCP segment gets
          # silently dropped by some middleboxes, AWS Network Firewall among
          # them. An IPv6 header (40 bytes) and a TCP header with options (32
          # bytes) leave 1428 bytes of a 1500 byte MTU, so keep margin below
          # that.
          max_clienthello=1400

          # Handshake against the local server with every record dumped, then
          # report how big the first ClientHello was. -msg prints the length
          # of the handshake message, e.g.
          #   >>> TLS 1.3, Handshake [length 0111], ClientHello
          # to which the 5 byte TLS record header is added for the size that
          # actually goes out on the wire.
          clienthello_size() {
            log=/tmp/clienthello/client.log
            OPENSSL_CONF="$1" openssl s_client -connect 127.0.0.1:4433 \
              -servername localhost -CAfile /tmp/clienthello/server.crt -msg \
              </dev/null >"$log" 2>&1
            grep -q "Verify return code: 0 (ok)" "$log"
            hexlen=$(sed -n '/^>>> TLS.*, Handshake \[length .*\], ClientHello$/ {
                       s/.*\[length \([0-9a-f]*\)\].*/\1/p; q; }' "$log")
            if [ -z "$hexlen" ]; then
              echo "no ClientHello found in s_client -msg output" >&2
              cat "$log" >&2
              return 1
            fi
            echo $((0x$hexlen + 5))
          }

          # What everything linked against libssl gets, by way of the
          # openssl.cnf shipped in libcrypto3.
          size="$(clienthello_size /etc/ssl/openssl.cnf)"
          echo "first ClientHello with /etc/ssl/openssl.cnf: $size bytes"
          [ "$size" -le "$max_clienthello" ]

          # And what applications opting out of the system configuration get
          # from the group list compiled into libssl.
          size="$(clienthello_size /dev/null)"
          echo "first ClientHello with built-in defaults: $size bytes"
          [ "$size" -le "$max_clienthello" ]
    - name: Verify curl still works
      runs: |
        curl -I https://github.com/openssl/openssl
        ! curl https://expired.badssl.com/
        curl --http3-only -s -o /dev/null https://cloudflare-quic.com/
    - name: Verify git still works
      runs: |
        git ls-remote --exit-code https://github.com/openssl/openssl refs/tags/openssl-${{package.version}}
    - name: Verify wget still works
      runs: |
        wget -O /dev/null https://github.com/openssl/openssl
        ! wget https://expired.badssl.com/
    - name: docker-dind certificate generation
      runs: |
        # Distilled from dockerd-entrypoint.sh
        set -x
        tmpdir="$(mktemp -d)"
        trap "rm -rf "$tmpdir"" EXIT
        rm -rf "$tmpdir/certs/"
        mkdir -p "$tmpdir/certs/ca"
        openssl genrsa -out "$tmpdir/certs/ca/key.pem" 4096
        openssl req -new -key "$tmpdir/certs/ca/key.pem" \
          -out "$tmpdir/certs/ca/cert.pem" -subj '/CN=docker:dind CA' \
          -x509 -days 825
        mkdir -p "$tmpdir/certs/server"
        openssl genrsa -out "$tmpdir/certs/server/key.pem" 4096
        openssl req -new -key "$tmpdir/certs/server/key.pem" \
          -out "$tmpdir/certs/server/csr.pem" -subj '/CN=docker:dind server'
        cat << EOF >"$tmpdir/certs/server/openssl.cnf"
        [ x509_exts ]
        subjectAltName = DNS:b51ddd7b8dcd,DNS:docker,DNS:localhost,IP:127.0.0.1,IP:172.17.0.4,IP:::1
        EOF
        openssl x509 -req -in "$tmpdir/certs/server/csr.pem"\
          -CA "$tmpdir/certs/ca/cert.pem" -CAkey "$tmpdir/certs/ca/key.pem" \
          -CAcreateserial -out "$tmpdir/certs/server/cert.pem" \
          -days 825 -extfile "$tmpdir/certs/server/openssl.cnf" \
          -extensions x509_exts
        cp "$tmpdir/certs/ca/cert.pem" "$tmpdir/certs/server/ca.pem"
        openssl verify -CAfile "$tmpdir/certs/server/ca.pem" \
          "$tmpdir/certs/server/cert.pem"

update:
  enabled: true
  github:
    identifier: openssl/openssl
    strip-prefix: openssl-
    tag-filter-prefix: openssl-3.6.
