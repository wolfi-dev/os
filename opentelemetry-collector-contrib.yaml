package:
  name: opentelemetry-collector-contrib
  version: "0.160.0"
  epoch: 0 # toolchain rebuild for  go-1.26-1.26.8
  description: Contrib repository for the OpenTelemetry Collector
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "27"
    memory: 28Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-collector-contrib
      tag: v${{package.version}}
      expected-commit: 982f20b8a8e8a2569fab3e27cf8b008e8a5080c1

  # https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/35631
  - runs: |
      make genotelcontribcol

  # hamba/avro/v2 is archived with no upstream fix for CVE-2026-46384,
  # CVE-2026-46385, and GO-2026-5048; migrate to the maintained fork, matching the
  # replace the upstream pulsar receiver/exporter modules already carry.
  - uses: bump
    with:
      modroot: ./cmd/otelcontribcol
      replaces: github.com/hamba/avro/v2=github.com/iskorotkov/avro/v2@v2.33.0

  - uses: go/build
    with:
      modroot: ./cmd/otelcontribcol
      packages: .
      output: otelcol-contrib
      go-package: go

subpackages:
  - name: opentelemetry-collector-contrib-compat
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    pipeline:
      - runs: |
          # The helm chart expects the binaries to be in / instead of /usr/bin
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/otelcol-contrib ${{targets.subpkgdir}}/otelcol-contrib
    test:
      environment:
        contents:
          packages:
            # -compat packages can be satisfied by multiple source packages; install here for test only, not as a runtime dep
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-collector-contrib
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: otelcol-contrib
    - name: Test collector daemon startup
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /etc/otelcol-contrib
          tee /etc/otelcol-contrib/config.yaml <<'EOF'
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318

          processors:
            batch:

          exporters:
            debug:
              verbosity: basic

          extensions:
            health_check:
              endpoint: 0.0.0.0:13133

          service:
            extensions: [health_check]
            pipelines:
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]
          EOF
        start: /usr/bin/otelcol-contrib --config /etc/otelcol-contrib/config.yaml
        timeout: "30"
        expected_output: Everything is ready
        post: |
          wait-for-it localhost:13133 -t 10
          curl -sf http://localhost:13133/

environment:
  contents:
    packages:
      - bash
      - glibc-2.43-dev
      - go-1.26
