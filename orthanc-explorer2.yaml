package:
  name: orthanc-explorer2
  version: "1.13.0"
  epoch: 2 # glibc: 2.43->2.44
  description: Modern web interface for Orthanc DICOM server - Enhanced Explorer
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    runtime:
      - orthanc

vars:
  nodejs-version: "26"
  python-version: "3.13"

environment:
  contents:
    packages:
      - boost-dev~1.88
      - boost-system
      - build-base
      - busybox
      - curl-dev
      - e2fsprogs-dev
      - glibc-2.44-dev
      - gtest-dev
      - jsoncpp-dev
      - libuuid
      - mercurial
      - nodejs-${{vars.nodejs-version}}
      - npm
      - orthanc-dev
      - patch
      - python-${{vars.python-version}}
      - util-linux-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/orthanc-server/orthanc-explorer-2
      tag: ${{package.version}}
      expected-commit: a861c4d4b35b42155f0d6ef18841e34d88654c01

  - name: Build web assets
    runs: |
      cd WebApplication
      npm install --no-audit --no-fund
      npm run build

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DALLOW_DOWNLOADS=ON \
        -DUSE_SYSTEM_ORTHANC_SDK=ON \
        -DUSE_SYSTEM_JSONCPP=ON \
        -DUSE_SYSTEM_BOOST=ON

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility symlinks for Orthanc Explorer2 plugin
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share/orthanc/plugins-available/
          ln -sf /usr/share/orthanc/plugins/libOrthancExplorer2.so ${{targets.subpkgdir}}/usr/share/orthanc/plugins-available/
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - runs: readlink -f /usr/share/orthanc/plugins-available/libOrthancExplorer2.so | grep -F "/usr/share/orthanc/plugins/libOrthancExplorer2.so"

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        mkdir -p /tmp/orthanc-explorer2-test

        cat > /tmp/orthanc-explorer2.json << 'EOF'
        {
          "Name": "Explorer2Test",
          "HttpPort": 18056,
          "DicomPort": 14256,
          "RemoteAccessAllowed": true,
          "AuthenticationEnabled": false,
          "Plugins": ["/usr/share/orthanc/plugins/libOrthancExplorer2.so"],
          "OrthancExplorer2": {
            "Enable": true,
            "IsDefaultOrthancUI": true,
            "Theme": "light",
            "UiOptions": {
              "EnableOpenInOhifViewer3": false,
              "EnableOpenInMedDreamViewer": false,
              "StudyListSearchMode": "search-button",
              "StudyListContentIfNoSearch": "most-recents",
              "MaxStudiesDisplayed": 100,
              "MaxMyJobsHistorySize": 5,
              "EnableShares": false,
              "EnableUpload": true,
              "EnableDownloadZip": true,
              "EnableDeleteResources": true,
              "EnableApiViewMenu": true,
              "EnableSettings": true
            },
            "Tokens": {
              "InstantLinksValidity": 3600,
              "ShareDuration": 0
            },
            "Permissions": {
              "AnonymousCanDownload": true,
              "AnonymousCanUpload": true
            },
            "Modifications": {
              "EnableModification": true,
              "EnableAnonymization": true,
              "PatientMainTags": ["PatientID", "PatientName", "PatientBirthDate"],
              "StudyMainTags": ["StudyDate", "StudyTime", "StudyDescription", "AccessionNumber"],
              "SeriesMainTags": ["SeriesDescription", "SeriesNumber", "Modality"]
            }
          },
          "StorageDirectory": "/tmp/orthanc-explorer2-test",
          "IndexDirectory": "/tmp/orthanc-explorer2-test"
        }
        EOF
    - uses: test/daemon-check-output
      with:
        start: /usr/bin/Orthanc /tmp/orthanc-explorer2.json --no-jobs
        timeout: 30
        expected_output: |
          Orthanc has started
          Loading plugin
          HTTP server listening
        post: |
          # Test Explorer2 specific endpoint (from documentation)
          if ! curl -s http://localhost:18056/ui/app/ | grep -F "html"; then
            echo "ERROR: Explorer2 app endpoint not accessible"
            exit 1
          fi
          echo "Explorer2 app endpoint accessible"

          # Test legacy UI coexistence (from documentation)
          if ! curl -s http://localhost:18056/app/explorer.html | grep -F "html"; then
            echo "ERROR: Legacy UI not accessible"
            exit 1
          fi
          echo "Legacy UI still accessible"

          # Test system endpoint still works
          if ! curl -s http://localhost:18056/system | grep -F "Version"; then
            echo "ERROR: Orthanc system endpoint did not return Version"
            exit 1
          fi
          echo "Orthanc core functionality intact"

          # Test plugin listing
          if ! curl -s http://localhost:18056/plugins | grep -Fi "explorer"; then
            echo "ERROR: Explorer2 plugin not listed in plugins"
            exit 1
          fi
          echo "Explorer2 plugin listed in plugins"

update:
  enabled: true
  github:
    identifier: orthanc-server/orthanc-explorer-2
