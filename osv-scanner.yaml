package:
  name: osv-scanner
  version: "2.7.0"
  epoch: 3
  description: Vulnerability scanner written in Go which uses the data provided by https://osv.dev
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      expected-commit: bfe2f84abd2f09fe0b83ba7f6dad40d296762f40
      tag: v${{package.version}}
      repository: https://github.com/google/osv-scanner

  - uses: bump
    with:
      language: go
      deps: golang.org/x/net@v0.60.0

  - uses: go/build
    with:
      packages: ./cmd/osv-scanner/
      output: osv-scanner
      go-package: go-1.27

  - uses: go/build
    with:
      packages: ./cmd/osv-reporter/
      output: osv-reporter
      go-package: go-1.27

subpackages:
  - name: ${{package.name}}-reporter
    description: osv-reporter, which generates osv-scanner GitHub Action output
    pipeline:
      - runs: |
          # Upstream ships osv-reporter only in its Action image, not ghcr.io/google/osv-scanner.
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/osv-reporter ${{targets.subpkgdir}}/usr/bin/
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: osv-reporter
        - uses: test/tw/help-check
          with:
            bins: osv-reporter

  - name: ${{package.name}}-compat
    description: Upstream container entrypoint compatibility
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - runs: |
          # Upstream's image (goreleaser.dockerfile) places the binary at / and
          # sets ENTRYPOINT ["/osv-scanner"]; provide that path as a symlink.
          mkdir -p "${{targets.contextdir}}"
          ln -sf ./usr/bin/osv-scanner "${{targets.contextdir}}/osv-scanner"
    test:
      pipeline:
        - uses: test/tw/symlink-check
        - uses: test/tw/ver-check
          with:
            bins: /osv-scanner
        - uses: test/tw/help-check
          with:
            bins: /osv-scanner
            help-flag: --help
            expect-contains: "USAGE:"

update:
  enabled: true
  github:
    identifier: google/osv-scanner
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: osv-scanner
    - uses: test/tw/help-check
      with:
        bins: osv-scanner
        help-flag: --help
        expect-contains: "USAGE:"
