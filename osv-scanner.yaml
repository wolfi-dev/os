package:
  name: osv-scanner
  version: "2.5.0"
  epoch: 1 # GO-2026-5972
  description: Vulnerability scanner written in Go which uses the data provided by https://osv.dev
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a258868211a57052da6bd323f758b8388dee02bb
      tag: v${{package.version}}
      repository: https://github.com/google/osv-scanner

  - uses: go/build
    with:
      packages: ./cmd/osv-scanner/
      output: osv-scanner
      go-package: go-1.26

  - uses: go/build
    with:
      packages: ./cmd/osv-reporter/
      output: osv-reporter
      go-package: go-1.26

update:
  enabled: true
  github:
    identifier: google/osv-scanner
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: osv-scanner osv-reporter
    - uses: test/tw/help-check
      with:
        bins: osv-reporter
    - uses: test/tw/help-check
      with:
        bins: osv-scanner
        help-flag: --help
        expect-contains: "USAGE:"
