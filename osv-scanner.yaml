package:
  name: osv-scanner
  version: "2.6.0"
  epoch: 2 # CVE-2026-78659
  description: Vulnerability scanner written in Go which uses the data provided by https://osv.dev
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e840a6e8adb14b7777c78e26cfbf6e2abc1d1fc6
      tag: v${{package.version}}
      repository: https://github.com/google/osv-scanner

  - uses: bump
    with:
      language: go
      deps: golang.org/x/net@v0.60.0

  - uses: go/build
    with:
      packages: ./cmd/osv-scanner/
      output: osv-scanner
      go-package: go-1.27

  - uses: go/build
    with:
      packages: ./cmd/osv-reporter/
      output: osv-reporter
      go-package: go-1.27

update:
  enabled: true
  github:
    identifier: google/osv-scanner
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: osv-scanner osv-reporter
    - uses: test/tw/help-check
      with:
        bins: osv-reporter
    - uses: test/tw/help-check
      with:
        bins: osv-scanner
        help-flag: --help
        expect-contains: "USAGE:"
