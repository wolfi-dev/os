package:
  name: owfs
  version: 3.2.4
  epoch: 7
  description: OWFS — the one-wire filesystem
  copyright:
    - license: GPL-2.0-only
  resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - fuse3-dev
      - glibc-2.43-dev
      - libtool
      - linux-headers
      - pkgconf-dev

# convert version to use p, e.g. 3.2.4 to 3.2p4
var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.(\d+)$
    replace: ${1}p${2}
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/owfs/owfs
      expected-commit: c68deb1fc6d30fcc5eabe0a0d9c9dc2ca54e455a
      tag: v${{vars.mangled-package-version}}

  - runs: autoreconf -vif

  - uses: autoconf/configure
    with:
      opts: |
        --with-fuseinclude=/usr/include \
        --with-fuselib=/usr/lib

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: owfs-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - owfs
    description: owfs dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: owfs-doc
    pipeline:
      - uses: split/manpages
    description: owfs manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  version-transform:
    - match: p(\d+)$
      replace: .$1
  github:
    identifier: owfs/owfs
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - wait-for-it
  pipeline:
    - name: Test owserver with fake devices and owdir/owread clients
      uses: test/daemon-check-output
      with:
        setup: |
          owserver --fake DS18S20 --port 4304 --foreground >/tmp/owserver.log 2>&1 &
          wait-for-it localhost:4304 -t 30
        start: owdir --server=localhost:4304 /
        expected_output: "/"
        timeout: "30"
        post: |
          # Find the first fake DS18S20 device (family code 10) and read its temperature
          device=$(owdir --server=localhost:4304 / | grep "^/10\." | head -1)
          owread --server=localhost:4304 "${device}/temperature"
    - uses: test/tw/ldd-check
