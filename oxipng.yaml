package:
  name: oxipng
  version: "10.2.0"
  epoch: 1 # glibc: 2.43->2.44
  description: Multithreaded PNG optimizer written in Rust
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 7Gi

vars:
  rust-version: "1.97"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/shssoichiro/oxipng
      tag: v${{package.version}}
      expected-commit: 340cd9878d8d8289f09fa101b48a8f5f0b7783f4

  - uses: bump
    with:
      deps: |-
        crossbeam-channel@0.5.15

  - uses: cargo/build
    with:
      output: ${{package.name}}
      rustflags: "-C linker=/usr/local/bin/gcc"

  - uses: strip

update:
  enabled: true
  github:
    identifier: shssoichiro/oxipng
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - imagemagick
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify oxipng version
      runs: |
        oxipng --version | grep "${{package.version}}"
    - name: Create a dummy PNG file
      runs: |
        magick -size 100x100 xc:blue test.png
    - name: Optimize the PNG file
      runs: |
        oxipng --filters 6 test.png --out optimized.png
    - name: Check the optimized file size
      runs: |
        { test -s optimized.png && \
          test $(stat -c%s optimized.png) -lt $(stat -c%s test.png); } || \
          exit 1
