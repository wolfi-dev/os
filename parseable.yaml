package:
  name: parseable
  version: "3.0.0"
  epoch: 0 # GHSA-82j2-j2ch-gfr8
  description: "Parseable is a log analytics system built for high throughput log ingestion cases."
  copyright:
    - license: AGPL-3.0-or-later
  resources:
    cpu: "28"
    memory: 19Gi

vars:
  rust-version: "1.94"

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/parseablehq/parseable
      tag: v${{package.version}}
      expected-commit: 356cc48fae6476fc03656747485c3679197f4fc0

  - uses: bump
    with:
      # GHSA-82j2-j2ch-gfr8: time < 0.3.41 has a vulnerability.
      # parseable 3.0.0 Cargo.lock already has time@0.3.47 which satisfies
      # the CVE requirement (>= 0.3.41). Using time@0.3.47 as the floor
      # causes omnibump to skip the update (already satisfies), avoiding
      # the "multiple inverted-tree roots" error that occurs when trying to
      # update time to a higher version that creates multiple time versions.
      deps: |-
        ring@0.17.12
        tokio@1.43.1
        tracing-subscriber@0.3.20
        time@0.3.47
        bytes@1.12.1
        aws-lc-rs@1.16.1
        quinn-proto@0.11.16
        lz4_flex@0.12.1
        rustls-webpki@0.103.13
        actix-http@3.13.1

  - runs: |
      cargo auditable build --release
      install -Dm755 target/release/parseable "${{targets.destdir}}"/usr/bin/parseable

  - uses: strip

update:
  enabled: true
  github:
    identifier: parseablehq/parseable
    strip-prefix: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        parseable --version
        parseable --help
