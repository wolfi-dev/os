package:
  name: patch
  version: "2.8.1"
  epoch: 0 # upstream-tests/make-check
  description: "GNU patch"
  copyright:
    - license: GPL-3.0-or-later
  resources:
    cpu: "2"
    memory: 6Gi

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - ed # tests/ed-style uses ed
      - glibc-2.44-dev
      - python3
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.savannah.gnu.org/git/patch.git
      tag: v${{package.version}}
      expected-commit: c2910144fe782b76222a694e59ae3d3fb94bca70

  - uses: git/gnulib-bootstrap
    with:
      # patch 2.8.1 pins a gnulib submodule commit that the packaged gnulib snapshot lacks
      gnulib-git-repo-url: https://github.com/coreutils/gnulib.git

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: upstream-tests/make-check

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: patch-doc
    description: patch docs
    pipeline:
      - uses: split/alldocs
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  git:
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: patch
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: patch
    - uses: test/tw/ldd-check
    - name: Functional test - apply a patch to a file
      runs: |
        echo "Hello world" > original.txt
        cat > test.patch <<'EOF'
        --- original.txt
        +++ patched.txt
        @@ -1 +1 @@
        -Hello world
        +Hello patched world
        EOF
        patch original.txt test.patch
        grep -F "Hello patched world" original.txt
