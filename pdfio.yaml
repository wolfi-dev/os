package:
  name: pdfio
  version: "1.6.5"
  epoch: 2 # upstream-tests/make-check
  description: Small, simple C library for reading and writing PDF files
  copyright:
    - license: Apache-2.0

vars:
  glibc-version: "2.44"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - libpng-dev
      - pkgconf
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/michaelrsweet/pdfio
      tag: v${{package.version}}
      expected-commit: 5102eddff28d9b605f3e6783d50ad380f61f692e

  - uses: autoconf/configure
    with:
      opts: |
        --enable-shared \
        --disable-static \
        --enable-libpng

  - uses: autoconf/make

  - uses: autoconf/make-install

  # This suite reports only through make check's exit status (no automake/TAP/autotest summary).
  - uses: upstream-tests/make-check
    with:
      target: test
      harness: custom

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: Development files for ${{package.name}}
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
        # pdfio.pc lists libpng and zlib in Requires.private.
        - libpng-dev
        - zlib-dev
    test:
      environment:
        contents:
          packages:
            - pkgconf
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - name: pkg-config reports the packaged version
          runs: |
            modversion=$(pkg-config --modversion pdfio)
            echo "pdfio modversion: $modversion"
            [ "$modversion" = "${{package.version}}" ]
            pkg-config --libs pdfio | grep -F -- "-lpdfio"

  - name: ${{package.name}}-doc
    description: Documentation, examples and man page for ${{package.name}}
    pipeline:
      - uses: split/alldocs
    test:
      pipeline:
        - uses: test/tw/docs

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-dev
        - build-base
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - name: Create, reopen and inspect a PDF through libpdfio
      runs: |
        cat > pdftest.c <<'EOF'
        #include <pdfio.h>
        #include <pdfio-content.h>
        #include <stdio.h>
        #include <string.h>

        int main(void) {
          pdfio_rect_t media = { 0.0, 0.0, 612.0, 792.0 };
          pdfio_file_t *pdf = pdfioFileCreate("out.pdf", "1.7", &media, &media, NULL, NULL);
          if (!pdf) { fputs("pdfioFileCreate failed\n", stderr); return 1; }
          pdfioFileSetTitle(pdf, "melange pdfio test");

          pdfio_stream_t *st = pdfioFileCreatePage(pdf, NULL);
          if (!st) { fputs("pdfioFileCreatePage failed\n", stderr); return 1; }
          pdfioContentSetFillColorRGB(st, 1.0, 0.0, 0.0);
          pdfioContentPathRect(st, 72.0, 72.0, 200.0, 100.0);
          pdfioContentFill(st, false);
          if (!pdfioStreamClose(st)) { fputs("pdfioStreamClose failed\n", stderr); return 1; }
          if (!pdfioFileClose(pdf)) { fputs("pdfioFileClose failed\n", stderr); return 1; }

          pdf = pdfioFileOpen("out.pdf", NULL, NULL, NULL, NULL);
          if (!pdf) { fputs("pdfioFileOpen failed\n", stderr); return 1; }
          size_t pages = pdfioFileGetNumPages(pdf);
          const char *title = pdfioFileGetTitle(pdf);
          printf("pages=%u title=%s version=%s\n", (unsigned)pages,
                 title ? title : "(null)", pdfioFileGetVersion(pdf));
          if (pages != 1) return 1;
          if (!title || strcmp(title, "melange pdfio test")) return 1;
          pdfioFileClose(pdf);

          /* A non-PDF input must be rejected rather than parsed. */
          FILE *f = fopen("bogus.pdf", "w");
          fputs("this is not a pdf\n", f);
          fclose(f);
          if (pdfioFileOpen("bogus.pdf", NULL, NULL, NULL, NULL)) {
            fputs("bogus file was accepted\n", stderr);
            return 1;
          }
          puts("PDFIO-OK");
          return 0;
        }
        EOF
        cflags="$(pkg-config --cflags pdfio)"
        libs="$(pkg-config --libs pdfio)"
        # shellcheck disable=SC2086
        gcc $cflags pdftest.c -o pdftest $libs
        ./pdftest > result.txt
        cat result.txt
        grep -F "pages=1 title=melange pdfio test" result.txt
        grep -F "PDFIO-OK" result.txt
        head -c 8 out.pdf | grep -F "%PDF-1.7"

update:
  enabled: true
  github:
    identifier: michaelrsweet/pdfio
    strip-prefix: v
