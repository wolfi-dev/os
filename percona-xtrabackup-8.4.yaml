# The -base subpackage installs versioned binaries (e.g. xtrabackup-<major.minor>) to
# make this package co-installable with other percona-xtrabackup versions.
# Percona XtraDB Cluster's wsrep_sst_xtrabackup-v2 SST script requires both
# the current and previous LTS xtrabackup versions at startup (via
# verify_pxb_version), so both -base packages must be installed together.
package:
  name: percona-xtrabackup-8.4
  version: "8.4.0.5"
  epoch: 12 # enable LTO
  description: Open source hot backup tool for InnoDB and XtraDB databases
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - percona-xtrabackup=${{package.full-version}}
    runtime:
      - ${{package.name}}-base=${{package.full-version}}
  resources:
    # https://go/wolfi-rsc/percona-xtrabackup-8.4
    cpu: 30
    memory: 64Gi # LTO: ~31 parallel compiles of this MySQL tree peak near 46 GiB on aarch64
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  openssl-version: "4.0"
  # Major of the libssl/libcrypto soname the binaries must link; keep in step with openssl-version.
  openssl-soversion: "4"
  python-version: "3.13"

# Replace the last `.` with `-` to fetch the correct tag.
var-transforms:
  - from: ${{package.version}}
    match: '^(\d+\.\d+)\..*$'
    replace: "$1"
    to: major-minor
  - from: ${{package.version}}
    match: '\.(\d+)$'
    replace: "-$1"
    to: mangled-package-version

environment:
  contents:
    packages:
      - abseil-cpp-dev
      - bison
      - build-base
      - busybox
      - ca-certificates
      - clang-23-extras
      - cmake
      - curl-dev
      - glibc-2.44
      - glibc-2.44-dev
      - hardening-check
      - icu-dev
      - libaio-dev
      - libedit-dev
      - libev-dev
      - libfido2-dev
      - libgcrypt-dev
      - lz4-dev
      - numactl-dev
      - openssl-${{vars.openssl-version}}-dev
      - procps-dev
      - protobuf-dev
      - py${{vars.python-version}}-sphinx
      - py${{vars.python-version}}-sphinx-bin
      - vim # xxd
      - zlib-dev
      - zstd-dev
  environment:
    # WITH_LTO adds plain -flto. Fat objects keep machine code in the static
    # archives this package ships (libkmip*.a, libmysqlservices.a), where the
    # LTO bytecode is then stripped out again.
    CFLAGS: -ffat-lto-objects
    # libs/mysql/gtid/gtid_format.h lacks <cstdint> (fixed upstream in MySQL 8.4.11)
    CXXFLAGS: -include cstdint -ffat-lto-objects

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/percona/percona-xtrabackup
      tag: percona-xtrabackup-${{vars.mangled-package-version}}
      expected-commit: c6054e179b5dc39d9735536ce136dc1c91834d73
      recurse-submodules: true

  - uses: patch
    with:
      patches: 0001-Bug-39102340-build-with-OpenSSL-4.x.patch

  # WITH_UNIT_TESTS=OFF: the unit tests are neither run nor shipped, and under
  # LTO each test program is a whole-program link that costs build VM memory.
  - runs: |
      mkdir build && cd build
      cmake \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DWITH_BOOST=PATH-TO-BOOST-LIBRARY \
        -DDOWNLOAD_BOOST=ON \
        -DBUILD_CONFIG=xtrabackup_release \
        -DCMAKE_BUILD_TYPE=Release \
        -DWITH_LTO=ON \
        -DWITH_UNIT_TESTS=OFF \
        -DWITH_EDITLINE=system \
        -DWITH_FIDO=system \
        -DWITH_ICU=system \
        -DWITH_LIBEVENT=system \
        -DWITH_LZ4=system \
        -DWITH_PROTOBUF=system \
        -DWITH_SSL=system \
        -DWITH_ZLIB=system \
        -DWITH_ZSTD=system \
        -DINSTALL_MANDIR="/usr/share/man" \
        ..
      make -j$(nproc)

  - working-directory: build
    uses: autoconf/make-install

  - uses: strip

  # Drop the LTO bytecode from the shipped archives: it is only usable by
  # this exact GCC version and doubles their size.
  - runs: |
      find "${{targets.destdir}}" -name '*.a' \
        -exec strip -p -R '.gnu.lto_*' -R '.gnu.debuglto_*' -N '__gnu_lto_v1' {} +

subpackages:
  - name: "${{package.name}}-base"
    description: "Versioned binaries for percona-xtrabackup ${{vars.major-minor}}, co-installable with other versions"
    dependencies:
      runtime:
        - perl
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/bin/
          for name in xbcloud xbcloud_osenv xbcrypt xbstream xtrabackup; do
            install -Dm755 "${{targets.destdir}}"/usr/bin/${name} "${{targets.contextdir}}"/usr/bin/${name}-${{vars.major-minor}}
            ln -sf ${name}-${{vars.major-minor}} "${{targets.destdir}}"/usr/bin/${name}
          done
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: |
              xtrabackup-${{vars.major-minor}}
              xbcloud-${{vars.major-minor}}
              xbstream-${{vars.major-minor}}
              xbcrypt-${{vars.major-minor}}
            version: ${{vars.mangled-package-version}}

  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream"
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/local/xtrabackup/bin/
          # Use explicit binary list since destdir symlinks may not be visible
          # across subpackage boundaries in melange.
          for bin in xbcloud xbcloud_osenv xbcrypt xbstream xtrabackup; do
            ln -sf /usr/bin/${bin} "${{targets.contextdir}}"/usr/local/xtrabackup/bin/${bin}
          done
    test:
      environment:
        contents:
          packages:
            # -compat packages can be satisfied by multiple source packages; install here for test only, not as a runtime dep
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/docs

  - name: "${{package.name}}-test"
    description: "Provides xtrabackup-test"
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr
          mv "${{targets.destdir}}"/usr/xtrabackup-test ${{targets.contextdir}}/usr/xtrabackup-test
          rm -rf "${{targets.destdir}}"/usr/xtrabackup-test
    test:
      pipeline:
        - uses: test/tw/contains-files

update:
  enabled: true
  github:
    identifier: percona/percona-xtrabackup
    strip-prefix: percona-xtrabackup-
    use-tag: true
    tag-filter: percona-xtrabackup-8.4
  version-transform:
    - match: ^(.+)\-(\d+)$
      replace: $1.$2

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-compat
        - mariadb-13.1
        - mariadb-13.1-client
        - openssl-${{vars.openssl-version}}
        - wait-for-port
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: |
          xbcloud
          xbcloud_osenv
          xbcrypt
          xbstream
          xtrabackup
        version: ${{vars.mangled-package-version}}
    - name: Test xbcrypt
      runs: |
        set -euo pipefail
        echo "This is a test" | xbcrypt -a aes256 -k testkey123456789 > /tmp/encrypted.xb
        xbcrypt -d -a aes256 -k testkey123456789 -i /tmp/encrypted.xb
    - name: Test xbstream
      runs: |
        set -euo pipefail
        echo "Test data" > file1.txt
        echo "More test data" > file2.txt
        xbstream -c file1.txt file2.txt > stream_output.xbstream
        mkdir extract_dir
        cat stream_output.xbstream | xbstream -x -C extract_dir
        test -f extract_dir/file1.txt
        test -f extract_dir/file2.txt
    - name: Binaries and plugins link only the expected OpenSSL
      runs: |
        # xtrabackup does TLS itself, so it must link both libraries.
        deps=$(ldd /usr/bin/xtrabackup)
        for lib in libssl.so.${{vars.openssl-soversion}} libcrypto.so.${{vars.openssl-soversion}}; do
          case "$deps" in
            *"$lib"*) ;;
            *) echo "xtrabackup does not link $lib"; echo "$deps"; exit 1 ;;
          esac
        done
        # The rest link libcrypto directly or libssl through libcurl.
        for f in /usr/bin/xbcloud /usr/bin/xbcrypt /usr/bin/xbstream /usr/bin/xtrabackup /usr/lib/plugin/component_keyring_*.so; do
          other=$(ldd "$f" | grep -oE 'lib(ssl|crypto)\.so\.[0-9]+' | grep -vxE 'lib(ssl|crypto)\.so\.${{vars.openssl-soversion}}' || true)
          if [ -n "$other" ]; then
            echo "$f resolves another OpenSSL soname: $other"
            exit 1
          fi
        done
    - name: TLS connection through the patched MySQL client code
      runs: |
        # xtrabackup only uses OpenSSL as a MySQL client. Point it at a
        # TLS-only server with full certificate verification: it has to
        # finish the handshake and read the server version over TLS before
        # it rejects MariaDB as an unsupported server.
        mkdir -p /tmp/tls /var/lib/mysql /run/mysqld /var/tmp
        cd /tmp/tls
        openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 1 -subj "/CN=test-ca"
        openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=localhost"
        printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > ext.cnf
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 1 -extfile ext.cnf
        openssl req -x509 -newkey rsa:2048 -nodes -keyout other-ca.key -out other-ca.crt -days 1 -subj "/CN=other-ca"

        mariadb-install-db --user=root --datadir=/var/lib/mysql --auth-root-authentication-method=normal > /dev/null
        mariadbd --user=root --datadir=/var/lib/mysql --skip-networking=0 --bind-address=127.0.0.1 --port=3306 \
          --ssl-ca=/tmp/tls/ca.crt --ssl-cert=/tmp/tls/server.crt --ssl-key=/tmp/tls/server.key \
          --require-secure-transport=ON > /tmp/mariadbd.log 2>&1 &
        wait-for-port 3306 -t 60 || { cat /tmp/mariadbd.log; exit 1; }
        for h in localhost 127.0.0.1; do
          mariadb -u root -e "CREATE USER 'bk'@'$h' IDENTIFIED VIA mysql_native_password USING PASSWORD('bkpass') REQUIRE SSL;"
        done
        xb() {
          name=$1
          shift
          xtrabackup --backup --target-dir="/tmp/bk-$name" --host=127.0.0.1 --port=3306 --user=bk --password=bkpass "$@" > "/tmp/xb-$name.log" 2>&1
        }

        if xb verified --ssl-mode=VERIFY_IDENTITY --ssl-ca=/tmp/tls/ca.crt; then
          echo "xtrabackup unexpectedly backed up MariaDB"
          exit 1
        fi
        cat /tmp/xb-verified.log
        grep -F 'does not support MariaDB' /tmp/xb-verified.log

        if xb untrusted-ca --ssl-mode=VERIFY_CA --ssl-ca=/tmp/tls/other-ca.crt; then
          echo "connection with an untrusted CA unexpectedly succeeded"
          exit 1
        fi
        cat /tmp/xb-untrusted-ca.log
        grep -F 'certificate verify failed' /tmp/xb-untrusted-ca.log

        # The server refuses plaintext, so the verified connection was TLS.
        if xb plaintext --ssl-mode=DISABLED; then
          echo "plaintext connection unexpectedly succeeded"
          exit 1
        fi
        cat /tmp/xb-plaintext.log
        grep -F 'insecure transport' /tmp/xb-plaintext.log

        mariadb-admin -u root shutdown
    - uses: test/tw/ldd-check
