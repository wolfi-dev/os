# Generated from https://git.alpinelinux.org/aports/plain/community/perl-algorithm-diff/APKBUILD
package:
  name: perl-algorithm-diff
  version: "1.201"
  epoch: 6 # add tests
  description: Compute 'intelligent' differences between two files / lists
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
  resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - perl

pipeline:
  - uses: fetch
    with:
      expected-sha256: 0022da5982645d9ef0207f3eb9ef63e70e9713ed2340ed7b3850779b0d842a7d
      uri: https://cpan.metacpan.org/authors/id/R/RJ/RJBS/Algorithm-Diff-${{package.version}}.tar.gz

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

subpackages:
  - name: perl-algorithm-diff-doc
    pipeline:
      - uses: split/manpages
    description: perl-algorithm-diff manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: false
  exclude-reason: latest releases mismatches in release monitor and github release is not maintained to latest version

test:
  pipeline:
    - name: Verify module loads
      runs: perl -e 'use Algorithm::Diff; print "loaded\n"'
    - name: Test basic diff computation
      runs: |
        perl -e '
          use Algorithm::Diff qw(diff LCS);
          my @a = qw(a b c d e);
          my @b = qw(a c d f e);
          my @lcs = LCS(\@a, \@b);
          die "LCS failed" unless @lcs == 4;
          my @diffs = diff(\@a, \@b);
          die "diff failed" unless @diffs > 0;
          print "diff and LCS OK\n";
        '
    - name: Test sdiff and compact_diff
      runs: |
        perl -e '
          use Algorithm::Diff qw(sdiff compact_diff);
          my @a = qw(foo bar baz);
          my @b = qw(foo qux baz);
          my @s = sdiff(\@a, \@b);
          die "sdiff failed" unless @s == 3;
          my @c = compact_diff(\@a, \@b);
          die "compact_diff failed" unless @c > 0;
          print "sdiff and compact_diff OK\n";
        '
    - name: Test OO interface
      runs: |
        perl -e '
          use Algorithm::Diff;
          my @a = qw(a b c);
          my @b = qw(a x c);
          my $diff = Algorithm::Diff->new(\@a, \@b);
          my @hunks;
          while ($diff->Next) { push @hunks, [$diff->Items(1)] }
          die "OO interface failed" unless @hunks > 0;
          print "OO interface OK\n";
        '
