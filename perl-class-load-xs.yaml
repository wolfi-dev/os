package:
  name: perl-class-load-xs
  version: "0.10"
  epoch: 4 # toolchain rebuild for  perl-dev-5.44.0
  description: "XS implementation of parts of Class::Load"
  copyright:
    - license: Artistic-2.0
  dependencies:
    runtime:
      - perl
      - perl-class-load
  resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - glibc-2.43-dev
      - perl-class-load
      - perl-dev
      - perl-module-implementation
      - perl-test-fatal
      - perl-test-needs

pipeline:
  # Cannot build this one with git-checkout + perl/dzil. dzil is Moose-based, Moose
  # depends on this package, and an XS module built against the previous perl aborts
  # the interpreter uncatchably, so dzil dies before it can generate a Makefile.PL.
  # Building with dzil therefore deadlocks on itself after every perl version bump.
  # The CPAN tarball ships a generated Makefile.PL, so no dzil is needed.
  # blocked-bootstrap-complex: package sits inside Dist::Zilla's own dependency closure
  - uses: fetch
    with:
      expected-sha256: 5bc22cf536ebfd2564c5bdaf42f0d8a4cee3d1930fc8b44b7d4a42038622add1
      uri: https://cpan.metacpan.org/authors/id/E/ET/ETHER/Class-Load-XS-${{package.version}}.tar.gz

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make
    with:
      opts: test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: Documentation for ${{package.name}}
    test:
      pipeline:
        - uses: test/tw/docs

test:
  pipeline:
    - uses: test/no-docs
    - uses: test/perl-module-check
      with:
        modules: Class::Load Class::Load::XS
    - uses: test/tw/ldd-check

update:
  enabled: true
  release-monitor:
    identifier: 11928
