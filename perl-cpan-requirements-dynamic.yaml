package:
  name: perl-cpan-requirements-dynamic
  version: "0.003"
  epoch: 2 # runtime dep on perl-extutils-config (new() requires ExtUtils::Config)
  description: Perl module for requirements dynamic
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-extutils-config

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - perl
      - perl-dev
      - perl-dist-zilla
      - perl-extutils-config

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Leont/cpan-requirements-dynamic
      tag: v${{package.version}}
      expected-commit: 8053ed07bd72cfa4ed605e449d6519d30e6a758a

  - uses: perl/dzil

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: upstream-tests/perl-make-test

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  github:
    identifier: Leont/cpan-requirements-dynamic
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

subpackages:
  - name: perl-cpan-requirements-dynamic-doc
    description: perl-cpan-requirements-dynamic documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - uses: test/perl-module-check
      with:
        modules: CPAN::Requirements::Dynamic
    - name: Construct with the default config
      runs: |
        # new() loads ExtUtils::Config lazily, so `use` alone does not catch
        # a missing runtime dependency.
        perl -MCPAN::Requirements::Dynamic -e 'CPAN::Requirements::Dynamic->new or die'
    - uses: test/no-docs
