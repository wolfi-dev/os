# Generated from https://git.alpinelinux.org/aports/plain/main/perl-datetime-locale/APKBUILD
package:
  name: perl-datetime-locale
  version: "1.47"
  epoch: 2 # upstream-tests/perl-make-test
  description: Localization support for DateTime.pm
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-dist-checkconflicts
      - perl-file-sharedir
      - perl-file-sharedir-install
      - perl-namespace-autoclean
      - perl-params-validationcompiler
      - perl-specio
  resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - perl
      - perl-dev
      - perl-dist-checkconflicts
      - perl-file-sharedir
      - perl-file-sharedir-install
      - perl-namespace-autoclean
      - perl-params-validationcompiler
      - perl-path-tiny # upstream-tests: tests use Path::Tiny
      - perl-specio
      - perl-test-file-sharedir # upstream-tests: tests use Test::File::ShareDir::Dist

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/houseabsolute/DateTime-Locale
      tag: v${{package.version}}
      expected-commit: 0ea13fdb7017515661873dc48b2c9e16bdd5577c

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  # t/storable.t needs IPC::System::Simple, which is not packaged.
  # TODO(upstream-tests): package perl-ipc-system-simple and drop this.
  - uses: upstream-tests/perl-make-test
    with:
      ignore: t/storable.t

  - uses: perl/cleanup

  - uses: strip

subpackages:
  - name: perl-datetime-locale-doc
    pipeline:
      - uses: split/manpages
    description: perl-datetime-locale manpages
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - uses: test/no-docs

update:
  enabled: true
  github:
    identifier: houseabsolute/DateTime-Locale
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true
