package:
  name: perl-font-ttf-scripts
  version: "1.06"
  epoch: 0
  description: SIL's TrueType font support scripts for Perl (Font::TTF::Scripts)
  copyright:
    - license: Artistic-2.0
  dependencies:
    runtime:
      - perl
      - perl-algorithm-diff
      - perl-font-ttf
      - perl-io-string
      - perl-text-pdf
      - perl-text-unicode-equivalents
      - perl-xml-parser

environment:
  contents:
    packages:
      - busybox
      - make
      - perl
      - perl-algorithm-diff
      - perl-dev
      - perl-font-ttf
      - perl-io-string
      - perl-text-pdf
      - perl-text-unicode-equivalents
      - perl-xml-parser

# Despite the library name, most of this distribution is command-line tools:
# ttftable, sfd2ap, sfdmeld, ttfbuilder, fret, make_fea, make_gdl, ttfsetver,
# ttfname, ttfremap, volt2ttf and typetuner, plus the Font::TTF::Scripts::*
# modules they use. SIL's smith resolves ttftable, make_gdl and typetuner from
# PATH at configure time, so font-padauk and font-abyssinica need this package
# to build from source (OS-3498).
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/silnrsi/font-ttf-scripts
      tag: v${{package.version}}
      # v1.06 is an annotated tag; this is the commit it points at. The newer
      # v1.06_02 tag is an author developer release, whose underscore does not
      # map onto an apk version, so it is deliberately not used.
      #
      # The tag is from 2016 and master is 59 commits ahead of it (last commit
      # 2023-06-01), so staying on the tag is a deliberate choice, checked by
      # building font-padauk v6.000 and font-abyssinica v2.300 both ways. Both
      # produce fonts whose glyph set, cmap, outlines, advances and OpenType
      # feature set are identical to the artefacts SIL publishes for those
      # tags, so nothing master fixes is reachable from our font builds:
      #   - master adds `ttfsetver -n`, which smith passes only when a build
      #     label exists. The font recipes invoke `smith build --release`,
      #     which clears the label, so the flag is never used and the name
      #     table reads "Version 6.000" exactly as upstream ships it.
      #   - master's Font::TTF::Scripts::GDL sanitises GDL identifiers, which
      #     fixes the hyphenated names make_gdl emits at this tag. That only
      #     matters on smith's opt-in `--gr` Graphite path, which cannot be
      #     built from either font's current sources: Padauk's myanmar5.gdl
      #     references g100b_alt, g1020_long and g101c_med_103d, and the three
      #     glyphs behind them are in the UFO's public.skipExportGlyphs, so
      #     they are absent from the compiled font. SIL's own v6.000 release
      #     carries no Graphite tables either.
      # Against that, master's own test suite fails 3 of 21 subtests with our
      # Font::TTF 1.06, because two of its committed binary fixtures are
      # regenerated by hand: t/ttfbuilder.t expects hhea.minRightSideBearing
      # 14 where Font::TTF 1.06 computes 0, and t/typetuner.t counts warnings
      # that a master commit moved to stderr. The tag's suite passes clean.
      expected-commit: 9f36192312d9474d8b633e623af932cda772b0d3

  - uses: perl/make

  - uses: autoconf/make

  # The distribution ships a real test suite with font fixtures: ttfbuilder,
  # ttfname, ttfsubset, typetuner, fret, volt2ttf and psfix all have tests.
  - name: Run the upstream test suite
    runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  ignore-regex-patterns:
    - _ # exclude Perl dev/trial releases (e.g. v1.06_02)
  github:
    identifier: silnrsi/font-ttf-scripts
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ttf-dejavu
  pipeline:
    # ttfsetver is left out of the help check on purpose: it has no help
    # flag, it prints its usage only when called with the wrong number of
    # arguments, and it is exercised functionally below instead.
    - uses: test/tw/help-check
      with:
        bins: ttftable sfd2ap sfdmeld ttfbuilder ttfname typetuner fret
    - name: The Font::TTF::Scripts modules load
      runs: |
        for module in Font::TTF::Scripts Font::TTF::Scripts::AP Font::TTF::Scripts::Fea \
                      Font::TTF::Scripts::GDL Font::TTF::Scripts::Name Font::TTF::Scripts::Volt \
                      Font::Fret; do
          perl -M"$module" -e 'print "$ARGV[0] loaded\n"' "$module"
        done
    # ttftable is the command smith shells out to for table work, so this is
    # the path that matters to font-padauk and font-abyssinica. Its interface
    # is -export/-import/-delete/-list, not a directory dump.
    - name: ttftable lists, exports and reimports a font table
      runs: |
        cd "$(mktemp -d)"
        cp /usr/share/fonts/ttf-dejavu/DejaVuSans.ttf input.ttf

        ttftable -list input.ttf > tags.txt
        cat tags.txt
        for table in cmap head name; do
          if ! grep -qw "$table" tags.txt; then
            echo "FAIL: -list did not report the $table table"
            exit 1
          fi
        done

        # Export one table to a named file, then import it into a copy.
        ttftable -export "name=name.dat" input.ttf
        test -s name.dat
        ttftable -import "name=name.dat" input.ttf rebuilt.ttf
        test -s rebuilt.ttf

        # The rebuilt font must still parse and keep its glyph count and family.
        perl -MFont::TTF::Font -e '
          my $before = Font::TTF::Font->open($ARGV[0]);
          my $after  = Font::TTF::Font->open($ARGV[1]);
          my $b = $before->{"maxp"}->read->{"numGlyphs"};
          my $a = $after->{"maxp"}->read->{"numGlyphs"};
          my $fam = $after->{"name"}->read->find_name(1);
          print "glyphs before=$b after=$a family=$fam\n";
          die "glyph count changed\n" unless $a == $b;
          die "family name lost\n" unless length $fam;
        ' input.ttf rebuilt.ttf

        # Deleting a table must be visible in the listing. The table has to be
        # one this font actually has, or -delete removes nothing and the check
        # below passes whether or not -delete works. DejaVuSans has kern and
        # has no DSIG, so assert kern is listed first, then that it is gone.
        if ! grep -qw kern tags.txt; then
          echo "FAIL: the input font has no kern table to delete"
          exit 1
        fi
        ttftable -delete kern input.ttf stripped.ttf
        ttftable -list stripped.ttf > tags2.txt
        cat tags2.txt
        if grep -qw kern tags2.txt; then
          echo "FAIL: -delete left the kern table in place"
          exit 1
        fi
        # Everything else must survive the delete.
        for table in cmap head name; do
          if ! grep -qw "$table" tags2.txt; then
            echo "FAIL: -delete also removed the $table table"
            exit 1
          fi
        done
    - name: ttfsetver sets the font version in both tables
      runs: |
        cd "$(mktemp -d)"
        cp /usr/share/fonts/ttf-dejavu/DejaVuSans.ttf input.ttf
        ttfsetver 3.14 input.ttf versioned.ttf
        perl -MFont::TTF::Font -e '
          my $font = Font::TTF::Font->open($ARGV[0]);
          my $head = $font->{"head"}->read->{"fontRevision"};
          my $name = $font->{"name"}->read->find_name(5);
          printf "head fontRevision=%.2f name=%s\n", $head, $name;
          die "head table version not set\n" unless sprintf("%.2f", $head) eq "3.14";
          die "name table version not set\n" unless $name =~ /3\.14/;
        ' versioned.ttf

        # smith appends a build label through -d, so that is the interface
        # this package has to keep. At this tag the label is joined with a
        # semicolon; master adds -n to join with a space instead, which smith
        # passes whenever a label exists. A bump that lands -n must therefore
        # land with a smith that agrees, so assert the separator we get.
        ttfsetver -d "build-xyz" 3.14 input.ttf labelled.ttf
        perl -MFont::TTF::Font -e '
          my $name = Font::TTF::Font->open($ARGV[0])->{"name"}->read->find_name(5);
          print "labelled name=$name\n";
          die "build label not appended\n" unless $name =~ /build-xyz/;
          die "expected a semicolon before the label\n" unless $name =~ /3\.14;\s*build-xyz/;
        ' labelled.ttf

        # -n belongs to master, not to this tag; if it ever starts working
        # here the comment on the git-checkout step is out of date.
        if ttfsetver -n -d "build-xyz" 3.14 input.ttf spaced.ttf 2>&1 | grep -q "Unknown option: n"; then
          echo "confirmed: -n is not available at this tag"
        else
          echo "FAIL: ttfsetver now accepts -n, so this is no longer v1.06"
          exit 1
        fi
    - name: ttfname rewrites a name table entry
      runs: |
        cd "$(mktemp -d)"
        cp /usr/share/fonts/ttf-dejavu/DejaVuSans.ttf input.ttf
        ttfname -t 1 -n "Takeover Test" input.ttf renamed.ttf
        perl -MFont::TTF::Font -e '
          my $font = Font::TTF::Font->open($ARGV[0]);
          my $name = $font->{"name"}->read->find_name(1);
          print "family: $name\n";
          die "name table was not rewritten\n" unless $name eq "Takeover Test";
        ' renamed.ttf
