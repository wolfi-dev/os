package:
  name: perl-font-ttf
  version: "1.06"
  epoch: 0
  description: CPAN/Font-TTF - Perl module for TrueType font hacking
  copyright:
    - license: Artistic-2.0
  dependencies:
    runtime:
      - perl
      - perl-io-string
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - perl
      - perl-io-string

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/silnrsi/font-ttf
      tag: v${{package.version}}
      expected-commit: a217778bf7d9bb5999ff0cf892d3fb9fa3a26b5c

  - uses: perl/make

  - uses: autoconf/make

  - name: Run the upstream test suite
    runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/tw/docs

test:
  environment:
    contents:
      packages:
        - font-freefont
        - py3.13-fonttools
        - python-3.13
  pipeline:
    - uses: test/perl-module-check
      with:
        modules: Font::TTF::Font Font::TTF::Table
    - name: Open, edit and write back a TrueType font
      runs: |
        cp /usr/share/fonts/freefont/FreeMono.ttf /tmp/in.ttf
        perl -e '
          use Font::TTF::Font;
          my $f = Font::TTF::Font->open("/tmp/in.ttf") or die "open: $!";
          my $n = $f->{"maxp"}->read->{"numGlyphs"};
          die "no glyphs read" unless $n > 1000;
          $f->{"head"}->read->{"flags"} = 1 + 2 + 4 + 8 + 0x10;
          $f->{"gasp"} = Font::TTF::Table->new("dat" => pack("nnnnnn", 0, 2, 8, 2, 0xffff, 3));
          $f->out("/tmp/out.ttf") or die "out: $!";
          print "Font::TTF $Font::TTF::Font::VERSION: read $n glyphs, wrote /tmp/out.ttf\n";
        '
        # The rewritten font must still be a valid TrueType file with the edits applied.
        python3.13 -c '
        from fontTools.ttLib import TTFont
        a, b = TTFont("/tmp/in.ttf"), TTFont("/tmp/out.ttf")
        assert b["maxp"].numGlyphs == a["maxp"].numGlyphs
        assert b["head"].flags == 0x1f, hex(b["head"].flags)
        assert b["gasp"].gaspRange == {8: 2, 65535: 3}, b["gasp"].gaspRange
        assert b.getBestCmap() == a.getBestCmap()
        print("rewritten font valid: head.flags and gasp applied, cmap intact")
        '

update:
  enabled: true
  github:
    identifier: silnrsi/font-ttf
    strip-prefix: v
    use-tag: true
