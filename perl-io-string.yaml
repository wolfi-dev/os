package:
  name: perl-io-string
  version: "1.08"
  epoch: 0
  description: CPAN/IO-String - Emulate file interface for in-core strings
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - perl

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gisle/io-string
      tag: ${{package.version}}
      expected-commit: 94356f6c0ae9b2c3efe0a7c24e9a2c80b05e0d49

  - uses: perl/make

  - uses: autoconf/make

  - name: Run the upstream test suite
    runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/tw/docs

test:
  pipeline:
    - uses: test/perl-module-check
      with:
        modules: IO::String
    - name: Read and write an in-core string through the file interface
      runs: |
        perl -e '
          use IO::String;
          my $buf = "";
          my $io = IO::String->new($buf);
          print $io "line one\nline two\n";
          $io->setpos(0);
          my @lines = <$io>;
          die "expected 2 lines, got " . scalar(@lines) unless @lines == 2;
          die "wrong content: $lines[1]" unless $lines[1] eq "line two\n";
          print "IO::String $IO::String::VERSION read/write ok\n";
        '

update:
  enabled: true
  github:
    identifier: gisle/io-string
    use-tag: true
