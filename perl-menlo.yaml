#nolint:git-checkout-must-use-github-updates
package:
  name: perl-menlo
  version: "1.9019"
  epoch: 5 # go/wolfi-rsc/perl-menlo
  description: A CPAN client
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-class-tiny
      - perl-extutils-config
      - perl-extutils-helpers
      - perl-extutils-installpaths
      - perl-string-shellquote
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - bash

pipeline:
  - working-directory: cpanminus
    uses: git-checkout
    with:
      repository: https://github.com/miyagawa/cpanminus
      tag: Menlo-${{package.version}}
      expected-commit: 7e393ca646aeef4904446138ca87f3974c76945e

  - runs: |
      bash -c '
      shopt -s dotglob
      mv -v cpanminus/Menlo/* .
      '

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 8372

subpackages:
  - name: ${{package.name}}-doc
    description: ${{package.name}} documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    # Menlo::Index::* is omitted: it needs CPAN::Common::Index, which has no
    # package here, so those modules cannot currently load.
    - name: Test shipped modules load and version is accessible
      runs: |
        perl -e 'use Menlo; print Menlo->VERSION, "\n"'
        for mod in Menlo::Builder::Static Menlo::Dependency Menlo::Util; do
          perl -e "use $mod; print \"$mod loaded\n\""
        done
    - uses: test/no-docs
