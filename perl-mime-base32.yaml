package:
  name: perl-mime-base32
  version: "1.303"
  epoch: 0
  description: Base32 encoder and decoder (RFC 4648)
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl

pipeline:
  # v1.303 is the commit released to CPAN as MIME-Base32-1.303.tar.gz.
  - uses: git-checkout
    with:
      repository: https://github.com/perl5-utils/MIME-Base32.git
      tag: v${{package.version}}
      expected-commit: 10c2e98a1ad86ff6e62314401e0288a38dfa5c42

  - uses: perl/make

  - uses: autoconf/make

  - uses: upstream-tests/perl-make-test
    with:
      # Makefile.PL puts xt/*.t in TESTS too. Those are author tests
      # (kwalitee, spelling, pod coverage, manifest) that need the dist's
      # "develop" prereqs; gate on the t/ suite, which covers the module.
      args: TEST_FILES=t/*.t

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    description: ${{package.name}} manpages
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  ignore-regex-patterns:
    - _ # exclude CPAN trial releases (e.g. v1.300_001)
  github:
    identifier: perl5-utils/MIME-Base32
    use-tag: true
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/no-docs
    - uses: test/perl-module-check
      with:
        modules: MIME::Base32
    - name: RFC 4648 test vectors
      # encode_rfc3548 emits unpadded base32, and decode_rfc3548 takes it.
      runs: |
        perl -MMIME::Base32 -e '
        my %v = ("" => "", f => "MY======", fo => "MZXQ====", foo => "MZXW6===",
                 foob => "MZXW6YQ=", fooba => "MZXW6YTB", foobar => "MZXW6YTBOI======");
        for my $in (sort keys %v) {
          my $enc = MIME::Base32::encode_rfc3548($in);
          (my $want = $v{$in}) =~ s/=+$//;
          die "encode($in): got $enc, want $want\n" unless $enc eq $want;
          my $dec = MIME::Base32::decode_rfc3548($want);
          die "decode($want): got $dec, want $in\n" unless $dec eq $in;
        }
        print "RFC 4648 base32 vectors passed.\n";'
