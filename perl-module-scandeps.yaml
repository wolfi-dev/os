# Generated from https://git.alpinelinux.org/aports/plain/main/perl-module-scandeps/APKBUILD
package:
  name: perl-module-scandeps
  version: "1.37"
  epoch: 292
  description: Recursively scan Perl code for dependencies
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - perl

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rschupp/Module-ScanDeps
      tag: ${{package.version}}
      expected-commit: b76f2541c4faf3145413d94c54a4ad19ffd07664

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

subpackages:
  - name: perl-module-scandeps-doc
    pipeline:
      - uses: split/manpages
    description: perl-module-scandeps manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: rschupp/Module-ScanDeps
    use-tag: true

test:
  pipeline:
    - name: Test Module::ScanDeps loads
      runs: perl -e 'use Module::ScanDeps; print "Module::ScanDeps loaded\n"'
    - name: Test scanning a Perl file for dependencies
      runs: |
        cat > /tmp/test_scan.pl <<'EOF'
        use strict;
        use warnings;
        use Carp;
        EOF
        perl -e '
          use Module::ScanDeps;
          my $deps = scan_deps(files => ["/tmp/test_scan.pl"], recurse => 0);
          die "scan_deps returned undef" unless defined $deps;
          print "scan_deps returned " . scalar(keys %$deps) . " entries\n";
        '
    - name: Test scandeps.pl scans a file
      runs: |
        cat > /tmp/test_cli.pl <<'EOF'
        use strict;
        use warnings;
        EOF
        scandeps.pl /tmp/test_cli.pl
