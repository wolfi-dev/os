# Generated from https://git.alpinelinux.org/aports/plain/main/perl-mro-compat/APKBUILD
package:
  name: perl-mro-compat
  version: "0.15"
  epoch: 10 # add functional tests
  description: mro::* interface compatibility for Perls < 5.9.5
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
  resources:
    cpu: "1"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - perl
      - perl-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/moose/MRO-Compat
      tag: v${{package.version}}
      expected-commit: 8e3da0bd0b436c4c133d6350e32592a56f33c423

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

subpackages:
  - name: perl-mro-compat-doc
    pipeline:
      - uses: split/manpages
    description: perl-mro-compat manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: moose/MRO-Compat
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        perl -e 'use MRO::Compat; print "loaded\n"'
    - runs: |
        perl -e '
          use MRO::Compat;
          package Animal;
          use mro "dfs";
          package Dog;
          our @ISA = ("Animal");
          use mro "dfs";
          my $mro = mro::get_mro("Dog");
          die "expected dfs, got $mro" unless $mro eq "dfs";
          print "mro::get_mro ok\n";
          my $linear = mro::get_linear_isa("Dog");
          die "expected arrayref" unless ref($linear) eq "ARRAY";
          print "mro::get_linear_isa ok\n";
        '
    - runs: |
        perl -e '
          use MRO::Compat;
          package A; our @ISA = ();
          package B; our @ISA = ("A");
          package C; our @ISA = ("A");
          package D; our @ISA = ("B", "C");
          my $isa = mro::get_linear_isa("D");
          die "expected array" unless ref($isa) eq "ARRAY";
          print "diamond MRO linearization ok: @{$isa}\n";
        '
