package:
  name: perl-parallel-iterator
  version: "1.002"
  epoch: 10 # add functional tests
  description: Simple parallel execution
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - perl
      - perl-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ap/Parallel-Iterator
      tag: ${{package.version}}
      expected-commit: b1f6c97ce4a35dffb31c4d407bf802fe8f36ed6b

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  github:
    identifier: ap/Parallel-Iterator
    use-tag: true

subpackages:
  - name: perl-parallel-iterator-doc
    description: perl-parallel-iterator documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/tw/docs

test:
  pipeline:
    - name: Test module loads
      runs: perl -e 'use Parallel::Iterator qw(iterate iterate_as_array iterate_as_hash); print "loaded\n"'
    - name: Test iterate_as_array parallel execution
      runs: |
        perl <<'EOF'
        use Parallel::Iterator qw(iterate_as_array);
        my @input = (1, 2, 3, 4, 5);
        my @results = iterate_as_array(sub { my ($id, $n) = @_; return $n * 2 }, \@input);
        my $sum = 0;
        $sum += $_ for @results;
        # Sum of doubled values: (2+4+6+8+10) = 30
        die "Expected sum 30, got $sum" unless $sum == 30;
        print "iterate_as_array ok\n";
        EOF
    - name: Test iterate_as_hash parallel execution
      runs: |
        perl <<'EOF'
        use Parallel::Iterator qw(iterate_as_hash);
        my %input = (a => 1, b => 2, c => 3);
        my %results = iterate_as_hash(sub { my ($id, $v) = @_; return $v + 10 }, \%input);
        die "Expected a=>11, got $results{a}" unless $results{a} == 11;
        die "Expected b=>12, got $results{b}" unless $results{b} == 12;
        die "Expected c=>13, got $results{c}" unless $results{c} == 13;
        print "iterate_as_hash ok\n";
        EOF
    - name: Test iterate low-level interface
      runs: |
        perl <<'EOF'
        use Parallel::Iterator qw(iterate);
        my @input = (10, 20, 30);
        my $iter = iterate(sub { my ($id, $n) = @_; return $n + 1 }, \@input);
        my @got;
        while (my ($id, $val) = $iter->()) {
            push @got, $val;
        }
        my $sum = 0;
        $sum += $_ for @got;
        # Sum of (11+21+31) = 63
        die "Expected sum 63, got $sum" unless $sum == 63;
        print "iterate ok\n";
        EOF
