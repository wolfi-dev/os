package:
  name: perl-params-someutil
  version: "1.09"
  epoch: 0
  description: "Simple, compact and correct param-checking functions"
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl

environment:
  contents:
    packages:
      - build-base
      - glibc-2.44-dev
      - perl-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/uperl/Params-SomeUtil
      tag: ${{package.version}}
      expected-commit: 76fd44e6bee61dcebafc787ee419e0338a62bdd9

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make
    with:
      opts: test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  # This file somehow ends up being installed as non-owner-writeable,
  # breaking `strip`.
  - runs: chmod u+w "${{targets.destdir}}/usr/lib/perl5/vendor_perl/auto/Params/SomeUtil/SomeUtil.so"

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: Documentation for ${{package.name}}
    test:
      pipeline:
        - uses: test/tw/docs

test:
  pipeline:
    - uses: test/no-docs
    - uses: test/tw/ldd-check
    - uses: test/perl-module-check
      with:
        modules: Params::SomeUtil

update:
  enabled: true
  ignore-regex-patterns:
    - _ # exclude Perl dev/trial releases (e.g. v1.105_001)
  github:
    identifier: uperl/Params-SomeUtil
    use-tag: true
