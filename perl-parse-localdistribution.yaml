package:
  name: perl-parse-localdistribution
  version: "0.21"
  epoch: 1
  description: parses local .pm files as PAUSE does
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
  dependencies:
    runtime:
      - perl-parse-pmfile
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - perl
      - perl-extutils-config
      - perl-extutils-helpers
      - perl-extutils-installpaths
      - perl-extutils-makemaker-cpanfile
      - perl-module-build-tiny

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/charsbar/Parse-LocalDistribution
      tag: ${{package.version}}
      expected-commit: 50cca949c4aea426e59aaab1c898ab3eef5f36c2

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  github:
    identifier: charsbar/Parse-LocalDistribution
    use-tag: true

test:
  pipeline:
    - name: verify module loads
      runs: perl -e 'use Parse::LocalDistribution; print "loaded\n"'
    - name: test core parsing functionality
      runs: |
        # Create a minimal Perl distribution structure for testing
        mkdir -p /tmp/testdist/lib
        cat > /tmp/testdist/lib/MyTest.pm <<'EOF'
        package MyTest;
        our $VERSION = '1.23';
        1;
        EOF
        # Parse the distribution and verify it finds the module with correct version
        perl -e '
          use Parse::LocalDistribution;
          my $p = Parse::LocalDistribution->new;
          my $info = $p->parse("/tmp/testdist");
          die "parse returned undef" unless defined $info;
          die "MyTest not found in parsed output" unless exists $info->{"MyTest"};
          my $ver = $info->{"MyTest"}{version};
          die "version mismatch: got $ver, expected 1.23" unless $ver eq "1.23";
          print "parsed MyTest version $ver\n";
        '
