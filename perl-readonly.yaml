# Generated from https://git.alpinelinux.org/aports/plain/community/perl-readonly/APKBUILD
package:
  name: perl-readonly
  version: "2.05"
  epoch: 10 # add tests
  description: Facility for creating read-only scalars, arrays, hashes
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - perl
      - perl-extutils-config
      - perl-extutils-helpers
      - perl-extutils-installpaths
      - perl-module-build-tiny

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sanko/readonly.git
      tag: ${{package.version}}
      expected-commit: 5a4193b513a88eec80807948ca6aa0979d134893

  - runs: |
      # Not using perl pipeline since it doesn't use Makefile.PL
      CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      export CFLAGS
      perl Build.PL --installdirs=vendor

  - runs: |
      CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      export CFLAGS
      perl Build
      perl Build test

  - runs: |
      perl Build install --destdir=${{targets.destdir}}
      find ${{targets.destdir}} \( -name perllocal.pod -o -name .packlist \) -delete

  - uses: strip

  - uses: strip

subpackages:
  - name: perl-readonly-doc
    pipeline:
      - uses: split/manpages
    description: perl-readonly manpages
    test:
      pipeline:
        - uses: test/tw/docs

test:
  pipeline:
    - uses: test/no-docs
    - name: Test Readonly module loads
      runs: perl -e 'use Readonly; print "Readonly loaded\n"'
    - name: Test read-only scalar
      runs: |
        perl -e '
          use Readonly;
          Readonly::Scalar my $x => 42;
          die "scalar value wrong" unless $x == 42;
          eval { $x = 99 };
          die "scalar should be read-only" unless $@;
          print "read-only scalar ok\n";
        '
    - name: Test read-only array
      runs: |
        perl -e '
          use Readonly;
          Readonly::Array my @arr => (1, 2, 3);
          die "array value wrong" unless $arr[0] == 1 && $arr[2] == 3;
          eval { push @arr, 4 };
          die "array should be read-only" unless $@;
          print "read-only array ok\n";
        '
    - name: Test read-only hash
      runs: |
        perl -e '
          use Readonly;
          Readonly::Hash my %h => (key => "value");
          die "hash value wrong" unless $h{key} eq "value";
          eval { $h{new} = "bad" };
          die "hash should be read-only" unless $@;
          print "read-only hash ok\n";
        '

update:
  enabled: true
  github:
    identifier: sanko/readonly
    use-tag: true
