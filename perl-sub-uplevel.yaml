package:
  name: perl-sub-uplevel
  version: "0.2800"
  epoch: 4
  description: Apparently run a function in a higher stack frame
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
  resources:
    cpu: "2"
    memory: 4Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Perl-Toolchain-Gang/Sub-Uplevel
      tag: release-${{package.version}}
      expected-commit: 571c2bca8fd2feb59bdf102b38bd0f6d970278cb

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: Documentation for ${{package.name}}
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: Perl-Toolchain-Gang/Sub-Uplevel
    strip-prefix: release-
    use-tag: true
    tag-filter-prefix: release-

test:
  pipeline:
    - name: Verify module loads
      runs: perl -e 'use Sub::Uplevel; print "Sub::Uplevel loaded successfully\n"'
    - name: Verify uplevel shifts caller stack frame
      runs: |
        perl - <<'EOF'
        use strict;
        use warnings;
        use Sub::Uplevel;

        # inner() reports its caller via caller(0)
        sub inner {
          return (caller(0))[3];
        }

        # wrapper() calls inner() normally — caller sees wrapper
        sub wrapper {
          return inner();
        }

        # uplevel_wrapper() calls inner() one level up — caller sees uplevel_wrapper's caller
        sub uplevel_wrapper {
          return uplevel(1, \&inner);
        }

        my $normal = wrapper();
        die "Expected 'main::inner' from normal call, got '$normal'\n"
          unless $normal eq 'main::inner';

        my $upleveled = uplevel_wrapper();
        die "Expected 'main::uplevel_wrapper' from upleveled call, got '$upleveled'\n"
          unless $upleveled eq 'main::uplevel_wrapper';

        print "Sub::Uplevel core functionality verified\n";
        EOF
