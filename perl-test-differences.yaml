# Generated from https://git.alpinelinux.org/aports/plain/community/perl-test-differences/APKBUILD
package:
  name: perl-test-differences
  version: "0.72"
  epoch: 4 # add tests
  description: Test strings and data structures and show differences if not ok
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-text-diff
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - perl
      - perl-capture-tiny
      - perl-module-build
      - perl-test-pod
      - perl-test-pod-coverage
      - perl-text-diff

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/DrHyde/Test-Differences
      tag: release-${{package.version}}
      expected-commit: 1476f102d652e411fb7350f8ecfcb7e8e05f27d2

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

subpackages:
  - name: perl-test-differences-doc
    pipeline:
      - uses: split/manpages
    description: perl-test-differences manpages
    test:
      pipeline:
        - uses: test/tw/docs

test:
  pipeline:
    - name: Test module loads
      runs: perl -e 'use Test::Differences; print "loaded\n"'
    - name: Test eq_or_diff passes on equal strings
      runs: |
        perl -e '
          use Test::More tests => 1;
          use Test::Differences;
          eq_or_diff("hello", "hello", "equal strings pass");
        '
    - name: Test eq_or_diff detects differences
      runs: |
        perl -e '
          use Test::More tests => 2;
          use Test::Differences;
          # Verify eq_or_diff reports a diff without dying; wrap in todo so
          # the expected failure does not cause a non-zero exit.
          TODO: {
            local $TODO = "intentional mismatch to verify diff detection";
            eq_or_diff("foo", "bar", "different strings");
          }
          pass("eq_or_diff ran without dying when strings differ");
        '
    - name: Test unified_diff style
      runs: |
        perl -e '
          use Test::More tests => 1;
          use Test::Differences;
          unified_diff();
          eq_or_diff("line1\nline2\n", "line1\nline2\n", "unified diff style works");
        '
    - name: Test eq_or_diff with data structures
      runs: |
        perl -e '
          use Test::More tests => 1;
          use Test::Differences;
          eq_or_diff([1, 2, 3], [1, 2, 3], "equal arrays pass");
        '

update:
  enabled: true
  github:
    identifier: DrHyde/Test-Differences
    strip-prefix: release-
    tag-filter-prefix: release-
    use-tag: true
