# Generated from https://git.alpinelinux.org/aports/plain/main/perl-test-pod-coverage/APKBUILD
package:
  name: perl-test-pod-coverage
  version: "1.10"
  epoch: 8 # add tests
  description: Perl - Check for pod coverage in your distribution.
  copyright:
    - license: Artistic-2.0
  dependencies:
    runtime:
      - perl
      - perl-devel-symdump
      - perl-pod-coverage
      - perl-test-pod
  resources:
    cpu: "2"
    memory: 2Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - perl
      - perl-devel-symdump
      - perl-pod-coverage
      - perl-test-pod

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neilbowers/Test-Pod-Coverage
      tag: v${{package.version}}
      expected-commit: a349916187b05b700e56d1a88feb5136ff7542ad

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  github:
    identifier: neilbowers/Test-Pod-Coverage
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

subpackages:
  - name: perl-test-pod-coverage-doc
    description: perl-test-pod-coverage documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/tw/docs

test:
  # No need to specify runtime dependencies in test environment, which are already
  # defined as runtime packages by the primary package - they're automatic.
  pipeline:
    - runs: |
        perl -e 'use Test::Pod::Coverage; print "Test::Pod::Coverage loaded ok\n"'
    - runs: |
        perl -e '
          use Test::Pod::Coverage;
          # Verify the module exports its core functions
          my @funcs = Test::Pod::Coverage->can("pod_coverage_ok") ? ("pod_coverage_ok") : ();
          push @funcs, Test::Pod::Coverage->can("all_pod_coverage_ok") ? ("all_pod_coverage_ok") : ();
          die "Expected functions not found" unless @funcs == 2;
          print "Core functions available: " . join(", ", @funcs) . "\n";
        '
