package:
  name: perl-text-unicode-equivalents
  version: "0.05"
  epoch: 0
  description: Build all canonically equivalent Unicode strings (Text::Unicode::Equivalents)
  copyright:
    - license: Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl

environment:
  contents:
    packages:
      - busybox
      - make
      - perl

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/silnrsi/text-unicode-equivalents
      branch: master
      expected-commit: 6ea026f271a4460e8d905af8b4bd2a8a0dd69551

  - uses: perl/make

  - uses: autoconf/make

  - name: Run the upstream test suite
    runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/tw/docs

test:
  pipeline:
    - name: Module loads from the vendor path and reports its version
      runs: |
        out=$(perl -MText::Unicode::Equivalents -e 'print "$Text::Unicode::Equivalents::VERSION $INC{q{Text/Unicode/Equivalents.pm}}\n"')
        echo "$out"
        echo "$out" | grep -E '^[0-9]+\.[0-9]+ '
        echo "$out" | grep -F "/vendor_perl/Text/Unicode/Equivalents.pm"
    - name: all_strings returns the canonical equivalents
      runs: |
        perl <<'EOF'
        use strict;
        use warnings;
        use Text::Unicode::Equivalents;
        use Unicode::Normalize qw(NFD);

        sub hexs { join " ", map { join "+", map { sprintf "U+%04X", ord } split //, $_ } @_ }

        sub check {
            my ($in, @want) = @_;
            # all_strings is not in the module's default @EXPORT list.
            my $res = Text::Unicode::Equivalents::all_strings($in);
            die "all_strings did not return an array ref\n" unless ref($res) eq "ARRAY";
            my %got = map { $_ => 1 } @$res;
            print hexs($in), " => ", hexs(sort @$res), "\n";
            die "expected ", scalar(@want), " strings, got ", scalar(@$res), "\n"
                unless @$res == @want && keys(%got) == @want;
            for my $w (@want) {
                die "missing ", hexs($w), "\n" unless $got{$w};
            }
            for my $r (@$res) {
                die "non-equivalent result ", hexs($r), "\n" unless NFD($r) eq NFD($in);
            }
        }

        # U+1E0A (D with dot above) decomposes to D + U+0307.
        check("\x{1E0A}", "\x{1E0A}", "D\x{0307}");

        # Dot below (ccc 220) and dot above (ccc 230) may be reordered and either may compose with D.
        check("\x{1E0C}\x{0307}",
            "\x{1E0C}\x{0307}", "\x{1E0A}\x{0323}", "D\x{0323}\x{0307}", "D\x{0307}\x{0323}");

        # U+212B ANGSTROM SIGN is a singleton decomposing to U+00C5.
        check("\x{212B}", "\x{212B}", "\x{00C5}", "A\x{030A}");

        # Hangul syllable GA is equivalent to the Jamo pair U+1100 U+1161.
        check("\x{AC00}", "\x{AC00}", "\x{1100}\x{1161}");

        check("abc", "abc");
        print "all_strings OK\n";
        EOF

update:
  enabled: false
  exclude-reason: >
    Upstream has no tags or releases; version 0.05 comes from $VERSION in lib/Text/Unicode/Equivalents.pm at the pinned master commit, so new versions are picked up by hand.

