# Generated from https://git.alpinelinux.org/aports/plain/community/perl-types-serialiser/APKBUILD
package:
  name: perl-types-serialiser
  version: "1.01"
  epoch: 7
  description: Perl module for Types-Serialiser
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl-common-sense
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - perl
      - perl-common-sense

pipeline:
  - uses: fetch
    with:
      expected-sha256: f8c7173b0914d0e3d957282077b366f0c8c70256715eaef3298ff32b92388a80
      uri: https://cpan.metacpan.org/authors/id/M/ML/MLEHMANN/Types-Serialiser-${{package.version}}.tar.gz

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

subpackages:
  - name: perl-types-serialiser-doc
    pipeline:
      - uses: split/manpages
    description: perl-types-serialiser manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  release-monitor:
    identifier: 14408

test:
  environment:
    contents:
      packages:
        - perl-common-sense
  pipeline:
    - name: Verify Types::Serialiser loads
      runs: perl -e 'use Types::Serialiser; print "loaded\n"'
    - name: Test boolean true/false values
      runs: |
        perl -e '
          use Types::Serialiser;
          my $true  = Types::Serialiser::true;
          my $false = Types::Serialiser::false;
          die "true is not true"  unless $true;
          die "false is not false" if $false;
          print "booleans ok\n";
        '
    - name: Test is_bool type check
      runs: |
        perl -e '
          use Types::Serialiser;
          die "true should be bool"  unless Types::Serialiser::is_bool(Types::Serialiser::true);
          die "false should be bool" unless Types::Serialiser::is_bool(Types::Serialiser::false);
          die "string should not be bool" if Types::Serialiser::is_bool("string");
          print "is_bool ok\n";
        '
    - name: Test error type
      runs: |
        perl -e '
          use Types::Serialiser;
          my $err = Types::Serialiser::error;
          die "error value should be defined" unless defined $err;
          die "error should be an error type" unless Types::Serialiser::is_error($err);
          print "error type ok\n";
        '
