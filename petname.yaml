package:
  name: petname
  version: "2.14"
  epoch: 2 # upstream-tests/go-test
  description: Generate pronouncable, perhaps even memorable, pet names
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dustinkirkland/golang-petname
      tag: ${{package.version}}
      expected-commit: be8536a0e1898d73de105eefa7569a7f37833b1a

  - uses: go/build
    with:
      packages: ./cmd/petname
      output: petname

  - uses: upstream-tests/go-test

  - uses: strip

update:
  enabled: true
  github:
    identifier: dustinkirkland/golang-petname
    use-tag: true

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        petname --help
        petname version
