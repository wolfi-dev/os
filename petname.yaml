package:
  name: petname
  version: "2.13"
  epoch: 1 # toolchain rebuild for  go-1.27-1.27.2
  description: Generate pronouncable, perhaps even memorable, pet names
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dustinkirkland/golang-petname
      tag: ${{package.version}}
      expected-commit: eb5d041a7c6f1893b6ba4226b44648747d1d48f3

  - uses: go/build
    with:
      packages: ./cmd/petname
      output: petname

  - uses: strip

update:
  enabled: true
  github:
    identifier: dustinkirkland/golang-petname
    use-tag: true

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        petname --help
        petname version
