# pgAudit 19.0 is intended to support PostgreSQL 19.
# https://github.com/pgaudit/pgaudit/blob/master/README.md#postgresql-version-compatibility
package:
  name: pgaudit-19
  version: "19.0"
  epoch: 0 # rebuild to publish pgaudit-19-source
  description: PostgreSQL Audit Extension
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provides:
      - pgaudit=${{package.full-version}}
  resources:
    cpu: "1"
    memory: 3Gi
  annotations:
    # Postgres extension; llvm pinned lockstep with postgres for JIT bitcode ABI.
    toolchain-stream-reconcile-optout: true

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      # NOTE: align with clang version in postgresql-*-dev
      - clang-19
      - glibc-2.44-dev
      - krb5-dev
      - postgresql-19-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pgaudit/pgaudit.git
      tag: ${{package.version}}
      expected-commit: ee057ae20ec67997746aa10771d696c6406d7270

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/postgresql/extension
      make USE_PGXS=1 DESTDIR=${{targets.destdir}} PG_CONFIG=/usr/bin/pg_config install

  - uses: strip

test:
  environment:
    contents:
      packages:
        - glibc-locales
        - make
        - postgresql-19
        - postgresql-19-client
        - postgresql-19-contrib
        - shadow
        - sudo-rs
    environment:
      PGDATA: /tmp/test_db
      PGUSER: wolfi
  pipeline:
    - uses: test/tw/ldd-check
    - uses: git-checkout
      with:
        repository: https://github.com/pgaudit/pgaudit.git
        tag: ${{package.version}}
        expected-commit: ee057ae20ec67997746aa10771d696c6406d7270
    - runs: |
        # Based on upstream tests in https://github.com/pgaudit/pgaudit/tree/main/test
        useradd $PGUSER
        sudo -u $PGUSER initdb -D $PGDATA
        echo "shared_preload_libraries = 'pgaudit'" >> ${PGDATA}/postgresql.conf
        if ! sudo -u $PGUSER pg_ctl -D $PGDATA -l /tmp/logfile start; then
          echo "!!! SERVER STARTUP FAILED"
          cat /tmp/logfile
          exit 1
        fi

        if ! make installcheck USE_PGXS=1; then
          echo "!!! INSTALLCHECK FAILED"
          cat regression.diffs
          exit 1
        fi

update:
  enabled: true
  github:
    identifier: pgaudit/pgaudit
    tag-filter-prefix: 19.
