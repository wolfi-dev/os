package:
  name: php-8.1-ds
  version: "1.8.0"
  epoch: 1
  description: "An extension providing efficient data structures for PHP"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - pcre2-dev
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/php-ds/ext-ds
      tag: "v${{package.version}}"
      expected-commit: e3ef65f522a6c9afe5b59895c1d81ebff692fbef

  - name: Prepare build
    runs: phpize

  - name: Build
    runs: |
      set -x
      ./configure

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=ds.so" > "${{targets.subpkgdir}}/etc/php/conf.d/ds.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

update:
  enabled: false
  exclude-reason: ext-ds 2.x requires PHP >= 8.2; no further releases for PHP 8.1
  github:
    identifier: php-ds/ext-ds
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - php-${{vars.phpMM}}
        - ${{package.name}}-config
  pipeline:
    - name: Verify ds extension is loaded
      runs: |
        php -r "if (!extension_loaded('ds')) { die('ds extension is not loaded\n'); } echo 'ds extension loaded OK\n';"
    - name: Test Ds\Vector operations
      runs: |
        php -r "
          \$v = new Ds\Vector([1, 2, 3]);
          \$v->push(4);
          if (\$v->count() !== 4) { die('Vector count failed\n'); }
          if (\$v->get(3) !== 4) { die('Vector get failed\n'); }
          echo 'Ds\\\Vector OK\n';
        "
    - name: Test Ds\Map operations
      runs: |
        php -r "
          \$m = new Ds\Map(['a' => 1, 'b' => 2]);
          \$m->put('c', 3);
          if (\$m->count() !== 3) { die('Map count failed\n'); }
          if (\$m->get('b') !== 2) { die('Map get failed\n'); }
          echo 'Ds\\\Map OK\n';
        "
    - name: Test Ds\Set operations
      runs: |
        php -r "
          \$s = new Ds\Set([1, 2, 3, 2, 1]);
          if (\$s->count() !== 3) { die('Set dedup failed\n'); }
          if (!\$s->contains(2)) { die('Set contains failed\n'); }
          echo 'Ds\\\Set OK\n';
        "
    - name: Test Ds\Stack and Ds\Queue operations
      runs: |
        php -r "
          \$stack = new Ds\Stack([1, 2, 3]);
          if (\$stack->pop() !== 3) { die('Stack pop failed\n'); }
          echo 'Ds\\\Stack OK\n';
          \$queue = new Ds\Queue([1, 2, 3]);
          if (\$queue->pop() !== 1) { die('Queue pop failed\n'); }
          echo 'Ds\\\Queue OK\n';
        "
    - uses: test/tw/ldd-check
