package:
  name: php-8.1-opentelemetry
  version: "1.3.1"
  epoch: 2 # go/wolfi-rsc/php-8.1-opentelemetry
  description: "OpenTelemetry PHP auto-instrumentation extension"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}
  resources:
    cpu: "1"
    memory: 1Gi
    disk: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-php-instrumentation
      tag: ${{package.version}}
      expected-commit: 108b0226b96da902b3eb2e942ea57c589d07c9ca

  - name: Prepare build
    runs: cd ext && phpize

  - name: Configure
    runs: |
      set -x
      cd ext
      ./configure

  - name: Make install
    runs: |
      set -x
      cd ext
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=opentelemetry.so" > "${{targets.subpkgdir}}/etc/php/conf.d/opentelemetry.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-php-instrumentation

test:
  environment:
    contents:
      packages:
        - php-${{vars.phpMM}}
        - ${{package.name}}-config
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify extension loads and provides core functionality
      runs: |
        # Verify the extension is listed as available
        php -d extension=opentelemetry.so -m | grep -i opentelemetry

        # Verify the extension's hook functions are available
        php -d extension=opentelemetry.so -r "
          if (!extension_loaded('opentelemetry')) {
            echo 'ERROR: opentelemetry extension not loaded';
            exit(1);
          }
          echo 'Extension loaded: ' . phpversion('opentelemetry') . PHP_EOL;

          // Verify core hook functions provided by the extension exist
          if (!function_exists('OpenTelemetry\Instrumentation\hook')) {
            echo 'ERROR: hook function not available';
            exit(1);
          }
          echo 'hook() function available' . PHP_EOL;
          echo 'OpenTelemetry extension functional' . PHP_EOL;
        "
