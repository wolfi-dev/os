package:
  name: php-8.1-pecl-pdosqlsrv
  version: "5.13.3"
  epoch: 1 # go/wolfi-rsc/php-8.1-pecl-pdosqlsrv
  description: "Provides PHP ${{vars.phpMM}} Microsoft Drivers for SQL Server (PDO_SQLSRV) - PECL"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - php-${{vars.phpMM}}
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - binutils
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - gcc
      - libtool
      - php-${{vars.phpMM}}-dev
      - unixodbc-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/microsoft/msphpsql
      tag: "v${{package.version}}"
      expected-commit: 7f7ba3a52650f0b2f64662f1f169a46f3134679c

  - runs: |
      cd source
      bash ./packagize.sh

  - working-directory: source/pdo_sqlsrv
    uses: pecl/phpize

  - working-directory: source/pdo_sqlsrv
    uses: autoconf/make

  - working-directory: source/pdo_sqlsrv
    uses: pecl/install
    with:
      extension: "pdo_sqlsrv"

  - uses: strip

update:
  enabled: true
  github:
    identifier: microsoft/msphpsql
    strip-prefix: v
    tag-filter-prefix: v

test:
  environment:
    contents:
      packages:
        - php-${{vars.phpMM}}
        - php-${{vars.phpMM}}-pdo
  pipeline:
    - name: Verify pdo_sqlsrv extension loads
      runs: |
        php -m | grep -i pdo_sqlsrv
        php -r "
        if (!extension_loaded('pdo_sqlsrv')) {
            die('pdo_sqlsrv extension is not loaded\n');
        }
        echo 'pdo_sqlsrv extension loaded successfully\n';"
    - uses: test/tw/ldd-check
