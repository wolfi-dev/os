package:
  name: php-8.1-xdebug
  version: "3.5.3"
  epoch: 1
  description: "Step Debugger for PHP"
  copyright:
    - license: PHP-3.01
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/xdebug/xdebug
      tag: "${{package.version}}"
      expected-commit: 127bbcb980400752221cfaa54bdc1420e6ef3c12

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: ./configure

  - uses: autoconf/make

  - name: Make install
    runs: INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "zend_extension=xdebug.so" > "${{targets.subpkgdir}}/etc/php/conf.d/xdebug.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

update:
  enabled: true
  github:
    identifier: xdebug/xdebug
    use-tag: true

test:
  pipeline:
    - name: Verify extension is loaded
      runs: |
        php -d zend_extension=xdebug.so -m | grep -i xdebug
    - name: Verify extension version
      runs: |
        php -d zend_extension=xdebug.so -r 'echo phpversion("xdebug");' | grep -E '^[0-9]+\.[0-9]+'
    - name: Test code coverage functionality
      runs: |
        php -d zend_extension=xdebug.so -d xdebug.mode=coverage -r '
          xdebug_start_code_coverage();
          $x = 1 + 1;
          $cov = xdebug_get_code_coverage();
          xdebug_stop_code_coverage();
          if (!is_array($cov)) exit(1);
          echo "Coverage collection works\n";
        '
    - name: Test var_dump enhancement
      runs: |
        php -d zend_extension=xdebug.so -d xdebug.mode=develop -r '
          ob_start();
          var_dump(["key" => "value"]);
          $out = ob_get_clean();
          if (strpos($out, "key") === false) exit(1);
          echo "var_dump enhancement works\n";
        '
    - uses: test/tw/ldd-check
