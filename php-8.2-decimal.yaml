package:
  name: php-8.2-decimal
  version: "2.0.2"
  epoch: 1
  description: Correctly-rounded, arbitrary-precision decimal arithmetic for PHP
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - mpdecimal-dev
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/php-decimal/ext-decimal
      tag: "v${{package.version}}"
      expected-commit: d09287c18c26082f0286fb1414e0dc127416c878

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: ./configure

  - uses: autoconf/make

  - name: Make install
    runs: INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=decimal.so" > "${{targets.subpkgdir}}/etc/php/conf.d/decimal.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

update:
  enabled: true
  github:
    identifier: php-decimal/ext-decimal
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-config
        - php-${{vars.phpMM}}
  pipeline:
    - name: Verify decimal extension loads
      runs: |
        php -r "
          if (!extension_loaded('decimal')) {
            die('decimal extension not loaded\n');
          }
          echo 'decimal extension loaded OK\n';
        "
    - name: Test decimal class exists
      runs: |
        php -r "
          if (!class_exists('Decimal\Decimal')) {
            die('Decimal\Decimal class not found\n');
          }
          echo 'Decimal\Decimal class exists OK\n';
          if (!class_exists('Decimal\Rational')) {
            die('Decimal\Rational class not found\n');
          }
          echo 'Decimal\Rational class exists OK\n';
        "
    - uses: test/tw/ldd-check
