package:
  name: php-8.2-msgpack
  version: 3.0.0
  epoch: 6
  description: "A PHP extension for msgpack"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/msgpack/msgpack-php
      # The tag has a msgpack- prefix, but the version does not.
      tag: msgpack-${{package.version}}
      expected-commit: a934abefac024c02e78c930a4702026dd08459cc

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: ./configure --with-msgpack

  - uses: autoconf/make

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=msgpack.so" > "${{targets.subpkgdir}}/etc/php/conf.d/msgpack.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: ${{package.name}}-dev
    description: PHP ${{vars.phpMM}} msgpack development headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage

update:
  enabled: true
  github:
    identifier: msgpack/msgpack-php
    tag-filter-prefix: msgpack-
    strip-prefix: msgpack-

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Functional msgpack test
      runs: |
        php -d extension=msgpack.so -r '
          $data = ["hello" => "world", "num" => 42, "arr" => [1, 2, 3]];
          $packed = msgpack_pack($data);
          if (empty($packed)) {
            echo "FAIL: msgpack_pack returned empty result\n";
            exit(1);
          }
          $unpacked = msgpack_unpack($packed);
          if ($unpacked["hello"] !== "world") {
            echo "FAIL: string value mismatch\n";
            exit(1);
          }
          if ($unpacked["num"] !== 42) {
            echo "FAIL: integer value mismatch\n";
            exit(1);
          }
          if ($unpacked["arr"] !== [1, 2, 3]) {
            echo "FAIL: array value mismatch\n";
            exit(1);
          }
          echo "OK: msgpack serialize/deserialize works\n";
        '
