package:
  name: php-8.2-xdebug
  version: "3.5.3"
  epoch: 1
  description: "Step Debugger for PHP"
  copyright:
    - license: PHP-3.01
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}
  resources:
    cpu: "1"
    memory: 4Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/xdebug/xdebug
      tag: "${{package.version}}"
      expected-commit: 127bbcb980400752221cfaa54bdc1420e6ef3c12

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: ./configure

  - uses: autoconf/make

  - name: Make install
    runs: INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "zend_extension=xdebug.so" > "${{targets.subpkgdir}}/etc/php/conf.d/xdebug.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

update:
  enabled: true
  github:
    identifier: xdebug/xdebug
    use-tag: true

test:
  environment:
    contents:
      packages:
        - php-${{vars.phpMM}}
        - php-${{vars.phpMM}}-xdebug
        - php-${{vars.phpMM}}-xdebug-config
  pipeline:
    - name: Verify xdebug extension is loaded
      runs: |
        php -r "if (!extension_loaded('xdebug')) { die('xdebug extension is not loaded\n'); } echo 'xdebug extension loaded OK\n';"
    - name: Verify xdebug version
      runs: |
        php -r "
          \$ver = phpversion('xdebug');
          if (\$ver === false) { echo \"xdebug extension not loaded\n\"; exit(1); }
          echo 'xdebug version: ' . \$ver . \"\n\";
        "
    - name: Test xdebug function stack tracing
      runs: |
        php -r "
          function inner() { return xdebug_get_function_stack(); }
          function outer() { return inner(); }
          \$stack = outer();
          if (!is_array(\$stack) || count(\$stack) < 2) {
            echo \"xdebug_get_function_stack() did not return expected stack\n\";
            exit(1);
          }
          echo 'xdebug stack trace OK, depth: ' . count(\$stack) . \"\n\";
        "
    - name: Test xdebug code coverage
      runs: |
        php -d xdebug.mode=coverage -r "
          xdebug_start_code_coverage(XDEBUG_CC_UNUSED | XDEBUG_CC_DEAD_CODE);
          \$x = 1 + 1;
          \$cov = xdebug_get_code_coverage();
          xdebug_stop_code_coverage();
          if (!is_array(\$cov)) {
            echo \"xdebug_get_code_coverage() did not return an array\n\";
            exit(1);
          }
          echo 'xdebug code coverage OK\n';
        "
    - uses: test/tw/ldd-check
