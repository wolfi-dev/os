package:
  name: php-8.2
  version: "8.2.34"
  epoch: 4 # GHSA-w8hw-w9fx-j79w: PHP maintainers' memory-limit (interrupted-operation) series, pre-disclosure
  description: "the PHP programming language"
  copyright:
    - license: PHP-3.01
  dependencies:
    provides:
      - php=${{package.full-version}}
    runtime:
      - ${{package.name}}-config
      - libxml2
      - merged-bin
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "48"
    memory: 32Gi

vars:
  openssl-version: "4.0"

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d\.\d+)
    replace: $1
    to: phpMM

environment:
  contents:
    packages:
      - aom-dev
      - apache2-dev
      - apache2-utils
      - autoconf
      - bison
      - build-base
      - busybox
      - bzip2-dev
      - ca-certificates-bundle
      - curl-dev
      - dav1d-dev
      - file
      - freetds
      - freetds-dev
      - freetype-dev
      - glibc-2.44-dev
      - gmp-dev
      - icu-dev
      - libavif-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libpsl-dev
      - libsodium-dev
      - libtool
      - libwebp-dev
      - libx11-dev
      - libxml2-dev
      - libxpm-dev
      - libxslt-dev
      - libzip-dev
      - nghttp2-dev
      - oniguruma-dev
      - openldap-dev
      - openssl-${{vars.openssl-version}}-dev
      - patch
      - pcre2-dev
      - postgresql-dev
      - re2c
      - readline-dev
      - sqlite-dev
      - tidy-html5-dev
      - unixodbc-dev
      - wget

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/php/php-src
      tag: php-${{package.version}}
      expected-commit: 0be211a0cf752780881a9611224f8adc516af573

  # https://gitlab.alpinelinux.org/alpine/aports/-/blob/master/community/php82/install-pear.patch
  - uses: patch
    with:
      patches: install-pear.patch

  # TODO: remove when resolved upstream (https://github.com/php/php-src/pull/24304)
  - uses: patch
    with:
      patches: openssl-ssl-ctx-options-uint64.patch

  # GHSA-w8hw-w9fx-j79w (pre-disclosure): the PHP maintainers' fix series for the memory_limit
  # bailout class: the (un)serialize context and the session globals surviving an
  # interrupted request startup, and the Zend hash bucket counted before its key is
  # allocated. Derived copy of the private branch GHSA-h37m-fxqh-w76h-throw-2-fallible-8.2;
  # provenance and the two dropped content-less stanzas are in the patch header.
  - uses: patch
    with:
      patches: GHSA-w8hw-w9fx-j79w.patch

  - name: Configure
    runs: |
      ./buildconf --force
      EXTENSION_DIR=/usr/lib/php/modules ./configure \
        --prefix=/usr \
        --libdir=/usr/lib/php \
        --sbindir=/usr/bin \
        --datadir=/usr/share/php \
        --sysconfdir=/etc/php \
        --localstatedir=/var \
        --with-layout=GNU \
        --with-pic \
        --with-config-file-path=/etc/php \
        --with-config-file-scan-dir=/etc/php/conf.d \
        --enable-cli \
        --enable-ctype=shared \
        --enable-bcmath=shared \
        --with-curl=shared \
        --enable-dom=shared \
        --enable-fileinfo=shared \
        --with-iconv=shared \
        --with-openssl=shared \
        --with-readline \
        --enable-ftp=shared \
        --with-sodium=shared \
        --enable-fpm \
        --with-pear \
        --enable-gd=shared \
        --with-avif \
        --with-freetype \
        --with-jpeg \
        --with-webp \
        --with-xpm \
        --disable-gd-jis-conv \
        --with-libxml \
        --enable-phar=shared \
        --enable-mbstring=shared \
        --with-mysqli=shared \
        --with-mysql-sock=/run/mysqld/mysqld.sock \
        --enable-mysqlnd=shared \
        --enable-pdo=shared \
        --with-pdo-mysql=shared,mysqlnd \
        --with-pdo-sqlite=shared \
        --with-pdo-dblib=shared \
        --with-pdo-pgsql=shared \
        --with-pdo-odbc=shared,unixODBC,/usr \
        --with-unixODBC=shared,/usr \
        --enable-pcntl=shared \
        --enable-sockets=shared \
        --with-bz2=shared \
        --enable-calendar=shared \
        --enable-exif=shared  \
        --with-gettext=shared  \
        --with-gmp=shared  \
        --enable-intl=shared  \
        --with-ldap=shared  \
        --enable-opcache=shared  \
        --enable-soap=shared  \
        --with-tidy=shared,/usr \
        --with-xsl=shared \
        --with-zlib \
        --enable-xml=shared \
        --enable-simplexml=shared \
        --enable-xml=shared \
        --enable-xmlreader=shared \
        --enable-xmlwriter=shared \
        --enable-posix=shared \
        --with-pgsql=shared \
        --with-zip=shared \
        --enable-sysvsem=shared \
        --enable-sysvshm=shared \
        --with-apxs2=/usr/bin/apxs \
        --enable-phpdbg=shared \
        --with-external-pcre

  - uses: autoconf/make

  - name: Regenerate the VM executor for GHSA-w8hw-w9fx-j79w
    runs: |
      # Zend/zend_vm_execute.h is generated from Zend/zend_vm_def.h and carries the
      # -diff attribute upstream, so the maintainers' series could not carry it as
      # text (see the patch header). Regenerate it with the in-tree generator, run by
      # the CLI the build above produced, check the result against the maintainers'
      # blob and rebuild what depends on it.
      blob() { { printf 'blob %s\0' "$(stat -c %s "$1")"; cat "$1"; } | sha1sum | cut -c1-40; }
      before=$(blob Zend/zend_vm_execute.h)
      sapi/cli/php -n -d memory_limit=-1 Zend/zend_vm_gen.php
      after=$(blob Zend/zend_vm_execute.h)
      echo "GHSA-w8hw-w9fx-j79w zend_vm_execute.h blob: before=$before after=$after series=39bdd2e80b..0c2938b37d"
      case "$after" in
        0c2938b37d*) echo "regenerated executor matches the maintainers' branch" ;;
        *)
          case "$before" in
            39bdd2e80b*) echo "ERROR: the regenerated executor does not reproduce the maintainers' blob" >&2; exit 1 ;;
            *) echo "WARNING: the executor at this tag differs from the series merge-base (upstream drift); the regenerated file cannot be compared" ;;
          esac ;;
      esac
      rm -f Zend/zend_execute.lo Zend/zend_execute.o Zend/.libs/zend_execute.o
      make -j"$(nproc)"

  - name: Copy httpd.conf before install for apxs
    runs: |
      # httpd.conf needs to be in the /home/build/melange-out/php-<VERSION>/etc/apache2/ directory
      # otherwise `make install` complains that it cannot find it.
      mkdir -p ${{targets.destdir}}/etc/apache2
      cp /etc/apache2/httpd.conf ${{targets.destdir}}/etc/apache2/httpd.conf

  - name: Make Install
    runs: |
      INSTALL_ROOT=${{targets.destdir}} DESTDIR=${{targets.destdir}} make install

  - name: Remove httpd.conf after install for apxs
    runs: |
      # After `make install` the httpd.conf file is not needed anymore,
      # so remove it to avoid conflicts with the apache2 package, as it already provides.
      rm -f ${{targets.destdir}}/etc/apache2/httpd.conf

  - name: Remove /var/run (only used by init scripts and services not shipped here)
    runs: rmdir ${{targets.destdir}}/var/run

  - uses: strip

data:
  - name: extensions
    items:
      bz2: Bzip2
      curl: cURL
      gd: GD imaging
      gmp: GNU GMP support
      ldap: LDAP
      mysqlnd: MySQLnd
      openssl: OpenSSL
      pdo_mysql: MySQL driver for PDO
      pdo_sqlite: SQLite 3.x driver for PDO
      pdo_dblib: PDO driver for Sybase / MS SQL databases
      pdo_pgsql: PDO driver for pgsql
      pdo_odbc: PDO driver for ODBC
      soap: SOAP
      sodium: Sodium
      calendar: Calendar
      exif: EXIF
      gettext: GetText
      intl: Internationalization
      mbstring: Multibyte String Functions
      opcache: Opcache
      pcntl: pcntl
      pdo: PHP Data Objects
      phar: PHP Archive
      sockets: Sockets
      tidy: HTML Tidy
      xsl: XSL
      bcmath: BC Math
      ctype: ctype
      iconv: Iconv
      dom: DOM
      pgsql: PostgreSQL
      posix: Posix
      simplexml: SimpleXML
      mysqli: MySQLi
      xml: XML
      xmlreader: XMLReader
      xmlwriter: XMLWriter
      fileinfo: fileinfo
      zip: Zip
      odbc: UnixODBC
      ftp: FTP
      sysvsem: System V Semaphores
      sysvshm: System V Shared Memory

subpackages:
  - name: ${{package.name}}-config
    dependencies:
      provides:
        - php-config=${{package.full-version}}
      runtime:
        - merged-bin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          mv php.ini-production ${{targets.subpkgdir}}/etc/php/php.ini
    test:
      pipeline:
        - uses: test/tw/configpackage

  - range: extensions
    name: "${{package.name}}-${{range.key}}"
    description: "The ${{range.value}} extension"
    dependencies:
      runtime:
        - "${{package.name}}-${{range.key}}-config"
        - merged-bin
        - merged-usrsbin
        - wolfi-baselayout
      provides:
        - php-${{range.key}}=${{package.full-version}}
    pipeline:
      - runs: |
          export EXTENSIONS_DIR=usr/lib/php/modules
          mkdir -p "${{targets.subpkgdir}}"/$EXTENSIONS_DIR
          mv "${{targets.destdir}}/$EXTENSIONS_DIR/${{range.key}}.so" \
            "${{targets.subpkgdir}}/$EXTENSIONS_DIR/${{range.key}}.so"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - range: extensions
    name: "${{package.name}}-${{range.key}}-config"
    description: "The ${{range.value}} extension configuration"
    dependencies:
      provides:
        - php-${{range.key}}-config=${{package.full-version}}
      runtime:
        - merged-bin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          export CONF_DIR="${{targets.subpkgdir}}/etc/php/conf.d"
          mkdir -p $CONF_DIR
          order=10
          prefix=
          [ "${{range.key}}" != "opcache" ] || prefix="zend_"
          # Determine load order based on number of dependencies found in config.w32
          [ -f "ext/${{range.key}}/config.w32" ] && \
            deps=`sed -En "s/.*ADD_EXTENSION_DEP\('${{range.key}}', ([^)]+)\).*/\1/p" "ext/${{range.key}}/config.w32" \
                | tr -d "'," | tr ' ' '\n' \
                | sort -u \
                | while read -r dep; do
                  [ "$dep" = "true" ] || echo $dep
                done | wc -w`
          echo "${prefix}extension=${{range.key}}.so" > $CONF_DIR/"$((order+order*deps))-${{range.key}}.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: ${{package.name}}-dev
    description: PHP 8.2 development headers
    dependencies:
      provides:
        - php-dev=${{package.full-version}}
      runtime:
        - merged-bin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - uses: split/dev
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/phpize ${{targets.subpkgdir}}/usr/bin/
          mv ${{targets.destdir}}/usr/lib ${{targets.subpkgdir}}/usr
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: php-dev
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-doc
    description: PHP 8.2 documentation
    dependencies:
      provides:
        - php-doc=${{package.full-version}}
      runtime:
        - merged-bin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

  - name: "${{package.name}}-apache"
    description: Apache SAPI for PHP ${{vars.phpMM}}
    dependencies:
      provides:
        - php-apache=${{package.full-version}}
      runtime:
        - merged-bin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/apache2/modules
          mv /home/build/libs/libphp.so ${{targets.subpkgdir}}/usr/lib/apache2/modules/
          install -Dm644 apache.conf ${{targets.subpkgdir}}/etc/apache2/extra/php_module.conf
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
            - apache2 # Ensure that we properly install the subpackage along with the main package and apache2
            - apache2-compat
      pipeline:
        - uses: test/tw/ldd-check
        - runs: stat /usr/lib/apache2/modules/libphp.so

  - name: "${{package.name}}-cgi"
    description: PHP 8.2 CGI
    dependencies:
      provides:
        - php-cgi=${{package.full-version}}
      runtime:
        - merged-bin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/php-cgi ${{targets.subpkgdir}}/usr/bin/
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: php-cgi
            real-pkg-name: ${{subpkg.name}}

  - name: "${{package.name}}-dbg"
    description: Interactive PHP Debugger
    dependencies:
      provides:
        - php-dbg=${{package.full-version}}
      runtime:
        - merged-bin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/phpdbg ${{targets.subpkgdir}}/usr/bin/
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: php-dbg
            real-pkg-name: ${{subpkg.name}}

  - name: "${{package.name}}-fpm"
    description: PHP 8.2 FastCGI Process Manager (FPM)
    dependencies:
      runtime:
        - "${{package.name}}-fpm-config"
        - merged-bin
        - merged-usrsbin
        - wolfi-baselayout
      provides:
        - php-fpm=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/php-fpm ${{targets.subpkgdir}}/usr/bin/
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: php-fpm
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-fpm-config
    description: PHP 8.2 FastCGI Process Manager (FPM) configuration
    dependencies:
      provides:
        - php-fpm-config=${{package.full-version}}
      runtime:
        - merged-bin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/etc/php/php-fpm.d
          mv ${{targets.destdir}}/etc/php/php-fpm.conf.default ${{targets.subpkgdir}}/etc/php/php-fpm.conf
          mv ${{targets.destdir}}/etc/php/php-fpm.d/www.conf.default ${{targets.subpkgdir}}/etc/php/php-fpm.d/www.conf \
          && { \
            echo '[global]'; \
            echo 'error_log = /proc/self/fd/2'; \
            echo 'daemonize = no'; \
            echo; \
            echo '[www]'; \
            echo 'listen = [::]:9000'; \
            echo 'access.log = /proc/self/fd/2'; \
            echo; \
            echo 'clear_env = no'; \
            echo; \
            echo 'catch_workers_output = yes'; \
            echo; \
            echo 'decorate_workers_output = no'; \
          } | tee ${{targets.subpkgdir}}/etc/php/php-fpm.d/zz-apko.conf
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: php-fpm-config
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-pear
    description: PHP ${{vars.phpMM}} PEAR package manager
    dependencies:
      runtime:
        - ${{package.name}}
        - ${{package.name}}-xml
        - ${{package.name}}-openssl
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mkdir -p ${{targets.subpkgdir}}/usr/share/php

          # Move PEAR executables
          mv ${{targets.destdir}}/usr/bin/pear ${{targets.subpkgdir}}/usr/bin/
          mv ${{targets.destdir}}/usr/bin/peardev ${{targets.subpkgdir}}/usr/bin/
          mv ${{targets.destdir}}/usr/bin/pecl ${{targets.subpkgdir}}/usr/bin/

          # Move PEAR libraries
          if [ -d "${{targets.destdir}}/usr/share/php/pear" ]; then
            mv ${{targets.destdir}}/usr/share/php/pear ${{targets.subpkgdir}}/usr/share/php/
          fi
    test:
      pipeline:
        - runs: |
            pear version
            pear config-set preferred_state stable
            pear channel-update pear.php.net
        - runs: |
            echo "Available channels:"
            pear list-channels
            pear install Cache_Lite
            # Verify PEAR functionality by checking if we have core packages
            if pear list | grep -F "PEAR"; then
                echo "PEAR core packages are installed"
            else
                echo "No PEAR packages found"
                exit 1
            fi

update:
  enabled: true
  github:
    identifier: php/php-src
    strip-prefix: php-
    tag-filter-prefix: php-8.2
    use-tag: true

test:
  environment:
    contents:
      packages:
        - postgresql
        - postgresql-client
        - shadow
        - sudo-rs
        - glibc-locales
        - php-8.2-pgsql
        - ${{package.name}}-tidy
    environment:
      PGDATA: /tmp/test_db
      PGUSER: wolfi
  pipeline:
    - uses: test/php-tidy
    - uses: test/tw/ldd-check
    - name: "Test database creation"
      runs: |
        useradd $PGUSER
        sudo -u $PGUSER initdb -D /tmp/test_db
        sudo -u $PGUSER pg_ctl -D /tmp/test_db -l /tmp/logfile start
        sudo -u $PGUSER createdb testdb
        psql -lqt | cut -d \| -f 1 | grep -Fw testdb
        php --help
    - name: "Test basic read/write operations"
      runs: |
        sudo -u $PGUSER psql -d testdb -c "CREATE TABLE test_table (id SERIAL PRIMARY KEY, test_value VARCHAR(50));"
        sudo -u $PGUSER psql -d testdb -c "INSERT INTO test_table (test_value) VALUES ('Hello, Wolfi!');"
        sudo -u $PGUSER psql -d testdb -t -A -c "SELECT test_value FROM test_table WHERE id=1;"
    - name: "Test php"
    - runs: |
        php --version
        php -m
    - runs: |
        cat <<'EOF' >> /tmp/read_db.php
        <?php
        $conn = pg_connect("host=localhost dbname=testdb user=wolfi");
        if (!$conn) {
            echo "Connection error.\n";
            exit;
        }
        $result = pg_query($conn, "SELECT test_value FROM test_table WHERE id=1");
        if (!$result) {
            echo "Error in the query.\n";
            exit;
        }
        $row = pg_fetch_row($result);
        if (!$row) {
            echo "Empty.\n";
            exit;
        }
        echo "Value from test_table: $row[0]\n";
        pg_close($conn);
        ?>
        EOF
        php /tmp/read_db.php
    - name: GHSA-w8hw-w9fx-j79w memory-limit regression
      runs: |
        # The maintainers' series registers memory_hard_limit_percent (ini_get() returns
        # false for a directive PHP does not know) and turns the memory_limit bailout
        # into a delayed fatal error raised at a safe point: the statement after the
        # offending allocation still runs, shutdown functions still run and the process
        # exits 255. One non-fallible request beyond the hard limit (200% of memory_limit
        # by default) ends the process at once with status 137; random_bytes() allocates
        # its result non-fallibly, whereas str_repeat() and friends now allocate fallibly
        # and report the soft limit instead (checked on the built packages, 2026-10-19).
        php -n -i | grep -F memory_hard_limit_percent
        php -n -r 'exit(ini_get("memory_hard_limit_percent") === false ? 1 : 0);'
        cat > /tmp/ghsa-w8hw-w9fx-j79w-oom.php <<'PHPEOF'
        <?php
        register_shutdown_function(function () { echo "shutdown function called\n"; });
        function test() {
            $a = str_repeat('a', 3 * 1024 * 1024);
            $b = $a . $a;
            echo "after the allocation\n";
        }
        test();
        PHPEOF
        rc=0; out=$(php -n -d memory_limit=8M -d display_errors=1 /tmp/ghsa-w8hw-w9fx-j79w-oom.php 2>&1) || rc=$?
        printf '%s\nexit=%s\n' "$out" "$rc"
        [ "$rc" -eq 255 ]
        printf '%s\n' "$out" | grep -F 'Allowed memory size of 8388608 bytes exhausted'
        printf '%s\n' "$out" | grep -F 'after the allocation'
        printf '%s\n' "$out" | grep -F 'shutdown function called'
        rc=0; out=$(php -n -d memory_limit=8M -r 'random_bytes(1 << 30);' 2>&1) || rc=$?
        printf '%s\nexit=%s\n' "$out" "$rc"
        [ "$rc" -eq 137 ]
        printf '%s\n' "$out" | grep -F 'Hard memory limit of 16777216 bytes exhausted'
