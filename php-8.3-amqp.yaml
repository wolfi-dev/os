package:
  name: php-8.3-amqp
  version: "2.2.0"
  epoch: 3 # add test pipelines
  description: "PHP extension to communicate with any AMQP compliant server"
  copyright:
    - license: PHP-3.01
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}
      - rabbitmq-c
  resources:
    cpu: "1"
    memory: 1Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev
      - rabbitmq-c-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/php-amqp/php-amqp
      tag: "v${{package.version}}"
      expected-commit: f2df48496693f8aa2942fad3606838149deb82ea

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: |
      set -x
      ./configure

  - uses: autoconf/make

  - name: Make install
    runs: |
      set -x
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=amqp.so" > "${{targets.subpkgdir}}/etc/php/conf.d/amqp.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

update:
  enabled: true
  github:
    identifier: php-amqp/php-amqp
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - php-${{vars.phpMM}}
  pipeline:
    - name: Verify extension is loaded
      runs: |
        set -euo pipefail
        if [ ! -f /etc/php/conf.d/amqp.ini ]; then
          echo "extension=amqp.so" > /etc/php/conf.d/amqp.ini
        fi
        php -m | grep -F amqp
    - name: Test AMQP extension classes are available
      runs: |
        php -r '
        $classes = ["AMQPConnection", "AMQPChannel", "AMQPExchange", "AMQPQueue", "AMQPEnvelope"];
        foreach ($classes as $class) {
            if (!class_exists($class)) {
                echo "FAIL: class $class not found\n";
                exit(1);
            }
            echo "OK: $class exists\n";
        }
        echo "All AMQP classes available\n";
        '
    - name: Test AMQPConnection constants and methods
      runs: |
        php -r '
        $conn = new AMQPConnection();
        $conn->setHost("localhost");
        $conn->setPort(5672);
        $conn->setVhost("/");
        $conn->setLogin("guest");
        $conn->setPassword("guest");
        if ($conn->getHost() !== "localhost") {
            echo "FAIL: getHost() returned unexpected value\n";
            exit(1);
        }
        if ($conn->getPort() !== 5672) {
            echo "FAIL: getPort() returned unexpected value\n";
            exit(1);
        }
        echo "AMQPConnection configuration OK\n";
        '
    - uses: test/tw/ldd-check
