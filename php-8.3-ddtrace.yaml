package:
  name: php-8.3-ddtrace
  version: "2.0.0"
  epoch: 0 # rust: 1.99->1.100
  description: "Datadog PHP Clients"
  copyright:
    - license: Apache-2.0 OR BSD-3-Clause
  dependencies:
    runtime:
      - ${{package.name}}-config
      - ${{package.name}}-src
      - php-${{vars.phpMM}}
  resources:
    cpu: "9"
    memory: 20Gi
  test-resources:
    memory: 1Gi

vars:
  rust-version: 1.100

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - clang-23
      - cmake
      - curl-dev
      - glibc-2.44-dev
      - libclang-cpp-23
      - libtool
      - pcre2-dev
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev
      - posix-libc-utils
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/DataDog/dd-trace-php
      tag: "${{package.version}}"
      expected-commit: 40e4fb9be4eed6cf108dae79583b3817323a7081

  - name: Clone submodules
    runs: git submodule update --init --recursive

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: |
      # As of 2.0.0 the tracer, the profiler and AppSec are a single
      # ddtrace.so. The standalone ddappsec.so and datadog-profiling.so
      # extensions are no longer built (loading ddappsec.so next to
      # ddtrace.so is a fatal error).
      ./configure \
        --enable-ddtrace-appsec \
        --enable-ddtrace-profiling

  - name: Make install
    runs: INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=ddtrace.so" > "${{targets.subpkgdir}}/etc/php/conf.d/ddtrace.ini"
          echo "datadog.trace.sources_path=\"/usr/share/dd-trace-php/src\"" >> "${{targets.subpkgdir}}/etc/php/conf.d/ddtrace.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage
          with:
            dir: /etc/php/conf.d/

  - name: ${{package.name}}-src
    description: "Datadog PHP tracer source files"
    dependencies:
      runtime:
        - php-${{vars.phpMM}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/share/dd-trace-php"
          cp -r src "${{targets.subpkgdir}}/usr/share/dd-trace-php/"
    test:
      pipeline:
        - uses: test/tw/srcpackage
          with:
            dir: /usr/share/dd-trace-php/src/

  - name: ${{package.name}}-appsec
    description: "Datadog PHP Application Security extension"
    dependencies:
      runtime:
        - ${{package.name}}
        - ${{package.name}}-appsec-config
        - php-${{vars.phpMM}}
    pipeline:
      - runs: |
          # AppSec is compiled into ddtrace.so as of 2.0.0; this package
          # only ships the default ruleset.
          sharedir="${{targets.subpkgdir}}/usr/share/dd-trace-php/etc"
          mkdir -p "$sharedir"
          install -Dm644 appsec/recommended.json "$sharedir/recommended.json"
    test:
      environment:
        contents:
          packages:
            - php-${{vars.phpMM}}
            - ${{package.name}}
            - ${{package.name}}-config
            - ${{package.name}}-appsec-config
            - ${{package.name}}-src
      pipeline:
        - name: Verify appsec is part of the loaded ddtrace extension
          runs: |
            php -m | grep -F "ddtrace"
        - name: Verify appsec INI settings are recognized
          runs: |
            php -i | grep -F "datadog.appsec.enabled"
            php -i | grep -F "datadog.appsec.rules"
        - name: Verify is_enabled function exists
          runs: |
            php -r 'var_dump(function_exists("Datadog\AppSec\is_enabled"));' | grep -F "bool(true)"
        - name: Verify rules file is installed
          runs: |
            stat /usr/share/dd-trace-php/etc/recommended.json
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-appsec-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "datadog.appsec.rules=/usr/share/dd-trace-php/etc/recommended.json" > "${{targets.subpkgdir}}/etc/php/conf.d/ddappsec.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: ${{package.name}}-profiling
    description: "Datadog PHP Profiling extension"
    dependencies:
      runtime:
        - ${{package.name}}
        - ${{package.name}}-profiling-config
        - php-${{vars.phpMM}}
    pipeline:
      - runs: |
          # The profiler is compiled into ddtrace.so as of 2.0.0 and is
          # opt-in; this package only enables it through its -config package.
          mkdir -p "${{targets.subpkgdir}}"
    test:
      environment:
        contents:
          packages:
            - php-${{vars.phpMM}}
            - ${{package.name}}
            - ${{package.name}}-config
            - ${{package.name}}-profiling-config
            - ${{package.name}}-src
      pipeline:
        - name: Verify ddtrace extension is loaded
          runs: |
            php -m | grep -F "ddtrace"
        - name: Verify profiling is enabled and appears in phpinfo
          runs: |
            php -i | grep -F "datadog.profiling.enabled"
            php -r 'if (!filter_var(ini_get("datadog.profiling.enabled"), FILTER_VALIDATE_BOOLEAN)) { echo "profiling not enabled\n"; exit(1); }'
        - name: Verify profiling is part of the ddtrace extension
          runs: |
            php -r '
              $mods = get_loaded_extensions();
              if (!in_array("ddtrace", $mods)) { echo "ddtrace not loaded\n"; exit(1); }
              if (in_array("datadog-profiling", $mods)) { echo "standalone datadog-profiling must not be loaded\n"; exit(1); }
              echo "ddtrace with built-in profiling loaded successfully\n";
            '
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-profiling-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "datadog.profiling.enabled=On" > "${{targets.subpkgdir}}/etc/php/conf.d/datadog-profiling.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

test:
  environment:
    contents:
      packages:
        - php-${{vars.phpMM}}
        - ${{package.name}}-config
        - ${{package.name}}-src
  pipeline:
    - name: Verify Extension is Loaded
      runs: |
        php -m | grep -i 'ddtrace'
        if [ $? -ne 0 ]; then
          echo "Test failed: ddtrace extension is not loaded."
          exit 1
        else
          echo "Test passed: ddtrace extension is loaded."
        fi
    - name: Test Basic ddtrace Functionality
      runs: |
        echo "<?php
        use function DDTrace\trace_method;
        use function DDTrace\trace_function;

        \DDTrace\trace_method('App', 'get', function () {
          echo \"Datadog tracer is running and trace method was created.\n\";
        });

        \DDTrace\trace_function('App\some_utility_function', function () {
          echo \"Datadog tracer is running and trace function was created.\n\";
        });
        ?>" > test.php

        php test.php

        if [ $? -ne 0 ]; then
          echo "Test failed: Unable to use ddtrace extension."
          exit 1
        else
          echo "Test passed: ddtrace extension is functional."
        fi
    - name: Test PHP Class Availability
      runs: |
        php -r 'if (!class_exists("DDTrace\\GlobalTracer")) exit(1);'
        if [ $? -ne 0 ]; then
          echo "Test failed: DDTrace\\GlobalTracer class is not available."
          exit 1
        else
          echo "Test passed: DDTrace\\GlobalTracer class is available."
        fi
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: DataDog/dd-trace-php
    use-tag: true
