package:
  name: php-8.3-ds
  version: "2.0.0"
  epoch: 2
  description: "An extension providing efficient data structures for PHP"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}
  resources:
    cpu: "1"
    memory: 6Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - glibc-2.43-dev
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/php-ds/ext-ds
      tag: "v${{package.version}}"
      expected-commit: 132ca69b19c80fba8a447f87d656c27596f43cec

  - name: Prepare build
    runs: phpize

  - name: Build
    runs: |
      set -x
      ./configure

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=ds.so" > "${{targets.subpkgdir}}/etc/php/conf.d/ds.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

update:
  enabled: true
  github:
    identifier: php-ds/ext-ds
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-config
        - php-${{vars.phpMM}}
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify ds extension is loaded
      runs: |
        php -d extension=ds.so -r 'exit(extension_loaded("ds") ? 0 : 1);' || (echo "ds extension not loaded" && exit 1)
    - name: List available Ds classes
      runs: |
        php -d extension=ds.so -r '
          $classes = array_filter(get_declared_classes(), function($c) {
            return strpos($c, "Ds\\") === 0;
          });
          sort($classes);
          echo implode("\n", $classes) . "\n";
        '
    - name: Test Ds\\Seq operations
      runs: |
        php -d extension=ds.so -r '
          $v = new \Ds\Seq([1, 2, 3]);
          $v->push(4);
          if ($v->count() !== 4) { echo "Seq count failed\n"; exit(1); }
          if ($v->get(0) !== 1) { echo "Seq get failed\n"; exit(1); }
          echo "Ds\\Seq OK\n";
        '
    - name: Test Ds\\Map operations
      runs: |
        php -d extension=ds.so -r '
          $m = new \Ds\Map(["a" => 1, "b" => 2]);
          $m->put("c", 3);
          if ($m->count() !== 3) { echo "Map count failed\n"; exit(1); }
          if ($m->get("b") !== 2) { echo "Map get failed\n"; exit(1); }
          if (!$m->hasKey("c")) { echo "Map hasKey failed\n"; exit(1); }
          echo "Ds\\Map OK\n";
        '
    - name: Test Ds\\Set operations
      runs: |
        php -d extension=ds.so -r '
          $s = new \Ds\Set([1, 2, 3, 2, 1]);
          if ($s->count() !== 3) { echo "Set count failed: expected 3, got " . $s->count() . "\n"; exit(1); }
          if (!$s->contains(2)) { echo "Set contains failed\n"; exit(1); }
          $s->remove(2);
          if ($s->contains(2)) { echo "Set remove failed\n"; exit(1); }
          echo "Ds\\Set OK\n";
        '
