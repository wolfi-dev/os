package:
  name: php-8.3-igbinary
  version: 3.2.16
  epoch: 7
  description: "Igbinary is a drop in replacement for the standard php serializer."
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/igbinary/igbinary
      tag: ${{package.version}}
      expected-commit: 8326f6a69ebb30dd6258dd536eb0914454fbf146

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: |
      set -x
      ./configure CFLAGS="-O2 -g" --enable-igbinary

  - uses: autoconf/make

  - name: Make install
    runs: |
      set -x
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=igbinary.so" > "${{targets.subpkgdir}}/etc/php/conf.d/igbinary.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: ${{package.name}}-dev
    description: PHP ${{vars.phpMM}} igbinary development headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage

update:
  enabled: true
  github:
    identifier: igbinary/igbinary

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Functional test - serialize and unserialize
      runs: |
        php -d extension=igbinary.so -r '
          $data = ["hello" => "world", "num" => 42, "arr" => [1, 2, 3]];
          $serialized = igbinary_serialize($data);
          if ($serialized === false) { echo "FAIL: igbinary_serialize returned false\n"; exit(1); }
          $unserialized = igbinary_unserialize($serialized);
          if ($unserialized !== $data) { echo "FAIL: round-trip mismatch\n"; exit(1); }
          echo "PASS: igbinary serialize/unserialize round-trip succeeded\n";
        '
