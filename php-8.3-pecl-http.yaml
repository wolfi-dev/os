package:
  name: php-8.3-pecl-http
  version: "4.3.1"
  epoch: 11 # http.so requires the raphf module at run time
  description: "Provides PHP ${{vars.phpMM}} HTTP module for PHP Extended HTTP Support- PECL"
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-pecl-raphf # http.so requires the raphf module and does not load without it
  resources:
    cpu: "1"
    memory: 2Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

vars:
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - binutils
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - curl-dev
      - gcc
      - glibc-2.44-dev
      - icu-dev
      - libtool
      - openssl-hardened-${{vars.openssl-version}}-dev
      - php-${{vars.phpMM}}-dev
      - php-${{vars.phpMM}}-pecl-raphf
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/m6w6/ext-http
      tag: v${{package.version}}
      expected-commit: 705491493e8292a51687824e6ede98c9b7a20ba9

  - uses: pecl/phpize

  - uses: autoconf/make

  - uses: pecl/install
    with:
      extension: "http"

  - uses: strip

update:
  enabled: true
  github:
    identifier: m6w6/ext-http
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - name: Verify the http extension loads
      runs: |
        # "php -m" prints one loaded module per line. Nothing is installed for this test besides the package, so raphf, which http.so requires, is here through the package's own runtime dependency.
        php -m | grep -Fx http
    - uses: test/tw/ldd-check
