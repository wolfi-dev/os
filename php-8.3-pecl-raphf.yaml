package:
  name: php-8.3-pecl-raphf
  version: 2.0.1
  epoch: 5
  description: "Provides PHP ${{vars.phpMM}} resource and persistent handles factory - PECL"
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - php-${{vars.phpMM}}

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - automake
      - binutils
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - gcc
      - libtool
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/m6w6/ext-raphf
      tag: "release-${{package.version}}"
      expected-commit: f52e2bcd62aa733f00454bb61933b83443d3e7cb

  - uses: pecl/phpize

  - uses: autoconf/make

  - uses: pecl/install
    with:
      extension: "raphf"

  - runs: |
      # PHP initialization is order dependent. So we will explicitly
      # load this by prefixing the file with 10- so it runs before
      # other modules which start with letters starts.
      mv ${{targets.destdir}}/etc/php/conf.d/raphf.ini ${{targets.destdir}}/etc/php/conf.d/10-raphf.ini

  - uses: strip

update:
  enabled: true
  github:
    identifier: m6w6/ext-raphf
    strip-prefix: release-
    tag-filter: release-

test:
  environment:
    contents:
      packages:
        - php-${{vars.phpMM}}
  pipeline:
    - name: Verify raphf extension is loaded
      runs: |
        php -r "if (!extension_loaded('raphf')) { die('raphf extension is not loaded\n'); } echo 'raphf extension loaded OK\n';"
    - name: Verify raphf persistent handle factory API
      runs: |
        php -r "
          if (!extension_loaded('raphf')) {
            die('raphf extension is not loaded\n');
          }

          // Verify the extension version is reported
          \$ext = new ReflectionExtension('raphf');
          \$version = \$ext->getVersion();
          if (empty(\$version)) {
            die('raphf extension version is empty\n');
          }
          echo 'raphf version: ' . \$version . '\n';

          // Verify raphf exposes its persistent handle factory functions
          if (!function_exists('raphf_get_persistent_handles')) {
            die('raphf_get_persistent_handles() function not found\n');
          }
          \$handles = raphf_get_persistent_handles();
          if (!is_array(\$handles)) {
            die('raphf_get_persistent_handles() did not return an array\n');
          }
          echo 'raphf_get_persistent_handles() returned array with ' . count(\$handles) . ' entries\n';

          echo 'raphf extension functional test OK\n';
        "
    - uses: test/tw/ldd-check
