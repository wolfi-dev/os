package:
  name: php-8.4-igbinary
  version: 3.2.16
  epoch: 6 # go/wolfi-rsc/php-8.4-igbinary
  description: "Igbinary is a drop in replacement for the standard php serializer."
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}
  resources:
    cpu: "1"
    memory: 4Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/igbinary/igbinary
      tag: ${{package.version}}
      expected-commit: 8326f6a69ebb30dd6258dd536eb0914454fbf146

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: |
      set -x
      ./configure CFLAGS="-O2 -g" --enable-igbinary

  - uses: autoconf/make

  - name: Make install
    runs: |
      set -x
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=igbinary.so" > "${{targets.subpkgdir}}/etc/php/conf.d/igbinary.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: ${{package.name}}-dev
    description: PHP ${{vars.phpMM}} igbinary development headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test igbinary serialization and deserialization
      runs: |
        php -d extension=igbinary.so -r '
          $data = ["key" => "value", 42, true, null, 3.14];
          $serialized = igbinary_serialize($data);
          if ($serialized === false) { exit(1); }
          $unserialized = igbinary_unserialize($serialized);
          if ($unserialized !== $data) { exit(1); }
          echo "igbinary serialize/unserialize: OK\n";

          $str = igbinary_serialize("hello igbinary");
          $out = igbinary_unserialize($str);
          if ($out !== "hello igbinary") { exit(1); }
          echo "igbinary string round-trip: OK\n";
        '

update:
  enabled: true
  github:
    identifier: igbinary/igbinary
