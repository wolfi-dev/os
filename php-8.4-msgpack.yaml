package:
  name: php-8.4-msgpack
  version: 3.0.0
  epoch: 5
  description: "A PHP extension for msgpack"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/msgpack/msgpack-php
      # The tag has a msgpack- prefix, but the version does not.
      tag: msgpack-${{package.version}}
      expected-commit: a934abefac024c02e78c930a4702026dd08459cc

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: ./configure --with-msgpack

  - uses: autoconf/make

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=msgpack.so" > "${{targets.subpkgdir}}/etc/php/conf.d/msgpack.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: ${{package.name}}-dev
    description: PHP ${{vars.phpMM}} msgpack development headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage

update:
  enabled: true
  github:
    identifier: msgpack/msgpack-php
    tag-filter-prefix: msgpack-
    strip-prefix: msgpack-

test:
  pipeline:
    - name: Verify PHP extension is loaded
      runs: |
        php -r 'exit(extension_loaded("msgpack") ? 0 : 1);'
    - name: Test msgpack serialize and deserialize integer
      runs: |
        php -r '
          $packed = msgpack_pack(42);
          $unpacked = msgpack_unpack($packed);
          if ($unpacked !== 42) exit(1);
          echo "Success";
        '
    - name: Test msgpack serialize and deserialize string
      runs: |
        php -r '
          $packed = msgpack_pack("hello msgpack");
          $unpacked = msgpack_unpack($packed);
          if ($unpacked !== "hello msgpack") exit(1);
          echo "Success";
        '
    - name: Test msgpack serialize and deserialize array
      runs: |
        php -r '
          $data = ["key" => "value", "num" => 123, "flag" => true];
          $packed = msgpack_pack($data);
          $unpacked = msgpack_unpack($packed);
          if ($unpacked["key"] !== "value") exit(1);
          if ($unpacked["num"] !== 123) exit(1);
          if ($unpacked["flag"] !== true) exit(1);
          echo "Success";
        '
    - name: Test msgpack serialize and deserialize nested structure
      runs: |
        php -r '
          $data = ["list" => [1, 2, 3], "nested" => ["a" => "b"]];
          $packed = msgpack_pack($data);
          $unpacked = msgpack_unpack($packed);
          if ($unpacked["list"][0] !== 1) exit(1);
          if ($unpacked["nested"]["a"] !== "b") exit(1);
          echo "Success";
        '
    - uses: test/tw/ldd-check
