package:
  name: php-8.4-pecl-http
  version: "4.3.1"
  epoch: 6
  description: "Provides PHP ${{vars.phpMM}} HTTP module for PHP Extended HTTP Support- PECL"
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - php-${{vars.phpMM}}
  resources:
    cpu: "2"
    memory: 6Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - automake
      - binutils
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - curl-dev
      - gcc
      - icu-dev
      - libtool
      - openssl-hardened-dev
      - php-${{vars.phpMM}}-dev
      - php-${{vars.phpMM}}-pecl-raphf
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/m6w6/ext-http
      tag: v${{package.version}}
      expected-commit: 705491493e8292a51687824e6ede98c9b7a20ba9

  - uses: pecl/phpize

  - uses: autoconf/make

  - uses: pecl/install
    with:
      extension: "http"

  - uses: strip

update:
  enabled: true
  github:
    identifier: m6w6/ext-http
    strip-prefix: v
    tag-filter-prefix: v

test:
  environment:
    contents:
      packages:
        - php-${{vars.phpMM}}
        - php-${{vars.phpMM}}-pecl-raphf
  pipeline:
    - name: Verify HTTP extension is loaded and functional
      runs: |
        php -r "
        if (!extension_loaded('http')) {
            die('ERROR: http extension is not loaded\n');
        }
        echo 'OK: http extension loaded\n';

        // Test http\Message parsing
        \$msg = new http\Message(\"HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nHello\");
        if (\$msg->getResponseCode() !== 200) {
            die('ERROR: http\Message response code parsing failed\n');
        }
        echo 'OK: http\Message response code parsing works\n';

        // Test http\Url manipulation
        \$url = new http\Url('http://example.com/path?foo=bar#frag');
        if (\$url->host !== 'example.com') {
            die('ERROR: http\Url host parsing failed\n');
        }
        echo 'OK: http\Url host parsing works\n';

        // Test http\QueryString
        \$qs = new http\QueryString('a=1&b=2');
        if (\$qs->get('a') !== '1') {
            die('ERROR: http\QueryString get failed\n');
        }
        echo 'OK: http\QueryString works\n';

        echo 'All tests passed\n';
        "
    - uses: test/tw/ldd-check
