package:
  name: php-8.5-igbinary
  version: 3.2.16
  epoch: 3
  description: "Igbinary is a drop in replacement for the standard php serializer."
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/igbinary/igbinary
      tag: ${{package.version}}
      expected-commit: 8326f6a69ebb30dd6258dd536eb0914454fbf146
      cherry-picks: |
        master/c7fe8aad3d7894bb85f5a189eba60dec9203950d: use Zend/zend_smart_string.h
        master/d28f7e6e5a2e7f73225bdf9b619920a7986ff885: fix tests for 8.5.0beta2

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: |
      set -x
      ./configure CFLAGS="-O2 -g" --enable-igbinary

  - uses: autoconf/make

  - name: Make install
    runs: |
      set -x
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=igbinary.so" > "${{targets.subpkgdir}}/etc/php/conf.d/igbinary.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: ${{package.name}}-dev
    description: PHP ${{vars.phpMM}} igbinary development headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage

test:
  pipeline:
    - name: Check extension is loaded
      runs: php -m | grep -i igbinary
    - name: Test serialize and unserialize scalar values
      runs: |
        php -r '
          $data = "hello igbinary";
          $serialized = igbinary_serialize($data);
          if ($serialized === false) exit(1);
          $result = igbinary_unserialize($serialized);
          if ($result !== $data) exit(1);
          echo "scalar: OK\n";
        '
    - name: Test serialize and unserialize arrays
      runs: |
        php -r '
          $data = ["key" => "value", "num" => 42, "nested" => [1, 2, 3]];
          $serialized = igbinary_serialize($data);
          if ($serialized === false) exit(1);
          $result = igbinary_unserialize($serialized);
          if ($result !== $data) exit(1);
          echo "array: OK\n";
        '
    - name: Test serialize and unserialize objects
      runs: |
        php -r '
          $obj = new stdClass();
          $obj->name = "test";
          $obj->value = 123;
          $serialized = igbinary_serialize($obj);
          if ($serialized === false) exit(1);
          $result = igbinary_unserialize($serialized);
          if ($result->name !== $obj->name || $result->value !== $obj->value) exit(1);
          echo "object: OK\n";
        '
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: igbinary/igbinary
