package:
  name: php-8.5-msgpack
  version: 3.0.0
  epoch: 10 # update block follows upstream's v-prefixed tags
  description: "A PHP extension for msgpack"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    memory: 1Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM
  # Upstream names its tags v<version> since 3.0.1; 3.0.0 is msgpack-3.0.0.
  # A version other than 3.0.0 does not match, so its tag stays v<version>.
  - from: v${{package.version}}
    match: ^v(3\.0\.0)$
    replace: msgpack-$1
    to: upstream-tag

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - glibc-2.44-dev
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/msgpack/msgpack-php
      # msgpack-3.0.0 for 3.0.0 and v<version> from 3.0.1 on: see the
      # upstream-tag var-transform.
      tag: ${{vars.upstream-tag}}
      expected-commit: a934abefac024c02e78c930a4702026dd08459cc

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: ./configure --with-msgpack

  - uses: autoconf/make

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: upstream-tests/php-ext-test

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=msgpack.so" > "${{targets.subpkgdir}}/etc/php/conf.d/msgpack.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: ${{package.name}}-dev
    description: PHP ${{vars.phpMM}} msgpack development headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage

update:
  enabled: true
  github:
    identifier: msgpack/msgpack-php
    tag-filter-prefix: v
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-config
        - php-${{vars.phpMM}}
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify msgpack extension is loaded
      runs: |
        set -euo pipefail
        php -m | grep -F msgpack || (echo "msgpack extension not loaded" && exit 1)
    - name: Test msgpack serialize and deserialize
      runs: |
        set -euo pipefail
        php -r '
          $data = ["hello" => "world", "number" => 42, "list" => [1, 2, 3]];
          $packed = msgpack_pack($data);
          if (!is_string($packed) || strlen($packed) === 0) {
            echo "msgpack_pack failed\n";
            exit(1);
          }
          $unpacked = msgpack_unpack($packed);
          if ($unpacked["hello"] !== "world" || $unpacked["number"] !== 42) {
            echo "msgpack_unpack produced unexpected result\n";
            exit(1);
          }
          echo "msgpack serialize/deserialize OK\n";
        '
