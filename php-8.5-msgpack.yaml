package:
  name: php-8.5-msgpack
  version: 3.0.0
  epoch: 4
  description: "A PHP extension for msgpack"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}
  resources:
    cpu: "1"
    memory: 5Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/msgpack/msgpack-php
      # The tag has a msgpack- prefix, but the version does not.
      tag: msgpack-${{package.version}}
      expected-commit: a934abefac024c02e78c930a4702026dd08459cc

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: ./configure --with-msgpack

  - uses: autoconf/make

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=msgpack.so" > "${{targets.subpkgdir}}/etc/php/conf.d/msgpack.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: ${{package.name}}-dev
    description: PHP ${{vars.phpMM}} msgpack development headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage

update:
  enabled: true
  github:
    identifier: msgpack/msgpack-php
    tag-filter-prefix: msgpack-
    strip-prefix: msgpack-

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-config
        - php-${{vars.phpMM}}
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify msgpack extension is loaded
      runs: |
        set -euo pipefail
        php -m | grep -F msgpack || (echo "msgpack extension not loaded" && exit 1)
    - name: Test msgpack serialize and deserialize
      runs: |
        set -euo pipefail
        php -r '
          $data = ["hello" => "world", "number" => 42, "list" => [1, 2, 3]];
          $packed = msgpack_pack($data);
          if (!is_string($packed) || strlen($packed) === 0) {
            echo "msgpack_pack failed\n";
            exit(1);
          }
          $unpacked = msgpack_unpack($packed);
          if ($unpacked["hello"] !== "world" || $unpacked["number"] !== 42) {
            echo "msgpack_unpack produced unexpected result\n";
            exit(1);
          }
          echo "msgpack serialize/deserialize OK\n";
        '
