package:
  name: php-8.6-amqp
  version: "2.2.0"
  epoch: 0
  description: "PHP extension to communicate with any AMQP compliant server"
  copyright:
    - license: PHP-3.01
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}
      - rabbitmq-c

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - glibc-2.44-dev
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev
      - rabbitmq-c-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/php-amqp/php-amqp
      tag: "v${{package.version}}"
      expected-commit: f2df48496693f8aa2942fad3606838149deb82ea

  - uses: patch
    with:
      patches: fix-build-with-php-8.6.patch

  - uses: pecl/phpize

  - uses: autoconf/make

  # The Makefile that phpize generates installs under INSTALL_ROOT; it does
  # not read the DESTDIR that autoconf/make-install passes.
  - uses: autoconf/make-install
    with:
      opts: INSTALL_ROOT="${{targets.destdir}}"

  - uses: upstream-tests/php-ext-test

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=amqp.so" > "${{targets.subpkgdir}}/etc/php/conf.d/amqp.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Check that PHP loads amqp through the shipped ini file
      runs: |
        php -r 'if (!extension_loaded("amqp")) { fwrite(STDERR, "amqp is not loaded\n"); exit(1); } echo "amqp ", phpversion("amqp"), " loaded\n";'

update:
  enabled: true
  github:
    identifier: php-amqp/php-amqp
    strip-prefix: v
    tag-filter: v
    use-tag: true
