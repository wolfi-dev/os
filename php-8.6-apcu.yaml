package:
  name: php-8.6-apcu
  version: "5.1.28"
  epoch: 1
  description: "PHP extension for User Cache"
  copyright:
    - license: PHP-3.01
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}
  resources:
    cpu: "1"
    memory: 4Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - glibc-2.44-dev
      - pcre2-dev
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/krakjoe/apcu
      tag: "v${{package.version}}"
      expected-commit: 819fce90c469a5666b1706036cd66120af419f1f
      cherry-picks: |
        master/95f9ab828f95c6ca5877e584ead109189d0cec61: replace XtOffsetOf() with offsetof() for PHP 8.6
        master/90899684be91c4f750512c2f840f487286ecb807: console output helpers as macros over php_error_docref (php_verror() lost its param argument in 8.6)

  - uses: patch
    with:
      patches: fix-build-with-php-8.6.patch

  - name: Prepare build
    runs: phpize

  - name: Build
    runs: |
      set -x
      ./configure

  - uses: autoconf/make

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: upstream-tests/php-ext-test

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=apcu.so" > "${{targets.subpkgdir}}/etc/php/conf.d/apcu.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

update:
  enabled: true
  github:
    identifier: krakjoe/apcu
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  pipeline:
    - name: "Check if extension is loaded"
      runs: |
        php -m | grep -i "apcu"
    - name: "Verify extension version"
      runs: |
        # The loaded apcu must report exactly the packaged version.
        # phpversion() returns false when apcu is not loaded.
        php -r '
          $want = "${{package.version}}";
          $got = phpversion("apcu");
          if ($got !== $want) {
            fwrite(STDERR, "apcu reports version " . var_export($got, true) . ", expected $want\n");
            exit(1);
          }
          echo "apcu $got\n";
        '
    - name: "Test basic cache storage and retrieval"
      runs: |
        php -d apc.enable_cli=1 -r '
          if (!apcu_store("test_key", "test_value")) exit(1);
          $value = apcu_fetch("test_key");
          if ($value !== "test_value") exit(1);
          echo "Success";
        '
    - name: "Test cache exists functionality"
      runs: |
        php -d apc.enable_cli=1 -r '
          if (!apcu_store("check_key", "check_value")) exit(1);
          if (!apcu_exists("check_key")) exit(1);
          if (apcu_exists("nonexistent_key")) exit(1);
          echo "Success";
        '
    - name: "Test cache deletion"
      runs: |
        php -d apc.enable_cli=1 -r '
          if (!apcu_store("delete_key", "delete_value")) exit(1);
          if (!apcu_delete("delete_key")) exit(1);
          if (apcu_exists("delete_key")) exit(1);
          echo "Success";
        '
    - name: "Test cache clearing"
      runs: |
        php -d apc.enable_cli=1 -r '
          if (!apcu_store("clear_key", "clear_value")) exit(1);
          if (!apcu_clear_cache()) exit(1);
          if (apcu_exists("clear_key")) exit(1);
          echo "Success";
        '
    - name: "Test increment/decrement operations"
      runs: |
        php -d apc.enable_cli=1 -r '
          if (!apcu_store("counter", 5)) exit(1);
          if (apcu_inc("counter") !== 6) exit(1);
          if (apcu_dec("counter") !== 5) exit(1);
          echo "Success";
        '
    - name: "Verify configuration file"
      runs: |
        grep -q "^extension=apcu.so" /etc/php/conf.d/apcu.ini
    - name: "Verify APCu is enabled in CLI"
      runs: |
        php -d apc.enable_cli=1 -r '
          if (!ini_get("apc.enable_cli")) exit(1);
          echo "APCu CLI mode enabled";
        '
    - uses: test/tw/ldd-check
