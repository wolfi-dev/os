package:
  name: php-8.6-ds
  version: "2.0.0"
  epoch: 1
  description: "An extension providing efficient data structures for PHP"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}
  resources:
    cpu: "1"
    memory: 1Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - glibc-2.44-dev
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/php-ds/ext-ds
      tag: "v${{package.version}}"
      expected-commit: 132ca69b19c80fba8a447f87d656c27596f43cec
      cherry-picks: |
        master/25e0f3adb619670b5ba79afcfc1c9de745586550: fix PHP 8.6 compatibility (XtOffsetOf removed)
        master/de284b1a2c78a2d6974bc65bb449df59c002ec76: use zval_get_long_ex instead of zend_parse_parameter removed in 8.6

  - name: Prepare build
    runs: phpize

  - name: Build
    runs: |
      set -x
      ./configure

  - uses: autoconf/make

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: upstream-tests/php-ext-test

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=ds.so" > "${{targets.subpkgdir}}/etc/php/conf.d/ds.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

test:
  pipeline:
    - name: Check extension is loaded
      runs: php -m | grep -i "^ds$"
    - name: Verify extension is functional
      runs: |
        # Uses each ds 2.0 type (Seq, Map, Set, Heap, Pair, Key) through the
        # installed extension. Each check follows a case of upstream's test
        # suite (tests/ at v2.0.0), which the build runs in the build tree
        # only. check() and not assert(): assert() does nothing when
        # zend.assertions is off.
        php <<'EOF'
        <?php
        function check(bool $ok, string $what): void {
            if (!$ok) { echo "FAIL: $what\n"; exit(1); }
            echo "ok: $what\n";
        }
        function throws(string $class, callable $f): bool {
            try { $f(); } catch (Throwable $e) { return $e instanceof $class; }
            return false;
        }

        $s = new Ds\Seq([3, 1, 2]);
        $s->push(5, 4);
        $s->sort();
        check($s->toArray() === [1, 2, 3, 4, 5], "Seq: push and sort");
        check($s->pop() === 5 && $s->shift() === 1 && $s->count() === 3, "Seq: pop and shift");
        check($s[0] === 2 && $s->get(2) === 4, "Seq: read by index");
        $seen = [];
        foreach ($s as $value) { $seen[] = $value; }
        check($seen === [2, 3, 4], "Seq: foreach");
        // The offset is a numeric string, so that it goes through the
        // conversion that the second PHP 8.6 cherry-pick rewrote.
        $offset = "1";
        unset($s[$offset]);
        check($s->toArray() === [2, 4], "Seq: unset by index");
        check(throws(UnderflowException::class, fn() => (new Ds\Seq())->pop()), "Seq: pop on empty throws");

        $copy = clone $s;
        $copy->push(6);
        check($s->toArray() === [2, 4] && $copy->toArray() === [2, 4, 6], "Seq: a clone is independent");
        $back = unserialize(serialize(new Ds\Seq([1, "two", 3.5])));
        check($back instanceof Ds\Seq && $back->toArray() === [1, "two", 3.5], "Seq: serialize round trip");

        $m = new Ds\Map(["a" => 1]);
        $m->put(0, "int");
        $m->put("0", "string");
        check($m->count() === 3 && $m->get("a") === 1, "Map: put and get");
        check($m->get(0) === "int" && $m->get("0") === "string" && !$m->hasKey(1), "Map: keys keep their type");
        check($m->get("missing", "default") === "default", "Map: get with a default");
        check(throws(OutOfBoundsException::class, fn() => $m->get("missing")), "Map: get of a missing key throws");
        check($m->keys() instanceof Ds\Set && $m->keys()->contains("a"), "Map: keys() is a Set");

        $set = \Ds\set([1, 2, 3, 2, 1]);
        check($set->count() === 3 && $set->contains(1, 2, 3) && !$set->contains("1"), "Set: unique, typed values");

        $h = \Ds\heap([3, 1, 4, 1, 5], function ($a, $b) { return $b <=> $a; });
        $order = [];
        while (!$h->isEmpty()) { $order[] = $h->pop(); }
        check($order === [1, 1, 3, 4, 5], "Heap: comparator decides the order");
        check((new Ds\Heap([3, 1, 4]))->pop() === 4, "Heap: max-heap by default");

        $p = new Ds\Pair("hello", 42);
        check($p->key === "hello" && $p->value === 42, "Pair: key and value");
        check(throws(Error::class, function () use ($p) { $p->key = "world"; }), "Pair: is readonly");

        final class Point implements Ds\Key {
            public function __construct(public int $x, public int $y) {}
            public function hash(): mixed { return "$this->x,$this->y"; }
            public function equals(mixed $other): bool {
                return $other instanceof self && $this->x === $other->x && $this->y === $other->y;
            }
        }
        $points = new Ds\Map();
        $points->put(new Point(1, 2), "A");
        $points->put(new Point(3, 4), "B");
        $points->put(new Point(1, 2), "C");
        check($points->count() === 2 && $points->get(new Point(1, 2)) === "C", "Key: equal objects are one key");
        EOF
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: php-ds/ext-ds
    strip-prefix: v
    tag-filter: v
    use-tag: true
