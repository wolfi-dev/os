package:
  name: php-8.6-igbinary
  version: 3.2.16
  epoch: 1 # igbinary_047 and igbinary_091 run under ignore
  description: "Igbinary is a drop in replacement for the standard php serializer."
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - glibc-2.44-dev
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/igbinary/igbinary
      tag: ${{package.version}}
      expected-commit: 8326f6a69ebb30dd6258dd536eb0914454fbf146
      cherry-picks: |
        master/c7fe8aad3d7894bb85f5a189eba60dec9203950d: use Zend/zend_smart_string.h
        master/d28f7e6e5a2e7f73225bdf9b619920a7986ff885: fix tests for 8.5.0beta2
        master/c31b543455dc18713ac05ee5496749b7c566f8e7: E_STRICT is deprecated (test only)
        master/2e0788825caa067aaab10e6b80f5fd958d92b0f0: the zval_dtor() alias was removed in PHP 8.6
        master/d4a6ded9ca6b3d7eec069de1891d03c5bc14c233: fix build with PHP 8.6, unserialize_callback_func is a zend_string
        master/48a3ef4f66986d7163d87bb72b218c845c8adeda: add test for unserialize_callback_func on PHP 8.6

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: |
      set -x
      ./configure CFLAGS="-O2 -g" --enable-igbinary

  - uses: autoconf/make

  - name: Make install
    runs: |
      set -x
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  # igbinary_047 and igbinary_091 fail on PHP 8.6 with stale expectations, not
  # igbinary bugs: igbinary_047 declares a SessionHandlerInterface class
  # without create_sid()/validateId(), which 8.6 deprecates at compile time,
  # so the notice is output before session_start() and that fails with
  # "headers already sent"; igbinary_091 expects "Serialization of
  # 'class@anonymous' is not allowed", but php-src 8.6 formats the class name
  # with %pS (ext/standard/var.c), so the anonymous class's full name with its
  # NUL-separated file:line suffix is printed.
  # TODO(upstream-tests): drop the ignore once this recipe is on an igbinary
  # release that has master 8a2f935c7f41b2b62ababdc5bbb5e82832086523, which
  # adapts both tests to PHP 8.6.
  - uses: upstream-tests/php-ext-test
    with:
      ignore: tests/igbinary_047.phpt tests/igbinary_091.phpt

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=igbinary.so" > "${{targets.subpkgdir}}/etc/php/conf.d/igbinary.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

  - name: ${{package.name}}-dev
    description: PHP ${{vars.phpMM}} igbinary development headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage

test:
  pipeline:
    - name: Check extension is loaded
      runs: php -m | grep -i igbinary
    - name: Test serialize and unserialize scalar values
      runs: |
        php -r '
          $data = "hello igbinary";
          $serialized = igbinary_serialize($data);
          if ($serialized === false) exit(1);
          $result = igbinary_unserialize($serialized);
          if ($result !== $data) exit(1);
          echo "scalar: OK\n";
        '
    - name: Test serialize and unserialize arrays
      runs: |
        php -r '
          $data = ["key" => "value", "num" => 42, "nested" => [1, 2, 3]];
          $serialized = igbinary_serialize($data);
          if ($serialized === false) exit(1);
          $result = igbinary_unserialize($serialized);
          if ($result !== $data) exit(1);
          echo "array: OK\n";
        '
    - name: Test serialize and unserialize objects
      runs: |
        php -r '
          $obj = new stdClass();
          $obj->name = "test";
          $obj->value = 123;
          $serialized = igbinary_serialize($obj);
          if ($serialized === false) exit(1);
          $result = igbinary_unserialize($serialized);
          if ($result->name !== $obj->name || $result->value !== $obj->value) exit(1);
          echo "object: OK\n";
        '
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: igbinary/igbinary
