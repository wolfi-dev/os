package:
  name: php-8.6-imagick
  version: "3.8.1"
  epoch: 1
  description: "PHP extension for ImageMagick"
  copyright:
    - license: PHP-3.01
  dependencies:
    runtime:
      - ${{package.name}}-config
      - imagemagick
      - php-${{vars.phpMM}}
  resources:
    cpu: "1"
    memory: 4Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - glibc-2.44-dev
      - imagemagick-dev
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Imagick/imagick
      tag: "${{package.version}}"
      expected-commit: 70087bab33eab913e99ac77d64d04d1a2fd0b7b0
      cherry-picks: |
        master/b580a705e2c879924bfaee2e1ed3a93c9cb3fcfb: XtOffsetOf is removed in 8.6, use standard C offsetof

  - uses: patch
    with:
      patches: fix-build-with-php-8.6.patch

  # Apply package version template as `package.xml` does not seem to apply this automatically
  - runs: sed -i "s/@PACKAGE_VERSION@/${{package.version}}/g" ./*.h

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: |
      set -x
      ./configure

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=imagick.so" > "${{targets.subpkgdir}}/etc/php/conf.d/imagick.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

update:
  enabled: true
  github:
    identifier: Imagick/imagick
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Ensure versioning got passed to module
      runs: |
        php --info | grep -F -e imagick | grep -F -e "${{package.version}}"
    - name: Test image creation and manipulation
      runs: |
        # A failed check prints its message and calls exit(1), so that the
        # step fails: die('message') would print the message and exit with
        # status 0. An exception that nothing catches ends php with status 255.
        php <<'EOF'
        <?php
        function check(bool $ok, string $what): void
        {
            if (!$ok) {
                echo "FAIL: $what\n";
                exit(1);
            }
            echo "OK: $what\n";
        }

        // Create a red image of 100x60 pixels and encode it as PNG.
        $img = new Imagick();
        $img->newImage(100, 60, new ImagickPixel('red'));
        $img->setImageFormat('png');
        check(str_starts_with($img->getImageBlob(), "\x89PNG"), 'image creation: the blob is a PNG');

        $img->resizeImage(50, 30, Imagick::FILTER_LANCZOS, 1);
        check($img->getImageWidth() === 50 && $img->getImageHeight() === 30, 'image resize: 50x30');

        // The image is not square, so that a rotation by 90 degrees shows in
        // its width and height.
        $img->rotateImage(new ImagickPixel('none'), 90);
        check($img->getImageWidth() === 30 && $img->getImageHeight() === 50, 'image rotate: 30x50');

        $file = 'test-imagick.png';
        $img->writeImage($file);
        check(is_file($file) && filesize($file) > 0, 'image write: the file is not empty');

        // Read the file back with a new object: its format, size and colour
        // must be the ones that were written.
        $read = new Imagick($file);
        check(strtoupper($read->getImageFormat()) === 'PNG', 'image read: the format is PNG');
        check($read->getImageWidth() === 30 && $read->getImageHeight() === 50, 'image read: 30x50');
        $colour = $read->getImagePixelColor(15, 25)->getColor();
        check($colour['r'] === 255 && $colour['g'] === 0 && $colour['b'] === 0, 'image read: the pixel is red');
        EOF
        rm test-imagick.png
