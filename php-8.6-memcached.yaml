package:
  name: php-8.6-memcached
  version: "3.4.0"
  epoch: 1
  description: "A PHP extension for Memcached"
  copyright:
    - license: PHP-3.01
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-igbinary # memcached.so needs igbinary_serialize and friends
  resources:
    cpu: "1"
    memory: 5Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - glibc-2.44-dev
      - libmemcached-dev
      - memcached # upstream-tests: server for tests/*.phpt
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev
      - php-${{vars.phpMM}}-igbinary
      - php-${{vars.phpMM}}-igbinary-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/php-memcached-dev/php-memcached
      tag: v${{package.version}}
      expected-commit: ce37962769fc7b25f9905c4b23fa53df92447a32
      cherry-picks: |
        master/3c73b4f0abe5bbfbbbe686f44a8ae52fcd3e67ee: fix build on PHP 8.6+ (zval_dtor and XtOffsetOf removed, session save_path is a zend_string)

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: ./configure --enable-memcached-igbinary

  - uses: autoconf/make

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  # Same setup as upstream CI (.github/workflows/build-and-test.yml): a
  # memcached on 127.0.0.1:11211, which tests/config.inc expects, and the
  # tests in tests/*.phpt (tests/experimental/ is not part of the suite).
  - name: Start memcached for the upstream tests
    runs: |
      # memcached -d returns before it binds; it writes the pidfile only after
      # a successful bind, so wait for it and fail if the port wasn't ours.
      memcached -d -u build -l 127.0.0.1 -p 11211 -P /tmp/memcached-tests.pid
      for i in $(seq 50); do [ -s /tmp/memcached-tests.pid ] && break; sleep 0.1; done
      [ -s /tmp/memcached-tests.pid ]

  - uses: upstream-tests/php-ext-test
    with:
      tests: tests/*.phpt
      # The tests share one server and several flush it.
      jobs: 1

  - name: Stop memcached
    runs: kill "$(cat /tmp/memcached-tests.pid)"

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=memcached.so" > "${{targets.subpkgdir}}/etc/php/conf.d/memcached.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

update:
  enabled: true
  github:
    identifier: php-memcached-dev/php-memcached
    strip-prefix: v
    tag-filter: v

test:
  environment:
    contents:
      packages:
        - memcached # the server for the round trip below
        - wait-for-it
  pipeline:
    - name: Verify extensions are loaded
      runs: |
        php -m | grep -F memcached
        php -m | grep -F igbinary
    - name: Verify igbinary serializer support
      runs: |
        php -r '
        $m = new Memcached();
        $m->setOption(Memcached::OPT_SERIALIZER, Memcached::SERIALIZER_IGBINARY);
        if ($m->getOption(Memcached::OPT_SERIALIZER) !== Memcached::SERIALIZER_IGBINARY) {
            echo "FAIL: igbinary serializer not active\n";
            exit(1);
        }
        echo "igbinary serializer enabled\n";

        $data = ["key" => "value", "nested" => [1, 2, 3]];
        $serialized = igbinary_serialize($data);
        $unserialized = igbinary_unserialize($serialized);
        if ($data !== $unserialized) {
            echo "FAIL: igbinary round-trip failed\n";
            exit(1);
        }
        echo "igbinary round-trip OK\n";
        '
    # The steps above never reach a server. This one stores a value and a
    # session in a memcached and reads both back in a second process. The
    # session handler is the code that is specific to PHP 8.6 in this package:
    # it gets its save_path as a zend_string there (the cherry-pick 3c73b4f0).
    - name: Write and read through a local memcached server
      uses: test/daemon-check-output
      with:
        # -vv makes memcached print the lines expected below. -u is required
        # when the test runs as root, and has no effect otherwise.
        start: /usr/bin/memcached -vv -u root -l 127.0.0.1 -p 11311
        expected_output: |
          slab class
          server listening
        error_strings: |
          failed to listen
        post: |
          wait-for-it 127.0.0.1:11311 -t 30

          # First process: store an array through the igbinary serializer, then
          # a session, and leave the session's id in a file.
          cat > roundtrip-write.php <<'EOF'
          <?php
          $m = new Memcached();
          if (!$m->setOption(Memcached::OPT_SERIALIZER, Memcached::SERIALIZER_IGBINARY)
              || !$m->addServer('127.0.0.1', 11311)
              || !$m->set('roundtrip', ['key' => 'value', 'nested' => [1, 2, 3]])) {
              fwrite(STDERR, 'storing a value failed: ' . $m->getResultMessage() . "\n");
              exit(1);
          }

          if (!session_start()) {
              fwrite(STDERR, "session_start() failed\n");
              exit(1);
          }
          $id = session_id();
          $_SESSION['answer'] = 42;
          // session_write_close() does not report a failed write. The second
          // process finds one when it reads the handler's key.
          session_write_close();
          if ($id === false || $id === '' || !file_put_contents('session-id', $id)) {
              fwrite(STDERR, "no session id to hand to the second process\n");
              exit(1);
          }
          EOF

          # Second process: the array must come back from the server unchanged.
          # The session data must be in the server under the handler's key, and
          # a session with the same id must read it back.
          cat > roundtrip-read.php <<'EOF'
          <?php
          $m = new Memcached();
          $m->addServer('127.0.0.1', 11311);
          $value = $m->get('roundtrip');
          if ($value !== ['key' => 'value', 'nested' => [1, 2, 3]]) {
              fwrite(STDERR, 'unexpected value from the server (' . $m->getResultMessage() . '): ' . var_export($value, true) . "\n");
              exit(1);
          }

          $id = file_get_contents('session-id');
          $stored = $m->get(ini_get('memcached.sess_prefix') . $id);
          if ($stored !== 'answer|i:42;') {
              fwrite(STDERR, 'unexpected session data in the server: ' . var_export($stored, true) . "\n");
              exit(1);
          }
          session_id($id);
          if (!session_start() || ($_SESSION['answer'] ?? null) !== 42) {
              fwrite(STDERR, "the session did not come back from the server\n");
              exit(1);
          }
          echo "value and session round trip through the memcached server: ok\n";
          EOF

          # session.serialize_handler=php is PHP's default. It is set here
          # because the second process compares the stored string with it.
          for script in roundtrip-write.php roundtrip-read.php; do
            php -d session.save_handler=memcached -d session.save_path=127.0.0.1:11311 \
              -d session.serialize_handler=php "$script"
          done
    - uses: test/tw/ldd-check
