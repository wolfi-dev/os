package:
  name: php-8.6-pecl-mcrypt
  version: "1.0.9"
  epoch: 0
  description: "Provides PHP ${{vars.phpMM}} bindings for the unmaintained libmcrypt - PECL"
  copyright:
    - license: PHP-3.01
  dependencies:
    runtime:
      - php-${{vars.phpMM}}

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - automake
      - binutils
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - gcc
      - glibc-2.44-dev
      - libmcrypt-dev
      - libtool
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/php/pecl-encryption-mcrypt
      tag: ${{package.version}}
      expected-commit: ee7378051c1776414ee6a459d16942e3f9acdbfc

  - uses: patch
    with:
      patches: fix-build-with-php-8.6.patch

  - name: phpize and configure
    runs: |
      phpize
      ./configure --prefix=/usr --with-php-config=php-config

  - uses: autoconf/make

  - name: Install
    runs: |
      make INSTALL_ROOT="${{targets.destdir}}" install
      install -d ${{targets.destdir}}/etc/php/conf.d
      echo "extension=mcrypt.so" > ${{targets.destdir}}/etc/php/conf.d/mcrypt.ini

  - uses: upstream-tests/php-ext-test

  - uses: strip

update:
  enabled: true
  github:
    identifier: php/pecl-encryption-mcrypt
    use-tag: true
    # ignore version 2.x.y tags, 1.x.y is the only mentioned version on https://pecl.php.net/package/mcrypt
    tag-filter-prefix: "1."

test:
  environment:
    contents:
      packages:
        - php-${{vars.phpMM}}
  pipeline:
    - name: Verify mcrypt extension is loaded and functional
      # Each failure prints its message and then calls exit(1): die('message')
      # would print the message and exit with status 0, and the step would pass.
      runs: |
        php -r "
          if (!extension_loaded('mcrypt')) {
            echo 'FAIL: mcrypt extension is not loaded', PHP_EOL;
            exit(1);
          }
          echo 'PASS: mcrypt extension is loaded', PHP_EOL;

          // Test encryption and decryption with AES-128 (Rijndael-128)
          \$key    = 'secretkey1234567'; // 16 bytes for AES-128
          \$iv     = '1234567890123456'; // 16 bytes IV
          \$plain  = 'Hello, mcrypt!';

          \$encrypted = mcrypt_encrypt(MCRYPT_RIJNDAEL_128, \$key, \$plain, MCRYPT_MODE_CBC, \$iv);
          if (empty(\$encrypted)) {
            echo 'FAIL: mcrypt_encrypt returned empty result', PHP_EOL;
            exit(1);
          }
          echo 'PASS: mcrypt_encrypt produced output', PHP_EOL;

          \$decrypted = rtrim(mcrypt_decrypt(MCRYPT_RIJNDAEL_128, \$key, \$encrypted, MCRYPT_MODE_CBC, \$iv));
          if (\$decrypted !== \$plain) {
            echo 'FAIL: decrypted value does not match original: ', var_export(\$decrypted, true), PHP_EOL;
            exit(1);
          }
          echo 'PASS: mcrypt_decrypt round-trip succeeded', PHP_EOL;
        "
    - uses: test/tw/ldd-check
