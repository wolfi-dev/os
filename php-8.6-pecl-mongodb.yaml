package:
  name: php-8.6-pecl-mongodb
  version: "2.5.8"
  epoch: 0
  description: "PHP ${{vars.phpMM}} MongoDB driver - PECL"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - php-${{vars.phpMM}}

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

vars:
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - binutils
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - cyrus-sasl-dev
      - gcc
      - glibc-2.44-dev
      - icu-dev
      - libtool
      - openssl-${{vars.openssl-version}}-dev
      - php-${{vars.phpMM}}-dev
      - snappy-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mongodb/mongo-php-driver
      tag: ${{package.version}}
      expected-commit: af2aae91b8140114c1cf0ed894cbf1ac715e77a9
      recurse-submodules: true # the bundled libmongoc and libmongocrypt are submodules

  - uses: pecl/phpize

  - uses: autoconf/make

  - uses: pecl/install
    with:
      extension: "mongodb"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - php-${{vars.phpMM}}
  pipeline:
    - name: Verify the extension loads and works
      runs: |
        # Exits with status 1 when PHP has not loaded the extension.
        php --ri mongodb

        # BSON classes, which need no server. A failed check must exit with
        # a non-zero status: die() with a string argument exits with 0.
        php <<'EOF'
        <?php
        function fail(string $message): never
        {
            echo "ERROR: $message\n";
            exit(1);
        }

        // ObjectId creation and string representation
        $oid = new MongoDB\BSON\ObjectId();
        $oidStr = (string) $oid;
        if (strlen($oidStr) !== 24) {
            fail("ObjectId string should be 24 hex chars, got: $oidStr");
        }
        echo "ObjectId: $oidStr\n";

        // ObjectId from a known hex string
        $known = new MongoDB\BSON\ObjectId('507f1f77bcf86cd799439011');
        if ((string) $known !== '507f1f77bcf86cd799439011') {
            fail('ObjectId round-trip failed');
        }
        echo "ObjectId round-trip: OK\n";

        // BSON document serialization
        $doc = MongoDB\BSON\Document::fromPHP(['key' => 'value', 'num' => 42]);
        $php = $doc->toPHP();
        if ($php->key !== 'value' || $php->num !== 42) {
            fail('BSON document round-trip failed');
        }
        echo "BSON document round-trip: OK\n";

        // Regex BSON type
        $regex = new MongoDB\BSON\Regex('pattern', 'i');
        if ($regex->getPattern() !== 'pattern' || $regex->getFlags() !== 'i') {
            fail('BSON Regex failed');
        }
        echo "BSON Regex: OK\n";

        echo "All MongoDB driver checks passed\n";
        EOF
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: mongodb/mongo-php-driver
