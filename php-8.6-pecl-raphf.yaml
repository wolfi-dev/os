package:
  name: php-8.6-pecl-raphf
  version: 2.0.2
  epoch: 0
  description: "Provides PHP ${{vars.phpMM}} resource and persistent handles factory - PECL"
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - php-${{vars.phpMM}}
  resources:
    cpu: "2"
    memory: 2Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - automake
      - binutils
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - gcc
      - glibc-2.44-dev
      - libtool
      - php-${{vars.phpMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/m6w6/ext-raphf
      # Tags are v-prefixed since 2.0.2 (2.0.1 was tagged release-2.0.1).
      tag: v${{package.version}}
      expected-commit: 5836579db73ac959b9f743e09d8763c41c7cfcef

  - uses: patch
    with:
      patches: fix-build-with-php-8.6.patch

  - uses: pecl/phpize

  - uses: autoconf/make

  - uses: pecl/install
    with:
      extension: "raphf"

  - runs: |
      # PHP initialization is order dependent. So we will explicitly
      # load this by prefixing the file with 10- so it runs before
      # other modules which start with letters starts.
      mv ${{targets.destdir}}/etc/php/conf.d/raphf.ini ${{targets.destdir}}/etc/php/conf.d/10-raphf.ini

  - uses: strip

update:
  enabled: true
  github:
    identifier: m6w6/ext-raphf
    strip-prefix: v
    tag-filter-prefix: v

test:
  environment:
    contents:
      packages:
        - php-${{vars.phpMM}}
  pipeline:
    - name: Verify raphf extension is loaded
      runs: |
        # "php -m" prints one loaded module per line.
        php -m | grep -Fx raphf
    - name: Verify raphf extension version
      runs: |
        # "php --ri" prints only this module's section of phpinfo, and exits
        # non-zero when the module is not loaded. Match the whole line, so
        # that 2.0.1 does not accept 2.0.10.
        php --ri raphf | grep -Fx "Extension version => ${{package.version}}"
    - name: Verify a raphf function call
      runs: |
        # No persistent handle provider is registered here, so
        # raphf\stat_persistent_handles() returns false. It gets there
        # through the zval_ptr_dtor_nogc() call that
        # fix-build-with-php-8.6.patch puts in place of zval_dtor().
        php -r '
          $stat = raphf\stat_persistent_handles();
          if ($stat !== false) {
            fwrite(STDERR, "unexpected result: " . var_export($stat, true) . "\n");
            exit(1);
          }
          echo "raphf\\stat_persistent_handles() returned false\n";
        '
    - uses: test/tw/ldd-check
