package:
  name: php-8.6-zstd
  version: "0.18.0"
  epoch: 0
  description: Zstd Extension for PHP
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}
  resources:
    cpu: "1"
    # The upstream tests compress at ZSTD_COMPRESS_LEVEL_MAX, which needs
    # more than 1Gi.
    memory: 4Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - file
      - glibc-2.44-dev
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kjdev/php-ext-zstd
      tag: "${{package.version}}"
      expected-commit: c2593a4ce2457b23e7fa7f81ddf0dd9bbdd89b47
      # PHP 8.6 reports the result of a stream's close handler
      # (php/php-src@c07cc850), and in 0.18.0 the close handlers of
      # compress.zstd:// always return failure. fclose(), file_put_contents()
      # and copy() on such a stream then return false although the data is
      # written, and six upstream stream tests fail. Upstream fixed it after
      # 0.18.0 (kjdev/php-ext-zstd#110); drop the cherry-pick with the next
      # release.
      cherry-picks: |
        master/70a8083124c4667f6ec2e9f0c61983e8378462b0: Report success from the stream close handlers

  - name: Prepare build
    runs: phpize

  - name: Configure
    runs: ./configure --with-libzstd

  - uses: autoconf/make

  - name: Make install
    runs: INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

  - uses: upstream-tests/php-ext-test

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=zstd.so" > "${{targets.subpkgdir}}/etc/php/conf.d/zstd.ini"
    test:
      pipeline:
        - uses: test/tw/configpackage

update:
  enabled: true
  ignore-regex-patterns:
    - pie$
  github:
    identifier: kjdev/php-ext-zstd
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
