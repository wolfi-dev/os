package:
  name: pinact
  version: "4.1.1"
  epoch: 4 # migrate to go/build/v2
  description: Pin GitHub Actions versions in workflow files
  copyright:
    - license: MIT
  dependencies: {}
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: b1a554a82ef4f55533237e49c19a24ddf0045100
      repository: https://github.com/suzuki-shunsuke/pinact
      tag: v${{package.version}}

  - uses: go/build/v2
    with:
      ldflags: -X main.version=v${{package.version}}
      output: pinact
      packages: ./cmd/pinact

update:
  enabled: true
  github:
    identifier: suzuki-shunsuke/pinact
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: pinact
    - uses: test/tw/help-check
      with:
        bins: pinact
    - runs: |
        # Subcommand help also works
        pinact run --help
        pinact init --help
    - runs: |
        # Positive case: an already-pinned workflow passes `pinact run --check`.
        mkdir -p .github/workflows
        cat > .github/workflows/pinned.yml <<'EOF'
        name: pinned
        on: push
        jobs:
          build:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        EOF
        pinact run --check .github/workflows/pinned.yml

        # Negative case: an unpinned tag-ref workflow must be flagged.
        cat > .github/workflows/unpinned.yml <<'EOF'
        name: unpinned
        on: push
        jobs:
          build:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
        EOF
        ! pinact run --check .github/workflows/unpinned.yml
