package:
  name: pip-zipapp
  version: "26.3"
  epoch: 2 # fetch bundled wheels from Chainguard Libraries
  description: "Pip as a python zipapp"
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - busybox
      - curl

# See https://pip.pypa.io/en/stable/installation/#standalone-zip-application
# Wheels for installer, setuptools, tomli, wheel, flit-core
#
# The wheels are fetched from Chainguard Libraries' upstream repository
# (libraries.cgr.dev/python-upstream/) and verified against the sha256 values
# published by pypi (built distribution is the wheel)
# https://pypi.org/project/installer/0.7.0/#files
# https://pypi.org/project/setuptools/70.0.0/#files
# https://pypi.org/project/tomli/2.0.1/#files
# https://pypi.org/project/wheel/#files
# https://pypi.org/project/flit-core/#files
pipeline:
  # Using their repo as it appears to be the authoritative source for https://bootstrap.pypa.io/pip/zipapp/, which
  # doesn't always properly post the latest version. See https://github.com/chainguard-dev/internal-dev/issues/8712
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/get-pip
      expected-commit: 03f582d4710047617da50bd36a871b596e651363
      tag: ${{package.version}}
      destination: get-pip

  - uses: auth/libraries

  - name: Fetch bundled wheels from Chainguard Libraries
    runs: |
      fetch_whl() {  # fetch_whl <project> <wheel file> <PyPI sha256>
        index="https://libraries.cgr.dev/python-upstream/simple/$1/"
        url=$(curl --netrc --fail -sSL "$index" | grep -o "href=\"[^\"#]*/$2[\"#]" | head -n 1 | sed -e 's/^href="//' -e 's/.$//')
        if [ -z "$url" ]; then
          echo "$2 is not in $index"
          exit 1
        fi
        curl --netrc --fail -sSLo "$2" "$url"
        echo "$3  $2" | sha256sum -c
      }
      fetch_whl installer installer-0.7.0-py3-none-any.whl 05d1933f0a5ba7d8d6296bb6d5018e7c94fa473ceb10cf198a92ccea19c27b53
      fetch_whl setuptools setuptools-77.0.3-py3-none-any.whl 67122e78221da5cf550ddd04cf8742c8fe12094483749a792d56cd669d6cf58c
      fetch_whl tomli tomli-2.0.1-py3-none-any.whl 939de3e7a6161af0c887ef91b7d41a53e7c5a1ca976325f429cb46ea9bc30ecc
      fetch_whl wheel wheel-0.46.2-py3-none-any.whl 33ae60725d69eaa249bc1982e739943c23b34b58d51f1cb6253453773aca6e65
      fetch_whl flit-core flit_core-3.12.0-py3-none-any.whl e7a0304069ea895172e3c7bb703292e992c5d1555dd1233ab7b5621b5b69e62c
      rm -f /root/.netrc /home/build/.netrc

  - runs: |
      destd=${{targets.destdir}}
      sdir=usr/share/${{package.name}}
      fname=${{package.name}}.pyz
      mkdir -p "$destd/$sdir"
      cp "get-pip/public/zipapp/pip-${{package.version}}.pyz" "$destd/$sdir/$fname"
      chmod 0644 "$destd/$sdir/$fname"

      mkdir -p "$destd/$sdir/wheels"
      cp *.whl "$destd/$sdir/wheels/"

test:
  environment:
    contents:
      packages:
        - python3
  pipeline:
    - name: Ensure the zipapp can run using python
      runs: |
        python3 /usr/share/pip-zipapp/pip-zipapp.pyz --help | grep -F "Usage:"
    - name: Ensure the zipapp can run standalone
      runs: |
        chmod +x /usr/share/pip-zipapp/pip-zipapp.pyz
        /usr/share/pip-zipapp/pip-zipapp.pyz --help | grep -F "Usage:"
    - name: Ensure the version matches
      runs: |
        /usr/share/pip-zipapp/pip-zipapp.pyz -V | grep -F "pip ${{package.version}}"

update:
  enabled: true
  ignore-regex-patterns:
    - 'b'
  github:
    identifier: pypa/get-pip
    use-tag: true
