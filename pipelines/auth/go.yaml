name: Configure Go to fetch Chainguard Libraries dependencies.

needs:
  packages:
    - busybox

inputs:
  identity:
    description: the identity to use for Chainguard Libraries
    default: "720909c9f5279097d847ad02a2f24ba8f59de36a/a49c7fedc33adf69"
  group:
    description: the group to use for Chainguard Libraries
    default: "720909c9f5279097d847ad02a2f24ba8f59de36a"

pipeline:
  # Go authenticates to the proxy over HTTPS using ~/.netrc.
  - uses: auth/libraries
    with:
      group: ${{inputs.group}}
      identity: ${{inputs.identity}}

  - name: Configure Go proxy
    runs: |
      set -euo pipefail

      # Do not add ,direct or another public proxy to GOPROXY, otherwise Go
      # can fall back to modules that are not built by Chainguard Libraries.
      # The checksum database does not know about Chainguard rebuilt modules.
      #
      # HOME deviates melange runner to runner, so write the Go env file
      # (the file `go env -w` manages) under both /root and /home/build.
      for home in /root /home/build; do
        mkdir -p "$home/.config/go"
        cat > "$home/.config/go/env" <<EOF
      GOPROXY=https://libraries.cgr.dev/go
      GONOSUMDB=*
      EOF
      done
