name: Configure uv to fetch Chainguard Libraries dependencies.

needs:
  packages:
    - busybox
    - curl
    - jq
    - uv

inputs:
  identity:
    description: the identity to use for Chainguard Libraries
    default: "720909c9f5279097d847ad02a2f24ba8f59de36a/a49c7fedc33adf69"
  group:
    description: the group to use for Chainguard Libraries
    default: "720909c9f5279097d847ad02a2f24ba8f59de36a"
  allow-fallback-indexes:
    description: |
      use Chainguard Libraries with fallback to other Python package indexes
      enabled, like PyPI. Only disable this toggle if necessary for Python
      packages that are not currently available via Chainguard Libraries
    default: "false"
  use-underlinked-index:
    description: |
      Use the python-underlinked index, which serves Python packages built
      with underlinked SSL.
    # TODO(rj.sampson@chainguard.dev): Enable by default. We don't currently
    # as packages may not depend on libssl and may set no-depends, opting out
    # of dependency generation that would pick it up
    default: "false"

pipeline:
  - name: Setup uv credentials
    runs: |
      set -euo pipefail

      # If libraries token exists in source dir, use that.
      if [ -f ${{package.srcdir}}/.libraries.token ]; then
        cgtoken=$(cat ${{package.srcdir}}/.libraries.token)
      else
        idtoken=$(curl --fail-with-body -sSL -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=issuer.enforce.dev)
        cgtoken=$(curl --fail-with-body -sSL -H "Authorization: Bearer ${idtoken}" 'https://issuer.enforce.dev/sts/exchange?aud=libraries.cgr.dev&scope=${{inputs.group}}&identity=${{inputs.identity}}' | jq -r '.token')
      fi

      index="python"
      if [ "${{inputs.allow-fallback-indexes}}" = "true" ]; then
        index="python-all"
      fi

      mkdir -p /etc/uv
      touch /etc/uv/uv.toml

      # The underlinked SSL index must have highest priority so that packages that
      # are available in it are always installed over packages available in the
      # default index.
      if [ "${{inputs.use-underlinked-index}}" = "true" ]; then
        cat >> /etc/uv/uv.toml <<EOF
      [[index]]
      url = "https://user:$cgtoken@libraries.cgr.dev/python-underlinked/simple/"

      EOF
      fi

      cat >> /etc/uv/uv.toml <<EOF
      [[index]]
      url = "https://user:$cgtoken@libraries.cgr.dev/$index/simple/"
      default = true
      EOF
