name: Replace bundled CA files with links to the system bundle

description: |
  Replaces CA bundle files that a package ships, such as a vendored certifi
  cacert.pem, gsutil's cacerts.txt or grpcio's roots.pem, with symlinks to
  the system bundle. The package then follows ca-certificates updates instead
  of keeping a copy frozen at build time.

  With files, every pattern must match at least one file, and every match
  must be a PEM file or already link to the system bundle, so the step fails
  when upstream moves or renames the file instead of silently doing nothing.

  Without files, the step searches path for copies instead. Only text files
  whose name matches names are considered, so binaries and source files that
  embed PEM roots (libnode, a bundle in a .py string) are never replaced. A
  file is a copy when at least min-certs of its certificates are also in the
  system bundle, so private CAs and test certificates are kept, while old
  copies that share only some roots with the current bundle are still found.
  The count can't tell drift from additions: a copy with a private root
  appended is linked too, and the private root is lost. Use exclude for such
  files. The step fails if it links nothing.

  The package must depend on ca-certificates-bundle at runtime, or the links
  dangle in images that don't otherwise install it. Check the result with
  test/uses-system-ca-bundle.

  Not for Java keystores (use java-cacerts), files covered by an application's
  own integrity check (Nextcloud, WordPress), or root lists compiled into a
  binary (Go, Rust, Node, Chromium). Files inside archives (jars, wheels) are
  not searched.

needs:
  packages:
    - busybox
    - ca-certificates-bundle

inputs:
  files:
    description: |
      Whitespace-separated list of files to replace, usually under
      ${{targets.contextdir}}. Shell globs are allowed. Leave empty to search
      path for copies of the system bundle instead.
    required: false
    default: ""
  path:
    description: |
      Directory to search for copies of the system bundle when files is
      empty.
    default: ${{targets.contextdir}}
  min-certs:
    description: |
      When searching, the number of certificates a file must share with the
      system bundle to count as a copy of it.
    default: "10"
  names:
    description: |
      When searching, whitespace-separated shell patterns of file names to
      consider.
    default: "*.pem *.crt *.cer *.txt"
  exclude:
    description: |
      When searching, whitespace-separated shell patterns of installed paths
      to leave alone, such as "/usr/lib/foo/*" or "*/tests/*". Patterns are
      matched without the ${{targets.contextdir}} prefix, the same as in
      test/uses-system-ca-bundle.
    required: false
    default: ""
  bundle:
    description: |
      Path of the system CA bundle that the links point to.
    default: /etc/ssl/certs/ca-certificates.crt

# USAGE EXAMPLE (in a subpackage pipeline):
#
#   - uses: ca-certificates/use-system-bundle
#     with:
#       files: ${{targets.contextdir}}/usr/lib/python3.12/site-packages/httplib2/cacerts.txt
#
# Or search the package for copies of the system bundle:
#
#   - uses: ca-certificates/use-system-bundle
#
pipeline:
  - name: Link bundled CA files to the system bundle
    runs: |
      bundle="${{inputs.bundle}}"
      # Assign first: a multi-line list substituted into the for line is a syntax error.
      files="${{inputs.files}}"
      if [ -z "$files" ]; then
        echo "No files given; searching ${{inputs.path}} instead"
        exit 0
      fi
      linked=0
      set -f
      for pattern in $files; do
        set +f
        # Expand one pattern at a time so each must match something.
        set -- $pattern
        set -f
        if [ ! -e "$1" ] && [ ! -L "$1" ]; then
          echo "No file matches $pattern"
          exit 1
        fi
        for file in "$@"; do
          if [ -L "$file" ]; then
            target="$(readlink "$file")"
            if [ "$target" != "$bundle" ]; then
              echo "$file is a symlink to $target, not $bundle"
              exit 1
            fi
            echo "$file already links to $bundle"
            continue
          fi
          if [ ! -f "$file" ]; then
            echo "$file is not a regular file"
            exit 1
          fi
          if ! grep -q -- '-----BEGIN CERTIFICATE-----' "$file"; then
            echo "$file holds no PEM certificates; refusing to replace it"
            exit 1
          fi
          rm -f "$file"
          ln -s "$bundle" "$file"
          echo "Linked $file -> $bundle"
          linked=$((linked + 1))
        done
      done
      set +f
      echo "Linked $linked file(s) to $bundle"

  - name: Find copies of the system bundle and link them to it
    runs: |
      files="${{inputs.files}}"
      if [ -n "$files" ]; then
        exit 0
      fi
      bundle="${{inputs.bundle}}"
      search="${{inputs.path}}"
      min_certs="${{inputs.min-certs}}"
      names="${{inputs.names}}"
      exclude="${{inputs.exclude}}"
      contextdir="${{targets.contextdir}}"
      if [ ! -s "$bundle" ]; then
        echo "$bundle is missing or empty"
        exit 1
      fi

      # Build the find arguments: -name a -o -name b ...
      set -f
      set --
      for name in $names; do
        if [ "$#" -gt 0 ]; then
          set -- "$@" -o
        fi
        set -- "$@" -name "$name"
      done
      set +f
      if [ "$#" -eq 0 ]; then
        echo "names is empty"
        exit 1
      fi

      # One line per PEM file: certificates also in the bundle, total
      # certificates, path. Certificates are compared by their base64 body.
      # Markers must start a line and a block ends at the first line that
      # isn't base64, so indented or quoted PEM text doesn't count.
      found="$(mktemp)"
      find "$search" -type f \( "$@" \) -exec grep -l -- '-----BEGIN CERTIFICATE-----' {} + |
        while IFS= read -r file; do
          # Binaries can embed PEM roots (libnode, gocertifi); never replace them.
          if ! tr -d '\000' < "$file" | cmp -s - "$file"; then
            echo "Skipped binary $file" >&2
            continue
          fi
          counts="$(awk '
            /^-----BEGIN CERTIFICATE-----[ \t\r]*$/ { inside = 1; body = ""; next }
            inside && /^-----END CERTIFICATE-----[ \t\r]*$/ {
              inside = 0
              if (FILENAME == ARGV[1]) known[body] = 1
              else { total++; if (body in known) shared++ }
              next
            }
            inside && /^[A-Za-z0-9+\/=]+[ \t\r]*$/ { sub(/[ \t\r]+$/, ""); body = body $0; next }
            { inside = 0 }
            END { print shared + 0, total + 0 }
          ' "$bundle" "$file")"
          printf '%s %s\n' "$counts" "$file"
        done > "$found"

      linked=0
      set -f
      while read -r shared total file; do
        # Text can name the PEM marker without holding certificates.
        if [ "$total" -eq 0 ]; then
          continue
        fi
        skip=
        # Match the installed path, as test/uses-system-ca-bundle does.
        installed="${file#"$contextdir"}"
        for pattern in $exclude; do
          case "$installed" in
            $pattern) skip=1 ;;
          esac
        done
        if [ -n "$skip" ]; then
          echo "Excluded $file ($shared of $total certificates in $bundle)"
          continue
        fi
        if [ "$shared" -lt "$min_certs" ]; then
          echo "Kept $file: only $shared of $total certificates are in $bundle"
          continue
        fi
        rm -f "$file"
        ln -s "$bundle" "$file"
        echo "Linked $file -> $bundle ($shared of $total certificates in it)"
        linked=$((linked + 1))
      done < "$found"
      set +f
      rm -f "$found"

      echo "Linked $linked file(s) to $bundle"
      if [ "$linked" -eq 0 ]; then
        echo "Found no copies of $bundle under $search; drop this step or pass files"
        exit 1
      fi
