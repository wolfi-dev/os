name: Replace bundled CA files with links to the system bundle

description: |
  Replaces CA bundle files that a package ships, such as a vendored certifi
  cacert.pem, gsutil's cacerts.txt or grpcio's roots.pem, with symlinks to
  the system bundle. The package then follows ca-certificates updates instead
  of keeping a copy frozen at build time.

  Every pattern must match at least one file, and every match must be a PEM
  file or already link to the system bundle, so the step fails when upstream
  moves or renames the file instead of silently doing nothing.

  The package must depend on ca-certificates-bundle at runtime, or the links
  dangle in images that don't otherwise install it. Check the result with
  test/uses-system-ca-bundle.

  Not for Java keystores (use java-cacerts), files covered by an application's
  own integrity check (Nextcloud, WordPress), or root lists compiled into a
  binary (Go, Rust, Node, Chromium).

needs:
  packages:
    - busybox

inputs:
  files:
    description: |
      Whitespace-separated list of files to replace, usually under
      ${{targets.contextdir}}. Shell globs are allowed.
    required: true
  bundle:
    description: |
      Path of the system CA bundle that the links point to.
    default: /etc/ssl/certs/ca-certificates.crt

# USAGE EXAMPLE (in a subpackage pipeline):
#
#   - uses: ca-certificates/use-system-bundle
#     with:
#       files: ${{targets.contextdir}}/usr/lib/python3.12/site-packages/httplib2/cacerts.txt
#
pipeline:
  - name: Link bundled CA files to the system bundle
    runs: |
      bundle="${{inputs.bundle}}"
      # Assign first: a multi-line list substituted into the for line is a syntax error.
      files="${{inputs.files}}"
      linked=0
      set -f
      for pattern in $files; do
        set +f
        # Expand one pattern at a time so each must match something.
        set -- $pattern
        set -f
        if [ ! -e "$1" ] && [ ! -L "$1" ]; then
          echo "No file matches $pattern"
          exit 1
        fi
        for file in "$@"; do
          if [ -L "$file" ]; then
            target="$(readlink "$file")"
            if [ "$target" != "$bundle" ]; then
              echo "$file is a symlink to $target, not $bundle"
              exit 1
            fi
            echo "$file already links to $bundle"
            continue
          fi
          if [ ! -f "$file" ]; then
            echo "$file is not a regular file"
            exit 1
          fi
          if ! grep -q -- '-----BEGIN CERTIFICATE-----' "$file"; then
            echo "$file holds no PEM certificates; refusing to replace it"
            exit 1
          fi
          rm -f "$file"
          ln -s "$bundle" "$file"
          echo "Linked $file -> $bundle"
          linked=$((linked + 1))
        done
      done
      set +f
      echo "Linked $linked file(s) to $bundle"
