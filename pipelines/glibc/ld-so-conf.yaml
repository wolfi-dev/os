name: ld-so-conf

# Writes a runtime linker configuration file under /etc/ld.so.conf.d/ so that
# ldconfig adds the given library directory (or directories) to the shared
# library search path. Useful for packages that install libraries outside the
# default linker paths.

inputs:
  libdirs:
    description: |
      Space or newline-separated list of absolute library directories to add
      to the runtime linker search path (e.g. /usr/local/tensorrt/lib).
    required: true
  conf-name:
    description: |
      Basename (without the .conf extension) of the file written under
      /etc/ld.so.conf.d/. Defaults to the name of the package.
    required: false
    default: ${{context.name}}

pipeline:
  - name: "create linker config"
    runs: |
      confname="${{inputs.conf-name}}"
      confdir="${{targets.contextdir}}/etc/ld.so.conf.d"
      conf="$confdir/$confname.conf"
      libdirs="${{inputs.libdirs}}"

      if [ -z "$libdirs" ]; then
        echo "ERROR[glibc/ld-so-conf]: no library directories provided"
        exit 1
      fi

      mkdir -p "$confdir"
      # shellcheck disable=SC2086 # intentional word-splitting of the libdirs list
      for libdir in $libdirs; do
        [ -n "$libdir" ] || continue
        case "$libdir" in
          /*)
            ;;
          *) echo "ERROR[glibc/ld-so-conf]: library directory must be absolute: $libdir"
            exit 1
            ;;
        esac
        echo "$libdir" >> "$conf"
      done
      echo "INFO[glibc/ld-so-conf]: wrote $conf"
