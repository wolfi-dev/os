name: Download JARs from a Maven repository

# Downloads one or more JAR artifacts into a directory, named
# <artifact-id>-<version>.jar, so that a later pipeline step can read them.
# That is the whole of what it does. Use it when you need a JAR on disk as a
# step towards something else, such as packing it into a fat JAR.
#
# fetch-jar applies no guards of any kind. It does not:
# * look at what is already on disk
# * read or compare versions, or give any downgrade protection
# * check whether a filename is referred to anywhere in the package
# * verify a checksum
#
# Use fetch-jar to download a JAR, including to add one to the package that
# upstream does not ship. Use java/replace-jar to replace a JAR that already
# exists in the package, which carries the guards above.
#
# By default this pipeline downloads from Maven Central. It honours
# ~/.m2/settings.xml, so running auth/maven first points it at Chainguard
# Libraries instead.
needs:
  packages:
    - busybox
    - maven

inputs:
  artifact-id:
    description: |
      The Maven artifact ID to download (e.g. jackson-databind). May be a
      whitespace-separated list of artifact IDs sharing the same group-id and
      version.
    required: true
  destination-dir:
    description: |
      Directory the JARs are written to, created if it does not exist. Each
      file is named <artifact-id>-<version>.jar.
    default: "/tmp"
  group-id:
    description: The Maven group ID to download (e.g. com.fasterxml.jackson.core)
    required: true
  version:
    description: |
      The version to download. Every listed artifact-id is downloaded at this
      one version.
    required: true

pipeline:
  - name: Download JARs
    runs: |
      set -euo pipefail

      group_id="${{inputs.group-id}}"
      artifact_ids="${{inputs.artifact-id}}"
      version="${{inputs.version}}"
      destination_dir="${{inputs.destination-dir}}"

      # Collapse whatever whitespace a folded YAML scalar produced.
      artifact_ids=$(echo $artifact_ids)

      die() {
        echo "ERROR: $*" >&2
        exit 1
      }

      if [ -z "$destination_dir" ]; then
        die "destination-dir must not be empty"
      fi
      mkdir -p "$destination_dir"
      # Resolved before the cd below, which would otherwise reinterpret a
      # relative destination.
      destination_dir=$(cd "$destination_dir" && pwd)

      work=$(mktemp -d)
      log="$work/mvn.log"

      # The JVM takes user.home from the passwd entry rather than $HOME, so a
      # settings.xml may sit under either. Report whichever exists, so that a
      # failed download names the source that was in effect.
      settings=""
      for candidate in "${HOME:-/root}/.m2/settings.xml" /root/.m2/settings.xml; do
        if [ -f "$candidate" ]; then
          settings="$candidate"
          break
        fi
      done
      if [ -n "$settings" ]; then
        settings_note="the mirror configured in $settings was in effect"
      else
        settings_note="no ~/.m2/settings.xml was in effect, so the download went to Maven Central"
      fi

      for artifact in $artifact_ids; do
        echo "Downloading ${group_id}:${artifact}:${version} to ${destination_dir}/"
        # The plugin coordinate is given in full, with a version, so that the
        # download needs no group-level maven-metadata.xml from the mirror to
        # resolve the "dependency" prefix, and so that a new plugin release
        # cannot change what a build does.
        # Run from an empty directory. A melange step runs in the source
        # tree, and mvn would otherwise read a pom.xml sitting there and fail
        # on that project before downloading anything.
        if ! (cd "$work" && mvn -B -q \
            org.apache.maven.plugins:maven-dependency-plugin:3.9.0:copy \
            -Dartifact="${group_id}:${artifact}:${version}" \
            -DoutputDirectory="$destination_dir") > "$log" 2>&1; then
          cat "$log" >&2
          die "failed to download ${group_id}:${artifact}:${version} ($settings_note)"
        fi
        if [ ! -f "$destination_dir/${artifact}-${version}.jar" ]; then
          cat "$log" >&2
          die "the download of ${group_id}:${artifact}:${version} produced no ${artifact}-${version}.jar ($settings_note)"
        fi
        # Maven writes the file with the process umask, which is 0664 under a
        # 002 umask. Set the mode explicitly so a JAR added to a package has a
        # predictable one.
        chmod 0644 "$destination_dir/${artifact}-${version}.jar"
      done
