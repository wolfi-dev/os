name: Configure project with meson

needs:
  packages:
    - meson

inputs:
  output-dir:
    description: |
      The output directory for the Meson build.
    default: output
  opts:
    description: |
      Compile options for the Meson build.

pipeline:
  # This file shadows melange's built-in `meson/configure` pipeline (melange reads
  # the repository pipeline directories before its embedded copies) and differs
  # from it in one line: --buildtype=plain. It is kept as byte-identical copies in
  # pipelines/ and os/pipelines/, as the other shared pipelines are: os/ builds read
  # only os/pipelines, enterprise-packages/ and extra-packages/ read pipelines/ as
  # well, and `stereo lint` fails if the copies drift apart.
  #
  # Meson's own default build type is `debug` (-O0 -g) for every project whose
  # meson.build declares no default_options, and GCC's -fhardened defines
  # _FORTIFY_SOURCE only when optimising, so such packages shipped unoptimised and
  # unfortified. `plain` makes meson add no optimisation or debug flags of its own
  # and lets the toolchain's spec file supply -O2 and the hardening flags, the way
  # every autotools and CMake recipe already builds, and the way Fedora (%meson),
  # Debian (dh_meson), Arch (arch-meson) and Alpine (abuild) configure meson.
  #
  # A recipe that needs something else passes it in `opts`: a later --buildtype on
  # the command line wins over this one, and a recipe that splits debug info into
  # a -dbg subpackage adds -Ddebug=true. Drop this file once the same default has
  # landed in melange itself.
  #
  # Don't download subprojects by default. We want to use only the source
  # provided by the project, and if any subprojects are needed we should
  # provide them ourselves.
  # Ref: https://mesonbuild.com/Subprojects.html#commandline-options
  - runs: |
      meson setup . ${{inputs.output-dir}} \
        --prefix=/usr \
        --wrap-mode=nodownload \
        --buildtype=plain \
        ${{inputs.opts}}
