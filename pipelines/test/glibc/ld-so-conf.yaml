name: ld-so-conf

# Verifies that library directories are present in socache.

inputs:
  libdirs:
    description: |
      Space or newline-separated list of absolute library directories that
      should be present in socache.
    required: true

pipeline:
  - name: "verify socache contains library path(s)"
    runs: |
      info() { echo "INFO[glibc/ldconfig-check]:" "$@"; }
      fail() { echo "FAIL[glibc/ldconfig-check]:" "$@"; fails=$((fails+1)); }
      pass() { echo "PASS[glibc/ldconfig-check]:" "$@"; }

      fails=0
      libdirs="${{inputs.libdirs}}"

      if [ -z "$libdirs" ]; then
        fail "no 'libdirs' provided"
        exit 1
      fi

      # -N: do not rebuild the cache; -v: print each directory scanned.
      # ldconfig only scans directories that exist, so create them if absent.
      # shellcheck disable=SC2086 # intentional word-splitting of the libdirs list
      for libdir in $libdirs; do
        [ -n "$libdir" ] || continue
        mkdir -p "$libdir"
        if ldconfig -vN | grep -qF "$libdir"; then
          pass "socache contains $libdir"
        else
          fail "socache does not contain $libdir"
        fi
      done

      if [ "$fails" = "0" ]; then
        info "successfully found libdir(s) in socache"
      else
        fail "failed to find library directories in socache, $fails failure(s)."
      fi
      exit $fails
