name: Test PHP Tidy

description: Verify automatic extension loading, HTML repair and diagnostics.

pipeline:
  - runs: |
      php <<'PHP'
      <?php
      function check(bool $ok, string $message): void {
          if (!$ok) {
              fwrite(STDERR, $message . "\n");
              exit(1);
          }
      }
      check(extension_loaded('tidy'), 'Tidy did not load through its installed configuration');
      $options = ['show-body-only' => true, 'wrap' => 0];
      $input = '<p>hello <b>world';
      $expected = '<p>hello <b>world</b></p>';
      $output = tidy_repair_string($input, $options, 'utf8');
      check(is_string($output) && trim($output) === $expected, 'HTML repair failed');
      $unicode = tidy_repair_string('<p>café <b>日本語', $options, 'utf8');
      check(is_string($unicode) && trim($unicode) === '<p>café <b>日本語</b></p>', 'UTF-8 repair failed');
      $doc = new tidy();
      check($doc->parseString($input, $options, 'utf8'), 'Object API parsing failed');
      check($doc->cleanRepair(), 'Object API repair failed');
      check(trim((string)$doc) === $expected, 'Object API output differs');
      check(tidy_warning_count($doc) > 0, 'Malformed HTML produced no warnings');
      check(is_string($doc->errorBuffer) && $doc->errorBuffer !== '', 'Diagnostics are missing');
      echo "Tidy loading, repair, UTF-8 and diagnostics passed\n";
      PHP
