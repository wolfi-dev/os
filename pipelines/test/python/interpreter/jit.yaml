name: jit

description: |
  Checks whether the given interpreter's JIT (just-in-time) compiler is
  available and enabled. It compares both results with the expected values
  in the available and enabled inputs.

inputs:
  python:
    description: |
      The Python interpreter to check.
    required: true
  available:
    description: |
      What sys._jit.is_available() must return: "true" or "false".
    required: true
  enabled:
    description: |
      What sys._jit.is_enabled() must return: "true" or "false".
    required: true

pipeline:
  - name: "check whether the JIT is available and enabled"
    runs: |
      "${{inputs.python}}" - "${{inputs.available}}" "${{inputs.enabled}}" <<'EOF'
      import sys


      def expected(name, value):
          if value not in ("true", "false"):
              raise SystemExit(f"input {name} must be 'true' or 'false', got {value!r}")
          return value == "true"


      want = expected("available", sys.argv[1])
      found = sys._jit.is_available()
      assert found == want, f"sys._jit.is_available() returned {found}, expected {want}"

      want = expected("enabled", sys.argv[2])
      found = sys._jit.is_enabled()
      assert found == want, f"sys._jit.is_enabled() returned {found}, expected {want}"
      EOF
