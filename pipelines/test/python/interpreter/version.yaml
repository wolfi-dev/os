name: version

description: |
  Checks that the given interpreter reports exactly the expected X.Y.Z
  version. It reads the version from three sources: --version,
  sys.version_info and platform.python_version().

inputs:
  python:
    description: |
      The Python interpreter to check.
    required: true
  version:
    description: |
      The version the interpreter must report, as X.Y.Z.
    required: true

pipeline:
  - name: "check that the interpreter reports the expected version"
    runs: |
      python="${{inputs.python}}"
      expected="${{inputs.version}}"

      found=$("$python" --version)
      if [ "$found" != "Python $expected" ]; then
        echo "FAIL: $python --version printed '$found', expected 'Python $expected'"
        exit 1
      fi

      "$python" - "$expected" <<'EOF'
      import platform
      import sys

      expected = sys.argv[1]
      found = "%d.%d.%d" % sys.version_info[:3]
      assert found == expected, f"sys.version_info is {found}, expected {expected}"
      found = platform.python_version()
      assert found == expected, f"platform.python_version() is {found!r}, expected {expected!r}"
      EOF
