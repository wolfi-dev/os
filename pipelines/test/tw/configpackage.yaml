name: Config Package Check

description: |
  Validates that a configuration package contains non-empty configuration
  files in the expected location. Configuration packages install runtime
  configuration under /etc/ or a specified directory. Only files owned by
  the package under test are checked, as listed by 'apk info -L', so files
  installed by other packages in the test environment do not count.

needs:
  packages:
    - apk-tools

inputs:
  dir:
    description: |
      Directory to check for config files. Defaults to etc/.
      Override if config files are installed elsewhere
      (e.g., usr/share/myapp/ or terraform/).
    default: "etc/"
  package:
    description: Package to check for config files.
    default: ${{context.name}}

pipeline:
  - name: Check that config package contains non-empty config files
    runs: |
      pkg="${{inputs.package}}"
      dir="${{inputs.dir}}"

      # apk lists paths without a leading '/'; strip one so callers can
      # pass either form.
      dir="${dir#/}"

      if ! file_list=$(apk info --quiet -L "${pkg}"); then
        echo "FAIL: failed to list contents of [${pkg}]" >&2
        exit 1
      fi

      # Match dir as a literal prefix rather than a regex.
      config_files=$(printf '%s\n' "${file_list}" | awk -v d="${dir}" 'index($0, d) == 1')
      if [ -z "${config_files}" ]; then
        echo "FAIL: [${pkg}] does not contain config files in [${dir}]" >&2
        exit 1
      fi

      nonempty=0
      while IFS= read -r f; do
        if [ -f "/${f}" ] && [ -s "/${f}" ]; then
          nonempty=$((nonempty + 1))
        fi
      done <<CONFIG_FILES
      ${config_files}
      CONFIG_FILES
      if [ "${nonempty}" -eq 0 ]; then
        echo "FAIL: [${pkg}] has no non-empty regular files in [${dir}]" >&2
        exit 1
      fi

      printf 'Config files found:\n%s\n' "${config_files}"
      echo "PASS: [${pkg}] has ${nonempty} non-empty config file(s) in [${dir}]"
