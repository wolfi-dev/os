name: Shared Library Soversion Validator

description: |
  Checks that a soname-versioned library package only ships shared libraries
  whose SONAME version matches the soversion its name ends in. For example,
  libfoo2 and libfoo-2 must ship libfoo.so.2. Use this on library subpackages
  named from a fixed vars.soversion, so a version bump that changes the
  upstream SONAME fails the build instead of shipping the new library under
  the old package name. It also checks that melange SCA generated a matching
  so: provide for each library (libfoo2 must provide so:libfoo.so.2=2) and
  that every so: provide on the package matches its name. On a mismatch, the
  output names the vars.soversion value to set.

needs:
  packages:
    - soversion-check

inputs:
  packages:
    description: |
      Space-separated list of package names to check. Each package's
      shared libraries are checked against that package's own name.
    required: false
    default: "${{context.name}}"

# USAGE EXAMPLES:
#
# In a library subpackage named from vars.soversion:
#   - name: libfoo${{vars.soversion}}
#     pipeline:
#       - uses: split/lib
#     test:
#       pipeline:
#         - uses: test/tw/ldd-check
#         - uses: test/tw/soversion-check
#
pipeline:
  - name: "check shared library SONAME versions match the package name"
    runs: |
      soversion-check --packages="${{inputs.packages}}"
