name: Check that bundled CA files link to the system bundle

description: |
  Fails unless every given file is a symlink to the system CA bundle, the
  link resolves to a non-empty file, and the package declares a runtime
  dependency on ca-certificates-bundle. Pairs with
  ca-certificates/use-system-bundle.

  Without files, it checks every file the package installs instead: no text
  file whose name matches names may be a copy of the system bundle (at least
  min-bundle-size certificates, min-certs of them in the bundle), and at least
  one file must link to it. Links count when
  they resolve to the bundle, so relative links and links through
  /etc/ssl/cert.pem are fine.

  The dependency is read from the apk database rather than inferred from the
  link resolving, because the bundle often arrives transitively (wolfi-base
  pulls in apk-tools, which depends on it) and would hide a missing
  dependency.

needs:
  packages:
    - busybox

inputs:
  files:
    description: |
      Whitespace-separated list of installed paths to check. Shell globs are
      allowed. Leave empty to check every file the package installs.
    required: false
    default: ""
  min-certs:
    description: |
      Without files, the number of certificates a file may share with the
      system bundle before it counts as a copy that should be a link.
    default: "3"
  min-bundle-size:
    description: |
      Without files, the number of certificates a file must hold to count as
      a copy of the system bundle.
    default: "20"
  names:
    description: |
      Without files, whitespace-separated shell patterns of file names to
      check for copies. Use the same patterns as in
      ca-certificates/use-system-bundle.
    default: "*.pem *.crt *.cer *.txt"
  exclude:
    description: |
      Without files, whitespace-separated shell patterns of installed paths
      to leave alone, such as "/usr/lib/foo/*" or "*/tests/*". Use the same
      patterns as in ca-certificates/use-system-bundle.
    required: false
    default: ""
  bundle:
    description: |
      Path of the system CA bundle that the links must point to.
    default: /etc/ssl/certs/ca-certificates.crt
  package:
    description: |
      Package that must declare the runtime dependency on
      ca-certificates-bundle.
    default: ${{context.name}}

# USAGE EXAMPLE:
#
#   - uses: test/uses-system-ca-bundle
#     with:
#       files: /usr/lib/python3.12/site-packages/httplib2/cacerts.txt
#
# Or check every file the package installs:
#
#   - uses: test/uses-system-ca-bundle
#
pipeline:
  - name: Check bundled CA files link to the system bundle
    runs: |
      bundle="${{inputs.bundle}}"
      # Assign first: a multi-line list substituted into the for line is a syntax error.
      files="${{inputs.files}}"
      if [ -z "$files" ]; then
        exit 0
      fi
      checked=0
      set -f
      for pattern in $files; do
        set +f
        set -- $pattern
        set -f
        if [ ! -e "$1" ] && [ ! -L "$1" ]; then
          echo "No file matches $pattern"
          exit 1
        fi
        for file in "$@"; do
          if [ ! -L "$file" ]; then
            echo "$file is not a symlink"
            exit 1
          fi
          target="$(readlink "$file")"
          if [ "$target" != "$bundle" ]; then
            echo "$file links to $target, not $bundle"
            exit 1
          fi
          if [ ! -s "$file" ]; then
            echo "$file links to $bundle, which is missing or empty; does the package depend on ca-certificates-bundle?"
            exit 1
          fi
          checked=$((checked + 1))
        done
      done
      set +f
      echo "Checked $checked link(s) to $bundle"

  - name: Check the package depends on ca-certificates-bundle
    runs: |
      pkg="${{inputs.package}}"
      # Read the apk database with awk: apk-tools would pull the bundle in.
      if ! awk -v p="$pkg" -v d=ca-certificates-bundle '
        /^P:/ { cur = substr($0, 3) }
        cur == p && /^D:/ {
          sub(/^D:/, "")
          for (i = 1; i <= NF; i++)
            if ($i == d || (index($i, d) == 1 && substr($i, length(d) + 1, 1) ~ /[<>=~]/)) found = 1
        }
        END { exit !found }
      ' /lib/apk/db/installed; then
        echo "$pkg has no runtime dependency on ca-certificates-bundle"
        exit 1
      fi
      echo "$pkg depends on ca-certificates-bundle"

  - name: Check the package ships no copies of the system bundle
    runs: |
      files="${{inputs.files}}"
      if [ -n "$files" ]; then
        exit 0
      fi
      pkg="${{inputs.package}}"
      bundle="${{inputs.bundle}}"
      min_certs="${{inputs.min-certs}}"
      min_size="${{inputs.min-bundle-size}}"
      names="${{inputs.names}}"
      exclude="${{inputs.exclude}}"
      if [ ! -s "$bundle" ]; then
        echo "$bundle is missing or empty"
        exit 1
      fi
      resolved_bundle="$(readlink -f "$bundle")"

      # List the package's files from the apk database, then keep those with
      # PEM certificates. grep follows links, so links to the bundle are kept.
      owned="$(mktemp)"
      awk -v p="$pkg" '
        /^P:/ { cur = substr($0, 3); dir = "" }
        cur == p && /^F:/ { dir = substr($0, 3) "/" }
        cur == p && /^R:/ { print "/" dir substr($0, 3) }
      ' /lib/apk/db/installed > "$owned"
      candidates="$(mktemp)"
      tr '\n' '\0' < "$owned" | xargs -0 -r grep -l -s -- '-----BEGIN CERTIFICATE-----' > "$candidates" || true

      links=0
      copies=0
      set -f
      while IFS= read -r file; do
        if [ -L "$file" ]; then
          if [ "$(readlink -f "$file")" = "$resolved_bundle" ]; then
            links=$((links + 1))
          fi
          continue
        fi
        wanted=
        for name in $names; do
          case "${file##*/}" in
            $name) wanted=1 ;;
          esac
        done
        for pattern in $exclude; do
          case "$file" in
            $pattern) wanted= ;;
          esac
        done
        if [ -z "$wanted" ]; then
          continue
        fi
        # Binaries can embed PEM roots (libnode, gocertifi); they aren't copies.
        if ! tr -d '\000' < "$file" | cmp -s - "$file"; then
          continue
        fi
        counts="$(awk '
          /^-----BEGIN CERTIFICATE-----[ \t\r]*$/ { inside = 1; body = ""; next }
          inside && /^-----END CERTIFICATE-----[ \t\r]*$/ {
            inside = 0
            if (FILENAME == ARGV[1]) known[body] = 1
            else { total++; if (body in known) shared++ }
            next
          }
          inside && /^[A-Za-z0-9+\/=]+[ \t\r]*$/ { sub(/[ \t\r]+$/, ""); body = body $0; next }
          { inside = 0 }
          END { print shared + 0, total + 0 }
        ' "$bundle" "$file")"
        shared="${counts% *}"
        total="${counts#* }"
        if [ "$total" -ge "$min_size" ] && [ "$shared" -ge "$min_certs" ]; then
          echo "$file is a copy of $bundle ($shared of its $total certificates in common), not a link to it"
          copies=$((copies + 1))
        fi
      done < "$candidates"
      set +f
      rm -f "$owned" "$candidates"

      if [ "$copies" -gt 0 ]; then
        exit 1
      fi
      if [ "$links" -eq 0 ]; then
        echo "$pkg has no links to $bundle"
        exit 1
      fi
      echo "$pkg has $links link(s) to $bundle and no copies of it"
