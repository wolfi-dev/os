name: FFmpeg upstream FATE suite

description: |
  Runs FFmpeg's upstream FATE regression suite (`make fate -k`) against the
  freshly built tree. SAMPLES is not set, so sample-dependent tests are
  skipped. Use it right after the main `autoconf/make` of the library build,
  before `autoconf/make-install`.

  The suite is a hard gate: any failing test fails the build. Prints the
  full FATE log, then summary lines:
    UPSTREAM-TESTS <package>: duration=<n>s
    UPSTREAM-TESTS-FAIL <package>: <test>      (one per failing test)
    UPSTREAM-TESTS <package>: pass=<n> fail=<n> skip=<n> (run=<n> total=<n>)

  Example:
    - uses: autoconf/make
    - uses: upstream-tests/ffmpeg-fate

  Named exceptions go in ignore-tests (FATE names without the "fate-"
  prefix). Every exception needs a comment in the calling package explaining
  why and a `TODO(upstream-tests): ...` to remove it:
    # fate-seek-hls: one packet size differs in this variant only.
    # TODO(upstream-tests): investigate seek-hls and drop it.
    - uses: upstream-tests/ffmpeg-fate
      with:
        ignore-tests: seek-hls

inputs:
  ignore-tests:
    description: |
      Space-separated FATE test names (without the "fate-" prefix) to pass
      as IGNORE_TESTS. Each one needs a comment and TODO in the caller.
    default: ""
  jobs:
    description: Parallel make jobs for `make fate`.
    default: "$(nproc)"

pipeline:
  - name: upstream-tests (FATE)
    runs: |
      PKG="${{package.name}}"
      ignore_tests="${{inputs.ignore-tests}}"
      # --enable-shared: in-tree binaries have no rpath, so point the loader
      # at the freshly built libs (same approach distros use for FATE).
      export LD_LIBRARY_PATH="$(for d in libav* libsw* libpostproc; do [ -d "$d" ] && printf '%s:' "$PWD/$d"; done)${LD_LIBRARY_PATH:-}"
      start=$(date +%s)
      rc=0
      if [ -n "$ignore_tests" ]; then
        make fate -j${{inputs.jobs}} -k IGNORE_TESTS="$ignore_tests" > fate.log 2>&1 || rc=$?
      else
        make fate -j${{inputs.jobs}} -k > fate.log 2>&1 || rc=$?
      fi
      end=$(date +%s)
      cat fate.log
      echo "UPSTREAM-TESTS ${PKG}: duration=$((end - start))s"
      run=$(grep -c '^TEST ' fate.log || true)
      # fate-list only includes sample-dependent tests when SAMPLES is set
      total=$(make -s fate-list SAMPLES=/nonexistent 2>/dev/null | grep -c '^fate-' || true)
      fail=unknown
      pass=unknown
      skip=unknown
      if ls tests/data/fate/*.rep >/dev/null 2>&1; then
        # .rep format: <test>:<exit status>:...; non-zero status = failure
        fail=$(cat tests/data/fate/*.rep | awk -F: '$2 != "0"' | wc -l)
        pass=$(cat tests/data/fate/*.rep | awk -F: '$2 == "0"' | wc -l)
        cat tests/data/fate/*.rep | awk -F: '$2 != "0" {print "UPSTREAM-TESTS-FAIL '"${PKG}"': " $1}'
      fi
      if [ "${total:-0}" -gt 0 ] && [ "${run:-0}" -gt 0 ]; then
        skip=$((total - run))
      fi
      echo "UPSTREAM-TESTS ${PKG}: pass=${pass} fail=${fail} skip=${skip} (run=${run} total=${total})"
      exit $rc
