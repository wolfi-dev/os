name: Upstream make check/test suite

description: |
  Runs a package's upstream test suite through make (`make check` by
  default) in the freshly built tree. Use it right after the main build step
  (`autoconf/make` or equivalent), before `autoconf/make-install`. It makes
  no network assumptions.

  The suite is a hard gate. The step fails if:
    - a test that is not in `ignore` fails (automake FAIL, XPASS or ERROR),
      or a recognised summary reports failures,
    - make fails for any reason other than test failures (missing target,
      test build error, timeout),
    - the suite did not actually run: no test passed, make had nothing to
      do for the target, or, with `harness: auto`, the log has none of the
      summary formats below (for example PGXS's '"make check" is not
      supported', an empty check rule, or an automake tree with no TESTS).
      The reason then says "no recognised test summary", or names the
      "no tests to run" style message or the automake recursion that ran
      nothing.

  Streams the make output as the suite runs (a background tail of the log
  make writes, so the step still ends when make does), prints
  test-suite.log of any automake directory with failures and the autotest
  testsuite.log (first 5000 lines) when an autotest suite fails, then:
    UPSTREAM-TESTS <package>: duration=<n>s
    UPSTREAM-TESTS-FAIL <package>: <test>      (one per non-ignored failure)
    UPSTREAM-TESTS <package>: pass=<n> fail=<n> skip=<n> [xfail=<n>] [ignored=<n>]

  Counts come from the first of these summary formats found in the log,
  summed across subdirectories, plus any GNU Autotest suite:
    - automake parallel harness: the "# TOTAL:", "# PASS:", ... blocks.
      fail = FAIL + XPASS + ERROR including ignored ones; ignored = how many
      of those were in `ignore`.
    - automake serial harness (automake <= 1.11 or `serial-tests`):
      "All N tests passed", "All N tests behaved as expected (X expected
      failures)", "F of N tests failed", "F of N tests did not behave as
      expected (...)", "(S tests were not run)". In the "F of N" forms,
      pass includes any expected failures.
    - e2fsprogs style: "N tests succeeded  F tests failed". skip=unknown
      (skipped tests count as succeeded).
    - Perl Test::Harness: "Files=N, Tests=..." and "Failed F/N test
      programs". Counted in test programs (t/*.t), not assertions;
      skip=unknown.
    - "Test suite summary: pass: P/N, skip: S/N, fail: F/N" (jemalloc).
    - "Tests OK: N of M" and "Tests FAILED: F of M" (jp2a).
    - "Total N tests, no errors" / "Total N tests, E errors, L leaks"
      (libxml2, libxslt runtest). skip=unknown.
    - "Summary:" followed by "succeeded: N", "failed: N", "skipped: N"
      (stunnel).
    - GNU Autotest, alone or added to any of the above: "[All] N tests
      were successful.", "N tests behaved as expected.", "ERROR: N tests
      were run, M failed unexpectedly." (and its other forms), "S tests
      were skipped.". Failing tests are named "NUM: title".
  `ignore` is only honoured for the two automake formats; autotest failures
  are never ignorable.

  A suite with none of these formats needs `harness: custom`: plain
  Makefiles, custom `make test` rules, and suites run from automake's
  `check-local` hook that print their own wording. Set it once you have
  checked that the suite really runs and that a failing test makes make
  exit non-zero. The step then relies on make's exit status, plus any
  summary format it recognises, and reports pass=unknown fail=unknown
  skip=unknown.

  Test suites often expect tools the build environment lacks. This pipeline
  always adds bash, because many test-driver and test scripts are
  #!/bin/bash. Common additions to the calling package's environment are
  diffutils (busybox diff lacks options such as -c), gawk, tzdata and
  procps. Add each with a comment saying the suite needs it.

  Examples:
    - uses: autoconf/make
    - uses: upstream-tests/make-check

    - uses: upstream-tests/make-check
      with:
        target: test
        dir: build
        args: VERBOSE=1

    # `make check` runs tests/run.sh, which prints no summary this
    # pipeline reads but exits non-zero when a test fails.
    - uses: upstream-tests/make-check
      with:
        harness: custom

  Named exceptions go in ignore: space-separated test names as automake
  prints them on its "FAIL: <name>" lines (the basename also matches). Each
  ignored test still runs and is reported as IGNORE. Every exception needs a
  comment in the calling package explaining why and a
  `TODO(upstream-tests): ...` to remove it:
    # foo_unittest: asserts wall-clock timings; flaky on loaded builders.
    # TODO(upstream-tests): fix the timing assumption upstream and drop it.
    - uses: upstream-tests/make-check
      with:
        ignore: foo_unittest

needs:
  packages:
    - bash

inputs:
  target:
    description: |
      make target(s) that run the suite, space-separated, e.g. check, test,
      tests, test-nonflaky, or "check test-extra".
    default: check
  jobs:
    description: Parallel make jobs.
    default: "$(nproc)"
  dir:
    description: Directory (relative to the build workspace) to run make in.
    default: "."
  args:
    description: Extra make arguments, e.g. VAR=value.
    default: ""
  ignore:
    description: |
      Space-separated test names whose failures are allowed (automake
      harness only). Each one needs a comment and TODO in the caller.
    default: ""
  harness:
    description: |
      auto (default) or custom. auto fails a suite whose log has no
      recognised summary format. custom accepts it (and skips the
      "automake recursed but ran no tests" and "no tests to run" message
      checks), for suites that report only through make's exit status,
      such as a hand-written rule or a check-local suite with its own
      wording. Only use it when you have checked that the suite runs and a
      failing test makes make exit non-zero.
    default: auto
  timeout:
    description: Wall-clock limit for the whole suite, in seconds.
    default: "3600"

pipeline:
  - name: upstream-tests (make check)
    runs: |
      PKG="${{package.name}}"
      targets="${{inputs.target}}"
      ignore=" $(echo ${{inputs.ignore}}) "
      harness="${{inputs.harness}}"
      case "$harness" in
        auto|custom) ;;
        *)
          echo "UPSTREAM-TESTS ${PKG}: FAILED: harness must be auto or custom, not '$harness'"
          exit 1
          ;;
      esac
      cd "${{inputs.dir}}"
      log=$(mktemp)
      start=$(date +%s)
      # make writes to the file, so the step's lifetime follows make alone:
      # busybox timeout signals only make's pid, and a test process that
      # outlives make (a hung grandchild, a daemon a test script left
      # behind) must not hold the step open the way it would hold a pipe.
      # A background tail streams the file while the suite runs, so a hang
      # shows where it stopped; it is display only, the parse below reads
      # the file. tail -f polls once a second: the sleep lets it print the
      # last lines before it is stopped.
      tail -n +1 -f "$log" &
      tailpid=$!
      trap 'kill "$tailpid" 2>/dev/null || true' EXIT
      rc=0
      AM_COLOR_TESTS=no timeout ${{inputs.timeout}} \
        make -k -j${{inputs.jobs}} ${{inputs.args}} $targets > "$log" 2>&1 || rc=$?
      duration=$(( $(date +%s) - start ))
      sleep 2
      kill "$tailpid" 2>/dev/null || true
      wait "$tailpid" 2>/dev/null || true

      gate=0
      why=""
      # coreutils timeout exits 124; busybox timeout (what most stereo build
      # environments have) kills make with SIGTERM, so the shell sees 143.
      # Treat any signal exit as a timeout/abort.
      if [ "$rc" -eq 124 ] || [ "$rc" -ge 128 ]; then
        gate=1; why="$why timed out or killed (exit $rc, limit ${{inputs.timeout}}s);"
      fi
      if grep -q 'No rule to make target' "$log"; then
        gate=1; why="$why missing make target;"
      fi
      for t in $targets; do
        if grep -qE "^make: (Nothing to be done for .$t.|.$t. is up to date)" "$log"; then
          gate=1; why="$why make $t did nothing;"
        fi
      done

      # Pick the summary format. Counts stay "unknown" if none matches.
      fmt=custom
      pass=unknown fail=unknown skip=unknown xfail=0 total=unknown
      if grep -qE '^# TOTAL: +[0-9]+' "$log"; then
        # automake parallel harness: sum the per-directory summary blocks.
        fmt=automake
        set -- $(awk '
          /^# TOTAL: /{t+=$3} /^# PASS: /{p+=$3} /^# SKIP: /{s+=$3}
          /^# XFAIL: /{xf+=$3} /^# FAIL: /{f+=$3} /^# XPASS: /{xp+=$3}
          /^# ERROR: /{e+=$3}
          END {print t+0, p+0, s+0, xf+0, f+xp+e}' "$log")
        total=$1 pass=$2 skip=$3 xfail=$4 fail=$5
      elif grep -qE '^((All [0-9]+ tests|1 test) (passed|behaved as expected)|[0-9]+ of [0-9]+ tests? (failed|did not behave as expected))' "$log"; then
        # automake serial harness: one banner per directory. N excludes
        # skipped tests; F counts both FAIL and XPASS. With exactly one
        # test, automake drops "All" ("1 test passed").
        fmt=automake
        set -- $(awk '
          /^(All [0-9]+ tests|1 test) passed/ { o = ($1 == "All"); p+=$(1+o) }
          /^(All [0-9]+ tests|1 test) behaved as expected \([0-9]+ expected/ {
            o = ($1 == "All"); x=$(6+o); sub(/^\(/, "", x); p+=$(1+o)-x; xf+=x }
          /^[0-9]+ of [0-9]+ tests? (failed|did not behave as expected)/ {
            f+=$1; p+=$3-$1 }
          /^\([0-9]+ tests? (was|were) not run\)/ {
            n=$1; sub(/^\(/, "", n); s+=n }
          END {print p+f+xf+s, p+0, s+0, xf+0, f+0}' "$log")
        total=$1 pass=$2 skip=$3 xfail=$4 fail=$5
      elif grep -qE '^[0-9]+ tests succeeded[[:space:]]+[0-9]+ tests failed' "$log"; then
        fmt=e2fsprogs
        set -- $(awk '
          /^[0-9]+ tests succeeded[[:space:]]+[0-9]+ tests failed/ {p+=$1; f+=$4}
          END {print p+0, f+0}' "$log")
        pass=$1 fail=$2
      elif grep -qE '^Files=[0-9]+, Tests=[0-9]+' "$log"; then
        # Perl Test::Harness ("make test" of a Makefile.PL tree), counted in
        # test programs (t/*.t files), not assertions.
        fmt=tap
        set -- $(awk '
          /^Files=[0-9]+, Tests=[0-9]+/ {
            n=$1; sub(/^Files=/, "", n); sub(/,$/, "", n); t+=n }
          /^Failed [0-9]+\/[0-9]+ test programs/ {
            split($2, a, "/"); f+=a[1] }
          END {print t-f, f+0}' "$log")
        pass=$1 fail=$2
      elif grep -qE '^Test suite summary: pass: [0-9]+/[0-9]+, skip: [0-9]+/[0-9]+, fail: [0-9]+/' "$log"; then
        # jemalloc's test/test.sh, one line per suite (unit, integration, ...).
        fmt=testsh
        set -- $(awk '
          /^Test suite summary: pass: [0-9]+\/[0-9]+, skip: [0-9]+\/[0-9]+, fail: [0-9]+\// {
            split($5, a, "/"); p+=a[1]; split($7, a, "/"); s+=a[1]; split($9, a, "/"); f+=a[1] }
          END {print p+0, f+0, s+0}' "$log")
        pass=$1 fail=$2 skip=$3
      elif grep -qE '^Tests OK *: *[0-9]+ of [0-9]+' "$log"; then
        fmt=okfailed
        set -- $(awk '
          /^Tests OK *: *[0-9]+ of [0-9]+/ {
            l=$0; sub(/^Tests OK *: */, "", l); split(l, a, " "); p+=a[1]; t+=a[3] }
          /^Tests FAILED *: *[0-9]+ of [0-9]+/ {
            l=$0; sub(/^Tests FAILED *: */, "", l); split(l, a, " "); f+=a[1] }
          END {s=t-p-f; if (s < 0) s=0; print p+0, f+0, s}' "$log")
        pass=$1 fail=$2 skip=$3
      elif grep -qE '^Total [0-9]+ tests, (no errors|[0-9]+ errors?)' "$log"; then
        # libxml2/libxslt runtest (from check-local): "Total N tests, no
        # errors" or "Total N tests, E errors, L leaks", once per runner.
        fmt=total
        set -- $(awk '
          /^Total [0-9]+ tests, (no errors|[0-9]+ errors?)/ {
            t+=$2; if ($4 != "no") f+=$4 }
          END {print t-f, f+0}' "$log")
        pass=$1 fail=$2
      elif grep -qE '^[[:space:]]+succeeded: [0-9]+$' "$log" && grep -q '^Summary:$' "$log"; then
        # stunnel's tests/maketest.py: "Summary:" then indented
        # "succeeded: N", "failed: N" and "skipped: N" lines.
        set -- $(awk '
          /^Summary:$/ {b=1; next}
          b && /^[[:space:]]+succeeded: [0-9]+$/ {p+=$2; n++; next}
          b && /^[[:space:]]+failed: [0-9]+$/ {f+=$2; next}
          b && /^[[:space:]]+skipped: [0-9]+$/ {s+=$2; next}
          {b=0}
          END {print n+0, p+0, f+0, s+0}' "$log")
        if [ "$1" -gt 0 ]; then
          fmt=summary
          pass=$2 fail=$3 skip=$4
        fi
      fi
      # GNU Autotest (a "testsuite" script, usually run from check-local),
      # alone or next to automake's TESTS. After its "## Test results. ##"
      # box it prints one of:
      #   [All ]N tests were successful.  /  [All ]N tests behaved as expected.
      #   ERROR: [All ]N tests were run,
      #   M failed unexpectedly.  /  M failed (X expected failures).  /
      #   M passed unexpectedly[,]  /  M did not behave as expected (...).
      # then "S tests were skipped." N excludes skipped tests; M in
      # "M failed (X expected ...)" includes the expected failures.
      set -- $(awk '
        function fin() {
          if (st == 2) {
            if (bae && xl > 0) xf = (xl < n ? xl : n)
            p += n - u - xf; f += u; x += xf; seen++ }
          st = 0; n = 0; u = 0; xf = 0; bae = 0 }
        /^ *[0-9]+: .*[[:space:]]expected failure( \(.*\))?$/ { xl++ }
        /^## Test results\. ##$/ { fin(); st = 1; next }
        st == 1 && (/^## -+ ##$/ || /^$/) { next }
        st == 1 {
          l = $0; sub(/^ERROR: /, "", l); sub(/^All /, "", l)
          if (l !~ /^[0-9]+ tests? (was|were) (successful\.|run,)/ && l !~ /^[0-9]+ tests? behaved as expected\.$/) {
            st = 0; next }
          n = l + 0; st = 2
          if (l ~ /behaved as expected/) bae = 1
          if (l ~ / run, one (failed|passed) unexpectedly/) u = 1
          next }
        st == 2 && /^[0-9]+ failed \([0-9]+ expected failures?\)/ {
          y = $3; sub(/^\(/, "", y); xf += y; u += $1 - y; next }
        st == 2 && /^[0-9]+ (failed|passed) unexpectedly/ { u += $1; next }
        st == 2 && /^[0-9]+ did not behave as expected/ { u += $1; next }
        st == 2 && /^[0-9]+ tests? (was|were) skipped\.$/ { s += $1; next }
        st == 2 { fin() }
        END { fin(); print seen + 0, p + 0, f + 0, s + 0, x + 0 }' "$log")
      atseen=$1 atpass=$2 atfail=$3 atskip=$4 atxfail=$5
      if [ "$atseen" -gt 0 ]; then
        if [ "$fmt" = custom ]; then
          fmt=autotest
          pass=$atpass fail=$atfail skip=$atskip xfail=$atxfail
        else
          # Added to the other format's counts (e.g. automake TESTS plus
          # an autotest suite, or dpkg's perl t/ plus its autotest suite).
          pass=$((pass + atpass)) fail=$((fail + atfail)) xfail=$((xfail + atxfail))
          if [ "$skip" != unknown ]; then
            skip=$((skip + atskip))
          fi
          if [ "$total" != unknown ]; then
            total=$((total + atpass + atfail + atskip + atxfail))
          fi
        fi
      fi
      # Autotest names a failing test on its own line:
      #   " 270: Null nonterminals          FAILED (counterexample.at:621)"
      atnames=""
      if [ "$atseen" -gt 0 ] && [ "$atfail" -gt 0 ]; then
        atnames=$(awk '/^ *[0-9]+: .*[[:space:]](FAILED \(.*\)|UNEXPECTED PASS)$/ {
            l = $0; sub(/^ */, "", l); sub(/[[:space:]]+(FAILED \(.*\)|UNEXPECTED PASS)$/, "", l)
            gsub(/[[:space:]]+/, " ", l); print l }' "$log" | sort -un)
      fi

      ignored=0
      nfail=0
      if [ "$fmt" = automake ]; then
        # Failures that do not come from test results (compile errors in
        # test programs, missing files, ...) are never ignorable.
        bad=""
        if [ "$atfail" -eq 0 ]; then
          # (A failing autotest suite fails its own make rule, e.g.
          # check-local, so this is only meaningful when it passed.)
          bad=$(grep -oE '\*\*\* \[[^]]*\] Error [0-9]+' "$log" \
          | sed -E 's/^\*\*\* \[(.*: )?([^]]*)\] Error [0-9]+$/\2/' \
            | grep -vxE 'test-suite\.log|check-TESTS|check-am|check-recursive|check|.*-recursive|.*-am' || true)
        fi
        for t in $targets; do
          bad=$(echo "$bad" | grep -vxF "$t" || true)
        done
        if [ -n "$bad" ]; then
          gate=1; why="$why make failed outside the test harness ($(echo $bad));"
        fi
        # "ERROR: N tests were run," is autotest's summary, not a test.
        for name in $(grep -E '^(FAIL|XPASS|ERROR): ' "$log" | grep -vE '^ERROR: (All )?[0-9]+ tests? (was|were) run' | awk '{print $2}' | sort -u || true); do
          case "$ignore" in
            *" $name "*|*" ${name##*/} "*)
              echo "IGNORE ${PKG}: $name"
              ignored=$((ignored + $(awk -v n="$name" '($1 == "FAIL:" || $1 == "XPASS:" || $1 == "ERROR:") && $2 == n' "$log" | wc -l)))
              ;;
            *)
              echo "UPSTREAM-TESTS-FAIL ${PKG}: $name"
              nfail=$((nfail + 1))
              ;;
          esac
        done
        if [ "$atfail" -gt 0 ]; then
          # Autotest failures are not ignorable.
          if [ -n "$atnames" ]; then
            printf '%s\n' "$atnames" | awk -v p="$PKG" '{print "UPSTREAM-TESTS-FAIL " p ": " $0}'
            nfail=$((nfail + $(printf '%s\n' "$atnames" | wc -l)))
          else
            echo "UPSTREAM-TESTS-FAIL ${PKG}: $atfail autotest test(s) failed (the summary names none)"
            nfail=$((nfail + 1))
          fi
        fi
        if [ "$nfail" -gt 0 ]; then
          gate=1; why="$why $nfail non-ignored failing test(s);"
        fi
        if [ "$((fail - atfail))" -gt 0 ] && [ "$nfail" -eq 0 ] && [ "$ignored" -eq 0 ]; then
          gate=1; why="$why summary reports $fail failure(s) but no FAIL/XPASS/ERROR lines found;"
        fi
        if [ "$rc" -ne 0 ] && [ "$fail" -eq 0 ]; then
          gate=1; why="$why make exited $rc with no test failures;"
        fi
        if [ $((pass + xfail)) -eq 0 ]; then
          gate=1; why="$why no tests passed (total=$total);"
        fi
        for f in $(find . -name test-suite.log | sort); do
          if grep -qE '^(FAIL|XPASS|ERROR): ' "$f"; then
            echo "===== $f ====="
            cat "$f"
          fi
        done
      else
        if [ "$ignore" != "  " ]; then
          echo "WARNING: ignore is only honoured for automake harnesses; '$(echo $ignore)' has no effect here"
        fi
        if [ "$fmt" = custom ]; then
          # No counts. An automake tree whose subdirectories define no TESTS
          # recurses ("Making check in ...") without running anything.
          if [ "$harness" = auto ] && grep -q '^Making check in ' "$log" && \
             ! grep -qE '^(PASS|FAIL|XFAIL|XPASS|SKIP|ERROR): |check-TESTS' "$log"; then
            gate=1; why="$why automake 'make check' recursed but ran no tests (suites run from check-local or a custom rule need harness: custom);"
          fi
          # Hand-written check rules that exit 0 without testing anything.
          # Skipped with harness: custom, where the caller has checked that
          # the suite runs (a leaf directory may still say "No tests
          # defined"). Per-test skip wording ("... not available") is
          # deliberately not matched.
          msg=""
          if [ "$harness" = auto ]; then
            msg=$(grep -iE 'check target not available|no tests? (to run|available|found|defined)|no test ?suite|test ?suite (is )?not available|nothing to test' "$log" | head -n 1 || true)
          fi
          if [ -n "$msg" ]; then
            gate=1; why="$why suite reports no tests ($msg);"
          fi
          # Anything else that exits 0 without a summary this step can read
          # (PGXS "make check is not supported", an empty check rule, a
          # non-recursive automake tree with no TESTS, ...) has not shown
          # that any test ran.
          if [ "$harness" = auto ] && [ "$gate" -eq 0 ] && [ "$rc" -eq 0 ]; then
            gate=1; why="$why no recognised test summary; set harness: custom if this suite reports only via exit status;"
          fi
        else
          if [ "$fail" -gt 0 ]; then
            gate=1; why="$why summary reports $fail failure(s);"
            names=""
            if [ "$fmt" = e2fsprogs ]; then
              names=$(grep -E '^Tests failed: ' "$log" | sed 's/^Tests failed: //' || true)
            elif [ "$fmt" = tap ]; then
              names=$(grep -E '^[^ ]+ +\(Wstat: ' "$log" | awk '{print $1}' | sort -u || true)
            fi
            for name in $names; do
              echo "UPSTREAM-TESTS-FAIL ${PKG}: $name"
              nfail=$((nfail + 1))
            done
            if [ -n "$atnames" ]; then
              printf '%s\n' "$atnames" | awk -v p="$PKG" '{print "UPSTREAM-TESTS-FAIL " p ": " $0}'
              nfail=$((nfail + $(printf '%s\n' "$atnames" | wc -l)))
            fi
            if [ "$nfail" -eq 0 ]; then
              echo "UPSTREAM-TESTS-FAIL ${PKG}: $fail test(s) failed (the summary names none)"
              nfail=1
            fi
          fi
          if [ "$pass" -eq 0 ]; then
            gate=1; why="$why no tests passed;"
          fi
        fi
        if [ "$rc" -ne 0 ]; then
          gate=1; why="$why make $targets exited $rc;"
          if [ "$nfail" -eq 0 ]; then
            echo "UPSTREAM-TESTS-FAIL ${PKG}: make $targets (exit $rc)"
          fi
        fi
      fi

      # Autotest writes each failing test's full log to testsuite.log.
      if [ "$atfail" -gt 0 ]; then
        for f in $(find . -name testsuite.log | sort); do
          if grep -qE '^ERROR: (All )?[0-9]+ tests? (was|were) run' "$f"; then
            echo "===== $f ====="
            awk -v f="$f" 'NR <= 5000 { print } END { if (NR > 5000) print "===== " f ": " NR - 5000 " more lines not shown =====" }' "$f"
          fi
        done
      fi

      echo "UPSTREAM-TESTS ${PKG}: duration=${duration}s"
      extra=""
      [ "$xfail" -gt 0 ] && extra="$extra xfail=$xfail"
      [ "$ignored" -gt 0 ] && extra="$extra ignored=$ignored"
      echo "UPSTREAM-TESTS ${PKG}: pass=$pass fail=$fail skip=$skip$extra"
      rm -f "$log"
      if [ "$gate" -ne 0 ]; then
        echo "UPSTREAM-TESTS ${PKG}: FAILED:$why"
        exit 1
      fi
