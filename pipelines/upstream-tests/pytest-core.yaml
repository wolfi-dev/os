name: Python upstream test suite (pytest), shared core

description: |
  INTERNAL: do not call this from a package; use upstream-tests/pytest.
  Passes the wrapper's inputs to tw-upstream-pytest (the tw-upstream-pytest
  subpackage of os/tw.yaml), which holds the implementation: the pytest
  plugin (result recording, network guard, import pinning, test-module
  finders, stand-ins for absent plugins' options, ini keys and markers),
  the network namespace, named exceptions, timeouts, runner: unittest, the
  destdir snapshot, the import-origin check, the hard-gate rules (including
  min-run-percent) and the UPSTREAM-TESTS summary lines. Kept separate from
  the wrapper so that the test stage (test/upstream-tests/pytest, a
  follow-up) can share it. The wrapper passes stage, caller and destdir;
  the other inputs are documented there. Each input maps to the
  tw-upstream-pytest option of the same name (`tw-upstream-pytest --help`).

needs:
  packages:
    # contract 3: no --network option, --ignore by node-id boundary,
    # runner: unittest and timeout checks, retry plugins disabled.
    - tw-upstream-pytest>=0.0.56

inputs:
  stage:
    description: build (only stage so far).
    required: true
  caller:
    description: Calling pipeline, the prefix of messages.
    required: true
  destdir:
    description: Install root under test (build stage, targets.contextdir).
    required: true
  python:
    description: See upstream-tests/pytest.
    default: DEFAULT
  dir:
    description: See upstream-tests/pytest.
    default: "."
  paths:
    description: See upstream-tests/pytest.
    default: ""
  args:
    description: See upstream-tests/pytest.
    default: ""
  markers:
    description: See upstream-tests/pytest.
    default: ""
  ignore:
    description: See upstream-tests/pytest.
    default: ""
  ignore-files:
    description: See upstream-tests/pytest.
    default: ""
  import-mode:
    description: See upstream-tests/pytest.
    default: auto
  clear-addopts:
    description: See upstream-tests/pytest.
    default: "false"
  jobs:
    description: See upstream-tests/pytest.
    default: "1"
  timeout:
    description: See upstream-tests/pytest.
    default: "600"
  overall-timeout:
    description: See upstream-tests/pytest.
    default: "3600"
  runner:
    description: See upstream-tests/pytest.
    default: pytest
  extensions:
    description: See upstream-tests/pytest.
    default: auto
  min-run-percent:
    description: See upstream-tests/pytest.
    default: "5"

pipeline:
  - name: upstream-tests (pytest)
    runs: |
      # Free-form inputs go through quoted heredocs, so quotes, $ and
      # backquotes in them reach tw-upstream-pytest as written; it parses
      # args once, as the shell did when the inline step pasted them in.
      dir=$(cat <<'UT_EOF'
      ${{inputs.dir}}
      UT_EOF
      )
      paths=$(cat <<'UT_EOF'
      ${{inputs.paths}}
      UT_EOF
      )
      args=$(cat <<'UT_EOF'
      ${{inputs.args}}
      UT_EOF
      )
      markers=$(cat <<'UT_EOF'
      ${{inputs.markers}}
      UT_EOF
      )
      ignore=$(cat <<'UT_EOF'
      ${{inputs.ignore}}
      UT_EOF
      )
      ignore_files=$(cat <<'UT_EOF'
      ${{inputs.ignore-files}}
      UT_EOF
      )
      exec tw-upstream-pytest \
        --name "${{context.name}}" \
        --origin "${{package.name}}" \
        --stage "${{inputs.stage}}" \
        --caller "${{inputs.caller}}" \
        --destdir "${{inputs.destdir}}" \
        --python "${{inputs.python}}" \
        --dir "$dir" \
        --paths "$paths" \
        --args "$args" \
        --markers "$markers" \
        --ignore "$ignore" \
        --ignore-files "$ignore_files" \
        --import-mode "${{inputs.import-mode}}" \
        --clear-addopts "${{inputs.clear-addopts}}" \
        --jobs "${{inputs.jobs}}" \
        --timeout "${{inputs.timeout}}" \
        --overall-timeout "${{inputs.overall-timeout}}" \
        --runner "${{inputs.runner}}" \
        --extensions "${{inputs.extensions}}" \
        --min-run-percent "${{inputs.min-run-percent}}"
