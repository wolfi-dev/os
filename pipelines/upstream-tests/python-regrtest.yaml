name: CPython upstream regrtest subset

description: |
  Runs a subset of CPython's upstream regression suite (`./python -m test`)
  against the freshly built in-tree interpreter. Defaults to the TLS, hashing
  and HTTP modules most affected by OpenSSL/FIPS changes. Use it right after
  `autoconf/make`, before `autoconf/make-install`; it assumes an
  --enable-shared build with libpython in the build directory.

  The suite is a hard gate: any failing test fails the build. Prints the
  full regrtest log, then summary lines:
    UPSTREAM-TESTS <package>: duration=<n>s
    UPSTREAM-TESTS <package>: pass=<n> fail=<n> skip=<n>

  Example:
    - uses: autoconf/make
    - uses: upstream-tests/python-regrtest

  Named exceptions go in ignore (regrtest -i globs, matched against test
  ids). Every exception needs a comment in the calling package explaining
  why and a `TODO(upstream-tests): ...` to remove it:
    # test_builtins_in_openssl_fips_mode assumes all builtin hashes.
    # TODO(upstream-tests): fix the test and drop the ignore.
    - uses: upstream-tests/python-regrtest
      with:
        ignore: '*.test_builtins_in_openssl_fips_mode'

inputs:
  tests:
    description: Space-separated regrtest module names to run.
    default: test_ssl test_hashlib test_hmac test_httplib test_urllib2_localnet
  ignore:
    description: |
      Space-separated regrtest -i globs to skip. Passed unexpanded. Each one
      needs a comment and TODO in the caller.
    default: ""
  timeout:
    description: Per-test timeout in seconds (regrtest --timeout).
    default: "900"

pipeline:
  - name: upstream-tests (regrtest)
    runs: |
      # Keep -i globs away from the shell so regrtest sees them verbatim.
      set -f
      ignore_args=""
      for pat in ${{inputs.ignore}}; do
        ignore_args="$ignore_args -i $pat"
      done
      log=$(mktemp)
      start=$(date +%s)
      rc=0
      # --enable-shared: point the in-tree ./python at the in-tree libpython
      LD_LIBRARY_PATH="$PWD${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
        ./python -m test -j0 --timeout=${{inputs.timeout}} \
          $ignore_args \
          ${{inputs.tests}} \
          > "$log" 2>&1 || rc=$?
      set +f
      cat "$log"
      echo "UPSTREAM-TESTS ${{package.name}}: duration=$(( $(date +%s)-start ))s"
      line=$(grep -E '^Total tests: run=' "$log" | tail -n1 | tr -d ',' || true)
      if [ -n "$line" ]; then
        run=$(echo "$line" | sed -n 's/.*run=\([0-9]*\).*/\1/p')
        fail=$(echo "$line" | sed -n 's/.*failures=\([0-9]*\).*/\1/p')
        skip=$(echo "$line" | sed -n 's/.*skipped=\([0-9]*\).*/\1/p')
        fail=${fail:-0}
        skip=${skip:-0}
        echo "UPSTREAM-TESTS ${{package.name}}: pass=$((run-fail-skip)) fail=$fail skip=$skip"
      else
        echo "UPSTREAM-TESTS ${{package.name}}: pass=unknown fail=unknown skip=unknown"
      fi
      rm -f "$log"
      exit $rc
