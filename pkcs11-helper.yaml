package:
  name: pkcs11-helper
  version: "1.31.0"
  epoch: 2
  description: PKCS#11 Helper library that simplifies the interaction with PKCS#11 providers for end-user applications
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - libtool
      - linux-headers
      - openssl-dev>3
      - p11-kit-dev
      - pkgconf-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/OpenSC/pkcs11-helper
      tag: pkcs11-helper-${{package.version}}
      expected-commit: 286b4415b95f298ab35d62508a37c2aefc055037

  - runs: aclocal && autoreconf -vfi -I/usr/share/aclocal

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: "pkcs11-helper-dev"
    description: "headers for pkcs11-helper"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - pkcs11-helper
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: pkcs11-helper-dev-doc
    description: pkcs11-helper-dev docs
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: OpenSC/pkcs11-helper
    strip-prefix: pkcs11-helper-

test:
  environment:
    contents:
      packages:
        - pkcs11-helper-dev
        - build-base
        - openssl-dev
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test pkcs11-helper library API
      runs: |
        cat > test_pkcs11h.c << 'EOF'
        #include <pkcs11-helper-1.0/pkcs11h-core.h>
        #include <stdio.h>

        int main(void) {
            CK_RV rv;
            rv = pkcs11h_initialize();
            if (rv != CKR_OK) {
                fprintf(stderr, "pkcs11h_initialize failed: %lu\n", rv);
                return 1;
            }
            printf("pkcs11h_initialize succeeded\n");
            pkcs11h_terminate();
            printf("pkcs11h_terminate succeeded\n");
            return 0;
        }
        EOF
        gcc $(pkg-config --cflags libpkcs11-helper-1) test_pkcs11h.c -o test_pkcs11h $(pkg-config --libs libpkcs11-helper-1)
        ./test_pkcs11h
