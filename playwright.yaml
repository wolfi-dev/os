package:
  name: playwright
  version: "1.64.0"
  epoch: 0 # go/wolfi-rsc/playwright
  description: "Framework for Web Testing and Automation. It allows testing Chromium, Firefox and WebKit with a single API"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - nodejs
  resources:
    cpu: "1"
    memory: 6Gi

environment:
  contents:
    packages:
      - busybox
      - npm

pipeline:
  - name: npm install
    runs: |
      npm install -g ${{package.name}}@v${{package.version}} -prefix ${{targets.destdir}}/usr

subpackages:
  - name: ${{package.name}}-fontconfig
    description: Fonts and a fontconfig configuration matching the mcr.microsoft.com/playwright image, selected with FONTCONFIG_FILE=/usr/share/playwright/fontconfig/fonts.conf
    dependencies:
      runtime:
        - fontconfig
        # The fonts upstream installs: Liberation (Arial/Times/Courier
        # metrics), FreeFont, emoji, Japanese, Chinese and Thai.
        - font-freefont
        - font-ipafont-gothic
        - font-liberation
        - font-noto-emoji
        - font-tlwg
        - font-wqy-zenhei
    pipeline:
      - runs: |
          # fonts.conf includes fontconfig's own rules in the same set and
          # order as Ubuntu noble's conf.d, plus the Debian font packages'
          # rules shipped beside it, and rejects fonts upstream does not
          # install.
          for f in *.conf; do
            install -Dm644 "${f}" "${{targets.contextdir}}/usr/share/playwright/fontconfig/${f}"
          done
    test:
      environment:
        contents:
          packages:
            - bash
      pipeline:
        - name: Fonts resolve as in the upstream image
          runs: |
            export FONTCONFIG_FILE=/usr/share/playwright/fontconfig/fonts.conf
            # Every included rule file must exist, or fontconfig skips it.
            grep -oE '<include>[^<]+' "${FONTCONFIG_FILE}" | cut -d'>' -f2 | while read -r f; do
              test -f "${f}"
            done
            match() { fc-match "$1" family | cut -d, -f1; }
            # Expected values are fc-match output in
            # mcr.microsoft.com/playwright:v1.63.0-noble.
            test "$(match sans-serif)" = "WenQuanYi Zen Hei"
            test "$(match serif)" = "WenQuanYi Zen Hei"
            test "$(match monospace)" = "WenQuanYi Zen Hei Mono"
            test "$(match sans-serif:lang=th)" = "Loma"
            test "$(match serif:lang=th)" = "FreeSerif"
            test "$(match emoji)" = "Noto Color Emoji"
            test "$(match Arial)" = "Liberation Sans"
            test "$(match 'Times New Roman')" = "Liberation Serif"
            test "$(match 'Courier New')" = "Liberation Mono"
            # Fonts upstream does not install are rejected.
            test "$(match 'Open Sans')" = "WenQuanYi Zen Hei"
            test "$(match Waree)" = "WenQuanYi Zen Hei"

update:
  enabled: true
  github:
    identifier: microsoft/playwright
    use-tag: true
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - nodejs-26
        - npm
        - firefox
  pipeline:
    - name: Verify Playwright installation
      runs: |
        # Check if Playwright is installed
        command -v playwright
        playwright --version
        playwright --help
    - name: Install Playwright via npm
      runs: |
        npm install playwright
    - name: Run Playwright example test with Firefox
      runs: |
        playwright install firefox

        # Create a simple Playwright test script using heredoc
        cat << 'EOF' > test.js
        const { firefox } = require('playwright');
        (async () => {
          const browser = await firefox.launch({
            headless: true,
          });
          const page = await browser.newPage();
          await page.goto('https://example.com');
          const title = await page.title();
          console.log(title);
          await browser.close();
        })();
        EOF

        # Run the test script
        node test.js | grep -F "Example Domain"
