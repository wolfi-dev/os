<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Font configuration matching mcr.microsoft.com/playwright (Ubuntu noble):
     the same conf.d rules, and only the fonts upstream installs. Selected
     with FONTCONFIG_FILE, so the distribution defaults stay untouched. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>~/.fontconfig</cachedir>
  <!-- Upstream installs only Loma from TLWG, and no Open Sans. -->
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Open Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>Garuda</string></patelt></pattern>
      <pattern><patelt name="family"><string>Kinnari</string></patelt></pattern>
      <pattern><patelt name="family"><string>Laksaman</string></patelt></pattern>
      <pattern><patelt name="family"><string>Norasi</string></patelt></pattern>
      <pattern><patelt name="family"><string>Purisa</string></patelt></pattern>
      <pattern><patelt name="family"><string>Sawasdee</string></patelt></pattern>
      <pattern><patelt name="family"><string>Tlwg Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>Tlwg Typewriter</string></patelt></pattern>
      <pattern><patelt name="family"><string>Tlwg Typist</string></patelt></pattern>
      <pattern><patelt name="family"><string>Tlwg Typo</string></patelt></pattern>
      <pattern><patelt name="family"><string>Umpush</string></patelt></pattern>
      <pattern><patelt name="family"><string>Waree</string></patelt></pattern>
    </rejectfont>
  </selectfont>
  <include>/usr/share/fontconfig/conf.avail/10-hinting-slight.conf</include>
  <include>/usr/share/fontconfig/conf.avail/10-scale-bitmap-fonts.conf</include>
  <include>/usr/share/fontconfig/conf.avail/10-sub-pixel-rgb.conf</include>
  <include>/usr/share/fontconfig/conf.avail/10-yes-antialias.conf</include>
  <include>/usr/share/fontconfig/conf.avail/11-lcdfilter-default.conf</include>
  <include>/usr/share/fontconfig/conf.avail/20-unhint-small-vera.conf</include>
  <include>/usr/share/playwright/fontconfig/25-wqy-zenhei.conf</include>
  <include>/usr/share/fontconfig/conf.avail/30-metric-aliases.conf</include>
  <include>/usr/share/fontconfig/conf.avail/40-nonlatin.conf</include>
  <include>/usr/share/fontconfig/conf.avail/45-generic.conf</include>
  <include>/usr/share/fontconfig/conf.avail/45-latin.conf</include>
  <include>/usr/share/fontconfig/conf.avail/48-spacing.conf</include>
  <include>/usr/share/fontconfig/conf.avail/49-sansserif.conf</include>
  <include>/usr/share/fontconfig/conf.avail/50-user.conf</include>
  <include>/usr/share/fontconfig/conf.avail/51-local.conf</include>
  <include>/usr/share/fontconfig/conf.avail/60-generic.conf</include>
  <include>/usr/share/fontconfig/conf.avail/60-latin.conf</include>
  <include>/usr/share/playwright/fontconfig/64-wqy-zenhei.conf</include>
  <include>/usr/share/playwright/fontconfig/65-ipafont-gothic.conf</include>
  <include>/usr/share/fontconfig/conf.avail/65-fonts-persian.conf</include>
  <include>/usr/share/fontconfig/conf.avail/65-nonlatin.conf</include>
  <include>/usr/share/fontconfig/conf.avail/69-unifont.conf</include>
  <include>/usr/share/fontconfig/conf.avail/70-no-bitmaps-except-emoji.conf</include>
  <include>/usr/share/fontconfig/conf.avail/80-delicious.conf</include>
  <include>/usr/share/fontconfig/conf.avail/90-synthetic.conf</include>
</fontconfig>
