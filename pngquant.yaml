package:
  name: pngquant
  version: 3.0.3
  epoch: 5
  description: Lossy PNG compressor — pngquant command based on libimagequant library
  copyright:
    - license: GPL-3.0-or-later
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  rust-version: "1.98"

environment:
  contents:
    packages:
      - glibc-2.44
      - glibc-2.44-dev
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      recurse-submodules: true
      repository: https://github.com/kornelski/pngquant
      tag: ${{package.version}}
      expected-commit: 53a332a58f44357b6b41842a54d74aa1e245913d

  # libimagequant quantises the same image to a different palette on x86_64
  # and aarch64: it reads its colour histogram back in HashMap iteration
  # order (when building the item list and when re-keying the map after
  # posterization) and hashbrown's probe-group width differs between the two
  # (16 bytes with SSE2, 8 with NEON), and its NEON colour-distance code adds
  # the channel terms in a different order from the x86_64 and scalar code.
  # Fix the order in all three places so the output does not depend on the
  # architecture; reported upstream as ImageOptim/libimagequant#130.
  - uses: patch
    with:
      patches: libimagequant-deterministic-histogram-order.patch

  - name: Configure and Build
    uses: cargo/build
    with:
      modroot: .
      output: pngquant

  - uses: strip

update:
  enabled: true
  github:
    identifier: kornelski/pngquant
    use-tag: true

test:
  environment:
    contents:
      packages:
        - py3.13-pillow
        - python-3.13
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: pngquant
    - uses: test/tw/help-check
      with:
        bins: pngquant
    - name: Compress a PNG image and verify output
      runs: |
        # A small RGBA image with a few hundred colours, written by Python so the
        # PNG is valid (the hand-typed 1x1 PNG this step used before had a bad
        # IDAT checksum, which current pngquant rejects).
        python3.13 - <<'EOF'
        import struct, zlib
        w = h = 32
        rows = b"".join(bytes([0]) + b"".join(bytes((x * 8, y * 8, (x * y) & 255, 255 if (x + y) % 7 else 128)) for x in range(w)) for y in range(h))
        def chunk(t, d):
            return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
        open("/tmp/input.png", "wb").write(b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(rows)) + chunk(b"IEND", b""))
        EOF
        pngquant --force --output /tmp/output.png /tmp/input.png
        stat /tmp/output.png
        python3.13 -c '
        from PIL import Image
        im = Image.open("/tmp/output.png"); im.load()
        assert im.mode == "P" and im.size == (32, 32), (im.mode, im.size)
        print("quantised to", len(im.getpalette()) // 3, "colours")
        '
    - name: Quantisation is a function of the input, not of the architecture
      runs: |
        # A 136x128 RGBA emoji bitmap (noto-emoji's U+1F9D4 U+1F3FE after the
        # Makefile's ImageMagick padding, losslessly recompressed). Without the
        # carried libimagequant patch, pngquant 3.0.3 quantised it to 35 colours
        # on x86_64 and 37 on aarch64 with different pixels; with the patch both
        # architectures produce this exact result. The PNG container bytes are
        # not stable across architectures, so compare the decoded pixels.
