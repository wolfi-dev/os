package:
  name: pnpm-12
  version: "12.14.0"
  epoch: 2 # CVE-2026-111943
  description: "Fast, disk space efficient package manager"
  copyright:
    - license: MIT
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - esbuild
      - nodejs-26
      - npm
      - rust-${{vars.rust-version}}

vars:
  rust-version: 1.99

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pnpm/pnpm
      tag: v${{package.version}}
      expected-commit: fe4a0c232384289de82be3d502896ca7e070050c

  - name: Disable pnpm management of Rust dependencies
    runs: |
      # pnpm vendors crates through its own cargo source (https://pnpm.io/cargo),
      # which keeps the bump step below from changing Cargo.lock.
      grep -q '# >>> pnpm-managed cargo sources >>>' .cargo/config.toml
      sed -i '/# >>> pnpm-managed cargo sources >>>/,/# <<< pnpm-managed cargo sources <<</d' .cargo/config.toml
      ! grep -q 'pnpm-managed cargo sources' .cargo/config.toml

  - uses: bump
    with:
      language: rust
      deps: |-
        quinn-proto@0.11.18
        xxhash-rust@0.8.16
        aws-lc-rs@1.18.2
        webpki-root-certs@1.0.11

  # pnpm >= 12.10 embeds pnpm/crates/deps-restorer/src/cas-loader.mjs.inc with
  # include_str!. It is not in git: upstream generates it in @pnpm/esm-loader's
  # `prepare` script (scripts/bundle-runtime.mjs). Run the same esbuild bundle here.
  # enhanced-resolve is the loader's only third-party import; it is installed in a
  # separate prefix because esm-loader's package.json uses pnpm `catalog:` specs.
  - name: Generate the deps-restorer ESM loader
    working-directory: pnpm/esm-loader
    runs: |
      npm install --prefix /home/build/esm-loader-deps --no-save --no-package-lock enhanced-resolve@5.26.0
      ln -s /home/build/esm-loader-deps/node_modules node_modules
      esbuild install-register.mjs --bundle --minify --platform=node --format=esm \
        --banner:js="import { createRequire as bootstrapRequire } from 'node:module'; const require = bootstrapRequire(import.meta.url);" \
        --outfile=../crates/deps-restorer/src/cas-loader.mjs.inc
      rm node_modules
      test -s ../crates/deps-restorer/src/cas-loader.mjs.inc

  - name: Build
    uses: cargo/build
    with:
      opts: --locked -p pnpm-cli --release
      output: pnpm

update:
  enabled: true
  ignore-regex-patterns:
    - '-rc'
    - '-beta'
  github:
    identifier: pnpm/pnpm
    strip-prefix: v
    tag-filter: v12.

test:
  pipeline:
    - runs: |
        pnpm --version | grep "${{package.version}}"
