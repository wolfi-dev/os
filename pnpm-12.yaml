package:
  name: pnpm-12
  version: "12.3.3"
  epoch: 0 # go/wolfi-rsc/pnpm-11.8
  description: "Fast, disk space efficient package manager"
  copyright:
    - license: MIT
  dependencies:
    provides:
      - pnpm=${{package.full-version}}
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - rust-${{vars.rust-version}}

vars:
  rust-version: 1.98

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pnpm/pnpm
      tag: v${{package.version}}
      expected-commit: 95bb27e1380bd91691e5402aa74e8f80f15e9cfd

  - name: Build
    uses: cargo/build
    with:
      opts: --locked -p pnpm-cli --release
      output: pnpm

update:
  enabled: true
  ignore-regex-patterns:
    - '-rc'
    - '-beta'
  github:
    identifier: pnpm/pnpm
    strip-prefix: v
    tag-filter: v12.

test:
  pipeline:
    - uses: test/tw/virtualpackage
      with:
        virtual-pkg-name: pnpm
    - runs: |
        pnpm --version | grep "${{package.version}}"
