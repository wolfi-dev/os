package:
  name: pnpm-12
  version: "12.3.3"
  epoch: 4 # GHSA-2mjx-qc3c-rqvc
  description: "Fast, disk space efficient package manager"
  copyright:
    - license: MIT
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - rust-${{vars.rust-version}}

vars:
  rust-version: 1.99

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pnpm/pnpm
      tag: v${{package.version}}
      expected-commit: 95bb27e1380bd91691e5402aa74e8f80f15e9cfd

  - uses: bump
    with:
      language: rust
      deps: |-
        quinn-proto@0.11.15
        xxhash-rust@0.8.16
        rustls@0.23.45

  - name: Build
    uses: cargo/build
    with:
      opts: --locked -p pnpm-cli --release
      output: pnpm

update:
  enabled: true
  ignore-regex-patterns:
    - '-rc'
    - '-beta'
  github:
    identifier: pnpm/pnpm
    strip-prefix: v
    tag-filter: v12.

test:
  pipeline:
    - runs: |
        pnpm --version | grep "${{package.version}}"
