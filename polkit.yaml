package:
  name: polkit
  version: "128"
  epoch: 0 # glibc: 2.43->2.44
  description: "A toolkit for defining and handling authorizations."
  copyright:
    - license: LGPL-2.0-or-later
  checks:
    disabled:
      - setuidgid
  dependencies:
    runtime:
      - dbus
      - linux-pam
      - systemd
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - dbus-dev
      - duktape
      - expat-dev
      - gettext-dev
      - glib-dev
      - glib-gir
      - glibc-2.44-dev
      - gobject-introspection-dev
      - linux-pam-dev
      - meson
      - perl
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e6373dc19975d8583568c6cd7025d03e682ca956
      repository: https://github.com/polkit-org/polkit.git
      tag: ${{package.version}}

  # LTO off: meson's b_lto was tried on 2026-10-29 for P-OS-1927 (OS-5339). The
  # package grew (installed +1.6% on x86_64, +0.2% on aarch64) and an A/B on an
  # idle build node showed no speed-up to pay for it: 20k authorization checks
  # plus 2k action enumerations against polkitd, pinned core, ten alternated
  # rounds, client CPU +1.4%, polkitd CPU +0.9%, enumeration -1.6%, all within
  # the +-2% noise band.
  - uses: meson/configure
    with:
      opts: |
        -Dman=true \
        -Dpam_prefix=/etc/pam.d \
        -Dpam_module_dir=/usr/lib/security

  - uses: meson/compile

  - uses: meson/install

subpackages:
  - name: polkit-doc
    pipeline:
      - uses: split/manpages
    dependencies:
      runtime:
        - polkit
    description: polkit manpages
    test:
      pipeline:
        - uses: test/tw/docs

  - name: polkit-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - polkit
    description: polkit dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/tw/ldd-check
        - uses: test/pkgconf

  - name: polkit-lang
    pipeline:
      - uses: split/locales
    dependencies:
      runtime:
        - polkit
    description: polkit locales
    test:
      pipeline:
        - uses: test/tw/langpackage

update:
  enabled: true
  github:
    identifier: polkit-org/polkit

test:
  pipeline:
    - runs: |
        pkexec --version | grep -F "${{package.version}}"
        pkexec --help
        pkcheck --version | grep -F "${{package.version}}"
        pkcheck --help
        pkaction --version | grep -F "${{package.version}}"
        pkaction --help
        pkttyagent --version | grep -F "${{package.version}}"
        pkttyagent --help
    - uses: test/tw/ldd-check
