package:
  name: powertop
  version: "2.16.1"
  epoch: 1
  description: "Power consumption monitor"
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libnl3-dev
      - libtracefs-dev
      - linux-headers
      - meson
      - ncurses-dev
      - pciutils
      - pciutils-dev
      - pkgconf
      - pkgconf-dev
      - wolfi-base
      - xz
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fenrus75/powertop
      tag: v${{package.version}}
      expected-commit: 11db5648c9fdea97d36ce6a11ef282e4e037aa92

  - uses: patch
    with:
      patches: fix-kworker-false-positive.patch

  # Upstream moved from autotools to meson in 2.16.1
  - uses: meson/configure
    with:
      opts: |
        -Db_lto=true \
        -Dnls=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: powertop-doc
    pipeline:
      - uses: split/manpages
    description: powertop manpages
    test:
      pipeline:
        - uses: test/tw/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

  - name: "powertop-bash-completion"
    description: "bash completion for powertop"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share/bash-completion/completions
          mv ${{targets.destdir}}/usr/share/bash-completion/completions/powertop ${{targets.subpkgdir}}/usr/share/bash-completion/completions
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    test:
      pipeline:
        - uses: test/tw/shell-syntax-check

update:
  enabled: true
  github:
    identifier: fenrus75/powertop
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        powertop --version
        powertop --help
