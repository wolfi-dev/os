package:
  name: protoc-gen-connect-go
  version: "2.0.0"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.1
  description: Protobuf plugin for generating Connect-Go code
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/connectrpc/connect-go
      tag: v${{package.version}}
      expected-commit: 76874c435fc1b37ab8155feb558f43da2b628271

  - uses: go/build
    with:
      packages: ./cmd/protoc-gen-connect-go
      modroot: .
      output: protoc-gen-connect-go

  - uses: strip

update:
  enabled: true
  github:
    identifier: connectrpc/connect-go
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - protobuf
        - protoc
        - protoc-gen-go
  pipeline:
    - name: Verify installation
      runs: |
        which protoc-gen-connect-go
        protoc-gen-connect-go --version
