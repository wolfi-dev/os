package:
  name: psmisc
  version: "23.7"
  epoch: 6 # add ldd-check and functional tests
  description: set of some small useful utilities that use the proc filesystem
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - gettext-dev
      - libselinux-dev
      - linux-headers
      - ncurses-dev
      - xz

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/psmisc/psmisc
      tag: v${{package.version}}
      expected-commit: 9091d6dbcce3d8fb87adf9249a2eb346d25a562c

  - runs: ./autogen.sh

  - uses: autoconf/configure
    with:
      opts: |
        --enable-selinux

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: psmisc manpages
    test:
      pipeline:
        - uses: test/docs

  - name: ${{package.name}}-lang
    pipeline:
      - uses: split/locales
    description: psmisc locales
    test:
      pipeline:
        - uses: test/tw/langpackage

update:
  enabled: true
  release-monitor:
    identifier: 3721

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: functional tests
      runs: |
        # pstree: show process tree and verify output contains a process name
        pstree | grep -E '\w+'

        # pstree with PID 1 - show tree rooted at init/PID 1
        pstree 1 | grep -E '\w+'

        # pstree -p: show PIDs in output
        pstree -p | grep -E '\([0-9]+\)'

        # fuser: identify which process is using a file
        fuser /bin/sh 2>&1 | grep -E '[0-9]+'

        # prtstat: print statistics for a running process (PID 1)
        prtstat 1 | grep -E 'State|Pid|comm'

        # pslog: show open files/logs for a process (PID 1)
        pslog 1 | grep -E '.'
