package:
  name: pulumi-language-dotnet
  version: "3.111.0"
  epoch: 0 # GHSA-hc8v-wwc9-vgxm
  description: Pulumi Language SDK for Dotnet
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26

pipeline:
  - uses: git-checkout
    with:
      expected-commit: bb925b6d3d2e55465461d9d5716ab0cabc1463d4
      repository: https://github.com/pulumi/pulumi-dotnet.git
      tag: v${{package.version}}

  - uses: bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.43.0
        github.com/go-git/go-git/v5@v5.19.1
        google.golang.org/grpc@v1.82.1
        golang.org/x/text@v0.39.0
        github.com/go-git/go-git/v6@v6.0.0-alpha.5
      modroot: |-
        integration_tests
        pulumi-language-dotnet
        sdk/Pulumi.Automation.Tests/Data/testproj

  - uses: go/build
    with:
      ldflags: -X github.com/pulumi/pulumi-language-dotnet/pkg/version.Version=v${{package.version}}
      modroot: pulumi-language-dotnet
      output: pulumi-language-dotnet
      packages: .
      go-package: go-1.26

  - uses: strip

update:
  enabled: true
  github:
    identifier: pulumi/pulumi-dotnet
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: pulumi-language-dotnet
    - uses: test/daemon-check-output
      with:
        start: pulumi-language-dotnet
        # The language plugin prints its gRPC listening port to stdout on startup,
        # which is how the Pulumi engine discovers the plugin server.
        expected_output: "."
        timeout: 10
        error_strings: ""
