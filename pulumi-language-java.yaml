package:
  name: pulumi-language-java
  version: "1.37.8"
  epoch: 1 # CVE-2026-116587
  description: Pulumi Language SDK for Java
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

capabilities:
  add:
    - CAP_SYS_ADMIN

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 77c663b7ae8e5dab444c1e4f5b150dd68d44b81a
      repository: https://github.com/pulumi/pulumi-java.git
      tag: v${{package.version}}

  - uses: bump
    with:
      language: go
      deps: |-
        golang.org/x/net@v0.60.0
        github.com/go-jose/go-jose/v4@v4.1.6

  - uses: go/build
    with:
      go-package: go-1.27
      ldflags: -X github.com/pulumi/pulumi-java/pkg/version.Version=v${{package.version}}
      modroot: .
      output: pulumi-language-java
      packages: ./pkg/cmd/pulumi-language-java

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v
  ignore-regex-patterns:
    - ^sdk/.*
    - ^pkg/.*
    - ^kubernetes/.*
    - ^aws-native/.*
    - ^aws/.*
    - ^gcp/.*
    - ^azuread/.*
    - ^azure-native/.*
    - ^docker/.*
    - ^oci/.*
    - ^google-native/.*
    - ^eks/.*
    - ^random/.*
    - ^aws-apigateway/.*

test:
  pipeline:
    - uses: xcover/profile
      with:
        executable-path: /usr/bin/pulumi-language-java
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: pulumi-language-java
    - uses: test/daemon-check-output
      with:
        start: /usr/bin/pulumi-language-java
        # The language plugin prints its gRPC listening port to stdout on startup,
        # which is how the Pulumi engine discovers the plugin server.
        expected_output: "."
        timeout: 10
        error_strings: ""
    - uses: xcover/stop
    - uses: xcover/ensure
      with:
        min-coverage: 1
