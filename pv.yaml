package:
  name: pv
  version: "1.11.0"
  epoch: 3 # assert on pv stderr progress output in tests
  description: "Terminal-based tool for monitoring data progress through a pipeline"
  copyright:
    - license: GPL-3.0-or-later
  resources:
    cpu: "2"
    memory: 5Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - ca-certificates-bundle
      - gettext-dev
      - glibc-2.43-dev
      - libtool
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://codeberg.org/ivarch/pv
      tag: v${{package.version}}
      expected-commit: 1fbd9b56a34a50782c317cca91661dcd137453b7

  - uses: autoconf/configure

  - uses: autoconf/make

  - runs: |
      install -Dm755 pv "${{targets.destdir}}"/usr/bin/pv

  - uses: strip

update:
  enabled: true
  git:
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        pv --version
        pv --help
    - name: Test basic functionality
      runs: |
        # pv writes progress info to stderr; use -f to force output even without a tty
        echo "testing pv functionality" | pv -f -s 25 > /dev/null 2>pv_out.txt
        grep -E '[0-9]' pv_out.txt

        # Test with known size: verify numeric percentage appears in progress output
        dd if=/dev/zero bs=1024 count=10 2>/dev/null | pv -f -s 10240 -n > /dev/null 2>pv_out2.txt
        grep -E '[0-9]' pv_out2.txt

        # Test --numeric flag outputs only percentage to stderr
        echo "hello" | pv -f -n > /dev/null 2>pv_numeric.txt
        grep -E '^[0-9]+$' pv_numeric.txt
