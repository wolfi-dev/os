package:
  name: py3-aiodns
  version: 4.0.4
  epoch: 0
  description: Happy Eyeballs for pre-resolved hosts
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "5"
    memory: 7Gi

vars:
  pypi-package: aiodns

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-pip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aio-libs/aiodns
      tag: v${{package.version}}
      expected-commit: 5ffa1118fc202d3f5bf887b1ded33fbceb9d1ea8

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-pycares
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import aiodns

update:
  enabled: true
  github:
    identifier: aio-libs/aiodns
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true
