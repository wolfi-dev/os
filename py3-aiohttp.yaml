# Generated from https://pypi.org/project/aiohttp/
package:
  name: py3-aiohttp
  version: "3.14.3"
  epoch: 1 # multidict<7 runtime cap
  description: Async http client/server framework (asyncio)
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: aiohttp

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - cython
      - glibc-2.43-dev
      - glibc-2.44
      - llhttp-dev
      - py3-supported-build-base-dev
      # Cython 3.3 crashes compiling aiohttp/_websocket/reader_c.py (upstream
      # pins cython==3.2.5 in requirements/cython.txt); stay on 3.2.x.
      - py3-supported-cython<3.3
      - py3-supported-multidict
      - py3.10-cython<3.3
      - py3.11-cython<3.3
      - py3.12-cython<3.3
      - py3.13-cython<3.3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aio-libs/aiohttp/
      tag: v${{package.version}}
      expected-commit: 5e392ce0456f5235a4ee6ad46f0e806df2f15873

  - uses: patch
    with:
      patches: unbundle-llhttp.patch

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-aiohappyeyeballs
        - py${{range.key}}-aiosignal
        - py${{range.key}}-attrs
        - py${{range.key}}-async-timeout
        - py${{range.key}}-frozenlist
        # aiohttp declares multidict<7.0 (setup.cfg / requirements); keep the
        # runtime dep in that range so pip check and installs stay consistent.
        - py${{range.key}}-multidict<7
        - py${{range.key}}-propcache
        - py${{range.key}}-yarl
    pipeline:
      - name: Python Setup
        runs: |
          mkdir -p .git
          python${{range.key}} tools/gen.py
          python${{range.key}} -m cython -3 aiohttp/*.pyx -I aiohttp
          python${{range.key}} -m cython -3 aiohttp/_websocket/*.py* -I aiohttp
          rm -rf .git
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: aio-libs/aiohttp
    strip-prefix: v
  ignore-regex-patterns:
    - a\d$
