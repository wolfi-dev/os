# Generated from https://pypi.org/project/attrs/
package:
  name: py3-attrs
  version: "26.1.0"
  epoch: 1 # upstream-tests/pytest
  description: Classes Without Boilerplate
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 7Gi

vars:
  pypi-package: attrs

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-build
      - py3-supported-hatch-fancy-pypi-readme
      - py3-supported-hatch-vcs
      - py3-supported-hatchling
      - py3-supported-pip
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-cloudpickle # upstream-tests: test dependency
      - py3.10-importlib-metadata # upstream-tests: runtime dependency
      - py3.11-cloudpickle # upstream-tests: test dependency
      - py3.11-hypothesis # upstream-tests: test dependency
      - py3.11-importlib-metadata # upstream-tests: runtime dependency
      - py3.12-cloudpickle # upstream-tests: test dependency
      - py3.12-hypothesis # upstream-tests: test dependency
      - py3.12-importlib-metadata # upstream-tests: runtime dependency
      - py3.13-cloudpickle # upstream-tests: test dependency
      - py3.13-hypothesis # upstream-tests: test dependency
      - py3.13-importlib-metadata # upstream-tests: runtime dependency
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-attrs/attrs.git
      tag: ${{package.version}}
      expected-commit: 7bfc49e9b22d5ba25b6e429524c3d49fee27cb36

  - name: Fetch History (required by pip install)
    runs: |
      git fetch --unshallow

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-importlib-metadata
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      # hypothesis 6.170 requires Python >= 3.11 (no py3.10-hypothesis by design).
      - if: "'${{range.key}}' != '3.10'"
        uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: attrs

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  ignore-regex-patterns:
    - ^.*?post\d
  github:
    identifier: python-attrs/attrs

test:
  pipeline:
    - uses: test/tw/byproductpackage
