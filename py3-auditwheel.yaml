package:
  name: py3-auditwheel
  version: "6.8.2"
  epoch: 1
  description: auditing and relabeling of PEP 600 Linux wheels
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "3"
    memory: 11Gi
  test-resources:
    cpu: "1"
    memory: 12Gi

vars:
  pypi-package: auditwheel
  import: auditwheel

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-python
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/auditwheel
      tag: ${{package.version}}
      expected-commit: 26d25b5fa7fff2fe976a7c7c00423dcdc1334349

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - patchelf
        - py${{range.key}}-packaging
        - py${{range.key}}-pyelftools
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: move usr/bin executables for -bin
        runs: |
          mkdir -p ./cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./cleanup/${{range.key}}/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: auditwheel

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-manylinux-check
    description: auditwheel-manylinux-check for python${{range.key}}, checks ELF files against a manylinux policy
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}-bin
    pipeline:
      - runs: |
          install -Dm755 auditwheel-manylinux-check.py \
            ${{targets.contextdir}}/usr/bin/auditwheel-manylinux-check
          sed -i "1s|^#!.*|#!/usr/bin/python${{range.key}}|" \
            ${{targets.contextdir}}/usr/bin/auditwheel-manylinux-check
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: auditwheel-manylinux-check
        - name: exit codes and verdicts
          runs: |
            # A tag auditwheel does not know is a usage error
            rc=0
            auditwheel-manylinux-check manylinux_x /usr/bin/python${{range.key}} || rc=$?
            [ "$rc" -eq 2 ]

            # Nothing to check when every path is a non-ELF file
            rc=0
            auditwheel-manylinux-check manylinux_2_28 /etc/os-release > out.txt 2>&1 || rc=$?
            [ "$rc" -eq 1 ]
            grep -F "no ELF files found" out.txt

            # Any interpreter built against glibc 2.28 or newer needs symbols
            # above manylinux_2_17's glibc 2.17. The check must fail no matter
            # which python the test environment installs.
            rc=0
            auditwheel-manylinux-check manylinux_2_17 /usr/bin/python${{range.key}} > out.txt || rc=$?
            [ "$rc" -eq 1 ]
            grep -F "FAIL[manylinux]: /usr/bin/python${{range.key}}" out.txt
            grep -F "1 failed" out.txt

            # Paths arrive on stdin without a leading slash, as apk lists them
            rc=0
            printf 'usr/bin/python${{range.key}}\n\n' | auditwheel-manylinux-check manylinux_2_17 > out.txt || rc=$?
            [ "$rc" -eq 1 ]
            grep -F "FAIL[manylinux]: /usr/bin/python${{range.key}}" out.txt

            # Skipping the ISA check leaves the symbol version verdict in place
            rc=0
            auditwheel-manylinux-check --disable-isa-ext-check manylinux_2_17 /usr/bin/python${{range.key}} > out.txt || rc=$?
            [ "$rc" -eq 1 ]
            grep -F "FAIL[manylinux]: /usr/bin/python${{range.key}}" out.txt
            grep -F "too-recent versioned symbols" out.txt
            ! grep -F "ISA extensions" out.txt

            # Excluding a library the file does not link has no effect
            rc=0
            auditwheel-manylinux-check --exclude 'libnotlinked.so.*' manylinux_2_17 /usr/bin/python${{range.key}} > out.txt || rc=$?
            [ "$rc" -eq 1 ]
            grep -F "FAIL[manylinux]: /usr/bin/python${{range.key}}" out.txt

            # zlib needs nothing newer than GLIBC_2.14, so the check passes
            libz=$(readlink -f /usr/lib/libz.so.1)
            auditwheel-manylinux-check --disable-isa-ext-check manylinux_2_28 "$libz" > out.txt
            grep -F "PASS[manylinux]: $libz" out.txt
            grep -F "1 passed, 0 failed" out.txt

            # A library listed alongside the checked files is excluded from
            # their audit by name stem. apk lists a package's own libraries
            # this way.
            libpython=$(readlink -f /usr/lib/libpython${{range.key}}.so.1.0)
            rc=0
            auditwheel-manylinux-check manylinux_2_17 /usr/bin/python${{range.key}} "$libpython" > out.txt || rc=$?
            [ "$rc" -eq 1 ]
            grep -F "excluding shared libraries shipped alongside the checked files: libpython${{range.key}}.so*" out.txt

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  ignore-regex-patterns:
    - a
    - b
    - rc
    - post
  github:
    identifier: pypa/auditwheel

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
