package:
  name: py3-backports.asyncio.runner
  version: "1.2.0"
  epoch: 0
  description: Backport of asyncio.Runner, a context manager that controls event loop life cycle
  copyright:
    - license: PSF-2.0
  dependencies:
    provider-priority: 0

vars:
  pypi-package: backports.asyncio.runner

# asyncio.Runner is in the standard library from Python 3.11 on, and upstream
# declares requires-python ">=3.8,<3.11", so this is only built for 3.10.
data:
  - name: py-versions
    items:
      3.10: '310'

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3.10-hatch-fancy-pypi-readme
      - py3.10-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/samypr100/backports.asyncio.runner
      tag: v${{package.version}}
      expected-commit: 1d691044f48fae3ae607dcd649c071439204e122

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
          with:
            python: python${{range.key}}
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              from backports.asyncio.runner import Runner
        - name: Runner drives coroutines on one reusable event loop
          runs: |
            python${{range.key}} <<'EOF'
            import asyncio
            import contextvars

            from backports.asyncio.runner import Runner

            var = contextvars.ContextVar("var", default="unset")

            async def set_var():
                var.set("set")
                return asyncio.get_running_loop()

            async def get_var():
                return var.get(), asyncio.get_running_loop()

            with Runner() as runner:
                loop1 = runner.run(set_var())
                value, loop2 = runner.run(get_var())
                # Both calls share the runner's loop and its context.
                assert loop1 is loop2 is runner.get_loop()
                assert value == "set", value
            assert loop1.is_closed()
            print("Runner OK")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

test:
  pipeline:
    - uses: test/tw/byproductpackage

update:
  enabled: true
  github:
    identifier: samypr100/backports.asyncio.runner
    strip-prefix: v
