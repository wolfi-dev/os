# Generated from https://pypi.org/project/bokeh/
package:
  name: py3-bokeh
  version: "3.9.2"
  epoch: 1 # go/wolfi-rsc/py3-bokeh
  description: Interactive plots and applications in the browser from Python
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: bokeh
  import: bokeh

data:
  - name: py-versions
    items:
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - nodejs-26
      - npm
      - py3-supported-cython
      - py3-supported-pip
      - py3-supported-python-dev
      - py3-supported-setuptools-git-versioning
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bokeh/bokeh
      tag: ${{package.version}}
      expected-commit: 1605765de30309a46a17ea1874abb437a695f65f

  # bokeh's build process requires full tag history.
  - runs: git fetch --tags

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-contourpy
        - py${{range.key}}-jinja2
        - py${{range.key}}-narwhals
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-packaging
        - py${{range.key}}-pandas
        - py${{range.key}}-pillow
        - py${{range.key}}-pyyaml
        - py${{range.key}}-tornado
        - py${{range.key}}-xyzservices
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: "move usr/bin executables for -bin"
        runs: |
          mkdir -p ./cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./cleanup/${{range.key}}/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
      provides:
        - py3-${{vars.pypi-package}}-bin
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: bokeh
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: bokeh

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: bokeh/bokeh
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: bokeh
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: bokeh
