# Generated from https://pypi.org/project/click/
package:
  name: py3-click
  version: "8.5.0"
  epoch: 1 # upstream-tests/pytest
  description: Composable command line interface toolkit
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 6Gi

vars:
  pypi-package: click

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-colorama # upstream-tests: runtime dependency
      - py3.10-importlib-metadata # upstream-tests: runtime dependency
      - py3.11-colorama # upstream-tests: runtime dependency
      - py3.11-importlib-metadata # upstream-tests: runtime dependency
      - py3.12-colorama # upstream-tests: runtime dependency
      - py3.12-importlib-metadata # upstream-tests: runtime dependency
      - py3.13-colorama # upstream-tests: runtime dependency
      - py3.13-importlib-metadata # upstream-tests: runtime dependency
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pallets/click
      tag: ${{package.version}}
      expected-commit: 8b19813f2bfca99f1018a587a8cf54fc959f2e5d

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-colorama
        - py${{range.key}}-importlib-metadata
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: click

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: true
  github:
    identifier: pallets/click

test:
  pipeline:
    - uses: test/tw/byproductpackage
