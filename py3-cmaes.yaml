package:
  name: py3-cmaes
  version: "0.13.1"
  epoch: 1 # upstream-tests/pytest
  description: Lightweight Covariance Matrix Adaptation Evolution Strategy (CMA-ES) implementation for Python 3.
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: cmaes
  import: cmaes

data:
  - name: py-versions
    items:
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.12-matplotlib # upstream-tests: test dependency
      - py3.12-numpy-2.2 # upstream-tests: runtime dependency
      - py3.12-scipy # upstream-tests: runtime dependency
      - py3.13-matplotlib # upstream-tests: test dependency
      - py3.13-numpy-2.2 # upstream-tests: runtime dependency
      - py3.13-scipy # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/CyberAgentAILab/cmaes
      expected-commit: f86f8b4b2eef8499ddd72ec749d4a4cdfbb37e19
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-scipy
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: CyberAgentAILab/cmaes
    strip-prefix: v
