package:
  name: py3-configargparse
  version: "1.9.0"
  epoch: 1 # upstream-tests/pytest
  description: A drop-in replacement for argparse that allows options to also be set via config files and/or environment variables.
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: configargparse
  import: configargparse

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-mock # upstream-tests: test dependency
      - py3.10-pyyaml # upstream-tests: test dependency
      - py3.10-toml # upstream-tests: test dependency
      - py3.11-mock # upstream-tests: test dependency
      - py3.11-pyyaml # upstream-tests: test dependency
      - py3.11-toml # upstream-tests: test dependency
      - py3.12-mock # upstream-tests: test dependency
      - py3.12-pyyaml # upstream-tests: test dependency
      - py3.12-toml # upstream-tests: test dependency
      - py3.13-mock # upstream-tests: test dependency
      - py3.13-pyyaml # upstream-tests: test dependency
      - py3.13-toml # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bw2/ConfigArgParse
      tag: v${{package.version}}
      expected-commit: 1829aa14c317374aa1467e1d01f99472282183ff

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}
    - uses: py/one-python
      with:
        content: |
          DBSNP_PATH=./package_test_here python3 ./config_test.py --my-config ./config.txt f1.vcf f2.vcf

update:
  enabled: true
  github:
    identifier: bw2/ConfigArgParse
    strip-prefix: v
