package:
  name: py3-cpuinfo
  version: 9.0.0
  epoch: 2 # moved from enterprise-packages to os so os packages can use it for upstream tests
  description: Get CPU info with pure Python
  copyright:
    - license: MIT

vars:
  pypi-package: py-cpuinfo
  import: cpuinfo

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-wheel

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/workhorsy/py-cpuinfo
      tag: v${{package.version}}
      expected-commit: 4824ec0746be0dcee9bf9528dc8cdd0c1640cd9d

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import cpuinfo
            # Test basic CPU info functionality
            cpu_info = cpuinfo.get_cpu_info()
            assert isinstance(cpu_info, dict)
            assert len(cpu_info) > 0, "CPU info dictionary should not be empty"
            # Check for at least one of the common CPU info keys
            common_keys = ['brand_raw', 'brand', 'arch', 'count', 'hz_advertised', 'hz_actual']
            assert any(key in cpu_info for key in common_keys), f"Expected at least one of {common_keys} in cpu_info, got: {list(cpu_info.keys())}"
            print("All tests passed!")
            EOF

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            cpuinfo --version
            cpuinfo --help | grep -q "show this help message"

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  git:
    strip-prefix: v
