# Generated from https://pypi.org/project/cryptography/
package:
  name: py3-cryptography
  version: "50.0.2"
  epoch: 4 # run upstream pytest suite at build time (non-gating)
  description: cryptography is a package which provides cryptographic recipes and primitives to Python developers.
  copyright:
    - license: Apache-2.0 OR BSD-3-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "2"
    memory: 10Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  openssl-version: "4.0"
  pypi-package: cryptography
  rust-version: "1.99"

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  environment:
    CFLAGS: -DOPENSSL_NO_ENGINE
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - maturin
      - openssl-${{vars.openssl-version}}-dev
      - py3-supported-cffi
      - py3-supported-maturin
      - py3-supported-pip
      # test-only: upstream pytest suite (see the subpackage build step)
      - py3-supported-pretend
      - py3-supported-pytest
      - py3-supported-python-dev
      - py3-supported-setuptools
      - py3-supported-typing-extensions
      - rust-${{vars.rust-version}}
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pyca/cryptography/
      tag: ${{package.version}}
      expected-commit: 4dda5c7fe4ae71b8925f2551910a0ef959df9c7a

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-cffi
        - py${{range.key}}-typing-extensions
        - openssl-provider-legacy-allowed
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: Upstream pytest suite against the just-installed package
        runs: |
          # Runs pyca/cryptography's own tests from the checked-out source tree
          # (tests/ and the same-version vectors/), importing the package that
          # was just installed into this subpackage. Nothing is fetched.
          # pytest-benchmark is not packaged and only backs --benchmark-disable
          # and tests/bench, so override addopts and skip tests/bench.
          sp="${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages"
          export PYTHONPATH="$sp:$PWD/vectors"
          log=$(mktemp)
          ut_start=$(date +%s)
          # Fails today on OpenSSL 4: legacy algorithms are opt-in, and some
          # algorithms the backend reports as supported raise InternalError.
          # See https://github.com/chainguard-dev/stereo/issues/400899
          # TODO(upstream-tests): gate on expected pass rate + named exceptions; see os/glibc-2.44.yaml
          python${{range.key}} -m pytest -q -rfE -p no:cacheprovider \
            -o addopts="-r s --capture=no --strict-markers" \
            --continue-on-collection-errors \
            --ignore=tests/bench tests/ > "$log" 2>&1 || true
          cat "$log"
          ut_end=$(date +%s)
          summary=$(grep -E '^(=+ )?[0-9]+ (passed|failed|skipped|errors?)' "$log" | tail -1 || true)
          if [ -z "$summary" ]; then
            # No summary means pytest could not start or collection crashed:
            # that is a real failure, not a known test result.
            echo "UPSTREAM-TESTS py${{range.key}}-${{vars.pypi-package}}: no pytest summary found" >&2
            exit 1
          fi
          n() { echo "$summary" | grep -oE "[0-9]+ $1" | grep -oE '^[0-9]+' || echo 0; }
          ut_pass=$(n passed)
          if [ "$ut_pass" -eq 0 ] || grep -q '^!.* Interrupted' "$log"; then
            # Nothing ran (interrupted session or zero passes): a real failure.
            echo "UPSTREAM-TESTS py${{range.key}}-${{vars.pypi-package}}: suite did not run ($summary)" >&2
            exit 1
          fi
          ut_fail=$(( $(n failed) + $(n 'errors?') ))
          ut_skip=$(n skipped)
          grep -E '^(FAILED|ERROR) ' "$log" | \
            sed 's/^/UPSTREAM-TESTS-FAIL py${{range.key}}-${{vars.pypi-package}}: /' || true
          echo "UPSTREAM-TESTS py${{range.key}}-${{vars.pypi-package}}: pass=${ut_pass} fail=${ut_fail} skip=${ut_skip}"
          echo "UPSTREAM-TESTS py${{range.key}}-${{vars.pypi-package}}: duration=$((ut_end - ut_start))s"
          rm -f "$log"
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.pypi-package}}
              import cryptography.hazmat.primitives.ciphers

  - name: py3-wheels-${{vars.pypi-package}}
    description: built ${{vars.pypi-package}} wheels
    pipeline:
      - uses: py/collect-wheels
    test:
      pipeline:
        - name: Verify wheel files are present
          runs: |
            find /usr/share/wheels -name "cryptography-*.whl" | grep -q . || { echo "No cryptography wheel files found"; exit 1; }

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: true
  github:
    identifier: pyca/cryptography
    use-tag: true

test:
  pipeline:
    - uses: test/tw/byproductpackage
