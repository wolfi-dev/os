# Generated from https://pypi.org/project/decorator/
package:
  name: py3-decorator
  version: "5.3.1"
  epoch: 2
  description: Decorators for Humans
  copyright:
    - license: BSD-2-Clause
  dependencies:
    provider-priority: 0

vars:
  pypi-package: decorator

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-build
      - py3-supported-installer
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-setuptools
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 426e9e35d563ffe356e54bd0f970d153b8f25370
      repository: https://github.com/micheles/decorator
      tag: ${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - name: decorator preserves signatures and wraps calls
          runs: |
            python${{range.key}} - <<'PY'
            import inspect
            import decorator

            calls = []

            @decorator.decorator
            def trace(f, *args, **kw):
                calls.append(f.__name__)
                return f(*args, **kw)

            @trace
            def add(x, y=2):
                return x + y

            assert add(1) == 3, add(1)
            assert add(1, y=5) == 6
            assert calls == ["add", "add"], calls
            assert str(inspect.signature(add)) == "(x, y=2)", inspect.signature(add)
            assert add.__name__ == "add"

            def double(f, *args, **kw):
                return 2 * f(*args, **kw)

            def mul(a, b):
                return a * b

            wrapped = decorator.decorate(mul, double)
            assert wrapped(3, 4) == 24, wrapped(3, 4)
            assert str(inspect.signature(wrapped)) == "(a, b)"

            events = []

            @decorator.contextmanager
            def around():
                events.append("enter")
                yield
                events.append("exit")

            @around()
            def body():
                events.append("body")
                return "done"

            assert body() == "done"
            assert events == ["enter", "body", "exit"], events
            print("decorator functional OK")
            PY

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/byproductpackage
