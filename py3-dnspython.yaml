#nolint:unversioned-py3-dep
package:
  name: py3-dnspython
  version: "2.9.0"
  epoch: 0 # go/wolfi-rsc/py3-dnspython
  description: DNS toolkit
  copyright:
    - license: ISC
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: dnspython
  import: dns

data:
  - name: py-versions
    items:
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-hatchling
      - py3-supported-uv-build
      - py3-uv-build-bin

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rthalley/dnspython
      tag: v${{package.version}}
      expected-commit: e790c8f20a67ad439c7aafef2321e161c6028eee

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}
    - uses: py/one-python
      with:
        content: |
          # Run the Python script to verify DNS resolution works
          python3 test_dns.py

update:
  enabled: true
  github:
    identifier: rthalley/dnspython
    strip-prefix: v
    tag-filter-prefix: v
