package:
  name: py3-freezegun
  version: "1.5.5"
  epoch: 0
  description: Let your Python tests travel through time by mocking the datetime module
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

vars:
  pypi-package: freezegun
  import: freezegun

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/spulec/freezegun
      tag: ${{package.version}}
      expected-commit: c9bf52c5aa12ea1b5b8647a136a92504ea071f2f

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-python-dateutil
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
          with:
            python: python${{range.key}}
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}
              from freezegun import freeze_time
        - name: Module version matches installed distribution metadata
          runs: |
            python${{range.key}} -c 'import importlib.metadata, freezegun; v = importlib.metadata.version("freezegun"); assert freezegun.__version__ == v, (freezegun.__version__, v); print(v)'
        - name: Freeze, tick and move time
          runs: |
            python${{range.key}} <<'EOF'
            import datetime
            import time

            from freezegun import freeze_time

            frozen = datetime.datetime(2012, 1, 14, 12, 0, 1)

            with freeze_time("2012-01-14 12:00:01"):
                assert datetime.datetime.now() == frozen, datetime.datetime.now()
                assert datetime.datetime.utcnow() == frozen
                assert datetime.date.today() == datetime.date(2012, 1, 14)
                assert time.time() == frozen.replace(tzinfo=datetime.timezone.utc).timestamp()
                assert time.strftime("%Y-%m-%d") == "2012-01-14"
                assert time.gmtime().tm_year == 2012
            assert datetime.datetime.now().year != 2012

            @freeze_time("2020-02-29")
            def leap_day():
                return datetime.date.today()

            assert leap_day() == datetime.date(2020, 2, 29)

            @freeze_time("2001-09-09")
            class Frozen:
                def year(self):
                    return datetime.date.today().year

            assert Frozen().year() == 2001

            with freeze_time("2012-01-14", tz_offset=-4):
                assert datetime.datetime.utcnow() == datetime.datetime(2012, 1, 14)
                assert datetime.datetime.now() == datetime.datetime(2012, 1, 13, 20)

            with freeze_time("2012-01-14 00:00:00") as ft:
                ft.tick(delta=datetime.timedelta(seconds=90))
                assert datetime.datetime.now() == datetime.datetime(2012, 1, 14, 0, 1, 30)
                ft.move_to("2015-06-01 08:00:00")
                assert datetime.datetime.now() == datetime.datetime(2015, 6, 1, 8)

            with freeze_time("2012-01-14", auto_tick_seconds=15):
                first = datetime.datetime.now()
                second = datetime.datetime.now()
                assert second - first == datetime.timedelta(seconds=15), (first, second)

            with freeze_time("2012-01-14", tick=True):
                start = datetime.datetime.now()
                time.sleep(0.05)
                assert datetime.datetime.now() > start

            print("freezegun functional checks passed")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: true
  github:
    identifier: spulec/freezegun

test:
  pipeline:
    - uses: test/tw/byproductpackage
