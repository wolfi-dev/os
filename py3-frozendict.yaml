# Generated from https://pypi.org/project/frozendict/
package:
  name: py3-frozendict
  version: "2.5.1"
  epoch: 2 # build the C extension (python headers)
  description: A simple immutable dictionary
  copyright:
    - license: LGPL-3.0-or-later
  dependencies:
    provider-priority: "0"
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  import: frozendict
  pypi-package: frozendict

data:
  - name: py-versions
    items:
      "3.10": "310"
      "3.11": "311"
      "3.12": "312"
      "3.13": "313"

environment:
  contents:
    packages:
      - py3-supported-build-base-dev # compiler + Python headers, so the C extension builds
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: cab441e146ee8a9899e251e331313396c348ef22
      repository: https://github.com/Marco-Sulla/python-frozendict
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - name: Python Build
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    test:
      environment: {}
      pipeline:
        - uses: test/tw/pip-check
        - name: Import Test
          uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Compiled extension shipped and loads
          runs: |
            # upstream only has a C implementation for CPython <= 3.10 (src/frozendict/c_src/3_*);
            # newer interpreters use the pure-Python implementation by design
            if [ "${{range.key}}" = "3.10" ]; then
              python${{range.key}} -c "import importlib.machinery as m, frozendict._frozendict as e; assert e.__file__.endswith(tuple(m.EXTENSION_SUFFIXES)), e.__file__"
              python${{range.key}} -c "import frozendict; assert frozendict.c_ext, 'frozendict is using the pure-Python implementation'"
            fi

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  manual: false
  github:
    identifier: Marco-Sulla/python-frozendict
    strip-prefix: v

test:
  pipeline:
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.import}}
