package:
  name: py3-google-auth-httplib2
  version: "0.4.2"
  epoch: 0
  description: 'Google Authentication Library: httplib2 transport'
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

vars:
  pypi-package: google-auth-httplib2
  import: google_auth_httplib2

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 3e29682282ac03d929fbfb93b5f94736fd420249
      repository: https://github.com/googleapis/google-cloud-python
      tag: google-auth-httplib2-v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-google-auth
        - py${{range.key}}-httplib2
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
        working-directory: packages/google-auth-httplib2
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  manual: false
  github:
    identifier: googleapis/google-cloud-python
    strip-prefix: google-auth-httplib2-v
    use-tag: true
    tag-filter: google-auth-httplib2
