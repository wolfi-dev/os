package:
  name: py3-google-cloud-bigquery-storage
  version: "2.43.0"
  epoch: 1 # upstream-tests/pytest
  description: Google Cloud Bigquery Storage API client library
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: google-cloud-bigquery-storage
  import: google.cloud.bigquery_storage

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.11-altair # upstream-tests: test dependency
      - py3.11-fastavro # upstream-tests: test dependency
      - py3.11-google-api-core # upstream-tests: runtime dependency
      - py3.11-google-cloud-testutils # upstream-tests: test dependency
      - py3.11-pandas # upstream-tests: test dependency
      - py3.11-proto-plus # upstream-tests: runtime dependency
      - py3.11-protobuf # upstream-tests: runtime dependency
      - py3.11-pytest-asyncio # upstream-tests: test dependency
      - py3.12-altair # upstream-tests: test dependency
      - py3.12-fastavro # upstream-tests: test dependency
      - py3.12-google-api-core # upstream-tests: runtime dependency
      - py3.12-google-cloud-testutils # upstream-tests: test dependency
      - py3.12-pandas # upstream-tests: test dependency
      - py3.12-proto-plus # upstream-tests: runtime dependency
      - py3.12-protobuf # upstream-tests: runtime dependency
      - py3.12-pytest-asyncio # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2d29c3116d0602d13e6b6d555405f9c1ec0e9756
      repository: https://github.com/googleapis/google-cloud-python
      tag: google-cloud-bigquery-storage-v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-google-api-core
        - py${{range.key}}-proto-plus
        - py${{range.key}}-protobuf
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
        working-directory: packages/google-cloud-bigquery-storage
      # py3-pandas is not packaged for Python 3.10 on main (tested versions: 3.11 3.12).
      # TODO(upstream-tests): drop the gate when the dep is packaged for these versions.
      # tests/system run against live BigQuery (credentials, network, google-cloud-bigquery); not available in the build sandbox.
      # TODO(upstream-tests): run tests/system where credentials and network are available.
      - if: "'${{range.key}}' != '3.10'"
        uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
          dir: packages/google-cloud-bigquery-storage
          ignore-files: tests/system
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  environment:
    contents:
      packages:
        - py3.12-${{vars.pypi-package}}
  pipeline:
    - uses: python/import
      with:
        python: python3.12
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  git:
    strip-prefix: google-cloud-bigquery-storage-v
    tag-filter-prefix: google-cloud-bigquery-storage
