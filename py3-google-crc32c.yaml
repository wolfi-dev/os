package:
  name: py3-google-crc32c
  version: "1.8.0"
  epoch: 5 # go/wolfi-rsc/py3-google-crc32c
  description: A python wrapper of the C library 'Google CRC32C'
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0
  resources:
    # Cloning the google-cloud-python monorepo needs far more headroom than the
    # old single-package repo did; 1Gi exhausted the workspace mid-clone.
    cpu: "2"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: google-crc32c
  import: google_crc32c

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  environment:
    CRC32C_PURE_PYTHON: 0
  contents:
    packages:
      - crc32c-dev
      - glibc-2.44-dev
      - py3-supported-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2c5205dc169e14bba4fa1f4d932472eacb347ee2
      repository: https://github.com/googleapis/google-cloud-python
      tag: google-crc32c-v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
        working-directory: packages/google-crc32c
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  manual: false
  github:
    identifier: googleapis/google-cloud-python
    strip-prefix: google-crc32c-v
    use-tag: true
    tag-filter: google-crc32c-v
