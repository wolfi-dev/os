package:
  name: py3-grpc-google-iam-v1
  version: "0.14.6"
  epoch: 1 # upstream-tests/pytest
  description: IAM API client library
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0
  resources:
    cpu: "2"
    memory: 6Gi

vars:
  pypi-package: grpc-google-iam-v1
  import: google.iam.v1

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-alabaster # upstream-tests: test dependency
      - py3.10-googleapis-common-protos # upstream-tests: runtime dependency
      - py3.10-grpcio # upstream-tests: test dependency
      - py3.10-protobuf # upstream-tests: runtime dependency
      - py3.10-pygments # upstream-tests: test dependency
      - py3.10-pyopenssl # upstream-tests: test dependency
      - py3.10-recommonmark # upstream-tests: test dependency
      - py3.11-alabaster # upstream-tests: test dependency
      - py3.11-googleapis-common-protos # upstream-tests: runtime dependency
      - py3.11-grpcio # upstream-tests: test dependency
      - py3.11-protobuf # upstream-tests: runtime dependency
      - py3.11-pygments # upstream-tests: test dependency
      - py3.11-pyopenssl # upstream-tests: test dependency
      - py3.11-recommonmark # upstream-tests: test dependency
      - py3.12-alabaster # upstream-tests: test dependency
      - py3.12-googleapis-common-protos # upstream-tests: runtime dependency
      - py3.12-grpcio # upstream-tests: test dependency
      - py3.12-protobuf # upstream-tests: runtime dependency
      - py3.12-pygments # upstream-tests: test dependency
      - py3.12-pyopenssl # upstream-tests: test dependency
      - py3.12-recommonmark # upstream-tests: test dependency
      - py3.13-alabaster # upstream-tests: test dependency
      - py3.13-googleapis-common-protos # upstream-tests: runtime dependency
      - py3.13-grpcio # upstream-tests: test dependency
      - py3.13-protobuf # upstream-tests: runtime dependency
      - py3.13-pygments # upstream-tests: test dependency
      - py3.13-pyopenssl # upstream-tests: test dependency
      - py3.13-recommonmark # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 82b056545d49f253a3bf27143cfa9fc8bb80da70
      repository: https://github.com/googleapis/google-cloud-python
      tag: grpc-google-iam-v1-v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-googleapis-common-protos
        - py${{range.key}}-grpcio
        - py${{range.key}}-protobuf
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
        working-directory: packages/grpc-google-iam-v1
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
          dir: packages/grpc-google-iam-v1
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  manual: false
  github:
    identifier: googleapis/google-cloud-python
    strip-prefix: grpc-google-iam-v1-v
    use-tag: true
    tag-filter: grpc-google-iam-v1
