package:
  name: py3-httpx2
  version: "2.16.0"
  epoch: 0
  description: A next generation HTTP client for Python.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0

vars:
  pypi-package: httpx2

data:
  - name: py-versions
    items:
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-hatch-fancy-pypi-readme
      - py3-supported-hatchling
      - py3-supported-pip
      - py3-supported-uv-dynamic-versioning

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6bfbf296bd87891287b3b0335493c7317be4ef18
      repository: https://github.com/pydantic/httpx2
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-anyio
        # Upstream requires httpcore2=={{ version }} (src/httpx2/pyproject.toml); both ship from the same tag.
        - py${{range.key}}-httpcore2~${{package.version}}
        - py${{range.key}}-idna
        - py${{range.key}}-truststore
        - py${{range.key}}-typing-extensions
    pipeline:
      - uses: py/pip-build-install
        working-directory: src/httpx2
        with:
          python: python${{range.key}}
      - name: "verify httpx2 still pins httpcore2 to its own version"
        runs: |
          meta="${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/httpx2-${{package.version}}.dist-info/METADATA"
          want="Requires-Dist: httpcore2==${{package.version}}"
          got=$(grep '^Requires-Dist: httpcore2' "$meta" || true)
          case "$got" in
            "$want" | "$want;"* | "$want "*) echo "OK: $got" ;;
            *)
              echo "ERROR: expected '$want' in $meta, found: '${got:-<none>}'" >&2
              echo "Upstream no longer pins httpcore2 to httpx2's own version. Revisit the py${{range.key}}-httpcore2~${{package.version}} runtime dependency in py3-httpx2.yaml." >&2
              exit 1
              ;;
          esac
      - name: "move usr/bin executables for -bin"
        runs: |
          mkdir -p ./cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./cleanup/${{range.key}}/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
      provides:
        - py3-${{vars.pypi-package}}-bin
      provider-priority: ${{range.value}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}-bin

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  ignore-regex-patterns:
    - .*\.dev.*
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/byproductpackage
