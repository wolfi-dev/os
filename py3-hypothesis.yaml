package:
  name: py3-hypothesis
  version: "6.170.13"
  epoch: 1 # moved from enterprise-packages to os so os packages can use it for upstream tests
  description: The property-based testing library for Python
  copyright:
    - license: MPL-2.0
  resources:
    cpu: "1"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: hypothesis
  rust-version: "1.99"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - maturin
      - py3-supported-build-base-dev
      - py3-supported-maturin
      - rust-${{vars.rust-version}}

data:
  - name: py-versions
    items:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/HypothesisWorks/hypothesis.git
      tag: v${{package.version}}
      expected-commit: 5e93693373ff843f2e94c1b4809f34da1456c624

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-attrs
        - py${{range.key}}-exceptiongroup
        - py${{range.key}}-sortedcontainers
    pipeline:
      - working-directory: hypothesis
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | tee output.txt
            from hypothesis import given, strategies as st

            @given(st.integers())
            def test_is_integer(n):
                print(f"called with {n}")
                assert isinstance(n, int)

            test_is_integer()
            EOF
            sed -n '1p' ./output.txt | grep -E -e "called with.*[[:digit:]]*"
            sed -n '2p' ./output.txt | grep -E -e "called with.*[[:digit:]]*"
            sed -n '3p' ./output.txt | grep -E -e "called with.*[[:digit:]]*"

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
        - py${{range.key}}-click
        - py${{range.key}}-libcst
        - py${{range.key}}-pyyaml
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: hypothesis
        - uses: test/tw/ver-check
          with:
            bins: hypothesis

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
