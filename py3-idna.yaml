# Generated from https://pypi.org/project/idna/
package:
  name: py3-idna
  version: "3.20"
  epoch: 1 # upstream-tests/pytest
  description: Internationalized Domain Names in Applications (IDNA)
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-wheel
      - py3.11-hypothesis # upstream-tests: test dependency
      - py3.12-hypothesis # upstream-tests: test dependency
      - py3.13-hypothesis # upstream-tests: test dependency

vars:
  pypi-package: idna

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kjd/idna.git
      tag: v${{package.version}}
      expected-commit: d55e65e1a3b1ede7f556bc202738066f5597e249

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      # hypothesis 6.170 requires Python >= 3.11 (no py3.10-hypothesis by design).
      - if: "'${{range.key}}' != '3.10'"
        uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  github:
    identifier: kjd/idna
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: python/import
      with:
        import: idna
