package:
  name: py3-ipywidgets
  version: "8.1.9"
  epoch: 1 # upstream-tests/pytest
  description: Jupyter interactive widgets
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: ipywidgets
  import: ipywidgets

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-comm # upstream-tests: runtime dependency
      - py3.10-ipykernel # upstream-tests: test dependency
      - py3.10-ipython # upstream-tests: runtime dependency
      - py3.10-jsonschema # upstream-tests: test dependency
      - py3.10-pytz # upstream-tests: test dependency
      - py3.10-traitlets # upstream-tests: runtime dependency
      - py3.10-widgetsnbextension # upstream-tests: runtime dependency
      - py3.11-comm # upstream-tests: runtime dependency
      - py3.11-ipykernel # upstream-tests: test dependency
      - py3.11-ipython # upstream-tests: runtime dependency
      - py3.11-jsonschema # upstream-tests: test dependency
      - py3.11-pytz # upstream-tests: test dependency
      - py3.11-traitlets # upstream-tests: runtime dependency
      - py3.11-widgetsnbextension # upstream-tests: runtime dependency
      - py3.12-comm # upstream-tests: runtime dependency
      - py3.12-ipykernel # upstream-tests: test dependency
      - py3.12-ipython # upstream-tests: runtime dependency
      - py3.12-jsonschema # upstream-tests: test dependency
      - py3.12-pytz # upstream-tests: test dependency
      - py3.12-traitlets # upstream-tests: runtime dependency
      - py3.12-widgetsnbextension # upstream-tests: runtime dependency
      - py3.13-comm # upstream-tests: runtime dependency
      - py3.13-ipykernel # upstream-tests: test dependency
      - py3.13-ipython # upstream-tests: runtime dependency
      - py3.13-jsonschema # upstream-tests: test dependency
      - py3.13-pytz # upstream-tests: test dependency
      - py3.13-traitlets # upstream-tests: runtime dependency
      - py3.13-widgetsnbextension # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyter-widgets/ipywidgets
      tag: ${{package.version}}
      expected-commit: 15f0564eec5e6fc0d8d655c16490c2e475bdd145

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-comm
        - py${{range.key}}-ipython
        - py${{range.key}}-traitlets
        - py${{range.key}}-widgetsnbextension
        - py${{range.key}}-jsonschema
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
        working-directory: python/ipywidgets
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
          dir: python/ipywidgets
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: jupyter-widgets/ipywidgets
