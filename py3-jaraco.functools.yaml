package:
  name: py3-jaraco.functools
  version: "4.6.0"
  epoch: 1 # upstream-tests/pytest
  description: Functools like those found in stdlib
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0

vars:
  pypi-package: jaraco.functools

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-jaraco.classes # upstream-tests: test dependency
      - py3.10-more-itertools # upstream-tests: runtime dependency
      - py3.11-jaraco.classes # upstream-tests: test dependency
      - py3.11-more-itertools # upstream-tests: runtime dependency
      - py3.12-jaraco.classes # upstream-tests: test dependency
      - py3.12-more-itertools # upstream-tests: runtime dependency
      - py3.13-jaraco.classes # upstream-tests: test dependency
      - py3.13-more-itertools # upstream-tests: runtime dependency
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f7f4f3bcac8f70e01064dee9a8bde6cc8f997a17
      repository: https://github.com/jaraco/jaraco.functools
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-more-itertools
    pipeline:
      - name: Fix version (setuptools_scm falls back to 0.0.0 without full git history)
        runs: |
          sed -i 's/dynamic = \["version"\]/version = "${{package.version}}"/' pyproject.toml
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  manual: false
  github:
    identifier: jaraco/jaraco.functools
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/byproductpackage
