package:
  name: py3-jinja2
  version: "3.1.6"
  epoch: 5 # upstream-tests/pytest
  description: A small but fast and easy to use stand-alone python template engine
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-wheel
      - py3.10-attrs # upstream-tests: test dependency
      - py3.10-exceptiongroup # upstream-tests: test dependency
      - py3.10-idna # upstream-tests: test dependency
      - py3.10-importlib-metadata # upstream-tests: test dependency
      - py3.10-iniconfig # upstream-tests: test dependency
      - py3.10-markupsafe # upstream-tests: runtime dependency
      - py3.10-outcome # upstream-tests: test dependency
      - py3.10-packaging # upstream-tests: test dependency
      - py3.10-pluggy # upstream-tests: test dependency
      - py3.10-sniffio # upstream-tests: test dependency
      - py3.10-sortedcontainers # upstream-tests: test dependency
      - py3.10-tomli # upstream-tests: test dependency
      - py3.10-trio # upstream-tests: test dependency
      - py3.10-typing-extensions # upstream-tests: test dependency
      - py3.10-zipp # upstream-tests: test dependency
      - py3.11-attrs # upstream-tests: test dependency
      - py3.11-exceptiongroup # upstream-tests: test dependency
      - py3.11-idna # upstream-tests: test dependency
      - py3.11-importlib-metadata # upstream-tests: test dependency
      - py3.11-iniconfig # upstream-tests: test dependency
      - py3.11-markupsafe # upstream-tests: runtime dependency
      - py3.11-outcome # upstream-tests: test dependency
      - py3.11-packaging # upstream-tests: test dependency
      - py3.11-pluggy # upstream-tests: test dependency
      - py3.11-sniffio # upstream-tests: test dependency
      - py3.11-sortedcontainers # upstream-tests: test dependency
      - py3.11-tomli # upstream-tests: test dependency
      - py3.11-trio # upstream-tests: test dependency
      - py3.11-typing-extensions # upstream-tests: test dependency
      - py3.11-zipp # upstream-tests: test dependency
      - py3.12-attrs # upstream-tests: test dependency
      - py3.12-exceptiongroup # upstream-tests: test dependency
      - py3.12-idna # upstream-tests: test dependency
      - py3.12-importlib-metadata # upstream-tests: test dependency
      - py3.12-iniconfig # upstream-tests: test dependency
      - py3.12-markupsafe # upstream-tests: runtime dependency
      - py3.12-outcome # upstream-tests: test dependency
      - py3.12-packaging # upstream-tests: test dependency
      - py3.12-pluggy # upstream-tests: test dependency
      - py3.12-sniffio # upstream-tests: test dependency
      - py3.12-sortedcontainers # upstream-tests: test dependency
      - py3.12-tomli # upstream-tests: test dependency
      - py3.12-trio # upstream-tests: test dependency
      - py3.12-typing-extensions # upstream-tests: test dependency
      - py3.12-zipp # upstream-tests: test dependency
      - py3.13-attrs # upstream-tests: test dependency
      - py3.13-exceptiongroup # upstream-tests: test dependency
      - py3.13-idna # upstream-tests: test dependency
      - py3.13-importlib-metadata # upstream-tests: test dependency
      - py3.13-iniconfig # upstream-tests: test dependency
      - py3.13-markupsafe # upstream-tests: runtime dependency
      - py3.13-outcome # upstream-tests: test dependency
      - py3.13-packaging # upstream-tests: test dependency
      - py3.13-pluggy # upstream-tests: test dependency
      - py3.13-sniffio # upstream-tests: test dependency
      - py3.13-sortedcontainers # upstream-tests: test dependency
      - py3.13-tomli # upstream-tests: test dependency
      - py3.13-trio # upstream-tests: test dependency
      - py3.13-typing-extensions # upstream-tests: test dependency
      - py3.13-zipp # upstream-tests: test dependency

vars:
  pypi-package: jinja2

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pallets/jinja
      tag: ${{package.version}}
      expected-commit: 15206881c006c79667fe5154fe80c01c65410679

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-markupsafe
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - runs: |
          docdir="/usr/share/doc/${{package.name}}"
          cp -R docs "$docdir"/
          mkdir -p "$docdir"
          install -m 644 -D LICENSE.txt /usr/share/licenses/${{package.name}}/LICENSE.txt
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  github:
    identifier: pallets/jinja

test:
  pipeline:
    - uses: test/tw/byproductpackage
