package:
  name: py3-jupyter-console
  version: 6.6.3
  epoch: 6 # upstream-tests/pytest
  description: A terminal-based console frontend for Jupyter kernels.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "3"
    memory: 7Gi

vars:
  pypi-package: jupyter-console
  import: jupyter_console

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-hatchling
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-flaky # upstream-tests: test dependency
      - py3.10-ipykernel # upstream-tests: runtime dependency
      - py3.10-ipython # upstream-tests: runtime dependency
      - py3.10-jupyter-client # upstream-tests: runtime dependency
      - py3.10-jupyter-core # upstream-tests: runtime dependency
      - py3.10-pexpect # upstream-tests: test dependency
      - py3.10-pillow # upstream-tests: test dependency
      - py3.10-prompt-toolkit # upstream-tests: runtime dependency
      - py3.10-pygments # upstream-tests: runtime dependency
      - py3.10-pyzmq # upstream-tests: runtime dependency
      - py3.10-traitlets # upstream-tests: runtime dependency
      - py3.11-flaky # upstream-tests: test dependency
      - py3.11-ipykernel # upstream-tests: runtime dependency
      - py3.11-ipython # upstream-tests: runtime dependency
      - py3.11-jupyter-client # upstream-tests: runtime dependency
      - py3.11-jupyter-core # upstream-tests: runtime dependency
      - py3.11-pexpect # upstream-tests: test dependency
      - py3.11-pillow # upstream-tests: test dependency
      - py3.11-prompt-toolkit # upstream-tests: runtime dependency
      - py3.11-pygments # upstream-tests: runtime dependency
      - py3.11-pyzmq # upstream-tests: runtime dependency
      - py3.11-traitlets # upstream-tests: runtime dependency
      - py3.12-flaky # upstream-tests: test dependency
      - py3.12-ipykernel # upstream-tests: runtime dependency
      - py3.12-ipython # upstream-tests: runtime dependency
      - py3.12-jupyter-client # upstream-tests: runtime dependency
      - py3.12-jupyter-core # upstream-tests: runtime dependency
      - py3.12-pexpect # upstream-tests: test dependency
      - py3.12-pillow # upstream-tests: test dependency
      - py3.12-prompt-toolkit # upstream-tests: runtime dependency
      - py3.12-pygments # upstream-tests: runtime dependency
      - py3.12-pyzmq # upstream-tests: runtime dependency
      - py3.12-traitlets # upstream-tests: runtime dependency
      - py3.13-flaky # upstream-tests: test dependency
      - py3.13-ipykernel # upstream-tests: runtime dependency
      - py3.13-ipython # upstream-tests: runtime dependency
      - py3.13-jupyter-client # upstream-tests: runtime dependency
      - py3.13-jupyter-core # upstream-tests: runtime dependency
      - py3.13-pexpect # upstream-tests: test dependency
      - py3.13-pillow # upstream-tests: test dependency
      - py3.13-prompt-toolkit # upstream-tests: runtime dependency
      - py3.13-pygments # upstream-tests: runtime dependency
      - py3.13-pyzmq # upstream-tests: runtime dependency
      - py3.13-traitlets # upstream-tests: runtime dependency
  environment:
    # This is needed to work around the error "ValueError: ZIP does not support timestamps before 1980"
    SOURCE_DATE_EPOCH: 315532800

pipeline:
  - uses: git-checkout
    with:
      expected-commit: fddbc42d2e0be85feace1fe783a05e2b569fceae
      repository: https://github.com/jupyter/jupyter_console
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-ipykernel
        - py${{range.key}}-ipython
        - py${{range.key}}-jupyter-client
        - py${{range.key}}-jupyter-core
        - py${{range.key}}-prompt-toolkit
        - py${{range.key}}-pygments
        - py${{range.key}}-pyzmq
        - py${{range.key}}-traitlets
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - name: Move executables for -bin packages
        runs: |
          mkdir -p ./cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./cleanup/${{range.key}}/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - name: Install executables
        runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - py${{range.key}}-ipython
            - py${{range.key}}-ipykernel
            - py${{range.key}}-jupyter-core-bin
            - py${{range.key}}-jupyter-client-bin
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - uses: test/tw/help-check
          with:
            bins: jupyter-console
        - uses: test/tw/ver-check
          with:
            bins: jupyter-console
        - name: Test Console with Python kernel
          runs: |
            jupyter-console --kernel=python3

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  github:
    identifier: jupyter/jupyter_console
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/byproductpackage
