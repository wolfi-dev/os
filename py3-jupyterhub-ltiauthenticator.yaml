# Generated from https://pypi.org/project/jupyterhub-ltiauthenticator/
package:
  name: py3-jupyterhub-ltiauthenticator
  version: "1.6.3"
  epoch: 2 # upstream-tests/pytest
  description: JupyterHub authenticator implementing LTI v1.1 and LTI v1.3
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0

vars:
  pypi-package: jupyterhub-ltiauthenticator
  import: ltiauthenticator

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-hatchling
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-cachetools # upstream-tests: runtime dependency
      - py3.10-escapism # upstream-tests: runtime dependency
      - py3.10-jupyterhub # upstream-tests: runtime dependency
      - py3.10-oauthlib # upstream-tests: runtime dependency
      - py3.10-pyjwt # upstream-tests: runtime dependency
      - py3.10-pytest-asyncio # upstream-tests: test dependency
      - py3.10-traitlets # upstream-tests: runtime dependency
      - py3.11-cachetools # upstream-tests: runtime dependency
      - py3.11-escapism # upstream-tests: runtime dependency
      - py3.11-jupyterhub # upstream-tests: runtime dependency
      - py3.11-oauthlib # upstream-tests: runtime dependency
      - py3.11-pyjwt # upstream-tests: runtime dependency
      - py3.11-pytest-asyncio # upstream-tests: test dependency
      - py3.11-traitlets # upstream-tests: runtime dependency
      - py3.12-cachetools # upstream-tests: runtime dependency
      - py3.12-escapism # upstream-tests: runtime dependency
      - py3.12-jupyterhub # upstream-tests: runtime dependency
      - py3.12-oauthlib # upstream-tests: runtime dependency
      - py3.12-pyjwt # upstream-tests: runtime dependency
      - py3.12-pytest-asyncio # upstream-tests: test dependency
      - py3.12-traitlets # upstream-tests: runtime dependency
      - py3.13-cachetools # upstream-tests: runtime dependency
      - py3.13-escapism # upstream-tests: runtime dependency
      - py3.13-jupyterhub # upstream-tests: runtime dependency
      - py3.13-oauthlib # upstream-tests: runtime dependency
      - py3.13-pyjwt # upstream-tests: runtime dependency
      - py3.13-pytest-asyncio # upstream-tests: test dependency
      - py3.13-traitlets # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 4fb95e2b72ec87c2000c5b6ea1968479c1a82382
      repository: https://github.com/jupyterhub/ltiauthenticator
      tag: ${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-cachetools
        - py${{range.key}}-escapism
        - py${{range.key}}-jupyterhub
        - py${{range.key}}-oauthlib
        - py${{range.key}}-pyjwt
        - py${{range.key}}-traitlets
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  manual: false
  github:
    identifier: jupyterhub/ltiauthenticator
    use-tag: true
