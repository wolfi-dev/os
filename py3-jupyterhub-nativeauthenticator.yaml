# Generated from https://pypi.org/project/jupyterhub-nativeauthenticator/
package:
  name: py3-jupyterhub-nativeauthenticator
  version: "1.4.0"
  epoch: 0 # upstream-tests/pytest
  description: JupyterHub Native Authenticator
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: jupyterhub-nativeauthenticator
  import: nativeauthenticator

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-hatchling
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-bcrypt # upstream-tests: runtime dependency
      - py3.10-jupyterhub # upstream-tests: runtime dependency
      - py3.10-onetimepass # upstream-tests: runtime dependency
      - py3.10-pytest-asyncio # upstream-tests: test dependency
      - py3.11-bcrypt # upstream-tests: runtime dependency
      - py3.11-jupyterhub # upstream-tests: runtime dependency
      - py3.11-onetimepass # upstream-tests: runtime dependency
      - py3.11-pytest-asyncio # upstream-tests: test dependency
      - py3.12-bcrypt # upstream-tests: runtime dependency
      - py3.12-jupyterhub # upstream-tests: runtime dependency
      - py3.12-onetimepass # upstream-tests: runtime dependency
      - py3.12-pytest-asyncio # upstream-tests: test dependency
      - py3.13-bcrypt # upstream-tests: runtime dependency
      - py3.13-jupyterhub # upstream-tests: runtime dependency
      - py3.13-onetimepass # upstream-tests: runtime dependency
      - py3.13-pytest-asyncio # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8e12ddbd23157faeabcfe72c411f6c00ca1f94bd
      repository: https://github.com/jupyterhub/nativeauthenticator
      tag: ${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-jupyterhub
        - py${{range.key}}-bcrypt
        - py${{range.key}}-onetimepass
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  manual: false
  github:
    identifier: jupyterhub/nativeauthenticator
    use-tag: true
