package:
  name: py3-kubernetes-asyncio
  version: "36.1.0"
  epoch: 2 # upstream-tests/pytest
  description: Kubernetes asynchronous python client
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: kubernetes-asyncio
  import: kubernetes_asyncio

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-hatchling
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-aiohttp # upstream-tests: runtime dependency
      - py3.10-certifi # upstream-tests: runtime dependency
      - py3.10-dateutil # upstream-tests: runtime dependency
      - py3.10-pyyaml # upstream-tests: runtime dependency
      - py3.10-setuptools # upstream-tests: runtime dependency
      - py3.10-six # upstream-tests: runtime dependency
      - py3.10-urllib3 # upstream-tests: runtime dependency
      - py3.11-aiohttp # upstream-tests: runtime dependency
      - py3.11-certifi # upstream-tests: runtime dependency
      - py3.11-dateutil # upstream-tests: runtime dependency
      - py3.11-pyyaml # upstream-tests: runtime dependency
      - py3.11-setuptools # upstream-tests: runtime dependency
      - py3.11-six # upstream-tests: runtime dependency
      - py3.11-urllib3 # upstream-tests: runtime dependency
      - py3.12-aiohttp # upstream-tests: runtime dependency
      - py3.12-certifi # upstream-tests: runtime dependency
      - py3.12-dateutil # upstream-tests: runtime dependency
      - py3.12-pyyaml # upstream-tests: runtime dependency
      - py3.12-setuptools # upstream-tests: runtime dependency
      - py3.12-six # upstream-tests: runtime dependency
      - py3.12-urllib3 # upstream-tests: runtime dependency
      - py3.13-aiohttp # upstream-tests: runtime dependency
      - py3.13-certifi # upstream-tests: runtime dependency
      - py3.13-dateutil # upstream-tests: runtime dependency
      - py3.13-pyyaml # upstream-tests: runtime dependency
      - py3.13-setuptools # upstream-tests: runtime dependency
      - py3.13-six # upstream-tests: runtime dependency
      - py3.13-urllib3 # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tomplus/kubernetes_asyncio
      expected-commit: 7ddbf3037cdb0f9a152c9f0c06e003fc5fc98db5
      tag: ${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-aiohttp
        - py${{range.key}}-certifi
        - py${{range.key}}-dateutil
        - py${{range.key}}-pyyaml
        - py${{range.key}}-setuptools
        - py${{range.key}}-six
        - py${{range.key}}-urllib3
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: tomplus/kubernetes_asyncio
    use-tag: true
