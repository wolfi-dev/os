package:
  name: py3-lxml
  version: "6.2.0"
  epoch: 0 # rebuild to publish py3-lxml-source
  description: Powerful and Pythonic XML processing library combining libxml2/libxslt with the ElementTree API.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "2"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: lxml
  import: lxml

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - cython
      - gcc
      - glibc-2.44-dev
      - libxml2-dev
      - libxslt-dev
      - py3-supported-build-base-dev
      - py3-supported-cython
  environment:
    CFLAGS: -Wno-incompatible-pointer-types

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7023d3972746ef365185c4d8731c259f534e682c
      repository: https://github.com/lxml/lxml
      tag: lxml-${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}
              from ${{vars.import}} import etree

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: lxml/lxml
    strip-prefix: lxml-
    use-tag: true
  ignore-regex-patterns:
    - (.*)(a|b|rc)(.*) # Ignore alpha, beta, and rc releases
