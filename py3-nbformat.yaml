package:
  name: py3-nbformat
  version: "5.11.1"
  epoch: 1 # upstream-tests/pytest
  description: The Jupyter Notebook format
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: nbformat
  import: nbformat

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-hatch-nodejs-version
      - py3-supported-hatchling
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-fastjsonschema # upstream-tests: runtime dependency
      - py3.10-jsonschema # upstream-tests: runtime dependency
      - py3.10-jupyter-core # upstream-tests: runtime dependency
      - py3.10-packaging # upstream-tests: test dependency
      - py3.10-testpath # upstream-tests: test dependency
      - py3.10-traitlets # upstream-tests: runtime dependency
      - py3.11-fastjsonschema # upstream-tests: runtime dependency
      - py3.11-jsonschema # upstream-tests: runtime dependency
      - py3.11-jupyter-core # upstream-tests: runtime dependency
      - py3.11-packaging # upstream-tests: test dependency
      - py3.11-testpath # upstream-tests: test dependency
      - py3.11-traitlets # upstream-tests: runtime dependency
      - py3.12-fastjsonschema # upstream-tests: runtime dependency
      - py3.12-jsonschema # upstream-tests: runtime dependency
      - py3.12-jupyter-core # upstream-tests: runtime dependency
      - py3.12-packaging # upstream-tests: test dependency
      - py3.12-testpath # upstream-tests: test dependency
      - py3.12-traitlets # upstream-tests: runtime dependency
      - py3.13-fastjsonschema # upstream-tests: runtime dependency
      - py3.13-jsonschema # upstream-tests: runtime dependency
      - py3.13-jupyter-core # upstream-tests: runtime dependency
      - py3.13-packaging # upstream-tests: test dependency
      - py3.13-testpath # upstream-tests: test dependency
      - py3.13-traitlets # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyter/nbformat
      tag: v${{package.version}}
      expected-commit: 75f819f5b60bc6ffc72145c364132efe5b3c4b35

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-fastjsonschema
        - py${{range.key}}-jsonschema
        - py${{range.key}}-jupyter-core
        - py${{range.key}}-traitlets
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - name: move usr/bin executables for -bin
        runs: |
          mkdir -p ./cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./cleanup/${{range.key}}/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - apk-tools
      pipeline:
        - runs: |
            apk info -L py${{range.key}}-${{vars.pypi-package}}-bin > "pkg.list"
            echo "Please write a test for these:"
            grep usr/bin/ pkg.list > bins.list
            sed 's,^,> ,' bins.list

            while read line; do
              echo "== $line =="
              if ! "/$line" --help; then
                echo "ERROR: /$line --help exited non-zero"
                exit 1
              fi
            done < bins.list

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}
    - runs: |
        jupyter-trust --version
        jupyter-trust --help

update:
  enabled: true
  github:
    identifier: jupyter/nbformat
    tag-filter-prefix: v
    strip-prefix: v
