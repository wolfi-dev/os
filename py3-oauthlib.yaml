package:
  name: py3-oauthlib
  version: "4.0.1"
  epoch: 1 # upstream-tests/pytest
  description: A generic, spec-compliant, thorough implementation of the OAuth request-signing logic
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0

vars:
  pypi-package: oauthlib
  import: oauthlib

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-blinker # upstream-tests: test dependency
      - py3.10-cryptography # upstream-tests: test dependency
      - py3.10-pyjwt # upstream-tests: test dependency
      - py3.11-blinker # upstream-tests: test dependency
      - py3.11-cryptography # upstream-tests: test dependency
      - py3.11-pyjwt # upstream-tests: test dependency
      - py3.12-blinker # upstream-tests: test dependency
      - py3.12-cryptography # upstream-tests: test dependency
      - py3.12-pyjwt # upstream-tests: test dependency
      - py3.13-blinker # upstream-tests: test dependency
      - py3.13-cryptography # upstream-tests: test dependency
      - py3.13-pyjwt # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/oauthlib/oauthlib
      tag: v${{package.version}}
      expected-commit: 6e3aa05af92978755939a18cb4dd655ced156c1e

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: oauthlib/oauthlib
    strip-prefix: v
