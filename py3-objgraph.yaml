package:
  name: py3-objgraph
  version: "3.7.0"
  epoch: 0
  description: Draws Python object reference graphs with graphviz, for exploring object graphs and hunting memory leaks
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0

vars:
  pypi-package: objgraph
  import: objgraph

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mgedmin/objgraph
      tag: ${{package.version}}
      expected-commit: f640dccea2a888ea83ae5471667e65dd41c9b7e6

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}
        - name: Count, track growth and find reference chains
          runs: |
            python${{range.key}} - <<'EOF'
            import objgraph

            class LeakMarker:
                pass

            keep = [LeakMarker() for _ in range(7)]
            assert objgraph.count('LeakMarker') == 7, objgraph.count('LeakMarker')
            assert len(objgraph.by_type('LeakMarker')) == 7

            # The first growth() call only records the baseline peak counts.
            objgraph.growth()
            keep.extend(LeakMarker() for _ in range(3))
            deltas = {name: (total, delta) for name, total, delta in objgraph.growth()}
            assert deltas.get('LeakMarker') == (10, 3), deltas

            # keep lives in __main__'s globals, so a chain from a module must exist.
            chain = objgraph.find_backref_chain(keep[0], objgraph.is_proper_module)
            assert chain[-1] is keep[0], chain
            assert objgraph.is_proper_module(chain[0]), chain[0]
            print("objgraph API OK")
            EOF
        - name: Write a reference graph without graphviz
          runs: |
            work="$(mktemp -d)"
            # A .dot filename makes objgraph write the graph source directly instead of calling dot.
            python${{range.key}} -c "import objgraph; objgraph.show_refs([{'answer': 42}], filename='$work/refs.dot')" > "$work/out.txt"
            cat "$work/out.txt"
            grep -F "refs.dot" "$work/out.txt"
            grep -F "digraph" "$work/refs.dot"
            grep -F "answer" "$work/refs.dot"
        - name: show_most_common_types reports live types
          runs: |
            python${{range.key}} -c "import objgraph; objgraph.show_most_common_types(limit=5)" > types.txt
            cat types.txt
            grep -E "^function +[0-9]+" types.txt

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

test:
  pipeline:
    - uses: test/tw/byproductpackage

update:
  enabled: true
  github:
    identifier: mgedmin/objgraph
    use-tag: true
