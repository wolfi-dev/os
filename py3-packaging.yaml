package:
  name: py3-packaging
  version: "26.3"
  epoch: 1 # upstream-tests/pytest
  description: core utilities for python3 packaging
  copyright:
    - license: Apache-2.0 AND BSD-2-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: packaging

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3-supported-python
      - py3.10-pretend # upstream-tests: test dependency
      - py3.10-pyparsing # upstream-tests: runtime dependency
      - py3.10-tomli-w # upstream-tests: test dependency
      - py3.11-hypothesis # upstream-tests: test dependency
      - py3.11-pretend # upstream-tests: test dependency
      - py3.11-pyparsing # upstream-tests: runtime dependency
      - py3.11-tomli-w # upstream-tests: test dependency
      - py3.12-hypothesis # upstream-tests: test dependency
      - py3.12-pretend # upstream-tests: test dependency
      - py3.12-pyparsing # upstream-tests: runtime dependency
      - py3.12-tomli-w # upstream-tests: test dependency
      - py3.13-hypothesis # upstream-tests: test dependency
      - py3.13-pretend # upstream-tests: test dependency
      - py3.13-pyparsing # upstream-tests: runtime dependency
      - py3.13-tomli-w # upstream-tests: test dependency
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/packaging.git
      tag: ${{package.version}}
      expected-commit: 929fd4b1410ac7ef61ef3f45b2f5d7e87711a9b5

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-pyparsing
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      # hypothesis 6.170 requires Python >= 3.11 (no py3.10-hypothesis by design).
      - if: "'${{range.key}}' != '3.10'"
        uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  ignore-regex-patterns:
    - a
    - b
    - rc
    - post
  github:
    identifier: pypa/packaging

test:
  pipeline:
    - uses: test/tw/byproductpackage
