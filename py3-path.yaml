package:
  name: py3-path
  version: "17.1.1"
  epoch: 4 # upstream-tests/pytest
  description: "Implements path objects as first-class entities, allowing common operations on files to be invoked on those path objects directly,"
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: path

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-appdirs # upstream-tests: test dependency
      - py3.10-autocommand # upstream-tests: runtime dependency
      - py3.10-jaraco.context # upstream-tests: runtime dependency
      - py3.10-jaraco.functools # upstream-tests: runtime dependency
      - py3.10-more-itertools # upstream-tests: test dependency
      - py3.10-packaging # upstream-tests: test dependency
      - py3.10-pygments # upstream-tests: test dependency
      - py3.11-appdirs # upstream-tests: test dependency
      - py3.11-autocommand # upstream-tests: runtime dependency
      - py3.11-jaraco.context # upstream-tests: runtime dependency
      - py3.11-jaraco.functools # upstream-tests: runtime dependency
      - py3.11-more-itertools # upstream-tests: test dependency
      - py3.11-packaging # upstream-tests: test dependency
      - py3.11-pygments # upstream-tests: test dependency
      - py3.12-appdirs # upstream-tests: test dependency
      - py3.12-autocommand # upstream-tests: runtime dependency
      - py3.12-jaraco.context # upstream-tests: runtime dependency
      - py3.12-jaraco.functools # upstream-tests: runtime dependency
      - py3.12-more-itertools # upstream-tests: test dependency
      - py3.12-packaging # upstream-tests: test dependency
      - py3.12-pygments # upstream-tests: test dependency
      - py3.13-appdirs # upstream-tests: test dependency
      - py3.13-autocommand # upstream-tests: runtime dependency
      - py3.13-jaraco.context # upstream-tests: runtime dependency
      - py3.13-jaraco.functools # upstream-tests: runtime dependency
      - py3.13-more-itertools # upstream-tests: test dependency
      - py3.13-packaging # upstream-tests: test dependency
      - py3.13-pygments # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jaraco/path
      tag: v${{package.version}}
      expected-commit: 0f86209f11199ceaff788c73f96ea5b5ec2318ee

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-jaraco.functools
        - py${{range.key}}-jaraco.context
        - py${{range.key}}-more-itertools
        - py${{range.key}}-autocommand
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - py${{range.key}}-pytest
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - uses: git-checkout
          with:
            repository: https://github.com/jaraco/path
            tag: v${{package.version}}
            expected-commit: 0f86209f11199ceaff788c73f96ea5b5ec2318ee
        - runs: |
            python${{range.key}} -m pytest tests/

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.pypi-package}}

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.pypi-package}}

update:
  enabled: true
  manual: false
  github:
    identifier: jaraco/path
    strip-prefix: v
