# This package provides a binary wheel for python-3.XX packages
# in lieu of ensurepip's bundled wheels.  It allows us to proctively
# update those wheels by tracking the upstream package release.
# python is compiled with --with-wheel-pkg-dir=/usr/share/python-wheels
package:
  name: py3-pip-wheel-bootstrap
  version: "26.3"
  epoch: 2 # fetch the wheel from Chainguard Libraries
  description: "python3 pip wheel from pypi"
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
    provides:
      - py3-pip-wheel
  resources:
    cpu: "2"
    memory: 2Gi

vars:
  # PyPI's sha256 for the wheel at package.version: digests.sha256 of this file in
  # https://pypi.org/pypi/pip/<version>/json. Update it with every version bump.
  wheel-sha256: f3b60b20ffaadd4415ed7957212a38ac63fa4c5fa375bd0f4a797777940fad13

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: auth/libraries

  - name: Fetch pip wheel from Chainguard Libraries
    runs: |
      whl="pip-${{package.version}}-py3-none-any.whl"
      index="https://libraries.cgr.dev/python-upstream/simple/pip/"
      url=$(curl --netrc --fail -sSL "$index" | grep -o "href=\"[^\"#]*/$whl[\"#]" | head -n 1 | sed -e 's/^href="//' -e 's/.$//')
      if [ -z "$url" ]; then
        echo "$whl is not in $index"
        exit 1
      fi
      curl --netrc --fail -sSLo "$whl" "$url"
      echo "${{vars.wheel-sha256}}  $whl" | sha256sum -c
      rm -f /root/.netrc /home/build/.netrc

  - name: Install wheel
    runs: |
      wdir="${{targets.destdir}}/usr/share/python-wheels"
      mkdir -p "$wdir"
      cp -v ./*.whl "$wdir"

update:
  enabled: true
  release-monitor:
    identifier: 6529

test:
  environment:
    contents:
      packages:
        - py3-pip
  pipeline:
    - name: verify-wheel-file
      runs: |
        # Check that wheel file exists in correct location
        test -f /usr/share/python-wheels/pip-${{package.version}}-py3-none-any.whl

        # Validate wheel installation usig pip
        pip install --force-reinstall /usr/share/python-wheels/pip-${{package.version}}-py3-none-any.whl
        pip --version
