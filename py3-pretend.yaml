package:
  name: py3-pretend
  version: "1.0.9"
  epoch: 0
  description: A library for stubbing in Python tests, providing stub, raiser and call_recorder helpers.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0

vars:
  pypi-package: pretend
  import: pretend

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: fed40c9cd3e6aa108fa5043c01ac668b4c2808ed
      repository: https://github.com/alex/pretend
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
          with:
            python: python${{range.key}}
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}
              from pretend import stub, raiser, call_recorder, call
        - name: call_recorder wraps a function and records calls
          runs: |
            python${{range.key}} -c 'from pretend import call_recorder, call; f = call_recorder(lambda a: a + 2); assert f(3) == 5; assert f.calls == [call(3)]'
            python${{range.key}} - <<'EOF'
            from pretend import call_recorder, call
            f = call_recorder(lambda *a, **kw: (a, kw))
            assert f(1, b=2) == ((1,), {"b": 2})
            f("x")
            assert f.calls == [call(1, b=2), call("x")], f.calls
            assert f.calls[0] != call(1, b=3)
            print("call_recorder OK:", f.calls)
            EOF
        - name: stub returns pre-canned attributes and methods
          runs: |
            python${{range.key}} -c 'from pretend import stub; x = stub(country_code=lambda: "US"); assert x.country_code() == "US"'
            out=$(python${{range.key}} -c 'from pretend import stub; s = stub(x=1, name="alice"); assert s.x == 1; print(s.name)')
            echo "$out"
            [ "$out" = "alice" ]
        - name: raiser raises the configured exception
          runs: |
            python${{range.key}} - <<'EOF'
            from pretend import raiser, stub
            f = raiser(ValueError("boom"))
            try:
                f(1, key="ignored")
            except ValueError as e:
                assert str(e) == "boom"
            else:
                raise SystemExit("raiser did not raise")
            s = stub(close=raiser(KeyError))
            try:
                s.close()
            except KeyError:
                pass
            else:
                raise SystemExit("stub method from raiser did not raise")
            # raiser rejects values that are not exceptions
            try:
                raiser(42)
            except TypeError:
                pass
            else:
                raise SystemExit("raiser accepted a non-exception")
            print("raiser OK")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: true
  github:
    identifier: alex/pretend
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/byproductpackage
