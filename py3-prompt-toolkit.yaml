package:
  name: py3-prompt-toolkit
  version: "3.0.53"
  epoch: 1 # upstream-tests/pytest
  description: Library for building powerful interactive command lines in Python
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: prompt-toolkit
  import: prompt_toolkit

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-asyncssh # upstream-tests: test dependency
      - py3.10-wcwidth # upstream-tests: runtime dependency
      - py3.11-asyncssh # upstream-tests: test dependency
      - py3.11-wcwidth # upstream-tests: runtime dependency
      - py3.12-asyncssh # upstream-tests: test dependency
      - py3.12-wcwidth # upstream-tests: runtime dependency
      - py3.13-asyncssh # upstream-tests: test dependency
      - py3.13-wcwidth # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prompt-toolkit/python-prompt-toolkit
      tag: ${{package.version}}
      expected-commit: 583b3412c792a5cc9f01adde603679f3824a88f3

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-wcwidth
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: prompt-toolkit/python-prompt-toolkit
