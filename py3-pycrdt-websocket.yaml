package:
  name: py3-pycrdt-websocket
  version: 0.15.5
  epoch: 5
  description: pycrdt-websocket is an async WebSocket connector for pycrdt.
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0

vars:
  import: pycrdt_websocket
  pypi-package: pycrdt-websocket

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7daeef9d0135f712dda5c7af742cc47610b95eae
      repository: https://github.com/jupyter-server/pycrdt-websocket
      tag: v${{package.version}}

  # Upstream pins pycrdt <0.13.0, but Wolfi ships pycrdt 0.14.x, which
  # the upstream test suite passes against. Relax the upper bound so
  # pip check succeeds.
  - runs: |
      grep -q '"pycrdt >=0.12.13,<0.13.0"' pyproject.toml
      sed -i 's/"pycrdt >=0.12.13,<0.13.0"/"pycrdt >=0.12.13,<0.15.0"/' pyproject.toml
      grep -q '"pycrdt >=0.12.13,<0.15.0"' pyproject.toml

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-anyio
        - py${{range.key}}-pycrdt
        - py${{range.key}}-sqlite-anyio
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test importing key components
          uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              from ${{vars.import}} import ASGIServer, WebsocketServer
              from ${{vars.import}} import WebsocketProvider
              from ${{vars.import}}.websocket import HttpxWebsocket

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  github:
    identifier: jupyter-server/pycrdt-websocket
    tag-filter: v
    strip-prefix: v

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
