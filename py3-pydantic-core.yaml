# Generated from https://pypi.org/project/pydantic-core/
package:
  name: py3-pydantic-core
  version: "2.50.0"
  epoch: 0 # rust: 1.98->1.99
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "2"
    memory: 10Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - maturin
      - py3-supported-build
      - py3-supported-installer
      - py3-supported-maturin
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-typing-extensions
      - py3-supported-wheel
      - rust-${{vars.rust-version}}
      - wolfi-base

vars:
  pypi-package: pydantic-core
  module-name: pydantic_core
  rust-version: "1.99"

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

pipeline:
  - uses: git-checkout
    with:
      expected-commit: fcdefa7198c4fc94a22eecf1a5b7926e20b9fc8a
      repository: https://github.com/pydantic/pydantic
      tag: core-v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-typing-extensions
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - working-directory: pydantic-core
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.module-name}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        import: ${{vars.module-name}}

update:
  enabled: true
  # py3-pydantic always has a strict dependency on a specific py3-pydantic-core
  # version, so ensure that we build packages for every -core release
  require-sequential: true
  git:
    strip-prefix: core-v
    tag-filter-prefix: core-v
