# Generated from https://pypi.org/project/PyGithub/
package:
  name: py3-pygithub
  version: "2.10.0"
  epoch: 1 # runtime: add cryptography (pyjwt[crypto])
  description: Use the full Github API v3
  copyright:
    - license: LGPL-3.0-or-later OR GPL-3.0-or-later
  dependencies:
    provider-priority: "0"
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  module_name: github
  pypi-package: pygithub

data:
  - name: py-versions
    items:
      "3.10": "310"
      "3.11": "311"
      "3.12": "312"
      "3.13": "313"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5cdf6ab395c52efb652d0bc1f28fdf2e452b1b41
      repository: https://github.com/pygithub/pygithub
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - name: Python Build
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-cffi
        # upstream requires pyjwt[crypto]: GitHub App auth signs RS256 JWTs
        - py${{range.key}}-cryptography
        - py${{range.key}}-pynacl
        - py${{range.key}}-python-dateutil
        - py${{range.key}}-requests
        - py${{range.key}}-pyjwt
        - py${{range.key}}-typing-extensions
        - py${{range.key}}-urllib3
        - py${{range.key}}-deprecated
      provides:
        - py3-${{vars.pypi-package}}
        - py3-PyGithub=${{package.full-version}}
      provider-priority: ${{range.value}}
    test:
      pipeline:
        - uses: test/tw/pip-check
        - name: Import Test
          uses: python/import
          with:
            imports: |
              from ${{vars.module_name}} import Github
        - name: GitHub App auth signs an RS256 JWT (needs cryptography)
          runs: |
            python${{range.key}} - <<'EOF'
            from cryptography.hazmat.primitives import serialization
            from cryptography.hazmat.primitives.asymmetric import rsa
            from github import Auth
            import jwt

            key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
            pem = key.private_bytes(serialization.Encoding.PEM,
                                    serialization.PrivateFormat.PKCS8,
                                    serialization.NoEncryption()).decode()
            token = Auth.AppAuth(123456, pem).create_jwt()
            claims = jwt.decode(token, key.public_key(), algorithms=["RS256"])
            assert claims["iss"] == "123456", claims
            print("RS256 app JWT ok")
            EOF

update:
  # There are some versions with post in it, ignore them
  ignore-regex-patterns:
    - post
  enabled: true
  github:
    identifier: pygithub/pygithub
    strip-prefix: v

test:
  pipeline:
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
