package:
  name: py3-pytest-asyncio
  version: "1.4.1"
  epoch: 0
  description: pytest plugin that runs asyncio coroutines as tests and fixtures
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

vars:
  pypi-package: pytest-asyncio
  import: pytest_asyncio

# Python 3.10 is built by the explicit py3.10 subpackage below, because it
# alone needs backports.asyncio.runner (upstream: python_version<'3.11').
data:
  - name: py-versions
    items:
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-setuptools
      - py3-supported-setuptools-scm
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytest-dev/pytest-asyncio
      tag: v${{package.version}}
      expected-commit: 6af7f5c9a8c77fe5040b9d368b9ed01837c25652

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-pytest
        # Upstream needs typing-extensions only on python<3.13.
        - py${{range.key}}-typing-extensions
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
          with:
            python: python${{range.key}}
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}
              from ${{vars.import}} import fixture, is_async_test
        - name: strict/auto modes, async fixtures, loop_scope, explicit plugin load
          runs: sh ./run-tests.sh python${{range.key}}

  - name: py3.10-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python3.10
    dependencies:
      runtime:
        - py3.10-backports.asyncio.runner
        - py3.10-pytest
        - py3.10-typing-extensions
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: '310'
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python3.10
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
          with:
            python: python3.10
        - uses: python/import
          with:
            python: python3.10
            imports: |
              import ${{vars.import}}
              from ${{vars.import}} import fixture, is_async_test
        - name: strict/auto modes, async fixtures, loop_scope, explicit plugin load
          runs: sh ./run-tests.sh python3.10

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

test:
  pipeline:
    - uses: test/tw/byproductpackage

update:
  enabled: true
  github:
    identifier: pytest-dev/pytest-asyncio
    strip-prefix: v
