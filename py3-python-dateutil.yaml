#nolint:valid-pipeline-git-checkout-tag
package:
  name: py3-python-dateutil
  version: "4.0.0"
  epoch: 0 # go/wolfi-rsc/py3-python-dateutil
  description: Extensions to the standard Python datetime module
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0
  resources:
    cpu: "3"
    memory: 5Gi

environment:
  contents:
    packages:
      - busybox
      - py3-supported-build-base
      - py3-supported-hatch-fancy-pypi-readme
      - py3-supported-hatch-vcs
      - py3-supported-hatchling
      - py3-supported-requests
      - py3-supported-six
      # py3-supported-hatch* only cover python 3.10-3.13; the python 3.14
      # build needs the dedicated py3.14 build backends.
      - py3.14-hatch-fancy-pypi-readme
      - py3.14-hatch-vcs
      - py3.14-hatchling
      - tzutils
      - wolfi-base
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}

vars:
  pypi-package: dateutil
  typeshed-package: types-python-dateutil
  typeshed-import: types.python.dateutil

data:
  - name: py-versions
    items:
      3.11: '311'
      3.12: '312'
      3.13: '313'
      3.14: '314'

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a78cbd81d5d03b5f126eb36edb92bca78972c804
      repository: https://github.com/dateutil/dateutil
      tag: ${{package.version}}

  - uses: git-checkout
    with:
      destination: typeshed
      repository: https://github.com/python/typeshed
      branch: main
      expected-commit: 58c33f3da508976e26d681039bb9a255f9509f5c

  - uses: git-checkout
    with:
      destination: stub_uploader
      repository: https://github.com/typeshed-internal/stub_uploader
      branch: main
      # Last commit before build_wheel.py began requiring twine package
      # metadata (a4373e67), as twine is not packaged.
      expected-commit: 652494be984c436b22e9546e6e50a8896744141c

subpackages:
  - range: py-versions
    name: py${{range.key}}-python-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-six
        - py${{range.key}}-tzdata
      provides:
        - py3-python-dateutil
        - py3-${{vars.pypi-package}}
        - py${{range.key}}-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - name: validate zoneinfo (tzdata-backed)
          runs: |
            # as of 3.0.0 dateutil.zoneinfo is a wrapper around the tzdata package
            python${{range.key}} -W ignore::DeprecationWarning <<EOF
            from dateutil.zoneinfo import get_zonefile_instance
            zif = get_zonefile_instance()
            assert zif.zones, "no zones loaded from tzdata"
            assert zif.get("America/New_York") is not None, "America/New_York missing"
            print("PASS: dateutil.zoneinfo loaded zones from tzdata")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
        - py3.14-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

  - range: py-versions
    name: py${{range.key}}-${{vars.typeshed-package}}
    description: python${{range.key}} version of ${{vars.typeshed-package}}
    pipeline:
      - working-directory: stub_uploader
        runs: |
          export PYTHONPATH=$(pwd)
          builddir="build/${{range.key}}"
          mkdir -p "$builddir"
          python3.13 ./stub_uploader/build_wheel.py --build-dir "$builddir" \
            ../typeshed python-dateutil ${{package.version}}
          pip${{range.key}} install --no-index --no-build-isolation --no-deps \
            --prefix=/usr --root=${{targets.subpkgdir}} "$builddir"/dist/*.whl
    test:
      pipeline:
        - uses: test/tw/pip-check

  - name: py3-supported-${{vars.typeshed-package}}
    description: meta package providing ${{vars.typeshed-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.typeshed-package}}
        - py3.12-${{vars.typeshed-package}}
        - py3.13-${{vars.typeshed-package}}
        - py3.14-${{vars.typeshed-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  manual: false
  ignore-regex-patterns:
    - post
  github:
    identifier: dateutil/dateutil

test:
  pipeline:
    - uses: test/tw/byproductpackage
