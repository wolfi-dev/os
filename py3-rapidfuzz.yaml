# Generated from https://pypi.org/project/rapidfuzz/
package:
  name: py3-rapidfuzz
  version: "3.14.6"
  epoch: 2 # go/wolfi-rsc/py3-rapidfuzz
  description: rapid fuzzy string matching
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: rapidfuzz

data:
  - name: py-versions
    items:
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - py3-supported-cython # generates the C++ extension sources
      - py3-supported-packaging
      - py3-supported-pip
      - py3-supported-python-dev # Python headers, so the C extension builds
      - py3-supported-scikit-build-core
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/maxbachmann/RapidFuzz
      tag: v${{package.version}}
      expected-commit: d1b4a183f9ee445134989f4ebbf1e4acfacd4ed7
      recurse-submodules: true # extern/taskflow and extern/rapidfuzz-cpp are needed for the C++ extensions

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-scikit-build
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - name: Compiled extension shipped and loads
          runs: |
            python${{range.key}} -c "import importlib.machinery as m, rapidfuzz.fuzz_cpp as e; assert e.__file__.endswith(tuple(m.EXTENSION_SUFFIXES)), e.__file__"
            RAPIDFUZZ_IMPLEMENTATION=cpp python${{range.key}} -c "from rapidfuzz import fuzz, process; assert fuzz.ratio('this is a test', 'this is a test!') > 90"

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  github:
    identifier: maxbachmann/RapidFuzz
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/byproductpackage
