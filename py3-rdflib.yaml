package:
  name: py3-rdflib
  version: "7.6.0"
  epoch: 2 # go/wolfi-rsc/py3-rdflib
  description: RDFLib is a Python library for working with RDF, a simple yet powerful language for representing information.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: rdflib
  import: rdflib

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-poetry

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/RDFLib/rdflib
      tag: ${{package.version}}
      expected-commit: 8b32146a0f9cb748c2068662e50d02b42fc86dfd

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-html5lib
        - py${{range.key}}-isodate
        - py${{range.key}}-pyparsing
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: move usr/bin executables for -bin
        runs: |
          mkdir -p ./cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./cleanup/${{range.key}}/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - apk-tools
      pipeline:
        - runs: |
            apk info -L py${{range.key}}-${{vars.pypi-package}}-bin > "pkg.list"
            for bin in csv2rdf rdf2dot rdfgraphisomorphism rdfpipe rdfs2dot sparqlquery; do
              grep -qx "usr/bin/$bin" pkg.list
            done

            cat > test.ttl <<'EOF'
            @prefix ex: <http://example.org/> .
            @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
            ex:a ex:p ex:b .
            ex:C a rdfs:Class .
            ex:p rdfs:domain ex:C .
            EOF
            printf 'name,age\nalice,30\n' > test.csv

            # csv2rdf --help prints usage then exits non-zero by design
            csv2rdf --help > csv2rdf-help.txt || true
            grep -q "Reads csv files" csv2rdf-help.txt
            csv2rdf -b http://example.org/i/ -p http://example.org/p/ test.csv | grep -q '"alice"'
            rdf2dot test.ttl | grep -q digraph
            rdfs2dot test.ttl | grep -q digraph
            rdfgraphisomorphism --help
            rdfpipe --help
            rdfpipe -o nt test.ttl | grep -q "http://example.org/a"
            sparqlquery --help
            sparqlquery -q 'SELECT ?s WHERE { ?s ?p ?o }' test.ttl | grep -q "http://example.org/a"

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}
    - runs: |
        rdfgraphisomorphism --help
        rdfpipe --version
        rdfpipe --help

update:
  enabled: true
  github:
    identifier: RDFLib/rdflib
