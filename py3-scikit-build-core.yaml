# Generated from https://pypi.org/project/scikit-build-core/
package:
  name: py3-scikit-build-core
  version: "1.1.0"
  epoch: 0
  description: Build backend for CMake based projects
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-hatch-vcs
      - py3-supported-hatchling
      - py3-supported-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0c3a237f4c013517f3a1baf870d2bc0cfee2a9aa
      repository: https://github.com/scikit-build/scikit-build-core
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - name: Python Build
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-exceptiongroup
        - py${{range.key}}-importlib-metadata
        - py${{range.key}}-importlib-resources
        - py${{range.key}}-packaging
        - py${{range.key}}-pathspec
        - py${{range.key}}-tomli
        - py${{range.key}}-typing-extensions
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    test:
      pipeline:
        - uses: test/tw/pip-check
        - name: Import Test
          uses: python/import
          with:
            import: ${{vars.module_name}}
            python: python${{range.key}}

  # scikit-build-core 1.0.0 added the `scikit-build` and `scikit-build-core`
  # console scripts (pyproject.toml [project.scripts]). melange turns every
  # file in usr/bin into a versioned `cmd:` provide, so with the scripts left
  # in the module packages the four py3.X variants could not be installed
  # together (apk: "already provides cmd:scikit-build-core"). Packages that
  # build wheels for several interpreters need all four modules at once, so
  # the scripts move into -bin subpackages, as py3-hatchling and py3-build do.
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr
          mv ${{targets.contextdir}}/../py${{range.key}}-${{vars.pypi-package}}/usr/bin ${{targets.contextdir}}/usr
    test:
      pipeline:
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}
        - runs: |
            stat /usr/bin/scikit-build /usr/bin/scikit-build-core
            scikit-build --help
            scikit-build builder --help

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        # Import on every interpreter and check the version. The old test imported
        # on python3.10 only and passed while 3.11 to 3.13 resolved to 0.12.2.
        - runs: |
            for py in python3.10 python3.11 python3.12 python3.13; do
              "$py" -c 'import sys, scikit_build_core; v = scikit_build_core.__version__; assert v == sys.argv[1], f"{sys.executable}: {v} != {sys.argv[1]}"; print(sys.executable, v)' "${{package.version}}"
            done

data:
  - name: py-versions
    items:
      '3.10': '310'
      '3.11': '311'
      '3.12': '312'
      '3.13': '313'

update:
  enabled: true
  manual: false
  github:
    identifier: scikit-build/scikit-build-core
    use-tag: true
    strip-prefix: v

vars:
  module_name: scikit_build_core
  pypi-package: scikit-build-core

test:
  pipeline:
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
