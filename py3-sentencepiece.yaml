package:
  name: py3-sentencepiece
  version: "0.2.2"
  epoch: 1 # glibc: 2.43->2.44
  description: SentencePiece is an unsupervised text tokenizer and detokenizer
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "8"
    memory: 18Gi

vars:
  pypi-package: sentencepiece

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - glibc-2.44-dev
      - py3-supported-pip
      - py3-supported-python-dev
  environment:
    # https://github.com/wolfi-dev/os/issues/34075
    CXXFLAGS: -fdelete-null-pointer-checks

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google/sentencepiece.git
      tag: v${{package.version}}
      expected-commit: e0cce7d37b065b5140349dbe12c6bcf6192fdd78

  - uses: cmake/configure

  - uses: patch
    with:
      patches: fix-bundled-absl-gcc16.patch

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py3-sentencepiece
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - runs: |
          cd python
          # Pre-configure cmake to trigger the abseil-cpp git fetch/checkout
          # and create the FetchContent stamp file. This prevents
          # build_bundled.sh from re-downloading abseil-cpp (which would
          # overwrite the GCC 16 patch applied below).
          cmake .. -B build \
            -DSPM_ENABLE_SHARED=OFF \
            -DSPM_DISABLE_EMBEDDED_DATA=ON \
            -DCMAKE_INSTALL_PREFIX=build/root \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            "-DCMAKE_CXX_FLAGS=-fPIC -fvisibility=default -ffunction-sections -fdata-sections"
          # Apply the GCC 16 fix to the freshly downloaded/updated abseil-cpp.
          # Use --forward to skip gracefully if already applied (e.g., for
          # subsequent Python versions sharing the same build directory).
          # See https://github.com/wolfi-dev/os/issues/34075
          patch -p1 -d .. --forward < ../fix-bundled-absl-gcc16.patch || true
          cd ..
          python${{range.key}} -m pip install ./python "--root=${{targets.subpkgdir}}" --prefix=/usr
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/pkgconf
    - uses: python/import
      with:
        import: ${{vars.pypi-package}}
    - uses: test/tw/ldd-check

update:
  enabled: true
  manual: false
  github:
    identifier: google/sentencepiece
    strip-prefix: v
