# Generated from https://pypi.org/project/setuptools-gettext/
package:
  name: py3-setuptools-gettext
  version: "0.1.20"
  epoch: 1 # upstream-tests/pytest
  description: Setuptools gettext extension plugin
  copyright:
    - license: "GPL-2.0-or-later"
  dependencies:
    provider-priority: "0"

vars:
  import: setuptools_gettext
  pypi-package: setuptools-gettext

data:
  - name: py-versions
    items:
      "3.10": "310"
      "3.11": "311"
      "3.12": "312"
      "3.13": "313"

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-setuptools # upstream-tests: runtime dependency
      - py3.10-tomli # upstream-tests: runtime dependency
      - py3.11-setuptools # upstream-tests: runtime dependency
      - py3.11-tomli # upstream-tests: runtime dependency
      - py3.12-setuptools # upstream-tests: runtime dependency
      - py3.12-tomli # upstream-tests: runtime dependency
      - py3.13-setuptools # upstream-tests: runtime dependency
      - py3.13-tomli # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d45923270c81efe9a77c684b68598af0d58c7839
      repository: https://github.com/breezy-team/setuptools-gettext
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - name: Python Build
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-setuptools
        - py${{range.key}}-tomli
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    test:
      pipeline:
        - uses: test/tw/pip-check
        - name: Import Test
          uses: python/import
          with:
            import: ${{vars.import}}
            python: python${{range.key}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.import}}

update:
  enabled: true
  manual: false
  github:
    identifier: breezy-team/setuptools-gettext
    strip-prefix: v
    use-tag: true
  ignore-regex-patterns:
    - ^debian/.*
    - ^upstream/.*
