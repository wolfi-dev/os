# This package provides a binary wheel for python-3.XX packages
# in lieu of ensurepip's bundled wheels.  It allows us to proctively
# update those wheels by tracking the upstream package release.
# python is compiled with --with-wheel-pkg-dir=/usr/share/python-wheels
package:
  name: py3-setuptools-wheel
  version: "84.2.1"
  epoch: 2 # fetch the wheel from Chainguard Libraries
  description: "python3 setuptools wheel from pypi"
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"

vars:
  # PyPI's sha256 for the wheel at package.version: digests.sha256 of this file in
  # https://pypi.org/pypi/setuptools/<version>/json. Update it with every version bump.
  wheel-sha256: ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: auth/libraries

  - name: Fetch setuptools wheel from Chainguard Libraries
    runs: |
      whl="setuptools-${{package.version}}-py3-none-any.whl"
      index="https://libraries.cgr.dev/python-upstream/simple/setuptools/"
      url=$(curl --netrc --fail -sSL "$index" | grep -o "href=\"[^\"#]*/$whl[\"#]" | head -n 1 | sed -e 's/^href="//' -e 's/.$//')
      if [ -z "$url" ]; then
        echo "$whl is not in $index"
        exit 1
      fi
      curl --netrc --fail -sSLo "$whl" "$url"
      echo "${{vars.wheel-sha256}}  $whl" | sha256sum -c
      rm -f /root/.netrc /home/build/.netrc

  - name: Install wheel
    runs: |
      wdir="${{targets.destdir}}/usr/share/python-wheels"
      mkdir -p "$wdir"
      cp -v *.whl "$wdir"

test:
  environment:
    contents:
      packages:
        - python3
        - py3-pip
  pipeline:
    - name: Install provided wheel
      runs: pip install /usr/share/python-wheels/setuptools-*.whl
    - uses: python/import
      with:
        imports: import setuptools

update:
  enabled: true
  release-monitor:
    identifier: 4021
