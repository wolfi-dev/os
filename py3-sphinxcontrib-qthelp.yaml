package:
  name: py3-sphinxcontrib-qthelp
  version: 2.0.0
  epoch: 7 # upstream-tests/pytest
  description: sphinxcontrib-qthelp is a sphinx extension which outputs QtHelp documents
  copyright:
    - license: BSD-2-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "4"
    memory: 4Gi

vars:
  pypi-package: sphinxcontrib-qthelp
  import: sphinxcontrib.qthelp

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-flit-core
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-defusedxml # upstream-tests: test dependency
      - py3.10-roman # upstream-tests: test dependency
      - py3.10-sphinx # upstream-tests: test dependency
      - py3.11-defusedxml # upstream-tests: test dependency
      - py3.11-roman # upstream-tests: test dependency
      - py3.11-sphinx # upstream-tests: test dependency
      - py3.12-defusedxml # upstream-tests: test dependency
      - py3.12-roman # upstream-tests: test dependency
      - py3.12-sphinx # upstream-tests: test dependency
      - py3.13-defusedxml # upstream-tests: test dependency
      - py3.13-roman # upstream-tests: test dependency
      - py3.13-sphinx # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sphinx-doc/sphinxcontrib-qthelp
      expected-commit: 783caf58e9ba9cf0450746b7f65d4bc8229ccd8f
      tag: ${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              # import ${{vars.import}} # AVOID_DEP_CYCLE(sphinx)

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          # import ${{vars.import}} # AVOID_DEP_CYCLE(sphinx)

update:
  enabled: true
  github:
    identifier: sphinx-doc/sphinxcontrib-qthelp
