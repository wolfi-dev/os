package:
  name: py3-sphinxext-opengraph
  version: "0.13.0"
  epoch: 4 # upstream-tests/pytest
  description: sphinxext-opengraph is a sphinx extension to generate unique OpenGraph metadata
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: sphinxext-opengraph
  import: sphinxext.opengraph

data:
  - name: py-versions
    items:
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-flit-core
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.11-beautifulsoup4 # upstream-tests: test dependency
      - py3.11-sphinx # upstream-tests: runtime dependency
      - py3.12-beautifulsoup4 # upstream-tests: test dependency
      - py3.12-sphinx # upstream-tests: runtime dependency
      - py3.13-beautifulsoup4 # upstream-tests: test dependency
      - py3.13-sphinx # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sphinx-doc/sphinxext-opengraph
      expected-commit: 95cf8a8c30c301343f8347c5d72a97030e007f34
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-sphinx
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - py${{range.key}}-docutils<0.23
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: sphinx-doc/sphinxext-opengraph
    strip-prefix: v
  ignore-regex-patterns:
    - V0.8.0 # Bad tag

test:
  pipeline:
    - uses: test/tw/byproductpackage
