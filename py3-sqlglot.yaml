package:
  name: py3-sqlglot
  version: "30.25.0"
  epoch: 0 # go/wolfi-rsc/py3-sqlglot
  description: An easily customizable SQL parser and transpiler
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: sqlglot
  import: sqlglot

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-pip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tobymao/sqlglot
      tag: v${{package.version}}
      expected-commit: 9d2966ed3f8a7f0d370846dbae1579b40ddc2924

  # Upstream added `write_to_source = true` to [tool.setuptools_scm], which
  # the packaged setuptools_scm does not accept (unexpected keyword
  # argument). version_file still writes sqlglot/_version.py, so drop the key.
  - runs: |
      sed -i '/^write_to_source[[:space:]]*=/d' pyproject.toml
      if grep -q write_to_source pyproject.toml; then
        echo "write_to_source still present in pyproject.toml" >&2
        exit 1
      fi

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: tobymao/sqlglot
    strip-prefix: v
    use-tag: true
