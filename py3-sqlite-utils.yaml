package:
  name: py3-sqlite-utils
  version: "4.2.1"
  epoch: 1 # upstream-tests/pytest
  description: CLI tool and Python library for manipulating SQLite databases
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

vars:
  pypi-package: sqlite-utils
  import: sqlite_utils

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-click # upstream-tests: test dependency
      - py3.10-click-default-group # upstream-tests: runtime dependency
      - py3.10-pluggy # upstream-tests: runtime dependency
      - py3.10-python-dateutil # upstream-tests: runtime dependency
      - py3.10-sqlite-fts4 # upstream-tests: runtime dependency
      - py3.10-tabulate # upstream-tests: test dependency
      - py3.11-click # upstream-tests: test dependency
      - py3.11-click-default-group # upstream-tests: runtime dependency
      - py3.11-hypothesis # upstream-tests: test dependency
      - py3.11-pluggy # upstream-tests: runtime dependency
      - py3.11-python-dateutil # upstream-tests: runtime dependency
      - py3.11-sqlite-fts4 # upstream-tests: runtime dependency
      - py3.11-tabulate # upstream-tests: test dependency
      - py3.12-click # upstream-tests: test dependency
      - py3.12-click-default-group # upstream-tests: runtime dependency
      - py3.12-hypothesis # upstream-tests: test dependency
      - py3.12-pluggy # upstream-tests: runtime dependency
      - py3.12-python-dateutil # upstream-tests: runtime dependency
      - py3.12-sqlite-fts4 # upstream-tests: runtime dependency
      - py3.12-tabulate # upstream-tests: test dependency
      - py3.13-click # upstream-tests: test dependency
      - py3.13-click-default-group # upstream-tests: runtime dependency
      - py3.13-hypothesis # upstream-tests: test dependency
      - py3.13-pluggy # upstream-tests: runtime dependency
      - py3.13-python-dateutil # upstream-tests: runtime dependency
      - py3.13-sqlite-fts4 # upstream-tests: runtime dependency
      - py3.13-tabulate # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 28dc6278cc03a9245325d056e6986818544abc68
      repository: https://github.com/simonw/sqlite-utils
      tag: ${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-click
        - py${{range.key}}-click-default-group
        - py${{range.key}}-pluggy
        - py${{range.key}}-python-dateutil
        - py${{range.key}}-sqlite-fts4
        - py${{range.key}}-tabulate
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      # hypothesis 6.170 requires Python >= 3.11 (no py3.10-hypothesis by design).
      - if: "'${{range.key}}' != '3.10'"
        uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - name: "move usr/bin executables for -bin"
        runs: |
          mkdir -p /tmp/cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin /tmp/cleanup/${{range.key}}/
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - python-${{range.key}}
      pipeline:
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
      provides:
        - py3-${{vars.pypi-package}}-bin
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv /tmp/cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}-bin
        - runs: |
            sqlite-utils --help

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: true
  ignore-regex-patterns:
    - '[ab]\d+$'
  git: {}

test:
  pipeline:
    - uses: test/tw/byproductpackage
