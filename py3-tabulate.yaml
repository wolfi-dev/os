package:
  name: py3-tabulate
  version: "0.10.0"
  epoch: 1 # go/wolfi-rsc/py3-tabulate
  description: Pretty-print tabular data
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "12"
    memory: 5Gi

vars:
  pypi-package: tabulate
  import: tabulate

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-gpep517

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/astanin/python-tabulate
      tag: v${{package.version}}
      expected-commit: 3b4cd509820e4c45cd2aaba833aa585ea6308b94

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: move usr/bin executables for -bin
        runs: |
          mkdir -p ./.cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./.cleanup/${{range.key}}/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - ${{package.name}}
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./.cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - name: Test tabulate CLI with real input
          runs: |
            # Test basic table formatting from stdin
            printf 'Name\tAge\nAlice\t30\nBob\t25\n' | tabulate --headers firstrow > /tmp/out.txt
            grep -F "Alice" /tmp/out.txt
            grep -F "Bob" /tmp/out.txt
            grep -F "Name" /tmp/out.txt

            # Test plain format
            printf 'x\ty\n1\t2\n3\t4\n' | tabulate --headers firstrow --tablefmt plain > /tmp/plain.txt
            grep -F "1" /tmp/plain.txt
            grep -F "3" /tmp/plain.txt

            # Test grid format produces borders
            printf 'a\tb\n1\t2\n' | tabulate --headers firstrow --tablefmt grid > /tmp/grid.txt
            grep -F "+" /tmp/grid.txt

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}
    - runs: |
        tabulate --help

update:
  enabled: true
  github:
    identifier: astanin/python-tabulate
    strip-prefix: v
    use-tag: true
