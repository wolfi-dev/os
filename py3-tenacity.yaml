package:
  name: py3-tenacity
  version: "9.2.1"
  epoch: 1 # upstream-tests/pytest
  description: General-purpose retrying library, written in Python, to simplify the task of adding retry behavior to just about anything
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: tenacity
  import: tenacity

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-hatch-vcs
      - py3-supported-hatchling
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-reno # upstream-tests: test dependency
      - py3.10-tornado # upstream-tests: test dependency
      - py3.10-trio # upstream-tests: test dependency
      - py3.11-reno # upstream-tests: test dependency
      - py3.11-tornado # upstream-tests: test dependency
      - py3.11-trio # upstream-tests: test dependency
      - py3.12-reno # upstream-tests: test dependency
      - py3.12-tornado # upstream-tests: test dependency
      - py3.12-trio # upstream-tests: test dependency
      - py3.13-reno # upstream-tests: test dependency
      - py3.13-tornado # upstream-tests: test dependency
      - py3.13-trio # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jd/tenacity.git
      tag: ${{package.version}}
      expected-commit: 4410996dd9a96864a2733ce0778bcaa112b72811

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}
    - uses: python/import
      with:
        imports: |
          import tenacity

update:
  enabled: true
  github:
    identifier: jd/tenacity
    use-tag: true
  ignore-regex-patterns:
    - mergify2-
