package:
  name: py3-threadpoolctl
  version: "3.8.0"
  epoch: 0 # upstream-tests/pytest
  description: Python helpers to limit the number of threads used in native libraries
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: threadpoolctl

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3-supported-setuptools
      - py3.10-psutil # upstream-tests: test dependency
      - py3.11-psutil # upstream-tests: test dependency
      - py3.12-psutil # upstream-tests: test dependency
      - py3.13-psutil # upstream-tests: test dependency
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/joblib/threadpoolctl
      expected-commit: b03db14a8567ba0b3b9b4aaf5ed011682f33da49
      tag: ${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      # test_controller_parallelism_no_deadlocks spawns `python -m tests._dl_iterate_phdr_deadlock`
      # and relies on the cwd being on sys.path; the harness sets PYTHONSAFEPATH=1 (3.11+),
      # so the child cannot import `tests` (passes on 3.10, fails on 3.11+).
      # TODO(upstream-tests): drop once the harness lets python -m children import from the cwd.
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
          ignore: tests/test_threadpoolctl.py::test_controller_parallelism_no_deadlocks
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  github:
    identifier: joblib/threadpoolctl

test:
  pipeline:
    - uses: test/tw/byproductpackage
