package:
  name: py3-tomli
  version: "2.5.0"
  epoch: 2 # fetch the wheel from Chainguard Libraries
  description: TOML parser
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "1"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: tomli
  # PyPI's sha256 for the wheel at package.version: digests.sha256 of this file in
  # https://pypi.org/pypi/tomli/<version>/json. Update it with every version bump.
  wheel-sha256: 32a7b79ac57a2e83670ce329ccf675798bc5a2094783a63676866b70503f2e2b

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-installer
      - py3-supported-python

pipeline:
  - uses: auth/libraries

  - name: Fetch tomli wheel from Chainguard Libraries
    runs: |
      whl="tomli-${{package.version}}-py3-none-any.whl"
      index="https://libraries.cgr.dev/python-upstream/simple/tomli/"
      url=$(curl --netrc --fail -sSL "$index" | grep -o "href=\"[^\"#]*/$whl[\"#]" | head -n 1 | sed -e 's/^href="//' -e 's/.$//')
      if [ -z "$url" ]; then
        echo "$whl is not in $index"
        exit 1
      fi
      curl --netrc --fail -sSLo "$whl" "$url"
      echo "${{vars.wheel-sha256}}  $whl" | sha256sum -c
      rm -f /root/.netrc /home/build/.netrc

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - ${{package.name}}
    pipeline:
      - runs: |
          python${{range.key}} -m installer -d "${{targets.subpkgdir}}" \
            tomli-${{package.version}}-py3-none-any.whl
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: true
  release-monitor:
    identifier: 207408

test:
  pipeline:
    - uses: test/tw/byproductpackage
