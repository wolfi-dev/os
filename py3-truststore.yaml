package:
  name: py3-truststore
  version: "0.10.5"
  epoch: 0
  description: Verify certificates using OS trust stores
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0

vars:
  pypi-package: truststore

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-flit-core
      - py3-supported-pip

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ddb380b919e4589c188e2fbc4f615fed49a37626
      repository: https://github.com/sethmlarson/truststore
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  ignore-regex-patterns:
    - .*\.dev.*
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/byproductpackage
