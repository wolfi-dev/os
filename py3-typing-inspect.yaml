package:
  name: py3-typing-inspect
  version: 0.9.0
  epoch: 8 # upstream-tests/pytest
  description: Runtime inspection utilities for typing module.
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "2"
    memory: 3Gi

vars:
  pypi-package: typing-inspect
  import: typing_inspect

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-pytest # upstream-tests: test runner
      - py3-supported-pytest-timeout # upstream-tests: per-test timeout
      - py3.10-mypy-extensions # upstream-tests: runtime dependency
      - py3.10-typing-extensions # upstream-tests: test dependency
      - py3.11-mypy-extensions # upstream-tests: runtime dependency
      - py3.11-typing-extensions # upstream-tests: test dependency
      - py3.12-mypy-extensions # upstream-tests: runtime dependency
      - py3.12-typing-extensions # upstream-tests: test dependency
      - py3.13-mypy-extensions # upstream-tests: runtime dependency
      - py3.13-typing-extensions # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c014abf73c165dda826e4c25504f9250bbca9045
      repository: https://github.com/ilevkivskyi/typing_inspect
      tag: ${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - ${{package.name}}
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-mypy-extensions
        - py${{range.key}}-typing-extensions
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: upstream-tests/pytest
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: ilevkivskyi/typing_inspect
    use-tag: true
