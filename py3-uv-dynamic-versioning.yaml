package:
  name: py3-uv-dynamic-versioning
  version: "0.14.1"
  epoch: 1
  description: Dynamic versioning tool for uv/hatch, powered by dunamai
  copyright:
    - license: MIT

vars:
  pypi-package: uv-dynamic-versioning
  module-name: uv_dynamic_versioning

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ninoseki/uv-dynamic-versioning
      tag: v${{package.version}}
      expected-commit: 18330168f9437aa2b4a0f272384a88adc0fc3ed7

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-dunamai
        - py${{range.key}}-hatchling
        - py${{range.key}}-jinja2
        - py${{range.key}}-pydantic
        - py${{range.key}}-tomlkit
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.module-name}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            set -euo pipefail
            cat <<EOF > pyproject.toml
            [project]
            name = "test-project"
            dynamic = ["version"]
            [tool.uv-dynamic-versioning]
            enable = true
            source = "tag"
            fallback_version = "0.1.0"
            EOF
            uv-dynamic-versioning

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  git:
    strip-prefix: v
