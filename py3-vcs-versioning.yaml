package:
  name: py3-vcs-versioning
  version: "2.6.0"
  epoch: 0
  description: the blessed package to manage your versions by scm tags
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "4"
    memory: 4Gi

vars:
  pypi-package: vcs-versioning
  module-name: vcs_versioning

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py3-supported-packaging
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-tomli
      - py3-supported-typing-extensions
      - py3-supported-wheel
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/setuptools_scm
      tag: vcs-versioning-v${{package.version}}
      expected-commit: fa5c2319fef46bea5e387e1329245e7eaffa6f1e

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-packaging
        - py${{range.key}}-typing-extensions
        - py${{range.key}}-tomli
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - working-directory: vcs-versioning
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            import: ${{vars.module-name}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: vcs-versioning

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  github:
    identifier: pypa/setuptools_scm
    strip-prefix: vcs-versioning-v
    tag-filter-prefix: vcs-versioning-v

test:
  pipeline:
    - uses: test/tw/byproductpackage
