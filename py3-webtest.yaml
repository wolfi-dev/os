package:
  name: py3-webtest
  version: "3.0.7"
  epoch: 0
  description: Helper to test WSGI applications in-process, with form, HTML and JSON response helpers.
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0

vars:
  pypi-package: webtest
  import: webtest

# Upstream supports >=3.9, but Python 3.10 is omitted because its runtime
# dependency py3-webob is only built for 3.11-3.13 in os.
data:
  - name: py-versions
    items:
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Pylons/webtest
      tag: ${{package.version}}
      expected-commit: 990ab26d6a26f05b5de863162f0bbe698d437f4c

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-webob
        - py${{range.key}}-waitress
        - py${{range.key}}-beautifulsoup4
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
          with:
            python: python${{range.key}}
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}
              from webtest import TestApp
              from webtest.debugapp import make_debug_app
        - name: Text GET round-trip through TestApp
          runs: |
            python${{range.key}} <<'EOF'
            import webtest
            app = webtest.TestApp(lambda e, s: (s('200 OK', [('Content-Type', 'text/plain')]), [b'hi'])[1])
            res = app.get('/')
            assert res.status_int == 200, res.status
            assert res.text == 'hi', res.text
            assert res.content_type == 'text/plain', res.content_type
            print("GET text:", res.text)
            EOF
        - name: JSON, forms, cookies and error statuses
          runs: |
            python${{range.key}} <<'EOF'
            import json
            from urllib.parse import parse_qs
            import webtest

            FORM = (b'<html><body><form method="POST" action="/submit" id="f">'
                    b'<input type="text" name="name" value="default">'
                    b'<select name="color"><option value="red">r</option><option value="blue">b</option></select>'
                    b'<input type="submit" name="go" value="Send">'
                    b'</form><a href="/next">next page</a></body></html>')

            def app(environ, start_response):
                path = environ['PATH_INFO']
                method = environ['REQUEST_METHOD']
                length = int(environ.get('CONTENT_LENGTH') or 0)
                body = environ['wsgi.input'].read(length) if length else b''
                if path == '/form':
                    start_response('200 OK', [('Content-Type', 'text/html')])
                    return [FORM]
                if path == '/submit' and method == 'POST':
                    data = {k: v[0] for k, v in parse_qs(body.decode()).items()}
                    start_response('200 OK', [('Content-Type', 'application/json')])
                    return [json.dumps(data).encode()]
                if path == '/json' and method == 'POST':
                    payload = json.loads(body)
                    payload['seen'] = True
                    start_response('201 Created', [('Content-Type', 'application/json')])
                    return [json.dumps(payload).encode()]
                if path == '/login':
                    start_response('200 OK', [('Content-Type', 'text/plain'),
                                              ('Set-Cookie', 'session=abc123; Path=/')])
                    return [b'ok']
                if path == '/whoami':
                    start_response('200 OK', [('Content-Type', 'text/plain')])
                    return [environ.get('HTTP_COOKIE', '').encode()]
                start_response('404 Not Found', [('Content-Type', 'text/plain')])
                return [b'missing']

            t = webtest.TestApp(app)

            res = t.post_json('/json', {'a': 1}, status=201)
            assert res.json == {'a': 1, 'seen': True}, res.json

            res = t.get('/form')
            form = res.forms['f']
            assert form['name'].value == 'default'
            form['name'] = 'webtest'
            form['color'] = 'blue'
            sub = form.submit('go')
            assert sub.json == {'name': 'webtest', 'color': 'blue', 'go': 'Send'}, sub.json
            assert res.html.find('a')['href'] == '/next'

            t.get('/login')
            assert t.cookies.get('session') == 'abc123', t.cookies
            assert 'session=abc123' in t.get('/whoami').text

            # Unexpected statuses must raise AppError unless the caller opts in.
            try:
                t.get('/nope')
            except webtest.AppError as e:
                assert '404' in str(e), str(e)
            else:
                raise SystemExit('expected AppError for 404')
            assert t.get('/nope', status=404).text == 'missing'
            assert t.get('/nope', expect_errors=True).status_int == 404
            print("json/forms/cookies/errors OK")
            EOF
        - name: Bundled paste debug app factory
          runs: |
            python${{range.key}} <<'EOF'
            import webtest
            from webtest.debugapp import make_debug_app
            t = webtest.TestApp(make_debug_app({}))
            res = t.get('/hello')
            assert res.status_int == 200, res.status
            assert 'REQUEST_METHOD' in res.text, res.text
            assert '/hello' in res.text, res.text
            print("debug app OK")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: true
  github:
    identifier: Pylons/webtest
    use-tag: true

test:
  pipeline:
    - uses: test/tw/byproductpackage
