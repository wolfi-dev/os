package:
  name: py3.13-widgetsnbextension
  version: "4.0.15"
  epoch: 1
  description: Jupyter interactive widgets for Jupyter Notebook
  copyright:
    - license: BSD-3-Clause

vars:
  python-version: 3.13
  pypi-package: widgetsnbextension
  import: widgetsnbextension

environment:
  contents:
    packages:
      - cmake
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-jupyter-packaging

pipeline:
  - uses: fetch # blocked-pending-migration: widgetsnbextension is available at github.com/jupyter-widgets/widgetsnbextension; migration to git-checkout pending
    with:
      expected-sha256: de8610639996f1567952d763a5a41af8af37f2575a41f9852a38f947eb82a3b9
      uri: https://files.pythonhosted.org/packages/source/w/widgetsnbextension/widgetsnbextension-${{package.version}}.tar.gz

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  release-monitor:
    identifier: 84223
