package:
  name: py3.14-absl-py
  version: "2.5.0"
  epoch: 0
  description: Abseil Python Common Libraries, see https://github.com/abseil/abseil-py.
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: absl-py
  import: absl
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/abseil/abseil-py/
      tag: v${{package.version}}
      expected-commit: a742ec37ace382ea1e6a0c30db168ed104533fa6

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: abseil/abseil-py
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
