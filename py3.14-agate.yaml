package:
  name: py3.14-agate
  version: "1.14.2"
  epoch: 0
  description: A data analysis library that is optimized for humans instead of machines.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-babel
      - py${{vars.python-version}}-isodate
      - py${{vars.python-version}}-leather
      - py${{vars.python-version}}-parsedatetime
      - py${{vars.python-version}}-python-slugify
      - py${{vars.python-version}}-pytimeparse

vars:
  pypi-package: agate
  import: agate
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: eab4f62e6cf1c9a0d68c4c3c9faace91355f49da
      repository: https://github.com/wireservice/agate
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    use-tag: true
    identifier: wireservice/agate

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
