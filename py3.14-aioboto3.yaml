package:
  name: py3.14-aioboto3
  version: "15.5.0"
  epoch: 0
  description: Wrapper to use boto3 resources with the aiobotocore async backend
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-aiobotocore
      - py${{vars.python-version}}-aiofiles
      - py${{vars.python-version}}-boto3

vars:
  pypi-package: aioboto3
  import: aioboto3
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ba80fd80f159b517d66ed4a9e8684cd5aa0e949b
      repository: https://github.com/terricain/aioboto3/
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - (.*)(a|b|rc)(.*)
  github:
    use-tag: true
    identifier: terricain/aioboto3
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - uses: py/one-python
      with:
        content: |
          cat <<'EOF' > /tmp/test_aioboto3.py
          import asyncio
          import aioboto3

          async def main():
              session = aioboto3.Session()
              async with session.client("s3", region_name="us-east-1") as s3:
                  # Confirm method exists
                  assert hasattr(s3, "list_buckets")

          asyncio.run(main())
          EOF
          python3 /tmp/test_aioboto3.py
