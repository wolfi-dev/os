package:
  name: py3.14-aiobotocore
  version: "3.10.0"
  epoch: 0
  description: asyncio support for botocore library using aiohttp
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-aiohttp
      - py${{vars.python-version}}-aioitertools
      # aiobotocore declares botocore>=1.43.115,<1.43.118 in pyproject.toml.
      - py${{vars.python-version}}-botocore<1.43.118
      - py${{vars.python-version}}-jmespath
      # aiobotocore declares multidict>=6.0.0,<8.0.0 in pyproject.toml; keep
      # the runtime dep in that range, consistent with py3.14-aiohttp.
      - py${{vars.python-version}}-multidict<8
      # aiobotocore and botocore both declare python-dateutil<3.0.0; the
      # py3.14-botocore builds below 1.43.118 do not pin it themselves.
      - py${{vars.python-version}}-python-dateutil<3
      - py${{vars.python-version}}-wrapt
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: aiobotocore
  import: aiobotocore
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 65f5b5a795bbe8480e977ed2574ecb9f5651772e
      repository: https://github.com/aio-libs/aiobotocore
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - .*\.dev[0-9]*$
  github:
    identifier: aio-libs/aiobotocore
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Test a functional import
      runs: python${{vars.python-version}} -c "from ${{vars.import}}.session import get_session"
    - name: Test calling get_session
      runs: |
        cat >> test.py <<EOF
        from ${{vars.import}}.session import get_session

        session = get_session()
        EOF

        python${{vars.python-version}} test.py
