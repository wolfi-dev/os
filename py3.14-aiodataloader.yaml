package:
  name: py3.14-aiodataloader
  version: "0.4.3"
  epoch: 0
  description: Asyncio DataLoader for Python3
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  pypi-package: aiodataloader
  import: aiodataloader
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f429cfbadeefc52653d3d4047458bbf2b3c528a3
      repository: https://github.com/syrusakbary/aiodataloader
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - (.*)(a|b|rc)(.*)
  github:
    use-tag: true
    strip-prefix: v
    identifier: syrusakbary/aiodataloader

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
