package:
  name: py3.14-aiodns
  version: 4.0.4
  epoch: 0
  description: Happy Eyeballs for pre-resolved hosts
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-pycares
  resources:
    cpu: "5"
    memory: 7Gi

vars:
  pypi-package: aiodns
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-pip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aio-libs/aiodns
      tag: v${{package.version}}
      expected-commit: 5ffa1118fc202d3f5bf887b1ded33fbceb9d1ea8

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: aio-libs/aiodns
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
