package:
  name: py3.14-aiofiles
  version: "25.1.0"
  epoch: 2 # upstream-tests/pytest
  description: File support for asyncio.
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: aiofiles
  import: aiofiles
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-asyncio # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Tinche/aiofiles
      tag: v${{package.version}}
      expected-commit: 348f5ef6561c2b2c8a7497bd10487eab4102332f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # test_access expects access() to deny after chmod; the build runs as root, which bypasses
  # permission bits. TODO(upstream-tests): drop once the suite runs as non-root.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore: tests/test_os.py::test_access

  - uses: strip

update:
  enabled: true
  github:
    identifier: Tinche/aiofiles
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
