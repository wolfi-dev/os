# Generated from https://pypi.org/project/aiohttp/
package:
  name: py3.14-aiohappyeyeballs
  version: "2.7.1"
  epoch: 1 # upstream-tests/pytest
  description: Happy Eyeballs for pre-resolved hosts
  copyright:
    - license: PSF-2.0
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: aiohappyeyeballs
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-poetry-core
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-asyncio # upstream-tests: test dependency
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aio-libs/aiohappyeyeballs
      tag: v${{package.version}}
      expected-commit: 4dfc926e30eea8d24c1a71602d73c0e9a895c191

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: aio-libs/aiohappyeyeballs
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
