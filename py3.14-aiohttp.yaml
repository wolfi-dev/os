# Generated from https://pypi.org/project/aiohttp/
package:
  name: py3.14-aiohttp
  version: "3.14.5"
  epoch: 0
  description: Async http client/server framework (asyncio)
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-aiohappyeyeballs
      - py${{vars.python-version}}-aiosignal
      - py${{vars.python-version}}-async-timeout
      - py${{vars.python-version}}-attrs
      - py${{vars.python-version}}-frozenlist
      # aiohttp declares multidict>=4.5,<8.0 (pyproject.toml); keep the
      # runtime dep in that range so pip check and installs stay consistent.
      - py${{vars.python-version}}-multidict<8
      - py${{vars.python-version}}-propcache
      - py${{vars.python-version}}-yarl
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  glibc-version: "2.44"
  pypi-package: aiohttp
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-${{vars.glibc-version}}
      - glibc-${{vars.glibc-version}}-dev
      - llhttp-dev
      - pkgconf
      - py${{vars.python-version}}-build-base-dev
      # Cython 3.3 crashes compiling aiohttp/_websocket/reader_c.py (upstream
      # pins cython==3.2.5 in requirements/cython.txt); stay on 3.2.x.
      - py${{vars.python-version}}-cython<3.3
      - py${{vars.python-version}}-multidict
      - py${{vars.python-version}}-pkgconfig
  environment:
    # Link _http_parser against the system llhttp through upstream's
    # pkg-config path, instead of building the vendored copy.
    AIOHTTP_USE_SYSTEM_DEPS: "1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aio-libs/aiohttp/
      tag: v${{package.version}}
      expected-commit: f17c631bddcfd4ec712342db28f1d3381a3fec71

  - name: Python Setup
    runs: |
      mkdir -p .git
      python${{vars.python-version}} tools/gen.py
      python${{vars.python-version}} -m cython -3 aiohttp/*.pyx -I aiohttp
      python${{vars.python-version}} -m cython -3 aiohttp/_websocket/mask.pyx -I aiohttp
      # Upstream 3.14.5 dropped the reader_c.py symlink; generate reader_c.c
      # from reader_py.py (see upstream Makefile).
      python${{vars.python-version}} -m cython -3 --module-name aiohttp._websocket.reader_c aiohttp/_websocket/reader_py.py -o aiohttp/_websocket/reader_c.c -I aiohttp
      test -f aiohttp/_websocket/reader_c.c
      rm -rf .git

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: aio-libs/aiohttp
    strip-prefix: v
  ignore-regex-patterns:
    - a\d$

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
          import aiohttp._http_parser
          import aiohttp._http_writer
          import aiohttp._websocket.mask
          import aiohttp._websocket.reader_c
    - name: C extensions are in use, not the pure-Python fallback
      runs: |
        python${{vars.python-version}} - <<'PY'
        import aiohttp._http_parser as c
        import aiohttp._http_writer as cw
        import aiohttp._websocket.reader as r
        import aiohttp._websocket.reader_c as rc
        import aiohttp.http_parser as p
        import aiohttp.http_writer as w
        assert p.HttpRequestParser is c.HttpRequestParser, p.HttpRequestParser
        assert p.HttpResponseParser is c.HttpResponseParser, p.HttpResponseParser
        assert w._serialize_headers is cw._serialize_headers, w._serialize_headers
        assert r.WebSocketReader is rc.WebSocketReader, r.WebSocketReader
        PY
    - uses: test/tw/ldd-check
