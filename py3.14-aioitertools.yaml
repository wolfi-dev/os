package:
  name: py3.14-aioitertools
  version: "0.13.0"
  epoch: 0
  description: itertools and builtins for AsyncIO and mixed iterables
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: aioitertools
  import: aioitertools
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 47a2068abc2c7e34bff1a188cb5ce66fa24d9404
      repository: https://github.com/omnilib/aioitertools
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - "[a-z][0-9]*$"
  github:
    identifier: omnilib/aioitertools
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Test a functional import
      runs: python${{vars.python-version}} -c "from ${{vars.import}} import chain, iter, islice, map, next, zip"
    - name: Run a test async iterator
      runs: |
        cat >> test.py <<EOF
        import asyncio

        from aioitertools import iter, next
        from typing import Iterable

        test_iter = iter(["foo", "bar", "baz"])

        async def get_first_item(iterable: Iterable[str]) -> str:
            item = await next(iterable)
            return item

        assert asyncio.run(get_first_item(test_iter)) == "foo"

        EOF

        python${{vars.python-version}} test.py
