# Generated from https://pypi.org/project/aiosignal/
package:
  name: py3.14-aiosignal
  version: "1.4.0"
  epoch: 0
  description: 'aiosignal: a list of registered asynchronous callbacks'
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-frozenlist

vars:
  pypi-package: aiosignal
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-frozenlist # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pygments # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-asyncio # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aio-libs/aiosignal
      tag: v${{package.version}}
      expected-commit: 1cf80149c869d410c90a58e85e9c703be6ef8692

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: aio-libs/aiosignal
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
