package:
  name: py3.14-aiostream
  version: "0.8.0"
  epoch: 0
  description: Generator-based operators for asynchronous iteration
  copyright:
    - license: GPL-3.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: aiostream
  import: aiostream
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: df45851fbce02ad7d0507a5389d31f0ca7ac233e
      repository: https://github.com/vxgmichel/aiostream
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - (.*)(a|b|rc)(.*)
  github:
    use-tag: true
    strip-prefix: v
    identifier: vxgmichel/aiostream

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
