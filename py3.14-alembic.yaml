package:
  name: py3.14-alembic
  version: "1.20.1"
  epoch: 2 # upstream-tests/pytest
  description: A database migration tool for SQLAlchemy.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-dateutil
      - py${{vars.python-version}}-mako
      - py${{vars.python-version}}-python-editor
      - py${{vars.python-version}}-sqlalchemy
      - py${{vars.python-version}}-tomli
  resources:
    cpu: "1"

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: _
    to: mangled-package-version

vars:
  pypi-package: alembic
  import: alembic
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-dateutil # upstream-tests: runtime dependency
      - py${{vars.python-version}}-mako # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-python-editor # upstream-tests: runtime dependency
      - py${{vars.python-version}}-sqlalchemy # upstream-tests: runtime dependency
      - py${{vars.python-version}}-tomli # upstream-tests: runtime dependency
      - py${{vars.python-version}}-tzdata # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sqlalchemy/alembic
      expected-commit: 47da01c856027876f4022b2da721a4edd6b4a0db
      tag: rel_${{vars.mangled-package-version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # RunHookTest black/module hook tests need the black formatter, which is not packaged.
  # TODO(upstream-tests): package py3.14-black and drop these.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore: tests/test_post_write.py::RunHookTest::test_module tests/test_post_write.py::RunHookTest::test_module_black_with_cwd tests/test_post_write.py::RunHookTest::test_module_filename_interpolation tests/test_post_write.py::RunHookTest::test_module_path_in_config

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: alembic
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: alembic

update:
  enabled: true
  ignore-regex-patterns:
    - 'post'
  version-transform:
    - match: \_
      replace: .
  git:
    strip-prefix: rel_

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
