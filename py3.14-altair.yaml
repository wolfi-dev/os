package:
  name: py3.14-altair
  version: "6.3.0"
  epoch: 0
  description: Vega-Altair is a declarative statistical visualization library for Python.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-jsonschema
      - py${{vars.python-version}}-narwhals
      - py${{vars.python-version}}-packaging
  resources:
    cpu: "3"
    memory: 5Gi

vars:
  pypi-package: altair
  import: altair
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-versioningit

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/vega/altair
      tag: v${{package.version}}
      expected-commit: 78c66bf226b3bb36277fe0c261f469e5b6200a30

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - .*rc[0-9]*$
  github:
    identifier: vega/altair
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - jq
        - py${{vars.python-version}}-pandas
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Test chart output to json
      uses: py/one-python
      with:
        content: |
          cat > test.py <<EOF
          import pandas as pd
          import altair as alt

          data = pd.DataFrame(
            {
              "a": list("CCCDDDEEE"),
              "b": [2, 7, 4, 1, 2, 6, 8, 4, 7]
            }
          )

          chart = alt.Chart(data).mark_point().encode(x="a", y="b")

          print(chart.to_json())
          EOF

          python3 test.py | jq -r '.encoding.x.field' | grep "a"
