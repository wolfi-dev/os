package:
  name: py3.14-annotated-doc
  version: "0.0.7"
  epoch: 0
  description: Document parameters, class attributes, return types, and variables inline, with Annotated
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: annotated-doc
  import: annotated_doc
  python-version: "3.14"

environment:
  contents:
    packages:
      - busybox
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pdm-backend
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fastapi/annotated-doc
      tag: ${{package.version}}
      expected-commit: f8f99b4dec732a49411d19a55962ac71262603fb

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      # tests/test_prepare_release.py tests upstream's release script and
      # needs typer, but py3.14-typer runtime-depends on this package, so
      # it cannot be in the build environment until both exist.
      # TODO(upstream-tests): add py3.14-typer and drop this once it is built.
      ignore-files: tests/test_prepare_release.py

  - uses: strip

update:
  enabled: true
  github:
    identifier: fastapi/annotated-doc

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
