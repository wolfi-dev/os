# Generated from https://pypi.org/project/annotated-types/
package:
  name: py3.14-annotated-types
  version: "0.8.0"
  epoch: 0
  description: Reusable constraint types to use with typing.Annotated
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "1"
    memory: 7Gi

vars:
  pypi-package: annotated-types
  module-name: annotated_types
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-installer
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - wolfi-base
  environment:
    # This is needed to work around the error "ValueError: ZIP does not support timestamps before 1980"
    SOURCE_DATE_EPOCH: 315532800

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/annotated-types/annotated-types
      tag: v${{package.version}}
      expected-commit: 9eb96680138269811a39d838d720abc3dce33954

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: annotated-types/annotated-types
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.module-name}}
