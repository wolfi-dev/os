package:
  name: py3.14-ansible-core
  version: "2.22.0"
  epoch: 0
  description: Ansible is a radically simple IT automation platform
  copyright:
    - license: GPL-3.0
  dependencies:
    runtime:
      - openssl-4.0 # requires because of py3-cryptography
      - py${{vars.python-version}}-cryptography
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-resolvelib
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: ansible-core
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9fe1b576a1087230f3748d0fdb2ee0284ca6b5f8
      repository: https://github.com/ansible/ansible
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ansible/ansible
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: version tests
      runs: |
        ansible --version
        ansible-config --version
        ansible-console --version
        ansible-doc --version
        ansible-galaxy --version
        ansible-inventory --version
        ansible-playbook --version
        ansible-pull --version
        ansible-test --version
        ansible-vault --version
