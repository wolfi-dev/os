package:
  name: py3.14-ansible-runner-http
  version: 1.0.0
  epoch: 0
  description: This project is a plugin for Ansible Runner.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-ansible-runner
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-requests-unixsocket

vars:
  pypi-package: ansible-runner-http
  import: ansible_runner_http
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  # blocked-no-github: no GitHub repository available; uses PyPI tarball
  - uses: fetch
    with:
      expected-sha256: e2f34880531d4088a5e04967fd5eae602eb400cc4eb541b22c8c6853e342587f
      uri: https://files.pythonhosted.org/packages/source/a/ansible-runner-http/ansible-runner-http-${{package.version}}.tar.gz

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}

update:
  enabled: false
