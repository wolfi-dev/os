package:
  name: py3.14-ansible-runner
  version: "2.4.3"
  epoch: 0
  description: A tool and python library that helps when interfacing with Ansible directly.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pexpect
      - py${{vars.python-version}}-python-daemon
      - py${{vars.python-version}}-pyyaml
  resources:
    cpu: "1"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: ansible-runner
  import: ansible_runner
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: dafa5b56fdcb89b379e4d276155d8a79cfc2ad2a
      repository: https://github.com/ansible/ansible-runner
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ansible/ansible-runner

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
