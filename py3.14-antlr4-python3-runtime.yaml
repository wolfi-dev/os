package:
  name: py3.14-antlr4-python3-runtime
  version: 4.13.2
  epoch: 0
  description: ANTLR runtime for Python 3
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: antlr4-python3-runtime
  import: antlr4
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-pip

pipeline:
  - uses: git-checkout
    with:
      expected-commit: cc82115a4e7f53d71d9d905caa2c2dfa4da58899
      repository: https://github.com/antlr/antlr4
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: runtime/Python3

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: pygrun

update:
  enabled: true
  github:
    identifier: antlr/antlr4

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
