package:
  name: py3.14-appdirs
  version: 1.4.4
  epoch: 0
  description: a small python module for appdir support
  copyright:
    - license: MIT
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: appdirs
  import: appdirs
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ActiveState/appdirs
      tag: ${{package.version}}
      expected-commit: 7af32e0b1fe57070ae8b5a717cdaebc094449518

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ActiveState/appdirs

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
