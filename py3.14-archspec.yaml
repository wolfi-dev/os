package:
  name: py3.14-archspec
  version: "0.2.8"
  epoch: 0
  description: A library to query system architecture
  copyright:
    - license: Apache-2.0 OR MIT
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: archspec
  import: archspec
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-exceptiongroup # upstream-tests: test dependency
      - py${{vars.python-version}}-jsonschema # upstream-tests: test dependency
      - py${{vars.python-version}}-poetry
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-tomli # upstream-tests: test dependency
      - py${{vars.python-version}}-typing-extensions # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 76c1627e2cb03eeba54182510a839a338b07465f
      repository: https://github.com/archspec/archspec
      tag: v${{package.version}}
      recurse-submodules: true

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            archspec --version
            archspec --help
            archspec cpu

update:
  enabled: true
  github:
    identifier: archspec/archspec
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
