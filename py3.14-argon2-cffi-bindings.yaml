package:
  name: py3.14-argon2-cffi-bindings
  version: "26.2.0"
  epoch: 0 # upstream-tests/pytest
  description: Low-level CFFI bindings for Argon2
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-cffi

vars:
  pypi-package: argon2-cffi-bindings
  import: _argon2_cffi_bindings
  python-version: "3.14"

environment:
  contents:
    packages:
      - argon2
      - argon2-dev
      - cmake
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cffi
      - py${{vars.python-version}}-scikit-build-core
      - py${{vars.python-version}}-setuptools-scm
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - samurai
  environment:
    ARGON2_CFFI_USE_SYSTEM: 1
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 47e3f1a7bb5475f8576b4c2a09cd6eb4987e67e7
      repository: https://github.com/hynek/argon2-cffi-bindings
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: hynek/argon2-cffi-bindings
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - uses: test/tw/ldd-check
