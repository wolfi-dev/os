package:
  name: py3.14-argon2-cffi
  version: "25.1.0"
  epoch: 0
  description: Argon2 for Python
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-argon2-cffi-bindings
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: argon2-cffi
  import: argon2
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-cffi
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hynek/argon2-cffi
      tag: ${{package.version}}
      expected-commit: 1fcae4fc1b7ff192b5ade54f6616771e5cf5f391

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: hynek/argon2-cffi

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
