package:
  name: py3.14-arrow
  version: "1.4.0"
  epoch: 0
  description: Arrow is a Python library that offers a sensible and human-friendly approach to creating, manipulating, formatting and converting dates, times and timestamps.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-python-dateutil
      - py${{vars.python-version}}-types-python-dateutil
      - py${{vars.python-version}}-tzdata
  resources:
    cpu: "2"
    memory: 1Gi

vars:
  pypi-package: arrow
  import: arrow
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/arrow-py/arrow
      tag: ${{package.version}}
      expected-commit: 2c1f5185ad66bf3b1cf8c0812f4b4fe65ac46656

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: arrow-py/arrow
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Test some simple date/time functions
      runs: |
        cat >> test.py <<'EOF'
        import ${{vars.import}}

        test = arrow.get("2025-01-01T20:00:00")

        assert test.year == 2025
        assert test.month == 1
        assert test.day == 1
        assert test.hour == 20

        utc = arrow.utcnow()
        utc = utc.shift(hours=1)

        eastern = utc.to("US/Eastern")

        eastern.timestamp()
        eastern.format()
        eastern.humanize()
        EOF

        python${{vars.python-version}} test.py
