package:
  name: py3.14-asgiref
  version: "3.13.0"
  epoch: 0
  description: ASGI specs, helper code, and adapters
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: asgiref
  import: asgiref
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/django/asgiref
      tag: ${{package.version}}
      expected-commit: 03dcd190a363be6e501b2819803e70495200551c

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - (.*)(a|b|rc)(.*)
  github:
    identifier: django/asgiref
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
