package:
  name: py3.14-asn1crypto
  version: 1.5.1
  epoch: 0
  description: Python ASN.1 library with a focus on performance and a pythonic API
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: asn1crypto
  import: asn1crypto
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wbond/asn1crypto
      expected-commit: 835365ca6744c7afee793f050faf0a91ddb140b7
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: wbond/asn1crypto
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
