package:
  name: py3.14-asttokens
  version: "3.0.2"
  epoch: 0
  description: Annotate AST trees with source code positions
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-six
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: asttokens
  import: asttokens
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f97a6e1403d9f0e93940a11b507524550a5c3896
      repository: https://github.com/gristlabs/asttokens
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: gristlabs/asttokens
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
