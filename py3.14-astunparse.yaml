package:
  name: py3.14-astunparse
  version: 1.6.3
  epoch: 0
  description: An AST unparser for Python
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-six
      - py${{vars.python-version}}-wheel

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

vars:
  pypi-package: astunparse
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/simonpercivall/astunparse
      tag: v${{package.version}}
      expected-commit: 2acce01fcdda2ea32eea835c30ccca21aaff7297

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: simonpercivall/astunparse
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
