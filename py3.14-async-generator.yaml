package:
  name: py3.14-async-generator
  version: 1.10
  epoch: 0
  description: Async generators and context managers for Python 3.5+
  copyright:
    - license: MIT OR Apache-2.0
  resources:
    cpu: "4"
    memory: 3Gi

vars:
  pypi-package: async-generator
  import: async_generator
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2c5e2e201c4dcd40b112eb3193c73f2c2b84d263
      repository: https://github.com/python-trio/async_generator
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: python-trio/async_generator
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
