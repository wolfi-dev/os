package:
  name: py3.14-async-lru
  version: "2.3.0"
  epoch: 0
  description: Simple LRU cache for asyncio
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions

vars:
  pypi-package: async-lru
  import: async_lru
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: cb9e034619167668af09c7be71a37e2d40a96995
      repository: https://github.com/aio-libs/async-lru
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: aio-libs/async-lru
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
