package:
  name: py3.14-async-timeout
  version: 5.0.1
  epoch: 1 # build-base -> py3.14-build-base
  description: Timeout context manager for asyncio programs
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: async-timeout
  python-version: "3.14"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aio-libs/async-timeout.git
      expected-commit: cc52d410e733b302873e6e52db9a9b6578d053a4
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: false
  exclude-reason: Upstream aio-libs/async-timeout was archived on 2026-05-21 (final release 5.0.1; replaced by stdlib asyncio.timeout since Python 3.11); kept frozen as a dependency of py3-aiohttp and py3-redis. No further releases expected.
  git:
    strip-prefix: v
    tag-filter-prefix: v
  ignore-regex-patterns:
    - ".*a.*"

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: async_timeout
