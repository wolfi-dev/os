# Generated from https://pypi.org/project/asyncssh/
package:
  name: py3.14-asyncssh
  version: "2.24.1"
  epoch: 0
  description: AsyncSSH is a Python package which provides an asynchronous client and server implementation of the SSHv2 protocol
  copyright:
    - license: EPL-2.0 OR GPL-2.0-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-cryptography
      - py${{vars.python-version}}-typing-extensions

vars:
  glibc-version: "2.44"
  pypi-package: asyncssh
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ronf/asyncssh
      tag: v${{package.version}}
      expected-commit: 5dbdf18494589a6de7065f9fb89bd5d716f36a35

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ronf/asyncssh
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-cryptography
        - py${{vars.python-version}}-typing-extensions
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
    - name: Test basic AsyncSSH functionality
      uses: test/daemon-check-output
      with:
        start: |
          python${{vars.python-version}} connection.py
        timeout: 10
        expected_output: |
          SSH command result
          hi
        error_strings: |
          Client error:
          Traceback
          Exception
          Error:
