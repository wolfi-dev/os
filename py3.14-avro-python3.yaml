package:
  name: py3.14-avro-python3
  version: 1.10.2
  epoch: 0
  description: Avro is a serialization and RPC framework.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 4Gi

vars:
  pypi-package: avro-python3
  import: avro
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/avro
      tag: release-${{package.version}}
      expected-commit: 8111cdc35430ff68dcb644306362859de40999d9

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: lang/py3

  - runs: |
      rm -rf ${{targets.destdir}}/usr/lib/python${{vars.python-version}}/site-packages/avro/tests

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: avro
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: avro

update:
  enabled: false
  exclude-reason: "Deprecated in favour of https://pypi.org/project/avro/; same repository, but built from lang/py instead of lang/py3.  May require renaming package to py3-avro?"
  github:
    identifier: apache/avro
    strip-prefix: release-
    tag-filter-prefix: release-

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
