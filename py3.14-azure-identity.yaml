package:
  name: py3.14-azure-identity
  version: "1.26.0"
  epoch: 0
  description: Microsoft Azure Identity Library for Python
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-azure-core
      - py${{vars.python-version}}-cryptography
      - py${{vars.python-version}}-msal
      - py${{vars.python-version}}-msal-extensions
  resources:
    cpu: "1"
    memory: 7Gi

vars:
  pypi-package: azure-identity
  import: azure.identity
  python-version: 3.14

environment:
  contents:
    packages:
      - py${{vars.python-version}}-pip

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 30d8bb95bf21f28fc5ed7a0fc9da43a46765c81e
      repository: https://github.com/Azure/azure-sdk-for-python
      tag: azure-identity_${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: sdk/identity/azure-identity

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}
    - name: Test DefaultAzureCredential
      uses: py/one-python
      with:
        content: |
          #!/usr/bin/env python3
          # Test creating a DefaultAzureCredential object
          from azure.identity import DefaultAzureCredential
          credential = DefaultAzureCredential()
          print('DefaultAzureCredential initialized successfully.')
    - name: Test Azure Identity with Mock Environment
      uses: py/one-python
      with:
        content: |
          #!/usr/bin/env python3
          # Simulate an environment variable-based authentication
          from azure.identity import DefaultAzureCredential
          credential = DefaultAzureCredential()
          print('DefaultAzureCredential with environment variables initialized successfully.')

update:
  enabled: true
  ignore-regex-patterns:
    - b
  github:
    identifier: Azure/azure-sdk-for-python
    strip-prefix: azure-identity_
    tag-filter: azure-identity_
    use-tag: true
