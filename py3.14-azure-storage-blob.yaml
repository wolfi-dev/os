package:
  name: py3.14-azure-storage-blob
  version: "12.31.1"
  epoch: 0
  description: Microsoft Azure Blob Storage Client Library for Python
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - openssl-provider-legacy-allowed
      - py${{vars.python-version}}-azure-core
      - py${{vars.python-version}}-cryptography
      - py${{vars.python-version}}-isodate
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "3"
    memory: 8Gi

vars:
  pypi-package: azure-storage-blob
  import: azure.storage.blob
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 4ab6ad971ff43cfdfd7e9e8d8e4fdfdab7cc6bdd
      repository: https://github.com/Azure/azure-sdk-for-python
      tag: azure-storage-blob_${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: sdk/storage/azure-storage-blob

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    # skip azure-storage-blob_12.24.0b1
    - '[ab]\d+$'
  github:
    identifier: Azure/azure-sdk-for-python
    strip-prefix: azure-storage-blob_
    tag-filter-prefix: azure-storage-blob_
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
