package:
  name: py3.14-babel
  version: "2.18.0"
  epoch: 3 # restore -bin subpackage dropped in the split
  description: Python3 i18n tool
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: babel
  import: babel
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-freezegun # upstream-tests: test dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-tzdata # upstream-tests: test dependency
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-babel/babel
      tag: v${{package.version}}
      expected-commit: 56c63caf50b18b152541b5dcafd51f645d867074

  # This downloads from unicode.org, but it checks the expected SHA-512 hash.
  - runs: scripts/download_import_cldr.py

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - runs: |
            pybabel --version
            pybabel --help
            cat > hello.py <<'EOF'
            from gettext import gettext as _
            print(_("Hello, world"))
            EOF
            pybabel extract -o messages.pot hello.py
            grep -F 'msgid "Hello, world"' messages.pot
            pybabel init -i messages.pot -d locale -l de
            pybabel compile -d locale
            test -s locale/de/LC_MESSAGES/messages.mo

update:
  enabled: true
  shared: true
  github:
    identifier: python-babel/babel
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
