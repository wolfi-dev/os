package:
  name: py3.14-babel
  version: "2.18.0"
  epoch: 0
  description: Python3 i18n tool
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: babel
  import: babel
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-babel/babel
      tag: v${{package.version}}
      expected-commit: 56c63caf50b18b152541b5dcafd51f645d867074

  # This downloads from unicode.org, but it checks the expected SHA-512 hash.
  - runs: scripts/download_import_cldr.py

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  shared: true
  github:
    identifier: python-babel/babel
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
