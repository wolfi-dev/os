package:
  name: py3.14-backcall
  version: 0.2.0
  epoch: 0
  description: Specifications for callback functions passed in to an API
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: backcall
  import: backcall
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 76faffb16e2169606209255ef9e9d684d11c1e81
      repository: https://github.com/takluyver/backcall
      tag: ${{package.version}}

  # backcall 0.2.0 is unmaintained and still declares its metadata in the
  # legacy [tool.flit.metadata] table, which flit_core 4 dropped. py3-backcall
  # pins flit-core~3.12 for 3.10-3.13, but there is no flit-core 3.x for 3.14,
  # so migrate to the standard PEP 621 [project] table. Version and
  # description stay dynamic (read from the module __version__ and
  # docstring), matching upstream behavior.
  - runs: |
      cat > pyproject.toml <<'PYPROJECT'
      [build-system]
      requires = ["flit_core >=3.2"]
      build-backend = "flit_core.buildapi"

      [project]
      name = "backcall"
      authors = [
          {name = "Thomas Kluyver", email = "thomas@kluyver.me.uk"},
      ]
      readme = "README.rst"
      classifiers = [
          "License :: OSI Approved :: BSD License",
          "Programming Language :: Python :: 2",
          "Programming Language :: Python :: 2.7",
          "Programming Language :: Python :: 3",
      ]
      dynamic = ["version", "description"]

      [project.urls]
      Home = "https://github.com/takluyver/backcall"
      PYPROJECT

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: takluyver/backcall
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
