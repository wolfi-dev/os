package:
  name: py3.14-backoff
  version: 2.2.1
  epoch: 0
  description: Function decoration for backoff and retry
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: backoff
  import: backoff
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-poetry

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/litl/backoff
      tag: v${{package.version}}
      expected-commit: d9d80a92d5a4483373acdaf9faa4068c85b3d268

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: false
  exclude-reason: Upstream litl/backoff was archived on 2025-08-08 (last commit January 2023); kept frozen as a dependency of tritonserver-backend-tensorrtllm. No further releases expected.
  github:
    identifier: litl/backoff
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
