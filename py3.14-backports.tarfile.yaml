package:
  name: py3.14-backports.tarfile
  version: 1.2.0
  epoch: 0
  description: Backport of CPython tarfile module
  copyright:
    - license: MIT
  resources:
    cpu: "4"
    memory: 6Gi

vars:
  pypi-package: backports.tarfile
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8d5d0671850cc1beed5cef9a74aecac7b552f062
      repository: https://github.com/jaraco/backports.tarfile
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jaraco/backports.tarfile
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
