package:
  name: py3.14-bcrypt-3.2
  version: "3.2.2"
  epoch: 0
  description: Modern password hashing for your software and your servers
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-cffi

vars:
  pypi-package: bcrypt
  import: bcrypt
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cffi

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a86360fef7859054c6a8050cf67e62127f5e2643
      repository: https://github.com/pyca/bcrypt
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: pyca/bcrypt
    use-tag: true
    tag-filter: 3.2.

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - uses: test/tw/ldd-check
