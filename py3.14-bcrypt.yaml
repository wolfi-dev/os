package:
  name: py3.14-bcrypt
  version: "5.0.0"
  epoch: 3 # upstream-tests/pytest
  description: Modern password hashing for your software and your servers
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "3"
    memory: 9Gi

vars:
  pypi-package: bcrypt
  import: bcrypt
  rust-version: "1.99"
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-setuptools-rust
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5060bce7e6c27f55e89d5b0d22b7ae0437a362f7
      repository: https://github.com/pyca/bcrypt
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: pyca/bcrypt
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - uses: test/tw/ldd-check
