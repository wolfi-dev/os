package:
  name: py3.14-beartype
  version: "0.23.0"
  epoch: 0
  description: Unbearably fast runtime type checking in pure Python.
  copyright:
    - license: MIT

vars:
  pypi-package: beartype
  import: beartype
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/beartype/beartype
      tag: v${{package.version}}
      expected-commit: ee36089262e0b7e0f5c6f2282d1ceb1c2cd78340

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: beartype/beartype
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - uses: py/one-python
      with:
        content: |
          python3 -c "import beartype; print(beartype.__version__)"
