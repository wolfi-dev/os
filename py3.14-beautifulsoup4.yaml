package:
  name: py3.14-beautifulsoup4
  version: "4.15.0"
  epoch: 0
  description: Screen-scraping library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-soupsieve
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: beautifulsoup4
  import: bs4
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.launchpad.net/beautifulsoup
      tag: ${{package.version}}
      expected-commit: 57443d602fb091bb89b638875b2f410f439094df

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - b\d+
  release-monitor:
    identifier: 3779

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          from bs4 import BeautifulSoup
