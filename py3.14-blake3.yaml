package:
  name: py3.14-blake3
  version: "1.0.11"
  epoch: 0
  description: Python bindings for the official Rust implementation of BLAKE3
  copyright:
    - license: CC0-1.0 OR Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions

vars:
  pypi-package: blake3
  import: blake3
  rust-version: "1.100"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - py${{vars.python-version}}-maturin
      - py${{vars.python-version}}-numpy-2.4 # upstream-tests: test dependency
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-typing-extensions # upstream-tests: runtime dependency
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/oconnor663/blake3-py
      tag: ${{package.version}}
      expected-commit: 8f6eccc03a938215df541174f3e8cdc374ee3a29

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
