package:
  name: py3.14-bleach
  version: "6.4.0"
  epoch: 0
  description: An easy safelist-based HTML-sanitizing tool.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-six
      - py${{vars.python-version}}-webencodings

vars:
  pypi-package: bleach
  import: bleach
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f0355a7af00500482c5292c6c83290c6a178068d
      repository: https://github.com/mozilla/bleach
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: false
  exclude-reason: Upstream mozilla/bleach was archived on 2026-06-05 after the final 6.4.0 release (upstream states no future releases, including for security issues); kept frozen as a dependency of py3-nbconvert. No further releases expected.
  manual: false
  github:
    identifier: mozilla/bleach
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
