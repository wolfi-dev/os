# Generated from https://pypi.org/project/bokeh/
package:
  name: py3.14-bokeh
  version: "3.10.2"
  epoch: 0
  description: Interactive plots and applications in the browser from Python
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-contourpy
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-narwhals
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pandas
      - py${{vars.python-version}}-pillow
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-tornado
      - py${{vars.python-version}}-xyzservices
  resources:
    cpu: "2"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: bokeh
  import: bokeh
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - nodejs-26
      - npm
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools-git-versioning
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bokeh/bokeh
      tag: ${{package.version}}
      expected-commit: d67dff250edae5ee5aa625d664058386513641b7

  # bokeh's build process requires full tag history.
  - runs: git fetch --tags

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: bokeh
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: bokeh

update:
  enabled: true
  github:
    identifier: bokeh/bokeh
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
