package:
  name: py3.14-boltons
  version: "26.2.0"
  epoch: 0
  description: When they're not builtins, they're boltons.
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: boltons
  import: boltons
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-gpep517

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mahmoud/boltons
      tag: ${{package.version}}
      expected-commit: 4332b35a278d694f30c99881faa61cde695c7a96

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: mahmoud/boltons

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
