package:
  name: py3.14-bracex
  version: "3.2.1"
  epoch: 0
  description: Bash style brace expander.
  copyright:
    - license: MIT

vars:
  pypi-package: bracex
  import: bracex
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/facelessuser/bracex
      tag: ${{package.version}}
      expected-commit: 18417e04b5c24106a1183ea8baafa73dca05c48f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: facelessuser/bracex
    strip-suffix: .post1

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
