# Generated from https://pypi.org/project/CacheControl/
package:
  name: py3.14-cachecontrol
  version: "0.14.4"
  epoch: 0
  description: httplib2 caching for requests
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-msgpack
      - py${{vars.python-version}}-requests
  resources:
    cpu: "15"
    memory: 8Gi

vars:
  pypi-package: cachecontrol
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-uv-build
      - py${{vars.python-version}}-uv-build-bin
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/psf/cachecontrol
      tag: v${{package.version}}
      expected-commit: aba0315599d7d4200074ab3606384732be7bbc25

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: py3.14-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - runs: |
            doesitcache -h
            doesitcache --help

update:
  enabled: true
  github:
    identifier: psf/cachecontrol
    use-tag: true
    tag-filter: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
