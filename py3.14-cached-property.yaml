package:
  name: py3.14-cached-property
  version: 2.0.1
  epoch: 0
  description: A decorator for caching properties in classes.
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: cached-property
  import: cached_property
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c032196d9afdf4b21d041c7d1492c95f5d1d6740
      repository: https://github.com/pydanny/cached-property
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: pydanny/cached-property

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
