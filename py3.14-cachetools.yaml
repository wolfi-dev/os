package:
  name: py3.14-cachetools
  version: "7.2.8"
  epoch: 1 # upstream-tests/pytest
  description: Extensible memoizing collections and decorators
  copyright:
    - license: MIT

vars:
  pypi-package: cachetools
  import: cachetools
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tkem/cachetools/
      tag: v${{package.version}}
      expected-commit: 340c474a11bdbdce46c9c6ff19ec9c693d038a4d

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  ignore-regex-patterns:
    - b\d+$
  git:
    strip-prefix: v
