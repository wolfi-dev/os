package:
  name: py3.14-cairo
  version: "1.29.2"
  epoch: 0
  description: Python3 bindings for the cairo graphics library
  copyright:
    - license: LGPL-2.1-only OR MPL-1.1
  resources:
    cpu: "2"
    memory: 2Gi

vars:
  pypi-package: cairo
  import: cairo
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cairo-dev
      - cmake
      - expat-dev
      - fontconfig-dev
      - freetype-dev
      - glibc-${{vars.glibc-version}}-dev
      - libpng-dev
      - py${{vars.python-version}}-meson-python
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - python-${{vars.python-version}}-base-dev
      - python3
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pygobject/pycairo
      expected-commit: 5617d48b204e817779c259d958470527f034cb96
      tag: v${{package.version}}

  - uses: meson/configure
    with:
      opts: |
        --buildtype=plain \
        -Db_lto=true \
        -Dpython=python${{vars.python-version}}

  - uses: meson/compile

  - uses: meson/install

  - uses: upstream-tests/meson-test

  - runs: |
      # The meson install is only used to run the upstream tests. The python
      # files are reinstalled by py/pip-build-install below, and the shared
      # header and pkgconfig file are shipped by py3-cairo, so drop them here
      # to avoid a file conflict with it.
      rm -rf ${{targets.destdir}}/usr/lib/python*
      rm -rf ${{targets.destdir}}/usr/include ${{targets.destdir}}/usr/lib/pkgconfig

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pygobject/pycairo
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - runs: |
        include="$(python${{vars.python-version}} -c 'import cairo; print(cairo.get_include())')"
        test -f "$include/py3cairo.h"
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-${{vars.pypi-package}}
