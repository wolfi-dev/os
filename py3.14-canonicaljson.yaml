package:
  name: py3.14-canonicaljson
  version: 2.0.0
  epoch: 0
  description: Canonical JSON
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: canonicaljson
  import: canonicaljson
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/matrix-org/python-canonicaljson
      tag: v${{package.version}}
      expected-commit: ebe1deeb8d24e44ae5f41156c6139febd807d17f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: matrix-org/python-canonicaljson
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
