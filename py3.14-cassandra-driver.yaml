# Generated from https://pypi.org/project/cassandra-driver/
package:
  name: py3.14-cassandra-driver
  version: "3.30.1"
  epoch: 0
  description: DataStax Driver for Apache Cassandra
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-deprecated
      - py${{vars.python-version}}-geomet
      - py${{vars.python-version}}-six
  resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libev-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - python-${{vars.python-version}}-base-dev

vars:
  pypi-package: cassandra-driver
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ec21afc66790b0ca2b202e35e85b468e871d507c
      repository: https://github.com/datastax/python-driver
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: datastax/python-driver
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: cassandra
