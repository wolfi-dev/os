package:
  name: py3.14-catalogus
  version: "0.1.2"
  epoch: 0
  description: Classes to provide name-to-object registry-like support
  copyright:
    - license: GPL-2.0-or-later

vars:
  pypi-package: catalogus
  import: catalogus
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-setuptools

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/breezy-team/catalogus
      tag: v${{package.version}}
      expected-commit: f6c13b20878088c9023945fc07ea85f1bf0baf64

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: breezy-team/catalogus
    use-tag: true
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
