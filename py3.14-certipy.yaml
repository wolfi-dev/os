package:
  name: py3.14-certipy
  version: "0.2.3"
  epoch: 0
  description: Utility to create and sign CAs and certificates
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-pyopenssl
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: certipy
  import: certipy
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/LLNL/certipy
      tag: v${{package.version}}
      expected-commit: 7ab30083ef8c6771d52e167e81073e12829f522d

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: LLNL/certipy
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
