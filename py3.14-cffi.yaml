package:
  name: py3.14-cffi
  version: "2.1.1"
  epoch: 3 # upstream-tests/pytest
  description: Foreign Function Interface for Python calling C code.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py3.14-pycparser
  resources:
    cpu: "2"
    memory: 6Gi

vars:
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libffi-dev
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-installer
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py3.14-pycparser # upstream-tests: runtime dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-cffi/cffi
      tag: v${{package.version}}
      expected-commit: fd33e7700f0ebafe6f30bd5053f13327221b77a2

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: cffi

update:
  enabled: true
  github:
    identifier: python-cffi/cffi
    strip-prefix: v
    tag-filter-prefix: v
