package:
  name: py3.14-changelog-chug
  version: 0.0.3
  epoch: 0
  description: Parser library for project Change Log documents.
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - py${{vars.python-version}}-docutils
      - py${{vars.python-version}}-semver
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: changelog-chug
  import: chug
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-docutils
      - py${{vars.python-version}}-semver

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.sr.ht/~bignose/changelog-chug
      tag: release/${{package.version}}
      expected-commit: 540d5330661ad26f4c934e8bb36024ffd2711719

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 375371

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
