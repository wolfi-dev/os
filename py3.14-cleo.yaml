package:
  name: py3.14-cleo
  version: 2.2.1
  epoch: 0
  description: Cleo allows you to create beautiful and testable command-line interfaces.
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 2Gi

vars:
  pypi-package: cleo
  import: cleo
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-poetry-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-poetry/cleo
      tag: ${{package.version}}
      expected-commit: b814a679109c35e22f4e92f076f5c6a63ecfa93b

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: python-poetry/cleo
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
