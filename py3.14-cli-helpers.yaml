package:
  name: py3.14-cli-helpers
  version: "2.15.5"
  epoch: 0 # rebuild to publish py3.14-cli-helpers-source
  description: Helpers for building command-line apps
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-configobj
      - py${{vars.python-version}}-tabulate
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: cli-helpers
  import: cli_helpers
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-configobj # upstream-tests: runtime dependency
      - py3.14-pygments # upstream-tests: test dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-tabulate # upstream-tests: runtime dependency
      - py3.14-wcwidth # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dbcli/cli_helpers
      tag: v${{package.version}}
      expected-commit: 039832121097b784f4bafea1f9d6ed0fa31ed72c

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: dbcli/cli_helpers
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
