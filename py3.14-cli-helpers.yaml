package:
  name: py3.14-cli-helpers
  version: "2.15.3"
  epoch: 0
  description: Helpers for building command-line apps
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-configobj
      - py${{vars.python-version}}-tabulate
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: cli-helpers
  import: cli_helpers
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dbcli/cli_helpers
      tag: v${{package.version}}
      expected-commit: 0116d6b64391201490d31bc5d289ea6c299b5e0f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: dbcli/cli_helpers
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
