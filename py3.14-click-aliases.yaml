package:
  name: py3.14-click-aliases
  version: "1.0.7"
  epoch: 0
  description: enable aliases for click
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-click

vars:
  pypi-package: click-aliases
  import: click_aliases
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-pluggy # upstream-tests: test dependency
      - py${{vars.python-version}}-poetry
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/click-contrib/click-aliases
      tag: v${{package.version}}
      expected-commit: 8341453c076dc616cd6e02aeaae13e2be73a46af

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: click-contrib/click-aliases
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
