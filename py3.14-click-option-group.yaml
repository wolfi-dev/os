package:
  name: py3.14-click-option-group
  version: "0.5.9"
  epoch: 0
  description: Option groups missing in Click.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-click
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: click-option-group
  import: click_option_group
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/click-contrib/click-option-group
      tag: v${{package.version}}
      expected-commit: 476fdc07bf698af1ab62614ce27bdcad07e0985e

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: click-contrib/click-option-group
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
