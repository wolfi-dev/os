# Generated from https://pypi.org/project/click/
package:
  name: py3.14-click
  version: "8.5.1"
  epoch: 0 # upstream-tests/pytest
  description: Composable command line interface toolkit
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-colorama
      - py${{vars.python-version}}-importlib-metadata
  resources:
    cpu: "1"
    memory: 6Gi

vars:
  python-version: 3.14
  pypi-package: click

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip
      - py3.14-colorama # upstream-tests: runtime dependency
      - py3.14-importlib-metadata # upstream-tests: runtime dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pallets/click
      tag: ${{package.version}}
      expected-commit: cf19179e8e2fd54c601378cec9e0d21bb12b6fb1

  - uses: py/pip-build-install

  - uses: upstream-tests/pytest

update:
  enabled: true
  github:
    identifier: pallets/click

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        import: click
