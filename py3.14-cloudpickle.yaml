package:
  name: py3.14-cloudpickle
  version: "3.1.3"
  epoch: 0 # upstream-tests/pytest
  description: Extended pickling support for Python objects
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 6Gi

vars:
  pypi-package: cloudpickle
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-installer
      - py${{vars.python-version}}-pip
      - py3.14-psutil # upstream-tests: test dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-tornado # upstream-tests: test dependency
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cloudpipe/cloudpickle
      expected-commit: 6de6909bcfb890dbf1910d52b1bc192506de42a1
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  ignore-regex-patterns:
    - ^\.
  enabled: true
  github:
    identifier: cloudpipe/cloudpickle
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: cloudpickle
