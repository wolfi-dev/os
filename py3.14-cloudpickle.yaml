package:
  name: py3.14-cloudpickle
  version: "3.1.2"
  epoch: 0
  description: Extended pickling support for Python objects
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 6Gi

vars:
  pypi-package: cloudpickle
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-installer
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cloudpipe/cloudpickle
      expected-commit: 7576fff24b9769432f76cc6d2c01282583ee87a9
      # Note: we don't normally cherry-pick, but this fixes an FTBFS; the alternative is
      # pinning flit-core 3.x, which is no longer built or supported. Drop on next upstream release.
      cherry-picks: |
        master/9608d892e55927b2c3c375a5b952ef23771e7d38: use PEP 621 metadata to fix building with flit-core >= 4
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  ignore-regex-patterns:
    - ^\.
  enabled: true
  github:
    identifier: cloudpipe/cloudpickle
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: cloudpickle
