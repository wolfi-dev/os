package:
  name: py3.14-codespell
  version: "2.4.3"
  epoch: 0
  description: 'checker for common misspellings '
  copyright:
    - license: GPL-2.0-or-later

vars:
  pypi-package: codespell
  import: codespell_lib
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/codespell-project/codespell
      tag: v${{package.version}}
      expected-commit: 57b21406f092110c18776e39b0bda50d37c945c8

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: codespell-project/codespell
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
