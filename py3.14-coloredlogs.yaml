package:
  name: py3.14-coloredlogs
  version: 15.0.1
  epoch: 0
  description: Simple cross-platform colored terminal text
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-humanfriendly
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: coloredlogs
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/xolox/python-coloredlogs
      tag: ${{package.version}}
      expected-commit: 65bdfe976ac0bf81e8c0bd9a98242b9d666b2859

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
        - py${{vars.python-version}}-pip
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - runs: |
        pip freeze | grep -F -e "${{vars.pypi-package}}-${{package.version}}"
    - runs: |
        LOGFILE=$(mktemp)
        python${{vars.python-version}} <<'EOF' 2>&1 | tee "${LOGFILE}"
        import coloredlogs, logging

        logger = logging.getLogger(__name__)
        coloredlogs.install(level='WARNING', logger=logger)
        logger.debug("this should not show up")
        logger.info("this should not show up")
        logger.warning("this is a warning message")
        logger.error("this is an error message")
        logger.critical("this is a critical message")
        EOF
        grep -F \
          -e "this is a warning message" \
          -e "this is an error message" \
          -e "this is a critical message" \
          "${LOGFILE}"
        if grep -F -e "this should not show up" "${LOGFILE}" ; then
          printf "%s\n" "Expected debug and info logs to be disabled by default" >&2
          exit 1
        fi
