package:
  name: py3.14-colorlog
  version: "6.12.0"
  epoch: 0
  description: Add colours to the output of Python's logging module.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-colorama
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: colorlog
  import: colorlog
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/borntyping/python-colorlog
      expected-commit: 868b53d31d3a0d7bfd1d96585dfba4627009073f
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: borntyping/python-colorlog
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
