package:
  name: py3.14-comm
  version: "0.2.3"
  epoch: 1 # upstream-tests/pytest
  description: Jupyter Python Comm implementation, for usage in ipykernel, xeus-python etc.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-traitlets

vars:
  pypi-package: comm
  import: comm
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-traitlets # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 057b00a49aabb97fb3c66eedcd97f09c6481d3c8
      repository: https://github.com/ipython/comm
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: ipython/comm
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
