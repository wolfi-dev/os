package:
  name: py3.14-commonmark
  version: "0.9.2"
  epoch: 3 # restore -bin subpackage dropped in the split
  description: Python parser for the CommonMark Markdown spec
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-future
  resources:
    memory: 1Gi
    cpu: "1"
  test-resources:
    cpu: "1"
    memory: 9Gi

vars:
  pypi-package: commonmark
  import: commonmark
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-future # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner

pipeline:
  - uses: git-checkout
    with:
      expected-commit: df7dcb7eae8b092a83654e791244b9fcaf11a871
      repository: https://github.com/rtfd/commonmark.py
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # Upstream tests are unittest modules not named for pytest; run them with unittest.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      runner: unittest
      paths: commonmark/tests
      args: -p "*.py"

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: cmark

update:
  enabled: false
  exclude-reason: Upstream rtfd/commonmark.py was archived on 2026-05-29 after the final deprecation release 0.9.2; kept frozen as a dependency of py3-recommonmark. No further releases expected.
  manual: false
  github:
    identifier: rtfd/commonmark.py

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
