package:
  name: py3.14-commonmark
  version: "0.9.2"
  epoch: 0
  description: Python parser for the CommonMark Markdown spec
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-future
  resources:
    memory: 1Gi
    cpu: "1"
  test-resources:
    cpu: "1"
    memory: 9Gi

vars:
  pypi-package: commonmark
  import: commonmark
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: df7dcb7eae8b092a83654e791244b9fcaf11a871
      repository: https://github.com/rtfd/commonmark.py
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: false
  exclude-reason: Upstream rtfd/commonmark.py was archived on 2026-05-29 after the final deprecation release 0.9.2; kept frozen as a dependency of py3-recommonmark. No further releases expected.
  manual: false
  github:
    identifier: rtfd/commonmark.py

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
