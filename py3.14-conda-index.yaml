package:
  name: py3.14-conda-index
  version: "0.13.0"
  epoch: 0
  description: An efficient library to read from new and old format .conda and .tar.bz2 conda packages.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-conda-package-streaming
      - py${{vars.python-version}}-filelock
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-msgpack
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-ruamel-yaml
      - py${{vars.python-version}}-zstandard
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # this is not named pypi-package because it is not on pypi
  package: conda-index
  import: conda_index
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/conda/conda-index
      tag: ${{package.version}}
      expected-commit: 1a14f8b9ec711fdc4ef4d2bf843435c643374ca8

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: conda/conda-index

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
