package:
  name: py3.14-conda-package-handling
  version: "2.6.0"
  epoch: 0
  description: Create and extract conda packages of various formats
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-conda-package-streaming
  resources:
    memory: 2Gi

vars:
  pypi-package: conda-package-handling
  import: conda_package_handling
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/conda/conda-package-handling
      tag: ${{package.version}}
      expected-commit: 9fed1cb0eb9f214f7e3acbee329d30324d35a50f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - apk-tools
      pipeline:
        - runs: |
            apk info -L ${{package.name}}-bin > "pkg.list"
            grep -F "usr/bin/" pkg.list > bins.list

            while read line; do
              echo "== $line =="
              /"$line" --help
            done < bins.list

update:
  enabled: true
  github:
    identifier: conda/conda-package-handling

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
