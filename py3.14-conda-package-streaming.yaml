package:
  name: py3.14-conda-package-streaming
  version: "0.13.0"
  epoch: 0
  description: An efficient library to read from new and old format .conda and .tar.bz2 conda packages.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-zstandard

vars:
  pypi-package: conda-package-streaming
  import: conda_package_streaming
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/conda/conda-package-streaming
      tag: v${{package.version}}
      expected-commit: f362d306cbc3e348b1661bbf45be38f426829326

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: conda/conda-package-streaming
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Uses stdlib compression.zstd
      runs: |
        # Upstream needs backports.zstd only below 3.14 and falls back to the
        # stdlib compression.zstd module on 3.14, so .conda support needs it.
        python${{vars.python-version}} -c '
        import compression.zstd
        from conda_package_streaming import create, package_streaming
        assert package_streaming.zstd is compression.zstd, package_streaming.zstd
        assert create.zstd is compression.zstd, create.zstd
        '
