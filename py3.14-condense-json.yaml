package:
  name: py3.14-condense-json
  version: "1.1"
  epoch: 0
  description: Python function for condensing JSON using replacement strings
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: condense-json
  import: condense_json
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 27e812f0765c396eb9f21c7e5172667290c0a9c0
      repository: https://github.com/simonw/condense-json
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git: {}

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
