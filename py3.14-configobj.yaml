package:
  name: py3.14-configobj
  version: 5.0.9
  epoch: 1 # upstream-tests/pytest
  description: Config file reading, writing and validation.
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-six

vars:
  pypi-package: configobj
  import: configobj
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-six # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/DiffSK/configobj
      tag: v${{package.version}}
      expected-commit: 242dfd09510e937574758da76ddc644b71f8cc4f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: DiffSK/configobj
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
