package:
  name: py3.14-contextlib2
  version: 21.6.0
  epoch: 0
  description: backports of the contextlib module from newer versions of python
  copyright:
    - license: PSF-2.0 AND Apache-2.0
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: contextlib2
  import: contextlib2
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jazzband/contextlib2
      tag: ${{package.version}}
      expected-commit: 94174bafebe58a79af6059883f604624ab087d18

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: jazzband/contextlib2

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
