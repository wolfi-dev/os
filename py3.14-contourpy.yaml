#nolint:unversioned-py3-dep
package:
  name: py3.14-contourpy
  version: "1.4.0"
  epoch: 0
  description: Python library for calculating contours of 2D quadrilateral grids
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-numpy-2.4
  resources:
    cpu: "5"
    memory: 9Gi

vars:
  glibc-version: "2.44"
  pypi-package: contourpy
  import: contourpy
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-${{vars.glibc-version}}
      - glibc-${{vars.glibc-version}}-dev
      - meson
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-meson-python
      - py${{vars.python-version}}-pybind11
      - py3-pybind11-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/contourpy/contourpy
      expected-commit: ae4126a0ff3e853f538a95a2911171952e8aacff
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: contourpy/contourpy
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          import contourpy._contourpy
    - uses: test/tw/ldd-check
    - name: Compute a contour with each C++ algorithm
      runs: |
        python${{vars.python-version}} - <<'PY'
        import numpy as np
        import contourpy
        z = np.array([[0.0, 1.0], [1.0, 2.0]])
        for name in ("serial", "threaded"):
            gen = contourpy.contour_generator(z=z, name=name, line_type="Separate")
            lines = gen.lines(0.5)
            assert len(lines) == 1, (name, lines)
            assert lines[0].shape == (2, 2), (name, lines[0])
            print(name, "ok", lines[0].tolist())
        PY
