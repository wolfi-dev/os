package:
  name: py3.14-coverage
  version: "7.17.3"
  epoch: 0
  description: Code coverage measurement for Python, with a C tracer extension
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: coverage
  import: coverage
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nedbat/coveragepy
      tag: ${{package.version}}
      expected-commit: e6580b2746f32a783b16542812f68f1562d51c56

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: verify C tracer extension was built
    runs: |
      # setup.py silently falls back to a pure-Python install when the
      # coverage.tracer extension fails to compile.
      find ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/coverage -name 'tracer*.so' | grep -q .

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: py${{vars.python-version}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/tw/pip-check
          with:
            python: python${{vars.python-version}}
        - uses: test/tw/ver-check
          with:
            bins: |
              coverage
              coverage3
              coverage-${{vars.python-version}}
        - uses: test/tw/help-check
          with:
            bins: coverage
        - name: console script reports the C extension
          runs: |
            coverage --version > ver.out
            cat ver.out
            grep -F "with C extension" ver.out
        - name: coverage run and coverage report
          runs: |
            work=$(mktemp -d)
            cd "$work" || exit 1
            cat > hello.py <<'EOF'
            import sys
            if len(sys.argv) > 1:
                print("args")
            print("hello")
            EOF
            coverage run hello.py > run.out
            grep -Fx "hello" run.out
            coverage report > report.out
            cat report.out
            grep -E "^hello.py +4 +1 +75%" report.out

test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          from coverage.tracer import CTracer
    - name: C tracer smoke test (upstream tests/smoke.py)
      runs: |
        python${{vars.python-version}} -c 'from coverage.tracer import CTracer; assert hasattr(CTracer(), "start"); print("CTracer OK!")' > smoke.out
        cat smoke.out
        grep -F "CTracer OK!" smoke.out
    - name: debug sys reports the packaged version
      runs: |
        python${{vars.python-version}} -m coverage debug sys > sys.out
        cat sys.out
        grep -E "coverage_version: +${{package.version}}" sys.out
    - name: run, report, json, xml and html via python -m coverage
      runs: |
        work=$(mktemp -d)
        cd "$work" || exit 1
        # classify(1) never reaches line 4, so 4 of 5 statements run and
        # the "if" on line 2 is a partial branch (1 of 2 arcs taken).
        cat > sample.py <<'EOF'
        def classify(n):
            if n > 0:
                return "positive"
            return "non-positive"

        print(classify(1))
        EOF

        python${{vars.python-version}} -m coverage run --branch sample.py > run.out
        grep -Fx "positive" run.out
        stat .coverage

        python${{vars.python-version}} -m coverage report -m > report.out
        cat report.out
        grep -E "^sample.py +5 +1 +2 +1 +71% +4" report.out
        grep -E "^TOTAL" report.out

        python${{vars.python-version}} -m coverage json -o cov.json
        python${{vars.python-version}} - <<'EOF'
        import json
        f = json.load(open("cov.json"))["files"]["sample.py"]
        s = f["summary"]
        assert f["missing_lines"] == [4], f["missing_lines"]
        assert s["num_statements"] == 5, s
        assert s["num_branches"] == 2, s
        assert s["num_partial_branches"] == 1, s
        print("json report OK")
        EOF

        python${{vars.python-version}} -m coverage xml -o cov.xml
        grep -F 'filename="sample.py"' cov.xml

        python${{vars.python-version}} -m coverage html -d htmlcov
        grep -F "sample.py" htmlcov/index.html

        python${{vars.python-version}} -m coverage erase
        test ! -e .coverage
    - name: running a missing file fails
      runs: |
        work=$(mktemp -d)
        cd "$work" || exit 1
        if python${{vars.python-version}} -m coverage run missing.py > err.out 2>&1; then
          echo "FAIL: coverage run of a missing file exited 0"
          exit 1
        fi
        cat err.out
        grep -F "No file to run" err.out

update:
  enabled: true
  ignore-regex-patterns:
    - 'a\d'
    - 'b\d'
    - 'rc\d'
  git: {}
