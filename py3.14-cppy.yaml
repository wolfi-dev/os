package:
  name: py3.14-cppy
  version: "1.3.1"
  epoch: 0
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-setuptools
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: cppy
  import: cppy
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-pip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nucleic/cppy
      expected-commit: 92caedc877b9ec93921ecd4c23bacaae212bf81d
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: nucleic/cppy

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
