# Generated from https://pypi.org/project/crashtest/
package:
  name: py3.14-crashtest
  version: 0.4.1
  epoch: 0
  description: Manage Python errors with ease
  copyright:
    - license: MIT

vars:
  pypi-package: crashtest
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-poetry-core
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sdispater/crashtest
      tag: ${{package.version}}
      expected-commit: c9b7dfa116e97e85022aa0abb35dba4247de3d5a

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: sdispater/crashtest

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
