package:
  name: py3.14-cryptography
  version: "50.0.2"
  epoch: 2 # rust: 1.98->1.99
  description: cryptography is a package which provides cryptographic recipes and primitives to Python developers.
  copyright:
    - license: Apache-2.0 OR BSD-3-Clause
  dependencies:
    runtime:
      - openssl-provider-legacy-allowed
      - py3.14-cffi
      - py3.14-typing-extensions
  resources:
    cpu: "2"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  openssl-version: "4.0"
  python-version: "3.14"
  rust-version: "1.99"

environment:
  environment:
    CFLAGS: -DOPENSSL_NO_ENGINE
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - openssl-${{vars.openssl-version}}-dev
      - py${{vars.python-version}}-cffi
      - py${{vars.python-version}}-maturin
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}-base-dev
      - rust-${{vars.rust-version}}
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pyca/cryptography/
      tag: ${{package.version}}
      expected-commit: 4dda5c7fe4ae71b8925f2551910a0ef959df9c7a

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import cryptography
          import cryptography.hazmat.primitives.ciphers

update:
  enabled: true
  github:
    identifier: pyca/cryptography
    use-tag: true
