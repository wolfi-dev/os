package:
  name: py3.14-cxxfilt
  version: 0.3.0
  epoch: 1 # upstream-tests/pytest
  description: Python interface to c++filt / abi::__cxa_demangle
  copyright:
    - license: BSD-2-Clause

vars:
  pypi-package: cxxfilt
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/afq984/python-cxxfilt
      tag: v${{package.version}}
      expected-commit: e61253349c87a2feecd2dbc2f826b2f0ab6beba5

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: afq984/python-cxxfilt
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
