package:
  name: py3.14-cycler
  version: 0.12.1
  epoch: 0
  description: Composable style cycles
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: cycler
  import: cycler
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/matplotlib/cycler
      expected-commit: 6115d5c55d66cdedb67ec5a0d6b52b6df52fd9d2
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: matplotlib/cycler
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
