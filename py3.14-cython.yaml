package:
  name: py3.14-cython
  version: "3.3.0"
  epoch: 1 # glibc: 2.43->2.44
  description: Cython is an optimising static compiler for both the Python & the extended Cython programming languages.
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: cython
  import: Cython
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cython/cython
      tag: ${{package.version}}
      expected-commit: bcd04a2966842d80de6ecff4e68e8d892bec5ef7

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: test/tw/ver-check
      with:
        bins: cython
        version: ${{package.version}}

update:
  enabled: true
  github:
    identifier: cython/cython
