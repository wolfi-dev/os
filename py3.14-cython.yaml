package:
  name: py3.14-cython
  version: "3.3.0"
  epoch: 2
  description: Cython is an optimising static compiler for both the Python & the extended Cython programming languages.
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: cython
  import: Cython
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cython/cython
      tag: ${{package.version}}
      expected-commit: bcd04a2966842d80de6ecff4e68e8d892bec5ef7

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # Move binaries out so the -bin subpackage can own them
  - runs: |
      mkdir -p ./cleanup/
      mv ${{targets.destdir}}/usr/bin ./cleanup/

  - uses: strip

subpackages:
  - name: py3.14-cython-bin
    description: Executable binaries for cython installed for python3.14
    dependencies:
      runtime:
        - py3.14-cython
      provides:
        - cython
      provider-priority: 100
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: cython
            version: ${{package.version}}

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}

update:
  enabled: true
  github:
    identifier: cython/cython
