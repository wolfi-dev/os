package:
  name: py3.14-dask
  version: "2026.11.0"
  epoch: 0
  description: Dask is a flexible parallel computing library for analytics.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-cloudpickle
      - py${{vars.python-version}}-fsspec
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-partd
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-toolz
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: dask
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-tomli
      - py${{vars.python-version}}-versioneer

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d360736af1032b502a2a6092e06783b2d3238e8d
      repository: https://github.com/dask/dask
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

# TODO: add the -dataframe and -diagnostics subpackages py3-dask builds
# once py3.14-pandas (PR #338190) and py3.14-bokeh (PR #331529) exist.
subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: dask

  - name: ${{package.name}}-array
    description: python${{vars.python-version}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
        - py${{vars.python-version}}-numpy-2.4
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{vars.python-version}}
      - name: Remove usr/bin executables - already provided
        runs: |
          rm -rf ${{targets.contextdir}}/usr/bin
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{vars.python-version}}
            imports: |
              import ${{vars.pypi-package}}.array

update:
  enabled: true
  ignore-regex-patterns:
    - ^v
  github:
    identifier: dask/dask
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
