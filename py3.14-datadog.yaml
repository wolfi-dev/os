package:
  name: py3.14-datadog
  version: "0.56.0"
  epoch: 2 # restore -bin subpackage dropped in the split
  description: The Datadog Python library
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-requests

vars:
  pypi-package: datadog
  import: datadog
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/DataDog/datadogpy
      tag: v${{package.version}}
      expected-commit: 6d1f53fb90985caad333ba5ce471871fae5c2d75

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: |
              dog
              dogshell
              dogshellwrap
              dogwrap
        - uses: test/tw/ver-check
          with:
            bins: |
              dog
              dogshell
              dogshellwrap
              dogwrap

update:
  enabled: true
  github:
    identifier: DataDog/datadogpy
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
