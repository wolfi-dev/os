# Generated from https://pypi.org/project/dbus-python/
package:
  name: py3.14-dbus-python
  version: "1.5.1"
  epoch: 0
  description: Python bindings for libdbus
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 7Gi

vars:
  glibc-version: "2.44"
  module_name: dbus
  pypi-package: dbus-python
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - dbus-dev
      - glib-dev
      - glibc-${{vars.glibc-version}}-dev
      - meson
      - patchelf
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-meson-python
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/dbus/dbus-python.git
      expected-commit: 3036add0105162cf7ca40b1bc8020e47fab7434d
      tag: dbus-python-${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  git:
    tag-filter-prefix: dbus-python-
    strip-prefix: dbus-python-

test:
  environment: {}
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.module_name}}
