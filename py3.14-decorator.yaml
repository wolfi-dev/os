# Generated from https://pypi.org/project/decorator/
package:
  name: py3.14-decorator
  version: "5.3.1"
  epoch: 0
  description: Decorators for Humans
  copyright:
    - license: BSD-2-Clause

vars:
  pypi-package: decorator
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-installer
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 426e9e35d563ffe356e54bd0f970d153b8f25370
      repository: https://github.com/micheles/decorator
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
