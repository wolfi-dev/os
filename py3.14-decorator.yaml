# Generated from https://pypi.org/project/decorator/
package:
  name: py3.14-decorator
  version: "5.3.2"
  epoch: 0 # rebuild to publish py3.14-decorator-source
  description: Decorators for Humans
  copyright:
    - license: BSD-2-Clause

vars:
  pypi-package: decorator
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-installer
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7354c684cc8c0a4bf3aea1f94a8ac5d1a0019d7d
      repository: https://github.com/micheles/decorator
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
