package:
  name: py3.14-deepmerge
  version: "4.0.0"
  epoch: 0
  description: A deep merging tool for Python core data structures
  copyright:
    - license: MIT

vars:
  pypi-package: deepmerge
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5be8369aa91213c67aa241e4fba7e5a41b29da22
      repository: https://github.com/toumorokoshi/deepmerge
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - "[a-z]+[0-9]+$"
  github:
    identifier: toumorokoshi/deepmerge
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - name: Test basic functionality
      runs: python${{vars.python-version}} test.py
