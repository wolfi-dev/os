package:
  name: py3.14-defusedxml
  version: 0.7.1
  epoch: 0
  description: XML bomb protection for Python stdlib modules
  copyright:
    - license: PSF-2.0
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: defusedxml
  import: defusedxml
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tiran/defusedxml
      tag: v${{package.version}}
      expected-commit: ebff1b493751e2f0775314bdd4188d64f07ea184

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: tiran/defusedxml
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
