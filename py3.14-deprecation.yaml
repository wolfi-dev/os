package:
  name: py3.14-deprecation
  version: 2.1.0
  epoch: 0
  description: A library to handle automated deprecations
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: deprecation
  import: deprecation
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c2c1e6b4360b0d1c4de48a61187a2173321ec7b9
      repository: https://github.com/briancurtin/deprecation
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: briancurtin/deprecation
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
