# Generated from https://pypi.org/project/diffoscope/
package:
  name: py3.14-diffoscope
  version: "336"
  epoch: 0
  description: in-depth comparison of files, archives, and directories
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-libarchive-c
      - py${{vars.python-version}}-magic
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-libarchive-c
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://salsa.debian.org/reproducible-builds/diffoscope
      tag: ${{package.version}}
      expected-commit: 6f676c6bef66a9f41451b9f623de6fc6840d9b0b

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.destdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: py3.14-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
      provides:
        - diffoscope
        - py3-${{vars.pypi-package}}-bin
      # Low priority so py3.13-diffoscope-bin remains the default.
      provider-priority: 100
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: diffoscope

update:
  enabled: true
  release-monitor:
    identifier: 31806

vars:
  import: diffoscope
  glibc-version: "2.44"
  pypi-package: diffoscope
  python-version: "3.14"

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.import}}
        python: python${{vars.python-version}}
