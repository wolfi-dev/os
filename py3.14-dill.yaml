# Generated from https://pypi.org/project/dill/
package:
  name: py3.14-dill
  version: "0.4.1"
  epoch: 0
  description: serialize all of Python
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: dill
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a9d4d39c411296fb3608c4ffd142134559942d21
      repository: https://github.com/uqfoundation/dill
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: "move usr/bin executables for -bin"
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - dill-
  github:
    identifier: uqfoundation/dill

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
