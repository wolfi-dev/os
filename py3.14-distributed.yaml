package:
  name: py3.14-distributed
  version: "2026.11.0"
  epoch: 0
  description: A distributed task scheduler for Dask
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-cloudpickle
      - py${{vars.python-version}}-dask
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-locket
      - py${{vars.python-version}}-msgpack
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-psutil
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-sortedcontainers
      - py${{vars.python-version}}-tblib
      - py${{vars.python-version}}-toolz
      - py${{vars.python-version}}-tornado
      - py${{vars.python-version}}-urllib3
      - py${{vars.python-version}}-zict
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: distributed
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-versioneer

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0d9f333af38537ee2284e7e2a45b669dc0cc48cd
      repository: https://github.com/dask/distributed
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: dask/distributed
    use-tag: true

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-dask-bin
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
    - name: Test importing key modules
      runs: |
        cat > test.py <<EOF
        from ${{vars.pypi-package}} import Client
        from ${{vars.pypi-package}}.diagnostics.progressbar import progress
        EOF

        python${{vars.python-version}} test.py
    - name: Test dask subcommands work
      runs: |
        dask scheduler --help
        dask ssh --help
        dask worker --help
