package:
  name: py3.14-distro
  version: 1.9.0
  epoch: 1 # upstream-tests/pytest
  description: A Linux OS platform information API
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 6Gi

vars:
  pypi-package: distro
  python-version: "3.14"

environment:
  contents:
    packages:
      - bash # upstream-tests: test dependency
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-distro/distro
      tag: v${{package.version}}
      expected-commit: 8d88a2d72a3dbdb1d1443788c2e0142658b2b0ba

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - name: "move usr/bin executables for -bin"
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: python-distro/distro
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
