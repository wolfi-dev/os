package:
  name: py3.14-dnspython
  version: "2.9.2"
  epoch: 1 # upstream-tests/pytest
  description: DNS toolkit
  copyright:
    - license: ISC
  resources:
    cpu: "1"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: dnspython
  import: dns
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-idna # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-uv-build-bin

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rthalley/dnspython
      tag: v${{package.version}}
      expected-commit: 854bedd6d641cb42785d26ca674ed2c0f20131e0

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: rthalley/dnspython
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
