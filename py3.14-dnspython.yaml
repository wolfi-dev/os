package:
  name: py3.14-dnspython
  version: "2.9.0"
  epoch: 0
  description: DNS toolkit
  copyright:
    - license: ISC
  resources:
    cpu: "1"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: dnspython
  import: dns
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-uv-build-bin

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rthalley/dnspython
      tag: v${{package.version}}
      expected-commit: e790c8f20a67ad439c7aafef2321e161c6028eee

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: rthalley/dnspython
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
