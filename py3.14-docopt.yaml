package:
  name: py3.14-docopt
  version: 0.6.2
  epoch: 0
  description: Pythonic argument parser, that will make you smile
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: docopt
  import: docopt
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/docopt/docopt
      tag: ${{package.version}}
      expected-commit: 944641a7357376a43151bd4a3ca44f9c07c4d1ae

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: docopt/docopt
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
