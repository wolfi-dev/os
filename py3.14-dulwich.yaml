# Generated from https://pypi.org/project/dulwich/
package:
  name: py3.14-dulwich
  version: "1.2.22"
  epoch: 0 # restore -bin subpackage dropped in the split
  description: Python Git Library
  copyright:
    - license: Apache-2.0 AND GPL-2.0-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
      - py${{vars.python-version}}-urllib3
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: dulwich
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools-rust
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jelmer/dulwich
      tag: dulwich-${{package.version}}
      expected-commit: d2d103680a7463ed7334c51f9a2a7de82283cdf1

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - runs: |
            dulwich help

update:
  enabled: true
  github:
    identifier: jelmer/dulwich
    tag-filter: dulwich-
    strip-prefix: dulwich-

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
