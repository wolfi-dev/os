package:
  name: py3.14-dunamai
  version: "1.26.2"
  epoch: 0
  description: Dynamic, standards-compliant version strings from version control system tags
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
  resources:
    cpu: "2"
    memory: 6Gi
  test-resources:
    cpu: "2"
    memory: 7Gi

vars:
  pypi-package: dunamai
  module-name: dunamai
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-poetry-core
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mtkennerly/dunamai
      tag: v${{package.version}}
      expected-commit: 99257d0f25970ca2045427b8ddf787cb266ec07e

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.module-name}}
