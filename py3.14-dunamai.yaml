package:
  name: py3.14-dunamai
  version: "1.26.5"
  epoch: 2 # restore -bin subpackage dropped in the split
  description: Dynamic, standards-compliant version strings from version control system tags
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
  resources:
    cpu: "2"
    memory: 6Gi
  test-resources:
    cpu: "2"
    memory: 7Gi

vars:
  pypi-package: dunamai
  module-name: dunamai
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-packaging # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-poetry-core
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mtkennerly/dunamai
      tag: v${{package.version}}
      expected-commit: 78c7620b6dabbfe1df07283d61f350c22944aa8c

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # test__version__from_git__shallow clones github.com; the build has no network.
  # TODO(upstream-tests): drop once upstream marks it as needing network.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore: tests/integration/test_dunamai.py::test__version__from_git__shallow

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - name: dunamai validates version strings
          runs: |
            dunamai check 1.2.3 --style semver
            if dunamai check 0.01.0 --style semver; then
              echo "dunamai accepted 0.01.0, which is not valid SemVer"
              exit 1
            fi

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.module-name}}
