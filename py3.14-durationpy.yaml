package:
  name: py3.14-durationpy
  version: "0.11"
  epoch: 0
  description: Module for converting between datetime.timedelta and Go's time.Duration strings.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-frozenlist
  resources:
    cpu: "3"
    memory: 2Gi

vars:
  pypi-package: durationpy
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-frozenlist # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/icholy/durationpy.git
      tag: ${{package.version}}
      expected-commit: 3df7a337a852f0b432f73c4892c4b48590a01bd0

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    use-tag: true
    identifier: icholy/durationpy

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
