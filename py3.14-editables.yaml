package:
  name: py3.14-editables
  version: "0.6"
  epoch: 0
  description: Editable installations
  copyright:
    - license: MIT
  resources:
    memory: 2Gi

vars:
  pypi-package: editables
  import: editables
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pfmoore/editables
      tag: ${{package.version}}
      expected-commit: 6bb75a27a5177825e4e178a8f02421802c654b40

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pfmoore/editables
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
