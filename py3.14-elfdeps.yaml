package:
  name: py3.14-elfdeps
  version: "0.4.0"
  epoch: 0
  description: Python implementation of RPM elfdeps
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-pyelftools
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  module_name: elfdeps
  pypi-package: elfdeps
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pyelftools # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-setuptools-scm
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-wheel-build/elfdeps
      expected-commit: 67570c7b3e792af94d38375f341f2983e6f1703f
      tag: ${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  github:
    identifier: python-wheel-build/elfdeps
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.module_name}}
