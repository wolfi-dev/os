package:
  name: py3.14-entrypoints
  version: "0.4.2"
  epoch: 0
  description: Discover and load entry points from installed packages.
  copyright:
    - license: MIT
  resources:
    memory: 2Gi

vars:
  pypi-package: entrypoints
  import: entrypoints
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8c5b286a3c9b0b723b8145dcafcccab4c29fe165
      repository: https://github.com/takluyver/entrypoints
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: takluyver/entrypoints
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
