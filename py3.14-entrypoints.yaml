package:
  name: py3.14-entrypoints
  version: '0.4'
  epoch: 0
  description: Discover and load entry points from installed packages.
  copyright:
    - license: MIT
  resources:
    memory: 2Gi

vars:
  pypi-package: entrypoints
  import: entrypoints
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ebdf2d8edc9921427ea07688851999796093c240
      # Note: we don't normally cherry-pick, but this fixes an FTBFS; the alternative is
      # pinning flit-core 3.x, which is no longer built or supported. Drop on next upstream release.
      cherry-picks: |
        master/1333ae592d0261e6a014ef4c0fb25086ab0919dc: use PEP 621 metadata to support flit-core >= 4
      repository: https://github.com/takluyver/entrypoints
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: takluyver/entrypoints
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
