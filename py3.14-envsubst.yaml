package:
  name: py3.14-envsubst
  version: "0.1.5"
  epoch: 0
  description: Substitute environment variables in a python string
  copyright:
    - license: MIT
  resources:
    cpu: "3"
    memory: 2Gi

vars:
  pypi-package: envsubst
  module-name: envsubst
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ashafer01/python-envsubst
      tag: v${{package.version}}
      expected-commit: ac2a3f58100aa5bdc3d420e9ca3d1a56b4f16ccb

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  github:
    identifier: ashafer01/python-envsubst
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.module-name}}
