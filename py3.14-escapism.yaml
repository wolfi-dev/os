package:
  name: py3.14-escapism
  version: "1.1.0"
  epoch: 0
  description: Simple, generic API for escaping strings.
  copyright:
    - license: MIT

vars:
  pypi-package: escapism
  import: escapism
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0e45b91ffce1ab182f43eb25b4566d89fc99c208
      repository: https://github.com/jupyterhub/escapism
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
