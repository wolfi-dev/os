package:
  name: py3.14-etcd
  version: "0.4.5"
  epoch: 0
  description: A python client for etcd.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-dnspython
      - py${{vars.python-version}}-urllib3
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: etcd
  import: etcd
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 96f2ff4e1d5143d617e0f9c2c57eb08fd3b2ea03
      repository: https://github.com/jplana/python-etcd
      tag: ${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: jplana/python-etcd
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Write and read a key through a stub etcd v2 endpoint
      runs: |
        out=$(python${{vars.python-version}} client.py "/nodes/test" "test_data_123")
        echo "$out" | grep -F "test_data_123"
