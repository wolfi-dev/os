package:
  name: py3.14-evalidate
  version: "2.1.7"
  epoch: 0
  description: Discover and load entry points from installed packages.
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: evalidate
  import: evalidate
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: fad300429515e73842c3c4c25d12d29e16ca4131
      repository: https://github.com/yaroslaff/evalidate
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: yaroslaff/evalidate
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
