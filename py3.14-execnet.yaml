# Generated from https://pypi.org/project/execnet/
package:
  name: py3.14-execnet
  version: "2.1.2"
  epoch: 0
  description: "distributed Python deployment and communication"
  copyright:
    - license: MIT
  resources:
    cpu: "3"
    memory: 2Gi

vars:
  pypi-package: execnet
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9313ece783ba2bd565eb1a2a8a71be441af56199
      repository: https://github.com/pytest-dev/execnet
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pytest-dev/execnet
    use-tag: true
    strip-prefix: v
  ignore-regex-patterns:
    - 1.5.0.dev # Bad tag

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - name: Test execnet core functionality
      runs: |
        python${{vars.python-version}} <<'EOF'
        import execnet

        # Test local subprocess gateway creation
        gw = execnet.makegateway("popen")
        assert gw is not None, "Failed to create gateway"

        # Test remote code execution via channel
        ch = gw.remote_exec("channel.send(42)")
        result = ch.receive()
        assert result == 42, f"Expected 42, got {result}"

        # Test sending data to remote
        ch = gw.remote_exec("""
        val = channel.receive()
        channel.send(val * 2)
        """)
        ch.send(21)
        result = ch.receive()
        assert result == 42, f"Expected 42, got {result}"

        gw.exit()

        # Test MultiChannel / group
        group = execnet.Group()
        gw2 = group.makegateway("popen")
        ch2 = gw2.remote_exec("channel.send('hello from execnet')")
        msg = ch2.receive()
        assert msg == "hello from execnet", f"Unexpected message: {msg}"
        group.terminate()

        print("All execnet tests passed")
        EOF
