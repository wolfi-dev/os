package:
  name: py3.14-executing
  version: 2.1.0
  epoch: 0
  description: Get the currently executing AST node of a frame, and other information
  copyright:
    - license: MIT
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: executing
  import: executing
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8827340e154c557b64fda9ee50115bc958da20dc
      repository: https://github.com/alexmojaki/executing
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: alexmojaki/executing
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
