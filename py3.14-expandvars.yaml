# Generated from https://pypi.org/project/expandvars/
package:
  name: py3.14-expandvars
  version: "1.1.2"
  epoch: 0
  description: Expand system variables Unix style
  copyright:
    - license: MIT
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: expandvars
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: bfdd3f6cf86934f2c3318dd949676aa382be4a89
      repository: https://github.com/sayanarijit/expandvars
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: sayanarijit/expandvars
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: expandvars
