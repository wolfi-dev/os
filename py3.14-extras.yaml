package:
  name: py3.14-extras
  version: 1.0.0
  epoch: 0
  description: Useful extra bits for Python - things that shold be in the standard library
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: extras
  import: extras
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e3b5a1b7bd0510a8bdd1cc0cf7933df28012d147
      repository: https://github.com/testing-cabal/extras
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: testing-cabal/extras
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
