package:
  name: py3.14-face
  version: "26.0.1"
  epoch: 1 # upstream-tests/pytest
  description: A command-line application framework (and CLI parser). Friendly for users, full-featured for developers.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-boltons
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: face
  import: face
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-gpep517
      - py3.14-boltons # upstream-tests: runtime dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mahmoud/face
      tag: v${{package.version}}
      expected-commit: 86ec4072580809cc3978f5d6bb40261eb60c3045

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: mahmoud/face
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
