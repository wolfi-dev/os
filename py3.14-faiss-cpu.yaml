package:
  name: py3.14-faiss-cpu
  version: "1.16.0"
  epoch: 0
  description: faiss-cpu Python wheels built from the official faiss repository
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - faiss-cpu
      - py${{vars.python-version}}-numpy-${{vars.numpy-version}}
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-setuptools
  resources:
    cpu: "8"
    memory: 11Gi

vars:
  glibc-version: "2.44"
  import: faiss
  numpy-version: "2.4"
  pypi-package: faiss-cpu
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - cmake
      - coreutils
      - faiss-cpu
      - gfortran
      - glibc-${{vars.glibc-version}}-dev
      - openblas-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-numpy-${{vars.numpy-version}}
      - py${{vars.python-version}}-scikit-build-core
      - swig

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6ccfd5f9be2283ebc037564bb45c6ba63b71e96a
      repository: https://github.com/facebookresearch/faiss
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: dont-build-with-stable-abi.patch build-generic-opt-level.patch

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: facebookresearch/faiss
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - runs: mkdir -p sift1M
    - name: Fetch demo dataset
      uses: fetch
      with:
        directory: sift1M
        expected-sha256: 92f1270c5e3a0cb46b89983e72b0511e4df065c31a9fa0276d8c9b1fca5bc81a
        uri: ftp://ftp.irisa.fr/local/texmex/corpus/sift.tar.gz
    - name: Test loading data for index server
      runs: |
        for stage in 0 4
        do
          python${{vars.python-version}} demo_client_server_ivf.py $stage
        done
