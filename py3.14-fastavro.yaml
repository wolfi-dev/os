package:
  name: py3.14-fastavro
  version: "1.13.0"
  epoch: 0
  description: Fast read/write of AVRO files
  copyright:
    - license: MIT

vars:
  pypi-package: fastavro
  import: fastavro
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cython

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c6e820803aae81264c878193e82603437985ddaa
      repository: https://github.com/fastavro/fastavro
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: fastavro
            version: ${{package.version}}

update:
  enabled: true
  manual: false
  github:
    identifier: fastavro/fastavro

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - uses: test/tw/ldd-check
