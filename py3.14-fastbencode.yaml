package:
  name: py3.14-fastbencode
  version: "0.3.12"
  epoch: 1 # upstream-tests/pytest
  description: Implementation of bencode with optional fast C extensions
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "2"
    memory: 9Gi

vars:
  pypi-package: fastbencode
  import: fastbencode
  rust-version: "1.99"
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-setuptools-rust
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f6d6bab09fc057c89c84c1fca1980dfdb0b50404
      repository: https://github.com/breezy-team/fastbencode
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      runner: unittest

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: breezy-team/fastbencode
    use-tag: true
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
