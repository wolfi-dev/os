package:
  name: py3.14-fasteners
  version: "0.20"
  epoch: 2 # upstream-tests/pytest
  description: A python package that provides useful locks
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 3Gi

vars:
  pypi-package: fasteners
  import: fasteners
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-more-itertools # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 87839f4acc6660856c67963b128dedd84e94907d
      repository: https://github.com/harlowja/fasteners
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # test_eventlet.py needs eventlet and test_reader_writer_lock.py needs diskcache; neither is packaged.
  # TODO(upstream-tests): package py3.14-eventlet and py3.14-diskcache and drop ignore-files.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore-files: tests/test_eventlet.py tests/test_reader_writer_lock.py

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: harlowja/fasteners

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
