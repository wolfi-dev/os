package:
  name: py3.14-fastjsonschema
  version: "2.22.2"
  epoch: 0
  description: Fastest Python implementation of JSON schema
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: fastjsonschema
  import: fastjsonschema
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: b88fa37cd46bb81e8d9dce91a7e1bc4debedd3a2
      repository: https://github.com/horejsek/python-fastjsonschema
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: horejsek/python-fastjsonschema
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
