package:
  name: py3.14-findpython
  version: "0.8.0"
  epoch: 0
  description: A utility to find python versions on your system
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-platformdirs
    provides:
      - findpython=${{package.full-version}}
  resources:
    cpu: "4"
    memory: 6Gi

vars:
  pypi-package: findpython
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/frostming/findpython
      tag: ${{package.version}}
      expected-commit: 29fce2305091137a8d48d0c672f62cf80fb80b9b

  - runs: pip${{vars.python-version}} install pdm-backend

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: frostming/findpython

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
