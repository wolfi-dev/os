package:
  name: py3.14-findpython
  version: "0.9.0"
  epoch: 2 # upstream-tests/pytest
  description: A utility to find python versions on your system
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-platformdirs
    provides:
      - findpython=${{package.full-version}}
  resources:
    cpu: "4"
    memory: 6Gi

vars:
  pypi-package: findpython
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-packaging # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-platformdirs # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/frostming/findpython
      tag: ${{package.version}}
      expected-commit: 8af8583f298437f6881964d5ec08f6f737ee00b9

  - runs: pip${{vars.python-version}} install pdm-backend

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # test_find_python_exclude_unreadable chmods a file unreadable; the build runs as root, which can still read it.
  # TODO(upstream-tests): drop once the suite runs as non-root.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore: tests/test_posix.py::test_find_python_exclude_unreadable

  - uses: strip

update:
  enabled: true
  github:
    identifier: frostming/findpython

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
