package:
  name: py3.14-flask-cors
  version: "6.0.5"
  epoch: 0
  description: A Flask extension adding a decorator for CORS support
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-flask
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: flask-cors
  import: flask_cors
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 91ebc49c25aaf76b0e53e925feef1e3f19617c87
      repository: https://github.com/corydolphin/flask-cors
      tag: ${{package.version}}

  - runs: |
      # Update version before installation, per upstream's release scripting:
      # https://github.com/corydolphin/flask-cors/blob/5da9be479b4fb203816bca9eb0cfb7add5eeceb5/.github/workflows/on-release-main.yml#L18-L21
      sed -i "s/^version = \".*\"/version = \"${{package.version}}\"/" pyproject.toml

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - v.*
  github:
    identifier: corydolphin/flask-cors

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
