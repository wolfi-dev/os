package:
  name: py3.14-flask
  version: "3.1.3"
  epoch: 0
  description: A simple framework for building complex web applications.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-blinker
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-importlib-metadata
      - py${{vars.python-version}}-itsdangerous
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-werkzeug
  resources:
    cpu: "5"
    memory: 4Gi

vars:
  pypi-package: flask
  import: flask
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pallets/flask
      tag: ${{package.version}}
      expected-commit: 22d924701a6ae2e4cd01e9a15bbaf3946094af65

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.destdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: py${{vars.python-version}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - curl
      pipeline:
        - runs: |
            flask --version
        - name: Test Flask Installation and Server Running Capability
          uses: test/daemon-check-output
          with:
            setup: |
              cat <<"EOF" > /tmp/flask_app.py
              from flask import Flask
              app = Flask(__name__)

              @app.route("/")
              def hello_world():
                return "hello-py3.14-flask"
              EOF
            start: flask --app /tmp/flask_app.py run
            expected_output: |
              Running on http://127.0.0.1:5000
            post: |
              exp="hello-py3.14-flask"
              out=$(curl -s "http://127.0.0.1:5000/")
              [ "$out" = "$exp" ] || {
                echo "FAIL: expected '$exp'. found '$out'"
                exit 1
              }
              echo "PASS: flask said '$exp'"

update:
  enabled: true
  github:
    identifier: pallets/flask

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
