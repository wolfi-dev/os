package:
  name: py3.14-flit-scm
  version: 1.7.0
  epoch: 2
  description: A PEP 518 build backend that uses setuptools_scm and flit_core
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-setuptools-scm
      - py${{vars.python-version}}-tomli

vars:
  pypi-package: flit-scm
  import: flit_scm
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-setuptools-scm
      - py${{vars.python-version}}-tomli
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/WillDaSilva/flit_scm.git
      expected-commit: 27ac37a0eabb46433b53b109a61576d4b712ddc0
      tag: ${{package.version}}

  - runs: |
      # flit-core 4.x is compatible; upstream pins flit-core~=3.5
      sed -i 's/flit-core~=3.5/flit-core>=3.5/g' pyproject.toml
      grep -q 'flit-core>=3.5' pyproject.toml

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    environment:
      # The flit-core pin relaxation above dirties the git tree, which would
      # make setuptools_scm report a dev version instead of the release.
      # Scoped to this step: top-level environment variables also leak into
      # the test environment and would override the demo build's version.
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}

  - uses: strip

test:
  environment:
    contents:
      packages:
        - git
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
    - name: Verify reported version
      runs: |
        cd /tmp
        python${{vars.python-version}} -c 'import flit_scm; print(flit_scm.__version__)' > version.txt
        cat version.txt
        grep -Fx "${{package.version}}" version.txt
    - name: Build a wheel and sdist with the flit_scm backend
      runs: |
        mkdir -p /tmp/demo/demo_pkg /tmp/demo/dist
        cd /tmp/demo
        cat > pyproject.toml <<'EOF'
        [build-system]
        requires = ["flit_scm"]
        build-backend = "flit_scm:buildapi"

        [project]
        name = "demo_pkg"
        description = "Demo package for flit_scm"
        dynamic = ["version"]

        [tool.setuptools_scm]
        write_to = "demo_pkg/_version.py"
        EOF
        cat > demo_pkg/__init__.py <<'EOF'
        from ._version import version as __version__
        EOF
        git init -q
        git config user.email test@example.com
        git config user.name test
        git add -A
        git commit -q -m init
        git tag 1.2.3
        python${{vars.python-version}} - <<'EOF'
        import zipfile
        from flit_scm import buildapi
        wheel = buildapi.build_wheel("dist")
        sdist = buildapi.build_sdist("dist")
        print(wheel, sdist)
        assert wheel == "demo_pkg-1.2.3-py2.py3-none-any.whl", wheel
        assert sdist == "demo_pkg-1.2.3.tar.gz", sdist
        with zipfile.ZipFile("dist/" + wheel) as zf:
            names = zf.namelist()
            assert "demo_pkg/_version.py" in names, names
            meta = zf.read("demo_pkg-1.2.3.dist-info/METADATA").decode()
            assert "Version: 1.2.3" in meta, meta
        EOF
        grep -F "1.2.3" demo_pkg/_version.py

update:
  enabled: true
  release-monitor:
    identifier: 250223
