package:
  name: py3.14-fonttools
  version: "4.68.0"
  epoch: 0
  description: Tools to manipulate font files
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: fonttools
  import: fontTools
  # the manual pages out of this interpreter's subpackage.
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fonttools/fonttools
      expected-commit: e1013ec2fc99ee864e232259f7a7103ba425a80b
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: fonttools/fonttools

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
