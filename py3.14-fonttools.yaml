package:
  name: py3.14-fonttools
  version: "4.68.0"
  epoch: 3 # restore -bin subpackage dropped in the split
  description: Tools to manipulate font files
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: fonttools
  import: fontTools
  # the manual pages out of this interpreter's subpackage.
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fonttools/fonttools
      expected-commit: e1013ec2fc99ee864e232259f7a7103ba425a80b
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - runs: |
            fonttools --help
            pyftsubset --help
            ttx --version

update:
  enabled: true
  github:
    identifier: fonttools/fonttools

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
