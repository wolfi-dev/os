package:
  name: py3.14-fqdn
  version: "1.6.0"
  epoch: 0
  description: RFC-compliant FQDN validation and manipulation for Python.
  copyright:
    - license: MPL-2.0
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: fqdn
  import: fqdn
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a71a6c047b90e68f21edeab44f171d7b673867c4
      repository: https://github.com/ypcrts/fqdn
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ypcrts/fqdn
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Test basic fqdn functionality
      runs: |
        cat >> test.py <<'EOF'
        from fqdn import FQDN

        cg_fqdn = FQDN("chainguard.dev")

        assert cg_fqdn.is_valid
        assert cg_fqdn.absolute == "chainguard.dev."
        assert cg_fqdn.relative == "chainguard.dev"
        EOF

        python${{vars.python-version}} test.py
