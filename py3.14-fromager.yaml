package:
  name: py3.14-fromager
  version: "0.105.0"
  epoch: 0
  description: Wheel maker
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - patch
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-elfdeps
      - py${{vars.python-version}}-html5lib
      - py${{vars.python-version}}-license-expression
      - py${{vars.python-version}}-packageurl-python
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pkginfo
      - py${{vars.python-version}}-psutil
      - py${{vars.python-version}}-pydantic
      - py${{vars.python-version}}-pygithub
      - py${{vars.python-version}}-pypi-simple
      - py${{vars.python-version}}-pyproject-hooks
      - py${{vars.python-version}}-python-pypi-mirror
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-resolvelib
      - py${{vars.python-version}}-rich
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-starlette
      - py${{vars.python-version}}-stevedore
      - py${{vars.python-version}}-tomlkit
      - py${{vars.python-version}}-tqdm
      - py${{vars.python-version}}-uvicorn
      - py${{vars.python-version}}-virtualenv
      - py${{vars.python-version}}-wheel-bin
      - uv
  resources:
    cpu: "2"
    memory: 7Gi

vars:
  module_name: fromager
  pypi-package: fromager
  glibc-version: "2.44"
  python-version: "3.14"

# py3.12 or greater (v0.79.0 requires Python >= 3.12)
environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-setuptools-scm
      - py${{vars.python-version}}-wheel
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-wheel-build/fromager
      expected-commit: 8ea2e134ea7cd710790395a2e494705e805591c2
      tag: ${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  github:
    identifier: python-wheel-build/fromager

test:
  pipeline:
    - name: Import Test
      uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.module_name}}
    - uses: test/tw/help-check
      with:
        bins: fromager
    - runs: |
        fromager bootstrap setuptools
