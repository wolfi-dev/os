# Generated from https://pypi.org/project/frozendict/
package:
  name: py3.14-frozendict
  version: "2.4.7"
  epoch: 0
  description: A simple immutable dictionary
  copyright:
    - license: LGPL-3.0-or-later
  dependencies:
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  import: frozendict
  pypi-package: frozendict
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d4ee7590e2b507fd68124cd8a593778ce3c1158b
      repository: https://github.com/Marco-Sulla/python-frozendict
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  github:
    identifier: Marco-Sulla/python-frozendict
    strip-prefix: v

test:
  environment: {}
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
