package:
  name: py3.14-frozenlist
  version: "1.8.0"
  epoch: 0
  description: A list-like structure which implements collections.abc.MutableSequence
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: frozenlist
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-expandvars
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aio-libs/frozenlist
      tag: v${{package.version}}
      expected-commit: 48324affeecc2fff8f84f38368f720426c0354cf

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: aio-libs/frozenlist

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
