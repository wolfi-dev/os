# Generated from https://pypi.org/project/fsspec/
package:
  name: py3.14-fsspec
  version: "2026.9.0"
  epoch: 0
  description: File-system specification
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - wolfi-base

vars:
  glibc-version: "2.44"
  pypi-package: fsspec
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0f76baaae4a227b085b18e8469e6cc1792a95ade
      repository: https://github.com/fsspec/filesystem_spec
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: fsspec/filesystem_spec
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
