package:
  name: py3.14-gcovr
  version: "8.6"
  epoch: 0
  description: Generate C/C++ code coverage reports with gcov
  copyright:
    - license: BSD-3-Clause # according to https://github.com/gcovr/gcovr/tree/master#license
  dependencies:
    runtime:
      - py${{vars.python-version}}-colorlog
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-lxml
      - py${{vars.python-version}}-pygments
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: gcovr
  import: gcovr
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e01ad73582821b5f90e079482164f8e885121e57
      repository: https://github.com/gcovr/gcovr
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.destdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: py3.14-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: gcovr

update:
  enabled: true
  github:
    identifier: gcovr/gcovr
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
