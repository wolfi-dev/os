# Generated from https://pypi.org/project/geomet/
package:
  name: py3.14-geomet
  version: 1.1.0
  epoch: 0
  description: Pure Python conversion library for common geospatial data formats
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-click
  resources:
    cpu: "2"
    memory: 7Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

vars:
  pypi-package: geomet
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/geomet/geomet
      tag: ${{package.version}}
      expected-commit: 6ac73c312b52aca328db2e61d90c5e363b62639f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: "move usr/bin executables for -bin"
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: geomet/geomet

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
