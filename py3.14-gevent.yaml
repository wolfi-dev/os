package:
  name: py3.14-gevent
  version: "26.9.0"
  epoch: 0
  description: Coroutine-based network library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-cffi
      - py${{vars.python-version}}-greenlet
      - py${{vars.python-version}}-zope.event
      - py${{vars.python-version}}-zope.interface

vars:
  pypi-package: gevent
  import: gevent
  python-version: "3.14"

environment:
  contents:
    packages:
      - file
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cython

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gevent/gevent
      tag: ${{package.version}}
      expected-commit: 003c77a6f3da41c014dd415022fb61f9d91fc95d

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - working-directory: deps/c-ares
    runs: |
      # configure: error: in '/home/build/deps/c-ares':
      # configure: error: changes in the environment can compromise the build
      # error: run 'make distclean' and/or 'rm config.cache'
      make distclean

  - uses: strip

update:
  enabled: true
  github:
    identifier: gevent/gevent
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
