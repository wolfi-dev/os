package:
  name: py3.14-gguf
  version: "0.19.0"
  epoch: 0
  description: Python package for writing binary files in the GGUF format
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-tqdm
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: gguf
  import: gguf
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-poetry-core
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ggml-org/llama.cpp
      tag: gguf-v${{package.version}}
      expected-commit: a290ce626663dae1d54f70bce3ca6d8f67aab62f

  - working-directory: gguf-py
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git:
    tag-filter-prefix: gguf-v
    strip-prefix: gguf-v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
    - name: Test basic functionality
      runs: |
        python${{vars.python-version}} <<-EOF
        import gguf

        # Test basic GGUF classes exist
        assert hasattr(gguf, 'GGUFWriter')
        assert hasattr(gguf, 'GGUFReader')
        assert hasattr(gguf, 'GGUFValueType')

        print("All tests passed!")
        EOF
