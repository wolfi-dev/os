package:
  name: py3.14-git-filter-repo
  version: 2.47.0
  epoch: 0
  description: Quickly rewrite git repository history
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - git

vars:
  pypi-package: git-filter-repo
  import: git_filter_repo
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6f79afc8c90c592a3052e6cc53c2ca8907515bca
      repository: https://github.com/newren/git-filter-repo
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: newren/git-filter-repo
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
