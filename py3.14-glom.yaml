package:
  name: py3.14-glom
  version: "25.12.0"
  epoch: 3 # restore -bin subpackage dropped in the split
  description: Python's nested data operator (and CLI), for all your declarative restructuring needs. Got data? Glom it!
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-attrs
      - py${{vars.python-version}}-boltons
      - py${{vars.python-version}}-face
  resources:
    cpu: "7"
    memory: 8Gi

vars:
  pypi-package: glom
  import: glom
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-importlib-metadata
      - py3.14-attrs # upstream-tests: runtime dependency
      - py3.14-boltons # upstream-tests: runtime dependency
      - py3.14-face # upstream-tests: runtime dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-pyyaml # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mahmoud/glom
      tag: v${{package.version}}
      expected-commit: 811eadeec404bd99ee5a43ca551e8fb220b999f3

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: ${{vars.pypi-package}}

update:
  enabled: true
  github:
    identifier: mahmoud/glom
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
