package:
  name: py3.14-glpk
  version: 0.4.8
  epoch: 0
  description: PyGLPK, a Python module encapsulating GLPK.
  copyright:
    - license: GPL-3.0-or-later
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: glpk
  import: glpk
  python-version: "3.14"

environment:
  contents:
    packages:
      - gcc~13
      - glibc-2.44-dev
      - glpk
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bradfordboyle/pyglpk
      tag: v${{package.version}}
      expected-commit: b2e7c88d0f8cfa65de453797c7e3a01164a0ea8b

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: bradfordboyle/pyglpk
    use-tag: true
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
