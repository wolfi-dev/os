package:
  name: py3.14-gobject3
  version: "3.58.1"
  epoch: 0
  description: Python bindings for the GObject library
  copyright:
    - license: LGPL-2.1-or-later
  resources:
    cpu: "2"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  glibc-version: "2.44"
  pypi-package: gobject3
  import: gi
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - glibc-${{vars.glibc-version}}-dev
      - gobject-introspection-dev
      - libffi-dev
      - meson
      - pkgconf-dev
      - py${{vars.python-version}}-cairo
      - py${{vars.python-version}}-meson
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.gnome.org/GNOME/pygobject
      expected-commit: 85618f126d8aaa26dc88515b8f19ad8a8d570381
      tag: ${{package.version}}

  - runs: meson subprojects download

  - uses: meson/configure
    with:
      opts: |
        --buildtype=plain \
        -Db_lto=true \
        -Dtests=false \
        -Dpython=python${{vars.python-version}}

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: ${{vars.pypi-package}} development files for python${{vars.python-version}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/pkgconf
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
