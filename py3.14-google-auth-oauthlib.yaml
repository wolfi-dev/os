package:
  name: py3.14-google-auth-oauthlib
  version: "1.5.0"
  epoch: 0
  description: Google Authentication Library
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-google-auth
      - py${{vars.python-version}}-requests-oauthlib
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: google-auth-oauthlib
  import: google_auth_oauthlib
  python-version: "3.14"
  grpc-stream: "1.85"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-alabaster # upstream-tests: test dependency
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-click # upstream-tests: test dependency
      - py${{vars.python-version}}-google-auth # upstream-tests: runtime dependency
      - py${{vars.python-version}}-grpcio-${{vars.grpc-stream}} # upstream-tests: test dependency
      - py${{vars.python-version}}-pygments # upstream-tests: test dependency
      - py${{vars.python-version}}-pyopenssl # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-requests-oauthlib # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d6bed5a3d4a9348f6aebb75b7ceb8d599a133c0a
      repository: https://github.com/googleapis/google-cloud-python
      tag: google-auth-oauthlib-v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
      prevent-inclusion: docs
    working-directory: packages/google-auth-oauthlib

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      dir: packages/google-auth-oauthlib

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
        # google-oauthlib-tool is the console script from the [tool] extra
        - py${{vars.python-version}}-click
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: google-oauthlib-tool

update:
  enabled: true
  manual: false
  github:
    identifier: googleapis/google-cloud-python
    strip-prefix: google-auth-oauthlib-v
    use-tag: true
    tag-filter-prefix: google-auth-oauthlib-v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
