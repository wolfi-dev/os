package:
  name: py3.14-google-auth
  version: "2.63.1"
  epoch: 0
  description: Google Authentication Library
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-cryptography
      - py${{vars.python-version}}-pyasn1-modules
      - py${{vars.python-version}}-rsa
      - py${{vars.python-version}}-urllib3

vars:
  pypi-package: google-auth
  import: google.auth
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/googleapis/google-cloud-python
      tag: google-auth-v${{package.version}}
      expected-commit: 5e2132f63899ae79e32696a533c67022aa04b1ec

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: packages/google-auth

  - uses: strip

update:
  enabled: true
  github:
    identifier: googleapis/google-cloud-python
    strip-prefix: google-auth-v
    use-tag: true
    tag-filter-prefix: google-auth-v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
