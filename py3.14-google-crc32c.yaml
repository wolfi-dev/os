package:
  name: py3.14-google-crc32c
  version: "1.9.0"
  epoch: 0
  description: A python wrapper of the C library 'Google CRC32C'
  copyright:
    - license: Apache-2.0
  resources:
    # Cloning the google-cloud-python monorepo needs far more headroom than the
    # old single-package repo did; 1Gi exhausted the workspace mid-clone.
    cpu: "2"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: google-crc32c
  import: google_crc32c
  python-version: "3.14"

environment:
  environment:
    CRC32C_PURE_PYTHON: 0
  contents:
    packages:
      - crc32c-dev
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 89310be9aea52c25fe378bf79a913bc30502d377
      repository: https://github.com/googleapis/google-cloud-python
      tag: google-crc32c-v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: packages/google-crc32c

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: googleapis/google-cloud-python
    strip-prefix: google-crc32c-v
    use-tag: true
    tag-filter: google-crc32c-v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
