package:
  name: py3.14-google-pasta
  version: 0.2.0
  epoch: 0
  description: pasta is an AST-based Python refactoring library
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-six

vars:
  pypi-package: google-pasta
  import: pasta
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 3eccb2ed20d0cf82b5083ac16b25b45570403531
      repository: https://github.com/google/pasta
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: false
  exclude-reason: Upstream google/pasta was archived on 2026-05-29 (last real commit December 2023); kept frozen as a dependency of tensorflow-core. No further releases expected.
  manual: false
  github:
    identifier: google/pasta
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
