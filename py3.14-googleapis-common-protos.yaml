package:
  name: py3.14-googleapis-common-protos
  version: "1.75.5"
  epoch: 0
  description: Common protobufs used in Google APIs
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-protobuf
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: googleapis-common-protos
  import: google.type.date_pb2
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/googleapis/google-cloud-python
      expected-commit: d6bed5a3d4a9348f6aebb75b7ceb8d599a133c0a
      tag: googleapis-common-protos-v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: packages/googleapis-common-protos

  - uses: strip

update:
  enabled: true
  github:
    identifier: googleapis/google-cloud-python
    strip-prefix: googleapis-common-protos-v
    use-tag: true
    tag-filter: googleapis-common-protos

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
