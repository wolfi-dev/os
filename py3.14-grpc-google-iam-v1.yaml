package:
  name: py3.14-grpc-google-iam-v1
  version: "0.14.6"
  epoch: 0
  description: IAM API client library
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-googleapis-common-protos
      - py${{vars.python-version}}-grpcio-${{vars.grpc-stream}}
      - py${{vars.python-version}}-protobuf
  resources:
    cpu: "2"
    memory: 6Gi

vars:
  pypi-package: grpc-google-iam-v1
  import: google.iam.v1
  python-version: "3.14"
  grpc-stream: "1.85"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-alabaster # upstream-tests: test dependency
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-googleapis-common-protos # upstream-tests: runtime dependency
      - py${{vars.python-version}}-grpcio-${{vars.grpc-stream}} # upstream-tests: test dependency
      - py${{vars.python-version}}-protobuf # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pygments # upstream-tests: test dependency
      - py${{vars.python-version}}-pyopenssl # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 82b056545d49f253a3bf27143cfa9fc8bb80da70
      repository: https://github.com/googleapis/google-cloud-python
      tag: grpc-google-iam-v1-v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: packages/grpc-google-iam-v1

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      dir: packages/grpc-google-iam-v1

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: googleapis/google-cloud-python
    strip-prefix: grpc-google-iam-v1-v
    use-tag: true
    tag-filter: grpc-google-iam-v1

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
