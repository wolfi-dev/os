# Generated from https://pypi.org/project/grpc-interceptor/
package:
  name: py3.14-grpc-interceptor
  version: 0.15.4
  epoch: 0
  description: Simplifies gRPC interceptors
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-grpcio-${{vars.grpc-stream}}

vars:
  import: grpc_interceptor
  pypi-package: grpc-interceptor
  python-version: "3.14"
  grpc-stream: "1.85"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-poetry

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d866a1bd09e9e79a02e0ed42a9d59f30c85bb7bc
      repository: https://github.com/d5h-foss/grpc-interceptor
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  github:
    identifier: d5h-foss/grpc-interceptor
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.import}}
        python: python${{vars.python-version}}
