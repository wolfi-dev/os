package:
  name: py3.14-grpcio-1.83
  version: "1.83.1"
  epoch: 0
  description: python 3.14 version of grpcio ${{vars.major-minor-version}}
  copyright:
    - license: Apache-2.0 AND BSD-3-Clause AND MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "16"
    memory: 24Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

vars:
  pypi-package: grpcio
  import: grpc
  python-version: "3.14"

environment:
  contents:
    packages:
      - abseil-cpp-dev
      - build-base
      - busybox
      - c-ares-dev
      - ca-certificates-bundle
      - glibc-2.44-dev
      - openssl-dev
      - protobuf-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cython
      - re2-dev
      - wolfi-base
      - zlib-dev
  environment:
    # https://github.com/wolfi-dev/os/issues/34568
    GCC_SPEC_FILE: no-hardening.spec
    # Drop OpenSSL ENGINE support (deprecated, removed in OpenSSL 4.0)
    CFLAGS: -DOPENSSL_NO_ENGINE
    CXXFLAGS: -DOPENSSL_NO_ENGINE
    # https://gcc.gnu.org/bugzilla/show_bug.cgi?id=117739
    GRPC_PYTHON_CFLAGS: "-std=c++17 -DOPENSSL_NO_ENGINE"
    GRPC_PYTHON_BUILD_SYSTEM_CARES: "True"
    GRPC_PYTHON_BUILD_SYSTEM_OPENSSL: "True"
    GRPC_PYTHON_BUILD_SYSTEM_ZLIB: "True"
    GRPC_PYTHON_BUILD_SYSTEM_RE2: "True"
    GRPC_PYTHON_BUILD_SYSTEM_ABSL: "True"
    GRPC_PYTHON_BUILD_SYSTEM_CYTHON: "True"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grpc/grpc
      tag: v${{package.version}}
      expected-commit: aae267021b1ac256f8b9038d0ef528c3798cc137

  # Same patch as os/grpc-1.83; see its header for the rationale.
  - uses: patch
    with:
      patches: system-absl-log-initialize.patch

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: grpc/grpc
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v1.83.
