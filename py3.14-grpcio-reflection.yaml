package:
  name: py3.14-grpcio-reflection
  version: "1.85.2"
  epoch: 0
  description: Standard Protobuf Reflection Service for gRPC
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-grpcio-${{vars.major-minor-version}}
      - py${{vars.python-version}}-protobuf
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

var-transforms:
  # grpcio-* requires grpcio>={its own version}; use the matching grpcio stream.
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

vars:
  pypi-package: grpcio-reflection
  import: grpc_reflection
  python-version: "3.14"

environment:
  contents:
    packages:
      - git
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-grpcio-tools

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grpc/grpc
      tag: v${{package.version}}
      expected-commit: 5a9ca1fb6bf364dfb1f9396cc020219ca7d117b2

  # reflection.proto lives in the third_party/grpc-proto submodule (pinned
  # by the superproject). Without generating reflection_pb2*.py from it, the
  # wheel ships grpc_reflection.v1alpha.reflection with nothing to import.
  - runs: git submodule update --init third_party/grpc-proto

  # Both commands resolve their paths from the repository root.
  - runs: |
      python${{vars.python-version}} src/python/grpcio_reflection/setup.py preprocess
      python${{vars.python-version}} src/python/grpcio_reflection/setup.py build_package_protos
      test -f src/python/grpcio_reflection/grpc_reflection/v1alpha/reflection_pb2.py
      test -f src/python/grpcio_reflection/grpc_reflection/v1alpha/reflection_pb2_grpc.py

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: src/python/grpcio_reflection

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - '.*-pre.*'
  github:
    identifier: grpc/grpc
    strip-prefix: v

test:
  pipeline:
    # pip check verifies the installed grpcio stream satisfies
    # grpcio-reflection's grpcio>={version} requirement.
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Reflection service loads grpc and its protobuf descriptors
      runs: |
        python${{vars.python-version}} - <<'EOF'
        from concurrent import futures

        import grpc
        from grpc_reflection.v1alpha import reflection
        from grpc_reflection.v1alpha import reflection_pb2

        assert reflection.SERVICE_NAME == "grpc.reflection.v1alpha.ServerReflection"
        assert reflection_pb2.DESCRIPTOR.services_by_name["ServerReflection"]
        server = grpc.server(futures.ThreadPoolExecutor(max_workers=1))
        reflection.enable_server_reflection((reflection.SERVICE_NAME,), server)
        print("grpc", grpc.__version__)
        EOF
