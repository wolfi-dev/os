package:
  name: py3.14-grpcio-status
  version: "1.85.2"
  epoch: 0
  description: Status proto mapping for gRPC
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-googleapis-common-protos
      - py${{vars.python-version}}-grpcio-${{vars.major-minor-version}}
      - py${{vars.python-version}}-protobuf
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

var-transforms:
  # grpcio-* requires grpcio>={its own version}; use the matching grpcio stream.
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

vars:
  pypi-package: grpcio-status
  import: grpc_status
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grpc/grpc
      tag: v${{package.version}}
      expected-commit: 5a9ca1fb6bf364dfb1f9396cc020219ca7d117b2

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: src/python/grpcio_status

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - '.*-pre.*'
  github:
    identifier: grpc/grpc
    strip-prefix: v

test:
  pipeline:
    # pip check verifies the installed grpcio stream satisfies
    # grpcio-status's grpcio>={version} requirement.
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Convert a google.rpc.Status to a grpc.Status and back
      runs: |
        python${{vars.python-version}} - <<'EOF'
        import grpc
        from google.rpc import code_pb2, status_pb2
        from grpc_status import rpc_status

        status = status_pb2.Status(code=code_pb2.NOT_FOUND, message="missing")
        converted = rpc_status.to_status(status)
        assert converted.code == grpc.StatusCode.NOT_FOUND
        assert converted.details == "missing"
        assert converted.trailing_metadata[0][0] == "grpc-status-details-bin"
        assert status_pb2.Status.FromString(converted.trailing_metadata[0][1]) == status
        EOF
