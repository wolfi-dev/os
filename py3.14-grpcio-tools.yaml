package:
  name: py3.14-grpcio-tools
  version: "1.83.1" # On update, please check if -fdelete-null-pointer-checks is still required
  epoch: 0
  description: Protobuf code generator for gRPC
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-grpcio-${{vars.grpc-stream}}
      - py${{vars.python-version}}-protobuf
  resources:
    cpu: "2"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: grpcio-tools
  import: grpc_tools.protoc
  python-version: "3.14"
  grpc-stream: "1.83"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cython
      - wolfi-base
  environment:
    # https://github.com/wolfi-dev/os/issues/34075
    CXXFLAGS: -fdelete-null-pointer-checks
    GRPC_PYTHON_BUILD_WITH_CYTHON: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grpc/grpc
      tag: v${{package.version}}
      expected-commit: aae267021b1ac256f8b9038d0ef528c3798cc137

  - runs: |
      git submodule update --init
      cd tools/distrib/python/grpcio_tools
      python${{vars.python-version}} ../make_grpcio_tools.py

  - uses: py/pip-build-install
    working-directory: tools/distrib/python/grpcio_tools
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - name: Verify Installation
      uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Test Protobuf Compilation
      runs: |
        # Create a temporary directory for testing
        mkdir -p /home/build/test-grpcio-tools
        cd /home/build/test-grpcio-tools

        # Create a sample .proto file for testing
        echo 'syntax = "proto3"; package test; message TestMessage { string test_field = 1; }' > test.proto

        # Compile the .proto file using grpcio-tools
        python${{vars.python-version}} -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. test.proto || exit 1
        echo "Protobuf file compiled successfully."

        # Check if Python files were generated
        if [ ! -f test_pb2.py ] || [ ! -f test_pb2_grpc.py ]; then
          echo "Generated Python files not found!"
          exit 1
        fi
        echo "Generated Python files found."
    - name: Clean Up
      runs: |
        # Clean up the test files after the test
        rm -rf /home/build/test-grpcio-tools

update:
  enabled: true
  github:
    identifier: grpc/grpc
    strip-prefix: v
    use-tag: true
