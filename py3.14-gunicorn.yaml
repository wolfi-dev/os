package:
  name: py3.14-gunicorn
  version: "27.0.0"
  epoch: 0
  description: WSGI HTTP Server for UNIX
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: gunicorn
  import: gunicorn
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pip
      - rsync

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/benoitc/gunicorn
      tag: ${{package.version}}
      expected-commit: 237de69162c645e91c5588ecb1c8f012c1b02cc1

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: benoitc/gunicorn
    use-tag: false

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
