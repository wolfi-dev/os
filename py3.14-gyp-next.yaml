package:
  name: py3.14-gyp-next
  version: "0.22.3"
  epoch: 0
  description: A fork of the GYP build system for use in the Node.js projects
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: gyp-next
  import: gyp
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nodejs/gyp-next
      expected-commit: f644b2d18ac49b30476ccbfb0d4f825a4f252b81
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: nodejs/gyp-next
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
