package:
  name: py3.14-h5py
  description: Read and write HDF5 files from Python
  url: https://www.h5py.org
  version: "3.16.0"
  epoch: 0
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - hdf5
      - py${{vars.python-version}}-numpy-2.4
  resources:
    cpu: "2"
    memory: 17Gi

vars:
  pypi-package: h5py
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - hdf5-dev
      - liblzf-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pkgconfig
      - py${{vars.python-version}}-tomli
      - python-${{vars.python-version}}-base-dev
      - wolfi-baselayout
  environment:
    H5PY_SYSTEM_LZF: 1
    H5PY_SETUP_REQUIRES: 0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/h5py/h5py
      expected-commit: b2f0347c4200333acd89b43733f1caa0c115162f
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: h5py/h5py
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: h5py
