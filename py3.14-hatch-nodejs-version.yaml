package:
  name: py3.14-hatch-nodejs-version
  version: "0.4.0"
  epoch: 0
  description: Reads PEP 621 metadata from the Node.js package.json file.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-hatchling

vars:
  pypi-package: hatch-nodejs-version
  import: hatch_nodejs_version
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/agoose77/hatch-nodejs-version
      tag: v${{package.version}}
      expected-commit: 81c4612da14dec4b260bc956225fa24ab62b377e

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: agoose77/hatch-nodejs-version
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
