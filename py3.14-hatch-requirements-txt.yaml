# Generated from https://pypi.org/project/hatch-requirements-txt/
package:
  name: py3.14-hatch-requirements-txt
  version: 0.4.1
  epoch: 0
  description: Hatchling plugin to read project dependencies from requirements.txt
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-packaging
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

vars:
  module_name: hatch_requirements_txt
  pypi-package: hatch-requirements-txt
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2809dc9e2d13a45272d5c74cdf5741d2af30f9a8
      repository: https://github.com/repo-helper/hatch-requirements-txt
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  github:
    identifier: repo-helper/hatch-requirements-txt
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
        python: python${{vars.python-version}}
