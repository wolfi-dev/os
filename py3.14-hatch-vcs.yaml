package:
  name: py3.14-hatch-vcs
  version: "0.5.0"
  epoch: 3 # upstream-tests/pytest
  description: Hatch plugin for versioning with your preferred VCS
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-setuptools-scm
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: hatch-vcs
  import: hatch_vcs
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-wheel
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-setuptools # upstream-tests: runtime dependency
      - py3.14-setuptools-scm # upstream-tests: runtime dependency
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: dfec2c06defdb4648eb66f6aadf7b57453d732cd
      repository: https://github.com/ofek/hatch-vcs
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  manual: false
  github:
    identifier: ofek/hatch-vcs
    strip-prefix: v
