package:
  name: py3.14-hdfs
  version: 2.7.3
  epoch: 0
  description: 'HdfsCLI: API and command line interface for HDFS.'
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-docopt
      - py${{vars.python-version}}-fastavro
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-six

vars:
  pypi-package: hdfs
  import: hdfs
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mtth/hdfs
      tag: v${{package.version}}
      expected-commit: e07a8e60e7cb2912b76a07f0caf6f485c6131dfa

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.destdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: py${{vars.python-version}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: hdfscli
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: hdfscli-avro

update:
  enabled: true
  github:
    identifier: mtth/hdfs
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
