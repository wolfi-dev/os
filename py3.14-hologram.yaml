package:
  name: py3.14-hologram
  version: 0.0.16
  epoch: 0
  description: JSON schema generation from dataclasses
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-jsonschema
      - py${{vars.python-version}}-python-dateutil
  resources:
    cpu: "6"
    memory: 7Gi

vars:
  pypi-package: hologram
  import: hologram
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ba10f860c5a975d206f6bb5e8be17a3ba70157a2
      repository: https://github.com/fishtown-analytics/hologram
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: fishtown-analytics/hologram
    strip-prefix: v

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
