package:
  name: py3.14-html5lib
  version: "1.1"
  epoch: 0
  description: HTML parser based on the WHATWG HTML specification
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-six
      - py${{vars.python-version}}-webencodings

vars:
  module_name: html5lib
  pypi-package: html5lib
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/html5lib/html5lib-python
      tag: ${{package.version}}
      expected-commit: f87487a4ada2d6cf223bdd182774a01ba3c84618

  - uses: patch
    with:
      # ast.Str was removed in Python 3.14; setup.py reads __version__ with it.
      patches: fix-pkg-resources.patch fix-ast-str-python-3.14.patch

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  github:
    identifier: html5lib/html5lib-python
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
        python: python${{vars.python-version}}
