package:
  name: py3.14-httpcore2
  version: "2.16.2"
  epoch: 0
  description: A minimal low-level HTTP client.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-h11
      - py${{vars.python-version}}-truststore

vars:
  pypi-package: httpcore2
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-uv-dynamic-versioning

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 781ea16caf2a5ade6e18b7504b3fe62fe902c4fa
      repository: https://github.com/pydantic/httpx2
      tag: v${{package.version}}

  - uses: py/pip-build-install
    working-directory: src/httpcore2
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - .*\.dev.*
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
