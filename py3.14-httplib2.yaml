package:
  name: py3.14-httplib2
  version: "0.32.1"
  epoch: 0
  description: A comprehensive HTTP client library.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-pyparsing
  resources:
    cpu: "1"
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: httplib2
  import: httplib2
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: dbbba89e394c98813884d06061d661e033acc023
      repository: https://github.com/httplib2/httplib2
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: httplib2/httplib2
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
