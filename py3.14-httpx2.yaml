package:
  name: py3.14-httpx2
  version: "2.16.2"
  epoch: 0
  description: A next generation HTTP client for Python.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-anyio
      # Upstream requires httpcore2=={{ version }} (src/httpx2/pyproject.toml); both ship from the same tag.
      - py${{vars.python-version}}-httpcore2~${{package.version}}
      - py${{vars.python-version}}-idna
      - py${{vars.python-version}}-truststore
      - py${{vars.python-version}}-typing-extensions

vars:
  pypi-package: httpx2
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-uv-dynamic-versioning

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 781ea16caf2a5ade6e18b7504b3fe62fe902c4fa
      repository: https://github.com/pydantic/httpx2
      tag: v${{package.version}}

  - uses: py/pip-build-install
    working-directory: src/httpx2
    with:
      python: python${{vars.python-version}}

  - name: "verify httpx2 still pins httpcore2 to its own version"
    runs: |
      meta="${{targets.destdir}}/usr/lib/python${{vars.python-version}}/site-packages/httpx2-${{package.version}}.dist-info/METADATA"
      want="Requires-Dist: httpcore2==${{package.version}}"
      got=$(sed -n '/^Requires-Dist: httpcore2/p' "$meta")
      case "$got" in
        "$want" | "$want;"* | "$want "*)  echo "OK: $got" ;;
        *)
          echo "ERROR: expected '$want' in $meta, found: '${got:-<none>}'" >&2
          echo "Upstream no longer pins httpcore2 to httpx2's own version. Revisit the py${{vars.python-version}}-httpcore2~${{package.version}} runtime dependency in py3.14-httpx2.yaml." >&2
          exit 1
          ;;
      esac

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
        # the httpx2 console script needs the [cli] extra
        - py${{vars.python-version}}-click
        - py${{vars.python-version}}-pygments
        - py${{vars.python-version}}-rich
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: httpx2

update:
  enabled: true
  ignore-regex-patterns:
    - .*\.dev.*
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
