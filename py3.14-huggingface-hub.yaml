# Generated from https://pypi.org/project/huggingface-hub/
package:
  name: py3.14-huggingface-hub
  version: "2.4.0"
  epoch: 0
  description: Client library to download and publish models, datasets and other repos on the huggingface.co hub
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-click # huggingface_hub 2.4.0 requires click>=8.4.2,<9 and dropped typer, so the typer-0.25 pin is obsolete
      - py${{vars.python-version}}-filelock
      - py${{vars.python-version}}-fsspec
      - py${{vars.python-version}}-hf-xet
      - py${{vars.python-version}}-httpx2
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-shellingham
      - py${{vars.python-version}}-tomli
      - py${{vars.python-version}}-tqdm
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "3"
    memory: 5Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

vars:
  pypi-package: huggingface-hub
  module-name: huggingface_hub
  glibc-version: "2.44"
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 3739729b86489e4ae28b5a62e622be320b141493
      repository: https://github.com/huggingface/huggingface_hub
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            hf --help | grep -F "download"
            mkdir -p /root/.cache/huggingface/hub
            hf cache ls
            tiny-agents --help

update:
  enabled: true
  manual: false
  github:
    identifier: huggingface/huggingface_hub
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-pip
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          from ${{vars.module-name}} import hf_hub_download
