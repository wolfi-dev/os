package:
  name: py3.14-hyperopt
  version: "0.3.0"
  epoch: 0
  description: Distributed Asynchronous Hyperparameter Optimization
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-cloudpickle
      - py${{vars.python-version}}-future
      - py${{vars.python-version}}-networkx
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-py4j
      - py${{vars.python-version}}-scipy
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-six
      - py${{vars.python-version}}-tqdm
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: hyperopt
  import: hyperopt
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyperopt/hyperopt
      expected-commit: 9834314879c09c13e0b8e93eb678408ba46441a8
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            hyperopt-mongo-worker --help

update:
  enabled: true
  github:
    identifier: hyperopt/hyperopt
    use-tag: true
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
