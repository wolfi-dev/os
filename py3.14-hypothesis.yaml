package:
  name: py3.14-hypothesis
  version: "6.170.15"
  epoch: 0
  description: The property-based testing library for Python
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      # Upstream declares only sortedcontainers; exceptiongroup is python<3.11.
      - py${{vars.python-version}}-sortedcontainers
  resources:
    cpu: "1"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: hypothesis
  import: hypothesis
  python-version: "3.14"
  rust-version: "1.99"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-maturin
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/HypothesisWorks/hypothesis.git
      tag: v${{package.version}}
      expected-commit: 9ab0be61aaaa27396fc1bbf4b34e7925cc68d1e2

  - working-directory: hypothesis
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: verify hypothesis._native Rust extension was built
    runs: |
      find ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/hypothesis -name '_native*.so' | grep -q .

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - runs: |
        python${{vars.python-version}} <<'EOF' | tee output.txt
        from hypothesis import given, strategies as st

        @given(st.integers())
        def test_is_integer(n):
            print(f"called with {n}")
            assert isinstance(n, int)

        test_is_integer()
        EOF
        sed -n '1p' ./output.txt | grep -E -e "called with.*[[:digit:]]*"
        sed -n '2p' ./output.txt | grep -E -e "called with.*[[:digit:]]*"
        sed -n '3p' ./output.txt | grep -E -e "called with.*[[:digit:]]*"

update:
  enabled: true
  git:
    strip-prefix: v
