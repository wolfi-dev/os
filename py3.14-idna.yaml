package:
  name: py3.14-idna
  version: "3.20"
  epoch: 0 # go/wolfi-rsc/py3.14-idna
  description: Internationalized Domain Names in Applications (IDNA)
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: idna
  import: idna
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kjd/idna.git
      tag: v${{package.version}}
      expected-commit: d55e65e1a3b1ede7f556bc202738066f5597e249

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: kjd/idna
    strip-prefix: v
    tag-filter-prefix: v
