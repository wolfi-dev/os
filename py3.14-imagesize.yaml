package:
  name: py3.14-imagesize
  version: "2.0.1"
  epoch: 0
  description: Getting image size from png/jpeg/jpeg2000/gif file
  copyright:
    - license: MIT
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: imagesize
  import: imagesize
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/shibukawa/imagesize_py
      expected-commit: cf87fc06d599c71b61564eca97873b7bc75ab49a
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: shibukawa/imagesize_py
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
