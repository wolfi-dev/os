package:
  name: py3.14-influxdb-client
  version: "1.50.0"
  epoch: 0
  description: InfluxDB 2.0 python client
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-certifi
      - py${{vars.python-version}}-dateutil
      - py${{vars.python-version}}-reactivex
      - py${{vars.python-version}}-urllib3
  resources:
    memory: 1Gi

vars:
  pypi-package: influxdb-client
  import: influxdb_client
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/influxdata/influxdb-client-python.git
      tag: v${{package.version}}
      expected-commit: 03cf5110d36076bbece1f706798a4b8fefd94329

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: influxdata/influxdb-client-python
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
