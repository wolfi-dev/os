package:
  name: py3.14-invoke
  version: "3.0.3"
  epoch: 2 # restore -bin subpackage dropped in the split
  description: Pythonic task management & command execution.
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: invoke
  import: invoke
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pyinvoke/invoke
      expected-commit: ab836f911f7304dcab7653c0068a8327137161a7
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: inv invoke
        - uses: test/tw/ver-check
          with:
            bins: inv invoke
            version: ${{package.version}}

update:
  ignore-regex-patterns:
    - ^[a-zA-Z]
  enabled: true
  github:
    identifier: pyinvoke/invoke
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
