package:
  name: py3.14-ipaddress
  version: 1.0.23
  epoch: 0
  description: IPv4/IPv6 manipulation library
  copyright:
    - license: PSF-2.0

vars:
  pypi-package: ipaddress
  import: ipaddress
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/phihag/ipaddress
      tag: v${{package.version}}
      expected-commit: d8aef06cc3ca8a6fd8570cda665b2bb879a29390

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: phihag/ipaddress
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
