package:
  name: py3.14-ipykernel
  version: "7.4.0"
  epoch: 0
  description: IPython Kernel for Jupyter
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-appnope
      - py${{vars.python-version}}-comm
      - py${{vars.python-version}}-debugpy
      - py${{vars.python-version}}-ipython
      - py${{vars.python-version}}-jupyter-client
      - py${{vars.python-version}}-jupyter-core
      - py${{vars.python-version}}-matplotlib-inline
      - py${{vars.python-version}}-nest-asyncio2 # ipykernel 7.x requires nest_asyncio2 (fork)
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-psutil
      - py${{vars.python-version}}-pyzmq
      - py${{vars.python-version}}-tornado
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: ipykernel
  import: ipykernel
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-jupyter-client

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ipython/ipykernel
      tag: v${{package.version}}
      expected-commit: cfa461d8afac05cefc3671128d00adaa3c0720f4

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  # Pre-release versions are tagged similar to: '7.0.0a0' and need to be ignored.
  ignore-regex-patterns:
    - 'a.*'
  github:
    identifier: ipython/ipykernel
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
