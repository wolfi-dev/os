package:
  name: py3.14-ipython-genutils
  version: 0.2.0
  epoch: 0
  description: Vestigial utilities from IPython
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: ipython-genutils
  import: ipython_genutils
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ipython/ipython_genutils
      tag: ${{package.version}}
      expected-commit: bbb7fd6405bc0101c5ee6b25500825ac9a3f1727

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ipython/ipython_genutils
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
