package:
  name: py3.14-ipython
  version: 8.16.0
  epoch: 0
  description: 'IPython: Productive Interactive Computing'
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-appnope
      - py${{vars.python-version}}-backcall
      - py${{vars.python-version}}-colorama
      - py${{vars.python-version}}-decorator
      - py${{vars.python-version}}-exceptiongroup
      - py${{vars.python-version}}-jedi
      - py${{vars.python-version}}-matplotlib-inline
      - py${{vars.python-version}}-pexpect
      - py${{vars.python-version}}-pickleshare
      - py${{vars.python-version}}-prompt-toolkit
      - py${{vars.python-version}}-pygments
      - py${{vars.python-version}}-stack-data
      - py${{vars.python-version}}-traitlets
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: ipython
  import: IPython
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a6c67bdf464dcce3de5259b8f417ea0106074cd5
      repository: https://github.com/ipython/ipython
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - runs: |
            ipython --version | grep -Fx '${{package.version}}'
            ipython3 --version | grep -Fx '${{package.version}}'
            ipython3 --help
            ipython3 -c 'x = [i * i for i in range(4)]; print(sum(x))' | grep -Fx 14

  - name: ${{package.name}}-doc
    description: ${{package.name}} manpages
    pipeline:
      - uses: split/manpages
        with:
          package: py${{vars.python-version}}-${{vars.pypi-package}}
      - runs: |
          rm -rf ${{targets.outdir}}/py${{vars.python-version}}-${{vars.pypi-package}}/usr/share/man
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  manual: false
  github:
    identifier: ipython/ipython

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
