package:
  name: py3.14-ipywidgets
  version: "8.1.9"
  epoch: 0
  description: Jupyter interactive widgets
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-comm
      - py${{vars.python-version}}-ipython
      - py${{vars.python-version}}-jsonschema
      - py${{vars.python-version}}-traitlets
      - py${{vars.python-version}}-widgetsnbextension
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: ipywidgets
  import: ipywidgets
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-comm # upstream-tests: runtime dependency
      - py${{vars.python-version}}-ipykernel # upstream-tests: test dependency
      - py${{vars.python-version}}-ipython # upstream-tests: runtime dependency
      - py${{vars.python-version}}-jsonschema # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-traitlets # upstream-tests: runtime dependency
      - py${{vars.python-version}}-tz # upstream-tests: test dependency (installs pytz)
      - py${{vars.python-version}}-widgetsnbextension # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyter-widgets/ipywidgets
      tag: ${{package.version}}
      expected-commit: 15f0564eec5e6fc0d8d655c16490c2e475bdd145

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: python/ipywidgets

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      dir: python/ipywidgets

  - uses: strip

update:
  enabled: true
  github:
    identifier: jupyter-widgets/ipywidgets

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
