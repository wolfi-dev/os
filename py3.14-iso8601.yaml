package:
  name: py3.14-iso8601
  version: "2.1.0"
  epoch: 0
  description: Simple module to parse ISO 8601 dates
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: iso8601
  import: iso8601
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-hypothesis # upstream-tests: test dependency
      - py${{vars.python-version}}-poetry
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-tz # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/micktwomey/pyiso8601
      expected-commit: c147acc8952bf279a38d5cab1f80be71735a10cf
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: micktwomey/pyiso8601

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
