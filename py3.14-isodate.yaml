package:
  name: py3.14-isodate
  version: 0.7.2
  epoch: 0
  description: An ISO 8601 date/time/duration parser and formatter
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-six
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: isodate
  import: isodate
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 4408b60fecfc682a021047b3e5d9095a8face012
      repository: https://github.com/gweis/isodate
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    use-tag: true
    identifier: gweis/isodate

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
