package:
  name: py3.14-isort
  version: "9.0.2"
  epoch: 0
  description: A Python utility / library to sort imports.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-mypy-extensions
  resources:
    cpu: "2"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: isort
  import: isort
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-poetry

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/PyCQA/isort
      tag: ${{package.version}}
      expected-commit: 9f905615631c545f5aea2516508109350d1d2f7d

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: isort
        - uses: test/tw/help-check
          with:
            bins: isort-identify-imports

update:
  enabled: true
  github:
    identifier: PyCQA/isort

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
