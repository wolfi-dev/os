package:
  name: py3.14-itables
  version: "2.9.1"
  epoch: 0
  description: Interactive Tables in Jupyter
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-ipython
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pandas
  resources:
    cpu: "3"
    memory: 8Gi

vars:
  pypi-package: itables
  import: itables
  python-version: "3.14"

environment:
  contents:
    packages:
      - nodejs-26
      - npm
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-jupyter-builder
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pyyaml

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 13fc4f5706575ca08f3f3e7da435bea293e429ac
      repository: https://github.com/mwouts/itables
      tag: v${{package.version}}

  - runs: pip${{vars.python-version}} install dash

  - name: "Set up python symlink"
    runs: |
      # Their build script uses a call to "python" making this symlink necessary
      rm -f /usr/bin/python
      ln -s /usr/bin/python${{vars.python-version}} /usr/bin/python

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: mwouts/itables
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
