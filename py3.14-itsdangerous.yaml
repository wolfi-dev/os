package:
  name: py3.14-itsdangerous
  version: 2.2.0
  epoch: 0
  description: Safely pass data to untrusted environments and back.
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: itsdangerous
  import: itsdangerous
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pallets/itsdangerous
      tag: ${{package.version}}
      expected-commit: 096c8d42545d3b68ea21a4f890fb2b2d8979c0bd

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pallets/itsdangerous

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          from itsdangerous import URLSafeSerializer
