package:
  name: py3.14-jaraco.collections
  version: "5.2.1"
  epoch: 0
  description: "Models and classes to supplement the stdlib 'collections' module."
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-jaraco.text
      - py${{vars.python-version}}-pygments
  resources:
    cpu: "3"
    memory: 6Gi

vars:
  pypi-package: jaraco.collections
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-jaraco.text # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pygments # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jaraco/jaraco.collections
      tag: v${{package.version}}
      expected-commit: 41863a00670cebc8e0c628d3f5b8e3faebfe8ecd

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jaraco/jaraco.collections
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-pytest
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
    - uses: git-checkout
      with:
        repository: https://github.com/jaraco/jaraco.collections
        tag: v${{package.version}}
        expected-commit: 41863a00670cebc8e0c628d3f5b8e3faebfe8ecd
    - runs: |
        python${{vars.python-version}} -m pytest tests/
