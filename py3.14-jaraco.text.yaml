package:
  name: py3.14-jaraco.text
  version: "4.3.0"
  epoch: 0
  description: "Handy routines for dealing with text, such as wrapping, substitution, trimming,"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-autocommand
      - py${{vars.python-version}}-jaraco.context
      - py${{vars.python-version}}-jaraco.functools
      - py${{vars.python-version}}-more-itertools
      - py${{vars.python-version}}-typer
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: jaraco.text
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-autocommand # upstream-tests: runtime dependency
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-jaraco.context # upstream-tests: runtime dependency
      - py${{vars.python-version}}-jaraco.functools # upstream-tests: runtime dependency
      - py${{vars.python-version}}-more-itertools # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-typer # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jaraco/jaraco.text
      tag: v${{package.version}}
      expected-commit: 8c5892111b3dac47030bcdc7a34dcef3ce7828ef

  - runs: |
      # Depend on the full typer package instead of the library-only name, so
      # we don't have to generate both in our packaging
      sed -i 's/typer-slim/typer/g' pyproject.toml

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jaraco/jaraco.text
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-pytest
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
    - uses: git-checkout
      with:
        repository: https://github.com/jaraco/jaraco.text
        tag: v${{package.version}}
        expected-commit: 8c5892111b3dac47030bcdc7a34dcef3ce7828ef
    - runs: |
        # NOTE(jamespage):
        # ignore show-newlines test as this uses inflect which is an
        # optional dependency
        # ignore strip-prefix test as this uses typer which is an
        # optional dependency
        python${{vars.python-version}} -m pytest --ignore=jaraco/text/show-newlines.py --ignore=jaraco/text/strip-prefix.py
