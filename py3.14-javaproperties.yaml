package:
  name: py3.14-javaproperties
  version: 0.8.2
  epoch: 0
  description: Read & write Java .properties files
  copyright:
    - license: MIT
  resources:
    cpu: "10"
    memory: 7Gi

vars:
  pypi-package: javaproperties
  import: javaproperties
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 84b477f8e9ebcbe94718f8f0451f1dd5bc3a8ac2
      repository: https://github.com/jwodder/javaproperties
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jwodder/javaproperties
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
