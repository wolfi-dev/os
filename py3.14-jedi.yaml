package:
  name: py3.14-jedi
  version: "0.20.1"
  epoch: 2 # upstream-tests/pytest
  description: An autocompletion tool for Python that can be used for text editors.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-parso
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: jedi
  import: jedi
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-parso # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ab89beb06cc4ad51ec3b99d7f2023401a8d11815
      repository: https://github.com/davidhalter/jedi
      tag: v${{package.version}}
      recurse-submodules: true

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # test_complete_expanduser lists ~ (HOME is an empty scratch dir), and test_get_default_environment_when_embedded
  # expects a discoverable system interpreter layout; both are environment-dependent in the build VM.
  # TODO(upstream-tests): revisit with a populated HOME / test stage.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore: test/test_api/test_completion.py::test_complete_expanduser test/test_api/test_environment.py::test_get_default_environment_when_embedded

  - uses: strip

update:
  enabled: true
  manual: false
  ignore-regex-patterns:
    - show
  github:
    identifier: davidhalter/jedi
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
