package:
  name: py3.14-jinja2
  version: "3.1.6"
  epoch: 0
  description: A small but fast and easy to use stand-alone python template engine
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-markupsafe

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

vars:
  pypi-package: jinja2
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pallets/jinja
      tag: ${{package.version}}
      expected-commit: 15206881c006c79667fe5154fe80c01c65410679

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - runs: |
      docdir="/usr/share/doc/${{package.name}}"
      cp -R docs "$docdir"/
      mkdir -p "$docdir"
      install -m 644 -D LICENSE.txt /usr/share/licenses/${{package.name}}/LICENSE.txt

  - uses: strip

update:
  enabled: true
  github:
    identifier: pallets/jinja

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
