package:
  name: py3.14-jiter
  version: "0.17.0"
  epoch: 0
  description: Fast iterable JSON parser
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  glibc-version: "2.44"
  pypi-package: jiter
  rust-version: "1.100"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-maturin
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-ujson
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pydantic/jiter.git
      tag: v${{package.version}}
      expected-commit: 2b5ec63e505b44775e29b865c3161ea13bdad16b

  - uses: py/pip-build-install
    working-directory: /home/build/crates/jiter-python
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pydantic/jiter
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
