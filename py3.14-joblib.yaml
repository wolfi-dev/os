package:
  name: py3.14-joblib
  version: "1.6.0"
  epoch: 0
  description: Lightweight pipelining with Python functions
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-cloudpickle

vars:
  pypi-package: joblib
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/joblib/joblib
      expected-commit: cd9a6b05fc4f2b1c8202eb62c4e863484f8cc099
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: joblib/joblib

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: joblib
