package:
  name: py3.14-jsondiff
  version: 2.2.1
  epoch: 1 # upstream-tests/pytest
  description: Diff JSON and JSON-like structures in Python
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-pyyaml
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: jsondiff
  import: jsondiff
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-hypothesis # upstream-tests: test dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-pyyaml # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 31140ba8af02d068a5cca6cd123848a89dde1190
      repository: https://github.com/xlwings/jsondiff
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: xlwings/jsondiff

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
