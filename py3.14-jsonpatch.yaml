package:
  name: py3.14-jsonpatch
  version: "1.34"
  epoch: 0
  description: Apply JSON-Patches (RFC 6902)
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-jsonpointer
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: jsonpatch
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ef570a3a873473167c23c3586f50357dc28d0ed8
      repository: https://github.com/stefankoegl/python-json-patch
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  manual: false
  require-sequential: false
  github:
    identifier: stefankoegl/python-json-patch
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.pypi-package}}
        python: python${{vars.python-version}}
