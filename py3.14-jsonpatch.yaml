package:
  name: py3.14-jsonpatch
  version: "1.48"
  epoch: 1 # restore -bin subpackage dropped in the split
  description: Apply JSON-Patches (RFC 6902)
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-jsonpointer
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: jsonpatch
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ff82daa266cbf322d257a93e367d3d261f331b60
      repository: https://github.com/stefankoegl/python-json-patch
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - jq
      pipeline:
        - name: Test binaries
          runs: |
            cat > a.json <<'EOF'
            {"a": [1, 2], "b": 0}
            EOF

            cat > b.json <<'EOF'
            {"a": [1, 2, 3], "c": 100}
            EOF

            # Create a patch (jsondiff exits 1 when differences exist, like diff)
            jsondiff a.json b.json > patch.json || [ $? -eq 1 ]
            jq -e '.[] | select(.path=="/a/2" and .op=="add") | .value == 3' patch.json

            # Test output of patching a.json
            jsonpatch a.json patch.json | jq -e '.c == 100'
            # Output patched json to new file
            jsonpatch a.json patch.json > c.json
            # Test that patched a.json == b.json (diff is nothing)
            jsondiff b.json c.json > diff.json || [ $? -eq 1 ]
            [ ! -s diff.json ] || exit 1

update:
  enabled: true
  manual: false
  require-sequential: false
  github:
    identifier: stefankoegl/python-json-patch
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.pypi-package}}
        python: python${{vars.python-version}}
