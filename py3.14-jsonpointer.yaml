package:
  name: py3.14-jsonpointer
  version: "3.2.0"
  epoch: 0
  description: Identify specific nodes in a JSON document (RFC 6901)
  copyright:
    - license: BSD-3-Clause
  dependencies:
  resources:
    cpu: "3"
    memory: 5Gi

vars:
  import: jsonpointer
  pypi-package: jsonpointer
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f1f238bf996310f28b938801c41edbe255418cf7
      repository: https://github.com/stefankoegl/python-json-pointer
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  manual: false
  require-sequential: false
  github:
    identifier: stefankoegl/python-json-pointer
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
    - name: Test basic module functionality
      runs: |
        cat >> test.py <<'EOF'
        from jsonpointer import JsonPointer, set_pointer, resolve_pointer

        test_obj = {"foo": {"array": [{"bar": 42}], "baz": {"derp": "string"}}}
        assert resolve_pointer(test_obj, "/foo/array/0") == test_obj["foo"]["array"][0]

        set_pointer(test_obj, "/foo/array/0", 24)
        assert test_obj["foo"]["array"][0] == 24

        pointer = JsonPointer("/foo/array/0")
        assert pointer.resolve(test_obj) == 24
        EOF

        python${{vars.python-version}} test.py
