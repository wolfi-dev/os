package:
  name: py3.14-jsonschema-specifications
  version: "2025.9.1"
  epoch: 0
  description: Cross-specification JSON referencing (JSON Schema, OpenAPI, and the one you just made up!).
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-referencing
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: jsonschema-specifications
  module-name: jsonschema_specifications
  python-version: "3.14"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-jsonschema/jsonschema-specifications
      tag: v${{package.version}}
      expected-commit: 3b846010c34ce254d8ced23023451d1d64de37f5

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: python-jsonschema/jsonschema-specifications
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.module-name}}
