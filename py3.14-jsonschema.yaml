package:
  name: py3.14-jsonschema
  version: "4.26.0"
  epoch: 3 # restore -bin subpackage dropped in the split
  description: Python Classes Without Boilerplate.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-attrs
      - py${{vars.python-version}}-jsonschema-specifications
      - py${{vars.python-version}}-referencing
      - py${{vars.python-version}}-rpds-py

vars:
  pypi-package: jsonschema
  python-version: "3.14"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-attrs # upstream-tests: runtime dependency
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-jsonschema-specifications # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-referencing # upstream-tests: runtime dependency
      - py${{vars.python-version}}-rpds-py # upstream-tests: runtime dependency
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-jsonschema/jsonschema
      tag: v${{package.version}}
      expected-commit: a7277432b0f7bcd0551f6e589d30457017125df4

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # jsonschema/tests/test_exceptions.py imports jsonpath_ng, which is not packaged.
  # test_jsonschema_test_suite.py needs a JSON-Schema-Test-Suite checkout (JSON_SCHEMA_TEST_SUITE),
  # which is not in the source tree.
  # TODO(upstream-tests): package py3.14-jsonpath-ng and fetch the suite, then drop ignore-files.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore-files: jsonschema/tests/test_exceptions.py jsonschema/tests/test_jsonschema_test_suite.py

  - runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: jsonschema
        - uses: test/tw/ver-check
          with:
            bins: jsonschema
            version: ${{package.version}}

update:
  enabled: true
  github:
    identifier: python-jsonschema/jsonschema
    tag-filter: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
