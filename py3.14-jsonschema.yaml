package:
  name: py3.14-jsonschema
  version: "4.26.0"
  epoch: 0
  description: Python Classes Without Boilerplate.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-attrs
      - py${{vars.python-version}}-jsonschema-specifications
      - py${{vars.python-version}}-referencing
      - py${{vars.python-version}}-rpds-py

vars:
  pypi-package: jsonschema
  python-version: "3.14"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-jsonschema/jsonschema
      tag: v${{package.version}}
      expected-commit: a7277432b0f7bcd0551f6e589d30457017125df4

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: python-jsonschema/jsonschema
    tag-filter: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
