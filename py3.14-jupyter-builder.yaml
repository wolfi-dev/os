package:
  name: py3.14-jupyter-builder
  version: "1.3.0"
  epoch: 0
  description: Build tools for JupyterLab (and remixes)
  copyright:
    - license: Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND ISC AND MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-jupyter-core
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: jupyter-builder
  import: jupyter_builder
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-nodejs-version
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 326b62a97413b96feb1e28791292122a7076afe2
      repository: https://github.com/jupyterlab/jupyter-builder
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: jupyter-builder
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: jupyter-builder
        - runs: |
            # jlpm is just a Node wrapper: as some consumers may only want
            # jupyter-builder, we don't have a (heavy) dependency on nodejs, so
            # check it fails as expected
            (jlpm 2>&1 || true) | grep "Please install Node.js"

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
