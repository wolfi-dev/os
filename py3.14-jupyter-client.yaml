package:
  name: py3.14-jupyter-client
  version: "8.10.0"
  epoch: 0
  description: Jupyter protocol implementation and client libraries
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-importlib-metadata
      - py${{vars.python-version}}-jupyter-core
      - py${{vars.python-version}}-python-dateutil
      - py${{vars.python-version}}-pyzmq
      - py${{vars.python-version}}-tornado
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: jupyter-client
  import: jupyter_client
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-dateutil
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 978361b3785dcd9cba6c733f4555e833e88fc0df
      repository: https://github.com/jupyter/jupyter_client
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: py3.14-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - runs: |
            jupyter-kernel --version
            jupyter-kernel --help
            jupyter-kernelspec --version
            jupyter-kernelspec --help
            jupyter-run --version
            jupyter-run --help

update:
  enabled: true
  manual: false
  github:
    identifier: jupyter/jupyter_client
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
