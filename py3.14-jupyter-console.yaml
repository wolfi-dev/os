package:
  name: py3.14-jupyter-console
  version: 6.6.3
  epoch: 0
  description: A terminal-based console frontend for Jupyter kernels.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-ipykernel
      - py${{vars.python-version}}-ipython
      - py${{vars.python-version}}-jupyter-client
      - py${{vars.python-version}}-jupyter-core
      - py${{vars.python-version}}-prompt-toolkit
      - py${{vars.python-version}}-pygments
      - py${{vars.python-version}}-pyzmq
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "3"
    memory: 7Gi

vars:
  pypi-package: jupyter-console
  import: jupyter_console
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flaky # upstream-tests: test dependency
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-ipykernel # upstream-tests: runtime dependency
      - py${{vars.python-version}}-ipython # upstream-tests: runtime dependency
      - py${{vars.python-version}}-jupyter-client # upstream-tests: runtime dependency
      - py${{vars.python-version}}-jupyter-core # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pexpect # upstream-tests: test dependency
      - py${{vars.python-version}}-pillow # upstream-tests: test dependency
      - py${{vars.python-version}}-prompt-toolkit # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pygments # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-pyzmq # upstream-tests: runtime dependency
      - py${{vars.python-version}}-traitlets # upstream-tests: runtime dependency
  environment:
    # This is needed to work around the error "ValueError: ZIP does not support timestamps before 1980"
    SOURCE_DATE_EPOCH: 315532800

pipeline:
  - uses: git-checkout
    with:
      expected-commit: fddbc42d2e0be85feace1fe783a05e2b569fceae
      repository: https://github.com/jupyter/jupyter_console
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      environment:
        contents:
          packages:
            - py${{vars.python-version}}-ipython
            - py${{vars.python-version}}-ipykernel
            - py${{vars.python-version}}-jupyter-core-bin
            - py${{vars.python-version}}-jupyter-client-bin
      pipeline:
        - uses: python/import
          with:
            python: python${{vars.python-version}}
            imports: |
              import ${{vars.import}}
        - uses: test/tw/help-check
          with:
            bins: jupyter-console
        - uses: test/tw/ver-check
          with:
            bins: jupyter-console
        - name: Test Console with Python kernel
          runs: |
            jupyter-console --kernel=python3

update:
  enabled: true
  github:
    identifier: jupyter/jupyter_console
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
