package:
  name: py3.14-jupyter-core
  version: "5.9.1"
  epoch: 0
  description: Jupyter core package. A base package on which Jupyter projects rely.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-platformdirs
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "1"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: jupyter-core
  import: jupyter_core
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2e63fd3928a979844fa0c2a247ee1937bbae9a99
      repository: https://github.com/jupyter/jupyter_core
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jupyter/jupyter_core
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
