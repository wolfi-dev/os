package:
  name: py3.14-jupyter-events
  version: "0.12.1"
  epoch: 0
  description: Jupyter Event System library
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-jsonschema
      - py${{vars.python-version}}-python-json-logger
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-referencing
      - py${{vars.python-version}}-rfc3339-validator
      - py${{vars.python-version}}-rfc3986-validator
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: jupyter-events
  import: jupyter_events
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyter/jupyter_events
      tag: v${{package.version}}
      expected-commit: 147cf71d1164981f90e00a0cee011c2395814e05

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: jupyter-events

update:
  enabled: true
  github:
    identifier: jupyter/jupyter_events
    tag-filter-prefix: v
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-packaging
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
