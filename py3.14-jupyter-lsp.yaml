package:
  name: py3.14-jupyter-lsp
  version: "2.3.0"
  epoch: 0
  description: Multi-Language Server WebSocket proxy for Jupyter Notebook/Lab server
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-jupyter-server
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: jupyter-lsp
  import: jupyter_lsp
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6d2a0d9703ff872470b9755f3e1d095a5d978925
      repository: https://github.com/jupyter-lsp/jupyterlab-lsp
      tag: jupyter-lsp-${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: python_packages/jupyter_lsp

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - "[a-z][0-9]*$"
  github:
    identifier: jupyter-lsp/jupyterlab-lsp
    tag-filter: jupyter-lsp-
    strip-prefix: jupyter-lsp-

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
