package:
  name: py3.14-jupyter-packaging
  version: 0.12.3
  epoch: 0
  description: Tools to help build and install Jupyter Python packages
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-deprecation
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-tomlkit
      - py${{vars.python-version}}-wheel
  resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: jupyter-packaging
  import: jupyter_packaging
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-tomlkit

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 17ec07475689e418350affc5a6b1f4fd5cad385a
      repository: https://github.com/jupyter/jupyter-packaging
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jupyter/jupyter-packaging
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
