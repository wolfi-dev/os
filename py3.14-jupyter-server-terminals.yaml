#nolint:depends-on-unversioned-py-provides
package:
  name: py3.14-jupyter-server-terminals
  version: "0.5.4"
  epoch: 1 # upstream-tests/pytest against py3.14-jupyter-server
  description: A Jupyter Server Extension Providing Terminals.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-terminado
  resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-jupyter-server # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-jupyter # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-terminado # upstream-tests: runtime dependency
      - wolfi-base

vars:
  import: jupyter_server_terminals
  pypi-package: jupyter-server-terminals
  glibc-version: "2.44"
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyter-server/jupyter_server_terminals
      tag: v${{package.version}}
      expected-commit: 46563c0797a2d21526d0cc95c70dafc4e0e0440a

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: jupyter-server/jupyter_server_terminals
    tag-filter-prefix: v
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-jupyter-server
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
