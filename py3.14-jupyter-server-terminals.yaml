#nolint:depends-on-unversioned-py-provides
package:
  name: py3.14-jupyter-server-terminals
  version: "0.5.4"
  epoch: 0
  description: A Jupyter Server Extension Providing Terminals.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-terminado
  resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-setuptools
      - wolfi-base

vars:
  import: jupyter_server_terminals
  pypi-package: jupyter-server-terminals
  glibc-version: "2.44"
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyter-server/jupyter_server_terminals
      tag: v${{package.version}}
      expected-commit: 46563c0797a2d21526d0cc95c70dafc4e0e0440a

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # Bootstrap: py3-jupyter-server-terminals runs upstream-tests/pytest
  # here with py3.X-jupyter-server, pytest-jupyter, pytest-timeout and
  # terminado in the build environment. That cannot work yet for 3.14:
  # py3.14-jupyter-server (#338083) runtime-depends on this package
  # (jupyter_server_terminals>=0.4.4 is a hard upstream requirement), so
  # it cannot be installed until this package exists. Every upstream test
  # needs it: tests/conftest.py loads the pytest_jupyter.jupyter_server
  # plugin, which imports jupyter_server, so ignore-files cannot keep any
  # of tests/test_auth.py, test_disable_app.py or test_terminal.py.
  # TODO(upstream-tests): once py3.14-jupyter-server is built, restore
  # upstream-tests/pytest and its build dependencies as in
  # py3-jupyter-server-terminals, bump the epoch, and replace the
  # import-guard test below with py3-jupyter-server-terminals' test
  # (py3.14-jupyter-server in the test environment, python/import of
  # jupyter_server_terminals).
  - uses: strip

update:
  enabled: true
  github:
    identifier: jupyter-server/jupyter_server_terminals
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: installed package and its jupyter_server import guard
      runs: |
        # Importing jupyter_server_terminals needs jupyter_server, which
        # cannot be installed yet (see the bootstrap comment above). Check
        # the installed distribution and that the package's own import
        # guard is what fails, with its documented message.
        python${{vars.python-version}} - <<'PYEOF'
        import importlib.metadata as md
        import importlib.util
        import terminado
        assert md.version("${{vars.import}}") == "${{package.version}}"
        spec = importlib.util.find_spec("${{vars.import}}")
        assert spec is not None and spec.origin.startswith("/usr/lib/python${{vars.python-version}}/site-packages/"), spec
        assert importlib.util.find_spec("jupyter_server") is None
        try:
            import ${{vars.import}}
        except ModuleNotFoundError as e:
            assert str(e) == "Jupyter Server must be installed to use this extension.", e
        else:
            raise AssertionError("imported without jupyter_server")
        PYEOF
