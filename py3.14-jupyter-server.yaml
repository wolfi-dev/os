package:
  name: py3.14-jupyter-server
  version: "2.21.1"
  epoch: 0
  description: The backend—i.e. core services, APIs, and REST endpoints—to Jupyter web applications.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-anyio
      - py${{vars.python-version}}-argon2-cffi
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-jupyter-client
      - py${{vars.python-version}}-jupyter-core
      - py${{vars.python-version}}-jupyter-events
      - py${{vars.python-version}}-jupyter-server-terminals
      - py${{vars.python-version}}-nbconvert
      - py${{vars.python-version}}-nbformat
      - py${{vars.python-version}}-overrides
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-prometheus-client
      - py${{vars.python-version}}-pyzmq
      - py${{vars.python-version}}-send2trash
      - py${{vars.python-version}}-terminado
      - py${{vars.python-version}}-tornado
      - py${{vars.python-version}}-traitlets
      - py${{vars.python-version}}-websocket-client
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - nodejs-26
      - npm
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-jupyter-builder
      - py${{vars.python-version}}-hatchling
      - wolfi-base
  environment:
    # This is needed to work around the error "ValueError: ZIP does not support timestamps before 1980"
    SOURCE_DATE_EPOCH: 315532800

vars:
  pypi-package: jupyter-server
  import: jupyter_server
  glibc-version: "2.44"
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ca88f7e002cb545bebec3c91ac1bb9bed955fe34
      repository: https://github.com/jupyter-server/jupyter_server
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: jupyter-server
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: jupyter-server

update:
  enabled: true
  manual: false
  github:
    identifier: jupyter-server/jupyter_server
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
