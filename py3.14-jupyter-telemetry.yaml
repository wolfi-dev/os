package:
  name: py3.14-jupyter-telemetry
  version: 0.1.0
  epoch: 0
  description: Jupyter telemetry library
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-jsonschema
      - py${{vars.python-version}}-python-json-logger
      - py${{vars.python-version}}-ruamel-yaml
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: jupyter-telemetry
  import: jupyter_telemetry
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-jsonschema # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-python-json-logger # upstream-tests: runtime dependency
      - py${{vars.python-version}}-ruamel-yaml # upstream-tests: runtime dependency
      - py${{vars.python-version}}-traitlets # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyter/telemetry
      tag: v${{package.version}}
      expected-commit: d507497d5359d09b3c73940027083f7e59fa0772

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: jupyter/telemetry
    use-tag: true
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
