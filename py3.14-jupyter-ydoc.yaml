package:
  name: py3.14-jupyter-ydoc
  version: "4.2.1"
  epoch: 0
  description: Jupyter document structures for collaborative editing using Yjs/pycrdt
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-anyio
      - py${{vars.python-version}}-pycrdt
  resources:
    cpu: "1"
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  import: jupyter_ydoc
  pypi-package: jupyter-ydoc
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-nodejs-version
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f6f76d61bac4449d9a4b3aa9933493cfeaed8cce
      repository: https://github.com/jupyter-server/jupyter_ydoc
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: jupyter-server/jupyter_ydoc
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          from ${{vars.import}} import ydocs
          from ${{vars.import}} import YBlob, YUnicode, YNotebook
