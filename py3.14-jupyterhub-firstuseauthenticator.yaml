# Generated from https://pypi.org/project/jupyterhub-firstuseauthenticator/
package:
  name: py3.14-jupyterhub-firstuseauthenticator
  version: "1.1.1"
  epoch: 0
  description: JupyterHub Authenticator that lets users set passwords on first use
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-bcrypt
      - py${{vars.python-version}}-jupyterhub
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: jupyterhub-firstuseauthenticator
  import: firstuseauthenticator
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-bcrypt # upstream-tests: runtime dependency
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-jupyterhub # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-asyncio # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ea4530eef53fd061b1d591b696377213dec982a3
      repository: https://github.com/jupyterhub/firstuseauthenticator
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jupyterhub/firstuseauthenticator
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
