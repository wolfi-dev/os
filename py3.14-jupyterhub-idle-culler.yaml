# Generated from https://pypi.org/project/jupyterhub-idle-culler/
package:
  name: py3.14-jupyterhub-idle-culler
  version: "2.0.0"
  epoch: 0
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-python-dateutil
      - py${{vars.python-version}}-tornado
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: jupyterhub-idle-culler
  import: jupyterhub_idle_culler
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8e3f4719f5943f9c5ee0ed939ab161ed39587eae
      repository: https://github.com/jupyterhub/jupyterhub-idle-culler
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: "move usr/bin executables for -bin"
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jupyterhub/jupyterhub-idle-culler
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
