package:
  name: py3.14-jupyterhub-kubespawner
  version: "7.2.0"
  epoch: 0
  description: JupyterHub Spawner for Kubernetes
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-escapism
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-jupyterhub
      - py${{vars.python-version}}-kubernetes-asyncio
      - py${{vars.python-version}}-python-slugify
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-traitlets
      - py${{vars.python-version}}-urllib3
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: jupyterhub-kubespawner
  import: kubespawner
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ee62de9adf86eac723284a52140968b40945f733
      repository: https://github.com/jupyterhub/kubespawner
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  # Ignore beta version tags, such as 7.0.0b1, 7.0.0b2, etc.
  ignore-regex-patterns:
    - .*b\d+$
  github:
    identifier: jupyterhub/kubespawner
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
