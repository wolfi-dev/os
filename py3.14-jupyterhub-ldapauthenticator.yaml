# Generated from https://pypi.org/project/jupyterhub-ldapauthenticator/
package:
  name: py3.14-jupyterhub-ldapauthenticator
  version: 2.0.2
  epoch: 0
  description: LDAP Authenticator for JupyterHub
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-jupyterhub
      - py${{vars.python-version}}-ldap3
      - py${{vars.python-version}}-traitlets

vars:
  pypi-package: jupyterhub-ldapauthenticator
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7f1fd8cfa68fdd9e163cc78d760fd02e577240e9
      repository: https://github.com/jupyterhub/ldapauthenticator
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: jupyterhub/ldapauthenticator
    use-tag: true
  # Upstream created non-GA releases in the format: `2.0.0b1`. This regex will ignore.
  ignore-regex-patterns:
    - \d+(\.\d+)*b.*

test:
  # No test/tw/pip-check: py3.14-ldap3 2.9.1 reports its version as 2.9
  # (upstream's v2.9.1 tag metadata), so pip check rejects ldap3>=2.9.1.
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          from ldapauthenticator import LDAPAuthenticator
