# Generated from https://pypi.org/project/jupyterhub-ltiauthenticator/
package:
  name: py3.14-jupyterhub-ltiauthenticator
  version: "1.6.3"
  epoch: 0
  description: JupyterHub authenticator implementing LTI v1.1 and LTI v1.3
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-cachetools
      - py${{vars.python-version}}-escapism
      - py${{vars.python-version}}-jupyterhub
      - py${{vars.python-version}}-oauthlib
      - py${{vars.python-version}}-pyjwt
      - py${{vars.python-version}}-traitlets

vars:
  pypi-package: jupyterhub-ltiauthenticator
  import: ltiauthenticator
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-cachetools # upstream-tests: runtime dependency
      - py${{vars.python-version}}-escapism # upstream-tests: runtime dependency
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-jupyterhub # upstream-tests: runtime dependency
      - py${{vars.python-version}}-oauthlib # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pyjwt # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-asyncio # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-traitlets # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 4fb95e2b72ec87c2000c5b6ea1968479c1a82382
      repository: https://github.com/jupyterhub/ltiauthenticator
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jupyterhub/ltiauthenticator
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
