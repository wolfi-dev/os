# Generated from https://pypi.org/project/jupyterhub-nativeauthenticator/
package:
  name: py3.14-jupyterhub-nativeauthenticator
  version: "1.4.0"
  epoch: 0
  description: JupyterHub Native Authenticator
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-bcrypt
      - py${{vars.python-version}}-jupyterhub
      - py${{vars.python-version}}-onetimepass
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: jupyterhub-nativeauthenticator
  import: nativeauthenticator
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-bcrypt # upstream-tests: runtime dependency
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-jupyterhub # upstream-tests: runtime dependency
      - py${{vars.python-version}}-onetimepass # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-asyncio # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8e12ddbd23157faeabcfe72c411f6c00ca1f94bd
      repository: https://github.com/jupyterhub/nativeauthenticator
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jupyterhub/nativeauthenticator
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
