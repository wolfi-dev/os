# Generated from https://pypi.org/project/jupyterhub-tmpauthenticator/
package:
  name: py3.14-jupyterhub-tmpauthenticator
  version: 1.0.0
  epoch: 0
  description: JupyterHub authenticator that hands out temporary accounts for everyone
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-jupyterhub
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: jupyterhub-tmpauthenticator
  import: tmpauthenticator
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5c62463c9b45699d819d3917f8ac0cda5a843e6c
      repository: https://github.com/jupyterhub/tmpauthenticator
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jupyterhub/tmpauthenticator
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
