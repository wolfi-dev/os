package:
  name: py3.14-jupyterhub
  version: "6.2.0"
  epoch: 0 # CVE-2026-17495
  description: 'JupyterHub: A multi-user server for Jupyter notebooks'
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - linux-pam
      - py${{vars.python-version}}-aiodns
      - py${{vars.python-version}}-aiohttp
      - py${{vars.python-version}}-alembic
      - py${{vars.python-version}}-async-generator
      - py${{vars.python-version}}-certipy
      - py${{vars.python-version}}-importlib-metadata
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-jupyter-events
      - py${{vars.python-version}}-oauthlib
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pamela
      - py${{vars.python-version}}-prometheus-client
      - py${{vars.python-version}}-psutil
      - py${{vars.python-version}}-pydantic
      - py${{vars.python-version}}-python-dateutil
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-sqlalchemy
      - py${{vars.python-version}}-tornado
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: jupyterhub
  import: jupyterhub
  python-version: "3.14"

environment:
  contents:
    packages:
      - nodejs-26
      - npm
      - py${{vars.python-version}}-build-base
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyterhub/jupyterhub
      expected-commit: 091a75b3c0101605b227fa774b60af4f20623106
      tag: ${{package.version}}

  - name: build frontend assets
    runs: |
      # npm 11 runs as root and no longer honors --unsafe-perm, so it skips the
      # package.json "postinstall" hook (python3 ./bower-lite). That hook stages
      # static/components from node_modules; without it setup.py's os.utime() on
      # that missing dir fails the wheel build. Build the assets explicitly here.
      npm install
      # CVE-2026-17495 (GHSA-4p3w-j4w9-5jqw): moment is a direct dependency,
      # so an npm "overrides" entry (what the bump pipeline writes) fails with
      # EOVERRIDE. Upgrade it through npm instead before bower-lite stages it.
      npm install moment@2.31.0
      python${{vars.python-version}} bower-lite
      npm run css
      ( cd jsx && npm install && npm run build )

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
      needs-exe-named-python3: true

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
        # jupyterhub/dbutil.py shells out to the alembic CLI during the startup
        # DB migration. Declared here rather than on the library package so
        # the library can be installed next to other python versions'
        # jupyterhub without the alembic-bin variants colliding on cmd:alembic.
        - py${{vars.python-version}}-alembic-bin
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: jupyterhub
        - name: Verify jupyterhub-singleuser exists
          runs: |
            stat /usr/bin/jupyterhub-singleuser
        - name: Verify alembic CLI is present
          runs: |
            # jupyterhub/dbutil.py shells out to the alembic CLI during the
            # startup DB migration, so the binary must be on PATH.
            alembic --version

update:
  ignore-regex-patterns:
    - b
  enabled: true
  manual: false
  github:
    identifier: jupyterhub/jupyterhub
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
