package:
  name: py3.14-jupyterlab-pygments
  version: 0.3.0
  epoch: 0
  description: Pygments theme using JupyterLab CSS variables
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-pygments
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: jupyterlab-pygments
  import: jupyterlab_pygments
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-deprecation
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-hatch-jupyter-builder
      - py${{vars.python-version}}-hatch-nodejs-version
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-jupyter-core
      - py${{vars.python-version}}-jupyter-packaging
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pygments
      - py${{vars.python-version}}-tomlkit

pipeline:
  # A git build needs a Node/JupyterLab build of the labextension, which the
  # PyPI sdist ships prebuilt.
  # blocked-bootstrap-complex: labextension needs a Node build from git
  - uses: fetch
    with:
      uri: https://pypi.io/packages/source/j/jupyterlab_pygments/jupyterlab_pygments-${{package.version}}.tar.gz
      expected-sha256: 721aca4d9029252b11cfa9d185e5b5af4d54772bb8072f9b7036f4170054d35d

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: style uses JupyterLab CSS variables
      runs: |
        python${{vars.python-version}} -c '
        from pygments import highlight
        from pygments.formatters import HtmlFormatter
        from pygments.lexers import PythonLexer
        from jupyterlab_pygments import JupyterStyle
        fmt = HtmlFormatter(style=JupyterStyle)
        assert "var(--jp-mirror-editor-keyword-color)" in fmt.get_style_defs(), "keyword color variable missing"
        out = highlight("def f(x):\n    return x\n", PythonLexer(), fmt)
        assert "<span class=\"k\">def</span>" in out, out
        print("PASS: JupyterStyle highlights with JupyterLab CSS variables")
        '
    - name: prebuilt labextension is installed
      uses: test/tw/contains-files
      with:
        files: |
          /usr/share/jupyter/labextensions/jupyterlab_pygments/package.json

update:
  enabled: true
  github:
    identifier: jupyterlab/jupyterlab_pygments
    use-tag: true
