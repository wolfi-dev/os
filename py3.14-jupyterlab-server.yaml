# Generated from https://pypi.org/project/jupyterlab-server/
package:
  name: py3.14-jupyterlab-server
  version: "2.28.1"
  epoch: 0
  description: A set of server components for JupyterLab and JupyterLab like applications.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-babel
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-json5
      - py${{vars.python-version}}-jsonschema
      - py${{vars.python-version}}-jupyter-server
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-requests

vars:
  pypi-package: jupyterlab-server
  import: jupyterlab_server
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 475cfc19e0e69444fc7e3b0e41655cbeb32a8756
      repository: https://github.com/jupyterlab/jupyterlab_server
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jupyterlab/jupyterlab_server
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Basic test to generate default config
      runs: |
        if [ -f ${HOME}/.jupyter/jupyter_jupyterlab_server_config.py ]
        then
            rm ${HOME}/.jupyter/jupyter_jupyterlab_server_config.py
        fi

        python -m jupyterlab_server --generate-config > out.log 2>&1 &
        sleep 5
        grep -F "Writing default config to:" out.log
