package:
  name: py3.14-jupyterlab
  version: "4.6.6"
  epoch: 0
  description: JupyterLab computational environment.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - nodejs
      - py${{vars.python-version}}-async-lru
      - py${{vars.python-version}}-httpx
      - py${{vars.python-version}}-ipykernel
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-jupyter-builder
      - py${{vars.python-version}}-jupyter-core
      - py${{vars.python-version}}-jupyter-lsp
      - py${{vars.python-version}}-jupyter-server
      - py${{vars.python-version}}-jupyterlab-server
      - py${{vars.python-version}}-notebook-shim
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-tornado
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "2"
    memory: 6Gi
  test-resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: jupyterlab
  import: jupyterlab
  python-version: "3.14"

environment:
  contents:
    packages:
      - nodejs-26
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-jupyter-builder
      - py${{vars.python-version}}-hatch-nodejs-version
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-jupyter-builder-bin
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8d57791d0254820dfa4a540e010105803e128bcd
      repository: https://github.com/jupyterlab/jupyterlab
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: Remove vulnerable yarn.lock files containing handlebars 4.7.8
    runs: |
      # GHSA-2w6w-674q-4c4q: handlebars 4.7.8 in staging/yarn.lock and tests/mock_packages/*/yarn.lock
      # Remove only the yarn.lock files; staging/package.json is required by jupyter-lab at runtime
      rm -f ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/jupyterlab/staging/yarn.lock
      find ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/jupyterlab/tests -name "yarn.lock" -delete

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - name: Test all binaries are executable
          runs: |
            jupyter-lab --version | grep -F ${{package.version}}
            jupyter-labextension --version | grep -F ${{package.version}}
            # jupyter-labhub exits non-zero when jupyterhub is not installed, which is expected
            output=$(jupyter-labhub --version 2>&1; true)
            printf '%s\n' "$output" | grep -F "No module named 'jupyterhub'"
        - name: Test jupyterlab startup
          uses: test/daemon-check-output
          with:
            start: jupyter-lab --allow-root --ip=0.0.0.0
            timeout: 120
            expected_output: |
              notebook_shim | extension was successfully loaded.
              jupyter_lsp | extension was successfully loaded.
              jupyter_server_terminals | extension was successfully loaded.
              JupyterLab extension loaded from /usr/lib/python${{vars.python-version}}/site-packages/jupyterlab
              jupyterlab | extension was successfully loaded.
              Jupyter Server
              is running at:

update:
  enabled: true
  ignore-regex-patterns:
    - .*rc[0-9]*$
    - .*[a-z][0-9]*$
  github:
    identifier: jupyterlab/jupyterlab
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Vulnerable yarn.lock files are absent (GHSA-2w6w-674q-4c4q)
      runs: |
        d=/usr/lib/python${{vars.python-version}}/site-packages/jupyterlab
        test -f "$d/staging/package.json"
        test ! -e "$d/staging/yarn.lock"
        test -z "$(find "$d" -name yarn.lock)"
