package:
  name: py3.14-jwcrypto
  version: "1.6.1"
  epoch: 0
  description: Implementation of JOSE Web standards
  copyright:
    - license: LGPL-3.0-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-cryptography
      - py${{vars.python-version}}-typing-extensions

vars:
  pypi-package: jwcrypto
  import: jwcrypto
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/latchset/jwcrypto
      tag: v${{package.version}}
      expected-commit: c10aa4343f9ce2e68caaf20aef9d2c5f6d0c4d71

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: latchset/jwcrypto
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
