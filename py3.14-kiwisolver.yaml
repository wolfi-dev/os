package:
  name: py3.14-kiwisolver
  version: "1.5.1"
  epoch: 0
  description: A fast implementation of the Cassowary constraint solver
  copyright:
    - license: BSD-3-Clause-Attribution
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "2"
    memory: 7Gi

vars:
  pypi-package: kiwisolver
  import: kiwisolver
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cppy
      - py${{vars.python-version}}-pip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nucleic/kiwi
      expected-commit: 166899b656d8caa3b2444f5ab2464e55a50b9554
      tag: ${{package.version}}
      depth: -1

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: nucleic/kiwi

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
