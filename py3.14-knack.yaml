package:
  name: py3.14-knack
  version: "0.14.0"
  epoch: 0
  description: A Command-Line Interface framework
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-argcomplete
      - py${{vars.python-version}}-jmespath
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pygments
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-tabulate

vars:
  pypi-package: knack
  import: knack
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 696251f16f59da8cea0e98284369cc541a2beac5
      repository: https://github.com/microsoft/knack
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: microsoft/knack
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
