package:
  name: py3.14-kubernetes-asyncio
  version: "36.1.0"
  epoch: 0
  description: Kubernetes asynchronous python client
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-aiohttp
      - py${{vars.python-version}}-certifi
      - py${{vars.python-version}}-dateutil
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-six
      - py${{vars.python-version}}-urllib3
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: kubernetes-asyncio
  import: kubernetes_asyncio
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-aiohttp # upstream-tests: runtime dependency
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-certifi # upstream-tests: runtime dependency
      - py${{vars.python-version}}-dateutil # upstream-tests: runtime dependency
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-pyyaml # upstream-tests: runtime dependency
      - py${{vars.python-version}}-setuptools # upstream-tests: runtime dependency
      - py${{vars.python-version}}-six # upstream-tests: runtime dependency
      - py${{vars.python-version}}-urllib3 # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tomplus/kubernetes_asyncio
      expected-commit: 7ddbf3037cdb0f9a152c9f0c06e003fc5fc98db5
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: tomplus/kubernetes_asyncio
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
