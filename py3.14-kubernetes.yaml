package:
  name: py3.14-kubernetes
  version: "37.0.3"
  epoch: 0
  description: Kubernetes python client
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-certifi
      - py${{vars.python-version}}-dateutil
      - py${{vars.python-version}}-durationpy
      - py${{vars.python-version}}-google-auth
      - py${{vars.python-version}}-ipaddress
      - py${{vars.python-version}}-oauthlib
      - py${{vars.python-version}}-pydantic
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-requests-oauthlib
      - py${{vars.python-version}}-six
      - py${{vars.python-version}}-urllib3
      - py${{vars.python-version}}-websocket-client

vars:
  pypi-package: kubernetes
  glibc-version: "2.44"
  python-version: "3.14"

# NOTE(jamespage)
# py3.14-build-base pulls in setuptools-scm
# which breaks the package install process due to use
# of symbolic links in the upstream git repo.
environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-client/python
      tag: v${{package.version}}
      expected-commit: f5c800e85df67c8a51244f1ab553524fbe767dd3

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: kubernetes-client/python
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
    - name: incluster loader sets BearerToken api_key
      runs: |
        python${{vars.python-version}} - <<'PY'
        from kubernetes.client import Configuration
        from kubernetes.config.incluster_config import InClusterConfigLoader

        loader = InClusterConfigLoader.__new__(InClusterConfigLoader)
        loader.host = "https://test.invalid"
        loader.token = "test-token"
        loader.ssl_ca_cert = None
        loader._try_refresh_token = False

        cfg = Configuration()
        loader._set_config(cfg)

        assert cfg.api_key.get("BearerToken") == "test-token", cfg.api_key
        PY
