package:
  name: py3.14-lazy-importer
  version: "0.1.0"
  epoch: 0
  description: Backport for Python 3.15 lazy imports
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: lazy-importer
  import: lazy_importer
  python-version: 3.14

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pganssle/lazy_importer
      tag: v${{package.version}}
      expected-commit: 413e824889915d395069cb6c13fefdc57f3fd4e2

  - uses: py/pip-build-install

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  git:
    strip-prefix: v
