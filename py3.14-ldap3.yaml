package:
  name: py3.14-ldap3
  version: 2.9.1
  epoch: 0
  description: A strictly RFC 4510 conforming LDAP V3 pure Python client library
  copyright:
    - license: LGPL-3.0-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-pyasn1
  resources:
    cpu: "2"
    memory: 1Gi

vars:
  pypi-package: ldap3
  import: ldap3
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 3a2f89663c73d862b8ba7ca9e974012952ed3024
      repository: https://github.com/cannatag/ldap3
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: cannatag/ldap3
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
