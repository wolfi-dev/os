package:
  name: py3.14-leather
  version: "0.4.1"
  epoch: 0
  description: Python charting for 80% of humans.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-six

vars:
  pypi-package: leather
  import: leather
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wireservice/leather
      tag: ${{package.version}}
      expected-commit: 8b8463e18cae316aec680fbc8f0139f0762c0c7a

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: wireservice/leather
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
