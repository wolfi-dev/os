# Generated from https://pypi.org/project/legacy-cgi/
package:
  name: py3.14-legacy-cgi
  version: "2.6.4"
  epoch: 0
  description: Fork of the standard library cgi and cgitb modules, being deprecated in PEP-594
  copyright:
    - license: PSF-2.0
  dependencies:
    runtime:
      - python-${{vars.python-version}}-base

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-poetry
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e8ca24097efe8eb52255b398953d54e856a32157
      repository: https://github.com/jackrosenthal/legacy-cgi
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  require-sequential: false
  github:
    identifier: jackrosenthal/legacy-cgi
    strip-prefix: v

vars:
  module_name: cgi
  pypi-package: legacy-cgi
  python-version: "3.14"

test:
  environment: {}
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
        python: python${{vars.python-version}}
