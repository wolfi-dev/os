# Generated from https://pypi.org/project/libarchive-c/
package:
  name: py3.14-libarchive-c
  version: "5.3"
  epoch: 0
  description: Python interface to libarchive
  copyright:
    - license: CC0-1.0
  dependencies:
    runtime:
      - libarchive # This package doesn't compile and like it uses ctypes
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - libarchive-dev
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Changaco/python-libarchive-c
      tag: ${{package.version}}
      expected-commit: 7e8cb8556e45d4b22ba7b0726fb640ef6253cfcc

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  github:
    identifier: Changaco/python-libarchive-c

vars:
  module_name: libarchive
  pypi-package: libarchive-c
  python-version: "3.14"

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
        python: python${{vars.python-version}}
