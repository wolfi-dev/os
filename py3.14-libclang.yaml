package:
  name: py3.14-libclang
  version: 18.1.1
  epoch: 0
  description: 'Clang Python Bindings, mirrored from the official LLVM repo: https://github.com/llvm/llvm-project/tree/main/clang/bindings/python, to make the installation process easier.'
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: libclang
  import: clang
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: b7c2f3bcb9a525f10ab9577221106267a4f09a1c
      repository: https://github.com/sighingnow/libclang
      tag: llvm-${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: sighingnow/libclang
    strip-prefix: llvm-

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
