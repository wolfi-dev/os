package:
  name: py3.14-libcst
  version: "1.9.0"
  epoch: 0
  description: A concrete syntax tree with AST-like properties for Python 3.5, 3.6, 3.7, 3.8, 3.9, and 3.10 programs.
  copyright:
    - license: MIT AND PSF-2.0 AND Apache-2.0
  dependencies:
    runtime:
      - glibc
      - py${{vars.python-version}}-pyyaml

vars:
  glibc-version: "2.44"
  pypi-package: libcst
  import: libcst
  rust-version: "1.100"
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-setuptools-rust
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c029c17bf45a3737fc8d1347001ab2422f42ae58
      repository: https://github.com/Instagram/LibCST
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: Instagram/LibCST
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - runs: |
        python${{vars.python-version}} -c 'import libcst; m = libcst.parse_module("x = 1\n"); assert m.code == "x = 1\n"'
