package:
  name: py3.14-libevdev
  version: "0.13.1"
  epoch: 2 # upstream-tests/pytest
  description: Python3 wrapper around the evdev library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libevdev
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: libevdev
  import: libevdev
  python-version: "3.14"

environment:
  contents:
    packages:
      - libevdev
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-typing-extensions # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/libevdev/python-libevdev
      tag: ${{package.version}}
      expected-commit: 31c142d109d61cf690d330e55eee9f14b4a74f94

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # These tests open /dev/uinput or /dev/input/event*; the build VM has no input devices.
  # TODO(upstream-tests): run them in a stage with uinput, or skip them upstream when no device exists.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore: test/test_clib.py::TestRealDevice::test_has_property test/test_clib.py::TestUinput::test_absolute test/test_clib.py::TestUinput::test_button test/test_clib.py::TestUinput::test_device_node test/test_clib.py::TestUinput::test_relative test/test_clib.py::TestUinput::test_syspath test/test_device.py::TestDevice::test_absinfo_sync_kernel test/test_device.py::TestDevice::test_fd_change test/test_device.py::TestDevice::test_fd_on_init test/test_device.py::TestDevice::test_fd_too_late test/test_device.py::TestDevice::test_has_bits test/test_device.py::TestDevice::test_mt_value test/test_device.py::TestDevice::test_slot_value

  - uses: strip

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
