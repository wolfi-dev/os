package:
  name: py3.14-libevdev
  version: "0.13.1"
  epoch: 0
  description: Python3 wrapper around the evdev library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libevdev
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: libevdev
  import: libevdev
  python-version: "3.14"

environment:
  contents:
    packages:
      - libevdev
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/libevdev/python-libevdev
      tag: ${{package.version}}
      expected-commit: 31c142d109d61cf690d330e55eee9f14b4a74f94

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
