package:
  name: py3.14-llm
  version: "0.38"
  epoch: 0
  description: Access large language models from the command-line
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-click-default-group
      - py${{vars.python-version}}-condense-json
      - py${{vars.python-version}}-openai
      - py${{vars.python-version}}-pluggy
      - py${{vars.python-version}}-puremagic-1
      - py${{vars.python-version}}-pydantic
      - py${{vars.python-version}}-python-ulid
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-sqlite-utils
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: llm
  import: llm
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 46f0461d9b1ea9e898cac8a1d7333ab9bc6c8f7f
      repository: https://github.com/simonw/llm
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: llm

update:
  enabled: true
  ignore-regex-patterns:
    - '(a|b|rc)\d+$' # ignore PEP 440 pre-releases (e.g. 0.32a2)
  git: {}

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
