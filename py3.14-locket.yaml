package:
  name: py3.14-locket
  version: 1.0.0
  epoch: 0
  description: File-based locks for Python on Linux and Windows
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: locket
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 32248e25d9a92c76d14e7eb86098c2fdb6995f03
      repository: https://github.com/mwilliamson/locket.py
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: mwilliamson/locket.py
    use-tag: true

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
    - name: Functional test
      runs: |
        echo "foo bar baz" > test.txt

        cat > test.py <<EOF
        import locket

        lock = locket.lock_file("test.txt")
        try:
            lock.acquire()
            print("Lock acquired!")
        finally:
            lock.release()
        EOF

        python${{vars.python-version}} test.py
