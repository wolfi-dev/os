package:
  name: py3.14-lockfile
  version: 0.12.2
  epoch: 0
  description: Platform-independent file locking module
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: lockfile
  import: lockfile
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
  environment:
    PBR_VERSION: ${{package.version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://opendev.org/openstack/pylockfile
      tag: ${{package.version}}
      expected-commit: c8798cedfbc4d738c99977a07cde2de54687ac6c

  - name: Fix version (pbr falls back to 0.0.0 without full git history)
    runs: |
      grep -q '^version = ' setup.cfg || sed -i '/^\[metadata\]/a version = ${{package.version}}' setup.cfg

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 89384

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
