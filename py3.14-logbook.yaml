package:
  name: py3.14-logbook
  version: "1.10.1"
  epoch: 0
  description: A logging replacement for Python
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions

vars:
  glibc-version: "2.44"
  pypi-package: logbook
  import: logbook
  rust-version: "1.100"
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-setuptools-rust
      - py${{vars.python-version}}-typing-extensions # upstream-tests: runtime dependency
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/getlogbook/logbook
      tag: ${{package.version}}
      expected-commit: 0ff5c1ca6c9dc32ea8467740d4daf46b5bf46f35

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  # They have some versions with a postN suffix, so ignore those.
  ignore-regex-patterns:
    - post
  github:
    identifier: getlogbook/logbook
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          from logbook._speedups import group_reflected_property
