package:
  name: py3.14-logfmter
  version: "0.0.12"
  epoch: 2 # upstream-tests/pytest
  description: A Python package which supports global logfmt formatted logging.
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 1Gi

vars:
  pypi-package: logfmter
  import: logfmter
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jteppinette/python-logfmter
      expected-commit: 587cb7f742eb4603b593182c8fb1e35e4a5f2368
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # test_external_tools_compatibility runs helper binaries from external/ (Go and other logfmt implementations) that are not built here.
  # TODO(upstream-tests): drop once upstream skips it when the helpers are missing.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore: tests/test_formatter.py::test_external_tools_compatibility

  - uses: strip

update:
  enabled: true
  github:
    identifier: jteppinette/python-logfmter
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
