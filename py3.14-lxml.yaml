package:
  name: py3.14-lxml
  version: "6.1.3"
  epoch: 0
  description: Powerful and Pythonic XML processing library combining libxml2/libxslt with the ElementTree API.
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: lxml
  import: lxml
  python-version: "3.14"

environment:
  contents:
    packages:
      - cython
      - gcc
      - glibc-2.44-dev
      - libxml2-dev
      - libxslt-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cython
  environment:
    CFLAGS: -Wno-incompatible-pointer-types

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 3c1a4c7f2d5a3c19efe01adfd3c33ac3c8fe52c1
      repository: https://github.com/lxml/lxml
      tag: lxml-${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: lxml/lxml
    strip-prefix: lxml-
    use-tag: true
  ignore-regex-patterns:
    - (.*)(a|b|rc)(.*) # Ignore alpha, beta, and rc releases

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          from ${{vars.import}} import etree
