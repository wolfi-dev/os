package:
  name: py3.14-lz4
  version: "4.4.5"
  epoch: 0
  description: LZ4 bindings for Python
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 7Gi

vars:
  pypi-package: lz4
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 59b2d8176072bdee50d38cc68ec65c33b928a980
      repository: https://github.com/python-lz4/python-lz4
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: python-lz4/python-lz4
    strip-prefix: v
    tag-filter: v

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - name: Test basic functionality
      runs: |
        cat > test.py <<'EOF'
        import os
        import lz4.frame

        # Compress / decompress
        # Generate 2.5 MB of random bytes (20 * 128 * 1024 = 2,621,440 bytes).
        # Random data is used to avoid trivial compression ratios that could
        # mask bugs; the size is large enough to exercise multi-block LZ4 frames.
        input_data = 20 * 128 * os.urandom(1024)
        compressed = lz4.frame.compress(input_data)
        decompressed = lz4.frame.decompress(compressed)

        assert decompressed == input_data

        # Compress in chunks
        context = lz4.frame.create_compression_context()
        compressed = lz4.frame.compress_begin(context)
        compressed += lz4.frame.compress_chunk(context, input_data[:10 * 128 * 1024])
        compressed += lz4.frame.compress_chunk(context, input_data[10 * 128 * 1024:])
        compressed += lz4.frame.compress_flush(context)

        # Work with compressed files
        with lz4.frame.open("testfile", mode="wb") as fp:
            bytes_written = fp.write(input_data)
            assert bytes_written == len(input_data)

        with lz4.frame.open("testfile", mode="r") as fp:
            output_data = fp.read()

        assert input_data == output_data
        EOF

        python${{vars.python-version}} test.py
