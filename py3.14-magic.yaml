package:
  name: py3.14-magic
  version: 0.4.27
  epoch: 0
  description: Python3 wrapper for libmagic
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libmagic
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: magic
  import: magic
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ahupp/python-magic
      tag: ${{package.version}}
      expected-commit: b443195104d89363b93a547584c1a12fce3b57ec

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ahupp/python-magic
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
