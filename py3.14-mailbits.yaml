package:
  name: py3.14-mailbits
  version: "0.2.3"
  epoch: 0
  description: Assorted e-mail utility functions
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-attrs
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  module_name: mailbits
  pypi-package: mailbits
  python-version: "3.14"

# Only currently needed for Python 3.11 or higher
environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jwodder/mailbits
      expected-commit: 28f9c288e261da47c9ffa82f52634c6ec452c510
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
