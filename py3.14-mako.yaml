package:
  name: py3.14-mako
  version: "1.4.3"
  epoch: 3 # restore -bin subpackage dropped in the split
  description: Python3 fast templating language
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-markupsafe
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: mako
  import: mako
  python-version: "3.14"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - py${{vars.python-version}}-build-base
      - py3.14-babel # upstream-tests: test dependency
      - py3.14-markupsafe # upstream-tests: test dependency
      - py3.14-pygments # upstream-tests: test dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: _
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sqlalchemy/mako
      tag: rel_${{vars.mangled-package-version}}
      expected-commit: 6b833ae06fc8866b89ea7939e5d36dd71699cf05

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - apk-tools
      pipeline:
        - runs: |
            apk info -L ${{package.name}}-bin > "pkg.list"
            grep -F usr/bin/ pkg.list > bins.list
            sed 's,^,> ,' bins.list

            while read line; do
              echo "== $line =="
              /"$line" --help
            done < bins.list

update:
  enabled: true
  version-transform:
    - match: rel_(\d+)_(\d+)_(\d+)
      replace: $1.$2.$3
  github:
    identifier: sqlalchemy/mako
    tag-filter: rel_

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
