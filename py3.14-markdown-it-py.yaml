package:
  name: py3.14-markdown-it-py
  version: "4.3.0"
  epoch: 1 # upstream-tests/pytest
  description: Python port of markdown-it. Markdown parsing, done right!
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-mdurl
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  python-version: 3.14
  pypi-package: markdown-it-py
  import: markdown_it

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-mdurl # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-requests # upstream-tests: test dependency
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/executablebooks/markdown-it-py
      tag: v${{package.version}}
      expected-commit: d504583a458edfa399ee800074244fceec288862

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # These tests use the data_regression/file_regression fixtures from pytest-regressions, which is not packaged.
  # TODO(upstream-tests): package py3.14-pytest-regressions and drop these.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore: tests/test_api/test_main.py::test_table_tokens tests/test_cmark_spec/test_spec.py::test_file tests/test_port/test_references.py::test_inline_definitions tests/test_port/test_references.py::test_store_labels tests/test_port/test_references.py::test_use_existing_env tests/test_tree.py::test_pretty tests/test_tree.py::test_pretty_text_special

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: executablebooks/markdown-it-py
    strip-prefix: v
