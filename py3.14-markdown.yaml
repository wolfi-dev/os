package:
  name: py3.14-markdown
  version: "3.11.3"
  epoch: 0 # upstream-tests/pytest
  description: Python implementation of John Gruber's Markdown.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-importlib-metadata

vars:
  pypi-package: markdown
  import: markdown
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-importlib-metadata # upstream-tests: runtime dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-pyyaml # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Python-Markdown/markdown
      tag: ${{package.version}}
      expected-commit: 40eca048f57456d855a491e7f94ba215594f3f57

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      runner: unittest

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - ^\d+\.\d+\.final$
    - ^\d+\.\d+.\d+\.final$
  github:
    identifier: Python-Markdown/markdown
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
