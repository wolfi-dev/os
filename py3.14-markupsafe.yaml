package:
  name: py3.14-markupsafe
  version: "3.0.4"
  epoch: 1 # upstream-tests/pytest
  description: Implements a XML/HTML/XHTML Markup safe string
  copyright:
    - license: BSD-3-Clause
  resources:
    memory: 3Gi

vars:
  pypi-package: markupsafe
  import: markupsafe
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-wheel
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - python-${{vars.python-version}}-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pallets/markupsafe
      tag: ${{package.version}}
      expected-commit: ece26078ec168ebac69f02877238e68d4b376c91

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: pallets/markupsafe
