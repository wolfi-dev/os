package:
  name: py3.14-mashumaro
  version: "3.23"
  epoch: 0
  description: Fast serialization library on top of dataclasses
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: mashumaro
  import: mashumaro
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 005ee9054c416d34916066d77c06337bbf17c203
      repository: https://github.com/Fatal1ty/mashumaro
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: Fatal1ty/mashumaro
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
