package:
  name: py3.14-matplotlib-inline
  version: "0.2.2"
  epoch: 0
  description: Inline Matplotlib backend for Jupyter
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-traitlets

vars:
  pypi-package: matplotlib-inline
  import: matplotlib_inline
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e6e197523ecfabfff1d976e5b6958c3ede948ccb
      repository: https://github.com/ipython/matplotlib-inline
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ipython/matplotlib-inline
    use-tag: true

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-pip
  pipeline:
    - uses: test/tw/pip-check
    - runs: |
        ## pypi reports matplotlib-inline's only dependency is traitlets
        ## that is to avoid a circular dep on ipython and matplotlib
        ## Above we accept that, but use pip here to check that installation
        ## matches expectation of the pypi package.
        set -x
        python${{vars.python-version}} -m pip check
        python${{vars.python-version}} -m pip list > out
        cat out
        if ! grep "${{vars.pypi-package}} .*${{package.version}}" out; then
          echo "FAIL: pip list did not show ${{vars.pypi-package}}"
          exit 1
        fi
