#nolint:unversioned-py3-dep
package:
  name: py3.14-matplotlib
  version: "3.11.2"
  epoch: 0
  description: Python plotting package
  copyright:
    - license: PSF-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-contourpy
      - py${{vars.python-version}}-cycler
      - py${{vars.python-version}}-dateutil
      - py${{vars.python-version}}-fonttools
      - py${{vars.python-version}}-kiwisolver
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pillow
      - py${{vars.python-version}}-pyparsing
  resources:
    cpu: "4"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: matplotlib
  import: matplotlib
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-${{vars.glibc-version}}-dev
      - meson
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cycler
      - py${{vars.python-version}}-dateutil
      - py${{vars.python-version}}-fonttools
      - py${{vars.python-version}}-kiwisolver
      - py${{vars.python-version}}-meson-python
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-pillow
      - py${{vars.python-version}}-pybind11
      - py${{vars.python-version}}-pyparsing
      - py3-pybind11-dev # python-version-independent headers, CMake and pkg-config files

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/matplotlib/matplotlib
      expected-commit: d3ca9172e392048ec242b90e8423e88d1a3000b2
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
      needs-exe-named-python3: true

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - rc
    - post
  github:
    identifier: matplotlib/matplotlib
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
