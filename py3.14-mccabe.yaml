package:
  name: py3.14-mccabe
  version: 0.7.0
  epoch: 0
  description: McCabe complexity checker for Python
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: mccabe
  import: mccabe
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pycqa/mccabe
      tag: ${{package.version}}
      expected-commit: 835a5400881b7460998be51d871fd36f836db3c9

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
