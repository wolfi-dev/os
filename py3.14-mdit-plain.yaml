package:
  name: py3.14-mdit-plain
  version: 1.0.1
  epoch: 0
  description: A plain text renderer for markdown-it-py
  copyright:
    - license: MIT
  resources:
    memory: 1Gi

vars:
  pypi-package: mdit-plain
  import: mdit_plain.renderer
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  # blocked-no-github: no GitHub repository available; uses PyPI tarball
  - uses: fetch
    with:
      expected-sha256: e0cd2c4c5371995e9df3c88eb503004f99eb240b7f6babe3fc49c98152cc25aa
      uri: https://files.pythonhosted.org/packages/source/m/mdit_plain/mdit_plain-${{package.version}}.tar.gz

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}

update:
  enabled: false
  exclude-reason: Neither Release Monitor nor GitHub branches/tags are available for this package
