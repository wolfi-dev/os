package:
  name: py3.14-mdit-py-plugins
  version: "0.7.0"
  epoch: 0
  description: Collection of plugins for markdown-it-py
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-markdown-it-py
  resources:
    cpu: "2"
    memory: 1Gi

vars:
  pypi-package: mdit-py-plugins
  import: mdit_py_plugins
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/executablebooks/mdit-py-plugins
      expected-commit: faf100c1235392d73cb3c4bb6f5fdae539e2e7df
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: executablebooks/mdit-py-plugins
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
