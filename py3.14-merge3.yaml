package:
  name: py3.14-merge3
  version: "0.0.16"
  epoch: 0
  description: Python implementation of 3-way merge
  copyright:
    - license: GPL-2.0-or-later
  resources:
    memory: 1Gi

vars:
  pypi-package: merge3
  import: merge3
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/breezy-team/merge3
      tag: v${{package.version}}
      expected-commit: 6cc145d479cee3517ae47dc41f8ac66b731f520f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: breezy-team/merge3
    use-tag: true
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
