package:
  name: py3.14-meson-python
  version: "0.22.1"
  epoch: 0
  description: Meson Python build backend (PEP 517)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-colorama
      - py${{vars.python-version}}-meson
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pyproject-metadata
      - py${{vars.python-version}}-tomli
  resources:
    cpu: "2"
    memory: 2Gi

vars:
  glibc-version: "2.44"
  pypi-package: meson-python
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - glibc-${{vars.glibc-version}}-dev
      - meson
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pyproject-metadata
      - py${{vars.python-version}}-tomli

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mesonbuild/meson-python
      tag: ${{package.version}}
      expected-commit: 4771b36414f38a772fcf7364ef7f191f1dd5588b

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: mesonbuild/meson-python
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: mesonpy
