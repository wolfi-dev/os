package:
  name: py3.14-meson
  version: "1.12.1"
  epoch: 0
  description: Fast and user friendly build system
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: meson
  import: mesonbuild
  python-version: "3.14"
  test-demo: |
    tmpdir=$(mktemp -d)
    trap "rm -rf $tmpdir" EXIT
    cd "$tmpdir"

    cat <<'EOF' > main.c
    #include <stdio.h>
    int main(int argc, char **argv) {
      printf("Hello Wolfi.\n");
      return 0;
    }
    EOF

    cat <<'EOF' > "meson.build"
    project('tutorial', 'c')
    executable('demo', 'main.c')
    EOF

    CC=gcc meson setup builddir
    cd builddir
    meson compile
    ./demo

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-base-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mesonbuild/meson
      expected-commit: 70598bb7825f0f804fb31ec2795de5e79e7692a0
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: "move usr/bin executables for -bin"
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: py3.14-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
        - samurai
      provides:
        - meson
        - py3-${{vars.pypi-package}}-bin
      # Low priority so py3.13-meson-bin (313) remains the default.
      # Raise above 313 to make Python 3.14 the default meson.
      provider-priority: 100
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - build-base
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: meson
        - runs: ${{vars.test-demo}}

  - name: ${{package.name}}-doc
    description: ${{package.name}} manpages
    pipeline:
      - uses: split/manpages
        with:
          package: py${{vars.python-version}}-${{vars.pypi-package}}
      - runs: |
          rm -rf ${{targets.outdir}}/py${{vars.python-version}}-${{vars.pypi-package}}/usr/share/man
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: mesonbuild/meson

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
