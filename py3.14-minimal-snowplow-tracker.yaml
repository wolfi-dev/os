package:
  name: py3.14-minimal-snowplow-tracker
  version: "1.1.0"
  epoch: 0
  description: A minimal snowplow event tracker for Python. Add analytics to your Python and Django apps, webapps and games
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: minimal-snowplow-tracker
  import: snowplow_tracker
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/snowplow/snowplow-python-tracker
      tag: ${{package.version}}
      expected-commit: 12b73910df25e09ce93dcb106039a8caec936a6e

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    use-tag: true
    identifier: snowplow/snowplow-python-tracker
    strip-suffix: .post1

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
