# Generated from https://pypi.org/project/ml-dtypes/
package:
  name: py3.14-ml-dtypes
  version: "0.6.0"
  # Rebuild: the 0.6.0-r1 wheels for python3.11 to 3.13 were built with
  # scikit-build-core 0.12.2, which ignores [[tool.dynamic-metadata]] and
  # left them reporting Version: 0.0.0 (breaks onnx's pip check).
  epoch: 0
  description: A stand-alone implementation of several NumPy dtype extensions used in machine learning.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-numpy-2.4
  resources:
    cpu: "2"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  import: ml_dtypes
  pypi-package: ml-dtypes
  python-version: "3.14"

environment:
  contents:
    packages:
      - cmake
      - eigen-dev
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-scikit-build-core
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6bc762dd106292e1aa0d5de98d3867d6b642f209
      repository: https://github.com/jax-ml/ml_dtypes
      tag: v${{package.version}}
      recurse-submodules: true

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  github:
    identifier: jax-ml/ml_dtypes
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.import}}
        python: python${{vars.python-version}}
    - name: Wheel metadata carries the real version
      runs: |
        python${{vars.python-version}} -c 'import sys, importlib.metadata as m; v = m.version("ml_dtypes"); assert v == sys.argv[1], f"ml_dtypes reports {v}, expected {sys.argv[1]}"; print(v)' "${{package.version}}"
