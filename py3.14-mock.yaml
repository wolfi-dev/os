package:
  name: py3.14-mock
  version: "5.2.0"
  epoch: 1 # upstream-tests/pytest
  description: Rolling backport of unittest.mock for all Pythons
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: mock
  import: mock
  python-version: 3.14

environment:
  contents:
    packages:
      - py${{vars.python-version}}-pip
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0f5df822bde4729cb2190819ad01a8728ddc9de3
      repository: https://github.com/testing-cabal/mock
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  ignore-regex-patterns:
    # This is an old release that had release- prefix, ignore it.
    - release
  github:
    identifier: testing-cabal/mock
    use-tag: true
