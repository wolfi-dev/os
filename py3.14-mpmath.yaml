package:
  name: py3.14-mpmath
  version: "1.4.1"
  epoch: 0
  description: Python library for arbitrary-precision floating-point arithmetic
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 7Gi

vars:
  pypi-package: mpmath
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-setuptools-scm
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c1131e2d64abcbb57728ca8a499c920c0c69e67f
      repository: https://github.com/mpmath/mpmath
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: mpmath/mpmath

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
