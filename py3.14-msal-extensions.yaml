package:
  name: py3.14-msal-extensions
  version: "1.3.1"
  epoch: 0
  description: Microsoft Authentication Library extensions (MSAL EX) provides a persistence API that can save your data on disk, encrypted on Windows, macOS and Linux. Concurrent data access will be coordinated by a file lock mechanism.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-msal
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pathlib2
      - py${{vars.python-version}}-portalocker
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: msal-extensions
  import: msal_extensions
  python-version: 3.14

environment:
  contents:
    packages:
      - py${{vars.python-version}}-pip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/AzureAD/microsoft-authentication-extensions-for-python
      tag: ${{package.version}}
      expected-commit: c9bf606930638d6ee08201050fdd1321d7404a46

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: AzureAD/microsoft-authentication-extensions-for-python
