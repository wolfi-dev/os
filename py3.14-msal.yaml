package:
  name: py3.14-msal
  version: "1.38.0"
  epoch: 0
  description: The Microsoft Authentication Library (MSAL) for Python library enables your app to access the Microsoft Cloud by supporting authentication of users with Microsoft Azure Active Directory accounts (AAD) and Microsoft Accounts (MSA) using industry standard OAuth2 and OpenID Connect.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-cryptography
      - py${{vars.python-version}}-mock
      - py${{vars.python-version}}-pyjwt
      - py${{vars.python-version}}-requests
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: msal
  import: msal
  python-version: 3.14

environment:
  contents:
    packages:
      - py${{vars.python-version}}-pip

pipeline:
  - uses: git-checkout
    with:
      expected-commit: b5bf1539ffa5afb39d0e4559b528468d66fb3a55
      repository: https://github.com/AzureAD/microsoft-authentication-library-for-python
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  ignore-regex-patterns:
    - b[0-9]+$
  github:
    identifier: AzureAD/microsoft-authentication-library-for-python
