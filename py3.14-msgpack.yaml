# Generated from https://pypi.org/project/msgpack/
package:
  name: py3.14-msgpack
  version: "1.2.3"
  epoch: 0
  description: MessagePack serializer
  copyright:
    - license: Apache-2.0
  resources:
    memory: 1Gi
  test-resources:
    memory: 1Gi

vars:
  pypi-package: msgpack
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cython
      - glibc-2.44-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/msgpack/msgpack-python
      tag: v${{package.version}}
      expected-commit: 742cb6d7ad141343edcccc829b5b06d0c6f8fcb5

  - name: Compile all .pyx files
    runs: make cython

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: msgpack/msgpack-python
    use-tag: true
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
