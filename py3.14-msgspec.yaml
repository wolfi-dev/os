package:
  name: py3.14-msgspec
  version: "0.22.0"
  epoch: 0
  description: Fast serialization and validation library for JSON, MessagePack, YAML, and TOML
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 6Gi

vars:
  pypi-package: msgspec
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jcrist/msgspec.git
      tag: ${{package.version}}
      expected-commit: 6d3443f2dae8413a1a56640290c09a6f486f30c2

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - name: Test some simple date/time functions
      runs: |
        set -euo pipefail
        cat >> test.py <<'EOF'
        import ${{vars.pypi-package}}

        class User(msgspec.Struct):
            id: int
            name: str
            email: str
            active: bool = True

        user = User(id=1, name="test", email="test@example.com")
        encoded = msgspec.json.encode(user)
        print("Encoded JSON:", encoded)
        EOF

        python${{vars.python-version}} test.py | grep -F '"id":1,"name":"test","email":"test@example.com","active":true'
