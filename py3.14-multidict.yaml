# Generated from https://pypi.org/project/multidict/
package:
  name: py3.14-multidict
  version: "7.2.1"
  epoch: 2 # upstream-tests/pytest
  description: multidict implementation
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions

vars:
  pypi-package: multidict
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-cffi # upstream-tests: test dependency
      - py${{vars.python-version}}-coverage # upstream-tests: test dependency
      - py${{vars.python-version}}-objgraph # upstream-tests: test dependency
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-psutil # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-typing-extensions # upstream-tests: runtime dependency
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aio-libs/multidict.git
      tag: v${{package.version}}
      expected-commit: f50870cb46f0146579a1b9d69eeb3f57776eee63

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # The *_benchmarks.py modules use pytest-codspeed, which is not packaged.
  # TODO(upstream-tests): package py3.14-pytest-codspeed and drop ignore-files.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore-files: tests/test_multidict_benchmarks.py tests/test_views_benchmarks.py tests/test_watched_benchmarks.py

  - uses: strip

update:
  enabled: true
  github:
    identifier: aio-libs/multidict
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
