package:
  name: py3.14-mwoauth
  version: 0.3.0
  epoch: 0
  description: A generic MediaWiki OAuth handshake helper.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-oauthlib
      - py${{vars.python-version}}-pyjwt
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-requests-oauthlib
      - py${{vars.python-version}}-six

vars:
  commit: 2cb6b7107e5fb80353a390c9ff4b74566ced679a
  pypi-package: mwoauth
  import: mwoauth
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mediawiki-utilities/python-mwoauth
      tag: v${{package.version}}
      expected-commit: bd01c0501e345de62b6623cd112ee04d6a7c934e

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: mediawiki-utilities/python-mwoauth
    strip-prefix: v

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
