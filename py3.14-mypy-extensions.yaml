# Generated from https://pypi.org/project/mypy-extensions/
package:
  name: py3.14-mypy-extensions
  version: "1.2.0"
  epoch: 0
  description: Type system extensions for programs checked with the mypy type checker.
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  import: mypy_extensions
  pypi-package: mypy-extensions
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 35af63fee83449b0fa50332088e6ce61cc15114f
      repository: https://github.com/python/mypy_extensions
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: python/mypy_extensions
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
