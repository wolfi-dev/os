# Generated from https://pypi.org/project/namex/
package:
  name: py3.14-namex
  version: "0.1.0"
  epoch: 0
  description: A simple utility to separate the implementation of your Python package and its public API surface.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: namex
  import: namex
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}

pipeline:
  # blocked-no-github: namex has no GitHub repo
  - uses: fetch
    with:
      expected-sha256: 117f03ccd302cc48e3f5c58a296838f6b89c83455ab8683a1e85f2a430aa4306
      uri: https://files.pythonhosted.org/packages/source/n/namex/namex-${{package.version}}.tar.gz

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  release-monitor:
    identifier: 325751
