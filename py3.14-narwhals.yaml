#nolint:depends-on-unversioned-py-provides
package:
  name: py3.14-narwhals
  version: "2.28.0"
  epoch: 0
  description: Lightweight and extensible compatibility layer between dataframe libraries
  copyright:
    - license: MIT

vars:
  pypi-package: narwhals
  import: narwhals
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-uv-build
      - py${{vars.python-version}}-uv-build-bin

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/narwhals-dev/narwhals
      tag: v${{package.version}}
      expected-commit: 49fea3c622cc20e1a8485a5cc5a207bed8e80474

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: narwhals-dev/narwhals
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
