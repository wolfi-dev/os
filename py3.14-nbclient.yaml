package:
  name: py3.14-nbclient
  version: "0.11.0"
  epoch: 0
  description: A client library for executing notebooks. Formerly nbconvert's ExecutePreprocessor.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-jupyter-client
      - py${{vars.python-version}}-jupyter-core
      - py${{vars.python-version}}-nbformat
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: nbclient
  import: nbclient
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0811ff44c63c9853c4d6ba7265d7042ca7f8742a
      repository: https://github.com/jupyter/nbclient
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: jupyter-execute
        - uses: test/tw/ver-check
          with:
            bins: jupyter-execute
            version: ${{package.version}}

update:
  enabled: true
  manual: false
  github:
    identifier: jupyter/nbclient
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
