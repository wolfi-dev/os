package:
  name: py3.14-nbconvert
  version: "7.17.2"
  epoch: 0
  description: Converting Jupyter Notebooks
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-beautifulsoup4
      - py${{vars.python-version}}-bleach
      - py${{vars.python-version}}-defusedxml
      - py${{vars.python-version}}-importlib-metadata
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-jupyter-core
      - py${{vars.python-version}}-jupyterlab-pygments
      - py${{vars.python-version}}-markupsafe
      - py${{vars.python-version}}-mistune
      - py${{vars.python-version}}-nbclient
      - py${{vars.python-version}}-nbformat
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pandocfilters
      - py${{vars.python-version}}-pygments
      - py${{vars.python-version}}-tinycss2
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: nbconvert
  import: nbconvert
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyter/nbconvert
      tag: v${{package.version}}
      expected-commit: e681152f214b65387f875aad96a4726994533a0b

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: |
              jupyter-dejavu
              jupyter-nbconvert
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: |
              jupyter-dejavu
              jupyter-nbconvert

update:
  enabled: true
  github:
    identifier: jupyter/nbconvert
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
