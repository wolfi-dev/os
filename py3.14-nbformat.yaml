package:
  name: py3.14-nbformat
  version: "5.11.1"
  epoch: 0
  description: The Jupyter Notebook format
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-fastjsonschema
      - py${{vars.python-version}}-jsonschema
      - py${{vars.python-version}}-jupyter-core
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: nbformat
  import: nbformat
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-nodejs-version
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyter/nbformat
      tag: v${{package.version}}
      expected-commit: 75f819f5b60bc6ffc72145c364132efe5b3c4b35

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: jupyter-trust
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: jupyter-trust

update:
  enabled: true
  github:
    identifier: jupyter/nbformat
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
