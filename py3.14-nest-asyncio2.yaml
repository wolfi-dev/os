package:
  name: py3.14-nest-asyncio2
  version: "1.7.4"
  epoch: 1 # upstream-tests/pytest
  description: Patch asyncio to allow nested event loops
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: nest-asyncio2
  module-name: nest_asyncio2
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-wheel
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f29d44f6b9aa846da5fa68a5708b939d7c1a7c34
      repository: https://github.com/Chaoses-Ib/nest-asyncio2
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: Chaoses-Ib/nest-asyncio2
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.module-name}}
