# Generated from https://pypi.org/project/netifaces/
package:
  name: py3.14-netifaces
  version: 0.11.0
  epoch: 0
  description: Portable network interface information.
  copyright:
    - license: MIT
  dependencies:
  resources:
    cpu: "3"
    memory: 8Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/al45tair/netifaces.git
      expected-commit: ec55b59e27542776f55e0f9e3213a75bf8e0f367
      tag: release_${{vars.mangled-package-version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: _
    to: mangled-package-version

vars:
  import: netifaces
  pypi-package: netifaces
  python-version: "3.14"

update:
  enabled: false
  exclude-reason: Project is unmaintained upstream
  github:
    identifier: al45tair/netifaces

test:
  environment: {}
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.import}}
        python: python${{vars.python-version}}
