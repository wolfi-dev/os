package:
  name: py3.14-networkx
  version: "3.7"
  epoch: 0
  description: Python package for creating and manipulating graphs and networks
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 6Gi

vars:
  pypi-package: networkx
  python-version: "3.14"
  glibc-version: "2.44"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/networkx/networkx
      expected-commit: 49ca2290b80c1389eb4d8d8e49dcba73f8fec016
      tag: networkx-${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: networkx/networkx
    strip-prefix: networkx-

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
