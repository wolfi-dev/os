package:
  name: py3.14-nh3
  version: "0.3.8"
  epoch: 0
  description: Python binding to Ammonia HTML sanitizer Rust crate
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 9Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: nh3
  python-version: "3.14"
  rust-version: "1.100"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-maturin
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}-base
      - rust-${{vars.rust-version}}
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6b5063d3e715f7c5d547affa86c9ff63f1932e6f
      repository: https://github.com/messense/nh3
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: messense/nh3
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
