package:
  name: py3.14-notebook-shim
  version: 0.2.4
  epoch: 0
  description: A shim layer for notebook traits and config
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-jupyter-server
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-jupyter-server # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-jupyter # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - wolfi-base

vars:
  pypi-package: notebook-shim
  import: notebook_shim
  glibc-version: "2.44"
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyter/notebook_shim
      tag: v${{package.version}}
      expected-commit: 08d6c829050465899c24d9d6bb1fdb28ae06cf42

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: jupyter/notebook_shim
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
