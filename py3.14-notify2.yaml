# Generated from https://pypi.org/project/notify2/
package:
  name: py3.14-notify2
  version: 0.3.1
  epoch: 0
  description: Python interface to DBus notifications
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-dbus-python
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  module_name: notify2
  pypi-package: notify2
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build-base-dev
      - wolfi-base

pipeline:
  # blocked-no-github: notify2 is deprecated upstream and distributed via PyPI only
  - uses: fetch
    with:
      expected-sha256: 33fa108d50c42f3cd3407cc437518ad3f6225d1bb237011f16393c9dd3ce197d
      uri: https://files.pythonhosted.org/packages/source/n/notify2/notify2-${{package.version}}.tar.gz

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: false
  exclude-reason: deprecated upstream

test:
  environment: {}
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        imports: |
          import ${{vars.module_name}}
        python: python${{vars.python-version}}
