# Numpy 1.26 only supports up to 3.12. Building for 3.14 is best-effort.
package:
  name: py3.14-numpy-1.26
  version: 1.26.5
  epoch: 0
  description: The fundamental package for scientific computing with Python.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-pygments
  resources:
    cpu: "13"
    memory: 16Gi

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

vars:
  pypi-package: numpy
  python-version: "3.14"

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - gfortran
      - git
      - glibc-2.44-dev
      - meson
      - openblas-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/numpy/numpy
      tag: v${{package.version}}
      expected-commit: 93fdebfcb4bc4cd53c959ccd0117a612d5f13f1a
      recurse-submodules: true
      cherry-picks: |
        main/e48fdef5d7bf8ba2f90972c531cdfa07481ae535: numpy.test() segfault fix (remove NPY_ALIGNMENT_REQUIRED)

  - runs: python${{vars.python-version}} -m pip install . "--root=${{targets.destdir}}" --prefix=/usr

  - runs: |
      mkdir -p ./cleanup/
      mv ${{targets.destdir}}/usr/bin ./cleanup/

  - uses: strip

subpackages:
  - name: py${{vars.python-version}}-${{vars.pypi-package}}-${{vars.major-minor-version}}-bin
    description: Executable binaries for ${{vars.pypi-package}}-${{vars.major-minor-version}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}-${{vars.major-minor-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - gcc
            - gfortran
            - git
            - meson
            - py${{vars.python-version}}-pip
            - py${{vars.python-version}}-pytest
            - python-${{vars.python-version}}-dev
      pipeline:
        - runs: |
            f2py -v
        - runs: |
            git clone --branch v${{package.version}} https://github.com/numpy/numpy.git py${{vars.python-version}}-numpy
            cd py${{vars.python-version}}-numpy/numpy
            cp -r tests ../..
            cd ../../tests
            python${{vars.python-version}} -m pytest . -k "not test_api_importable"

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import numpy

update:
  enabled: true
  git:
    # Some reverse dependencies don't work with v2
    tag-filter-prefix: v1.26
    strip-prefix: v
    strip-suffix: .dev0
