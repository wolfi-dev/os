package:
  name: py3.14-oauthenticator
  version: "17.5.0"
  epoch: 0
  description: 'OAuthenticator: Authenticate JupyterHub users with common OAuth providers'
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - openssl
      - py${{vars.python-version}}-jsonschema
      - py${{vars.python-version}}-jupyterhub
      - py${{vars.python-version}}-pyjwt
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-ruamel-yaml
      - py${{vars.python-version}}-tornado
      - py${{vars.python-version}}-traitlets
  resources:
    cpu: "3"
    memory: 5Gi

vars:
  pypi-package: oauthenticator
  import: oauthenticator
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-requirements-txt
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ba446783d32f6e7c94d6203c23ac629e3437a02c
      repository: https://github.com/jupyterhub/oauthenticator
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jupyterhub/oauthenticator
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
