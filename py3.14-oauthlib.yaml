package:
  name: py3.14-oauthlib
  version: "3.3.1"
  epoch: 0
  description: A generic, spec-compliant, thorough implementation of the OAuth request-signing logic
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: oauthlib
  import: oauthlib
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/oauthlib/oauthlib
      tag: v${{package.version}}
      expected-commit: a2779c65b3e961f1b49c05a2417c0ae819f3f8c4

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: oauthlib/oauthlib
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
