package:
  name: py3.14-objsize
  version: "0.8.0"
  epoch: 0
  description: Traversal over Python's objects subtree and calculate the total size of the subtree in bytes (deep size).
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: objsize
  import: objsize
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a3bb7835a89ab51f6376c43dc96492a59fe5cf5c
      repository: https://github.com/liran-funaro/objsize
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: liran-funaro/objsize
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
