package:
  name: py3.14-onetimepass
  version: 1.0.1
  epoch: 0
  description: Module for generating and validating HOTP and TOTP tokens
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-six

vars:
  pypi-package: onetimepass
  import: onetimepass
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 91192c0a79d3ad1afe9e438c295dc67595cd1a4d
      repository: https://github.com/tadeck/onetimepass
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: false
  exclude-reason: No releases since 2015

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
