# Generated from https://pypi.org/project/openai/
package:
  name: py3.14-openai
  version: "3.59.0"
  epoch: 0
  description: Python client library for the OpenAI API
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-anyio
      - py${{vars.python-version}}-distro
      - py${{vars.python-version}}-httpx2
      - py${{vars.python-version}}-jiter
      - py${{vars.python-version}}-pydantic
      - py${{vars.python-version}}-tqdm
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "2"
    memory: 3Gi

vars:
  pypi-package: openai
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
  environment:
    # This is needed to work around the error "ValueError: ZIP does not support timestamps before 1980"
    SOURCE_DATE_EPOCH: 315532800

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openai/openai-python.git
      tag: v${{package.version}}
      expected-commit: d296ec3be3a98b225d391ef81717b20320f9b598

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: openai/openai-python
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
