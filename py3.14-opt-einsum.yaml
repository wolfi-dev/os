package:
  name: py3.14-opt-einsum
  version: 3.4.0
  epoch: 0
  description: Optimizing numpys einsum function
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-numpy-2.2
  resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: opt-einsum
  import: opt_einsum
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dgasmith/opt_einsum
      tag: v${{package.version}}
      expected-commit: c15aec2c7dbbcaf5b9790b980f699bf295baa7d9

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: dgasmith/opt_einsum
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
