# Generated from https://pypi.org/project/optree/
package:
  name: py3.14-optree
  version: "0.20.0"
  epoch: 0
  description: Optimized PyTree Utilities.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "3"
    memory: 10Gi

vars:
  module_name: optree
  pypi-package: optree
  python-version: "3.14"

environment:
  contents:
    packages:
      - cmake
      - glibc-2.44-dev
      - py${{vars.python-version}}-attrs # upstream-tests: test dependency
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-numpy-2.4 # upstream-tests: test dependency
      - py${{vars.python-version}}-pybind11
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-rich # upstream-tests: test dependency
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-typing-extensions # upstream-tests: test dependency
      - python-${{vars.python-version}}-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6b2a48ff313b6d627053432e4fb8ac86db4c5246
      repository: https://github.com/metaopt/optree
      tag: v${{package.version}}

  - name: Fix CMake to find correct Python version, was detecting python3.13 for all versions since v0.18.0
    runs: |
      # Comment out the automatic resolution that overwrites the python version we ask it to use
      sed -i '/^[[:space:]]*if(UNIX)/,/^[[:space:]]*endif\(\)/s/^/# DISABLED: /' CMakeLists.txt

  - uses: patch
    with:
      patches: |
        fix-ftbfs-py-lt-3.12.patch

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  github:
    strip-prefix: v
    identifier: metaopt/optree

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
        python: python${{vars.python-version}}
