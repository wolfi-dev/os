package:
  name: py3.14-ordered-set
  version: 4.1.0
  epoch: 1 # upstream-tests/pytest
  description: mutableset which remembers its order
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: ordered-set
  import: ordered_set
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rspeer/ordered-set
      tag: release/${{package.version}}
      expected-commit: d921651b2737f5cfe711868fab558a8ef79e26ca

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: rspeer/ordered-set
    use-tag: true
    tag-filter-prefix: release/
    strip-prefix: release/

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
