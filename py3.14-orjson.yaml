# Generated from https://pypi.org/project/orjson/
package:
  name: py3.14-orjson
  version: "3.13.0"
  epoch: 1
  description: Fast, correct Python JSON library supporting dataclasses, datetimes, and numpy
  copyright:
    - license: Apache-2.0 OR MIT
  resources:
    cpu: "4"
    memory: 14Gi
  test-resources:
    cpu: "2"
    memory: 4Gi

vars:
  glibc-version: "2.44"
  pypi-package: orjson
  python-version: "3.14"
  rust-version: "1.100"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-maturin
      - py${{vars.python-version}}-numpy-2.4 # upstream-tests: test dependency
      # py3.14-pendulum is not built yet (its split is still open), so it is
      # left out for now; orjson's pendulum tests skip without it.
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-psutil # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-python-dateutil # upstream-tests: test dependency
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-tz # upstream-tests: test dependency (installs pytz)
      - python-${{vars.python-version}}-base
      - rust-${{vars.rust-version}}
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: bd00937c5c46ab20eb5d7fe1cfc034b906c4578f
      repository: https://github.com/ijl/orjson
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: ijl/orjson

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
