package:
  name: py3.14-oscrypto
  version: 1.3.0
  epoch: 0
  description: Compiler-free Python crypto library backed by the OS, supporting CPython and PyPy
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-asn1crypto
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: oscrypto
  import: oscrypto
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wbond/oscrypto
      expected-commit: c91c8642e712e7801bf40403dd72165b607f4930
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: wbond/oscrypto
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
