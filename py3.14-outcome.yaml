package:
  name: py3.14-outcome
  version: 1.3.0
  epoch: 0
  description: Capture the outcome of Python function calls.
  copyright:
    - license: MIT
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-attrs
  resources:
    cpu: "1"
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: outcome
  import: outcome
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-trio/outcome
      tag: v${{package.version}}
      expected-commit: 4037dd7fa89b3a26f41594607bc94aaea422d7c3

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - .post0
    - DEBIAN-0.1.0-2
  github:
    identifier: python-trio/outcome
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
