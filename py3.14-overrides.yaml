package:
  name: py3.14-overrides
  version: 7.7.0
  epoch: 0
  description: A decorator to automatically detect mismatch when overriding a method.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 1Gi

vars:
  pypi-package: overrides
  import: overrides
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0e71df17fb3066cb8bc2429d3fd0dbb3c6ca231f
      repository: https://github.com/mkorpela/overrides
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: mkorpela/overrides

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
