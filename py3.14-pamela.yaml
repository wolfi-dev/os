package:
  name: py3.14-pamela
  version: 1.2.0
  epoch: 0
  description: PAM interface using ctypes
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # pamela dlopens "pam" (CDLL(find_library("pam")))
      - linux-pam
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: pamela
  import: pamela
  python-version: "3.14"

environment:
  contents:
    packages:
      - linux-pam # upstream-tests: runtime dependency
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8b55885855c57ed510d2c45143864fcfac5840b3
      repository: https://github.com/jupyterhub/pamela
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jupyterhub/pamela
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
