package:
  name: py3.14-pandas
  version: "3.1.1"
  epoch: 0
  description: Powerful data structures for data analysis, time series, and statistics
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-dateutil
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-tz
      - py${{vars.python-version}}-tzdata
  resources:
    memory: 11Gi
    cpu: "9"
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: pandas
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - meson
      - py${{vars.python-version}}-cython-bin # meson needs the cython executable
      - py${{vars.python-version}}-meson-python
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-versioneer
      - python-${{vars.python-version}}-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pandas-dev/pandas
      tag: v${{package.version}}
      expected-commit: 3dcc6fbbbebc5e85dd3e83fe49b382ca7735cae1

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pandas-dev/pandas
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
