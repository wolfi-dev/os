package:
  name: py3.14-pandocfilters
  version: 1.5.1
  epoch: 0
  description: Utilities for writing pandoc filters in python
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: pandocfilters
  import: pandocfilters
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1feb93e210ce0b9ba3a867bd9d5688f0c96095ce
      repository: https://github.com/jgm/pandocfilters
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jgm/pandocfilters

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
