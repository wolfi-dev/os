package:
  name: py3.14-parameterized
  version: "0.9.0"
  epoch: 0
  description: Parameterized testing with any Python test framework (unittest, pytest, nose, nose2)
  copyright:
    - license: BSD-2-Clause-Views

vars:
  pypi-package: parameterized
  import: parameterized
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wolever/parameterized
      tag: v${{package.version}}
      expected-commit: 8719c41604c41a0ee372511ea87d2ecbb3215f8d

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          from ${{vars.import}} import parameterized, param, parameterized_class
    - name: expand, param and parameterized_class generate named unittest cases
      runs: |
        cat > /tmp/test_param_ok.py <<'EOF'
        import unittest
        from parameterized import parameterized, param, parameterized_class

        class TestExpand(unittest.TestCase):
            @parameterized.expand([(1, 2, 3), (2, 3, 5), (10, -4, 6)])
            def test_add(self, a, b, expected):
                self.assertEqual(a + b, expected)

            @parameterized.expand([param("foo", expected="FOO"), param("bar", expected="BAR")])
            def test_upper(self, s, expected):
                self.assertEqual(s.upper(), expected)

        @parameterized_class(("x", "y"), [(1, 1), (4, 16)])
        class TestSquare(unittest.TestCase):
            def test_square(self):
                self.assertEqual(self.x * self.x, self.y)

        if __name__ == "__main__":
            loader = unittest.TestLoader()
            names = sorted(loader.getTestCaseNames(TestExpand))
            print(names)
            assert names == ["test_add_0", "test_add_1", "test_add_2",
                             "test_upper_0_foo", "test_upper_1_bar"], names
            suite = loader.loadTestsFromModule(__import__(__name__))
            result = unittest.TextTestRunner(verbosity=2).run(suite)
            # 3 add + 2 upper + 2 generated TestSquare_* classes
            assert result.testsRun == 7, result.testsRun
            assert result.wasSuccessful()
            print("PARAMETERIZED-OK")
        EOF
        python${{vars.python-version}} /tmp/test_param_ok.py 2>&1 | tee /tmp/ok.log
        grep -F "PARAMETERIZED-OK" /tmp/ok.log
        grep -F "TestSquare_1" /tmp/ok.log
    - name: A failing parameter set is reported under its generated name
      runs: |
        cat > /tmp/test_param_fail.py <<'EOF'
        import unittest
        from parameterized import parameterized

        class TestBad(unittest.TestCase):
            @parameterized.expand([(2, 4), (3, 10)])
            def test_double(self, a, expected):
                self.assertEqual(a * 2, expected)

        if __name__ == "__main__":
            unittest.main(verbosity=2)
        EOF
        if python${{vars.python-version}} /tmp/test_param_fail.py > /tmp/fail.log 2>&1; then
          cat /tmp/fail.log
          echo "expected the (3, 10) case to fail"
          exit 1
        fi
        cat /tmp/fail.log
        grep -E "test_double_0 .*ok" /tmp/fail.log
        grep -E "FAIL: test_double_1" /tmp/fail.log
        grep -F "FAILED (failures=1)" /tmp/fail.log

update:
  enabled: true
  github:
    identifier: wolever/parameterized
    strip-prefix: v
    use-tag: true
