package:
  name: py3.14-paramiko
  version: "5.1.0"
  epoch: 0
  description: SSH2 protocol library
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-bcrypt
      - py${{vars.python-version}}-cryptography
      - py${{vars.python-version}}-invoke
      - py${{vars.python-version}}-pynacl
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: paramiko
  import: paramiko
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0e9ccb91e0f9a68f2587233d523ad7fe46e730fe
      repository: https://github.com/paramiko/paramiko
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: paramiko/paramiko
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
