package:
  name: py3.14-parsedatetime
  version: '2.6'
  epoch: 1 # upstream-tests/pytest
  description: Parse human-readable date/time text.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: parsedatetime
  import: parsedatetime
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-mccabe # upstream-tests: test dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c55337589ee582813182b74f2d3ae80e2fcd9738
      repository: https://github.com/bear/parsedatetime
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: bear/parsedatetime
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
