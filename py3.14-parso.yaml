package:
  name: py3.14-parso
  version: "0.8.7"
  epoch: 0
  description: A Python Parser
  copyright:
    - license: MIT
  resources:
    cpu: "4"
    memory: 4Gi

vars:
  pypi-package: parso
  import: parso
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: bfe30584415cde2e5a686512c2b109e1d06da3b6
      repository: https://github.com/davidhalter/parso
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: davidhalter/parso
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
