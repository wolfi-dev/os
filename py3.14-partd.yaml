package:
  name: py3.14-partd
  version: 1.4.2
  epoch: 0
  description: Concurrent appendable key-value storage
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-locket
      - py${{vars.python-version}}-toolz
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: partd
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-tomli
      - py${{vars.python-version}}-versioneer

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 829b539a7355f2740124fd3f9a70ca4356f981d2
      repository: https://github.com/dask/partd
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: dask/partd
    use-tag: true

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
    - name: Test basic functionality
      runs: |
        cat > test.py <<EOF
        import partd

        p = partd.File("dataset")
        p.append(dict(x=b"Hello ", y=b"123"))
        p.append(dict(x=b"world!", y=b"456"))

        assert p.get("x") == b"Hello world!"
        two_keys = p.get(["y", "x"])
        assert two_keys[0] == b"123456"
        assert two_keys[1] == b"Hello world!"

        p.drop()
        EOF

        python${{vars.python-version}} test.py
