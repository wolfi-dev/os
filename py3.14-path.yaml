package:
  name: py3.14-path
  version: "17.1.1"
  epoch: 0
  description: "Implements path objects as first-class entities, allowing common operations on files to be invoked on those path objects directly,"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-autocommand
      - py${{vars.python-version}}-jaraco.context
      - py${{vars.python-version}}-jaraco.functools
      - py${{vars.python-version}}-more-itertools
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: path
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-appdirs # upstream-tests: test dependency
      - py${{vars.python-version}}-autocommand # upstream-tests: runtime dependency
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-jaraco.context # upstream-tests: runtime dependency
      - py${{vars.python-version}}-jaraco.functools # upstream-tests: runtime dependency
      - py${{vars.python-version}}-more-itertools # upstream-tests: test dependency
      - py${{vars.python-version}}-packaging # upstream-tests: test dependency
      - py${{vars.python-version}}-pygments # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jaraco/path
      tag: v${{package.version}}
      expected-commit: 0f86209f11199ceaff788c73f96ea5b5ec2318ee

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jaraco/path
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-pytest
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
    - uses: git-checkout
      with:
        repository: https://github.com/jaraco/path
        tag: v${{package.version}}
        expected-commit: 0f86209f11199ceaff788c73f96ea5b5ec2318ee
    - runs: |
        python${{vars.python-version}} -m pytest tests/
