package:
  name: py3.14-pathlib2
  version: 2.3.7
  epoch: 0
  description: Object-oriented filesystem paths
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-scandir
      - py${{vars.python-version}}-six
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: pathlib2
  import: pathlib2
  python-version: 3.14

environment:
  contents:
    packages:
      - py${{vars.python-version}}-pip

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5b4b06be8c096b1070c812253f9072ad1430589a
      repository: https://github.com/jazzband/pathlib2
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: jazzband/pathlib2
    strip-suffix: -post1
    use-tag: true
