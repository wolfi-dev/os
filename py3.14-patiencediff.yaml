package:
  name: py3.14-patiencediff
  version: "0.2.19"
  epoch: 0
  description: Python implementation of the patiencediff algorithm
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: patiencediff
  import: patiencediff
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-setuptools-rust

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/breezy-team/patiencediff
      tag: v${{package.version}}
      expected-commit: fe78b8e79c4ca488011e315ccf208bb2dfb1688f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: breezy-team/patiencediff
    use-tag: true
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
