package:
  name: py3.14-patiencediff
  version: "1.0.2"
  epoch: 3 # restore -bin subpackage dropped in the split
  description: Python implementation of the patiencediff algorithm
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: patiencediff
  import: patiencediff
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-setuptools-rust
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/breezy-team/patiencediff
      tag: v${{package.version}}
      expected-commit: b006d3fe9f2f867437589c085c3ca85186295776

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: patiencediff
        - runs: |
            printf 'a\nb\nb\nc\n' > old.txt
            printf 'a\nc\nb\n' > new.txt
            patiencediff old.txt new.txt > out.diff || [ $? -eq 1 ]
            grep -F '+++' out.diff

update:
  enabled: true
  github:
    identifier: breezy-team/patiencediff
    use-tag: true
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
