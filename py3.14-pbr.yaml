# Generated from https://pypi.org/project/pbr/
package:
  name: py3.14-pbr
  version: "7.1.3"
  epoch: 0
  description: Python Build Reasonableness
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-setuptools
  resources:
    cpu: "4"
    memory: 6Gi

vars:
  pypi-package: pbr
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openstack/pbr
      tag: ${{package.version}}
      expected-commit: 34cd3b86d793b24edc67d97396f953975fc3c842

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - .*-eol
    - .*b\d+.*
  github:
    identifier: openstack/pbr
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
