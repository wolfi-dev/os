package:
  name: py3.14-pbs_installer
  version: "2026.10.03"
  epoch: 0
  description: Installer for Python Build Standalone
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-httpx
    provides:
      - pbs_installer=${{package.full-version}}
      - pbs-install=${{package.full-version}}
  resources:
    memory: 2Gi

vars:
  pypi-package: pbs_installer
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/frostming/pbs-installer
      tag: ${{package.version}}
      expected-commit: 79b5a6e4ab70a3ad561fa7ca8a8432f9a78668df

  - runs: pip${{vars.python-version}} install pdm-backend

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: frostming/pbs-installer

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
