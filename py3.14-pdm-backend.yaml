package:
  name: py3.14-pdm-backend
  version: "2.5.0"
  epoch: 0
  description: The build backend used by PDM that supports latest packaging standards.
  copyright:
    - license: MIT

vars:
  pypi-package: pdm-backend
  import: pdm.backend
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8c6653726f71afdb2059b44dc9c7706693e95be6
      repository: https://github.com/pdm-project/pdm-backend
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - "[a-z][0-9]*$"
  github:
    identifier: pdm-project/pdm-backend
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
