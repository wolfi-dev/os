package:
  name: py3.14-pecan
  version: "1.8.0"
  epoch: 0
  description: "A WSGI object-dispatching web framework, designed to be lean and fast with few dependencies."
  copyright:
    - license: BSD-3-Clause AND MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-mako
      - py${{vars.python-version}}-webob

vars:
  pypi-package: pecan
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-gunicorn # upstream-tests: test dependency
      - py${{vars.python-version}}-jinja2 # upstream-tests: test dependency
      - py${{vars.python-version}}-mako # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-sqlalchemy # upstream-tests: test dependency
      - py${{vars.python-version}}-virtualenv # upstream-tests: test dependency
      - py${{vars.python-version}}-waitress # upstream-tests: test dependency
      - py${{vars.python-version}}-webob # upstream-tests: runtime dependency
      - py${{vars.python-version}}-webtest # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pecan/pecan
      tag: ${{package.version}}
      expected-commit: 5cbd61b98f679fafe04c798b1817922c2592c061

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
        - py${{vars.python-version}}-setuptools
    pipeline:
      - uses: split/bin
    test:
      environment:
        contents:
          packages:
            - curl
            - py${{vars.python-version}}-pip
      pipeline:
        - runs: |
            rm -rf test_project
            pecan create test_project
            cd test_project
            python${{vars.python-version}} -m pip install .
            pecan serve config.py &
            curl --silent --retry 3 --retry-delay 5 --retry-connrefused http://localhost:8080/ | grep -F "Welcome to Pecan!" || {
              echo "pecan did not start correctly on Python ${{vars.python-version}}"
              exit 1
            }
            pkill pecan

update:
  enabled: true
  manual: false
  github:
    identifier: pecan/pecan

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
