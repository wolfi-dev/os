package:
  name: py3.14-peewee
  version: "4.5.3"
  epoch: 0
  description: a little orm
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: peewee
  import: peewee
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-gpep517

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/coleifer/peewee
      tag: ${{package.version}}
      expected-commit: e245a01b1f57005e7ae315736da8e6a70e65afba

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: coleifer/peewee

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
