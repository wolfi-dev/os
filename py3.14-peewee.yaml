package:
  name: py3.14-peewee
  version: "4.5.3"
  epoch: 3 # restore -bin subpackage dropped in the split
  description: a little orm
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: peewee
  import: peewee
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-gpep517
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/coleifer/peewee
      tag: ${{package.version}}
      expected-commit: e245a01b1f57005e7ae315736da8e6a70e65afba

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: pwiz

update:
  enabled: true
  github:
    identifier: coleifer/peewee

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
