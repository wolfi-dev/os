package:
  name: py3.14-pefile
  version: "2024.8.26"
  epoch: 0
  description: Python module to read and work with PE (Portable Executable) files
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

vars:
  pypi-package: pefile
  import: pefile
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/erocarrera/pefile
      tag: v${{package.version}}
      expected-commit: 4b3b1e2e568a88d4f1897d694d684f23d9e270c4

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - runs: |
      docdir="/usr/share/doc/${{package.name}}"
      mkdir -p "$docdir"
      cp -R docs "$docdir"/ || true
      install -m 644 -D LICENSE /usr/share/licenses/${{package.name}}/LICENSE

  - uses: strip

update:
  enabled: true
  github:
    identifier: erocarrera/pefile
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
