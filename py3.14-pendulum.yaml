package:
  name: py3.14-pendulum
  version: "3.3.0"
  epoch: 0
  description: Python datetimes made easy
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-dateutil
      - py${{vars.python-version}}-tzdata
  resources:
    cpu: "2"
    memory: 9Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: pendulum
  import: pendulum
  rust-version: "1.100"
  python-version: "3.14"
  glibc-version: "2.44"

environment:
  contents:
    packages:
      - glibc-${{vars.glibc-version}}-dev
      - poetry
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-maturin
      - py${{vars.python-version}}-pip
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sdispater/pendulum
      tag: ${{package.version}}
      expected-commit: e06dacedc4cdea90fa1286b3965d180ab94cf251

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: sdispater/pendulum
    use-tag: true
  ignore-regex-patterns:
    - .*a.* # ignore tags like 3.0.0a1
    - .*b.* # ignore tags like 3.0.0b1

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - runs: |
        # test verifies that timezone data is present.
        python${{vars.python-version}} -c '
        from pendulum import datetime
        tor = datetime(2012, 1, 1, tz="America/Toronto")
        van = datetime(2012, 1, 1, tz="America/Vancouver")
        assert 3 == van.diff(tor).in_hours()
        print("PASS: time zones check out")
        '
