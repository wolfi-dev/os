package:
  name: py3.14-pgcli
  version: "4.7.1"
  epoch: 0
  description: CLI for Postgres Database. With auto-completion and syntax highlighting.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-cli-helpers
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-configobj
      - py${{vars.python-version}}-pendulum
      - py${{vars.python-version}}-pgspecial
      - py${{vars.python-version}}-prompt-toolkit
      - py${{vars.python-version}}-psycopg
      - py${{vars.python-version}}-pygments
      - py${{vars.python-version}}-setproctitle
      - py${{vars.python-version}}-sqlparse
      - py${{vars.python-version}}-typing-extensions
      - py${{vars.python-version}}-tzlocal
  resources:
    cpu: "2"
    memory: 2Gi

vars:
  pypi-package: pgcli
  import: pgcli
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-setuptools-scm
      - python-${{vars.python-version}}-base-dev
      - wolfi-base
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dbcli/pgcli
      tag: v${{package.version}}
      expected-commit: 101e523eb2987ada87231c4533f0ab701c4c3124

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: pgcli
        - uses: test/tw/help-check
          with:
            bins: pgcli

update:
  enabled: true
  github:
    identifier: dbcli/pgcli
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - uses: test/tw/contains-files
      with:
        dir: "/usr/lib/python${{vars.python-version}}/site-packages/pgcli/packages/parseutils/__pycache__/"
        name: "*.pyc"
