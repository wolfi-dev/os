package:
  name: py3.14-pgspecial
  version: "2.3.0"
  epoch: 0
  description: Meta-commands handler for Postgres Database.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-psycopg
      - py${{vars.python-version}}-sqlparse
  resources:
    cpu: "3"
    memory: 8Gi

vars:
  glibc-version: "2.44"
  pypi-package: pgspecial
  import: pgspecial
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-click # upstream-tests: runtime dependency
      - py${{vars.python-version}}-configobj # upstream-tests: test dependency
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-psycopg # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-sqlparse # upstream-tests: runtime dependency
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dbcli/pgspecial
      tag: v${{package.version}}
      expected-commit: 3460cac48f3e88d220fd9ebac8b4c1125718ed9b

  - name: Fix version (setuptools-scm falls back to 0.0.0 without full VCS history)
    runs: |
      sed -i 's/dynamic = \["version"\]/version = "${{package.version}}"/' pyproject.toml

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: dbcli/pgspecial
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
