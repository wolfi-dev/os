package:
  name: py3.14-pickleshare
  version: 0.7.5
  epoch: 0
  description: Tiny 'shelve'-like database with concurrency support
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-pathlib2
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: pickleshare
  import: pickleshare
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f7950a9a359774c0190abde8da729b1810bdf3f4
      repository: https://github.com/pickleshare/pickleshare
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: pickleshare/pickleshare
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
