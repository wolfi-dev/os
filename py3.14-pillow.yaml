package:
  name: py3.14-pillow
  version: "13.0.0"
  epoch: 0
  description: Python Imaging Library (Fork)
  copyright:
    - license: HPND
  resources:
    cpu: "2"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - freetype-dev
      - fribidi-dev
      - glibc-2.44-dev
      - lcms2-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libwebp-dev
      - libxcb-dev
      - openjpeg-dev
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pybind11
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - python-${{vars.python-version}}-base-dev
      - tiff-dev
      - wolfi-base
      - zlib-dev

vars:
  pypi-package: pillow
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-pillow/Pillow
      expected-commit: 293218ad059d994baf1777d882911bed6a49704a
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: python-pillow/Pillow

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: PIL
