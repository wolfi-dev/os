package:
  name: py3.14-pip-tools
  version: "7.7.0"
  epoch: 1 # restore -bin subpackage dropped in the split
  description: A set of command line tools to help you keep your pip-based packages fresh, even when you've pinned them.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-pip-base

vars:
  pypi-package: pip-tools
  import: piptools
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jazzband/pip-tools
      tag: v${{package.version}}
      expected-commit: 2766612f03c7665cdfe3a76be553c3b029058dfc

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - runs: |
            pip-compile --version
            pip-sync --version
            pip-compile --help
            pip-sync --help

update:
  enabled: true
  github:
    identifier: jazzband/pip-tools
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
