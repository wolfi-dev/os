# Generated from https://pypi.org/project/pipenv/
package:
  name: py3.14-pipenv
  version: "2026.12.0"
  epoch: 0 # restore -bin subpackage dropped in the split
  description: Python Development Workflow for Humans.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-certifi
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-virtualenv
  resources:
    cpu: "3"
    memory: 6Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - wolfi-base

vars:
  pypi-package: pipenv
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/pipenv
      tag: v${{package.version}}
      expected-commit: ccd5b291f818c12e792ca8771626938605e2eb22

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
      prevent-inclusion: docs examples

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: setuptools
      version: "==84.1.0"
      python: python${{vars.python-version}}

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: urllib3
      version: "==2.8.0"
      python: python${{vars.python-version}}

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: idna
      version: "==3.15"
      python: python${{vars.python-version}}

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: msgpack
      version: "==1.2.4"
      python: python${{vars.python-version}}

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: certifi
      version: "==2026.10.23"
      python: python${{vars.python-version}}

  - runs: |
      # py/pip-vendor-bump does not apply the vendoring import rewrites; point certifi back at its vendored module name
      core="${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor/certifi/core.py"
      sed -i 's/"certifi"/"pipenv.patched.pip._vendor.certifi"/g' "$core"
      grep -q '"pipenv.patched.pip._vendor.certifi"' "$core"
      if grep -q '"certifi"' "$core"; then exit 1; fi

  - runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - python-${{vars.python-version}}
            - git
            - py${{vars.python-version}}-pip
      pipeline:
        - runs: |
            # Basic version checks
            pipenv --version
            pipenv --version | grep -F "pipenv, version"

            # Verify pipenv-resolver is functional
            pipenv-resolver --help | grep -F "resolver"
        - runs: |
            # Create a test project directory
            TEST_DIR=$(mktemp -d)
            cd "$TEST_DIR"

            # Initialize a new pipenv project with this Python version
            pipenv --python python${{vars.python-version}}

            # Verify Pipfile was created
            test -f Pipfile
            cat Pipfile | grep -F "[packages]"
            cat Pipfile | grep -F "[dev-packages]"

            # Verify environment path commands return valid paths
            pipenv --where | grep -F "$TEST_DIR"
            test -d "$(pipenv --venv)"
            test -x "$(pipenv --py)"

            # Install a simple package
            pipenv install six

            # Verify Pipfile.lock was created
            test -f Pipfile.lock
            cat Pipfile.lock | grep -F '"six"'

            # Verify the package appears in Pipfile
            cat Pipfile | grep -F "six"

            # Verify lock file integrity passes with valid lock
            pipenv verify

            # Corrupt the lock file hash and verify it fails
            cp Pipfile.lock Pipfile.lock.bak
            sed -i 's/"sha256": "/"sha256": "corrupted/' Pipfile.lock
            if pipenv verify; then
              echo "pipenv verify accepted a Pipfile.lock whose _meta hash does not match the Pipfile" >&2
              exit 1
            fi
            mv Pipfile.lock.bak Pipfile.lock

            # Run a command inside the virtual environment
            pipenv run python -c "import six; print('six version:', six.__version__)"

            # Test the graph command
            pipenv graph | grep -F "six"

            # Test lock command with verification
            pipenv lock
            test -f Pipfile.lock

            # Test sync by deleting venv and recreating from lock file
            rm -rf "$(pipenv --venv)"

            pipenv sync
            # Verify package is importable after sync recreated venv
            pipenv run python -c "import six"

            # Test requirements export
            pipenv requirements > requirements.txt
            cat requirements.txt | grep -F "six"

            # Test dev dependencies
            pipenv install --dev pytest

            # Verify dev dependency in Pipfile
            cat Pipfile | grep -F "pytest"

            # Verify dev dependency can be run
            pipenv run pytest --version

            # Test uninstall
            pipenv uninstall six

            # Verify six is removed from Pipfile (should not match)
            if grep -F 'six = ' Pipfile; then
              echo "six is still in the Pipfile after pipenv uninstall" >&2
              exit 1
            fi

            # Verify six is no longer importable - expect ModuleNotFoundError
            ! pipenv run python -c "import six"

update:
  enabled: true
  ignore-regex-patterns:
    - .*\.dev.*
  github:
    identifier: pypa/pipenv
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - runs: |
        python${{vars.python-version}} -c 'from pipenv.patched.pip._vendor import certifi; p = certifi.where(); print(p); assert "/pipenv/patched/pip/_vendor/certifi/" in p, p'
