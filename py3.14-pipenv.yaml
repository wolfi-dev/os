# Generated from https://pypi.org/project/pipenv/
package:
  name: py3.14-pipenv
  version: "2026.10.4"
  epoch: 1 # CVE-2026-111943
  description: Python Development Workflow for Humans.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-certifi
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-virtualenv
  resources:
    cpu: "3"
    memory: 6Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - wolfi-base

vars:
  pypi-package: pipenv
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/pipenv
      tag: v${{package.version}}
      expected-commit: cb92306cb68992f54c2c883778159509375b917b

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
      prevent-inclusion: docs examples

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: setuptools
      version: "==84.1.0"
      python: python${{vars.python-version}}

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: urllib3
      version: "==2.8.0"
      python: python${{vars.python-version}}

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: idna
      version: "==3.15"
      python: python${{vars.python-version}}

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: msgpack
      version: "==1.2.1"
      python: python${{vars.python-version}}

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: certifi
      version: "==2026.10.23"
      python: python${{vars.python-version}}

  - runs: |
      # py/pip-vendor-bump does not apply the vendoring import rewrites; point certifi back at its vendored module name
      core="${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor/certifi/core.py"
      sed -i 's/"certifi"/"pipenv.patched.pip._vendor.certifi"/g' "$core"
      grep -q '"pipenv.patched.pip._vendor.certifi"' "$core"
      if grep -q '"certifi"' "$core"; then exit 1; fi

  - runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - .*\.dev.*
  github:
    identifier: pypa/pipenv
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - runs: |
        python${{vars.python-version}} -c 'from pipenv.patched.pip._vendor import certifi; p = certifi.where(); print(p); assert "/pipenv/patched/pip/_vendor/certifi/" in p, p'
