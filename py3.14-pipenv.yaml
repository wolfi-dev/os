# Generated from https://pypi.org/project/pipenv/
package:
  name: py3.14-pipenv
  version: "2026.8.0"
  epoch: 0
  description: Python Development Workflow for Humans.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-certifi
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-virtualenv
  resources:
    cpu: "3"
    memory: 6Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - wolfi-base

vars:
  pypi-package: pipenv
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/pipenv
      tag: v${{package.version}}
      expected-commit: 2a37cdbe8d0124974c8acd4153fcf760d67f7da4

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
      prevent-inclusion: docs examples

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: setuptools
      version: "==83.0.0"
      python: python${{vars.python-version}}

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: urllib3
      version: "==2.8.0"
      python: python${{vars.python-version}}

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: idna
      version: "==3.15"
      python: python${{vars.python-version}}

  - uses: py/pip-vendor-bump
    with:
      vendor-path: ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/pipenv/patched/pip/_vendor
      package: msgpack
      version: "==1.2.1"
      python: python${{vars.python-version}}

  - runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - .*\.dev.*
  github:
    identifier: pypa/pipenv
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
