package:
  name: py3.14-pkginfo
  version: "2.0"
  epoch: 0
  description: Query metadata from sdists / bdists / installed packages.
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: pkginfo
  import: pkginfo
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  # blocked-no-github: pkginfo is distributed via PyPI only
  - uses: fetch
    with:
      expected-sha256: f7b4f267881785582c923631a0fa7e275b0d390a5cbab54aa4ec0ecc7eddb375
      uri: https://files.pythonhosted.org/packages/source/p/pkginfo/pkginfo-${{package.version}}.tar.gz

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: pkginfo

update:
  enabled: true
  release-monitor:
    identifier: 11017

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
