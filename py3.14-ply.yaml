package:
  name: py3.14-ply
  version: 3.11_git20180215
  epoch: 0
  description: Python Lex & Yacc
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: ply
  python-version: "3.14"

var-transforms:
  - from: ${{package.version}}
    match: _git(.*)
    replace: ''
    to: mangled-package-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dabeaz/ply
      tag: ${{vars.mangled-package-version}}
      expected-commit: 0f398b72618c1564d71f7dc0558e6722b241875a

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: false
  exclude-reason: some sort of a deprecated project

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
