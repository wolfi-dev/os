# Generated from https://pypi.org/project/poetry/
package:
  name: py3.14-poetry
  version: "2.5.1"
  epoch: 0
  description: Python dependency management and packaging made easy.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-cachecontrol
      - py${{vars.python-version}}-cleo
      - py${{vars.python-version}}-crashtest
      - py${{vars.python-version}}-dulwich
      - py${{vars.python-version}}-fastjsonschema
      - py${{vars.python-version}}-findpython
      - py${{vars.python-version}}-importlib-metadata
      - py${{vars.python-version}}-installer
      - py${{vars.python-version}}-jsonschema
      - py${{vars.python-version}}-keyring
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pbs_installer
      - py${{vars.python-version}}-pexpect
      - py${{vars.python-version}}-pkginfo
      - py${{vars.python-version}}-platformdirs
      - py${{vars.python-version}}-poetry-core
      - py${{vars.python-version}}-pyproject-hooks
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-requests-toolbelt
      - py${{vars.python-version}}-shellingham
      - py${{vars.python-version}}-tomlkit
      - py${{vars.python-version}}-trove-classifiers
      - py${{vars.python-version}}-virtualenv
      - py${{vars.python-version}}-xattr
  resources:
    cpu: "2"
    memory: 2Gi

vars:
  pypi-package: poetry
  import: poetry
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-poetry-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-poetry/poetry
      tag: ${{package.version}}
      expected-commit: 94b6e35b9091991887aa54feeb3771a86d3bd692

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: poetry
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: poetry

update:
  enabled: true
  github:
    identifier: python-poetry/poetry

# pip-check omitted: findpython 0.9.0 conflicts with poetry's <0.9.0 constraint
# (same as py3-poetry which also skips pip-check)
test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
