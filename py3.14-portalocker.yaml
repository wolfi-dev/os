package:
  name: py3.14-portalocker
  version: "4.3.0"
  epoch: 0
  description: An easy library for Python file locking. It works on Windows, Linux, BSD and Unix systems and can even perform distributed locking. Naturally it also supports the with statement
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: portalocker
  import: portalocker
  python-version: 3.14

environment:
  contents:
    packages:
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-uv-build-bin

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wolph/portalocker
      expected-commit: c86f80c2505de8e44fb9d2493eb94ab96201fef6
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: wolph/portalocker
    strip-prefix: v
