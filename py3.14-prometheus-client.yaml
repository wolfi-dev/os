# Generated from https://pypi.org/project/prometheus-client/
package:
  name: py3.14-prometheus-client
  version: "0.26.0"
  epoch: 0
  description: Python client for the Prometheus monitoring system.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
  resources:
    cpu: "2"
    memory: 6Gi

vars:
  pypi-package: prometheus-client
  module_name: prometheus_client
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9b6b971f903e7a08f88da5a95048b7a2a28f55a5
      repository: https://github.com/prometheus/client_python
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: prometheus/client_python
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.module_name}}
