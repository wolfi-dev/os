package:
  name: py3.14-prompt-toolkit
  version: "3.0.53"
  epoch: 0
  description: Library for building powerful interactive command lines in Python
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-wcwidth
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: prompt-toolkit
  import: prompt_toolkit
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prompt-toolkit/python-prompt-toolkit
      tag: ${{package.version}}
      expected-commit: 583b3412c792a5cc9f01adde603679f3824a88f3

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: prompt-toolkit/python-prompt-toolkit

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
