package:
  name: py3.14-propcache
  version: "0.5.4"
  epoch: 1 # upstream-tests/pytest
  description: Fast property caching
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-idna
      - py${{vars.python-version}}-multidict

vars:
  pypi-package: propcache
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-expandvars
      - py${{vars.python-version}}-pip
      - py3.14-idna # upstream-tests: runtime dependency
      - py3.14-multidict # upstream-tests: runtime dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: cc9882f95c6aadbfe7b88898e3f0230e4a38341a
      repository: https://github.com/aio-libs/propcache
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: aio-libs/propcache
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
