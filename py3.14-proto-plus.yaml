package:
  name: py3.14-proto-plus
  version: "1.29.0"
  epoch: 0
  description: Beautiful, Pythonic protocol buffers.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-protobuf
  resources:
    cpu: "4"
    memory: 4Gi

vars:
  pypi-package: proto-plus
  import: proto
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d6bed5a3d4a9348f6aebb75b7ceb8d599a133c0a
      repository: https://github.com/googleapis/google-cloud-python
      tag: proto-plus-v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
      prevent-inclusion: docs testing
    working-directory: packages/proto-plus

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: googleapis/google-cloud-python
    strip-prefix: proto-plus-v
    use-tag: true
    tag-filter: proto-plus

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
