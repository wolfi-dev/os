package:
  name: py3.14-psutil
  version: "7.2.2"
  epoch: 0
  description: Cross-platform lib for process and system monitoring in Python.
  copyright:
    - license: BSD-3-Clause
  resources:
    memory: 4Gi
    cpu: "1"
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: psutil
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/giampaolo/psutil
      expected-commit: 9eea97dd6f1d16ea33f5144c8925f1ce7a0688e1
      tag: release-${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - runs: |
      # Don't ship the test code, as it triggers malware scan failures
      rm -rf ${{targets.destdir}}/usr/lib/python${{vars.python-version}}/site-packages/psutil/tests

  - uses: strip

update:
  enabled: true
  github:
    identifier: giampaolo/psutil
    strip-prefix: release-
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        imports: |
          import ${{vars.pypi-package}}
