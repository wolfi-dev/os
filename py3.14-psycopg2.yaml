package:
  name: py3.14-psycopg2
  version: "2.9.12"
  epoch: 0
  description: psycopg2 - Python-PostgreSQL Database Adapter
  copyright:
    - license: LGPL-3.0-or-later
  resources:
    cpu: "2"
    memory: 7Gi

vars:
  pypi-package: psycopg2
  import: psycopg2
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.43-dev
      - postgresql-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/psycopg/psycopg2
      tag: ${{package.version}}
      expected-commit: 3a6d9d6ddc6b53eaa80b712f5fa6b23abbdc38db

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  environment:
    contents:
      packages:
        - glibc-locales
        - postgresql
        - postgresql-client
        - shadow
        - sudo-rs
    environment:
      PGDATA: /tmp/test_db
      PGUSER: wolfi
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import psycopg2
    - name: Test database creation
      runs: |
        useradd $PGUSER
        sudo -u $PGUSER initdb -D $PGDATA
        sudo -u $PGUSER pg_ctl -D $PGDATA -l /tmp/logfile start
        sudo -u $PGUSER createdb testdb
        psql -lqt | cut -d \| -f 1 | grep -qw testdb
    - name: Test psycopg2
      runs: |
        cat <<'EOF' >> /tmp/test.py
        import psycopg2

        def main():
          conn = psycopg2.connect(dbname="testdb", user="wolfi")
          cursor = conn.cursor()

          try:
              # Create Table
              cursor.execute("""
                  CREATE TABLE IF NOT EXISTS example_table (
                      id SERIAL PRIMARY KEY,
                      message TEXT
                  )
              """)

              # Insert value
              cursor.execute("INSERT INTO example_table (message) VALUES (%s)", ("Hello Wolfy!",))
              conn.commit()

              # Select and print
              cursor.execute("SELECT message FROM example_table")
              result = cursor.fetchone()
              message = result[0]
              print("Message retrieved from database:", message)

          except Exception as e:
              print("Error:", e)

          finally:
              cursor.close()
              conn.close()

        if __name__ == "__main__":
          main()
        EOF

        python${{vars.python-version}} /tmp/test.py

update:
  enabled: true
  version-separator: _
  github:
    identifier: psycopg/psycopg2
    use-tag: true
