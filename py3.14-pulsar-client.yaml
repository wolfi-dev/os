package:
  name: py3.14-pulsar-client
  version: "3.13.0"
  epoch: 0
  description: Apache Pulsar Python client library
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libpulsar
      - py${{vars.python-version}}-certifi
  resources:
    cpu: "8"
    memory: 11Gi

vars:
  pypi-package: pulsar-client
  import: pulsar
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - libpulsar-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-pybind11

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/pulsar-client-python
      tag: v${{package.version}}
      expected-commit: dd3066a3a70c669bca948eac5fb1d307981a55d5

  - uses: cmake/configure
    with:
      opts: |
        -DPython3_EXECUTABLE=/usr/bin/python${{vars.python-version}} \
        -DPython3_INCLUDE_DIR=/usr/include/python${{vars.python-version}} \
        -DPYBIND11_INCLUDE_DIRS=/usr/lib/python${{vars.python-version}}/site-packages/pybind11/include

  - uses: cmake/build

  - runs: |
      cp output/lib_pulsar.so .

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: apache/pulsar-client-python
    strip-prefix: v
    strip-suffix: -candidate1

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
