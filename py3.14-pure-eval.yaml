package:
  name: py3.14-pure-eval
  version: "0.2.4"
  epoch: 0
  description: Safely evaluate AST nodes without side effects
  copyright:
    - license: MIT

vars:
  pypi-package: pure-eval
  import: pure_eval
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: cbb525652850e4fd460dcd4b8be4d58c9858f5c4
      repository: https://github.com/alexmojaki/pure_eval
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: alexmojaki/pure_eval
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
