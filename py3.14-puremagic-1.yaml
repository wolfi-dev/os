package:
  name: py3.14-puremagic-1
  version: "1.30"
  epoch: 0
  description: Pure python implementation of identifying files based off their magic numbers
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: puremagic-1
  import: puremagic
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 00c00c4dae446cebd5251923d473438869ce04b6
      repository: https://github.com/cdgriffith/puremagic
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - b\d+$
  git:
    tag-filter-prefix: 1.

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
