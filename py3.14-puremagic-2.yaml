package:
  name: py3.14-puremagic-2
  version: "2.2.0"
  epoch: 0
  description: Pure python implementation of identifying files based off their magic numbers
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: puremagic-2
  import: puremagic
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 57bed56ef669132c0f906e1d064680bf2c4b2205
      repository: https://github.com/cdgriffith/puremagic
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv "${{targets.contextdir}}/usr/bin" ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - b\d+$
  git:
    tag-filter-prefix: 2.

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
