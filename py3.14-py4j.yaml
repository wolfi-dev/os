package:
  name: py3.14-py4j
  version: "0.10.9.9"
  epoch: 0
  description: Enables Python programs to dynamically access arbitrary Java objects
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: py4j
  import: py4j
  python-version: "3.14"

environment:
  environment:
    JAVA_HOME: /usr/lib/jvm/java-11-openjdk
  contents:
    packages:
      - bash
      - gradle
      - openjdk-11
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/py4j/py4j
      expected-commit: c0ef8fef0ed43e66a9f467144caa8a7e8bee6faf
      tag: ${{package.version}}

  - uses: patch
    with:
      # To fix this error `Reason: UndefinedError("'style' is undefined")`
      patches: disable-copyWebJavadocPython.patch

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: py4j/py4j
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
