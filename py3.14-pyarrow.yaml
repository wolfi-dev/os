package:
  name: py3.14-pyarrow
  version: "25.0.1"
  epoch: 0
  description: Python library for Apache Arrow
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # Same stream as the other py3.14 numpy consumers (h5py, ml-dtypes).
      - py${{vars.python-version}}-numpy-2.4

vars:
  pypi-package: pyarrow
  import: pyarrow
  python-version: "3.14"

environment:
  contents:
    packages:
      # Builds only python/ against the shared Arrow C++ libraries from
      # apache-arrow; their CMake configs need no third-party -dev packages.
      - apache-arrow-dev~${{package.version}}
      - build-base
      - busybox
      - cmake
      - glibc-2.44-dev
      - libarrow_acero~${{package.version}}
      - libarrow_compute~${{package.version}}
      - libarrow_dataset~${{package.version}}
      - libarrow_flight~${{package.version}}
      - libparquet~${{package.version}}
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-scikit-build-core
      - py${{vars.python-version}}-setuptools-scm
      - wolfi-base
  environment:
    PYARROW_PARALLEL: "4"
    PYARROW_WITH_PARQUET: "1"
    PYARROW_WITH_ACERO: "1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/arrow
      tag: apache-arrow-${{package.version}}
      expected-commit: beccec0d0c451b7aa3e4530416ac431b3c035c69

  - working-directory: python
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          from pyarrow import acero
          from pyarrow import compute
          from pyarrow import dataset
          from pyarrow import flight
          from pyarrow import parquet
    - uses: test/tw/ldd-check
    - name: Parquet, dataset and compute round trip
      runs: |
        cat > /tmp/pyarrow_smoke.py <<'EOF'
        import numpy as np
        import pyarrow as pa
        import pyarrow.compute as pc
        import pyarrow.dataset as ds
        import pyarrow.parquet as pq

        assert pa.__version__ == "${{package.version}}", pa.__version__
        t = pa.table({"k": ["a", "b", "a"], "v": np.arange(3, dtype=np.int64)})
        pq.write_table(t, "/tmp/t.parquet", compression="zstd")
        r = pq.read_table("/tmp/t.parquet")
        assert r.equals(t)
        assert pc.sum(r["v"]).as_py() == 3
        g = ds.dataset("/tmp/t.parquet").to_table().group_by("k").aggregate([("v", "sum")])
        assert dict(zip(g["k"].to_pylist(), g["v_sum"].to_pylist())) == {"a": 2, "b": 1}
        assert (r["v"].to_numpy() == np.arange(3)).all()
        print("pyarrow", pa.__version__, "ok")
        EOF
        python${{vars.python-version}} /tmp/pyarrow_smoke.py

update:
  enabled: true
  # There are some other things like js-* that break our update block.
  ignore-regex-patterns:
    - 'js-'
    - '.*\.dev$'
  git:
    strip-prefix: apache-arrow-
    tag-filter-prefix: apache-arrow-
