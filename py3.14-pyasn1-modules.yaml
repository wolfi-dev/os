package:
  name: py3.14-pyasn1-modules
  version: "0.4.2"
  epoch: 0
  description: A collection of ASN.1-based protocols modules
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-pyasn1
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  pypi-package: pyasn1-modules
  import: pyasn1_modules
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pyasn1/pyasn1-modules
      tag: v${{package.version}}
      expected-commit: 7154ca47caea6e012ef58d6a9975c719f2b6213b

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pyasn1/pyasn1-modules
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
