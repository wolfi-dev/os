package:
  name: py3.14-pyasn1
  version: "0.6.5"
  epoch: 0
  description: Pure-Python implementation of ASN.1 types and DER/BER/CER codecs (X.208)
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: pyasn1
  import: pyasn1
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5d1673657b729fb580467e2cf4875856bbca5e59
      repository: https://github.com/pyasn1/pyasn1
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: pyasn1/pyasn1
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
