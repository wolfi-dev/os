package:
  name: py3.14-pybase64
  version: "1.5.2"
  epoch: 1 # build the C extension (python headers)
  description: Fast Base64 encoding/decoding in Python
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: pybase64
  import: pybase64
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - py3.14-iniconfig # upstream-tests: test dependency
      - py3.14-packaging # upstream-tests: test dependency
      - py3.14-pluggy # upstream-tests: test dependency
      - py3.14-pygments # upstream-tests: test dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-typing-extensions # upstream-tests: test dependency
      - python-${{vars.python-version}}-base
      - python-${{vars.python-version}}-base-dev # Python headers, so the C extension builds

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mayeut/pybase64
      tag: v${{package.version}}
      expected-commit: 3490697bf9cbc49046e6b8433f8ef61220b641e3
      recurse-submodules: true

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
    - name: Compiled extension shipped and loads
      runs: |
        python${{vars.python-version}} -c "import importlib.machinery as m, pybase64._pybase64 as e; assert e.__file__.endswith(tuple(m.EXTENSION_SUFFIXES)), e.__file__"
    - name: Test basic functionality
      runs: |
        python${{vars.python-version}} <<-EOF
        import pybase64

        # Test basic encoding
        test_data = b'Hello, World!'
        encoded = pybase64.b64encode(test_data)
        decoded = pybase64.b64decode(encoded)

        if decoded != test_data:
            raise Exception(f"Encoding/decoding failed: expected {test_data}, got {decoded}")

        # Test URL-safe encoding
        encoded_url = pybase64.urlsafe_b64encode(test_data)
        decoded_url = pybase64.urlsafe_b64decode(encoded_url)

        if decoded_url != test_data:
            raise Exception(f"URL-safe encoding/decoding failed: expected {test_data}, got {decoded_url}")

        print("All tests passed!")
        EOF
