package:
  name: py3.14-pybase64
  version: "1.5.1"
  epoch: 0
  description: Fast Base64 encoding/decoding in Python
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: pybase64
  import: pybase64
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mayeut/pybase64
      tag: v${{package.version}}
      expected-commit: 875910c501df69b0181b02c5a7e259e61604d2d5
      recurse-submodules: true

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
    - name: Test basic functionality
      runs: |
        python${{vars.python-version}} <<-EOF
        import pybase64

        # Test basic encoding
        test_data = b'Hello, World!'
        encoded = pybase64.b64encode(test_data)
        decoded = pybase64.b64decode(encoded)

        if decoded != test_data:
            raise Exception(f"Encoding/decoding failed: expected {test_data}, got {decoded}")

        # Test URL-safe encoding
        encoded_url = pybase64.urlsafe_b64encode(test_data)
        decoded_url = pybase64.urlsafe_b64decode(encoded_url)

        if decoded_url != test_data:
            raise Exception(f"URL-safe encoding/decoding failed: expected {test_data}, got {decoded_url}")

        print("All tests passed!")
        EOF
