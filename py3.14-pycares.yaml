package:
  name: py3.14-pycares
  version: "5.1.0"
  epoch: 0
  description: Happy Eyeballs for pre-resolved hosts
  copyright:
    - license: PSF-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-cffi
  resources:
    cpu: "5"
    memory: 7Gi

vars:
  pypi-package: pycares
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - c-ares-dev
      - cmake
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cffi
      - py${{vars.python-version}}-pip
  environment:
    PYCARES_USE_SYSTEM_LIB: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/saghul/pycares
      tag: v${{package.version}}
      expected-commit: 75ce8e6cfd025713b6036c45d4e0eb2be7af814f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: saghul/pycares
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
