package:
  name: py3.14-pycosat
  version: 0.6.6
  epoch: 1 # upstream-tests/pytest
  description: Python bindings to picosat (a SAT solver)
  copyright:
    - license: MIT
  resources:
    cpu: "4"
    memory: 5Gi

vars:
  pypi-package: pycosat
  import: pycosat
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/conda/pycosat
      tag: ${{package.version}}
      expected-commit: 38bbc0ed7b21bd3e43dfc4be735557f06f224290

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: conda/pycosat

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
