package:
  name: py3.14-pycrdt-store
  version: 0.1.5
  epoch: 0
  description: "Persistent storage for pycrdt"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-anyio
      - py${{vars.python-version}}-pycrdt
      - py${{vars.python-version}}-sqlite-anyio

vars:
  import: pycrdt.store
  pypi-package: pycrdt-store
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/y-crdt/pycrdt-store
      tag: ${{package.version}}
      expected-commit: c4f5cfb36fc38d4a14fce53679832d05b7c8d208

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: y-crdt/pycrdt-store
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
