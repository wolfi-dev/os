package:
  name: py3.14-pycrdt-websocket
  version: 0.15.5
  epoch: 0
  description: pycrdt-websocket is an async WebSocket connector for pycrdt.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-anyio
      - py${{vars.python-version}}-pycrdt
      - py${{vars.python-version}}-sqlite-anyio

vars:
  import: pycrdt_websocket
  pypi-package: pycrdt-websocket
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7daeef9d0135f712dda5c7af742cc47610b95eae
      repository: https://github.com/y-crdt/pycrdt-websocket
      tag: v${{package.version}}

  # Upstream pins pycrdt <0.13.0, but Wolfi ships pycrdt 0.14.x, which
  # the upstream test suite passes against. Relax the upper bound so
  # pip check succeeds.
  - uses: sed
    with:
      path: pyproject.toml
      pattern: |-
        "pycrdt >=0\.12\.13,<0\.13\.0"
      replacement: |-
        "pycrdt >=0.12.13,<0.15.0"

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: y-crdt/pycrdt-websocket
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Test importing key components
      uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          from ${{vars.import}} import ASGIServer, WebsocketServer
          from ${{vars.import}} import WebsocketProvider
          from ${{vars.import}}.websocket import HttpxWebsocket
