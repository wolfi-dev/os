package:
  name: py3.14-pycrdt
  version: "0.14.13"
  epoch: 0
  description: CRDTs based on Yrs.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-anyio
      - py${{vars.python-version}}-importlib-metadata
  resources:
    cpu: "2"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: pycrdt
  rust-version: "1.100"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-maturin
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8d653f61ab90dc49b216768f1f880761cfcb5db7
      repository: https://github.com/jupyter-server/pycrdt
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: jupyter-server/pycrdt
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - name: Test basic functionality
      runs: python${{vars.python-version}} test-pycrdt.py
