package:
  name: py3.14-pycryptodome
  version: "3.23.0"
  epoch: 0
  description: Cryptographic library for Python
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: pycryptodome
  import: Crypto
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Legrandin/pycryptodome
      tag: v${{package.version}}
      expected-commit: cde63f8f9b64f1c8cd86249128cfd5986c2c43af

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: Legrandin/pycryptodome
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
