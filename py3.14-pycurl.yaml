package:
  name: py3.14-pycurl
  version: "7.48.0"
  epoch: 0
  description: PycURL -- A Python Interface To The cURL library
  copyright:
    - license: LGPL-2.1-or-later AND MIT
  resources:
    cpu: "2"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: pycurl
  import: pycurl
  python-version: "3.14"

environment:
  contents:
    packages:
      - curl-dev
      - glibc-2.44-dev
      - openssl-hardened-dev
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d05452c31fde223ae8a70a6201ba5b7e3755e988
      repository: https://github.com/pycurl/pycurl
      tag: REL_${{vars.mangled-package-version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  version-separator: _
  github:
    identifier: pycurl/pycurl
    strip-prefix: REL_
    tag-filter: REL_
    use-tag: true

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: _
    to: mangled-package-version

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
