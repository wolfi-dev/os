# Generated from https://pypi.org/project/pydantic-core/
package:
  name: py3.14-pydantic-core
  version: "2.49.0"
  epoch: 0
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "2"
    memory: 10Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-installer
      - py${{vars.python-version}}-maturin
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-typing-extensions
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - rust-${{vars.rust-version}}
      - wolfi-base

vars:
  pypi-package: pydantic-core
  module-name: pydantic_core
  rust-version: "1.99"
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6312eb1578d89242b63a27f37ff5ba54bf016085
      repository: https://github.com/pydantic/pydantic
      tag: core-v${{package.version}}

  - working-directory: pydantic-core
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  # py3-pydantic always has a strict dependency on a specific py3-pydantic-core
  # version, so ensure that we build packages for every -core release
  require-sequential: true
  git:
    strip-prefix: core-v
    tag-filter-prefix: core-v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.module-name}}
