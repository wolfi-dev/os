package:
  name: py3.14-pydantic
  version: "2.14.3"
  epoch: 0
  description: Data validation using Python type hints
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-annotated-types
      - py${{vars.python-version}}-pydantic-core~2.50.4 # Sourced from https://github.com/pydantic/pydantic/blob/v${{package.version}}/pyproject.toml
      - py${{vars.python-version}}-pygments
      - py${{vars.python-version}}-typing-extensions
      - py${{vars.python-version}}-typing-inspection
  resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: pydantic
  import: pydantic
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatchling
  environment:
    # This is needed to work around the error "ValueError: ZIP does not support timestamps before 1980"
    SOURCE_DATE_EPOCH: 315532800

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ea492e04654ab7f7a1f9287ea912419452ead4dd
      repository: https://github.com/pydantic/pydantic
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  # There are prereleases which has b in the tags.
  ignore-regex-patterns:
    - b
  github:
    identifier: pydantic/pydantic
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-jsonschema
        - py${{vars.python-version}}-pytest-bin
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - uses: git-checkout
      with:
        expected-commit: ea492e04654ab7f7a1f9287ea912419452ead4dd
        repository: https://github.com/pydantic/pydantic
        tag: v${{package.version}}
    - runs: |
        # test_version checks the correct pydantic-core version is installed;
        # touch pytest.ini to avoid project-wide settings requiring extra plugins
        cd tests
        touch pytest.ini
        pytest test_version.py || (echo "Expected version is $(grep -F '__pydantic_core_version__ ==' ../pydantic/version.py | sed 's/.*== //')"; exit 1)
    - runs: |
        # Copy functional tests to /tmp so Python imports the installed
        # package rather than the source checkout
        cp test_*.py /tmp/
        cd /tmp

        python${{vars.python-version}} test_basic.py
        python${{vars.python-version}} test_advanced.py
