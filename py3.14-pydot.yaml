package:
  name: py3.14-pydot
  version: "4.0.1"
  epoch: 0
  description: Python interface to Graphviz's Dot
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-pyparsing

vars:
  pypi-package: pydot
  import: pydot
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-pyparsing

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pydot/pydot
      expected-commit: b60b6687565423540839f5d440ba90d2f8271303
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pydot/pydot
    use-tag: true
    tag-filter: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
