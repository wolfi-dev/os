package:
  name: py3.14-pyelftools
  version: "0.33"
  epoch: 0
  description: Python Library for analyzing ELF files and DWARF debugging information
  copyright:
    - license: LicenseRef-pyelftools-public-domain
      license-path: LICENSE
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: pyelftools
  python-version: "3.14"
  glibc-version: "2.44"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/eliben/pyelftools
      tag: v${{package.version}}
      expected-commit: 52ce435186022bd6b32012a998931fe86c985ec8

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{vars.python-version}}
            imports: |
              import elftools
        - uses: test/tw/ver-check
          with:
            bins: readelf.py
            version: ${{package.version}}
        - name: readelf.py parses an ELF header
          runs: |
            out=$(readelf.py -h "$(readlink -f "$(command -v python${{vars.python-version}})")")
            echo "$out"
            echo "$out" | grep -q "ELF Header:"
            echo "$out" | grep -q "Class:.*ELF64"

update:
  enabled: true
  github:
    identifier: eliben/pyelftools
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import elftools
