package:
  name: py3.14-pyfarmhash
  version: 0.4.0
  epoch: 0
  description: Google FarmHash Bindings for Python
  copyright:
    - license: MIT
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  pypi-package: pyfarmhash
  import: farmhash
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: fetch # blocked-no-github: PyPI source, no known git upstream
    with:
      expected-sha256: f350327057de3c8912b227dc22794e0dd11c767fc9db6070ae84c49a96934865
      uri: https://files.pythonhosted.org/packages/source/p/pyfarmhash/pyfarmhash-${{package.version}}.tar.gz

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: false
  manual: true
  exclude-reason: no releases, tags, and release-monitor id

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Check hash values
      runs: |
        cat > farmhash_check.py <<'EOF'
        import farmhash as f

        # fingerprint64 is the same on every platform; reference values
        # computed with py3.13-pyfarmhash 0.4.0.
        fingerprints = {
            "hello world": 6381520714923946011,
            "": 11160318154034397263,
            "h\u00e9llo\U0001F600": 15205068977355302112,
            "a\x00b": 7026922943720236280,
            "a": 12917804110809363939,
            "x" * (1 << 20): 749607472275759852,
        }
        for s, want in fingerprints.items():
            got = f.fingerprint64(s)
            assert got == want, (s[:12], got, want)

        # hash32/hash64 pick an implementation from CPU features at
        # compile time, so they differ between x86_64 and aarch64. Check
        # their properties instead of fixed values.
        for s in fingerprints:
            for fn, bits in ((f.hash64, 64), (f.hash32, 32)):
                v = fn(s)
                assert isinstance(v, int) and 0 <= v < 2**bits, (fn, s[:12], v)
                assert v == fn(s), (fn, s[:12])
        assert f.hash64("abc") == f.hash64(b"abc")
        assert f.hash32("abc") == f.hash32(b"abc")
        assert f.hash64("a\x00b") != f.hash64("a")
        assert f.hash32("a\x00b") != f.hash32("a")
        assert f.hash64withseed("hello world", 1) != f.hash64withseed("hello world", 2)
        assert f.hash32withseed("hello world", 1) != f.hash32withseed("hello world", 2)
        assert 0 <= f.hash64withseed("hello world", 2**64 - 1) < 2**64
        print("farmhash values OK")
        EOF
        python${{vars.python-version}} farmhash_check.py
