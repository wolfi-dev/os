# Generated from https://pypi.org/project/PyGithub/
package:
  name: py3.14-pygithub
  version: "2.10.0"
  epoch: 0
  description: Use the full Github API v3
  copyright:
    - license: LGPL-3.0-or-later OR GPL-3.0-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-cffi
      # upstream requires pyjwt[crypto]: GitHub App auth signs RS256 JWTs
      - py${{vars.python-version}}-cryptography
      - py${{vars.python-version}}-pyjwt
      - py${{vars.python-version}}-pynacl
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-typing-extensions
      - py${{vars.python-version}}-urllib3
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  module_name: github
  pypi-package: pygithub
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5cdf6ab395c52efb652d0bc1f28fdf2e452b1b41
      repository: https://github.com/pygithub/pygithub
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  # There are some versions with post in it, ignore them
  ignore-regex-patterns:
    - post
  enabled: true
  github:
    identifier: pygithub/pygithub
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          from ${{vars.module_name}} import Github
    - name: GitHub App auth signs an RS256 JWT (needs cryptography)
      runs: |
        python${{vars.python-version}} - <<'EOF'
        from cryptography.hazmat.primitives import serialization
        from cryptography.hazmat.primitives.asymmetric import rsa
        from github import Auth
        import jwt

        key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
        pem = key.private_bytes(serialization.Encoding.PEM,
                                serialization.PrivateFormat.PKCS8,
                                serialization.NoEncryption()).decode()
        token = Auth.AppAuth(123456, pem).create_jwt()
        claims = jwt.decode(token, key.public_key(), algorithms=["RS256"])
        assert claims["iss"] == "123456", claims
        print("RS256 app JWT ok")
        EOF
