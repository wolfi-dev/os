package:
  name: py3.14-pyjwt
  version: "2.14.0"
  epoch: 0
  description: JSON Web Token implementation in Python
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: pyjwt
  import: jwt
  python-version: 3.14

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-setuptools-scm
      - py${{vars.python-version}}-typing-extensions

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jpadilla/pyjwt
      tag: ${{package.version}}
      expected-commit: c6fe464b356ff4b1ebc9ba62172d331a40aa27df

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  github:
    identifier: jpadilla/pyjwt

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.import}}
