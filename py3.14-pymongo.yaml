package:
  name: py3.14-pymongo
  version: "4.20.0"
  epoch: 0
  description: Python driver for MongoDB <http://www.mongodb.org>
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-dnspython
  resources:
    cpu: "3"
    memory: 6Gi

vars:
  pypi-package: pymongo
  import: pymongo
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-hatch-requirements-txt
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 56e6b447361fee613c0ac35c52bc3c38518aa96a
      repository: https://github.com/mongodb/mongo-python-driver
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: mongodb/mongo-python-driver

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          import bson, gridfs
          import bson, pymongo; assert bson.has_c() and pymongo.has_c()
