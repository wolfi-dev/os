# Generated from https://pypi.org/project/PyNaCl/
package:
  name: py3.14-pynacl
  version: "1.6.2"
  epoch: 0
  description: Python binding to the Networking and Cryptography (NaCl) library
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libsodium
      - py${{vars.python-version}}-cffi
  resources:
    cpu: "2"
    memory: 6Gi

vars:
  module_name: nacl
  pypi-package: pynacl
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libsodium-dev
      - py${{vars.python-version}}-cffi
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base-dev
      - wolfi-base
  environment:
    SODIUM_INSTALL: system

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ecf41f55a3d8f1e10ce89c61c4b4d67f3f4467cf
      repository: https://github.com/pyca/pynacl
      tag: ${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  github:
    identifier: pyca/pynacl
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        imports: |
          from ${{vars.module_name}}.signing import *
