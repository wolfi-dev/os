package:
  name: py3.14-pyopenssl
  version: "26.4.0"
  epoch: 0
  description: Python wrapper module around the OpenSSL library
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-cryptography
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  pypi-package: pyopenssl
  import: OpenSSL
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 07b1ef7cc2ed71c77ebc113d0c10fc045e40861a
      repository: https://github.com/pyca/pyopenssl
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: pyca/pyopenssl
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
