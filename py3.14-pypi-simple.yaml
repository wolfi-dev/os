package:
  name: py3.14-pypi-simple
  version: "1.8.0"
  epoch: 0
  description: PyPI Simple Repository API client library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-beautifulsoup4
      - py${{vars.python-version}}-mailbits
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pydantic
      - py${{vars.python-version}}-requests

vars:
  module_name: pypi_simple
  pypi-package: pypi-simple
  glibc-version: "2.44"
  python-version: "3.14"

# Only currently needed for Python 3.11 or higher
environment:
  contents:
    packages:
      - py${{vars.python-version}}-beautifulsoup4 # upstream-tests: runtime dependency
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-mailbits # upstream-tests: runtime dependency
      - py${{vars.python-version}}-packaging # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pydantic # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-mock # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-requests # upstream-tests: runtime dependency
      - py${{vars.python-version}}-responses # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jwodder/pypi-simple
      expected-commit: 1fb12674d17794aed92bd318419d42d8c4e75a7c
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
