package:
  name: py3.14-pyproject_api
  version: "1.11.2"
  epoch: 0
  description: API to interact with the python pyproject.toml based projects
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-tomli
  resources:
    cpu: "1"
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: pyproject_api
  import: pyproject_api
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1594fd8f87c1399d48ee8057fa6b801f0c7a17b3
      repository: https://github.com/tox-dev/pyproject-api
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: tox-dev/pyproject-api
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
