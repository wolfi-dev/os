package:
  name: py3.14-pyrfc3339
  version: "2.1.1"
  epoch: 0
  description: Generate and parse RFC 3339 timestamps
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-tz
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: pyrfc3339
  import: pyrfc3339
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-tz # upstream-tests: runtime dependency
      - py${{vars.python-version}}-tzdata # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kurtraschke/pyRFC3339
      expected-commit: cc6ffe260f63c4e37c2789813894516c089e5cb6
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: kurtraschke/pyRFC3339
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
