package:
  name: py3.14-pyrsistent
  version: "0.21.0"
  epoch: 1 # upstream-tests/pytest
  description: Persistent/Functional/Immutable data structures
  copyright:
    - license: MIT
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: pyrsistent
  import: pyrsistent
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-hypothesis # upstream-tests: test dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-typing-extensions # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a6c9c18981168820fd8acaafc783946ce638b7dc
      repository: https://github.com/tobgu/pyrsistent
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - rc
  github:
    use-tag: true
    identifier: tobgu/pyrsistent
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
