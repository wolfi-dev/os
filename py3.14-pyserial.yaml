# Generated from https://pypi.org/project/pyserial/
package:
  name: py3.14-pyserial
  version: "3.5"
  epoch: 0
  description: Python Serial Port Extension
  copyright:
    - license: BSD-3-Clause
  dependencies:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0e7634747568547b8a7f9fd0c48ed74f16af4b23
      repository: https://github.com/pyserial/pyserial
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  require-sequential: false
  github:
    identifier: pyserial/pyserial
    strip-prefix: v

vars:
  import: serial
  pypi-package: pyserial
  python-version: "3.14"

test:
  environment: {}
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.import}}
        python: python${{vars.python-version}}
