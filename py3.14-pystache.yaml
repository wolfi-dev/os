package:
  name: py3.14-pystache
  version: "0.6.8"
  epoch: 0
  description: "A mustache template renderer for Python"
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: pystache
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/PennyDreadfulMTG/pystache.git
      tag: v${{package.version}}
      expected-commit: 531a0ecea00a696423175ef46c319b29408dc3e2

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: PennyDreadfulMTG/pystache
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - runs: |
        # Test the package
        cat <<EOF > test.py
        import pystache
        print(pystache.render('Hi {{person}}!', {'person': 'World'}))
        EOF
        python test.py | grep -q 'Hi World!'
