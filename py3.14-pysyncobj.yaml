package:
  name: py3.14-pysyncobj
  version: "0.3.17"
  epoch: 0
  description: "A library for replicating your python class between multiple servers, based on raft protocol"
  copyright:
    - license: MIT
  resources:
    cpu: "3"
    memory: 7Gi

vars:
  pypi-package: pysyncobj
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bakwc/PySyncObj.git
      tag: v${{package.version}}
      expected-commit: 6962777a95c3cf16591a4eab7733e6b0bc558d48

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: syncobj_admin

update:
  enabled: true
  manual: false
  github:
    identifier: bakwc/PySyncObj
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - name: Create a test MyCounter class
      runs: |
        python${{vars.python-version}} class.py
