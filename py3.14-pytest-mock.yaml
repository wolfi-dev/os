package:
  name: py3.14-pytest-mock
  version: "3.17.0"
  epoch: 1 # upstream-tests/pytest
  description: "Thin-wrapper around the mock package for easier use with pytest"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-pytest

vars:
  pypi-package: pytest-mock
  import: pytest_mock
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-mock # upstream-tests: test dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-asyncio # upstream-tests: test dependency
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytest-dev/pytest-mock
      tag: v${{package.version}}
      expected-commit: 5c2f207ca7098dde996f9bedd06e596e39b6246b

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  git:
    strip-prefix: v
