# Generated from https://pypi.org/project/pytest-xdist/
package:
  name: py3.14-pytest-xdist
  version: "3.8.0"
  epoch: 0
  description: "pytest plugin for distributed testing, most importantly across multiple CPUs."
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-execnet
      - py${{vars.python-version}}-pytest

vars:
  pypi-package: pytest-xdist
  import: xdist
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1e3e4dc16523c8a8f6c67d95a950166420718c99
      repository: https://github.com/pytest-dev/pytest-xdist
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: fix-loadgroup-pytest-node-ids.patch

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pytest-dev/pytest-xdist
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-pytest
        - py${{vars.python-version}}-filelock
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - uses: git-checkout
      with:
        expected-commit: 1e3e4dc16523c8a8f6c67d95a950166420718c99
        repository: https://github.com/pytest-dev/pytest-xdist
        tag: v${{package.version}}
    - runs: |
        # test_workqueue_ordered_by_size is known flaky:
        # https://github.com/pytest-dev/pytest-xdist/issues/985 and we've
        # seen the same with test_workqueue_ordered_by_input
        sed -i '/test_workqueue_ordered_by_size/i \    @pytest.mark.skip' testing/acceptance_test.py
        sed -i '/test_workqueue_ordered_by_input/i \    @pytest.mark.skip' testing/acceptance_test.py
        # test_handlecrashitem_one is flaky in container environments
        sed -i '/def test_handlecrashitem_one/i \    @pytest.mark.skip' testing/test_newhooks.py
        # test_remote_usage_prog fails with pytest 9.x due to removed _getparser API
        sed -i '/def test_remote_usage_prog/i \@pytest.mark.skip' testing/test_remote.py

        python${{vars.python-version}} -m pytest -n auto testing
