package:
  name: py3.14-pytest-xprocess
  version: "1.0.2"
  epoch: 0
  description: pytest plugin providing an xprocess fixture to start, track and stop external processes across test runs
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-psutil
      - py${{vars.python-version}}-pytest

vars:
  pypi-package: pytest-xprocess
  import: xprocess
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytest-dev/pytest-xprocess
      tag: ${{package.version}}
      expected-commit: 1c89f84e32235887695a4bdaa7c4598013d15c26

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          from xprocess import ProcessStarter, XProcess
    - name: Plugin registers xkill and xshow settings
      runs: |
        workdir=$(mktemp -d)
        cd "$workdir" || exit 1
        cat > test_xprocess_options.py <<'EOF'
        def test_options_registered(pytestconfig):
            assert pytestconfig.pluginmanager.hasplugin("xprocess")
            # both default to False unless passed, and getoption raises if the plugin never registered them
            assert pytestconfig.getoption("xkill") is False
            assert pytestconfig.getoption("xshow") is False
        EOF
        python${{vars.python-version}} -m pytest -rA test_xprocess_options.py > out.txt 2>&1 || { cat out.txt; exit 1; }
        cat out.txt
        grep -F "PASSED test_xprocess_options.py::test_options_registered" out.txt
        grep -F "1 passed" out.txt
    - name: xprocess fixture starts and terminates a process
      runs: |
        workdir=$(mktemp -d)
        cd "$workdir" || exit 1
        cat > test_xprocess_smoke.py <<'EOF'
        import psutil
        from xprocess import ProcessStarter


        def test_long_running_process(xprocess):
            class Starter(ProcessStarter):
                # readiness is detected by matching this line in the process log
                pattern = "sleeper ready"
                # tail -f /dev/null never exits on its own, so only xprocess can stop it
                args = ["sh", "-c", "echo 'sleeper ready'; exec tail -f /dev/null"]
                timeout = 30

            pid, logfile = xprocess.ensure("sleeper", Starter)
            assert psutil.pid_exists(pid)
            assert "sleeper ready" in open(logfile).read()

            info = xprocess.getinfo("sleeper")
            assert info.isrunning()
            assert info.pid == pid
            # terminate() returns 1 when it actually stopped a running process
            assert info.terminate() == 1
        EOF
        # no -p flag: the plugin must load through its pytest11 entry point
        python${{vars.python-version}} -m pytest -rA test_xprocess_smoke.py > out.txt 2>&1 || { cat out.txt; exit 1; }
        cat out.txt
        grep -F "PASSED test_xprocess_smoke.py::test_long_running_process" out.txt
        grep -F "1 passed" out.txt

update:
  enabled: true
  github:
    identifier: pytest-dev/pytest-xprocess
