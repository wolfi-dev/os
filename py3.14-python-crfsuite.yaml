package:
  name: py3.14-python-crfsuite
  version: "0.9.12"
  epoch: 0
  description: Python binding for CRFsuite
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 7Gi

vars:
  pypi-package: python-crfsuite
  import: pycrfsuite
  python-version: "3.14"

environment:
  contents:
    packages:
      - crfsuite
      - cython
      - glibc-2.44-dev
      - libarchive-tools
      - liblbfgs
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cython

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/scrapinghub/python-crfsuite.git
      expected-commit: c2eee3267750c585d3ef5eebaf632d3ee7855249
      tag: ${{package.version}}
      recurse-submodules: true

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git: {}
  ignore-regex-patterns:
    - ".*bumped.*"
    # Upstream cut a once-off 0.99 bad tag, which takes presence over 0.9.x format used.
    - ".*0.99.*"
    - ^tmp.*

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
