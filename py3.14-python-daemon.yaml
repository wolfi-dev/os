package:
  name: py3.14-python-daemon
  version: "3.1.2"
  epoch: 2 # upstream-tests/pytest
  description: Library to implement a well-behaved Unix daemon process.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-lockfile
      - py${{vars.python-version}}-setuptools
  resources:
    cpu: "3"
    memory: 5Gi

vars:
  pypi-package: python-daemon
  import: daemon
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-changelog-chug
      - py${{vars.python-version}}-lockfile # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-semver
      - py${{vars.python-version}}-setuptools # upstream-tests: runtime dependency
      - py${{vars.python-version}}-testscenarios # upstream-tests: test dependency
      - py${{vars.python-version}}-testtools # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://pagure.io/python-daemon.git
      tag: release/${{package.version}}
      expected-commit: af81dd5e22642dbd1ffcb6e03425d0877943a12b
      depth: -1

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # The suite uses testscenarios (load_tests scenario expansion); run it with unittest as upstream does.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      runner: unittest

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: release/
    tag-filter-prefix: release/

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
