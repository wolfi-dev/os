package:
  name: py3.14-python-discovery
  version: "1.9.6"
  epoch: 1 # upstream-tests/pytest
  description: python-discovery finds the right Python version in your system
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-filelock
      - py${{vars.python-version}}-platformdirs

vars:
  python-version: 3.14
  pypi-package: python-discovery
  import: python_discovery

environment:
  contents:
    packages:
      - py${{vars.python-version}}-filelock
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-platformdirs
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-mock # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-python-sbom
      - py${{vars.python-version}}-typing-extensions # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tox-dev/python-discovery
      expected-commit: 8023513d5c5fbeba5fa073ed1683327f09bfeb77
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # tests/test_py_info_collect.py imports vermin, which is not packaged.
  # TODO(upstream-tests): package py3.14-vermin and drop ignore-files.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore-files: tests/test_py_info_collect.py

  - uses: strip

update:
  enabled: true
  github:
    identifier: tox-dev/python-discovery

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
