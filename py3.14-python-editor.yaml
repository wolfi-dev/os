package:
  name: py3.14-python-editor
  version: 1.0.4
  epoch: 0
  description: Programmatically open an editor, capture the result.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-setuptools
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: python-editor
  import: editor
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fmoo/python-editor
      expected-commit: 3cc3036d78b4cb031b5d4d16585130f977663f24
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: fmoo/python-editor
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
