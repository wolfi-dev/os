package:
  name: py3.14-python-gitlab
  version: "8.6.0"
  epoch: 0
  description: A python wrapper for the GitLab API
  url: https://python-gitlab.readthedocs.io
  copyright:
    - license: LGPL-3.0-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-requests-toolbelt

vars:
  pypi-package: python-gitlab
  import: gitlab
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 51eb17e6e67a25157e04b0abc649221bd8ecc7fe
      repository: https://github.com/python-gitlab/python-gitlab
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: gitlab
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: gitlab

update:
  enabled: true
  github:
    identifier: python-gitlab/python-gitlab
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Verify getting GitLab project
      runs: |
        cat <<EOF> python-gitlab-test.py
        import gitlab

        gl = gitlab.Gitlab()

        # This ID is for the upstream project containing the GitLab source code.
        project = gl.projects.get(278964)

        assert project.attributes.get("web_url") == "https://gitlab.com/gitlab-org/gitlab"
        EOF

        HOME=/home/build python${{vars.python-version}} python-gitlab-test.py
