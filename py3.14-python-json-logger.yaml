package:
  name: py3.14-python-json-logger
  version: 4.2.0
  epoch: 0
  description: A python library adding a json log formatter
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: python-json-logger
  import: pythonjsonlogger
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 806dba9d9642fbec4c8538b625494c96b288ce59
      repository: https://github.com/nhairs/python-json-logger
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: nhairs/python-json-logger
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
