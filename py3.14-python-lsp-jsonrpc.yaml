package:
  name: py3.14-python-lsp-jsonrpc
  version: 1.1.2
  epoch: 0
  description: JSON RPC 2.0 server library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-ujson

vars:
  pypi-package: python-lsp-jsonrpc
  import: pylsp_jsonrpc
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-lsp/python-lsp-jsonrpc
      tag: v${{package.version}}
      expected-commit: 786d8dd8f830dbd83a17962c0167183a6609e72f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: python-lsp/python-lsp-jsonrpc
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
