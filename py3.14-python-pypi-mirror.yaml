package:
  name: py3.14-python-pypi-mirror
  version: 5.2.1
  epoch: 0
  description: A script to create a partial PyPI mirror
  copyright:
    - license: MIT
  dependencies:
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  module_name: pypi_mirror
  pypi-package: python-pypi-mirror
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 39c9724b5206e6008f8c7b842df9291dbbad9612
      repository: https://github.com/montag451/pypi-mirror
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
