package:
  name: py3.14-python-sbom
  version: "0.3.1"
  epoch: 0
  description: "Embed CycloneDX SBOMs into Python distributions (PEP 770): a hatchling build hook plus a backend-agnostic CLI"
  copyright:
    - license: MIT
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-installer
      - py${{vars.python-version}}-packageurl-python
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-zipremove

vars:
  pypi-package: python-sbom
  import: python_sbom
  python-version: 3.14

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-packageurl-python
      - py${{vars.python-version}}-zipremove

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tox-dev/python-sbom
      tag: ${{package.version}}
      expected-commit: 800cf535aec00992a891216cf7f1945167d62e89

  - uses: py/pip-build-install

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        import: ${{vars.import}}
    - uses: test/tw/help-check
      with:
        bins: python-sbom
    - uses: test/tw/ver-check
      with:
        bins: python-sbom
        version: ${{package.version}}

update:
  enabled: true
  git: {}
