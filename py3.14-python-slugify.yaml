package:
  name: py3.14-python-slugify
  version: "9.2.0"
  epoch: 1 # restore -bin subpackage dropped in the split
  description: A Python slugify application that also handles Unicode
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-text-unidecode
  resources:
    cpu: "5"
    memory: 5Gi

vars:
  pypi-package: python-slugify
  import: slugify
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-text-unidecode # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: cb0539e97077c66f8b9d080d87ac294c5072540b
      repository: https://github.com/un33k/python-slugify
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - runs: |
            slugify --help
            slugify version

update:
  enabled: true
  github:
    identifier: un33k/python-slugify
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
