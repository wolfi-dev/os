package:
  name: py3.14-python-slugify
  version: "9.1.3"
  epoch: 0
  description: A Python slugify application that also handles Unicode
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-text-unidecode
  resources:
    cpu: "5"
    memory: 5Gi

vars:
  pypi-package: python-slugify
  import: slugify
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f0010f94c853053daa5a5591cc67228b811c0e34
      repository: https://github.com/un33k/python-slugify
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: un33k/python-slugify
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
