package:
  name: py3.14-python-ulid
  version: "4.2.0"
  epoch: 2 # restore -bin subpackage dropped in the split
  description: Access large language models from the command-line
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "3"
    memory: 5Gi

vars:
  pypi-package: python-ulid
  import: ulid
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-freezegun # upstream-tests: test dependency
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pydantic # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-sqlalchemy # upstream-tests: test dependency
      - py${{vars.python-version}}-typing-extensions # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 4afe4bb77b742083d55d9ba190286d74adb7686f
      repository: https://github.com/mdomke/python-ulid
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # tests/test_sqlalchemy.py needs sqlmodel, which is not packaged.
  # TODO(upstream-tests): package py3.14-sqlmodel and drop ignore-files.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore-files: tests/test_sqlalchemy.py

  - name: "move usr/bin executables for -bin"
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: ulid

update:
  enabled: true
  git: {}

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
