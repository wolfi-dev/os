package:
  name: py3.14-python-ulid
  version: "4.0.1"
  epoch: 0
  description: Access large language models from the command-line
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "3"
    memory: 5Gi

vars:
  pypi-package: python-ulid
  import: ulid
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c8e418c3da4e42b842e200e3e75cf34575a4033c
      repository: https://github.com/mdomke/python-ulid
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: "move usr/bin executables for -bin"
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  git: {}

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
