package:
  name: py3.14-pythran
  version: "0.19.0"
  epoch: 0
  description: Ahead of Time compiler for numeric kernels
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-beniget
      - py${{vars.python-version}}-gast
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-ply
      - py${{vars.python-version}}-setuptools
  resources:
    cpu: "4"
    memory: 6Gi

vars:
  pypi-package: pythran
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - xsimd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/serge-sans-paille/pythran
      tag: ${{package.version}}
      expected-commit: 580c5abea7bdaf949cd55c99b26969befca04c7f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      environment:
        contents:
          packages:
            - build-base
            - python-${{vars.python-version}}-base-dev
      pipeline:
        - runs: |
            pythran-config --help
        - name: Compile a kernel with pythran and call it
          runs: |
            cat > dprod.py <<'PY'
            #pythran export dprod(float list, float list)
            def dprod(arr0, arr1):
                return sum([x * y for x, y in zip(arr0, arr1)])
            PY
            pythran dprod.py -o dprod$(python${{vars.python-version}}-config --extension-suffix)
            python${{vars.python-version}} -c 'import dprod, sys; r = dprod.dprod([1.0, 2.0], [3.0, 4.0]); print(dprod.__file__, r); sys.exit(r != 11.0 or not dprod.__file__.endswith(".so"))'

update:
  ignore-regex-patterns:
    - .post1
  enabled: true
  github:
    identifier: serge-sans-paille/pythran
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
