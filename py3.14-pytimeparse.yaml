package:
  name: py3.14-pytimeparse
  version: "1.1.10"
  epoch: 2 # upstream-tests/pytest
  description: Time expression parser
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: pytimeparse
  import: pytimeparse
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pytest # upstream-tests: test runner

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6d26b2a9204c591793077e6f26691f9e068b17ab
      repository: https://github.com/wroberts/pytimeparse
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # Upstream tests are unittest modules not named for pytest; run them with unittest.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      runner: unittest
      paths: pytimeparse/tests
      args: -p "test*.py"

  - uses: strip

update:
  enabled: true
  github:
    identifier: wroberts/pytimeparse

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
