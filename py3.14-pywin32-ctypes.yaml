package:
  name: py3.14-pywin32-ctypes
  version: 0.2.3
  epoch: 0
  description: A (partial) reimplementation of pywin32 using ctypes/cffi
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: pywin32-ctypes
  import: win32ctypes
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 30d3d1345d22a0a1ccab86ceae5d25e438897077
      repository: https://github.com/enthought/pywin32-ctypes
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: enthought/pywin32-ctypes
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
