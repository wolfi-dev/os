package:
  name: py3.14-pyyaml
  version: "6.0.3"
  epoch: 0
  description: Python3 bindings for YAML
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: pyyaml
  import: yaml
  python-version: 3.14

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-wheel
      - yaml-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/yaml/pyyaml
      tag: ${{package.version}}
      expected-commit: 49790e73684bebad1df05ef8d828fa12f685bffb

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: py3.14-wheels-${{vars.pypi-package}}
    pipeline:
      - uses: py/collect-wheels
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: "/usr/share/wheels/"
            name: "*.whl"

update:
  enabled: true
  ignore-regex-patterns:
    - dec-*
  github:
    identifier: yaml/pyyaml
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
