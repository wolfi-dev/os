package:
  name: py3.14-pyzmq
  version: "27.2.0"
  epoch: 0
  description: Python bindings for 0MQ
  copyright:
    # Upstream completed relicensing: https://github.com/zeromq/pyzmq/tree/main/RELICENSE
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: pyzmq
  import: zmq
  python-version: "3.14"

environment:
  contents:
    packages:
      - cmake
      - glibc-2.44-dev
      - libsodium-dev
      - libzmq-static
      - pkgconf
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-scikit-build-core
      - samurai
      - zeromq
      - zeromq-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c6bc8f20d47f9e779d17137201939a31fcd457cc
      repository: https://github.com/zeromq/pyzmq
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - uses: test/tw/ldd-check
    - name: REQ/REP round trip over inproc and tcp
      runs: |
        python${{vars.python-version}} <<'EOF'
        import zmq

        print("libzmq", zmq.zmq_version(), "pyzmq", zmq.pyzmq_version())
        assert zmq.pyzmq_version() == "${{package.version}}"
        assert zmq.has("curve"), "libzmq built without CURVE"

        ctx = zmq.Context()
        ctx.setsockopt(zmq.RCVTIMEO, 5000)
        for addr in ("inproc://t", "tcp://127.0.0.1:*"):
            rep = ctx.socket(zmq.REP)
            rep.bind(addr)
            req = ctx.socket(zmq.REQ)
            req.connect(rep.getsockopt_string(zmq.LAST_ENDPOINT))
            req.send(b"ping")
            assert rep.recv() == b"ping"
            rep.send(b"pong")
            assert req.recv() == b"pong"
            req.close()
            rep.close()
        ctx.term()
        EOF

update:
  enabled: true
  github:
    identifier: zeromq/pyzmq
    strip-prefix: v
