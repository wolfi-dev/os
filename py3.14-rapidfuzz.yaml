# Generated from https://pypi.org/project/rapidfuzz/
package:
  name: py3.14-rapidfuzz
  version: "3.14.6"
  epoch: 0
  description: rapid fuzzy string matching
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-scikit-build
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  glibc-version: "2.44"
  pypi-package: rapidfuzz
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-cython # generates the C++ extension sources
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-scikit-build-core
      - python-${{vars.python-version}}-dev # Python headers, so the C extension builds
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/maxbachmann/RapidFuzz
      tag: v${{package.version}}
      expected-commit: d1b4a183f9ee445134989f4ebbf1e4acfacd4ed7
      recurse-submodules: true # extern/taskflow and extern/rapidfuzz-cpp are needed for the C++ extensions

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: maxbachmann/RapidFuzz
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - name: Compiled extension shipped and loads
      runs: |
        python${{vars.python-version}} -c "import importlib.machinery as m, rapidfuzz.fuzz_cpp as e; assert e.__file__.endswith(tuple(m.EXTENSION_SUFFIXES)), e.__file__"
        RAPIDFUZZ_IMPLEMENTATION=cpp python${{vars.python-version}} -c "from rapidfuzz import fuzz, process; assert fuzz.ratio('this is a test', 'this is a test!') > 90"
