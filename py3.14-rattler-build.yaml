# Generated from https://pypi.org/project/py-rattler-build/
package:
  name: py3.14-rattler-build
  version: "0.81.0"
  epoch: 0
  description: python bindings for rattler-build, a fast conda-package builder
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "16"
    memory: 15Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  glibc-version: "2.44"
  pypi-package: py-rattler-build
  import: rattler_build
  python-version: "3.14"
  rust-version: "1.100"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-maturin
      - py${{vars.python-version}}-pip
      # py3.14-maturin does not depend on rust; the extension build needs it.
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d850eda9afbeca00c4bf93fb9c52470e518982cd
      repository: https://github.com/prefix-dev/rattler-build
      tag: v${{package.version}}

  - uses: py/pip-build-install
    working-directory: /home/build/py-rattler-build
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: prefix-dev/rattler-build
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
