package:
  name: py3.14-rdflib
  version: "7.6.0"
  epoch: 0
  description: RDFLib is a Python library for working with RDF, a simple yet powerful language for representing information.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-html5lib
      - py${{vars.python-version}}-isodate
      - py${{vars.python-version}}-pyparsing
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: rdflib
  import: rdflib
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-poetry

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/RDFLib/rdflib
      tag: ${{package.version}}
      expected-commit: 8b32146a0f9cb748c2068662e50d02b42fc86dfd

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - apk-tools
      pipeline:
        - runs: |
            apk info -L ${{package.name}}-bin > "pkg.list"
            for bin in csv2rdf rdf2dot rdfgraphisomorphism rdfpipe rdfs2dot sparqlquery; do
              grep -qx "usr/bin/$bin" pkg.list
            done

            cat > test.ttl <<'EOF'
            @prefix ex: <http://example.org/> .
            @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
            ex:a ex:p ex:b .
            ex:C a rdfs:Class .
            ex:p rdfs:domain ex:C .
            EOF
            printf 'name,age\nalice,30\n' > test.csv

            # csv2rdf --help prints usage then exits non-zero by design
            if csv2rdf --help > csv2rdf-help.txt; then
              echo "csv2rdf --help exited 0; expected its usage exit status" >&2
              exit 1
            fi
            grep -q "Reads csv files" csv2rdf-help.txt
            csv2rdf -b http://example.org/i/ -p http://example.org/p/ test.csv | grep -q '"alice"'
            rdf2dot test.ttl | grep -q digraph
            rdfs2dot test.ttl | grep -q digraph
            rdfgraphisomorphism --help
            rdfpipe --version
            rdfpipe --help
            rdfpipe -o nt test.ttl | grep -q "http://example.org/a"
            sparqlquery --help
            sparqlquery -q 'SELECT ?s WHERE { ?s ?p ?o }' test.ttl | grep -q "http://example.org/a"

update:
  enabled: true
  github:
    identifier: RDFLib/rdflib

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
