package:
  name: py3.14-reactivex
  version: "5.1.0"
  epoch: 0
  description: ReactiveX (Rx) for Python
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

vars:
  module_name: reactivex
  pypi-package: reactivex
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ReactiveX/RxPY
      tag: v${{package.version}}
      expected-commit: bbfecfbf83605f2bb2beb8b887dfe5b5fb322a67

  - name: Fix version (hardcoded as 0.0.0 in pyproject.toml)
    runs: |
      sed -i 's/version = "0.0.0"/version = "${{package.version}}"/' pyproject.toml

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  ignore-regex-patterns:
    - a[0-9]$
  github:
    identifier: ReactiveX/RxPY
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
        python: python${{vars.python-version}}
