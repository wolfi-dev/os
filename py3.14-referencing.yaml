package:
  name: py3.14-referencing
  version: "0.37.0"
  epoch: 0
  description: Cross-specification JSON referencing (JSON Schema, OpenAPI, and the one you just made up!).
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-attrs
      - py${{vars.python-version}}-rpds-py
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: referencing
  python-version: "3.14"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-jsonschema/referencing
      tag: v${{package.version}}
      expected-commit: 944ed5a20bc5125f2349156cbdc365daac0e67e6

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: python-jsonschema/referencing
    tag-filter: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
