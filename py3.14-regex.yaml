# Generated from https://pypi.org/project/regex/
package:
  name: py3.14-regex
  version: "2026.9.29"
  epoch: 0
  description: Alternative regular expression module, to replace re.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: regex
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0e8cb0596ba6572c66e5d153a1d7c901b381e15e
      repository: https://github.com/mrabarnett/mrab-regex
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    use-tag: true
    identifier: mrabarnett/mrab-regex

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
