# Generated from https://pypi.org/project/regex/
package:
  name: py3.14-regex
  version: "2026.11.19"
  epoch: 1 # upstream-tests/pytest
  description: Alternative regular expression module, to replace re.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: regex
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 3817c5d290069c5318674fb521edde3355d8f440
      repository: https://github.com/mrabarnett/mrab-regex
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # regex/tests/test_regex.py is a unittest module whose test_main calls unittest.main();
  # run it with unittest, as upstream does.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      runner: unittest
      paths: regex/tests
      args: -p test_regex.py

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    use-tag: true
    identifier: mrabarnett/mrab-regex

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
