package:
  name: py3.14-reno
  version: "4.1.0"
  epoch: 0
  description: RElease NOtes manager
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-dulwich
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pbr
      - py${{vars.python-version}}-pyyaml
  resources:
    memory: 4Gi

vars:
  pypi-package: reno
  import: reno
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pbr

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openstack/reno
      tag: ${{package.version}}
      expected-commit: 47651ec90664943f7f346cfea8de2e43e9b3c779

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: reno

update:
  enabled: true
  github:
    identifier: openstack/reno
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
