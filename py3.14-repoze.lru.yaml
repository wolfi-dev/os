package:
  name: py3.14-repoze.lru
  version: "0.8"
  epoch: 0
  description: "Tiny LRU cache implementation for Python"
  copyright:
    - license: BSD-3-Clause-Modification
  resources:
    cpu: "2"
    memory: 2Gi

vars:
  pypi-package: repoze.lru
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 183f03c57f2f1841392a1e36c1ac51efbb7e5c83
      repository: https://github.com/repoze/repoze.lru
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: repoze/repoze.lru
    use-tag: true

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-pytest
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - uses: git-checkout
      with:
        expected-commit: 183f03c57f2f1841392a1e36c1ac51efbb7e5c83
        repository: https://github.com/repoze/repoze.lru
        tag: ${{package.version}}
    - runs: |
        # The --override-ini option removes --cov* options that require
        # pytest-cov, which is currently unpackaged.
        python${{vars.python-version}} -m pytest \
          --override-ini='addopts=' \
          tests/
