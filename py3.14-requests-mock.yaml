package:
  name: py3.14-requests-mock
  version: "1.12.1"
  epoch: 0
  description: Mock out responses from the Python requests library in tests, via a transport adapter, a Mocker context manager/decorator, and a pytest plugin.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-requests

vars:
  pypi-package: requests-mock
  import: requests_mock
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jamielennox/requests-mock
      tag: ${{package.version}}
      expected-commit: fba8cc7faf83be9f1505625d566721ee6c68ed39

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-pytest
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          from ${{vars.import}}.contrib import _pytest_plugin
    - name: Adapter mounted on a Session returns the registered response
      runs: |
        python${{vars.python-version}} -c "import requests, requests_mock; s = requests.Session(); a = requests_mock.Adapter(); s.mount('mock://', a); a.register_uri('GET', 'mock://test.com', text='data'); r = s.get('mock://test.com'); assert (r.status_code, r.text) == (200, 'data'), (r.status_code, r.text); print('adapter ok')" | grep -F 'adapter ok'
    - name: Mocker context manager intercepts requests and records history
      runs: |
        python${{vars.python-version}} <<'EOF'
        import requests, requests_mock

        with requests_mock.Mocker() as m:
            m.get('http://test.com', text='data')
            m.post('http://test.com/items', json={'id': 7}, status_code=201,
                   headers={'X-Mock': 'yes'})
            assert requests.get('http://test.com').text == 'data'
            r = requests.post('http://test.com/items', json={'name': 'x'})
            assert r.status_code == 201, r.status_code
            assert r.json() == {'id': 7}, r.json()
            assert r.headers['X-Mock'] == 'yes'
            assert m.call_count == 2, m.call_count
            assert m.request_history[1].json() == {'name': 'x'}
            assert m.request_history[1].method == 'POST'

        # Unregistered URLs must raise instead of reaching the network.
        with requests_mock.Mocker() as m:
            try:
                requests.get('http://unregistered.invalid/')
            except requests_mock.exceptions.NoMockAddress:
                pass
            else:
                raise SystemExit('NoMockAddress not raised')
        print('mocker ok')
        EOF
    - name: Mocker decorator injects the mocker argument
      runs: |
        python${{vars.python-version}} <<'EOF'
        import requests, requests_mock

        @requests_mock.Mocker()
        def check(m):
            m.get('http://test.com/status', status_code=503, reason='Unavailable')
            r = requests.get('http://test.com/status')
            assert r.status_code == 503 and r.reason == 'Unavailable', (r.status_code, r.reason)

        check()
        print('decorator ok')
        EOF
    - name: pytest plugin provides the requests_mock fixture
      runs: |
        mkdir -p /tmp/rm-plugin
        cat > /tmp/rm-plugin/test_plugin.py <<'EOF'
        import requests

        def test_fixture(requests_mock):
            requests_mock.get('http://test.com', text='fixture-data')
            assert requests.get('http://test.com').text == 'fixture-data'
        EOF
        python${{vars.python-version}} -m pytest -p no:cacheprovider --rootdir=/tmp/rm-plugin --verbose /tmp/rm-plugin/test_plugin.py | grep -F 'test_plugin.py::test_fixture PASSED'

update:
  enabled: true
  github:
    identifier: jamielennox/requests-mock
    use-tag: true
