package:
  name: py3.14-requests-oauthlib
  version: 2.0.0
  epoch: 0
  description: OAuthlib authentication support for Requests.
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - py${{vars.python-version}}-oauthlib
      - py${{vars.python-version}}-requests
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: requests-oauthlib
  import: requests_oauthlib
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-oauthlib
      - py${{vars.python-version}}-requests

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/requests/requests-oauthlib
      tag: v${{package.version}}
      expected-commit: 7af9125a4fb3a21fbff4b829449a090469cf32b4

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: requests/requests-oauthlib
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
