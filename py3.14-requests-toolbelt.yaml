# Generated from https://pypi.org/project/requests-toolbelt/
package:
  name: py3.14-requests-toolbelt
  version: 1.0.0
  epoch: 0
  description: A utility belt for advanced users of python-requests
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-requests
  resources:
    cpu: "2"
    memory: 6Gi

vars:
  pypi-package: requests-toolbelt
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - python-3
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/requests/toolbelt
      tag: ${{package.version}}
      expected-commit: b7d1a1fcdda9ebcd9afe5011690ab860fce780c2

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: requests/toolbelt
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: requests_toolbelt
