package:
  name: py3.14-requests-unixsocket
  version: 0.4.1
  epoch: 0
  description: Use requests to talk HTTP via a UNIX domain socket
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-requests
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

vars:
  pypi-package: requests-unixsocket
  module-name: requests_unixsocket
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/msabramo/requests-unixsocket
      tag: v${{package.version}}
      expected-commit: c810a233ca79258037cebe8a9684482f712095d3

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: msabramo/requests-unixsocket
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.module-name}}
