package:
  name: py3.14-resolvelib
  version: "1.2.1"
  epoch: 0
  description: Resolve abstract dependencies into concrete ones
  copyright:
    - license: ISC
  dependencies:

vars:
  module_name: resolvelib
  pypi-package: resolvelib
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sarugaku/resolvelib
      expected-commit: 982d9f7daefbeca5a7feaac46ad09234ddefe2f5
      tag: ${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  ignore-regex-patterns:
    - (.*)(a|b)(.*)
  manual: false
  github:
    identifier: sarugaku/resolvelib
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
