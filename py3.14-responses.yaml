package:
  name: py3.14-responses
  version: "0.26.3"
  epoch: 2 # upstream-tests/pytest
  description: A utility library for mocking out the requests Python library
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-urllib3

vars:
  pypi-package: responses
  import: responses
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-asyncio # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-pyyaml # upstream-tests: runtime dependency
      - py${{vars.python-version}}-requests # upstream-tests: runtime dependency
      - py${{vars.python-version}}-tomli # upstream-tests: test dependency
      - py${{vars.python-version}}-tomli-w # upstream-tests: test dependency
      - py${{vars.python-version}}-urllib3 # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/getsentry/responses
      tag: ${{package.version}}
      expected-commit: cb13954973dc0c1508668cd75603b203b0925c4a

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # test_recorder.py, TestPassthru and TestMultipleWrappers::test_mock_not_leaked use the httpserver
  # fixture from pytest-httpserver, which is not packaged.
  # TODO(upstream-tests): package py3.14-pytest-httpserver and drop ignore-files and ignore.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore-files: responses/tests/test_recorder.py
      ignore: responses/tests/test_responses.py::TestPassthru responses/tests/test_responses.py::TestMultipleWrappers::test_mock_not_leaked

  - uses: strip

test:
  environment:
    contents:
      packages:
        - tw
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: getsentry/responses
    use-tag: true
