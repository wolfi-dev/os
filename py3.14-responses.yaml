package:
  name: py3.14-responses
  version: "0.26.3"
  epoch: 0
  description: A utility library for mocking out the requests Python library
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-urllib3

vars:
  pypi-package: responses
  import: responses
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/getsentry/responses
      tag: ${{package.version}}
      expected-commit: cb13954973dc0c1508668cd75603b203b0925c4a

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  environment:
    contents:
      packages:
        - tw
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: getsentry/responses
    use-tag: true
