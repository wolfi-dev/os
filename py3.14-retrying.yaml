package:
  name: py3.14-retrying
  version: "1.4.2"
  epoch: 0
  description: python 2 and 3 compatibility library
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-six
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: retrying
  import: retrying
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-six

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/groodt/retrying
      tag: v${{package.version}}
      expected-commit: f7c017784dba7819508c35b8a2ea5c1a65d5b418

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: groodt/retrying
    use-tag: true
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
