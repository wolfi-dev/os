package:
  name: py3.14-rfc3339-validator
  version: 0.1.4
  epoch: 0
  description: A pure python RFC3339 validator
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-six
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: rfc3339-validator
  import: rfc3339_validator
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5ebeb83a83ae5a65e610ffd90de36d30d7161aec
      repository: https://github.com/naimetti/rfc3339-validator
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: naimetti/rfc3339-validator
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
