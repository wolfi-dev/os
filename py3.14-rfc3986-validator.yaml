package:
  name: py3.14-rfc3986-validator
  version: 0.1.1
  epoch: 0
  description: Pure python rfc3986 validator
  copyright:
    - license: MIT

vars:
  pypi-package: rfc3986-validator
  import: rfc3986_validator
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: fetch # blocked-no-github: PyPI source, no known git upstream
    with:
      expected-sha256: 3d44bde7921b3b9ec3ae4e3adca370438eccebc676456449b145d533b240d055
      uri: https://files.pythonhosted.org/packages/source/r/rfc3986_validator/rfc3986_validator-${{package.version}}.tar.gz

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 32700

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
