#nolint:valid-pipeline-git-checkout-commit,valid-pipeline-git-checkout-tag
package:
  name: py3.14-roman-numerals-py
  version: "3.1.0_git20260617"
  epoch: 0
  description: A library to convert between integers and Unicode Roman numerals
  copyright:
    - license: CC0-1.0 AND 0BSD
  dependencies:
  resources:
    cpu: "3"
    memory: 2Gi

vars:
  import: roman_numerals
  pypi-package: roman-numerals-py
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/AA-Turner/roman-numerals
      expected-commit: adeca8ee3c4afbeb456ac3706ca459a0f3abc038
      branch: master

  - runs: cp LICENCE.rst python/

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: ./python

update:
  enabled: true
  git: {}
  schedule:
    period: daily
    reason: Upstream was releasing tags but no activity since ~1 year, we need the recent commits from master to build py3-sphinx. Cherry-pick apply failed due to conflicts.

test:
  environment: {}
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.import}}
        python: python${{vars.python-version}}
