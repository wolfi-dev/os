package:
  name: py3.14-roman
  version: "5.2"
  epoch: 1 # upstream-tests/pytest
  description: Small helper library to convert arabic to roman numerals
  copyright:
    - license: ZPL-2.1
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: roman
  import: roman
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/zopefoundation/roman
      tag: ${{package.version}}
      expected-commit: a443357af7d7050ad6a0ec369fa73a1b9f14a558

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: zopefoundation/roman
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Test roman numeral conversion
      runs: |
        python${{vars.python-version}} -c "
        import roman
        assert roman.toRoman(4) == 'IV'
        assert roman.toRoman(1999) == 'MCMXCIX'
        assert roman.fromRoman('XIV') == 14
        print('Roman numeral conversion tests passed')
        "
