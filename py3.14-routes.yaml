package:
  name: py3.14-routes
  version: 2.5.1
  epoch: 0
  description: "Speedy and dynamic URL generation Rails style for Python"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-repoze.lru
      - py${{vars.python-version}}-six

vars:
  pypi-package: routes
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 403f664c8790452d20dff7dfab159e6dc4aff443
      repository: https://github.com/bbangert/routes
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: bbangert/routes
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
