package:
  name: py3.14-rsa
  version: "4.9.1"
  epoch: 0
  description: Pure-Python3 RSA implementation
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-pyasn1

vars:
  pypi-package: rsa
  import: rsa
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-poetry

pipeline:
  - uses: fetch # blocked-no-github: upstream sybrenstuvel/python-rsa is archived and never tagged 4.9.1 (last tag: version-4.9); the PyPI sdist is the only source
    with:
      uri: https://files.pythonhosted.org/packages/source/r/rsa/rsa-${{package.version}}.tar.gz
      expected-sha256: e7bdbfdb5497da4c07dfd35530e1a902659db6ff241e39d9953cad06ebd0ae75

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: pyrsa-decrypt pyrsa-encrypt pyrsa-keygen pyrsa-priv2pub pyrsa-sign pyrsa-verify

update:
  enabled: true
  release-monitor:
    identifier: 12011

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Encrypt, decrypt, sign and verify
      runs: |
        cat > rsa_check.py <<'EOF'
        import rsa

        pub, priv = rsa.newkeys(1024)
        msg = b"py3.14-rsa test message"
        assert rsa.decrypt(rsa.encrypt(msg, pub), priv) == msg
        sig = rsa.sign(msg, priv, "SHA-256")
        assert rsa.verify(msg, sig, pub) == "SHA-256"
        try:
            rsa.verify(msg + b"x", sig, pub)
        except rsa.VerificationError:
            pass
        else:
            raise AssertionError("tampered message verified")
        assert rsa.PublicKey.load_pkcs1(pub.save_pkcs1()) == pub
        print("rsa OK")
        EOF
        python${{vars.python-version}} rsa_check.py
