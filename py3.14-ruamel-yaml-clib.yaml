package:
  name: py3.14-ruamel-yaml-clib
  version: "0.2.15"
  epoch: 0
  description: C version of reader, parser and emitter for ruamel.yaml derived from libyaml.
  copyright:
    - license: MIT
  resources:
    cpu: "3"
    memory: 6Gi

vars:
  pypi-package: ruamel-yaml-clib
  import: _ruamel_yaml
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - gcc~13
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-gpep517

pipeline:
  # blocked-no-github: ruamel.yaml.clib is distributed via PyPI sdist only
  - uses: fetch
    with:
      # Upstream normalised the sdist filename per PEP 625 as of 0.2.15:
      # ruamel.yaml.clib-*.tar.gz is now ruamel_yaml_clib-*.tar.gz.
      uri: https://files.pythonhosted.org/packages/source/r/ruamel.yaml.clib/ruamel_yaml_clib-${{package.version}}.tar.gz
      expected-sha256: 46e4cc8c43ef6a94885f72512094e482114a8a706d3c555a34ed4b0d20200600

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 131030

test:
  environment:
    contents:
      packages:
        # Test-only: _ruamel_yaml imports ruamel.yaml at load time.
        # py3.14-ruamel-yaml does not depend on this package, so there is
        # no cycle and it must be available before this one is tested.
        - py${{vars.python-version}}-ruamel-yaml
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          import ruamel.yaml.cyaml
    - name: ruamel.yaml uses the C parser and emitter
      runs: |
        python${{vars.python-version}} - <<'PYEOF'
        import io
        import _ruamel_yaml
        import ruamel.yaml
        from ruamel.yaml import YAML
        assert ruamel.yaml.__with_libyaml__ is True
        yaml = YAML(typ="safe")
        assert yaml.Parser is _ruamel_yaml.CParser, yaml.Parser
        assert yaml.Emitter is _ruamel_yaml.CEmitter, yaml.Emitter
        data = yaml.load("b: 1\na:\n- x\n- y\n")
        assert data == {"b": 1, "a": ["x", "y"]}, data
        out = io.StringIO()
        yaml.dump(data, out)
        assert yaml.load(out.getvalue()) == data, out.getvalue()
        PYEOF
