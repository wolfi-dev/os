package:
  name: py3.14-ruamel-yaml
  version: "0.19.1"
  epoch: 0
  description: ruamel.yaml is a YAML parser/emitter that supports roundtrip preservation of comments, seq/map flow style, and map key order
  # No runtime dependency on py3.14-ruamel-yaml-clib. ruamel.yaml 0.19
  # only lists ruamel.yaml.clib in the optional "oldlibyaml" extra (0.18
  # already excluded it for python_version >= "3.14"), and falls back to
  # the pure-Python parser and emitter when _ruamel_yaml is absent. The
  # clib split test-depends on this package, so a runtime edge back to it
  # would be a cycle that neither split could be built and tested through.
  copyright:
    - license: MIT

vars:
  pypi-package: ruamel-yaml
  import: ruamel.yaml
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pip

pipeline:
  - uses: fetch # blocked-no-github: PyPI source, no known git upstream
    with:
      expected-sha256: 53eb66cd27849eff968ebf8f0bf61f46cdac2da1d1f3576dd4ccee9b25c31993
      uri: https://files.pythonhosted.org/packages/source/r/ruamel.yaml/ruamel_yaml-${{package.version}}.tar.gz

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 66067

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: round-trip YAML with comments using the pure-Python parser
      runs: |
        python${{vars.python-version}} - <<'PYEOF'
        import io
        from ruamel.yaml import YAML
        src = "# top comment\nb: 1  # keep me\na:\n- x\n- y\n"
        yaml = YAML()
        data = yaml.load(src)
        assert data["b"] == 1 and list(data["a"]) == ["x", "y"], data
        assert list(data.keys()) == ["b", "a"], list(data.keys())
        out = io.StringIO()
        yaml.dump(data, out)
        assert out.getvalue() == src, out.getvalue()
        PYEOF
    - name: safe loader falls back to pure Python without ruamel-yaml-clib
      runs: |
        python${{vars.python-version}} - <<'PYEOF'
        import importlib.util
        import io
        import ruamel.yaml
        import ruamel.yaml.emitter
        import ruamel.yaml.parser
        from ruamel.yaml import YAML
        # The C extension is not a dependency; make sure the test does
        # not silently get it from somewhere else.
        assert importlib.util.find_spec("_ruamel_yaml") is None
        assert ruamel.yaml.__with_libyaml__ is False
        yaml = YAML(typ="safe")
        assert yaml.Parser is ruamel.yaml.parser.Parser, yaml.Parser
        assert yaml.Emitter is ruamel.yaml.emitter.Emitter, yaml.Emitter
        def rt(obj):
            out = io.StringIO()
            yaml.dump(obj, out)
            return yaml.load(out.getvalue())
        data = {"b": 1, "a": ["x", "y"]}
        assert rt(data) == data, rt(data)
        assert yaml.load("") is None
        assert yaml.load("1") == 1
        s = yaml.load('k: "\\U0001F600\\u00e9"')
        assert s == {"k": "\U0001F600é"}, s
        assert rt(s) == s, rt(s)
        PYEOF
