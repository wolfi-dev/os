package:
  name: py3.14-sacrebleu
  version: "2.6.0"
  epoch: 0
  description: Reference BLEU implementation that auto-downloads test sets and reports a version string to facilitate cross-lab comparisons
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-colorama
      - py${{vars.python-version}}-lxml
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-portalocker
      - py${{vars.python-version}}-regex
      - py${{vars.python-version}}-tabulate
  resources:
    cpu: "6"
    memory: 5Gi

vars:
  pypi-package: sacrebleu
  import: sacrebleu
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mjpost/sacrebleu
      expected-commit: 2277caccfc7b956671a6a09f1646f62250034157
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.destdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: py${{vars.python-version}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: sacrebleu
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: sacrebleu

update:
  enabled: true
  github:
    use-tag: true
    identifier: mjpost/sacrebleu
    strip-prefix: v
  ignore-regex-patterns:
    - ^rm$
    - ^list$

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
