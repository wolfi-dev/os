package:
  name: py3.14-safetensors
  version: "0.8.0"
  epoch: 0
  description: Fast and Safe Tensor serialization
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging

vars:
  glibc-version: "2.44"
  pypi-package: safetensors
  module-name: safetensors
  rust-version: "1.100"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-maturin
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools-rust
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/huggingface/safetensors
      tag: v${{package.version}}
      expected-commit: a406ca3e7a90598be0cd05a50069cb9bf5ef6ba6

  - working-directory: bindings/python
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v
  ignore-regex-patterns:
    - ^python-v.*

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-numpy-2.4
        - py${{vars.python-version}}-pip
        - py${{vars.python-version}}-packaging
        - py${{vars.python-version}}-pytest
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.module-name}}
    - uses: test/tw/pip-check
    - uses: test/tw/ldd-check
    - name: verify installation
      runs: |
        # Fetches torch and its dependencies over the network from
        # PyTorch's CPU wheel index: the upstream tests import torch,
        # and os/ has no torch package for Python 3.14. The CPU index
        # avoids the multi-GB CUDA wheels PyPI's torch pulls.
        pip${{vars.python-version}} install --index-url https://download.pytorch.org/whl/cpu torch
        # Verbatim from https://raw.githubusercontent.com/huggingface/safetensors/v0.8.0/bindings/python/tests/test_simple.py
        # (refresh it from the new tag on each version bump). melange
        # copies it from py3.14-safetensors/ via --source-dir. The file
        # has no unittest.main(), so running it as a script runs no
        # tests; pytest collects both its unittest classes and its
        # module-level test function, and fails if it collects none.
        python${{vars.python-version}} -m pytest -v test_simple.py
