package:
  name: py3.14-scandir
  version: 1.10.0
  epoch: 0
  description: scandir, a better directory iterator and faster os.walk()
  copyright:
    - license: BSD-3-Clause
  resources:
    memory: 4Gi

vars:
  pypi-package: scandir
  import: scandir
  python-version: 3.14

environment:
  contents:
    packages:
      - py${{vars.python-version}}-pip

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 982e6ba60e7165ef965567eacd7138149c9ce292
      repository: https://github.com/benhoyt/scandir
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  manual: false
  github:
    identifier: benhoyt/scandir
    strip-prefix: v
