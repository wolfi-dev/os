# Generated from https://pypi.org/project/scikit-build-core/
package:
  name: py3.14-scikit-build-core
  version: "1.1.2"
  epoch: 0
  description: Build backend for CMake based projects
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pathspec

vars:
  module_name: scikit_build_core
  pypi-package: scikit-build-core
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 695aa70a0db77f2c36e80c2bffcf3b4bd74df37b
      repository: https://github.com/scikit-build/scikit-build-core
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

# scikit-build-core 1.0.0 added console scripts. Move them into a -bin
# subpackage so multiple py3.X variants can coexist.
subpackages:
  - name: py3.14-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr
          mv ${{targets.contextdir}}/../py${{vars.python-version}}-${{vars.pypi-package}}/usr/bin ${{targets.contextdir}}/usr
    test:
      pipeline:
        - runs: |
            stat /usr/bin/scikit-build /usr/bin/scikit-build-core
            scikit-build --help
            scikit-build builder --help

update:
  enabled: true
  manual: false
  github:
    identifier: scikit-build/scikit-build-core
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
        python: python${{vars.python-version}}
