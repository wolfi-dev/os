package:
  name: py3.14-scikit-build
  version: "0.19.1"
  epoch: 0
  description: Improved build system generator for Python C/C++/Fortran/Cython extensions
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-distro
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-tomli
      - py${{vars.python-version}}-wheel
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: scikit-build
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2fa54d742e740439cbaea6e9de0bbff744715970
      repository: https://github.com/scikit-build/scikit-build
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: scikit-build/scikit-build

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: skbuild
