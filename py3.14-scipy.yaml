#nolint:unversioned-py3-dep
package:
  name: py3.14-scipy
  version: "1.18.1"
  epoch: 0
  description: Fundamental algorithms for scientific computing in Python
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-numpy-2.4
  resources:
    cpu: "36"
    memory: 34Gi

vars:
  glibc-version: "2.44"
  import: scipy
  pypi-package: scipy
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - gfortran
      - glibc-${{vars.glibc-version}}-dev
      - meson
      - ninja-build
      - openblas-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-cython-bin
      - py${{vars.python-version}}-meson-python
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-numpy-2.4-bin
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pkgconfig
      - py${{vars.python-version}}-pybind11
      - py${{vars.python-version}}-pythran
      - py${{vars.python-version}}-pythran-bin
      - py3-pybind11-dev
      - python-${{vars.python-version}}-dev
      - rsync
      - wolfi-base
      - xsimd

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/scipy/scipy
      expected-commit: e4e854eaa8f18d807cd3496028e257e36caa93cc
      tag: v${{package.version}}

  - runs: git submodule update --init

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: scipy/scipy
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
