package:
  name: py3.14-scp
  version: "0.16.2"
  epoch: 0
  description: scp module for paramiko
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-paramiko
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: scp
  import: scp
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 21308b89160c31164bfebc9b79aea710d4990769
      repository: https://github.com/jbardin/scp.py
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: jbardin/scp.py
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
