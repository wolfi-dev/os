package:
  name: py3.14-send2trash
  version: "2.1.0"
  epoch: 0
  description: Send file to trash natively under Mac OS X, Windows and Linux
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: send2trash
  import: send2trash
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2109d6e518e8848045a77eaac9357aefd301bbc2
      repository: https://github.com/arsenetar/send2trash
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./.cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./.cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: arsenetar/send2trash

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
