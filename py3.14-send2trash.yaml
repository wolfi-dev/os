package:
  name: py3.14-send2trash
  version: "2.2.0"
  epoch: 1 # restore -bin subpackage dropped in the split
  description: Send file to trash natively under Mac OS X, Windows and Linux
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: send2trash
  import: send2trash
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a0b16254fdb56d3df7363f52ea47f345e7a25ebd
      repository: https://github.com/arsenetar/send2trash
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./.cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./.cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./.cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: send2trash

update:
  enabled: true
  manual: false
  github:
    identifier: arsenetar/send2trash

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
