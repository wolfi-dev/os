package:
  name: py3.14-sentencepiece
  version: "0.2.3"
  epoch: 0
  description: SentencePiece is an unsupervised text tokenizer and detokenizer
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "8"
    memory: 18Gi

vars:
  pypi-package: sentencepiece
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - glibc-${{vars.glibc-version}}-dev
      - patch
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-base-dev
  environment:
    # https://github.com/wolfi-dev/os/issues/34075
    CXXFLAGS: -fdelete-null-pointer-checks

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google/sentencepiece.git
      tag: v${{package.version}}
      expected-commit: eafd99cf3b8bfa5101c2c5f42aab2cc39947938d

  - runs: |
      cd python
      # Pre-configure cmake to trigger the abseil-cpp git fetch/checkout
      # and create the FetchContent stamp file. This prevents
      # build_bundled.sh from re-downloading abseil-cpp (which would
      # overwrite the GCC 16 patch applied below).
      cmake .. -B build \
        -DSPM_ENABLE_SHARED=OFF \
        -DSPM_DISABLE_EMBEDDED_DATA=ON \
        -DCMAKE_INSTALL_PREFIX=build/root \
        -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
        "-DCMAKE_CXX_FLAGS=-fPIC -fvisibility=default -ffunction-sections -fdata-sections"
      # Apply the GCC 16 fix to the freshly downloaded/updated abseil-cpp.
      # See https://github.com/wolfi-dev/os/issues/34075
      # Abseil is fetched by FetchContent into build/_deps/abseil-cpp-src;
      # -p4 strips a/output/_deps/abseil-cpp-src/ from the patch paths.
      patch -p4 -d build/_deps/abseil-cpp-src < ../fix-bundled-absl-gcc16.patch
      cd ..
      python${{vars.python-version}} -m pip install ./python "--root=${{targets.destdir}}" --prefix=/usr

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: google/sentencepiece
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
    - uses: test/tw/ldd-check
    - name: Train a small model offline and round-trip text through it
      runs: |
        python${{vars.python-version}} train_roundtrip.py
