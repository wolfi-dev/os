package:
  name: py3.14-setproctitle
  version: "1.3.8"
  epoch: 0
  description: A Python module to customize the process title
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: setproctitle
  import: setproctitle
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dvarrazzo/py-setproctitle
      tag: version-${{package.version}}
      expected-commit: 2e7124295edef1d84a1e1416290fdeaae9ba6eab

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - version-*
  github:
    identifier: dvarrazzo/py-setproctitle
    use-tag: true
    tag-filter-prefix: version-
    strip-prefix: version-

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
