# Generated from https://pypi.org/project/setuptools-gettext/
package:
  name: py3.14-setuptools-gettext
  version: "0.1.20"
  epoch: 1 # upstream-tests/pytest
  description: Setuptools gettext extension plugin
  copyright:
    - license: "GPL-2.0-or-later"
  dependencies:
    runtime:
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-tomli

vars:
  import: setuptools_gettext
  pypi-package: setuptools-gettext
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-setuptools # upstream-tests: runtime dependency
      - py3.14-tomli # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d45923270c81efe9a77c684b68598af0d58c7839
      repository: https://github.com/breezy-team/setuptools-gettext
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  github:
    identifier: breezy-team/setuptools-gettext
    strip-prefix: v
    use-tag: true
  ignore-regex-patterns:
    - ^debian/.*
    - ^upstream/.*

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.import}}
        python: python${{vars.python-version}}
