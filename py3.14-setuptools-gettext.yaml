# Generated from https://pypi.org/project/setuptools-gettext/
package:
  name: py3.14-setuptools-gettext
  version: "0.1.19"
  epoch: 0
  description: Setuptools gettext extension plugin
  copyright:
    - license: "GPL-2.0-or-later"
  dependencies:
    runtime:
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-tomli

vars:
  import: setuptools_gettext
  pypi-package: setuptools-gettext
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a2b6b3b03e24b2268f8cdfdec8ff7dbb01cfbe10
      repository: https://github.com/breezy-team/setuptools-gettext
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  github:
    identifier: breezy-team/setuptools-gettext
    strip-prefix: v
    use-tag: true
  ignore-regex-patterns:
    - ^debian/.*
    - ^upstream/.*

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.import}}
        python: python${{vars.python-version}}
