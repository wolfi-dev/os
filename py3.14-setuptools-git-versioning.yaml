# Generated from https://pypi.org/project/setuptools-git-versioning/
package:
  name: py3.14-setuptools-git-versioning
  version: "3.2.0"
  epoch: 0
  description: Use git repo data for building a version number according PEP-440
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-tomli
  resources:
    cpu: "1"
    memory: 7Gi

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 68890057f1431f7794c1b41e6d5a96cb395fe155
      repository: https://github.com/dolfinus/setuptools-git-versioning
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: "move usr/bin executables for -bin"
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

vars:
  pypi-package: setuptools-git-versioning
  import: setuptools_git_versioning
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-toml
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

update:
  enabled: true
  manual: false
  github:
    identifier: dolfinus/setuptools-git-versioning
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
