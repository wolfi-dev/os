package:
  name: py3.14-setuptools-scm
  version: "10.3.4"
  epoch: 0
  description: the blessed package to manage your versions by scm tags
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-tomli
      - py${{vars.python-version}}-typing-extensions
      - py${{vars.python-version}}-vcs-versioning

vars:
  pypi-package: setuptools-scm
  import: setuptools_scm
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-tomli
      - py${{vars.python-version}}-vcs-versioning
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/setuptools_scm
      tag: setuptools-scm-v${{package.version}}
      expected-commit: b27f5973c4e24cdbca08f8c003e431e220f52a40

  - working-directory: setuptools-scm
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: pypa/setuptools_scm
    strip-prefix: setuptools-scm-v
    tag-filter-prefix: setuptools-scm-v
