package:
  name: py3.14-sniffio
  version: 1.3.1
  epoch: 4 # upstream-tests/pytest
  description: Sniff out which async library your code is running under
  copyright:
    - license: MIT OR Apache-2.0
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: sniffio
  import: sniffio
  python-version: "3.14"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-trio/sniffio
      tag: v${{package.version}}
      expected-commit: ae020e13b98d276a6558ffc25e82509fd4c288f0

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # test_curio needs curio, which is not packaged.
  # TODO(upstream-tests): package py3.14-curio and drop this.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore: sniffio/_tests/test_sniffio.py::test_curio

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: python-trio/sniffio
    strip-prefix: v
    use-tag: true
