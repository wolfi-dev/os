package:
  name: py3.14-snowballstemmer
  version: "3.1.1"
  epoch: 0
  description: This package provides 29 stemmers for 28 languages generated from Snowball algorithms.
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: snowballstemmer
  import: snowballstemmer
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - gcc
      - glibc-${{vars.glibc-version}}-dev
      - make
      - perl
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-build-base
      - python-${{vars.python-version}}
      - python-${{vars.python-version}}-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/snowballstem/snowball
      tag: v${{package.version}}
      expected-commit: cd195b51e948a902a4312f023f4a14392516a543

  # Repeat the build process used to distribute tarballs to PyPI.  We'll
  # then build the results for each Python version.
  - uses: autoconf/make
    with:
      opts: dist_libstemmer_python

  - runs: tar -xf snowballstemmer-${{package.version}}.tar.gz
    working-directory: dist

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
    working-directory: dist/snowballstemmer-${{package.version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: snowballstem/snowball
    use-tag: true
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
