package:
  name: py3.14-sortedcontainers
  version: 2.4.0
  epoch: 0
  description: Sorted Containers -- Sorted List, Sorted Dict, Sorted Set
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: sortedcontainers
  import: sortedcontainers
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grantjenks/python-sortedcontainers
      tag: v${{package.version}}
      expected-commit: a1f52d6713dd2c2713a881d4f4d86ed68ff71cab

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: grantjenks/python-sortedcontainers
    use-tag: true
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
