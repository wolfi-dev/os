# Note: soupseive has circular dependency with beautifulsoup
#       so there is no import test here as it would not run
#       without running a runtime dep on py3-beautifulsoup.
package:
  name: py3.14-soupsieve
  version: "3.0.4"
  epoch: 0
  description: A modern CSS selector implementation for Beautiful Soup.
  copyright:
    - license: MIT

vars:
  pypi-package: soupsieve
  import: soupsieve
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 628ec6ba9c6dae0e1c2649133e43b68c2c1372b7
      repository: https://github.com/facelessuser/soupsieve
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  ignore-regex-patterns:
    - 2.3.2.post1
  github:
    identifier: facelessuser/soupsieve

test:
  pipeline:
    - uses: test/tw/pip-check
