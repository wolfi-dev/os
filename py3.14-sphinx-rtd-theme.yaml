package:
  name: py3.14-sphinx-rtd-theme
  version: "3.1.0"
  epoch: 0
  description: Read the Docs theme for Sphinx
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-docutils
      - py${{vars.python-version}}-sphinx
      - py${{vars.python-version}}-sphinxcontrib-jquery

vars:
  pypi-package: sphinx-rtd-theme
  import: sphinx_rtd_theme
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 795de79c8b311592f5863a25307d85924bf52164
      repository: https://github.com/readthedocs/sphinx_rtd_theme
      tag: ${{package.version}}

  # Upstream caps docutils <0.23 but the theme works fine with 0.23.
  # They added 0.22 support in 3.1.0rc2 and just haven't bumped the cap.
  - runs: sed -i 's/docutils >0.18,<0.23/docutils >0.18,<0.24/' setup.cfg

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: readthedocs/sphinx_rtd_theme
    use-tag: true

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-sphinx-bin
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Generate documentation using the theme
      runs: |
        mkdir -p test_docs/${{vars.python-version}}
        cd test_docs/${{vars.python-version}}
        sphinx-quickstart -q -p "Test Project" -a "Author" -v "0.1" --ext-autodoc --ext-viewcode || exit 1

        # Modify conf.py to use the sphinx_rtd_theme
        sed -i "s/html_theme = .*/html_theme = 'sphinx_rtd_theme'/g" conf.py

        # Build the documentation
        sphinx-build -b html . _build/html || exit 1

        # Check if HTML output was generated
        [ -f _build/html/index.html ] ||
          { echo "FAIL: sphinx-build did not produce _build/html/index.html"; exit 1; }
