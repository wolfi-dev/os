package:
  name: py3.14-sphinx
  version: "9.2.0"
  epoch: 0
  description: Python Documentation Generator
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-alabaster
      - py${{vars.python-version}}-babel
      - py${{vars.python-version}}-docutils<0.24 # sphinx 9.2.0 requires docutils>=0.21,<0.24 (pyproject.toml)
      - py${{vars.python-version}}-imagesize
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pygments
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-roman-numerals-py
      - py${{vars.python-version}}-snowballstemmer
      - py${{vars.python-version}}-sphinxcontrib-applehelp
      - py${{vars.python-version}}-sphinxcontrib-devhelp
      - py${{vars.python-version}}-sphinxcontrib-htmlhelp
      - py${{vars.python-version}}-sphinxcontrib-jsmath
      - py${{vars.python-version}}-sphinxcontrib-qthelp
      - py${{vars.python-version}}-sphinxcontrib-serializinghtml
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"

vars:
  pypi-package: sphinx
  import: sphinx
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-gpep517

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sphinx-doc/sphinx
      tag: v${{package.version}}
      expected-commit: 7b2c103eaa4cabf0ac47224c444cf0cbc7c745e5

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.destdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: py3.14-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - apk-tools
      pipeline:
        - runs: |
            apk info -L py${{vars.python-version}}-${{vars.pypi-package}}-bin > "pkg.list"
            grep usr/bin/ pkg.list > bins.list
            while read -r line; do
              echo "== $line =="
              "/$line" --help
            done < bins.list

update:
  enabled: true
  ignore-regex-patterns:
    - rc
  github:
    identifier: sphinx-doc/sphinx
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          from sphinx.writers.latex import LaTeXTranslator, LaTeXWriter
