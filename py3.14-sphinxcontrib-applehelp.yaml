package:
  name: py3.14-sphinxcontrib-applehelp
  version: 2.0.0
  epoch: 0
  description: sphinxcontrib-applehelp is a Sphinx extension which outputs Apple help books
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: sphinxcontrib-applehelp
  import: sphinxcontrib.applehelp
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sphinx-doc/sphinxcontrib-applehelp
      expected-commit: f4f9d900b238d03da601bf7c75cff5bcbcee6d7c
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: sphinx-doc/sphinxcontrib-applehelp

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          # import ${{vars.import}} # AVOID_DEP_CYCLE(sphinx)
