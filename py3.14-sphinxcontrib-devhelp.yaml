package:
  name: py3.14-sphinxcontrib-devhelp
  version: 2.0.0
  epoch: 0
  description: sphinxcontrib-devhelp is a sphinx extension which outputs Devhelp documents
  copyright:
    - license: BSD-2-Clause
  resources:
    memory: 4Gi
    cpu: "1"
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: sphinxcontrib-devhelp
  import: sphinxcontrib.devhelp
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sphinx-doc/sphinxcontrib-devhelp
      expected-commit: 0177fb44f165305f27b34e69e6e7e5ed6f24d752
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: sphinx-doc/sphinxcontrib-devhelp

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          # import ${{vars.import}} # AVOID_DEP_CYCLE(sphinx)
