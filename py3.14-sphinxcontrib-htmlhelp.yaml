package:
  name: py3.14-sphinxcontrib-htmlhelp
  version: 2.1.0
  epoch: 0
  description: sphinxcontrib-htmlhelp is a sphinx extension which renders HTML help files
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "2"
    memory: 3Gi

vars:
  pypi-package: sphinxcontrib-htmlhelp
  import: sphinxcontrib.htmlhelp
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sphinx-doc/sphinxcontrib-htmlhelp
      expected-commit: f7f5d4ecf27fad97e2454fbeda94c6a105c994ff
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: sphinx-doc/sphinxcontrib-htmlhelp

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          # import ${{vars.import}} # AVOID_DEP_CYCLE(sphinx)
