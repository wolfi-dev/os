package:
  name: py3.14-sphinxcontrib-jquery
  version: '4.1'
  epoch: 0
  description: Extension to include jQuery on newer Sphinx releases
  copyright:
    - license: 0BSD
  dependencies:
    runtime:
      - py${{vars.python-version}}-sphinx

vars:
  pypi-package: sphinxcontrib-jquery
  import: sphinxcontrib.jquery
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sphinx-contrib/jquery
      expected-commit: f45993d5657e2afb96e4a730b9033673af7ab0ef
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: sphinx-contrib/jquery
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
