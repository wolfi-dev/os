package:
  name: py3.14-sphinxcontrib-jsmath
  version: "2.0.0"
  epoch: 0
  description: A sphinx extension which renders display math in HTML via JavaScript
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 1Gi

vars:
  pypi-package: sphinxcontrib-jsmath
  import: sphinxcontrib.jsmath
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sphinx-doc/sphinxcontrib-jsmath
      expected-commit: 420ba4ebb0cabff9100e46714c67074f33f44fc5
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: sphinx-doc/sphinxcontrib-jsmath
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          # import ${{vars.import}} # AVOID_DEP_CYCLE(sphinx)
