package:
  name: py3.14-sphinxcontrib-packages
  version: "1.3.0"
  epoch: 0
  description: This packages contains the Packages sphinx extension, which provides directives to display packages installed on the host machine
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-distro
      - py${{vars.python-version}}-docutils
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-sphinx
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: sphinxcontrib-packages
  import: sphinxcontrib.packages
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sphinx-contrib/packages
      expected-commit: eda29dca967fa759936c3ea544c2f132125c10d1
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: sphinx-contrib/packages
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
