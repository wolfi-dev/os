package:
  name: py3.14-sphinxext-opengraph
  version: "0.13.0"
  epoch: 0
  description: sphinxext-opengraph is a sphinx extension to generate unique OpenGraph metadata
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-sphinx
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: sphinxext-opengraph
  import: sphinxext.opengraph
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sphinx-doc/sphinxext-opengraph
      expected-commit: 95cf8a8c30c301343f8347c5d72a97030e007f34
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: sphinx-doc/sphinxext-opengraph
    strip-prefix: v
  ignore-regex-patterns:
    - V0.8.0 # Bad tag

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
