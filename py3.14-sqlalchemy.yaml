package:
  name: py3.14-sqlalchemy
  version: "2.1.4"
  epoch: 0
  description: Database Abstraction Library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-greenlet
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: sqlalchemy
  import: sqlalchemy
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sqlalchemy/sqlalchemy
      expected-commit: 632c664fe9ff67ebaecc6ceed99262afdf80011f
      tag: rel_${{vars.mangled-package-version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  version-transform:
    - match: rel_(\d+)_(\d+)_(\d+)
      replace: $1.$2.$3
  github:
    identifier: sqlalchemy/sqlalchemy
    tag-filter: rel_

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: _
    to: mangled-package-version

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
