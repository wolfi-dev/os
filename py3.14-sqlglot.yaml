package:
  name: py3.14-sqlglot
  version: "30.21.0"
  epoch: 0
  description: An easily customizable SQL parser and transpiler
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: sqlglot
  import: sqlglot
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tobymao/sqlglot
      tag: v${{package.version}}
      expected-commit: 5d16fa83bfb8f3582eaffa4b99c7d05a061d8a76

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: tobymao/sqlglot
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
