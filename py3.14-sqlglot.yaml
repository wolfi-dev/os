package:
  name: py3.14-sqlglot
  version: "30.26.0"
  epoch: 0
  description: An easily customizable SQL parser and transpiler
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: sqlglot
  import: sqlglot
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pip
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tobymao/sqlglot
      tag: v${{package.version}}
      expected-commit: b0842a1ee0be2cc9345d7312724dbf2ee32e325a

  # Upstream 30.25.0 added write_to_source to [tool.setuptools_scm], which the
  # packaged setuptools_scm rejects (unexpected keyword argument). version_file
  # alone already writes sqlglot/_version.py.
  - runs: sed -i '/^write_to_source = true$/d' pyproject.toml

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: tobymao/sqlglot
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
