package:
  name: py3.14-sqlite-anyio
  version: "0.2.4"
  epoch: 0
  description: Asynchronous client for SQLite using AnyIO
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-anyio
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  import: sqlite_anyio
  pypi-package: sqlite-anyio
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: b65df936d27f6454c780e22a19c3f0a65023356c
      repository: https://github.com/davidbrochart/sqlite-anyio
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: davidbrochart/sqlite-anyio
    strip-prefix: v
    tag-filter: v

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
