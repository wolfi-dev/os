package:
  name: py3.14-sqlite-fts4
  version: 1.0.3
  epoch: 0
  description: Custom Python functions for working with SQLite FTS4
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: sqlite-fts4
  import: sqlite_fts4
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f86b44933b3d0907f58c7db01411e7148b9f59dc
      repository: https://github.com/simonw/sqlite-fts4
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git: {}

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
