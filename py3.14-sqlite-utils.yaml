package:
  name: py3.14-sqlite-utils
  version: "4.2.1"
  epoch: 0
  description: CLI tool and Python library for manipulating SQLite databases
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-click-default-group
      - py${{vars.python-version}}-pip-base
      - py${{vars.python-version}}-pluggy
      - py${{vars.python-version}}-python-dateutil
      - py${{vars.python-version}}-sqlite-fts4
      - py${{vars.python-version}}-tabulate

vars:
  pypi-package: sqlite-utils
  import: sqlite_utils
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-click # upstream-tests: test dependency
      - py${{vars.python-version}}-click-default-group # upstream-tests: runtime dependency
      - py${{vars.python-version}}-hypothesis # upstream-tests: test dependency
      - py${{vars.python-version}}-pluggy # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-python-dateutil # upstream-tests: runtime dependency
      - py${{vars.python-version}}-sqlite-fts4 # upstream-tests: runtime dependency
      - py${{vars.python-version}}-tabulate # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 28dc6278cc03a9245325d056e6986818544abc68
      repository: https://github.com/simonw/sqlite-utils
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: sqlite-utils
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: sqlite-utils
        - name: insert and query a database
          runs: |
            echo '[{"id": 1, "name": "Cleo"}, {"id": 2, "name": "Pancakes"}]' > dogs.json
            sqlite-utils insert dogs.db dogs dogs.json --pk=id
            tables=$(sqlite-utils tables dogs.db --csv --no-headers | tr -d "\r")
            [ "$tables" = "dogs" ] || { echo "FAIL: tables '$tables'"; exit 1; }
            out=$(sqlite-utils query dogs.db "select name from dogs where id = 2" --csv --no-headers | tr -d "\r")
            [ "$out" = "Pancakes" ] || { echo "FAIL: got '$out'"; exit 1; }
        - name: pip module is available to install and uninstall
          runs: |
            python${{vars.python-version}} -c 'import pip; print(pip.__version__)'
            sqlite-utils install --help

update:
  enabled: true
  ignore-regex-patterns:
    - '[ab]\d+$'
  git: {}

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
