package:
  name: py3.14-sqlparse
  version: "0.6.0"
  epoch: 0
  description: A non-validating SQL parser.
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "4"
    memory: 4Gi

vars:
  pypi-package: sqlparse
  import: sqlparse
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-trove-classifiers

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/andialbrecht/sqlparse
      tag: ${{package.version}}
      expected-commit: 2f40da99b50d81135aecf96f6b08fcfa338a96de

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    use-tag: true
    identifier: andialbrecht/sqlparse

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
