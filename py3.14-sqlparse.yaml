package:
  name: py3.14-sqlparse
  version: "0.6.1"
  epoch: 3 # restore -bin subpackage dropped in the split
  description: A non-validating SQL parser.
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "4"
    memory: 4Gi

vars:
  pypi-package: sqlparse
  import: sqlparse
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-trove-classifiers
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/andialbrecht/sqlparse
      tag: ${{package.version}}
      expected-commit: 09dbe1eec31ed1b3cd05366748865f11ba427d32

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - runs: |
            sqlformat --version
            echo "SELECT id, name FROM users WHERE id = 1;" | sqlformat --reindent -
            echo "select id,name from users where id=1;" | sqlformat --reindent - | grep -i "SELECT"

update:
  enabled: true
  github:
    use-tag: true
    identifier: andialbrecht/sqlparse

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
