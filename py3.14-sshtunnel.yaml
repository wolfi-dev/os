package:
  name: py3.14-sshtunnel
  version: "0.5.1"
  epoch: 0
  description: Pure python SSH tunnels
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-paramiko
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: sshtunnel
  import: sshtunnel
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ee634caae6cd7e129d36a4a4cb372fd240c7b814
      repository: https://github.com/pahaz/sshtunnel
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: py${{vars.python-version}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: sshtunnel

update:
  enabled: true
  github:
    identifier: pahaz/sshtunnel

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
