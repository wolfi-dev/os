package:
  name: py3.14-stack-data
  version: 0.6.3
  epoch: 0
  description: Extract data from python stack frames and tracebacks for informative displays
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-asttokens
      - py${{vars.python-version}}-executing
      - py${{vars.python-version}}-pure-eval

vars:
  pypi-package: stack-data
  import: stack_data
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 53501eb8b7c7963aa85335716d1de9f0b9f7aefc
      repository: https://github.com/alexmojaki/stack_data
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: alexmojaki/stack_data
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
