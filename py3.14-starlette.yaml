package:
  name: py3.14-starlette
  version: "1.7.0"
  epoch: 0
  description: The little ASGI library that shines
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-anyio
      - py${{vars.python-version}}-idna
      - py${{vars.python-version}}-sniffio
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: starlette
  module-name: starlette
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/encode/starlette
      tag: ${{package.version}}
      expected-commit: 2269e9a08c1edd3dfdea865710f40f84c857b623

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  git: {}
  ignore-regex-patterns:
    - .*\.b.*
    - .*\.post.*

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.module-name}}
    - name: Test Starlette basic functionality
      runs: |
        python${{vars.python-version}} <<EOF
        import starlette
        from starlette.applications import Starlette
        from starlette.responses import JSONResponse
        from starlette.routing import Route

        # Verify core components are available
        assert hasattr(starlette, '__version__')
        print(f"Starlette version: {starlette.__version__}")

        # Test basic app creation
        async def homepage(request):
            return JSONResponse({'hello': 'world'})

        app = Starlette(routes=[
            Route('/', homepage),
        ])

        # Verify app was created successfully
        assert app is not None
        assert len(app.routes) == 1

        print("All tests passed!")
        EOF
