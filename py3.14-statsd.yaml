package:
  name: py3.14-statsd
  version: 4.0.1
  epoch: 0
  description: A simple statsd client.
  copyright:
    - license: MIT

vars:
  pypi-package: statsd
  import: statsd
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1325f31ace0d2f219c5ca4cc3571cb343bd76ca6
      repository: https://github.com/jsocol/pystatsd
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jsocol/pystatsd
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
