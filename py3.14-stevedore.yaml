# Generated from https://pypi.org/project/stevedore/
package:
  name: py3.14-stevedore
  version: "5.9.1"
  epoch: 0
  description: Manage dynamic plugins for Python applications
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-pbr
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  module_name: stevedore
  pypi-package: stevedore
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-pbr
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openstack/stevedore
      expected-commit: 44e1028b014a73d00ef31251a10cb08cd989e8a6
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: openstack/stevedore
    use-tag: true
  ignore-regex-patterns:
    - -eom
    - -eol
    - ^xena-em$

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
        python: python${{vars.python-version}}
