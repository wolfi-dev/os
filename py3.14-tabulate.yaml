package:
  name: py3.14-tabulate
  version: "0.10.0"
  epoch: 3 # restore -bin subpackage dropped in the split
  description: Pretty-print tabular data
  copyright:
    - license: MIT
  resources:
    cpu: "12"
    memory: 5Gi

vars:
  pypi-package: tabulate
  import: tabulate
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/astanin/python-tabulate
      tag: v${{package.version}}
      expected-commit: 3b4cd509820e4c45cd2aaba833aa585ea6308b94

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./.cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./.cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./.cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - runs: |
            tabulate --help

update:
  enabled: true
  github:
    identifier: astanin/python-tabulate
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
