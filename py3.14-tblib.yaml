package:
  name: py3.14-tblib
  version: 3.1.0
  epoch: 0
  description: Serialization library for Exceptions and Tracebacks.
  copyright:
    - license: BSD-2-Clause
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: tblib
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8b1e1a2cc66ef41d39021ff8ce1e21f826a152ed
      repository: https://github.com/ionelmc/python-tblib
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ionelmc/python-tblib
    strip-prefix: v
    tag-filter: v

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - name: Test basic functionality
      runs: |
        cat > test.py <<EOF
        from tblib import pickling_support
        pickling_support.install()
        import pickle, sys
        def inner_0():
            raise Exception('fail')

        def inner_1():
            inner_0()

        def inner_2():
            inner_1()

        try:
            inner_2()
        except:
            s1 = pickle.dumps(sys.exc_info())

        assert len(s1) > 1

        try:
            inner_2()
        except:
            s2 = pickle.dumps(sys.exc_info(), protocol=pickle.HIGHEST_PROTOCOL)

        assert len(s2) > 1
        EOF

        python${{vars.python-version}} test.py
