package:
  name: py3.14-tempora
  version: "5.9.0"
  epoch: 0
  description: "Objects and routines pertaining to date and time (tempora)."
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-jaraco.collections
      - py${{vars.python-version}}-jaraco.context
      - py${{vars.python-version}}-jaraco.functools
      - py${{vars.python-version}}-python-dateutil
  resources:
    cpu: "4"
    memory: 4Gi

vars:
  pypi-package: tempora
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jaraco/tempora
      tag: v${{package.version}}
      expected-commit: 2fe92f4be75dcbbd4d56c8475a1597c7aa534fdd

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            echo 50/month | calc-prorate | grep "per month: 50.0"
            echo 5/hour | calc-prorate | grep "per hour: 5.0"

update:
  enabled: true
  manual: false
  github:
    identifier: jaraco/tempora
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
