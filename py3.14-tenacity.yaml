package:
  name: py3.14-tenacity
  version: "9.2.1"
  epoch: 0
  description: General-purpose retrying library, written in Python, to simplify the task of adding retry behavior to just about anything
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: tenacity
  import: tenacity
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jd/tenacity.git
      tag: ${{package.version}}
      expected-commit: 4410996dd9a96864a2733ce0778bcaa112b72811

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: jd/tenacity
    use-tag: true
  ignore-regex-patterns:
    - mergify2-

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
