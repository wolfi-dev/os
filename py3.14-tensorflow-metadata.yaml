package:
  name: py3.14-tensorflow-metadata
  version: "1.21.0"
  epoch: 0
  description: Utilities for passing TensorFlow-related metadata between tools
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-absl-py
      - py${{vars.python-version}}-googleapis-common-protos
      - py${{vars.python-version}}-protobuf
  resources:
    cpu: "20"
    memory: 21Gi

vars:
  pypi-package: tensorflow-metadata
  import: tensorflow_metadata
  python-version: "3.14"

environment:
  contents:
    packages:
      - bash
      - bazel-7
      - build-base
      - busybox
      - ca-certificates-bundle
      - gcc~13
      - openjdk-21
      - py${{vars.python-version}}-build-base
      - wolfi-base
  environment:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk
    BAZEL_CXXOPTS: -std=c++17:-w

pipeline:
  - uses: git-checkout
    with:
      expected-commit: da17f4557749ae122284c5be3e43a2f211d3e6e2
      repository: https://github.com/tensorflow/metadata
      tag: v${{package.version}}

  - uses: compiler/disable-openssf-flags

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  manual: false
  github:
    identifier: tensorflow/metadata
    strip-prefix: v

test:
  pipeline:
    - name: Import Test
      uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
    - name: Basic Functionality Test
      runs: |
        echo "Testing ${{vars.pypi-package}} basic functionality..."
        python${{vars.python-version}} <<EOF-
        from ${{vars.import}}.proto.v0 import schema_pb2
        schema = schema_pb2.Schema()
        schema.feature.add(name='example_feature')
        assert schema.feature[0].name == 'example_feature', 'Basic feature addition failed'
        print('${{vars.pypi-package}} basic functionality success')
        EOF-
