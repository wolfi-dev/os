package:
  name: py3.14-termcolor
  version: "3.3.0"
  epoch: 0
  description: ANSI color formatting for output in terminal
  copyright:
    - license: MIT

vars:
  pypi-package: termcolor
  import: termcolor
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/termcolor/termcolor
      tag: ${{package.version}}
      expected-commit: 0980eb52aa867fc32f70859a61c0609501b73a99

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: termcolor/termcolor
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - runs: |
        python${{vars.python-version}} <<'EOF' 2>&1 | grep -F -e "Attention!"
        import sys

        from termcolor import colored, cprint

        text = colored("Hello, World!", "red", attrs=["reverse", "blink"])
        print(text)
        cprint("Hello, World!", "green", "on_red")

        print_red_on_cyan = lambda x: cprint(x, "red", "on_cyan")
        print_red_on_cyan("Hello, World!")
        print_red_on_cyan("Hello, Universe!")

        for i in range(10):
            cprint(i, "magenta", end=" ")

        cprint("Attention!", "red", attrs=["bold"], file=sys.stderr)

        # You can also specify 0-255 RGB ints via a tuple
        cprint("Both foreground and background can use tuples", (100, 150, 250), (50, 60, 70))
        EOF
      uses: py/one-python
      with:
        content: |
          python3 -c '
          from termcolor import colored;
          print(colored("Hello, World!", "red"))' |
              grep -F "Hello, World!" || exit 1
