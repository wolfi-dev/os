package:
  name: py3.14-testpath
  version: 0.6.0
  epoch: 1 # upstream-tests/pytest
  description: Test utilities for code working with files and commands
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: testpath
  import: testpath
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: de8ca59539eb23b9781e55848b7d2646c8c61df9
      repository: https://github.com/jupyter/testpath
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: jupyter/testpath
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
