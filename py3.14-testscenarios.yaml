package:
  name: py3.14-testscenarios
  version: "0.7.0"
  epoch: 0
  description: pyunit extension for dependency injection test scenarios
  copyright:
    - license: Apache-2.0 OR BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-testtools

vars:
  pypi-package: testscenarios
  import: testscenarios
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/testing-cabal/testscenarios
      tag: ${{package.version}}
      expected-commit: 5eeab1702eaaeaecd05346ae098b37ccc9d25dba

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          from testscenarios import TestWithScenarios, WithScenarios, apply_scenario, apply_scenarios, generate_scenarios, load_tests_apply_scenarios, multiply_scenarios
    - name: Two scenarios run one test method twice under unittest
      runs: |
        mkdir -p /tmp/scen
        cat > /tmp/scen/test_scen.py <<'EOF'
        import unittest
        import testscenarios


        class TestAdd(testscenarios.TestWithScenarios):
            scenarios = [
                ("small", {"a": 1, "b": 2, "expected": 3}),
                ("large", {"a": 100, "b": 200, "expected": 300}),
            ]

            def test_add(self):
                # unittest prints str(test), which omits the scenario; only id() carries it.
                print("ID=" + self.id())
                self.assertEqual(self.a + self.b, self.expected)
        EOF
        cd /tmp/scen || exit 1
        if ! python${{vars.python-version}} -m unittest test_scen > /tmp/scen/out.log 2>&1; then
          cat /tmp/scen/out.log
          exit 1
        fi
        cat /tmp/scen/out.log
        grep -F 'ID=test_scen.TestAdd.test_add(small)' /tmp/scen/out.log
        grep -F 'ID=test_scen.TestAdd.test_add(large)' /tmp/scen/out.log
        grep -F 'Ran 2 tests' /tmp/scen/out.log
        grep -E '^OK' /tmp/scen/out.log
    - name: Failing scenario is reported as a failure
      runs: |
        mkdir -p /tmp/scenfail
        cat > /tmp/scenfail/test_bad.py <<'EOF'
        import testscenarios


        class TestBad(testscenarios.TestWithScenarios):
            scenarios = [
                ("good", {"value": 1}),
                ("bad", {"value": 2}),
            ]

            def test_value(self):
                self.assertEqual(self.value, 1)
        EOF
        cd /tmp/scenfail || exit 1
        if python${{vars.python-version}} -m unittest test_bad > /tmp/scenfail/out.log 2>&1; then
          cat /tmp/scenfail/out.log
          echo "ERROR: suite with a failing scenario exited 0"
          exit 1
        fi
        cat /tmp/scenfail/out.log
        grep -F 'Ran 2 tests' /tmp/scenfail/out.log
        grep -F 'FAILED (failures=1)' /tmp/scenfail/out.log
    - name: multiply_scenarios and generate_scenarios produce the cross product
      runs: |
        python${{vars.python-version}} <<'EOF'
        import unittest
        from testscenarios import generate_scenarios, multiply_scenarios

        colours = [("red", {"colour": "red"}), ("blue", {"colour": "blue"})]
        sizes = [("s", {"size": 1}), ("l", {"size": 9})]
        product = multiply_scenarios(colours, sizes)
        names = [name for name, _ in product]
        assert names == ["red,s", "red,l", "blue,s", "blue,l"], names
        assert product[3][1] == {"colour": "blue", "size": 9}, product[3]


        class T(unittest.TestCase):
            scenarios = product

            def test_it(self):
                assert self.colour in ("red", "blue")


        suite = unittest.TestLoader().loadTestsFromTestCase(T)
        tests = list(generate_scenarios(suite))
        ids = sorted(t.id().rsplit(".", 1)[1] for t in tests)
        assert ids == sorted(["test_it(%s)" % n for n in names]), ids
        result = unittest.TestResult()
        for t in tests:
            t.run(result)
        assert result.testsRun == 4 and result.wasSuccessful(), result
        print("generated", len(tests), "tests")
        EOF

update:
  enabled: true
  github:
    identifier: testing-cabal/testscenarios
    use-tag: true
