package:
  name: py3.14-testtools
  version: "2.8.4"
  epoch: 0
  description: Extensions to the Python standard library unit testing framework
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-setuptools

vars:
  pypi-package: testtools
  import: testtools
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8f3b59c6573229ef8c2ec815b2587b6d0866cdca
      repository: https://github.com/testing-cabal/testtools
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: testing-cabal/testtools

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
