package:
  name: py3.14-text-unidecode
  version: '1.3'
  epoch: 0
  description: The most basic Text::Unidecode port
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: text-unidecode
  import: text_unidecode
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a0005d7a0b43a6aa21ce8a63f1da48c6c44f03e1
      repository: https://github.com/kmike/text-unidecode
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: kmike/text-unidecode

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
