# Generated from https://pypi.org/project/threadloop/
package:
  name: py3.14-threadloop
  version: "1.0.3"
  epoch: 0
  description: Tornado IOLoop Backed Concurrent Futures
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-tornado

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

vars:
  import: threadloop
  pypi-package: threadloop
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 012913393384d3fec835f5c715e44102ab08731a
      repository: https://github.com/breerly/threadloop
      tag: ${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
      prevent-inclusion: tests

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: breerly/threadloop
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.import}}
        python: python${{vars.python-version}}
