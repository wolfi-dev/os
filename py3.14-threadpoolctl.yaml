package:
  name: py3.14-threadpoolctl
  version: "3.8.0"
  epoch: 0 # upstream-tests/pytest
  description: Python helpers to limit the number of threads used in native libraries
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: threadpoolctl
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py3.14-psutil # upstream-tests: test dependency
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/joblib/threadpoolctl
      expected-commit: b03db14a8567ba0b3b9b4aaf5ed011682f33da49
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # test_controller_parallelism_no_deadlocks spawns `python -m tests._dl_iterate_phdr_deadlock`
  # as a child process; the harness runs with PYTHONSAFEPATH=1, so the cwd is not on
  # sys.path and the `tests` package cannot be found. The harness keeps the caller's
  # PYTHONPATH, so add the (relative) cwd, where the test suite runs, to it.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
    environment:
      PYTHONPATH: "."

  - uses: strip

update:
  enabled: true
  github:
    identifier: joblib/threadpoolctl

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
