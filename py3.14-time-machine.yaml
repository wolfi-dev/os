package:
  name: py3.14-time-machine
  version: "3.6.0"
  epoch: 0
  description: Travel through time in your tests - fast date and time mocking via a CPython C extension
  copyright:
    - license: MIT

vars:
  pypi-package: time-machine
  import: time_machine
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/adamchainz/time-machine
      tag: ${{package.version}}
      expected-commit: 7434cabf2b539f5cb0ecfcb1e05864424acb3ee1

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: verify _time_machine C extension was built
    runs: |
      find ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages -maxdepth 1 -name '_time_machine*.so' | grep -q .

  - uses: strip

test:
  environment:
    contents:
      packages:
        # ZoneInfo("America/Los_Angeles") in the README example needs the zone files.
        - tzdata
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
          import _time_machine
    - name: README example - date.today() inside travel() returns the destination date
      runs: |
        python${{vars.python-version}} <<'EOF'
        import datetime as dt
        from zoneinfo import ZoneInfo
        import time_machine

        tz = ZoneInfo("America/Los_Angeles")
        with time_machine.travel(dt.datetime(1985, 10, 26, 1, 24, tzinfo=tz)):
            today = dt.date.today().isoformat()
        print("today inside travel:", today)
        assert today == "1985-10-26", today
        assert dt.date.today().year != 1985
        EOF
    - name: Frozen and ticking travel patch time, datetime and gmtime
      runs: |
        python${{vars.python-version}} <<'EOF'
        import datetime as dt
        import time
        import time_machine

        with time_machine.travel(0, tick=False):
            assert time.time() == 0, time.time()
            assert time.gmtime().tm_year == 1970
            assert dt.datetime.now(dt.timezone.utc) == dt.datetime(1970, 1, 1, tzinfo=dt.timezone.utc)
            assert time.strftime("%Y-%m-%d", time.gmtime()) == "1970-01-01"

        # tick=True starts at the destination and keeps advancing from there.
        with time_machine.travel(dt.datetime(2000, 1, 1, tzinfo=dt.timezone.utc), tick=True):
            first = time.time()
            time.sleep(0.05)
            second = time.time()
        assert 946684800 <= first < 946684860, first
        assert second > first, (first, second)

        # Outside travel the real clock is back.
        assert time.time() > 1_600_000_000
        print("travel ok")
        EOF
    - name: Traveller shift/move_to and decorator usage
      runs: |
        python${{vars.python-version}} <<'EOF'
        import datetime as dt
        import time
        import time_machine

        with time_machine.travel(0, tick=False) as traveller:
            traveller.shift(dt.timedelta(hours=1))
            assert time.time() == 3600, time.time()
            traveller.move_to(dt.datetime(2020, 2, 29, tzinfo=dt.timezone.utc))
            assert dt.datetime.now(dt.timezone.utc).date() == dt.date(2020, 2, 29)

        @time_machine.travel(dt.datetime(1999, 12, 31, 23, 59, tzinfo=dt.timezone.utc), tick=False)
        def frozen():
            return dt.datetime.now(dt.timezone.utc)

        assert frozen() == dt.datetime(1999, 12, 31, 23, 59, tzinfo=dt.timezone.utc)
        print("shift/move_to/decorator ok")
        EOF

update:
  enabled: true
  github:
    identifier: adamchainz/time-machine
    use-tag: true
