package:
  name: py3.14-tinydb
  version: "4.9.0"
  epoch: 0
  description: A tiny, document-oriented database
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: tinydb
  import: tinydb
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/msiemens/tinydb
      tag: v${{package.version}}
      expected-commit: 1e39ad3a2d9eca57efd9019fd089b5a04676da95

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}
      prevent-inclusion: melange-out

  - uses: strip

update:
  enabled: true
  github:
    identifier: msiemens/tinydb
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
