package:
  name: py3.14-tokenizers
  version: "0.23.3"
  epoch: 0
  description: Fast State-of-the-Art Tokenizers optimized for Research and Production
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-huggingface-hub

vars:
  pypi-package: tokenizers
  glibc-version: "2.44"
  module-name: tokenizers
  rust-version: "1.100"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-maturin
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools-rust
      - rust-${{vars.rust-version}}
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/huggingface/tokenizers
      tag: v${{package.version}}
      expected-commit: 301277072263fb3830eb66eec7e47adadf76f1dc

  - working-directory: bindings/python
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  git:
    strip-prefix: v
  ignore-regex-patterns:
    - ^python-v.*
    - ^node-v.*
    - ^rust-v.*

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.module-name}}
    - name: verify installation
      runs: |
        echo "
        from tokenizers import Tokenizer
        from tokenizers.models import BPE
        from tokenizers.trainers import BpeTrainer
        from tokenizers.pre_tokenizers import Whitespace

        tokenizer = Tokenizer(BPE())

        tokenizer.pre_tokenizer = Whitespace()

        trainer = BpeTrainer(vocab_size=5000, min_frequency=2)
        tokenizer.train_from_iterator([\"Hello, world! This is a test sentence.\", \"Another example sentence.\"], trainer)

        output = tokenizer.encode(\"Hello, world! This is a test sentence.\")
        print(\"Encoded tokens:\", output.ids)
        print(\"Decoded text:\", tokenizer.decode(output.ids))
        " | python${{vars.python-version}}
    - uses: test/tw/ldd-check
    - uses: test/tw/pip-check
