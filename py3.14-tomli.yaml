package:
  name: py3.14-tomli
  version: "2.5.0"
  epoch: 0 # go/wolfi-rsc/py3.14-tomli
  description: TOML parser
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: tomli
  import: tomli
  python-version: "3.14"

environment:
  contents:
    packages:
      - busybox
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-base

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/t/tomli/tomli-${{package.version}}.tar.gz
      expected-sha256: 264507556cd8b8c8e7c6ee037cdf443a463f03f4c958e57195e3d369711b8ff6

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  release-monitor:
    identifier: 207408
