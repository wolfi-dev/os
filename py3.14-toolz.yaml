package:
  name: py3.14-toolz
  version: "1.1.0"
  epoch: 0
  description: A set of utility functions for iterators, functions, and dictionaries.
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: toolz
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-versioneer

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 568c2b8393973cd172a466546c9d95779c452438
      repository: https://github.com/pytoolz/toolz
      tag: ${{package.version}}

  - name: Fix version (setuptools-git-versioning falls back to 0.0.0 without full git history)
    runs: |
      sed -i 's/dynamic = \["version"\]/version = "${{package.version}}"/' pyproject.toml

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pytoolz/toolz
    use-tag: true

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  environment:
    contents:
      packages:
        - jq
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
    - name: Test functionality - slightly modified example from docs
      runs: |
        cat > test.py <<EOF
        import json

        from ${{vars.pypi-package}} import compose, frequencies
        from ${{vars.pypi-package}}.curried import map

        def stem(word: str):
            """ Stem word to primitive form """
            return word.lower().rstrip(",.!:;'-\"").lstrip("'\"")

        wordcount = compose(frequencies, map(stem), str.split)
        sentence = "This cat jumped over this other cat!"

        print(json.dumps(wordcount(sentence)))
        EOF

        [ $(python${{vars.python-version}} test.py | jq '.cat') = 2 ]
