package:
  name: py3.14-tornado
  version: "6.5.10"
  epoch: 0
  description: Tornado is a Python web framework and asynchronous networking library, originally developed at FriendFeed.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: tornado
  import: tornado
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 143a06bad00bc49ee00dbf61c0b63cc3d23a52a7
      repository: https://github.com/tornadoweb/tornado
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  ignore-regex-patterns:
    - v*b\d*
  github:
    identifier: tornadoweb/tornado
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
