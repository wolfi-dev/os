package:
  name: py3.14-tox
  version: "4.64.8"
  epoch: 0
  description: Command line driven CI frontend and development task automation tool
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-cachetools
      - py${{vars.python-version}}-chardet
      - py${{vars.python-version}}-colorama
      - py${{vars.python-version}}-filelock
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-platformdirs
      - py${{vars.python-version}}-pluggy
      - py${{vars.python-version}}-pyproject_api
      - py${{vars.python-version}}-tomli
      - py${{vars.python-version}}-tomli-w
      - py${{vars.python-version}}-virtualenv
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: tox
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-docutils
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tox-dev/tox
      tag: ${{package.version}}
      expected-commit: e2b0ccb2dc55f9089217f378b4fea9e46bc715fd

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - runs: |
      # Rename tox binary to avoid conflict with other py3.X-tox versions
      mv ${{targets.destdir}}/usr/bin/tox ${{targets.destdir}}/usr/bin/tox-${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: tox-dev/tox

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - uses: test/tw/ver-check
      with:
        bins: tox-${{vars.python-version}}
