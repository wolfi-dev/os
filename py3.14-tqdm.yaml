package:
  name: py3.14-tqdm
  version: "4.70.1"
  epoch: 0
  description: Fast, Extensible Progress Meter
  copyright:
    - license: MPL-2.0 AND MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-colorama
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: tqdm
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools-scm
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tqdm/tqdm
      tag: v${{package.version}}
      expected-commit: 9cf5a12b1f955468a17f0ba3c59092b23e4258ac

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

  - name: "move usr/bin executables for -bin"
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

update:
  enabled: true
  github:
    identifier: tqdm/tqdm
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
