package:
  name: py3.14-traitlets
  version: "5.16.1"
  epoch: 0
  description: Traitlets Python configuration system
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: traitlets
  import: traitlets
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - rsync

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ipython/traitlets
      expected-commit: 7beeb105cd8c3adab38631daf2da9524f47166e2
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ipython/traitlets
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - uses: py/one-python
      with:
        content: |
          python3 -c 'from traitlets import HasTraits'
