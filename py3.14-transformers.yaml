package:
  name: py3.14-transformers
  version: "5.24.1"
  epoch: 0
  description: State-of-the-art Machine Learning for PyTorch, TensorFlow, and JAX
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-certifi
      - py${{vars.python-version}}-charset-normalizer
      - py${{vars.python-version}}-filelock
      - py${{vars.python-version}}-fsspec
      - py${{vars.python-version}}-huggingface-hub
      - py${{vars.python-version}}-idna
      - py${{vars.python-version}}-numpy-2.4
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-regex
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-safetensors
      - py${{vars.python-version}}-tokenizers
      - py${{vars.python-version}}-tqdm
      - py${{vars.python-version}}-typer
      - py${{vars.python-version}}-typing-extensions
      - py${{vars.python-version}}-urllib3
  resources:
    cpu: "2"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 4Gi

vars:
  glibc-version: "2.44"
  pypi-package: transformers
  module-name: transformers
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/huggingface/transformers
      tag: v${{package.version}}
      expected-commit: e68083bdf4035ba6d75976a3b7ce15c98a61f278

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: transformers

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v
  ignore-regex-patterns:
    - .*\.r.*
    - ^localattn.*
    - ^list$

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.module-name}}
