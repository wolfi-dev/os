package:
  name: py3.14-trio
  version: "0.35.0"
  epoch: 0
  description: A friendly Python library for async concurrency and I/O
  copyright:
    - license: MIT
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-attrs
      - py${{vars.python-version}}-cffi
      - py${{vars.python-version}}-exceptiongroup
      - py${{vars.python-version}}-idna
      - py${{vars.python-version}}-outcome
      - py${{vars.python-version}}-sniffio
      - py${{vars.python-version}}-sortedcontainers
  resources:
    cpu: "1"
    memory: 6Gi

vars:
  pypi-package: trio
  import: trio
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-trio/trio
      tag: v${{package.version}}
      expected-commit: 3b280b0b8eb86188edddd4d2e62fc947f0328f1e

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: python-trio/trio
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
