package:
  name: py3.14-truststore
  version: 0.10.4
  epoch: 0
  description: Verify certificates using OS trust stores
  copyright:
    - license: MIT

vars:
  pypi-package: truststore
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0714f72a739d182cdb8502f4e1bb4cf7ebfe4eb5
      repository: https://github.com/sethmlarson/truststore
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - .*\.dev.*
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
