package:
  name: py3.14-twython
  version: 3.9.1
  epoch: 0
  description: Actively maintained, pure Python wrapper for the Twitter API. Supports both normal and streaming Twitter APIs
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-requests-oauthlib
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: twython
  import: twython
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ryanmcgrath/twython
      expected-commit: 0c405604285364457f3c309969f11ba68163bd05
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ryanmcgrath/twython
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
