package:
  name: py3.14-typer
  version: "0.29.2"
  epoch: 0
  description: Typer, build great CLIs. Easy to code. Based on Python type hints.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-annotated-doc
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-pydantic
      - py${{vars.python-version}}-rich
      - py${{vars.python-version}}-shellingham
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: typer
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-pdm-backend

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fastapi/typer.git
      tag: ${{package.version}}
      expected-commit: 2517edde5a1292a712e2f16e600754c52c6f00d9

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            tee main.py <<'EOF'
            import typer

            def main(name: str):
                print(f"Hello, {name}")

            if __name__ == "__main__":
                typer.run(main)
            EOF

            typer main.py run --help | grep -E -ie "Usage: typer.*run.*name"
            typer main.py run Linky | grep -F -e "Hello, Linky"

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.pypi-package}}
    - runs: |
        tee main.py <<'EOF'
        import typer

        def main(name: str):
            print(f"Hello, {name}")

        if __name__ == "__main__":
            typer.run(main)
        EOF

        python${{vars.python-version}} main.py --help | grep -E -ie "Usage: main.py.*name"
        python${{vars.python-version}} main.py Linky | grep -F -e "Hello, Linky"
