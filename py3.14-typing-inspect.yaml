package:
  name: py3.14-typing-inspect
  version: 0.9.0
  epoch: 0
  description: Runtime inspection utilities for typing module.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-mypy-extensions
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "2"
    memory: 3Gi

vars:
  pypi-package: typing-inspect
  import: typing_inspect
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c014abf73c165dda826e4c25504f9250bbca9045
      repository: https://github.com/ilevkivskyi/typing_inspect
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ilevkivskyi/typing_inspect
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
