package:
  name: py3.14-typing-inspection
  version: "0.4.4"
  epoch: 0
  description: Runtime typing introspection tools
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: typing-inspection
  import: typing_inspection
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-hatch
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 83d4dbb74fc367db4403c76be8c0f83cd4b63fbe
      repository: https://github.com/pydantic/typing-inspection
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pydantic/typing-inspection
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
