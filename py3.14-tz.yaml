package:
  name: py3.14-tz
  version: "2026.6"
  epoch: 0
  description: Python3 definitions of world timezone
  copyright:
    - license: MIT

vars:
  pypi-package: tz
  module-name: pytz
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - wolfi-base

pipeline:
  - uses: fetch # blocked-no-github: PyPI source, no known git upstream
    with:
      uri: https://pypi.python.org/packages/source/p/pytz/pytz-${{package.version}}.tar.gz
      expected-sha512: 44e6453347143661842b605a3a02a08d007d40c1f749406d973ff919927c267de20bad69acfe558aa795f7e26eee628423533204f320b570cc535acfe32e6df5

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - 2023.3.post1
  release-monitor:
    identifier: 6537

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.module-name}}
