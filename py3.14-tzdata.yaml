package:
  name: py3.14-tzdata
  version: "2026.3"
  epoch: 0
  description: Provider of IANA time zone data
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: tzdata
  python-version: "3.14"

environment:
  contents:
    packages:
      - busybox
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python/tzdata
      tag: ${{package.version}}
      expected-commit: a44279419071b7aa41ebe7eca301ebb2e759571a

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: tzdata
    - runs: |
        # adapted from https://tzdata.readthedocs.io/en/latest/
        python${{vars.python-version}} -c '
        from importlib.resources import files
        from tzdata.zoneinfo import America
        with open(files(America).joinpath("New_York"), "rb") as f:
            assert f.read(4) == b"TZif"
        '

update:
  enabled: true
  ignore-regex-patterns:
    - 2021.2.post0
  github:
    identifier: python/tzdata
    use-tag: true
