package:
  name: py3.14-udev
  version: "0.24.5"
  epoch: 0
  description: Python bindings to libudev
  copyright:
    - license: LGPL-2.1-or-later
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: pyudev
  import: pyudev
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 65f292d491ea9e3edbb372365b8ed098b1735214
      repository: https://github.com/pyudev/pyudev
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pyudev/pyudev
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
