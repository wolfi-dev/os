package:
  name: py3.14-ujson
  version: "6.0.0"
  epoch: 0
  description: Ultra fast JSON decoder and encoder written in C with Python bindings.
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 6Gi

vars:
  pypi-package: ujson
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-setuptools-scm
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ultrajson/ultrajson
      tag: ${{package.version}}
      expected-commit: 12492c2deb0e60ac66da40dc15f06ba967ed3e0a

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ultrajson/ultrajson

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
