package:
  name: py3.14-uritemplate
  version: "4.2.0"
  epoch: 1 # upstream-tests/pytest
  description: Implementation of RFC 6570 URI Templates
  copyright:
    - license: BSD-3-Clause OR Apache-2.0
  resources:
    cpu: "2"
    memory: 2Gi

vars:
  pypi-package: uritemplate
  import: uritemplate
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-hyper/uritemplate
      tag: ${{package.version}}
      expected-commit: e89ada10dd4e9deb8c576f3f0de8a813fbea9c02

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: python-hyper/uritemplate

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
