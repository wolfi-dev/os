package:
  name: py3.14-uritools
  version: "6.1.3"
  epoch: 0
  description: URI parsing, classification and composition
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: uritools
  import: uritools
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tkem/uritools
      tag: v${{package.version}}
      expected-commit: 1908bfa847b319ee01fb83b100381b1cafad94c5

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    use-tag: true
    identifier: tkem/uritools
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
