package:
  name: py3.14-uuid-utils
  version: "1.2.0"
  epoch: 0
  description: Python3 UUID utils
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  glibc-version: "2.44"
  pypi-package: uuid-utils
  module-name: uuid_utils
  python-version: "3.14"
  rust-version: "1.100"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-${{vars.glibc-version}}-dev
      - py${{vars.python-version}}-maturin
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - rust-${{vars.rust-version}}
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f6f2cc584a0dacfb41edb002de2684530e1819c1
      repository: https://github.com/aminalaee/uuid-utils
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: aminalaee/uuid-utils

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.module-name}}
    - name: Exercise the native extension
      runs: |
        cat > uuid_utils_check.py <<'EOF'
        import uuid

        import uuid_utils

        u = uuid_utils.uuid4()
        assert u.version == 4 and len(str(u)) == 36, u
        assert uuid_utils.UUID(str(u)) == u
        assert uuid_utils.UUID(bytes=u.bytes) == u

        a, b = uuid_utils.uuid7(), uuid_utils.uuid7()
        assert a.version == 7 and b.version == 7, (a, b)
        assert a < b, (a, b)

        got = str(uuid_utils.uuid5(uuid_utils.NAMESPACE_DNS, "python.org"))
        assert got == str(uuid.uuid5(uuid.NAMESPACE_DNS, "python.org")), got

        assert str(uuid_utils.UUID(bytes=b"\x00" * 16)) == "00000000-0000-0000-0000-000000000000"
        assert str(uuid_utils.UUID(bytes=b"\xff" * 16)) == "ffffffff-ffff-ffff-ffff-ffffffffffff"
        for bad in (b"\x00" * 15, b"\x00" * 17):
            try:
                uuid_utils.UUID(bytes=bad)
            except ValueError:
                pass
            else:
                raise AssertionError(f"accepted {len(bad)} bytes")
        try:
            uuid_utils.UUID("not-a-uuid")
        except ValueError:
            pass
        else:
            raise AssertionError("accepted 'not-a-uuid'")
        print("uuid_utils OK")
        EOF
        python${{vars.python-version}} uuid_utils_check.py
