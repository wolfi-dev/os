package:
  name: py3.14-uv-dynamic-versioning
  version: "0.14.1"
  epoch: 0
  description: Dynamic versioning tool for uv/hatch, powered by dunamai
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-dunamai
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-pydantic
      - py${{vars.python-version}}-tomlkit

vars:
  pypi-package: uv-dynamic-versioning
  module-name: uv_dynamic_versioning
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ninoseki/uv-dynamic-versioning
      tag: v${{package.version}}
      expected-commit: 18330168f9437aa2b4a0f272384a88adc0fc3ed7

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            set -euo pipefail
            cat <<EOF > pyproject.toml
            [project]
            name = "test-project"
            dynamic = ["version"]
            [tool.uv-dynamic-versioning]
            enable = true
            source = "tag"
            fallback_version = "0.1.0"
            EOF
            uv-dynamic-versioning

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.module-name}}
