package:
  name: py3.14-uvicorn
  version: "0.54.0"
  epoch: 0
  description: Uvicorn is an ASGI web server implementation for Python
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-h11
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: uvicorn
  import: uvicorn
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/encode/uvicorn
      tag: ${{package.version}}
      expected-commit: 3eb9a9ab9af69005c687728097461c1fd2a95db9

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: encode/uvicorn

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
