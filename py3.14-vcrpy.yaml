package:
  name: py3.14-vcrpy
  version: "8.4.0"
  epoch: 0
  description: Automatically mock your HTTP interactions to simplify and speed up testing
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-urllib3
      - py${{vars.python-version}}-wrapt
      - py${{vars.python-version}}-yarl
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: vcrpy
  import: vcr
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kevin1024/vcrpy
      tag: v${{package.version}}
      expected-commit: 9daef64c0497f5ce1d125fe53ec83afccba4027c

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: kevin1024/vcrpy
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
