package:
  name: py3.14-vcs-versioning
  version: "2.6.0"
  epoch: 0
  description: the blessed package to manage your versions by scm tags
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-tomli
      - py${{vars.python-version}}-typing-extensions
  resources:
    cpu: "4"
    memory: 4Gi

vars:
  pypi-package: vcs-versioning
  module-name: vcs_versioning
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-tomli
      - py${{vars.python-version}}-typing-extensions
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/setuptools_scm
      tag: vcs-versioning-v${{package.version}}
      expected-commit: fa5c2319fef46bea5e387e1329245e7eaffa6f1e

  - working-directory: vcs-versioning
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        import: ${{vars.module-name}}

update:
  enabled: true
  github:
    identifier: pypa/setuptools_scm
    strip-prefix: vcs-versioning-v
    tag-filter-prefix: vcs-versioning-v
