package:
  name: py3.14-vcsgraph
  version: "0.3.2"
  epoch: 0
  description: Graph algorithms for version control systems
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "2"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: vcsgraph
  import: vcsgraph
  rust-version: "1.98"
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-setuptools-rust
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/breezy-team/vcsgraph
      tag: v${{package.version}}
      expected-commit: 9a2a597b520f09bef3df7c139cd305db3bbecb09

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: breezy-team/vcsgraph
    use-tag: true
    tag-filter-prefix: v
    strip-prefix: v
  ignore-regex-patterns:
    - ^cs-graph-.* # vcs-graph-* tags start with "v", but refer to the Rust crate

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - uses: test/tw/ldd-check
