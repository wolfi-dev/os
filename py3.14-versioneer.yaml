package:
  name: py3.14-versioneer
  version: '0.29'
  epoch: 0
  description: Easy VCS-based management of project version strings
  copyright:
    - license: Unlicense
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: versioneer
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-versioneer/python-versioneer
      tag: ${{package.version}}
      expected-commit: 28c613dbef5fce09dc3ba6b1baa811c2d76b2245

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: "move usr/bin executables for -bin"
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: python-versioneer/python-versioneer

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
