package:
  name: py3.14-versioningit
  version: "3.3.0"
  epoch: 0
  description: Python packaging plugin to determine version based on git tags
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-tomli

vars:
  pypi-package: versioningit
  import: versioningit
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jwodder/versioningit
      tag: v${{package.version}}
      expected-commit: 2e37331898744a9c0ef00dc5d0250bce61e1c5d1

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: jwodder/versioningit
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
