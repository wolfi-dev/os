package:
  name: py3.14-virtualenv
  version: "21.7.9"
  epoch: 0 # CVE-2026-13346
  description: Virtual Python Environment builder
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-distlib
      - py${{vars.python-version}}-filelock
      - py${{vars.python-version}}-importlib-metadata
      - py${{vars.python-version}}-platformdirs
      - py${{vars.python-version}}-python-discovery

vars:
  python-version: 3.14
  pypi-package: virtualenv
  import: virtualenv

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/virtualenv
      tag: ${{package.version}}
      expected-commit: abd3829378b6c14369962b43907f92049bb962e8

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: Remove vulnerable embedded pip seed wheels
    runs: |
      # Remove vulnerable pip seed wheels from the embed directory.
      # pip-26.0.1: GHSA-58qw-9mgm-455v (CVE-2026-3219) fixed in pip 26.1.
      # pip-26.2.1 (safe) is already embedded in virtualenv 21.7.5 source.
      # CVE-2026-13346 (GHSA-qwm4-qh6w-59xr) fixed in pip 26.2.
      EMBED="${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/virtualenv/seed/wheels/embed"
      rm -f "${EMBED}"/pip-26.0.1-py3-none-any.whl

  - uses: strip

test:
  pipeline:
    - runs: |
        virtualenv -h
        virtualenv --version
        virtualenv --help
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: pypa/virtualenv
    use-tag: true
