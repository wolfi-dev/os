package:
  name: py3.14-wcmatch
  version: "12.0.4"
  epoch: 0 # upstream-tests/pytest
  description: Wilcard File Name matching library.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-bracex
  resources:
    cpu: "3"
    memory: 5Gi

vars:
  pypi-package: wcmatch
  import: wcmatch
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-bracex # upstream-tests: runtime dependency
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/facelessuser/wcmatch
      tag: ${{package.version}}
      expected-commit: 36f3cf07e1890399a00928d362a7a44e6effe53d

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # These TestTilde cases expect ~ to expand to a populated home; HOME is an empty scratch dir in the build.
  # TODO(upstream-tests): drop once HOME has content in the test environment.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore: tests/test_globmatch.py::TestTilde::test_tilde_globmatch_no_realpath tests/test_globmatch.py::TestTilde::test_tilde_globmatch_no_tilde

  - uses: strip

update:
  enabled: true
  github:
    identifier: facelessuser/wcmatch

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - runs: |
        # Create test files
        touch test_file.txt
        touch another_test_file.txt

        # Test basic file matching with wcmatch
        python${{vars.python-version}} -c '
        import wcmatch
        from wcmatch import glob
        # Test glob functionality
        matched_files = glob.glob("test_file.txt")
        print("Matched files:", matched_files)
        assert "test_file.txt" in matched_files
        print("wcmatch glob test passed")
        '

        python${{vars.python-version}} -c '
        # Test multiple file matching with wcmatch
        import wcmatch
        from wcmatch import glob
        # Test glob functionality with multiple files
        matched_files = glob.glob("*.txt")
        print("Matched .txt files:", matched_files)
        assert "test_file.txt" in matched_files
        assert "another_test_file.txt" in matched_files
        print("wcmatch multiple file glob test passed")
        '
