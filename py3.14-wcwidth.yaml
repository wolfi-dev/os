# Generated from https://pypi.org/project/wcwidth/
package:
  name: py3.14-wcwidth
  version: "0.9.2"
  epoch: 1
  description: Measures the displayed width of unicode strings in a terminal
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 6Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}-base
      - wolfi-base

vars:
  pypi-package: wcwidth
  python-version: "3.14"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jquast/wcwidth
      tag: ${{package.version}}
      expected-commit: f1793abb4ebace173e307294fc15d8eb0d8fdb88

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: jquast/wcwidth

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
