package:
  name: py3.14-webcolors
  version: "25.10.0"
  epoch: 0
  description: A library for working with HTML/CSS color formats in Python.
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: webcolors
  import: webcolors
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-pdm-backend
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e6392ba6eeba81b02e666eb3ed02ef2e006344c0
      repository: https://github.com/ubernostrum/webcolors
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: ubernostrum/webcolors
    use-tag: true

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
    - name: Test basic webcolors functionality
      runs: |
        cat >> test.py <<EOF
        import ${{vars.import}}

        assert ${{vars.import}}.hex_to_name("#daa520") == "goldenrod"

        color = ${{vars.import}}.html5_parse_legacy_color("chucknorris")

        assert (color.red, color.green, color.blue) == (192, 0, 0)
        EOF

        python${{vars.python-version}} test.py
