package:
  name: py3.14-webencodings
  version: 0.5.1
  epoch: 0
  description: Character encoding aliases for legacy web content
  copyright:
    - license: BSD-3-Clause
  dependencies:
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 6Gi

vars:
  module_name: webencodings
  pypi-package: webencodings
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: fa2cb5d75ab41e63ace691bc0825d3432ba7d694
      repository: https://github.com/gsnedders/python-webencodings
      tag: v${{package.version}}

  - name: Python Build
    uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: true
  github:
    identifier: gsnedders/python-webencodings
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - name: Import Test
      uses: python/import
      with:
        import: ${{vars.module_name}}
        python: python${{vars.python-version}}
