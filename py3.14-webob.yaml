package:
  name: py3.14-webob
  version: "1.8.11"
  epoch: 0
  description: "WebOb provides objects for HTTP requests and responses wrapping the WSGI request environment."
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-legacy-cgi

vars:
  pypi-package: webob
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-legacy-cgi # upstream-tests: runtime dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Pylons/webob
      tag: ${{package.version}}
      expected-commit: ebf7054032ae2fb93c51c5fd3fc0adb24cc29af3

  # Python 3.14 enlarged io.DEFAULT_BUFFER_SIZE; backport upstream 447975f
  # so test_interrupted_request no longer assumes the old 8192-byte buffer.
  # Drop once a webob release includes it.
  - uses: patch
    with:
      patches: python-3.14-default-buffer-size.patch

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: Pylons/webob
    use-tag: true

test:
  environment:
    contents:
      packages:
        - py${{vars.python-version}}-pytest
  pipeline:
    - uses: git-checkout
      with:
        repository: https://github.com/Pylons/webob
        tag: ${{package.version}}
        expected-commit: ebf7054032ae2fb93c51c5fd3fc0adb24cc29af3
    # Same test fix as the build pipeline, for the checked-out tests.
    - uses: patch
      with:
        patches: python-3.14-default-buffer-size.patch
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - runs: |
        python${{vars.python-version}} -m pytest tests
