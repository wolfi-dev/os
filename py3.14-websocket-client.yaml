package:
  name: py3.14-websocket-client
  version: "1.10.0"
  epoch: 2 # upstream-tests/pytest
  description: WebSocket client for Python with low level API options
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: websocket-client
  import: websocket
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-websockets # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/websocket-client/websocket-client/
      tag: v${{package.version}}
      expected-commit: b6cff278b0bfa515884da4037a175e2fe9318c7e

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # compliance/test_fuzzingclient.py needs the Autobahn fuzzing server, and test_bad_urls opens
  # real connections; the build has neither a server nor network.
  # TODO(upstream-tests): drop once upstream gates these behind an env var.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      ignore-files: compliance/test_fuzzingclient.py
      ignore: websocket/tests/test_websocket.py::HandshakeTest::test_bad_urls

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: websocket-client/websocket-client
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
