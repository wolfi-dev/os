package:
  name: py3.14-websocket-client
  version: "1.9.2"
  epoch: 0
  description: WebSocket client for Python with low level API options
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 3Gi

vars:
  pypi-package: websocket-client
  import: websocket
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/websocket-client/websocket-client/
      tag: v${{package.version}}
      expected-commit: 12225f5ce6e27536be3b0da85fd763ed75581bcc

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: websocket-client/websocket-client
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
