# Generated from https://pypi.org/project/websockets/
package:
  name: py3.14-websockets
  version: "17.2"
  epoch: 0
  description: An implementation of the WebSocket Protocol (RFC 6455 & 7692)
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: websockets
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a1664f4c5a7c71bf5391ad0c3c518e431f6261fb
      repository: https://github.com/python-websockets/websockets
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: "move usr/bin executables for -bin"
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

update:
  enabled: true
  github:
    identifier: python-websockets/websockets
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
