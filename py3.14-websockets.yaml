# Generated from https://pypi.org/project/websockets/
package:
  name: py3.14-websockets
  version: "17.4"
  epoch: 2 # restore -bin subpackage dropped in the split
  description: An implementation of the WebSocket Protocol (RFC 6455 & 7692)
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: websockets
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 625a59ed613ac60e60d577dd64b8641d59ecb2b1
      repository: https://github.com/python-websockets/websockets
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: "move usr/bin executables for -bin"
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: websockets

update:
  enabled: true
  github:
    identifier: python-websockets/websockets
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
