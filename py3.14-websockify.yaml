package:
  name: py3.14-websockify
  version: "0.13.0"
  epoch: 0
  description: WebSockets support for any application/server
  copyright:
    - license: LGPL-3.0-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-jwcrypto
      - py${{vars.python-version}}-numpy-2.5
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-simplejson

vars:
  pypi-package: websockify
  import: websockify
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/novnc/websockify
      tag: v${{package.version}}
      expected-commit: e81894751365afc19fe64fc9d0e5c6fc52655c36

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - name: move usr/bin executables for -bin
    runs: |
      mkdir -p ./cleanup/${{vars.python-version}}/
      mv ${{targets.contextdir}}/usr/bin ./cleanup/${{vars.python-version}}/

  - uses: strip

subpackages:
  - name: py${{vars.python-version}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - py${{vars.python-version}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{vars.python-version}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: websockify

update:
  enabled: true
  github:
    identifier: novnc/websockify
    strip-prefix: v

test:
  pipeline:
    # No pip-check: upstream lists redis in install_requires, but it is only
    # imported lazily by the redis token plugin and has no os/ package.
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
    # websockify silently falls back to pure python without numpy; check
    # numpy loads and its frame unmasking matches the fallback.
    - runs: |
        python${{vars.python-version}} - <<'EOF'
        import os
        from websockify import websocket
        assert websocket.numpy is not None, "numpy not importable"
        unmask = websocket.WebSocket._unmask
        mask = b"\x12\x34\x56\x78"
        for n in range(0, 37):
            buf = os.urandom(n)
            fast = unmask(None, buf, mask)
            np_mod, websocket.numpy = websocket.numpy, None
            slow = unmask(None, buf, mask)
            websocket.numpy = np_mod
            assert fast == slow, (n, fast, slow)
        EOF
