package:
  name: py3.14-werkzeug
  version: "3.1.9"
  epoch: 0
  description: The comprehensive WSGI web application library.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-markupsafe
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: werkzeug
  import: werkzeug
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-flit-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pallets/werkzeug/
      tag: ${{package.version}}
      expected-commit: 6604c3b8784ecc7cf5ac0b7412d916989b4c7d45

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: pallets/werkzeug
    use-tag: true
  ignore-regex-patterns:
    - .*\.x$

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
