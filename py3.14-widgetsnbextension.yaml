package:
  name: py3.14-widgetsnbextension
  version: "4.0.16"
  epoch: 0
  description: Jupyter interactive widgets for Jupyter Notebook
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: widgetsnbextension
  import: widgetsnbextension
  glibc-version: "2.44"
  python-version: "3.14"

environment:
  contents:
    packages:
      - cmake
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-jupyter-packaging

pipeline:
  - uses: fetch # blocked-no-github: PyPI source, no known git upstream
    with:
      expected-sha256: adeea0ae78f0856ee4945f413299801b82a0a01416303301f39a704282a37b73
      uri: https://files.pythonhosted.org/packages/source/w/widgetsnbextension/widgetsnbextension-${{package.version}}.tar.gz

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 84223

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
