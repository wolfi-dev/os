# Generated from https://pypi.org/project/xattr/
package:
  name: py3.14-xattr
  version: "1.3.0"
  epoch: 0
  description: Python wrapper for extended filesystem attributes
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-cffi
  resources:
    cpu: "2"
    memory: 4Gi

vars:
  pypi-package: xattr
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-cffi
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/xattr/xattr
      tag: v${{package.version}}
      expected-commit: 29c9c064edb93ad4328c50c6da60a6330eb68297

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - test-*
  github:
    identifier: xattr/xattr
    use-tag: true
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - uses: test/tw/help-check
      with:
        bins: xattr
