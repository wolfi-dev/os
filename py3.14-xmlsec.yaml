package:
  name: py3.14-xmlsec
  version: "1.3.18"
  epoch: 0 # rebuild against new xmlsec
  description: About Python bindings for the XML Security Library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - openssl-${{vars.openssl-version}}
      - openssl-${{vars.openssl-version}}-dev
      - py${{vars.python-version}}-lxml
      - xmlsec
      - xmlsec-openssl
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  openssl-version: "4.0"
  pypi-package: xmlsec
  import: xmlsec
  python-version: "3.14"

environment:
  contents:
    packages:
      - git
      - glibc-2.44-dev
      - libffi
      - libffi-dev
      - libxml2
      - libxml2-dev
      - libxslt-dev
      - openssl-hardened-${{vars.openssl-version}}-dev
      - pkgconf
      - pkgconf-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-gpep517
      - py${{vars.python-version}}-lxml
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pkgconfig
      - xmlsec
      - xmlsec-dev
      - xmlsec-openssl
  environment:
    CFLAGS: -Wno-error=incompatible-pointer-types

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f9382737513bebe3e95277127e7344f2d4b45ff0
      repository: https://github.com/xmlsec/python-xmlsec
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: xmlsec/python-xmlsec
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
