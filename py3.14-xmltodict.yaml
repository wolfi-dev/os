package:
  name: py3.14-xmltodict
  version: "1.0.4"
  epoch: 0
  description: Makes working with XML feel like you are working with JSON
  copyright:
    - license: MIT
  resources:
    cpu: "4"
    memory: 4Gi

vars:
  pypi-package: xmltodict
  import: xmltodict
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/martinblech/xmltodict
      tag: v${{package.version}}
      expected-commit: 8d7f1fdb2251b5dc3b98df447850cb8229defc32

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    use-tag: true
    identifier: martinblech/xmltodict
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
