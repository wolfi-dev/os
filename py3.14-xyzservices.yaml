package:
  name: py3.14-xyzservices
  version: "2026.9.1"
  epoch: 0
  description: Source of XYZ tiles providers
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 10Gi
  test-resources:
    cpu: "2"
    memory: 20Gi

vars:
  pypi-package: xyzservices
  import: xyzservices
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 45214365ec6399f0cc2d07e213167fb3981f8521
      repository: https://github.com/geopandas/xyzservices
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: geopandas/xyzservices

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
