package:
  name: py3.14-yamale
  version: "6.1.0"
  epoch: 0
  description: "A schema and validator for YAML."
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-pyyaml

vars:
  pypi-package: yamale
  import: yamale
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-pyyaml # upstream-tests: runtime dependency
      - py${{vars.python-version}}-ruamel-yaml # upstream-tests: test dependency

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/23andMe/Yamale
      tag: ${{package.version}}
      expected-commit: 09a5b658b3a2e40e6e7737a4e057f1ae1c0491ad

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{vars.python-version}}
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/bin
    test:
      environment:
        contents:
          packages:
            - py${{vars.python-version}}-ruamel-yaml
            - python-${{vars.python-version}}
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: yamale
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: yamale
        - name: "Functional tests on samples"
          runs: |
            # Schema file
            cat <<EOF > schema.yaml
            name: str()
            age: int(min=0)
            extra_field: str(required=False)
            EOF
            # Valid data
            cat <<EOF > valid.yaml
            name: Alice
            age: 30
            extra_field: something
            EOF
            # Invalid data (age < 0)
            cat <<EOF > invalid.yaml
            name: Bob
            age: -5
            EOF
            # Second valid file
            cat <<EOF > valid_p2.yaml
            name: Charlie
            age: 40
            EOF
            # Test yamale
            yamale -s schema.yaml valid.yaml | grep -F "Validation success"
            # yamale must exit non-zero for invalid data; capture output and verify
            if out=$(yamale -s schema.yaml invalid.yaml 2>&1); then
              echo "ERROR: Expected yamale to fail on invalid data, but it succeeded"
              exit 1
            fi
            echo "$out" | grep -F "Validation failed"
            yamale -s schema.yaml . --exclude "invalid.yaml" --cpu-num 1  --no-strict --verbose | grep -F "Validation success"
            # Testing with ruamel parser instead of pyyaml(default)
            yamale -s schema.yaml valid.yaml --parser ruamel
        - name: "Python Import test"
          runs: |
            cat << EOF > yamale_test.py
            import yamale
            import sys
            # Load the schema and data
            schema = yamale.make_schema('schema.yaml')
            data = yamale.make_data('valid.yaml')
            # Validate
            try:
                yamale.validate(schema, data)
                print("Validation success")
            except yamale.YamaleError as e:
                print("Validation failed!")
                print(e)
                sys.exit(1)
            EOF
            python${{vars.python-version}} yamale_test.py

update:
  enabled: true
  github:
    identifier: 23andMe/Yamale
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
