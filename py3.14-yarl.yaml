package:
  name: py3.14-yarl
  version: "1.25.1"
  epoch: 0
  description: Yet another URL library
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-idna
      - py${{vars.python-version}}-multidict
      - py${{vars.python-version}}-propcache
  resources:
    cpu: "3"
    memory: 6Gi

vars:
  pypi-package: yarl
  python-version: "3.14"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-cython
      - py${{vars.python-version}}-expandvars
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-base-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 604eb6da83267f4e8faf1512ffeabc23df10052e
      repository: https://github.com/aio-libs/yarl
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: aio-libs/yarl
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
