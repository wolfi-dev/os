package:
  name: py3.14-ydiff
  version: "1.5"
  epoch: 2 # upstream-tests/pytest
  description: "View colored, incremental diff in workspace or from stdin, side by side and auto paged"
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: ydiff
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-pygments # upstream-tests: test dependency
      - py${{vars.python-version}}-pytest # upstream-tests: test runner

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ymattw/ydiff.git
      tag: ${{package.version}}
      expected-commit: 58df197c054767d9c20625c8cb7cd7793b595da3

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  # The suite is unittest-based and reads stdin's fileno, which pytest's capture replaces; run it with unittest.
  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      runner: unittest

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: ymattw/ydiff
    use-tag: true
  ignore-regex-patterns:
    - ^_demo_diff$

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
