package:
  name: py3.14-zaproxy
  version: "0.6.0"
  epoch: 0
  description: ZAP Python API
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-six
  resources:
    cpu: "3"
    memory: 4Gi

vars:
  pypi-package: zaproxy
  import: zapv2
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-poetry

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/zaproxy/zap-api-python/
      expected-commit: 0f0e3e9589e992796c9ea855ff62928e15149b81
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - .*\.dev1$
  github:
    identifier: zaproxy/zap-api-python
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
