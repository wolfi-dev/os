package:
  name: py3.14-zict
  version: 3.0.0
  epoch: 0
  description: Useful Mutable Mappings
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: zict
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: bb17ff367d788a9430eeafff36126d8db0499ad0
      repository: https://github.com/dask/zict
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: dask/zict
    use-tag: true

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - name: Test basic functionality
      runs: |
        cat > test.py <<EOF
        import pickle
        import zlib

        from ${{vars.pypi-package}} import File, Func, LRU

        a = File("mydir/")
        b = Func(zlib.compress, zlib.decompress, a)
        c = Func(pickle.dumps, pickle.loads, b)
        d = LRU(100, c)

        d["x"] = [1, 2, 3]

        assert d["x"] == [1, 2, 3]
        EOF

        python${{vars.python-version}} test.py
