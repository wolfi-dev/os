package:
  name: py3.14-zipremove
  version: "0.10.0"
  epoch: 0
  description: "Provide an extended `zipfile.ZipFile` with remove-related capabilities"
  copyright:
    - license: MIT

vars:
  pypi-package: zipremove
  import: zipremove
  python-version: 3.14

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/danny0838/zipremove
      tag: v${{package.version}}
      expected-commit: 7a145aa0bdaad4409db7d7a7d77c25b1eadf8695

  - uses: py/pip-build-install

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        import: ${{vars.import}}

update:
  enabled: true
  git:
    strip-prefix: v
