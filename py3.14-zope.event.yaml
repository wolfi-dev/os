package:
  name: py3.14-zope.event
  version: "6.2"
  epoch: 1 # upstream-tests/pytest
  description: Very basic event publishing system
  copyright:
    - license: ZPL-2.1
  dependencies:
    runtime:
      - py${{vars.python-version}}-setuptools
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: zope.event
  import: zope.event
  python-version: "3.14"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base
      - py3.14-pytest # upstream-tests: test runner
      - py3.14-pytest-timeout # upstream-tests: per-test timeout
      - py3.14-setuptools # upstream-tests: runtime dependency

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f0cebf5cea5f508db25b9aec67cc27c5e2d63a34
      repository: https://github.com/zopefoundation/zope.event
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  manual: false
  github:
    identifier: zopefoundation/zope.event
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
