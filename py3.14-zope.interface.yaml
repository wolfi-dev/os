package:
  name: py3.14-zope.interface
  version: "8.6"
  epoch: 0
  description: Interfaces for Python
  copyright:
    - license: ZPL-2.1
  dependencies:
    runtime:
      - py${{vars.python-version}}-setuptools
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: zope.interface
  import: zope.interface
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0a49a169b1a8b3476011d5a87e120ed150d017c6
      repository: https://github.com/zopefoundation/zope.interface
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  # 6.4.post0 (and .post1, .post2) were re-releases of 6.4 due to pypi publishing problems.
  ignore-regex-patterns:
    - '[.]post\d+$'
  github:
    identifier: zopefoundation/zope.interface
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
