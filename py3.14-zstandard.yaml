package:
  name: py3.14-zstandard
  version: "0.25.0"
  epoch: 0
  description: Zstandard bindings for Python
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py${{vars.python-version}}-cffi
  resources:
    cpu: "2"
    memory: 7Gi

vars:
  pypi-package: zstandard
  import: zstandard
  python-version: "3.14"

environment:
  contents:
    packages:
      - glibc-2.44-dev
      - py${{vars.python-version}}-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/indygreg/python-zstandard
      tag: ${{package.version}}
      expected-commit: 7a77a7510b8ce068e4a103d29aea1b5ec829d8b6

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: indygreg/python-zstandard
    use-tag: true

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}
