package:
  name: py3.15-colorama
  version: 0.4.6
  epoch: 2 # OS-5653 - pytest-timeout 2.5.x has a breaking change, use 2.4.x stream
  description: Simple cross-platform colored terminal text
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: colorama
  pytest-timeout-version: "2.4.0"
  python-version: "3.15"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-wheel
      - py3.15-pytest # upstream-tests: test runner
      - py3.15-pytest-timeout~${{vars.pytest-timeout-version}}
      - python-${{vars.python-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tartley/colorama
      tag: ${{package.version}}
      expected-commit: 3de9f013df4b470069d03d250224062e8cf15c49

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}

update:
  enabled: true
  github:
    identifier: tartley/colorama
    use-tag: true
