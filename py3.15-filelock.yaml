package:
  name: py3.15-filelock
  version: "4.2.10"
  epoch: 0 # Python 3.15 version needed by an escalation
  description: A platform independent file lock.
  copyright:
    - license: Unlicense
  dependencies:
    runtime:
      - py${{vars.python-version}}-typing-extensions
  resources:
    memory: 7Gi

vars:
  pypi-package: filelock
  import: filelock
  python-version: "3.15"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-python-sbom
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/benediktschmitt/py-filelock
      tag: ${{package.version}}
      expected-commit: f9e562169e2580019e3fd96e66d8e0accf57fe4a

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: benediktschmitt/py-filelock
    use-tag: true
