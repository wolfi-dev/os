package:
  name: py3.15-iniconfig
  version: "2.3.1"
  epoch: 2 # OS-5653 - pytest-timeout 2.5.x has a breaking change, use 2.4.x stream
  description: brain-dead simple parsing of ini files
  copyright:
    - license: MIT

vars:
  import: iniconfig
  pypi-package: iniconfig
  pytest-timeout-version: "2.4.0"
  python-version: "3.15"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-wheel
      - py3.15-pytest # upstream-tests: test runner
      - py3.15-pytest-timeout~${{vars.pytest-timeout-version}}
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytest-dev/iniconfig
      expected-commit: 316fbfaf2752d89326e1e75b45cd070f5b5ace9a
      tag: v${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: pytest-dev/iniconfig
    strip-prefix: v
    tag-filter: v
