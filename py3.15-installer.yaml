package:
  name: py3.15-installer
  version: "1.1.0"
  epoch: 0 # Python 3.15 version needed for py3.15-filelock
  description: A library for installing Python wheels.
  copyright:
    - license: "MIT"
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  pypi-package: installer
  import: installer
  python-version: "3.15"

environment:
  contents:
    packages:
      - busybox
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/installer.git
      tag: ${{package.version}}
      expected-commit: 509a9b7160decebe9aa0aff429c12837346c86ef

  - uses: py/pip-build-install-bootstrap
    with:
      python: python${{vars.python-version}}

test:
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import installer

update:
  enabled: true
  github:
    identifier: pypa/installer
    use-tag: true
