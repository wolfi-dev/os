package:
  name: py3.15-installer
  version: "1.1.0"
  epoch: 2 # OS-5653 - pytest-timeout 2.5.x has a breaking change, use 2.4.x stream
  description: A library for installing Python wheels.
  copyright:
    - license: "MIT"
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  import: installer
  pypi-package: installer
  pytest-timeout-version: "2.4.0"
  python-version: "3.15"

environment:
  contents:
    packages:
      - busybox
      - py3.15-pytest # upstream-tests: test runner
      - py3.15-pytest-timeout~${{vars.pytest-timeout-version}}
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/installer.git
      tag: ${{package.version}}
      expected-commit: 509a9b7160decebe9aa0aff429c12837346c86ef

  - uses: py/pip-build-install-bootstrap
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

test:
  environment:
    contents:
      packages:
        - git
        - py${{vars.python-version}}-pytest
  pipeline:
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import installer
    - runs: |
        git clone --branch ${{package.version}} https://github.com/pypa/installer.git py${{vars.python-version}}-installer
        cd py${{vars.python-version}}-installer
        cp -r tests ../
        cd ../tests
        python${{vars.python-version}} -m pytest .

update:
  enabled: true
  github:
    identifier: pypa/installer
    use-tag: true
