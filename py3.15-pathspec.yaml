package:
  name: py3.15-pathspec
  version: "1.1.1"
  epoch: 2 # OS-5653 - pytest-timeout 2.5.x has a breaking change, use 2.4.x stream
  description: Utility library for gitignore style pattern matching of file paths
  copyright:
    - license: MPL-2.0

vars:
  pypi-package: pathspec
  pytest-timeout-version: "2.4.0"
  python-version: "3.15"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip
      - py3.15-pytest # upstream-tests: test runner
      - py3.15-pytest-timeout~${{vars.pytest-timeout-version}}
      - py3.15-typing-extensions # upstream-tests: test dependency
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cpburnz/python-pathspec
      tag: v${{package.version}}
      expected-commit: ecf71a99ca739479d450b9830f43416ea0c519c7

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}

update:
  enabled: true
  github:
    identifier: cpburnz/python-pathspec
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
