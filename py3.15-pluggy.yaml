package:
  name: py3.15-pluggy
  version: "1.7.0"
  epoch: 0 # Python 3.15 version needed for py3.15-filelock
  description: Plugin management and hook calling for Python
  copyright:
    - license: MIT

vars:
  pypi-package: pluggy
  python-version: "3.15"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools-scm
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytest-dev/pluggy
      tag: ${{package.version}}
      expected-commit: 4c7f6365f2dde09c11e72db67d0f615231d64c19

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}

update:
  enabled: true
  github:
    identifier: pytest-dev/pluggy
    use-tag: true
