package:
  name: py3.15-pyparsing
  version: "3.3.3"
  epoch: 0 # Python 3.15 version needed for py3.15-filelock
  description: pyparsing module - Classes and methods to define and execute parsing grammars
  copyright:
    - license: MIT

vars:
  pypi-package: pyparsing
  import: pyparsing
  python-version: "3.15"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pyparsing/pyparsing
      tag: ${{package.version}}
      expected-commit: d90d38b283efaece7ac7cace7050ba55cb82abe5

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import ${{vars.import}}

update:
  ignore-regex-patterns:
    - pyparsing_.*
  enabled: true
  github:
    identifier: pyparsing/pyparsing
