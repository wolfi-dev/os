package:
  name: py3.15-pyproject-hooks
  version: "1.3.3"
  epoch: 2 # OS-5653 - pytest-timeout 2.5.x has a breaking change, use 2.4.x stream
  description: A low-level library for calling build-backends in `pyproject.toml`-based project
  copyright:
    - license: MIT

vars:
  import: pyproject_hooks
  pypi-package: pyproject-hooks
  pytest-timeout-version: "2.4.0"
  python-version: "3.15"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip
      - py3.15-pytest # upstream-tests: test runner
      - py3.15-pytest-timeout~${{vars.pytest-timeout-version}}
      - py3.15-testpath # upstream-tests: test dependency
      - python-${{vars.python-version}}-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/pyproject-hooks
      tag: v${{package.version}}
      expected-commit: 184c9f56a87ede1276a5b33f5024204adb792cd2

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  ignore-regex-patterns:
    - a
    - b
    - rc
    - post
  github:
    identifier: pypa/pyproject-hooks
    use-tag: true
    strip-prefix: v
