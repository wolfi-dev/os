package:
  name: py3.15-pytest-timeout
  version: "2.5.0"
  epoch: 0 # Python 3.15 version needed for py3.15-filelock
  description: pytest plugin to abort hanging tests
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-pytest

vars:
  pypi-package: pytest-timeout
  import: pytest_timeout
  python-version: "3.15"

environment:
  contents:
    packages:
      - busybox
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytest-dev/pytest-timeout
      tag: ${{package.version}}
      expected-commit: 945ec4617ef25ea2ea8d38930e26fb6509a72f6b

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
    - name: --timeout lets a 3s test pass at 5s and fails it at 1s
      runs: |
        cat > test.py <<'PYEOF'
        import time

        def test_a_slow_test():
            """This should take 3 seconds to run. An aggressive 'pytest --timeout'
            value will kill it, but forgiving timeout flag will let it go."""
            time.sleep(3)
        PYEOF
        rc=0
        tname="test_a_slow_test"
        python${{vars.python-version}} -m pytest --timeout=5 ./test.py >expected-pass.out 2>&1
        grep "FAILED.*$tname" expected-pass.out && exit 1
        python${{vars.python-version}} -m pytest --timeout=1 ./test.py > expected-timeout.txt 2>&1 || rc=$?
        echo "pytest exited with code: $rc"
        grep -q "FAILED.*$tname" expected-timeout.txt || exit 1

update:
  enabled: true
  github:
    identifier: pytest-dev/pytest-timeout
    use-tag: true
    tag-filter: 2.
