package:
  name: py3.15-python-sbom
  version: "0.3.1"
  epoch: 0
  description: "Embed CycloneDX SBOMs into Python distributions (PEP 770): a hatchling build hook plus a backend-agnostic CLI"
  copyright:
    - license: MIT
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-installer
      - py${{vars.python-version}}-packageurl-python
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-zipremove

vars:
  pypi-package: python-sbom
  import: python_sbom
  python-version: "3.15"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - py${{vars.python-version}}-hatch-fancy-pypi-readme
      - py${{vars.python-version}}-hatch-vcs
      - py${{vars.python-version}}-hatchling
      - py${{vars.python-version}}-installer
      - py${{vars.python-version}}-packageurl-python
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pytest # upstream-tests: test runner
      - py${{vars.python-version}}-pytest-timeout # upstream-tests: per-test timeout
      - py${{vars.python-version}}-wheel
      - py${{vars.python-version}}-zipremove
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tox-dev/python-sbom
      tag: ${{package.version}}
      expected-commit: 800cf535aec00992a891216cf7f1945167d62e89

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: upstream-tests/pytest
    with:
      python: python${{vars.python-version}}
      # The validate extra (jsonschema-rs, license-expression, spdx-tools) is
      # not packaged, so every test that validates an SBOM fails with
      # MissingExtraError. TODO(upstream-tests): package the validate extra
      # and drop these ignores.
      # test_console_script runs /usr/bin/python-sbom, which is not installed
      # in the build environment (the script lives in the destdir).
      # test_embed_output_is_pinned and test_failed_embed_leaves_wheel_and_no_temporary_file
      # need pytest-mock. TODO(upstream-tests): package pytest-mock.
      ignore: >-
        tests/_cli/test_main.py::test_console_script tests/_cli/test_validate.py::test_validate_default_cap_admits_thousands tests/_cli/test_validate.py::test_validate_directory tests/_cli/test_validate.py::test_validate_max_components_sets_the_cap tests/_generate/test_archive.py::test_archive_bundled_wheel_judged_wherever_it_sits tests/_generate/test_archive.py::test_archive_document_validates tests/_generate/test_embed.py::test_embed_output_is_pinned tests/_generate/test_embed.py::test_linked_sbom_validates tests/hatch/test_hook.py::test_wheel_carries_valid_sbom tests/test_setuptools.py::test_wheel_carries_valid_sbom tests/_wheel/test_write.py::test_failed_embed_leaves_wheel_and_no_temporary_file
      # tests/_validate, test_spdx.py and test_iri.py import jsonschema_rs,
      # license_expression or spdx_tools (not packaged); test_public_api.py
      # imports every submodule, including python_sbom._validate; test_backend.py needs
      # flit_core.buildapi and test_pdm.py needs pdm; tests/examples drive
      # build, cibuildwheel and maturin, which are not in the build
      # environment. TODO(upstream-tests): package them and drop these.
      ignore-files: >-
        tests/_validate tests/test_public_api.py tests/_formats/test_spdx.py tests/_model/test_iri.py tests/test_backend.py tests/test_pdm.py tests/examples

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
    - uses: test/tw/help-check
      with:
        bins: python-sbom
    - uses: test/tw/ver-check
      with:
        bins: python-sbom
        version: ${{package.version}}

update:
  enabled: true
  git: {}
