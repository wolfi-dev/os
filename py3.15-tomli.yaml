package:
  name: py3.15-tomli
  version: "2.5.0"
  epoch: 0 # Python 3.15 version needed for py3.15-filelock
  description: TOML parser
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  pypi-package: tomli
  import: tomli
  python-version: "3.15"

environment:
  contents:
    packages:
      - busybox
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hukkin/tomli
      tag: ${{package.version}}
      expected-commit: a2a578949199336ebc3884eeba4aede87da41ef2

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: hukkin/tomli
    use-tag: true
