package:
  name: pysilfont
  # A master snapshot after the 1.8.0 tag: see the git-checkout comment for
  # why the tag is unusable. The _git suffix sorts above 1.8.0 and below a
  # future 1.8.1, so a real release supersedes this cleanly.
  version: "1.8.0_git20260910"
  epoch: 0
  description: "SIL Global's Python font utilities (psf* command-line tools for UFO, TTF and OpenType feature workflows)"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # The staged venv's bin/python3 symlinks back to the system interpreter;
      # SCA does not follow the venv symlink farm, so declare it explicitly or
      # the shipped venv is unusable in the runtime image.
      - python-${{vars.python-version}}-base
  options:
    # Don't resolve libraries installed in the virtual environment as providers.
    no-provides: true

vars:
  # Upstream CI (.github/workflows) tests Python 3.10-3.14; 3.13 matches the
  # interpreter os/fontmake.yaml and os/gftools.yaml stage their venvs against.
  python-version: "3.13"
  venv-home: "/opt/chainguard/pysilfont"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # cffsubr (required by ufo2ft) builds AFDKO's tx from source with cmake;
      # AFDKO links libxml2 and would download its own copy if none is installed.
      - cmake
      - libxml2-dev
      - python-${{vars.python-version}}-dev
      - uv

pipeline:
  # Pinned to a master commit, not to the v1.8.0 tag. psfbuildfea at that tag
  # does "return [b.build() for b in lookups + latelookups]", which raises
  # AssertionError with fontTools 4.58.1 and later, because fontTools now
  # hands back a builder that has to be promoted before it can be built. Our
  # venv resolves fontTools 4.66.1, so the tag cannot compile a feature file
  # at all, and psfbuildfea is one of the tools smith requires at configure
  # time. Upstream fixed it on master (catch the AssertionError and call
  # promote_lookup_type), tagged nothing since, and declares 1.8.1.dev14
  # there; `psfversion` therefore reports that rather than the apk version.
  - uses: git-checkout
    with:
      repository: https://github.com/silnrsi/pysilfont
      branch: master
      expected-commit: 0bac476de73bc8a4a024874e7926a8931f8385d1

  - uses: auth/uv
    with:
      allow-fallback-indexes: true

  - uses: uv/venv
    with:
      venv: ${{vars.venv-home}}
      python: ${{vars.python-version}}

  # uv/install cannot install from the local checkout (--only-binary :all:
  # refuses path sources), so follow the os/fontmake.yaml custom-steps
  # pattern: resolve the default dependency set from pyproject.toml (the `git`
  # extra, which installs dependencies straight from GitHub, is not used),
  # install those as wheels, source-build cffsubr and ufo2ft as fontmake does,
  # then install silfont itself from the checkout with --no-deps.
  - name: Install dependencies as wheels, then silfont from the checkout
    runs: |
      export VIRTUAL_ENV="${{vars.venv-home}}"
      uv pip compile --no-header --no-annotate -o /tmp/deps.txt pyproject.toml

      # --no-deps: deps.txt is already the fully resolved set, and without it
      # uv would re-resolve ufo2ft's dependencies and pull cffsubr's prebuilt
      # wheel in here, ahead of the source build below.
      grep -v '^cffsubr==' /tmp/deps.txt > /tmp/deps-rest.txt
      uv pip install --no-deps --only-binary :all: \
        --no-binary ufo2ft \
        -r /tmp/deps-rest.txt

      # cffsubr's PyPI wheel bundles a prebuilt AFDKO tx; build it from the
      # sdist exactly as os/fontmake.yaml does (unscoped
      # SETUPTOOLS_SCM_PRETEND_VERSION for the nested AFDKO build, and
      # setuptools<81 because cffsubr's setup.py still passes dry_run= to
      # distutils' copy_file).
      cffsubr_req="$(grep '^cffsubr==' /tmp/deps.txt)"
      echo 'setuptools<81' > /tmp/cffsubr-build-constraints.txt
      SETUPTOOLS_SCM_PRETEND_VERSION="${cffsubr_req#cffsubr==}" \
        uv pip install --no-deps --only-binary :all: --no-binary cffsubr \
          --build-constraints /tmp/cffsubr-build-constraints.txt "$cffsubr_req"

      uv pip install --no-deps .

      # Three modules upstream's pyproject does not declare but the shipped
      # commands need, all found by building SIL's own fonts with them:
      #   - uharfbuzz: psfversion imports it, so that command cannot start
      #     without it (it is the only module that does,
      #     src/silfont/scripts/psfversion.py).
      #   - brotli and zopfli: psfwoffit asks fontTools for WOFF2 and WOFF
      #     flavour data, and fontTools raises ImportError("No module named
      #     brotli") without them. They are fontTools' own [woff] extra,
      #     which pysilfont does not request. psfwoffit still imports and
      #     answers --help without them, so only an actual conversion shows
      #     the gap; every web-font target in font-padauk and
      #     font-abyssinica fails without this.
      uv pip install --no-deps uharfbuzz brotli zopfli

      # Same clean-up and staging uv/install performs.
      uv pip uninstall pip virtualenv
      uv pip check
      chmod 644 "${{vars.venv-home}}/.lock"
      mkdir -p "$(dirname "${{targets.contextdir}}${{vars.venv-home}}")"
      mv "${{vars.venv-home}}" "${{targets.contextdir}}${{vars.venv-home}}"

  - name: Verify the installed venv and expose the psf* CLIs
    runs: |
      staged="${{targets.contextdir}}${{vars.venv-home}}"
      # The pinned commit declares 1.8.1.dev14 in both pyproject.toml and
      # silfont/__init__.py, which is upstream's own in-development string for
      # the unreleased 1.8.1. The apk version cannot carry it, so assert it
      # here: if it changes, the version this package really ships has moved.
      "$staged/bin/python" -c "import silfont; assert silfont.__version__ == '1.8.1.dev14', silfont.__version__"
      "$staged/bin/python" -c "import silfont.core, silfont.ufo, ufo2ft, defcon, fontParts, glyphsLib, mutatorMath, odf, lxml, lz4"
      test -x "$staged/bin/psfufo2ttf"

      # Expose only the psf* console scripts on PATH, not the venv's copies of
      # fonttools, glyphsLib and friends.
      mkdir -p "${{targets.contextdir}}/usr/bin"
      for cli in "$staged"/bin/psf*; do
        name="$(basename "$cli")"
        ln -sf "${{vars.venv-home}}/bin/$name" "${{targets.contextdir}}/usr/bin/$name"
      done

  - uses: strip

test:
  environment: {}
  pipeline:
    # The venv's lxml and lz4 extension modules are the only dynamically
    # linked ELF objects shipped; the psf* entrypoints are Python scripts.
    - uses: test/tw/ldd-check
    - uses: test/tw/pip-check
      with:
        python: ${{vars.venv-home}}/bin/python${{vars.python-version}}
    # psfmakefea is deliberately absent: on this commit it is a stub that
    # prints the feaxlib migration notice and returns 0 for any argument, so
    # a help-check on it would pass whatever happened to the package. The
    # commands listed here are the ones smith resolves from PATH for
    # font-padauk and font-abyssinica.
    - uses: test/tw/help-check
      with:
        bins: |
          psfufo2ttf
          psfbuildfea
          psfchangettfglyphnames
          psfcreateinstances
          psfexportanchors
          psfwoffit
          psftuneraliases
    - name: silfont framework imports through the venv interpreter
      runs: |
        "${{vars.venv-home}}/bin/python" -c "import silfont, silfont.core, silfont.ufo; print('silfont', silfont.__version__)" | grep -F "silfont"
    - name: psfversion reports pysilfont and its dependencies
      runs: |
        psfversion > /tmp/psfversion.txt
        cat /tmp/psfversion.txt
        grep -iF "silfont" /tmp/psfversion.txt
        grep -iF "fonttools" /tmp/psfversion.txt
        grep -iF "python" /tmp/psfversion.txt
    - name: Create a minimal UFO fixture
      runs: |
        mkdir -p /tmp/psf
        # "smile" is a working name; public.postscriptNames maps it to the
        # production name that psfchangettfglyphnames must apply later.
        "${{vars.venv-home}}/bin/python" - /tmp/psf/PsfTest-Regular.ufo <<'EOF'
        import sys
        import defcon
        f = defcon.Font()
        f.info.familyName, f.info.styleName = "PsfTest", "Regular"
        f.info.unitsPerEm, f.info.ascender, f.info.descender = 1000, 800, -200
        f.info.xHeight, f.info.capHeight = 500, 700
        f.info.versionMajor, f.info.versionMinor = 1, 0
        order = []
        for name, uni in ((".notdef", None), ("space", 0x20), ("A", 0x41), ("B", 0x42), ("smile", 0x263A)):
            g = f.newGlyph(name)
            g.width = 600
            if uni is not None:
                g.unicodes = [uni]
            if name != "space":
                p = g.getPen()
                p.moveTo((100, 0)); p.lineTo((100, 700)); p.lineTo((500, 700)); p.lineTo((500, 0)); p.closePath()
            order.append(name)
        f.lib["public.glyphOrder"] = order
        f.lib["public.postscriptNames"] = {"smile": "uni263A"}
        f.save(sys.argv[1])
        EOF
        stat /tmp/psf/PsfTest-Regular.ufo/metainfo.plist
    - name: psfufo2ttf compiles the UFO to a loadable TTF
      working-directory: /tmp/psf
      runs: |
        psfufo2ttf PsfTest-Regular.ufo in.ttf
        test -s in.ttf
        "${{vars.venv-home}}/bin/python" - <<'EOF'
        from fontTools.ttLib import TTFont
        f = TTFont("in.ttf")
        order = f.getGlyphOrder()
        print(order)
        assert f["maxp"].numGlyphs == 5, f["maxp"].numGlyphs
        assert f["name"].getDebugName(1) == "PsfTest", f["name"].getDebugName(1)
        assert f.getBestCmap()[0x41] == "A"
        # Production names are applied by a later build step, not here.
        assert "smile" in order, order
        EOF
    # psfmakefea is deliberately not tested: on this commit it is a stub that
    # prints "psfmakefea is no longer to be used" and exits without writing
    # anything, because upstream moved the feax capability into the separate
    # feaxlib module. That is why smith's fea path needs feaxlib's makefea,
    # which is packaged separately.
    - name: psfbuildfea compiles a feature file into the TTF
      working-directory: /tmp/psf
      runs: |
        cat > test.fea <<'EOF'
        languagesystem DFLT dflt;
        feature kern {
            pos A B -50;
        } kern;
        feature ss01 {
            sub A by B;
        } ss01;
        EOF
        psfbuildfea -o withfea.ttf test.fea in.ttf
        test -s withfea.ttf
        "${{vars.venv-home}}/bin/python" - <<'EOF'
        from fontTools.ttLib import TTFont
        f = TTFont("withfea.ttf")
        assert "GPOS" in f and "GSUB" in f, sorted(f.keys())
        gsub_tags = [r.FeatureTag for r in f["GSUB"].table.FeatureList.FeatureRecord]
        gpos_tags = [r.FeatureTag for r in f["GPOS"].table.FeatureList.FeatureRecord]
        assert "ss01" in gsub_tags, gsub_tags
        assert "kern" in gpos_tags, gpos_tags
        print("GSUB", gsub_tags, "GPOS", gpos_tags)
        EOF
    - name: psfchangettfglyphnames applies production glyph names
      working-directory: /tmp/psf
      runs: |
        psfchangettfglyphnames PsfTest-Regular.ufo withfea.ttf out.ttf
        test -s out.ttf
        "${{vars.venv-home}}/bin/python" - <<'EOF'
        from fontTools.ttLib import TTFont
        f = TTFont("out.ttf")
        order = f.getGlyphOrder()
        print(order)
        assert "uni263A" in order, order
        assert "smile" not in order, order
        assert f.getBestCmap()[0x263A] == "uni263A"
        assert "GSUB" in f and "GPOS" in f, sorted(f.keys())
        EOF
    # This is the step that proves the brotli and zopfli extras are present.
    # psfwoffit imports and answers --help without them, and only fails when
    # it asks fontTools for flavour data, so the help-check above cannot see
    # the gap: without brotli this raises ImportError("No module named
    # brotli") and writes nothing. Reading the flavour back also rejects a
    # file that was merely copied rather than recompressed.
    - name: psfwoffit converts the TTF to WOFF and WOFF2
      working-directory: /tmp/psf
      runs: |
        psfwoffit -q --woff web.woff --woff2 web.woff2 out.ttf
        test -s web.woff
        test -s web.woff2
        "${{vars.venv-home}}/bin/python" - <<'EOF'
        from fontTools.ttLib import TTFont
        src = TTFont("out.ttf")
        for path, want in (("web.woff", "woff"), ("web.woff2", "woff2")):
            f = TTFont(path)
            print(path, "flavor", f.flavor, "glyphs", f["maxp"].numGlyphs)
            assert f.flavor == want, (path, f.flavor)
            assert f["maxp"].numGlyphs == src["maxp"].numGlyphs
            assert f.getBestCmap() == src.getBestCmap()
        EOF

update:
  enabled: false
  exclude-reason: |
    Pinned to a master commit because psfbuildfea at the newest tag (v1.8.0)
    cannot compile a feature file with fontTools 4.58.1 or later. Re-enable
    with use-tag once upstream tags a release after 0bac476d.
