#nolint:unused-var-transform,depends-on-unversioned-py-provides
package:
  name: python-3.14
  version: "3.14.8_git20261021"
  epoch: 1
  description: "the Python programming language (metapackage)"
  copyright:
    - license: PSF-2.0
  resources:
    cpu: 8
    memory: 8Gi
  dependencies:
    provides:
      - python3=0
      - python-3=0
    runtime:
      - ${{package.name}}-runtime=${{package.full-version}}
  annotations:
    # Upstream requires llvm 19 for experimental JIT.
    toolchain-stream-reconcile-optout: true

environment:
  contents:
    packages:
      - build-base
      - busybox
      - bzip2-dev
      - ca-certificates-bundle
      # clang, llvm and python-3.13 are required for the JIT subpackage build
      - clang-${{vars.llvm-version}}
      - expat-dev
      - gdbm-dev
      - glibc-2.44-dev
      - libcap-utils
      - libffi-dev
      - libx11-dev
      - linux-headers
      - llvm-${{vars.llvm-version}}
      - mpdecimal-dev
      - ncurses-dev
      - openssl-hardened-${{vars.openssl-version}}-dev
      - python-3.13
      - readline-dev
      - sqlite-dev
      - tcl-dev
      - tk-dev
      - xz-dev
      - zlib-dev
      - zstd-dev

vars:
  llvm-version: 19
  openssl-version: "4.0"
  config-opts-common: |
    --host=__host_triplet_gnu__ \
    --build=__host_triplet_gnu__ \
    --target=__host_triplet_gnu__ \
    --prefix=/usr \
    --enable-ipv6 \
    --enable-loadable-sqlite-extensions \
    --enable-shared \
    --with-lto \
    --with-computed-gotos \
    --with-dbmliborder=gdbm:ndbm \
    --with-system-expat \
    --with-system-libmpdec \
    --without-ensurepip \
    --with-builtin-hashlib-hashes=blake2 \
    --with-wheel-pkg-dir=/usr/share/python-wheels
  config-opts-gil: --enable-optimizations
  config-opts-freethreading: --disable-gil --enable-optimizations
  # --enable-optimizations with clang requires PGO support (in particular,
  # we're missing libclang_rt.profile). This build configuration won't be
  # optimal and might not produce any performance gains.
  config-opts-jit: 'CC=clang-__llvm_version__ --enable-experimental-jit=yes --with-tail-call-interp'

# creates helpful python3.M and 3.M variables
var-transforms:
  - from: ${{vars.config-opts-common}}
    match: '__host_triplet_gnu__'
    replace: ${{host.triplet.gnu}}
    to: config-opts-common
  - from: ${{vars.config-opts-jit}}
    match: '__llvm_version__'
    replace: ${{vars.llvm-version}}
    to: config-opts-jit
  - from: ${{package.name}}
    match: '-'
    replace: ''
    to: python
  - from: ${{vars.python}}
    match: (.*)
    replace: '${1}t'
    to: python-t
  - from: ${{package.name}}
    match: python-(.*)
    replace: '$1'
    to: pyversion
  - from: ${{vars.pyversion}}
    match: (.*)
    replace: '${1}t'
    to: pyversion-t
  - from: ${{package.version}}
    match: (.*)_git.*
    replace: '$1'
    to: upstreamversion

# Each key is a suffix in the subpackage names: ${{package.name}}<key>-*.
data:
  - name: variants
    items:
      "": ${{vars.config-opts-gil}}

pipeline:
  - uses: git-checkout
    with:
      branch: ${{vars.pyversion}}
      expected-commit: a3f95bb22a64ab86a4ad32c5c01c766cce9aff06
      repository: https://github.com/python/cpython

  - name: Drop the branch development marker from the version string
    runs: |
      # Upstream sets PY_VERSION to "X.Y.Z+" on the maintenance branch as soon
      # as X.Y.Z is tagged, and "X.Y.Z+" is not a valid PEP 440 version.
      sed -i 's/^\(#define PY_VERSION[[:space:]]*"${{vars.upstreamversion}}\)+"/\1"/' Include/patchlevel.h
      grep -q '^#define PY_VERSION[[:space:]]*"${{vars.upstreamversion}}"' Include/patchlevel.h

  - name: Support OpenSSL 4 ABI
    uses: patch
    with:
      patches: |
        0001-gh-146207-Add-support-for-OpenSSL-4.0.0-alpha1-14621.patch
        0002-gh-148600-Add-Modules-_ssl_data_40.h-data-148601.patch
        0003-gh-148292-Update-_ssl._SSLSocket-for-OpenSSL-4-14910.patch
        0004-gh-148600-Add-OpenSSL-4.0.0-support-to-test-configur.patch
        0005-gh-156369-Update-OpenSSL-error-ID-data-GH-156380.patch
        0006-Allow-HelloRetryRequest-in-test_ssl-servername-callb.patch
        0007-Always-provide-PROTOCOL_TLSv1-and-fix-HAS_TLSv1_2-wi.patch
        0008-gh-136929-ensure-that-hashlib.-name-does-not-raise-A.patch
        0009-gh-110357-hashlib-no-longer-logs-at-import-when-a-gu.patch

  - name: Force use of system libraries
    runs: |
      rm -rf Modules/expat \
        Modules/_ctypes/darwin* \
        Modules/_ctypes/libffi*

  - name: Block blake and hmac usage in FIPS mode
    uses: patch
    with:
      patches: gh-127301.patch

  - name: Clone patched source for no-GIL and JIT builds
    runs: |
      mkdir no-gil build-jit
      tar -cf - --exclude=no-gil --exclude=build-jit . | tar -xC no-gil
      tar -cf - --exclude=no-gil --exclude=build-jit . | tar -xC build-jit

subpackages:
  - range: variants
    name: "${{package.name}}${{range.key}}-runtime"
    description: "${{package.name}}${{range.key}} with the python, python3 and pydoc3 commands"
    dependencies:
      runtime:
        - ${{package.name}}${{range.key}}-base=${{package.full-version}}
    pipeline:
      - uses: autoconf/configure
        with:
          opts: |
            ${{range.value}} \
            ${{vars.config-opts-common}}
      - uses: autoconf/make
      - uses: autoconf/make-install
      - runs: |
          find ${{targets.contextdir}}/usr/lib -type f -name 'libpython*.a' -exec rm -rf '{}' +
          find ${{targets.contextdir}}/usr/lib -type d -name 'test' -exec rm -rf '{}' +
          find ${{targets.contextdir}}/usr/lib -type d -name 'tests' -exec rm -rf '{}' +
          find ${{targets.contextdir}}/usr/lib -type d -name 'idle_test' -exec rm -rf '{}' +

          cd ${{targets.contextdir}}/usr/bin
          rm -f idle3* 2to3*
          rm ${{targets.contextdir}}/usr/lib/libpython3.so

          # add dubious python -> python3 link
          ln -s python3 ${{targets.contextdir}}/usr/bin/python

          # Drop site-packages README.txt to avoid SCA dep on python3~3.M
          cd ${{targets.contextdir}}/usr/lib/python3.*
          rm site-packages/README.txt
          rmdir site-packages
      - runs: |
          rm -R "${{targets.contextdir}}"/usr/lib/python3.*/idlelib

          rm -R "${{targets.contextdir}}"/usr/lib/python3.*/ensurepip/_bundled/

          find ${{targets.contextdir}}/usr/lib -type f -name '*.pyc' -exec rm -rf '{}' +
          find ${{targets.contextdir}}/usr/lib -type f -name '*.pyo' -exec rm -rf '{}' +

          export LD_LIBRARY_PATH="${{targets.contextdir}}/usr/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          ${{targets.contextdir}}/usr/bin/${{vars.python}} -B -m compileall -f --invalidation-mode=unchecked-hash \
              -r100 ${{targets.contextdir}}/usr/lib/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/symlink-check

  - name: "${{package.name}}t"
    description: "Python with the GIL disabled (free threading)"
    dependencies:
      provides:
        - python3t=${{package.full-version}}
        - python-3t=${{package.full-version}}
      runtime:
        # 'import _tkinter' will fail with ImportError on 'libtcl9tk9.0.so'
        # which is provided by tk.  melange SCA does not find this dependency.
        - tk
    pipeline:
      - working-directory: no-gil
        pipeline:
          - uses: autoconf/configure
            with:
              opts: |
                ${{vars.config-opts-freethreading}} \
                ${{vars.config-opts-common}}
          - uses: autoconf/make
          - uses: autoconf/make-install
          - name: "Clean out base items"
            runs: |
              find ${{targets.subpkgdir}}/usr/lib -type f -name 'libpython*.a' -exec rm -rf '{}' +
              find ${{targets.subpkgdir}}/usr/lib -type d -name 'test' -exec rm -rf '{}' +
              find ${{targets.subpkgdir}}/usr/lib -type d -name 'idle_test' -exec rm -rf '{}' +

              cd ${{targets.subpkgdir}}/usr/bin
              rm idle3*
              rm ${{targets.subpkgdir}}/usr/lib/libpython3.so

              # add dubious python -> python3 link
              ln -s python3 ${{targets.subpkgdir}}/usr/bin/python

              # Drop site-packages README.txt to avoid SCA dep on python3~3.M
              rm -R ${{targets.subpkgdir}}/usr/lib/${{vars.python-t}}/site-packages

              rm -R ${{targets.subpkgdir}}/usr/lib/${{vars.python-t}}/idlelib
              rm -R ${{targets.subpkgdir}}/usr/lib/${{vars.python-t}}/ensurepip/_bundled/

              rm ${{targets.subpkgdir}}/usr/bin/pydoc3*
              rm -R ${{targets.subpkgdir}}/usr/share
          # AFAIK the .pyc/.pyo files are compatible between GIL/no-GIL builds, but
          # the .so files are not, so we include everything in here out of an
          # abundance of caution.
          - name: "Precompile .py files"
            runs: |
              find ${{targets.subpkgdir}}/usr/lib -type f -name '*.pyc' -exec rm -rf '{}' +
              find ${{targets.subpkgdir}}/usr/lib -type f -name '*.pyo' -exec rm -rf '{}' +

              export LD_LIBRARY_PATH="${{targets.subpkgdir}}/usr/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
              ${{targets.subpkgdir}}/usr/bin/${{vars.python}} -B -m compileall -f --invalidation-mode=unchecked-hash \
                  -r100 ${{targets.subpkgdir}}/usr/lib/
          - uses: strip
    test:
      pipeline:
        - working-directory: no-gil
          pipeline:
            - uses: test/tw/ldd-check
            - uses: test/tw/symlink-check
            - uses: test/tw/ver-check
              with:
                bins: python ${{vars.python}} ${{vars.python-t}}
                version: ${{vars.upstreamversion}}
            - uses: test/tw/help-check
              with:
                bins: python ${{vars.python}} ${{vars.python-t}}
            - name: Verify no-GIL build
              runs: |
                ${{vars.python-t}} -c 'import sysconfig; assert(sysconfig.get_config_var("Py_GIL_DISABLED"))'
            - uses: test/python/interpreter/version
              with:
                python: ${{vars.python-t}}
                version: ${{vars.upstreamversion}}
            - uses: test/python/interpreter/jit
              with:
                python: ${{vars.python-t}}
                available: false
                enabled: false

  - name: "${{package.name}}t-dev"
    description: "${{package.name}}t development headers"
    dependencies:
      runtime:
        - ${{package.name}}t=${{package.full-version}}
    pipeline:
      - runs: |
          fromd="${{targets.outdir}}/${{package.name}}t"
          tod="${{targets.contextdir}}"

          mkdir -p "$tod/usr/bin" "$tod/usr/lib/${{vars.python-t}}"
          mv -v "$fromd/usr/include" "$tod/usr/"
          # python3-config and python3.M-config are symlinks to python3.Mt-config
          mv -v "$fromd"/usr/bin/python*-config "$tod/usr/bin/"
          mv -v "$fromd/usr/lib/pkgconfig" "$tod/usr/lib/"
          mv -v "$fromd/usr/lib/libpython${{vars.pyversion-t}}.so" "$tod/usr/lib/"
          mv -v "$fromd"/usr/lib/${{vars.python-t}}/config-${{vars.pyversion-t}}* \
             "$tod/usr/lib/${{vars.python-t}}/"
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/devpackage
        - name: Verify the dev files point at the free-threaded build
          runs: |
            for c in ${{vars.python-t}}-config ${{vars.python}}-config python3-config; do
              $c --includes | grep -F "/usr/include/${{vars.python-t}}"
            done
            pkgconf --cflags python3 | grep -F "/usr/include/${{vars.python-t}}"
            grep -F '#define Py_GIL_DISABLED 1' /usr/include/${{vars.python-t}}/pyconfig.h
            test -L /usr/lib/libpython${{vars.pyversion-t}}.so
        - uses: test/python/interpreter/c-ext
          with:
            python: ${{vars.python-t}}

  - name: "${{package.name}}-jit"
    description: "Python with experimental JIT support"
    dependencies:
      provides:
        - python3-jit=${{package.full-version}}
        - python-3-jit=${{package.full-version}}
      runtime:
        # 'import _tkinter' will fail with ImportError on 'libtcl9tk9.0.so'
        # which is provided by tk.  melange SCA does not find this dependency.
        - tk
    pipeline:
      - working-directory: build-jit
        pipeline:
          # Experimental JIT support
          - uses: autoconf/configure
            with:
              opts: |
                ${{vars.config-opts-jit}} \
                ${{vars.config-opts-common}}
          - uses: autoconf/make
          - uses: autoconf/make-install
          - name: "Clean out base items"
            runs: |
              find ${{targets.subpkgdir}}/usr/lib -type f -name 'libpython*.a' -exec rm -rf '{}' +
              find ${{targets.subpkgdir}}/usr/lib -type d -name 'test' -exec rm -rf '{}' +
              find ${{targets.subpkgdir}}/usr/lib -type d -name 'idle_test' -exec rm -rf '{}' +

              cd ${{targets.subpkgdir}}/usr/bin
              rm idle3*
              rm ${{targets.subpkgdir}}/usr/lib/libpython3.so

              # add dubious python -> python3 link
              ln -s python3 ${{targets.subpkgdir}}/usr/bin/python

              # Drop site-packages README.txt to avoid SCA dep on python3~3.M
              rm -R ${{targets.subpkgdir}}/usr/lib/${{vars.python}}/site-packages

              rm -R ${{targets.subpkgdir}}/usr/lib/${{vars.python}}/idlelib
              rm -R ${{targets.subpkgdir}}/usr/lib/${{vars.python}}/ensurepip/_bundled/

              rm ${{targets.subpkgdir}}/usr/bin/pydoc3*
              rm -R ${{targets.subpkgdir}}/usr/include
              rm -R ${{targets.subpkgdir}}/usr/share
              rm ${{targets.subpkgdir}}/usr/lib/pkgconfig/python-${{vars.pyversion}}-*.pc ${{targets.subpkgdir}}/usr/lib/pkgconfig/python3-*.pc
          - name: "Precompile .py files"
            runs: |
              find ${{targets.subpkgdir}}/usr/lib -type f -name '*.pyc' -exec rm -rf '{}' +
              find ${{targets.subpkgdir}}/usr/lib -type f -name '*.pyo' -exec rm -rf '{}' +

              export LD_LIBRARY_PATH="${{targets.subpkgdir}}/usr/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
              ${{targets.subpkgdir}}/usr/bin/${{vars.python}} -B -m compileall -f --invalidation-mode=unchecked-hash \
                  -r100 ${{targets.subpkgdir}}/usr/lib/
          - uses: strip
    test:
      pipeline:
        - working-directory: build-jit
          pipeline:
            - uses: test/tw/ldd-check
            - uses: test/tw/symlink-check
            - uses: test/tw/ver-check
              with:
                bins: python ${{vars.python}}
                version: ${{vars.upstreamversion}}
            - uses: test/tw/help-check
              with:
                bins: python ${{vars.python}}
            - uses: test/python/interpreter/jit
              with:
                python: ${{vars.python}}
                available: true
                enabled: true
            - uses: test/python/interpreter/version
              with:
                python: ${{vars.python}}
                version: ${{vars.upstreamversion}}

  - range: variants
    name: "${{package.name}}${{range.key}}-base"
    description: "${{package.name}}${{range.key}} without /usr/bin/python3"
    dependencies:
      runtime:
        - py3-pip-wheel
    pipeline:
      - runs: |
          rt="${{targets.outdir}}/${{package.name}}${{range.key}}-runtime"
          mkdir -p ${{targets.subpkgdir}}/usr/bin ${{targets.subpkgdir}}/usr/lib
          for f in "$rt"/usr/bin/python3.* "$rt"/usr/bin/pydoc3.*; do
            case "$f" in *-config) continue ;; esac
            mv -v "$f" ${{targets.subpkgdir}}/usr/bin
          done
          mv -v "$rt"/usr/lib/python3.* ${{targets.subpkgdir}}/usr/lib
          mv -v "$rt"/usr/lib/libpython3.*.so.* ${{targets.subpkgdir}}/usr/lib

          # pyconfig.h is needed at runtime... ugh.
          d=$(cd "$rt" && echo usr/include/python3.*)
          mkdir -p "${{targets.subpkgdir}}"/$d
          mv "$rt"/$d/pyconfig.h "${{targets.subpkgdir}}"/$d/

          # move usr/lib/python3.X/config-3.X-x86_64-linux-gnu
          # back into -runtime so the -base-dev can take it below.
          d=$(cd "${{targets.subpkgdir}}" && echo usr/lib/python3.*)
          mkdir -p "$rt/$d"
          mv -v "${{targets.subpkgdir}}/$d"/config-3.* "$rt/$d"
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/ver-check
          with:
            bins: ${{vars.python}}
            version: ${{vars.upstreamversion}}
        - name: Verify venv installs expected packages
          runs: |
            set +x
            d=$(mktemp -d)
            echo "$ ${{vars.python}} -m venv $d"
            ${{vars.python}} -m venv "$d"
            echo "$ $d/bin/pip list"
            $d/bin/pip list | tee "$d/list.txt"
            wd=/usr/share/python-wheels
            for pkg in pip ; do
              set -- "$wd"/$pkg-*.whl
              [ $# -eq 1 ] || {
                echo "ERROR: found $# wheels in $wd matching $pkg-*.whl";
                exit 1;
              }
              [ -f "$1" ] || {
                echo "ERROR: $wd/$pkg-*.whl ('$1') was not a file"
                exit 1
              }
              # name is like pip-24.2-py3-none-any.whl. second token is version.
              wheel=${1}
              tmp=${wheel##*/}
              tmp=${tmp#*-}
              ver=${tmp%%-*}
              if ! grep -q "${pkg}[ ]\+${ver}$" "$d/list.txt"; then
                  echo "FAIL: did not find '$pkg==$ver' in venv"
                  echo "pip list had:"
                  sed 's,^,>,' "$d/list.txt"
                  exit 1
              fi
              echo "PASS: venv installed '$pkg==$ver'"
            done

            rm -Rf "$d"

  - name: "${{package.name}}-privileged-netbindservice"
    description: "Allows Python to bind to ports less than 1024"
    options:
      # This replaces the Python binary and depends on base. We don't want
      # to generate any dependencies or provide anything that would clash
      # with the rest of Python
      no-depends: true
      no-provides: true
    dependencies:
      replaces:
        - ${{package.name}}-base
      runtime:
        - ${{package.name}}-base=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          cp "${{targets.outdir}}/${{package.name}}-base/usr/bin/${{vars.python}}" "${{targets.contextdir}}/usr/bin/"
          # Note this sets the capability the test using getcap fails but the
          # capability is set in images with this package.
          setcap cap_net_bind_service=+eip "${{targets.contextdir}}/usr/bin/${{vars.python}}"
    test:
      pipeline:
        - uses: test/tw/contains-files

  - range: variants
    name: "${{package.name}}${{range.key}}-tk"
    dependencies:
      provides:
        - py${{vars.pyversion}}${{range.key}}-tkinter=${{package.full-version}}
      runtime:
        - ${{package.name}}${{range.key}}-base=${{package.full-version}}
        # 'import _tkinter' will fail with ImportError on 'libtcl9tk9.0.so'
        # which is provided by tk.  melange SCA does not find this dependency.
        - tk
    pipeline:
      - runs: |
          # these got moved by python-3.xx-base from python-3.xx-runtime
          fromd="${{targets.outdir}}/${{package.name}}${{range.key}}-base"
          tod=${{targets.contextdir}}
          d=$(cd "$fromd" && echo usr/lib/python3.*)

          mkdir -p "$tod/$d/lib-dynload"
          mv "$fromd/$d/lib-dynload"/_tkinter.*.so "$tod/$d/lib-dynload/"
          mv "$fromd/$d/tkinter" "$tod/$d/"
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: python/import
          with:
            python: python${{vars.pyversion}}
            import: tkinter

  - range: variants
    name: "${{package.name}}${{range.key}}-doc"
    description: "${{package.name}}${{range.key}} documentation"
    pipeline:
      - uses: split/manpages
        with:
          package: ${{package.name}}${{range.key}}-runtime
    test:
      pipeline:
        - uses: test/docs

  - range: variants
    name: "${{package.name}}${{range.key}}-dev"
    description: "${{package.name}}${{range.key}} development headers"
    dependencies:
      provides:
        - python3${{range.key}}-dev=0
        - python-3${{range.key}}-dev=0
      runtime:
        - ${{package.name}}${{range.key}}=${{package.full-version}}
        - ${{package.name}}${{range.key}}-base-dev=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv -v ${{targets.outdir}}/${{package.name}}${{range.key}}-runtime/usr/bin/python3-config ${{targets.subpkgdir}}/usr/bin

          d="usr/lib/pkgconfig"
          mkdir -p "${{targets.subpkgdir}}/$d"
          mv -v \
             "${{targets.outdir}}/${{package.name}}${{range.key}}-runtime"/$d/python3-embed.pc \
             "${{targets.outdir}}/${{package.name}}${{range.key}}-runtime"/$d/python3.pc \
             "${{targets.subpkgdir}}/$d/"
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/python/interpreter/c-ext
          with:
            python: ${{vars.python}}

  - range: variants
    name: "${{package.name}}${{range.key}}-base-dev"
    description: "python3 development headers"
    dependencies:
      runtime:
        - ${{package.name}}${{range.key}}-base=${{package.full-version}}
    pipeline:
      - runs: |
          # usr/lib/python3.X/config-3.X-x86_64-linux-gnu
          # split/dev will only move 2 files from it, but we want all of it.
          rt="${{targets.outdir}}/${{package.name}}${{range.key}}-runtime"
          d=$(cd "$rt" && echo usr/lib/python3.*)
          mkdir -p "${{targets.subpkgdir}}/$d"
          mv -v "$rt"/$d/config-3.* "${{targets.subpkgdir}}"/$d
      - uses: split/dev
        with:
          package: ${{package.name}}${{range.key}}-runtime
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/python/interpreter/c-ext
          with:
            python: ${{vars.python}}

test:
  pipeline:
    - uses: test/metapackage
    - uses: test/tw/ver-check
      with:
        bins: python python3 ${{vars.python}}
        version: ${{vars.upstreamversion}}
    - uses: test/tw/help-check
      with:
        bins: pydoc3 python ${{vars.python}}
    - uses: test/python/interpreter/jit
      with:
        python: ${{vars.python}}
        available: false
        enabled: false
    - uses: test/python/interpreter/version
      with:
        python: ${{vars.python}}
        version: ${{vars.upstreamversion}}
    - name: Verify working python3 -m venv
      runs: |
        d=$(mktemp -d)
        python3 -m venv "$d"
        $d/bin/pip list
        $d/bin/pip check
        rm -Rf "$d"
    - name: Verify TLS-PSK support
      runs: |
        ${{vars.python}} -c 'import ssl; assert ssl.HAS_PSK, "built without TLS-PSK"'
    - name: hashlib and hmac refuse unapproved digests in FIPS mode
      runs: |
        # Mock FIPS mode the way CPython's own Lib/test/_test_hashlib_fips.py
        # does: activate the base provider only, so no digest implementation is
        # reachable and every usedforsecurity=True construction must be refused.
        # Needs no FIPS provider, so this runs in any environment.
        cat > /tmp/fips.cnf <<'CNF'
        config_diagnostics = 1
        openssl_conf = openssl_init
        [openssl_init]
        providers = provider_sect
        alg_section = algorithm_sect
        [provider_sect]
        base = base_sect
        default = default_sect
        [base_sect]
        activate = 1
        [default_sect]
        activate = 1
        [algorithm_sect]
        default_properties = fips=yes
        CNF
        OPENSSL_CONF=/tmp/fips.cnf python3 - <<'PY'
        import hashlib
        import hmac
        from _hashlib import get_fips_mode

        if get_fips_mode() != 1:
            raise SystemExit("FAIL: could not mock FIPS mode")

        names = sorted(hashlib.algorithms_available)

        # Positive control: the unapproved-service indicator still works, so a
        # blanket hashlib breakage cannot pass for FIPS enforcement.
        for name in names:
            hashlib.new(name, usedforsecurity=False)

        # hmac has no usedforsecurity escape hatch, and 3.14 added a builtin
        # HACL* HMAC that would otherwise answer for every digest OpenSSL has
        # just refused -- through two separate fallbacks.
        for name in names:
            for label, call in (
                ("hashlib.new", lambda n=name: hashlib.new(n, usedforsecurity=True)),
                ("hmac.new", lambda n=name: hmac.new(b"key", b"msg", digestmod=n)),
                ("hmac.digest", lambda n=name: hmac.digest(b"key", b"msg", n)),
            ):
                try:
                    call()
                except ValueError:
                    continue
                raise SystemExit(f"FAIL: {label}({name!r}) was not refused in FIPS mode")

        print("OK:", len(names), "algorithms refused via hashlib.new, hmac.new and hmac.digest")
        PY

