# Generated from https://git.alpinelinux.org/aports/plain/community/qhull/APKBUILD
package:
  name: qhull
  version: "2020.2"
  epoch: 6 # add strip step, improve tests
  description: Calculate convex hulls and related structures
  copyright:
    - license: Qhull
  resources:
    cpu: "4"
    memory: 6Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake-3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/qhull/qhull
      expected-commit: 613debeaea72ee66626dace9ba1a2eff11b5d37d
      tag: ${{package.version}}

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: qhull-static
    pipeline:
      - uses: split/static
    description: qhull static
    test:
      pipeline:
        - uses: test/tw/staticpackage

  - name: qhull-dev
    pipeline:
      - uses: split/dev
    description: qhull dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: qhull-doc
    pipeline:
      - uses: split/manpages
    description: qhull manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  github:
    identifier: qhull/qhull

test:
  pipeline:
    - name: Test convex hull computation
      runs: |
        # rbox generates point sets; qhull computes convex hull
        # Use a cube of 8 points and verify facets are computed
        rbox 8 D3 | qhull | grep -F "Convex hull"
    - name: Test qconvex
      runs: |
        # qconvex computes convex hull and outputs facets
        rbox 10 | qconvex | grep -F "Convex hull"
    - name: Test qdelaunay
      runs: |
        # qdelaunay computes Delaunay triangulation
        rbox 10 | qdelaunay | grep -F "Delaunay"
    - name: Test qvoronoi
      runs: |
        # qvoronoi computes Voronoi diagram
        rbox 10 | qvoronoi | grep -F "Voronoi"
    - name: Test rbox point generation
      runs: |
        # rbox generates random points; verify output has expected count
        output=$(rbox 20 D2)
        echo "$output" | grep -F "20"
    - uses: test/tw/ldd-check
