package:
  name: qrencode
  version: "4.1.1"
  epoch: 1 # glibc: 2.43->2.44
  description: A fast and compact library for encoding data into QR Code symbols, plus the qrencode CLI utility
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - libpng-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fukuchi/libqrencode
      tag: v${{package.version}}
      expected-commit: 715e29fd4cd71b6e452ae0f4e36d917b43122ce8

  # Build with upstream's CMake build system. It is self-contained (no
  # autoreconf/libtoolize bootstrap, no stale bundled m4 macros) and builds the
  # shared library, the qrencode CLI (WITH_TOOLS, default on), the man page, the
  # header and the libqrencode.pc pkg-config file. Options are validated against
  # the option() declarations in CMakeLists.txt. Upstream declares
  # cmake_minimum_required(VERSION 3.1.0), which CMake 4.x rejects, so
  # CMAKE_POLICY_VERSION_MINIMUM=3.5 restores the older policy behavior.
  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DBUILD_SHARED_LIBS=ON \
        -DWITH_TOOLS=ON \
        -DWITH_TESTS=NO

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

capabilities:
  add:
    - CAP_SYS_ADMIN

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: qrencode
    - uses: test/tw/help-check
      with:
        bins: qrencode
        expect-contains: Usage
    - uses: xcover/profile
      with:
        executable-path: /usr/bin/qrencode
    - name: Encode a string to a PNG file
      runs: |
        qrencode -o qr.png 'HELLO'
        test -s qr.png
        # Verify the output is a valid PNG (magic header bytes).
        head -c 8 qr.png | od -An -tx1 | tr -d ' \n' | grep -iF '89504e470d0a1a0a'
    - name: Encode a string to ANSIUTF8 terminal output
      runs: |
        out="$(qrencode -t ANSIUTF8 -o - 'HELLO')"
        # ANSIUTF8 output renders using unicode block characters.
        printf '%s' "$out" | grep -F '█'
    - name: Encode a string to ASCII output
      runs: |
        out="$(qrencode -t ASCII -o - 'HELLO')"
        printf '%s' "$out" | grep -F '#'
    - uses: xcover/stop
    - uses: xcover/ensure
      with:
        min-coverage: 1

subpackages:
  - name: ${{package.name}}-dev
    description: Development files for ${{package.name}}
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}-dev
            - build-base
            - pkgconf
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - name: Compile and link against libqrencode
          runs: |
            tee test.c <<'EOF'
            #include <qrencode.h>
            #include <stdio.h>
            int main(void) {
                QRcode *qr = QRcode_encodeString("HELLO", 0, QR_ECLEVEL_L, QR_MODE_8, 1);
                if (qr == NULL) {
                    return 1;
                }
                printf("width=%d\n", qr->width);
                QRcode_free(qr);
                return 0;
            }
            EOF
            # Resolve compile and link flags via pkg-config so the test
            # exercises the installed libqrencode.pc rather than assuming
            # default include/library paths. The unquoted expansion is
            # intentional: pkg-config emits a space-separated flag list that
            # must undergo word splitting.
            cflags="$(pkg-config --cflags libqrencode)"
            libs="$(pkg-config --libs libqrencode)"
            # shellcheck disable=SC2086
            gcc test.c -o test $cflags $libs
            out="$(./test)"
            printf '%s\n' "$out" | grep -F "width="

  - name: ${{package.name}}-doc
    description: Documentation for ${{package.name}}
    pipeline:
      - uses: split/alldocs
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: fukuchi/libqrencode
    strip-prefix: v
