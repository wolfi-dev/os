package:
  name: rabbitmq-c
  version: "0.18.1"
  epoch: 2 # upstream-tests/ctest
  description: "RabbitMQ C client"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - openssl-${{vars.openssl-version}}
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - openssl-hardened-${{vars.openssl-version}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/alanxz/rabbitmq-c
      tag: v${{package.version}}
      expected-commit: dc22a7fa21522788310ec7f3f49bc3f028150b22

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: upstream-tests/ctest

  - uses: strip

subpackages:
  - name: rabbitmq-c-dev
    description: RabbitMQ C client development headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: alanxz/rabbitmq-c
    strip-prefix: v
    tag-filter: v

test:
  environment:
    contents:
      packages:
        - rabbitmq-c-dev
        - build-base
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test library compilation and linking
      runs: |
        tee test.c <<'EOF'
        #include <amqp.h>
        int main() {
            amqp_connection_state_t conn = amqp_new_connection();
            amqp_destroy_connection(conn);
            return 0;
        }
        EOF

        gcc $(pkg-config --cflags librabbitmq) test.c -o test $(pkg-config --libs librabbitmq)
        ./test
