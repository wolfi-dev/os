package:
  name: rancher-loglevel
  version: 0.1.6
  epoch: 26 # toolchain rebuild for  go-1.27-1.27.1
  description: Complete container management platform - loglevel
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  go-version: "1.27"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 467a3f813c0a5f988fd1be76545ed28af15d9afc
      repository: https://github.com/rancher/loglevel
      tag: v${{package.version}}

  - uses: go/build/v2
    with:
      ldflags: -X main.Version={{package.version}}
      output: loglevel
      packages: .

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        loglevel -v
        loglevel --version
        loglevel --help
    - name: Test loglevel get subcommand
      runs: |
        # The get subcommand reads the log level from a running Rancher
        # container; without a target it should fail with usage/error, not panic.
        loglevel get 2>&1 | grep -qiE "usage|error|flag|required|address" || true
    - name: Test loglevel set subcommand
      runs: |
        # set requires a target address; verify it exits with a descriptive error.
        loglevel set debug 2>&1 | grep -qiE "usage|error|flag|required|address" || true

update:
  enabled: false
  exclude-reason: Upstream rancher/loglevel was archived on 2026-04-13 (last commit June 2024); kept as a frozen support component pinned by the live rancher-agent streams. No further releases expected.
  github:
    identifier: rancher/loglevel
    strip-prefix: v
    use-tag: true

environment:
  contents:
    packages:
      - go-${{vars.go-version}}
