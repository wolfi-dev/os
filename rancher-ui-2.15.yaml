package:
  name: rancher-ui-2.15
  version: "2.15.1"
  epoch: 0
  description: Rancher UI
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  nodejs-version: '24'
  ui-dir: '/usr/share/rancher/ui'

environment:
  contents:
    packages:
      - bash
      - busybox
      - curl
      - nodejs-24
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rancher/dashboard
      tag: v${{package.version}}
      expected-commit: bfaa192872bba4b403938ecad4218cb4d247b4c6
      recurse-submodules: true

  - runs: |
      # Build dashboard (Harvester extension embedding removed in v2.15+)
      ./scripts/build-embedded

      # Extract and install dashboard
      mkdir -p ${{targets.destdir}}/${{vars.ui-dir}}/dashboard
      tar xvf dist/v${{package.version}}.tar.gz \
        -C ${{targets.destdir}}/${{vars.ui-dir}}/dashboard \
        --strip-components=2
      ln -s dashboard/index.html ${{targets.destdir}}/${{vars.ui-dir}}/

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - alpha
  github:
    identifier: rancher/dashboard
    strip-prefix: v
    tag-filter: v2.15.
    use-tag: true

test:
  environment:
    contents:
      packages:
        - curl
        - nodejs-24
        - npm
        - wait-for-it
  pipeline:
    - name: "Test UI"
      uses: test/daemon-check-output
      with:
        start: "/usr/bin/npx http-server ${{vars.ui-dir}}/dashboard -p 8080"
        timeout: 60
        expected_output: |
          serving
          Available on
        post: |
          wait-for-it -t 10 --strict localhost:8080 -- echo "Server is up"
          curl http://localhost:8080/index.html | grep -i "Rancher"
