package:
  name: render-template
  version: "1.0.10"
  epoch: 2 # toolchain rebuild for  go-1.26-1.26.7
  description: CLI tool for rendering templates with custom data
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 4Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bitnami/render-template
      tag: v${{package.version}}
      expected-commit: bc9a6df0be359c708fdc675c7e2d3e5a92a4ab40

  - uses: go/build
    with:
      packages: .
      output: render-template

update:
  enabled: true
  github:
    identifier: bitnami/render-template
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - runs: |
        echo 'hello {{who}}' > template.tpl
        render-template template.tpl | grep hello
        who=pikachu render-template template.tpl | grep pikachu

environment:
  contents:
    packages:
      - go-1.26
