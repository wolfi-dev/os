package:
  name: rocq-stdlib
  version: "9.1.0"
  epoch: 0
  description: "The standard library of the Rocq Prover"
  copyright:
    - license: LGPL-2.1-only
  resources:
    cpu: "8"
    memory: 16Gi
  dependencies:
    runtime:
      # Compiled .vo files load only into the Rocq that compiled them.
      - rocq~${{vars.rocq-version}}

vars:
  rocq-version: 9.2.0

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - rocq~${{vars.rocq-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rocq-prover/stdlib
      tag: V${{package.version}}
      expected-commit: b383e2c015ef3ac0c6c6550975ec52fc6a405355

  # The opam package's build (`make`, `make install`), run in theories/
  # directly: the top-level Makefile passes an unbounded -j. `rocq
  # makefile` projects install under `rocq c -where`/user-contrib,
  # prefixed with DESTDIR.
  - runs: |
      make -C theories -j$(nproc) all
      make -C theories install DESTDIR="${{targets.contextdir}}"

test:
  pipeline:
    - name: prove with the standard library
      runs: |
        cat > Lia.v <<'EOF'
        From Stdlib Require Import Lia ZArith List.
        Import ListNotations.
        Theorem lia_example : forall x y : Z, (2 * x + 1 <> 2 * y)%Z.
        Proof. intros. lia. Qed.
        Theorem rev_length_example : length (rev [1; 2; 3]) = 3.
        Proof. reflexivity. Qed.
        Print Assumptions lia_example.
        EOF
        rocq c Lia.v | tee lia.log
        grep -F "Closed under the global context" lia.log

update:
  enabled: false
  exclude-reason: refinedrust is compiled against this exact release and pins it, as its opam file requires rocq-stdlib 9.1.0
