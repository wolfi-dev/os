package:
  name: rsass
  version: "0.29.2"
  epoch: 4
  description: "A Rust-based Sass compiler"
  copyright:
    - license: MIT

vars:
  rust-version: "1.96"

environment:
  contents:
    packages:
      - glibc-2.43-dev
      - glibc-2.44
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kaj/rsass.git
      tag: v${{package.version}}
      expected-commit: 25d8e9a9f706dd681d5899f03dbe73e3ce3fb446

  - name: Set rsass-cli version
    runs: |
      # Upstream v0.29.2 tagged with rsass-cli still at 0.29.1-PRE, so
      # `rsass --version` reports the wrong version. Align it with the tag.
      sed -i 's/^version = ".*"/version = "${{package.version}}"/' rsass-cli/Cargo.toml
      grep -q '^version = "${{package.version}}"' rsass-cli/Cargo.toml

  - name: Build
    uses: cargo/build
    with:
      modroot: .
      output: rsass

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: rsass
        version: ${{package.version}}
    - name: Render test SASS file
      runs: |
        set -euo pipefail
        # Create a test SASS file
        mkdir -p /tmp/scss
        cat > /tmp/scss/test.scss <<EOF
        \$primary-color: blue;
        body {
        background-color: \$primary-color;
        }
        EOF
        # Render the test SASS file to CSS
        rsass /tmp/scss/test.scss > /tmp/scss/test.css
        # Check the rendered CSS file
        grep 'background-color: blue;' /tmp/scss/test.css

update:
  enabled: true
  github:
    identifier: kaj/rsass
    use-tag: true
    strip-prefix: v
