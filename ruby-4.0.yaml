package:
  name: ruby-4.0
  version: "4.0.8"
  epoch: 2 # json default gem 2.19.9
  description: "the Ruby programming language"
  copyright:
    - license: Ruby
    - license: BSD-2-Clause
  dependencies:
    provides:
      - ruby=${{package.full-version}}
      # These are bundled gems
      - ruby${{vars.ruby-major-version}}-csv
      - ruby${{vars.ruby-major-version}}-base64
      - ruby${{vars.ruby-major-version}}-drb
      - ruby${{vars.ruby-major-version}}-logger
      - ruby${{vars.ruby-major-version}}-ostruct
    runtime:
      - glibc
      - gmp
      - libgcc
      - ruby${{vars.ruby-major-version}}-json
      - yaml
      - zlib
  resources:
    cpu: "5"
    memory: 9Gi

environment:
  environment:
    CFLAGS: -DOPENSSL_NO_ENGINE -DOPENSSL_NO_DSA -DOPENSSL_NO_DH
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - expat-dev
      - gcc-14-default
      - gdbm-dev
      - glibc-2.44-dev
      - gmp-dev
      - graphviz
      - jemalloc-dev
      - libffi-dev
      - libxcrypt-dev
      - linux-headers
      - mpdecimal-dev
      - ncurses-dev
      - oniguruma-dev
      - openssl-${{vars.openssl-version}}-dev
      - pkgconf
      - readline-dev
      - ruby-3.4
      - rust-${{vars.rust-version}}
      - tk-dev
      - yaml-dev
      - zlib-dev

vars:
  openssl-version: "4.0"
  prefix: /usr
  rust-version: "1.99"

var-transforms:
  - from: ${{package.version}}
    match: (\d+\.\d+).*
    replace: $1
    to: ruby-major-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ruby/ruby
      tag: v${{package.version}}
      expected-commit: 60c3d71bfbf9790229c682e26f8ec968f078c7da
      cherry-picks: |
        # Hardening: Time#strftime zone width overflow, https://github.com/ruby/ruby/pull/19457
        master/5c52c2a37bed5507c1898486cdf7eba736296ed4: fix out-of-bound write for huge widths on the strftime z conversions
        # Hardening: CP50220 encoder max_output, https://github.com/ruby/ruby/pull/18661
        master/720d9e11547bff07e0800725c1cbf54814de2462: fix max_output of the CP50220 encoder
        # Hardening: sprintf %c width overflow, https://github.com/ruby/ruby/pull/17221
        master/e39475a544f08ce5f140213c740f2464933a2bae: reject a width that overflows the sprintf result size

  - uses: git-checkout
    with:
      repository: https://github.com/ruby/openssl
      tag: v4.0.2
      expected-commit: 6e410b804f4c6a52c146fe651941bafdbb332754
      destination: upstream/ruby/openssl

  # The bundled json default gem (2.18.0) is what `require "json"` loads
  # without Bundler. 2.19.x fixes a string unescape overflow with
  # allow_control_characters, generator depth overflows, a JSON::State
  # use-after-free during Array#to_json, CVE-2026-33210, a parser read of a
  # source string mutated by a callback (2.19.7) and CVE-2026-54696, a heap
  # overflow in JSON.dump into an IO (2.19.9), none of which are in a 4.0
  # release; sync it from upstream the way openssl is.
  - uses: git-checkout
    with:
      repository: https://github.com/ruby/json
      tag: v2.19.9
      expected-commit: 2cff2678d5af54890a49da58345ac141b571f661
      destination: upstream/ruby/json

  - uses: patch
    with:
      patches: |
        remove-already-provided-gems-from-gems_bundled_gems.patch
        0001-tools-do-not-escape-build-location.patch
        CVE-2026-110264.patch

  # Hardening: Ractor::Port.allocate left the owner Ractor NULL and the port
  # methods dereferenced it, https://github.com/ruby/ruby/pull/18092. Does not
  # cherry-pick cleanly onto 4.0.8, so it is carried as a patch.
  - uses: patch
    with:
      patches: |
        ractor-port-uninitialized.patch

  - uses: patch
    working-directory: upstream/ruby/openssl
    with:
      patches: |
        ../../../0001-Add-pkcs5-argument-to-OpenSSL-KDF.pbkdf2_hmac.patch

  # on_load type confusion, https://github.com/ruby/json/pull/1084: fixed in
  # json 3.1.0, which is too far from 2.19 for a default gem, so it is
  # backported onto 2.19.9.
  - uses: patch
    working-directory: upstream/ruby/json
    with:
      patches: |
        ../../../json-on-load-type-confusion.patch

  - name: Update default openssl and json gems with our patched versions
    runs: |
      ruby tool/sync_default_gems.rb openssl
      ruby tool/sync_default_gems.rb json

  - name: Generate and Configure
    runs: |
      ./autogen.sh
      ./configure \
         --host=${{host.triplet.gnu}} \
         --build=${{host.triplet.gnu}} \
         --target=${{host.triplet.gnu}} \
         --prefix=${{vars.prefix}} \
         --enable-shared \
         --disable-rpath \
         --sysconfdir=/etc \
         --enable-mkmf-verbose \
         --enable-yjit \
         --with-jemalloc

  - uses: autoconf/make

  # Update and Extract bundled gems
  - uses: autoconf/make
    with:
      opts: update-gems extract-gems

  # Build documentation
  - uses: autoconf/make
    with:
      opts: rdoc capi

  - uses: autoconf/make-install

  - runs: |
      # Ignore the patch version of ruby since ruby will install under the
      # version of the latest standard library. Should produce the string 4.0.*
      RUBYWILD="${{vars.ruby-major-version}}.*"

      RUBYDIR=${{targets.destdir}}${{vars.prefix}}/lib/ruby/$RUBYWILD
      rm -rf ${RUBYDIR}/bundler
      rm -f ${RUBYDIR}/bundler.rb

      GEMDIR=${{targets.destdir}}${{vars.prefix}}/lib/ruby/gems/$RUBYWILD
      rm -rf ${GEMDIR}/gems/bundler-*
      rm -f ${GEMDIR}/specifications/default/bundler-*.gemspec
      rm -f ${GEMDIR}/specifications/default/json-*.gemspec

      rm -f ${{targets.destdir}}/usr/bin/bundle \
         ${{targets.destdir}}/usr/bin/bundler

  - runs: |
      find ${{targets.destdir}} -name 'mkmf.log' -exec rm {} \;

subpackages:
  - name: "ruby-${{vars.ruby-major-version}}-doc"
    description: "ruby documentation"
    pipeline:
      - uses: split/manpages
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share
          mv "${{targets.destdir}}"/usr/share/doc "${{targets.subpkgdir}}"/usr/share/
          mv "${{targets.destdir}}"/usr/share/ri "${{targets.subpkgdir}}"/usr/share/
    test:
      pipeline:
        - uses: test/docs

  - name: "ruby-${{vars.ruby-major-version}}-dev"
    description: "ruby development headers"
    dependencies:
      runtime:
        - jemalloc-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: ruby/ruby
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v4.0

test:
  environment:
    contents:
      packages:
        - ruby${{vars.ruby-major-version}}-bundler
  pipeline:
    - name: Test binaries
      runs: |
        ruby --version | grep -F ${{package.version}}

        cat <<EOF >> /tmp/hello.rb
        puts("Hello Wolfi!")
        EOF

        ruby /tmp/hello.rb
    - name: Validate HTTPS support
      runs: |
        bundle init
        OUTPUT=$(bundle doctor --ssl 2>&1)
        echo "$OUTPUT"
        if echo "$OUTPUT" | grep -Fi "failed"; then
          exit 1
        fi
    - name: Regexp compiler rejects overflowing repeat/null-check IDs (CVE-2026-110264)
      runs: |
        cat >/tmp/regexp-cve.rb <<'EOF'
        { "(?:foobar){0,100}" => /too many range repeat/,
          "(?:(?:foo)?|(?:bar)?)*" => /too many null check/ }.each do |pat, want|
          begin
            Regexp.new(pat * 100000)
            abort "not rejected: #{pat} * 100000"
          rescue RegexpError => e
            abort "wrong error for #{pat}: #{e.message[0, 80]}" unless e.message =~ want
            puts "ok: #{pat} * 100000 -> #{e.message[0, 40]}"
          end
        end
        EOF
        ruby /tmp/regexp-cve.rb
    - name: Regexp compiler hardening (ruby/ruby#13332, ruby/ruby#19020)
      runs: |
        cat >/tmp/regexp-hardening.rb <<'EOF'
        # ruby/ruby#13332: used to double-free the parse node
        begin
          Regexp.new("|{2,1}")
          abort "not rejected: |{2,1}"
        rescue RegexpError => e
          puts "ok: |{2,1} -> #{e.message}"
        end
        # ruby/ruby#19020: the expansion check overflowed and compile hung
        ["(?:.{90000,}){90000}", "(?:.{46341,}){46341}"].each do |src|
          abort "unexpected match: #{src}" unless Regexp.new(src).match("x" * 10).nil?
          puts "ok: #{src} compiled"
        end
        EOF
        # A regressed compile hangs while growing memory. Ruby defers SIGTERM
        # to an interrupt check that regexp compilation never reaches, so a
        # plain timeout cannot stop it: use SIGKILL.
        timeout -s KILL 60 ruby /tmp/regexp-hardening.rb
    - name: Time strftime zone width overflow (ruby/ruby#19457)
      runs: |
        cat >/tmp/strftime-zone.rb <<'EOF'
        require 'rbconfig/sizeof'
        # An INT_MAX width on the %z family overflowed the buffer size check and
        # wrote the padding out of bounds; upstream now fails with ERANGE.
        t = Time.at(0, in: 0)
        max = RbConfig::LIMITS["INT_MAX"]
        ["%#{max}z", "%#{max}:z", "%#{max}::z", "%#{max}:::z"].each do |fmt|
          begin
            t.strftime(fmt)
            abort "not rejected: #{fmt}"
          rescue Errno::ERANGE
            puts "ok: #{fmt} -> ERANGE"
          end
        end
        EOF
        ruby /tmp/strftime-zone.rb
    - name: CP50220 encoder output buffer overflow (ruby/ruby#18661)
      runs: |
        cat >/tmp/cp50220.rb <<'EOF'
        # The encoder declared max_output 5 but a held-back katakana flushed by
        # the next character writes 9 bytes; this used to abort the process with
        # "[BUG] probable buffer overflow" or corrupt the heap.
        ec = Encoding::Converter.new("CP51932", "CP50220")
        src = "\x8E\xB6\x8E\xE0".b
        dst = "\0" * 64
        r = ec.primitive_convert(src, dst, 0, 8)
        abort "first step: #{r.inspect}, #{dst.bytesize} bytes" unless r == :destination_buffer_full && dst.bytesize == 8
        r = ec.primitive_convert(src, dst, 8, 8)
        abort "second step: #{r.inspect}" unless r == :finished
        want = "\e$B\x25\x2B\e(I\x60\e(B".b
        abort "wrong output: #{dst.b.inspect}" unless dst.b == want
        puts "ok: split CP50220 output #{dst.b.inspect}"
        out = ("x" + "\uFF76a" * 158).encode("CP50220")
        puts "ok: String#encode produced #{out.bytesize} bytes"
        EOF
        ruby /tmp/cp50220.rb
    - name: sprintf %c width overflow (ruby/ruby#17221)
      runs: |
        cat >/tmp/sprintf-width.rb <<'EOF'
        require 'rbconfig/sizeof'
        # width + character length overflowed int and the result buffer was
        # filled past its end; upstream now rejects the width.
        max = RbConfig::LIMITS["INT_MAX"]
        [["%*c", [max, 0x80]], ["%#{max}c", [233]], ["%-#{max}c", [233]]].each do |fmt, args|
          begin
            format(fmt, *args)
            abort "not rejected: #{fmt}"
          rescue ArgumentError => e
            abort "wrong error for #{fmt}: #{e.message}" unless e.message =~ /width too big/
            puts "ok: #{fmt} -> #{e.message}"
          end
        end
        EOF
        ruby /tmp/sprintf-width.rb
    - name: Ractor::Port rejects uninitialized ports (ruby/ruby#18092)
      runs: |
        cat >/tmp/ractor-port.rb <<'EOF'
        # Ractor::Port.allocate leaves the owner Ractor NULL; the methods used
        # to dereference it and segfault.
        port = Ractor::Port.allocate
        { inspect: -> { port.inspect }, closed?: -> { port.closed? },
          send: -> { port.send(1) }, receive: -> { port.receive },
          close: -> { port.close } }.each do |name, blk|
          begin
            blk.call
            abort "not rejected: Ractor::Port##{name}"
          rescue TypeError => e
            abort "wrong message for #{name}: #{e.message}" unless e.message == "uninitialized Ractor::Port"
            puts "ok: Ractor::Port##{name} -> TypeError"
          end
        end
        EOF
        ruby /tmp/ractor-port.rb
    - name: Bundled json default gem is 2.19.9 with the on_load fix
      runs: |
        cat >/tmp/json-default-gem.rb <<'EOF'
        require 'rbconfig'
        # Load the interpreter's own copy, not whatever json gem is installed.
        require File.join(RbConfig::CONFIG["rubylibdir"], "json")
        abort "json #{JSON::VERSION} loaded from #{$LOADED_FEATURES.grep(/json\.rb/).first}" unless JSON::VERSION == "2.19.9"
        puts "ok: json #{JSON::VERSION}"
        # ruby/json#1084: a non-Proc on_load used to be called as one and crash
        [-> { JSON::Coder.new(on_load: 42).load("[1]") },
         -> { JSON.parse("[1]", on_load: "x") }].each do |blk|
          begin
            blk.call
            abort "on_load not rejected"
          rescue TypeError => e
            puts "ok: on_load -> #{e.message}"
          end
        end
        # ruby/json#948 and 2.19.6: negative and huge depths used to overflow
        # the indentation size
        begin
          JSON.generate({"a" => 1}, depth: -1)
          abort "negative depth not rejected"
        rescue ArgumentError => e
          puts "ok: depth -1 -> #{e.message}"
        end
        begin
          JSON.generate([[1]], indent: " " * 5, array_nl: "\n", depth: 3_689_348_814_741_910_324, max_nesting: 0)
          abort "huge depth not rejected"
        rescue RangeError, ArgumentError => e
          puts "ok: huge depth -> #{e.class}"
        end
        # 2.19.7: a depth whose indentation size still fits in size_t wrapped
        # the buffer growth and wrote past the stack buffer
        begin
          JSON.generate([[1]], indent: "  ", array_nl: "\n", depth: 2**62, max_nesting: 0)
          abort "depth 2**62 not rejected"
        rescue ArgumentError => e
          puts "ok: depth 2**62 -> #{e.message}"
        end
        # CVE-2026-54696 (2.19.9): JSON.dump into an IO grew the stack buffer to
        # the 16383-byte IO buffer without counting what it already held, then
        # wrote past it. Under jemalloc the overrun is silent, so check for it
        # directly: it surfaces as one write larger than the buffer.
        sink = Object.new
        def sink.chunks = (@chunks ||= [])
        def sink.write(s) = (chunks << s.bytesize; s.bytesize)
        def sink.flush = self
        JSON.dump(["a" * 490, "b" * 16_000], sink)
        abort "JSON.dump overran its IO buffer: wrote #{sink.chunks.max} bytes at once" if sink.chunks.max > 16_383
        puts "ok: JSON.dump IO chunks #{sink.chunks.inspect}"
        # 2.19.7: the parser read straight from the caller's string, so a
        # callback that rewrote it changed the rest of the parse. The float sits
        # in a nested array so its callback runs before the rest is scanned.
        source = "[[2.5]," + ("1," * 200) + "1]"
        mutator = Class.new { define_method(:initialize) { |_| source.tr!("1", "0") } }
        rest = JSON.parse(source, decimal_class: mutator).drop(1)
        abort "parse followed a mutated source: #{rest.tally.inspect}" unless rest == [1] * 201
        puts "ok: parse unaffected by source mutation"
        EOF
        ruby /tmp/json-default-gem.rb
    - uses: test/tw/help-check
      with:
        bins: |
          gem
          irb
          rake
          rdbg
          rdoc
          ri
          ruby
