package:
  name: ruby3.2-anonymous_loader
  version: "0.1.3"
  epoch: 0
  description: Evaluate Ruby source files inside fresh anonymous modules
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-version_gem
  resources:
    cpu: 1
    memory: 2Gi

vars:
  gem: anonymous_loader

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

environment:
  contents:
    packages:
      - build-base
      - ca-certificates-bundle
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ruby-oauth/anonymous_loader
      tag: v${{package.version}}
      expected-commit: 52bf612a4a82530dd255459cb84a3342a7af956d

  - runs: sed -i '/signing_key/d' ${{vars.gem}}.gemspec

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

test:
  environment:
    contents:
      packages:
        - ruby-${{vars.rubyMM}}
  pipeline:
    - uses: test/tw/gem-check
    - name: Verify library loading
      runs: |
        ruby -e "require 'anonymous_loader'; puts 'Successfully loaded anonymous_loader library'"

update:
  enabled: true
  github:
    identifier: ruby-oauth/anonymous_loader
    strip-prefix: v
