# Generated from https://github.com/uken/fluent-plugin-elasticsearch
package:
  name: ruby3.2-fluent-plugin-elasticsearch
  version: "6.0.0"
  epoch: 2
  description: Elasticsearch output plugin for Fluent event collector
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-elasticsearch
      - ruby${{vars.rubyMM}}-excon
      - ruby${{vars.rubyMM}}-faraday
      - ruby${{vars.rubyMM}}-faraday-excon
      - ruby${{vars.rubyMM}}-fluentd

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

vars:
  gem: fluent-plugin-elasticsearch

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/uken/fluent-plugin-elasticsearch.git
      tag: v${{package.version}}
      expected-commit: df737bc30716f9b7df02cf19b07e80019ff31a0a

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

update:
  enabled: true
  github:
    identifier: uken/fluent-plugin-elasticsearch
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - runs: |
        ruby -e "require 'fluent/plugin/in_elasticsearch'"
        ruby -e "require 'fluent/plugin/out_elasticsearch'"
        ruby -e "require 'fluent/plugin/elasticsearch_error_handler'"
        ruby -e "require 'fluent/plugin/elasticsearch_tls'"
