#nolint:unused-var-transform
package:
  name: ruby3.2-jrjackson
  version: "0.5.2"
  epoch: 3 # CVE-2026-91777
  description: A mostly native JRuby wrapper for the java jackson json processor jar
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 9Gi

environment:
  contents:
    packages:
      - build-base
      - jruby-9.4
      - jruby-9.4-default-ruby
      - openjdk-11-default-jdk # build with JDK 11 since this is the declared version in the upstream Mavenfile
  environment:
    JAVA_HOME: /usr/lib/jvm/java-11-openjdk

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 834c64396b06e545b24f1dbe8dba0fa20557bb44
      repository: https://github.com/guyboertje/jrjackson
      tag: v${{package.version}}

  - name: "Fix GHSA-5gvw-p9qm-jgwh, CVE-2026-68497, CVE-2026-91777, CVE-2026-91776"
    uses: sed
    with:
      path: lib/jrjackson/build_info.rb
      pattern: '2\.21\.4'
      replacement: '2.21.7'

  - runs: |
      bundle install
      bundle exec rake
      rake test

  - runs: |
      jruby -S gem build ${{vars.gem}}.gemspec

  - uses: ruby/install
    with:
      # Output file name has `java` suffix.
      gem-file: ${{vars.gem}}-${{package.version}}-java.gem
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: jrjackson

update:
  enabled: true
  github:
    identifier: guyboertje/jrjackson
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - gem-check
        - jruby-9.4
        - jruby-9.4-default-ruby
        - openjdk-11-default-jvm
  pipeline:
    - uses: test/tw/gem-check
    - runs: |
        cat <<EOF > /tmp/test.rb
        require 'jrjackson'

        obj = {:key1 => "value1"}
        puts obj

        result = JrJackson::Json.dump(obj)
        puts result

        puts JrJackson::Json.parse(result)
        EOF

        jruby /tmp/test.rb

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
