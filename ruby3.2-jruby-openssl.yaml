# Generated from https://github.com/jruby/jruby-openssl
package:
  name: ruby3.2-jruby-openssl
  version: "0.19.0"
  epoch: 0 # go/wolfi-rsc/ruby3.2-jruby-openssl
  description: JRuby-OpenSSL is an add-on gem for JRuby that emulates the Ruby OpenSSL native library.
  copyright:
    - license: GPL-2.0-or-later AND EPL-1.0 AND LGPL-2.1-or-later
  dependencies:
    runtime:
      - openjdk-${{vars.java-version}}-default-jvm
      - ruby${{vars.rubyMM}}-bouncy-castle-java
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - git
      - jq
      - maven
      - openjdk-${{vars.java-version}}-default-jdk
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev
  environment:
    JAVA_HOME: /usr/lib/jvm/java-${{vars.java-version}}-openjdk

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c7972ee33b9fee5d7beddeda42720c1a9d7e3479
      repository: https://github.com/jruby/jruby-openssl
      tag: v${{package.version}}

  - uses: auth/maven

  - runs: |
      # Build lib/jopenssl.jar from Java sources using Maven.
      # The gemspec in 0.19.0+ explicitly lists lib/jopenssl.jar as a
      # required file, so it must exist before gem build runs.
      mvn prepare-package -Dmaven.test.skip=true

      # prepare-package also runs dependency:copy-dependencies (bound to
      # generate-test-resources), which drops BouncyCastle into vendor/, and
      # the 0.19.0 gemspec globs vendor/**/*.jar. We already ship BouncyCastle
      # via ruby${{vars.rubyMM}}-bouncy-castle-java, so drop the copies.
      rm -rf vendor

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      # Output file name has `java` suffix.
      gem-file: ${{vars.gem}}-${{package.version}}-java.gem
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: jruby-openssl
  # Upstream sets a floor, not a version: the enforcer wants
  # requireJavaVersion [11,) and the compiler pins release 8, so any JDK >= 11
  # emits the same bytecode. 21 is the LTS upstream CI builds on and the one
  # jruby-10.1 uses.
  java-version: "21"

update:
  enabled: true
  # There are some non-semantic tags that break our update block.
  ignore-regex-patterns:
    - .*\.cr*
  github:
    identifier: jruby/jruby-openssl
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: |
          openssl
          jopenssl/version
          openssl/bn
          openssl/cipher
          openssl/digest
          openssl/hmac
          openssl/marshal
          openssl/pkcs5
          openssl/pkey
          openssl/x509
