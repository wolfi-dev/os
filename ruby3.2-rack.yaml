package:
  name: ruby3.2-rack
  version: "3.2.7"
  epoch: 0 # go/wolfi-rsc/ruby3.2-rack
  description: Rack provides a minimal, modular and adaptable interface for developing web applications in Ruby
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 70d2e1046789a70e240e01b9ac0b3ffc9b26d33f
      repository: https://github.com/rack/rack
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: rack

update:
  enabled: true
  git:
    strip-prefix: v
  ignore-regex-patterns:
    - test # Bad tag

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  environment:
    contents:
      packages:
        - curl
        - ruby${{vars.rubyMM}}-rackup
        - ruby${{vars.rubyMM}}-puma
  pipeline:
    - uses: test/tw/gem-check
    - uses: ruby/require
      with:
        module_name: ${{vars.gem}}
    - runs: |
        cat <<EOF > config.ru
        run do |env|
          [200, {}, ["Hello World"]]
        end
        EOF

        rackup > /dev/null 2>&1 &
        sleep 1

        curl http://localhost:9292 | grep -F "Hello World"
