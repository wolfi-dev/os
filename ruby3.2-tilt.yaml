# Generated from https://github.com/jeremyevans/tilt
package:
  name: ruby3.2-tilt
  version: "2.9.0"
  epoch: 0 # go/wolfi-rsc/ruby3.2-tilt
  description: Generic interface to multiple Ruby template engines
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby-${{vars.rubyMM}}
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f0d75c60e3a6aeb85505773af7e1ea2f4fcce17c
      repository: https://github.com/jeremyevans/tilt
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: tilt

update:
  enabled: true
  github:
    identifier: jeremyevans/tilt
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/gem-check

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
