package:
  name: ruby3.2-tzinfo-data
  version: "1.2026.5"
  epoch: 0
  description: TZInfo::Data contains data from the IANA Time Zone database packaged as Ruby modules for use with TZInfo.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-tzinfo
      - ruby-${{vars.rubyMM}}
  resources:
    cpu: "2"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

vars:
  gem: tzinfo-data

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8df8badc7bed5b6ad5b54440dd9985be8ef54121
      repository: https://github.com/tzinfo/tzinfo-data
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

update:
  enabled: true
  github:
    identifier: tzinfo/tzinfo-data
    strip-prefix: v

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: |
          tzinfo/data
          tzinfo/data/tzdataparser
          tzinfo/data/version
