package:
  name: ruby3.3-faraday
  version: "2.15.1"
  epoch: 0 # go/wolfi-rsc/ruby3.3-faraday
  description: HTTP/REST API client library.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-faraday-net_http
      - ruby${{vars.rubyMM}}-ruby2_keywords
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0cfec3e3fbf71b5e481ffd1239646360b41f4c5d
      repository: https://github.com/lostisland/faraday
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: faraday

test:
  environment:
    contents:
      packages:
        - ruby${{vars.rubyMM}}-faraday-net_http
        - ruby${{vars.rubyMM}}-net-http
  pipeline:
    - uses: test/tw/gem-check
    - name: Basic usage with Test Adapter
      runs: |
        cat <<EOF > basic_usage_test.rb
        require 'faraday'
        stubs = Faraday::Adapter::Test::Stubs.new do |stub|
          stub.get('/wolfi') { |env| [200, {}, 'Wolfi OS'] }
        end
        conn = Faraday.new { |b| b.adapter :test, stubs }
        response = conn.get('/wolfi')
        if response.status == 200 && response.body == 'Wolfi OS'
          puts "Basic usage test passed!"
        else
          raise "Basic usage test failed"
        end
        EOF
        ruby basic_usage_test.rb
    - name: Functional test with middleware and Test Adapter
      runs: |
        cat <<EOF > functional_test.rb
        require 'faraday'
        require 'json'
        stubs = Faraday::Adapter::Test::Stubs.new do |stub|
          stub.post('/post') { |env| [200, {}, env.body] }
        end
        conn = Faraday.new do |f|
          f.request :url_encoded
          f.adapter :test, stubs
        end
        response = conn.post("/post", { test_key: 'test_value' })
        if response.status == 200 && response.body == "test_key=test_value"
          puts "Functional test passed!"
        else
          raise "Functional test failed: #{response.body}"
        end
        EOF
        ruby functional_test.rb

update:
  enabled: true
  github:
    identifier: lostisland/faraday
    strip-prefix: v

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
