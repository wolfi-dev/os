package:
  name: ruby3.3-io-endpoint
  version: "0.18.0"
  epoch: 0
  description: A Ruby gem providing endpoint abstractions for network clients and servers.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby-${{vars.rubyMM}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1f1076f1d151a39cd8e09c9ab058579a0e289fb2
      repository: https://github.com/socketry/io-endpoint
      tag: v${{package.version}}

  - runs: |
      # Relax the openssl gem constraint to match the openssl gem bundled with
      # Ruby 3.3 (3.2.x); mirrors the sibling ruby3.3-io-stream package.
      sed -i 's/add_dependency "openssl", ">= 3\.3\.0"/add_dependency "openssl", ">= 3.2.0"/' ${{vars.gem}}.gemspec

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: io-endpoint

test:
  environment:
    contents:
      packages:
        - ruby-${{vars.rubyMM}}
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: io/endpoint
    - runs: |
        # Functional TCP round-trip over a loopback socket using io-endpoint's
        # own synchronous API (its default wrapper does blocking ::Socket I/O,
        # so no async reactor is needed).
        ruby <<-EOF
        require 'io/endpoint'
        require 'io/endpoint/host_endpoint' # 0.18.0 no longer auto-requires this

        message = "Hello from io-endpoint!"

        # Server: bind an ephemeral loopback port (io-endpoint's bind() also listens).
        servers = IO::Endpoint.tcp("127.0.0.1", 0).bind
        server  = servers.first
        port    = server.local_address.ip_port

        server_thread = Thread.new do
          peer, _ = server.accept
          peer.write(message)
          peer.close
        end

        # Client: connect via io-endpoint and read the payload back.
        received = IO::Endpoint.tcp("127.0.0.1", port).connect { |socket| socket.read }

        server_thread.join
        servers.each(&:close)

        raise "round-trip mismatch: #{received.inspect}" unless received == message
        puts "io-endpoint functional TCP round-trip OK"
        EOF

update:
  enabled: true
  github:
    identifier: socketry/io-endpoint
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
