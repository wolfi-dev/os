package:
  name: ruby3.3-mail
  version: "2.9.1"
  epoch: 0 # go/wolfi-rsc/ruby3.3-mail
  description: A really Ruby Mail handler.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-mini_mime
      - ruby${{vars.rubyMM}}-net-imap
  resources:
    cpu: "2"
    memory: 5Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mikel/mail
      tag: ${{package.version}}
      expected-commit: d645d7b5b7d03218b0bc8971ef041c991a63f5f7

  # Upstream keeps version.rb on an 'edge' build marker between releases and
  # strips it only when pushing the gem, so the 2.9.1 tag builds
  # mail-2.9.1.edge.gem while ruby/install looks for mail-2.9.1.gem. Drop the
  # marker to match the published gem.
  - name: Strip the edge build marker from the gem version
    uses: sed
    with:
      path: lib/mail/version.rb
      pattern: BUILD = 'edge'
      replacement: BUILD = nil

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: mail

update:
  enabled: true
  github:
    identifier: mikel/mail
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check
