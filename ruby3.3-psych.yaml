# Generated from https://github.com/ruby/psych
package:
  name: ruby3.3-psych
  version: "5.5.0"
  epoch: 1 # glibc: 2.43->2.44
  description: Psych is a YAML parser and emitter.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-stringio
      - ruby-${{vars.rubyMM}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - glibc-2.44-dev
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev
      - yaml-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ruby/psych.git
      tag: v${{package.version}}
      expected-commit: 9b12bb3fb679c2bc2399ffec0bed15b58ce839e8

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: psych

test:
  pipeline:
    - uses: test/tw/gem-check
    - uses: test/tw/ldd-check

update:
  enabled: true
  require-sequential: true
  github:
    identifier: ruby/psych
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
