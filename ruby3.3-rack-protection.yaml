# Generated from https://github.com/sinatra/sinatra/tree/main/rack-protection
package:
  name: ruby3.3-rack-protection
  version: "4.2.2"
  epoch: 0 # rebuild to publish ruby3.3-rack-protection-source
  description: Protect against typical web attacks, works with all Rack apps, including Rails
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-rack

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ebcaff20b358ad44948dfb23f7419087e592f0ba
      repository: https://github.com/sinatra/sinatra
      tag: v${{package.version}}

  - uses: ruby/unlock-spec

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}
      dir: rack-protection

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}
      dir: rack-protection

  - uses: ruby/clean

vars:
  gem: rack-protection

test:
  pipeline:
    - uses: test/tw/gem-check

update:
  enabled: true
  github:
    identifier: sinatra/sinatra
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
