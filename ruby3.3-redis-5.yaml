package:
  name: ruby3.3-redis-5
  version: "5.4.1"
  epoch: 0
  description: A Ruby client that tries to match Redis API one-to-one, while still providing an idiomatic interface (5.x stream).
  copyright:
    - license: MIT
  dependencies:
    provides:
      - ruby${{vars.rubyMM}}-redis=${{package.full-version}}
    runtime:
      - ruby${{vars.rubyMM}}-redis-client

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6784a3204be44d4ca7891a901295e4a4007a13a5
      repository: https://github.com/redis/redis-rb
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: redis

update:
  enabled: true
  github:
    identifier: redis/redis-rb
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v5.

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check
      with:
        package: redis
        require: |
          redis
          redis/commands
          redis/distributed
          redis/errors
          redis/hash_ring
          redis/subscribe
          redis/version
          redis/commands/bitmaps
          redis/commands/cluster
          redis/commands/connection
          redis/commands/geo
          redis/commands/hashes
          redis/commands/hyper_log_log
          redis/commands/keys
          redis/commands/lists
          redis/commands/pubsub
          redis/commands/scripting
          redis/commands/server
          redis/commands/sets
          redis/commands/sorted_sets
          redis/commands/streams
          redis/commands/strings
          redis/commands/transactions
    - name: The 5.x gem is the one that loads
      runs: |
        ruby <<-EOF
        gem 'redis', '< 6'
        require 'redis'
        raise "loaded redis #{Redis::VERSION}" unless Redis::VERSION == "${{package.version}}"
        client = Redis.new(host: "127.0.0.1", port: 6379, connect_timeout: 0.1, reconnect_attempts: 0)
        raise "client missing #get" unless client.respond_to?(:get)
        puts "redis #{Redis::VERSION} loads under Ruby #{RUBY_VERSION}"
        EOF
