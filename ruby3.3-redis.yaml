# Generated from https://github.com/redis/redis-rb/tree/v5.0.8
package:
  name: ruby3.3-redis
  version: "6.0.0"
  epoch: 1 # drop redundant require from gem-check
  description: A Ruby client that tries to match Redis API one-to-one, while still providing an idiomatic interface.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-redis-client
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0fa108aed7255ea20a9c236d690153abcf81762d
      repository: https://github.com/redis/redis-rb
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: redis

update:
  enabled: true
  github:
    identifier: redis/redis-rb
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check
