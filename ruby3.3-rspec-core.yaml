# Generated from https://github.com/rspec/rspec
package:
  name: ruby3.3-rspec-core
  version: "3.13.7"
  epoch: 0
  description: BDD for Ruby. RSpec runner and example groups.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby3.3-rspec-support

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - coreutils
      - git
      - glibc-2.44-dev
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev
      - ruby3.3-bundler

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rspec/rspec.git
      expected-commit: 44d40ee3a0d55c026d690e1a817d3a4c29989b9c
      tag: rspec-core-v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}
      dir: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}
      dir: ${{vars.gem}}
      opts: -n ${{targets.destdir}}/usr/bin

  - uses: ruby/clean

vars:
  gem: rspec-core

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check

update:
  enabled: true
  github:
    identifier: rspec/rspec
    strip-prefix: rspec-core-v
    use-tag: true
    tag-filter-prefix: rspec-core-v
