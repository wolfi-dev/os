# Generated from https://github.com/rspec/rspec
package:
  name: ruby3.3-rspec-mocks
  version: "3.13.9"
  epoch: 0
  description: RSpec's 'test double' framework, with support for stubbing and mocking
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby3.3-diff-lcs-1.6
      - ruby3.3-rspec-support
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - git
      - glibc-2.44-dev
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rspec/rspec.git
      tag: rspec-mocks-v${{package.version}}
      expected-commit: dd8f4df2f62d9b6db4f302e06e600d42b59c9e5e

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}
      dir: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}
      dir: ${{vars.gem}}

  - uses: ruby/clean

vars:
  gem: rspec-mocks
  rubyMM: "3.3"

update:
  enabled: true
  github:
    identifier: rspec/rspec
    strip-prefix: rspec-mocks-v
    use-tag: true
    tag-filter-prefix: rspec-mocks-v

test:
  environment:
    contents:
      packages:
        - ruby-${{vars.rubyMM}}
  pipeline:
    - name: Verify library loading
      runs: |
        ruby -e "require 'rspec/mocks'; puts 'Successfully loaded RSpec Mocks'"
