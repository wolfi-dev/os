package:
  name: ruby3.3-snaky_hash
  version: "2.0.9"
  epoch: 1 # go/wolfi-rsc/ruby3.3-snaky_hash
  description: 'A Hashie::Mash joint to make #snakelife better'
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # TODO(hashie-pin): matches the upstream gemspec constraint hashie ">= 0.1.0, < 6".
      # Drop this pin once a snaky_hash release allows hashie 6
      # (https://github.com/ruby-oauth/snaky_hash/pull/41); re-check the gemspec for
      # the packaged version at https://rubygems.org/gems/snaky_hash/versions/${{package.version}}
      - ruby${{vars.rubyMM}}-hashie<6
      - ruby${{vars.rubyMM}}-version_gem
  resources:
    cpu: "2"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby${{vars.rubyMM}}-bundler
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a63534472d3766540546f8fab6a36cc392ecddb2
      tag: v${{package.version}}
      repository: https://github.com/ruby-oauth/snaky_hash

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: snaky_hash

update:
  enabled: true
  git:
    strip-prefix: v

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check
    - name: Snake-case keys over Hashie::Mash
      runs: |
        ruby <<-EOF
        require "snaky_hash"
        h = SnakyHash::StringKeyed.new("accessToken" => "abc", "expires_in" => 3600)
        raise "not a Hashie::Mash" unless h.is_a?(Hashie::Mash)
        raise "snake key missing: #{h.keys}" unless h.access_token == "abc" && h["access_token"] == "abc"
        raise "value lost" unless h.expires_in == 3600
        puts "snaky_hash #{SnakyHash::Version::VERSION} ok with hashie #{Hashie::VERSION}"
        EOF
