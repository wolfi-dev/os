package:
  name: ruby3.3-test-unit
  version: "3.7.8"
  epoch: 0
  description: test-unit is an xUnit family unit testing framework for Ruby. Newer than the test-unit gem bundled with Ruby, for gems that require test-unit 3.7 or later.
  copyright:
    - license: (Ruby OR BSD-2-Clause) AND PSF-2.0
  dependencies:
    runtime:
      - ruby-${{vars.rubyMM}}

environment:
  contents:
    packages:
      - busybox
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

vars:
  gem: test-unit

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/test-unit/test-unit
      tag: ${{package.version}}
      expected-commit: 34a125ca2fd83552f2e8bd8000036893372d2c43

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

  # The generated /usr/bin/test-unit wrapper would collide with the one
  # ruby-${{vars.rubyMM}} may install for its bundled test-unit gem.
  - name: Remove bindir
    runs: rm -rf ${{targets.destdir}}/usr/bin

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: test/unit
    - name: Unpinned require resolves this package's copy
      runs: |
        # ruby-${{vars.rubyMM}} bundles an older test-unit; a plain require must
        # load the file this APK owns, not the bundled one. The autorunner is
        # disabled so its empty-suite report does not pollute stdout.
        cat > /tmp/tu-which.rb <<'EOF'
        require 'test/unit'
        Test::Unit::AutoRunner.need_auto_run = false
        spec = Gem.loaded_specs.fetch('test-unit')
        abort "constant #{Test::Unit::VERSION} != spec #{spec.version}" unless Test::Unit::VERSION == spec.version.to_s
        puts $LOADED_FEATURES.grep(%r{/lib/test/unit\.rb\z}).first
        EOF
        loaded=$(ruby /tmp/tu-which.rb)
        echo "loaded: $loaded"
        [ -n "$loaded" ]
        apk info -L ${{package.name}} | grep -xF "${loaded#/}"
    - name: Run a passing and a failing test case
      runs: |
        mkdir -p /tmp/tu
        cat > /tmp/tu/pass_test.rb <<'EOF'
        gem 'test-unit', ENV.fetch('TU_VERSION')
        require 'test/unit'
        class PassTest < Test::Unit::TestCase
          def test_math
            assert_equal(4, 2 + 2)
          end
          def test_raise
            assert_raise(ZeroDivisionError) { 1 / 0 }
          end
        end
        EOF
        cat > /tmp/tu/fail_test.rb <<'EOF'
        gem 'test-unit', ENV.fetch('TU_VERSION')
        require 'test/unit'
        class FailTest < Test::Unit::TestCase
          def test_wrong
            assert_equal("expected", "actual")
          end
        end
        EOF
        export TU_VERSION="${{package.version}}"

        ruby /tmp/tu/pass_test.rb 2>&1 | tee /tmp/tu/pass.log
        grep -F "2 tests, 2 assertions, 0 failures, 0 errors" /tmp/tu/pass.log

        # The autorunner must exit non-zero when an assertion fails.
        if ruby /tmp/tu/fail_test.rb > /tmp/tu/fail.log 2>&1; then
          cat /tmp/tu/fail.log
          echo "failing test case exited 0"
          exit 1
        fi
        cat /tmp/tu/fail.log
        grep -F "1 tests, 1 assertions, 1 failures, 0 errors" /tmp/tu/fail.log
        grep -F "test_wrong(FailTest)" /tmp/tu/fail.log

update:
  enabled: true
  github:
    identifier: test-unit/test-unit
    use-tag: true
