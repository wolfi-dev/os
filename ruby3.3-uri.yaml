package:
  name: ruby3.3-uri
  version: "1.1.2"
  epoch: 0
  description: "URI is a module providing classes to handle Uniform Resource Identifiers"
  copyright:
    - license: BSD-2-Clause OR Ruby

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ruby/uri
      tag: v${{package.version}}
      expected-commit: e69a74a28d8f2b7073d81f84eee2a2b091f9c26e

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: uri

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check
    - runs: ruby -e "require 'uri'"
    - runs: |
        ruby -e 'require "uri"; uri = URI("https://wolfi.dev"); raise "Failed to parse URI" unless uri.host == "wolfi.dev" && uri.scheme == "https"'

update:
  enabled: true
  github:
    identifier: ruby/uri
    strip-prefix: v
