package:
  name: ruby3.3-zstd-ruby
  version: "2.0.9"
  epoch: 0 # glibc: 2.43->2.44
  description: Ruby binding for zstd-ruby(Zstandard - Fast real-time compression algorithm)
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-concurrent-ruby
      - ruby-${{vars.rubyMM}}
  resources:
    cpu: "1"
    memory: 6Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - glibc-2.44-dev
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

vars:
  gem: zstd-ruby

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 24722efbd9c63035ffb2bcc91853534aad96b768
      repository: https://github.com/SpringMT/zstd-ruby
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

update:
  enabled: true
  github:
    identifier: SpringMT/zstd-ruby
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: zstd-ruby
    - uses: test/tw/ldd-check

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
