package:
  name: ruby3.4-az-identity
  version: "0.2.0"
  epoch: 1 # upstream-tests/ruby-test
  description: Azure identity and authentication library for Ruby
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-base64
      - ruby${{vars.rubyMM}}-faraday

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - ruby${{vars.rubyMM}}-base64 # upstream-tests: runtime dependency, loaded by the tests
      - ruby${{vars.rubyMM}}-faraday # upstream-tests: runtime dependency, loaded by the tests
      - ruby${{vars.rubyMM}}-webmock # upstream-tests: test requirement (wave 2 2026-11-24)
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 80af7ded731f75fa6fefe7becbbe31c6341f4798
      repository: https://gitlab.com/gitlab-org/ruby/gems/az-identity
      tag: ${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

  - uses: upstream-tests/ruby-test

vars:
  gem: az-identity

update:
  enabled: true
  git: {}

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: az_identity
    - name: Redis credentials provider with an injected credential client
      runs: |
        ruby <<-EOF
        require 'az_identity'

        raise "VERSION is #{AzIdentity::VERSION}" unless AzIdentity::VERSION == "${{package.version}}"

        # A stand-in for the Azure token endpoint, so the test needs no network.
        Creds = Struct.new(:token, :expires_at)
        expiry = Time.at(1_900_000_000)
        client = Object.new
        client.define_singleton_method(:fetch_credentials_if_needed) { Creds.new("token-123", expiry) }

        provider = AzIdentity.redis_credentials_provider(username: "object-id", credential_client: client)
        raise "expires_at before first call should be nil" unless provider.expires_at.nil?
        result = provider.call
        raise "call returned #{result.inspect}" unless result == ["object-id", "token-123"]
        raise "expires_at is #{provider.expires_at.inspect}" unless provider.expires_at == expiry
        puts "az_identity redis credentials provider OK"
        EOF
