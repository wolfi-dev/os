# Generated from https://github.com/excon/excon
package:
  name: ruby3.4-excon
  version: "1.9.1"
  epoch: 1 # CVE-2026-111943
  description: EXtended http(s) CONnections
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "3"
    memory: 11Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/excon/excon
      expected-commit: 41a5c3b5508635efd4acb00effce23fb84ebe278
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

  # CVE-2026-111943: excon trusts its bundled cacert.pem on top of the system store,
  # so link it to the system bundle to follow ca-certificates instead of staying frozen
  # at build time.
  - uses: ca-certificates/use-system-bundle
    with:
      files: ${{targets.contextdir}}/usr/lib/ruby/gems/*/gems/excon-*/data/cacert.pem

vars:
  gem: excon

test:
  pipeline:
    - uses: test/tw/gem-check
    - uses: test/uses-system-ca-bundle
      with:
        files: /usr/lib/ruby/gems/*/gems/excon-*/data/cacert.pem
    - runs: ruby -e "require 'excon'"
    - name: HTTP GET
      runs: |
        cat <<EOF > /tmp/test.rb
        require 'excon'
        response = Excon.get("https://edu.chainguard.dev/open-source/wolfi/overview/")
        print response.status
        EOF
        ruby /tmp/test.rb

update:
  enabled: true
  github:
    identifier: excon/excon
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
