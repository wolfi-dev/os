package:
  name: ruby3.4-faraday
  version: "2.15.1"
  epoch: 0
  description: HTTP/REST API client library.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-faraday-net_http
      - ruby${{vars.rubyMM}}-ruby2_keywords

environment:
  contents:
    packages:
      - build-base
      - busybox
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0cfec3e3fbf71b5e481ffd1239646360b41f4c5d
      repository: https://github.com/lostisland/faraday
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: faraday

test:
  environment:
    contents:
      packages:
        - ruby${{vars.rubyMM}}-faraday-net_http
        - ruby${{vars.rubyMM}}-net-http
  pipeline:
    - uses: test/tw/gem-check
    - name: Basic usage (local server)
      runs: |
        cat <<'EOF' > /tmp/basic_usage_test.rb
        require 'socket'
        require 'timeout'
        require 'faraday'

        server = TCPServer.new('127.0.0.1', 0)
        port = server.addr[1]

        Thread.new do
          begin
            loop do
              client = server.accept
              while line = client.gets
                break if line == "\r\n"
              end
              client.print "HTTP/1.1 200 OK\r\n"
              client.print "Content-Type: text/plain\r\n"
              client.print "Content-Length: 23\r\n"
              client.print "\r\n"
              client.print "Hello from local server"
              client.close
            end
          rescue
          end
        end

        begin
          Timeout.timeout(5) do
            conn = Faraday.new(url: "http://127.0.0.1:#{port}")
            response = conn.get("/")
            if response.status == 200 && response.body == "Hello from local server"
              puts "Basic usage test passed!"
            else
              raise "Basic usage test failed. Status: #{response.status}, Body: #{response.body}"
            end
          end
        ensure
          server.close
        end
        EOF
        ruby /tmp/basic_usage_test.rb
    - name: Functional test with middleware (local server)
      runs: |
        cat <<'EOF' > /tmp/functional_test_middleware.rb
        require 'socket'
        require 'timeout'
        require 'json'
        require 'faraday'

        server = TCPServer.new('127.0.0.1', 0)
        port = server.addr[1]

        Thread.new do
          begin
            loop do
              client = server.accept
              while line = client.gets
                break if line == "\r\n"
              end

              response_body = { "status" => "ok", "json" => { "test_key" => "test_value" } }.to_json
              client.print "HTTP/1.1 200 OK\r\n"
              client.print "Content-Type: application/json\r\n"
              client.print "Content-Length: #{response_body.length}\r\n"
              client.print "\r\n"
              client.print response_body
              client.close
            end
          rescue
          end
        end

        begin
          Timeout.timeout(5) do
            conn = Faraday.new(url: "http://127.0.0.1:#{port}") do |f|
              f.request :url_encoded
              f.adapter :net_http
            end

            response = conn.post("/") do |req|
              req.headers['Content-Type'] = 'application/json'
              req.body = { test_key: 'test_value' }.to_json
            end

            parsed_body = JSON.parse(response.body)

            if response.status == 200 && parsed_body["json"]["test_key"] == "test_value"
              puts "Functional middleware test passed!"
            else
              raise "Functional middleware test failed. Status: #{response.status}"
            end
          end
        ensure
          server.close
        end
        EOF
        ruby /tmp/functional_test_middleware.rb

update:
  enabled: true
  github:
    identifier: lostisland/faraday
    strip-prefix: v

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
