package:
  name: ruby3.4-io-endpoint
  version: "0.19.0"
  epoch: 0
  description: A Ruby gem providing endpoint abstractions for network clients and servers.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby-${{vars.rubyMM}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ff92fd4e26612e6ecd9d286ed19030a893aa3664
      repository: https://github.com/socketry/io-endpoint
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: io-endpoint

test:
  environment:
    contents:
      packages:
        - ruby-${{vars.rubyMM}}
  pipeline:
    - uses: test/tw/gem-check
    - runs: |
        ruby <<-EOF
        require 'io/endpoint'
        require 'io/endpoint/host_endpoint'
        require 'test/unit'
        include Test::Unit::Assertions

        class TestIOEndpoint < Test::Unit::TestCase
          def test_host_endpoint
            endpoint = IO::Endpoint.tcp("127.0.0.1", 9292)
            assert_not_nil endpoint, "Expected endpoint to be created"
            puts "Host endpoint created: #{endpoint}"
          end

          def test_version
            assert_not_nil IO::Endpoint::VERSION, "Expected version to be defined"
            puts "IO::Endpoint version: #{IO::Endpoint::VERSION}"
          end
        end
        EOF

update:
  enabled: true
  github:
    identifier: socketry/io-endpoint
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
