# Generated from https://github.com/mkristian/jar-dependencies
package:
  name: ruby3.4-jar-dependencies
  version: "0.6.1"
  epoch: 0 # go/wolfi-rsc/ruby3.4-jar-dependencies
  description: manage jar dependencies for gems and keep track which jar was already loaded using maven artifact coordinates. it warns on version conflicts and loads only ONE jar assuming the first one is compatible to the second one otherwise your project needs to lock down the right version by providing a Jars.lock file.
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 3671fef8fe6d944e7bbfd64b22033b674cb3bf77
      repository: https://github.com/mkristian/jar-dependencies
      tag: v${{package.version}}

  # jar-dependencies 0.6 resolves Maven artifacts with Mima, which only runs on
  # JRuby (lib/jars/mima is guarded by `defined? JRUBY_VERSION`). The gemspec adds
  # the five Mima JARs (Jars::Mima::JARS) to s.files, but they are not in git and
  # can never be used by this CRuby package, so drop them from the gemspec rather
  # than shipping ~3.7 MB of unused Java.
  - name: Remove the JRuby-only Mima JARs from the gemspec
    runs: |
      grep -q 'Jars::Mima::JARS' jar-dependencies.gemspec
      sed -i '/Jars::Mima::JARS/d' jar-dependencies.gemspec
      ! grep -q 'Jars::Mima::JARS' jar-dependencies.gemspec

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      # Output file name has `java` suffix.
      gem-file: ${{vars.gem}}-${{package.version}}-java.gem
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: jar-dependencies

update:
  enabled: true
  github:
    identifier: mkristian/jar-dependencies
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: jar_dependencies
    - uses: test/tw/help-check
      with:
        bins: lock_jars
    - name: Test basic functionality
      runs: |
        ruby -e '
          begin
            require "jar_dependencies"

            # Test module definition
            raise "Missing Jars module" unless defined?(Jars)

            # Test basic methods exist
            [:require_jar, :setup, :lock].each do |method|
              raise "Missing method: Jars.#{method}" unless Jars.respond_to?(method)
            end

            puts "Basic jar-dependencies functionality verified"
            exit 0
          rescue => e
            puts "Test failed: #{e.message}"
            exit 1
          end
        '

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
