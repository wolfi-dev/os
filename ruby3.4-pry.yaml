# Generated from https://github.com/pry/pry
package:
  name: ruby3.4-pry
  version: "0.16.1"
  epoch: 0 # go/wolfi-rsc/ruby3.4-pry
  description: A runtime developer console and IRB alternative with powerful introspection capabilities
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-coderay
      - ruby${{vars.rubyMM}}-method_source
  resources:
    cpu: "1"
    memory: 6Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: fdae472d9e0c36a1f1b257f716850afa9ffb94bd
      repository: https://github.com/pry/pry
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: pry

update:
  enabled: true
  github:
    identifier: pry/pry
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/gem-check
    - uses: test/tw/ver-check
      with:
        bins: pry
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: pry

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
