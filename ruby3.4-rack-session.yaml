# Generated from https://github.com/rack/rack-session
package:
  name: ruby3.4-rack-session
  version: "2.1.2"
  epoch: 1 # go/wolfi-rsc/ruby3.4-rack-session
  description: A session implementation for Rack.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby3.4-base64
      - ruby3.4-rack
  resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rack/rack-session.git
      expected-commit: 504367b59caf7ec78127785cc6351f46be14f8ca
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: rack-session

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check

update:
  enabled: true
  github:
    identifier: rack/rack-session
    strip-prefix: v
    use-tag: true
