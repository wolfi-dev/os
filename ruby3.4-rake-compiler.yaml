# Generated from https://github.com/luislavena/rake-compiler
package:
  name: ruby3.4-rake-compiler
  version: "1.3.3"
  epoch: 0 # go/wolfi-rsc/ruby3.4-rake-compiler
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/luislavena/rake-compiler
      tag: v${{package.version}}
      expected-commit: f8466623acc9529672c90ef913e4e52233b06ea8

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: rake-compiler

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: rake/extensiontask
    - runs: |
        rake-compiler --version
        rake-compiler --help

update:
  enabled: true
  github:
    identifier: luislavena/rake-compiler
    strip-prefix: v
