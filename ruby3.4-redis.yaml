# Generated from https://github.com/redis/redis-rb/tree/v5.0.8
package:
  name: ruby3.4-redis
  version: "6.1.0"
  epoch: 0 # rebuild to publish ruby3.4-redis-source
  description: A Ruby client that tries to match Redis API one-to-one, while still providing an idiomatic interface.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # redis 6.1.0's gemspec pins redis-client to exactly 0.31.0
      - ruby${{vars.rubyMM}}-redis-client~0.31.0
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9ee4d9a382fe5b121a1477690a61e12749e604dc
      repository: https://github.com/redis/redis-rb
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: redis

update:
  enabled: true
  github:
    identifier: redis/redis-rb
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: |
          redis
          redis/commands
          redis/distributed
          redis/errors
          redis/hash_ring
          redis/subscribe
          redis/version
          redis/commands/bitmaps
          redis/commands/cluster
          redis/commands/connection
          redis/commands/geo
          redis/commands/hashes
          redis/commands/hyper_log_log
          redis/commands/keys
          redis/commands/lists
          redis/commands/pubsub
          redis/commands/scripting
          redis/commands/server
          redis/commands/sets
          redis/commands/sorted_sets
          redis/commands/streams
          redis/commands/strings
          redis/commands/transactions
