# Generated from https://github.com/rspec/rspec
package:
  name: ruby3.4-rspec-core
  version: 3.13.6
  epoch: 0
  description: BDD for Ruby. RSpec runner and example groups.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby3.4-rspec-support

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev
      - ruby3.4-bundler

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rspec/rspec.git
      expected-commit: 4d8e9c3699dbc821b4603c3c01b6e81c85e3784c
      tag: rspec-core-v${{package.version}}

  - working-directory: ${{vars.gem}}
    runs: |
      # Best-effort spec run. Too many deps to consider vendoring
      bundle install || true
      rake spec || true

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}
      dir: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}
      dir: ${{vars.gem}}
      opts: -n ${{targets.destdir}}/usr/bin

  - uses: ruby/clean

vars:
  gem: rspec-core

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check

update:
  enabled: true
  github:
    identifier: rspec/rspec
    strip-prefix: rspec-core-v
    use-tag: true
    tag-filter: rspec-core-v
