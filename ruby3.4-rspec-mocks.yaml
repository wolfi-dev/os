# Generated from https://github.com/rspec/rspec
package:
  name: ruby3.4-rspec-mocks
  version: 3.13.8
  epoch: 0 # go/wolfi-rsc/ruby3.4-rspec-mocks
  description: RSpec's 'test double' framework, with support for stubbing and mocking
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby3.4-diff-lcs-1.6
      - ruby3.4-rspec-support
  resources:
    cpu: "1"
    memory: 2Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rspec/rspec.git
      tag: rspec-mocks-v${{package.version}}
      expected-commit: 712e3ca92458b1bbd28931604fac2bb15d304cd2

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}
      dir: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}
      dir: ${{vars.gem}}

  - uses: ruby/clean

vars:
  gem: rspec-mocks
  rubyMM: "3.4"

update:
  enabled: true
  github:
    identifier: rspec/rspec
    strip-prefix: rspec-mocks-v
    use-tag: true
    tag-filter: rspec-mocks-v

test:
  environment:
    contents:
      packages:
        - ruby-${{vars.rubyMM}}
  pipeline:
    - name: Verify library loading
      runs: |
        ruby -e "require 'rspec/mocks'; puts 'Successfully loaded RSpec Mocks'"
