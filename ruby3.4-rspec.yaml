# Generated from https://github.com/rspec/rspec
package:
  name: ruby3.4-rspec
  version: 3.13.2
  epoch: 0 # go/wolfi-rsc/ruby3.4-rspec
  description: BDD for Ruby
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby3.4-rspec-core
      - ruby3.4-rspec-expectations
      - ruby3.4-rspec-mocks
  resources:
    cpu: "2"
    memory: 5Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev
      - ruby3.4-bundler
      - ruby3.4-rspec-support

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rspec/rspec.git
      tag: rspec-v${{package.version}}
      expected-commit: ce5fe4f6521eb957f02e088a1c4c4f778a5c825e

  - working-directory: ${{vars.gem}}
    pipeline:
      - uses: ruby/build
        with:
          gem: ${{vars.gem}}
      - uses: ruby/install
        with:
          gem: ${{vars.gem}}
          version: ${{package.version}}
          opts: -n ${{targets.destdir}}/urs/bin
      - uses: ruby/clean

vars:
  gem: rspec
  rubyMM: "3.4"

update:
  enabled: true
  ignore-regex-patterns:
    - .*beta.*
  github:
    identifier: rspec/rspec
    strip-prefix: rspec-v
    tag-filter: rspec-v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ruby-${{vars.rubyMM}}
  pipeline:
    - uses: test/tw/gem-check
    - name: Verify library loading
      runs: |
        ruby -e "require 'rspec'; puts 'Successfully loaded RSpec'"
    - uses: test/tw/ver-check
      with:
        bins: rspec
        version: "3.13"
