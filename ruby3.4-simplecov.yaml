package:
  name: ruby3.4-simplecov
  version: "1.3.2"
  epoch: 0
  description: Code coverage analysis tool for Ruby with a configuration DSL, automatic merging of coverage across test suites, built-in HTML and JSON formatters, and a simplecov CLI
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby-${{vars.rubyMM}}

environment:
  contents:
    packages:
      - busybox
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

vars:
  gem: simplecov

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/simplecov-ruby/simplecov
      tag: v${{package.version}}
      expected-commit: 52a8754ccc443b0f049493ec7f06920bdcf6ad28

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

test:
  pipeline:
    - uses: test/tw/gem-check
    - uses: test/tw/ver-check
      with:
        bins: simplecov
        version-flag: --version
    - uses: test/tw/help-check
      with:
        bins: simplecov
        help-flag: help
    - name: Measure line coverage of a Ruby file
      runs: |
        mkdir -p /tmp/proj/lib
        cd /tmp/proj || exit 1
        # unused is never called, so line 5 is the only missed line out of 4 relevant ones.
        cat > lib/calc.rb <<'EOF'
        def add(a, b)
          a + b
        end
        def unused
          puts "never"
        end
        EOF
        cat > run.rb <<'EOF'
        require 'simplecov'
        SimpleCov.start do
          add_group 'Library', 'lib'
        end
        require_relative 'lib/calc'
        raise 'add returned wrong value' unless add(1, 2) == 3
        result = SimpleCov.result
        file = result.files.find { |f| f.filename.end_with?('/lib/calc.rb') }
        raise 'lib/calc.rb was not tracked' unless file
        covered = file.covered_lines.map(&:line_number)
        missed = file.missed_lines.map(&:line_number)
        puts "covered=#{covered.inspect} missed=#{missed.inspect}"
        raise "unexpected covered lines #{covered.inspect}" unless covered == [1, 2, 4]
        raise "unexpected missed lines #{missed.inspect}" unless missed == [5]
        group = result.groups['Library']
        raise 'Library group missing calc.rb' unless group && group.map(&:filename).any? { |n| n.end_with?('/lib/calc.rb') }
        puts 'simplecov line coverage OK'
        EOF
        ruby run.rb 2>&1 | tee out.txt
        grep -F 'simplecov line coverage OK' out.txt
        # The at_exit hook installed by SimpleCov.start writes the report under coverage_dir.
        test -d coverage
        test -n "$(ls -A coverage)"

update:
  enabled: true
  github:
    identifier: simplecov-ruby/simplecov
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
