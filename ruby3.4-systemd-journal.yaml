package:
  name: ruby3.4-systemd-journal
  version: "2.1.2"
  epoch: 3 # glibc: 2.43->2.44
  description: Provides the ability to navigate and read entries from the systemd journal in ruby, as well as write events to the journal.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libsystemd # libsystemd.so.0 is dlopened
      - ruby${{vars.rubyMM}}-ffi
      - ruby-${{vars.rubyMM}}
  resources:
    cpu: "2"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

vars:
  gem: systemd-journal

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e893c46912356903fee780ff3b76e5d684771d58
      repository: https://github.com/ledbettj/systemd-journal
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

test:
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: systemd/journal
    - runs: |
        ruby -e "require 'systemd/journal'"
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: ledbettj/systemd-journal
    strip-prefix: v

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
