package:
  name: ruby3.4-timers
  version: "4.4.0"
  epoch: 1
  description: Pure Ruby one-shot and periodic timers.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby-${{vars.rubyMM}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

vars:
  gem: timers

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 23bccc713a244a339500318616fae79d9922a78f
      repository: https://github.com/socketry/timers
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

update:
  enabled: true
  github:
    identifier: socketry/timers
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  environment:
    contents:
      packages:
        - build-base
        - ruby-${{vars.rubyMM}}-dev
        - ruby${{vars.rubyMM}}-bundler
  pipeline:
    - uses: test/tw/gem-check
    - name: Test timers functionality
      runs: |
        ruby <<'EOF'
        require 'timers'

        # Test basic one-shot timer fires and callback is invoked
        timers = Timers::Group.new
        fired = false
        timers.after(0.01) { fired = true }
        timers.wait
        raise 'One-shot timer did not fire' unless fired

        # Test that after() returns a Timer object
        t = timers.after(10) {}
        raise 'Expected a Timer object' unless t.is_a?(Timers::Timer)
        t.cancel

        # Test cancel prevents firing
        cancelled_fired = false
        t2 = timers.after(0.01) { cancelled_fired = true }
        t2.cancel
        timers.wait
        raise 'Cancelled timer should not have fired' if cancelled_fired

        puts 'SUCCESS'
        EOF
    - uses: git-checkout
      with:
        expected-commit: 23bccc713a244a339500318616fae79d9922a78f
        repository: https://github.com/socketry/timers
        tag: v${{package.version}}
    - runs: |
        # Run upstream tests to find incompatibilities
        bundle install
        bundle exec bake test
