#nolint:valid-pipeline-git-checkout-tag,update-disabled-reason
package:
  name: ruby4.0-aws-sdk-core
  version: 3.260.0
  epoch: 0 # go/wolfi-rsc/ruby4.0-aws-sdk-core
  description: Provides API clients for AWS. This gem is part of the official AWS SDK for Ruby.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-aws-eventstream
      - ruby${{vars.rubyMM}}-aws-partitions
      - ruby${{vars.rubyMM}}-aws-sigv4
      - ruby${{vars.rubyMM}}-jmespath
      - ruby${{vars.rubyMM}}-rexml
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: b42a6160a5ae3e8b79b874289f9f63beaf1bb5ea
      repository: https://github.com/aws/aws-sdk-ruby
      branch: version-3
      depth: -1

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}
      dir: gems/${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}
      dir: gems/${{vars.gem}}

  - uses: ruby/clean

vars:
  gem: aws-sdk-core

test:
  environment:
    contents:
      packages:
        - gem-check
        - ruby-${{vars.rubyMM}}
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: aws-sdk-core
    - runs: |
        ruby <<-EOF
        require 'aws-sdk-core'
        require 'test/unit'
        include Test::Unit::Assertions

        # Test credentials
        creds = Aws::Credentials.new('access_key', 'secret_key')
        assert_equal 'access_key', creds.access_key_id
        assert_equal 'secret_key', creds.secret_access_key
        puts "Credentials test passed"

        # Test global configuration
        Aws.config.update(
          region: 'us-west-2',
          credentials: creds
        )
        assert_equal 'us-west-2', Aws.config[:region]
        puts "Configuration test passed"

        # Test presence of core modules
        assert defined?(Aws::Errors)
        assert defined?(Aws::PageableResponse)
        assert defined?(Aws::Structure)
        puts "Core modules test passed"

        puts "All tests passed!"
        EOF
    - uses: test/excluded-certificates
      with:
        files: /usr/lib/ruby/gems/*/gems/aws-sdk-core-${{package.version}}/ca-bundle.crt
        excluded-spki-hashes: bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3|8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782|b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc|eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
        excluded-names: |
          AAA Certificate Services
          emSign ECC Root CA - G3
          emSign Root CA - C1
          emSign ECC Root CA - C3

update:
  enabled: false
  manual: true # the library we fetch uses a different version then the package version
  github:
    identifier: aws/aws-sdk-ruby

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
