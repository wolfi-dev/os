# Generated from https://github.com/mongodb/bson-ruby
package:
  name: ruby4.0-bson
  version: "5.2.0"
  epoch: 0
  description: A fully featured BSON specification implementation in Ruby
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ruby-${{vars.rubyMM}}
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - glibc-2.44-dev
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f0387e3f618a98e92a9b047945cf21f47b92b5b4
      repository: https://github.com/mongodb/bson-ruby
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: bson

update:
  enabled: true
  github:
    identifier: mongodb/bson-ruby
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/gem-check
    - uses: test/tw/ldd-check
    - name: Round-trip a document through BSON
      runs: |
        ruby <<'EOF'
        require "bson"

        document = {
          "_id" => BSON::ObjectId.new,
          "message" => "Hello, world!",
          "count" => 42,
          "ratio" => 0.5,
          "tags" => ["a", "b"],
          "nested" => { "ok" => true, "nothing" => nil },
        }
        bytes = document.to_bson.to_s
        raise "not a BSON document: #{bytes.bytesize} bytes" unless bytes.unpack1("l<") == bytes.bytesize

        decoded = BSON::Document.from_bson(BSON::ByteBuffer.new(bytes))
        raise "round trip changed the document: #{decoded.inspect}" unless decoded == document
        puts "round trip: #{decoded['message']}"
        EOF

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
