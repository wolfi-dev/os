package:
  name: ruby4.0-crack
  version: "1.0.1"
  epoch: 1 # upstream-tests/ruby-test
  description: Really simple JSON and XML parsing, ripped from Merb and Rails. Turns JSON and XML documents into Ruby Hashes.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-rexml
      # bigdecimal, the other gemspec runtime dependency, ships with ruby itself
      # (a default gem in 3.3, a bundled gem from 3.4 on).
      - ruby-${{vars.rubyMM}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - git
      - glibc-${{vars.glibc-version}}-dev
      - ruby${{vars.rubyMM}}-rexml # upstream-tests: runtime dependency, loaded by the tests
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

vars:
  gem: crack
  glibc-version: "2.44"

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

pipeline:
  # The gemspec builds its file list with `git ls-files`, so the build needs the git checkout and git.
  - uses: git-checkout
    with:
      repository: https://github.com/jnunemaker/crack
      tag: v${{package.version}}
      expected-commit: 8272fefec6ef2f2b2e0dc15d3ca00879a9fc5b9b

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

  - uses: upstream-tests/ruby-test

  - name: Remove empty bin directory
    runs: rmdir ${{targets.destdir}}/usr/bin

test:
  pipeline:
    - uses: test/tw/gem-check
    - uses: test/tw/gem-installed
    - name: Loaded gemspec and Crack::VERSION agree with the package
      runs: |
        ruby -e 'require "crack"; s = Gem.loaded_specs.fetch("crack").version.to_s; abort "gemspec #{s}, Crack::VERSION #{Crack::VERSION}, package #{ARGV[0]}" unless s == Crack::VERSION && s == ARGV[0]; puts s' "${{package.version}}"
    - name: Crack::XML.parse README example
      runs: |
        ruby -e 'require "crack"; p Crack::XML.parse("<tag>This is the contents</tag>")' > xml.out
        cat xml.out
        grep -F '"tag"' xml.out
        grep -F '"This is the contents"' xml.out
        ruby -e 'require "crack"; r = Crack::XML.parse("<tag>This is the contents</tag>"); exit(r == {"tag" => "This is the contents"} ? 0 : 1)'
    - name: Crack::JSON.parse README example
      runs: |
        ruby -e 'require "crack"; p Crack::JSON.parse(%q({"tag":"This is the contents"}))' > json.out
        cat json.out
        grep -F '"tag"' json.out
        grep -F '"This is the contents"' json.out
        ruby -e 'require "crack"; r = Crack::JSON.parse(%q({"tag":"This is the contents"})); exit(r == {"tag" => "This is the contents"} ? 0 : 1)'
    - name: Standalone crack/xml with attributes, nesting and typecasting
      runs: |
        ruby <<'EOF'
        require "crack/xml"
        xml = '<user id="7"><name>alice</name><age type="integer">42</age><roles><role>admin</role><role>dev</role></roles></user>'
        r = Crack::XML.parse(xml)
        p r
        u = r.fetch("user")
        raise "attribute: #{u.inspect}" unless u["id"] == "7"
        raise "name: #{u.inspect}" unless u["name"] == "alice"
        raise "integer typecast: #{u["age"].inspect}" unless u["age"] == 42
        raise "repeated elements: #{u["roles"].inspect}" unless u["roles"]["role"] == ["admin", "dev"]
        EOF
    - name: Crack::JSON.parse with nested structures
      runs: |
        # Upstream crack/json uses YAML without requiring it, so it only works
        # through the documented "crack" entry point, which loads yaml.
        ruby <<'EOF'
        require "crack"
        r = Crack::JSON.parse('{"a":1,"b":[true,false,null],"c":{"d":"e"}}')
        p r
        raise "int: #{r.inspect}" unless r["a"] == 1
        raise "array: #{r.inspect}" unless r["b"] == [true, false, nil]
        raise "nested: #{r.inspect}" unless r["c"] == {"d" => "e"}
        EOF

update:
  enabled: true
  github:
    identifier: jnunemaker/crack
    strip-prefix: v
    use-tag: true
