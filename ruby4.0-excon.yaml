# Generated from https://github.com/excon/excon
package:
  name: ruby4.0-excon
  version: "1.7.1"
  epoch: 0 # go/wolfi-rsc/ruby4.0-excon
  description: EXtended http(s) CONnections
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/excon/excon
      expected-commit: b6ca2879961d04f8de520c4b740db6aca4fdb48a
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: excon

test:
  pipeline:
    - uses: test/tw/gem-check
    - name: Test excon functionality
      runs: |
        ruby <<'EOF'
        require 'excon'

        # Verify core classes are available
        raise 'Excon::Connection missing' unless defined?(Excon::Connection)
        raise 'Excon::Response missing' unless defined?(Excon::Response)
        raise 'Excon::Error missing' unless defined?(Excon::Error)

        # Test that a connection object can be constructed
        conn = Excon.new('http://localhost:9999')
        raise 'Expected Excon::Connection' unless conn.is_a?(Excon::Connection)

        # Test middleware stack is accessible
        raise 'Defaults missing middlewares' unless Excon.defaults[:middlewares].is_a?(Array)

        puts 'SUCCESS'
        EOF

update:
  enabled: true
  github:
    identifier: excon/excon
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
