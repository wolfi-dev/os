package:
  name: ruby4.0-faraday
  version: "2.14.4"
  epoch: 1 # go/wolfi-rsc/ruby4.0-faraday
  description: HTTP/REST API client library.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-faraday-net_http
      - ruby${{vars.rubyMM}}-ruby2_keywords
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 3ece9bd147035a8da5c1693a69d155d9fc2ce540
      repository: https://github.com/lostisland/faraday
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: faraday

test:
  environment:
    contents:
      packages:
        - ruby${{vars.rubyMM}}-faraday-net_http
        - ruby${{vars.rubyMM}}-net-http
  pipeline:
    - name: Verify library import
      runs: ruby -e "require 'faraday'"
    - name: Basic usage
      runs: |
        cat <<'EOF' > /tmp/local_http_server.rb
        require 'socket'
        require 'json'

        # Minimal loopback HTTP server so tests need no network egress.
        # GET returns 200 with an HTML body; POST /post echoes the JSON
        # request body under the "json" key (like httpbin.org/post).
        def start_local_http_server
          server = TCPServer.new('127.0.0.1', 0)
          Thread.new do
            loop do
              client = server.accept
              request_line = client.gets.to_s
              headers = {}
              while (line = client.gets) && line != "\r\n"
                key, value = line.split(':', 2)
                headers[key.strip.downcase] = value.to_s.strip
              end
              length = headers['content-length'].to_i
              body = length > 0 ? client.read(length) : ''
              method, path = request_line.split(' ')
              if method == 'POST' && path == '/post'
                payload = { 'json' => JSON.parse(body), 'headers' => headers }.to_json
                type = 'application/json'
              else
                payload = '<html><body>ok</body></html>'
                type = 'text/html'
              end
              client.write("HTTP/1.1 200 OK\r\nContent-Type: #{type}\r\n" \
                           "Content-Length: #{payload.bytesize}\r\n" \
                           "Connection: close\r\n\r\n#{payload}")
              client.close
            end
          end
          "http://127.0.0.1:#{server.addr[1]}"
        end
        EOF
        cat <<EOF > /tmp/basic_usage_test.rb
        require 'faraday'
        require_relative 'local_http_server'
        base_url = start_local_http_server
        response = Faraday.get(base_url + "/open-source/wolfi/overview/")
        if response.status == 200
          puts "Basic usage test passed! Status: \#{response.status}"
        else
          raise "Basic usage test failed. Unexpected status: \#{response.status}"
        end
        EOF
        ruby /tmp/basic_usage_test.rb
    - name: Functional test with middleware
      runs: |
        cat <<EOF > /tmp/functional_test_middleware.rb
        require 'faraday'
        require 'json'
        require_relative 'local_http_server'
        base_url = start_local_http_server

        # Configure Faraday connection with a middleware
        conn = Faraday.new(url: base_url) do |f|
          f.request :url_encoded
          f.adapter :net_http
        end

        # Perform a POST request with some data
        response = conn.post("/post") do |req|
          req.headers['Content-Type'] = 'application/json'
          req.body = { test_key: 'test_value' }.to_json
        end

        # Parse the JSON response
        parsed_body = JSON.parse(response.body)

        # Validate the response
        if response.status == 200 && parsed_body["json"]["test_key"] == "test_value"
          puts "Functional middleware test passed!"
        else
          raise "Functional middleware test failed."
        end
        EOF
        ruby /tmp/functional_test_middleware.rb

update:
  enabled: true
  github:
    identifier: lostisland/faraday
    strip-prefix: v

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
