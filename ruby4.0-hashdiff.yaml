package:
  name: ruby4.0-hashdiff
  version: "1.3.0"
  epoch: 0
  description: Hashdiff is a diff library to compute the smallest difference between two hashes or arrays, with support for applying and reverting change sets.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby-${{vars.rubyMM}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      # hashdiff.gemspec builds its file list with `git ls-files`.
      - git
      - glibc-${{vars.glibc-version}}-dev
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

vars:
  gem: hashdiff
  glibc-version: "2.44"

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/liufengyun/hashdiff
      tag: v${{package.version}}
      expected-commit: c4a856c753dd7b9d4ea88d98d56b43f4d3097c9b

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

test:
  pipeline:
    - uses: test/tw/gem-check
    - uses: test/tw/gem-installed
    - name: Installed gem version matches package version
      runs: |
        # The gem ships no executable for ver-check, so resolve the gemspec by
        # requirement (raises Gem::MissingSpecError on mismatch) and check the
        # library constant agrees with it.
        ruby <<'EOF'
        require 'hashdiff'
        spec = Gem::Specification.find_by_name('hashdiff', '= ${{package.version}}')
        puts "hashdiff gemspec #{spec.version}, Hashdiff::VERSION #{Hashdiff::VERSION}"
        raise 'Hashdiff::VERSION disagrees with gemspec' unless Gem::Version.new(Hashdiff::VERSION) == spec.version
        raise "loaded from #{$LOADED_FEATURES.grep(/hashdiff\.rb/).inspect}" unless $LOADED_FEATURES.any? { |f| f.start_with?(spec.full_gem_path) }
        EOF
    - name: README quick start diff
      runs: |
        out=$(ruby -e "require 'hashdiff'; a = {a:3, b:2}; b = {}; p Hashdiff.diff(a, b)")
        echo "$out"
        [ "$out" = '[["-", "a", 3], ["-", "b", 2]]' ]
    - name: Nested diff, patch and unpatch round trip
      runs: |
        ruby <<'EOF'
        require 'hashdiff'
        a = {'a' => {'x' => 2, 'y' => 3, 'z' => 4}, 'b' => {'x' => 3, 'z' => 45}}
        b = {'a' => {'y' => 3}, 'b' => {'y' => 3, 'z' => 30}}
        diff = Hashdiff.diff(a, b)
        p diff
        [['-', 'a.x', 2], ['-', 'a.z', 4], ['-', 'b.x', 3], ['~', 'b.z', 45, 30], ['+', 'b.y', 3]].each do |c|
          raise "missing change #{c.inspect}" unless diff.include?(c)
        end
        raise "unexpected change count #{diff.size}" unless diff.size == 5
        # patch!/unpatch! mutate their argument, so work on deep copies.
        patched = Hashdiff.patch!(Marshal.load(Marshal.dump(a)), diff)
        raise "patch! gave #{patched.inspect}" unless patched == b
        reverted = Hashdiff.unpatch!(Marshal.load(Marshal.dump(b)), diff)
        raise "unpatch! gave #{reverted.inspect}" unless reverted == a
        raise 'identical hashes must give an empty diff' unless Hashdiff.diff(a, a).empty?
        EOF
    - name: Array LCS diff round trip
      runs: |
        ruby <<'EOF'
        require 'hashdiff'
        a = {'list' => [1, 2, 3, 4], 'nested' => [{'k' => 1}, {'k' => 2}]}
        b = {'list' => [2, 3, 7, 5], 'nested' => [{'k' => 1}, {'k' => 3}]}
        diff = Hashdiff.diff(a, b)
        p diff
        raise 'array element paths must use [i] syntax' unless diff.any? { |c| c[1].start_with?('list[') }
        patched = Hashdiff.patch!(Marshal.load(Marshal.dump(a)), diff)
        raise "patch! gave #{patched.inspect}" unless patched == b
        best = Hashdiff.best_diff(a, b)
        raise "best_diff patch gave wrong result" unless Hashdiff.patch!(Marshal.load(Marshal.dump(a)), best) == b
        EOF

update:
  enabled: true
  github:
    identifier: liufengyun/hashdiff
    strip-prefix: v
    use-tag: true
