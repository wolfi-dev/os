package:
  name: ruby4.0-io-endpoint
  version: "0.18.0"
  epoch: 0 # go/wolfi-rsc/ruby4.0-io-endpoint
  description: A Ruby gem providing endpoint abstractions for network clients and servers.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby-${{vars.rubyMM}}
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1f1076f1d151a39cd8e09c9ab058579a0e289fb2
      repository: https://github.com/socketry/io-endpoint
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: io-endpoint

test:
  environment:
    contents:
      packages:
        - ruby-${{vars.rubyMM}}
        - ruby${{vars.rubyMM}}-async
        - ruby${{vars.rubyMM}}-io-stream
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: io/endpoint
    - runs: |
        ruby <<-EOF
        require 'io/endpoint'
        # Verify core endpoint module is available
        raise "IO::Endpoint not defined" unless defined?(IO::Endpoint)
        raise "IO::Endpoint::Generic not defined" unless defined?(IO::Endpoint::Generic)
        raise "IO::Endpoint::BoundEndpoint not defined" unless defined?(IO::Endpoint::BoundEndpoint)
        raise "IO::Endpoint::ConnectedEndpoint not defined" unless defined?(IO::Endpoint::ConnectedEndpoint)
        raise "IO::Endpoint::TLS not defined" unless defined?(IO::Endpoint::TLS)
        raise "IO::Endpoint::TLS::Configuration not defined" unless defined?(IO::Endpoint::TLS::Configuration)
        # Verify endpoint classes can be explicitly required
        require 'io/endpoint/host_endpoint'
        require 'io/endpoint/unix_endpoint'
        raise "IO::Endpoint::HostEndpoint not defined" unless defined?(IO::Endpoint::HostEndpoint)
        raise "IO::Endpoint::UNIXEndpoint not defined" unless defined?(IO::Endpoint::UNIXEndpoint)
        # Verify endpoint creation works
        host_ep = IO::Endpoint.tcp("127.0.0.1", 9292)
        raise "Expected HostEndpoint" unless host_ep.is_a?(IO::Endpoint::HostEndpoint)
        unix_ep = IO::Endpoint.unix("/tmp/test.sock")
        raise "Expected UNIXEndpoint" unless unix_ep.is_a?(IO::Endpoint::UNIXEndpoint)
        puts "io-endpoint core classes verified successfully"
        EOF

update:
  enabled: true
  github:
    identifier: socketry/io-endpoint
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
