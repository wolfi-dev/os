# Generated from https://github.com/banister/method_source
package:
  name: ruby4.0-method_source
  version: 1.1.0
  epoch: 2 # Prism incomplete-list fix (upstream #84, F-208)
  description: retrieve the sourcecode for a method
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: eef98af83806572d503c8bc624de0efdc0dffc28
      repository: https://github.com/banister/method_source
      tag: v${{package.version}}

  # Prism (the default parser since Ruby 3.4) reports an unterminated %W list
  # with wording IncompleteExpression did not recognise, so pry rejected
  # multi-line input (F-208). Upstream fix banister/method_source#84; drop
  # once upstream releases it.
  - uses: patch
    with:
      patches: prism-incomplete-list.patch

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: method_source

update:
  enabled: true
  github:
    identifier: banister/method_source
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  environment:
    contents:
      packages:
        - ruby-${{vars.rubyMM}}
  pipeline:
    - uses: test/tw/gem-check
    - name: Incomplete %W literal is incomplete, not a syntax error (F-208)
      runs: |
        ruby -e 'require "method_source"; t = Object.new.extend(MethodSource::CodeHelpers); abort("x = %W/a read as complete") if t.complete_expression?("x = %W/a"); abort("x = %W/a b/ read as incomplete") unless t.complete_expression?("x = %W/a\nb/")'
