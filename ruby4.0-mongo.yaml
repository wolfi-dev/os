# Generated from https://github.com/mongodb/mongo-ruby-driver
package:
  name: ruby4.0-mongo
  version: "2.26.2"
  epoch: 0
  description: A pure-Ruby driver for connecting to, querying, and manipulating MongoDB databases
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-bson
      - ruby-${{vars.rubyMM}}
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - glibc-2.44-dev
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e94ed6747b7d3c94092f0a6c0c5ddd2d79f4619a
      repository: https://github.com/mongodb/mongo-ruby-driver
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: mongo

update:
  enabled: true
  github:
    identifier: mongodb/mongo-ruby-driver
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/gem-check
    - name: Parse a connection string and fail to reach a closed port
      runs: |
        ruby <<'EOF'
        require "mongo"

        Mongo::Logger.logger.level = Logger::FATAL

        uri = Mongo::URI.new(
          "mongodb://greeter:secret@127.0.0.1:27017/hello_world?tls=true&authMechanism=SCRAM-SHA-256"
        )
        raise "unexpected servers: #{uri.servers}" unless uri.servers == ["127.0.0.1:27017"]
        raise "unexpected database: #{uri.database}" unless uri.database == "hello_world"
        raise "unexpected user: #{uri.credentials}" unless uri.credentials[:user] == "greeter"
        raise "TLS not requested: #{uri.uri_options}" unless uri.uri_options[:ssl] == true
        raise "unexpected mechanism: #{uri.uri_options}" unless uri.uri_options[:auth_mech] == :scram256
        puts "parsed: #{uri.servers.first}/#{uri.database}"

        # Nothing listens on port 1, so the driver has to give up, and say why.
        client = Mongo::Client.new(["127.0.0.1:1"], connect: :direct, server_selection_timeout: 1)
        begin
          client.database.command(ping: 1)
          raise "a command succeeded against a closed port"
        rescue Mongo::Error::NoServerAvailable => e
          puts "refused: #{e.class}"
        ensure
          client.close
        end
        EOF

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
