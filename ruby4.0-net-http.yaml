package:
  name: ruby4.0-net-http
  version: "0.10.0"
  epoch: 0
  description: "A rich library which can be used to build HTTP user-agents for Ruby"
  copyright:
    - license: BSD-2-Clause OR Ruby
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-net-protocol

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ruby/net-http
      tag: v${{package.version}}
      expected-commit: 5d7c20a6cde7a9cf146c9056c5e2a23a8ddb5d16

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: net-http

test:
  pipeline:
    - name: Verify library import
      runs: ruby -e "require 'net/http'"
    - name: Basic usage
      runs: |
        cat <<EOF > /tmp/test.rb
        require "net/http"
        uri = URI("https://edu.chainguard.dev/open-source/wolfi/overview/")
        Net::HTTP.get(uri)
        puts "OK"
        EOF
        ruby /tmp/test.rb

update:
  enabled: true
  github:
    identifier: ruby/net-http
    strip-prefix: v

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
