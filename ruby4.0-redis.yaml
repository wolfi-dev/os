# Generated from https://github.com/redis/redis-rb/tree/v5.0.8
package:
  name: ruby4.0-redis
  version: "6.1.0"
  epoch: 0 # rebuild to publish ruby4.0-redis-source
  description: A Ruby client that tries to match Redis API one-to-one, while still providing an idiomatic interface.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-redis-client

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9ee4d9a382fe5b121a1477690a61e12749e604dc
      repository: https://github.com/redis/redis-rb
      tag: v${{package.version}}

  - runs: |
      # Relax the strict dependency on redis-client to allow newer versions
      # available in Wolfi.
      sed -i "s/'redis-client', '\([0-9.]*\)'/'redis-client', '>= \1'/" redis.gemspec

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: redis

update:
  enabled: true
  github:
    identifier: redis/redis-rb
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  pipeline:
    - uses: test/tw/gem-check
