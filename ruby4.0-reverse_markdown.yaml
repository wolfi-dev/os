# Generated from https://github.com/xijo/reverse_markdown
package:
  name: ruby4.0-reverse_markdown
  version: "3.0.2"
  epoch: 1
  description: Map simple html back into markdown, e.g. if you want to import existing html data in your application.
  copyright:
    - license: WTFPL
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-nokogiri

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/xijo/reverse_markdown.git
      tag: v${{package.version}}
      expected-commit: 2edcfaa1a54e38cdefca4dc402762801f19ebe9c

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

update:
  enabled: true
  github:
    identifier: xijo/reverse_markdown
    strip-prefix: v
    use-tag: true
    tag-filter: v

vars:
  gem: reverse_markdown

test:
  pipeline:
    - uses: test/tw/gem-check

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
