# Generated from https://github.com/rspec/rspec
package:
  name: ruby4.0-rspec-core
  version: "3.13.7"
  epoch: 0
  description: BDD for Ruby. RSpec runner and example groups.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-rspec-support

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - git
      - ruby${{vars.rubyMM}}-bundler
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rspec/rspec.git
      expected-commit: 44d40ee3a0d55c026d690e1a817d3a4c29989b9c
      tag: rspec-core-v${{package.version}}

  - working-directory: ${{vars.gem}}
    runs: |
      # Best-effort spec run. Too many deps to consider vendoring
      bundle install || true
      rake spec || true

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}
      dir: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}
      dir: ${{vars.gem}}
      opts: -n ${{targets.destdir}}/usr/bin

  - uses: ruby/clean

vars:
  gem: rspec-core

test:
  pipeline:
    - uses: test/tw/gem-check
    - runs: |
        rspec --version
        rspec --help

update:
  enabled: true
  github:
    identifier: rspec/rspec
    strip-prefix: rspec-core-v
    use-tag: true
    tag-filter: rspec-core-v

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
