# Generated from https://github.com/rspec/rspec
package:
  name: ruby4.0-rspec-expectations
  version: 3.13.5
  epoch: 0 # use diff-lcs-1.6 stream (gemspec pins <2.0)
  description: rspec-expectations provides a simple, readable API to express expected outcomes of a code example.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-diff-lcs-1.6
      - ruby${{vars.rubyMM}}-rspec-support

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rspec/rspec.git
      expected-commit: cafd53dd142b97503b27555ebdb90cd15e0a2e7e
      tag: rspec-expectations-v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}
      dir: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}
      dir: ${{vars.gem}}

  - uses: ruby/clean

vars:
  gem: rspec-expectations

update:
  enabled: true
  github:
    identifier: rspec/rspec
    strip-prefix: rspec-expectations-v
    use-tag: true
    tag-filter: rspec-expectations-v

test:
  environment:
    contents:
      packages:
        - ruby-${{vars.rubyMM}}
  pipeline:
    - name: Verify library loading
      runs: |
        ruby -e "require 'rspec/expectations'; puts 'Successfully loaded RSpec Expectations'"

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
