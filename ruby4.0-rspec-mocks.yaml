# Generated from https://github.com/rspec/rspec
package:
  name: ruby4.0-rspec-mocks
  version: 3.13.8
  epoch: 0 # use diff-lcs-1.6 stream (gemspec pins <2.0)
  description: RSpec's 'test double' framework, with support for stubbing and mocking
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-diff-lcs-1.6
      - ruby${{vars.rubyMM}}-rspec-support
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rspec/rspec.git
      tag: rspec-mocks-v${{package.version}}
      expected-commit: 712e3ca92458b1bbd28931604fac2bb15d304cd2

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}
      dir: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}
      dir: ${{vars.gem}}

  - uses: ruby/clean

vars:
  gem: rspec-mocks

update:
  enabled: true
  github:
    identifier: rspec/rspec
    strip-prefix: rspec-mocks-v
    use-tag: true
    tag-filter: rspec-mocks-v

test:
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: rspec/mocks

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
