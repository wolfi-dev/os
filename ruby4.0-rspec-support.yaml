# Generated from https://github.com/rspec/rspec
package:
  name: ruby4.0-rspec-support
  version: 3.13.7
  epoch: 0
  description: Support utilities for RSpec gems
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rspec/rspec.git
      tag: rspec-support-v${{package.version}}
      expected-commit: 47ebfe17b2c99ad2acd643d109eb6424dc4eda9d

  - working-directory: ${{vars.gem}}
    pipeline:
      - uses: ruby/build
        with:
          gem: ${{vars.gem}}
      - uses: ruby/install
        with:
          gem: ${{vars.gem}}
          version: ${{package.version}}
      - uses: ruby/clean

vars:
  gem: rspec-support

update:
  enabled: true
  ignore-regex-patterns:
    - .*beta.*
  github:
    identifier: rspec/rspec
    strip-prefix: rspec-support-v
    tag-filter: rspec-support-v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/gem-check

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
