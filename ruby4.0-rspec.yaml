# Generated from https://github.com/rspec/rspec-metagem
package:
  name: ruby4.0-rspec
  version: 3.13.0
  epoch: 1
  description: BDD for Ruby
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-rspec-core
      - ruby${{vars.rubyMM}}-rspec-expectations
      - ruby${{vars.rubyMM}}-rspec-mocks

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby${{vars.rubyMM}}-bundler
      - ruby${{vars.rubyMM}}-rspec-support
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rspec/rspec-metagem.git
      tag: v${{package.version}}
      expected-commit: 317fc0b1be7194628e6105e28af9cf94a13008f9

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}
      opts: -n ${{targets.destdir}}/urs/bin

  - uses: ruby/clean

vars:
  gem: rspec

update:
  enabled: true
  github:
    identifier: rspec/rspec-metagem
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ruby-${{vars.rubyMM}}
  pipeline:
    - uses: test/tw/gem-check
    - name: Verify library loading
      runs: |
        ruby -e "require 'rspec'; puts 'Successfully loaded RSpec'"
    - uses: test/tw/ver-check
      with:
        bins: rspec
        version: "3.13"

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
