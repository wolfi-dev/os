package:
  name: ruby4.0-test-unit-ruby-core
  version: "1.0.16"
  epoch: 0
  description: Additional test assertions and helpers (core_assertions, envutil, find_executable, memory_status) from Ruby core's tool/lib, used to run the upstream test-unit suites of Ruby standard libraries and default gems.
  copyright:
    - license: Ruby OR BSD-2-Clause
  dependencies:
    runtime:
      # The gemspec requires test-unit >= 3.7.2; ruby-4.0 ships the bundled
      # test-unit gem (3.7.5), so no separate test-unit package is needed.
      - ruby-${{vars.rubyMM}}

environment:
  contents:
    packages:
      - busybox
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

vars:
  gem: test-unit-ruby-core

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ruby/test-unit-ruby-core
      tag: v${{package.version}}
      expected-commit: f7ee59842274e59123ec264b313e4c6030e62518

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

  - name: Remove empty bindir
    runs: rm -rf ${{targets.destdir}}/usr/bin

test:
  pipeline:
    # The gem ships loose helper files under lib/ rather than a file named after the gem.
    - uses: test/tw/gem-check
      with:
        require: core_assertions envutil find_executable memory_status
    - uses: test/tw/gem-installed
      with:
        gem: ${{vars.gem}}
    - name: Packaged gem version activates and provides the helpers
      runs: |
        # An exact activation requirement raises Gem::MissingSpecVersionError if the installed spec is any other version.
        ruby -e 'gem "${{vars.gem}}", "= ${{package.version}}"; require "core_assertions"; puts $LOADED_FEATURES.grep(/core_assertions\.rb\z/)' > /tmp/activate.out
        cat /tmp/activate.out
        grep -F "/gems/${{vars.gem}}-" /tmp/activate.out
    - name: CoreAssertions and EnvUtil drive child Ruby processes
      runs: |
        cat > /tmp/test_core.rb <<'EOF'
        require 'test/unit'
        require 'core_assertions'
        Test::Unit::TestCase.include Test::Unit::CoreAssertions

        class TestInstalledCoreAssertions < Test::Unit::TestCase
          def test_assert_separately
            assert_separately([], "assert_equal(3, 1 + 2)")
          end

          def test_assert_in_out_err
            assert_in_out_err([], "puts 'hello'; $stderr.puts 'oops'", ["hello"], ["oops"])
          end

          def test_envutil_invoke_ruby
            out, _err, status = EnvUtil.invoke_ruby(["-e", "print 6 * 7"], "", true)
            assert_equal("42", out)
            assert_predicate(status, :success?)
          end

          def test_envutil_rubybin
            assert_send([File, :executable?, EnvUtil.rubybin])
          end
        end
        EOF
        ruby /tmp/test_core.rb > /tmp/core.out 2>&1 || { cat /tmp/core.out; exit 1; }
        cat /tmp/core.out
        grep -F "4 tests" /tmp/core.out
        grep -F "0 failures, 0 errors" /tmp/core.out
    - name: A failing assertion in a separate process is reported
      runs: |
        cat > /tmp/test_fail.rb <<'EOF'
        require 'test/unit'
        require 'core_assertions'
        Test::Unit::TestCase.include Test::Unit::CoreAssertions

        class TestSeparatelyFails < Test::Unit::TestCase
          def test_child_failure
            assert_separately([], "assert_equal(1, 2)")
          end
        end
        EOF
        if ruby /tmp/test_fail.rb > /tmp/fail.out 2>&1; then
          cat /tmp/fail.out
          echo "ERROR: failing child assertion was not reported"
          exit 1
        fi
        cat /tmp/fail.out
        grep -F "1 tests" /tmp/fail.out
        grep -E "1 failures|1 errors" /tmp/fail.out

update:
  enabled: true
  github:
    identifier: ruby/test-unit-ruby-core
    strip-prefix: v
    use-tag: true
