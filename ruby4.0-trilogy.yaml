# Generated from https://github.com/trilogy-libraries/trilogy
package:
  name: ruby4.0-trilogy
  version: "2.13.3"
  epoch: 0
  description: A friendly MySQL-compatible library for Ruby, binding to libtrilogy
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby-${{vars.rubyMM}}
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - glibc-2.44-dev
      - openssl-${{vars.openssl-version}}-dev
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 518b2d51d5b4dd7571e3bd95fb7322fb7653f283
      repository: https://github.com/trilogy-libraries/trilogy
      tag: v${{package.version}}

  # The gem lives in contrib/ruby; its extension builds the C library that
  # the rest of the repository holds.
  - uses: ruby/build
    with:
      gem: ${{vars.gem}}
      dir: contrib/ruby

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}
      dir: contrib/ruby

  - uses: ruby/clean

vars:
  gem: trilogy
  openssl-version: "4.0"

update:
  enabled: true
  github:
    identifier: trilogy-libraries/trilogy
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - mariadb-13.1
  pipeline:
    - uses: test/tw/gem-check
    - uses: test/tw/ldd-check
    - name: Query a MariaDB server
      uses: test/daemon-check-output
      with:
        setup: |
          set -euo pipefail
          mkdir -p /tmp/trilogy-test/data /tmp/trilogy-test/run
          mariadb-install-db --user=root --datadir=/tmp/trilogy-test/data \
            --auth-root-authentication-method=normal --skip-test-db
        start: /usr/bin/mariadbd --user=root --datadir=/tmp/trilogy-test/data --socket=/tmp/trilogy-test/run/mariadbd.sock --pid-file=/tmp/trilogy-test/run/mariadbd.pid --skip-networking
        expected_output: |
          Starting MariaDB
          InnoDB: Completed initialization of buffer pool
          ready for connections
        error_strings: |
          [[]ERROR[]]
        post: |
          set -euo pipefail
          ruby <<'EOF' | tee /tmp/trilogy-test/client.log
          require "trilogy"

          client = Trilogy.new(socket: "/tmp/trilogy-test/run/mariadbd.sock", username: "root")
          begin
            client.query("CREATE DATABASE hello_world")
            client.change_db("hello_world")
            client.query("CREATE TABLE greetings (id integer PRIMARY KEY, message text NOT NULL)")
            client.query("INSERT INTO greetings VALUES (1, 'Hello, world!')")
            raise "the insert affected #{client.affected_rows} rows" unless client.affected_rows == 1

            result = client.query("SELECT id, message FROM greetings")
            raise "unexpected fields: #{result.fields}" unless result.fields == %w[id message]
            raise "unexpected rows: #{result.rows}" unless result.rows == [[1, "Hello, world!"]]
            puts "greeting: #{result.rows.first.last}"
          ensure
            client.close
          end
          EOF
          grep -Fx 'greeting: Hello, world!' /tmp/trilogy-test/client.log

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
