package:
  name: ruby4.0-zstd-ruby
  version: "2.0.8"
  epoch: 1 # add gem-check and ldd-check test pipelines
  description: Ruby binding for zstd-ruby(Zstandard - Fast real-time compression algorithm)
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ruby${{vars.rubyMM}}-concurrent-ruby
      - ruby-${{vars.rubyMM}}
  resources:
    cpu: "1"
    memory: 6Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

vars:
  gem: zstd-ruby

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2f033eb8990309268e1f8a671602a4735b901d8d
      repository: https://github.com/SpringMT/zstd-ruby
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

update:
  enabled: true
  github:
    identifier: SpringMT/zstd-ruby
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: zstd-ruby
    - uses: test/tw/ldd-check

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM
