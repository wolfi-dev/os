package:
  name: runc-1.4
  version: "1.4.3"
  epoch: 1 # toolchain rebuild for  go-1.26-1.26.6
  description: CLI tool for spawning and running containers according to the OCI specification (1.4 stream)
  copyright:
    - license: Apache-2.0
  dependencies:
    # 1.4.x predates runc's cgo libpathrs procfs backend (default in 1.5.x),
    # which SIGSEGVs on nested/restricted procfs (e.g. AWS CodeBuild). This
    # stream lets consumers that hit that crash pin a libpathrs-free runc while
    # the default `runc` stays on 1.5.x. See customer-issues#3787.
    provides:
      - runc=${{package.full-version}}
  resources:
    cpu: "1"
    memory: 4Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - go-md2man
      - libseccomp-dev
      - libtool

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/opencontainers/runc
      tag: v${{package.version}}
      expected-commit: bb14dabeb7185bb72c8c86735d090dcb20f36587

  - uses: bump
    with:
      deps: |-
        golang.org/x/net@v0.56.0 # GO-2026-5942
        golang.org/x/sys@v0.45.0

  - runs: |
      make COMMIT=$(git rev-parse HEAD)
      make man
      install -Dsm755 ./runc "${{targets.destdir}}"/usr/bin/runc
      install -Dm644 ./man/man8/* -t "${{targets.destdir}}"/usr/share/man/man8/

  - uses: strip

subpackages:
  - name: runc-1.4-doc
    pipeline:
      - uses: split/manpages
    description: runc manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: opencontainers/runc
    strip-prefix: v
    tag-filter: v1.4
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: runc
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: runc
    - name: "Test runc features"
      runs: |
        set -euo pipefail
        runc features | grep -F "seccomp"
    - name: "Verify runc binary"
      runs: |
        [ -x "$(command -v runc)" ]
    - name: "Check runc state command"
      runs: |
        runc state non_existent_container || [ $? -eq 1 ]
    - name: "Check runc spec command"
      runs: |
        runc spec --rootless
        [ -f config.json ]
    - name: "Verify the libpathrs backend is absent"
      runs: |
        set -euo pipefail
        # The reason this stream exists: the cgo libpathrs procfs backend
        # SIGSEGVs on nested/restricted procfs. 1.4.x has no libpathrs at all,
        # so guard against a future rebuild quietly linking it in.
        ! runc --version | grep -q libpathrs
        ! ldd /usr/bin/runc | grep -q libpathrs
