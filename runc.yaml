package:
  name: runc
  version: "1.5.2"
  epoch: 7 # upstream-tests/go-test vet input
  description: CLI tool for spawning and running containers according to the OCI specification
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 4Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - go-1.27
      - go-md2man
      - libpathrs-dev
      - libseccomp-dev
      - libtool

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/opencontainers/runc
      tag: v${{package.version}}
      expected-commit: 29dd3dc2b13b4123162e5fe132504bb4b15569f1

  - uses: bump
    with:
      deps: |-
        github.com/cilium/ebpf@v0.22.0
        github.com/opencontainers/cgroups@v0.1.0
        golang.org/x/net@v0.62.0
        github.com/moby/sys/user@v0.4.1
        golang.org/x/sys@v0.49.0
      language: go

  - runs: |
      make COMMIT=$(git rev-parse HEAD)
      make man
      install -Dsm755 ./runc "${{targets.destdir}}"/usr/bin/runc
      install -Dm644 ./man/man8/* -t "${{targets.destdir}}"/usr/share/man/man8/

  # libcontainer/integration downloads a busybox rootfs with curl (network) and needs root.
  # go test's vet (printf) rejects libcontainer/container_linux_test.go:278,294 (Fatalf %q
  # with an int64 Cgroups.Memory; upstream test code).
  # TODO(upstream-tests): remove once upstream gates these behind -short and fixes the verb.
  - uses: upstream-tests/go-test
    with:
      exclude-packages: ./libcontainer/integration/...
      vet-skip: printf

  - uses: strip

subpackages:
  - name: runc-doc
    pipeline:
      - uses: split/manpages
    description: runc manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: opencontainers/runc
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: runc
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: runc
    - name: "Test runc features"
      runs: |
        set -euo pipefail
        runc features | grep -F "seccomp"
    - name: "Verify runc binary"
      runs: |
        [ -x "$(command -v runc)" ]
    - name: "Check runc state command"
      runs: |
        runc state non_existent_container || [ $? -eq 1 ]
    - name: "Check runc spec command"
      runs: |
        runc spec --rootless
        [ -f config.json ]
