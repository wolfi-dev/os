package:
  name: rust-1.95
  version: "1.95.0"
  epoch: 9 # split/manpages
  description: "Empowering everyone to build reliable and efficient software."
  copyright:
    - license: Apache-2.0 AND MIT
  resources:
    cpu: "11"
    memory: 24Gi
  dependencies:
    runtime:
      - libLLVM-${{vars.llvm-version}}
    provides:
      - rust=${{package.full-version}}
  annotations:
    toolchain: true
    toolchain-stream: true
    toolchain-stream-pkgs: _ALL
    # rustc embeds libLLVM-N; transitions gated on upstream rust compat window.
    toolchain-stream-reconcile-optout: true
  test-resources:
    cpu: "1"
    memory: 2Gi
    disk: 8Gi

vars:
  llvm-version: 22
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-${{vars.llvm-version}}
      - cmake
      - coreutils
      - curl
      - curl-dev
      - file
      - glibc-2.44-dev
      - libLLVM-${{vars.llvm-version}}
      - libssh2-dev
      - libxml2-dev
      - llvm-${{vars.llvm-version}}
      - llvm-${{vars.llvm-version}}-dev
      - openssl-${{vars.openssl-version}}-dev # FTBFS with openssl-hardened-dev: libgit2-sys (bundled in bootstrap) uses SHA256_CTX, SHA256_Init, SHA256_Update, SHA256_Final which are absent in the hardened build
      - patch
      - python3
      - samurai
      - wasi-libc
      - xz-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rust-lang/rust
      tag: ${{package.version}}
      expected-commit: 59807616e1fa2540724bfbac14d7976d7e4a3860

  - runs: |
      # Reconstructed vendored crates and bootstrap toolchain
      ./x vendor

      # Populate cargo config
      mkdir .cargo
      cat > .cargo/config.toml <<EOF
      [source.crates-io]
      replace-with = "vendored-sources"
      [source."git+https://github.com/rust-lang/team"]
      git = "https://github.com/rust-lang/team"
      replace-with = "vendored-sources"
      [source.vendored-sources]
      directory = "vendor"
      EOF

      export CFLAGS="$CFLAGS -O2 -I/usr/lib/llvm-${{vars.llvm-version}}/include"
      export CXXFLAGS="$CXXFLAGS -O2 -I/usr/lib/llvm-${{vars.llvm-version}}/include"
      export OPENSSL_NO_VENDOR=1
      export ARCH=${{host.triplet.rust}}

      # Using downloaded toolchain, alternative is to build-depend on
      # our builds of rust/cargo, and then update this to /usr/bin, or
      # drop this setting together with build.cargo and build.rustc
      # settings in configure
      export TOOLCHAIN_BIN_DIR=`pwd`/build/${ARCH}/stage0/bin

      # Create a minimal config.toml with necessary options
      # This is needed because of upstream changes in Rust 1.87 that removed automatic config.toml creation
      cat > config.toml <<EOF
      [rust]
      deny-warnings = false
      EOF

      ./configure \
        --host="${ARCH}" \
        --target="${ARCH}" \
        --prefix="/usr" \
        --release-channel="stable" \
        --enable-local-rust \
        --local-rust-root="/usr" \
        --llvm-root="/usr/lib/llvm-${{vars.llvm-version}}" \
        --llvm-config="/usr/lib/llvm-${{vars.llvm-version}}/bin/llvm-config" \
        --disable-docs \
        --enable-extended \
        --tools="cargo,src,clippy,rustfmt,rustdoc" \
        --enable-llvm-link-shared \
        --enable-option-checking \
        --enable-locked-deps \
        --enable-profiler \
        --enable-vendor \
        --dist-compression-formats=gz \
        --python="python3" \
        --set="rust.musl-root=/usr" \
        --set="rust.codegen-units=1" \
        --set="rust.codegen-units-std=1" \
        --set="target.${ARCH}.musl-root=/usr" \
        --set="target.${ARCH}.crt-static=false" \
        --set="target.${ARCH}.musl-root=/usr" \
        --set="target.${ARCH}.crt-static=false" \
        --set="build.cargo=$TOOLCHAIN_BIN_DIR/cargo" \
        --set="build.rustc=$TOOLCHAIN_BIN_DIR/rustc"

      # Configure the bootstrap process not to use Rust's LLD (as we use our
      # system LLVM); see
      # https://github.com/rust-lang/rust/issues/143076#issuecomment-3018803649
      sed -i '/^\[rust\]$/a lld=false' bootstrap.toml

  - runs: |
      sed 's|deny(warnings,|deny(|' -i src/bootstrap/src/lib.rs
      mkdir -p "${{targets.destdir}}/usr"
      unset CARGO_PROFILE_RELEASE_LTO
      unset CARGO_PROFILE_RELEASE_OPT_LEVEL
      unset CARGO_PROFILE_RELEASE_PANIC
      unset CARGO_PROFILE_RELEASE_CODEGEN_UNITS
      export CFLAGS="$CFLAGS -O2 -I/usr/lib/llvm-${{vars.llvm-version}}/include/"
      export CXXFLAGS="$CXXFLAGS -O2 -I/usr/lib/llvm-${{vars.llvm-version}}/include/"
      export OPENSSL_NO_VENDOR=1
      export RUSTC_BOOTSTRAP=1
      export RUST_BACKTRACE=full

      # The vendored openssl-sys crate pulled in by rust-lang/rust's Cargo.lock
      # (used to build the bundled cargo/clippy/rustfmt tools) only recognizes
      # OpenSSL 1.0.2-1.1.1, 3.x, or LibreSSL, and aborts the build on seeing
      # OpenSSL 4.0's version number even though 4.0 is API/ABI compatible with
      # 3.x for everything this crate probes. openssl-sys determines the
      # version purely by preprocessing opensslv.h (build/expando.c), so
      # pointing it at a private copy of the headers via OPENSSL_INCLUDE_DIR
      # is not reliable: the include-path resolution the crate performs can
      # still fall back to the real system header, which reports 4.0.3 and
      # trips the version gate. Patch the installed header in place instead,
      # presenting the version as 3.5.0 (a value openssl-sys already accepts),
      # while still linking the real OpenSSL 4.0 libraries that are installed.
      # openssl-sys reads the new-style OPENSSL_VERSION_MAJOR/MINOR/PATCH
      # macros directly (that's what the build log's "version: 4_0_3" comes
      # from), so rewriting only the legacy OPENSSL_VERSION_NUMBER macro, as a
      # previous attempt at this did, has no effect on the actual version
      # gate; all three must be patched. OpenSSL 4.0 also spreads the
      # OPENSSL_VERSION_NUMBER definition across several backslash-continued
      # lines (it synthesizes the value from
      # OPENSSL_VERSION_MAJOR/MINOR/PATCH), so a single-line substitution
      # only rewrites the first line and leaves the real value in place;
      # replace the whole multi-line macro block instead.
      sed -i -E 's/^(# define OPENSSL_VERSION_MAJOR)[[:space:]]+[0-9]+$/\1 3/' /usr/include/openssl/opensslv.h
      sed -i -E 's/^(# define OPENSSL_VERSION_MINOR)[[:space:]]+[0-9]+$/\1 5/' /usr/include/openssl/opensslv.h
      sed -i -E 's/^(# define OPENSSL_VERSION_PATCH)[[:space:]]+[0-9]+$/\1 0/' /usr/include/openssl/opensslv.h
      sed -i '/^# define OPENSSL_VERSION_NUMBER/,/^      |0x0L )$/c\# define OPENSSL_VERSION_NUMBER 0x30500000L' /usr/include/openssl/opensslv.h

      # macros.h derives its default OPENSSL_API_LEVEL from the
      # build-time OPENSSL_CONFIGURED_API macro (baked into
      # opensslconf.h when OpenSSL itself was built) whenever
      # OPENSSL_API_COMPAT isn't explicitly set, ignoring the
      # OPENSSL_VERSION_MAJOR/MINOR we just patched above. Since this
      # OpenSSL package was configured as 4.0, OPENSSL_CONFIGURED_API
      # is still 40000, which is now higher than the patched version
      # (30500) and trips macros.h's "Can't go higher than the current
      # version" check ("OPENSSL_API_COMPAT expresses an impossible
      # API compatibility level"). Explicitly pin OPENSSL_API_COMPAT to
      # match the spoofed 3.5.0 version so OPENSSL_API_LEVEL is
      # computed from it directly instead of from OPENSSL_CONFIGURED_API.
      export CFLAGS="$CFLAGS -DOPENSSL_API_COMPAT=0x30500000L"
      export CXXFLAGS="$CXXFLAGS -DOPENSSL_API_COMPAT=0x30500000L"
      export OPENSSL_NO_PKG_CONFIG=1
      export OPENSSL_DIR=/usr
      export OPENSSL_LIB_DIR=/usr/lib

      DESTDIR=${{targets.destdir}} python3 ./x.py install --jobs $(nproc)

  - uses: strip

  # delete uneeded files eg uninstalltion
  - runs: |
      rm ${{targets.destdir}}/usr/lib/rustlib/components
      rm ${{targets.destdir}}/usr/lib/rustlib/install.log
      rm ${{targets.destdir}}/usr/lib/rustlib/rust-installer-version
      rm ${{targets.destdir}}/usr/lib/rustlib/uninstall.sh
      rm ${{targets.destdir}}/usr/lib/rustlib/manifest-*

  - name: ensure libraries are executable for melange SCA provides generation
    runs: |
      chmod +x ${{targets.destdir}}/usr/lib/*.so

subpackages:
  - name: ${{package.name}}-doc
    description: ${{package.name}} documentation and manpages
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: rust-lang/rust
    use-tag: true
    tag-filter: 1.95.

test:
  environment:
    contents:
      packages:
        - gcc
        - glibc-dev
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: |
          cargo
          rustc
          rustdoc
    - uses: test/tw/help-check
      with:
        bins: |
          cargo
          cargo-clippy
          cargo-fmt
          clippy-driver
          rust-gdbgui
          rustc
          rustdoc
          rustfmt
    - name: Compile and run Hello World
      runs: |
        cat <<'EOF' > hello.rs
        fn main() {
          println!("Hello, World!");
        }
        EOF
        rustc hello.rs
        ./hello | grep -qF "Hello, World!"
    - name: Cargo project creation and run
      runs: |
        cargo new hello_cargo --bin
        cd hello_cargo
        cargo run | grep -qF "Hello, world!"
    - uses: test/tw/ldd-check
