#nolint:valid-pipeline-git-checkout-tag
package:
  name: rustfilt
  version: "0.2.2_git20230531"
  epoch: 3
  description: Demangle Rust symbols
  copyright:
    - license: Apache-2.0

vars:
  rust-version: "1.94"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cargo-auditable
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/luser/rustfilt
      branch: master
      expected-commit: 8cf08c0680ebd17e7c1ae5c67227fa7026129af6

  - uses: rust/cargobump
    with:
      packages: rustc-demangle@0.1.24

  - uses: cargo/build
    with:
      output: rustfilt

  - uses: strip

update:
  enabled: true
  github:
    identifier: luser/rustfilt
  schedule:
    period: weekly
    reason: No new upstream releases for a long time, but useful feature on master

test:
  environment:
    contents:
      packages:
        - binutils
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: rustfilt
    - name: Test symbols
      runs: |
        readelf --wide --symbols /usr/bin/rustfilt | rustfilt | grep rustc_demangle
