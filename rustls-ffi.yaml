package:
  name: rustls-ffi
  version: "0.15.5"
  epoch: 2 # set bump language
  description: "C-to-rustls bindings"
  copyright:
    - license: MIT
  resources:
    cpu: "4"
    memory: 9Gi

vars:
  rust-version: "1.99"

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - cargo-c
      - glibc-2.44-dev
      - rust-${{vars.rust-version}}
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rustls/rustls-ffi
      tag: v${{package.version}}
      expected-commit: efdaa15943c2136d5636fc42514588cdb243fc35

  - uses: bump
    with:
      language: rust

  - runs: |
      cargo auditable capi build --release
      cargo auditable capi install --prefix=/usr --destdir "${{targets.contextdir}}"

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: "${{package.name}} development headers"
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}
    dependencies:
      runtime:
        - ${{package.name}}

test:
  environment:
    contents:
      packages:
        - rust-audit-info
  pipeline:
    - runs: |
        rust-audit-info /usr/lib/librustls.so.0.*
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: rustls/rustls-ffi
    strip-prefix: v
    use-tag: true
