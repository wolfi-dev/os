package:
  name: s5cmd
  version: 2.3.0
  epoch: 27
  description: Parallel S3 and local filesystem execution tool.
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - go-1.27

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/peak/s5cmd
      expected-commit: 991c9fbc16709341b4bac04513232a1445941f63
      tag: v${{package.version}}

  - uses: go/build
    with:
      packages: .
      output: s5cmd
      go-package: go-1.27
      ldflags: -X github.com/peak/s5cmd/v2/version.Version=v${{package.version}} -X github.com/peak/s5cmd/v2/version.GitCommit=$(git rev-parse HEAD)

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility symlink placing s5cmd at the upstream image path (/s5cmd)
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      # Upstream's image copies the binary to /s5cmd and uses it as the
      # ENTRYPOINT (Dockerfile: COPY --from=build /s5cmd/s5cmd .). Our binary
      # lives at /usr/bin/s5cmd, so recreate the upstream path as a relative
      # symlink to it.
      - runs: |
          mkdir -p "${{targets.contextdir}}"
          ln -sf ./usr/bin/s5cmd "${{targets.contextdir}}/s5cmd"
    test:
      pipeline:
        - uses: test/tw/symlink-check
        - uses: test/tw/contains-files
          with:
            files: |
              /s5cmd
        - name: Upstream entrypoint path runs the packaged binary
          runs: |
            set -euo pipefail
            test -L /s5cmd
            # The compat path must execute the real binary, not just exist.
            /s5cmd version | grep -F "v${{package.version}}"
            /s5cmd --help > /dev/null

update:
  enabled: true
  github:
    identifier: peak/s5cmd
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: s5cmd
    - uses: test/tw/help-check
      with:
        bins: s5cmd
    - name: Test local filesystem listing and subcommand help
      runs: |
        set -euo pipefail
        # s5cmd is an S3 tool; cp/mv/rm require S3 endpoints.
        # Only ls works on local paths without credentials.
        mkdir -p /tmp/s5cmd-test/src
        echo "hello s5cmd" > /tmp/s5cmd-test/src/file1.txt
        echo "world" > /tmp/s5cmd-test/src/file2.txt

        # List local files (ls supports local paths)
        s5cmd ls /tmp/s5cmd-test/src/ | grep -F "file1.txt"
        s5cmd ls /tmp/s5cmd-test/src/ | grep -F "file2.txt"
