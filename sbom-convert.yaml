package:
  name: sbom-convert
  version: "0.0.8"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.1
  description: CLI tool based on the protobom library that converts Software Bills of Materials across formats (SPDX and CycloneDX).
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/protobom/sbom-convert
      tag: v${{package.version}}
      expected-commit: d03ffb0a4dfe430d38dac519b97e751448c19abf

  - uses: go/build
    with:
      output: sbom-convert
      packages: .
      go-package: go-1.27

  - uses: strip

update:
  enabled: true
  github:
    identifier: protobom/sbom-convert
    strip-prefix: v

test:
  pipeline:
    - runs: |
        sbom-convert --version
        sbom-convert --help

environment:
  contents:
    packages:
      - go-1.27
