package:
  name: scala-3.8
  version: "3.8.4"
  epoch: 12 # use replace-jar pipeline for jar replacement
  description: The Scala 3 compiler, also known as Dotty.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
    provides:
      - dotty=${{package.full-version}}
      - scala=${{package.full-version}}
  resources:
    cpu: "5"
    memory: 10Gi
  test-resources:
    cpu: "1"
    memory: 4Gi

vars:
  java-version: "25"
  runtime-java-version: "25"

environment:
  contents:
    packages:
      - busybox
      - curl
      - openjdk-${{vars.java-version}}-default-jdk
      - sbt
  environment:
    RELEASEBUILD: "yes"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/scala/scala3
      tag: ${{package.version}}
      expected-commit: 7d4833b619d31ea9acac97fccf1e74b42b89c49f

  - runs: |
      # Bump jackson to 2.18.9: GHSA-72hv-8253-57qq, GHSA-5jmj-h7xm-6q6v
      sed -i 's/val jacksonVersion = "2\.15\.1"/val jacksonVersion = "2.18.9"/' project/Dependencies.scala

  - name: Build Scala
    runs: ./project/scripts/sbt dist-linux-${{build.arch}}/Universal/stage

  - name: Install Scala
    runs: |
      # Create the directories with the correct permissions
      mkdir -p ${{targets.contextdir}}/usr/bin
      install -dm755 "${{targets.contextdir}}"/usr/share/scala/

      # Cleaning and removing windows batch files
      find dist/linux-${{build.arch}}/target/universal/stage -name '*.bat' -type f -delete

      mv dist/linux-${{build.arch}}/target/universal/stage/* ${{targets.contextdir}}/usr/share/scala/

      ln -sf /usr/share/scala/bin/scala ${{targets.contextdir}}/usr/bin/scala
      ln -sf /usr/share/scala/bin/scalac ${{targets.contextdir}}/usr/bin/scalac
      ln -sf /usr/share/scala/bin/scaladoc ${{targets.contextdir}}/usr/bin/scaladoc

  # Replace vulnerable jackson-databind and jackson-core 2.12.1 JARs with safe 2.18.10 / 2.18.9 content.
  # scaladoc's classpath references the 2.12.1 paths, so the filenames must not
  # change: the vulnerable code goes while the paths scaladoc expects stay.
  # jackson-datatype-jsr310 sits at the same version under another group, and is
  # ignored by group rather than reached.
  # GHSA-3x8x-79m2-3w2w (jackson-databind < 2.12.6)
  - name: Replace vulnerable bundled jackson-core 2.x JAR
    uses: java/replace-jar
    with:
      artifact-id: jackson-core
      group-id: com.fasterxml.jackson.core
      match: jackson-core-2.12.1.jar
      search-dir: ${{targets.contextdir}}/usr/share/scala/maven2
      version: "2.18.9"

  # CVE-2026-68497 (jackson-databind 2.x, fixed in 2.18.10)
  - name: Replace vulnerable bundled jackson-databind 2.x JAR
    uses: java/replace-jar
    with:
      artifact-id: jackson-databind
      group-id: com.fasterxml.jackson.core
      match: jackson-databind-2.12.1.jar
      search-dir: ${{targets.contextdir}}/usr/share/scala/maven2
      version: "2.18.10"

  # Replace vulnerable jackson-databind 3.1.2 JAR with safe 3.1.6 content and
  # jackson-core 3.1.2 with 3.1.4. The 3.x line lives under the tools.jackson
  # namespace rather than com.fasterxml.jackson.
  # GHSA-5hh8-q8hv-fr38 (jackson-databind 3.x < 3.1.4)
  # GHSA-5gvw-p9qm-jgwh (jackson-databind 3.x < 3.1.5)
  # GHSA-q4xh-88c3-wmh7 / CVE-2026-68497 (jackson-databind 3.x < 3.1.6)
  - name: Replace vulnerable bundled jackson-databind 3.x JAR
    uses: java/replace-jar
    with:
      artifact-id: jackson-databind
      group-id: tools.jackson.core
      match: jackson-databind-3.1.2.jar
      search-dir: ${{targets.contextdir}}/usr/share/scala/maven2
      version: "3.1.6"

  # GHSA-r7wm-3cxj-wff9 (jackson-core 3.x < 3.1.4)
  - name: Replace vulnerable bundled jackson-core 3.x JAR
    uses: java/replace-jar
    with:
      artifact-id: jackson-core
      group-id: tools.jackson.core
      match: jackson-core-3.1.2.jar
      search-dir: ${{targets.contextdir}}/usr/share/scala/maven2
      version: "3.1.4"

test:
  environment:
    contents:
      packages:
        - openjdk-${{vars.runtime-java-version}}-default-jvm
    environment:
      JAVA_HOME: /usr/lib/jvm/java-${{vars.runtime-java-version}}-openjdk
  pipeline:
    - name: Verify that the binaries are installed and executable
      runs: |
        for bin in scala scalac scaladoc; do
          if [ ! -x "/usr/bin/$bin" ]; then
            echo "$bin is not installed or not executable"
            exit 1
          fi
        done
    - uses: test/tw/ver-check
      with:
        bins: |
          scala
          scalac
          scaladoc
        version: ${{package.version}}
    - name: "Test Scala compiler"
      runs: |
        # Create a simple HelloWorld.scala file
        echo 'object HelloWorld extends App { println("Hello, World!") }' > HelloWorld.scala

        # Compile the HelloWorld.scala file
        scalac HelloWorld.scala

        # Run the compiled HelloWorld program and verify output
        scala run -cp . -M HelloWorld | grep -F "Hello, World!"

        # Clean up
        rm -f HelloWorld.scala HelloWorld*.class HelloWorld.tasty
    - name: "Test Scala compiler with multiple files"
      runs: |
        cat > Person.scala << 'EOF'
        case class Person(name: String) {
          override def toString = s"Person($name)"
        }
        EOF
        cat > Main.scala << 'EOF'
        object Main extends App {
          val person = Person("Test")
          println(person)
        }
        EOF
        scalac Person.scala Main.scala
        scala run -cp . -M Main | grep -F "Person(Test)"

        # clean up
        rm -f Person.scala Main.scala Person*.class Main*.class Person.tasty Main.tasty
    - name: "Test Scaladoc generation"
      runs: |
        cat > DocTest.scala << 'EOF'
        /** Documentation test class */
        class DocTest {
          /** Test method */
          def test(): Unit = ()
        }
        EOF
        scalac DocTest.scala
        mkdir -p doc
        scaladoc -d doc DocTest.tasty
        test -d doc && test -f doc/index.html

        # clean up
        rm -f DocTest.scala DocTest*.class DocTest.tasty

update:
  enabled: true
  github:
    identifier: scala/scala3
    tag-filter-prefix: 3.8.
