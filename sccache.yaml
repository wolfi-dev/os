package:
  name: sccache
  version: "0.20.1"
  epoch: 0 # rust: 1.99->1.100
  description: sccache is ccache with cloud storage
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "7"
    memory: 12Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  openssl-version: "4.0"
  rust-version: "1.100"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - glibc-2.44-dev
      - openssl-${{vars.openssl-version}}-dev
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mozilla/sccache
      tag: v${{package.version}}
      expected-commit: a6c7438eacbaef1c16338ed337b5ff3b73639fc3

  - uses: bump
    with:
      deps: |-
        openssl@0.10.80
        smallvec@1.13.2
        url@2.5.1
        ring@0.17.13
        tokio@1.43.1
        rsa@0.9.10
        bytes@1.11.1
        time@0.3.47
        time-core@0.1.8
        num-conv@0.2.2
        quinn-proto@0.11.15
        tar@0.4.46
        hickory-resolver@0.26.2
        pkg-config@0.3.32
        rustls@0.23.46
      language: rust

  # GHSA-cq8v-f236-94qc (rand): the sccache 0.20.0 Cargo.lock already
  # resolves rand@0.8.8 and rand@0.10.3, both past the fixed 0.8.6, so
  # the former `cargo update -p rand@0.8.5 --precise 0.8.6` pin (which
  # no longer matches any package and would downgrade) cannot apply.
  # Keep the remediation enforced by failing the build if the lockfile
  # ever resolves rand below the fixed version.
  - name: Verify rand for GHSA-cq8v-f236-94qc
    runs: |
      for v in $(awk '/^name = "rand"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock); do
        case "$v" in
          0.[0-7].* | 0.8.[0-5])
            echo "rand $v is vulnerable to GHSA-cq8v-f236-94qc (fixed in 0.8.6)"
            exit 1
            ;;
        esac
      done

  - name: Bump rustls for GHSA-82j2-j2ch-gfr8
    # rustls 0.23.10 caps rustls-webpki at ^0.102.4. Bumping rustls to
    # 0.23.40 cascades rustls-webpki to ^0.103.5, which lets the explicit
    # re-pin land on the patched 0.103.13. Re-pin without @<current> so
    # the second line stays idempotent if cargo's cascade already picks
    # 0.103.13.
    # The bump step (omnibump) already advances rustls from 0.23.10 to
    # 0.23.31, so reference that version here. The time re-pin is omitted
    # because the bump step already advances time to 0.3.55 (> 0.3.47).
    # GHSA-2mjx-qc3c-rqvc: rustls must be >= 0.23.45. That pulls
    # aws-lc-sys 0.45, which requires pkg-config >= 0.3.31, so raise
    # pkg-config first. rustls 0.23.45 cascades rustls-webpki to 0.103.15
    # (>= 0.103.13); the re-pin is raised accordingly.
    # CVE-2026-111943: webpki-root-certs >= 1.0.10 drops the emSign roots.
    # GHSA-c8m5-c952-6cm4: rustls must be >= 0.23.46.
    runs: |
      cargo update -p pkg-config --precise 0.3.32
      cargo update -p rustls --precise 0.23.46
      cargo update -p rustls-webpki --precise 0.103.15
      cargo update -p webpki-root-certs --precise 1.0.11

  - runs: |
      cargo auditable build --release
      mkdir -p ${{targets.destdir}}/usr/bin
      mv target/release/sccache ${{targets.destdir}}/usr/bin/

  - uses: strip

update:
  enabled: true
  github:
    identifier: mozilla/sccache
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - build-base
  pipeline:
    # AUTOGENERATED
    - runs: |
        sccache --version
        sccache --help
    - name: Test server start and stop
      runs: |
        set -euo pipefail

        # Start the sccache server
        sccache --start-server

        # Verify server is running by showing stats
        sccache --show-stats

        # Stop the server
        sccache --stop-server
    - name: Test show-stats output
      runs: |
        set -euo pipefail

        # Start a fresh server
        sccache --start-server

        # Show stats and verify output contains expected fields
        stats_output=$(sccache --show-stats)
        echo "$stats_output" | grep -iF "cache"

        # Clean up
        sccache --stop-server
    - name: Test compilation caching
      runs: |
        set -euo pipefail

        # Start the sccache server
        sccache --start-server

        # Create a simple C file
        tee /tmp/test_sccache.c <<'EOF'
        #include <stdio.h>
        int main() {
            printf("hello from sccache test\n");
            return 0;
        }
        EOF

        # Compile using sccache as a wrapper
        sccache gcc -c /tmp/test_sccache.c -o /tmp/test_sccache.o

        # Verify the object file was created
        stat /tmp/test_sccache.o

        # Show stats to verify sccache processed the compilation
        sccache --show-stats

        # Compile again - should be a cache hit
        sccache gcc -c /tmp/test_sccache.c -o /tmp/test_sccache2.o
        stat /tmp/test_sccache2.o

        # Show stats again to verify cache activity
        stats_output=$(sccache --show-stats)
        echo "$stats_output"

        # Stop the server
        sccache --stop-server
