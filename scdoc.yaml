package:
  name: scdoc
  version: "1.11.5"
  epoch: 5 # scdoc.pc: build with PREFIX=/usr, not /usr/local
  description: "simple man page generator written for POSIX systems with C99"
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.sr.ht/~sircmpwn/scdoc
      tag: ${{package.version}}
      expected-commit: 24be30ef17d5ca0162f11b35258c8fa2413d556a

  # scdoc.pc is generated at BUILD time from PREFIX, and install only copies
  # it, so build with the install's prefix. Upstream's default /usr/local made
  # scdoc.pc name /usr/local/bin/scdoc, and meson projects that find scdoc
  # through its pkg-config variable (wlr-randr, wlrctl, fyi) failed to
  # configure.
  - uses: autoconf/make
    with:
      opts: PREFIX=/usr

  - runs: |
      make install DESTDIR="${{targets.destdir}}" PREFIX="/usr"

  # This suite reports only through make check's exit status (no automake/TAP/autotest summary).
  - uses: upstream-tests/make-check
    with:
      harness: custom

  - uses: strip

subpackages:
  - name: "scdoc-doc"
    description: "scdoc documentation"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/ldd-check
    # AUTOGENERATED
    - runs: |
        scdoc -v
    - uses: test/pkgconf
    - name: scdoc.pc points at the installed binary
      runs: |
        p="$(pkg-config --variable=scdoc scdoc)"
        echo "scdoc.pc scdoc=${p}"
        [ "${p}" = /usr/bin/scdoc ]
        [ -x "${p}" ]
    - name: Test scdoc converts markup to roff output
      runs: |
        set -euo pipefail

        # Create scdoc-formatted input with a proper header
        tee /tmp/test.scd <<'EOF'
        mycommand(1)

        # NAME

        mycommand - a test command

        # SYNOPSIS

        *mycommand* [_options_]

        # DESCRIPTION

        This is a test man page.
        EOF

        # Convert scdoc input to roff output
        scdoc < /tmp/test.scd > /tmp/test.roff

        # Verify the output contains the .TH roff directive
        grep -F ".TH" /tmp/test.roff

        # Verify the output contains section headings converted to roff
        grep -F ".SH" /tmp/test.roff

        # Verify the command name appears in the output
        grep -F "mycommand" /tmp/test.roff
