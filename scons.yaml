package:
  name: scons
  version: "4.11.1"
  epoch: 0
  description: Software construction system
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # needs setuptools for distuils use
      - py${{vars.python-version}}-setuptools

vars:
  python-version: 3.13

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - py${{vars.python-version}}-build-base
      - py${{vars.python-version}}-gpep517

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/SCons/scons
      expected-commit: 81e9e1afbe43dd39dfaa312be89e371fef0188fc
      tag: ${{package.version}}

  - uses: fetch
    with:
      uri: https://downloads.sourceforge.net/project/scons/scons/${{package.version}}/SCons-${{package.version}}.tar.gz
      expected-sha256: 4210d1a80a62e986029208117991b6347ccaaaab37b67463a3ff31ee065dc487
      strip-components: 0
      extract: false

  - runs: |
      python3=python${{vars.python-version}}
      tar -xzf SCons-${{package.version}}.tar.gz

      $python3 -m gpep517 build-wheel --wheel-dir .dist --output-fd 3 3>&1 >&2
      install -vDm 644 ./scons-${{package.version}}/*.1 -t "${{targets.destdir}}/usr/share/man/man1/"

      $python3 -m installer -d "${{targets.destdir}}" .dist/*.whl
      # remove docbook dirs
      find "${{targets.destdir}}" -name 'docbook' -type d -exec rm -rf {} +

  - uses: strip

subpackages:
  - name: scons-doc
    pipeline:
      - uses: split/manpages
    description: scons manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: SCons/scons

test:
  environment:
    contents:
      packages:
        - build-base
        - man-db
        - python3
        - scons-doc
  pipeline:
    - runs: |
        scons --version
        sconsign --h
        scons-configure-cache --h

        GROFF_NO_SGR=1 man scons | sed 's/.\\x08//g' | grep -F "software construction tool"
        GROFF_NO_SGR=1 man sconsign | sed 's/.\\x08//g' | grep -F "SCons signature file"

        # Create a simple SConstruct file for testing
        printf 'env = Environment()\nenv.Program("hello", "hello.c")\n' > SConstruct
        printf '#include <stdio.h>\nint main() { printf("Hello, World!\\n"); return 0; }\n' > hello.c

        # Run SCons to build the program
        scons

        # Verify that the program was built
        ./hello
