package:
  name: serf
  version: 1.3.10
  epoch: 9
  description: High-Performance Asynchronous HTTP Client Library
  copyright:
    - license: Apache-2.0 AND Zlib
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  openssl-version: "3.6"

environment:
  contents:
    packages:
      - apr-util-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - chrpath
      - glibc-2.44-dev
      - krb5-dev
      - libapr-dev
      # Breaks subversion with openssl-hardened-dev
      - openssl-${{vars.openssl-version}}-dev
      - scons
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/serf
      tag: ${{package.version}}
      expected-commit: b7379137917a567fb7d2c0de1151e92a491929e7

  - runs: scons PREFIX=/usr

  - runs: scons install --install-sandbox="${{targets.destdir}}"

  - uses: strip

subpackages:
  - name: serf-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - openssl-${{vars.openssl-version}}-dev
        - serf
    description: serf dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: apache/serf
    use-tag: true

test:
  environment:
    contents:
      packages:
        - subversion
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        svnadmin create /tmp/testrepo
        svn checkout file:///tmp/testrepo /tmp/wc
