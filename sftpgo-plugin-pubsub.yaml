package:
  name: sftpgo-plugin-pubsub
  version: "1.0.19"
  epoch: 0 # CVE-2026-81870
  description: "Additional KMS secret providers for SFTPGo"
  copyright:
    - license: AGPL-3.0-only

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sftpgo/sftpgo-plugin-pubsub
      tag: v${{package.version}}
      expected-commit: ea24ff343dca35db3dde66d00e69b7074d67a8a6

  - uses: bump
    with:
      deps: |-
        google.golang.org/grpc@v1.83.2
        github.com/rabbitmq/amqp091-go@v1.13.0
        go.opentelemetry.io/otel/sdk@v1.45.0
        go.opentelemetry.io/otel@v1.45.0
        go.opentelemetry.io/otel/metric@v1.45.0
        go.opentelemetry.io/otel/sdk/metric@v1.45.0
        go.opentelemetry.io/otel/trace@v1.45.0

  - uses: go/build
    with:
      packages: .
      output: sftpgo-plugin-pubsub
      ldflags: -X main.commitHash=$(git describe --always) -X main.date=$(date -u -d "@$SOURCE_DATE_EPOCH" +%FT%TZ)
      go-package: go-1.27

test:
  pipeline:
    # This is a HashiCorp go-plugin binary, not meant to be run directly.
    # Verify the binary is a valid ELF with correct shared library dependencies.
    - uses: test/tw/ldd-check
    # Verify the binary exists and is executable.
    - name: Verify plugin binary is present and executable
      runs: |
        test -x /usr/bin/sftpgo-plugin-pubsub

update:
  enabled: true
  github:
    identifier: sftpgo/sftpgo-plugin-pubsub
    use-tag: true
    strip-prefix: v
