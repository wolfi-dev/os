package:
  name: sftpgo
  version: "2.7.5"
  epoch: 3 # restore cgo so the SQLite driver is compiled in
  description: "Full-featured and highly configurable SFTP, HTTP/S, FTP/S and WebDAV server - S3, Google Cloud Storage, Azure Blob"
  copyright:
    - license: AGPL-3.0-only
  resources:
    cpu: "2"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  go-version: "1.26"

environment:
  # SQLite support is behind a `cgo` build constraint upstream
  # (internal/dataprovider/sqlite.go), and the driver is mattn/go-sqlite3.
  # go/build/v2 does not pull in build-base the way go/build did, and go-1.26
  # dropped its own build-base dependency, so without these two lines Go finds
  # no C compiler, silently defaults CGO_ENABLED=0, and the binary reports
  # "SQLite disabled at build time" at runtime. Pinning CGO_ENABLED makes a
  # missing compiler a build failure instead of a silent feature drop.
  environment:
    CGO_ENABLED: "1"
  contents:
    packages:
      - build-base
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/drakkan/sftpgo
      tag: v${{package.version}}
      expected-commit: 9888a3d169aed9011ae6e4f7a97ae735c1643068

  - runs: |
      # Modify the default configuration file
      sed -i 's|"users_base_dir": "",|"users_base_dir": "/srv/sftpgo/data",|' sftpgo.json && \
      sed -i 's|"backups"|"/srv/sftpgo/backups"|' sftpgo.json && \
      sed -i 's|"sqlite"|"bolt"|' sftpgo.json

  - uses: go/build/v2
    with:
      packages: .
      output: sftpgo
      ldflags: -X github.com/drakkan/sftpgo/v2/internal/version.commit=$(git describe --always --abbrev=8) -X github.com/drakkan/sftpgo/v2/internal/version.date=$(date -u -d "@$SOURCE_DATE_EPOCH" +%FT%TZ)

  - runs: |
      # Create application data folder
      mkdir -p "${{targets.destdir}}"/etc/sftpgo
      mkdir -p "${{targets.destdir}}"/var/lib/sftpgo
      mkdir -p "${{targets.destdir}}"/usr/share/sftpgo
      mkdir -p "${{targets.destdir}}"/srv/sftpgo/data
      mkdir -p "${{targets.destdir}}"/srv/sftpgo/backups
      # Add to dest package
      mkdir -p "${{targets.destdir}}"/usr/bin
      cp sftpgo.json "${{targets.destdir}}"/etc/sftpgo/sftpgo.json
      cp -r templates "${{targets.destdir}}"/usr/share/sftpgo/templates
      cp -r static "${{targets.destdir}}"/usr/share/sftpgo/static
      cp -r openapi "${{targets.destdir}}"/usr/share/sftpgo/openapi

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: sftpgo
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: sftpgo
    - name: Test daemon startup
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /srv/sftpgo/data /srv/sftpgo/backups /var/lib/sftpgo
          mkdir -p /tmp/sftpgo-config
          cp /etc/sftpgo/sftpgo.json /tmp/sftpgo-config/
        start: /usr/bin/sftpgo serve --config-dir /tmp/sftpgo-config --log-file-path ""
        timeout: 60
        expected_output: |
          server listener registered
        post: |
          wait-for-it localhost:8080 -t 30
        error_strings: |
          FATAL
          panic

update:
  enabled: true
  github:
    identifier: drakkan/sftpgo
    use-tag: true
    strip-prefix: v
