package:
  name: simde
  version: 0.8.4_rc3
  epoch: 0
  description: SIMD Everywhere - portable SIMD intrinsics implementations in C/C++ headers
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - meson

# we only need this because of the rc tag, once we're not using that we can remove this!
var-transforms:
  - from: ${{package.version}}
    match: _rc
    replace: -rc
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/simd-everywhere/simde
      tag: v${{vars.mangled-package-version}}
      expected-commit: c86a433df3086512b0b12240defa9d9ddcc9decf

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: Development headers for ${{package.name}}
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - build-base
            - simde-dev
      pipeline:
        - uses: test/tw/devpackage
        - name: Verify simde-common.h is present and functional
          runs: |
            test -f /usr/include/simde/simde-common.h
            cat > /tmp/test_simde.c <<'EOF'
            #include <simde/simde-common.h>
            int main(void) {
              return 0;
            }
            EOF
            gcc /tmp/test_simde.c -o /tmp/test_simde
            /tmp/test_simde
        - name: Verify x86 SSE/AVX headers compile
          runs: |
            cat > /tmp/test_sse.c <<'EOF'
            #include <simde/x86/sse.h>
            #include <simde/x86/sse2.h>
            #include <simde/x86/avx.h>
            #include <simde/x86/avx2.h>
            int main(void) { return 0; }
            EOF
            gcc /tmp/test_sse.c -o /tmp/test_sse
            /tmp/test_sse
        - name: Verify ARM NEON headers compile
          runs: |
            cat > /tmp/test_neon.c <<'EOF'
            #include <simde/arm/neon.h>
            int main(void) { return 0; }
            EOF
            gcc /tmp/test_neon.c -o /tmp/test_neon
            /tmp/test_neon

test:
  pipeline:
    - uses: test/tw/emptypackage

update:
  enabled: true
  github:
    identifier: simd-everywhere/simde
    strip-prefix: v
    use-tag: true
