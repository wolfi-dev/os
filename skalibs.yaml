package:
  name: skalibs
  version: "2.16.0.0"
  epoch: 1 # shared library naming: split libskarnet${{vars.soversion}}
  description: "set of general-purpose C programming libraries for skarnet.org software"
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - libskarnet${{vars.soversion}}=${{package.full-version}}
      - merged-lib
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - wolfi-baselayout

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.(\d+)\..*$
    replace: ${1}.${2}
    to: soversion

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 87fa32b0f547f3ee5d74a18547f4e520d9ec68ff
      repository: https://github.com/skarnet/skalibs.git
      tag: v${{package.version}}

  - name: Configure
    runs: |
      ./configure \
        --enable-shared \
        --enable-static \
        --prefix=/usr \
        --libdir=/usr/lib \
        --libexecdir=/usr/lib

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libskarnet${{vars.soversion}}
    description: "skarnet.org general-purpose C library"
    pipeline:
      - uses: split/lib
    dependencies:
      runtime:
        - merged-lib
        - wolfi-baselayout
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: "skalibs-dev"
    description: "skalibs development headers"
    pipeline:
      - uses: split/dev
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/skalibs
          mv "${{targets.destdir}}"/usr/lib/skalibs/sysdeps "${{targets.subpkgdir}}"/usr/lib/skalibs/
    test:
      pipeline:
        - uses: test/tw/ldd-check
    dependencies:
      runtime:
        - libskarnet${{vars.soversion}}=${{package.full-version}}
        - merged-lib
        - wolfi-baselayout

update:
  enabled: true
  github:
    identifier: skarnet/skalibs
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
