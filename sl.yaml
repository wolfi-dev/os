# Generated from https://git.alpinelinux.org/aports/plain/community/sl/APKBUILD
package:
  name: sl
  version: "5.02"
  epoch: 4 # add strip pipeline and ldd-check test
  description: Cure your bad habit of mistyping
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.43-dev
      - ncurses-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0fd8d6f6484cddc2b58ffa501b9ae0bf0b3f0742
      repository: https://github.com/mtoyoda/sl
      tag: ${{package.version}}

  - runs: make

  - runs: |
      install -Dm755 sl "${{targets.destdir}}/usr/bin/sl"

  - runs: |
      install -Dm644 sl.1 "${{targets.destdir}}/usr/share/man/man1/sl.1"

  - uses: strip

subpackages:
  - name: sl-doc
    pipeline:
      - uses: split/manpages
    description: sl docs
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: mtoyoda/sl

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: TERM=linux sl
