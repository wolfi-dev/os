package:
  name: slirp4netns
  version: "1.3.5"
  epoch: 0
  description: User-mode networking for unprivileged network namespaces
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - libslirp
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - glib-dev
      - glibc-2.43-dev
      - libcap-dev
      - libseccomp-dev
      - libslirp-dev
      - pkgconf-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rootless-containers/slirp4netns
      tag: v${{package.version}}
      expected-commit: 7132ff3ba66cf0eebd8c9a83b9f23838bc84c518

  - runs: bash ./autogen.sh

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: slirp4netns-doc
    description: slirp4netns docs
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: rootless-containers/slirp4netns
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: slirp4netns
    - uses: test/tw/ver-check
      with:
        bins: slirp4netns
        version: ${{package.version}}
