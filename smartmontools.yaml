package:
  name: smartmontools
  version: "7.5"
  epoch: 3 # add test pipeline steps
  description: Control and monitor S.M.A.R.T. enabled hard drives
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "1"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - libcap-ng-dev
      - linux-headers
      - systemd-dev

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: _
    to: smartmontools-tag-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/smartmontools/smartmontools
      tag: RELEASE_${{vars.smartmontools-tag-version}}
      expected-commit: f276b249fdc84019403491303479485030ac7c80

  - working-directory: smartmontools
    pipeline:
      - uses: autoconf/configure
        with:
          opts: |
            --sbindir=/usr/bin
      - uses: autoconf/make
      - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/doc
          mv ${{targets.destdir}}/usr/share/doc/smartmontools ${{targets.contextdir}}/usr/share/doc
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Verify smartmontools installation
      runs: |
        smartctl --version | grep "${{package.version}}"
    - name: List supported device types
      runs: |
        # -d list shows compiled-in device types; may exit non-zero
        # in a VM without real hardware attached.
        smartctl -d list >/tmp/type-list.txt 2>&1 || true
        cat /tmp/type-list.txt
    - name: Scan for available devices
      runs: |
        # Exercises the device scanning functionality; may return empty
        # list in containers/VMs without physical SMART devices.
        smartctl --scan || true
    - name: Print smartd default configuration
      runs: |
        # Exercises the smartd binary's configuration and defaults system
        smartd -D > /tmp/smartd-defaults.txt 2>&1 || true
        grep -F "smartd" /tmp/smartd-defaults.txt
    - uses: test/tw/ldd-check

update:
  enabled: true
  version-transform:
    - match: _
      replace: .
  github:
    identifier: smartmontools/smartmontools
    strip-prefix: "RELEASE_"
    use-tag: true
