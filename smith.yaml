package:
  name: smith
  # What the pinned commit's pyproject.toml and the installed Python metadata
  # both report. Upstream has not tagged it (newest tag is 0.3.8, 2024-04-13);
  # if they tag 0.3.9 at a later commit, this snapshot keeps the version and
  # the release is distinguished by epoch, which is the trade for having
  # `smith --version` agree with the package. Asked for the tag in
  # silnrsi/smith#86.
  version: 0.3.9
  epoch: 0
  description: SIL's waf-based framework for building, testing and releasing fonts and other Writing Systems Implementation components from a wscript
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      # The bar for this list: every tool smith shells out to that os/ already
      # has, because smith resolves them from PATH at configure time and a
      # missing one is a confusing failure inside a font build rather than a
      # dependency error. fontmake (font.py, .designspace sources), ttfautohint
      # (when a wscript asks for hinting) and grcompiler (font.py _Gdl, for the
      # Graphite tables font-padauk and font-abyssinica need). Tools os/ does
      # not have yet (pysilfont's psf*, Font::TTF's ttftable, sile,
      # cmptxtrender) are deliberately absent and stay optional at configure
      # time thanks to the patch below; add them here as they land.
      - fontmake
      # Package.__init__ calls getversion() unless the wscript sets
      # buildversion, and getversion runs "git rev-parse HEAD" whenever it
      # finds a .git above the cwd (package.py). Font repositories are git
      # checkouts, so without git every smith command, configure included,
      # dies with FileNotFoundError.
      - git
      - grcompiler
      - python-${{vars.python-version}}-base
      - ttfautohint
  options:
    # smith ships a private vendored copy of waf (waflib) in site-packages;
    # do not advertise anything installed under the prefix as a provider.
    no-provides: true

vars:
  # master declares requires-python >= 3.8; 3.13 is Wolfi's default python3
  # and matches the interpreter os/fontmake.yaml uses for the tools smith runs.
  python-version: '3.13'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - python-${{vars.python-version}}-dev
      - uv

pipeline:
  # Pinned to a master commit, not to a tag. The newest tag, 0.3.8 (April
  # 2024), cannot run on any Python Chainguard ships: its vendored waf does
  # "import imp" (waflib/Context.py), and imp was removed in Python 3.12, so
  # importing smith raises ModuleNotFoundError. master carries a newer waf
  # without it, declares version 0.3.9, and is what upstream's own container
  # image installs. Move to a tag once one exists after this commit.
  - uses: git-checkout
    with:
      repository: https://github.com/silnrsi/smith
      branch: master
      expected-commit: 952744839042144f6069ca43899e591e39b0ea92

  # smith registers its built-in test commands whether or not a wscript uses
  # them, and their extra tools (sile, palaso's cmptxtrender, Font::TTF's
  # ttftable) are looked up as mandatory at configure time, so "smith
  # configure" fails with "Could not find the program sile" on every font
  # project, SIL's own font-padauk and font-abyssinica included. None of the
  # three is packaged. Make those lookups optional, as the other test tools
  # in the same function already are; build tools stay mandatory. Filed
  # upstream as silnrsi/smith#87; drop this when it merges.
  - uses: patch
    with:
      patches: test-tools-not-mandatory.patch

  - uses: auth/uv
    with:
      allow-fallback-indexes: true

  - runs: |
      uv pip install . --prefix ${{targets.destdir}}/usr --no-compile --python python${{vars.python-version}}
      rm -f ${{targets.destdir}}/usr/.lock
      install -Dm644 bash_completion_smith ${{targets.destdir}}/usr/share/bash-completion/completions/smith

  - uses: strip

test:
  environment:
    contents:
      packages:
        # git is deliberately NOT listed here: it is a runtime dependency of
        # the package, so the test environment gets it from there, and this
        # test would fail if that declaration were dropped.
        - py${{vars.python-version}}-fonttools
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: smith
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        imports: |
          import smithlib.smith
          import waflib.Context
    - uses: test/tw/shell-syntax-check
      with:
        files: /usr/share/bash-completion/completions/smith
    # No xcover here: smith is Python, so the only binary to profile is the
    # shared interpreter, and the coverage figure would describe
    # /usr/bin/python3.13 rather than anything this package ships.
    - name: Prepare a minimal font project
      runs: |
        mkdir -p /tmp/smithtest/source
        cd /tmp/smithtest || exit 1
        # pysilfont (psfufo2ttf) is not packaged, so the font source is a TTF,
        # which smith copies into results/ instead of compiling a UFO.
        python${{vars.python-version}} - source/SmithTest-Regular.ttf <<'EOF'
        import sys
        from fontTools.fontBuilder import FontBuilder
        from fontTools.pens.ttGlyphPen import TTGlyphPen
        fb = FontBuilder(1000, isTTF=True)
        fb.setupGlyphOrder([".notdef", "space", "A"])
        fb.setupCharacterMap({0x20: "space", 0x41: "A"})
        pen = TTGlyphPen(None)
        pen.moveTo((100, 0)); pen.lineTo((100, 700)); pen.lineTo((500, 700)); pen.lineTo((500, 0)); pen.closePath()
        empty = TTGlyphPen(None).glyph()
        fb.setupGlyf({".notdef": empty, "space": TTGlyphPen(None).glyph(), "A": pen.glyph()})
        fb.setupHorizontalMetrics({".notdef": (600, 0), "space": (300, 0), "A": (600, 100)})
        fb.setupHorizontalHeader(ascent=800, descent=-200)
        fb.setupNameTable({"familyName": "SmithTest", "styleName": "Regular"})
        fb.setupOS2()
        fb.setupPost()
        fb.save(sys.argv[1])
        EOF
        cat > wscript <<'EOF'
        APPNAME = 'SmithTest'
        VERSION = '1.000'
        DESC_SHORT = 'smith package test font'

        font(target = 'SmithTest-Regular.ttf',
             source = 'source/SmithTest-Regular.ttf')
        EOF
        printf 'SmithTest test font\n' > README.md
        printf 'SIL Open Font License placeholder\n' > OFL.txt
        printf 'SmithTest font log\n' > FONTLOG.txt
        # smith derives release versions and tarball contents from git.
        git init -q
        git add -A
        git -c user.name=test -c user.email=test@example.com commit -q -m init
    - name: smith configure finds the tools for the wscript
      working-directory: /tmp/smithtest
      runs: |
        smith configure 2>&1 | tee configure.log
        grep -F "'configure' finished successfully" configure.log
        # The out directory is "results", so waf's lock file is named after
        # it. sile, cmptxtrender and ttftable are reported "not found" here
        # and configure carries on; that is what the patch above fixes.
        ls .lock-smithresults
        for tool in sile cmptxtrender ttftable; do
          if grep -qF "Checking for program $tool" configure.log; then
            echo "PASS: $tool was looked up without aborting configure"
          else
            echo "FAIL: configure never looked for $tool"
            exit 1
          fi
        done
    - name: smith build produces the font defined in the wscript
      working-directory: /tmp/smithtest
      runs: |
        smith build 2>&1 | tee build.log
        grep -F "'build' finished successfully" build.log
        built=$(find results -name SmithTest-Regular.ttf -type f | head -n1)
        test -n "$built"
        python${{vars.python-version}} - "$built" <<'EOF'
        import sys
        from fontTools.ttLib import TTFont
        f = TTFont(sys.argv[1])
        assert f["name"].getDebugName(1) == "SmithTest", f["name"].getDebugName(1)
        assert "A" in f.getGlyphOrder(), f.getGlyphOrder()
        print("built", sys.argv[1], f["name"].getDebugName(4))
        EOF
    - name: smith zip packages the built font
      working-directory: /tmp/smithtest
      runs: |
        smith zip 2>&1 | tee zip.log
        grep -F "'zip' finished successfully" zip.log
        archive=$(find results/releases -name '*.zip' -type f | head -n1)
        test -n "$archive"
        python${{vars.python-version}} - "$archive" <<'EOF'
        import sys, zipfile
        names = zipfile.ZipFile(sys.argv[1]).namelist()
        print("\n".join(names))
        assert any(n.endswith("SmithTest-Regular.ttf") for n in names), names
        EOF
    # "tarball" packages the build results and the licence and font log, the
    # LF-ending counterpart of "zip", not the project sources.
    - name: smith tarball packages the built font and the licence
      working-directory: /tmp/smithtest
      runs: |
        smith tarball 2>&1 | tee tarball.log
        grep -F "'tarball' finished successfully" tarball.log
        archive=$(find results/releases -name '*.tar*' -type f | head -n1)
        test -n "$archive"
        python${{vars.python-version}} - "$archive" <<'EOF'
        import sys, tarfile
        names = tarfile.open(sys.argv[1], "r:*").getnames()
        print("\n".join(names))
        assert any(n.endswith("SmithTest-Regular.ttf") for n in names), names
        assert any(n.endswith("OFL.txt") for n in names), names
        EOF
    - name: smith distclean removes build outputs and configuration
      working-directory: /tmp/smithtest
      runs: |
        stat results
        smith distclean 2>&1 | tee distclean.log
        grep -F "'distclean' finished successfully" distclean.log
        if [ -e results ]; then
          echo "ERROR: results/ still present after distclean"
          exit 1
        fi
        if [ -e .lock-smithresults ]; then
          echo "ERROR: the waf lock file is still present after distclean"
          exit 1
        fi
        stat wscript

update:
  enabled: false
  exclude-reason: |
    Pinned to a master commit: the newest tag, 0.3.8, carries a vendored waf
    that does "import imp" and so cannot run on Python 3.12 or later. Re-enable
    with use-tag once upstream tags a release after 95274483.
