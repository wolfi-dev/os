#nolint:valid-pipeline-git-checkout-tag
package:
  name: smokescreen
  version: "0_git20261002"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.1
  description: A simple HTTP proxy that fogs over naughty URLs
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 3Gi

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: fa5bb56b48fe91922b14b40f94f179a47d2c67e6
      repository: https://github.com/stripe/smokescreen
      branch: master

  - uses: bump
    with:
      deps: |-
        github.com/sirupsen/logrus@v1.9.1

  - uses: go/build/v2
    with:
      packages: .
      output: smokescreen

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/local/bin"
          ln -sf ../../bin/smokescreen "${{targets.contextdir}}/usr/local/bin/smokescreen"
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: Upstream does not maintain tags or releases but master branch is active

test:
  environment:
    contents:
      packages:
        - curl
        - python3
        - wait-for-it
  pipeline:
    - uses: test/tw/ldd-check
    - name: "start daemon on localhost"
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /tmp
          cat > /tmp/config.yaml <<EOF
          allow_missing_role: true
          EOF
          cat > /tmp/acl.yaml <<ACL
          version: v1
          services: []
          default:
            name: default
            project: tests
            action: open
          ACL
          python3 -m http.server 8000 >/dev/null 2>&1 &
          wait-for-it -t 10 --strict localhost:8000 -- echo "http.server is up"
        start: "smokescreen --egress-acl-file /tmp/acl.yaml --config-file /tmp/config.yaml --allow-range 127.0.0.0/8 --listen-port 4750"
        timeout: 10
        expected_output: |
          starting
        post: |
          wait-for-it -t 10 --strict localhost:4750 -- echo "smokescreen is up"
          # smokescreen now detects and denies self-connections (proxying back to any
          # of its own host's local IPs, including 127.0.0.1) to prevent recursive
          # proxy / SSRF loops. This check runs ahead of --allow-range, so a request
          # for the local http.server is always rejected with 407, even though
          # --allow-range covers 127.0.0.0/8. Assert that expected denial instead.
          if curl --proxytunnel -sv -x http://127.0.0.1:4750 http://127.0.0.1:8000 2>/tmp/curl.log 1>/dev/null; then
            echo "expected smokescreen to deny the self-connection proxy request, but curl succeeded"
            cat /tmp/curl.log
            exit 1
          fi
          cat /tmp/curl.log
          grep -q "CONNECT tunnel failed, response 407" /tmp/curl.log
