package:
  name: snyk-cli
  version: "1.1306.3"
  epoch: 1 # GHSA-hc8v-wwc9-vgxm
  description: Snyk CLI scans and monitors your projects for security vulnerabilities
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libstdc++
  resources:
    cpu: "2"
    memory: 11Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  python-version: "3.13"

environment:
  contents:
    packages:
      - apk-tools
      - bash
      - build-base
      - busybox
      - ca-certificates
      - convco
      - curl
      - go-1.26
      - nodejs-22
      - npm=11.18.0 # snyk-cli requires npm ^11.10 (>=11.10 <12); pin to avoid npm 12.x
      - perl-utils
      - py${{vars.python-version}}-requests
      - python-${{vars.python-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/snyk/cli
      tag: v${{package.version}}
      expected-commit: dc7db047afc23fe241bd67feb3815665abe2535b

  - uses: bump
    with:
      replaces: github.com/whilp/git-urls=github.com/chainguard-dev/git-urls@v1.0.2
      modroot: cliv2
      deps: |-
        golang.org/x/net@v0.56.0
        golang.org/x/text@v0.39.0
        github.com/klauspost/compress@v1.18.7
        github.com/go-git/go-git/v5@v5.19.2

  - runs: git checkout -b release/wolfi # This is so the determine-release-channel.sh script decides the to use the correct channel and not create a -dev version

  - runs: |
      # Write our version so `make build` doesn't produce an incorrectly-bumped one
      echo "${{package.version}}" >binary-releases/version
      mkdir ts-cli-binaries
      echo "${{package.version}}" >ts-cli-binaries/version
      # Patch cliv2/Makefile to bypass version-suffix checks:
      # - _validate-build-mode: validates BUILD_MODE is set correctly
      # - _verify-private-build: when BUILD_MODE=public, requires an 'oss'
      #   version suffix (e.g. 1.1306.3-oss). We build with the plain version
      #   so override both targets with no-ops. GNU make uses the last recipe
      #   when a target is defined multiple times.
      # Using BUILD_MODE=public (the default) avoids pulling private Go modules
      # (e.g. github.com/snyk/remy-cli-extension) that are inaccessible in
      # the build environment.
      printf '\n_validate-build-mode:\n\t@true\n_verify-private-build:\n\t@true\n' >>cliv2/Makefile
      # Override the build env's npm_config_ignore_scripts=true so native
      # modules (e.g. ssh2's cpu-features) get their bindings compiled.
      npm_config_ignore_scripts=false make build

  - runs: |
      mkdir -p "${{targets.contextdir}}"/usr/bin
      mv ./binary-releases/snyk-* "${{targets.contextdir}}"/usr/bin/snyk

update:
  enabled: true
  github:
    identifier: snyk/cli
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: snyk
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: snyk
    - runs: |
        # Verify core subcommands are available
        snyk --help | grep -F "test"
        snyk --help | grep -F "monitor"
        snyk --help | grep -F "auth"
        # Verify auth subcommand help works
        snyk auth --help
        # Verify test subcommand help works
        snyk test --help
        # Verify iac subcommand help works
        snyk iac --help
