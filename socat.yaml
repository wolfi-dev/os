package:
  name: socat
  version: "1.8.1.3"
  epoch: 4 # openssl: 3.6->4.0
  description: Multipurpose relay for binary protocols
  copyright:
    - license: GPL-2.0-only
  resources:
    cpu: "1"
    memory: 3Gi

update:
  enabled: true
  ignore-regex-patterns:
    - -b\d+$
  git:
    strip-prefix: tag-
    tag-filter-prefix: tag-

vars:
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - linux-headers
      - openssl-${{vars.openssl-version}}-dev
      - readline-dev
      - yodl

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 12c08bf66d709fba17035ce95d85bd218428d9ba
      repository: https://repo.or.cz/socat.git
      tag: tag-${{package.version}}

  - uses: patch
    with:
      patches: netdb-internal.patch use-linux-headers.patch 0001-Fix-OpenSSL-4.0-compatibility.patch

  - uses: autoconf/configure

  - runs: |
      make
      make doc
      make DESTDIR="${{targets.destdir}}" install

  - uses: strip

subpackages:
  - name: socat-doc
    pipeline:
      - uses: split/manpages
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share/socat
          install -m644 EXAMPLES doc/*.html doc/*.css "${{targets.subpkgdir}}"/usr/share/socat
    test:
      pipeline:
        - uses: test/tw/docs

test:
  environment:
    contents:
      packages:
        - openssl-${{vars.openssl-version}}
        - wait-for-port
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: "filan procan socat socat1"
    - runs: |
        socat -V | grep -F "#define WITH_OPENSSL 1"
    - name: Relay data between files
      runs: |
        echo "socat relay test" > /tmp/socat_in.txt
        socat -u OPEN:/tmp/socat_in.txt OPEN:/tmp/socat_out.txt,creat
        grep -F "socat relay test" /tmp/socat_out.txt
    - name: Relay data over TCP
      runs: |
        socat TCP-LISTEN:19876,reuseaddr,fork EXEC:"echo hello-from-socat" &
        SOCAT_PID=$!
        sleep 1
        OUTPUT=$(socat - TCP:127.0.0.1:19876)
        kill "$SOCAT_PID" 2>/dev/null || true
        echo "$OUTPUT" | grep -F "hello-from-socat"
    - name: Verify peer certificate by IP subjectAltName over TLS
      runs: |
        # The CN never matches, so the client can only accept the server
        # through the GEN_IPADD subjectAltName check in xio-openssl.c.
        cd "$(mktemp -d)"
        for ip in 127.0.0.1 127.0.0.2; do
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "$ip.key" -out "$ip.pem" -days 1 \
            -subj "/CN=wrong.invalid" -addext "subjectAltName=IP:$ip"
        done

        socat OPENSSL-LISTEN:19877,reuseaddr,fork,cert=127.0.0.1.pem,key=127.0.0.1.key,verify=0 \
          EXEC:"echo hello-from-tls" &
        GOOD_PID=$!
        socat OPENSSL-LISTEN:19878,reuseaddr,fork,cert=127.0.0.2.pem,key=127.0.0.2.key,verify=0 \
          EXEC:"echo hello-from-tls" &
        BAD_PID=$!
        wait-for-port 19877
        wait-for-port 19878

        OUTPUT=$(socat -d -d - OPENSSL:127.0.0.1:19877,cafile=127.0.0.1.pem,verify=1 2>good.log)
        cat good.log
        echo "$OUTPUT" | grep -F "hello-from-tls"
        grep -F "trusting certificate, commonName matches" good.log

        if socat - OPENSSL:127.0.0.1:19878,cafile=127.0.0.2.pem,verify=1 2>bad.log; then
          echo "client accepted a certificate for IP 127.0.0.2 when connecting to 127.0.0.1"
          exit 1
        fi
        cat bad.log
        grep -F 'commonName does not match hostname "127.0.0.1"' bad.log

        kill "$GOOD_PID" "$BAD_PID" 2>/dev/null || true
