package:
  name: souffle
  version: "2.5"
  epoch: 3
  description: Soufflé is a variant of Datalog for tool designers crafting analyses in Horn clauses. Soufflé synthesizes a native parallel C++ program from a logic specification.
  copyright:
    - license: UPL-1.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - flex
      - libffi-dev
      - ncurses-dev
      - python3
      - samurai
      - sqlite-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/souffle-lang/souffle
      tag: ${{package.version}}
      expected-commit: 5682a9f12e2668ecdd26348fe63cc508bc0fcf47

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: souffle-dev
    pipeline:
      - uses: split/dev
    description: souffle dev
    test:
      pipeline:
        - uses: test/pkgconf

update:
  enabled: true
  github:
    identifier: souffle-lang/souffle
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        souffle --version
        souffleprof -h
        souffle --help
    - name: Functional test - run a Datalog program
      runs: |
        cat > /tmp/test.dl <<'EOF'
        .decl edge(x:number, y:number)
        .decl reachable(x:number, y:number)
        .output reachable(IO=stdout)

        edge(1, 2).
        edge(2, 3).
        edge(3, 4).

        reachable(x, y) :- edge(x, y).
        reachable(x, z) :- reachable(x, y), edge(y, z).
        EOF
        souffle --no-preprocessor /tmp/test.dl | grep -q "1	4"
