package:
  name: speedtest-go
  version: "1.7.11"
  epoch: 0 # GO-2026-5856
  description: CLI and Go API to Test Internet Speed using speedtest.net
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  go-version: "1.26"

environment:
  contents:
    packages:
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/showwin/speedtest-go
      expected-commit: 6624073353497373d88290ee98c4b621dbddc4b4
      tag: v${{package.version}}

  - uses: go/build
    with:
      packages: .
      output: speedtest-go

test:
  pipeline:
    - runs: |
        speedtest-go
        speedtest-go --version
        speedtest-go --help

update:
  enabled: true
  github:
    identifier: showwin/speedtest-go
    strip-prefix: v
    tag-filter: v
