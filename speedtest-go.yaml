package:
  name: speedtest-go
  version: "1.8.3"
  epoch: 0 # go: 1.26->1.27
  description: CLI and Go API to Test Internet Speed using speedtest.net
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/showwin/speedtest-go
      expected-commit: df849caf7af00477d70f8b2978308474b7f68093
      tag: v${{package.version}}

  - uses: go/build
    with:
      packages: .
      output: speedtest-go

test:
  pipeline:
    - runs: |
        speedtest-go
        speedtest-go --version
        speedtest-go --help

update:
  enabled: true
  github:
    identifier: showwin/speedtest-go
    strip-prefix: v
    tag-filter: v
