package:
  name: src
  version: "7.6.0"
  epoch: 4 # toolchain rebuild for  go-1.27-1.27.1
  description: Sourcegraph CLI
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git
  resources:
    cpu: "3"
    memory: 7Gi

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-${{vars.go-version}}
      - libx11-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sourcegraph/src-cli
      expected-commit: cadb64a67c2ece9dff4d36ddac6eedbc45cc57d7
      tag: ${{package.version}}

  - uses: bump
    with:
      deps: |-
        golang.org/x/net@v0.55.0
        github.com/jackc/pgx/v5@v5.9.2
        golang.org/x/crypto@v0.52.0
      modroot: |-
        lib
        .

  - uses: go/build/v2
    with:
      packages: ./cmd/src
      output: src
      ldflags: "-X github.com/sourcegraph/src-cli/internal/version.BuildTag=${{package.version}}"

update:
  enabled: true
  github:
    identifier: sourcegraph/src-cli

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: src
    - uses: test/tw/help-check
      with:
        bins: src
