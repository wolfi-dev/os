package:
  name: sshfs
  version: 3.7.6
  epoch: 0
  description: A network filesystem client to connect to SSH servers
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - fuse3-dev
      - glib-dev
      - glibc-2.43-dev
      - meson

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/libfuse/sshfs
      tag: sshfs-${{package.version}}
      expected-commit: 7a2d988775446ebe7af9b01c99b3b8e86bddb05a

  - uses: meson/configure
    with:
      opts: -Dsbindir=/usr/bin

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

update:
  enabled: true
  github:
    identifier: libfuse/sshfs
    strip-prefix: sshfs-
    use-tag: true
    tag-filter: sshfs-

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify sshfs version output identifies the binary correctly
      runs: |
        sshfs --version 2>&1 | grep -F "SSHFS"
        mount.fuse.sshfs --version 2>&1 | grep -F "SSHFS"
        mount.sshfs --version 2>&1 | grep -F "SSHFS"
