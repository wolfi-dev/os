package:
  name: ssl_client
  version: "3.24.2"
  epoch: 2 # openssl-hardened: 3.6->4.0
  description: ssl_client from alpine busybox
  copyright:
    - license: GPL-2.0-only

vars:
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - openssl-hardened-${{vars.openssl-version}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d9d560d5de74ff9a7a73f3c903d6f126a0bf3142
      repository: https://github.com/alpinelinux/aports
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: 0001-ssl_client-use-SSL_set1_dnsname-and-SSL_set1_ipaddr.patch

  - runs: |
      cd main/busybox
      gcc -o ssl_client ssl_client.c -lssl -lcrypto
      mkdir -p ${{targets.destdir}}/usr/bin
      install -Dm755 ssl_client ${{targets.destdir}}/usr/bin/

  - uses: strip

update:
  enabled: true
  github:
    identifier: alpinelinux/aports
    use-tag: true
    tag-filter: v3
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - openssl
        - bash
        - wait-for-it
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test verified TLS with ssl_client over a connected socket
      runs: |
        # /dev/tcp needs bash.
        bash -euo pipefail <<'SCRIPT'
        mkdir -p /tmp/tls
        cd /tmp/tls
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout ca.key -out ca.crt -subj "/CN=test-ca" \
          -addext basicConstraints=critical,CA:TRUE \
          -addext keyUsage=critical,keyCertSign
        openssl req -newkey rsa:2048 -nodes \
          -keyout server.key -out server.csr -subj "/CN=ignored.invalid"
        echo "subjectAltName=DNS:test.example,IP:127.0.0.1" > ext.cnf
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
          -CAcreateserial -out server.crt -days 1 -extfile ext.cnf

        # ssl_client trusts the default verify paths, which SSL_CERT_FILE overrides.
        export SSL_CERT_FILE=/tmp/tls/ca.crt

        port=14433
        server_pid=""
        stop_server() {
          if [ -n "$server_pid" ]; then
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            server_pid=""
          fi
        }
        trap stop_server EXIT

        start_server() {
          port=$((port + 1))
          openssl s_server -accept "$port" -rev \
            -cert /tmp/tls/server.crt -key /tmp/tls/server.key \
            > /tmp/tls/server.log 2>&1 &
          server_pid=$!
          wait-for-it 127.0.0.1:"$port" -t 10
        }

        # Runs ssl_client against the local server on a socket passed with -s.
        # The -rev server answers each line reversed. Leaves the exit status in
        # $rc and the output in /tmp/tls/client.out.
        run_client() {
          start_server
          rc=0
          (printf 'hello\n'; sleep 2) | timeout 10 \
            ssl_client -s 3 "$@" 3<>/dev/tcp/127.0.0.1/"$port" \
            > /tmp/tls/client.out 2>&1 || rc=$?
          stop_server
          cat /tmp/tls/client.out
        }

        # The -rev server never closes the connection, so a working client is
        # ended by timeout (124). Any other status is a crash or an error.
        expect_roundtrip() {
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "FAIL: $1 (rc=$rc)"
            exit 1
          fi
          if ! grep -qx olleh /tmp/tls/client.out; then
            echo "FAIL: $1 (no round-tripped data)"
            exit 1
          fi
        }

        # A DNS name that matches a DNS SAN verifies and round-trips data.
        run_client -n test.example
        expect_roundtrip "-n test.example"

        # An IP literal is matched against the IP SAN.
        run_client -n 127.0.0.1
        expect_roundtrip "-n 127.0.0.1"

        # A DNS name absent from the certificate must fail verification.
        run_client -n wrong.example
        if [ "$rc" -ne 1 ] || grep -q olleh /tmp/tls/client.out ||
          ! grep -q "certificate verify failed" /tmp/tls/client.out; then
          echo "FAIL: -n wrong.example was not rejected (rc=$rc)"
          exit 1
        fi

        # An IP literal absent from the certificate must fail verification.
        run_client -n 127.0.0.2
        if [ "$rc" -ne 1 ] || grep -q olleh /tmp/tls/client.out ||
          ! grep -q "certificate verify failed" /tmp/tls/client.out; then
          echo "FAIL: -n 127.0.0.2 was not rejected (rc=$rc)"
          exit 1
        fi

        # A trailing dot is stripped before the name is checked.
        run_client -n test.example.
        expect_roundtrip "trailing dot in -n test.example. was not stripped"

        # -I skips verification, so a mismatched name still connects.
        run_client -I -n wrong.example
        expect_roundtrip "-I -n wrong.example did not connect"

        echo "ssl_client verification tests passed"
        SCRIPT
