package:
  name: subversion
  version: 1.14.5
  epoch: 14 # build the SWIG Perl bindings for the new subversion-perl subpackage
  description: Replacement for CVS, another versioning system (svn)
  copyright:
    - license: Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND HPND-Markus-Kuhn AND MIT AND Unicode-DFS-2015 AND FSFAP

environment:
  contents:
    packages:
      - apr-util-dev
      - autoconf
      - boost-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cyrus-sasl-dev
      - file
      - glibc-2.44-dev
      - libapr-dev
      - libmagic-dev
      - libtool
      - lz4-dev
      - perl
      - perl-dev
      - python3
      - serf-dev
      - sqlite-dev
      - swig
      - utf8proc-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/subversion
      tag: ${{package.version}}
      expected-commit: c828a37af875249916a452481cae96df83dc67ea

  - name: Drop the pre-generated SWIG proxies
    runs: |
      # The checkout ships proxy headers generated by whatever SWIG upstream
      # happened to use. Remove them so autogen.sh regenerates them against
      # the SWIG we build with, otherwise the Perl bindings fail to compile.
      rm -f subversion/bindings/swig/proxy/*.swg

  - runs: ./autogen.sh

  - uses: autoconf/configure
    with:
      opts: |
        --with-apr=/usr/bin/apr-1-config \
        --with-apr-util=/usr/bin/apu-1-config \
        --with-swig

  - uses: autoconf/make

  - name: Build the Perl bindings
    runs: |
      # swig-pl-lib first: the native extension links against
      # libsvn_swig_perl-1. Then swig-pl, which runs autogen-swig-pl to
      # generate core.c and the svn_*.c wrappers, runs Makefile.PL, and
      # builds the extension. Driving Makefile.PL by hand instead skips the
      # source generation and the link fails on a missing core.o.
      make -j"$(nproc)" V=1 swig-pl-lib
      make -j1 V=1 swig-pl

  - uses: autoconf/make-install

  - name: Install the Perl bindings
    runs: |
      make -j1 V=1 install-swig-pl-lib DESTDIR="${{targets.destdir}}"
      make -j1 pure_vendor_install \
        -C subversion/bindings/swig/perl/native \
        PERL_INSTALL_ROOT="${{targets.destdir}}"
      # autoconf/make-install strips libtool metadata, but it ran before this
      # step, so clean up after ourselves.
      find "${{targets.destdir}}" \
        \( -name '*.la' -o -name perllocal.pod -o -name .packlist \) -delete

  - uses: strip

subpackages:
  # Must stay ahead of subversion-dev and subversion-libs: split/dev would
  # claim the unversioned libsvn_swig_perl-1.so symlink, and subversion-libs
  # does a blanket `mv .../usr/lib/*` that would swallow both the versioned
  # library and the whole perl5 tree.
  - name: subversion-perl
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/perl5 "${{targets.subpkgdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libsvn_swig_perl-1.so* \
            "${{targets.subpkgdir}}"/usr/lib
    dependencies:
      runtime:
        - perl
        - subversion-libs
    description: Perl bindings for subversion
    test:
      environment:
        contents:
          packages:
            - perl
            - subversion
      pipeline:
        - uses: test/tw/ldd-check
        - name: SVN Perl modules load
          runs: |
            perl -e 'use SVN::Core; use SVN::Ra; use SVN::Delta; use SVN::Client;'
            perl -e 'use SVN::Core; print "SVN::Core $SVN::Core::VERSION\n";' \
              | grep -E "^SVN::Core 1\.14"
        - name: Read a real repository through the bindings
          runs: |
            svnadmin create /tmp/plrepo
            svn checkout "file:///tmp/plrepo" /tmp/plwc
            echo "hello" > /tmp/plwc/hello.txt
            svn add /tmp/plwc/hello.txt
            svn commit -m "Initial commit" /tmp/plwc

            # SVN::Ra is the layer git-svn actually drives.
            perl -e '
              use strict;
              use warnings;
              use SVN::Core;
              use SVN::Ra;
              my $ra = SVN::Ra->new(url => "file:///tmp/plrepo");
              my $rev = $ra->get_latest_revnum;
              die "expected rev 1, got $rev\n" unless $rev == 1;
              print "ok: get_latest_revnum=$rev\n";
            '

  - name: subversion-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - subversion-libs
    description: subversion development files
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: subversion-doc
    pipeline:
      - uses: split/manpages
    description: subversion manpages
    test:
      pipeline:
        - uses: test/tw/docs

  - name: subversion-bash-completion
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share/bash-completion/completions
          install -Dm644 tools/client-side/bash_completion "${{targets.subpkgdir}}"/usr/share/bash-completion/completions/subversion
          for i in svn svnadmin svndumpfilter svnlook svnsync svnversion; do ln -sf subversion "${{targets.subpkgdir}}"/usr/share/bash-completion/completions/$i; done
    description: subversion bash completion rules
    test:
      pipeline:
        - uses: test/tw/shell-syntax-check

  - name: subversion-libs
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/* "${{targets.subpkgdir}}"/usr/lib
    description: subversion libraries
    test:
      pipeline:
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: apache/subversion
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    # AUTOGENERATED
    - runs: |
        svn --version
        svnadmin --version
        svnbench --version
        svndumpfilter --version
        svnfsfs --version
        svnlook --version
        svnmucc --version
        svnrdump --version
        svnserve --version
        svnsync --version
        svnversion --version
        svn --help
        svnadmin --help
        svnbench --help
        svndumpfilter --help
        svnfsfs --help
        svnlook --help
        svnmucc --help
        svnrdump --help
        svnserve --help
        svnsync --help
        svnversion --help
    - name: Test core SVN operations
      runs: |
        # Create a local SVN repository
        svnadmin create /tmp/testrepo

        # Verify repository was created
        stat /tmp/testrepo/format
        stat /tmp/testrepo/db

        # Checkout the empty repository to a working copy
        svn checkout file:///tmp/testrepo /tmp/wc

        # Create a test file in the working copy
        echo "Hello from Subversion" > /tmp/wc/testfile.txt

        # Add the file to version control
        svn add /tmp/wc/testfile.txt

        # Commit the file
        svn commit -m "Initial commit" /tmp/wc

        # Update the working copy to verify commit succeeded
        svn update /tmp/wc

        # Verify the file is under version control
        svn info /tmp/wc/testfile.txt | grep -F "testfile.txt"

        # Verify svn log shows the commit
        svn log file:///tmp/testrepo | grep -F "Initial commit"
    - name: Test svnlook functionality
      runs: |
        # svnlook info on the repository after the commit
        svnlook info /tmp/testrepo

        # Verify the youngest revision
        rev=$(svnlook youngest /tmp/testrepo)
        [ "$rev" -ge 1 ] || { echo "FAIL: Expected revision >= 1, got $rev"; exit 1; }

        # Verify the commit log message
        svnlook log /tmp/testrepo | grep -F "Initial commit"

        # Verify the changed paths
        svnlook changed /tmp/testrepo | grep -F "testfile.txt"
    - name: Test svnversion functionality
      runs: |
        # Run svnversion in the working copy
        output=$(svnversion /tmp/wc)

        # svnversion should report a revision number (e.g., "1")
        echo "svnversion output: $output"
        echo "$output" | grep -E "^[0-9]"
