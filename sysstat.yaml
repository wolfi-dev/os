package:
  name: sysstat
  version: "12.7.9"
  epoch: 2
  description: Performance monitoring tools
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - linux-headers

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sysstat/sysstat
      tag: v${{package.version}}
      expected-commit: b8f987807e7c7ba5c1b2ca8b7b1e9d80e61bce6c

  - uses: autoconf/configure
    with:
      opts: |
        --disable-compress-manpg \
        --disable-nls

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: sysstat-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: sysstat/sysstat
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test iostat collects CPU and device statistics
      runs: |
        iostat 1 1 | grep -F "avg-cpu"
    - name: Test mpstat collects processor statistics
      runs: |
        mpstat 1 1 | grep -F "CPU"
    - name: Test pidstat collects task statistics
      runs: |
        pidstat 1 1 | grep -F "PID"
    - name: Test sar collects system activity data
      runs: |
        sar 1 1 | grep -F "CPU"
    - name: Test sadf can display sar data in JSON format
      runs: |
        sar -o /tmp/sar.dat 1 1
        sadf -j /tmp/sar.dat | grep -F "sysstat"
