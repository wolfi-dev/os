package:
  name: tcl
  version: "9.1.0"
  epoch: 1 # the script library in usr/lib/tcl9.1
  description: The Tcl scripting language
  copyright:
    - license: TCL
  dependencies:
    runtime:
      - sqlite-libs

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - sqlite-dev
      - tzdata
      - zip
      - zlib-dev

pipeline:
  - uses: fetch
    with:
      expected-sha256: 536c45543f64d6eb11832d97ba3494aacff046fbc5040273bd55258d0e448ff1
      uri: https://downloads.sourceforge.net/project/tcl/Tcl/${{package.version}}/tcl${{package.version}}-src.tar.gz

  - uses: autoconf/configure
    with:
      dir: unix
      opts: |
        --host=${{host.triplet.gnu}} \
        --build=${{host.triplet.gnu}} \
        --prefix=/usr \
        --sysconfdir=/etc \
        --mandir=/usr/share/man \
        --localstatedir=/var \
        --with-system-sqlite \
        --enable-64bit

  - runs: |
      # Set LD_LIBRARY_PATH so that tclsh can find libtcl9.0.so when
      # configuring bundled packages (e.g. thread) during the build.
      export LD_LIBRARY_PATH="$(pwd)/unix"
      make -C unix -j$(nproc) V=1

  - runs: |
      cd unix
      # export LD_LIBRARY_PATH="$_builddir"
      make INSTALL_ROOT=${{targets.destdir}} install install-private-headers

      export TCL_VERSION=${{package.version}}

      ln -sf tclsh${TCL_VERSION%.*} ${{targets.destdir}}/usr/bin/tclsh
      install -Dm644 ../license.terms ${{targets.destdir}}/usr/share/licenses/tcl/LICENSE
      chmod u+w ${{targets.destdir}}/usr/lib/libtcl${TCL_VERSION%.*}.so

      # The script library (init.tcl ...) is appended to libtcl as a zip
      # archive, which the strip step removes. Install it where libtcl looks
      # without the archive, its configured library directory, so that
      # programs embedding Tcl (expect) find it too; tclsh also looks in
      # <prefix>/library.
      mkdir -p ${{targets.destdir}}/usr/lib/tcl${TCL_VERSION%.*}
      cp -r ../library/* ${{targets.destdir}}/usr/lib/tcl${TCL_VERSION%.*}
      rm ${{targets.destdir}}/usr/lib/tcl${TCL_VERSION%.*}/license.terms
      ln -s lib/tcl${TCL_VERSION%.*} ${{targets.destdir}}/usr/library

  - uses: strip

subpackages:
  - name: tcl-doc
    pipeline:
      - uses: split/manpages
    description: tcl manpages
    test:
      pipeline:
        - uses: test/docs

  - name: tcl-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - tcl
        - tzdata
    description: tcl dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf

update:
  enabled: true
  release-monitor:
    identifier: 4941

test:
  environment:
    contents:
      packages:
        - build-base
        - tcl-dev
  pipeline:
    - name: "Return and validate version"
      runs: |
        # tclsh does not respond to a --version from the command line. This is
        # a work-around: https://stackoverflow.com/questions/9200108/get-the-version-of-tcl-from-the-command-line
        ACTUAL_VERSION=$(echo 'puts [info patchlevel];exit 0' | tclsh)

        if [ "$ACTUAL_VERSION" != ${{package.version}} ]; then
            echo "Error: Tcl version is $ACTUAL_VERSION, expected ${{package.version}}"
            exit 1
        fi
    - name: "Check tclsh can execute a basic command"
      runs: |
        echo 'puts "Hello, Tcl!"; exit 0' | tclsh | grep -F "Hello, Tcl!"
    - name: "Check a program embedding Tcl finds the script library"
      runs: |
        cat > /tmp/embed.c <<'EOC'
        #include <stdio.h>
        #include <tcl.h>
        int main(int argc, char **argv) {
            Tcl_FindExecutable(argv[0]);
            Tcl_Interp *interp = Tcl_CreateInterp();
            if (Tcl_Init(interp) != TCL_OK) {
                fprintf(stderr, "%s\n", Tcl_GetStringResult(interp));
                return 1;
            }
            return Tcl_Eval(interp, "puts [info library]") != TCL_OK;
        }
        EOC
        gcc -o /tmp/embed /tmp/embed.c -ltcl9.1
        /tmp/embed
    - uses: test/tw/ldd-check
