package:
  name: terraform-mcp-server
  version: "1.4.1"
  epoch: 2 # CVE-2026-128085
  description: Terraform MCP Server
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  go-version: "1.27"

environment:
  contents:
    packages:
      - go-${{vars.go-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/terraform-mcp-server
      expected-commit: 3781509a674482ca7e2821fab8159a25e3b29bdf
      tag: v${{package.version}}

  - uses: bump
    with:
      deps: |-
        github.com/hashicorp/go-slug@v0.18.3
        go.opentelemetry.io/otel/sdk@v1.47.0
        go.opentelemetry.io/otel@v1.47.0
        go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.47.0
        go.opentelemetry.io/otel/metric@v1.47.0
        go.opentelemetry.io/otel/sdk/metric@v1.47.0
        go.opentelemetry.io/otel/trace@v1.47.0
      language: go

  - uses: go/build/v2
    with:
      packages: ./cmd/terraform-mcp-server
      ldflags: |
        -X  terraform-mcp-server/version.GitCommit=$(git rev-parse HEAD)
        -X  terraform-mcp-server/version.BuildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")
      output: terraform-mcp-server

update:
  enabled: true
  ignore-regex-patterns:
    - rc
  github:
    identifier: hashicorp/terraform-mcp-server
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: version test
      runs: |
        terraform-mcp-server -v | grep ${{package.version}}
