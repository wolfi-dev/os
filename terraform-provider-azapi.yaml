package:
  name: terraform-provider-azapi
  version: "2.14.0"
  epoch: 0 # toolchain rebuild for  go-1.27-1.27.4
  description: Terraform Azure API provider
  copyright:
    - license: MPL-2.0
  resources:
    cpu: "2"
    memory: 5Gi
  dependencies:
    runtime:
      - terraform-local-provider-config
  test-resources:
    cpu: "1"
    memory: 1Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Azure/terraform-provider-azapi
      tag: v${{package.version}}
      expected-commit: 260e3683da9a1c24578aaf994d6e67419653cead

  - uses: bump
    with:
      deps: |-
        golang.org/x/net@v0.60.0
      language: go

  - uses: go/build
    with:
      packages: .
      output: terraform-provider-azapi
      go-package: go-1.27

  - runs: |
      GOARCH=$(go env GOARCH)
      mkdir -p "${{targets.destdir}}"/terraform/provider-mirror/registry.terraform.io/Azure/azapi/${{package.version}}/linux_${GOARCH}/
      ln -s /usr/bin/terraform-provider-azapi \
          "${{targets.destdir}}"/terraform/provider-mirror/registry.terraform.io/Azure/azapi/${{package.version}}/linux_${GOARCH}/terraform-provider-azapi_v${{package.version}}_x5

  - uses: upstream-tests/go-test

update:
  enabled: true
  github:
    identifier: Azure/terraform-provider-azapi
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: terraform-provider-azapi

environment:
  contents:
    packages:
      - go-1.27
