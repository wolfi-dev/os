package:
  name: tessdata
  version: 4.1.0
  epoch: 3
  description: Tesseract training data
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tesseract-ocr/tessdata
      tag: ${{package.version}}
      expected-commit: 4767ea922bcc460e70b87b1d303ebdfed0897da8

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/tessdata
      mv *.traineddata ${{targets.destdir}}/usr/share/tessdata/

update:
  enabled: true
  github:
    identifier: tesseract-ocr/tessdata

test:
  environment:
    contents:
      packages:
        - tesseract
  pipeline:
    - uses: test/tw/contains-files
      with:
        dir: /usr/share/tessdata/
        name: "*.traineddata"
    - name: Verify training data is loadable by tesseract
      runs: |
        # Verify tesseract can enumerate languages from the installed training data
        TESSDATA_PREFIX=/usr/share tesseract --list-langs | grep -F "eng"
    - name: Verify traineddata file structure with combine_tessdata
      runs: |
        # Verify the eng.traineddata file has valid internal structure
        output=$(combine_tessdata -l /usr/share/tessdata/eng.traineddata 2>&1)
        [ -n "$output" ]
