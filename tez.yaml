package:
  name: tez
  version: "0.10.5"
  epoch: 41 # commons-configuration2 2.15.0 dependencies (F-202)
  description: Apache Tez
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-${{vars.java-version}}-default-jvm

vars:
  java-version: 8

environment:
  contents:
    packages:
      - maven
      - openjdk-${{vars.java-version}}
  environment:
    LANG: en_US.UTF-8
    JAVA_HOME: /usr/lib/jvm/java-1.8-openjdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/tez
      tag: rel/release-${{package.version}}
      expected-commit: 60f3a013e904de3049e22b1a6784a51e5339bfcd

  - uses: auth/maven

  # commons-io, commons-lang3 and commons-text follow commons-configuration2: 2.15.0 is
  # built against commons-io 2.22.0, commons-lang3 3.20.0 and commons-text 1.15.0 (its pom).
  # With the older ones Hadoop brings, Hadoop metrics init in the Tez AM and tasks fails
  # (NoSuchMethodError HomeDirectoryLocationStrategy$Builder.getUnchecked(), then
  # NoClassDefFoundError org/apache/commons/lang3/SystemProperties).
  - uses: bump
    with:
      deps: |-
        org.apache.avro@avro@1.11.4
        com.google.protobuf@protobuf-java@3.25.5
        commons-beanutils@commons-beanutils@1.11.0
        com.nimbusds@nimbus-jose-jwt@10.0.2
        io.netty@netty-codec-http2@4.1.136.Final
        io.netty@netty-codec-smtp@4.1.136.Final
        com.microsoft.sqlserver@mssql-jdbc@10.2.4.jre8
        org.apache.zookeeper@zookeeper@3.8.6
        com.fasterxml.jackson.core@jackson-core@2.18.11@compile
        com.fasterxml.jackson.core@jackson-databind@2.18.11@compile
        com.fasterxml.jackson.core@jackson-annotations@2.18.6@compile
        io.netty@netty-codec-redis@4.1.136.Final
        io.netty@netty-handler@4.1.137.Final@compile
        org.apache.commons@commons-configuration2@2.15.0
        commons-io@commons-io@2.22.0
        org.apache.commons@commons-lang3@3.20.0
        org.apache.commons@commons-text@1.15.0
        org.jline@jline@4.3.1
        io.netty@netty-codec-stomp@4.1.136.Final
        io.netty@netty-handler-ssl-ocsp@4.1.136.Final
        org.eclipse.jetty@jetty-security@9.4.58.v20250814
        io.netty@netty-codec-xml@4.1.136.Final
        io.netty@netty-codec-http@4.1.137.Final@compile
        io.netty@netty-transport-classes-epoll@4.1.136.Final
        io.netty@netty-transport-sctp@4.1.137.Final
        org.asynchttpclient@async-http-client@2.16.1
        org.xerial.snappy@snappy-java@1.1.10.9
        org.jline@jline-builtins@4.3.1
        org.apache.kerby@kerby-asn1@2.1.2
        com.google.guava@guava@33.7.2-jre
        org.apache.hadoop.thirdparty@hadoop-shaded-guava@1.6.0@compile
      language: java
      properties: properties.yaml

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/share/java/tez
      mvn package -Dhadoop.version=3.4.1 -DskipTests -Dmaven.javadoc.skip=true -Dmaven.site.skip=true -Pnoui
      tar -xf tez-dist/target/tez-${{package.version}}.tar.gz -C ${{targets.contextdir}}/usr/share/java/tez

test:
  environment:
    contents:
      packages:
        - bash
  pipeline:
    # TODO: once the Hadoop package is available, add tests for integration with it.
    - name: tez-api jar check
      runs: |
        ls /usr/share/java/tez/tez-api-${{package.version}}.jar >/dev/null
    # F-202: commons-configuration2 2.15.0 moved without commons-io, commons-lang3 and
    # commons-text, and Hadoop metrics init (run by every Tez AM and task JVM) threw
    # NoSuchMethodError / NoClassDefFoundError while the build and the jar check passed.
    - name: Hadoop metrics init loads against the shipped lib directory
      runs: |
        # jjs (Nashorn) ships in the Java 8 JRE that tez already depends on, so no JDK is needed.
        cd "$(mktemp -d)"
        cat > metrics-init.js <<'EOF'
        var DMS = Java.type("org.apache.hadoop.metrics2.lib.DefaultMetricsSystem");
        DMS.initialize("tez-test");
        DMS.shutdown();
        print("DefaultMetricsSystem.initialize OK");
        EOF
        # jjs does not expand classpath wildcards, so list the jars.
        cp=$(ls /usr/share/java/tez/*.jar /usr/share/java/tez/lib/*.jar | tr '\n' ':')
        out=$(/usr/lib/jvm/java-1.8-openjdk/jre/bin/jjs -cp "$cp" metrics-init.js 2>&1) || { echo "$out"; exit 1; }
        echo "$out"
        echo "$out" | grep -qx 'DefaultMetricsSystem.initialize OK'
    - name: One copy each of commons-configuration2 and its dependencies
      runs: |
        for j in commons-configuration2 commons-io commons-lang3 commons-text; do
          n=$(ls /usr/share/java/tez/lib/ | grep -cE "^$j-[0-9][0-9.]*\.jar$")
          [ "$n" -eq 1 ] || { echo "expected one $j jar in /usr/share/java/tez/lib, found $n"; ls /usr/share/java/tez/lib/ | grep -E "^$j-"; exit 1; }
        done

update:
  enabled: true
  ignore-regex-patterns:
    - -rc
  github:
    identifier: apache/tez
    use-tag: true
    strip-prefix: rel/release-
    tag-filter: rel/release-
