package:
  name: tidy-html5
  version: "5.8.0"
  epoch: 0
  description: HTML parser, cleaner and pretty-printer
  copyright:
    - license: HTMLTIDY

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - libxslt

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/htacg/tidy-html5
      tag: ${{package.version}}
      expected-commit: 1ca37471b48a3498f985509828cb3cf85ea129f8

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DBUILD_SHARED_LIB=ON \
        -DTIDY_CONSOLE_SHARED=ON

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: libtidy
    description: HTML Tidy shared library
    pipeline:
      - uses: split/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-static
    description: HTML Tidy static library
    pipeline:
      - uses: split/static
    test:
      pipeline:
        - uses: test/tw/staticpackage

  - name: ${{package.name}}-dev
    description: HTML Tidy development files
    dependencies:
      runtime:
        - libtidy
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: HTML Tidy documentation
    pipeline:
      - uses: split/alldocs
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: htacg/tidy-html5
  ignore-regex-patterns:
    - '-next$'

test:
  environment:
    contents:
      packages:
        - build-base
        - pkgconf
        - tidy-html5-dev
  pipeline:
    - uses: test/tw/ldd-check
    - name: Repair HTML with the CLI
      runs: |
        printf '<p>hello <b>world' > input.html
        rc=0
        tidy -utf8 --show-body-only yes --wrap 0 -o output.html input.html || rc=$?
        # Tidy returns 1 for successfully repaired input with warnings.
        test "$rc" -le 1
        grep -F '<p>hello <b>world</b></p>' output.html
    - name: Compile and run a shared-library consumer
      runs: |
        cat > test.c <<'EOF'
        #include <tidy.h>
        #include <tidybuffio.h>
        #include <string.h>

        int main(void) {
            TidyDoc doc = tidyCreate();
            TidyBuffer output = {0}, errors = {0};
            int result = 1;
            if (!doc) return 1;
            tidySetErrorBuffer(doc, &errors);
            tidyOptSetInt(doc, TidyBodyOnly, yes);
            tidyOptSetInt(doc, TidyWrapLen, 0);
            if (tidyParseString(doc, "<p>hello <b>world") < 0) goto done;
            if (tidyCleanAndRepair(doc) < 0) goto done;
            if (tidySaveBuffer(doc, &output) < 0) goto done;
            if (output.bp && strstr((char *)output.bp, "<p>hello <b>world</b></p>")) result = 0;
        done:
            tidyBufFree(&output);
            tidyBufFree(&errors);
            tidyRelease(doc);
            return result;
        }
        EOF
        gcc $(pkg-config --cflags tidy) test.c -o test $(pkg-config --libs tidy)
        ./test
