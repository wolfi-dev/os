package:
  name: trurl
  version: "0.16.1"
  epoch: 3 # backport upstream const fixes for glibc 2.43+ / gcc 16
  description: 'trurl is a command line tool for URL parsing and manipulation.'
  copyright:
    - license: curl
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - curl-dev
      - glibc-2.44-dev
      - perl

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/curl/trurl
      tag: trurl-${{package.version}}
      expected-commit: b3c52ef9f84c5f31cebc0c1e05dcccaf298965e7

  # glibc 2.43+ (C23) makes strchr()/memchr() return const char * for a
  # const argument, which gcc 16 rejects with -Werror=discarded-qualifiers.
  # Upstream 6e1479cc3bde and b3c2faf7ee51; drop with the next release.
  - uses: patch
    with:
      patches: |
        0001-build-constify-strchr-memchr-results.patch
        0002-build-constify-more-to-fix-gcc-16-glibc-2.43-builds.patch

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

  - runs: |
      cd2nroff trurl.md > "${{targets.destdir}}"/usr/local/share/man/man1/trurl.1

subpackages:
  - name: "trurl-doc"
    description: "documentation for trurl"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  version-separator: _
  github:
    identifier: curl/trurl
    strip-prefix: trurl-

test:
  pipeline:
    - runs: |
        trurl --version
        trurl --url https://curl.se/we/are.html --get '{port}'
        trurl --help
