package:
  name: ttf-dejavu
  version: 2.37
  epoch: 9
  description: Font family based on the Bitstream Vera Fonts with a wider range of characters
  copyright:
    - license: Bitstream-Vera # https://dejavu-fonts.github.io/License.html
  resources:
    cpu: "2"
    memory: 2Gi

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: _
    to: mangled-package-version

vars:
  python-version: "3.13"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - encodings
      - font-util-dev
      - fontconfig
      - fontforge
      - mkfontscale
      - perl
      - perl-font-ttf

# Built from the FontForge sources (the .sfd files, checked out at the
# release tag; identical to the dejavu-fonts-<version> source archive) with
# upstream's own Makefile: scripts/generate.pe generates each face with
# FontForge, scripts/ttpostproc.pl (Font::TTF) sets the head flags and the
# gasp table, and scripts/lgc.pe strips the non-Latin/Greek/Cyrillic glyphs
# for the DejaVu LGC family. This replaces installing the two prebuilt
# dejavu-fonts-ttf and dejavu-lgc-fonts-ttf release archives.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dejavu-fonts/dejavu-fonts
      tag: version_${{vars.mangled-package-version}}
      expected-commit: 0eda8a319c08835009849583cd090bb5b141ce25

  - name: Build the full and LGC TrueType families
    runs: |
      # FontForge stamps head.created/modified and the FFTM source times from
      # the .sfd mtimes, which the checkout sets to "now"; pin them so the
      # fonts are reproducible (the Makefile propagates them with touch -r).
      touch -d "@${SOURCE_DATE_EPOCH:-0}" src/*.sfd
      make full-ttf lgc-ttf
      test "$(ls build/*.ttf | wc -l)" -eq 43

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/fonts/${{package.name}} \
        ${{targets.destdir}}/etc/fonts/conf.avail \
        ${{targets.destdir}}/etc/fonts/conf.d

      install -m644 build/*.ttf ${{targets.destdir}}/usr/share/fonts/${{package.name}}

      # The source tree carries the same fontconfig files the two release
      # archives shipped (byte-identical).
      install -m644 fontconfig/*.conf ${{targets.destdir}}/etc/fonts/conf.avail

      # Enable the upstream DejaVu fallback confs (generic <prefer> + aliases) so
      # DejaVu is ranked as a generic fallback. Replaces the old custom
      # dejavu.conf/tt-dejavu.conf, which fontconfig never loaded (conf.d only
      # reads [0-9]*.conf; un-prefixed files are ignored).
      for c in 57-dejavu-sans 57-dejavu-serif 57-dejavu-sans-mono \
               58-dejavu-lgc-sans 58-dejavu-lgc-serif 58-dejavu-lgc-sans-mono; do
        ln -sf /etc/fonts/conf.avail/$c.conf ${{targets.destdir}}/etc/fonts/conf.d/$c.conf
      done

update:
  enabled: true
  version-transform:
    - match: _
      replace: .
  github:
    identifier: dejavu-fonts/dejavu-fonts
    strip-prefix: version_
    use-tag: true

test:
  environment:
    contents:
      packages:
        - fontconfig
        - harfbuzz-utils
        - py${{vars.python-version}}-fonttools
        - python-${{vars.python-version}}
  pipeline:
    - uses: test/fonts
    - runs: |
        set -e
        # fontconfig must actually load the enabled upstream DejaVu confs.
        # NB: capture output and match with `case` rather than `cmd | grep -q` --
        # grep -q closes the pipe early, so the producer dies with SIGPIPE (exit
        # 141) under melange's `set -o pipefail` wrapper.
        conflist=$(fc-conflist)
        for c in 57-dejavu-sans 58-dejavu-lgc-sans; do
          case "$conflist" in
            *"/etc/fonts/conf.d/$c.conf"*) ;;
            *) echo "FAIL: $c.conf not loaded by fontconfig"; echo "$conflist"; exit 1 ;;
          esac
        done

        # and the confs must take effect: DejaVu ranked in each generic chain.
        for g in sans-serif serif monospace; do
          match=$(fc-match -s "$g")
          case "$match" in
            *DejaVu*) ;;
            *) echo "FAIL: DejaVu not in '$g' fallback chain"; echo "$match"; exit 1 ;;
          esac
        done
    - name: The 43 faces are complete, post-processed, and cover their scripts
      runs: |
        set -u
        cd /usr/share/fonts/ttf-dejavu
        python${{vars.python-version}} - <<'EOF'
        import glob
        import subprocess

        from fontTools.ttLib import TTFont

        # Glyph counts of the 2.37 release; a build from the .sfd sources must
        # reproduce them exactly (the LGC counts also prove lgc.pe ran).
        glyphs = {
            "DejaVuMathTeXGyre": 4282,
            "DejaVuSans": 6253, "DejaVuSans-Bold": 6196, "DejaVuSans-BoldOblique": 5413,
            "DejaVuSans-ExtraLight": 2032, "DejaVuSans-Oblique": 5355,
            "DejaVuSansCondensed": 6253, "DejaVuSansCondensed-Bold": 6196,
            "DejaVuSansCondensed-BoldOblique": 5413, "DejaVuSansCondensed-Oblique": 5355,
            "DejaVuSansMono": 3377, "DejaVuSansMono-Bold": 3316, "DejaVuSansMono-BoldOblique": 2711,
            "DejaVuSansMono-Oblique": 2710,
            "DejaVuSerif": 3528, "DejaVuSerif-Bold": 3506, "DejaVuSerif-BoldItalic": 3506,
            "DejaVuSerif-Italic": 3507,
            "DejaVuSerifCondensed": 3528, "DejaVuSerifCondensed-Bold": 3506,
            "DejaVuSerifCondensed-BoldItalic": 3506, "DejaVuSerifCondensed-Italic": 3507,
            "DejaVuLGCSans": 4595, "DejaVuLGCSans-Bold": 4612, "DejaVuLGCSans-BoldOblique": 4376,
            "DejaVuLGCSans-ExtraLight": 1806, "DejaVuLGCSans-Oblique": 4318,
            "DejaVuLGCSansCondensed": 4595, "DejaVuLGCSansCondensed-Bold": 4612,
            "DejaVuLGCSansCondensed-BoldOblique": 4376, "DejaVuLGCSansCondensed-Oblique": 4318,
            "DejaVuLGCSansMono": 2887, "DejaVuLGCSansMono-Bold": 2826,
            "DejaVuLGCSansMono-BoldOblique": 2533, "DejaVuLGCSansMono-Oblique": 2532,
            "DejaVuLGCSerif": 3304, "DejaVuLGCSerif-Bold": 3282, "DejaVuLGCSerif-BoldItalic": 3282,
            "DejaVuLGCSerif-Italic": 3283,
            "DejaVuLGCSerifCondensed": 3304, "DejaVuLGCSerifCondensed-Bold": 3282,
            "DejaVuLGCSerifCondensed-BoldItalic": 3282, "DejaVuLGCSerifCondensed-Italic": 3283,
        }
        assert sorted(glob.glob("*.ttf")) == sorted(n + ".ttf" for n in glyphs), sorted(glob.glob("*.ttf"))

        def notdef(path, text):
            out = subprocess.run(["hb-shape", "--no-glyph-names", "--no-positions", "--no-clusters", path, text],
                                 check=True, capture_output=True, text=True).stdout.strip()
            return out, any(tok in ("0", "gid0") for tok in out.replace("[", "|").replace("]", "|").split("|"))

        for name, count in glyphs.items():
            path = name + ".ttf"
            f = TTFont(path)
            assert f["maxp"].numGlyphs == count, (path, f["maxp"].numGlyphs, count)
            assert f["name"].getDebugName(5) == "Version 2.37", (path, f["name"].getDebugName(5))
            # Every face has outlines and layout features; every text face also
            # carries the TrueType instructions from the sources (the Math font
            # is unhinted upstream too).
            tables = ("glyf", "GSUB", "GPOS") + (() if name == "DejaVuMathTeXGyre" else ("fpgm", "prep", "cvt "))
            for table in tables:
                assert table in f, (path, table)
            # scripts/ttpostproc.pl: head flags 0x1f and the two-range gasp table.
            assert f["head"].flags == 0x1f, (path, hex(f["head"].flags))
            assert f["gasp"].gaspRange == {8: 2, 65535: 3}, (path, f["gasp"].gaspRange)
            # Every text face covers Latin, Greek and Cyrillic; the Math font
            # covers Latin, Greek and the mathematical operators.
            samples = (("The quick brown fox", "Ταχίστη αλώπηξ", "∀x∈ℝ ∫∑√") if name == "DejaVuMathTeXGyre"
                       else ("The quick brown fox", "Ταχίστη αλώπηξ", "Съешь ещё"))
            for text in samples:
                out, hit = notdef(path, text)
                assert not hit, (path, text, out)
            # Negative control: an unmapped code point shapes to .notdef.
            unmapped = next(chr(cp) for cp in range(0xE000, 0xF900) if cp not in f.getBestCmap())
            out, hit = notdef(path, unmapped)
            assert hit, (path, "the .notdef check cannot fail", out)

        # The full family also covers Arabic, Armenian, Georgian, Hebrew and
        # Braille; the LGC family must NOT (that is what lgc.pe strips).
        for text in ("السلام عليكم", "Բարեւ", "გამარჯობა", "שלום", "⠃⠗⠁⠊⠇"):
            out, hit = notdef("DejaVuSans.ttf", text)
            assert not hit, ("DejaVuSans.ttf", text, out)
        for text in ("السلام عليكم", "Բարեւ", "გამარჯობა", "שלום"):
            out, hit = notdef("DejaVuLGCSans.ttf", text)
            assert hit, ("DejaVuLGCSans.ttf still maps", text, out)
        assert "MATH" in TTFont("DejaVuMathTeXGyre.ttf")
        print(f"{len(glyphs)} faces: release glyph counts, ttpostproc flags/gasp, script coverage all as expected")
        EOF
        fc-list | grep -F "DejaVu Sans Mono"
        fc-list | grep -F "DejaVu LGC Serif"
        fc-list | grep -F "DejaVu Math TeX Gyre"
