update:
  enabled: true
  github:
    identifier: chainguard-dev/tw
    strip-prefix: v

test:
  pipeline:
    - runs: stat /usr/bin/tw
    - runs: |
        readlink -v /usr/bin/kgrep
        readlink -v /usr/bin/kimages
        readlink -v /usr/bin/ptrace
        readlink -v /usr/bin/sfuzz
        readlink -v /usr/bin/shu
        readlink -v /usr/bin/wassert
