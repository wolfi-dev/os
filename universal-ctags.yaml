#nolint:depends-on-unversioned-py-provides
package:
  name: universal-ctags
  dependencies:
    runtime:
      - glibc-iconv-common # calls iconv_open for non-UTF-8 charsets; glibc builds in only UTF-8/UCS/ASCII
  version: "6.2.1"
  epoch: 4 # runtime-depend on glibc-iconv-common (F-217)
  description: Maintained ctags implementation that generates an index of source code definitions
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - diffutils # upstream-tests: Units compare expected output with diff
      - glibc-2.44-dev
      - jansson-dev
      - libtool
      - libxml2-dev
      - pkgconf-dev
      - py3-docutils-bin
      - python3 # upstream-tests: make check runs man-test with python3
      - yaml-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/universal-ctags/ctags
      tag: v${{package.version}}
      expected-commit: b8eb0da4121372b5d74a90fc36cba6a31f147f3c

  - runs: ./autogen.sh

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  # testing.mak's check rule (tmain units tlib man-test check-genfile tutil)
  # is shadowed by automake's recursive check, so name its targets. They
  # print their own summaries and exit non-zero on a failure.
  - uses: upstream-tests/make-check
    with:
      harness: custom
      target: tmain units tlib man-test check-genfile tutil

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: Documentation for ${{package.name}}
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: universal-ctags/ctags
    strip-prefix: v
    tag-filter-prefix: v

test:
  environment: {}
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: ctags
    - name: Generate and inspect tags for a C source file
      runs: |
        cat > sample.c <<'EOF'
        int global_counter;
        int add(int a, int b) { return a + b; }
        void greet(void) { }
        EOF
        ctags -o tags sample.c
        # Every defined identifier must be indexed
        grep -q "^add\b" tags
        grep -q "^greet\b" tags
        grep -q "^global_counter\b" tags
    - name: Emit JSON output (verifies jansson support)
      runs: |
        cat > sample.c <<'EOF'
        int add(int a, int b) { return a + b; }
        EOF
        ctags --output-format=json -o - sample.c | grep -q '"name": "add"'
    - name: Read back tags with readtags
      runs: |
        cat > sample.c <<'EOF'
        int add(int a, int b) { return a + b; }
        EOF
        ctags -o tags sample.c
        readtags -t tags add | grep -q "add"
    - name: "--input-encoding=ISO-8859-2 (glibc-iconv-common)"
      runs: |
        # Without glibc-iconv-common this conversion fails (glibc builds in only UTF-8, UCS-2/4 and ASCII).
        [ ! -e /usr/lib/gconv/gconv-modules.d/gconv-modules-extra.conf ] || { echo "FAIL: full glibc-iconv is in the test environment, so this test cannot catch a missing glibc-iconv-common dependency"; exit 1; }
        # The test tooling (help-check pulls man-db and groff) brings glibc-iconv-common into most test environments, so also check the dependency itself.
        apk info -R universal-ctags | grep -qx glibc-iconv-common || { echo "FAIL: universal-ctags does not runtime-depend on glibc-iconv-common"; exit 1; }
        printf 'int y = 2; /* \xbf\xf3\xb3w */\n' > /tmp/a.c
        out=$(ctags --input-encoding=ISO-8859-2 --output-encoding=UTF-8 -f - /tmp/a.c 2>&1)
        if echo "$out" | grep -q 'failed opening encoding'; then echo "FAIL: $out"; exit 1; fi
        echo "$out" | grep -q "$(printf '\xc5\xbc\xc3\xb3\xc5\x82w')" || { echo "FAIL: tag pattern not converted: $out"; exit 1; }
