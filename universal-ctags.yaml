package:
  name: universal-ctags
  version: "6.2.1"
  epoch: 1 # glibc: 2.43->2.44
  description: Maintained ctags implementation that generates an index of source code definitions
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - glibc-2.44-dev
      - jansson-dev
      - libtool
      - libxml2-dev
      - pkgconf-dev
      - py3-docutils-bin
      - yaml-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/universal-ctags/ctags
      tag: v${{package.version}}
      expected-commit: b8eb0da4121372b5d74a90fc36cba6a31f147f3c

  - runs: ./autogen.sh

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: Documentation for ${{package.name}}
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: universal-ctags/ctags
    strip-prefix: v
    tag-filter-prefix: v

test:
  environment: {}
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: ctags
    - name: Generate and inspect tags for a C source file
      runs: |
        cat > sample.c <<'EOF'
        int global_counter;
        int add(int a, int b) { return a + b; }
        void greet(void) { }
        EOF
        ctags -o tags sample.c
        # Every defined identifier must be indexed
        grep -q "^add\b" tags
        grep -q "^greet\b" tags
        grep -q "^global_counter\b" tags
    - name: Emit JSON output (verifies jansson support)
      runs: |
        cat > sample.c <<'EOF'
        int add(int a, int b) { return a + b; }
        EOF
        ctags --output-format=json -o - sample.c | grep -q '"name": "add"'
    - name: Read back tags with readtags
      runs: |
        cat > sample.c <<'EOF'
        int add(int a, int b) { return a + b; }
        EOF
        ctags -o tags sample.c
        readtags -t tags add | grep -q "add"
