# Generated from https://git.alpinelinux.org/aports/plain/community/unrtf/APKBUILD
package:
  name: unrtf
  version: "0.21.12"
  epoch: 0 # glibc: 2.43->2.44
  description: Command-line program which converts RTF documents to other formats
  copyright:
    - license: GPL-3.0-or-later

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - gcc-14-default
      - glibc-2.44-dev

pipeline:
  - uses: fetch
    with:
      expected-sha256: 59ad6062fb1d7ab4d89dd0316a3cee19f5e719525a5387b6da6b69b3178e2098
      uri: https://ftp.gnu.org/gnu/unrtf/unrtf-${{package.version}}.tar.gz

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: unrtf-doc
    pipeline:
      - uses: split/manpages
    description: unrtf manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 5052

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify installation
      runs: |
        unrtf --version
    - name: Convert
      runs: |
        echo '{\\rtf1\\ansi This is a test.}' > test.rtf
        unrtf --text test.rtf | grep -i "Translation from RTF performed by UnRTF"
