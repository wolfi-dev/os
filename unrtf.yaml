# Generated from https://git.alpinelinux.org/aports/plain/community/unrtf/APKBUILD
package:
  name: unrtf
  dependencies:
    runtime:
      - glibc-iconv-common # calls iconv_open for non-UTF-8 charsets; glibc builds in only UTF-8/UCS/ASCII
  version: "0.21.14"
  epoch: 1 # runtime-depend on glibc-iconv-common (F-217)
  description: Command-line program which converts RTF documents to other formats
  copyright:
    - license: GPL-3.0-or-later

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - gcc-14-default
      - glibc-2.44-dev

pipeline:
  - uses: fetch
    with:
      expected-sha256: b1f72e87f195bd50dbc974b800918df61c881706c11716b7bd0a1981e81b9587
      uri: https://ftp.gnu.org/gnu/unrtf/unrtf-${{package.version}}.tar.gz

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: upstream-tests/make-check

  - uses: strip

subpackages:
  - name: unrtf-doc
    pipeline:
      - uses: split/manpages
    description: unrtf manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 5052

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify installation
      runs: |
        unrtf --version
    - name: Convert
      runs: |
        echo '{\\rtf1\\ansi This is a test.}' > test.rtf
        unrtf --text test.rtf | grep -i "Translation from RTF performed by UnRTF"
    - name: "RTF with \ansicpg1250 (glibc-iconv-common)"
      runs: |
        # Without glibc-iconv-common this conversion fails (glibc builds in only UTF-8, UCS-2/4 and ASCII).
        [ ! -e /usr/lib/gconv/gconv-modules.d/gconv-modules-extra.conf ] || { echo "FAIL: full glibc-iconv is in the test environment, so this test cannot catch a missing glibc-iconv-common dependency"; exit 1; }
        # The test tooling (help-check pulls man-db and groff) brings glibc-iconv-common into most test environments, so also check the dependency itself.
        apk info -R unrtf | grep -qx glibc-iconv-common || { echo "FAIL: unrtf does not runtime-depend on glibc-iconv-common"; exit 1; }
        printf '{\\rtf1\\ansi\\ansicpg1250 \\'"'"'bf\\'"'"'f3\\'"'"'b3w}\n' > /tmp/a.rtf
        out=$(unrtf --text /tmp/a.rtf 2>&1 | grep -v '^###')
        case "$out" in *"$(printf '\xc5\xbc\xc3\xb3\xc5\x82')"*) ;; *) echo "FAIL: unrtf gave: $out"; exit 1 ;; esac
