package:
  name: util-macros
  version: 1.20.2
  epoch: 4
  description: X.Org Autotools macros
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/xorg/util/macros
      tag: util-macros-${{package.version}}
      expected-commit: a9d71e3fd8e6758b70be31c586921bbbcd2a8449

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: Development files for ${{package.name}}
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  release-monitor:
    identifier: 5252

test:
  environment:
    contents:
      packages:
        - autoconf
        - automake
        - m4
        - util-macros-dev
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify X.Org macros are installed
      runs: |
        test -d /usr/share/aclocal || { echo "FAIL: /usr/share/aclocal not found"; exit 1; }
        m4_count=$(find /usr/share/aclocal -name "*.m4" | wc -l)
        [ "$m4_count" -gt 0 ] || { echo "FAIL: no .m4 files found in /usr/share/aclocal"; exit 1; }
        echo "Found $m4_count X.Org macro files"
    - name: Exercise macros via aclocal and autoconf
      runs: |
        tmpdir=$(mktemp -d)
        cd "$tmpdir"

        # Create a minimal configure.ac that uses the XORG_MACROS_VERSION macro
        cat > configure.ac <<'EOF'
        AC_PREREQ([2.60])
        AC_INIT([test-xorg-macros], [1.0])
        m4_ifndef([XORG_MACROS_VERSION],
            [m4_fatal([must install xorg-macros 1.8 or later before running autoconf/autogen])])
        XORG_MACROS_VERSION(1.8)
        XORG_DEFAULT_OPTIONS
        AC_OUTPUT
        EOF

        # Run aclocal to pull in the X.Org macros from /usr/share/aclocal
        aclocal -I /usr/share/aclocal

        # Run autoconf to verify the macros are syntactically valid and usable
        autoconf

        # Verify configure script was generated
        test -f configure || { echo "FAIL: configure script not generated"; exit 1; }
        echo "SUCCESS: X.Org macros processed correctly by aclocal and autoconf"
