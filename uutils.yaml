package:
  name: uutils
  version: "0.12.0"
  epoch: 5 # align with coreutils
  description: "Cross-platform Rust rewrite of the GNU coreutils."
  copyright:
    - license: MIT
  dependencies:
    # Must be less than coreutils
    provider-priority: 50
    provides:
      - coreutils=0
  resources:
    cpu: "5"
    memory: 15Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

update:
  enabled: true
  github:
    identifier: uutils/coreutils

vars:
  glibc-version: "2.44"
  llvm-version: "23"
  rust-version: "1.99"

data:
  # Leave disabled until we have a memory safe index
  # Otherwise, provider priority will have to be
  # juggled across all of these packages.
  #- name: progs-replaces
  #  items:
  #    hostname: net-tools
  #    kill: procps
  #    more: util-linux-misc
  #    uptime: procps
  - name: shell-completions
    items:
      bash: "bash-completion/completions"
      fish: "fish/vendor_completions.d"
      zsh: "zsh/site-functions"

environment:
  contents:
    packages:
      - cargo-auditable
      - clang-${{vars.llvm-version}}
      - glibc-${{vars.glibc-version}}-dev
      - libselinux-dev
      - make
      - openssl-dev
      - pkgconf
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/uutils/coreutils
      tag: ${{package.version}}
      expected-commit: dc1efd89948a9ca4c78c3a4b9a6ac891019a8c69

  - uses: patch
    with:
      patches: |-
        use-native-linker-on-aarch64.patch

  - uses: bump
    with:
      deps: |-
        time@0.3.47
        keccak@0.1.6
      features: unix
      language: rust

  - runs: |
      mkdir -p ${{targets.destdir}}/usr

      # CARGO: cargo auditable embeds the dependency manifest.
      # SELINUX_ENABLED: installs chcon and runcon. feat_selinux alone
      #   compiles chcon and runcon in without creating entry points.
      # BUILD_SPEC_FEATURE: extra features, since `make install` passes
      #   --no-default-features. feat_external_libstdbuf is omitted and
      #   has been enabled explicitly.
      # OPENSSL_NO_VENDOR: links system libcrypto instead of a vendored
      #   static OpenSSL.
      OPENSSL_NO_VENDOR=1 make \
        CARGO="cargo auditable" \
        SELINUX_ENABLED=1 \
        BUILD_SPEC_FEATURE="openssl feat_os_unix feat_selinux" \
        PREFIX=${{targets.destdir}}/usr \
        MULTICALL=y \
        install

  - runs: |
      # Remove this step and uncomment progs-replaces
      # after migrating uutils to memory safe index.
      for prog in hostname kill more uptime; do
        rm "${{targets.contextdir}}/usr/bin/${prog}"
      done

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    description: uutils manpages
    pipeline:
      - uses: split/alldocs
    test:
      pipeline:
        - uses: test/docs

  - name: ${{package.name}}-legacy
    description: Legacy digest utilities from uutils
    dependencies:
      # Must be less than coreutils-legacy
      provider-priority: 50
      provides:
        - coreutils-legacy=0
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          for prog in md5sum sha1sum; do
            rm "${{targets.destdir}}/usr/bin/${prog}"
            ln -s coreutils "${{targets.contextdir}}/usr/bin/${prog}"
          done
    test:
      pipeline:
        - runs: |
            echo -n abc | md5sum | grep -F 900150983cd24fb0d6963f7d28e17f72
            echo -n abc | sha1sum | grep -F a9993e364706816aba3e25717850c26c9cd0d89d
            echo hello | md5sum | grep -E "^[0-9a-f]{32}"
            echo hello | sha1sum | grep -E "^[0-9a-f]{40}"

  # Uncomment after enabling progs-replaces
  #- range: progs-replaces
  #  name: ${{package.name}}-${{range.key}}
  #  description: ${{range.key}} from uutils
  #  dependencies:
  #    replaces:
  #      - ${{range.value}}
  #    runtime:
  #      - ${{package.name}}=${{package.full-version}}
  #  pipeline:
  #    - runs: |
  #        mkdir -p "${{targets.contextdir}}/usr/bin"
  #        rm "${{targets.destdir}}/usr/bin/${{range.key}}"
  #        ln -s coreutils "${{targets.contextdir}}/usr/bin/${{range.key}}"
  #  test:
  #    pipeline:
  #      - uses: test/tw/ver-check
  #        with:
  #          bins: "/usr/bin/${{range.key}}"
  #      - uses: test/tw/help-check
  #        with:
  #          bins: "/usr/bin/${{range.key}}"
  - range: shell-completions
    name: ${{package.name}}-${{range.key}}-completion
    description: ${{range.key}} completion for uutils
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "$(dirname ${{targets.contextdir}}/usr/share/${{range.value}})"
          mv "${{targets.destdir}}/usr/share/${{range.value}}" \
             "${{targets.contextdir}}/usr/share/${{range.value}}"
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: /usr/share/${{range.value}}
        - uses: test/tw/shell-syntax-check

  - name: ${{package.name}}-locales
    description: Locales for uutils
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share"
          mv "${{targets.destdir}}/usr/share/locales" \
             "${{targets.contextdir}}/usr/share/locales"
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: /usr/share/locales

