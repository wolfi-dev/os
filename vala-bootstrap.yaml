package:
  name: vala-bootstrap
  version: "0.56.19"
  epoch: 0
  description: "Vala requires itself to bootstrap."
  copyright:
    - license: LGPL-2.1

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - flex
      - glib-dev
      - glib-gir
      - glibc-2.44-dev
      - gobject-introspection-dev
      - libxslt-dev
      - pkgconf-dev

pipeline:
  # blocked-bootstrap-complex: vala's git-checkout has no generated C
  # sources, so building it needs an existing valac, recreating the
  # self-dependency cycle this package exists to break. The release
  # tarball ships pre-generated C sources instead.
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/vala/0.56/vala-${{package.version}}.tar.xz
      expected-sha256: 5ad7cbbfcc0de61b403d6797c9ef60455bfbebd8e162aec33b5b0b097adfb9d5

  # --disable-valadoc: valadoc needs graphviz, which this bootstrap must
  # not depend on.
  - uses: autoconf/configure
    with:
      opts: --disable-valadoc

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

update:
  enabled: false
  exclude-reason: |
    Version is kept in lockstep with vala.yaml; bump both together.

test:
  pipeline:
    - runs: |
        valac --version
