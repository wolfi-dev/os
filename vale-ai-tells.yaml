package:
  name: vale-ai-tells
  version: "1.37.0_git20261011"
  epoch: 0
  description: Vale styles that flag linguistic patterns common in AI-generated prose and commit messages
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox
      - vale

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tbhb/vale-ai-tells
      branch: main
      expected-commit: 51f646e366ba7c9dcb078ebeae345b7ff353eb3b

  - runs: |
      styles="${{targets.destdir}}/usr/share/vale/styles"
      mkdir -p "${styles}/config"
      cp -r styles/ai-tells styles/ai-tells-commits styles/ai-tells-experimental "${styles}/"
      cp -r styles/config/scripts styles/config/templates "${styles}/config/"

  - name: Upstream rule cases pass against the packaged rules
    runs: |
      mkdir -p /tmp/rule-cases
      cp -r tests /tmp/rule-cases/
      ln -s "${{targets.destdir}}/usr/share/vale/styles" /tmp/rule-cases/styles
      cat > /tmp/rule-cases/.vale.ini <<'EOF'
      StylesPath = styles
      EOF

      cd /tmp/rule-cases
      vale test --coverage styles/ai-tells styles/ai-tells-commits styles/ai-tells-experimental tests

update:
  enabled: true
  github:
    identifier: tbhb/vale-ai-tells
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - vale
  pipeline:
    - name: Installs only the styles, scripts and template
      runs: |
        find /usr/share/vale/styles -mindepth 1 -maxdepth 2 -type d | sort > /tmp/dirs.txt
        cat > /tmp/expected-dirs.txt <<'EOF'
        /usr/share/vale/styles/ai-tells
        /usr/share/vale/styles/ai-tells-commits
        /usr/share/vale/styles/ai-tells-experimental
        /usr/share/vale/styles/config
        /usr/share/vale/styles/config/scripts
        /usr/share/vale/styles/config/templates
        EOF
        diff -u /tmp/expected-dirs.txt /tmp/dirs.txt
    - name: A project with its own StylesPath uses the styles through VALE_STYLES_PATH
      runs: |
        mkdir -p /tmp/project/.github/styles/Local
        cd /tmp/project

        cat > .vale.ini <<'EOF'
        StylesPath = .github/styles
        MinAlertLevel = suggestion

        [formats]
        COMMIT_EDITMSG = md

        [*.md]
        BasedOnStyles = Local, ai-tells, ai-tells-experimental

        [COMMIT_EDITMSG]
        BasedOnStyles = ai-tells, ai-tells-commits
        EOF

        cat > .github/styles/Local/Placeholder.yml <<'EOF'
        extends: existence
        message: "Replace the placeholder '%s'."
        level: error
        tokens:
          - TODO
        EOF

        cat > doc.md <<'EOF'
        # Setup

        TODO describe the cluster. Ultimately, this is a seamless and robust solution.

        The installer copies the binary into the user's local bin directory and sets its permissions.

        The installer copies the binary into the local bin directory of the user and sets permissions.
        EOF

        cat > COMMIT_EDITMSG <<'EOF'
        This commit adds comprehensive tests

        All 47 tests passing. Coverage: 87%.
        EOF

        status=0
        VALE_STYLES_PATH=/usr/share/vale/styles vale --output=line doc.md COMMIT_EDITMSG > /tmp/alerts.txt || status=$?
        cat /tmp/alerts.txt
        if [ "${status}" -ne 1 ]; then
          echo "ERROR: vale exited ${status}, expected 1 for error-level alerts"
          exit 1
        fi

        cut -d: -f1-4 /tmp/alerts.txt | sort > /tmp/found.txt
        cat > /tmp/expected.txt <<'EOF'
        COMMIT_EDITMSG:1:18:ai-tells-commits.CommitBuzzwords
        COMMIT_EDITMSG:1:18:ai-tells.AIAdjectiveNounPairs
        COMMIT_EDITMSG:1:18:ai-tells.OverusedVocabulary
        COMMIT_EDITMSG:1:1:ai-tells-commits.CommitSelfReference
        COMMIT_EDITMSG:3:1:ai-tells-commits.CommitTestEnumeration
        COMMIT_EDITMSG:3:23:ai-tells-commits.CommitTestEnumeration
        doc.md:3:1:Local.Placeholder
        doc.md:3:28:ai-tells.ConclusionMarkers
        doc.md:3:63:ai-tells.OverusedVocabulary
        doc.md:7:1:ai-tells-experimental.ContentDuplication
        EOF
        sort -o /tmp/expected.txt /tmp/expected.txt
        diff -u /tmp/expected.txt /tmp/found.txt
    - name: Vale finds the agent output template through VALE_STYLES_PATH
      runs: |
        cd /tmp/project

        status=0
        VALE_STYLES_PATH=/usr/share/vale/styles vale --output=ai-tells-agent.tmpl doc.md COMMIT_EDITMSG > /tmp/agent.txt || status=$?
        cat /tmp/agent.txt
        if [ "${status}" -ne 1 ]; then
          echo "ERROR: vale exited ${status}, expected 1 for error-level alerts"
          exit 1
        fi

        grep -E '^(FILE|TOTAL):' /tmp/agent.txt > /tmp/summary.txt
        cat > /tmp/expected-summary.txt <<'EOF'
        FILE: doc.md
        FILE: COMMIT_EDITMSG
        TOTAL: 10 finding(s) (9 error, 1 warning, 0 suggestion) in 2 file(s)
        EOF
        diff -u /tmp/expected-summary.txt /tmp/summary.txt
