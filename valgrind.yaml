package:
  name: valgrind
  version: "3.28.0"
  epoch: 0 # glibc: 2.43->2.44
  description: "Tool to help find memory-management problems in programs"
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "2"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  python-version: '3.14'

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: _
    to: mangled-version

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - docbook-xml
      - glibc-2.44-dev
      - libxslt
      - linux-headers
      - perl
      - python3
      - sed

pipeline:
  - uses: git-checkout
    with:
      repository: https://sourceware.org/git/valgrind.git
      tag: VALGRIND_${{vars.mangled-version}}
      expected-commit: 5a4657de12a8ed16b07175e1769df4dad31f80f2

  - runs: autoreconf -vfi

  # LTO off. Upstream's configure.ac says "--enable-lto=yes should be used by
  # distro packagers", and 3.28.0 builds and passes its tests with it, but the
  # result is a worse package: every tool binary grows (memcheck-amd64-linux
  # .text +10.7%), the installed size grows 15% (137.9 -> 158.7 MB; the tools
  # ship unstripped), and the archives in valgrind-dev (libcoregrind-*.a,
  # libvex-*.a, which out-of-tree tools link against) turn into slim LTO
  # bytecode that only this exact GCC release can consume. The last point
  # decides it on its own. Runtime: memcheck on gzip and on a CPython
  # workload ran 1-2% faster with LTO, within the noise of an alternated
  # six-round A/B on a pinned core, so there is no speed-up to pay for the
  # size with. Details: stereo PR #404216.
  - runs: |
      export CFLAGS="${CFLAGS/-fno-plt} -fno-stack-protector -no-pie -U_FORTIFY_SOURCE"
      ./configure \
        --build=$CBUILD \
        --host=$CHOST \
        --prefix=/usr \
        --sysconfdir=/etc \
        --mandir=/usr/share/man \
        --infodir=/usr/share/info \
        --localstatedir=/var \
        --without-mpicc

  - uses: autoconf/make

  - runs: |
      xsltproc --nonet --xinclude --path docs/xml \
        -o docs/ \
        "$(find /usr/share/xml/docbook -name 'docbook.xsl' -path '*/manpages/*' | head -1)" \
        docs/xml/manpages-index.xml

  - uses: autoconf/make-install

  - runs: |
      make DESTDIR="$${{targets.destdir}}" install

subpackages:
  - name: valgrind-doc
    pipeline:
      - uses: split/manpages
    description: valgrind manpages
    test:
      pipeline:
        - uses: test/docs

  - name: valgrind-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - valgrind
    description: valgrind dev
    test:
      pipeline:
        - uses: test/pkgconf

  - name: valgrind-scripts
    dependencies:
      runtime:
        - valgrind
        - python-${{vars.python-version}}
        - perl
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/ms_print \
              ${{targets.destdir}}/usr/bin/cg_merge \
              ${{targets.destdir}}/usr/bin/cg_annotate \
              ${{targets.destdir}}/usr/bin/cg_diff \
              ${{targets.destdir}}/usr/bin/callgrind_control \
              ${{targets.destdir}}/usr/bin/callgrind_annotate \
              ${{targets.subpkgdir}}/usr/bin
    description: valgrind perl+python cachegrind/callgrind script tools
    test:
      pipeline:
        - runs: |
            callgrind_control --version
            callgrind_control --help
            cg_annotate --version
            cg_annotate --help
            cg_diff --version
            cg_diff --help
            cg_merge --version
            cg_merge --help

update:
  enabled: true
  version-transform:
    - match: _
      replace: .
  git:
    strip-prefix: VALGRIND_
    tag-filter-prefix: VALGRIND_

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        valgrind --version
        vgdb --help
        valgrind --help
    - uses: test/tw/ldd-check
