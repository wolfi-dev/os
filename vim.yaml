package:
  name: vim
  dependencies:
    runtime:
      - glibc-iconv-common # calls iconv_open for non-UTF-8 charsets; glibc builds in only UTF-8/UCS/ASCII
  version: "9.2.1400"
  epoch: 0 # runtime-depend on glibc-iconv-common (F-217)
  description: "Improved vi-style text editor"
  copyright:
    - license: Vim
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - lua5.3-dev
      - ncurses-dev
      - python3-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/vim/vim
      tag: v${{package.version}}
      expected-commit: 358544f83b34742ef1eae02a1c0a4f891f51fb2c

  - runs: |
      # vim seems to manually set FORTIFY_SOURCE=1, and setting both breaks the build
      export CFLAGS=${CFLAGS/-Wp,-D_FORTIFY_SOURCE=3/}
      export CPPFLAGS="$CFLAGS"
      export CXXFLAGS="$CFLAGS"
      ./configure \
        --build=$CBUILD \
        --host=$CHOST \
        --prefix=/usr \
        --enable-luainterp \
        --enable-python3interp=dynamic \
        --without-x \
        --disable-nls \
        --enable-multibyte \
        --enable-gui=no \
        --with-lua-prefix=/usr/lua5.3 \
        --with-compiledby="Wolfi Linux"

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify vim installation
      runs: |
        vim --version | grep -Fi "VIM - Vi IMproved"
        xxd --version
    - name: Test vim text editing
      runs: |
        # Write text to a file using vim in ex mode
        echo "hello world" > /tmp/vim_test_input.txt
        vim -es /tmp/vim_test_input.txt <<'EOF'
        %s/hello/goodbye/g
        wq
        EOF
        grep -F "goodbye world" /tmp/vim_test_input.txt
    - name: Test vim ex mode commands
      runs: |
        # Use ex to append a line and verify
        cat > /tmp/ex_test.txt <<'EOF'
        line1
        line2
        EOF
        ex /tmp/ex_test.txt <<'EOF'
        $a
        line3
        .
        wq
        EOF
        grep -F "line3" /tmp/ex_test.txt
    - name: Test xxd hex dump and reverse
      runs: |
        echo "vim test" > /tmp/xxd_input.txt
        xxd /tmp/xxd_input.txt > /tmp/xxd_output.hex
        xxd -r /tmp/xxd_output.hex > /tmp/xxd_restored.txt
        diff /tmp/xxd_input.txt /tmp/xxd_restored.txt
    - name: Test vimdiff detects differences
      runs: |
        echo "line1" > /tmp/diff_a.txt
        echo "line2" > /tmp/diff_b.txt
        # Run vimdiff in batch mode and verify it exits cleanly
        vim -d -es /tmp/diff_a.txt /tmp/diff_b.txt -c "qa!"
    - name: "Write a file as Shift_JIS (glibc-iconv-common)"
      runs: |
        # Without glibc-iconv-common this conversion fails (glibc builds in only UTF-8, UCS-2/4 and ASCII).
        [ ! -e /usr/lib/gconv/gconv-modules.d/gconv-modules-extra.conf ] || { echo "FAIL: full glibc-iconv is in the test environment, so this test cannot catch a missing glibc-iconv-common dependency"; exit 1; }
        # The test tooling (help-check pulls man-db and groff) brings glibc-iconv-common into most test environments, so also check the dependency itself.
        apk info -R vim | grep -qx glibc-iconv-common || { echo "FAIL: vim does not runtime-depend on glibc-iconv-common"; exit 1; }
        printf '\xe6\x97\xa5\xe6\x9c\xac\n' > /tmp/ja.txt
        rm -f /tmp/o
        vim -u NONE -es --cmd 'set enc=utf-8' -c 'set fenc=sjis' -c 'w! /tmp/o' -c 'q!' /tmp/ja.txt
        out=$(od -An -tx1 /tmp/o | tr -d ' \n')
        case "$out" in 93fa967b*) ;; *) echo "FAIL: wrote $out"; exit 1 ;; esac

subpackages:
  - name: vim-doc
    description: vim docs
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: vim/vim
    strip-prefix: v
    use-tag: true
  schedule:
    period: daily
    reason: upstream project creates a tag for each commit to main
