package:
  name: vtable-dumper
  version: "1.2"
  epoch: 0
  description: Tool to list content of virtual tables in a C++ shared library
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - elfutils-dev
      - glibc-2.43-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/lvc/vtable-dumper
      tag: ${{package.version}}
      expected-commit: 0e04246516a2fd4cec79747cf515bc235610c76f

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

update:
  enabled: true
  github:
    identifier: lvc/vtable-dumper

test:
  environment:
    contents:
      packages:
        - build-base
  pipeline:
    - uses: test/tw/ldd-check
    - name: Dump the vtable of a C++ shared library
      runs: |
        cat > shape.cpp <<'EOF'
        class Shape {
        public:
            virtual double area() const = 0;
            virtual ~Shape() {}
        };
        class Circle : public Shape {
        public:
            double area() const override { return 3.14; }
        };
        Shape *make() { return new Circle(); }
        EOF
        g++ -shared -fPIC -o libshape.so shape.cpp
        # vtable-dumper dlopens the object, so pass a path (not a bare soname).
        vtable-dumper -mangled -demangled ./libshape.so > vtables.txt
        # The concrete class must have its vtable listed, with the mangled
        # symbol and the demangled virtual method it dispatches to.
        grep -qi "Vtable for Circle" vtables.txt
        grep -q "_ZTV6Circle" vtables.txt
        grep -q "Circle::area() const" vtables.txt
