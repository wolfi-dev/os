package:
  name: wadm
  version: "0.21.1"
  epoch: 19 # GHSA-c8m5-c952-6cm4
  description: "Wasm-native orchestrator for managing and scaling declarative wasmCloud applications"
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "10"
    memory: 11Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - glibc-2.44
      - glibc-2.44-dev
      - rust-1.99

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wasmCloud/wadm
      tag: v${{package.version}}
      expected-commit: 100f635d11667e9a3c913819dfecc4f3051e6da2

  - uses: bump
    with:
      deps: |-
        rustls@0.23.25=0.23.45
        ring@0.17.12
        tokio@1.52.3
        crossbeam-channel@0.5.15
        tracing-subscriber@0.3.20
        bytes@1.11.1
        time@0.3.47
        quinn-proto@0.11.15
        h2@0.3.26=0.3.27
        h2@0.4.12=0.4.15
        http@1.3.1=1.4.2
        hyper@1.7.0=1.10.1
        hyper-rustls@0.27.9
        hyper-util@0.1.20
        leb128-tokio@0.1.7
        libc@0.2.186
        mio@1.2.1
        reqwest@0.12.15=0.12.28
        tokio-io-timeout@1.2.1
        tokio-rustls@0.26.4
        tokio-stream@0.1.18
        tokio-util@0.7.18
        tower@0.5.2=0.5.3
        tryhard@0.5.2
        wasm-tokio@0.6.1
        rustls@0.23.46
      language: rust

  - name: Bump dependency for CVE remediation
    runs: |
      # GHSA-cq8v-f236-94qc: the Cargo.lock carries two rand copies (0.8.5
      # and 0.9.2); pin each to the patched release for its line (0.8.6 /
      # 0.9.3) so neither vulnerable copy survives the locked build.
      cargo update -p rand@0.8.5 --precise 0.8.6
      cargo update -p rand@0.9.2 --precise 0.9.3

  - uses: cargo/build
    with:
      output: wadm

  # Every other integration test starts a nats-server (and the e2e ones a wasmCloud host);
  # tests/validation.rs is the only service-free suite, and the binaries have no unit tests.
  # TODO(upstream-tests): widen once nats-server can be provided in the build environment.
  - uses: upstream-tests/cargo-test
    with:
      args: --test validation

  - uses: strip

update:
  enabled: true
  github:
    identifier: wasmCloud/wadm
    strip-prefix: v
    tag-filter-prefix: v

test:
  environment:
    contents:
      packages:
        - nats-server
        - wait-for-it
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: wadm
    - uses: test/tw/help-check
      with:
        bins: wadm
    - name: Start wadm daemon and verify it connects to NATS
      uses: test/daemon-check-output
      with:
        setup: |
          # Start NATS server with JetStream enabled; wadm requires JetStream
          nats-server -p 4222 -js > /tmp/nats-server.log 2>&1 &
          wait-for-it localhost:4222 --timeout=15
        start: wadm --nats-server nats://127.0.0.1:4222 --api-prefix wadm
        timeout: 30
        expected_output: "event: connected"
        error_strings: ""
