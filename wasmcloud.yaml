package:
  name: wasmcloud
  version: "2.5.2"
  epoch: 2
  description: "wasmCloud allows for simple, secure, distributed application development using WebAssembly components and capability providers."
  copyright:
    - license: Apache-2.0

vars:
  rust-version: "1.86"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - protobuf-dev
      # wash requires the wasm32-wasip2 target at build time; this target is
      # not available in the versioned rust-${{vars.rust-version}} APK, so we
      # use rustup to install the stable toolchain and add the target.
      # rust-${{vars.rust-version}} is declared in vars for version tracking.
      - rustup

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wasmCloud/wasmCloud
      tag: v${{package.version}}
      expected-commit: ec012da03cf649427d700eef4a0ba6d9731cee58

  - name: Install Rust toolchain
    runs: |
      # This build requires the wasm32-wasip2 target which is not available
      # in the versioned rust-${{vars.rust-version}} APK, so we use rustup.
      rustup install stable
      rustup target add wasm32-wasip2
      # The bump step below invokes cargo (via omnibump), but the
      # rustup-managed toolchain is not in the default PATH of later
      # pipeline steps. Expose cargo and rustc (needed by omnibump's
      # cargo check).
      for tool in cargo rustc; do
          ln -sf "$(rustup which $tool)" /usr/bin/$tool
      done

  - name: Drop Go workspace file
    runs: |
      # The bump pipeline runs 'go work use' whenever go.work exists, even
      # for Rust projects, and there is no Go toolchain in this build
      # environment. The file references upstream's Go components
      # (runtime-gateway, runtime-operator), which this package does not
      # build.
      rm -f go.work go.work.sum

  # opentelemetry-semantic-conventions 0.32 deprecates RPC_GRPC_STATUS_CODE
  # (used in wash-runtime), which the workspace-wide warnings = 'deny'
  # would turn into a compile error during the bump step's cargo check.
  - uses: sed
    with:
      path: Cargo.toml
      pattern: |-
        ^warnings = 'deny'
      replacement: |-
        warnings = 'warn'

  # Move the opentelemetry family beyond its "0.31" [workspace.dependencies]
  # SemVer constraint for GHSA-w9wp-h8wv-79jx.
  - uses: bump
    with:
      deps: |-
        opentelemetry@0.32
        opentelemetry_sdk@0.32.1
        tracing-opentelemetry@0.32

  - name: Configure and build
    runs: |
      # Put our rustup-installed toolchains into $PATH
      export PATH="$(dirname "$(rustup which cargo)"):$PATH"

      # cargo/build pipeline cannot be used here because it does not support
      # the toolchain installed via rustup; we replicate its behaviour
      # (cargo-auditable, --release, correct install path) manually.
      cargo auditable build --release --bin wash
      mkdir -p ${{targets.destdir}}/usr/bin/
      mv target/release/wash ${{targets.destdir}}/usr/bin/

  - uses: strip

update:
  enabled: true
  github:
    identifier: wasmCloud/wasmCloud
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: wash
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: wash
    - name: Test shell completions generation
      runs: |
        # Verify wash can generate shell completions (exercises CLI framework)
        wash completion bash | grep -F "wash"
        wash completion zsh | grep -F "wash"
