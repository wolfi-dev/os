package:
  name: wasmcloud
  version: "2.12.1"
  epoch: 0 # CVE-2026-115892
  description: "wasmCloud allows for simple, secure, distributed application development using WebAssembly components and capability providers."
  copyright:
    - license: Apache-2.0

vars:
  rust-version: "1.86"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - glibc-2.44-dev
      - protobuf-dev
      # wash requires the wasm32-wasip2 target at build time; this target is
      # not available in the versioned rust-${{vars.rust-version}} APK, so we
      # use rustup to install the stable toolchain and add the target.
      # rust-${{vars.rust-version}} is declared in vars for version tracking.
      - rustup

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wasmCloud/wasmCloud
      tag: v${{package.version}}
      expected-commit: 8b0e24cb6610642783e3f16f5f1eac45ff2cb5aa

  - name: Install Rust toolchain
    runs: |
      # This build requires the wasm32-wasip2 target which is not available
      # in the versioned rust-${{vars.rust-version}} APK, so we use rustup.
      rustup install stable
      rustup target add wasm32-wasip2
      for tool in cargo rustc; do
          ln -sf "$(rustup which $tool)" /usr/bin/$tool
      done

  - name: Drop Go workspace file
    runs: |
      rm -f go.work go.work.sum

  # CVE-2026-115892: upstream's Cargo.lock at v2.12.1 already locks
  # wasmtime/wasmtime-wasi 48.0.8 (fixed in 48.0.7). Keep the pin as a safeguard;
  # there is a single locked copy now, so no version qualifier is needed.
  # bump is not used because omnibump also tries to pin wasi-webgpu-wasmtime, a
  # git [patch] dependency ("revspec '0.3.1' not found").
  - name: Bump wasmtime
    runs: |
      cargo update -p wasmtime -p wasmtime-wasi --precise 48.0.8

  # GHSA-c8m5-c952-6cm4: upstream's Cargo.lock at v2.12.1 already locks rustls
  # 0.23.46. Keep the pin as a safeguard. bump is not used because omnibump
  # widens the wash crate's reqwest requirement to 0.13, which breaks wash-runtime.
  - name: Bump rustls
    runs: |
      cargo update -p rustls --precise 0.23.46

  # webpki-roots 1.0.11 drops the emSign roots (CVE-2026-111943). Both webpki-roots
  # copies in the lock (1.0.9 and the 0.26.11 shim) resolve through the 1.x one.
  - name: Bump webpki-roots
    runs: |
      cargo update -p 'webpki-roots@1' --precise 1.0.11

  - name: Configure and build
    runs: |
      # Put our rustup-installed toolchains into $PATH
      export PATH="$(dirname "$(rustup which cargo)"):$PATH"

      # cargo/build pipeline cannot be used here because it does not support
      # the toolchain installed via rustup; we replicate its behaviour
      # (cargo-auditable, --release, correct install path) manually.
      cargo auditable build --release --bin wash
      mkdir -p ${{targets.destdir}}/usr/bin/
      mv target/release/wash ${{targets.destdir}}/usr/bin/

  - uses: strip

update:
  enabled: true
  github:
    identifier: wasmCloud/wasmCloud
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: wash
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: wash
    - name: Test shell completions generation
      runs: |
        # Verify wash can generate shell completions (exercises CLI framework)
        wash completion bash | grep -F "wash"
        wash completion zsh | grep -F "wash"
