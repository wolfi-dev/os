package:
  name: wget
  version: 1.25.0
  epoch: 15 # CVE-2026-58469
  description: "GNU wget"
  copyright:
    - license: GPL-3.0
  cpe:
    vendor: gnu
    product: wget
  resources:
    cpu: "4"
    memory: 3Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - autoconf-archive
      - build-base
      - busybox
      - ca-certificates-bundle
      - flex
      # somehow openssl-config-fipshardened-3.4.0 fails on ARMv9 with gcc-15
      - gcc-14-default
      - gettext-dev
      - gperf
      - openssl-dev
      - pkgconf-dev
      - python3
      - texinfo
      - wget # circular dependency for fetching Gnulib translations

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.savannah.gnu.org/git/wget.git
      tag: v${{package.version}}
      expected-commit: abb989138731341e5cfd285d272b24afb60fd1a9
      cherry-picks: |
        master/37a40fcb450153f69537c7cbc2a7a4fb0b6f7826: CVE-2026-58469
        master/43d3ba9336bc94937e6fae2365c6ffd30c34ffcf: CVE-2026-58470
        master/c2640fe5171c59f87c58dc9fcb195b2d18b010ee: CVE-2026-58471
        master/dd692d9cea5335b181d877ae917fe6e75587a812: CVE-2026-58472
        master/4f85853f641863d5915786a8413e1a213726a62b: CVE-2026-15146

  - name: git.savannah.gnu.org is flaky
    runs: git submodule set-url gnulib https://github.com/coreutils/gnulib.git

  - uses: patch
    with:
      patches: |
        gettext-0.23.1.patch

  - runs: ./bootstrap

  - uses: autoconf/configure
    with:
      opts: |
        --without-libidn \
        --with-ssl=openssl \
        --disable-ntlm \
        --disable-nls

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: "wget-doc"
    description: "documentation for wget"
    pipeline:
      - uses: split/alldocs
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  git:
    tag-filter-prefix: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: wget
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: wget
    # Disabled until Cloudflare fixes its certificate chain to work with
    # current policies: https://blog.outv.im/2026/i-cannot-curl-example-com/
    #- name: "Test fetching a file using HTTPS"
    #  runs: |
    #    wget -O /dev/null https://example.org || exit 1
    - name: "Test fetching a file using HTTPS"
      runs: |
        wget -O /dev/null https://www.google.com || exit 1
