package:
  name: what-utils
  version: 2.1
  epoch: 6
  description: "Utilities for easily querying deb and apk packages on Ubuntu and Wolfi"
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - busybox
      - command-not-found
      - locate
      - posix-libc-utils
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dustinkirkland/what-utils
      tag: ${{package.version}}
      expected-commit: 0df6bd3c86d9cb411efd215242948e04d024eb87

  - runs: |
      for i in ./usr/bin/*; do
        install -m 755 -D $i "${{targets.destdir}}"/usr/bin/$(basename $i)
      done

update:
  enabled: true
  github:
    identifier: dustinkirkland/what-utils

test:
  pipeline:
    - name: Test how-many-binary counts packages
      runs: |
        count=$(how-many-binary)
        [ -n "$count" ] && [ "$count" -gt 0 ]
    - name: Test what-provides queries a known file
      runs: |
        what-provides /usr/bin/busybox | grep -Fi "busybox"
    - name: Test what-source queries a known package
      runs: |
        what-source busybox | grep -Fi "busybox"
