# source is git.zx2c4.com so we can't use github updates to get expected commit
# let's still auto create the PR, it will fail as expected commit will be wrong
# however it will be easy to fix
#nolint:git-checkout-must-use-github-updates
package:
  name: wireguard-tools
  version: "1.0.20260223"
  epoch: 1 # add tests
  description: "Next generation secure network tunnel: userspace tools"
  copyright:
    - license: GPL-2.0-only
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - iproute2
      - libmnl-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.zx2c4.com/wireguard-tools
      tag: v${{package.version}}
      expected-commit: 49ce333da02056ae7b22ee2aeb6afe8aaed79b19

  - uses: autoconf/make-install
    with:
      dir: src
      opts: |
        WITH_BASHCOMPLETION=no \
        WITH_WGQUICK=no \
        WITH_SYSTEMDUNITS=no

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/share/doc/${{package.name}}
      cp -rf contrib "${{targets.destdir}}"/usr/share/doc/${{package.name}}/

  - uses: strip

subpackages:
  - name: wireguard-tools-doc
    description: wireguard-tools docs
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 62381

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: wg
    - name: Test key generation
      runs: |
        # Generate a private key and verify it is non-empty base64
        privkey=$(wg genkey)
        [ -n "$privkey" ] || { echo "ERROR: genkey produced empty output"; exit 1; }
        echo "Private key: $privkey"

        # Derive a public key from the private key and verify it is non-empty
        pubkey=$(echo "$privkey" | wg pubkey)
        [ -n "$pubkey" ] || { echo "ERROR: pubkey produced empty output"; exit 1; }
        echo "Public key: $pubkey"

        # Verify private and public keys differ
        [ "$privkey" != "$pubkey" ] || { echo "ERROR: private and public keys are identical"; exit 1; }
    - name: Test pre-shared key generation
      runs: |
        # Generate a pre-shared key and verify it is non-empty base64
        psk=$(wg genpsk)
        [ -n "$psk" ] || { echo "ERROR: genpsk produced empty output"; exit 1; }
        echo "Pre-shared key: $psk"

        # Generate two PSKs and verify they differ (randomness check)
        psk2=$(wg genpsk)
        [ "$psk" != "$psk2" ] || { echo "ERROR: two genpsk calls produced identical keys"; exit 1; }
