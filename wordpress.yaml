package:
  name: wordpress
  version: "7.1.4"
  epoch: 0 # CVE-2026-111943
  description: "The Open Source Publishing Platform"
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - php

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - git

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wordpress/wordpress
      tag: ${{package.version}}
      expected-commit: db96f5eaa77a8d3e8eec8923a518fa2326f0d46a
      destination: "${{targets.destdir}}/usr/src/wordpress"

  - runs: |
      rm -rf "${{targets.destdir}}/usr/src/wordpress/.git"

subpackages:
  - name: ${{package.name}}-oci-entrypoint
    description: Entrypoint for configuring WordPress in OCI containers
    dependencies:
      runtime:
        - bash
        - busybox
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin/
          cp wp-config-docker.php "${{targets.destdir}}/usr/src/wordpress"
          cp docker-entrypoint.sh ${{targets.subpkgdir}}/usr/local/bin/
          chmod +x ${{targets.subpkgdir}}/usr/local/bin/docker-entrypoint.sh
    test:
      pipeline:
        - uses: test/tw/shell-syntax-check
          with:
            files: /usr/local/bin/docker-entrypoint.sh

test:
  environment:
    contents:
      packages:
        - wordpress-oci-entrypoint
        - php-fpm
        - shadow
    environment:
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wolfi
      WORDPRESS_DB_PASSWORD: wolfi
  pipeline:
    - uses: test/excluded-certificates
      with:
        files: /usr/src/wordpress/wp-includes/certificates/ca-bundle.crt
        excluded-spki-hashes: bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3|8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782|b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc|eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
        excluded-names: |
          AAA Certificate Services
          emSign ECC Root CA - G3
          emSign Root CA - C1
          emSign ECC Root CA - C3
    - name: Run Entrypoint Script
      runs: |
        useradd -U nonroot
        mkdir -p /var/www/html && cd /var/www/html || exit
        timeout 5s /usr/local/bin/docker-entrypoint.sh php-fpm
    - name: Check Configuration
      runs: |
        test -f /var/www/html/wp-config.php
        test "$WORDPRESS_DB_NAME" = "wordpress"
    - name: Check no .git directory
      runs: |
        test ! -d /usr/src/wordpress/.git

update:
  enabled: true
  github:
    identifier: wordpress/wordpress
    use-tag: true
