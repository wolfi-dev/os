package:
  name: xauth
  version: "1.1.5"
  epoch: 2
  description: X.Org authorization settings program
  copyright:
    - license: MIT-open-group

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - libx11-dev
      - libxau-dev
      - libxext-dev
      - libxmu-dev
      - pkgconf-dev
      - util-macros-dev
      - xtrans-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/xorg/app/xauth
      tag: xauth-${{package.version}}
      expected-commit: 6fe9365f11181a043f151f2e67f36015c278791d

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: xauth-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/emptypackage
    dependencies:
      runtime:
        - xauth
    description: xauth dev

  - name: xauth-doc
    pipeline:
      - uses: split/manpages
    description: xauth manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 5253

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: xauth
    - uses: test/tw/help-check
      with:
        bins: xauth
    - name: Functional test - add and list auth entries
      runs: |
        # Create an empty authority file first (xauth requires it to exist)
        touch /tmp/test.Xauthority
        # Add a MIT-MAGIC-COOKIE-1 entry for a display (no X server needed)
        xauth -f /tmp/test.Xauthority add localhost:99 MIT-MAGIC-COOKIE-1 deadbeefdeadbeefdeadbeefdeadbeef
        # List the entries to verify an entry for display 99 was created
        # (xauth normalizes the display name so grep for :99 not localhost:99)
        xauth -f /tmp/test.Xauthority list | grep -q ":99"
        # Verify the protocol name is recorded correctly
        xauth -f /tmp/test.Xauthority list | grep -q "MIT-MAGIC-COOKIE-1"
