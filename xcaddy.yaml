package:
  name: xcaddy
  version: "0.4.7"
  epoch: 2 # go: 1.26->1.27
  description: Build Caddy with plugins
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "2"
    memory: 6Gi

vars:
  go-version: "1.27"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e0e8f68a0f4bef11bfd04c4fb3091052ad36132f
      repository: https://github.com/caddyserver/xcaddy
      tag: v${{package.version}}

  - uses: go/build/v2
    with:
      output: xcaddy
      packages: ./cmd/xcaddy

  - uses: strip

update:
  enabled: true
  github:
    identifier: caddyserver/xcaddy
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - go
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        export GOPATH=/tmp
        export GOCACHE=/tmp
        xcaddy build \
          --with github.com/caddyserver/ntlm-transport
        ./caddy -v
        xcaddy version

environment:
  contents:
    packages:
      - go-${{vars.go-version}}
