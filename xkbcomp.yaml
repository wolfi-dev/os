package:
  name: xkbcomp
  version: "1.5.0"
  epoch: 3
  description: "XKB keyboard description compiler"
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 6Gi

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - libx11-dev
      - libxkbfile-dev
      - pkgconf-dev
      - util-macros-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/xorg/app/xkbcomp
      tag: xkbcomp-${{package.version}}
      expected-commit: 2c7789785981ad1fce3858c726615b49293f7de0

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: xkbcomp-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf

  - name: xkbcomp-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 15018

test:
  environment:
    contents:
      packages:
        - xkeyboard-config
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        # Compile a minimal XKB keyboard description to verify real functionality
        cat > /tmp/test.xkb <<'EOF'
        xkb_keymap {
            xkb_keycodes  { include "evdev+aliases(qwerty)" };
            xkb_types     { include "complete" };
            xkb_compat    { include "complete" };
            xkb_symbols   { include "pc+us" };
            xkb_geometry  { include "pc(pc105)" };
        };
        EOF
        xkbcomp /tmp/test.xkb /tmp/test.xkm
        test -f /tmp/test.xkm
