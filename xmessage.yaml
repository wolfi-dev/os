# Generated from https://git.alpinelinux.org/aports/plain/community/xmessage/APKBUILD
package:
  name: xmessage
  version: 1.0.7
  epoch: 9 # remove empty -dev subpackage
  description: Display a message or query in a window
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - libice-dev
      - libx11-dev
      - libxaw-dev
      - libxext-dev
      - libxmu-dev
      - libxpm-dev
      - pkgconf-dev
      - util-macros-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/xorg/app/xmessage
      tag: xmessage-${{package.version}}
      expected-commit: 3b4db0f96b58076b17d1ae20b4c6a38a522dca58

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  git:
    tag-filter-prefix: xmessage-
    strip-prefix: xmessage-

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/no-docs
    - name: functional test
      runs: |
        # xmessage requires an X display; verify it exits non-zero when no display is available
        if xmessage -display :99 "test" 2>/dev/null; then
          echo "ERROR: xmessage should have failed without a display"
          exit 1
        fi
        echo "PASS: xmessage correctly exits non-zero without a display"
