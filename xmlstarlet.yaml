package:
  name: xmlstarlet
  version: 1.6.1
  epoch: 11 # add ldd-check and functional XML tests
  description: A set of tools to transform, query, validate, and edit XML documents
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 7Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - docbook-xml
      - ghostscript
      - libxml2-dev
      - libxslt-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9a470e3db6a632a31d75ed2a6112407e05f92e8d
      repository: https://git.code.sf.net/p/xmlstar/code
      tag: ${{package.version}}

  - uses: patch
    with:
      patches: docbook-update.patch

  - uses: patch
    with:
      patches: 0001-Fix-build-with-libxml2-2.12.patch

  - uses: patch
    with:
      patches: no-attribute-unused.diff

  - runs: |
      autoreconf -sif
      LIBXSLT_PREFIX=/usr \
      LIBXML_PREFIX=/usr \
      ./configure \
          --prefix=/usr \
          --enable-build-docs

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      mkdir -p ${{targets.destdir}}/usr/share/licenses/xmlstarlet
      make DESTDIR="${{targets.destdir}}" install
      ln -s xml "${{targets.destdir}}"/usr/bin/xmlstarlet
      install -Dm0644 Copyright "${{targets.destdir}}"/usr/share/licenses/${{package.name}}/COPYING

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 5201

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: |
          xmlstarlet
          xml
    - uses: test/tw/help-check
      with:
        bins: |
          xml
          xmlstarlet
    - name: Test XML element selection
      runs: |
        cat > /tmp/test.xml << 'EOF'
        <root>
          <item id="1">hello</item>
          <item id="2">world</item>
        </root>
        EOF
        result=$(xml sel -t -v "//item[@id='1']" /tmp/test.xml)
        [ "$result" = "hello" ]
    - name: Test XML transformation
      runs: |
        cat > /tmp/input.xml << 'EOF'
        <books>
          <book><title>XML Guide</title></book>
        </books>
        EOF
        xml sel -t -m "//book" -v "title" -n /tmp/input.xml | grep -F "XML Guide"
    - name: Test XML validation
      runs: |
        cat > /tmp/valid.xml << 'EOF'
        <?xml version="1.0"?>
        <root><child>text</child></root>
        EOF
        xml val /tmp/valid.xml
    - name: Test XML editing
      runs: |
        cat > /tmp/edit.xml << 'EOF'
        <root><item>original</item></root>
        EOF
        xml ed -u "//item" -v "updated" /tmp/edit.xml | grep -F "updated"
    - name: Test XML formatting
      runs: |
        printf '<root><a>1</a><b>2</b></root>' | xml fo | grep -F "<a>"

subpackages:
  - name: xmlstarlet-doc
    description: xmlstarlet documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs
