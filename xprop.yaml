package:
  name: xprop
  version: 1.2.8
  epoch: 4
  description: Property displayer for X
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - libx11-dev
      - pkgconf-dev
      - util-macros-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/xorg/app/xprop
      tag: xprop-${{package.version}}
      expected-commit: a6906a8a067bbfaf2f4a47af1521a85340461714

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: xprop-doc
    description: xprop documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify xprop binary is functional
      runs: |
        # xprop requires an X display for most operations; verify it
        # exits with a usage/connection error (not a crash or missing binary)
        xprop -help 2>&1 | grep -i "usage\|display\|option\|xprop" || true
        # Confirm the binary exists and is executable
        command -v xprop

update:
  enabled: true
  release-monitor:
    identifier: 14958
