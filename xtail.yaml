# Based loosely on how arch has this packaged here:
# https://aur.archlinux.org/cgit/aur.git/tree/PKGBUILD?h=xtail
package:
  name: xtail
  version: "2.1.12"
  epoch: 3
  description: Like "tail -f", but works on truncated files, directories, more
  copyright:
    - license: BSD-3-Clause
    - license: Unlicense
  resources:
    cpu: "1"
    memory: 2Gi

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+.\d+)\.(\d+)$
    replace: $1-$2
    to: mangled-package-version

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - patch

pipeline:
  - uses: git-checkout
    with:
      repository: https://salsa.debian.org/debian/xtail.git
      tag: debian/${{vars.mangled-package-version}}
      expected-commit: c1998b9c203a8e2ebe29c2dc684414accc00f9fb

  # Apply a handful of upstream patches to quiet warnings in the toolchain.
  - runs: |
      _patchdir="./debian/patches"
      while IFS= read -r _file; do
        patch --directory=. --forward --strip=1 --input="$_patchdir/$_file"
      done <"$_patchdir/series"

  - runs: autoreconf -fi

  - uses: autoconf/configure
    with:
      opts: |
        --prefix=${{targets.destdir}}/usr \
        --mandir=${{targets.destdir}}/usr/share/man

  - uses: autoconf/make

  - runs: |
      # create dir structure expected by make-install
      mkdir -p "${{targets.destdir}}"/usr/bin/
      mkdir -p "${{targets.destdir}}"/usr/share/man/man1

  - uses: autoconf/make-install

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/share/doc/
      install -m644 "README" "${{targets.destdir}}"/usr/share/doc/

  - uses: strip

subpackages:
  - name: xtail-doc
    description: xtail manpages
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify xtail tails a file
      runs: |
        # Create a test file with initial content
        echo "line1" > /tmp/xtail-test.log
        # Run xtail in background, capturing output
        xtail /tmp/xtail-test.log > /tmp/xtail-out.txt 2>&1 &
        XTAIL_PID=$!
        sleep 1
        # Append a new line to the file
        echo "line2" >> /tmp/xtail-test.log
        sleep 1
        kill $XTAIL_PID 2>/dev/null || true
        # Verify xtail captured the new line
        grep -q "line2" /tmp/xtail-out.txt || { echo "ERROR: xtail did not output new line"; cat /tmp/xtail-out.txt; exit 1; }
        echo "xtail file tail test passed"
    - name: Verify xtail watches a directory
      runs: |
        # Create a test directory and a file in it
        mkdir -p /tmp/xtail-testdir
        echo "initial" > /tmp/xtail-testdir/a.log
        # Run xtail on the directory in background
        xtail /tmp/xtail-testdir > /tmp/xtail-dir-out.txt 2>&1 &
        XTAIL_PID=$!
        sleep 1
        # Append content to the watched file
        echo "appended" >> /tmp/xtail-testdir/a.log
        sleep 1
        kill $XTAIL_PID 2>/dev/null || true
        # Verify xtail captured the appended content
        grep -q "appended" /tmp/xtail-dir-out.txt || { echo "ERROR: xtail did not output appended content"; cat /tmp/xtail-dir-out.txt; exit 1; }
        echo "xtail directory watch test passed"

update:
  enabled: true
  git:
    strip-prefix: debian/
  ignore-regex-patterns:
    - ^upstream/.*
  # The upstream version is 2.1.11, but the Debian version is 2.1-11.
  # We need to transform the version to match the Debian version.: debian/
  version-transform:
    - match: ^(\d+.\d+)\-(\d+)$
      replace: ${1}.${2}
