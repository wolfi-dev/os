# Generated from https://git.alpinelinux.org/aports/plain/main/yaml/APKBUILD
package:
  name: yaml
  version: "0.2.7"
  epoch: 1 # pin yaml-dev to the matching yaml
  description: YAML 1.1 parser and emitter written in C
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 6Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libtool

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/yaml/libyaml
      expected-commit: 1ebd83d894d4fc476a23977e85a2164c28aadf6b
      tag: ${{package.version}}

  - runs: |
      ./bootstrap

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: upstream-tests/make-check

  - uses: strip

subpackages:
  - name: yaml-static
    pipeline:
      - uses: split/static
    description: yaml static
    test:
      pipeline:
        - uses: test/tw/staticpackage

  - name: yaml-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    description: yaml dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Soname is libyaml-0.so.2
      runs: |
        test -e /usr/lib/libyaml-0.so.2

update:
  enabled: true
  github:
    identifier: yaml/libyaml
