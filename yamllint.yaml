package:
  name: yamllint
  version: "1.38.0"
  epoch: 3 # upstream-tests/pytest
  description: "A linter for YAML"
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-pathspec
      - py${{vars.python-version}}-pyyaml
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  python-version: 3.13

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py${{vars.python-version}}-build-base
      - py3.13-pathspec # upstream-tests: runtime dependency
      - py3.13-pytest # upstream-tests: test runner
      - py3.13-pytest-timeout # upstream-tests: per-test timeout
      - py3.13-pyyaml # upstream-tests: runtime dependency
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/adrienverge/yamllint
      tag: v${{package.version}}
      expected-commit: cba56bcde1fdd01c1deb3f945e69764c291a6530

  - uses: py/pip-build-install

  - uses: upstream-tests/pytest

  - uses: strip

update:
  enabled: true
  github:
    identifier: adrienverge/yamllint
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: yamllint
    - runs: |
        yamllint --list-files /usr/lib/python*/site-packages/yamllint/conf/*.yaml
        yamllint /usr/lib/python*/site-packages/yamllint/conf/*.yaml

        # Verify yamllint exits non-zero on invalid YAML
        printf 'key: [unclosed\n' > /tmp/invalid.yaml
        if yamllint /tmp/invalid.yaml 2>&1; then
          echo "ERROR: yamllint should have rejected invalid YAML"
          exit 1
        fi
    - uses: test/tw/help-check
      with:
        bins: yamllint
