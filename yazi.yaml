package:
  name: yazi
  version: "26.8.15"
  epoch: 0 # russh bump
  description: Blazing fast terminal file manager written in Rust, based on async I/O.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - file
  resources:
    cpu: "9"
    memory: 15Gi

vars:
  rust-version: "1.95"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - glibc-2.43-dev
      - rust-${{vars.rust-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sxyazi/yazi
      tag: v${{package.version}}
      expected-commit: 1f3588d6f4ef80122089db70e670a0eb757f20fe

  - uses: patch
    with:
      patches: CVE-2026-46702.patch

  - uses: bump
    with:
      update: true
      deps: |-
        cmov@0.5.4
        serde_with@3.22.0
        russh@0.62.6

  - runs: |
      cargo auditable build --release

      install -Dm755 ./target/release/yazi "${{targets.destdir}}"/usr/bin/yazi

  - uses: strip

update:
  enabled: true
  github:
    identifier: sxyazi/yazi
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: yazi
    - uses: test/tw/help-check
      with:
        bins: yazi
