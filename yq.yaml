package:
  name: yq
  version: "4.54.3"
  epoch: 1 # toolchain rebuild for  go-1.27-1.27.4
  description: "yq is a portable command-line YAML, JSON, XML, CSV and properties processor"
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  go-version: "1.27"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mikefarah/yq
      tag: v${{package.version}}
      expected-commit: f2944b823f84906a127dbd29e4c2a3e60c4e550e

  # Remove once upstream ships x/net >= v0.60.0 in a release:
  # https://github.com/mikefarah/yq/pull/2911
  - uses: bump
    with:
      deps: golang.org/x/net@v0.61.0
      language: go

  # TestJSONScenarios compares the error text for invalid JSON, which Go 1.27's
  # encoding/json words differently from what upstream expects (pkg/yqlib/json_test.go:175).
  # Update the expected text in the test instead of skipping the test.
  # TODO: drop this patch once upstream updates the expected error message.
  - uses: patch
    with:
      patches: json-test-error-message.patch

  - uses: go/build/v2
    with:
      packages: .
      output: yq

  - uses: upstream-tests/go-test

  - runs: |
      ${{targets.destdir}}/usr/bin/yq --version | grep "version v${{package.version}}"

update:
  enabled: true
  github:
    identifier: mikefarah/yq
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: yq
    - name: Test yq eval command
      runs: |
        # Test setting a key-value pair in YAML
        result=$(yq eval --null-input --no-colors '.key = "cat"')
        [ "$result" = "key: cat" ]
    - uses: test/tw/help-check
      with:
        bins: yq
    - name: Test yq eval with pipe input
      runs: |
        # Test extracting a key value from YAML
        result=$(echo "key: cat" | yq eval ".key" -)
        [ "$result" = "cat" ]

environment:
  contents:
    packages:
      - go-${{vars.go-version}}
