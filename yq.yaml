package:
  name: yq
  version: "4.53.3"
  epoch: 4 # migrate to go/build/v2
  description: "yq is a portable command-line YAML, JSON, XML, CSV and properties processor"
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  go-version: "1.26"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mikefarah/yq
      tag: v${{package.version}}
      expected-commit: 1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d

  - uses: bump
    with:
      deps: golang.org/x/text@v0.39.0

  - uses: go/build/v2
    with:
      packages: .
      output: yq

  - runs: |
      ${{targets.destdir}}/usr/bin/yq --version | grep "version v${{package.version}}"

update:
  enabled: true
  github:
    identifier: mikefarah/yq
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: yq
    - name: Test yq eval command
      runs: |
        # Test setting a key-value pair in YAML
        result=$(yq eval --null-input --no-colors '.key = "cat"')
        [ "$result" = "key: cat" ]
    - uses: test/tw/help-check
      with:
        bins: yq
    - name: Test yq eval with pipe input
      runs: |
        # Test extracting a key value from YAML
        result=$(echo "key: cat" | yq eval ".key" -)
        [ "$result" = "cat" ]

environment:
  contents:
    packages:
      - go-${{vars.go-version}}
