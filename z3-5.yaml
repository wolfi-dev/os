package:
  name: z3-5
  version: "5.3.3"
  epoch: 0
  description: Z3 theorem prover from Microsoft Research
  copyright:
    - license: MIT
  resources:
    cpu: "8"
    memory: 16Gi
  dependencies:
    provides:
      - z3=${{package.full-version}}
  test-resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-2.44-dev
      - python3
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Z3Prover/z3
      tag: z3-${{package.version}}
      expected-commit: 430d19e697e2ec9bad79ff210d41b4a7a5fcfa3e

  # The git hash and describe options would append the build checkout's
  # hash to `z3 --version`; the release number alone identifies the source.
  - uses: cmake/configure
    with:
      opts: |
        -DZ3_BUILD_LIBZ3_SHARED=ON \
        -DZ3_BUILD_EXECUTABLE=ON \
        -DZ3_BUILD_TEST_EXECUTABLES=OFF \
        -DZ3_BUILD_PYTHON_BINDINGS=OFF \
        -DZ3_ENABLE_EXAMPLE_TARGETS=OFF \
        -DZ3_INCLUDE_GIT_HASH=OFF \
        -DZ3_INCLUDE_GIT_DESCRIBE=OFF

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} headers and CMake/pkg-config files
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
      provides:
        - z3-dev=${{package.full-version}}
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: Z3Prover/z3
    use-tag: true
    tag-filter-prefix: z3-5.
    strip-prefix: z3-

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: version
      runs: |
        z3 --version | grep -Fx "Z3 version ${{package.version}} - 64 bit"
    - name: decide a satisfiable and an unsatisfiable problem
      runs: |
        cat > sat.smt2 <<'EOF'
        (declare-const x Int)
        (declare-const y Int)
        (assert (and (> x 2) (< y 10) (= (+ x (* 2 y)) 7)))
        (check-sat)
        EOF
        z3 sat.smt2 | grep -Fx sat
        cat > unsat.smt2 <<'EOF'
        (declare-const x Int)
        (assert (and (> x 2) (< x 1)))
        (check-sat)
        EOF
        z3 unsat.smt2 | grep -Fx unsat
