package:
  name: zbar
  version: "0.23.95"
  epoch: 0 # drop Qt support
  description: "ZBar barcode reader library"
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - docbook-xml
      - gettext-dev
      - glib-gir
      - glibc-2.44-dev
      - gobject-introspection-dev
      - gtk-3-dev
      - imagemagick-7
      - imagemagick-7-dev
      - lcms2-dev
      - libtool
      - libx11-dev
      - libxv-dev
      - meson
      - openjdk-17-default-jdk
      - pkgconf-dev
      - py3-supported-gobject3
      - python3-dev
      - xmlto
  environment:
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mchehab/zbar
      expected-commit: dc19fcc7da58e8cf84ba1ec417e24b04609feb23
      tag: ${{package.version}}

  - runs: |
      meson setup output \
        -Dpython=auto \
        -Dgtk=auto \
        -Dgir=true \
        -Dqt=false \
        --prefix=/usr \
        --libdir=lib

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: dev library for ${{package.name}} including Python bindings
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}-dev
            - python3
            - py3-pillow
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/tw/ldd-check
        - name: Test Python bindings
          runs: |
            # Basic test for zbar module loading and functionality
            python3 -c "import zbar; scanner = zbar.ImageScanner(); scanner.parse_config('enable'); print(f'ZBar version: {zbar.version()}'); print('Basic Python zbar bindings test passed!')"

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share
          mv "${{targets.destdir}}"/usr/share/doc "${{targets.subpkgdir}}"/usr/share/
    description: ${{package.name}} doc
    test:
      pipeline:
        - uses: test/tw/docs

  - name: "zbar-tools"
    description: "zbar tools"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr
          mv "${{targets.destdir}}"/usr/bin "${{targets.subpkgdir}}"/usr/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: |
              zbarimg
              zbarcam
        - uses: test/tw/ver-check
          with:
            bins: zbarimg
            version: ${{package.version}}

update:
  enabled: true
  github:
    identifier: mchehab/zbar
    use-tag: true
    tag-filter: "0."

test:
  environment:
    contents:
      packages:
        - ${{package.name}}
        - ${{package.name}}-dev
        - ${{package.name}}-tools
        - curl
        - imagemagick-7
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test binaries
      runs: |
        test -x /usr/bin/zbarimg
        test -x /usr/bin/zbarcam
        test -x /usr/bin/zbarcam-gtk
    - name: Test Qt is not built
      runs: |
        test ! -e /usr/bin/zbarcam-qt
    - uses: test/tw/help-check
      with:
        bins: |
          zbarcam
          zbarimg
    - name: Test functionality
      runs: |
        curl -s "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=Test" -o /tmp/test-qr.png
        zbarimg /tmp/test-qr.png 2>&1 | grep -q "scanned 1 barcode symbols from 1 images"
