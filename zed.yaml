package:
  name: zed
  version: "1.24.4"
  epoch: 1 # CVE-2026-115892
  description: Zed is a high-performance, multiplayer code editor from the creators of Atom and Tree-sitter.
  copyright:
    - license: GPL-3.0-only
  resources:
    # https://go/wolfi-rsc/zed
    cpu: 30
    memory: 80Gi

vars:
  llvm-version: 23
  openssl-version: "4.0"
  rust-version: "1.99"

environment:
  contents:
    packages:
      - alsa-lib-dev
      - apk-tools
      - build-base
      - busybox
      - cargo-auditable
      - clang-${{vars.llvm-version}}
      - cmake
      - curl-dev
      - fontconfig-dev
      - freetype-dev
      - glib-dev
      - glibc-2.44-dev
      - libgit2-dev
      - libxcb-dev
      - libxkbcommon-dev
      - lld-${{vars.llvm-version}}
      - mimalloc2-dev
      - mold
      - openssl-hardened-${{vars.openssl-version}}-dev
      - protoc
      - rust-${{vars.rust-version}}
      - sqlite-dev
      - vulkan-loader
      - wayland-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/zed-industries/zed
      tag: v${{package.version}}
      expected-commit: aed37547d8543000494fb69101c05daec5891068

  - uses: bump
    with:
      deps: |-
        rsa@0.9.10
        serde_with@3.23.0
        darling@0.24.1
        aws-smithy-types@1.4.9
        aws-smithy-runtime-api@1.12.3
        aws-smithy-json@0.62.7
        tracing-core@0.1.36
        tracing@0.1.44
        xxhash-rust@0.8.16
        wasmtime@48.0.7
      language: rust

  # rustls 0.23.46: GHSA-c8m5-c952-6cm4, GHSA-vp88-798v-h67f, GHSA-h2v8-394m-p7vv,
  # GHSA-w44r-93j7-qv28. omnibump can't plan the rustls bump here (it looks up
  # the git-sourced livekit-api on crates.io), so use cargo update --precise
  # directly instead.
  # aws-lc-rs is pinned here too: omnibump tries to bump the git-sourced
  # livekit-api (as a parent of aws-lc-rs) to a nonexistent git rev and fails.
  # This raises aws-lc-rs to 1.18.2 and aws-lc-sys to 0.46.0.
  # quinn-proto is updated here for the same reason: it is only reached through
  # quinn -> zed-reqwest / livekit, which are git-sourced.
  - runs: |
      cargo update -p rustls --precise 0.23.46
      cargo update -p aws-lc-rs --precise 1.18.2
      # quinn-proto 0.11.18: GHSA-465w-v9q3-7j98, GHSA-3g6h-r5qx-f6hq, GHSA-ppcp-v39w-8jq2
      cargo update -p quinn-proto --precise 0.11.18

  - runs: |
      cargo fetch --locked

      cargo auditable build --frozen --release -p zed
      cargo auditable build --frozen --release -p cli

      install -Dm755 target/release/zed "${{targets.destdir}}"/usr/libexec/zed
      install -Dm755 target/release/cli "${{targets.destdir}}"/usr/bin/zed

      install -Dm644 crates/zed/resources/zed.desktop.in "${{targets.destdir}}"/usr/share/applications/zed.desktop
      install -Dm644 crates/zed/resources/app-icon.png "${{targets.destdir}}"/usr/share/icons/hicolor/512x512/apps/zed.png
      install -Dm644 crates/zed/resources/app-icon@2x.png "${{targets.destdir}}"/usr/share/icons/hicolor/1024x1024/apps/zed.png

  - uses: strip

update:
  enabled: true
  github:
    identifier: zed-industries/zed
    strip-prefix: v

test:
  environment:
    environment:
      # Running Zed as root or via sudo is unsupported.
      # If you wish to proceed anyways, set `ZED_ALLOW_ROOT=true` in your environment.
      # It is untested and not recommended, don't complain when things break.
      # Doing so (even once) may subtly break things for all subsequent non-root usage of Zed.
      # This is okay in our case since we're running a one-off test
      ZED_ALLOW_ROOT: "true"
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: zed
    - uses: test/tw/ldd-check
