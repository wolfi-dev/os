package:
  name: zfp
  version: 1.0.1
  epoch: 8 # shared library naming: split libzfp${{vars.soversion}}
  description: zfp is a compressed format for representing multidimensional floating-point and integer arrays.
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "1"
    memory: 4Gi
  dependencies:
    runtime:
      - libzfp${{vars.soversion}}=${{package.full-version}}

vars:
  soversion: "1"

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - glibc-2.44-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/LLNL/zfp
      tag: ${{package.version}}
      expected-commit: f40868a6a1c190c802e7d8b5987064f044bf7812

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - name: Adding tests to package
    runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      cp -a output/bin/testzfp ${{targets.destdir}}/usr/bin/testzfp
      cp -a output/bin/testviews ${{targets.destdir}}/usr/bin/testviews

  - uses: upstream-tests/ctest

  - uses: strip

subpackages:
  - name: libzfp${{vars.soversion}}
    description: "libzfp shared library"
    pipeline:
      - uses: split/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/soversion-check

  - name: ${{package.name}}-dev
    description: Development files for ${{package.name}}
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libzfp${{vars.soversion}}=${{package.full-version}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: LLNL/zfp

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Running tests provided by zfp
      runs: |
        testzfp || exit 1
        testviews || exit 1
