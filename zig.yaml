package:
  name: zig
  version: "0.17.0"
  epoch: 0 # go/wolfi-rsc/zig
  description: "General-purpose programming language designed for robustness, optimality, and maintainability"
  copyright:
    - license: MIT
  resources:
    cpu: "4"
    memory: 14Gi
  test-resources:
    cpu: "1"
    memory: 2Gi
  annotations:
    toolchain-stream-reconcile-optout: true

vars:
  llvm-version: "22"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - clang-${{vars.llvm-version}}
      - cmake
      - glibc-2.44
      - glibc-2.44-dev
      - libstdc++
      - libxml2-dev
      - llvm-${{vars.llvm-version}}
      - llvm-${{vars.llvm-version}}-dev
      - llvm-lld-${{vars.llvm-version}}
      - llvm-lld-${{vars.llvm-version}}-dev
      - llvm-lld-${{vars.llvm-version}}-static
      - samurai
      - wolfi-base
      - zlib-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://codeberg.org/ziglang/zig
      tag: ${{package.version}}
      expected-commit: 7647adab80dd088f4de3610fd245915a912eb6ad

  # zig classifies GNU ld script GROUP() members by file-name extension, so it
  # rejects glibc-dev's version-pinned libc.so-<ver> with "unrecognized
  # extension", breaking the langref doctests that link with -lc. GNU ld and
  # lld both classify by content instead; make zig do the same.
  - uses: patch
    with:
      patches: classify-ld-script-members-by-content.patch

  - runs: |
      CC=clang CXX=clang LD=llvm-lld cmake -B build -G Ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_PREFIX_PATH=/usr \
        -DCMAKE_VERBOSE_MAKEFILE=ON \
        -DCMAKE_EXE_LINKER_FLAGS="-Wl,--copy-dt-needed-entries" \
        -DZIG_VERSION="${{package.version}}" \
        -DZIG_SHARED_LLVM=ON \
        -DZIG_TARGET_MCPU=baseline

      # Limit builds to one core because it uses a lot of memory
      cmake --build build -j$(nproc)

      # Workaround for missing zig binary in the build dir.
      DESTDIR="build/.dest" cmake --install build

      (cd build/.dest/usr/bin && ./zig build docs)

      DESTDIR="${{targets.destdir}}" cmake --install build

  - uses: strip

update:
  enabled: true
  git: {}

test:
  environment:
    contents:
      packages:
        - clang-${{vars.llvm-version}}
        - llvm-${{vars.llvm-version}}-dev
        - libstdc++
    environment:
      CC: clang
  pipeline:
    - uses: git-checkout
      with:
        repository: https://codeberg.org/ziglang/zig
        tag: ${{package.version}}
        expected-commit: 7647adab80dd088f4de3610fd245915a912eb6ad
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: zig
    - uses: test/tw/ver-check
      with:
        bins: zig
    - runs: |
        # excluding c_import tests for now
        for file in *.zig; do [ "$file" != "c_import.zig" ] && zig test "$file"; done
