package:
  name: zram-generator
  version: "1.2.1"
  epoch: 1
  description: Systemd generator for zram-backed swap devices
  copyright:
    - license: MIT

vars:
  rust-version: "1.86"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cargo-auditable
      - pkgconf
      - rust-${{vars.rust-version}}
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/systemd/zram-generator
      tag: v${{package.version}}
      expected-commit: c2685d18e596c5843b7d9027f6b8379168d753dc

  - name: Build
    runs: |
      export SYSTEMD_UTIL_DIR="$(pkg-config --variable=systemdutildir systemd)"
      export SYSTEMD_SYSTEM_GENERATOR_DIR="$(pkg-config --variable=systemdsystemgeneratordir systemd)"
      cargo auditable build --release
      # Process the .service.in template to produce the .service file
      sed "s|@SYSTEMD_SYSTEM_GENERATOR_DIR@|${SYSTEMD_SYSTEM_GENERATOR_DIR}|g" \
        units/systemd-zram-setup@.service.in \
        > units/systemd-zram-setup@.service

  - name: Install
    runs: |
      install -Dm755 target/release/zram-generator \
        "${{targets.destdir}}"/usr/lib/systemd/system-generators/zram-generator
      install -Dm644 units/systemd-zram-setup@.service \
        "${{targets.destdir}}"/usr/lib/systemd/system/systemd-zram-setup@.service

  - uses: strip

update:
  enabled: true
  github:
    identifier: systemd/zram-generator
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify binary exists and is executable
      runs: |
        test -x /usr/lib/systemd/system-generators/zram-generator
    - name: Check version output
      runs: |
        ver=$(/usr/lib/systemd/system-generators/zram-generator --version 2>&1)
        echo "$ver" | grep -E "[0-9]+\.[0-9]+"
    - name: Verify systemd unit file is installed
      runs: |
        test -f /usr/lib/systemd/system/systemd-zram-setup@.service
    - name: Verify no un-substituted placeholders in installed unit
      runs: |
        if grep -E '@[A-Z_]+@' /usr/lib/systemd/system/systemd-zram-setup@.service; then
          echo "un-substituted placeholder found in installed unit" >&2
          exit 1
        fi
    - name: Run generator without config (should exit cleanly with no devices)
      runs: |
        mkdir -p /tmp/zram-gen-test/normal /tmp/zram-gen-test/early /tmp/zram-gen-test/late
        /usr/lib/systemd/system-generators/zram-generator \
          /tmp/zram-gen-test/normal \
          /tmp/zram-gen-test/early \
          /tmp/zram-gen-test/late
    - name: Verify help output
      runs: |
        help=$(/usr/lib/systemd/system-generators/zram-generator --help 2>&1)
        echo "$help" | grep -F "zram"
